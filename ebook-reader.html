solid #b8cce3;\n  border-radius: 8px;\n\n  font-weight: 600;\n  cursor: pointer;\n}\n\n.toc-fold-toolbar {\n  position: relative;\n  top: auto;\n  z-index: 1;\n\n  background: #f8fbff;\n  border-bottom: 1px solid #dbe5f0;\n}\n\n.toc-fold-children {\n  margin-left: 16px;\n  padding-left: 12px;\n}\n  \n</style>\n</head>\n\n<body>\n\n<header>\n<h1>글로벌 AI 허브 전자책 열람실</h1>\n\n<p>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</p>\n</header>\n\n<main>\n\n<section class=\"panel\">\n\n<a class=\"button-link\" href=\"library.html\">\n← 지식자료실\n</a>\n\n<h2 id=\"bookTitle\">\n전자책 정보를 확인하는 중입니다.\n</h2>\n\n<div\n  id=\"status\"\n  class=\"status\"\n  role=\"status\"\n  aria-live=\"polite\"\n>\n회원 인증을 확인하는 중입니다.\n</div>\n\n</section>\n\n<section id=\"reader\" class=\"panel reader\" hidden>\n\n<div class=\"controls\">\n\n<button id=\"tocButton\" type=\"button\">\n☰ 목차 보기\n</button>\n\n</div>\n\n<div id=\"tocPanel\" hidden>\n<h3>전자책 목차</h3>\n<div id=\"tocContent\"></div>\n</div>\n\n<div class=\"controls\">\n\n<button id=\"zoomOutButton\" type=\"button\">\n축소 −\n</button>\n\n<button id=\"zoomResetButton\" type=\"button\">\n100%\n</button>\n\n<button id=\"zoomInButton\" type=\"button\">\n확대 +\n</button>\n\n<button id=\"fitButton\" type=\"button\">\n화면 맞춤\n</button>\n\n</div>\n\n<p style=\"font-size:13px;color:#68788c;\">\n이미지 왼쪽 클릭: 이전 페이지 /\n오른쪽 클릭: 다음 페이지 /\nCtrl + 마우스 휠: 확대·축소\n</p>\n\n<div\n  id=\"pageViewport\"\n  class=\"page-container\"\n  style=\"overflow:auto;max-height:85vh;cursor:pointer;\"\n>\n\n<img\n  id=\"pageImage\"\n  alt=\"전자책 페이지\"\n  referrerpolicy=\"no-referrer\"\n  draggable=\"false\"\n>\n\n</div>\n\n<div class=\"controls\">\n\n<button id=\"firstButton\" type=\"button\">\n처음\n</button>\n\n<button id=\"back50Button\" type=\"button\">\n-50쪽\n</button>\n\n<button id=\"back10Button\" type=\"button\">\n-10쪽\n</button>\n\n<button id=\"prevButton\" type=\"button\" disabled>\n이전\n</button>\n\n<span id=\"pageInfo\" class=\"page-info\">\n1 / 1\n</span>\n\n<button id=\"nextButton\" type=\"button\" disabled>\n다음\n</button>\n\n<button id=\"forward10Button\" type=\"button\">\n+10쪽\n</button>\n\n<button id=\"forward50Button\" type=\"button\">\n+50쪽\n</button>\n\n<button id=\"lastButton\" type=\"button\">\n마지막\n</button>\n\n</div>\n\n<div class=\"controls\">\n\n<label for=\"pageInput\">\n페이지 이동\n</label>\n\n<input\n  id=\"pageInput\"\n  type=\"number\"\n  min=\"0\"\n  step=\"1\"\n  value=\"1\"\n  style=\"\n    width:100px;\n    padding:10px;\n    border:1px solid #c5d5e8;\n    border-radius:7px;\n    text-align:center;\n  \"\n>\n\n<button id=\"jumpButton\" type=\"button\">\n이동\n</button>\n\n</div>\n\n<div style=\"margin-top:25px;\">\n\n<input\n  id=\"pageSlider\"\n  type=\"range\"\n  min=\"0\"\n  max=\"232\"\n  value=\"1\"\n  aria-label=\"전자책 페이지 이동\"\n  style=\"width:100%;\"\n>\n\n<div\n  style=\"\n    display:flex;\n    justify-content:space-between;\n    color:#68788c;\n  \"\n>\n\n<span>표지</span>\n<span id=\"sliderMax\">232쪽</span>\n\n</div>\n\n</div>\n\n</section>\n</main>\n\n<footer>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient } from\n\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n// ==========================================\n// 1. Supabase 연결\n// ==========================================\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\nconst $ = id =>\n  document.getElementById(id);\n\n// ==========================================\n// 2. 전자책 자료\n// ==========================================\n\nconst params =\n  new URLSearchParams(window.location.search);\n\nconst documentId =\n  Number(params.get(\"document_id\"));\n\nconst BOOKS = {\n\n  9: {\n    title:\n      \"글로벌 AI 허브 고양특례시 유치 종합 전략 및 실행 안내서\",\n    pages: 232\n  },\n\n  10: {\n    title:\n      \"글로벌 AI 허브 업무 지원 종합계획서\",\n    pages: 590\n  }\n\n};\n\nconst EBOOK_COVERS = {\n\n  9: \"/ebooks/assets/ebook-covers/issue-01.webp\",\n\n  10: \"/ebooks/assets/ebook-covers/issue-02.webp\"\n\n};\n\nlet book = BOOKS[documentId];\nlet canReadBody = false;\n\nasync function loadTotalEbook() {\n  const { data, error } = await supabase.rpc(\"get_total_ebook_info\", {\n    p_document_id: documentId\n  });\n  if (error) throw error;\n\n  const info = Array.isArray(data) ? data[0] : data;\n  const pages = Number(info?.total_pages);\n  if (Number(info?.document_id) !== documentId ||\n      typeof info?.title !== \"string\" || !info.title.trim() ||\n      !Number.isSafeInteger(pages) || pages < 1) {\n    throw new Error(\"전자책 정보 또는 페이지 수를 확인할 수 없습니다.\");\n  }\n\n  return {\n    title: info.title,\n    pages,\n    contents: info.contents,\n    issueCode: info.issue_code,\n    storageBucket: info.storage_bucket\n  };\n}\n\nlet currentPage = 0;\nlet totalPages = 0;\nlet pageLoading = false;\n\n// ==========================================\n// 3. 상태 메시지\n// ==========================================\n\nfunction showStatus(message, isError = false) {\n\n  const box = $(\"status\");\n\n  box.hidden = false;\n\n  box.className =\n    isError ? \"status error\" : \"status\";\n\n  box.textContent = message;\n\n}\n\n// ==========================================\n// 4. 회원 인증\n// ==========================================\n\nasync function checkMember() {\n\n  const {\n    data: userData,\n    error: userError\n  } = await supabase.auth.getUser();\n\n  if (userError || !userData.user) {\n\n    throw new Error(\n      \"로그인이 필요합니다. 회원 로그인 후 다시 접속해 주세요.\"\n    );\n\n  }\n\n  const {\n    data: profile,\n    error: profileError\n  } = await supabase\n    .from(\"profiles\")\n    .select(\"approval_status, member_grade\")\n    .eq(\"id\", userData.user.id)\n    .single();\n\n  if (profileError) {\n    throw profileError;\n  }\n\n  if (profile.approval_status !== \"approved\") {\n\n    throw new Error(\n      \"관리자 승인을 받은 회원만 전자책 전체본을 열람할 수 있습니다.\"\n    );\n\n  }\n\n  const { data: isSuperAdmin, error: superError } =\n    await supabase.rpc(\"is_super_admin\");\n\n  if (!superError && isSuperAdmin === true) return userData.user;\n\n  if (profile.member_grade === \"grade1\") {\n    const { data: isAdmin, error: adminError } = await supabase.rpc(\"is_admin\");\n    if (adminError) throw adminError;\n    if (isAdmin === true) return userData.user;\n  }\n\n  if (superError) throw superError;\n  throw new Error(\"승인된 1급회원 관리자 또는 최고관리자만 열람할 수 있습니다.\");\n\n}\n\n// ==========================================\n// 제190단계\n// 전자책 열람기 성능 개선 통합본 v1.0\n// ==========================================\n\n// ------------------------------------------\n// 1. 설정 및 상태\n// ------------------------------------------\n\nconst EBOOK_CACHE_MAX_PAGES = 6;\nconst EBOOK_CACHE_MAX_BYTES = 30 * 1024 * 1024;\n\nconst ebookCache = new Map();\nconst ebookPending = new Map();\nconst ebookControllers = new Set();\n\nlet ebookCacheBytes = 0;\nlet ebookGeneration = 0;\nlet ebookNavigationId = 0;\nlet ebookRequestedPage = currentPage;\nlet ebookPreloadTimer = null;\nlet ebookDisplayedUrl = null;\nlet ebookAuthUserId = null;\nlet ebookAuthListener = null;\n\n// ------------------------------------------\n// 2. 기존 인증 기반 페이지 URL 요청\n// ------------------------------------------\n\nasync function requestPage(pageNumber, signal) {\n\n  if (!canReadBody) {\n    throw new Error(\"전자책 본문 열람 권한이 없습니다.\");\n  }\n\n  const { data: sessionData, error: sessionError } =\n    await supabase.auth.getSession();\n\n  if (sessionError || !sessionData.session?.access_token) {\n    throw new Error(\"로그인 세션이 없습니다.\");\n  }\n\n  const response = await fetch(\n    SUPABASE_URL + \"/functions/v1/knowledge-ebook-page-access\",\n    {\n      method: \"POST\",\n      headers: {\n        \"Content-Type\": \"application/json\",\n        \"apikey\": SUPABASE_KEY,\n        \"Authorization\": \"Bearer \" + sessionData.session.access_token\n      },\n      body: JSON.stringify({\n        document_id: documentId,\n        page_number: pageNumber\n      }),\n      signal\n    }\n  );\n\n  const result = await response.json();\n\n  if (!response.ok || result.success !== true || !result.signed_url) {\n    throw new Error(result.error || \"페이지 접근에 실패했습니다.\");\n  }\n\n  const url = new URL(result.signed_url);\n  const bucket = book.storageBucket ?? \"knowledge-private\";\n\n  if (\n    url.protocol !== \"https:\" ||\n    url.origin !== SUPABASE_URL ||\n    typeof bucket !== \"string\" ||\n    !/^[A-Za-z0-9_-]+$/.test(bucket) ||\n    bucket === \"knowledge-public\" ||\n    !url.pathname.startsWith(\"/storage/v1/object/sign/\" + bucket + \"/\")\n  ) {\n    throw new Error(\"허용되지 않은 이미지 주소입니다.\");\n  }\n\n  return {\n    url: url.href,\n    totalPages: Number(result.total_pages)\n  };\n}\n\n// ------------------------------------------\n// 3. 캐시 폐기\n// ------------------------------------------\n\nfunction clearEbookCache() {\n\n  ebookGeneration++;\n  ebookNavigationId++;\n\n  clearTimeout(ebookPreloadTimer);\n  ebookPreloadTimer = null;\n\n  for (const controller of ebookControllers) {\n    controller.abort();\n  }\n  ebookControllers.clear();\n\n  const image = $(\"pageImage\");\n  image.hidden = true;\n  image.removeAttribute(\"src\");\n\n  for (const entry of ebookCache.values()) {\n    URL.revokeObjectURL(entry.url);\n  }\n\n  ebookCache.clear();\n  ebookPending.clear();\n\n  ebookCacheBytes = 0;\n  ebookDisplayedUrl = null;\n  ebookRequestedPage = 0;\n  currentPage = 0;\n\n  updatePageControls();\n}\n\n// ------------------------------------------\n// 4. 캐시 조회\n// ------------------------------------------\n\nfunction getCachedEbookPage(page) {\n  const entry = ebookCache.get(page);\n  if (!entry) return null;\n\n  ebookCache.delete(page);\n  ebookCache.set(page, entry);\n  return entry;\n}\n\n// ------------------------------------------\n// 5. 캐시 용량 관리\n// ------------------------------------------\n\nfunction trimEbookCache(protectedPage = null) {\n\n  while (\n    ebookCache.size > EBOOK_CACHE_MAX_PAGES ||\n    ebookCacheBytes > EBOOK_CACHE_MAX_BYTES\n  ) {\n\n    let removed = false;\n\n    for (const [page, entry] of ebookCache) {\n\n      if (\n        page === currentPage ||\n        page === ebookRequestedPage ||\n        page === protectedPage ||\n        entry.url === ebookDisplayedUrl\n      ) {\n        continue;\n      }\n\n      ebookCache.delete(page);\n      ebookCacheBytes -= entry.bytes;\n      URL.revokeObjectURL(entry.url);\n\n      removed = true;\n      break;\n    }\n\n    if (!removed) break;\n  }\n}\n\n// ------------------------------------------\n// 6. 페이지 다운로드\n// ------------------------------------------\n\nasync function prepareEbookPage(page) {\n\n  const cached = getCachedEbookPage(page);\n  if (cached) return cached;\n\n  if (ebookPending.has(page)) {\n    return ebookPending.get(page);\n  }\n\n  const generation = ebookGeneration;\n  const controller = new AbortController();\n  ebookControllers.add(controller);\n\n  const promise = (async () => {\n\n    let objectUrl = null;\n\n    try {\n\n      const result = await requestPage(page, controller.signal);\n\n      if (generation !== ebookGeneration || controller.signal.aborted) {\n        throw new DOMException(\"요청 취소\", \"AbortError\");\n      }\n\n      const response = await fetch(result.url, {\n        signal: controller.signal,\n        cache: \"no-store\",\n        referrerPolicy: \"no-referrer\"\n      });\n\n      if (!response.ok) {\n        throw new Error(\"이미지 다운로드 실패: \" + response.status);\n      }\n\n      const blob = await response.blob();\n\n      if (!blob.type.startsWith(\"image/\")) {\n        throw new Error(\"올바른 이미지 파일이 아닙니다.\");\n      }\n\n      if (generation !== ebookGeneration || controller.signal.aborted) {\n        throw new DOMException(\"요청 취소\", \"AbortError\");\n      }\n\n      objectUrl = URL.createObjectURL(blob);\n\n      const preview = new Image();\n      preview.src = objectUrl;\n      await preview.decode();\n\n      if (generation !== ebookGeneration || controller.signal.aborted) {\n        throw new DOMException(\"요청 취소\", \"AbortError\");\n      }\n\n      const entry = {\n        url: objectUrl,\n        bytes: blob.size\n      };\n\n      ebookCache.set(page, entry);\n      ebookCacheBytes += entry.bytes;\n\n      objectUrl = null;\n\n      trimEbookCache(page);\n\n      return entry;\n\n    } finally {\n      if (objectUrl) URL.revokeObjectURL(objectUrl);\n      ebookControllers.delete(controller);\n    }\n\n  })();\n\n  ebookPending.set(page, promise);\n\n  try {\n    return await promise;\n  } finally {\n    if (ebookPending.get(page) === promise) {\n      ebookPending.delete(page);\n    }\n  }\n}\n\n// ------------------------------------------\n// 7. 사전 로딩\n// ------------------------------------------\n\nfunction preloadEbookPages(page) {\n\n  clearTimeout(ebookPreloadTimer);\n\n  const generation = ebookGeneration;\n\n  ebookPreloadTimer = setTimeout(async () => {\n\n    ebookPreloadTimer = null;\n\n    const targets = [\n      page + 1,\n      page + 2,\n      page - 1\n    ].filter(n => n >= 1 && n <= totalPages);\n\n    for (const target of targets) {\n\n      if (generation !== ebookGeneration) return;\n      if (ebookRequestedPage !== page) return;\n\n      try {\n        await prepareEbookPage(target);\n      } catch (error) {\n        console.debug(\"사전 로딩 실패:\", target, error);\n      }\n    }\n\n    trimEbookCache();\n\n  }, 100);\n}\n\n// ------------------------------------------\n// 8. 표지\n// ------------------------------------------\n\nfunction getEbookCoverUrl() {\n\n  const known = EBOOK_COVERS[documentId];\n  if (known) return known;\n\n  if (\n    typeof book.issueCode !== \"string\" ||\n    !/^[A-Za-z0-9_-]+$/.test(book.issueCode)\n  ) {\n    throw new Error(\"표지 호수를 확인할 수 없습니다.\");\n  }\n\n  return SUPABASE_URL +\n    \"/storage/v1/object/public/knowledge-public/ebooks/covers/\" +\n    book.issueCode + \".webp\";\n}\n\n// ------------------------------------------\n// 9. 페이지 표시\n// ------------------------------------------\n\nasync function showPage(page) {\n\n  const navigationId = ++ebookNavigationId;\n  const generation = ebookGeneration;\n\n  ebookRequestedPage = page;\n  updatePageControls();\n\n  showStatus(page === 0 ? \"표지를 준비하고 있습니다.\" :\n    page + \"쪽을 준비하고 있습니다.\");\n\n  try {\n\n    let url;\n\n    if (page === 0) {\n      url = getEbookCoverUrl();\n\n      const preview = new Image();\n      preview.referrerPolicy = \"no-referrer\";\n      preview.src = url;\n      await preview.decode();\n\n    } else {\n      const entry = await prepareEbookPage(page);\n      url = entry.url;\n    }\n\n    if (\n      navigationId !== ebookNavigationId ||\n      generation !== ebookGeneration\n    ) return;\n\n    const image = $(\"pageImage\");\n\n    image.src = url;\n    image.alt = book.title +\n      (page === 0 ? \" 표지\" : \" \" + page + \"쪽\");\n    image.hidden = false;\n\n    ebookDisplayedUrl = page === 0 ? null : url;\n    currentPage = page;\n\n    $(\"pageInfo\").textContent =\n      page === 0 ? \"표지 / \" + totalPages :\n      page + \" / \" + totalPages;\n\n    $(\"reader\").hidden = false;\n    $(\"status\").hidden = true;\n\n    updatePageControls();\n    trimEbookCache();\n    preloadEbookPages(page);\n\n  } catch (error) {\n\n    if (\n      navigationId !== ebookNavigationId ||\n      generation !== ebookGeneration\n    ) return;\n\n    ebookRequestedPage = currentPage;\n    updatePageControls();\n\n    showStatus(\"페이지 열람 실패: \" +\n      (error.message || String(error)), true);\n  }\n}\n\n// ------------------------------------------\n// 10. 페이지 이동\n// ------------------------------------------\n\nfunction goToPage(number) {\n\n  const target = Number(number);\n\n  if (!Number.isInteger(target)) {\n    alert(\"올바른 페이지 번호를 입력해 주세요.\");\n    return;\n  }\n\n  if (target < 0 || target > totalPages) {\n    alert(\"표지(0쪽)부터 \" + totalPages + \"쪽까지 이동할 수 있습니다.\");\n    return;\n  }\n\n  if (target === ebookRequestedPage && target === currentPage) {\n    return;\n  }\n\n  return showPage(target);\n}\n\nfunction movePage(delta) {\n  return goToPage(\n    Math.max(0, Math.min(totalPages, ebookRequestedPage + delta))\n  );\n}\n\n// ------------------------------------------\n// 11. 페이지 컨트롤\n// ------------------------------------------\n\nfunction updatePageControls() {\n\n  $(\"pageInput\").value = ebookRequestedPage;\n  $(\"pageSlider\").value = ebookRequestedPage;\n  $(\"pageSlider\").max = totalPages;\n  $(\"sliderMax\").textContent = totalPages + \"쪽\";\n\n  const atStart = ebookRequestedPage <= 0;\n  const atEnd = ebookRequestedPage >= totalPages;\n\n  [\n    \"firstButton\", \"back50Button\",\n    \"back10Button\", \"prevButton\"\n  ].forEach(id => $(id).disabled = atStart);\n\n  [\n    \"nextButton\", \"forward10Button\",\n    \"forward50Button\", \"lastButton\"\n  ].forEach(id => $(id).disabled = atEnd);\n}\n\n// ------------------------------------------\n// 12. 페이지 이동 이벤트\n// ------------------------------------------\n\n$(\"prevButton\").addEventListener(\"click\", () => movePage(-1));\n$(\"nextButton\").addEventListener(\"click\", () => movePage(1));\n$(\"firstButton\").addEventListener(\"click\", () => goToPage(0));\n$(\"lastButton\").addEventListener(\"click\", () => goToPage(totalPages));\n\n$(\"back10Button\").addEventListener(\"click\", () => movePage(-10));\n$(\"forward10Button\").addEventListener(\"click\", () => movePage(10));\n$(\"back50Button\").addEventListener(\"click\", () => movePage(-50));\n$(\"forward50Button\").addEventListener(\"click\", () => movePage(50));\n\n$(\"jumpButton\").addEventListener(\"click\",\n  () => goToPage($(\"pageInput\").value));\n\n$(\"pageInput\").addEventListener(\"keydown\", event => {\n  if (event.key === \"Enter\") goToPage($(\"pageInput\").value);\n});\n\n$(\"pageSlider\").addEventListener(\"change\",\n  event => goToPage(event.target.value));\n\n// ------------------------------------------\n// 13. 키보드 이동\n// ------------------------------------------\n\ndocument.addEventListener(\"keydown\", event => {\n\n  const tag = event.target.tagName;\n\n  if (\n    tag === \"INPUT\" ||\n    tag === \"TEXTAREA\" ||\n    tag === \"SELECT\" ||\n    event.target.isContentEditable ||\n    event.altKey ||\n    event.ctrlKey ||\n    event.metaKey\n  ) return;\n\n  const keys = {\n    ArrowRight: 1,\n    ArrowLeft: -1,\n    PageDown: 10,\n    PageUp: -10\n  };\n\n  if (event.key === \"Home\") {\n    event.preventDefault();\n    goToPage(0);\n    return;\n  }\n\n  if (event.key === \"End\") {\n    event.preventDefault();\n    goToPage(totalPages);\n    return;\n  }\n\n  if (Object.prototype.hasOwnProperty.call(keys, event.key)) {\n    event.preventDefault();\n    movePage(keys[event.key]);\n  }\n});\n\n// ------------------------------------------\n// 14. 인증 변경 감지\n// ------------------------------------------\n\nfunction registerEbookAuthListener(userId) {\n\n  ebookAuthUserId = userId;\n\n  if (ebookAuthListener) return;\n\n  const { data } = supabase.auth.onAuthStateChange(\n    (event, session) => {\n\n      const nextUserId = session?.user?.id ?? null;\n\n      if (\n        event === \"SIGNED_OUT\" ||\n        (ebookAuthUserId !== null && nextUserId !== ebookAuthUserId)\n      ) {\n\n        clearEbookCache();\n        canReadBody = false;\n\n        showStatus(\n          \"로그인 상태가 변경되었습니다. 전자책을 다시 열어 주세요.\",\n          true\n        );\n      }\n\n      ebookAuthUserId = nextUserId;\n    }\n  );\n\n  ebookAuthListener = data.subscription;\n}\n\n// ==========================================\n// 11. 확대·축소\n// ==========================================\n\nlet zoomLevel = 100;\n\nconst MIN_ZOOM = 75;\nconst MAX_ZOOM = 250;\n\nfunction applyZoom() {\n\n  const image = $(\"pageImage\");\n  const viewport = $(\"pageViewport\");\n\n  image.style.width = zoomLevel + \"%\";\n\n  $(\"zoomResetButton\").textContent =\n    zoomLevel + \"%\";\n\n  viewport.classList.toggle(\n    \"zoomed\",\n    zoomLevel > 100\n  );\n\n  $(\"zoomOutButton\").disabled =\n    zoomLevel <= MIN_ZOOM;\n\n  $(\"zoomInButton\").disabled =\n    zoomLevel >= MAX_ZOOM;\n\n}\n\n$(\"zoomInButton\").addEventListener(\n  \"click\",\n  () => {\n\n    zoomLevel = Math.min(\n      MAX_ZOOM,\n      zoomLevel + 25\n    );\n\n    applyZoom();\n\n  }\n);\n\n$(\"zoomOutButton\").addEventListener(\n  \"click\",\n  () => {\n\n    zoomLevel = Math.max(\n      MIN_ZOOM,\n      zoomLevel - 25\n    );\n\n    applyZoom();\n\n  }\n);\n\n$(\"zoomResetButton\").addEventListener(\n  \"click\",\n  () => {\n\n    zoomLevel = 100;\n    applyZoom();\n\n  }\n);\n\n$(\"fitButton\").addEventListener(\n  \"click\",\n  () => {\n\n    zoomLevel = 100;\n    applyZoom();\n\n    $(\"pageViewport\").scrollTo(0, 0);\n\n  }\n);\n\n$(\"pageViewport\").addEventListener(\n  \"wheel\",\n  event => {\n\n    if (!event.ctrlKey) {\n      return;\n    }\n\n    event.preventDefault();\n\n    const direction =\n      event.deltaY < 0 ? 25 : -25;\n\n    zoomLevel = Math.max(\n      MIN_ZOOM,\n      Math.min(\n        MAX_ZOOM,\n        zoomLevel + direction\n      )\n    );\n\n    applyZoom();\n\n  },\n  { passive: false }\n);\n\n// ==========================================\n// 이미지 클릭으로 페이지 이동\n// ==========================================\n\n$(\"pageImage\").addEventListener(\n  \"click\",\n  event => {\n\n    // 확대 상태에서는 페이지 이동 금지\n    if (zoomLevel > 100) {\n      return;\n    }\n\n    const rect =\n      event.currentTarget.getBoundingClientRect();\n\n    const clickX =\n      event.clientX - rect.left;\n\n    const half = rect.width / 2;\n\n    // 이미지 왼쪽 클릭: 이전 페이지\n    if (clickX < half) {\n\n      movePage(-1);\n\n    } else {\n\n      // 이미지 오른쪽 클릭: 다음 페이지\n      movePage(1);\n\n    }\n\n  }\n);\n\napplyZoom();\n\n// ==========================================\n// 12. 목차 설정\n// ==========================================\n\n// 제1권: 인쇄 페이지 + 5\n// 제2 {\n      level = 3;\n    } else if (/^\\d+\\./.test(title)) {\n      level = 4;\n    } else if (/^(제\\d+단계|제\\d+층|제안\\s*\\d+|사업\\s*\\d+|대표사업\\s*\\d+|실증사업\\s*\\d+)/.test(title)) {\n      level = 4;\n    } else {\n      level = 2;\n    }\n\n    entries.push({\n      title,\n      pageText,\n      level\n    });\n  }\n\n  return entries;\n}\n\nconst BOOK10_TOC_ENTRIES =\n  parseBook10Toc(BOOK10_FULL_TOC);\n\n\n// ==========================================\n// 16. 목차 HTML 생성\n// ==========================================\n\nfunction escapeBook10Html(value) {\n  return String(value)\n    .replace(/&/g, \"&amp;\")\n    .replace(/</g, \"&lt;\")\n    .replace(/>/g, \"&gt;\")\n    .replace(/\"/g, \"&quot;\")\n    .replace(/'/g, \"&#39;\");\n}\n\n// ==========================================\n// 제191단계\n// 10번 전자책 원문자 페이지 변환\n// ==========================================\n\nfunction convertBook10CircledPage(pageText) {\n\n  const circledNumbers =\n    \"①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭\";\n\n  const index =\n    circledNumbers.indexOf(String(pageText).trim());\n\n  if (index === -1) {\n    return null;\n  }\n\n  // ① = 실제 전자책 5쪽\n  return index + 5;\n\n}\n  \n// ==========================================\n// 제191단계\n// 10번 전자책 계층형 절첩식 목차\n// ==========================================\n  \nfunction renderBook10Toc(container) {\n\n  if (!container) return;\n\n  container.replaceChildren();\n\n  // ----------------------------------------\n  // 1. 목차 계층 구조 생성\n  // ----------------------------------------\n\n  const root = [];\n  const stack = [];\n\n// ==========================================\n// 원문자 선행 목차 그룹화\n// ==========================================\n\nconst tocEntries = BOOK10_TOC_ENTRIES.map(\n  entry => ({ ...entry })\n);\n\nlet insideFrontMatter = false;\n\ntocEntries.forEach(entry => {\n\n  const pageText =\n    String(entry.pageText).trim();\n\n  // 원문자 페이지에 해당하는 항목\n  if (/^[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭]$/.test(pageText)) {\n\n    insideFrontMatter = true;\n\n    // 선행 목차는 최상위 그룹 아래에 배치\n    entry.level = Math.max(\n      2,\n      Number(entry.level) || 2\n    );\n\n  } else if (insideFrontMatter) {\n\n    insideFrontMatter = false;\n\n  }\n\n});\n  \n  tocEntries.forEach((entry, index) => {\n\n    const level = Math.max(\n      1,\n      Math.min(6, Number(entry.level) || 1)\n    );\n\n    const node = {\n      ...entry,\n      level,\n      index,\n      children: []\n    };\n\n    while (\n      stack.length &&\n      stack[stack.length - 1].level >= level\n    ) {\n      stack.pop();\n    }\n\n    if (stack.length) {\n      stack[stack.length - 1].children.push(node);\n    } else {\n      root.push(node);\n    }\n\n    stack.push(node);\n\n  });\n\n  // ----------------------------------------\n  // 2. 전체 펼치기 / 접기\n  // ----------------------------------------\n\n  const toolbar = document.createElement(\"div\");\n  toolbar.className = \"toc-fold-toolbar\";\n\n  const expandButton = document.createElement(\"button\");\n  expandButton.type = \"button\";\n  expandButton.textContent = \"전체 펼치기\";\n\n  const collapseButton = document.createElement(\"button\");\n  collapseButton.type = \"button\";\n  collapseButton.textContent = \"전체 접기\";\n\n  toolbar.append(expandButton, collapseButton);\n  container.appendChild(toolbar);\n\n  // ----------------------------------------\n  // 3. 목차 항목 생성\n  // ----------------------------------------\n\n  const tree = document.createElement(\"div\");\n  tree.className = \"toc-fold-tree\";\n\n  function createPageButton(node) {\n\n    const button = document.createElement(\"button\");\n\n    button.type = \"button\";\n    button.className = \"toc-fold-page\";\n    button.textContent = node.pageText + \"쪽\";\n\n    button.setAttribute(\n      \"aria-label\",\n      node.title + \" \" + node.pageText + \"쪽으로 이동\"\n    );\n\n    button.addEventListener(\"click\", event => {\n\n      event.stopPropagation();\n\n   const pageText = String(node.pageText).trim();\n\nconst circledPage =\n  convertBook10CircledPage(pageText);\n\nif (circledPage !== null) {\n\n  // 원문자 페이지는 실제 전자책 번호로 직접 이동\n  void goToPage(circledPage);\n  closeToc();\n  return;\n\n}\n\nconst printedPage = Number(pageText);\n\nif (!Number.isInteger(printedPage)) {\n  console.warn(\n    \"페이지 번호를 해석할 수 없습니다:\",\n    node.title,\n    pageText\n  );\n  return;\n}\n\n// 일반 숫자 페이지는 기존 보정 규칙 유지\nwindow.dispatchEvent(\n  new CustomEvent(\"book10:navigate\", {\n    detail: {\n      page: printedPage,\n      title: node.title\n    }\n  })\n);   \n\n    });\n\n    return button;\n  }\n\n  function createNode(node) {\n\n    const wrapper = document.createElement(\"div\");\n    wrapper.className = \"toc-fold-node\";\n\n    if (node.children.length) {\n\n      const details = document.createElement(\"details\");\n      details.className = \"toc-fold-details\";\n\n      const summary = document.createElement(\"summary\");\n      summary.className = \"toc-fold-summary\";\n\n      const title = document.createElement(\"span\");\n      title.className = \"toc-fold-title\";\n      title.textContent = node.title;\n\n      summary.append(\n        title,\n        createPageButton(node)\n      );\n\n      details.appendChild(summary);\n\n      const children = document.createElement(\"div\");\n      children.className = \"toc-fold-children\";\n\n      node.children.forEach(child => {\n        children.appendChild(createNode(child));\n      });\n\n      details.appendChild(children);\n      wrapper.appendChild(details);\n\n    } else {\n\n      const row = document.createElement(\"div\");\n      row.className = \"toc-fold-leaf\";\n\n      const title = document.createElement(\"span\");\n      title.className = \"toc-fold-title\";\n      title.textContent = node.title;\n\n      row.append(title, createPageButton(node));\n      wrapper.appendChild(row);\n\n    }\n\n    return wrapper;\n  }\n\n  root.forEach(node => {\n    tree.appendChild(createNode(node));\n  });\n\n  container.appendChild(tree);\n\n  // ----------------------------------------\n  // 4. 전체 펼치기\n  // ----------------------------------------\n\n  expandButton.addEventListener(\"click\", () => {\n\n    tree.querySelectorAll(\"details\").forEach(details => {\n      details.open = true;\n    });\n\n  });\n\n  // ----------------------------------------\n  // 5. 전체 접기\n  // ----------------------------------------\n\n  collapseButton.addEventListener(\"click\", () => {\n\n    resetTocView();\n\n  }); \n\n}\n\n// ==========================================\n// 17. 목차 검색\n// ==========================================\n\nfunction searchBook10Toc(keyword) {\n  const query = String(keyword || \"\")\n    .trim()\n    .toLocaleLowerCase();\n\n  if (!query) {\n    return BOOK10_TOC_ENTRIES;\n  }\n\n  return BOOK10_TOC_ENTRIES.filter(entry =>\n    entry.title.toLocaleLowerCase().includes(query)\n  );\n}\n\n\n// ==========================================\n// 18. 목차 스타일\n// ==========================================\n\nconst BOOK10_TOC_STYLE = `\n.book10-toc-item {\n  display: flex;\n  align-items: flex-start;\n  justify-content: space-between;\n  gap: 16px;\n  width: 100%;\n  padding: 9px 12px;\n  border: 0;\n  border-bottom: 1px solid #e5e7eb;\n  background: transparent;\n  color: #1f2937;\n  text-align: left;\n  cursor: pointer;\n  font-family: inherit;\n  font-size: 14px;\n  line-height: 1.6;\n}\n\n.book10-toc-item:hover {\n  background: #f3f4f6;\n}\n\n.book10-toc-title {\n  flex: 1;\n  min-width: 0;\n  overflow-wrap: anywhere;\n}\n\n.book10-toc-page {\n  flex: 0 0 auto;\n  color: #64748b;\n  font-variant-numeric: tabular-nums;\n}\n\n.book10-toc-level-1 {\n  padding-top: 20px;\n  padding-bottom: 12px;\n  font-size: 16px;\n  font-weight: 700;\n  color: #0f172a;\n}\n\n.book10-toc-level-2 {\n  font-weight: 650;\n}\n\n.book10-toc-level-3 {\n  padding-left: 22px;\n}\n\n.book10-toc-level-4 {\n  padding-left: 38px;\n  font-size: 13px;\n}\n\n.book10-toc-item:focus-visible {\n  outline: 2px solid #2563eb;\n  outline-offset: -2px;\n}\n`;\n\nfunction installBook10TocStyle() {\n  if (document.getElementById(\"book10-toc-style\")) {\n    return;\n  }\n\n  const style = document.createElement(\"style\");\n  style.id = \"book10-toc-style\";\n  style.textContent = BOOK10_TOC_STYLE;\n\n  document.head.appendChild(style);\n}\n\n\n// ==========================================\n// ==========================================\n// 19. 목차 및 전자책 초기화 복구\n// ==========================================\n\nlet readerInitialized = false;\n\n// ------------------------------------------\n// 목차 초기화\n// ------------------------------------------\n\nfunction initializeBook10Toc() {\n\n  if (documentId !== 10) return;\n\n  installBook10TocStyle();\n\n  const content = $(\"tocContent\");\n\n  if (!content) {\n    console.error(\"목차 표시 영역이 없습니다.\");\n    return;\n  }\n\n  let container = $(\"book10-toc\");\n\n  if (!container) {\n\n    container = document.createElement(\"div\");\n    container.id = \"book10-toc\";\n\n    content.appendChild(container);\n\n  }\n\n  renderBook10Toc(container);\n\n}\n\n// ==========================================\n// 제191단계\n// 목차 전체 접기 및 스크롤 초기화\n// ==========================================\n\nfunction resetTocView() {\n\n  const content = $(\"tocContent\");\n  const panel = $(\"tocPanel\");\n\n  if (!content) return;\n\n  // 1. 펼쳐진 모든 목차 그룹 접기\n  content.querySelectorAll(\"details[open]\")\n    .forEach(details => {\n      details.open = false;\n    });\n\n  // 2. 목차 내용 스크롤 초기화\n  content.scrollTop = 0;\n\n  // 3. 실제 목차 패널 스크롤 초기화\n  if (panel) {\n    panel.scrollTop = 0;\n  }\n\n}\n  \n// ------------------------------------------\n// 제1권 목차 생성\n// ------------------------------------------\n\nfunction initializeBook9Toc() {\n\n  if (documentId !== 9) return;\n\n  const content = $(\"tocContent\");\n\n  if (!content) return;\n\n  content.replaceChildren();\n\n  function addItem(title, page) {\n\n    const button = document.createElement(\"button\");\n\n    button.type = \"button\";\n    button.className = \"toc-item\";\n    button.textContent = title;\n\n    button.addEventListener(\"click\", () => {\n\n      const target = Number(page) + TOC_OFFSETS[9];\n\n      goToPage(target);\n\n      closeToc();\n\n    });\n\n    content.appendChild(button);\n\n  }\n\n  TOC_BOOK_9.forEach(section => {\n\n    addItem(section.title, section.page);\n\n    (section.children || []).forEach(child => {\n\n      if (Array.isArray(child)) {\n        addItem(\"　\" + child[0], child[1]);\n      } else {\n        addItem(child.title, child.page);\n      }\n\n    });\n\n  });\n\n}\n\n// ------------------------------------------\n// 목차 열기 및 닫기\n// ------------------------------------------\n\nfunction closeToc() {\n\nresetTocView();\n  \n  const panel = $(\"tocPanel\");\n  const button = $(\"tocButton\");\n\n  if (!panel || !button) return;\n\n  panel.hidden = true;\n\n  button.textContent = \"☰ 목차 보기\";\n\n  button.setAttribute(\n    \"aria-expanded\",\n    \"false\"\n  );\n\n}\n\nfunction initializeTocControls() {\n\n  const button = $(\"tocButton\");\n  const panel = $(\"tocPanel\");\n\n  if (!button || !panel) return;\n\n   // ==========================================\n  // 제191단계 3차 개선\n  // 목차 닫기 시 전체 접기 및 초기화\n  // ==========================================\n\n  button.addEventListener(\"click\", () => {\n\n    // 목차가 열려 있는 경우\n    if (!panel.hidden) {\n\n      // 기존 목차 닫기 함수 호출\n      // 내부에서 전체 접기 및 초기화 실행\n      closeToc();\n\n      return;\n    }\n\n    // 목차가 닫혀 있는 경우\n    // 초기 상태에서 다시 열기\n    resetTocView();\n\n    panel.hidden = false;\n\n    button.textContent = \"✕ 목차 닫기\";\n\n    button.setAttribute(\n      \"aria-expanded\",\n      \"true\"\n    );\n\n  });\n\n  window.addEventListener(\n    \"book10:navigate\",\n    event => {\n\n      if (documentId !== 10) return;\n\n      const printedPage = Number(\n        event.detail?.page\n      );\n\n      if (!Number.isInteger(printedPage)) {\n        return;\n      }\n\n      const targetPage =\n        printedPage + TOC_OFFSETS[10];\n\n      if (\n        targetPage >= 0 &&\n        targetPage <= totalPages\n      ) {\n\n        goToPage(targetPage);\n\n        closeToc();\n\n      }\n\n    }\n  );\n\n}\n\n// ------------------------------------------\n// 전자책 초기 실행\n// ------------------------------------------\n\nfunction initializeTotalToc(contents) {\n  const panel = $(\"tocContent\");\n  let entries = contents;\n  if (typeof entries === \"string\") {\n    try {\n      entries = JSON.parse(entries);\n    } catch {\n      entries = contents.split(/\\r?\\n/).filter(line => line.trim());\n    }\n    if (typeof entries === \"string\") entries = entries.split(/\\r?\\n/);\n  }\n\n  let count = 0;\n  function appendEntries(items, depth = 0) {\n    for (const entry of Array.isArray(items) ? items : [items]) {\n      if (typeof entry === \"string\") {\n        const match = entry.trim().match(/^(.+?)\\s+(\\d+)\\s*(?:쪽)?$/);\n        if (match) appendEntries({ title: match[1], page: match[2] }, depth);\n        continue;\n      }\n      if (!entry || typeof entry !== \"object\") continue;\n\n      const title = entry.title ?? entry.label ?? entry.text;\n      const page = Number(entry.page ?? entry.page_number);\n      if (typeof title === \"string\" && title.trim() &&\n          Number.isInteger(page) && page >= 1 && page <= totalPages) {\n        const button = document.createElement(\"button\");\n        button.type = \"button\";\n        button.className = \"toc-item\";\n        button.style.paddingInlineStart = 12 + Math.min(depth, 4) * 12 + \"px\";\n        button.textContent = title + \" · \" + page + \"쪽\";\n        button.addEventListener(\"click\", () => {\n          void goToPage(page);\n          closeToc();\n        });\n        panel.appendChild(button);\n        count++;\n      }\n      const children = entry.children ?? entry.items ?? entry.entries ?? entry.sections ?? entry.toc;\n      if (Array.isArray(children)) appendEntries(children, depth + 1);\n    }\n  }\n\n  panel.replaceChildren();\n  appendEntries(entries);\n  if (!count) panel.textContent = \"표시할 목차 항목을 확인할 수 없습니다.\";\n}\n\nasync function initializeReader() {\n\n  if (readerInitialized) return;\n\n  readerInitialized = true;\n\n  try {\n\n // ==========================================\n// 제192단계\n// 9번·10번 전용 열람기 접근 제한\n// ==========================================\n\nif (!Number.isSafeInteger(documentId) ||\n    ![9, 10].includes(documentId)) {\n\n  throw new Error(\n    \"이 열람기는 9번·10번 전자책 전용입니다.\"\n  );\n\n}   \n\n    const user = await checkMember();\n\ncanReadBody = true;\n\nregisterEbookAuthListener(user.id);\n\n    if (!book) book = await loadTotalEbook();\n\n    $(\"bookTitle\").textContent = book.title;\n\n    totalPages = book.pages;\n\n    updatePageControls();\n\n    initializeTocControls();\n\n    if (documentId === 9) {\n\n      initializeBook9Toc();\n\n    } else if (documentId === 10) {\n\n      initializeBook10Toc();\n\n    } else {\n\n      initializeTotalToc(book.contents);\n\n    }\n\n    showStatus(\"전자책을 불러오는 중입니다.\");\n    await showPage(0);\n\n    console.log(\n      \"전자책 초기화 완료\",\n      {\n        documentId,\n        totalPages\n      }\n    );\n\n  } catch (error) {\n\n    canReadBody = false;\n    console.error(\n      \"전자책 초기화 실패:\",\n      error\n    );\n\n    showStatus(\n      \"전자책 실행 실패: \" +\n      (error?.message || String(error)),\n      true\n    );\n\n  }\n\n}\n\n// ------------------------------------------\n// 실행\n// ------------------------------------------\n\nif (document.readyState === \"loading\") {\n\n  document.addEventListener(\n    \"DOMContentLoaded\",\n    initializeReader,\n    { once: true }\n  );\n\n} else {\n\n  initializeReader();\n\n}\n\u003c/script>\n\n</body>\n</html>  \n",
  "view=ebook-reader-test": "<!DOCTYPE html>\n<html lang=\"ko\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n<title>글로벌 AI 허브 전자책 열람실</title>\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", Arial, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  padding: 30px 20px;\n  text-align: center;\n}\n\nheader h1 {\n  margin: 0 0 10px;\n  font-size: clamp(24px, 5vw, 34px);\n}\n\nheader p {\n  margin: 5px 0;\n}\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 25px 15px;\n}\n\n.panel {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px #00000012;\n  margin-bottom: 20px;\n}\n\n.panel h2 {\n  color: #0754a6;\n}\n\n.status {\n  padding: 15px;\n  background: #eef4fb;\n  border-radius: 8px;\n  margin-bottom: 20px;\n  white-space: pre-wrap;\n  overflow-wrap: anywhere;\n}\n\n.status.error {\n  background: #fff1f2;\n  color: #991b1b;\n}\n\n.status.success {\n  background: #e8f5e9;\n  color: #176534;\n}\n\n.reader {\n  text-align: center;\n}\n\n.page-container {\n  background: #dce8f5;\n  padding: 20px;\n  border-radius: 10px;\n  min-height: 300px;\n}\n\n.page-container img {\n  display: block;\n  max-width: 100%;\n  height: auto;\n  margin: auto;\n  background: white;\n  box-shadow: 0 4px 15px #00000020;\n}\n\n.controls {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-top: 20px;\n}\n\nbutton,\n.button-link {\n  padding: 11px 18px;\n  background: #0754a6;\n  color: white;\n  border: none;\n  border-radius: 7px;\n  font: inherit;\n  font-weight: bold;\n  cursor: pointer;\n  text-decoration: none;\n}\n\nbutton:disabled {\n  opacity: 0.5;\n  cursor: not-allowed;\n}\n\n.page-info {\n  font-weight: bold;\n  color: #0754a6;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 25px;\n  margin-top: 40px;\n}\n\n[hidden] {\n  display: none !important;\n}\n\n@media (max-width: 600px) {\n  .panel {\n    padding: 15px;\n  }\n\n  .page-container {\n    padding: 8px;\n  }\n}\n\n#pageViewport {\n  overflow: auto;\n  max-height: 85vh;\n  text-align: center;\n}\n\n#pageImage {\n  display: block;\n  width: 100%;\n  max-width: none;\n  height: auto;\n  margin: 0 auto;\n  user-select: none;\n  -webkit-user-drag: none;\n}\n\n#pageViewport.zoomed {\n  text-align: left;\n}\n\n#pageViewport.zoomed #pageImage {\n  margin: 0;\n}\n\n#zoomResetButton {\n  background: #1769aa;\n}\n\n#fitButton {\n  background: #287b78;\n}\n\n/* 목차 */\n\n#tocPanel {\n  margin: 20px 0;\n  padding: 20px;\n  background: #f4f8fc;\n  border: 1px solid #c5d5e8;\n  border-radius: 10px;\n  text-align: left;\n  max-height: 65vh;\n  overflow-y: auto;\n}\n\n#tocPanel h3 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n#tocPanel details {\n  margin-bottom: 10px;\n  border-bottom: 1px solid #dce8f5;\n  padding-bottom: 8px;\n}\n\n#tocPanel summary {\n  cursor: pointer;\n  font-weight: bold;\n  padding: 10px;\n}\n\n.toc-item {\n  display: block;\n  width: 100%;\n  margin: 5px 0;\n  padding: 10px 12px;\n  background: white;\n  color: #17315b;\n  border: 1px solid #dce8f5;\n  border-radius: 6px;\n  text-align: left;\n  font-weight: normal;\n}\n\n.toc-item:hover,\n.toc-item:focus-visible {\n  background: #dce8f5;\n}\n\n.toc-group {\n  margin: 8px 0;\n}\n\n.toc-group summary {\n  background: #e8f0fa;\n  border-radius: 6px;\n}\n\n.toc-group .toc-item {\n  margin-left: 12px;\n  width: calc(100% - 12px);\n}\n\n/* ==========================================\n   제191단계 절첩식 목차\n========================================== */\n\n.toc-fold-toolbar {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  position: sticky;\n  top: 0;\n  background: #fff;\n  z-index: 10;\n  border-bottom: 1px solid #e2e8f0;\n}\n\n.toc-fold-toolbar button {\n  padding: 8px 14px;\n  border: 1px solid #cbd5e1;\n  border-radius: 6px;\n  background: #f8fafc;\n  cursor: pointer;\n}\n\n.toc-fold-tree {\n  padding: 12px;\n}\n\n.toc-fold-node {\n  margin: 3px 0;\n}\n\n.toc-fold-details {\n  border-bottom: 1px solid #f1f5f9;\n}\n\n.toc-fold-summary,\n.toc-fold-leaf {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 10px 8px;\n  border-radius: 6px;\n}\n\n.toc-fold-summary {\n  cursor: pointer;\n}\n\n.toc-fold-summary:hover,\n.toc-fold-leaf:hover {\n  background: #f1f5f9;\n}\n\n.toc-fold-title {\n  flex: 1;\n  min-width: 0;\n  overflow-wrap: anywhere;\n  line-height: 1.5;\n}\n\n.toc-fold-page {\n  flex-shrink: 0;\n  padding: 5px 9px;\n  border: 1px solid #cbd5e1;\n  border-radius: 5px;\n  background: #fff;\n  color: #2563eb;\n  cursor: pointer;\n  font-size: 12px;\n}\n\n.toc-fold-page:hover {\n  background: #dbeafe;\n}\n\n.toc-fold-children {\n  margin-left: 18px;\n  padding-left: 10px;\n  border-left: 2px solid #e2e8f0;\n}\n\n.toc-fold-details[open] > summary {\n  font-weight: 600;\n  color: #1d4ed8;\n}\n\n.toc-fold-summary:focus-visible,\n.toc-fold-page:focus-visible {\n  outline: 2px solid #2563eb;\n  outline-offset: 2px;\n}\n\n@media (max-width: 600px) {\n  .toc-fold-children {\n    margin-left: 9px;\n    padding-left: 7px;\n  }\n\n  .toc-fold-summary,\n  .toc-fold-leaf {\n    padding: 9px 4px;\n    font-size: 13px;\n  }\n}\n\n/* ==========================================\n   제191단계 목차 조작 편의성 개선\n========================================== */\n\n.toc-fold-page {\n  min-width: 100px;\n  min-height: 44px;\n  padding: 10px 14px;\n\n  font-size: 14px;\n  font-weight: 600;\n\n  color: #0754a6;\n  background: #ffffff;\n\n  border: 1px solid #b8cce3;\n  border-radius: 8px;\n\n  cursor: pointer;\n}\n\n.toc-fold-page:hover {\n  background: #e8f2ff;\n  border-color: #0754a6;\n}\n\n.toc-fold-toolbar button {\n  min-height: 44px;\n  padding: 10px 16px;\n\n  color: #0754a6 !important;\n  background: #e8f2ff !important;\n\n  border: 1px solid #b8cce3;\n  border-radius: 8px;\n\n  font-weight: 600;\n  cursor: pointer;\n}\n\n.toc-fold-toolbar {\n  position: relative;\n  top: auto;\n  z-index: 1;\n\n  background: #f8fbff;\n  border-bottom: 1px solid #dbe5f0;\n}\n\n.toc-fold-children {\n  margin-left: 16px;\n  padding-left: 12px;\n}\n  \n</style>\n</head>\n\n<body>\n\n<header>\n<h1>글로벌 AI 허브 전자책 열람실</h1>\n\n<p>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</p>\n</header>\n\n<main>\n\n<section class=\"panel\">\n\n<a class=\"button-link\" href=\"library.html\">\n← 지식자료실\n</a>\n\n<h2 id=\"bookTitle\">\n전자책 정보를 확인하는 중입니다.\n</h2>\n\n<div\n  id=\"status\"\n  class=\"status\"\n  role=\"status\"\n  aria-live=\"polite\"\n>\n회원 인증을 확인하는 중입니다.\n</div>\n\n</section>\n\n<section id=\"reader\" class=\"panel reader\" hidden>\n\n<div class=\"controls\">\n\n<button id=\"tocButton\" type=\"button\">\n☰ 목차 보기\n</button>\n\n</div>\n\n<div id=\"tocPanel\" hidden>\n<h3>전자책 목차</h3>\n<div id=\"tocContent\"></div>\n</div>\n\n<div class=\"controls\">\n\n<button id=\"zoomOutButton\" type=\"button\">\n축소 −\n</button>\n\n<button id=\"zoomResetButton\" type=\"button\">\n100%\n</button>\n\n<button id=\"zoomInButton\" type=\"button\">\n확대 +\n</button>\n\n<button id=\"fitButton\" type=\"button\">\n화면 맞춤\n</button>\n\n</div>\n\n<p style=\"font-size:13px;color:#68788c;\">\n이미지 왼쪽 클릭: 이전 페이지 /\n오른쪽 클릭: 다음 페이지 /\nCtrl + 마우스 휠: 확대·축소\n</p>\n\n<div\n  id=\"pageViewport\"\n  class=\"page-container\"\n  style=\"overflow:auto;max-height:85vh;cursor:pointer;\"\n>\n\n<img\n  id=\"pageImage\"\n  alt=\"전자책 페이지\"\n  referrerpolicy=\"no-referrer\"\n  draggable=\"false\"\n>\n\n</div>\n\n<div class=\"controls\">\n\n<button id=\"firstButton\" type=\"button\">\n처음\n</button>\n\n<button id=\"back50Button\" type=\"button\">\n-50쪽\n</button>\n\n<button id=\"back10Button\" type=\"button\">\n-10쪽\n</button>\n\n<button id=\"prevButton\" type=\"button\" disabled>\n이전\n</button>\n\n<span id=\"pageInfo\" class=\"page-info\">\n1 / 1\n</span>\n\n<button id=\"nextButton\" type=\"button\" disabled>\n다음\n</button>\n\n<button id=\"forward10Button\" type=\"button\">\n+10쪽\n</button>\n\n<button id=\"forward50Button\" type=\"button\">\n+50쪽\n</button>\n\n<button id=\"lastButton\" type=\"button\">\n마지막\n</button>\n\n</div>\n\n<div class=\"controls\">\n\n<label for=\"pageInput\">\n페이지 이동\n</label>\n\n<input\n  id=\"pageInput\"\n  type=\"number\"\n  min=\"0\"\n  step=\"1\"\n  value=\"1\"\n  style=\"\n    width:100px;\n    padding:10px;\n    border:1px solid #c5d5e8;\n    border-radius:7px;\n    text-align:center;\n  \"\n>\n\n<button id=\"jumpButton\" type=\"button\">\n이동\n</button>\n\n</div>\n\n<div style=\"margin-top:25px;\">\n\n<input\n  id=\"pageSlider\"\n  type=\"range\"\n  min=\"0\"\n  max=\"232\"\n  value=\"1\"\n  aria-label=\"전자책 페이지 이동\"\n  style=\"width:100%;\"\n>\n\n<div\n  style=\"\n    display:flex;\n    justify-content:space-between;\n    color:#68788c;\n  \"\n>\n\n<span>표지</span>\n<span id=\"sliderMax\">232쪽</span>\n\n</div>\n\n</div>\n\n</section>\n</main>\n\n<footer>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient } from\n\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n// ==========================================\n// 1. Supabase 연결\n// ==========================================\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\nconst $ = id =>\n  document.getElementById(id);\n\n// ==========================================\n// 2. 전자책 자료\n// ==========================================\n\nconst params =\n  new URLSearchParams(window.location.search);\n\nconst documentId =\n  Number(params.get(\"document_id\"));\n\nconst BOOKS = {\n\n  9: {\n    title:\n      \"글로벌 AI 허브 고양특례시 유치 종합 전략 및 실행 안내서\",\n    pages: 232\n  },\n\n  10: {\n    title:\n      \"글로벌 AI 허브 업무 지원 종합계획서\",\n    pages: 590\n  }\n\n};\n\nconst EBOOK_COVERS = {\n\n  9: \"/ebooks/assets/ebook-covers/issue-01.webp\",\n\n  10: \"/ebooks/assets/ebook-covers/issue-02.webp\"\n\n};\n\nlet book = BOOKS[documentId];\nlet canReadBody = false;\n\nasync function loadTotalEbook() {\n  const { data, error } = await supabase.rpc(\"get_total_ebook_info\", {\n    p_document_id: documentId\n  });\n  if (error) throw error;\n\n  const info = Array.isArray(data) ? data[0] : data;\n  const pages = Number(info?.total_pages);\n  if (Number(info?.document_id) !== documentId ||\n      typeof info?.title !== \"string\" || !info.title.trim() ||\n      !Number.isSafeInteger(pages) || pages < 1) {\n    throw new Error(\"전자책 정보 또는 페이지 수를 확인할 수 없습니다.\");\n  }\n\n  return {\n    title: info.title,\n    pages,\n    contents: info.contents,\n    issueCode: info.issue_code,\n    storageBucket: info.storage_bucket\n  };\n}\n\nlet currentPage = 0;\nlet totalPages = 0;\nlet pageLoading = false;\n\n// ==========================================\n// 3. 상태 메시지\n// ==========================================\n\nfunction showStatus(message, isError = false) {\n\n  const box = $(\"status\");\n\n  box.hidden = false;\n\n  box.className =\n    isError ? \"status error\" : \"status\";\n\n  box.textContent = message;\n\n}\n\n// ==========================================\n// 4. 회원 인증\n// ==========================================\n\nasync function checkMember() {\n\n  const {\n    data: userData,\n    error: userError\n  } = await supabase.auth.getUser();\n\n  if (userError || !userData.user) {\n\n    throw new Error(\n      \"로그인이 필요합니다. 회원 로그인 후 다시 접속해 주세요.\"\n    );\n\n  }\n\n  const {\n    data: profile,\n    error: profileError\n  } = await supabase\n    .from(\"profiles\")\n    .select(\"approval_status, member_grade\")\n    .eq(\"id\", userData.user.id)\n    .single();\n\n  if (profileError) {\n    throw profileError;\n  }\n\n  if (profile.approval_status !== \"approved\") {\n\n    throw new Error(\n      \"관리자 승인을 받은 회원만 전자책 전체본을 열람할 수 있습니다.\"\n    );\n\n  }\n\n  const { data: isSuperAdmin, error: superError } =\n    await supabase.rpc(\"is_super_admin\");\n\n  if (!superError && isSuperAdmin === true) return userData.user;\n\n  if (profile.member_grade === \"grade1\") {\n    const { data: isAdmin, error: adminError } = await supabase.rpc(\"is_admin\");\n    if (adminError) throw adminError;\n    if (isAdmin === true) return userData.user;\n  }\n\n  if (superError) throw superError;\n  throw new Error(\"승인된 1급회원 관리자 또는 최고관리자만 열람할 수 있습니다.\");\n\n}\n\n// ==========================================\n// 제190단계\n// 전자책 열람기 성능 개선 통합본 v1.0\n// ==========================================\n\n// ------------------------------------------\n// 1. 설정 및 상태\n// ------------------------------------------\n\nconst EBOOK_CACHE_MAX_PAGES = 6;\nconst EBOOK_CACHE_MAX_BYTES = 30 * 1024 * 1024;\n\nconst ebookCache = new Map();\nconst ebookPending = new Map();\nconst ebookControllers = new Set();\n\nlet ebookCacheBytes = 0;\nlet ebookGeneration = 0;\nlet ebookNavigationId = 0;\nlet ebookRequestedPage = currentPage;\nlet ebookPreloadTimer = null;\nlet ebookDisplayedUrl = null;\nlet ebookAuthUserId = null;\nlet ebookAuthListener = null;\n\n// ------------------------------------------\n// 2. 기존 인증 기반 페이지 URL 요청\n// ------------------------------------------\n\nasync function requestPage(pageNumber, signal) {\n\n  if (!canReadBody) {\n    throw new Error(\"전자책 본문 열람 권한이 없습니다.\");\n  }\n\n  const { data: sessionData, error: sessionError } =\n    await supabase.auth.getSession();\n\n  if (sessionError || !sessionData.session?.access_token) {\n    throw new Error(\"로그인 세션이 없습니다.\");\n  }\n\n  const response = await fetch(\n    SUPABASE_URL + \"/functions/v1/knowledge-ebook-page-access\",\n    {\n      method: \"POST\",\n      headers: {\n        \"Content-Type\": \"application/json\",\n        \"apikey\": SUPABASE_KEY,\n        \"Authorization\": \"Bearer \" + sessionData.session.access_token\n      },\n      body: JSON.stringify({\n        document_id: documentId,\n        page_number: pageNumber\n      }),\n      signal\n    }\n  );\n\n  const result = await response.json();\n\n  if (!response.ok || result.success !== true || !result.signed_url) {\n    throw new Error(result.error || \"페이지 접근에 실패했습니다.\");\n  }\n\n  const url = new URL(result.signed_url);\n  const bucket = book.storageBucket ?? \"knowledge-private\";\n\n  if (\n    url.protocol !== \"https:\" ||\n    url.origin !== SUPABASE_URL ||\n    typeof bucket !== \"string\" ||\n    !/^[A-Za-z0-9_-]+$/.test(bucket) ||\n    bucket === \"knowledge-public\" ||\n    !url.pathname.startsWith(\"/storage/v1/object/sign/\" + bucket + \"/\")\n  ) {\n    throw new Error(\"허용되지 않은 이미지 주소입니다.\");\n  }\n\n  return {\n    url: url.href,\n    totalPages: Number(result.total_pages)\n  };\n}\n\n// ------------------------------------------\n// 3. 캐시 폐기\n// ------------------------------------------\n\nfunction clearEbookCache() {\n\n  ebookGeneration++;\n  ebookNavigationId++;\n\n  clearTimeout(ebookPreloadTimer);\n  ebookPreloadTimer = null;\n\n  for (const controller of ebookControllers) {\n    controller.abort();\n  }\n  ebookControllers.clear();\n\n  const image = $(\"pageImage\");\n  image.hidden = true;\n  image.removeAttribute(\"src\");\n\n  for (const entry of ebookCache.values()) {\n    URL.revokeObjectURL(entry.url);\n  }\n\n  ebookCache.clear();\n  ebookPending.clear();\n\n  ebookCacheBytes = 0;\n  ebookDisplayedUrl = null;\n  ebookRequestedPage = 0;\n  currentPage = 0;\n\n  updatePageControls();\n}\n\n// ------------------------------------------\n// 4. 캐시 조회\n// ------------------------------------------\n\nfunction getCachedEbookPage(page) {\n  const entry = ebookCache.get(page);\n  if (!entry) return null;\n\n  ebookCache.delete(page);\n  ebookCache.set(page, entry);\n  return entry;\n}\n\n// ------------------------------------------\n// 5. 캐시 용량 관리\n// ------------------------------------------\n\nfunction trimEbookCache(protectedPage = null) {\n\n  while (\n    ebookCache.size > EBOOK_CACHE_MAX_PAGES ||\n    ebookCacheBytes > EBOOK_CACHE_MAX_BYTES\n  ) {\n\n    let removed = false;\n\n    for (const [page, entry] of ebookCache) {\n\n      if (\n        page === currentPage ||\n        page === ebookRequestedPage ||\n        page === protectedPage ||\n        entry.url === ebookDisplayedUrl\n      ) {\n        continue;\n      }\n\n      ebookCache.delete(page);\n      ebookCacheBytes -= entry.bytes;\n      URL.revokeObjectURL(entry.url);\n\n      removed = true;\n      break;\n    }\n\n    if (!removed) break;\n  }\n}\n\n// ------------------------------------------\n// 6. 페이지 다운로드\n// ------------------------------------------\n\nasync function prepareEbookPage(page) {\n\n  const cached = getCachedEbookPage(page);\n  if (cached) return cached;\n\n  if (ebookPending.has(page)) {\n    return ebookPending.get(page);\n  }\n\n  const generation = ebookGeneration;\n  const controller = new AbortController();\n  ebookControllers.add(controller);\n\n  const promise = (async () => {\n\n    let objectUrl = null;\n\n    try {\n\n      const result = await requestPage(page, controller.signal);\n\n      if (generation !== ebookGeneration || controller.signal.aborted) {\n        throw new DOMException(\"요청 취소\", \"AbortError\");\n      }\n\n      const response = await fetch(result.url, {\n        signal: controller.signal,\n        cache: \"no-store\",\n        referrerPolicy: \"no-referrer\"\n      });\n\n      if (!response.ok) {\n        throw new Error(\"이미지 다운로드 실패: \" + response.status);\n      }\n\n      const blob = await response.blob();\n\n      if (!blob.type.startsWith(\"image/\")) {\n        throw new Error(\"올바른 이미지 파일이 아닙니다.\");\n      }\n\n      if (generation !== ebookGeneration || controller.signal.aborted) {\n        throw new DOMException(\"요청 취소\", \"AbortError\");\n      }\n\n      objectUrl = URL.createObjectURL(blob);\n\n      const preview = new Image();\n      preview.src = objectUrl;\n      await preview.decode();\n\n      if (generation !== ebookGeneration || controller.signal.aborted) {\n        throw new DOMException(\"요청 취소\", \"AbortError\");\n      }\n\n      const entry = {\n        url: objectUrl,\n        bytes: blob.size\n      };\n\n      ebookCache.set(page, entry);\n      ebookCacheBytes += entry.bytes;\n\n      objectUrl = null;\n\n      trimEbookCache(page);\n\n      return entry;\n\n    } finally {\n      if (objectUrl) URL.revokeObjectURL(objectUrl);\n      ebookControllers.delete(controller);\n    }\n\n  })();\n\n  ebookPending.set(page, promise);\n\n  try {\n    return await promise;\n  } finally {\n    if (ebookPending.get(page) === promise) {\n      ebookPending.delete(page);\n    }\n  }\n}\n\n// ------------------------------------------\n// 7. 사전 로딩\n// ------------------------------------------\n\nfunction preloadEbookPages(page) {\n\n  clearTimeout(ebookPreloadTimer);\n\n  const generation = ebookGeneration;\n\n  ebookPreloadTimer = setTimeout(async () => {\n\n    ebookPreloadTimer = null;\n\n    const targets = [\n      page + 1,\n      page + 2,\n      page - 1\n    ].filter(n => n >= 1 && n <= totalPages);\n\n    for (const target of targets) {\n\n      if (generation !== ebookGeneration) return;\n      if (ebookRequestedPage !== page) return;\n\n      try {\n        await prepareEbookPage(target);\n      } catch (error) {\n        console.debug(\"사전 로딩 실패:\", target, error);\n      }\n    }\n\n    trimEbookCache();\n\n  }, 100);\n}\n\n// ------------------------------------------\n// 8. 표지\n// ------------------------------------------\n\nfunction getEbookCoverUrl() {\n\n  const known = EBOOK_COVERS[documentId];\n  if (known) return known;\n\n  if (\n    typeof book.issueCode !== \"string\" ||\n    !/^[A-Za-z0-9_-]+$/.test(book.issueCode)\n  ) {\n    throw new Error(\"표지 호수를 확인할 수 없습니다.\");\n  }\n\n  return SUPABASE_URL +\n    \"/storage/v1/object/public/knowledge-public/ebooks/covers/\" +\n    book.issueCode + \".webp\";\n}\n\n// ------------------------------------------\n// 9. 페이지 표시\n// ------------------------------------------\n\nasync function showPage(page) {\n\n  const navigationId = ++ebookNavigationId;\n  const generation = ebookGeneration;\n\n  ebookRequestedPage = page;\n  updatePageControls();\n\n  showStatus(page === 0 ? \"표지를 준비하고 있습니다.\" :\n    page + \"쪽을 준비하고 있습니다.\");\n\n  try {\n\n    let url;\n\n    if (page === 0) {\n      url = getEbookCoverUrl();\n\n      const preview = new Image();\n      preview.referrerPolicy = \"no-referrer\";\n      preview.src = url;\n      await preview.decode();\n\n    } else {\n      const entry = await prepareEbookPage(page);\n      url = entry.url;\n    }\n\n    if (\n      navigationId !== ebookNavigationId ||\n      generation !== ebookGeneration\n    ) return;\n\n    const image = $(\"pageImage\");\n\n    image.src = url;\n    image.alt = book.title +\n      (page === 0 ? \" 표지\" : \" \" + page + \"쪽\");\n    image.hidden = false;\n\n    ebookDisplayedUrl = page === 0 ? null : url;\n    currentPage = page;\n\n    $(\"pageInfo\").textContent =\n      page === 0 ? \"표지 / \" + totalPages :\n      page + \" / \" + totalPages;\n\n    $(\"reader\").hidden = false;\n    $(\"status\").hidden = true;\n\n    updatePageControls();\n    trimEbookCache();\n    preloadEbookPages(page);\n\n  } catch (error) {\n\n    if (\n      navigationId !== ebookNavigationId ||\n      generation !== ebookGeneration\n    ) return;\n\n    ebookRequestedPage = currentPage;\n    updatePageControls();\n\n    showStatus(\"페이지 열람 실패: \" +\n      (error.message || String(error)), true);\n  }\n}\n\n// ------------------------------------------\n// 10. 페이지 이동\n// ------------------------------------------\n\nfunction goToPage(number) {\n\n  const target = Number(number);\n\n  if (!Number.isInteger(target)) {\n    alert(\"올바른 페이지 번호를 입력해 주세요.\");\n    return;\n  }\n\n  if (target < 0 || target > totalPages) {\n    alert(\"표지(0쪽)부터 \" + totalPages + \"쪽까지 이동할 수 있습니다.\");\n    return;\n  }\n\n  if (target === ebookRequestedPage && target === currentPage) {\n    return;\n  }\n\n  return showPage(target);\n}\n\nfunction movePage(delta) {\n  return goToPage(\n    Math.max(0, Math.min(totalPages, ebookRequestedPage + delta))\n  );\n}\n\n// ------------------------------------------\n// 11. 페이지 컨트롤\n// ------------------------------------------\n\nfunction updatePageControls() {\n\n  $(\"pageInput\").value = ebookRequestedPage;\n  $(\"pageSlider\").value = ebookRequestedPage;\n  $(\"pageSlider\").max = totalPages;\n  $(\"sliderMax\").textContent = totalPages + \"쪽\";\n\n  const atStart = ebookRequestedPage <= 0;\n  const atEnd = ebookRequestedPage >= totalPages;\n\n  [\n    \"firstButton\", \"back50Button\",\n    \"back10Button\", \"prevButton\"\n  ].forEach(id => $(id).disabled = atStart);\n\n  [\n    \"nextButton\", \"forward10Button\",\n    \"forward50Button\", \"lastButton\"\n  ].forEach(id => $(id).disabled = atEnd);\n}\n\n// ------------------------------------------\n// 12. 페이지 이동 이벤트\n// ------------------------------------------\n\n$(\"prevButton\").addEventListener(\"click\", () => movePage(-1));\n$(\"nextButton\").addEventListener(\"click\", () => movePage(1));\n$(\"firstButton\").addEventListener(\"click\", () => goToPage(0));\n$(\"lastButton\").addEventListener(\"click\", () => goToPage(totalPages));\n\n$(\"back10Button\").addEventListener(\"click\", () => movePage(-10));\n$(\"forward10Button\").addEventListener(\"click\", () => movePage(10));\n$(\"back50Button\").addEventListener(\"click\", () => movePage(-50));\n$(\"forward50Button\").addEventListener(\"click\", () => movePage(50));\n\n$(\"jumpButton\").addEventListener(\"click\",\n  () => goToPage($(\"pageInput\").value));\n\n$(\"pageInput\").addEventListener(\"keydown\", event => {\n  if (event.key === \"Enter\") goToPage($(\"pageInput\").value);\n});\n\n$(\"pageSlider\").addEventListener(\"change\",\n  event => goToPage(event.target.value));\n\n// ------------------------------------------\n// 13. 키보드 이동\n// ------------------------------------------\n\ndocument.addEventListener(\"keydown\", event => {\n\n  const tag = event.target.tagName;\n\n  if (\n    tag === \"INPUT\" ||\n    tag === \"TEXTAREA\" ||\n    tag === \"SELECT\" ||\n    event.target.isContentEditable ||\n    event.altKey ||\n    event.ctrlKey ||\n    event.metaKey\n  ) return;\n\n  const keys = {\n    ArrowRight: 1,\n    ArrowLeft: -1,\n    PageDown: 10,\n    PageUp: -10\n  };\n\n  if (event.key === \"Home\") {\n    event.preventDefault();\n    goToPage(0);\n    return;\n  }\n\n  if (event.key === \"End\") {\n    event.preventDefault();\n    goToPage(totalPages);\n    return;\n  }\n\n  if (Object.prototype.hasOwnProperty.call(keys, event.key)) {\n    event.preventDefault();\n    movePage(keys[event.key]);\n  }\n});\n\n// ------------------------------------------\n// 14. 인증 변경 감지\n// ------------------------------------------\n\nfunction registerEbookAuthListener(userId) {\n\n  ebookAuthUserId = userId;\n\n  if (ebookAuthListener) return;\n\n  const { data } = supabase.auth.onAuthStateChange(\n    (event, session) => {\n\n      const nextUserId = session?.user?.id ?? null;\n\n      if (\n        event === \"SIGNED_OUT\" ||\n        (ebookAuthUserId !== null && nextUserId !== ebookAuthUserId)\n      ) {\n\n        clearEbookCache();\n        canReadBody = false;\n\n        showStatus(\n          \"로그인 상태가 변경되었습니다. 전자책을 다시 열어 주세요.\",\n          true\n        );\n      }\n\n      ebookAuthUserId = nextUserId;\n    }\n  );\n\n  ebookAuthListener = data.subscription;\n}\n\n// ==========================================\n// 11. 확대·축소\n// ==========================================\n\nlet zoomLevel = 100;\n\nconst MIN_ZOOM = 75;\nconst MAX_ZOOM = 250;\n\nfunction applyZoom() {\n\n  const image = $(\"pageImage\");\n  const viewport = $(\"pageViewport\");\n\n  image.style.width = zoomLevel + \"%\";\n\n  $(\"zoomResetButton\").textContent =\n    zoomLevel + \"%\";\n\n  viewport.classList.toggle(\n    \"zoomed\",\n    zoomLevel > 100\n  );\n\n  $(\"zoomOutButton\").disabled =\n    zoomLevel <= MIN_ZOOM;\n\n  $(\"zoomInButton\").disabled =\n    zoomLevel >= MAX_ZOOM;\n\n}\n\n$(\"zoomInButton\").addEventListener(\n  \"click\",\n  () => {\n\n    zoomLevel = Math.min(\n      MAX_ZOOM,\n      zoomLevel + 25\n    );\n\n    applyZoom();\n\n  }\n);\n\n$(\"zoomOutButton\").addEventListener(\n  \"click\",\n  () => {\n\n    zoomLevel = Math.max(\n      MIN_ZOOM,\n      zoomLevel - 25\n    );\n\n    applyZoom();\n\n  }\n);\n\n$(\"zoomResetButton\").addEventListener(\n  \"click\",\n  () => {\n\n    zoomLevel = 100;\n    applyZoom();\n\n  }\n);\n\n$(\"fitButton\").addEventListener(\n  \"click\",\n  () => {\n\n    zoomLevel = 100;\n    applyZoom();\n\n    $(\"pageViewport\").scrollTo(0, 0);\n\n  }\n);\n\n$(\"pageViewport\").addEventListener(\n  \"wheel\",\n  event => {\n\n    if (!event.ctrlKey) {\n      return;\n    }\n\n    event.preventDefault();\n\n    const direction =\n      event.deltaY < 0 ? 25 : -25;\n\n    zoomLevel = Math.max(\n      MIN_ZOOM,\n      Math.min(\n        MAX_ZOOM,\n        zoomLevel + direction\n      )\n    );\n\n    applyZoom();\n\n  },\n  { passive: false }\n);\n\n// ==========================================\n// 이미지 클릭으로 페이지 이동\n// ==========================================\n\n$(\"pageImage\").addEventListener(\n  \"click\",\n  event => {\n\n    // 확대 상태에서는 페이지 이동 금지\n    if (zoomLevel > 100) {\n      return;\n    }\n\n    const rect =\n      event.currentTarget.getBoundingClientRect();\n\n    const clickX =\n      event.clientX - rect.left;\n\n    const half = rect.width / 2;\n\n    // 이미지 왼쪽 클릭: 이전 페이지\n    if (clickX < half) {\n\n      movePage(-1);\n\n    } else {\n\n      // 이미지 오른쪽 클릭: 다음 페이지\n      movePage(1);\n\n    }\n\n  }\n);\n\napplyZoom();\n\n// ==========================================\n// 12. 목차 설정\n// ==========================================\n\n// 제1권: 인쇄 페이지 + 5\n// 제2권:
