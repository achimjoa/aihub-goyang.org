<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>글로벌 AI 허브 전자책 열람실</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Malgun Gothic", Arial, sans-serif;
  background: #f4f8fc;
  color: #17315b;
}

header {
  background: linear-gradient(
    135deg,
    #0754a6,
    #10315e
  );
  color: white;
  padding: 30px 20px;
  text-align: center;
}

header h1 {
  margin: 0 0 10px;
  font-size: clamp(24px, 5vw, 34px);
}

header p {
  margin: 5px 0;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 15px;
}

.panel {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #00000012;
  margin-bottom: 20px;
}

.panel h2 {
  color: #0754a6;
}

.status {
  padding: 15px;
  background: #eef4fb;
  border-radius: 8px;
  margin-bottom: 20px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.status.error {
  background: #fff1f2;
  color: #991b1b;
}

.status.success {
  background: #e8f5e9;
  color: #176534;
}

.reader {
  text-align: center;
}

.page-container {
  background: #dce8f5;
  padding: 20px;
  border-radius: 10px;
  min-height: 300px;
}

.page-container img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: auto;
  background: white;
  box-shadow: 0 4px 15px #00000020;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
}

button,
.button-link {
  padding: 11px 18px;
  background: #0754a6;
  color: white;
  border: none;
  border-radius: 7px;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.page-info {
  font-weight: bold;
  color: #0754a6;
}

footer {
  background: #10315e;
  color: white;
  text-align: center;
  padding: 25px;
  margin-top: 40px;
}

[hidden] {
  display: none !important;
}

@media (max-width: 600px) {
  .panel {
    padding: 15px;
  }

  .page-container {
    padding: 8px;
  }
}

/* ==========================================
   제188-21단계
   전자책 확대·축소
========================================== */

#pageViewport {
  overflow: auto;
  max-height: 85vh;
  text-align: center;
}

#pageImage {
  display: block;
  width: 100%;
  max-width: none;
  height: auto;
  margin: 0 auto;
  user-select: none;
  -webkit-user-drag: none;
}

#pageViewport.zoomed {
  text-align: left;
}

#pageViewport.zoomed #pageImage {
  margin: 0;
}

#zoomResetButton {
  background: #1769aa;
}

#fitButton {
  background: #287b78;
}
  
</style>

</head>

<body>

<header>

<h1>글로벌 AI 허브 전자책 열람실</h1>

<p>
경기도 글로벌 AI 허브 유치<br>
고양특례시 범시민추진위원회
</p>

</header>

<main>

<section class="panel">

<a
  class="button-link"
  href="library.html"
>
← 지식자료실
</a>

<h2 id="bookTitle">
전자책 정보를 확인하는 중입니다.
</h2>

<div
  id="status"
  class="status"
  role="status"
  aria-live="polite"
>
회원 인증을 확인하는 중입니다.
</div>

</section>

<section
  id="reader"
  class="panel reader"
  hidden
>

<!-- ==========================================
     제188-21단계
     전자책 확대·축소 및 마우스 조작
========================================== -->

<div class="controls">

  <button id="zoomOutButton" type="button">
    축소 −
  </button>

  <button id="zoomResetButton" type="button">
    100%
  </button>

  <button id="zoomInButton" type="button">
    확대 +
  </button>

  <button id="fitButton" type="button">
    화면 맞춤
  </button>

</div>

<p style="font-size:13px;color:#68788c;">
  이미지 왼쪽 클릭: 이전 페이지 /
  오른쪽 클릭: 다음 페이지 /
  Ctrl + 마우스 휠: 확대·축소
</p>

<div
  id="pageViewport"
  class="page-container"
  style="
    overflow:auto;
    max-height:85vh;
    cursor:pointer;
  "
>

  <img
    id="pageImage"
    alt="전자책 페이지"
    referrerpolicy="no-referrer"
    draggable="false"
  >

</div>

<!-- ==========================================
     제188-19단계
     전자책 페이지 이동 기능
========================================== -->

<div class="controls">

  <button id="firstButton" type="button">
    처음
  </button>

  <button id="back50Button" type="button">
    -50쪽
  </button>

  <button id="back10Button" type="button">
    -10쪽
  </button>

  <button id="prevButton" type="button" disabled>
    이전
  </button>

  <span id="pageInfo" class="page-info">
    1 / 1
  </span>

  <button id="nextButton" type="button" disabled>
    다음
  </button>

  <button id="forward10Button" type="button">
    +10쪽
  </button>

  <button id="forward50Button" type="button">
    +50쪽
  </button>

  <button id="lastButton" type="button">
    마지막
  </button>

</div>

<!-- 페이지 번호 직접 입력 -->

<div class="controls">

  <label for="pageInput">
    페이지 이동
  </label>

  <input
    id="pageInput"
    type="number"
    min="0"
    step="1"
    value="1"
    style="
      width:100px;
      padding:10px;
      border:1px solid #c5d5e8;
      border-radius:7px;
      text-align:center;
    "
  >

  <button id="jumpButton" type="button">
    이동
  </button>

</div>

<!-- 페이지 이동 슬라이더 -->

<div style="margin-top:25px;">

  <input
    id="pageSlider"
    type="range"
    min="0"
    max="232"
    value="1"
    aria-label="전자책 페이지 이동"
    style="width:100%;"
  >

  <div
    style="
      display:flex;
      justify-content:space-between;
      color:#68788c;
    "
  >

    <span>표지</span>

    <span id="sliderMax">232쪽</span>

  </div>

</div>

</section>

</main>

<footer>

경기도 글로벌 AI 허브 유치<br>
고양특례시 범시민추진위원회

</footer>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ==========================================
// 1. Supabase 연결
// ==========================================

const SUPABASE_URL =
  "https://gugkwqpvtwivqudkimvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id =>
  document.getElementById(id);

// ==========================================
// 2. 전자책 자료 확인
// ==========================================

const params =
  new URLSearchParams(
    window.location.search
  );

const documentId =
  Number(
    params.get("document_id")
  );

const BOOKS = {

  9: {
    title:
      "글로벌 AI 허브 고양특례시 유치 종합 전략 및 실행 안내서",
    pages: 232
  },

  10: {
    title:
      "글로벌 AI 허브 업무 지원 종합계획서",
    pages: 590
  }

};

// ==========================================
// 제188-20단계
// 전자책 공개 표지 설정
// ==========================================

const EBOOK_COVERS = {

  9: "/ebooks/assets/ebook-covers/issue-01.webp",

  10: "/ebooks/assets/ebook-covers/issue-02.webp"

};

const book = BOOKS[documentId];

// 0쪽은 표지
// 1쪽부터 본문 시작

let currentPage = 0;

let totalPages = 0;

// ==========================================
// 3. 상태 메시지
// ==========================================

function showStatus(
  message,
  isError = false
) {

  const box = $("status");

  box.hidden = false;

  box.className =
    isError
      ? "status error"
      : "status";

  box.textContent = message;

}

// ==========================================
// 4. 로그인 및 승인 회원 확인
// ==========================================

async function checkMember() {

  const {
    data: userData,
    error: userError
  } = await supabase.auth.getUser();

  if (
    userError ||
    !userData.user
  ) {

    throw new Error(
      "로그인이 필요합니다. 회원 로그인 후 다시 접속해 주세요."
    );

  }

  const {
    data: profile,
    error: profileError
  } = await supabase
    .from("profiles")
    .select("approval_status")
    .eq("id", userData.user.id)
    .single();

  if (profileError) {
    throw profileError;
  }

  if (
    profile.approval_status !== "approved"
  ) {

    throw new Error(
      "관리자 승인을 받은 회원만 전자책 전체본을 열람할 수 있습니다."
    );

  }

  return userData.user;

}

// ==========================================
// 5. 전자책 페이지 URL 요청
// ==========================================

async function requestPage(
  pageNumber
) {

  const {
    data: sessionData,
    error: sessionError
  } = await supabase.auth.getSession();

  if (
    sessionError ||
    !sessionData.session?.access_token
  ) {

    throw new Error(
      "로그인 세션이 없습니다. 다시 로그인해 주세요."
    );

  }

  const accessToken =
    sessionData.session.access_token;

  const response = await fetch(
    SUPABASE_URL +
    "/functions/v1/knowledge-ebook-page-access",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization":
          "Bearer " + accessToken
      },

      body: JSON.stringify({
        document_id: documentId,
        page_number: pageNumber
      })
    }
  );

  const result =
    await response.json();

  if (
    !response.ok ||
    result.success !== true
  ) {

    throw new Error(
      result.error ||
      "전자책 페이지 접근이 거부되었습니다."
    );

  }

  if (!result.signed_url) {

    throw new Error(
      "페이지 열람 주소가 발급되지 않았습니다."
    );

  }

  // ========================================
  // 허용된 Supabase Storage 주소만 사용
  // ========================================

  const url =
    new URL(result.signed_url);

  if (
    url.protocol !== "https:" ||
    url.origin !== SUPABASE_URL ||
    !url.pathname.startsWith(
      "/storage/v1/object/sign/knowledge-private/"
    )
  ) {

    throw new Error(
      "허용되지 않은 이미지 주소입니다."
    );

  }

  return {
    url: url.href,
    totalPages: Number(result.total_pages)
  };

}

// ==========================================
// 제188-20단계
// 전자책 표지 표시
// ==========================================

function showCover() {

  const coverUrl =
    EBOOK_COVERS[documentId];

  if (!coverUrl) {

    showStatus(
      "전자책 표지를 찾을 수 없습니다.",
      true
    );

    return;

  }

  $("pageImage").src = coverUrl;

  $("pageImage").alt =
    book.title + " 표지";

  currentPage = 0;

  $("pageInfo").textContent =
    "표지 / " + totalPages;

  $("reader").hidden = false;

  $("status").hidden = true;

  updatePageControls();

}
  
// ==========================================
// 6. 페이지 표시
// ==========================================

// ==========================================
// 제188-20단계
// 표지 및 본문 페이지 표시
// ==========================================

async function showPage(
  pageNumber
) {

  // 0쪽은 표지

  if (pageNumber === 0) {

    showCover();

    return;

  }

  // 본문 페이지 범위 확인

  if (
    pageNumber < 1 ||
    pageNumber > totalPages
  ) {
    return;
  }

  $("prevButton").disabled = true;
  $("nextButton").disabled = true;

  showStatus(
    pageNumber + "쪽을 불러오는 중입니다."
  );

  try {

    const result =
      await requestPage(pageNumber);

    $("pageImage").src =
      result.url;

    $("pageImage").alt =
      book.title +
      " " +
      pageNumber +
      "쪽";

    currentPage = pageNumber;

    $("pageInfo").textContent =
      currentPage +
      " / " +
      totalPages;

    $("reader").hidden = false;

    $("status").hidden = true;

  } catch (error) {

    showStatus(
      "페이지 열람 실패: " +
      error.message,
      true
    );

  } finally {

    $("prevButton").disabled =
      currentPage <= 0;

    $("nextButton").disabled =
      currentPage >= totalPages;

  }

}


// ==========================================
// 제188-19단계
// 전자책 페이지 이동 기능 개선
// ==========================================

// 페이지 이동 요청 중복 방지
let pageLoading = false;

// ==========================================
// 1. 원하는 페이지로 이동
// ==========================================

async function goToPage(number) {

  if (pageLoading) {
    return;
  }

  const targetPage = Number(number);

  if (!Number.isInteger(targetPage)) {

    alert("올바른 페이지 번호를 입력해 주세요.");
    return;

  }

 if (
    targetPage < 0 ||
    targetPage > totalPages
  ) {

alert(
  "표지(0쪽)부터 " +
  totalPages +
  "쪽까지 이동할 수 있습니다."
);    

    return;

  }

  if (targetPage === currentPage) {
    return;
  }

  pageLoading = true;

  try {

    await showPage(targetPage);

  } finally {

    pageLoading = false;

    updatePageControls();

  }

}

// ==========================================
// 2. 페이지 이동 버튼 상태 갱신
// ==========================================

// ==========================================
// 제188-20단계
// 표지를 포함한 페이지 이동 상태 갱신
// ==========================================

function updatePageControls() {

  $("pageInput").value = currentPage;

  $("pageSlider").value = currentPage;

  $("pageSlider").max = totalPages;

  $("sliderMax").textContent =
    totalPages + "쪽";

  // 표지에서는 이전 이동 불가

  $("firstButton").disabled =
    currentPage <= 0;

  $("back50Button").disabled =
    currentPage <= 0;

  $("back10Button").disabled =
    currentPage <= 0;

  $("prevButton").disabled =
    currentPage <= 0;

  // 마지막 페이지에서는 다음 이동 불가

  $("nextButton").disabled =
    currentPage >= totalPages;

  $("forward10Button").disabled =
    currentPage >= totalPages;

  $("forward50Button").disabled =
    currentPage >= totalPages;

  $("lastButton").disabled =
    currentPage >= totalPages;

}

// ==========================================
// 3. 이전·다음 페이지
// ==========================================

$("prevButton").addEventListener(
  "click",
  () => goToPage(currentPage - 1)
);

$("nextButton").addEventListener(
  "click",
  () => goToPage(currentPage + 1)
);

// ==========================================
// 4. 빠른 페이지 이동
// ==========================================

$("firstButton").addEventListener(
  "click",
  () => goToPage(0)
);

$("lastButton").addEventListener(
  "click",
  () => goToPage(totalPages)
);

$("back10Button").addEventListener(
  "click",
  () => goToPage(
    Math.max(0, currentPage - 10)
  )
);

$("forward10Button").addEventListener(
  "click",
  () => goToPage(
    Math.min(totalPages, currentPage + 10)
  )
);

$("back50Button").addEventListener(
  "click",
  () => goToPage(
    Math.max(0, currentPage - 50)
  )
);

$("forward50Button").addEventListener(
  "click",
  () => goToPage(
    Math.min(totalPages, currentPage + 50)
  )
);

// ==========================================
// 5. 페이지 번호 직접 입력
// ==========================================

$("jumpButton").addEventListener(
  "click",
  () => {

    goToPage(
      $("pageInput").value
    );

  }
);

$("pageInput").addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      goToPage(
        $("pageInput").value
      );

    }

  }
);

// ==========================================
// 6. 슬라이더 페이지 이동
// ==========================================

$("pageSlider").addEventListener(
  "change",
  event => {

    goToPage(
      event.target.value
    );

  }
);

// ==========================================
// 7. 키보드 페이지 이동
// ==========================================

document.addEventListener(
  "keydown",
  event => {

    const tag =
      event.target.tagName;

    if (
      tag === "INPUT" ||
      tag === "TEXTAREA" ||
      tag === "SELECT" ||
      event.target.isContentEditable ||
      event.altKey ||
      event.ctrlKey ||
      event.metaKey
    ) {
      return;
    }

    let targetPage = null;

    switch (event.key) {

      case "ArrowRight":
        targetPage = currentPage + 1;
        break;

      case "ArrowLeft":
        targetPage = currentPage - 1;
        break;

      case "PageDown":
        targetPage = currentPage + 10;
        break;

      case "PageUp":
        targetPage = currentPage - 10;
        break;

      case "Home":
        targetPage = 0;
        break;

      case "End":
        targetPage = totalPages;
        break;

      default:
        return;

    }

    event.preventDefault();

    goToPage(
      Math.max(
        0,
        Math.min(totalPages, targetPage)
      )
    );

  }
);

// ==========================================
// 제188-21단계
// 확대·축소 및 마우스 조작
// ==========================================

let zoomLevel = 100;

const MIN_ZOOM = 75;
const MAX_ZOOM = 250;

// ==========================================
// 확대·축소 적용
// ==========================================

function applyZoom() {

  const image = $("pageImage");
  const viewport = $("pageViewport");

  image.style.width =
    zoomLevel + "%";

  $("zoomResetButton").textContent =
    zoomLevel + "%";

  viewport.classList.toggle(
    "zoomed",
    zoomLevel > 100
  );

  $("zoomOutButton").disabled =
    zoomLevel <= MIN_ZOOM;

  $("zoomInButton").disabled =
    zoomLevel >= MAX_ZOOM;

}

// ==========================================
// 확대
// ==========================================

$("zoomInButton").addEventListener(
  "click",
  () => {

    zoomLevel = Math.min(
      MAX_ZOOM,
      zoomLevel + 25
    );

    applyZoom();

  }
);

// ==========================================
// 축소
// ==========================================

$("zoomOutButton").addEventListener(
  "click",
  () => {

    zoomLevel = Math.max(
      MIN_ZOOM,
      zoomLevel - 25
    );

    applyZoom();

  }
);

// ==========================================
// 기본 배율 복귀
// ==========================================

$("zoomResetButton").addEventListener(
  "click",
  () => {

    zoomLevel = 100;

    applyZoom();

  }
);

// ==========================================
// 화면 맞춤
// ==========================================

$("fitButton").addEventListener(
  "click",
  () => {

    zoomLevel = 100;

    applyZoom();

    $("pageViewport").scrollTo(0, 0);

  }
);

// ==========================================
// Ctrl + 마우스 휠 확대·축소
// ==========================================

$("pageViewport").addEventListener(
  "wheel",
  event => {

    if (!event.ctrlKey) {
      return;
    }

    event.preventDefault();

    const direction =
      event.deltaY < 0 ? 25 : -25;

    zoomLevel = Math.max(
      MIN_ZOOM,
      Math.min(
        MAX_ZOOM,
        zoomLevel + direction
      )
    );

    applyZoom();

  },
  { passive: false }
);

// ==========================================
// 이미지 좌우 클릭 페이지 이동
// ==========================================

$("pageImage").addEventListener(
  "click",
  event => {

    // 확대 중에는 페이지 이동 방지

    if (zoomLevel > 100) {
      return;
    }

    const rect =
      event.currentTarget.getBoundingClientRect();

    const clickX =
      event.clientX - rect.left;

    const half =
      rect.width / 2;

    if (clickX < half) {

      goToPage(
        Math.max(0, currentPage - 1)
      );

    } else {

      goToPage(
        Math.min(
          totalPages,
          currentPage + 1
        )
      );

    }

  }
);

// 초기 배율 설정

applyZoom();

// ==========================================
// 제188-22단계
// 전자책 목차 탐색 기능

// 목차 텍스트 분석
// ==========================================

function parseBook10Toc() {

  const entries = [];

  const lines = BOOK10_TOC_TEXT.split(/\r?\n/);

  for (const raw of lines) {

    const line = raw.trim();

    if (!line) continue;

    const match = line.match(
      /^(.*?)\s+(①|②|③|④|⑤|⑥|⑦|⑧|⑨|\d+)$/
    );

    if (!match) continue;

    const title = match[1].trim();
    const pageText = match[2];

    const isFront =
      Object.prototype.hasOwnProperty.call(
        BOOK10_FRONT_PAGES,
        pageText
      );

    const page = isFront
      ? BOOK10_FRONT_PAGES[pageText]
      : Number(pageText);

    entries.push({
      title,
      page,
      pageText,
      isFront
    });

  }

  return entries;
}

    tocPanel.hidden = true;

    tocButton.textContent = "☰ 목차 보기";
    tocButton.setAttribute("aria-expanded", "false");

  });

  return button;

}

// ==========================================
// 다단계 트리 목차 생성
// ==========================================

function buildTableOfContents() {

  const tocData =
    documentId === 9
      ? TOC_BOOK_9
      : TOC_BOOK_10;

  tocPanel.replaceChildren(tocHeading);

  function renderNode(node, parent) {

    // 기존 제1권 배열 형식 지원
    if (Array.isArray(node)) {
      parent.appendChild(
        createTocItem(node[0], node[1])
      );
      return;
    }

    const children = node.children || [];

    if (children.length === 0) {
      parent.appendChild(
        createTocItem(node.title, node.page)
      );
      return;
    }

    const details =
      document.createElement("details");

    const summary =
      document.createElement("summary");

    summary.textContent = node.title;

    details.appendChild(summary);

    // 상위 항목도 페이지 이동 가능
    if (Number.isInteger(node.page)) {
      details.appendChild(
        createTocItem(
          "▶ " + node.title + " 시작",
          node.page
        )
      );
    }

    const childContainer =
      document.createElement("div");

    childContainer.style.marginLeft = "20px";
    childContainer.style.paddingLeft = "12px";
    childContainer.style.borderLeft =
      "2px solid #dce8f5";

    children.forEach(child => {
      renderNode(child, childContainer);
    });

    details.appendChild(childContainer);

    parent.appendChild(details);
  }

  tocData.forEach(node => {
    renderNode(node, tocPanel);
  });
}
  
// ==========================================
// 6. 목차 열기 및 닫기
// ==========================================

tocButton.addEventListener("click", () => {

  tocPanel.hidden = !tocPanel.hidden;

  const isOpen = !tocPanel.hidden;

  tocButton.textContent =
    isOpen
      ? "✕ 목차 닫기"
      : "☰ 목차 보기";

  tocButton.setAttribute(
    "aria-expanded",
    String(isOpen)
  );

});

// 목차 초기화

if (book) {
  buildTableOfContents();
}
  
// ==========================================
// 8. 초기 실행
// ==========================================

async function initialize() {

  if (!book) {

    showStatus(
      "올바른 전자책 자료 ID가 필요합니다.",
      true
    );

    return;

  }

  $("bookTitle").textContent =
    book.title;

  totalPages = book.pages;

  updatePageControls();

  try {

    await checkMember();

    showStatus(
      "회원 인증 완료. 전자책을 불러옵니다."
    );

    await showPage(0);

  } catch (error) {

    showStatus(
      error.message,
      true
    );

  }

}

initialize();

</script>
