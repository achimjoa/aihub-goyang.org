<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1급회원 승급 신청</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Malgun Gothic", Arial, sans-serif;
  background: #f4f8fc;
  color: #17315b;
}

header {
  background: #0754a6;
  color: white;
  padding: 28px 15px;
  text-align: center;
}

main {
  max-width: 720px;
  margin: 35px auto;
  padding: 28px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h2 { color: #0754a6; }

.notice {
  padding: 15px;
  background: #edf5ff;
  border-radius: 8px;
  line-height: 1.8;
}

label {
  display: block;
  margin-top: 18px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 7px;
  border: 1px solid #ccd7e5;
  border-radius: 6px;
  font: inherit;
}

input[type="checkbox"] {
  width: auto;
}

button {
  background: #0754a6;
  color: white;
  border: 0;
  border-radius: 7px;
  padding: 13px 20px;
  margin-top: 20px;
  cursor: pointer;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#message {
  white-space: pre-line;
  margin-top: 20px;
  line-height: 1.7;
}

.status {
  margin-top: 18px;
  padding: 15px;
  background: #f1f6fd;
  border-radius: 8px;
  line-height: 1.8;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<header>
  <h1>1급회원 승급 신청</h1>
  <p>경기도 글로벌 AI 허브 유치 범시민추진위원회</p>
</header>

<main>

<div class="notice">
  회원가입 승인이 완료된 일반회원이 신청할 수 있습니다.
  <br>
  전화번호와 명함 또는 이에 상응하는 신분 확인 자료를 제출해 주세요.
  <br>
  최고관리자가 확인한 후 승급 여부를 결정합니다.
</div>

<section id="statusSection" hidden>
  <h2>나의 승급 신청 현황</h2>
  <div id="statusContent" class="status"></div>
</section>

<section id="applySection" hidden>

  <h2>1급회원 승급 신청서</h2>

  <form id="applyForm">

    <label for="phone">전화번호 *</label>
    <input id="phone" type="tel" required maxlength="30">

    <label for="organization">소속 기관·단체</label>
    <input id="organization" maxlength="150">

    <label for="position">직책</label>
    <input id="position" maxlength="100">

    <label for="evidence">명함 또는 신분 확인 자료 *</label>
    <input
      id="evidence"
      type="file"
      accept=".jpg,.jpeg,.png,.pdf"
      required
    >

    <p>JPG, PNG, PDF / 최대 5MB</p>

    <label for="reason">승급 신청 사유</label>
    <textarea id="reason" rows="4" maxlength="2000"></textarea>

    <label>
      <input id="consent" type="checkbox" required>
      승급 심사를 위한 개인정보 수집·이용에 동의합니다.
    </label>

    <button type="submit" id="applyButton">
      1급회원 승급 신청
    </button>

  </form>

</section>

<section id="revisionSection" hidden>

  <h2>증빙자료 보완 제출</h2>

  <p id="revisionNote"></p>

  <form id="revisionForm">

    <label for="revisionFile">새 증빙자료 *</label>

    <input
      id="revisionFile"
      type="file"
      accept=".jpg,.jpeg,.png,.pdf"
      required
    >

    <button type="submit" id="revisionButton">
      보완자료 제출
    </button>

  </form>

</section>

<p id="message" role="status" aria-live="polite">
  회원정보를 확인하고 있습니다.
</p>

<p><a href="index.html">← 홈페이지로 돌아가기</a></p>

</main>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://gugkwqpvtwivqudkimvy.supabase.co",
  "sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5"
);

const $ = id => document.getElementById(id);

const MAX_SIZE = 5 * 1024 * 1024;

const TYPES = {
  "image/jpeg": "jpg",
  "image/png": "png",
  "application/pdf": "pdf"
};

let currentUser = null;
let currentRequest = null;
let busy = false;

function showMessage(text, error = false) {
  $("message").textContent = text;
  $("message").style.color =
    error ? "#b91c1c" : "#0754a6";
}

function hideSections() {
  $("applySection").hidden = true;
  $("revisionSection").hidden = true;
  $("statusSection").hidden = true;
}

function statusLabel(status) {
  return {
    pending: "심사 대기",
    approved: "승급 승인",
    rejected: "승급 거절",
    revision_requested: "자료 보완 요청"
  }[status] || status;
}

function formatDate(value) {
  return value
    ? new Date(value).toLocaleString("ko-KR")
    : "-";
}

/* 파일 검증 */

function validateFile(file) {

  if (!file) {
    throw new Error("증빙자료를 첨부해 주세요.");
  }

  if (!TYPES[file.type]) {
    throw new Error("JPG, PNG, PDF만 가능합니다.");
  }

  if (file.size < 1 || file.size > MAX_SIZE) {
    throw new Error("파일은 5MB 이하여야 합니다.");
  }

  return TYPES[file.type];
}

/* 증빙자료 업로드 */

async function uploadEvidence(file) {

  const extension = validateFile(file);

  const path =
    `${currentUser.id}/${crypto.randomUUID()}.${extension}`;

  const { error } = await supabase.storage
    .from("member-verification")
    .upload(path, file, {
      contentType: file.type,
      upsert: false
    });

  if (error) throw error;

  return path;
}

/* 신청 상태 조회 */

async function loadRequests() {

  const { data, error } = await supabase.rpc(
    "get_my_grade1_requests"
  );

  if (error) throw error;

  return data || [];
}

/* 화면 갱신 */

async function refreshScreen() {

  hideSections();

  const { data: profile, error: profileError } =
    await supabase
      .from("profiles")
      .select(
        "member_role, member_grade, approval_status"
      )
      .eq("id", currentUser.id)
      .single();

  if (profileError) throw profileError;

  if (profile.approval_status !== "approved") {
    showMessage("회원가입 승인 후 이용할 수 있습니다.");
    return;
  }

  const requests = await loadRequests();

  const latest = requests[0] || null;

  currentRequest = latest;

  if (latest) {

    $("statusSection").hidden = false;

    const content = $("statusContent");

    content.replaceChildren();

    const lines = [
      `신청번호: ${latest.request_id}`,
      `처리 상태: ${statusLabel(latest.request_status)}`,
      `신청일: ${formatDate(latest.requested_at)}`,
      `심사일: ${formatDate(latest.reviewed_at)}`
    ];

    if (latest.review_note) {
      lines.push(`심사 의견: ${latest.review_note}`);
    }

    for (const line of lines) {
      const p = document.createElement("p");
      p.textContent = line;
      content.appendChild(p);
    }
  }

  if (profile.member_grade === "grade1") {
    showMessage("이미 1급회원으로 승급되었습니다.");
    return;
  }

  if (profile.member_role !== "member") {
    showMessage("일반회원만 승급 신청할 수 있습니다.");
    return;
  }

  const activeRequest = requests.find(
    r => ["pending", "revision_requested"]
      .includes(r.request_status)
  );

  if (activeRequest) {

    currentRequest = activeRequest;

    if (activeRequest.request_status === "pending") {
      showMessage("현재 최고관리자의 심사를 기다리고 있습니다.");
      return;
    }

    $("revisionSection").hidden = false;

    $("revisionNote").textContent =
      activeRequest.review_note ||
      "증빙자료를 보완하여 다시 제출해 주세요.";

    showMessage("보완자료를 제출할 수 있습니다.");
    return;
  }

  $("applySection").hidden = false;

  showMessage("승급 신청서를 작성해 주세요.");
}

/* 최초 신청 */

$("applyForm").addEventListener("submit", async event => {

  event.preventDefault();

  if (busy || !currentUser) return;

  busy = true;
  $("applyButton").disabled = true;

  try {

    const file = $("evidence").files[0];

    showMessage("증빙자료 업로드 중...");

    const path = await uploadEvidence(file);

    showMessage("승급 신청 접수 중...");

    const { error } = await supabase.rpc(
      "request_grade1_upgrade",
      {
        p_phone: $("phone").value.trim(),
        p_organization: $("organization").value.trim(),
        p_position_title: $("position").value.trim(),
        p_evidence_path: path,
        p_reason: $("reason").value.trim()
      }
    );

    if (error) throw error;

    $("applyForm").reset();

    await refreshScreen();

    showMessage("승급 신청이 정상 접수되었습니다.");

  } catch (error) {

    showMessage(
      "신청 실패: " + error.message,
      true
    );

  } finally {

    busy = false;
    $("applyButton").disabled = false;
  }
});

/* 보완자료 재제출 */

$("revisionForm").addEventListener("submit", async event => {

  event.preventDefault();

  if (busy || !currentRequest) return;

  busy = true;
  $("revisionButton").disabled = true;

  try {

    showMessage("보완자료 업로드 중...");

    const path = await uploadEvidence(
      $("revisionFile").files[0]
    );

    const { error } = await supabase.rpc(
      "resubmit_grade1_evidence",
      {
        p_request_id: currentRequest.request_id,
        p_evidence_path: path
      }
    );

    if (error) throw error;

    $("revisionForm").reset();

    await refreshScreen();

    showMessage(
      "보완자료가 접수되었습니다. 재심사를 기다려 주세요."
    );

  } catch (error) {

    showMessage(
      "보완자료 제출 실패: " + error.message,
      true
    );

  } finally {

    busy = false;
    $("revisionButton").disabled = false;
  }
});

/* 초기화 */

async function initialize() {

  try {

    const { data, error } =
      await supabase.auth.getUser();

    if (error) throw error;

    if (!data.user) {
      showMessage("로그인 후 이용해 주세요.", true);
      return;
    }

    currentUser = data.user;

    await refreshScreen();

  } catch (error) {

    showMessage(
      "화면 초기화 오류: " + error.message,
      true
    );
  }
}

initialize();

</script>

</body>
</html>
