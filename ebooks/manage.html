<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시판 공개 소개판 관리</title>
<style>
  body { font: 1rem system-ui; margin: 2rem auto; padding: 0 1rem; max-width: 48rem; color: #182c44; }
  form, #catalogue { border: 1px solid #becbd7; border-radius: .6rem; padding: 1rem; margin-block: 1rem; }
  label { display: block; margin: .75rem 0; } input:not([type=file]), textarea { display: block; width: min(100%,32rem); font: inherit; }
  button { margin: .2rem .6rem .2rem 0; padding: .42rem .65rem; font: inherit; }
  [hidden] { display: none !important; } li { margin: .7rem 0; } #status { white-space: pre-wrap; }
</style>
<a href="../admin-center.html">통합관리센터로 돌아가기</a>
<h1>게시판 공개 소개판 관리</h1>
<p>여기에 올린 WebP 페이지는 누구나 읽을 수 있습니다. 소개판 파일만 업로드하세요.</p>
<a href="../index.html?view=login&amp;return=ebooks%2Fmanage.html">관리자 로그인</a>
<p id="status" role="status">최고관리자 권한 확인 중…</p>
<section id="workspace" hidden>
  <h2>등록된 소개판</h2>
  <ul id="catalogue"></ul>
  <h2>신규 등록 또는 기존 소개판 교체</h2>
  <p>컴퓨터에서 파일을 선택하면 이 화면이 Supabase Storage로 직접 올립니다. GitHub에 먼저 올릴 필요가 없습니다.</p>
  <form id="publication" novalidate>
    <fieldset id="controls">
      <label>발간 번호 <input name="number" type="number" min="1" max="9999" required></label>
      <label>제목 <input name="title" maxlength="240" required></label>
      <label>발간일 <input name="date" type="date" required></label>
      <label>목차 (선택). 한 줄에 <code>페이지 번호 | 항목명</code>
        <textarea name="contents" rows="5"></textarea>
      </label>
      <label>작업 방식
        <select name="mode">
          <option value="full">신규 등록 또는 전체 교체</option>
          <option value="partial">기존 소개판의 선택한 쪽만 교체</option>
        </select>
      </label>
      <label>공개 소개판 WebP 파일
        <small id="fileHint">전체 등록은 01.webp부터 연속으로 선택하세요. 표지가 cover.webp이면 표지와 본문 01.webp부터 모두 선택하세요.</small>
        <input name="images" type="file" accept=".webp,image/webp" multiple required>
      </label>
      <button type="submit">등록·교체 실행</button>
    </fieldset>
    <p id="operationStatus" role="status" aria-live="polite" style="white-space:pre-wrap"></p>
  </form>
</section>
<script src="intro-catalog.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const client = createClient(IntroCatalog.url, IntroCatalog.key);
const status = document.getElementById("status");
const list = document.getElementById("catalogue");
const form = document.getElementById("publication");
const fields = form.elements;
const controls = document.getElementById("controls");
let busy = false;
let registered = new Map();
const operationStatus = document.getElementById("operationStatus");

function report(message) {
  status.textContent = message;
  operationStatus.textContent = message;
}

function describe(error) {
  const code = error?.statusCode ?? error?.status ?? error?.code;
  return [error?.message || String(error), code && "코드 " + code].filter(Boolean).join(" · ");
}

fields.namedItem("mode").addEventListener("change", () => {
  const partial = fields.namedItem("mode").value === "partial";
  document.getElementById("fileHint").textContent = partial
    ? "교체할 파일만 선택하세요. 예: 04.webp는 열람기의 4쪽입니다."
    : "전체 등록은 01.webp부터 연속으로 선택하세요. 표지가 cover.webp이면 표지와 본문 01.webp부터 모두 선택하세요.";
});

async function requireSuperAdmin() {
  const { data, error } = await client.rpc("is_super_admin");
  if (error) throw error;
  if (data !== true) throw new Error("최고관리자 권한이 필요합니다.");
}

async function getRows() {
  const { data, error } = await client.from(IntroCatalog.table).select(
    "id,number,title,date,pages,contents,revision,published"
  );
  if (error) throw error;
  return data;
}

async function renderRows() {
  const overrides = await getRows();
  const items = new Map(IntroCatalog.builtIn.map(book => [book.id, { ...book, published: true }]));
  for (const book of overrides) items.set(book.id, book);
  registered = items;
  list.replaceChildren();
  for (const book of [...items.values()].sort((a, b) => a.number - b.number)) {
    const item = document.createElement("li");
    item.append(document.createTextNode("제" + book.number + "호 · " + book.title + " · " +
      (book.published ? "공개" : "게시 목록에서 숨김") + " "));
    const edit = document.createElement("button");
    edit.textContent = "교체할 책 선택";
    edit.onclick = () => {
      if (busy) return;
      fields.namedItem("number").value = book.number;
      fields.namedItem("title").value = book.title;
      fields.namedItem("date").value = book.date.replaceAll(".", "-");
      fields.namedItem("contents").value = book.contents.map(([, label, page]) => page + " | " + label).join("\n");
      const mode = fields.namedItem("mode");
      mode.value = "partial";
      mode.dispatchEvent(new Event("change"));
      fields.namedItem("images").value = "";
      fields.namedItem("images").focus();
      report("제" + book.number + "호를 선택했습니다. 파일을 선택한 뒤 아래 실행 버튼을 누르세요.");
    };
    item.append(edit);
    if (book.published) {
      const remove = document.createElement("button");
      remove.textContent = "게시 목록에서 내리기";
      remove.onclick = () => {
        if (busy || !confirm(book.title + "을 게시 목록에서 내리겠습니까? 기존 공개 파일 주소는 계속 열릴 수 있습니다.")) return;
        void run(async () => {
          await writeBook({...book, published: false});
          status.textContent = "게시 목록에서 내렸습니다.";
        });
      };
      item.append(remove);
    }
    list.append(item);
  }
}

async function writeBook(book) {
  const { error } = await client.from(IntroCatalog.table).upsert({
    id: book.id, number: book.number, title: book.title, date: book.date.replaceAll(".", "-"),
    pages: book.pages, contents: book.contents, revision: book.revision ?? null, published: book.published
  });
  if (error) throw error;
}

async function run(operation) {
  if (busy) return;
  busy = true;
  controls.disabled = true;
  try {
    await requireSuperAdmin();
    await operation();
    try {
      await renderRows();
    } catch (error) {
      status.textContent += "\n목록 새로고침 실패: " + error.message;
    }
  } catch (error) {
    report("처리 실패: " + describe(error));
  } finally {
    busy = false;
    controls.disabled = false;
  }
}

async function indexedFiles(files, partial, pages) {
  const selected = new Map();
  const hasCover = !partial && files.some(file => /^cover\.webp$/i.test(file.name));
  for (const file of files) {
    const match = /^(\d{1,4})\.webp$/i.exec(file.name);
    const number = match ? Number(match[1]) : 0;
    const page = hasCover && /^cover\.webp$/i.test(file.name)
      ? 1
      : number > 0 ? number + Number(hasCover) : 0;
    if (page < 1 || page > pages || selected.has(page)) {
      throw new Error(file.name + ": 페이지 번호가 범위를 벗어났거나 이미 선택되었습니다.");
    }
    if (file.size > 8 * 1024 * 1024) throw new Error(file.name + ": 파일이 8 MB를 초과합니다.");
    const header = new TextDecoder().decode(await file.slice(0, 12).arrayBuffer());
    if (!header.startsWith("RIFF") || header.slice(8) !== "WEBP") {
      throw new Error(file.name + ": 올바른 WebP 파일을 선택해 주세요.");
    }
    selected.set(page, file);
  }
  return selected;
}

async function readExistingPage(book, page) {
  const response = await fetch(IntroCatalog.image(book, page), { signal: AbortSignal.timeout(15000) });
  const file = await response.blob();
  const header = new TextDecoder().decode(await file.slice(0, 12).arrayBuffer());
  if (!response.ok || !header.startsWith("RIFF") || header.slice(8) !== "WEBP") {
    throw new Error("기존 " + page + "쪽 이미지를 읽지 못했습니다. 이 페이지도 교체 파일에 포함하거나 전체 교체를 선택하세요.");
  }
  return file;
}

form.addEventListener("submit", event => {
  event.preventDefault();
  if (busy) return;
  if (!form.checkValidity()) {
    report("발간 번호, 제목, 발간일 및 WebP 파일을 확인하세요. 이 화면에서 컴퓨터의 파일을 선택해야 합니다.");
    form.reportValidity();
    return;
  }

  const input = new FormData(form);
  const number = Number(input.get("number"));
  const title = input.get("title").trim();
  const date = input.get("date");
  const files = [...fields.namedItem("images").files];
  const partial = input.get("mode") === "partial";
  const id = "issue-" + String(number).padStart(2, "0");
  const previous = registered.get(id);
  const pages = partial ? previous?.pages : files.length;
  if (!title || !files.length || !pages || pages > 1000) {
    report(partial && !previous ? "일부 교체는 등록된 소개판에만 사용할 수 있습니다." : "제목과 1~1000개 페이지를 확인하세요.");
    return;
  }

  void run(async () => {
    report("선택한 파일을 확인하는 중입니다.");
    const contents = input.get("contents").split("\n").filter(row => row.trim()).map(row => {
      const match = /^(\d+)\s*\|\s*(.+)$/.exec(row.trim());
      const page = match ? Number(match[1]) : 0;
      if (!page || page > pages) throw new Error("목차 페이지는 1~" + pages + "쪽이어야 합니다: " + row);
      return [1, match[2].trim(), page];
    });
    const selected = await indexedFiles(files, partial, pages);
    const action = partial ? selected.size + "개 페이지 교체" : previous ? "전체 교체" : "신규 공개";
    if (!confirm("발간 제" + number + "호 · " + action + "을 진행하시겠습니까? 업로드한 소개판 이미지는 공개됩니다.")) {
      report("작업을 취소했습니다.");
      return;
    }
    const revision = crypto.randomUUID();
    for (let page = 1; page <= pages; page++) {
      report(page + " / " + pages + "쪽 저장 중");
      const file = selected.get(page) ?? await readExistingPage(previous, page);
      const path = id + "/" + revision + "/" + String(page).padStart(2, "0") + ".webp";
      const { error } = await client.storage.from(IntroCatalog.bucket).upload(path, file, {
        contentType: "image/webp", upsert: false, cacheControl: "31536000"
      });
      if (error) throw new Error(page + "쪽 Storage 업로드 실패: " + describe(error));
    }
    report("모든 페이지를 저장했습니다. 게시 목록에 반영 중입니다.");
    try {
      await writeBook({id, number, title, date, contents, pages, revision, published: previous?.published ?? true});
    } catch (error) {
      throw new Error("게시 목록 저장 실패: " + describe(error));
    }
    form.reset();
    fields.namedItem("mode").dispatchEvent(new Event("change"));
    report("제" + number + "호 " + action + " 완료." + (previous?.published === false ? " 이 소개판은 목록에서 숨긴 상태입니다." : ""));
  });
});

try {
  await requireSuperAdmin();
  await renderRows();
  document.getElementById("workspace").hidden = false;
  status.textContent = "게시판 소개판을 관리할 수 있습니다.";
} catch (error) {
  status.textContent = "관리 화면을 열지 못했습니다: " + error.message;
}
</script>
</html>
