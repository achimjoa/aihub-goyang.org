<style>

:root {
  color-scheme: light;
  --ink: #102340;
  --muted: #48617c;
  --blue: #0c58ac;
  --line: #d6e2ef;
  --paper: #fff;

  font-family:
    system-ui,
    -apple-system,
    "Malgun Gothic",
    "Apple SD Gothic Neo",
    sans-serif;

  background: #f1f6fc;
  color: var(--ink);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
}

a {
  color: var(--blue);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

button,
select,
input {
  font: inherit;
  color: inherit;
}

[hidden] {
  display: none !important;
}

:focus-visible {
  outline: 3px solid #1774da;
  outline-offset: 3px;
}

.header {
  min-height: 62px;
  padding: 10px max(
    20px,
    calc((100vw - 1100px) / 2)
  );

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;

  background: #fff;
  border-bottom: 1px solid var(--line);
}

.brand {
  font-weight: 800;
  color: var(--ink);
}

.brand span,
.site-link {
  color: var(--muted);
}

.site-link {
  font-size: .82rem;
  white-space: nowrap;
}

.shelf {
  max-width: 1100px;
  margin: auto;
  padding: 0 22px 56px;
}

.intro {
  padding: 48px 0 30px;
}

.intro h1 {
  font-size: clamp(2rem, 6vw, 3.3rem);
  margin: 0;
  letter-spacing: -.065em;
}

.intro p {
  color: var(--muted);
  margin: 10px 0 18px;
  line-height: 1.6;
}

.member {
  font-size: .88rem;
  font-weight: 720;
}

.books {
  display: grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(min(100%, 300px), 1fr)
    );
  gap: 22px;
}

.book {
  background: white;
  border-radius: 18px;
  border: 1px solid var(--line);
  overflow: hidden;

  display: grid;
  grid-template-columns:
    minmax(92px, 36%) 1fr;

  align-items: center;
  gap: 17px;
  padding: 17px;

  color: var(--ink);

  box-shadow:
    0 8px 24px #10234010;
}

.book:hover {
  text-decoration: none;
  border-color: #7aa8db;
}

.book img {
  display: block;
  width: 100%;
  border-radius: 5px;

  box-shadow:
    0 4px 10px #10234033;
}

.eyebrow {
  color: var(--blue);
  font-size: .8rem;
  font-weight: 800;
}

.book h2 {
  font-size: clamp(1rem, 2vw, 1.3rem);
  line-height: 1.4;
  margin: 6px 0;
}

.meta {
  display: block;
  color: var(--muted);
  font-size: .79rem;
  line-height: 1.6;
}

.open {
  display: inline-block;
  margin-top: 9px;
  color: var(--blue);
  font-size: .86rem;
  font-weight: 750;
}

#publisher {
  color: var(--muted);
  padding: 0 22px 24px;
  text-align: center;
  font-size: .82rem;
}

.reading #publisher {
  display: none;
}

.reader {
  height: calc(100vh - 62px);
  height: calc(100dvh - 62px);

  min-height: 345px;

  display: flex;
  flex-direction: column;

  background: #e7eff8;
}

.reader:fullscreen,
.reader.expanded {
  height: 100%;
  width: 100%;
  background: #e7eff8;
}

.reader.expanded {
  position: fixed;
  inset: 0;
  z-index: 5;
}

.reader-heading {
  display: flex;
  align-items: center;
  gap: 14px;
  justify-content: space-between;

  padding: 8px 16px;
  background: white;
}

.reader-heading h1 {
  font-size: 1rem;
  margin: 0;
  text-align: center;
  line-height: 1.4;
}

.back {
  font-size: .82rem;
  white-space: nowrap;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;

  gap: 5px 10px;
  padding: 6px 10px;

  background: #f9fbfe;

  border-block:
    1px solid var(--line);
}

.control-group,
#jump {
  display: flex;
  align-items: center;
  gap: 4px;
}

button,
select,
input {
  height: 37px;

  border:
    1px solid #c4d4e6;

  border-radius: 7px;
  background: white;
}

button,
select {
  padding: 0 8px;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
  cursor: default;
}

button:hover:not(:disabled),
select:hover {
  background: #e9f3ff;
}

#prev,
#next,
#smaller,
#bigger {
  width: 37px;
  font-size: 1.25rem;
}

#reset-zoom {
  min-width: 56px;
}

#jump input {
  width: 49px;
  text-align: center;
  appearance: textfield;
}

#jump input::-webkit-inner-spin-button {
  appearance: none;
}

#count {
  font-size: .85rem;
  white-space: nowrap;
}

#toc {
  width: 83px;
}

.stage {
  flex: 1;
  min-height: 0;
  overflow: auto;

  padding: 12px;

  overscroll-behavior: contain;
  perspective: 1300px;
}

.stage.fit {
  touch-action: pan-y;
}

.sheet {
  width:
    var(--page-width, min(100%, 595px));

  margin: auto;
  background: white;

  box-shadow:
    0 7px 22px #18365330;

  transform-origin: left center;
}

.sheet img {
  display: block;
  width: 100%;

  aspect-ratio:
    595.32 / 841.92;

  user-select: none;
}

.reader-footer {
  padding: 5px 12px;
  text-align: center;
  font-size: .75rem;
  color: var(--muted);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (max-width: 640px) {

  .header {
    min-height: 50px;
  }

  .reader {
    height: calc(100vh - 50px);
    height: calc(100dvh - 50px);
  }

  .reader-heading {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 5px 8px;
    padding: 6px 9px;
  }

  .reader-heading h1 {
    grid-column: 1 / -1;
    grid-row: 2;
    text-align: left;
    font-size: .81rem;
  }

  .reader-heading .member {
    font-size: .75rem;
  }

  .stage {
    padding: 8px;
  }

  .intro {
    padding-top: 32px;
  }

}

<!-- ==========================================
전자책 열람 기능
기존 app.js 통합
========================================== -->

<script>

'use strict';

const byId = id =>
  document.getElementById(id);

const pageUrl = (book, number) =>
  './assets/' +
  book.id +
  '/' +
  String(number).padStart(2, '0') +
  '.webp';

const catalog =
  window.EBOOK_CATALOG;

const query =
  new URLSearchParams(
    location.search
  );

const book =
  catalog.find(
    ({ id }) =>
      id === query.get('book')
  );

// ==========================================
// 전자책 목록
// ==========================================

function renderShelf() {

  for (const item of catalog) {

    const card =
      document.createElement('a');

    card.className = 'book';

    card.href =
      '?book=' +
      encodeURIComponent(item.id);

    const cover = new Image();

    cover.src =
      pageUrl(item, 1);

    cover.alt = '';

    const info =
      document.createElement('div');

    for (
      const [tag, css, value]
      of [

        [
          'span',
          'eyebrow',
          '발간 제' + item.number + '호'
        ],

        [
          'h2',
          '',
          item.title
        ],

        [
          'span',
          'meta',
          item.date + ' · ' +
          item.pages + '쪽'
        ],

        [
          'span',
          'open',
          '공개 소개판 읽기 →'
        ]

      ]
    ) {

      const element =
        document.createElement(tag);

      element.className = css;

      element.textContent = value;

      info.append(element);

    }

    card.append(
      cover,
      info
    );

    byId('books').append(card);

  }

}

// ==========================================
// 전자책 열람
// ==========================================

function renderReader(item) {

  const reader = byId('reader');
  const stage = byId('stage');
  const sheet = byId('sheet');
  const image = byId('page');
  const target = byId('page-number');

  const previous = byId('prev');
  const next = byId('next');
  const full = byId('fullscreen');
  const toc = byId('toc');

  const reducedMotion =
    matchMedia(
      '(prefers-reduced-motion: reduce)'
    );

  let page = 0;
  let zoom = 100;
  let touchStart;
  let animation;

  byId('shelf').hidden = true;

  reader.hidden = false;

  document.body.classList.add(
    'reading'
  );

  byId('book-title').textContent =
    item.title;

  document.title =
    item.title +
    ' | 전자책 도서관';

  target.max = item.pages;

  byId('count').textContent =
    '/ ' + item.pages;

  for (
    const [level, label, number]
    of item.contents
  ) {

    toc.add(
      new Option(
        (level > 1 ? '　' : '') +
        label,
        number
      )
    );

  }

  // ======================================
  // 화면 크기 조정
  // ======================================

  function resize() {

    const style =
      getComputedStyle(stage);

    const width =
      stage.clientWidth -
      2 * parseFloat(
        style.paddingLeft
      );

    const height =
      stage.clientHeight -
      2 * parseFloat(
        style.paddingTop
      );

    if (!width || !height) {
      return;
    }

    const fitted =
      stage.clientWidth < 640
        ? width
        : Math.min(
            width,
            height *
            595.32 / 841.92
          );

    sheet.style.setProperty(
      '--page-width',
      Math.max(1, fitted) *
      zoom / 100 +
      'px'
    );

  }

  // ======================================
  // 페이지 표시
  // ======================================

  function show(
    number,
    animate = true
  ) {

    if (
      !Number.isInteger(number) ||
      number < 1 ||
      number > item.pages ||
      number === page
    ) {

      target.value = page;

      return;

    }

    const direction =
      Math.sign(number - page);

    animation?.cancel();

    page = number;

    image.src =
      pageUrl(item, page);

    image.alt =
      '발간 제' +
      item.number +
      '호 ' +
      page +
      '쪽';

    target.value = page;

    previous.disabled =
      page === 1;

    next.disabled =
      page === item.pages;

    byId('status').textContent =
      page +
      ' / ' +
      item.pages +
      '쪽';

    stage.scrollTo(0, 0);

    if (
      animate &&
      !reducedMotion.matches &&
      typeof sheet.animate === 'function'
    ) {

      animation = sheet.animate(

        [
          {
            transform:
              'rotateY(' +
              (-24 * direction) +
              'deg)',

            opacity: 0.6
          },

          {
            transform:
              'rotateY(0deg)',

            opacity: 1
          }
        ],

        {
          duration: 240,
          easing: 'ease-out'
        }

      );

    }

    for (
      const adjacent
      of [
        page - 1,
        page + 1
      ]
    ) {

      if (
        adjacent >= 1 &&
        adjacent <= item.pages
      ) {

        new Image().src =
          pageUrl(
            item,
            adjacent
          );

      }

    }

  }

  // ======================================
  // 확대 및 축소
  // ======================================

  function changeZoom(percent) {

    zoom = Math.min(
      250,
      Math.max(
        75,
        percent
      )
    );

    byId('reset-zoom').textContent =
      zoom + '%';

    byId('smaller').disabled =
      zoom === 75;

    byId('bigger').disabled =
      zoom === 250;

    stage.classList.toggle(
      'fit',
      zoom <= 100
    );

    resize();

  }

  // ======================================
  // 전체화면
  // ======================================

  const isFull = () =>
    document.fullscreenElement === reader ||
    reader.classList.contains(
      'expanded'
    );

  function syncFullscreen() {

    full.textContent =
      isFull()
        ? '전체화면 종료'
        : '전체화면';

    full.setAttribute(
      'aria-pressed',
      String(isFull())
    );

    resize();

  }

  full.addEventListener(
    'click',
    async () => {

      if (
        document.fullscreenElement === reader
      ) {

        await document.exitFullscreen();

      } else if (
        reader.classList.contains(
          'expanded'
        )
      ) {

        reader.classList.remove(
          'expanded'
        );

      } else {

        try {

          await reader.requestFullscreen();

        } catch {

          reader.classList.add(
            'expanded'
          );

        }

      }

      syncFullscreen();

    }
  );

  document.addEventListener(
    'fullscreenchange',
    syncFullscreen
  );

  // ======================================
  // 페이지 이동 버튼
  // ======================================

  previous.addEventListener(
    'click',
    () => show(page - 1)
  );

  next.addEventListener(
    'click',
    () => show(page + 1)
  );

  byId('jump').addEventListener(
    'submit',
    event => {

      event.preventDefault();

      show(
        target.valueAsNumber
      );

    }
  );

  // ======================================
  // 목차 이동
  // ======================================

  toc.addEventListener(
    'change',
    () => {

      if (toc.value) {

        show(
          Number(toc.value)
        );

      }

      toc.value = '';

    }
  );

  // ======================================
  // 확대 및 축소 버튼
  // ======================================

  byId('smaller').addEventListener(
    'click',
    () => changeZoom(
      zoom - 25
    )
  );

  byId('bigger').addEventListener(
    'click',
    () => changeZoom(
      zoom + 25
    )
  );

  byId('reset-zoom').addEventListener(
    'click',
    () => changeZoom(100)
  );

  // ======================================
  // 키보드 이동
  // ======================================

  document.addEventListener(
    'keydown',
    event => {

      if (
        event.key === 'Escape' &&
        reader.classList.contains(
          'expanded'
        )
      ) {

        reader.classList.remove(
          'expanded'
        );

        syncFullscreen();

      }

      if (
        event.defaultPrevented ||
        event.altKey ||
        event.ctrlKey ||
        event.metaKey ||
        event.target.closest?.(
          'input, select, textarea'
        )
      ) {
        return;
      }

      if (
        event.key === 'ArrowLeft' ||
        event.key === 'ArrowRight'
      ) {

        event.preventDefault();

        show(
          page +
          (
            event.key === 'ArrowRight'
              ? 1
              : -1
          )
        );

      }

    }
  );

  // ======================================
  // 모바일 터치 이동
  // ======================================

  stage.addEventListener(
    'touchstart',
    event => {

      touchStart =
        zoom <= 100 &&
        event.touches.length === 1
          ? event.touches[0]
          : null;

    },
    {
      passive: true
    }
  );

  stage.addEventListener(
    'touchcancel',
    () => {

      touchStart = null;

    },
    {
      passive: true
    }
  );

  stage.addEventListener(
    'touchend',
    event => {

      if (
        !touchStart ||
        event.touches.length
      ) {
        return;
      }

      const end =
        event.changedTouches[0];

      const dx =
        end.clientX -
        touchStart.clientX;

      const dy =
        end.clientY -
        touchStart.clientY;

      touchStart = null;

      if (
        Math.abs(dx) > 48 &&
        Math.abs(dx) >
        1.5 * Math.abs(dy)
      ) {

        show(
          page +
          (
            dx < 0
              ? 1
              : -1
          )
        );

      }

    },
    {
      passive: true
    }
  );

  // ======================================
  // 초기화
  // ======================================

  new ResizeObserver(
    resize
  ).observe(stage);

  changeZoom(100);

  syncFullscreen();

  show(1, false);

}

// ==========================================
// 실행
// ==========================================

if (book) {

  renderReader(book);

} else {

  renderShelf();

}

</script>
