====================\n   자료실 안내\n========================================== */\n\n.grade-guide {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(220px, 1fr));\n  gap: 15px;\n  margin-top: 20px;\n}\n\n.grade-item {\n  padding: 18px;\n  border-radius: 9px;\n  background: #f4f8fc;\n  border: 1px solid #dce6f2;\n}\n\n.grade-item strong {\n  display: block;\n  margin-bottom: 8px;\n  color: #0754a6;\n}\n\n/* ==========================================\n   검색 및 분류\n========================================== */\n\n.search-box {\n  margin-bottom: 20px;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 15px;\n  border: 1px solid #c5d5e8;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n}\n\n.filters button {\n  padding: 10px 17px;\n  border: 1px solid #0754a6;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n/* ==========================================\n   자료 목록\n========================================== */\n\n.library-grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(280px, 1fr));\n  gap: 22px;\n}\n\n.document {\n  background: white;\n  border-radius: 12px;\n  overflow: hidden;\n  box-shadow: 0 3px 12px #00000012;\n  border-top: 5px solid #168de0;\n}\n\n.document-body {\n  padding: 24px;\n}\n\n.document h3 {\n  color: #0754a6;\n  margin: 12px 0;\n  line-height: 1.5;\n}\n\n.document p {\n  color: #46566d;\n}\n\n.document-meta {\n  font-size: 14px;\n  color: #68788c;\n}\n\n.document-cover {\n  height: 190px;\n  background: linear-gradient(\n    135deg,\n    #e5effb,\n    #d0e3f7\n  );\n\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  overflow: hidden;\n}\n\n.document-cover img {\n  width: 100%;\n  height: 100%;\n  object-fit: contain;\n}\n\n.cover-placeholder {\n  font-size: 52px;\n  color: #0754a6;\n}\n\n.badges {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 7px;\n}\n\n.badge {\n  display: inline-block;\n  padding: 4px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  font-weight: bold;\n  background: #e7f1ff;\n  color: #0754a6;\n}\n\n.grade-1 {\n  background: #fce8e8;\n  color: #9b2020;\n}\n\n.grade-2 {\n  background: #fff3d9;\n  color: #8a5900;\n}\n\n.grade-3 {\n  background: #e6f4ea;\n  color: #176534;\n}\n\n/* ==========================================\n   버튼\n========================================== */\n\n.action-row {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  margin-top: 18px;\n}\n\n.action-button {\n  padding: 10px 15px;\n  background: #0754a6;\n  color: white;\n  border: none;\n  border-radius: 6px;\n  font-weight: bold;\n}\n\n.action-button:hover {\n  background: #003a7a;\n}\n\n.action-button.secondary {\n  background: #e7f1ff;\n  color: #0754a6;\n}\n\n.action-button:disabled {\n  opacity: .5;\n  cursor: not-allowed;\n}\n\n/* ==========================================\n   메시지\n========================================== */\n\n.message {\n  padding: 18px;\n  background: #eef4fb;\n  border-radius: 8px;\n  margin-bottom: 20px;\n  white-space: pre-line;\n  overflow-wrap: anywhere;\n}\n\n.message.error {\n  background: #fff1f2;\n  color: #991b1b;\n}\n\n.message.success {\n  background: #e8f5e9;\n  color: #176534;\n}\n\n.empty {\n  text-align: center;\n  padding: 40px;\n  color: #68788c;\n}\n\n/* ==========================================\n   자료 상세\n========================================== */\n\n.detail-panel {\n  margin-top: 30px;\n  border-top: 4px solid #0754a6;\n}\n\n.detail-panel h3 {\n  color: #0754a6;\n}\n\n.detail-text {\n  white-space: pre-wrap;\n  overflow-wrap: anywhere;\n}\n\n/* ==========================================\n   하단\n========================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\n/* ==========================================\n   모바일\n========================================== */\n\n@media(max-width:600px) {\n\n  header {\n    padding: 35px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .panel {\n    padding: 20px;\n  }\n\n  .document-body {\n    padding: 20px;\n  }\n\n}\n\n/* ==========================================\n   자료별 토론\n========================================== */\n\n#discussionContent {\n  width: 100%;\n  padding: 15px;\n  border: 1px solid #c5d5e8;\n  border-radius: 8px;\n  font: inherit;\n  resize: vertical;\n}\n\n.discussion-item {\n  padding: 20px;\n  margin-bottom: 15px;\n  background: #f8fbff;\n  border: 1px solid #dce6f2;\n  border-radius: 9px;\n}\n\n.discussion-author {\n  font-weight: bold;\n  color: #0754a6;\n}\n\n.discussion-date {\n  font-size: 13px;\n  color: #68788c;\n}\n\n.discussion-content {\n  margin-top: 12px;\n  white-space: pre-wrap;\n  overflow-wrap: anywhere;\n}\n\n.discussion-actions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  margin-top: 12px;\n}\n\n/* ==========================================\n   토론 답글 계층 표시\n========================================== */\n\n.discussion-reply {\n  margin-top: 15px;\n  margin-left: 28px;\n  padding: 18px;\n  background: #f0f6ff;\n  border: 1px solid #c8d9ef;\n  border-left: 4px solid #0b56a8;\n  border-radius: 8px;\n}\n\n.discussion-reply-label {\n  font-size: 14px;\n  font-weight: bold;\n  color: #0b56a8;\n  margin-bottom: 10px;\n}\n\n@media (max-width: 600px) {\n\n  .discussion-reply {\n    margin-left: 12px;\n    padding: 12px;\n  }\n\n}\n  \n/* ==========================================\n   토론 게시글 버튼 배치 개선\n========================================== */\n\n.discussion-item {\n  display: flow-root;\n}\n\n.discussion-item > .discussion-actions {\n  display: inline-flex;\n  vertical-align: middle;\n  margin-top: 12px;\n  margin-right: 8px;\n}\n\n.discussion-item > .action-button {\n  display: inline-block;\n  vertical-align: middle;\n  margin-top: 12px;\n}\n\n.discussion-reply-editor {\n  clear: both;\n  margin-top: 15px;\n  padding: 15px;\n  background: #eef4fb;\n  border-radius: 8px;\n}\n\n.discussion-reply-editor textarea {\n  width: 100%;\n  padding: 12px;\n  border: 1px solid #c5d5e8;\n  border-radius: 7px;\n  font: inherit;\n  resize: vertical;\n}\n  \n</style>\n\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"index.html\"><span aria-hidden=\"true\">←</span>홈페이지로</a></div>\n\n\n\u003c!-- ==========================================\n     상단\n========================================== -->\n\n<header>\n\n<h1>글로벌 AI 허브 지식자료실</h1>\n\n<p>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</p>\n\n<p>\n전자책 · 정책자료 · 연구보고서 · 회원 토론\n</p>\n\n<div class=\"top-links\">\n\n\n\n<a href=\"index.html?view=login&amp;return=library.html\">\n회원 로그인\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- ==========================================\n     자료실 소개\n========================================== -->\n\n<section class=\"panel\">\n\n<h2>지식자료실 안내</h2>\n\n<p>\n글로벌 AI 허브 유치와 관련된 전자책,\n정책자료, 연구보고서 및 시민사회 자료를\n공유하는 공간입니다.\n</p>\n\n<p>\n자료마다 공개 등급을 개별적으로 지정하며,\n회원 자격과 관리자의 승인 여부에 따라\n열람 범위가 달라집니다.\n</p>\n\n<div class=\"grade-guide\">\n\n<div class=\"grade-item\">\n\n<strong>3급 · 공개자료</strong>\n\n비회원도 원문을 열람할 수 있습니다.\n\n</div>\n\n<div class=\"grade-item\">\n\n<strong>2급 · 회원자료</strong>\n\n가입 승인을 받은 회원에게\n원문을 공개합니다.\n\n</div>\n\n<div class=\"grade-item\">\n\n<strong>1급 · 대외비 자료</strong>\n\n승인 회원에게 제목과 초록을 공개합니다.\n\n원문은 신원확인과 자료별 승인을\n받은 회원만 열람할 수 있습니다.\n\n</div>\n\n</div>\n\n<div\n  id=\"memberStatus\"\n  class=\"member-status\"\n  aria-live=\"polite\"\n>\n회원 상태 확인 중...\n</div>\n\n</section>\n\n\u003c!-- ==========================================\n     자료 검색\n========================================== -->\n\n<section class=\"panel\">\n\n<h2>자료 검색</h2>\n\n<div class=\"search-box\">\n\n<input\n  type=\"search\"\n  id=\"searchInput\"\n  placeholder=\"자료 제목, 저자 또는 키워드 검색\"\n  aria-label=\"지식자료 검색\"\n>\n\n</div>\n\n<div class=\"filters\" id=\"typeFilters\">\n\n<button\n  class=\"active\"\n  data-type=\"all\"\n  aria-pressed=\"true\"\n>\n전체 자료\n</button>\n\n<button data-type=\"ebook\" aria-pressed=\"false\">\n전자책\n</button>\n\n<button data-type=\"policy\" aria-pressed=\"false\">\n정책·연구자료\n</button>\n\n<button data-type=\"other\" aria-pressed=\"false\">\n기타 자료\n</button>\n\n</div>\n\n</section>\n\n\u003c!-- ==========================================\n     자료 목록\n========================================== -->\n\n<section>\n\n<h2>전자책 · 정책자료 목록</h2>\n\n<div\n  id=\"libraryMessage\"\n  class=\"message\"\n  role=\"status\"\n>\n자료 목록을 불러오는 중입니다.\n</div>\n\n<div\n  id=\"library\"\n  class=\"library-grid\"\n>\n</div>\n\n<p\n  id=\"empty\"\n  class=\"empty\"\n  hidden\n>\n검색 조건에 맞는 자료가 없습니다.\n</p>\n\n</section>\n\n\u003c!-- ==========================================\n     자료 상세\n========================================== -->\n\n<section\n  id=\"detailPanel\"\n  class=\"panel detail-panel\"\n  hidden\n>\n\n<h2>자료 상세정보</h2>\n\n<h3 id=\"detailTitle\"></h3>\n\n<p id=\"detailMeta\"></p>\n\n<div\n  id=\"detailAbstract\"\n  class=\"detail-text\"\n></div>\n\n<h3>상세 설명</h3>\n\n<div\n  id=\"detailDescription\"\n  class=\"detail-text\"\n></div>\n  \n<div class=\"action-row\">\n\n<button\n  id=\"detailOpenButton\"\n  class=\"action-button\"\n  type=\"button\"\n>\n원문 열람\n</button>\n\n<button\n  id=\"detailDiscussionButton\"\n  class=\"action-button secondary\"\n  type=\"button\"\n>\n자료별 토론\n</button>\n\n</div>\n\n<div\n  id=\"detailMessage\"\n  class=\"message\"\n  role=\"status\"\n  hidden\n></div>\n\n</section>\n\n\u003c!-- 자료별 토론 -->\n\n<section\n  id=\"discussionPanel\"\n  class=\"panel detail-panel\"\n  hidden\n>\n\n  <h2>자료별 회원 토론</h2>\n\n  <h3 id=\"discussionTitle\"></h3>\n\n  <div\n    id=\"discussionMessage\"\n    class=\"message\"\n    role=\"status\"\n    aria-live=\"polite\"\n  ></div>\n\n  <div id=\"discussionList\"></div>\n\n  <div id=\"discussionEditor\" hidden>\n\n    <h3 id=\"discussionEditorTitle\">\n      의견 작성\n    </h3>\n\n    <textarea\n      id=\"discussionContent\"\n      maxlength=\"5000\"\n      rows=\"6\"\n      placeholder=\"자료에 대한 의견을 작성해 주세요.\"\n      aria-label=\"토론 의견\"\n    ></textarea>\n\n    <div class=\"action-row\">\n\n      <button\n        id=\"discussionSaveButton\"\n        class=\"action-button\"\n        type=\"button\"\n      >\n        의견 등록\n      </button>\n\n      <button\n        id=\"discussionCancelButton\"\n        class=\"action-button secondary\"\n        type=\"button\"\n        hidden\n      >\n        수정 취소\n      </button>\n\n    </div>\n\n  </div>\n\n\n  \n</section>\n\n</main>\n\n<footer>\n\n<p>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</p>\n\n<p>\n시민의 힘으로, 경기도의 역량으로, 세계와 함께!\n</p>\n\n</footer>\n\n\u003c!-- ==========================================\n     Supabase 연결 및 자료실 모듈\n========================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient } from\n\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* ==========================================\n   1. Supabase 설정\n========================================== */\n\nconst SUPABASE_URL =\n\"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n\"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* ==========================================\n   2. 기본 상태\n========================================== */\n\nconst $ = id =>\n  document.getElementById(id);\n\nlet currentUser = null;\n\nlet currentProfile = null;\n\nlet documents = [];\n\nlet currentType = \"all\";\n\nlet selectedDocument = null;\n\n/* ==========================================\n   3. 자료 종류 판별\n========================================== */\n\nfunction normalizeDocumentType(type) {\n\n  const value = String(type || \"\")\n    .trim()\n    .toLowerCase();\n\n  if (\n    value === \"ebook\" ||\n    value === \"e-book\" ||\n    value === \"book\" ||\n    value === \"전자책\"\n  ) {\n    return \"ebook\";\n  }\n\n  if (\n    value === \"policy\" ||\n    value === \"report\" ||\n    value === \"research\" ||\n    value === \"정책자료\" ||\n    value === \"연구자료\" ||\n    value === \"연구보고서\"\n  ) {\n    return \"policy\";\n  }\n\n  return \"other\";\n}\n\nfunction typeName(type) {\n\n  if(type === \"ebook\") {\n    return \"전자책\";\n  }\n\n  if(type === \"policy\") {\n    return \"정책·연구자료\";\n  }\n\n  return \"기타 자료\";\n}\n\n/* ==========================================\n   4. 공개 등급\n========================================== */\n\nfunction gradeName(grade) {\n\n  if(grade === 1) {\n    return \"1급 · 대외비\";\n  }\n\n  if(grade === 2) {\n    return \"2급 · 회원자료\";\n  }\n\n  if(grade === 3) {\n    return \"3급 · 공개자료\";\n  }\n\n  return \"등급 미확인\";\n}\n\n/* ==========================================\n   5. 회원 확인\n========================================== */\n\nasync function checkMember() {\n\n  currentUser = null;\n  currentProfile = null;\n\n  try {\n\n    const {\n      data,\n      error\n    } = await supabase.auth.getUser();\n\n    if(error || !data.user) {\n\n      $(\"memberStatus\").textContent =\n        \"현재 비회원 상태입니다.\\n\" +\n        \"3급 공개자료를 열람할 수 있습니다.\";\n\n      return;\n    }\n\n    currentUser = data.user;\n\n    const {\n      data: profile,\n      error: profileError\n    } = await supabase\n      .from(\"profiles\")\n      .select(\n        \"member_role,approval_status\"\n      )\n      .eq(\"id\",currentUser.id)\n      .single();\n\n    if(profileError) {\n      throw profileError;\n    }\n\n    currentProfile = profile;\n\n    if(\n      profile.approval_status === \"approved\"\n    ) {\n\n      $(\"memberStatus\").textContent =\n        \"로그인 상태: 로그인됨\\n\" +\n        \"회원 승인: 완료\\n\" +\n        \"2급 회원자료 열람 가능\\n\" +\n        \"1급 자료는 별도 승인이 필요합니다.\";\n\n    } else {\n\n      $(\"memberStatus\").textContent =\n        \"로그인 상태: 로그인됨\\n\" +\n        \"회원 승인 상태: \" +\n        profile.approval_status +\n        \"\\n관리자 승인 후 회원자료를 열람할 수 있습니다.\";\n\n    }\n\n  } catch(error) {\n\n    $(\"memberStatus\").textContent =\n      \"회원 상태 확인 실패: \" +\n      error.message;\n\n  }\n\n}\n\n/* ==========================================\n   6. 자료 목록 조회\n========================================== */\n\nasync function loadDocuments() {\n\n  $(\"libraryMessage\").hidden = false;\n\n  $(\"libraryMessage\").textContent =\n    \"자료 목록을 불러오는 중입니다.\";\n\n  try {\n\n    const {\n  data,\n  error\n} = await supabase.rpc(\n  \"get_knowledge_catalog_v2\"\n);\n\n    if(error) {\n      throw error;\n    }\n\n    documents = Array.isArray(data)\n      ? data\n      : [];\n\n    renderDocuments();\n\n    $(\"libraryMessage\").hidden = true;\n\n  } catch(error) {\n\n    $(\"libraryMessage\").hidden = false;\n\n    $(\"libraryMessage\").className =\n      \"message error\";\n\n    $(\"libraryMessage\").textContent =\n      \"자료 목록 조회 실패: \" +\n      error.message;\n\n  }\n\n}\n\n/* ==========================================\n   7. 자료 검색\n========================================== */\n\nfunction filteredDocuments() {\n\n  const keyword = $(\"searchInput\")\n    .value\n    .trim()\n    .toLowerCase();\n\n  return documents.filter(doc => {\n\n    const type =\n      normalizeDocumentType(\n        doc.document_type\n      );\n\n    const typeMatch =\n      currentType === \"all\" ||\n      type === currentType;\n\n    const searchText = [\n      doc.title,\n      doc.abstract,\n      doc.author,\n      doc.category\n    ]\n    .filter(Boolean)\n    .join(\" \")\n    .toLowerCase();\n\n    return (\n      typeMatch &&\n      searchText.includes(keyword)\n    );\n\n  });\n\n}\n\n/* ==========================================\n   8. 자료 카드 생성\n========================================== */\n\nfunction createDocumentCard(doc) {\n\n  const card =\n    document.createElement(\"article\");\n\n  card.className = \"document\";\n\n  const body =\n    document.createElement(\"div\");\n\n  body.className = \"document-body\";\n\n  const badges =\n    document.createElement(\"div\");\n\n  badges.className = \"badges\";\n\n  const type =\n    normalizeDocumentType(\n      doc.document_type\n    );\n\n  const typeBadge =\n    document.createElement(\"span\");\n\n  typeBadge.className = \"badge\";\n\n  typeBadge.textContent =\n    typeName(type);\n\n  badges.appendChild(typeBadge);\n\n  const grade =\n    Number(doc.security_grade);\n\n  const gradeBadge =\n    document.createElement(\"span\");\n\n  gradeBadge.className =\n    \"badge grade-\" + grade;\n\n  gradeBadge.textContent =\n    gradeName(grade);\n\n  badges.appendChild(gradeBadge);\n\n// ==========================================\n// 제188-13단계\n// 공개·비공개 상태 표시 통합\n// publishBadge 중복 선언 오류 수정\n// ==========================================\n\nconst publishBadge =\n  document.createElement(\"span\");\n\npublishBadge.className = \"badge\";\n\nif (doc.is_published === true) {\n\n  publishBadge.textContent = \"공개자료\";\n\n  publishBadge.classList.add(\"grade-3\");\n\n} else {\n\n  publishBadge.textContent = \"비공개자료\";\n\n  publishBadge.classList.add(\"grade-1\");\n\n  publishBadge.style.background =\n    \"#fce8e8\";\n\n  publishBadge.style.color =\n    \"#9b2020\";\n\n}\n\nbadges.appendChild(publishBadge);\n  \n  const title =\n    document.createElement(\"h3\");\n\n  title.textContent =\n    doc.title || \"제목 없음\";\n\n  const meta =\n    document.createElement(\"p\");\n\n  meta.className = \"document-meta\";\n\n  meta.textContent = [\n    doc.author || \"\",\n    doc.published_at || \"\"\n  ]\n  .filter(Boolean)\n  .join(\" · \");\n\n  const abstract =\n    document.createElement(\"p\");\n\n  abstract.textContent =\n    doc.abstract ||\n    \"등록된 초록이 없습니다.\";\n\n  const actions =\n    document.createElement(\"div\");\n\n  actions.className = \"action-row\";\n\n  const detailButton =\n    document.createElement(\"button\");\n\n  detailButton.type = \"button\";\n\n  detailButton.className =\n    \"action-button secondary\";\n\n  detailButton.textContent =\n    \"상세정보\";\n\n  detailButton.addEventListener(\n    \"click\",\n    () => showDocumentDetail(doc)\n  );\n\n  const openButton =\n    document.createElement(\"button\");\n\n  openButton.type = \"button\";\n\n  openButton.className =\n    \"action-button\";\n\n  openButton.textContent =\n    \"원문 열람\";\n\n  openButton.addEventListener(\n    \"click\",\n    () => openDocument(doc,openButton)\n  );\n\n  actions.appendChild(detailButton);\n  actions.appendChild(openButton);\n\n/* ==========================================\n   제188-20-2단계\n   전자책 공개 표지 표시\n========================================== */\n\n// 전자책별 공개 표지 주소\n\nconst ebookCoverUrls = {\n\n  9: \"ebooks/assets/ebook-covers/issue-01.webp\",\n\n  10: \"ebooks/assets/ebook-covers/issue-02.webp\"\n\n};\n\n// 현재 자료의 표지 주소 확인\n\nconst coverUrl =\n  ebookCoverUrls[Number(doc.id)] ||\n  doc.thumbnail_url;\n\n// 전자책 표지 표시\n\nif (\n  type === \"ebook\" &&\n  coverUrl\n) {\n\n  const cover =\n    document.createElement(\"div\");\n\n  cover.className =\n    \"document-cover\";\n\n  const img =\n    document.createElement(\"img\");\n\n  img.src = coverUrl;\n\n  img.alt =\n    (doc.title || \"전자책\") +\n    \" 표지\";\n\n  img.loading = \"lazy\";\n\n  img.onerror = () => {\n\n    cover.remove();\n\n  };\n\n  cover.appendChild(img);\n\n  card.appendChild(cover);\n\n}\n\nbody.appendChild(badges);\nbody.appendChild(title);\nbody.appendChild(meta);\nbody.appendChild(abstract);\nbody.appendChild(actions);\n\ncard.appendChild(body);\n\n  return card;\n\n}\n\n/* ==========================================\n   9. 자료 목록 표시\n========================================== */\n\nfunction renderDocuments() {\n\n  const filtered =\n    filteredDocuments();\n\n  const library = $(\"library\");\n\n  library.replaceChildren();\n\n  filtered.forEach(doc => {\n\n    library.appendChild(\n      createDocumentCard(doc)\n    );\n\n  });\n\n  $(\"empty\").hidden =\n    filtered.length !== 0;\n\n}\n\n/* ==========================================\n   10. 자료 상세\n========================================== */\n\nfunction showDocumentDetail(doc) {\n\n  // 다른 자료 선택 시 이전 토론 화면 초기화\n\n  discussionRequestId++;\n\n  discussionDocument = null;\n\n  $(\"discussionPanel\").hidden = true;\n\n  $(\"discussionList\").replaceChildren();\n\n  $(\"discussionEditor\").hidden = true;\n\n  resetDiscussionEditor();\n  \n  selectedDocument = doc;\n\n  $(\"detailTitle\").textContent =\n    doc.title || \"제목 없음\";\n\n $(\"detailMeta\").textContent = [\n  typeName(\n    normalizeDocumentType(\n      doc.document_type\n    )\n  ),\n\n  gradeName(\n    Number(doc.security_grade)\n  ),\n\n  doc.is_published\n    ? \"공개자료\"\n    : \"비공개자료\",\n\n  doc.author || \"\",\n\n  doc.published_at || \"\"\n]\n.filter(Boolean)\n.join(\" · \");   \n\nconst abstractText =\n  doc.abstract ||\n  \"등록된 초록이 없습니다.\";\n\nconst descriptionText =\n  doc.description || \"\";\n\n$(\"detailAbstract\").textContent =\n  descriptionText\n    ? \"【초록】\\n\" +\n      abstractText +\n      \"\\n\\n【상세설명】\\n\" +\n      descriptionText\n    : \"【초록】\\n\" +\n      abstractText;\n  \n  /* 상세 설명 표시 */\n\n$(\"detailDescription\").textContent =\n  doc.description ||\n  \"등록된 상세 설명이 없습니다.\";\n\n  $(\"detailMessage\").hidden = true;\n\n  $(\"detailPanel\").hidden = false;\n\n  $(\"detailPanel\").scrollIntoView({\n    behavior:\"smooth\",\n    block:\"start\"\n  });\n\n}\n\n/* ==========================================\n   11. 자료 열람\n========================================== */\n\nasync function openDocument(\n  doc,\n  button = null\n) {\n\n  const grade =\n    Number(doc.security_grade);\n\n  if(\n    grade !== 1 &&\n    grade !== 2 &&\n    grade !== 3\n  ) {\n\n    alert(\n      \"자료의 공개 등급을 확인할 수 없습니다.\"\n    );\n\n    return;\n  }\n\n  if(\n    grade <= 2 &&\n    (\n      !currentUser ||\n      currentProfile?.approval_status\n        !== \"approved\"\n    )\n  ) {\n\n    alert(\n      \"이 자료는 승인된 회원만 열람할 수 있습니다.\\n\" +\n      \"로그인 및 회원 승인을 확인해 주세요.\"\n    );\n\n    return;\n  }\n\n  // ==========================================\n  // Open all registered e-books through the reader's document-ID route.\n  if (normalizeDocumentType(doc.document_type) === \"ebook\") {\n    const documentId = Number(doc.id);\n    if (!Number.isSafeInteger(documentId) || documentId < 1) {\n      alert(\"올바른 전자책 자료 ID가 필요합니다.\");\n      return;\n    }\n\n    const reader = new URL(\"ebook-reader.html\", window.location.href);\n    reader.searchParams.set(\"document_id\", String(documentId));\n    window.location.assign(reader.href);\n    return;\n  }\n\n  const originalText =\n    button?.textContent;\n\n  if(button) {\n\n    button.disabled = true;\n\n    button.textContent =\n      \"접근 권한 확인 중...\";\n\n  }\n\n  try {\n\n    const { data: sessionData, error: sessionError } = await supabase.auth.getSession();\n    const accessToken = sessionData?.session?.access_token;\n    if (grade <= 2 && (sessionError || !accessToken)) {\n      throw new Error(\"로그인 세션을 확인할 수 없습니다. 다시 로그인해 주세요.\");\n    }\n\n    const headers = {\n      \"Content-Type\": \"application/json\",\n      apikey: SUPABASE_KEY\n    };\n    if (accessToken) headers.Authorization = \"Bearer \" + accessToken;\n\n    const response = await fetch(\n      SUPABASE_URL +\n      \"/functions/v1/knowledge-document-access\",\n      {\n        method:\"POST\",\n\n        headers,\n\n        body:JSON.stringify({\n          document_id:doc.id\n        })\n      }\n    );\n\n    const result =\n      await response.json();\n\n    if(\n      !response.ok ||\n      !result.success\n    ) {\n\n      throw new Error(\n        result.error ||\n        result.message ||\n        \"자료 접근이 거부되었습니다.\"\n      );\n\n    }\n\n    if(!result.signed_url) {\n\n      throw new Error(\n        \"자료 열람 주소가 발급되지 않았습니다.\"\n      );\n\n    }\n\n    /*\n      서버가 발급한 임시 URL만 사용합니다.\n      HTML에 원문 파일 경로를 저장하지 않습니다.\n    */\n\n    const url = new URL(\n      result.signed_url\n    );\n\n    if(\n      url.protocol !== \"https:\" ||\n      url.origin !== SUPABASE_URL ||\n      !url.pathname.startsWith(\n        \"/storage/v1/object/sign/knowledge-private/\"\n      )\n    ) {\n\n      throw new Error(\n        \"허용되지 않은 자료 주소입니다.\"\n      );\n\n    }\n\n    const link =\n      document.createElement(\"a\");\n\n    link.href = url.href;\n\n    link.target = \"_blank\";\n\n    link.rel =\n      \"noopener noreferrer\";\n\n    document.body.appendChild(link);\n\n    link.click();\n\n    link.remove();\n\n  } catch(error) {\n\n    alert(\n      \"자료 열람 실패\\n\\n\" +\n      error.message\n    );\n\n  } finally {\n\n    if(button) {\n\n      button.disabled = false;\n\n      button.textContent =\n        originalText;\n\n    }\n\n  }\n\n}\n\n/* ==========================================\n   12. 자료별 토론 기능\n========================================== */\n\nlet discussionDocument = null;\nlet editingDiscussionId = null;\nlet discussionRequestId = 0;\n\nfunction showDiscussionMessage(message, isError = false) {\n\n  const box = $(\"discussionMessage\");\n\n  box.hidden = false;\n  box.className = isError\n    ? \"message error\"\n    : \"message\";\n\n  box.textContent = message;\n}\n\nfunction resetDiscussionEditor() {\n\n  editingDiscussionId = null;\n\n  $(\"discussionContent\").value = \"\";\n\n  $(\"discussionEditorTitle\").textContent =\n    \"의견 작성\";\n\n  $(\"discussionSaveButton\").textContent =\n    \"의견 등록\";\n\n  $(\"discussionCancelButton\").hidden = true;\n}\n\nasync function openDiscussion() {\n\n  if (!selectedDocument) return;\n\n  const requestId = ++discussionRequestId;\n\n  discussionDocument = selectedDocument;\n\n  const documentId = discussionDocument.id;\n\n  $(\"discussionPanel\").hidden = false;\n\n  $(\"discussionTitle\").textContent =\n    discussionDocument.title || \"자료별 토론\";\n\n  $(\"discussionList\").replaceChildren();\n\n  $(\"discussionEditor\").hidden = true;\n\n  resetDiscussionEditor();\n\n  $(\"discussionPanel\").scrollIntoView({\n    behavior: \"smooth\",\n    block: \"start\"\n  });\n\n  if (\n    !currentUser ||\n    currentProfile?.approval_status !== \"approved\"\n  ) {\n\n    showDiscussionMessage(\n      \"가입 승인을 받은 회원만 토론에 참여할 수 있습니다.\",\n      true\n    );\n\n    return;\n  }\n\n  showDiscussionMessage(\n    \"토론 게시글을 불러오는 중입니다.\"\n  );\n\n  try {\n\n    const { data, error } = await supabase.rpc(\n  \"get_knowledge_discussions_v2\",\n  {\n    p_document_id: documentId\n  }\n);\n\n    if (requestId !== discussionRequestId) return;\n\n    if (error) throw error;\n\n    renderDiscussions(data || []);\n\n    $(\"discussionEditor\").hidden = false;\n\n    showDiscussionMessage(\n      \"토론 게시글 \" + (data || []).length + \"건\"\n    );\n\n  } catch (error) {\n\n    if (requestId !== discussionRequestId) return;\n\n    $(\"discussionList\").replaceChildren();\n    $(\"discussionEditor\").hidden = true;\n\n    showDiscussionMessage(\n      \"토론 조회 실패: \" + error.message,\n      true\n    );\n  }\n}\n\n/* ==========================================\n   게시글 목록 표시\n========================================== */\n\nfunction renderDiscussions(items) {\n\n  const list = $(\"discussionList\");\n\n  list.replaceChildren();\n\n  if (!items.length) {\n\n    const empty = document.createElement(\"p\");\n\n    empty.className = \"empty\";\n\n    empty.textContent =\n      \"아직 등록된 의견이 없습니다.\";\n\n    list.appendChild(empty);\n\n    return;\n  }\n\n  items.forEach(item => {\n\n    const article = document.createElement(\"article\");\n\n    article.className = \"discussion-item\";\n\n    const author = document.createElement(\"div\");\n\n    author.className = \"discussion-author\";\n\n    author.textContent =\n      item.author_name || \"회원\";\n\n    const date = document.createElement(\"div\");\n\n    date.className = \"discussion-date\";\n\n    date.textContent =\n      new Date(item.created_at).toLocaleString(\"ko-KR\");\n\n    const content = document.createElement(\"div\");\n\n    content.className = \"discussion-content\";\n\n    content.textContent = item.content || \"\";\n\n    article.append(author, date, content);\n\n    /* =====================================\n       본인 게시글 수정 및 삭제\n    ===================================== */\n\n    if (currentUser?.id === item.user_id) {\n\n      const actions = document.createElement(\"div\");\n\n      actions.className = \"discussion-actions\";\n\n      const editButton = document.createElement(\"button\");\n\n      editButton.type = \"button\";\n\n      editButton.className =\n        \"action-button secondary\";\n\n      editButton.textContent = \"수정\";\n\n      editButton.addEventListener(\"click\", () => {\n\n        editingDiscussionId = item.id;\n\n        $(\"discussionContent\").value = item.content;\n\n        $(\"discussionEditorTitle\").textContent =\n          \"의견 수정\";\n\n        $(\"discussionSaveButton\").textContent =\n          \"수정 저장\";\n\n        $(\"discussionCancelButton\").hidden = false;\n\n        $(\"discussionEditor\").scrollIntoView({\n          behavior: \"smooth\"\n        });\n      });\n\n      const deleteButton = document.createElement(\"button\");\n\n      deleteButton.type = \"button\";\n\n      deleteButton.className =\n        \"action-button secondary\";\n\n      deleteButton.textContent = \"삭제\";\n\n      deleteButton.addEventListener(\"click\", async () => {\n\n        if (!confirm(\"이 의견을 삭제하시겠습니까?\")) {\n          return;\n        }\n\n        deleteButton.disabled = true;\n\n        try {\n\n          const { data, error } = await supabase.rpc(\n            \"delete_knowledge_discussion\",\n            {\n              p_discussion_id: item.id\n            }\n          );\n\n          if (error) throw error;\n\n          if (data !== true) {\n            throw new Error(\n              \"삭제할 게시글을 찾지 못했습니다.\"\n            );\n          }\n\n          await openDiscussion();\n\n        } catch (error) {\n\n          showDiscussionMessage(\n            \"삭제 실패: \" + error.message,\n            true\n          );\n\n        } finally {\n\n          deleteButton.disabled = false;\n        }\n      });\n\n      actions.append(editButton, deleteButton);\n\n      article.appendChild(actions);\n    }\n\n    /* =====================================\n       원본 게시글 답글 작성 기능\n    ===================================== */\n\n    if (item.parent_id === null) {\n\n      const replyButton =\n        document.createElement(\"button\");\n\n      replyButton.type = \"button\";\n\n      replyButton.className =\n        \"action-button secondary\";\n\n      replyButton.textContent = \"답글 작성\";\n\n      const replyBox =\n        document.createElement(\"div\");\n\n      replyBox.className =\n        \"discussion-reply-editor\";\n\n      replyBox.hidden = true;\n\n      const replyTextarea =\n        document.createElement(\"textarea\");\n\n      replyTextarea.rows = 4;\n\n      replyTextarea.maxLength = 5000;\n\n      replyTextarea.placeholder =\n        \"답글을 작성해 주세요.\";\n\n      replyTextarea.setAttribute(\n        \"aria-label\",\n        \"토론 답글\"\n      );\n\n      const replyActions =\n        document.createElement(\"div\");\n\n      replyActions.className =\n        \"discussion-actions\";\n\n      const replySaveButton =\n        document.createElement(\"button\");\n\n      replySaveButton.type = \"button\";\n\n      replySaveButton.className =\n        \"action-button\";\n\n      replySaveButton.textContent =\n        \"답글 등록\";\n\n      const replyCancelButton =\n        document.createElement(\"button\");\n\n      replyCancelButton.type = \"button\";\n\n      replyCancelButton.className =\n        \"action-button secondary\";\n\n      replyCancelButton.textContent =\n        \"취소\";\n\n      /* 답글 입력창 열기 */\n\n      replyButton.addEventListener(\"click\", () => {\n\n        replyBox.hidden = !replyBox.hidden;\n\n        if (!replyBox.hidden) {\n          replyTextarea.focus();\n        }\n      });\n\n      /* 답글 작성 취소 */\n\n      replyCancelButton.addEventListener(\"click\", () => {\n\n        replyBox.hidden = true;\n\n        replyTextarea.value = \"\";\n      });\n\n      /* 답글 저장 */\n\n      replySaveButton.addEventListener(\n        \"click\",\n        async () => {\n\n          await saveDiscussionReply(\n            item.document_id,\n            item.id,\n            replyTextarea.value,\n            replySaveButton\n          );\n\n        }\n      );\n\n      replyActions.append(\n        replySaveButton,\n        replyCancelButton\n      );\n\n      replyBox.append(\n        replyTextarea,\n        replyActions\n      );\n\n      article.append(\n        replyButton,\n        replyBox\n      );\n    }\n\n      /* =====================================\n       원본 게시글과 답글 구분\n    ===================================== */\n\n    if (item.parent_id === null) {\n\n      // 원본 게시글\n\n      article.dataset.discussionId = String(item.id);\n\n      list.appendChild(article);\n\n    } else {\n\n      // 답글\n\n      article.classList.add(\"discussion-reply\");\n\n      const replyLabel = document.createElement(\"div\");\n\n      replyLabel.className = \"discussion-reply-label\";\n\n      replyLabel.textContent = \"↳ 답글\";\n\n      article.prepend(replyLabel);\n\n      const parentArticle = Array.from(\n        list.querySelectorAll(\n          \".discussion-item[data-discussion-id]\"\n        )\n      ).find(\n        element =>\n          element.dataset.discussionId ===\n          String(item.parent_id)\n      );\n\n      if (parentArticle) {\n\n        parentArticle.appendChild(article);\n\n      } else {\n\n        // 원본 게시글을 찾지 못한 경우\n\n        list.appendChild(article);\n\n      }\n    }\n\n  });\n\n} \n\n  \n/* ==========================================\n   게시글 작성 및 수정\n========================================== */\n\nasync function saveDiscussion() {\n\n  if (!discussionDocument) return;\n\n  const documentId = discussionDocument.id;\n\n  const content =\n    $(\"discussionContent\").value.trim();\n\n  if (\n    content.length < 1 ||\n    content.length > 5000\n  ) {\n\n    showDiscussionMessage(\n      \"의견은 1자 이상 5,000자 이하로 작성해 주세요.\",\n      true\n    );\n\n    return;\n  }\n\n  const button = $(\"discussionSaveButton\");\n\n  button.disabled = true;\n\n  try {\n\n    let result;\n\n    /* =====================================\n       기존 게시글 수정\n    ===================================== */\n\n    if (editingDiscussionId !== null) {\n\n      result = await supabase.rpc(\n        \"update_knowledge_discussion\",\n        {\n          p_discussion_id: editingDiscussionId,\n          p_content: content\n        }\n      );\n\n    } else {\n\n      /* =====================================\n         신규 게시글 작성\n      ===================================== */\n\n      result = await supabase.rpc(\n        \"create_knowledge_discussion\",\n        {\n          p_document_id: documentId,\n          p_content: content\n        }\n      );\n\n    }\n\n    if (result.error) {\n      throw result.error;\n    }\n\n    if (\n      result.data === null ||\n      result.data === false\n    ) {\n\n      throw new Error(\n        \"게시글 저장 결과를 확인할 수 없습니다.\"\n      );\n    }\n\n    resetDiscussionEditor();\n\n    if (\n      discussionDocument?.id === documentId\n    ) {\n\n      await openDiscussion();\n\n    }\n\n  } catch (error) {\n\n    showDiscussionMessage(\n      \"의견 저장 실패: \" + error.message,\n      true\n    );\n\n  } finally {\n\n    button.disabled = false;\n\n  }\n\n}\n\n\n/* ==========================================\n   답글 작성 및 저장\n========================================== */\n\nasync function saveDiscussionReply(\n  documentId,\n  parentId,\n  content,\n  button\n) {\n\n  /* =====================================\n     현재 자료 확인\n  ===================================== */\n\n  if (\n    !discussionDocument ||\n    discussionDocument.id !== documentId\n  ) {\n    return;\n  }\n\n  /* =====================================\n     답글 내용 검증\n  ===================================== */\n\n  const replyContent = content.trim();\n\n  if (\n    replyContent.length < 1 ||\n    replyContent.length > 5000\n  ) {\n\n    showDiscussionMessage(\n      \"답글은 1자 이상 5,000자 이하로 작성해 주세요.\",\n      true\n    );\n\n    return;\n  }\n\n  /* =====================================\n     중복 등록 방지\n  ===================================== */\n\n  button.disabled = true;\n\n  try {\n\n    /* =====================================\n       답글 작성 RPC 호출\n    ===================================== */\n\n    const { data, error } = await supabase.rpc(\n      \"create_knowledge_discussion_reply\",\n      {\n        p_document_id: documentId,\n        p_parent_id: parentId,\n        p_content: replyContent\n      }\n    );\n\n    if (error) {\n      throw error;\n    }\n\n    if (\n      data === null ||\n      data === false\n    ) {\n\n      throw new Error(\n        \"답글 저장 결과를 확인할 수 없습니다.\"\n      );\n    }\n\n    /* =====================================\n       답글 저장 후 목록 새로고침\n    ===================================== */\n\n    if (\n      discussionDocument?.id === documentId\n    ) {\n\n      await openDiscussion();\n\n    }\n\n  } catch (error) {\n\n    showDiscussionMessage(\n      \"답글 저장 실패: \" + error.message,\n      true\n    );\n\n  } finally {\n\n    button.disabled = false;\n\n  }\n\n}\n\n/* ==========================================\n   13. 검색 이벤트\n========================================== */\n\n$(\"searchInput\").addEventListener(\n  \"input\",\n  renderDocuments\n);\n\n/* ==========================================\n   14. 분류 이벤트\n========================================== */\n\ndocument\n  .querySelectorAll(\"[data-type]\")\n  .forEach(button => {\n\n    button.addEventListener(\n      \"click\",\n      () => {\n\n        currentType =\n          button.dataset.type;\n\n        document\n          .querySelectorAll(\"[data-type]\")\n          .forEach(btn => {\n\n            btn.classList.remove(\n              \"active\"\n            );\n\n            btn.setAttribute(\n              \"aria-pressed\",\n              \"false\"\n            );\n\n          });\n\n        button.classList.add(\n          \"active\"\n        );\n\n        button.setAttribute(\n          \"aria-pressed\",\n          \"true\"\n        );\n\n        renderDocuments();\n\n      }\n    );\n\n  });\n\n/* ==========================================\n   15. 상세 열람 버튼\n========================================== */\n\n$(\"detailOpenButton\")\n  .addEventListener(\n    \"click\",\n    () => {\n\n      if(selectedDocument) {\n\n        openDocument(\n          selectedDocument,\n          $(\"detailOpenButton\")\n        );\n\n      }\n\n    }\n  );\n\n/* ==========================================\n   16. 토론 이벤트\n========================================== */\n\n$(\"detailDiscussionButton\").addEventListener(\n  \"click\",\n  openDiscussion\n);\n\n$(\"discussionSaveButton\").addEventListener(\n  \"click\",\n  saveDiscussion\n);\n\n$(\"discussionCancelButton\").addEventListener(\n  \"click\",\n  resetDiscussionEditor\n);\n  \n/* ==========================================\n   17. 초기 실행\n========================================== */\n\nasync function initializeLibrary() {\n\n  await checkMember();\n\n  await loadDocuments();\n\n  const id = new URLSearchParams(window.location.search).get(\"document_id\");\n  const requested = id && documents.find(doc => String(doc.id) === id);\n  if (requested) showDocumentDetail(requested);\n\n}\n\ninitializeLibrary();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=en": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Digital Library | Global AI Hub Goyang</title>\n<style>\n* {box-sizing:border-box}\nbody {margin:0;color:#202e3d;background:#f4f7fb;font:1rem/1.6 system-ui,sans-serif}\nmain {max-width:70rem;margin:auto;padding:0 clamp(12px,3vw,24px) 2rem}\nh1,h2 {color:#173653} nav {display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0}\nnav a,article a {color:#164d7a;text-underline-offset:.2em}\nsection {padding:clamp(12px,3vw,24px);background:#fff;border:1px solid #dbe5f0;border-radius:12px;margin:1rem 0}\nlabel {display:block;font-weight:600}\ninput[type=search] {width:min(100%,36rem);min-height:44px;padding:.5em .75em;margin:.5em 0;font:inherit;border:1px solid #66798b;border-radius:6px}\narticle {padding:.75em 0;border-bottom:1px solid #dbe5f0}\narticle:last-child {border-bottom:0}\narticle h2 {margin:0;font-size:1.12rem}\narticle p {margin:.25em 0;overflow-wrap:anywhere}\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n<body>\n<div class=\"site-return\"><a href=\"index.html?lang=en\"><span aria-hidden=\"true\">←</span>Home</a></div>\n\n<main>\n<h1>Digital Library</h1>\n\n<p>Browse registered e-books and policy documents.</p>\n<nav><a href=\"resources.html?lang=en\">Resources</a>\n<a href=\"library.html\">Main library (Korean)</a>\n<a href=\"library-en.html\" hreflang=\"en\">English policy library</a>\n</nav>\n<section>\n<label for=\"catalogue-search\">Search by title, author or keyword</label>\n<input id=\"catalogue-search\" type=\"search\">\n<p id=\"catalogue-status\" role=\"status\">Loading documents…</p>\n<div id=\"catalogue-list\"></div>\n</section>\n<section>\n<h2>Policy research summaries</h2>\n<ul><li><a href=\"strategy.html?lang=en\">Pilot support strategy</a></li>\n<li><a href=\"strategy.html?lang=en\">Public-interest AI pilot implementation guide</a></li>\n<li><a href=\"strategy.html?lang=en\">Comprehensive hosting strategy</a></li>\n<li><a href=\"strategy.html?lang=en\">Recommendations on site-selection criteria</a></li>\n<li><a href=\"agencies.html?lang=en\">Research on nine international organizations</a></li>\n<li><a href=\"hub.html?lang=en\">Public AI cooperation framework</a></li></ul>\n</section>\n\n</main>\n\u003cscript type=\"module\">\nimport { createClient } from\n\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* ==========================================\n   1. Supabase 설정\n========================================== */\n\nconst SUPABASE_URL =\n\"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n\"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\nconst messages = {\n  \"empty\": \"No matching documents.\",\n  \"error\": \"The catalogue could not be loaded.\",\n  \"open\": \"Open record in main library\"\n};\nconst search = document.getElementById(\"catalogue-search\");\nconst status = document.getElementById(\"catalogue-status\");\nsearch.value = new URLSearchParams(window.location.search).get(\"q\") || \"\";\nconst list = document.getElementById(\"catalogue-list\");\n\nfunction render(records) {\n  const query = search.value.trim().toLocaleLowerCase();\n  const matches = records.filter(record => [record.title, record.author, record.category]\n    .filter(Boolean).join(\" \").toLocaleLowerCase().includes(query));\n  list.replaceChildren();\n  status.textContent = matches.length ? \"\" : messages.empty;\n  for (const record of matches) {\n    const card = document.createElement(\"article\");\n    const heading = document.createElement(\"h2\");\n    heading.dir = \"auto\";\n    heading.textContent = record.title;\n    const metadata = document.createElement(\"p\");\n    metadata.dir = \"auto\";\n    metadata.textContent = [record.author, record.published_at].filter(Boolean).join(\" · \");\n    const link = document.createElement(\"a\");\n    link.href = \"library.html?document_id=\" + encodeURIComponent(record.id);\n    link.textContent = messages.open + \" ↗\";\n    card.append(heading, metadata, link);\n    list.append(card);\n  }\n}\n\ntry {\n  const { data, error } = await supabase.rpc(\"get_knowledge_catalog_v2\");\n  if (error) throw error;\n  const records = Array.isArray(data)\n    ? data.filter(record => record.is_published === true && record.title && record.id != null)\n    : [];\n  search.addEventListener(\"input\", () => render(records));\n  render(records);\n} catch {\n  status.textContent = messages.error;\n}\n\u003c/script>\n</body>\n</html>\n",

<script>
(() => {
  const data = document.getElementById("page-variants");
  const pages = JSON.parse(data.textContent);
  const params = new URLSearchParams(window.location.search);
  const keys = ["view", "lang"].map(key => key + "=" + params.get(key));
  const selected = keys.find(key => Object.hasOwn(pages, key)) || "default";
  const page = pages[selected];
  const opening = /^\s*<!doctype html>\s*(<html\b[^>]*>)\s*<head\b[^>]*>/i.exec(page);

  // Keep the original URL and let the initial HTML parser run the page scripts.
  const root = new DOMParser().parseFromString(opening[1], "text/html").documentElement;
  for (const attribute of root.attributes) {
    document.documentElement.setAttribute(attribute.name, attribute.value);
  }
  data.remove();
  document.write(page.slice(opening[0].length));
})();
</script>
