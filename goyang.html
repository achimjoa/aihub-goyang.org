 <p>\n        킨텍스를 중심으로 국제회의와\n        전시행사를 개최할 수 있는\n        기반을 갖추고 있어\n        국제기구 회의와 학술행사,\n        산업 교류 활동을 연계할\n        가능성이 있습니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>③ 의료·보건 협력 기반</h3>\n      <p>\n        지역 내 의료기관과\n        수도권 보건의료 자원을 연계하여\n        공공보건과 의료 AI,\n        국제 보건협력 분야의\n        공동사업을 모색할 수 있습니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>④ 교육·연구 인력 접근성</h3>\n      <p>\n        수도권의 대학과 연구기관,\n        전문인력 및 기술기업과\n        협력할 수 있는 지리적 여건은\n        글로벌 AI 허브의 연구개발과\n        인재 양성에 활용될 수 있습니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>⑤ 문화·생태·정주환경</h3>\n      <p>\n        고양특례시의 문화시설과\n        공원, 생태환경 및 생활 기반은\n        국제협력기관 종사자와 가족의\n        정주 여건을 마련하는 데\n        중요한 자산이 될 수 있습니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>⑥ 시민사회 참여 역량</h3>\n      <p>\n        시민과 시민사회단체,\n        전문가와 지역 기업이\n        함께 참여하는 범시민 유치운동은\n        지역사회 협력과\n        공감대 형성의 기반이 됩니다.\n      </p>\n    </article>\n\n  </div>\n</section>\n\n<section>\n  <h2>고양특례시에 필요한 새로운 성장동력</h2>\n\n  <p>\n    고양특례시가 지속가능한 도시로\n    발전하기 위해서는\n    지역 내에서 새로운 부가가치를 창출하고\n    양질의 일자리를 확대할 수 있는\n    성장 기반이 중요합니다.\n  </p>\n\n  <p>\n    글로벌 AI 허브는 국제협력 기능과\n    인공지능 연구개발,\n    산업 활동 및 전문서비스 수요를\n    연결하는 새로운 성장 전략으로\n    검토할 수 있습니다.\n  </p>\n\n  <p>\n    국제협력기관과 연구기관,\n    기업 간 협력이 실제로 확대된다면\n    관련 산업과 전문인력 수요가 증가하고,\n    지역경제에도 새로운 기회가\n    형성될 가능성이 있습니다.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      글로벌 AI 허브 유치의 목표는\n      단순한 시설 유치가 아니라\n      국제협력과 지역 산업이 함께 성장하는\n      지속가능한 발전 기반을 만드는 것입니다.\n    </strong>\n  </div>\n</section>\n\n<section>\n  <h2>양질의 일자리 창출과 청년의 미래</h2>\n\n  <p>\n    고양특례시의 청년들이\n    지역에서 배우고 일하며\n    성장할 수 있는 기회를 확대하는 것은\n    중요한 도시 발전 과제입니다.\n  </p>\n\n  <p>\n    글로벌 AI 허브가 유치되고\n    관련 협력사업이 확대될 경우,\n    다음과 같은 분야에서\n    새로운 일자리와 진로 기회를\n    모색할 수 있습니다.\n  </p>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>AI 연구개발</h3>\n      <p>\n        인공지능 연구와 데이터 분석,\n        기술개발 및 공공 AI 활용 분야\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>국제협력 전문인력</h3>\n      <p>\n        국제사업 기획과 운영,\n        통번역, 국제회의 및\n        협력사업 관리 분야\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>기업과 창업</h3>\n      <p>\n        AI 기반 창업과 기술사업화,\n        기업 협력 및 전문서비스 분야\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>교육과 인재 양성</h3>\n      <p>\n        AI 교육, 국제협력 교육,\n        직업훈련 및 전문인력 양성 분야\n      </p>\n    </article>\n\n  </div>\n\n  <p class=\"note\">\n    ※ 위 내용은 글로벌 AI 허브 유치를 통해\n    기대할 수 있는 일자리 분야를 설명한 것입니다.\n    구체적인 고용 규모나 채용 계획이\n    확정된 것은 아닙니다.\n  </p>\n</section>\n\n<section>\n  <h2>지역경제 활성화의 새로운 기회</h2>\n\n  <p>\n    글로벌 AI 허브가 국제협력과\n    연구개발 활동의 거점으로 발전한다면\n    지역 기업과 상권,\n    서비스 산업에도 새로운\n    기회가 생길 수 있습니다.\n  </p>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>국제회의·전시산업</h3>\n      <p>\n        국제회의와 학술행사,\n        산업 전시 및 교류 프로그램을\n        통한 지역 서비스 수요 확대\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>지역 기업 협력</h3>\n      <p>\n        AI 기술기업과 연구기관,\n        국제협력 수요를 연결하는\n        공동사업 및 기술 실증 기회\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>전문서비스 산업</h3>\n      <p>\n        국제업무 지원과 교육,\n        통번역, 법률·회계 및\n        다양한 전문서비스 분야의\n        성장 가능성\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>지역 상권 활성화</h3>\n      <p>\n        국제회의 참가자와\n        연구인력 등의 방문 및\n        체류 활동에 따른\n        지역 소비 확대 가능성\n      </p>\n    </article>\n\n  </div>\n\n  <p>\n    이러한 효과는 실제 유치 규모와\n    참여기관, 운영 방식,\n    지역 기업과의 연계 수준에 따라\n    달라질 수 있습니다.\n  </p>\n</section>\n\n<section>\n  <h2>국제협력도시로 도약하는 고양특례시</h2>\n\n  <p>\n    글로벌 AI 허브 유치는\n    고양특례시의 도시 기능을\n    국제협력과 공공 AI 분야로\n    확장할 수 있는 기회입니다.\n  </p>\n\n  <p>\n    국제기구와 정부,\n    연구기관 및 기업이 협력하는\n    국제협력 플랫폼을 조성한다면\n    고양특례시는 국내외 기관과\n    지속적으로 교류하는 도시로\n    발전할 가능성을 넓힐 수 있습니다.\n  </p>\n\n  <p>\n    특히 공공보건과 기후환경,\n    재난 대응, 교육 및 지속가능발전 등\n    인류 공동의 문제 해결에 기여하는\n    국제협력도시를 지향할 수 있습니다.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      고양특례시의 미래 경쟁력은\n      도시의 규모만이 아니라,\n      세계와 협력하고 새로운 가치를\n      창출하는 역량에서 나옵니다.\n    </strong>\n  </div>\n\n  <a href=\"hub.html\" class=\"button\">\n    글로벌 AI 허브 소개 보기\n  </a>\n</section>\n\n<section>\n  <h2>고양특례시 유치를 위한 과제</h2>\n\n  <p>\n    글로벌 AI 허브 유치의 실현 가능성을\n    높이기 위해서는\n    시민의 열망과 함께\n    구체적인 정책과 실행계획이 필요합니다.\n  </p>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>입지 경쟁력 분석</h3>\n      <p>\n        교통과 접근성,\n        국제협력 기반,\n        정주환경 및 운영 여건을\n        객관적으로 분석합니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>협력체계 구축</h3>\n      <p>\n        경기도와 고양특례시,\n        정부 및 관계기관,\n        대학과 연구기관,\n        기업 및 시민사회 간\n        협력 기반을 확대합니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>실행 가능한 정책 제안</h3>\n      <p>\n        유치 이후 운영과\n        국제협력사업의 지속가능성을\n        고려한 정책 대안을\n        제시합니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>시민 공감대 확대</h3>\n      <p>\n        온라인 서명과 시민참여,\n        정책 홍보를 통해\n        글로벌 AI 허브 유치의\n        필요성을 널리 알립니다.\n      </p>\n    </article>\n\n  </div>\n\n  <a href=\"strategy.html\" class=\"button\">\n    글로벌 AI 허브 유치 전략 보기\n  </a>\n</section>\n\n<section>\n  <h2>시민의 힘으로 고양특례시의 미래를!</h2>\n\n  <p>\n    글로벌 AI 허브 유치는\n    고양특례시의 새로운 성장동력과\n    일자리, 지역경제의 미래를\n    준비하는 공동의 과제입니다.\n  </p>\n\n  <p>\n    범시민추진위원회는\n    시민의 자발적인 참여를 바탕으로\n    고양특례시의 유치 경쟁력을 알리고,\n    실현 가능한 정책과 협력 기반을\n    마련하기 위해 노력하겠습니다.\n  </p>\n\n  <p>\n    시민 여러분의 관심과 참여가\n    고양특례시의 새로운 미래를\n    준비하는 힘이 됩니다.\n  </p>\n\n  <a href=\"participate.html\" class=\"button\">\n    시민참여센터 바로가기\n  </a>\n</section>\n\n</main>\n\n<footer>\n  <p>\n    경기도 글로벌 AI 허브 유치<br>\n    고양특례시 범시민추진위원회\n  </p>\n\n  <p>\n    시민의 힘으로, 경기도의 역량으로, 세계와 함께!\n  </p>\n\n  <p>\n    <a href=\"index.html\" style=\"color:white;\">\n      홈페이지로 돌아가기\n    </a>\n  </p>\n</footer>\n\n</body>\n</html>\n",

* =====================================\n   MAIN\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   HERO\n===================================== */\n\n.hero-message {\n  text-align: center;\n  font-size: clamp(23px, 4vw, 33px);\n  font-weight: bold;\n  color: #0754a6;\n}\n\n.subtitle {\n  text-align: center;\n  color: #526780;\n}\n\n/* =====================================\n   GRID\n===================================== */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n  gap: 18px;\n  margin-top: 25px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 23px;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   HIGHLIGHT\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  padding: 25px;\n  border-right: 5px solid #168de0;\n  border-left: none;\n  border-radius: 8px;\n  margin: 20px 0;\n}\n\n/* =====================================\n   NOTE\n===================================== */\n\n.note {\n  background: #fff8e8;\n  padding: 20px;\n  border-radius: 8px;\n  margin-top: 20px;\n}\n\n/* =====================================\n   STEPS\n===================================== */\n\n.steps {\n  display: grid;\n  gap: 15px;\n}\n\n.step {\n  background: #f4f8fc;\n  padding: 23px;\n  border-radius: 9px;\n  border-right: 5px solid #168de0;\n  border-left: none;\n}\n\n.step h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   BUTTON\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 12px 22px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   FOOTER\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 18px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header>\n\n<h1>\nلماذا مدينة غويانغ؟\n</h1>\n\n<p>\nمدينة مستعدة لدعم<br>\nالتعاون الدولي<br>\nوالذكاء الاصطناعي لخدمة المصلحة العامة\n</p>\n\n<div class=\"language\">\n\n<a\n  href=\"goyang.html\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n<a\n  href=\"goyang.html?lang=en\"\n  lang=\"en\"\n  dir=\"ltr\"\n>\nEnglish\n</a>\n\n<a\n  href=\"goyang.html?lang=ar\"\n  lang=\"ar\"\n  class=\"active\"\n  aria-current=\"page\"\n>\nالعربية\n</a>\n\n</div>\n\n<a\n  href=\"index.html?lang=ar\"\n  class=\"home-link\"\n>\n→ العودة إلى الصفحة الرئيسية\n</a>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     HERO\n===================================== -->\n\n<section>\n\n<div class=\"hero-message\">\n\nما وراء توفير المساحات المادية:<br>\nبناء أساس عملي للتعاون الدولي\n\n</div>\n\n<p class=\"subtitle\">\nالتأسيس الأولي ·\nالدعم التشغيلي ·\nالنمو المشترك\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     WHY GOYANG\n===================================== -->\n\n<section>\n\n<h2>\nلماذا مدينة غويانغ؟\n</h2>\n\n<p>\nيتطلب نجاح المركز العالمي\nللذكاء الاصطناعي\nأكثر من مجرد توفير\nالمباني المكتبية.\n</p>\n\n<p>\nفالمنظمات الدولية\nتحتاج إلى وسائل نقل موثوقة،\nوسكن مناسب،\nوخدمات الرعاية الصحية\nوالتعليم،\nبالإضافة إلى تعاون فعال\nمع المؤسسات المحلية.\n</p>\n\n<p>\nتتميز مدينة غويانغ\nبسهولة الوصول إليها\nمن منطقة العاصمة،\nومرافق المؤتمرات الدولية،\nوالمؤسسات الصحية،\nوالموارد التعليمية والثقافية،\nوالأصول البيئية،\nوالبنية التحتية للمدينة الذكية،\nوالمجتمع المدني النشط.\n</p>\n\n<p>\nويمكن لهذه الموارد\nأن توفر أساساً عملياً\nلدعم تأسيس المنظمات الدولية\nوتشغيلها،\nوتطوير مشاريع الذكاء الاصطناعي\nالتي تخدم المصلحة العامة.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nلا تكمن قوة مدينة غويانغ\nفي مرافقها الفردية فحسب،\nبل أيضاً في إمكانية\nربط مواردها المتنوعة\nبالاحتياجات التشغيلية الفعلية\nللمنظمات الدولية.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     GOYANG ASSETS\n===================================== -->\n\n<section>\n\n<h2>\nالمقومات الرئيسية لمدينة غويانغ\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- ASSET 1 -->\n\n<article class=\"card\">\n\n<h3>\n1. الموقع الاستراتيجي وسهولة الوصول\n</h3>\n\n<p>\nتقع مدينة غويانغ\nضمن منطقة العاصمة سيول،\nوتستفيد من شبكات النقل الإقليمية.\n</p>\n\n<p>\nويوفر موقعها\nفرصاً للتعاون\nمع المؤسسات الموجودة\nفي سيول والمدن المجاورة.\n</p>\n\n</article>\n\n\u003c!-- ASSET 2 -->\n\n<article class=\"card\">\n\n<h3>\n2. البنية التحتية للمؤتمرات الدولية\n</h3>\n\n<p>\nيوفر مركز كينتكس\n(<bdi>KINTEX</bdi>)\nمرافق للمؤتمرات الدولية\nوالمعارض والفعاليات الكبرى.\n</p>\n\n<p>\nويمكن لهذه المرافق\nأن تدعم المنتديات العامة\nحول الذكاء الاصطناعي،\nوبرامج التدريب الدولية،\nواجتماعات التعاون.\n</p>\n\n</article>\n\n\u003c!-- ASSET 3 -->\n\n<article class=\"card\">\n\n<h3>\n3. الرعاية الصحية والصحة العامة\n</h3>\n\n<p>\nتضم مدينة غويانغ\nالمركز الوطني للسرطان،\nومستشفى إلسان\nالتابع لهيئة التأمين الصحي الوطني،\nومستشفى ميونغجي،\nومستشفى إلسان\nالتابع لجامعة دونغوك،\nوغيرها من المؤسسات الصحية.\n</p>\n\n<p>\nتشمل مجالات التعاون المحتملة\nالرعاية الصحية الأولية\nالمدعومة بالذكاء الاصطناعي،\nومراقبة الأمراض المعدية،\nوأبحاث الصحة العامة.\n</p>\n\n</article>\n\n\u003c!-- ASSET 4 -->\n\n<article class=\"card\">\n\n<h3>\n4. المناخ والموارد البيئية\n</h3>\n\n<p>\nتُعد أراضي جانغهانغ الرطبة،\nالمصنفة ضمن مواقع رامسار،\nمورداً بيئياً مهماً.\n</p>\n\n<p>\nوتوفر فرصاً لاستكشاف\nتطبيقات الذكاء الاصطناعي\nفي مراقبة التنوع البيولوجي،\nوحماية النظم البيئية،\nوتحليل المخاطر المناخية.\n</p>\n\n</article>\n\n\u003c!-- ASSET 5 -->\n\n<article class=\"card\">\n\n<h3>\n5. المدينة الذكية والاستجابة للكوارث\n</h3>\n\n<p>\nتوفر البنية التحتية\nللمدينة الذكية\nوإدارة الكوارث في غويانغ\nأساساً محتملاً\nلمشاريع تحليل المخاطر الحضرية،\nوالإنذار المبكر،\nوالاستجابة للطوارئ.\n</p>\n\n</article>\n\n\u003c!-- ASSET 6 -->\n\n<article class=\"card\">\n\n<h3>\n6. التعليم والثقافة وجودة الحياة\n</h3>\n\n<p>\nيمكن للمؤسسات التعليمية،\nوالمرافق الثقافية،\nوالخدمات المجتمعية،\nوالأحياء السكنية\nأن تساعد في دعم\nالموظفين الدوليين\nوأسرهم.\n</p>\n\n</article>\n\n\u003c!-- ASSET 7 -->\n\n<article class=\"card\">\n\n<h3>\n7. المشاركة المدنية\n</h3>\n\n<p>\nيشارك المواطنون\nوالمنظمات المدنية بنشاط\nفي الحملات\nومناقشات السياسات\nالداعمة لمساعي غويانغ\nلاستقطاب المركز.\n</p>\n\n<p>\nويمكن للمشاركة المدنية\nأن تسهم في تعزيز\nتقبّل المجتمع المحلي\nوالتعاون الدولي المستقبلي.\n</p>\n\n</article>\n\n\u003c!-- ASSET 8 -->\n\n<article class=\"card\">\n\n<h3>\n8. التعاون الإقليمي\n</h3>\n\n<p>\nيمكن لمدينة غويانغ\nالتعاون مع المدن المجاورة،\nمثل باجو وغيمبو،\nبالإضافة إلى الجامعات،\nوالمؤسسات البحثية،\nوالشركات،\nوالهيئات العامة\nفي جميع أنحاء مقاطعة غيونغي.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     NINE INTERNATIONAL ORGANIZATIONS\n===================================== -->\n\n<section>\n\n<h2>\nالتعاون المحتمل مع تسع منظمات دولية\n</h2>\n\n<p>\nتمثل المجالات التالية\nمقترحات طُوّرت\nمن خلال الدراسات الاستراتيجية\nللسياسات المتعلقة بمدينة غويانغ.\n</p>\n\n<p>\nويتطلب تنفيذها\nإجراء المشاورات،\nوالتوصل إلى اتفاقات مؤسسية،\nوتطبيق الضمانات المناسبة.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- WHO -->\n\n<article class=\"card\">\n\n<h3>\n<bdi>WHO</bdi> — الصحة العامة\n</h3>\n\n<p>\nالرعاية الصحية الأولية\nالمدعومة بالذكاء الاصطناعي،\nومراقبة الأمراض المعدية،\nوالإنذار المبكر\nفي مجال الصحة العامة.\n</p>\n\n</article>\n\n\u003c!-- WFP -->\n\n<article class=\"card\">\n\n<h3>\n<bdi>WFP</bdi> — الأمن الغذائي\n</h3>\n\n<p>\nتحليل سلاسل الإمداد الغذائي،\nوتقييم مخاطر التغذية،\nومراقبة الأمن الغذائي.\n</p>\n\n</article>\n\n\u003c!-- UNEP -->\n\n<article class=\"card\">\n\n<h3>\n<bdi>UNEP</bdi> — المناخ والبيئة\n</h3>\n\n<p>\nالمراقبة البيئية،\nوحماية التنوع البيولوجي،\nوتحليل المخاطر المناخية.\n</p>\n\n</article>\n\n\u003c!-- UNHCR -->\n\n<article class=\"card\">\n\n<h3>\n<bdi>UNHCR</bdi> — حماية اللاجئين\n</h3>\n\n<p>\nخدمات المعلومات متعددة اللغات،\nوالمساعدات الإنسانية،\nودعم السكان النازحين.\n</p>\n\n</article>\n\n\u003c!-- IOM -->\n\n<article class=\"card\">\n\n<h3>\n<bdi>IOM</bdi> — الهجرة والنزوح\n</h3>\n\n<p>\nالمعلومات المتعلقة بالهجرة،\nومراقبة النزوح الناجم عن الكوارث،\nوأنظمة الدعم في حالات الطوارئ.\n</p>\n\n</article>\n\n\u003c!-- ILO -->\n\n<article class=\"card\">\n\n<h3>\n<bdi>ILO</bdi> — التحولات في سوق العمل\n</h3>\n\n<p>\nتحليل التوظيف المرتبط\nبالذكاء الاصطناعي،\nودعم انتقال القوى العاملة،\nوتنمية المهارات.\n</p>\n\n</article>\n\n\u003c!-- ITU -->\n\n<article class=\"card\">\n\n<h3>\n<bdi>ITU</bdi> — اتصالات الكوارث\n</h3>\n\n<p>\nأنظمة الإنذار المبكر،\nواتصالات الطوارئ،\nوإمكانية الوصول الرقمي.\n</p>\n\n</article>\n\n\u003c!-- UNICEF -->\n\n<article class=\"card\">\n\n<h3>\n<bdi>UNICEF</bdi> — حماية الأطفال\n</h3>\n\n<p>\nحماية الأطفال،\nواستمرارية التعليم،\nودعم الأطفال\nفي حالات الطوارئ.\n</p>\n\n</article>\n\n\u003c!-- UNDP -->\n\n<article class=\"card\">\n\n<h3>\n<bdi>UNDP</bdi> — الاستجابة للأزمات المعقدة\n</h3>\n\n<p>\nالتحليل المتكامل للأزمات،\nوالتعافي من الكوارث،\nوتعزيز قدرة المجتمعات\nعلى الصمود.\n</p>\n\n</article>\n\n</div>\n\n<div class=\"note\">\n\n<strong>\nملاحظة مهمة:\n</strong>\n\n<p>\nتمثل هذه المجالات\nمقترحات للتعاون المحتمل،\nوليست مشاريع مؤكدة\nأو التزامات رسمية\nمن المنظمات المذكورة.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     THREE STAGES\n===================================== -->\n\n<section>\n\n<h2>\nالمراحل الثلاث للتنفيذ\n</h2>\n\n<div class=\"steps\">\n\n\u003c!-- STAGE 1 -->\n\n<div class=\"step\">\n\n<h3>\nالمرحلة الأولى — التأسيس الأولي\n</h3>\n\n<p>\nتطوير ترتيبات عملية\nللمكاتب،\nوالسكن،\nوالنقل،\nوالرعاية الصحية،\nوالتعليم،\nلمساعدة المنظمات الدولية\nعلى تأسيس عملياتها\nبكفاءة.\n</p>\n\n</div>\n\n\u003c!-- STAGE 2 -->\n\n<div class=\"step\">\n\n<h3>\nالمرحلة الثانية — الدعم التشغيلي\n</h3>\n\n<p>\nبناء التعاون\nبين الجامعات،\nوالمؤسسات الطبية،\nوالشركات،\nوالهيئات العامة،\nوالمجتمع المدني،\nلدعم العمل الفعلي\nللمنظمات الدولية.\n</p>\n\n</div>\n\n\u003c!-- STAGE 3 -->\n\n<div class=\"step\">\n\n<h3>\nالمرحلة الثالثة — النمو المشترك\n</h3>\n\n<p>\nالمساهمة في تحقيق\nأهداف التنمية الدولية،\nمع دعم تطور مدينة غويانغ\nإلى مدينة متخصصة\nفي التعاون الدولي.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nتأتي الجدوى العملية أولاً.\n</strong>\n\n<p>\nيرتكز نهج مدينة غويانغ\nعلى تحديد الموارد الحالية،\nوإبرام اتفاقات التعاون،\nوالتحقق من شروط التنفيذ،\nوإعطاء الأولوية\nللمشاريع القابلة للتحقيق.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     CIVIC PARTICIPATION\n===================================== -->\n\n<section>\n\n<h2>\nالمشاركة المدنية والتعاون الدولي\n</h2>\n\n<p>\nيعتمد نجاح المركز العالمي\nللذكاء الاصطناعي\nعلى التعاون الفعّال\nبين الحكومات،\nوالمنظمات الدولية،\nوالجامعات،\nوالشركات،\nوالمجتمعات المحلية.\n</p>\n\n<p>\nتسعى اللجنة المدنية في غويانغ\nإلى المساهمة\nمن خلال المشاركة المدنية،\nوتقديم التوصيات المتعلقة بالسياسات،\nوالحملات العامة،\nوالتعاون الدولي.\n</p>\n\n<a\n  href=\"participate.html?lang=ar\"\n  class=\"button\"\n>\nمعلومات المشاركة المدنية\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n\n<strong>\nاللجنة المدنية لدعم استضافة<br>\nالمركز العالمي للذكاء الاصطناعي<br>\nفي مقاطعة غيونغي\n</strong>\n\n</p>\n\n<p>\nالتأسيس الأولي ·\nالدعم التشغيلي ·\nالنمو المشترك\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ar\">\nالصفحة الرئيسية العربية\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=de": "<!DOCTYPE html>\n<html lang=\"de\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<meta name=\"description\"\ncontent=\"Entdecken Sie die Standortvorteile der Sonderstadt Goyang für das geplante globale KI-Zentrum: Gesundheitswesen, internationale Kongresse, Umwelt, intelligente Stadtentwicklung und internationale Zusammenarbeit.\">\n\n<title>\nWarum Goyang? | Globales KI-Zentrum\n</title>\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(30px, 5vw, 46px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.language {\n  margin-top: 20px;\n}\n\n.language a {\n  display: inline-block;\n  color: white;\n  border: 1px solid white;\n  padding: 8px 15px;\n  margin: 5px;\n  border-radius: 6px;\n  text-decoration: none;\n}\n\n.language a.active {\n  background: white;\n  color: #0754a6;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 15px;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.hero-message {\n  text-align: center;\n  font-size: clamp(23px, 4vw, 33px);\n  font-weight: bold;\n  color: #0754a6;\n}\n\n.subtitle {\n  text-align: center;\n  color: #526780;\n}\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n  gap: 18px;\n  margin-top: 25px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 23px;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.highlight {\n  background: #eaf4ff;\n  padding: 25px;\n  border-left: 5px solid #168de0;\n  border-radius: 8px;\n  margin: 20px 0;\n}\n\n.note {\n  background: #fff8e8;\n  padding: 20px;\n  border-radius: 8px;\n  margin-top: 20px;\n}\n\n.steps {\n  display: grid;\n  gap: 15px;\n}\n\n.step {\n  background: #f4f8fc;\n  padding: 23px;\n  border-radius: 9px;\n  border-left: 5px solid #168de0;\n}\n\n.step h3 {\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 12px 22px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 18px;\n  }\n}\n</style>\n</head>\n\n<body>\n\n<header>\n\n  <h1>Warum Goyang?</h1>\n\n  <p>\n    Eine Stadt mit guten Voraussetzungen<br>\n    für internationale Zusammenarbeit<br>\n    und gemeinwohlorientierte KI\n  </p>\n\n  <div class=\"language\">\n    <a href=\"goyang.html?lang=de\"\n       class=\"active\"\n       aria-current=\"page\">\n       Deutsch\n    </a>\n  </div>\n\n  <a href=\"index.html?lang=de\" class=\"home-link\">\n    ← Zurück zur Startseite\n  </a>\n\n</header>\n\n<main>\n\n\u003c!-- LEITBILD -->\n\n<section>\n  <div class=\"hero-message\">\n    Mehr als nur räumliche Infrastruktur:<br>\n    Eine praktische Grundlage<br>\n    für internationale Zusammenarbeit schaffen\n  </div>\n\n  <p class=\"subtitle\">\n    Erste Ansiedlung · Betriebsunterstützung · Gemeinsames Wachstum\n  </p>\n</section>\n\n\u003c!-- WARUM GOYANG? -->\n\n<section>\n\n  <h2>Warum Goyang?</h2>\n\n  <p>\n    Der Erfolg des globalen KI-Zentrums\n    erfordert mehr als nur Bürogebäude.\n    Internationale Organisationen benötigen\n    zuverlässige Verkehrsverbindungen,\n    geeigneten Wohnraum,\n    Gesundheitsversorgung und Bildung\n    sowie eine wirksame Zusammenarbeit\n    mit lokalen Institutionen.\n  </p>\n\n  <p>\n    Goyang bietet eine gute Erreichbarkeit\n    innerhalb der Metropolregion Seoul,\n    internationale Kongresseinrichtungen,\n    medizinische Institutionen,\n    Bildungs- und Kulturangebote,\n    wertvolle Umweltressourcen,\n    Smart-City-Infrastruktur\n    und eine aktive Zivilgesellschaft.\n  </p>\n\n  <p>\n    Diese Ressourcen könnten\n    eine praktische Grundlage\n    für die Ansiedlung und den Betrieb\n    internationaler Organisationen\n    sowie für die Entwicklung\n    gemeinwohlorientierter KI-Projekte schaffen.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      Goyangs Stärke liegt nicht nur\n      in seinen einzelnen Einrichtungen,\n      sondern auch in der Möglichkeit,\n      seine vielfältigen Ressourcen\n      mit den tatsächlichen betrieblichen Anforderungen\n      internationaler Organisationen zu verbinden.\n    </strong>\n  </div>\n\n</section>\n\n\u003c!-- ACHT STANDORTVORTEILE -->\n\n<section>\n\n  <h2>Die wichtigsten Standortvorteile Goyangs</h2>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>1. Strategische Lage und Erreichbarkeit</h3>\n      <p>\n        Goyang gehört zur Metropolregion Seoul\n        und profitiert von regionalen Verkehrsnetzen.\n      </p>\n      <p>\n        Die Lage bietet Möglichkeiten\n        zur Zusammenarbeit mit Institutionen\n        in Seoul und benachbarten Städten.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>2. Internationale Kongressinfrastruktur</h3>\n      <p>\n        KINTEX verfügt über Einrichtungen\n        für internationale Konferenzen,\n        Ausstellungen und Großveranstaltungen.\n      </p>\n      <p>\n        Diese Infrastruktur könnte\n        öffentliche KI-Foren,\n        internationale Ausbildungsprogramme\n        und Kooperationsveranstaltungen unterstützen.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>3. Gesundheitswesen und öffentliche Gesundheit</h3>\n      <p>\n        In Goyang befinden sich\n        das Nationale Krebszentrum,\n        das Ilsan-Krankenhaus\n        des Nationalen Krankenversicherungsdienstes,\n        das Myongji-Krankenhaus,\n        das Ilsan-Krankenhaus\n        der Dongguk-Universität\n        und weitere medizinische Einrichtungen.\n      </p>\n      <p>\n        Mögliche Kooperationsbereiche sind\n        KI-gestützte medizinische Grundversorgung,\n        Überwachung von Infektionskrankheiten\n        und Forschung im Bereich\n        der öffentlichen Gesundheit.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>4. Klima- und Umweltressourcen</h3>\n      <p>\n        Das Janghang-Feuchtgebiet,\n        das als Ramsar-Gebiet ausgewiesen ist,\n        stellt einen bedeutenden\n        ökologischen Standortvorteil dar.\n      </p>\n      <p>\n        Es bietet Möglichkeiten,\n        KI-Anwendungen\n        zur Überwachung der biologischen Vielfalt,\n        zum Schutz von Ökosystemen\n        und zur Analyse von Klimarisiken zu untersuchen.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>5. Smart City und Katastrophenschutz</h3>\n      <p>\n        Goyangs Smart-City-\n        und Katastrophenschutzinfrastruktur\n        bietet eine mögliche Grundlage\n        für Projekte zur Analyse städtischer Risiken,\n        für Frühwarnsysteme\n        und für die Notfallbewältigung.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>6. Bildung, Kultur und Lebensqualität</h3>\n      <p>\n        Bildungseinrichtungen,\n        kulturelle Angebote,\n        kommunale Dienstleistungen\n        und Wohngebiete\n        könnten internationale Fachkräfte\n        und ihre Familien unterstützen.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>7. Bürgerbeteiligung</h3>\n      <p>\n        Bürgerinnen und Bürger\n        sowie zivilgesellschaftliche Organisationen\n        beteiligen sich aktiv\n        an Kampagnen und politischen Diskussionen\n        zur Unterstützung\n        der Ansiedlungsinitiative Goyangs.\n      </p>\n      <p>\n        Bürgerliches Engagement\n        kann zur Akzeptanz in der Bevölkerung\n        und zur zukünftigen\n        internationalen Zusammenarbeit beitragen.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>8. Regionale Zusammenarbeit</h3>\n      <p>\n        Goyang könnte\n        mit benachbarten Städten\n        wie Paju und Gimpo\n        sowie mit Universitäten,\n        Forschungseinrichtungen,\n        Unternehmen und öffentlichen Institutionen\n        in der gesamten Provinz Gyeonggi zusammenarbeiten.\n      </p>\n    </article>\n\n  </div>\n\n</section>\n\n\u003c!-- NEUN INTERNATIONALE ORGANISATIONEN -->\n\n<section>\n\n  <h2>\n    Mögliche Zusammenarbeit mit neun internationalen Organisationen\n  </h2>\n\n  <p>\n    Die folgenden Bereiche\n    sind Vorschläge,\n    die im Rahmen strategischer\n    politischer Untersuchungen\n    zu Goyang entwickelt wurden.\n    Ihre Umsetzung würde Konsultationen,\n    institutionelle Vereinbarungen\n    und geeignete Schutzmaßnahmen erfordern.\n  </p>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>WHO — Öffentliche Gesundheit</h3>\n      <p>\n        KI-gestützte medizinische Grundversorgung,\n        Überwachung von Infektionskrankheiten\n        und Frühwarnsysteme\n        für die öffentliche Gesundheit.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>WFP — Ernährungssicherheit</h3>\n      <p>\n        Analyse von Lebensmittelversorgungsketten,\n        Bewertung von Ernährungsrisiken\n        und Überwachung der Ernährungssicherheit.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>UNEP — Klima und Umwelt</h3>\n      <p>\n        Umweltüberwachung,\n        Schutz der biologischen Vielfalt\n        und Analyse von Klimarisiken.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>UNHCR — Flüchtlingsschutz</h3>\n      <p>\n        Mehrsprachige Informationsdienste,\n        humanitäre Hilfe\n        und Unterstützung\n        für vertriebene Bevölkerungsgruppen.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>IOM — Migration und Vertreibung</h3>\n      <p>\n        Migrationsbezogene Informationen,\n        Überwachung katastrophenbedingter Vertreibung\n        und Notfallunterstützungssysteme.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>ILO — Wandel des Arbeitsmarktes</h3>\n      <p>\n        Analyse der Auswirkungen von KI\n        auf die Beschäftigung,\n        Unterstützung des beruflichen Wandels\n        und Kompetenzentwicklung.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>ITU — Katastrophenkommunikation</h3>\n      <p>\n        Frühwarnsysteme,\n        Notfallkommunikation\n        und digitale Barrierefreiheit.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>UNICEF — Kinderschutz</h3>\n      <p>\n        Kinderschutz,\n        Aufrechterhaltung von Bildungsangeboten\n        und kindgerechte Notfallunterstützung.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>UNDP — Bewältigung komplexer Krisen</h3>\n      <p>\n        Integrierte Krisenanalyse,\n        Wiederaufbau nach Katastrophen\n        und Stärkung der Widerstandsfähigkeit\n        lokaler Gemeinschaften.\n      </p>\n    </article>\n\n  </div>\n\n  <div class=\"note\">\n    <strong>Wichtiger Hinweis:</strong>\n    Hierbei handelt es sich\n    um vorgeschlagene Kooperationsbereiche,\n    nicht um bestätigte Projekte\n    oder formelle Zusagen\n    der genannten internationalen Organisationen.\n  </div>\n\n</section>\n\n\u003c!-- DREISTUFIGE STRATEGIE -->\n\n<section>\n\n  <h2>Drei Phasen der Umsetzung</h2>\n\n  <div class=\"steps\">\n\n    <div class=\"step\">\n      <h3>Phase 1 — Erste Ansiedlung</h3>\n      <p>\n        Entwicklung praktischer Rahmenbedingungen\n        für Büroräume,\n        Wohnraum,\n        Verkehrsanbindung,\n        Gesundheitsversorgung und Bildung,\n        damit internationale Organisationen\n        ihre Tätigkeit effizient aufnehmen können.\n      </p>\n    </div>\n\n    <div class=\"step\">\n      <h3>Phase 2 — Betriebsunterstützung</h3>\n      <p>\n        Aufbau einer Zusammenarbeit\n        zwischen Universitäten,\n        medizinischen Einrichtungen,\n        Unternehmen,\n        öffentlichen Institutionen\n        und der Zivilgesellschaft,\n        um die tatsächliche Arbeit\n        internationaler Organisationen zu unterstützen.\n      </p>\n    </div>\n\n    <div class=\"step\">\n      <h3>Phase 3 — Gemeinsames Wachstum</h3>\n      <p>\n        Beitrag zu internationalen Entwicklungszielen\n        und gleichzeitige Unterstützung\n        der Entwicklung Goyangs\n        zu einer Stadt,\n        die auf internationale Zusammenarbeit\n        spezialisiert ist.\n      </p>\n    </div>\n\n  </div>\n\n  <div class=\"highlight\">\n    <strong>\n      Praktische Umsetzbarkeit hat Vorrang.\n      Goyangs Ansatz besteht darin,\n      vorhandene Ressourcen zu identifizieren,\n      Kooperationsvereinbarungen zu entwickeln,\n      die Voraussetzungen für die Umsetzung zu prüfen\n      und realisierbare Projekte zu priorisieren.\n    </strong>\n  </div>\n\n</section>\n\n\u003c!-- BÜRGERBETEILIGUNG -->\n\n<section>\n\n  <h2>Bürgerbeteiligung und internationale Zusammenarbeit</h2>\n\n  <p>\n    Der Erfolg des globalen KI-Zentrums\n    würde von einer sinnvollen Zusammenarbeit\n    zwischen Regierungen,\n    internationalen Organisationen,\n    Universitäten,\n    Unternehmen\n    und lokalen Gemeinschaften abhängen.\n  </p>\n\n  <p>\n    Das Bürgerkomitee Goyang\n    möchte durch bürgerschaftliches Engagement,\n    politische Empfehlungen,\n    öffentliche Kampagnen\n    und internationale Zusammenarbeit\n    einen Beitrag leisten.\n  </p>\n\n  <a href=\"participate.html?lang=de\" class=\"button\">\n    Informationen zur Bürgerbeteiligung\n  </a>\n\n</section>\n\n</main>\n\n<footer>\n\n  <p>\n    <strong>\n      Bürgerkomitee Goyang zur Förderung<br>\n      der Ansiedlung des globalen KI-Zentrums<br>\n      in der Provinz Gyeonggi\n    </strong>\n  </p>\n\n  <p>\n    Erste Ansiedlung · Betriebsunterstützung · Gemeinsames Wachstum\n  </p>\n\n  <p>\n    <a href=\"index.html?lang=de\">\n      Deutsche Startseite\n    </a>\n  </p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=en": "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<meta name=\"description\"\ncontent=\"Discover Goyang's strengths and proposed contributions to hosting the Global AI Hub, including healthcare, international conventions, environmental assets and public-interest AI cooperation.\">\n\n<title>Why Goyang? | Global AI Hub</title>\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(30px, 5vw, 46px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.language {\n  margin-top: 20px;\n}\n\n.language a {\n  display: inline-block;\n  color: white;\n  border: 1px solid white;\n  padding: 8px 15px;\n  margin: 5px;\n  border-radius: 6px;\n  text-decoration: none;\n}\n\n.language a.active {\n  background: white;\n  color: #0754a6;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 15px;\n}\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.hero-message {\n  text-align: center;\n  font-size: clamp(23px, 4vw, 33px);\n  font-weight: bold;\n  color: #0754a6;\n}\n\n.subtitle {\n  text-align: center;\n  color: #526780;\n}\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n  gap: 18px;\n  margin-top: 25px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 23px;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.highlight {\n  background: #eaf4ff;\n  padding: 25px;\n  border-left: 5px solid #168de0;\n  border-radius: 8px;\n  margin: 20px 0;\n}\n\n.note {\n  background: #fff8e8;\n  padding: 20px;\n  border-radius: 8px;\n  margin-top: 20px;\n}\n\n.steps {\n  display: grid;\n  gap: 15px;\n}\n\n.step {\n  background: #f4f8fc;\n  padding: 23px;\n  border-radius: 9px;\n  border-left: 5px solid #168de0;\n}\n\n.step h3 {\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 12px 22px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 18px;\n  }\n}\n</style>\n</head>\n\n<body>\n\n<header>\n\n  <h1>Why Goyang?</h1>\n\n  <p>\n    A City Ready to Support\n    International Cooperation\n    and Public-Interest AI\n  </p>\n\n  <div class=\"language\">\n    <a href=\"goyang.html\" lang=\"ko\">한국어</a>\n    <a href=\"goyang.html?lang=en\"\n       class=\"active\"\n       aria-current=\"page\">English</a>\n  </div>\n\n  <a href=\"index.html?lang=en\" class=\"home-link\">\n    ← Back to Home\n  </a>\n\n</header>\n\n<main>\n\n<section>\n  <div class=\"hero-message\">\n    Beyond Physical Space:<br>\n    Building a Practical Foundation\n    for International Cooperation\n  </div>\n\n  <p class=\"subtitle\">\n    Initial Settlement · Operational Support · Shared Growth\n  </p>\n</section>\n\n<section>\n\n  <h2>Why Goyang?</h2>\n\n  <p>\n    The success of the Global AI Hub\n    requires more than office buildings.\n    International organizations need\n    reliable transportation,\n    suitable housing,\n    healthcare and education,\n    as well as effective cooperation\n    with local institutions.\n  </p>\n\n  <p>\n    Goyang offers metropolitan accessibility,\n    international convention facilities,\n    healthcare institutions,\n    educational and cultural resources,\n    environmental assets,\n    smart-city infrastructure\n    and an active civil society.\n  </p>\n\n  <p>\n    These resources could provide\n    a practical foundation for supporting\n    the establishment and operations\n    of international organizations\n    and developing public-interest AI projects.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      Goyang's strength lies not only\n      in its individual facilities,\n      but in the potential to connect\n      its diverse resources\n      to the real operational needs\n      of international organizations.\n    </strong>\n  </div>\n\n</section>\n\n<section>\n\n  <h2>Goyang's Key Assets</h2>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>1. Strategic Location and Accessibility</h3>\n      <p>\n        Goyang is part of the Seoul\n        metropolitan region and benefits\n        from regional transportation networks.\n      </p>\n      <p>\n        Its location offers opportunities\n        for cooperation with institutions\n        based in Seoul and neighboring cities.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>2. International Convention Infrastructure</h3>\n      <p>\n        KINTEX provides facilities\n        for international conferences,\n        exhibitions and major events.\n      </p>\n      <p>\n        These facilities could support\n        public AI forums,\n        international training programs\n        and cooperation meetings.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>3. Healthcare and Public Health</h3>\n      <p>\n        Goyang is home to\n        the National Cancer Center,\n        National Health Insurance Service\n        Ilsan Hospital,\n        Myongji Hospital,\n        Dongguk University Ilsan Hospital\n        and other healthcare institutions.\n      </p>\n      <p>\n        Potential cooperation areas include\n        AI-enabled primary healthcare,\n        infectious disease surveillance\n        and public health research.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>4. Climate and Environmental Assets</h3>\n      <p>\n        Janghang Wetland,\n        designated as a Ramsar Site,\n        is an important ecological asset.\n      </p>\n      <p>\n        It offers opportunities\n        to explore AI applications\n        in biodiversity monitoring,\n        ecosystem conservation\n        and climate-risk analysis.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>5. Smart City and Disaster Response</h3>\n      <p>\n        Goyang's smart-city and\n        disaster-management infrastructure\n        provides a potential foundation\n        for urban-risk analysis,\n        early warning\n        and emergency-response projects.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>6. Education, Culture and Quality of Life</h3>\n      <p>\n        Educational institutions,\n        cultural facilities,\n        community services\n        and residential neighborhoods\n        could help support\n        international personnel\n        and their families.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>7. Civic Participation</h3>\n      <p>\n        Citizens and civic organizations\n        are actively participating\n        in campaigns and policy discussions\n        supporting Goyang's bid.\n      </p>\n      <p>\n        Civic engagement can contribute\n        to community acceptance\n        and future international cooperation.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>8. Regional Cooperation</h3>\n      <p>\n        Goyang could work with\n        neighboring cities such as\n        Paju and Gimpo,\n        as well as universities,\n        research institutions,\n        businesses and public agencies\n        throughout Gyeonggi Province.\n      </p>\n    </article>\n\n  </div>\n\n</section>\n\n<section>\n\n  <h2>Potential Cooperation with Nine International Organizations</h2>\n\n  <p>\n    The following areas are proposals\n    developed through Goyang's\n    strategic policy studies.\n    Implementation would require\n    consultation, institutional agreement\n    and appropriate safeguards.\n  </p>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>WHO — Public Health</h3>\n      <p>\n        AI-enabled primary healthcare,\n        infectious disease monitoring\n        and public health early warning.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>WFP — Food Security</h3>\n      <p>\n        Food supply-chain analysis,\n        nutrition-risk assessment\n        and food-security monitoring.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>UNEP — Climate and Environment</h3>\n      <p>\n        Environmental monitoring,\n        biodiversity protection\n        and climate-risk analysis.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>UNHCR — Refugee Protection</h3>\n      <p>\n        Multilingual information services,\n        humanitarian assistance\n        and support for displaced populations.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>IOM — Migration and Displacement</h3>\n      <p>\n        Migration-related information,\n        disaster displacement monitoring\n        and emergency support systems.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>ILO — Labor-Market Transitions</h3>\n      <p>\n        AI-related employment analysis,\n        workforce transition support\n        and skills development.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>ITU — Disaster Communications</h3>\n      <p>\n        Early warning systems,\n        emergency communications\n        and digital accessibility.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>UNICEF — Child Protection</h3>\n      <p>\n        Child protection,\n        education continuity\n        and child-centered emergency support.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>UNDP — Complex Crisis Response</h3>\n      <p>\n        Integrated crisis analysis,\n        disaster recovery\n        and community resilience.\n      </p>\n    </article>\n\n  </div>\n\n  <div class=\"note\">\n    <strong>Important:</strong>\n    These are proposed cooperation areas,\n    not confirmed projects or formal\n    commitments by the organizations listed.\n  </div>\n\n</section>\n\n<section>\n\n  <h2>Three Stages of Implementation</h2>\n\n  <div class=\"steps\">\n\n    <div class=\"step\">\n      <h3>Stage 1 — Initial Settlement</h3>\n      <p>\n        Develop practical arrangements\n        for office facilities,\n        housing, transportation,\n        healthcare and education\n        to help international organizations\n        establish operations efficiently.\n      </p>\n    </div>\n\n    <div class=\"step\">\n      <h3>Stage 2 — Operational Support</h3>\n      <p>\n        Build cooperation among\n        universities, medical institutions,\n        businesses, public agencies\n        and civil society\n        to support the actual work\n        of international organizations.\n      </p>\n    </div>\n\n    <div class=\"step\">\n      <h3>Stage 3 — Shared Growth</h3>\n      <p>\n        Contribute to international\n        development goals while\n        supporting Goyang's evolution\n        into a city specializing\n        in international cooperation.\n      </p>\n    </div>\n\n  </div>\n\n  <div class=\"highlight\">\n    <strong>\n      Practical feasibility comes first.\n      Goyang's approach is to identify\n      existing resources, establish\n      cooperation agreements,\n      verify implementation conditions\n      and prioritize achievable projects.\n    </strong>\n  </div>\n\n</section>\n\n<section>\n\n  <h2>Civic Participation and International Cooperation</h2>\n\n  <p>\n    The success of the Global AI Hub\n    would depend on meaningful cooperation\n    among governments,\n    international organizations,\n    universities, businesses\n    and local communities.\n  </p>\n\n  <p>\n    The Goyang Citizens' Committee\n    seeks to contribute through\n    civic engagement,\n    policy recommendations,\n    public campaigns\n    and international cooperation.\n  </p>\n\n  <a href=\"participate.html\" class=\"button\">\n    Participation Information (Korean)\n  </a>\n\n</section>\n\n</main>\n\n<footer>\n\n  <p>\n    <strong>\n      Goyang Citizens' Committee for Hosting<br>\n      the Global AI Hub in Gyeonggi Province\n    </strong>\n  </p>\n\n  <p>\n    Initial Settlement · Operational Support · Shared Growth\n  </p>\n\n  <p>\n    <a href=\"index.html?lang=en\">English Home</a>\n  </p>\n\n</footer>\n\n</body>\n</html>\n",

y:hover {\n  background: #cce2ff;\n}\n\n/* =====================================\n   PIE DE PÁGINA\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   DISEÑO MÓVIL\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 18px 12px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 18px;\n  }\n\n  .step {\n    padding: 18px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin: 10px 0;\n  }\n\n  .subtitle {\n    font-size: 15px;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ENCABEZADO\n===================================== -->\n\n<header>\n\n<h1>\n¿Por qué la Ciudad Especial de Goyang?\n</h1>\n\n<p>\nUna ciudad preparada para apoyar<br>\nla cooperación internacional\ny la inteligencia artificial\nde interés público\n</p>\n\n</header>\n\n\u003c!-- =====================================\n     NAVEGACIÓN\n===================================== -->\n\n<nav class=\"top-navigation\"\naria-label=\"Navegación principal\">\n\n<a href=\"index.html?lang=es\">\n← Inicio\n</a>\n\n<a href=\"#introduccion\">\nIntroducción\n</a>\n\n<a href=\"#ventajas\">\nVentajas estratégicas\n</a>\n\n<a href=\"#organizaciones\">\nOrganizaciones internacionales\n</a>\n\n<a href=\"#etapas\">\nEtapas de implementación\n</a>\n\n<a href=\"#participacion\">\nParticipación\n</a>\n\n\u003c!-- SELECTOR DE IDIOMA -->\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"Seleccionar idioma\">\n🌐 Idioma ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a href=\"goyang.html?lang=es\"\nlang=\"es\"\naria-current=\"page\">\nEspañol ✓\n</a>\n\n<a href=\"goyang.html?lang=en\"\nlang=\"en\">\nEnglish\n</a>\n\n<a href=\"goyang.html\"\nlang=\"ko\">\n한국어\n</a>\n\n</div>\n\n</details>\n\n</nav>\n\n<main>\n\n\u003c!-- =====================================\n     MENSAJE PRINCIPAL\n===================================== -->\n\n<section>\n\n<div class=\"hero-message\">\n\nMás allá de la infraestructura física:<br>\n\nConstruir una base práctica\npara la cooperación internacional\n\n</div>\n\n<p class=\"subtitle\">\n\nEstablecimiento inicial ·\nApoyo operativo ·\nCrecimiento compartido\n\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     1. INTRODUCCIÓN\n===================================== -->\n\n<section id=\"introduccion\">\n\n<h2>\n1. ¿Por qué Goyang?\n</h2>\n\n<p>\nEl éxito del Centro Global\nde Inteligencia Artificial\nrequiere mucho más\nque edificios de oficinas.\n</p>\n\n<p>\nLas organizaciones internacionales\nnecesitan sistemas de transporte fiables,\nviviendas adecuadas,\nservicios sanitarios y educativos,\nasí como una cooperación eficaz\ncon las instituciones locales.\n</p>\n\n<p>\nLa Ciudad Especial de Goyang\nofrece accesibilidad metropolitana,\ninstalaciones para convenciones\ninternacionales,\ninstituciones sanitarias,\nrecursos educativos y culturales,\nactivos ambientales,\ninfraestructura de ciudad inteligente\ny una sociedad civil activa.\n</p>\n\n<p>\nEstos recursos podrían proporcionar\nuna base práctica\npara apoyar el establecimiento\ny las operaciones\nde organizaciones internacionales,\nasí como para desarrollar\nproyectos de inteligencia artificial\nde interés público.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n\nLa fortaleza de Goyang\nno reside únicamente\nen sus instalaciones individuales,\nsino también en la posibilidad\nde conectar sus diversos recursos\ncon las necesidades operativas reales\nde las organizaciones internacionales.\n\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     2. OCHO VENTAJAS ESTRATÉGICAS\n===================================== -->\n\n<section id=\"ventajas\">\n\n<h2>\n2. Ocho ventajas estratégicas de Goyang\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- VENTAJA 1 -->\n\n<article class=\"card\">\n\n<h3>\n1. Ubicación estratégica y accesibilidad\n</h3>\n\n<p>\nGoyang forma parte\nde la región metropolitana de Seúl\ny se beneficia\nde las redes regionales de transporte.\n</p>\n\n<p>\nSu ubicación ofrece oportunidades\npara cooperar con instituciones\nestablecidas en Seúl\ny en ciudades vecinas.\n</p>\n\n</article>\n\n\u003c!-- VENTAJA 2 -->\n\n<article class=\"card\">\n\n<h3>\n2. Infraestructura para convenciones internacionales\n</h3>\n\n<p>\nKINTEX dispone de instalaciones\npara conferencias internacionales,\nexposiciones\ny grandes acontecimientos.\n</p>\n\n<p>\nEstas instalaciones podrían apoyar\nforos públicos sobre inteligencia artificial,\nprogramas internacionales de formación\ny reuniones de cooperación.\n</p>\n\n</article>\n\n\u003c!-- VENTAJA 3 -->\n\n<article class=\"card\">\n\n<h3>\n3. Atención sanitaria y salud pública\n</h3>\n\n<p>\nGoyang alberga importantes\ninstituciones sanitarias,\nentre ellas:\n</p>\n\n<p>\nEl Centro Nacional del Cáncer,\nel Hospital Ilsan\ndel Servicio Nacional\nde Seguro de Salud,\nel Hospital Myongji\ny el Hospital Ilsan\nde la Universidad Dongguk.\n</p>\n\n<p>\nEntre las posibles áreas\nde cooperación se encuentran\nla atención primaria de salud\napoyada por inteligencia artificial,\nla vigilancia de enfermedades infecciosas\ny la investigación en salud pública.\n</p>\n\n</article>\n\n\u003c!-- VENTAJA 4 -->\n\n<article class=\"card\">\n\n<h3>\n4. Recursos climáticos y ambientales\n</h3>\n\n<p>\nEl humedal de Janghang,\ndesignado como sitio Ramsar,\nconstituye un importante\nrecurso ecológico.\n</p>\n\n<p>\nOfrece oportunidades\npara explorar aplicaciones\nde inteligencia artificial\nen la vigilancia de la biodiversidad,\nla conservación de ecosistemas\ny el análisis de riesgos climáticos.\n</p>\n\n</article>\n\n\u003c!-- VENTAJA 5 -->\n\n<article class=\"card\">\n\n<h3>\n5. Ciudad inteligente y respuesta ante desastres\n</h3>\n\n<p>\nLa infraestructura de ciudad inteligente\ny de gestión de desastres de Goyang\nofrece una posible base\npara proyectos de análisis\nde riesgos urbanos,\nalerta temprana\ny respuesta ante emergencias.\n</p>\n\n</article>\n\n\u003c!-- VENTAJA 6 -->\n\n<article class=\"card\">\n\n<h3>\n6. Educación, cultura y calidad de vida\n</h3>\n\n<p>\nLas instituciones educativas,\nlas instalaciones culturales,\nlos servicios comunitarios\ny los barrios residenciales\npodrían contribuir\na satisfacer las necesidades\ndel personal internacional\ny de sus familias.\n</p>\n\n</article>\n\n\u003c!-- VENTAJA 7 -->\n\n<article class=\"card\">\n\n<h3>\n7. Participación ciudadana\n</h3>\n\n<p>\nLos ciudadanos\ny las organizaciones cívicas\nparticipan activamente\nen campañas y debates\nsobre políticas públicas\nen apoyo de la candidatura de Goyang.\n</p>\n\n<p>\nLa participación ciudadana\npuede contribuir\na la aceptación comunitaria\ny a la futura cooperación internacional.\n</p>\n\n</article>\n\n\u003c!-- VENTAJA 8 -->\n\n<article class=\"card\">\n\n<h3>\n8. Cooperación regional\n</h3>\n\n<p>\nGoyang podría cooperar\ncon ciudades vecinas\ncomo Paju y Gimpo,\nasí como con universidades,\ninstituciones de investigación,\nempresas y organismos públicos\nde toda la provincia de Gyeonggi.\n</p>\n\n</article>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nUna plataforma regional\npara la cooperación internacional\n</strong>\n\n<p>\nLa combinación\nde accesibilidad metropolitana,\ninfraestructura internacional,\ncapacidades sanitarias,\nrecursos ambientales\ny participación ciudadana\nofrece oportunidades\npara explorar el establecimiento\ndel Centro Global de IA en Goyang.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. NUEVE ORGANIZACIONES INTERNACIONALES\n===================================== -->\n\n<section id=\"organizaciones\">\n\n<h2>\n3. Cooperación potencial\ncon nueve organizaciones internacionales\n</h2>\n\n<p>\nLos siguientes ámbitos\nson propuestas desarrolladas\na partir de estudios estratégicos\nsobre el potencial de Goyang.\n</p>\n\n<p>\nSu implementación requeriría\nconsultas con las instituciones pertinentes,\nacuerdos formales\ny medidas adecuadas de protección\ny responsabilidad.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- WHO -->\n\n<article class=\"card\">\n\n<h3>\nOMS / WHO — Salud pública\n</h3>\n\n<p>\nOrganización Mundial de la Salud\n</p>\n\n<p>\nAtención primaria de salud\napoyada por inteligencia artificial,\nvigilancia de enfermedades infecciosas\ny sistemas de alerta temprana\nen salud pública.\n</p>\n\n</article>\n\n\u003c!-- WFP -->\n\n<article class=\"card\">\n\n<h3>\nPMA / WFP — Seguridad alimentaria\n</h3>\n\n<p>\nPrograma Mundial de Alimentos\n</p>\n\n<p>\nAnálisis de cadenas\nde suministro alimentario,\nevaluación de riesgos nutricionales\ny vigilancia de la seguridad alimentaria.\n</p>\n\n</article>\n\n\u003c!-- UNEP -->\n\n<article class=\"card\">\n\n<h3>\nPNUMA / UNEP — Clima y medio ambiente\n</h3>\n\n<p>\nPrograma de las Naciones Unidas\npara el Medio Ambiente\n</p>\n\n<p>\nVigilancia ambiental,\nprotección de la biodiversidad\ny análisis de riesgos climáticos.\n</p>\n\n</article>\n\n\u003c!-- UNHCR -->\n\n<article class=\"card\">\n\n<h3>\nACNUR / UNHCR — Protección de refugiados\n</h3>\n\n<p>\nAlto Comisionado de las Naciones Unidas\npara los Refugiados\n</p>\n\n<p>\nServicios de información multilingüe,\nasistencia humanitaria\ny apoyo a poblaciones desplazadas.\n</p>\n\n</article>\n\n\u003c!-- IOM -->\n\n<article class=\"card\">\n\n<h3>\nOIM / IOM — Migración y desplazamiento\n</h3>\n\n<p>\nOrganización Internacional\npara las Migraciones\n</p>\n\n<p>\nInformación relacionada\ncon la migración,\nvigilancia del desplazamiento\nprovocado por desastres\ny sistemas de apoyo en emergencias.\n</p>\n\n</article>\n\n\u003c!-- ILO -->\n\n<article class=\"card\">\n\n<h3>\nOIT / ILO — Transformaciones del mercado laboral\n</h3>\n\n<p>\nOrganización Internacional del Trabajo\n</p>\n\n<p>\nAnálisis del empleo\nrelacionado con la inteligencia artificial,\napoyo a la transición laboral\ny desarrollo de competencias profesionales.\n</p>\n\n</article>\n\n\u003c!-- ITU -->\n\n<article class=\"card\">\n\n<h3>\nUIT / ITU — Comunicaciones de emergencia\n</h3>\n\n<p>\nUnión Internacional\nde Telecomunicaciones\n</p>\n\n<p>\nSistemas de alerta temprana,\ncomunicaciones de emergencia\ny accesibilidad digital.\n</p>\n\n</article>\n\n\u003c!-- UNICEF -->\n\n<article class=\"card\">\n\n<h3>\nUNICEF — Protección de la infancia\n</h3>\n\n<p>\nFondo de las Naciones Unidas\npara la Infancia\n</p>\n\n<p>\nProtección infantil,\ncontinuidad educativa\ny apoyo en situaciones de emergencia\ncentrado en los niños.\n</p>\n\n</article>\n\n\u003c!-- UNDP -->\n\n<article class=\"card\">\n\n<h3>\nPNUD / UNDP — Respuesta a crisis complejas\n</h3>\n\n<p>\nPrograma de las Naciones Unidas\npara el Desarrollo\n</p>\n\n<p>\nAnálisis integrado de crisis,\nrecuperación después de desastres\ny fortalecimiento\nde la resiliencia comunitaria.\n</p>\n\n</article>\n\n</div>\n\n<div class=\"note\">\n\n<strong>\nAclaración importante:\n</strong>\n\n<p>\nLos ámbitos descritos\nconstituyen propuestas\nde cooperación potencial.\n</p>\n\n<p>\nNo representan proyectos confirmados,\nacuerdos formales\nni compromisos de participación\npor parte de las organizaciones\ninternacionales mencionadas.\n</p>\n\n<p>\nToda colaboración futura\ndependería de consultas,\ndecisiones institucionales\ny acuerdos correspondientes.\n</p>\n\n</div>\n\n<a href=\"index.html?lang=es#organizations\"\nclass=\"button\">\n\nConocer las organizaciones internacionales\n\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     4. TRES ETAPAS\n===================================== -->\n\n<section id=\"etapas\">\n\n<h2>\n4. Tres etapas de implementación\n</h2>\n\n<p>\nLa estrategia propuesta\npara Goyang se basa\nen tres etapas complementarias:\nestablecimiento inicial,\napoyo operativo\ny crecimiento compartido.\n</p>\n\n<div class=\"steps\">\n\n\u003c!-- ETAPA 1 -->\n\n<div class=\"step\">\n\n<h3>\nEtapa 1 — Establecimiento inicial\n</h3>\n\n<p>\nDesarrollar condiciones prácticas\nrelacionadas con instalaciones\nde oficinas,\nvivienda,\ntransporte,\natención sanitaria\ny educación.\n</p>\n\n<p>\nEl objetivo sería facilitar\nel establecimiento eficiente\nde las operaciones\nde las organizaciones internacionales\nque eventualmente decidan participar.\n</p>\n\n</div>\n\n\u003c!-- ETAPA 2 -->\n\n<div class=\"step\">\n\n<h3>\nEtapa 2 — Apoyo operativo\n</h3>\n\n<p>\nPromover la cooperación\nentre universidades,\ninstituciones médicas,\nempresas,\norganismos públicos\ny sociedad civil.\n</p>\n\n<p>\nEsta cooperación podría contribuir\na apoyar las actividades reales\nde las organizaciones internacionales,\nincluyendo investigación,\nformación,\nintercambio de conocimientos\ny proyectos conjuntos.\n</p>\n\n</div>\n\n\u003c!-- ETAPA 3 -->\n\n<div class=\"step\">\n\n<h3>\nEtapa 3 — Crecimiento compartido\n</h3>\n\n<p>\nContribuir a los objetivos\ndel desarrollo internacional\ny, al mismo tiempo,\napoyar la evolución de Goyang\nhacia una ciudad especializada\nen cooperación internacional.\n</p>\n\n<p>\nEl crecimiento compartido\npodría incluir oportunidades\nde empleo especializado,\ninnovación tecnológica,\ninvestigación aplicada\ny desarrollo económico regional.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nLa viabilidad práctica\ndebe ser la primera prioridad.\n</strong>\n\n<p>\nEl enfoque de Goyang\nconsiste en identificar\nlos recursos existentes,\nexplorar acuerdos de cooperación,\nverificar las condiciones\nde implementación\ny dar prioridad\na proyectos alcanzables.\n</p>\n\n</div>\n\n<a href=\"index.html?lang=es#strategy\"\nclass=\"button\">\n\nConocer la estrategia de desarrollo\n\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     5. PARTICIPACIÓN CIUDADANA\n===================================== -->\n\n<section id=\"participacion\">\n\n<h2>\n5. Participación ciudadana\ny cooperación internacional\n</h2>\n\n<p>\nEl éxito del Centro Global de IA\ndependería de una cooperación\nsignificativa entre gobiernos,\norganizaciones internacionales,\nuniversidades,\nempresas\ny comunidades locales.\n</p>\n\n<p>\nEl Comité Ciudadano de Goyang\nbusca contribuir a este proceso\nmediante la participación cívica,\nlas recomendaciones de políticas,\nlas campañas públicas\ny la cooperación internacional.\n</p>\n\n<p>\nLa participación de los ciudadanos\nes importante para construir\nuna base social sólida,\nfomentar la comprensión pública\ny promover un desarrollo\ninternacionalmente responsable.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nLa cooperación internacional\ncomienza también\ncon la participación de la comunidad.\n</strong>\n\n<p>\nLa iniciativa busca conectar\nla experiencia internacional\ncon las capacidades locales,\npromoviendo beneficios compartidos\npara Goyang\ny para la comunidad internacional.\n</p>\n\n</div>\n\n<a href=\"participate.html\"\nclass=\"button\"\nlang=\"ko\"\nhreflang=\"ko\">\n\nInformación sobre participación\n(en coreano)\n\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     6. INFORMACIÓN INSTITUCIONAL\n===================================== -->\n\n<section>\n\n<h2>\n6. Situación institucional de la iniciativa\n</h2>\n\n<p>\nLa propuesta del Centro Global\nde Inteligencia Artificial en Goyang\nes una iniciativa promovida\npor el Comité Ciudadano.\n</p>\n\n<p>\nNo constituye por sí misma\nuna decisión gubernamental\nsobre la ubicación definitiva\ndel centro,\nni implica compromisos formales\nde organizaciones internacionales.\n</p>\n\n<p>\nLa participación de instituciones,\nla financiación,\nla selección de instalaciones\ny los mecanismos operativos\nestarían sujetos\na las consultas pertinentes\ny a las decisiones\nde las autoridades competentes.\n</p>\n\n<div class=\"note\">\n\n<strong>\nCompromiso con la transparencia\n</strong>\n\n<p>\nLa iniciativa promueve\nun diálogo constructivo,\nuna evaluación responsable\nde las condiciones de Goyang\ny la preparación de propuestas\nde cooperación internacional\nbasadas en posibilidades reales.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. ENLACES RELACIONADOS\n===================================== -->\n\n<section>\n\n<h2>\n7. Más información\n</h2>\n\n<p>\nContinúe explorando\nla iniciativa del Centro Global de IA,\nlas ventajas de Goyang\ny las oportunidades\nde cooperación internacional.\n</p>\n\n<a href=\"index.html?lang=es\"\nclass=\"button\">\n\n← Página principal en español\n\n</a>\n\n<a href=\"hub.html?lang=es\"\nclass=\"button secondary\">\n\nAcerca del Centro Global de IA\n\n</a>\n\n<a href=\"index.html?lang=es#organizations\"\nclass=\"button secondary\">\n\nOrganizaciones internacionales\n\n</a>\n\n<a href=\"index.html?lang=es#strategy\"\nclass=\"button secondary\">\n\nEstrategia de desarrollo\n\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     PIE DE PÁGINA\n===================================== -->\n\n<footer>\n\n<p>\n\n<strong>\n\nComité Ciudadano de Goyang\npara la Atracción del Centro Global\nde Inteligencia Artificial\na la Provincia de Gyeonggi\n\n</strong>\n\n</p>\n\n<p>\n\nEstablecimiento inicial ·\nApoyo operativo ·\nCrecimiento compartido\n\n</p>\n\n<p>\n\nCiudad Especial de Goyang<br>\nProvincia de Gyeonggi<br>\nRepública de Corea\n\n</p>\n\n<p>\n\n<a href=\"index.html?lang=es\">\nInicio en español\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"goyang.html?lang=en\"\nlang=\"en\">\nEnglish\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"goyang.html\"\nlang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=fr": "<!DOCTYPE html>\n<html lang=\"fr\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<meta name=\"description\"\ncontent=\"Découvrez les atouts de Goyang pour accueillir le projet de Centre mondial de l'IA : santé, congrès internationaux, environnement, infrastructures urbaines et coopération internationale.\">\n\n<title>Pourquoi Goyang ? | Centre mondial de l'IA</title>\n\n<style>\n\n/* CONFIGURATION GÉNÉRALE */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* EN-TÊTE */\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(30px, 5vw, 46px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n/* RETOUR À L'ACCUEIL */\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 15px;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* CONTENU PRINCIPAL */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* MESSAGE PRINCIPAL */\n\n.hero-message {\n  text-align: center;\n  font-size: clamp(23px, 4vw, 33px);\n  font-weight: bold;\n  color: #0754a6;\n}\n\n.subtitle {\n  text-align: center;\n  color: #526780;\n}\n\n/* GRILLE */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n  gap: 18px;\n  margin-top: 25px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 23px;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* ENCADRÉS */\n\n.highlight {\n  background: #eaf4ff;\n  padding: 25px;\n  border-left: 5px solid #168de0;\n  border-radius: 8px;\n  margin: 20px 0;\n}\n\n.note {\n  background: #fff8e8;\n  padding: 20px;\n  border-radius: 8px;\n  margin-top: 20px;\n}\n\n/* ÉTAPES */\n\n.steps {\n  display: grid;\n  gap: 15px;\n}\n\n.step {\n  background: #f4f8fc;\n  padding: 23px;\n  border-radius: 9px;\n  border-left: 5px solid #168de0;\n}\n\n.step h3 {\n  margin-top: 0;\n}\n\n/* BOUTONS */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 12px 22px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* PIED DE PAGE */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* VERSION MOBILE */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 18px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n</head>\n\n<body>\n\n\u003c!-- EN-TÊTE -->\n\n<header>\n\n<h1>\nPourquoi Goyang ?\n</h1>\n\n<p>\nUne ville prête à soutenir\nla coopération internationale<br>\net l'intelligence artificielle\nau service de l'intérêt public\n</p>\n\n<a href=\"index.html?lang=fr\" class=\"home-link\">\n← Retour à l'accueil\n</a>\n\n</header>\n\n<main>\n\n\u003c!-- MESSAGE PRINCIPAL -->\n\n<section>\n\n<div class=\"hero-message\">\n\nAu-delà des infrastructures :<br>\nconstruire une base concrète\npour la coopération internationale\n\n</div>\n\n<p class=\"subtitle\">\nInstallation initiale ·\nSoutien opérationnel ·\nCroissance partagée\n</p>\n\n</section>\n\n\u003c!-- POURQUOI GOYANG -->\n\n<section>\n\n<h2>\nPourquoi Goyang ?\n</h2>\n\n<p>\nLa réussite du projet\nde Centre mondial de l'IA\nnécessite bien davantage\nque des immeubles de bureaux.\n</p>\n\n<p>\nLes organisations internationales\nont besoin de transports fiables,\nde logements adaptés,\nde services de santé\net d'établissements d'enseignement,\nainsi que d'une coopération efficace\navec les institutions locales.\n</p>\n\n<p>\nGoyang offre une bonne accessibilité\nà l'échelle métropolitaine,\ndes infrastructures internationales\nde congrès et d'expositions,\ndes établissements de santé,\ndes ressources éducatives et culturelles,\ndes atouts environnementaux,\ndes infrastructures de ville intelligente\net une société civile active.\n</p>\n\n<p>\nCes ressources pourraient constituer\nune base concrète\npour soutenir l'installation\net le fonctionnement\nd'organisations internationales,\nainsi que pour développer\ndes projets d'intelligence artificielle\nau service de l'intérêt public.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nLa force de Goyang\nne réside pas uniquement\ndans ses équipements individuels,\nmais dans sa capacité potentielle\nà relier ses différentes ressources\naux besoins opérationnels réels\ndes organisations internationales.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- HUIT ATOUTS DE GOYANG -->\n\n<section>\n\n<h2>\nLes huit principaux atouts de Goyang\n</h2>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\n1. Situation stratégique et accessibilité\n</h3>\n\n<p>\nGoyang fait partie\nde la région métropolitaine de Séoul\net bénéficie\ndes réseaux de transport régionaux.\n</p>\n\n<p>\nSa situation géographique\noffre des possibilités de coopération\navec les institutions\nsituées à Séoul\net dans les villes voisines.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n2. Infrastructures internationales de congrès\n</h3>\n\n<p>\nLe KINTEX dispose\nd'installations destinées\naux conférences internationales,\naux expositions\net aux grands événements.\n</p>\n\n<p>\nCes infrastructures pourraient accueillir\ndes forums publics consacrés à l'IA,\ndes programmes internationaux de formation\net des réunions de coopération.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n3. Santé et santé publique\n</h3>\n\n<p>\nGoyang accueille\nle Centre national du cancer,\nl'hôpital Ilsan\ndu Service national d'assurance maladie,\nl'hôpital Myongji,\nl'hôpital Ilsan\nde l'Université Dongguk,\nainsi que d'autres établissements de santé.\n</p>\n\n<p>\nLes domaines potentiels de coopération\ncomprennent les soins de santé primaires\nassistés par l'intelligence artificielle,\nla surveillance des maladies infectieuses\net la recherche en santé publique.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n4. Climat et ressources environnementales\n</h3>\n\n<p>\nLa zone humide de Janghang,\ninscrite sur la Liste de Ramsar,\nconstitue une ressource écologique importante.\n</p>\n\n<p>\nElle offre des possibilités\nd'explorer les applications de l'IA\ndans la surveillance de la biodiversité,\nla conservation des écosystèmes\net l'analyse des risques climatiques.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n5. Ville intelligente et gestion des catastrophes\n</h3>\n\n<p>\nLes infrastructures de ville intelligente\net de gestion des catastrophes\nde Goyang pourraient constituer\nune base pour des projets\nd'analyse des risques urbains,\nd'alerte précoce\net d'intervention d'urgence.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n6. Éducation, culture et qualité de vie\n</h3>\n\n<p>\nLes établissements d'enseignement,\nles équipements culturels,\nles services communautaires\net les quartiers résidentiels\npourraient contribuer\nà répondre aux besoins\ndu personnel international\net de leurs familles.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n7. Participation citoyenne\n</h3>\n\n<p>\nLes citoyens\net les organisations de la société civile\nparticipent activement\naux campagnes\net aux discussions\nsur les politiques publiques\nen faveur de la candidature de Goyang.\n</p>\n\n<p>\nLa mobilisation citoyenne\npeut contribuer\nà l'acceptation du projet\npar la communauté locale\net au développement\nde futures coopérations internationales.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n8. Coopération régionale\n</h3>\n\n<p>\nGoyang pourrait coopérer\navec les villes voisines,\nnotamment Paju et Gimpo,\nainsi qu'avec les universités,\nles établissements de recherche,\nles entreprises\net les organismes publics\nde la province de Gyeonggi.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- NEUF ORGANISATIONS INTERNATIONALES -->\n\n<section>\n\n<h2>\nPossibilités de coopération\navec neuf organisations internationales\n</h2>\n\n<p>\nLes domaines suivants\nconstituent des propositions\nélaborées dans le cadre\ndes études stratégiques\nsur les politiques publiques\nconcernant Goyang.\n</p>\n\n<p>\nLeur mise en œuvre nécessiterait\ndes consultations,\ndes accords institutionnels\net des garanties appropriées.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nOMS — Santé publique\n</h3>\n\n<p>\nSoins de santé primaires\nassistés par l'IA,\nsurveillance des maladies infectieuses\net systèmes d'alerte précoce\nen santé publique.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nPAM — Sécurité alimentaire\n</h3>\n\n<p>\nAnalyse des chaînes\nd'approvisionnement alimentaire,\névaluation des risques nutritionnels\net surveillance\nde la sécurité alimentaire.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nPNUE — Climat et environnement\n</h3>\n\n<p>\nSurveillance environnementale,\nprotection de la biodiversité\net analyse des risques climatiques.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nHCR — Protection des réfugiés\n</h3>\n\n<p>\nServices d'information multilingues,\nassistance humanitaire\net soutien aux populations déplacées.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nOIM — Migrations et déplacements\n</h3>\n\n<p>\nInformations relatives aux migrations,\nsurveillance des déplacements\nprovoqués par les catastrophes\net systèmes d'assistance d'urgence.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nOIT — Transformations du marché du travail\n</h3>\n\n<p>\nAnalyse de l'emploi\nliée à l'intelligence artificielle,\naccompagnement\ndes transitions professionnelles\net développement des compétences.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nUIT — Communications d'urgence\n</h3>\n\n<p>\nSystèmes d'alerte précoce,\ncommunications d'urgence\net accessibilité numérique.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nUNICEF — Protection de l'enfance\n</h3>\n\n<p>\nProtection de l'enfance,\ncontinuité de l'éducation\net assistance d'urgence\nadaptée aux besoins des enfants.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nPNUD — Réponse aux crises complexes\n</h3>\n\n<p>\nAnalyse intégrée des crises,\nrelèvement après les catastrophes\net résilience des communautés.\n</p>\n\n</article>\n\n</div>\n\n<div class=\"note\">\n\n<strong>\nPrécision importante :\n</strong>\n\nCes domaines de coopération\nsont des propositions.\nIls ne constituent pas\ndes projets confirmés\nni des engagements officiels\ndes organisations internationales mentionnées.\n\n</div>\n\n<a href=\"agencies.html?lang=fr\" class=\"button\">\nDécouvrir les neuf organisations internationales →\n</a>\n\n</section>\n\n\u003c!-- TROIS ÉTAPES -->\n\n<section>\n\n<h2>\nLes trois étapes de mise en œuvre\n</h2>\n\n<div class=\"steps\">\n\n<div class=\"step\">\n\n<h3>\nÉtape 1 — Installation initiale\n</h3>\n\n<p>\nÉlaborer des dispositions pratiques\nconcernant les bureaux,\nle logement,\nles transports,\nles soins de santé\net l'éducation\nafin d'aider les organisations internationales\nà établir efficacement\nleurs activités.\n</p>\n\n</div>\n\n<div class=\"step\">\n\n<h3>\nÉtape 2 — Soutien opérationnel\n</h3>\n\n<p>\nDévelopper la coopération\nentre les universités,\nles établissements médicaux,\nles entreprises,\nles organismes publics\net la société civile\nafin de soutenir\nles activités concrètes\ndes organisations internationales.\n</p>\n\n</div>\n\n<div class=\"step\">\n\n<h3>\nÉtape 3 — Croissance partagée\n</h3>\n\n<p>\nContribuer aux objectifs\nde développement international\ntout en soutenant\nl'évolution de Goyang\nvers une ville spécialisée\ndans la coopération internationale.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nLa faisabilité pratique\nconstitue la priorité.\n</strong>\n\n<p>\nL'approche proposée pour Goyang\nconsiste à identifier\nles ressources existantes,\nà établir des accords de coopération,\nà vérifier les conditions de mise en œuvre\net à donner la priorité\naux projets réalisables.\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=fr\" class=\"button\">\nDécouvrir la stratégie de développement →\n</a>\n\n</section>\n\n\u003c!-- PARTICIPATION CITOYENNE -->\n\n<section>\n\n<h2>\nParticipation citoyenne\net coopération internationale\n</h2>\n\n<p>\nLa réussite du projet\nde Centre mondial de l'IA\ndépendrait d'une coopération réelle\nentre les gouvernements,\nles organisations internationales,\nles universités,\nles entreprises\net les communautés locales.\n</p>\n\n<p>\nLe Comité citoyen de promotion de Goyang\ncherche à contribuer à cette initiative\npar la mobilisation citoyenne,\nles recommandations\nen matière de politiques publiques,\nles campagnes d'information\net la coopération internationale.\n</p>\n\n<a href=\"participate.html?lang=fr\" class=\"button\">\nInformations sur la participation citoyenne →\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIED DE PAGE -->\n\n<footer>\n\n<p>\n<strong>\nComité citoyen de promotion\npour l'implantation<br>\ndu Centre mondial de l'IA\ndans la province de Gyeonggi\n</strong>\n</p>\n\n<p>\nInstallation initiale ·\nSoutien opérationnel ·\nCroissance partagée\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\">\nAccueil — Version française\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
