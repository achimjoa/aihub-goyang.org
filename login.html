<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>로그인 | 글로벌 AI 허브 고양특례시</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Malgun Gothic", Arial, sans-serif;
  background: #f4f8fc;
  color: #17315b;
  line-height: 1.7;
}

header {
  background: #0754a6;
  color: white;
  text-align: center;
  padding: 35px 15px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 12px 0;
}

.home-return {
  margin-top: 25px;
}

.home-return a {
  display: inline-block;
  background: white;
  color: #0754a6;
  border: 2px solid white;
  border-radius: 8px;
  padding: 12px 28px;
  font-weight: bold;
  text-decoration: none;
}

.home-return a:hover {
  background: #ffe44d;
  border-color: #ffe44d;
}

main {
  max-width: 520px;
  margin: 45px auto;
  padding: 0 15px;
}

.login-box {
  background: white;
  padding: 35px;
  border-radius: 12px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.1);
}

.login-box h2 {
  text-align: center;
  color: #0754a6;
  margin-top: 0;
}

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 8px;
  background: #0754a6;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #10315e;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#message {
  margin-top: 20px;
  text-align: center;
  font-weight: bold;
  white-space: pre-line;
}

.signup-link {
  text-align: center;
  margin-top: 25px;
}

.signup-link a {
  color: #0754a6;
  font-weight: bold;
}

footer {
  background: #10315e;
  color: white;
  text-align: center;
  padding: 25px 15px;
  margin-top: 50px;
}

@media (max-width: 600px) {
  .login-box {
    padding: 23px;
  }

  header h1 {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<header>
  <h1>회원 로그인</h1>

  <p>
    경기도 글로벌 AI 허브 유치<br>
    고양특례시 범시민추진위원회
  </p>

  <div class="home-return">
    <a href="index.html">
      ← 홈페이지로 돌아가기
    </a>
  </div>
</header>

<main>
<section class="login-box">

<h2>로그인</h2>

<p>
  회원가입 시 등록한 이메일과 비밀번호를
  입력해 주세요.
</p>

<form id="loginForm">

  <div class="form-group">
    <label for="email">이메일</label>
    <input
      type="email"
      id="email"
      autocomplete="email"
      required>
  </div>

  <div class="form-group">
    <label for="password">비밀번호</label>
    <input
      type="password"
      id="password"
      autocomplete="current-password"
      required>
  </div>

  <button type="submit" id="loginButton">
    로그인
  </button>

</form>

<p id="message" role="status" aria-live="polite"></p>

<div class="signup-link">
  아직 회원이 아니신가요?<br>
  <a href="signup.html">회원가입</a>
</div>

</section>
</main>

<footer>
  경기도 글로벌 AI 허브 유치<br>
  고양특례시 범시민추진위원회
</footer>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* Supabase 연결 정보 */

const SUPABASE_URL =
  "https://supabase.com/dashboard/project/gugkwqpvtwivqudkimvy";

const SUPABASE_KEY =
  "sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  loginButton.disabled = true;
  message.style.color = "#17315b";
  message.textContent = "로그인 확인 중입니다.";

  try {

    const { data, error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      throw error;
    }

    const user = data.user;

    if (!user) {
      throw new Error("회원정보를 확인할 수 없습니다.");
    }

    /* 회원 승인 상태 조회 */

    const { data: profile, error: profileError } =
      await supabase
        .from("profiles")
        .select("approval_status, member_role")
        .eq("id", user.id)
        .single();

    if (profileError || !profile) {
      message.style.color = "#b91c1c";
      message.textContent =
        "로그인은 성공했지만 회원정보를 확인할 수 없습니다.\n" +
        "관리자에게 문의해 주세요.";
      return;
    }

    if (profile.approval_status === "pending") {

      message.style.color = "#0754a6";
      message.textContent =
        "이메일 로그인이 완료되었습니다.\n" +
        "현재 관리자 승인 대기 중입니다.";

      return;
    }

    if (profile.approval_status === "rejected") {

      message.style.color = "#b91c1c";
      message.textContent =
        "회원가입 승인 상태를 확인해 주세요.\n" +
        "관리자에게 문의해 주세요.";

      return;
    }

    if (profile.approval_status === "approved") {

      message.style.color = "#0754a6";
      message.textContent =
        "로그인에 성공했습니다.\n" +
        "회원 승인이 완료된 계정입니다.";

    }

  } catch (error) {

    message.style.color = "#b91c1c";

    message.textContent =
      "로그인에 실패했습니다.\n" +
      "이메일 또는 비밀번호를 확인해 주세요.";

  } finally {

    loginButton.disabled = false;

  }

});

</script>

</body>
</html>
