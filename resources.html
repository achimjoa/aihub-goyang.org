<script id="page-variants" type="application/json">
{
  "default": "<!DOCTYPE html>\n<html lang=\"ko\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<title>\n통합 자료실 | 고양특례시 글로벌 AI 허브 유치\n</title>\n\n<style>\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    \"Malgun Gothic\",\n    \"Apple SD Gothic Neo\",\n    sans-serif;\n  background: #f5f7fb;\n  color: #222;\n}\n\nheader {\n  background: #0754a6;\n  color: white;\n  padding: 28px 20px;\n  text-align: center;\n}\n\nheader h1 {\n  margin: 0;\n  font-size: 26px;\n}\n\nheader p {\n  margin-top: 12px;\n  line-height: 1.7;\n}\n\nmain {\n  max-width: 1100px;\n  margin: 35px auto;\n  padding: 0 20px;\n}\n\nsection {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.06);\n}\n\nh2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.category-menu {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin: 25px 0;\n}\n\n.category-menu button {\n  padding: 10px 18px;\n  border: 1px solid #ccc;\n  background: white;\n  border-radius: 7px;\n  cursor: pointer;\n}\n\n.category-menu button.active {\n  background: #0754a6;\n  color: white;\n  border-color: #0754a6;\n}\n\ntable {\n  width: 100%;\n  border-collapse: collapse;\n}\n\nth, td {\n  padding: 14px 10px;\n  border-bottom: 1px solid #ddd;\n  text-align: left;\n}\n\nth {\n  background: #eef3fa;\n}\n\n.primary {\n  background: #0754a6;\n  color: white;\n  border: none;\n  padding: 12px 20px;\n  border-radius: 7px;\n  cursor: pointer;\n}\n\n#resourceWriteButton {\n  margin-top: 0;\n  margin-bottom: 0;\n}\n\n/* =====================================\n   자료 등록 화면\n===================================== */\n\n.form-group {\n  margin: 18px 0;\n}\n\n.form-group label {\n  display: block;\n  margin-bottom: 8px;\n  font-weight: bold;\n}\n\n.form-group input,\n.form-group select,\n.form-group textarea {\n  width: 100%;\n  padding: 12px;\n  border: 1px solid #ccc;\n  border-radius: 7px;\n  font: inherit;\n}\n\n.form-group input[type=\"file\"] {\n  background: #f8fafc;\n}\n\n#resourceCancelButton {\n  background: #64748b;\n  margin-left: 8px;\n}\n\n/* =====================================\n   자료실 관리자 관리 버튼\n===================================== */\n\n#resourceAdminButtons {\n  margin: 25px 0 15px;\n}\n\n#resourceAdminButtons button {\n  margin-right: 8px;\n  margin-bottom: 10px;\n}\n\n/* hidden 속성 유지 */\n\n#resourceAdminButtons[hidden] {\n  display: none;\n}\n  \n  footer {\n  text-align: center;\n  padding: 30px 15px;\n  color: #666;\n  line-height: 1.8;\n}\n\n@media (max-width: 600px) {\n\n  header h1 {\n    font-size: 21px;\n  }\n\n  section {\n    padding: 18px;\n  }\n\n  th, td {\n    padding: 10px 5px;\n    font-size: 13px;\n  }\n\n}\n\n#resourceWriteButton[hidden] {\n  display: none;\n}\n\n/* =====================================\n   제175-5-14-42단계\n   사진 활동정보 표시 제어\n===================================== */\n\n#resourcePhotoActivityFields[hidden] {\n  display: none !important;\n}\n  \n/* =====================================\n   제175-5-14-33단계\n   화면 표시 상태 통일\n===================================== */\n\n[hidden] {\n  display: none !important;\n}\n\n#resourceListView {\n  width: 100%;\n}\n\n#resourceListView table {\n  width: 100%;\n  border-collapse: collapse;\n}\n\n#resourceListView th,\n#resourceListView td {\n  padding: 14px 10px;\n  border-bottom: 1px solid #ddd;\n}\n\n#resourceWriteButton {\n  margin: 0;\n}\n\n/* =====================================\n   사진 상세 활동정보 표시\n===================================== */\n\n#resourceDetailActivity[hidden] {\n  display: none !important;\n}\n  \n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     143-3단계\n     통합 자료실 홈 이동 버튼\n===================================== -->\n\n<header>\n\n  <h1>📚 통합 자료실</h1>\n\n  <p>\n    고양특례시 글로벌 AI 허브 유치 관련<br>\n    문서와 다양한 미디어 자료를 제공합니다.\n  </p>\n\n  \u003c!-- 홈페이지 이동 버튼 -->\n\n  <p style=\"margin-top: 25px;\">\n\n    <a\n      href=\"index.html\"\n      style=\"\n        display: inline-block;\n        padding: 12px 24px;\n        background-color: white;\n        color: #0b5394;\n        text-decoration: none;\n        border-radius: 8px;\n        font-weight: bold;\n      \"\n    >\n      ← 홈페이지로 돌아가기\n    </a>\n\n  </p>\n\n</header>\n\n<main>\n\n<section>\n\n<h2>자료실</h2>\n\n<p>\n정책자료, 홍보자료, 행사사진,\n동영상 및 음성자료를 확인할 수 있습니다.\n</p>\n\n\u003c!-- 자료 분류 -->\n\n<div class=\"category-menu\">\n\n<button class=\"active\" data-category=\"all\">\n전체\n</button>\n\n<button data-category=\"document\">\n문서\n</button>\n\n<button data-category=\"image\">\n사진\n</button>\n\n<button data-category=\"video\">\n동영상\n</button>\n\n<button data-category=\"audio\">\n음성\n</button>\n \n<button data-category=\"other\">\n기타\n</button>\n\n</div>\n\n\u003c!-- =====================================\n     제175-5-14-33단계\n     통합 자료실 목록 구조 정리\n     중복 HTML 제거\n===================================== -->\n\n<div id=\"resourceListView\">\n\n  \u003c!-- 자료 등록 버튼 -->\n\n  <div style=\"\n    display: flex;\n    justify-content: flex-end;\n    margin-bottom: 20px;\n  \">\n\n    <button\n      type=\"button\"\n      id=\"resourceWriteButton\"\n      class=\"primary\"\n      hidden\n    >\n      ✏️ 자료 등록\n    </button>\n\n  </div>\n\n  \u003c!-- 자료 목록 -->\n\n  <table>\n\n    <thead>\n      <tr>\n        <th>번호</th>\n        <th>자료 제목</th>\n        <th>분류</th>\n        <th>등록일</th>\n      </tr>\n    </thead>\n\n    <tbody id=\"resourceList\">\n\n      <tr>\n        <td colspan=\"4\">\n          자료를 불러오고 있습니다.\n        </td>\n      </tr>\n\n    </tbody>\n\n  </table>\n\n</div>\n\n\u003c!-- =====================================\n     134단계\n     관리자 자료 등록 화면\n===================================== -->\n\n<div id=\"resourceWriteView\" hidden>\n\n<h2>📚 자료 등록</h2>\n\n<p>\n글로벌 AI 허브 유치 관련 자료를 등록합니다.\n</p>\n\n<form id=\"resourceForm\">\n\n\u003c!-- 자료 제목 -->\n\n<div class=\"form-group\">\n\n<label for=\"resourceTitle\">\n자료 제목 *\n</label>\n\n<input\n  type=\"text\"\n  id=\"resourceTitle\"\n  maxlength=\"200\"\n  required\n>\n\n</div>\n\n\u003c!-- =====================================\n     자료 분류\n===================================== -->\n\n<div class=\"form-group\">\n\n  <label for=\"resourceCategory\">\n    자료 분류 *\n  </label>\n\n  <select id=\"resourceCategory\" required>\n\n    <option value=\"document\">문서</option>\n    <option value=\"image\">사진</option>\n    <option value=\"video\">동영상</option>\n    <option value=\"audio\">음성</option>\n    <option value=\"other\">기타</option>\n\n  </select>\n\n</div>\n  \n\u003c!-- =====================================\n     사진자료 활동 정보 입력\n===================================== -->\n\n<div\n  id=\"resourcePhotoActivityFields\"\n  hidden\n>\n\n  \u003c!-- 활동 분류 -->\n\n  <div class=\"form-group\">\n\n    <label for=\"resourceActivityCategory\">\n      활동 분류 *\n    </label>\n\n    <select id=\"resourceActivityCategory\">\n\n      <option value=\"\">\n        활동 분류를 선택하세요\n      </option>\n\n    </select>\n\n  </div>\n\n  \u003c!-- 행사명 -->\n\n  <div class=\"form-group\">\n\n    <label for=\"resourceEventName\">\n      행사명\n    </label>\n\n    <input\n      type=\"text\"\n      id=\"resourceEventName\"\n      maxlength=\"200\"\n    >\n\n  </div>\n\n  \u003c!-- 행사일 -->\n\n  <div class=\"form-group\">\n\n    <label for=\"resourceEventDate\">\n      행사일\n    </label>\n\n    <input\n      type=\"date\"\n      id=\"resourceEventDate\"\n    >\n\n  </div>\n\n</div>\n\n\u003c!-- =====================================\n     자료 설명\n===================================== -->\n\n<div class=\"form-group\">\n\n<label for=\"resourceContent\">\n자료 설명\n</label>\n\n<textarea\n  id=\"resourceContent\"\n  rows=\"8\"\n></textarea>\n\n</div>\n\n\u003c!-- 문서 첨부 -->\n\n<div class=\"form-group\">\n\n<label for=\"resourceDocuments\">\n📎 문서 첨부\n</label>\n\n<input\n  type=\"file\"\n  id=\"resourceDocuments\"\n  accept=\".pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip\"\n  multiple\n>\n\n</div>\n\n\u003c!-- 사진 첨부 -->\n\n<div class=\"form-group\">\n\n<label for=\"resourcePhotos\">\n📷 사진 첨부\n</label>\n\n<input\n  type=\"file\"\n  id=\"resourcePhotos\"\n  accept=\"image/jpeg,image/png,image/webp,image/gif\"\n  multiple\n>\n\n</div>\n\n\u003c!-- 음성 첨부 -->\n\n<div class=\"form-group\">\n\n<label for=\"resourceAudio\">\n🎵 음성 첨부\n</label>\n\n<input\n  type=\"file\"\n  id=\"resourceAudio\"\n  accept=\".mp3,.wav,.m4a\"\n  multiple\n>\n\n</div>\n\n<p>\n첨부파일은 총 10개까지 등록할 수 있으며,\n파일당 최대 20MB입니다.\n</p>\n\n\u003c!-- YouTube 주소 -->\n\n<div class=\"form-group\">\n\n<label for=\"resourceYoutube\">\n▶️ YouTube 영상 주소\n</label>\n\n<input\n  type=\"url\"\n  id=\"resourceYoutube\"\n  placeholder=\"https://www.youtube.com/watch?v=...\"\n>\n\n</div>\n\n<br>\n\n<button\n  type=\"submit\"\n  id=\"resourceSubmitButton\"\n  class=\"primary\"\n>\n자료 등록\n</button>\n\n<button\n  type=\"button\"\n  id=\"resourceCancelButton\"\n  class=\"primary\"\n>\n취소\n</button>\n\n</form>\n\n</div>\n  \n\u003c!-- 자료 상세보기 -->\n\n<div id=\"resourceDetailView\" hidden>\n\n<h2 id=\"resourceDetailTitle\"></h2>\n\n<p id=\"resourceDetailDate\"></p>\n\n\u003c!-- =====================================\n     제175-5-14-48단계\n     사진자료 활동정보 상세 표시\n===================================== -->\n\n<div\n  id=\"resourceDetailActivity\"\n  hidden\n  style=\"\n    background: #f1f5f9;\n    padding: 18px;\n    border-radius: 8px;\n    margin: 20px 0;\n    line-height: 1.9;\n  \"\n></div>  \n\n<div id=\"resourceDetailContent\"></div>\n\n<div id=\"resourceAttachments\"></div>\n\n<div id=\"resourceMedia\"></div>\n\n\u003c!-- =====================================\n     142-2단계\n     관리자 전용 자료 관리 버튼\n===================================== -->\n\n<div id=\"resourceAdminButtons\" hidden>\n\n  <button\n    type=\"button\"\n    id=\"resourceEditButton\"\n    class=\"primary\"\n  >\n    ✏️ 자료 수정\n  </button>\n\n  <button\n    type=\"button\"\n    id=\"resourceDeleteButton\"\n    class=\"primary\"\n    style=\"background:#dc2626;\"\n  >\n    🗑️ 자료 삭제\n  </button>\n\n</div>\n  \n<button\n  type=\"button\"\n  id=\"resourceBackButton\"\n  class=\"primary\"\n>\n목록으로\n</button>\n\n</div>\n\n</section>\n\n</main>\n\n<footer>\n\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n\n</footer>\n\n\u003c!-- =====================================\n     130단계\n     자료실 Supabase 연결\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   Supabase 연결\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   제175-5-14-22단계\n\n   통합 자료실 사용자 권한 관리\n   중복 선언 제거 통합본\n===================================== */\n\n/* 화면 요소 */\n\nconst resourceList =\n  document.getElementById(\"resourceList\");\n\nconst resourceWriteButton =\n  document.getElementById(\"resourceWriteButton\");\n\n/* =====================================\n   사용자 권한 변수\n===================================== */\n\n/* 관리자 여부 */\n\nlet resourceAdmin = false;\n\n/* 자료 등록 가능 여부 */\n\nlet resourceWriter = false;\n\n/* 현재 로그인 사용자 ID */\n\nlet currentUserId = null;\n\n/* =====================================\n   통합 자료실 권한 확인 함수\n\n   관리자:\n     자료 등록 가능\n     모든 자료 수정·삭제 가능\n\n   승인회원:\n     자료 등록 가능\n     본인 자료 수정·삭제 대상\n\n   비회원 및 미승인회원:\n     자료 등록 불가\n===================================== */\n\nasync function checkResourceAdmin() {\n\n  /* 권한 초기화 */\n\n  resourceAdmin = false;\n  resourceWriter = false;\n  currentUserId = null;\n\n  /* 자료 등록 버튼 숨김 */\n\n  resourceWriteButton.hidden = true;\n\n  console.log(\n    \"[자료실] 권한 확인 시작\"\n  );\n\n  /* =====================================\n     1. 로그인 사용자 확인\n  ===================================== */\n\n  const {\n    data: authData,\n    error: authError\n  } = await supabase.auth.getUser();\n\n  if (authError || !authData?.user) {\n\n    console.warn(\n      \"[자료실] 로그인 확인 실패\",\n      authError\n    );\n\n    return;\n\n  }\n\n  const user = authData.user;\n\n  /* 로그인 사용자 ID 저장 */\n\n  currentUserId = user.id;\n\n  console.log(\n    \"[자료실] 로그인 확인 완료\"\n  );\n\n  /* =====================================\n     2. 관리자 권한 확인\n  ===================================== */\n\n  const {\n    data: adminResult,\n    error: adminError\n  } = await supabase.rpc(\n    \"is_resource_admin\"\n  );\n\n  if (adminError) {\n\n    console.error(\n      \"[자료실] 관리자 권한 확인 오류\",\n      adminError\n    );\n\n  } else {\n\n    resourceAdmin =\n      adminResult === true;\n\n  }\n\n  /* =====================================\n     3. 승인회원 확인\n  ===================================== */\n\n  const {\n    data: profile,\n    error: profileError\n  } = await supabase\n    .from(\"profiles\")\n    .select(\n      \"member_role, approval_status\"\n    )\n    .eq(\"id\", user.id)\n    .maybeSingle();\n\n  if (profileError) {\n\n    console.error(\n      \"[자료실] 회원정보 조회 오류\",\n      profileError\n    );\n\n  }\n\n  /* 승인회원 여부 */\n\n  const approvedMember =\n    !profileError &&\n    profile?.member_role === \"member\" &&\n    profile?.approval_status === \"approved\";\n\n  /* =====================================\n     4. 자료 등록 권한 결정\n  ===================================== */\n\n  resourceWriter =\n    resourceAdmin || approvedMember;\n\n  /* =====================================\n     5. 자료 등록 버튼 표시\n  ===================================== */\n\n  resourceWriteButton.hidden =\n    !resourceWriter;\n\n  /* =====================================\n     6. 최종 권한 확인\n  ===================================== */\n\n  console.log(\n    \"[자료실] 최종 권한 확인\",\n    {\n      resourceAdmin,\n      approvedMember,\n      resourceWriter,\n      currentUserId,\n      buttonHidden:\n        resourceWriteButton.hidden\n    }\n  );\n\n}\n  \n/* =====================================\n   자료 분류 이름\n===================================== */\n\nconst categoryNames = {\n  document: \"문서\",\n  image: \"사진\",\n  video: \"동영상\",\n  audio: \"음성\",\n  other: \"기타\"\n};\n\n/* =====================================\n   현재 선택된 자료 분류\n===================================== */\n\nlet currentCategory = \"all\";\n\n/* =====================================\n   자료 분류 버튼\n===================================== */\n\nconst categoryButtons =\n  document.querySelectorAll(\n    \".category-menu button\"\n  );\n\ncategoryButtons.forEach(button => {\n\n  button.addEventListener(\"click\", () => {\n\n    /* 선택된 분류 저장 */\n\n    currentCategory =\n      button.dataset.category;\n\n    /* 버튼 선택 표시 */\n\n    categoryButtons.forEach(btn => {\n      btn.classList.remove(\"active\");\n    });\n\n    button.classList.add(\"active\");\n\n    /* 자료 목록 다시 불러오기 */\n\n    loadResources();\n\n  });\n\n});\n  \n/* =====================================\n   자료실 목록 불러오기\n===================================== */\n\nasync function loadResources() {\n\n  resourceList.replaceChildren();\n\n  const loadingRow =\n    document.createElement(\"tr\");\n\n  const loadingCell =\n    document.createElement(\"td\");\n\n  loadingCell.colSpan = 4;\n  loadingCell.textContent =\n    \"자료를 불러오고 있습니다.\";\n\n  loadingRow.appendChild(loadingCell);\n  resourceList.appendChild(loadingRow);\n\n  /* =====================================\n   선택된 분류에 따라 자료 조회\n===================================== */\n\nlet query = supabase\n  .from(\"resource_posts\")\n  .select(\"id, title, category, created_at\");\n\n/* 전체가 아니면 분류 조건 적용 */\n\nif (currentCategory !== \"all\") {\n\n  query = query.eq(\n    \"category\",\n    currentCategory\n  );\n\n}\n\n/* 최신 자료부터 정렬 */\n\nconst { data, error } =\n  await query.order(\"created_at\", {\n    ascending: false\n  });\n\n  resourceList.replaceChildren();\n\n  if (error) {\n\n    const row = document.createElement(\"tr\");\n    const cell = document.createElement(\"td\");\n\n    cell.colSpan = 4;\n    cell.textContent =\n      \"자료를 불러오지 못했습니다: \" +\n      error.message;\n\n    row.appendChild(cell);\n    resourceList.appendChild(row);\n\n    console.error(\n      \"자료실 조회 오류:\",\n      error\n    );\n\n    return;\n  }\n\n  if (!data || data.length === 0) {\n\n    const row = document.createElement(\"tr\");\n    const cell = document.createElement(\"td\");\n\n    cell.colSpan = 4;\n    cell.textContent =\n      \"아직 등록된 자료가 없습니다.\";\n\n    row.appendChild(cell);\n    resourceList.appendChild(row);\n\n    return;\n  }\n\n  data.forEach(resource => {\n\n    const row =\n      document.createElement(\"tr\");\n\n    const idCell =\n      document.createElement(\"td\");\n\n    idCell.textContent = resource.id;\n\n    const titleCell =\n  document.createElement(\"td\");\n\nconst titleButton =\n  document.createElement(\"button\");\n\ntitleButton.type = \"button\";\n\ntitleButton.textContent = resource.title;\n\ntitleButton.style.background = \"none\";\ntitleButton.style.border = \"none\";\ntitleButton.style.padding = \"0\";\ntitleButton.style.color = \"#0754a6\";\ntitleButton.style.cursor = \"pointer\";\ntitleButton.style.textAlign = \"left\";\ntitleButton.style.textDecoration = \"underline\";\n\ntitleButton.addEventListener(\"click\", () => {\n  openResource(resource.id);\n});\n\ntitleCell.appendChild(titleButton);\n\n    const categoryCell =\n      document.createElement(\"td\");\n\n    categoryCell.textContent =\n      categoryNames[resource.category] ||\n      resource.category;\n\n    const dateCell =\n      document.createElement(\"td\");\n\n    dateCell.textContent =\n      new Date(resource.created_at)\n        .toLocaleDateString(\"ko-KR\");\n\n    row.append(\n      idCell,\n      titleCell,\n      categoryCell,\n      dateCell\n    );\n\n    resourceList.appendChild(row);\n\n  });\n\n}\n\n/* =====================================\n   132단계\n   자료실 상세보기\n===================================== */\n\nasync function openResource(resourceId) {\n\ncurrentResourceId = resourceId;\n  \n  const listView =\n    document.getElementById(\"resourceListView\");\n\n  const detailView =\n    document.getElementById(\"resourceDetailView\");\n\n /* =====================================\n   제175-5-14-18단계\n\n   자료 상세조회 시 작성자 정보 포함\n===================================== */\n\nconst { data, error } =\n  await supabase\n    .from(\"resource_posts\")\n    .select(\n  \"id, title, content, category, youtube_url, created_at, author_id, activity_category, event_name, event_date\"\n)\n    .eq(\"id\", resourceId)\n    .single();\n\n  if (error) {\n\n    console.error(\n      \"자료 상세조회 오류:\",\n      error\n    );\n\n    alert(\n      \"자료를 불러오지 못했습니다.\\n\" +\n      error.message\n    );\n\n    return;\n  }\n\n  /* 제목 */\n\n  document.getElementById(\n    \"resourceDetailTitle\"\n  ).textContent = data.title;\n\n  /* 등록일 */\n\n  document.getElementById(\n    \"resourceDetailDate\"\n  ).textContent =\n    \"등록일: \" +\n    new Date(data.created_at)\n      .toLocaleString(\"ko-KR\");\n\n  /* 자료 설명 */\n\n  const contentArea =\n    document.getElementById(\n      \"resourceDetailContent\"\n    );\n\n  contentArea.textContent =\n    data.content || \"\";\n\n  contentArea.style.whiteSpace = \"pre-wrap\";\n\n  /* =====================================\n   제175-5-14-48단계\n   사진자료 활동정보 상세 표시\n===================================== */\n\nconst activityArea =\n  document.getElementById(\n    \"resourceDetailActivity\"\n  );\n\n/* 기존 내용 초기화 */\n\nactivityArea.replaceChildren();\n\n/* 사진자료인 경우에만 표시 */\n\nif (data.category === \"image\") {\n\n  /* 활동 분류 이름 */\n\n  const activityNames = {\n    solidarity: \"시민연대\",\n    promotion: \"홍보활동\",\n    signature: \"시민 서명운동\",\n    culture: \"문화예술\",\n    other: \"기타 활동\"\n  };\n\n  const activityName =\n    activityNames[data.activity_category] ||\n    data.activity_category ||\n    \"미분류 활동\";\n\n  /* 표시 항목 생성 */\n\n  const items = [\n    [\"활동 분류\", activityName],\n    [\"행사명\", data.event_name || \"미입력\"],\n    [\n      \"행사일\",\n      data.event_date\n        ? data.event_date\n            .split(\"-\")\n            .join(\". \") + \".\"\n        : \"미입력\"\n    ]\n  ];\n\n  items.forEach(([label, value]) => {\n\n    const row =\n      document.createElement(\"div\");\n\n    const strong =\n      document.createElement(\"strong\");\n\n    strong.textContent = label + \": \";\n\n    const span =\n      document.createElement(\"span\");\n\n    span.textContent = value;\n\n    row.append(strong, span);\n\n    activityArea.appendChild(row);\n\n  });\n\n  activityArea.hidden = false;\n\n} else {\n\n  activityArea.hidden = true;\n\n}\n\n /* =====================================\n   첨부파일 및 미디어 영역 초기화\n===================================== */\n\ndocument.getElementById(\n  \"resourceAttachments\"\n).replaceChildren();\n\ndocument.getElementById(\n  \"resourceMedia\"\n).replaceChildren();\n\n/* 첨부파일 불러오기 */\n\nawait loadResourceAttachments(data.id);\n\n/* =====================================\n   제175-5-14-19단계\n\n   관리자 및 승인회원\n   자료 수정·삭제 버튼 표시\n\n   관리자:\n     모든 자료 수정·삭제 가능\n\n   승인회원:\n     본인이 등록한 자료만\n     수정·삭제 가능\n===================================== */\n\n/* 본인 자료 여부 확인 */\n\nconst isOwnResource =\n  currentUserId !== null &&\n  data.author_id === currentUserId;\n\n/* 자료 관리 권한 확인 */\n\nconst canManageResource =\n  resourceAdmin ||\n  (\n    resourceWriter &&\n    isOwnResource\n  );\n\n/* 수정·삭제 버튼 영역 */\n\nconst adminButtons =\n  document.getElementById(\n    \"resourceAdminButtons\"\n  );\n\n/* 권한에 따라 버튼 표시 */\n\nadminButtons.hidden = !canManageResource;\n\n/* =====================================\n   상세화면 표시\n===================================== */\n\n/* 자료실 화면 전환 */\n\nresourceListView.hidden = true;\nresourceWriteView.hidden = true;\nresourceDetailView.hidden = false;\n\n/* YouTube 영상 표시 */\n\nshowResourceYoutube(data.youtube_url);\n  \n}\n\n/* =====================================\n   목록으로 돌아가기\n===================================== */\n\ndocument.getElementById(\n  \"resourceBackButton\"\n).addEventListener(\"click\", () => {\n\n  document.getElementById(\n    \"resourceDetailView\"\n  ).hidden = true;\n\n  document.getElementById(\n    \"resourceListView\"\n  ).hidden = false;\n\n});\n\n/* =====================================\n   135단계\n   자료 등록 화면 열기 및 취소\n===================================== */\n\n/* 화면 요소 */\n\nconst resourceListView =\n  document.getElementById(\"resourceListView\");\n\nconst resourceDetailView =\n  document.getElementById(\"resourceDetailView\");\n\nconst resourceWriteView =\n  document.getElementById(\"resourceWriteView\");\n\nconst resourceForm =\n  document.getElementById(\"resourceForm\");\n\n /* =====================================\n   제175-5-14-42단계\n   사진 활동정보 표시 제어\n===================================== */\n\nconst resourceCategorySelect =\n  document.getElementById(\n    \"resourceCategory\"\n  );\n\nconst resourcePhotoActivityFields =\n  document.getElementById(\n    \"resourcePhotoActivityFields\"\n  );\n\nconst resourceActivityCategorySelect =\n  document.getElementById(\n    \"resourceActivityCategory\"\n  );\n\n/* 사진 선택 여부에 따라 입력 영역 표시 */\n\nfunction updatePhotoActivityFields() {\n\n  const isPhoto =\n    resourceCategorySelect.value === \"image\";\n\n  resourcePhotoActivityFields.hidden = !isPhoto;\n\n  /* 사진일 때만 활동 분류 필수 */\n\n  resourceActivityCategorySelect.required =\n    isPhoto;\n\n}\n\n/* 자료 분류 변경 감지 */\n\nresourceCategorySelect.addEventListener(\n  \"change\",\n  updatePhotoActivityFields\n);\n\n/* 최초 상태 설정 */\n\nupdatePhotoActivityFields(); \n\n/* =====================================\n   제175-5-14-43단계\n   활동 분류 목록 불러오기\n===================================== */\n\nasync function loadResourceActivityCategories() {\n\n  const select = document.getElementById(\n    \"resourceActivityCategory\"\n  );\n\n  if (!select) return;\n\n  /* 기존 선택 항목 초기화 */\n\n  select.replaceChildren();\n\n  const placeholder =\n    document.createElement(\"option\");\n\n  placeholder.value = \"\";\n  placeholder.textContent =\n    \"활동 분류를 선택하세요\";\n\n  select.appendChild(placeholder);\n\n  /* Supabase 활동 분류 조회 */\n\n  const { data, error } = await supabase\n    .from(\"photo_activity_categories\")\n    .select(\"code, name_ko\")\n    .eq(\"is_active\", true)\n    .order(\"sort_order\", {\n      ascending: true\n    });\n\n  if (error) {\n\n    console.error(\n      \"[자료실] 활동 분류 조회 오류:\",\n      error\n    );\n\n    placeholder.textContent =\n      \"활동 분류를 불러오지 못했습니다\";\n\n    return;\n  }\n\n  /* 선택 항목 생성 */\n\n  (data || []).forEach(category => {\n\n    const option =\n      document.createElement(\"option\");\n\n    option.value = category.code;\n    option.textContent = category.name_ko;\n\n    select.appendChild(option);\n\n  });\n\n}  \n\nconst resourceCancelButton =\n  document.getElementById(\"resourceCancelButton\");\n\n/* =====================================\n   자료 등록 버튼\n===================================== */\n\nresourceWriteButton.addEventListener(\n  \"click\",\n  () => {\n\n/* =====================================\n   제175-5-2단계\n   승인회원 자료등록 허용\n===================================== */\n\nif (!resourceWriter) {\n\n  alert(\n    \"승인된 회원만 자료를 등록할 수 있습니다.\"\n  );\n\n  return;\n}\n\n    /* 입력 내용 초기화 */\n\n   /* 신규 자료 등록 모드 */\n\nresourceEditMode = false;\ncurrentResourceId = null;\n\n/* 입력 내용 초기화 */\n\nresourceForm.reset();\n\n/* 버튼 문구 초기화 */\n\ndocument.getElementById(\n  \"resourceSubmitButton\"\n).textContent = \"자료 등록\";\n\n    /* 기존 화면 숨기기 */\n\n    resourceListView.hidden = true;\n    resourceDetailView.hidden = true;\n\n    /* 자료 등록 화면 표시 */\n\n    resourceWriteView.hidden = false;\n\n    /* 제목 입력칸으로 이동 */\n\n    document.getElementById(\n      \"resourceTitle\"\n    ).focus();\n\n  }\n);\n\n/* =====================================\n   취소 버튼\n===================================== */\n\nresourceCancelButton.addEventListener(\n  \"click\",\n  () => {\n    console.log(\"[자료실] 기존 취소 이벤트 실행\");\n\n    resourceWriteView.hidden = true;\n\n    /* 수정 중 취소 */\n\n    if (resourceEditMode && currentResourceId) {\n\n      resourceDetailView.hidden = false;\n\n    } else {\n\n      resourceListView.hidden = false;\n\n    }\n\n    resourceEditMode = false;\n\n    document.getElementById(\n      \"resourceSubmitButton\"\n    ).textContent = \"자료 등록\";\n\n  }\n);\n\n  \n/* =====================================\n   136단계\n   자료실 게시물 등록\n===================================== */\n\nconst resourceSubmitButton =\n  document.getElementById(\"resourceSubmitButton\");\n\nresourceForm.addEventListener(\"submit\", async event => {\n\n  event.preventDefault();\n\n  /* 중복 제출 방지 */\n\n  if (resourceSubmitButton.disabled) {\n    return;\n  }\n\n/* =====================================\n   제175-5-3단계\n   자료 등록 및 수정 권한 분리\n===================================== */\n\n/*\n  신규 등록:\n    관리자 또는 승인회원\n\n  기존 자료 수정:\n    관리자만 허용\n\n  승인회원의 본인 자료 수정 기능은\n  별도 단계에서 구현\n*/\n\n/* =====================================\n   제175-5-14-20단계\n\n   신규 등록 및 수정 권한 분리\n===================================== */\n\nif (resourceEditMode) {\n\n  /* 수정 대상 확인 */\n\n  if (currentResourceId == null) {\n\n    alert(\"수정할 자료가 선택되지 않았습니다.\");\n\n    return;\n  }\n\n  /* 현재 로그인 사용자 확인 */\n\n  const { data: authData, error: authError } =\n    await supabase.auth.getUser();\n\n  if (authError || !authData?.user) {\n\n    alert(\"로그인이 필요합니다.\");\n\n    return;\n  }\n\n  /* 기존 자료 작성자 조회 */\n\n  const { data: targetResource, error: targetError } =\n    await supabase\n      .from(\"resource_posts\")\n      .select(\"id, author_id\")\n      .eq(\"id\", currentResourceId)\n      .single();\n\n  if (targetError || !targetResource) {\n\n    alert(\"수정할 자료를 확인할 수 없습니다.\");\n\n    return;\n  }\n\n  /* 수정 권한 확인 */\n\n  const isOwnResource =\n    targetResource.author_id === authData.user.id;\n\n  const canEditResource =\n    resourceAdmin ||\n    (\n      resourceWriter &&\n      isOwnResource\n    );\n\n  if (!canEditResource) {\n\n    alert(\"본인이 등록한 자료만 수정할 수 있습니다.\");\n\n    return;\n  }\n\n} else {\n\n  /* 신규 자료 등록 권한 */\n\n  if (!resourceWriter) {\n\n    alert(\"승인된 회원만 자료를 등록할 수 있습니다.\");\n\n    return;\n  }\n\n}\n\n  /* 입력값 확인 */\n\n  const title =\n    document.getElementById(\"resourceTitle\")\n      .value.trim();\n\n  const category =\n    document.getElementById(\"resourceCategory\")\n      .value;\n\n  const content =\n    document.getElementById(\"resourceContent\")\n      .value.trim();\n\n  const youtubeUrl =\n    document.getElementById(\"resourceYoutube\")\n      .value.trim();\n\n  /* =====================================\n   제175-5-14-44단계\n   사진 활동정보 입력값 가져오기\n===================================== */\n\nconst activityCategory =\n  category === \"image\"\n    ? document.getElementById(\n        \"resourceActivityCategory\"\n      ).value\n    : null;\n\nconst eventName =\n  category === \"image\"\n    ? document.getElementById(\n        \"resourceEventName\"\n      ).value.trim()\n    : \"\";\n\nconst eventDate =\n  category === \"image\"\n    ? document.getElementById(\n        \"resourceEventDate\"\n      ).value\n    : \"\";\n\n/* 사진자료 활동 분류 필수 검사 */\n\nif (\n  category === \"image\" &&\n  !activityCategory\n) {\n\n  alert(\"사진자료의 활동 분류를 선택해 주세요.\");\n\n  return;\n\n}\n\n  if (!title) {\n    alert(\"자료 제목을 입력해 주세요.\");\n    return;\n  }\n\n  /* =====================================\n   137단계\n   자료실 첨부파일 사전 검사\n===================================== */\n\n/* 파일 선택 */\n\nconst selectedDocuments = Array.from(\n  document.getElementById(\"resourceDocuments\").files\n);\n\nconst selectedPhotos = Array.from(\n  document.getElementById(\"resourcePhotos\").files\n);\n\nconst selectedAudio = Array.from(\n  document.getElementById(\"resourceAudio\").files\n);\n\n/* 전체 파일 목록 */\n\nconst selectedFiles = [\n  ...selectedDocuments,\n  ...selectedPhotos,\n  ...selectedAudio\n];\n\n/* 최대 첨부 개수 */\n\nif (selectedFiles.length > 10) {\n  alert(\n    \"첨부파일은 문서·사진·음성을 합쳐 \" +\n    \"최대 10개까지 등록할 수 있습니다.\"\n  );\n  return;\n}\n\n/* 파일당 최대 크기 */\n\nconst maxFileSize = 20 * 1024 * 1024;\n\n/* 허용 확장자 */\n\nconst allowedDocumentExtensions = [\n  \"pdf\", \"hwp\", \"hwpx\",\n  \"doc\", \"docx\",\n  \"xls\", \"xlsx\",\n  \"ppt\", \"pptx\",\n  \"zip\"\n];\n\nconst allowedImageExtensions = [\n  \"jpg\", \"jpeg\", \"png\",\n  \"webp\", \"gif\"\n];\n\nconst allowedAudioExtensions = [\n  \"mp3\", \"wav\", \"m4a\"\n];\n\n/* 파일 검사 함수 */\n\nfunction validateFiles(files, allowedExtensions) {\n\n  for (const file of files) {\n\n    const extension =\n      file.name.split(\".\").pop().toLowerCase();\n\n    if (!allowedExtensions.includes(extension)) {\n      return \"지원하지 않는 파일 형식입니다: \" +\n        file.name;\n    }\n\n    if (file.size === 0) {\n      return \"빈 파일은 등록할 수 없습니다: \" +\n        file.name;\n    }\n\n    if (file.size > maxFileSize) {\n      return \"파일당 20MB를 초과했습니다: \" +\n        file.name;\n    }\n\n  }\n\n  return null;\n\n}\n\n/* 문서 검사 */\n\nconst documentError = validateFiles(\n  selectedDocuments,\n  allowedDocumentExtensions\n);\n\nif (documentError) {\n  alert(documentError);\n  return;\n}\n\n/* 사진 검사 */\n\nconst photoError = validateFiles(\n  selectedPhotos,\n  allowedImageExtensions\n);\n\nif (photoError) {\n  alert(photoError);\n  return;\n}\n\n/* 음성 검사 */\n\nconst audioError = validateFiles(\n  selectedAudio,\n  allowedAudioExtensions\n);\n\nif (audioError) {\n  alert(audioError);\n  return;\n}\n\n  /* YouTube 주소 기본 검사 */\n\n  if (youtubeUrl) {\n\n    let url;\n\n    try {\n      url = new URL(youtubeUrl);\n    } catch {\n      alert(\"올바른 YouTube 주소를 입력해 주세요.\");\n      return;\n    }\n\n    const hostname = url.hostname.toLowerCase();\n\n    const allowedHosts = [\n      \"youtube.com\",\n      \"www.youtube.com\",\n      \"m.youtube.com\",\n      \"youtu.be\",\n      \"www.youtu.be\"\n    ];\n\n    if (\n      url.protocol !== \"https:\" ||\n      !allowedHosts.includes(hostname)\n    ) {\n      alert(\"HTTPS YouTube 주소만 등록할 수 있습니다.\");\n      return;\n    }\n\n  }\n\n  /* 등록 버튼 비활성화 */\n\n  resourceSubmitButton.disabled = true;\n  resourceSubmitButton.textContent = \"등록 중...\";\n\n  try {\n\n    /* 현재 로그인 사용자 확인 */\n\n    const { data: authData, error: authError } =\n      await supabase.auth.getUser();\n\n    if (authError || !authData.user) {\n      throw new Error(\"로그인 상태를 확인할 수 없습니다.\");\n    }\n\n\n    \n/* =====================================\n   142-4단계\n   기존 자료 수정 저장\n===================================== */\n\nif (resourceEditMode) {\n\n  if (!currentResourceId) {\n    throw new Error(\n      \"수정할 자료가 선택되지 않았습니다.\"\n    );\n  }\n\n  /* 수정 시 신규 파일 첨부 방지 */\n\n  if (selectedFiles.length > 0) {\n    throw new Error(\n      \"자료 수정 중에는 새 파일을 첨부할 수 없습니다.\"\n    );\n  }\n\n  /* 기존 자료 수정 */\n\n  const { data: updatedResource, error: updateError } =\n    await supabase\n      .from(\"resource_posts\")\n      .update({\n  title: title,\n  category: category,\n  content: content,\n  youtube_url: youtubeUrl || null,\n\n  activity_category:\n    category === \"image\"\n      ? activityCategory\n      : null,\n\n  event_name:\n    category === \"image\"\n      ? eventName || null\n      : null,\n\n  event_date:\n    category === \"image\"\n      ? eventDate || null\n      : null\n})\n      .eq(\"id\", currentResourceId)\n      .select(\"id\")\n      .single();\n\n  if (updateError) {\n    throw updateError;\n  }\n\n  if (!updatedResource) {\n    throw new Error(\n      \"수정된 자료를 확인할 수 없습니다.\"\n    );\n  }\n\n  /* 수정 모드 종료 */\n\n  resourceEditMode = false;\n\n  /* 입력 화면 초기화 */\n\n  resourceForm.reset();\n\n  /* 등록 버튼 문구 복원 */\n\n  resourceSubmitButton.textContent =\n    \"자료 등록\";\n\n  /* 자료 목록 갱신 */\n\n  await loadResources();\n\n  /* 상세화면 다시 열기 */\n\n  resourceWriteView.hidden = true;\n\n  await openResource(updatedResource.id);\n\n  alert(\"자료가 정상적으로 수정되었습니다.\");\n\n  return;\n\n}\n    \n   /* =====================================\n   자료실 게시물 저장\n     ===================================== */\n\nconst { data: resource, error: postError } =\n  await supabase\n    .from(\"resource_posts\")\n    .insert({\n  title: title,\n  category: category,\n  content: content,\n  youtube_url: youtubeUrl || null,\n  author_id: authData.user.id,\n\n  activity_category:\n    category === \"image\"\n      ? activityCategory\n      : null,\n\n  event_name:\n    category === \"image\"\n      ? eventName || null\n      : null,\n\n  event_date:\n    category === \"image\"\n      ? eventDate || null\n      : null\n})\n    .select(\"id\")\n    .single();\n\nif (postError) {\n  throw postError;\n}\n\n/* =====================================\n   자료실 첨부파일 업로드\n===================================== */\n\nconst uploadItems = [\n  ...selectedDocuments.map(file => ({\n    file,\n    type: \"document\"\n  })),\n\n  ...selectedPhotos.map(file => ({\n    file,\n    type: \"image\"\n  })),\n\n  ...selectedAudio.map(file => ({\n    file,\n    type: \"audio\"\n  }))\n];\n\n/* 업로드한 파일 경로 기록 */\n\nconst uploadedPaths = [];\n\ntry {\n\n  for (let i = 0; i < uploadItems.length; i++) {\n\n    const item = uploadItems[i];\n\n    const file = item.file;\n\n    const extension =\n      file.name.split(\".\").pop().toLowerCase();\n\n    const filePath =\n      authData.user.id + \"/\" +\n      crypto.randomUUID() + \".\" + extension;\n\n    /* 업로드 진행 상황 */\n\n    resourceSubmitButton.textContent =\n      `파일 업로드 중 (${i + 1}/${uploadItems.length})`;\n\n    /* Storage 업로드 */\n\n    const { error: uploadError } =\n      await supabase.storage\n        .from(\"resource-files\")\n        .upload(filePath, file, {\n          contentType:\n            file.type || \"application/octet-stream\",\n          upsert: false\n        });\n\n    if (uploadError) {\n      throw new Error(\n        \"파일 업로드 실패: \" +\n        file.name + \"\\n\" +\n        uploadError.message\n      );\n    }\n\n    uploadedPaths.push(filePath);\n\n    /* 첨부파일 정보 등록 */\n\n    const { error: attachmentError } =\n      await supabase\n        .from(\"resource_attachments\")\n        .insert({\n          resource_id: resource.id,\n          uploader_id: authData.user.id,\n          file_name: file.name,\n          file_path: filePath,\n          file_type:\n            file.type || \"application/octet-stream\",\n          file_size: file.size,\n          attachment_type: item.type\n        });\n\n    if (attachmentError) {\n      throw new Error(\n        \"첨부정보 등록 실패: \" +\n        file.name + \"\\n\" +\n        attachmentError.message\n      );\n    }\n\n  }\n\n} catch (uploadError) {\n\n  console.error(\n    \"자료실 파일 업로드 오류:\",\n    uploadError\n  );\n\n  /* 업로드된 파일 정리 */\n\n  if (uploadedPaths.length > 0) {\n\n    const { error: cleanupError } =\n      await supabase.storage\n        .from(\"resource-files\")\n        .remove(uploadedPaths);\n\n    if (cleanupError) {\n      console.error(\n        \"업로드 파일 정리 실패:\",\n        cleanupError\n      );\n    }\n\n  }\n\n  throw uploadError;\n\n}\n\n    /* 목록 갱신 */\n\n    await loadResources();\n\n    /* 등록 화면 닫기 */\n\n    resourceForm.reset();\n\n    resourceWriteView.hidden = true;\n    resourceDetailView.hidden = true;\n    resourceListView.hidden = false;\n\n    alert(\"자료가 정상적으로 등록되었습니다.\");\n\n  } catch (error) {\n\n    console.error(\"자료 등록 오류:\", error);\n\n    alert(\n      \"자료 등록 중 오류가 발생했습니다.\\n\" +\n      error.message\n    );\n\n  } finally {\n\n    resourceSubmitButton.disabled = false;\n    resourceSubmitButton.textContent = \"자료 등록\";\n\n  }\n\n});\n\n/* =====================================\n   138단계\n   자료실 첨부파일 표시 및 다운로드\n===================================== */\n\nasync function loadResourceAttachments(resourceId) {\n\n  const attachmentArea =\n    document.getElementById(\"resourceAttachments\");\n\n  attachmentArea.replaceChildren();\n\n  /* 첨부파일 정보 조회 */\n\n  const { data: files, error } =\n    await supabase\n      .from(\"resource_attachments\")\n      .select(\n        \"id, file_name, file_path, file_type, file_size, attachment_type\"\n      )\n      .eq(\"resource_id\", resourceId)\n      .order(\"id\", {\n        ascending: true\n      });\n\n  if (error) {\n\n    console.error(\n      \"자료실 첨부파일 조회 오류:\",\n      error\n    );\n\n    attachmentArea.textContent =\n      \"첨부파일을 불러오지 못했습니다.\";\n\n    return;\n  }\n\n  if (!files || files.length === 0) {\n    return;\n  }\n\n  /* 제목 */\n\n  const heading =\n    document.createElement(\"h3\");\n\n  heading.textContent = \"📎 첨부파일\";\n\n  attachmentArea.appendChild(heading);\n\n  /* 파일 목록 */\n\n  for (const file of files) {\n\n/* =====================================\n   139단계\n   첨부사진 미리보기\n===================================== */\n\nif (file.attachment_type === \"image\") {\n\n  const { data: imageData } =\n    supabase.storage\n      .from(\"resource-files\")\n      .getPublicUrl(file.file_path);\n\n  const image =\n    document.createElement(\"img\");\n\n  image.src = imageData.publicUrl;\n\n  image.alt = file.file_name || \"첨부사진\";\n\n  image.loading = \"lazy\";\n\n  image.style.width = \"180px\";\n  image.style.maxWidth = \"100%\";\n  image.style.height = \"auto\";\n  image.style.borderRadius = \"8px\";\n  image.style.margin = \"10px 0\";\n  image.style.cursor = \"pointer\";\n  image.style.display = \"block\";\n\n  /* 사진 클릭 시 확대 */\n\n  image.addEventListener(\"click\", () => {\n\n    window.open(\n      imageData.publicUrl,\n      \"_blank\",\n      \"noopener,noreferrer\"\n    );\n\n  });\n\n  attachmentArea.appendChild(image);\n\n}\n    \n    const row =\n      document.createElement(\"div\");\n\n/* =====================================\n   140단계\n   첨부 음성파일 재생\n===================================== */\n\nif (file.attachment_type === \"audio\") {\n\n  /* 음성파일 공개 URL */\n\n  const { data: audioData } =\n    supabase.storage\n      .from(\"resource-files\")\n      .getPublicUrl(file.file_path);\n\n  /* 음성 재생 영역 */\n\n  const audioContainer =\n    document.createElement(\"div\");\n\n  audioContainer.style.margin = \"15px 0\";\n  audioContainer.style.padding = \"15px\";\n  audioContainer.style.background = \"#f1f5f9\";\n  audioContainer.style.borderRadius = \"8px\";\n\n  /* 음성 제목 */\n\n  const audioTitle =\n    document.createElement(\"div\");\n\n  audioTitle.textContent =\n    \"🎵 \" + file.file_name;\n\n  audioTitle.style.fontWeight = \"bold\";\n  audioTitle.style.marginBottom = \"10px\";\n\n  /* HTML5 음성 플레이어 */\n\n  const audio =\n    document.createElement(\"audio\");\n\n  audio.controls = true;\n  audio.preload = \"metadata\";\n\n  audio.style.width = \"100%\";\n  audio.style.maxWidth = \"600px\";\n\n  /* 음성파일 주소 */\n\n  audio.src = audioData.publicUrl;\n\n  /* 재생 오류 처리 */\n\n  audio.addEventListener(\"error\", () => {\n\n    console.error(\n      \"음성파일 재생 오류:\",\n      file.file_name\n    );\n\n    audioTitle.textContent =\n      \"⚠️ 음성파일을 재생할 수 없습니다: \" +\n      file.file_name;\n\n  });\n\n  /* 화면에 추가 */\n\n  audioContainer.appendChild(audioTitle);\n  audioContainer.appendChild(audio);\n\n  attachmentArea.appendChild(audioContainer);\n\n}\n    \n    row.style.margin = \"12px 0\";\n    row.style.padding = \"12px\";\n    row.style.background = \"#f8fafc\";\n    row.style.borderRadius = \"7px\";\n\n    /* 파일 종류 */\n\n    const icons = {\n      document: \"📄\",\n      image: \"🖼️\",\n      audio: \"🎵\",\n      other: \"📦\"\n    };\n\n    const icon =\n      icons[file.attachment_type] || \"📎\";\n\n    /* 파일명 */\n\n    const name =\n      document.createElement(\"div\");\n\n    name.textContent =\n      icon + \" \" + file.file_name;\n\n    name.style.marginBottom = \"8px\";\n\n    /* 파일 크기 */\n\n    const size =\n      document.createElement(\"small\");\n\n    size.textContent =\n      (file.file_size / 1024 / 1024)\n        .toFixed(2) + \" MB\";\n\n    /* 다운로드 버튼 */\n\n    const button =\n      document.createElement(\"button\");\n\n    button.type = \"button\";\n    button.className = \"primary\";\n    button.textContent = \"다운로드\";\n    button.style.marginTop = \"10px\";\n    button.style.display = \"block\";\n\n    /* =====================================\n   제175-5-14-41단계\n   첨부파일 다운로드 기능 보완\n===================================== */\n\nbutton.addEventListener(\"click\", async () => {\n\n  if (button.disabled) return;\n\n  button.disabled = true;\n  button.textContent = \"다운로드 준비 중...\";\n\n  try {\n\n    const bucket = supabase.storage\n      .from(\"resource-files\");\n\n    /* 공개 파일 URL */\n\n    const { data: publicData } =\n      bucket.getPublicUrl(file.file_path);\n\n    if (!publicData?.publicUrl) {\n      throw new Error(\n        \"파일 주소를 확인할 수 없습니다.\"\n      );\n    }\n\n    /* 파일 가져오기 */\n\n    const response = await fetch(\n      publicData.publicUrl\n    );\n\n    if (!response.ok) {\n      throw new Error(\n        \"파일 요청 실패: HTTP \" +\n        response.status\n      );\n    }\n\n    /* Blob 생성 */\n\n    const blob = await response.blob();\n\n    if (blob.size === 0) {\n      throw new Error(\n        \"다운로드할 파일이 비어 있습니다.\"\n      );\n    }\n\n    /* 임시 다운로드 주소 */\n\n    const objectUrl =\n      URL.createObjectURL(blob);\n\n    /* 다운로드 링크 생성 */\n\n    const link =\n      document.createElement(\"a\");\n\n    link.href = objectUrl;\n\n    link.download =\n      file.file_name || \"download\";\n\n    document.body.appendChild(link);\n\n    link.click();\n\n    link.remove();\n\n    /* 메모리 정리 */\n\n    setTimeout(() => {\n      URL.revokeObjectURL(objectUrl);\n    }, 60000);\n\n  } catch (error) {\n\n    console.error(\n      \"[자료실] 다운로드 오류:\",\n      error\n    );\n\n    alert(\n      \"파일 다운로드에 실패했습니다.\\n\" +\n      error.message\n    );\n\n  } finally {\n\n    button.disabled = false;\n    button.textContent = \"다운로드\";\n\n  }\n\n});\n\n    row.appendChild(name);\n    row.appendChild(size);\n    row.appendChild(button);\n\n    attachmentArea.appendChild(row);\n\n  }\n\n}\n\n/* =====================================\n   141단계\n   YouTube 주소 변환 함수\n===================================== */\n\nfunction getYoutubeEmbedUrl(youtubeUrl) {\n\n  if (!youtubeUrl) {\n    return null;\n  }\n\n  try {\n\n    const url = new URL(youtubeUrl);\n\n    if (url.protocol !== \"https:\") {\n      return null;\n    }\n\n    const host = url.hostname.toLowerCase();\n\n    let videoId = null;\n\n    /* 일반 YouTube 주소 */\n\n    if (\n      host === \"youtube.com\" ||\n      host === \"www.youtube.com\" ||\n      host === \"m.youtube.com\"\n    ) {\n\n      if (url.pathname === \"/watch\") {\n\n        videoId = url.searchParams.get(\"v\");\n\n      } else if (\n        url.pathname.startsWith(\"/shorts/\")\n      ) {\n\n        videoId = url.pathname.split(\"/\")[2];\n\n      } else if (\n        url.pathname.startsWith(\"/embed/\")\n      ) {\n\n        videoId = url.pathname.split(\"/\")[2];\n\n      }\n\n    }\n\n    /* YouTube 단축 주소 */\n\n    if (\n      host === \"youtu.be\" ||\n      host === \"www.youtu.be\"\n    ) {\n\n      videoId = url.pathname.split(\"/\")[1];\n\n    }\n\n    /* 동영상 ID 검사 */\n\n    if (\n      !videoId ||\n      !/^[a-zA-Z0-9_-]{11}$/.test(videoId)\n    ) {\n      return null;\n    }\n\n    return (\n      \"https://www.youtube-nocookie.com/embed/\" +\n      videoId\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"YouTube 주소 변환 오류:\",\n      error\n    );\n\n    return null;\n\n  }\n\n}\n\n/* =====================================\n   자료실 YouTube 영상 표시\n===================================== */\n\nfunction showResourceYoutube(youtubeUrl) {\n\n  const mediaArea =\n    document.getElementById(\"resourceMedia\");\n\n  mediaArea.replaceChildren();\n\n  if (!youtubeUrl) {\n    return;\n  }\n\n  const embedUrl =\n    getYoutubeEmbedUrl(youtubeUrl);\n\n  if (!embedUrl) {\n\n    mediaArea.textContent =\n      \"올바른 YouTube 영상 주소가 아닙니다.\";\n\n    return;\n\n  }\n\n  /* 영상 제목 */\n\n  const heading =\n    document.createElement(\"h3\");\n\n  heading.textContent = \"▶️ 동영상\";\n\n  mediaArea.appendChild(heading);\n\n  /* 반응형 영상 영역 */\n\n  const videoContainer =\n    document.createElement(\"div\");\n\n  videoContainer.style.position = \"relative\";\n  videoContainer.style.width = \"100%\";\n  videoContainer.style.maxWidth = \"800px\";\n  videoContainer.style.aspectRatio = \"16 / 9\";\n  videoContainer.style.margin = \"20px 0\";\n\n  /* YouTube 플레이어 */\n\n  const iframe =\n    document.createElement(\"iframe\");\n\n  iframe.src = embedUrl;\n\n  iframe.title = \"YouTube 동영상\";\n\n  iframe.style.width = \"100%\";\n  iframe.style.height = \"100%\";\n  iframe.style.border = \"0\";\n  iframe.style.borderRadius = \"10px\";\n\n  iframe.loading = \"lazy\";\n\n  iframe.allow =\n    \"accelerometer; autoplay; clipboard-write; \" +\n    \"encrypted-media; gyroscope; picture-in-picture; \" +\n    \"web-share\";\n\n  iframe.allowFullscreen = true;\n\n  videoContainer.appendChild(iframe);\n\n  mediaArea.appendChild(videoContainer);\n\n}\n\n/* =====================================\n   142-3단계\n   자료 수정 화면 열기\n===================================== */\n\n/* 현재 상세보기 자료 ID */\n\nlet currentResourceId = null;\n\n/* 수정 모드 여부 */\n\nlet resourceEditMode = false;\n\n/* 자료 수정 버튼 */\n\nconst resourceEditButton =\n  document.getElementById(\"resourceEditButton\");\n\n/* =====================================\n   자료 수정 버튼 클릭\n===================================== */\n\nresourceEditButton.addEventListener(\n  \"click\",\n  async () => {\n\n   \n   /* =====================================\n   제175-5-14-20단계\n\n   관리자 및 승인회원\n   자료 수정 권한 확인\n===================================== */\n\n/* 수정 대상 확인 */\n\nif (currentResourceId == null) {\n\n  alert(\"수정할 자료가 선택되지 않았습니다.\");\n\n  return;\n}\n\n/* 로그인 사용자 확인 */\n\nconst { data: authData, error: authError } =\n  await supabase.auth.getUser();\n\nif (authError || !authData?.user) {\n\n  alert(\"로그인이 필요합니다.\");\n\n  return;\n}\n\n/* 수정 대상 작성자 확인 */\n\nconst { data: targetResource, error: targetError } =\n  await supabase\n    .from(\"resource_posts\")\n    .select(\"id, author_id\")\n    .eq(\"id\", currentResourceId)\n    .single();\n\nif (targetError || !targetResource) {\n\n  alert(\"수정할 자료를 확인할 수 없습니다.\");\n\n  return;\n}\n\n/* 관리자 권한 또는 본인 자료 확인 */\n\nconst isOwnResource =\n  targetResource.author_id === authData.user.id;\n\nconst canEditResource =\n  resourceAdmin ||\n  (\n    resourceWriter &&\n    isOwnResource\n  );\n\nif (!canEditResource) {\n\n  alert(\"본인이 등록한 자료만 수정할 수 있습니다.\");\n\n  return;\n}\n\n    /* 기존 자료 조회 */\n\n    const { data, error } =\n      await supabase\n        .from(\"resource_posts\")\n        .select(\n  \"id, title, category, content, youtube_url, activity_category, event_name, event_date\"\n)\n        .eq(\"id\", currentResourceId)\n        .single();\n\n    if (error) {\n\n      console.error(\n        \"자료 수정 조회 오류:\",\n        error\n      );\n\n      alert(\n        \"자료를 불러오지 못했습니다.\\n\" +\n        error.message\n      );\n\n      return;\n    }\n\n    /* 수정 모드 활성화 */\n\n    resourceEditMode = true;\n\n    /* 기존 자료 입력 */\n\n    document.getElementById(\n      \"resourceTitle\"\n    ).value = data.title || \"\";\n\n    document.getElementById(\n      \"resourceCategory\"\n    ).value = data.category || \"other\";\n\n    document.getElementById(\n      \"resourceContent\"\n    ).value = data.content || \"\";\n\n    document.getElementById(\n      \"resourceYoutube\"\n    ).value = data.youtube_url || \"\";\n\n    /* =====================================\n   제175-5-14-45단계\n   기존 사진 활동정보 자동 불러오기\n===================================== */\n\n/* 활동 분류 */\n\ndocument.getElementById(\n  \"resourceActivityCategory\"\n).value = data.activity_category || \"\";\n\n/* 행사명 */\n\ndocument.getElementById(\n  \"resourceEventName\"\n).value = data.event_name || \"\";\n\n/* 행사일 */\n\ndocument.getElementById(\n  \"resourceEventDate\"\n).value = data.event_date || \"\";\n\n/* 사진 활동정보 표시 상태 갱신 */\n\nupdatePhotoActivityFields();\n\n    /* 파일 입력 초기화 */\n\n    document.getElementById(\n      \"resourceDocuments\"\n    ).value = \"\";\n\n    document.getElementById(\n      \"resourcePhotos\"\n    ).value = \"\";\n\n    document.getElementById(\n      \"resourceAudio\"\n    ).value = \"\";\n\n    /* 등록 버튼 문구 변경 */\n\n    document.getElementById(\n      \"resourceSubmitButton\"\n    ).textContent = \"수정 내용 저장\";\n\n    /* 화면 전환 */\n\n    resourceListView.hidden = true;\n    resourceDetailView.hidden = true;\n    resourceWriteView.hidden = false;\n\n    document.getElementById(\n      \"resourceTitle\"\n    ).focus();\n\n  }\n);\n\n/* =====================================\n   142-5-2단계\n   관리자 자료 삭제\n===================================== */\n\nconst resourceDeleteButton =\n  document.getElementById(\"resourceDeleteButton\");\n\nresourceDeleteButton.addEventListener(\n  \"click\",\n  async () => {\n\n    /* 중복 클릭 방지 */\n\n    if (resourceDeleteButton.disabled) {\n      return;\n    }\n\n   /* =====================================\n   제175-5-14-26단계\n\n   관리자 및 승인회원\n   자료 삭제 권한 확인\n===================================== */\n\nif (!resourceAdmin && !resourceWriter) {\n\n  alert(\n    \"자료 삭제 권한이 없습니다.\"\n  );\n\n  return;\n\n}\n\n    if (currentResourceId == null) {\n      alert(\"삭제할 자료가 선택되지 않았습니다.\");\n      return;\n    }\n\n    /* 삭제할 자료 ID 보관 */\n\n    const resourceId = currentResourceId;\n\n    /* 삭제 확인 */\n\n    const confirmed = confirm(\n      \"이 자료를 삭제하시겠습니까?\\n\\n\" +\n      \"게시물과 첨부파일이 삭제됩니다.\\n\" +\n      \"삭제 후에는 복구하기 어렵습니다.\"\n    );\n\n    if (!confirmed) {\n      return;\n    }\n\n    resourceDeleteButton.disabled = true;\n    resourceDeleteButton.textContent = \"삭제 중...\";\n\n    try {\n\n      /* 로그인 상태 재확인 */\n\n      const { data: authData, error: authError } =\n        await supabase.auth.getUser();\n\n      if (authError || !authData.user) {\n        throw new Error(\n          \"로그인 상태를 확인할 수 없습니다.\"\n        );\n      }\n\n      /* =====================================\n   제175-5-14-26단계\n\n   삭제 대상 작성자 및 권한 재확인\n===================================== */\n\n/* 삭제 대상 게시물 확인 */\n\nconst { data: targetResource, error: targetError } =\n  await supabase\n    .from(\"resource_posts\")\n    .select(\"id, author_id\")\n    .eq(\"id\", resourceId)\n    .single();\n\nif (targetError || !targetResource) {\n\n  throw new Error(\n    \"삭제할 자료를 확인할 수 없습니다.\"\n  );\n\n}\n\n/* 관리자 권한 재확인 */\n\nconst { data: isAdmin, error: adminError } =\n  await supabase.rpc(\"is_resource_admin\");\n\nif (adminError) {\n\n  throw new Error(\n    \"관리자 권한 확인 중 오류가 발생했습니다.\"\n  );\n\n}\n\n/* 승인회원 권한 재확인 */\n\nconst { data: isApprovedMember, error: memberError } =\n  await supabase.rpc(\n    \"is_approved_resource_member\"\n  );\n\nif (memberError) {\n\n  throw new Error(\n    \"회원 승인 상태 확인 중 오류가 발생했습니다.\"\n  );\n\n}\n\n/* 본인 작성 자료 여부 */\n\nconst isOwnResource =\n  targetResource.author_id === authData.user.id;\n\n/* 최종 삭제 권한 */\n\nconst canDeleteResource =\n  isAdmin === true ||\n  (\n    isApprovedMember === true &&\n    isOwnResource\n  );\n\n/* 권한이 없으면 삭제 중단 */\n\nif (!canDeleteResource) {\n\n  throw new Error(\n    \"본인이 등록한 자료만 삭제할 수 있습니다.\"\n  );\n\n}\n\nconsole.log(\n  \"[자료실] 삭제 권한 확인 완료\",\n  {\n    isAdmin,\n    isApprovedMember,\n    isOwnResource,\n    canDeleteResource\n  }\n);\n\n      /* 첨부파일 경로 조회 */\n\n      const { data: attachments, error: attachmentError } =\n        await supabase\n          .from(\"resource_attachments\")\n          .select(\"file_path\")\n          .eq(\"resource_id\", resourceId);\n\n      if (attachmentError) {\n        throw attachmentError;\n      }\n\n      const filePaths = [\n        ...new Set(\n          (attachments || [])\n            .map(file => file.file_path)\n            .filter(Boolean)\n        )\n      ];\n\n      /* Storage 실제 파일 삭제 */\n\n      if (filePaths.length > 0) {\n\n        const { error: storageError } =\n          await supabase.storage\n            .from(\"resource-files\")\n            .remove(filePaths);\n\n        if (storageError) {\n          throw new Error(\n            \"첨부파일 삭제 실패: \" +\n            storageError.message\n          );\n        }\n\n      }\n\n      /* 게시물 삭제 */\n\n      const { data: deletedPosts, error: deleteError } =\n        await supabase\n          .from(\"resource_posts\")\n          .delete()\n          .eq(\"id\", resourceId)\n          .select(\"id\");\n\n      if (deleteError) {\n        throw new Error(\n          \"게시물 삭제 실패: \" +\n          deleteError.message\n        );\n      }\n\n      if (!deletedPosts || deletedPosts.length !== 1) {\n        throw new Error(\n          \"게시물 삭제가 확인되지 않았습니다.\"\n        );\n      }\n\n      /* 화면 초기화 */\n\n      currentResourceId = null;\n      resourceEditMode = false;\n\n      resourceDetailView.hidden = true;\n      resourceWriteView.hidden = true;\n      resourceListView.hidden = false;\n\n      /* 자료 목록 갱신 */\n\n      await loadResources();\n\n      alert(\"자료가 정상적으로 삭제되었습니다.\");\n\n    } catch (error) {\n\n      console.error(\n        \"자료실 삭제 오류:\",\n        error\n      );\n\n      alert(\n        \"자료 삭제 중 오류가 발생했습니다.\\n\" +\n        error.message +\n        \"\\n\\n삭제가 일부 진행되었을 수 있으므로 \" +\n        \"Storage와 데이터베이스를 확인해 주세요.\"\n      );\n\n    } finally {\n\n      resourceDeleteButton.disabled = false;\n      resourceDeleteButton.textContent = \"🗑️ 자료 삭제\";\n\n    }\n\n  }\n);\n  \n/* =====================================\n   제175-5-4단계\n   통합 자료실 초기화\n===================================== */\n\nasync function initializeResources() {\n\n  await checkResourceAdmin();\n\n  await loadResources();\n\n  await loadResourceActivityCategories();\n\n}\n\ninitializeResources();\n\n\u003c/script>\n  \n</body>\n</html>\n",
  "view=knowledge-resources": "Create knowledge and resources landing page\n<!DOCTYPE html>\n<html lang=\"ko\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\n      content=\"width=device-width, initial-scale=1.0\">\n\n<title>지식·자료 | 글로벌 AI 허브 고양특례시</title>\n\n<style>\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    \"Malgun Gothic\",\n    \"맑은 고딕\",\n    Arial,\n    sans-serif;\n  background: #f3f7fc;\n  color: #17345c;\n  line-height: 1.7;\n}\n\n/* 상단 */\n\nheader {\n  background: #0b55a4;\n  color: white;\n  text-align: center;\n  padding: 45px 20px;\n}\n\nheader h1 {\n  margin: 0 0 15px;\n  font-size: 34px;\n}\n\nheader p {\n  font-size: 18px;\n  margin: 0;\n}\n\n/* 본문 */\n\nmain {\n  max-width: 1100px;\n  margin: 45px auto;\n  padding: 0 20px;\n}\n\n.introduction {\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.introduction h2 {\n  color: #0754a3;\n  font-size: 30px;\n}\n\n.introduction p {\n  font-size: 18px;\n}\n\n/* 자료실 카드 */\n\n.resource-grid {\n  display: grid;\n  grid-template-columns:\n    repeat(2, minmax(0, 1fr));\n  gap: 25px;\n}\n\n.resource-card {\n  background: white;\n  border-radius: 14px;\n  padding: 35px;\n  box-shadow:\n    0 4px 15px rgba(0,0,0,0.06);\n\n  display: flex;\n  flex-direction: column;\n}\n\n.resource-card h3 {\n  color: #0754a3;\n  font-size: 25px;\n  margin-top: 0;\n}\n\n.resource-card p {\n  flex-grow: 1;\n  font-size: 17px;\n}\n\n.resource-link {\n  display: inline-block;\n  text-align: center;\n  background: #0b55a4;\n  color: white;\n  text-decoration: none;\n  padding: 14px 20px;\n  border-radius: 8px;\n  font-weight: bold;\n  margin-top: 20px;\n}\n\n.resource-link:hover,\n.resource-link:focus-visible {\n  background: #073c78;\n}\n\n/* 홈 버튼 */\n\n.home-link {\n  display: block;\n  width: fit-content;\n  margin: 40px auto;\n  padding: 12px 25px;\n  background: #ffe34d;\n  color: #073c78;\n  border-radius: 8px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* 하단 *
