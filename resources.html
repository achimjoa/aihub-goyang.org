titleButton.addEventListener("click", () => {

});

titleCell.appendChild(titleButton);

document.getElementById(

await loadResourceAttachments(data.id);

const resourceListView =

const resourceDetailView =

const resourceWriteView =

const resourceForm =
  document.getElementById("resourceForm");

const resourceCancelButton =

/* =====================================

===================================== */

resourceWriteButton.addEventListener(

  () => {

    /* 관리자 권한 확인 */

/* =====================================
   136단계
   자료실 게시물 등록
===================================== */

const resourceSubmitButton =
  document.getElementById("resourceSubmitButton");

resourceForm.addEventListener("submit", async event => {

  event.preventDefault();

  /* 중복 제출 방지 */

  if (resourceSubmitButton.disabled) {
    return;
  }

  /* 관리자 권한 확인 */

    alert("관리자만 자료를 등록할 수 있습니다.");
    return;
  }

  /* 입력값 확인 */

  const title =
    document.getElementById("resourceTitle")
      .value.trim();

  const category =
    document.getElementById("resourceCategory")
      .value;

  const content =
    document.getElementById("resourceContent")
      .value.trim();

  const youtubeUrl =
    document.getElementById("resourceYoutube")
      .value.trim();

  if (!title) {
    alert("자료 제목을 입력해 주세요.");
    return;
  }

  /* =====================================
   137단계
   자료실 첨부파일 사전 검사
===================================== */

/* 파일 선택 */

const selectedDocuments = Array.from(
  document.getElementById("resourceDocuments").files
);

const selectedPhotos = Array.from(
  document.getElementById("resourcePhotos").files
);

const selectedAudio = Array.from(
  document.getElementById("resourceAudio").files
);

/* 전체 파일 목록 */

const selectedFiles = [
  ...selectedDocuments,
  ...selectedPhotos,
  ...selectedAudio
];

/* 최대 첨부 개수 */

if (selectedFiles.length > 10) {
  alert(
    "첨부파일은 문서·사진·음성을 합쳐 " +
    "최대 10개까지 등록할 수 있습니다."
  );
  return;
}

/* 파일당 최대 크기 */

const maxFileSize = 20 * 1024 * 1024;

/* 허용 확장자 */

const allowedDocumentExtensions = [
  "pdf", "hwp", "hwpx",
  "doc", "docx",
  "xls", "xlsx",
  "ppt", "pptx",
  "zip"
];

const allowedImageExtensions = [
  "jpg", "jpeg", "png",
  "webp", "gif"
];

const allowedAudioExtensions = [
  "mp3", "wav", "m4a"
];

/* 파일 검사 함수 */

function validateFiles(files, allowedExtensions) {

  for (const file of files) {

    const extension =
      file.name.split(".").pop().toLowerCase();

    if (!allowedExtensions.includes(extension)) {
      return "지원하지 않는 파일 형식입니다: " +
        file.name;
    }

    if (file.size === 0) {
      return "빈 파일은 등록할 수 없습니다: " +
        file.name;
    }

    if (file.size > maxFileSize) {
      return "파일당 20MB를 초과했습니다: " +
        file.name;
    }

  }

  return null;

}

/* 문서 검사 */

const documentError = validateFiles(
  selectedDocuments,
  allowedDocumentExtensions
);

if (documentError) {
  alert(documentError);
  return;
}

/* 사진 검사 */

const photoError = validateFiles(
  selectedPhotos,
  allowedImageExtensions
);

if (photoError) {
  alert(photoError);
  return;
}

/* 음성 검사 */

const audioError = validateFiles(
  selectedAudio,
  allowedAudioExtensions
);

if (audioError) {
  alert(audioError);
  return;
}

  /* YouTube 주소 기본 검사 */

      alert("올바른 YouTube 주소를 입력해 주세요.");

    const allowedHosts = [

      "www.youtube.com",
      "m.youtube.com",
      "youtu.be",
      "www.youtu.be"
    ];

    if (

      !allowedHosts.includes(hostname)
    ) {
      alert("HTTPS YouTube 주소만 등록할 수 있습니다.");

    }

  }

  /* 등록 버튼 비활성화 */

  resourceSubmitButton.disabled = true;

  try {

    })

    .single();

if (postError) {
  throw postError;
}

===================================== */

    file,
    type: "document"
  })),

  ...selectedPhotos.map(file => ({
    file,
    type: "image"
  })),

  ...selectedAudio.map(file => ({
    file,
    type: "audio"
  }))
];

/* 업로드한 파일 경로 기록 */

const uploadedPaths = [];

try {

  for (let i = 0; i < uploadItems.length; i++) {

    const item = uploadItems[i];

    const file = item.file;

    const extension =
      file.name.split(".").pop().toLowerCase();

    const filePath =
      authData.user.id + "/" +
      crypto.randomUUID() + "." + extension;

    /* 업로드 진행 상황 */

    resourceSubmitButton.textContent =
      `파일 업로드 중 (${i + 1}/${uploadItems.length})`;

    /* Storage 업로드 */

    const { error: uploadError } =
      await supabase.storage
        .from("resource-files")
        .upload(filePath, file, {
          contentType:
            file.type || "application/octet-stream",
          upsert: false
        });

    if (uploadError) {
      throw new Error(
        "파일 업로드 실패: " +
        file.name + "\n" +
        uploadError.message
      );
    }

    uploadedPaths.push(filePath);

    /* 첨부파일 정보 등록 */

    const { error: attachmentError } =
      await supabase
        .from("resource_attachments")
        .insert({
          resource_id: resource.id,
          uploader_id: authData.user.id,
          file_name: file.name,
          file_path: filePath,
          file_type:
            file.type || "application/octet-stream",
          file_size: file.size,
          attachment_type: item.type
        });

    if (attachmentError) {
      throw new Error(
        "첨부정보 등록 실패: " +
        file.name + "\n" +
        attachmentError.message
      );
    }

  }

} catch (uploadError) {

  console.error(
    "자료실 파일 업로드 오류:",
    uploadError
  );

  /* 업로드된 파일 정리 */

  if (uploadedPaths.length > 0) {

    const { error: cleanupError } =
      await supabase.storage
        .from("resource-files")
        .remove(uploadedPaths);

    if (cleanupError) {
      console.error(
        "업로드 파일 정리 실패:",
        cleanupError
      );
    }

  }

  throw uploadError;

}

    /* 목록 갱신 */

    await loadResources();

    /* 등록 화면 닫기 */

    resourceForm.reset();

    resourceWriteView.hidden = true;
    resourceDetailView.hidden = true;
    resourceListView.hidden = false;

    alert("자료가 정상적으로 등록되었습니다.");

  } catch (error) {

    console.error("자료 등록 오류:", error);

    alert(
      "자료 등록 중 오류가 발생했습니다.\n" +
      error.message
    );

  } finally {

    resourceSubmitButton.disabled = false;
    resourceSubmitButton.textContent = "자료 등록";

  }

});

/* =====================================
   138단계
   자료실 첨부파일 표시 및 다운로드
===================================== */

async function loadResourceAttachments(resourceId) {

  const attachmentArea =
    document.getElementById("resourceAttachments");

  attachmentArea.replaceChildren();

  /* 첨부파일 정보 조회 */

  const { data: files, error } =
    await supabase
      .from("resource_attachments")
      .select(
        "id, file_name, file_path, file_type, file_size, attachment_type"
      )
      .eq("resource_id", resourceId)
      .order("id", {
        ascending: true
      });

  if (error) {

    console.error(
      "자료실 첨부파일 조회 오류:",
      error
    );

    attachmentArea.textContent =
      "첨부파일을 불러오지 못했습니다.";

    return;
  }

  if (!files || files.length === 0) {
    return;
  }

  /* 제목 */

  const heading =
    document.createElement("h3");

  heading.textContent = "📎 첨부파일";

  attachmentArea.appendChild(heading);

  /* 파일 목록 */

  for (const file of files) {

    const row =
      document.createElement("div");

    row.style.margin = "12px 0";
    row.style.padding = "12px";
    row.style.background = "#f8fafc";
    row.style.borderRadius = "7px";

    /* 파일 종류 */

    const icons = {
      document: "📄",
      image: "🖼️",
      audio: "🎵",
      other: "📦"
    };

    const icon =
      icons[file.attachment_type] || "📎";

    /* 파일명 */

    const name =
      document.createElement("div");

    name.textContent =
      icon + " " + file.file_name;

    name.style.marginBottom = "8px";

    /* 파일 크기 */

    const size =
      document.createElement("small");

    size.textContent =
      (file.file_size / 1024 / 1024)
        .toFixed(2) + " MB";

    /* 다운로드 버튼 */

    const button =
      document.createElement("button");

    button.type = "button";
    button.className = "primary";
    button.textContent = "다운로드";
    button.style.marginTop = "10px";
    button.style.display = "block";

    button.addEventListener("click", async () => {

      button.disabled = true;
      button.textContent = "다운로드 준비 중...";

      try {

        const { data, error: downloadError } =
          await supabase.storage
            .from("resource-files")
            .download(file.file_path);

        if (downloadError) {
          throw downloadError;
        }

        const url =
          URL.createObjectURL(data);

        const link =
          document.createElement("a");

        link.href = url;
        link.download = file.file_name;

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => {
          URL.revokeObjectURL(url);
        }, 60000);

      } catch (error) {

        console.error(
          "파일 다운로드 오류:",
          error
        );

        alert(
          "파일을 다운로드하지 못했습니다.\n" +
          error.message
        );

      } finally {

        button.disabled = false;
        button.textContent = "다운로드";

      }

    });

    row.appendChild(name);
    row.appendChild(size);
    row.appendChild(button);

    attachmentArea.appendChild(row);

  }

}
  
/* =====================================
   최초 실행
===================================== */

async function initializeResources() {

  await checkResourceAdmin();

  await loadResources();

}

initializeResources();
loadResources();

</script>
