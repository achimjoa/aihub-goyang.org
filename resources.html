   관리자:
     자료 등록 가능

     자료 등록 불가
===================================== */

let resourceAdmin = false;
let resourceWriter = false;

async function checkResourceAdmin() {

  /* 권한 초기화 */

  resourceAdmin = false;
  resourceWriter = false;

  resourceWriteButton.hidden = true;

  console.log(
    "[자료실] 권한 확인 시작"
  );

  /* 로그인 사용자 확인 */

  const { data: authData, error: authError } =
    await supabase.auth.getUser();

  if (authError || !authData?.user) {

    console.warn(
      "[자료실] 로그인 확인 실패",
      authError
    );

    return;
  }

  const user = authData.user;

  console.log(
    "[자료실] 로그인 확인 완료"
  );

  /* =====================================
     1. 관리자 권한 확인
  ===================================== */

  const { data: adminResult, error: adminError } =
    await supabase.rpc("is_resource_admin");

  if (adminError) {

    console.error(
      "[자료실] 관리자 권한 확인 오류",
      adminError
    );

  } else {

    resourceAdmin = adminResult === true;

  }

  /* =====================================
     2. 승인회원 확인
  ===================================== */

  const { data: profile, error: profileError } =
    await supabase
      .from("profiles")
      .select("member_role, approval_status")
      .eq("id", user.id)
      .maybeSingle();

  if (profileError) {

    console.error(
      "[자료실] 회원정보 조회 오류",
      profileError
    );

  }

  const approvedMember =
    !profileError &&
    profile?.member_role === "member" &&
    profile?.approval_status === "approved";

  /* =====================================
     3. 자료등록 권한 결정
  ===================================== */

  resourceWriter =
    resourceAdmin || approvedMember;

  /* =====================================
     4. 자료등록 버튼 표시
  ===================================== */

  resourceWriteButton.hidden =
    !resourceWriter;

  /* =====================================
     5. 최종 권한 진단
  ===================================== */

  console.log(
    "[자료실] 최종 권한 확인",
    {
      resourceAdmin,
      approvedMember,
      resourceWriter,
      buttonHidden: resourceWriteButton.hidden
    }
  );

}

async function loadResources() {

  resourceList.replaceChildren();

  const loadingRow =
    document.createElement("tr");

  const loadingCell =
    document.createElement("td");

  loadingCell.colSpan = 4;
  loadingCell.textContent =
    "자료를 불러오고 있습니다.";

  loadingRow.appendChild(loadingCell);
  resourceList.appendChild(loadingRow);

  /* =====================================
   선택된 분류에 따라 자료 조회
===================================== */

let query = supabase
  .from("resource_posts")
  .select("id, title, category, created_at");

/* 전체가 아니면 분류 조건 적용 */

if (currentCategory !== "all") {

  query = query.eq(
    "category",
    currentCategory
  );

}

/* 최신 자료부터 정렬 */

const { data, error } =
  await query.order("created_at", {
    ascending: false
  });

  resourceList.replaceChildren();

  if (error) {

    const row = document.createElement("tr");
    const cell = document.createElement("td");

    cell.colSpan = 4;
    cell.textContent =
      "자료를 불러오지 못했습니다: " +
      error.message;

    row.appendChild(cell);
    resourceList.appendChild(row);

    console.error(
      "자료실 조회 오류:",
      error
    );

    return;
  }

  if (!data || data.length === 0) {

    const row = document.createElement("tr");
    const cell = document.createElement("td");

    cell.colSpan = 4;
    cell.textContent =
      "아직 등록된 자료가 없습니다.";

    row.appendChild(cell);
    resourceList.appendChild(row);

    return;
  }

  data.forEach(resource => {

    const row =
      document.createElement("tr");

    const idCell =
      document.createElement("td");

    idCell.textContent = resource.id;

    const titleCell =
  document.createElement("td");

const titleButton =
  document.createElement("button");

titleButton.type = "button";

titleButton.textContent = resource.title;

titleButton.style.background = "none";
titleButton.style.border = "none";
titleButton.style.padding = "0";
titleButton.style.color = "#0754a6";
titleButton.style.cursor = "pointer";
titleButton.style.textAlign = "left";
titleButton.style.textDecoration = "underline";

titleButton.addEventListener("click", () => {
  openResource(resource.id);
});

titleCell.appendChild(titleButton);

    const categoryCell =
      document.createElement("td");

    categoryCell.textContent =
      categoryNames[resource.category] ||
      resource.category;

    const dateCell =
      document.createElement("td");

    dateCell.textContent =
      new Date(resource.created_at)
        .toLocaleDateString("ko-KR");

    row.append(
      idCell,
      titleCell,
      categoryCell,
      dateCell
    );

    resourceList.appendChild(row);

  });

}

/* 파일당 최대 크기 */

  "xls", "xlsx",

];

const allowedImageExtensions = [

];

];

/* 파일 검사 함수 */

function validateFiles(files, allowedExtensions) {

  for (const file of files) {

    const extension =
      file.name.split(".").pop().toLowerCase();

    if (!allowedExtensions.includes(extension)) {
      return "지원하지 않는 파일 형식입니다: " +
        file.name;
    }

    if (file.size === 0) {
      return "빈 파일은 등록할 수 없습니다: " +
        file.name;
    }

    if (file.size > maxFileSize) {
      return "파일당 20MB를 초과했습니다: " +
        file.name;
    }

  }

  return null;

}

/* 문서 검사 */

const uploadItems = [
  ...selectedDocuments.map(file => ({
    file,
    type: "document"
  })),

  ...selectedPhotos.map(file => ({
    file,
    type: "image"
  })),

  ...selectedAudio.map(file => ({
    file,
    type: "audio"
  }))
];

/* 업로드한 파일 경로 기록 */

const uploadedPaths = [];

try {

  for (let i = 0; i < uploadItems.length; i++) {

    const item = uploadItems[i];

    const file = item.file;

    const extension =
      file.name.split(".").pop().toLowerCase();

    const filePath =
      authData.user.id + "/" +
      crypto.randomUUID() + "." + extension;

    /* 업로드 진행 상황 */

    resourceSubmitButton.textContent =
      `파일 업로드 중 (${i + 1}/${uploadItems.length})`;

    /* Storage 업로드 */

    const { error: uploadError } =
      await supabase.storage
        .from("resource-files")
        .upload(filePath, file, {
          contentType:
            file.type || "application/octet-stream",
          upsert: false
        });

    if (uploadError) {
      throw new Error(
        "파일 업로드 실패: " +
        file.name + "\n" +
        uploadError.message
      );
    }

    uploadedPaths.push(filePath);

    /* 첨부파일 정보 등록 */

    const { error: attachmentError } =
      await supabase
        .from("resource_attachments")
        .insert({
          resource_id: resource.id,
          uploader_id: authData.user.id,
          file_name: file.name,
          file_path: filePath,
          file_type:
            file.type || "application/octet-stream",
          file_size: file.size,
          attachment_type: item.type

      throw new Error(
        "첨부정보 등록 실패: " +
        file.name + "\n" +
        attachmentError.message
      );
    }

  }

} catch (uploadError) {

    "자료실 파일 업로드 오류:",
    uploadError
  );

  /* 업로드된 파일 정리 */

  if (uploadedPaths.length > 0) {

    const { error: cleanupError } =
      await supabase.storage
        .from("resource-files")
        .remove(uploadedPaths);

    if (cleanupError) {
      console.error(
        "업로드 파일 정리 실패:",
        cleanupError
      );
    }

  }

  throw uploadError;

}

    /* 목록 갱신 */

      error.message

/* =====================================
   141단계
   YouTube 주소 변환 함수
===================================== */

function getYoutubeEmbedUrl(youtubeUrl) {

  if (!youtubeUrl) {
    return null;
  }

  try {

    const url = new URL(youtubeUrl);

    if (url.protocol !== "https:") {
      return null;
    }

    const host = url.hostname.toLowerCase();

    let videoId = null;

    /* 일반 YouTube 주소 */

    if (
      host === "youtube.com" ||
      host === "www.youtube.com" ||
      host === "m.youtube.com"
    ) {

      if (url.pathname === "/watch") {

        videoId = url.searchParams.get("v");

      } else if (
        url.pathname.startsWith("/shorts/")
      ) {

        videoId = url.pathname.split("/")[2];

      } else if (
        url.pathname.startsWith("/embed/")
      ) {

        videoId = url.pathname.split("/")[2];

      }

    }

    /* YouTube 단축 주소 */

    if (
      host === "youtu.be" ||
      host === "www.youtu.be"
    ) {

      videoId = url.pathname.split("/")[1];

    }

    /* 동영상 ID 검사 */

    if (
      !videoId ||
      !/^[a-zA-Z0-9_-]{11}$/.test(videoId)
    ) {
      return null;
    }

    return (
      "https://www.youtube-nocookie.com/embed/" +
      videoId
    );

  } catch (error) {

    console.error(
      "YouTube 주소 변환 오류:",
      error
    );

    return null;

  }

}

/* =====================================
   자료실 YouTube 영상 표시
===================================== */

function showResourceYoutube(youtubeUrl) {

  const mediaArea =
    document.getElementById("resourceMedia");

  mediaArea.replaceChildren();

  if (!youtubeUrl) {
    return;
  }

  const embedUrl =
    getYoutubeEmbedUrl(youtubeUrl);

  if (!embedUrl) {

    mediaArea.textContent =
      "올바른 YouTube 영상 주소가 아닙니다.";

    return;

  }

  /* 영상 제목 */

  const heading =
    document.createElement("h3");

  heading.textContent = "▶️ 동영상";

  mediaArea.appendChild(heading);

  /* 반응형 영상 영역 */

  const videoContainer =
    document.createElement("div");

  videoContainer.style.position = "relative";
  videoContainer.style.width = "100%";
  videoContainer.style.maxWidth = "800px";
  videoContainer.style.aspectRatio = "16 / 9";
  videoContainer.style.margin = "20px 0";

  /* YouTube 플레이어 */

  const iframe =
    document.createElement("iframe");

  iframe.src = embedUrl;

  iframe.title = "YouTube 동영상";

  iframe.style.width = "100%";
  iframe.style.height = "100%";
  iframe.style.border = "0";
  iframe.style.borderRadius = "10px";

  iframe.loading = "lazy";

  iframe.allow =
    "accelerometer; autoplay; clipboard-write; " +
    "encrypted-media; gyroscope; picture-in-picture; " +
    "web-share";

  iframe.allowFullscreen = true;

  videoContainer.appendChild(iframe);

  mediaArea.appendChild(videoContainer);

}

      return;
    }

    /* 삭제할 자료 ID 보관 */

    const resourceId = currentResourceId;

    /* 삭제 확인 */

    const confirmed = confirm(
      "이 자료를 삭제하시겠습니까?\n\n" +
      "게시물과 첨부파일이 삭제됩니다.\n" +
      "삭제 후에는 복구하기 어렵습니다."
    );

    if (!confirmed) {
      return;
    }

    resourceDeleteButton.disabled = true;
    resourceDeleteButton.textContent = "삭제 중...";

    try {

      /* 로그인 상태 재확인 */

      const { data: authData, error: authError } =
        await supabase.auth.getUser();

      if (authError || !authData.user) {
        throw new Error(
          "로그인 상태를 확인할 수 없습니다."
        );
      }

      /* 관리자 권한 재확인 */

      const { data: isAdmin, error: adminError } =
        await supabase.rpc("is_resource_admin");

      if (adminError || isAdmin !== true) {
        throw new Error(
          "관리자 권한을 확인할 수 없습니다."
        );
      }

      /* 첨부파일 경로 조회 */

      const { data: attachments, error: attachmentError } =
        await supabase
          .from("resource_attachments")
          .select("file_path")
          .eq("resource_id", resourceId);

      if (attachmentError) {
        throw attachmentError;
      }

      const filePaths = [
        ...new Set(
          (attachments || [])
            .map(file => file.file_path)
            .filter(Boolean)
        )
      ];

      /* Storage 실제 파일 삭제 */

      if (filePaths.length > 0) {

        const { error: storageError } =
          await supabase.storage
            .from("resource-files")
            .remove(filePaths);

        if (storageError) {
          throw new Error(
            "첨부파일 삭제 실패: " +
            storageError.message
          );
        }

      }

      /* 게시물 삭제 */

      const { data: deletedPosts, error: deleteError } =
        await supabase
          .from("resource_posts")
          .delete()
          .eq("id", resourceId)
          .select("id");

      if (deleteError) {
        throw new Error(
          "게시물 삭제 실패: " +
          deleteError.message
        );
      }

      if (!deletedPosts || deletedPosts.length !== 1) {
        throw new Error(
          "게시물 삭제가 확인되지 않았습니다."
        );
      }

      /* 화면 초기화 */

      currentResourceId = null;
      resourceEditMode = false;

      resourceDetailView.hidden = true;
      resourceWriteView.hidden = true;
      resourceListView.hidden = false;

      /* 자료 목록 갱신 */

      await loadResources();

      alert("자료가 정상적으로 삭제되었습니다.");

    } catch (error) {

      console.error(
        "자료실 삭제 오류:",
        error
      );

      alert(
        "자료 삭제 중 오류가 발생했습니다.\n" +
        error.message +
        "\n\n삭제가 일부 진행되었을 수 있으므로 " +
        "Storage와 데이터베이스를 확인해 주세요."
      );

    } finally {

      resourceDeleteButton.disabled = false;
      resourceDeleteButton.textContent = "🗑️ 자료 삭제";

    }

  }
);
  
/* =====================================
   제175-5-4단계
   통합 자료실 초기화
===================================== */

async function initializeResources() {

  await checkResourceAdmin();

  await loadResources();

}

initializeResources();

</script>
