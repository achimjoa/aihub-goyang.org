"Деятельность комитета\",\n\n  event: \"Мероприятия\",\n\n  press: \"Публикации в СМИ\",\n\n  policy: \"Новости государственной политики\"\n\n};\n\n/* =====================================\n   СОСТОЯНИЕ\n===================================== */\n\nlet news = [];\n\nlet currentCategory = \"all\";\n\nlet loadFailed = false;\n\n/* =====================================\n   ФОРМАТИРОВАНИЕ ДАТЫ\n===================================== */\n\nfunction formatDate(value) {\n\n  if (!value) return \"\";\n\n  const date = new Date(value);\n\n  if (Number.isNaN(date.getTime())) {\n    return String(value).slice(0, 10);\n  }\n\n  return [\n    date.getFullYear(),\n    String(date.getMonth() + 1).padStart(2, \"0\"),\n    String(date.getDate()).padStart(2, \"0\")\n  ].join(\".\");\n\n}\n\n/* =====================================\n   ОПРЕДЕЛЕНИЕ КОРЕЙСКОГО ТЕКСТА\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   ПРОВЕРКА ССЫЛОК\n===================================== */\n\nfunction getSafeLink(value) {\n\n  if (!value) return \"\";\n\n  try {\n\n    const url = new URL(\n      value,\n      window.location.href\n    );\n\n    if (\n      url.protocol !== \"https:\" &&\n      url.protocol !== \"http:\"\n    ) {\n      return \"\";\n    }\n\n    return url.href;\n\n  } catch (error) {\n\n    return \"\";\n\n  }\n\n}\n\n/* =====================================\n   ЗАГРУЗКА НОВОСТЕЙ\n===================================== */\n\nasync function loadNews() {\n\n  newsList.innerHTML =\n    '<div class=\"status\">' +\n    'Загрузка новостей и объявлений...' +\n    '</div>';\n\n  empty.hidden = true;\n\n  const combinedNews = [];\n\n  let successfulQueries = 0;\n\n  /* =====================================\n     1. НОВОСТНЫЕ ПУБЛИКАЦИИ\n  ===================================== */\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id,title,category,description,link,published_at\"\n        )\n        .order(\"published_at\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    successfulQueries++;\n\n    for (const item of data || []) {\n\n      combinedNews.push({\n\n        id: \"news-\" + item.id,\n\n        date: formatDate(\n          item.published_at\n        ),\n\n        sortDate:\n          item.published_at || \"\",\n\n        category:\n          item.category || \"\",\n\n        categoryName:\n          categoryNames[item.category] ||\n          \"Другое\",\n\n        title:\n          item.title || \"\",\n\n        description:\n          item.description || \"\",\n\n        link:\n          item.link || \"\"\n\n      });\n\n    }\n\n  } catch (error) {\n\n    console.error(\n      \"Ошибка загрузки новостей:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     2. ПУБЛИКАЦИИ ИЗ ОБЩЕГО ФОРУМА\n  ===================================== */\n\n  try {\n\n    const {\n      data: placements,\n      error\n    } =\n      await supabase\n        .from(\"board_post_placements\")\n        .select(\"post_id,placement\")\n        .in(\"placement\", [\n          \"notice\",\n          \"activity\"\n        ]);\n\n    if (error) {\n      throw error;\n    }\n\n    if (\n      placements &&\n      placements.length > 0\n    ) {\n\n      const postIds = [\n        ...new Set(\n          placements.map(\n            item => item.post_id\n          )\n        )\n      ];\n\n      const {\n        data: posts,\n        error: postError\n      } =\n        await supabase\n          .from(\"board_posts\")\n          .select(\n            \"id,title,content,created_at\"\n          )\n          .in(\"id\", postIds);\n\n      if (postError) {\n        throw postError;\n      }\n\n      const postMap = new Map(\n        (posts || []).map(post => [\n          String(post.id),\n          post\n        ])\n      );\n\n      for (const placement of placements) {\n\n        const post = postMap.get(\n          String(placement.post_id)\n        );\n\n        if (!post) continue;\n\n        const content =\n          post.content || \"\";\n\n        combinedNews.push({\n\n          id:\n            \"board-\" +\n            placement.placement +\n            \"-\" +\n            post.id,\n\n          date:\n            formatDate(\n              post.created_at\n            ),\n\n          sortDate:\n            post.created_at || \"\",\n\n          category:\n            placement.placement,\n\n          categoryName:\n            categoryNames[\n              placement.placement\n            ] || \"Другое\",\n\n          title:\n            post.title || \"\",\n\n          description:\n            content.length > 200\n              ? content.slice(0, 200) + \"...\"\n              : content,\n\n          link:\n            \"board.html?post=\" +\n            encodeURIComponent(post.id)\n\n        });\n\n      }\n\n    }\n\n    successfulQueries++;\n\n  } catch (error) {\n\n    console.error(\n      \"Ошибка загрузки публикаций форума:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     3. СОРТИРОВКА НОВОСТЕЙ\n  ===================================== */\n\n  combinedNews.sort((a, b) =>\n    String(b.sortDate)\n      .localeCompare(\n        String(a.sortDate)\n      )\n  );\n\n  news = combinedNews;\n\n  /* =====================================\n     4. ОБРАБОТКА ОШИБКИ\n  ===================================== */\n\n  if (successfulQueries === 0) {\n\n    loadFailed = true;\n\n    newsList.innerHTML =\n      '<div class=\"status\">' +\n      'Не удалось загрузить новости. ' +\n      'Пожалуйста, попробуйте позже.' +\n      '</div>';\n\n    empty.hidden = true;\n\n    return;\n\n  }\n\n  loadFailed = false;\n\n  renderNews();\n\n  console.log(\n    \"Загружено новостей:\",\n    news.length\n  );\n\n}\n\n/* =====================================\n   ОТОБРАЖЕНИЕ НОВОСТЕЙ\n===================================== */\n\nfunction renderNews() {\n\n  if (loadFailed) return;\n\n  const keyword =\n    searchInput.value\n      .trim()\n      .toLowerCase();\n\n  const filtered = news.filter(item => {\n\n    const categoryMatch =\n      currentCategory === \"all\" ||\n      item.category === currentCategory;\n\n    const searchText = [\n      item.title,\n      item.description,\n      item.categoryName,\n      item.date\n    ].join(\" \").toLowerCase();\n\n    return (\n      categoryMatch &&\n      searchText.includes(keyword)\n    );\n\n  });\n\n  filtered.sort((a, b) =>\n    String(b.sortDate || b.date || \"\")\n      .localeCompare(\n        String(a.sortDate || a.date || \"\")\n      )\n  );\n\n  newsList.innerHTML = \"\";\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"news-item\";\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className = \"category\";\n\n    category.textContent =\n      item.categoryName;\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className = \"date\";\n\n    date.textContent =\n      item.date;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description;\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* =====================================\n       УВЕДОМЛЕНИЕ О КОРЕЙСКОМ ТЕКСТЕ\n    ===================================== */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"Оригинал на корейском языке\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* =====================================\n       ССЫЛКА НА СТАТЬЮ\n    ===================================== */\n\n    const safeLink =\n      getSafeLink(item.link);\n\n    if (safeLink) {\n\n      const link =\n        document.createElement(\"a\");\n\n      link.className =\n        \"news-link\";\n\n      link.href =\n        safeLink;\n\n      const url =\n        new URL(safeLink);\n\n      const isBoardLink =\n        url.origin ===\n          window.location.origin &&\n        url.pathname.endsWith(\n          \"/board.html\"\n        );\n\n      if (isBoardLink) {\n\n        link.target = \"_self\";\n\n      } else {\n\n        link.target = \"_blank\";\n\n        link.rel =\n          \"noopener noreferrer\";\n\n      }\n\n      link.textContent =\n        \"Подробнее\";\n\n      card.appendChild(link);\n\n    }\n\n    newsList.appendChild(card);\n\n  });\n\n  empty.hidden =\n    filtered.length !== 0;\n\n}\n\n/* =====================================\n   ФИЛЬТРЫ КАТЕГОРИЙ\n===================================== */\n\ndocument\n  .querySelectorAll(\"[data-category]\")\n  .forEach(button => {\n\n    button.addEventListener(\n      \"click\",\n      () => {\n\n        currentCategory =\n          button.dataset.category;\n\n        document\n          .querySelectorAll(\n            \"[data-category]\"\n          )\n          .forEach(btn => {\n\n            const isActive =\n              btn.dataset.category ===\n              currentCategory;\n\n            btn.classList.toggle(\n              \"active\",\n              isActive\n            );\n\n            btn.setAttribute(\n              \"aria-pressed\",\n              String(isActive)\n            );\n\n          });\n\n        renderNews();\n\n      }\n    );\n\n  });\n\n/* =====================================\n   ПОИСК\n===================================== */\n\nsearchInput.addEventListener(\n  \"input\",\n  renderNews\n);\n\n/* =====================================\n   ПЕРВОНАЧАЛЬНАЯ ЗАГРУЗКА\n===================================== */\n\nloadNews();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=zh": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\n最新消息与公告 | 全球人工智能枢纽倡议\n</title>\n\n<meta\n  name=\"description\"\n  content=\"了解韩国京畿道高阳特例市全球人工智能枢纽引进市民推进委员会的最新消息、公告、活动、媒体报道、国际合作及政策动态。\"\n>\n\n<style>\n\n/* =====================================\n   基本设置\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n\n  font-family:\n    \"Microsoft YaHei\",\n    \"PingFang SC\",\n    \"Noto Sans SC\",\n    Arial,\n    sans-serif;\n\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   页眉\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 17px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  padding: 10px 20px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   主要内容\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n/* =====================================\n   语言提示\n===================================== */\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n/* =====================================\n   搜索\n===================================== */\n\n.search-box {\n  margin-bottom: 25px;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 16px;\n  border: 1px solid #c5d5e8;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* =====================================\n   分类筛选\n===================================== */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  border: 1px solid #0754a6;\n  background: white;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   新闻卡片\n===================================== */\n\n.news-list {\n  display: grid;\n  gap: 18px;\n}\n\n.news-item {\n  background: white;\n  border-radius: 12px;\n  padding: 25px;\n\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.06);\n\n  border-left: 5px solid #168de0;\n}\n\n.news-item h3 {\n  color: #0754a6;\n  margin: 10px 0;\n  font-size: 21px;\n  overflow-wrap: anywhere;\n}\n\n.category {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 4px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.date {\n  color: #68788c;\n  font-size: 14px;\n}\n\n.news-item p {\n  color: #46566d;\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.content-language {\n  display: block;\n  color: #68788c;\n  font-size: 13px;\n  margin-top: 8px;\n}\n\n.news-link {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 10px 17px;\n  border-radius: 6px;\n  text-decoration: none;\n  font-weight: bold;\n  margin-top: 12px;\n}\n\n.news-link:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   空结果与状态\n===================================== */\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  color: #68788c;\n}\n\n.empty[hidden] {\n  display: none;\n}\n\n.status {\n  background: white;\n  padding: 25px;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   页脚\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   移动设备\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .intro,\n  .news-item {\n    padding: 20px;\n  }\n\n  .news-link {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     页眉\n===================================== -->\n\n<header>\n\n<h1>\n最新消息与公告\n</h1>\n\n<p>\n全球人工智能枢纽倡议<br>\n大韩民国高阳特例市\n</p>\n\n<p>\n市民活动、国际合作、<br>\n政策建议及重要发展动态\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=zh\"\n  class=\"home-link\"\n>\n  ← 中文首页\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     页面介绍\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\n市民推进委员会最新消息\n</h2>\n\n<p>\n本页面提供\n高阳特例市全球人工智能枢纽\n引进市民推进委员会\n的相关活动和最新消息。\n</p>\n\n<p>\n内容包括\n推进委员会活动、\n公众公告、\n各类会议和活动、\n媒体报道\n以及政策发展动态。\n</p>\n\n<p>\n随着新信息的发布，\n本页面将持续更新。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     语言提示\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\n语言说明\n</strong>\n\n<p>\n本中文页面\n与推进委员会现有的\n新闻发布数据库连接，\n显示最新消息和公告。\n</p>\n\n<p>\n部分新闻和公告\n目前仅提供韩语原文。\n</p>\n\n<p>\n为确保信息准确，\n韩语新闻标题和内容\n将保留原文，\n不进行自动翻译。\n</p>\n\n<p>\n如有原始报道\n或相关资料链接，\n可点击相应按钮查看。\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     新闻搜索\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\n  type=\"search\"\n  id=\"searchInput\"\n  placeholder=\"搜索新闻标题或关键词\"\n  aria-label=\"搜索最新消息与公告\"\n>\n\n</div>\n\n\u003c!-- =====================================\n     新闻分类\n===================================== -->\n\n<nav\n  class=\"filters\"\n  aria-label=\"按类别筛选新闻\"\n>\n\n<button\n  type=\"button\"\n  class=\"active\"\n  data-category=\"all\"\n  aria-pressed=\"true\"\n>\n  全部消息\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"notice\"\n  aria-pressed=\"false\"\n>\n  公告事项\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"activity\"\n  aria-pressed=\"false\"\n>\n  推进委员会活动\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"event\"\n  aria-pressed=\"false\"\n>\n  活动与会议\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"press\"\n  aria-pressed=\"false\"\n>\n  媒体报道\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"policy\"\n  aria-pressed=\"false\"\n>\n  政策动态\n</button>\n\n</nav>\n\n\u003c!-- =====================================\n     新闻列表\n===================================== -->\n\n<div\n  class=\"news-list\"\n  id=\"newsList\"\n  aria-live=\"polite\"\n>\n</div>\n\n<p\n  class=\"empty\"\n  id=\"empty\"\n  hidden\n>\n  没有找到符合搜索条件的新闻。\n</p>\n\n</main>\n\n\u003c!-- =====================================\n     页脚\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\n高阳特例市全球人工智能枢纽<br>\n引进市民推进委员会\n</strong>\n</p>\n\n<p>\n大韩民国京畿道\n</p>\n\n<p>\n与市民同行，<br>\n与京畿道同行，<br>\n与世界同行。\n</p>\n\n<p>\n<a href=\"index.html?lang=zh\">\n中文首页\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE 新闻模块\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE 连接\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   DOM 元素\n===================================== */\n\nconst newsList =\n  document.getElementById(\"newsList\");\n\nconst searchInput =\n  document.getElementById(\"searchInput\");\n\nconst empty =\n  document.getElementById(\"empty\");\n\n/* =====================================\n   分类名称\n===================================== */\n\nconst categoryNames = {\n\n  notice: \"公告事项\",\n\n  activity: \"推进委员会活动\",\n\n  event: \"活动与会议\",\n\n  press: \"媒体报道\",\n\n  policy: \"政策动态\"\n\n};\n\n/* =====================================\n   状态\n===================================== */\n\nlet news = [];\n\nlet currentCategory = \"all\";\n\nlet loadFailed = false;\n\n/* =====================================\n   日期格式\n===================================== */\n\nfunction formatDate(value) {\n\n  if (!value) return \"\";\n\n  const date = new Date(value);\n\n  if (Number.isNaN(date.getTime())) {\n\n    return String(value).slice(0, 10);\n\n  }\n\n  return [\n\n    date.getFullYear(),\n\n    String(\n      date.getMonth() + 1\n    ).padStart(2, \"0\"),\n\n    String(\n      date.getDate()\n    ).padStart(2, \"0\")\n\n  ].join(\".\");\n\n}\n\n/* =====================================\n   检测韩语\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   安全链接验证\n===================================== */\n\nfunction getSafeLink(value) {\n\n  if (!value) return \"\";\n\n  try {\n\n    const url = new URL(\n      value,\n      window.location.href\n    );\n\n    if (\n      url.protocol !== \"https:\" &&\n      url.protocol !== \"http:\"\n    ) {\n\n      return \"\";\n\n    }\n\n    return url.href;\n\n  } catch (error) {\n\n    return \"\";\n\n  }\n\n}\n\n/* =====================================\n   加载新闻\n===================================== */\n\nasync function loadNews() {\n\n  newsList.innerHTML =\n    '<div class=\"status\">' +\n    '正在加载最新消息与公告...' +\n    '</div>';\n\n  empty.hidden = true;\n\n  const combinedNews = [];\n\n  let successfulQueries = 0;\n\n  /* =====================================\n     1. NEWS POSTS\n  ===================================== */\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id,title,category,description,link,published_at\"\n        )\n        .order(\"published_at\", {\n          ascending: false\n        });\n\n    if (error) {\n\n      throw error;\n\n    }\n\n    successfulQueries++;\n\n    for (const item of data || []) {\n\n      combinedNews.push({\n\n        id:\n          \"news-\" + item.id,\n\n        date:\n          formatDate(\n            item.published_at\n          ),\n\n        sortDate:\n          item.published_at || \"\",\n\n        category:\n          item.category || \"\",\n\n        categoryName:\n          categoryNames[\n            item.category\n          ] || \"其他\",\n\n        title:\n          item.title || \"\",\n\n        description:\n          item.description || \"\",\n\n        link:\n          item.link || \"\"\n\n      });\n\n    }\n\n  } catch (error) {\n\n    console.error(\n      \"新闻查询失败:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     2. SELECTED BOARD POSTS\n  ===================================== */\n\n  try {\n\n    const {\n      data: placements,\n      error\n    } =\n      await supabase\n        .from(\"board_post_placements\")\n        .select(\"post_id,placement\")\n        .in(\"placement\", [\n          \"notice\",\n          \"activity\"\n        ]);\n\n    if (error) {\n\n      throw error;\n\n    }\n\n    if (\n      placements &&\n      placements.length > 0\n    ) {\n\n      const postIds = [\n\n        ...new Set(\n          placements.map(\n            item => item.post_id\n          )\n        )\n\n      ];\n\n      const {\n        data: posts,\n        error: postError\n      } =\n        await supabase\n          .from(\"board_posts\")\n          .select(\n            \"id,title,content,created_at\"\n          )\n          .in(\"id\", postIds);\n\n      if (postError) {\n\n        throw postError;\n\n      }\n\n      const postMap = new Map(\n\n        (posts || []).map(post => [\n\n          String(post.id),\n          post\n\n        ])\n\n      );\n\n      for (\n        const placement of placements\n      ) {\n\n        const post = postMap.get(\n          String(\n            placement.post_id\n          )\n        );\n\n        if (!post) continue;\n\n        const content =\n          post.content || \"\";\n\n        combinedNews.push({\n\n          id:\n            \"board-\" +\n            placement.placement +\n            \"-\" +\n            post.id,\n\n          date:\n            formatDate(\n              post.created_at\n            ),\n\n          sortDate:\n            post.created_at || \"\",\n\n          category:\n            placement.placement,\n\n          categoryName:\n            categoryNames[\n              placement.placement\n            ] || \"其他\",\n\n          title:\n            post.title || \"\",\n\n          description:\n            content.length > 200\n              ? content.slice(0, 200) + \"...\"\n              : content,\n\n          link:\n            \"board.html?post=\" +\n            encodeURIComponent(\n              post.id\n            )\n\n        });\n\n      }\n\n    }\n\n    successfulQueries++;\n\n  } catch (error) {\n\n    console.error(\n      \"게시판 뉴스 조회 실패:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     3. 日期排序\n  ===================================== */\n\n  combinedNews.sort((a, b) =>\n\n    String(b.sortDate)\n      .localeCompare(\n        String(a.sortDate)\n      )\n\n  );\n\n  news = combinedNews;\n\n  /* =====================================\n     4. 查询失败处理\n  ===================================== */\n\n  if (successfulQueries === 0) {\n\n    loadFailed = true;\n\n    newsList.innerHTML =\n      '<div class=\"status\">' +\n      '暂时无法加载新闻。' +\n      '请稍后重试。' +\n      '</div>';\n\n    empty.hidden = true;\n\n    return;\n\n  }\n\n  loadFailed = false;\n\n  renderNews();\n\n  console.log(\n    \"中文新闻页面加载完成:\",\n    news.length,\n    \"条\"\n  );\n\n}\n\n/* =====================================\n   显示新闻\n===================================== */\n\nfunction renderNews() {\n\n  if (loadFailed) return;\n\n  const keyword =\n    searchInput.value\n      .trim()\n      .toLowerCase();\n\n  const filtered = news.filter(item => {\n\n    const categoryMatch =\n      currentCategory === \"all\" ||\n      item.category === currentCategory;\n\n    const searchText = [\n\n      item.title,\n\n      item.description,\n\n      item.categoryName,\n\n      item.date\n\n    ].join(\" \").toLowerCase();\n\n    return (\n      categoryMatch &&\n      searchText.includes(keyword)\n    );\n\n  });\n\n  filtered.sort((a, b) =>\n\n    String(\n      b.sortDate || b.date || \"\"\n    ).localeCompare(\n\n      String(\n        a.sortDate || a.date || \"\"\n      )\n\n    )\n\n  );\n\n  newsList.innerHTML = \"\";\n\n  filtered.forEach(item => {\n\n    /* =====================================\n       新闻卡片\n    ===================================== */\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"news-item\";\n\n    /* =====================================\n       分类\n    ===================================== */\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className = \"category\";\n\n    category.textContent =\n      item.categoryName;\n\n    /* =====================================\n       日期\n    ===================================== */\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className = \"date\";\n\n    date.textContent =\n      item.date;\n\n    /* =====================================\n       标题\n    ===================================== */\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title;\n\n    /* =====================================\n       内容\n    ===================================== */\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description;\n\n    card.appendChild(category);\n\n    card.appendChild(date);\n\n    card.appendChild(title);\n\n    card.appendChild(description);\n\n    /* =====================================\n       韩语原文提示\n    ===================================== */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"原文为韩语\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* =====================================\n       新闻链接\n    ===================================== */\n\n    const safeLink =\n      getSafeLink(item.link);\n\n    if (safeLink) {\n\n      const link =\n        document.createElement(\"a\");\n\n      link.className =\n        \"news-link\";\n\n      link.href =\n        safeLink;\n\n      const url =\n        new URL(safeLink);\n\n      const isBoardLink =\n        url.origin ===\n          window.location.origin &&\n        url.pathname.endsWith(\n          \"/board.html\"\n        );\n\n      if (isBoardLink) {\n\n        link.target = \"_self\";\n\n      } else {\n\n        link.target = \"_blank\";\n\n        link.rel =\n          \"noopener noreferrer\";\n\n      }\n\n      link.textContent =\n        \"阅读全文\";\n\n      card.appendChild(link);\n\n    }\n\n    newsList.appendChild(card);\n\n  });\n\n  empty.hidden =\n    filtered.length !== 0;\n\n}\n\n/* =====================================\n   分类筛选按钮\n===================================== */\n\ndocument\n  .querySelectorAll(\"[data-category]\")\n  .forEach(button => {\n\n    button.addEventListener(\n      \"click\",\n      () => {\n\n        currentCategory =\n          button.dataset.category;\n\n        document\n          .querySelectorAll(\n            \"[data-category]\"\n          )\n          .forEach(btn => {\n\n            const isActive =\n              btn.dataset.category ===\n              currentCategory;\n\n            btn.classList.toggle(\n              \"active\",\n              isActive\n            );\n\n            btn.setAttribute(\n              \"aria-pressed\",\n              String(isActive)\n            );\n\n          });\n\n        renderNews();\n\n      }\n    );\n\n  });\n\n/* =====================================\n   搜索功能\n===================================== */\n\nsearchInput.addEventListener(\n  \"input\",\n  renderNews\n);\n\n/* =====================================\n   初始加载\n===================================== */\n\nloadNews();\n\n\u003c/script>\n\n</body>\n</html>\n"
}
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const pages = JSON.parse(document.getElementById("page-variants").textContent);
  const params = new URLSearchParams(window.location.search);
  const variants = ["view", "lang"].map(key => key + "=" + params.get(key));
  const selected = variants.find(key => Object.hasOwn(pages, key)) || "default";

  // Load the selected document with its original markup and script order.
  document.open();
  document.write(pages[selected]);
  document.close();
}, { once: true });
</script>
