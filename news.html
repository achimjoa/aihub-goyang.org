>\n\n/* =====================================\n   제145-2-6-3단계\n   Supabase 라이브러리 연결\n===================================== */\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   Supabase 연결 정보\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\n/* Supabase 클라이언트 생성 */\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n  \n/*\n  새로운 소식 등록 방법\n\n  아래 news 배열에 게시물 하나를 추가하면\n  홈페이지에 자동으로 표시됩니다.\n\n  link에는 실제 연결 주소를 입력합니다.\n  연결 주소가 없으면 빈 문자열(\"\")로 둡니다.\n*/\n\n/* =====================================\n   제145-2-6-5단계\n   활동 소식 데이터 저장 배열\n===================================== */\n\nlet news = [];\n\n/* =====================================\n   제145-2-6-5단계\n   Supabase 활동 소식 불러오기\n===================================== */\n\n/* =====================================\n   활동 소식 + 게시판 선택 게시물 통합 조회\n===================================== */\n\nasync function loadNews() {\n\n  newsList.textContent =\n    \"활동 소식을 불러오고 있습니다.\";\n\n  empty.hidden = true;\n\n  const categoryNames = {\n    notice: \"공지사항\",\n    activity: \"위원회 활동\",\n    event: \"행사 소식\",\n    press: \"언론보도\",\n    policy: \"정책 소식\"\n  };\n\n  /* 날짜 표시 */\n\n  function formatDate(value) {\n\n    if (!value) return \"\";\n\n    const date = new Date(value);\n\n    if (Number.isNaN(date.getTime())) {\n      return String(value).slice(0, 10);\n    }\n\n    return [\n      date.getFullYear(),\n      String(date.getMonth() + 1).padStart(2, \"0\"),\n      String(date.getDate()).padStart(2, \"0\")\n    ].join(\".\");\n\n  }\n\n  const combinedNews = [];\n\n  let successfulQueries = 0;\n\n  /* =====================================\n     1. 기존 활동 소식 조회\n  ===================================== */\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id,title,category,description,link,published_at\"\n        )\n        .order(\"published_at\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    successfulQueries++;\n\n    for (const item of data || []) {\n\n      combinedNews.push({\n\n        id: \"news-\" + item.id,\n\n        date: formatDate(item.published_at),\n\n        sortDate: item.published_at || \"\",\n\n        category: item.category,\n\n        categoryName:\n          categoryNames[item.category] || \"기타\",\n\n        title: item.title || \"\",\n\n        description: item.description || \"\",\n\n        link: item.link || \"\"\n\n      });\n\n    }\n\n  } catch (error) {\n\n    console.error(\n      \"기존 활동 소식 조회 오류:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     2. 관리자 선택 게시물 조회\n  ===================================== */\n\n  try {\n\n    const { data: placements, error } =\n      await supabase\n        .from(\"board_post_placements\")\n        .select(\"post_id,placement\")\n        .in(\"placement\", [\n          \"notice\",\n          \"activity\"\n        ]);\n\n    if (error) {\n      throw error;\n    }\n\n    if (placements && placements.length > 0) {\n\n      const postIds = [\n        ...new Set(\n          placements.map(item => item.post_id)\n        )\n      ];\n\n      const {\n        data: posts,\n        error: postError\n      } =\n        await supabase\n          .from(\"board_posts\")\n          .select(\n            \"id,title,content,created_at\"\n          )\n          .in(\"id\", postIds);\n\n      if (postError) {\n        throw postError;\n      }\n\n      const postMap = new Map(\n        (posts || []).map(post => [\n          String(post.id),\n          post\n        ])\n      );\n\n      for (const placement of placements) {\n\n        const post = postMap.get(\n          String(placement.post_id)\n        );\n\n        if (!post) continue;\n\n        const content = post.content || \"\";\n\n        combinedNews.push({\n\n          id:\n            \"board-\" +\n            placement.placement +\n            \"-\" +\n            post.id,\n\n          date: formatDate(post.created_at),\n\n          sortDate: post.created_at || \"\",\n\n          category: placement.placement,\n\n          categoryName:\n            categoryNames[placement.placement],\n\n          title: post.title || \"\",\n\n          description:\n            content.length > 200\n              ? content.slice(0, 200) + \"...\"\n              : content,\n\n          link:\n            \"board.html?post=\" +\n            encodeURIComponent(post.id)\n\n        });\n\n      }\n\n    }\n\n    successfulQueries++;\n\n  } catch (error) {\n\n    console.error(\n      \"관리자 선택 게시물 조회 오류:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     3. 날짜순 정렬\n  ===================================== */\n\n  combinedNews.sort((a, b) =>\n    b.sortDate.localeCompare(a.sortDate)\n  );\n\n  news = combinedNews;\n\n  /* =====================================\n     4. 화면 갱신\n  ===================================== */\n\n  if (successfulQueries === 0) {\n\n    newsList.textContent =\n      \"활동 소식을 불러오지 못했습니다. \" +\n      \"잠시 후 다시 시도해 주세요.\";\n\n    empty.hidden = true;\n\n    return;\n\n  }\n\n  renderNews();\n\n  console.log(\n    \"통합 활동 소식 조회 완료:\",\n    news.length,\n    \"건\"\n  );\n\n}\n  \nlet currentCategory = \"all\";\n\nconst newsList = document.getElementById(\"newsList\");\nconst searchInput = document.getElementById(\"searchInput\");\nconst empty = document.getElementById(\"empty\");\n\nfunction renderNews() {\n\n  const keyword = searchInput.value.trim().toLowerCase();\n\n  const filtered = news.filter(item => {\n\n    const categoryMatch =\n      currentCategory === \"all\" ||\n      item.category === currentCategory;\n\n    const searchText = [\n      item.title,\n      item.description,\n      item.categoryName,\n      item.date\n    ].join(\" \").toLowerCase();\n\n    return categoryMatch && searchText.includes(keyword);\n  });\n\n  filtered.sort((a, b) =>\n  (b.sortDate || b.date || \"\")\n    .localeCompare(\n      a.sortDate || a.date || \"\"\n    )\n);\n  \n  newsList.innerHTML = \"\";\n\n  filtered.forEach(item => {\n\n    const card = document.createElement(\"article\");\n    card.className = \"news-item\";\n\n    const category = document.createElement(\"span\");\n    category.className = \"category\";\n    category.textContent = item.categoryName;\n\n    const date = document.createElement(\"p\");\n    date.className = \"date\";\n    date.textContent = item.date;\n\n    const title = document.createElement(\"h3\");\n    title.textContent = item.title;\n\n    const description = document.createElement(\"p\");\n    description.textContent = item.description;\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    if (item.link) {\n\n      const link = document.createElement(\"a\");\n      link.className = \"news-link\";\n      link.href = item.link;\n      if (\n  item.link.startsWith(\"board.html?\")\n) {\n\n  /* 게시판 게시물은 현재 창에서 열기 */\n\n  link.target = \"_self\";\n\n} else {\n\n  /* 기존 외부 링크는 새 창에서 열기 */\n\n  link.target = \"_blank\";\n  link.rel = \"noopener noreferrer\";\n\n}\n      \n      link.textContent = \"자세히 보기\";\n\n      card.appendChild(link);\n    }\n\n    newsList.appendChild(card);\n  });\n\n  empty.hidden = filtered.length !== 0;\n}\n\ndocument.querySelectorAll(\"[data-category]\").forEach(button => {\n\n  button.addEventListener(\"click\", () => {\n\n    currentCategory = button.dataset.category;\n\n    document.querySelectorAll(\"[data-category]\")\n      .forEach(btn => btn.classList.remove(\"active\"));\n\n    button.classList.add(\"active\");\n\n    renderNews();\n  });\n});\n\n/* =====================================\n   활동 소식 검색 및 초기 조회\n===================================== */\n\nsearchInput.addEventListener(\n  \"input\",\n  renderNews\n);\n\n/* Supabase 데이터 불러오기 */\n\nloadNews();\n  \n\u003c/script>\n\n</body>\n</html>\n",

-radius: 12px;\n  margin-bottom: 25px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-right: 5px solid #e4b43c;\n  border-left: none;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n/* =====================================\n   SEARCH\n===================================== */\n\n.search-box {\n  margin-bottom: 25px;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 16px;\n  border: 1px solid #c5d5e8;\n  border-radius: 8px;\n  font-size: 16px;\n  font-family: inherit;\n  direction: rtl;\n  text-align: right;\n}\n\n/* =====================================\n   CATEGORY FILTERS\n===================================== */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  border: 1px solid #0754a6;\n  background: white;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n  font-family: inherit;\n  font-size: 15px;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   NEWS CARDS\n===================================== */\n\n.news-list {\n  display: grid;\n  gap: 18px;\n}\n\n.news-item {\n  background: white;\n  border-radius: 12px;\n  padding: 25px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.06);\n  border-right: 5px solid #168de0;\n  border-left: none;\n}\n\n.news-item h3 {\n  color: #0754a6;\n  margin: 10px 0;\n  font-size: 21px;\n  overflow-wrap: anywhere;\n}\n\n.category {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 4px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.date {\n  color: #68788c;\n  font-size: 14px;\n  direction: ltr;\n  unicode-bidi: isolate;\n  text-align: right;\n}\n\n.news-item p {\n  color: #46566d;\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.content-language {\n  display: block;\n  color: #68788c;\n  font-size: 13px;\n  margin-top: 8px;\n}\n\n.news-link {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 10px 17px;\n  border-radius: 6px;\n  text-decoration: none;\n  font-weight: bold;\n  margin-top: 12px;\n}\n\n.news-link:hover {\n  background: #003a7a;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  color: #68788c;\n}\n\n.status {\n  background: white;\n  padding: 25px;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   FOOTER\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .intro,\n  .news-item {\n    padding: 20px;\n  }\n\n  .news-link {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header>\n\n<h1>\nالأخبار والإعلانات\n</h1>\n\n<p>\nمبادرة المركز العالمي للذكاء الاصطناعي<br>\nمدينة غويانغ الخاصة، جمهورية كوريا\n</p>\n\n<p>\nآخر المستجدات المتعلقة\nبالأنشطة المدنية،\nوالتعاون الدولي،\nومقترحات السياسات،\nوالتطورات الرئيسية.\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ar\"\n  class=\"home-link\"\n>\n→ الصفحة الرئيسية العربية\n</a>\n\n<a\n  href=\"news.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     INTRODUCTION\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nآخر أخبار اللجنة المدنية الداعمة\n</h2>\n\n<p>\nتوفر هذه الصفحة\nمعلومات عن أنشطة\nاللجنة المدنية لدعم استقطاب\nالمركز العالمي للذكاء الاصطناعي\nإلى مدينة غويانغ الخاصة.\n</p>\n\n<p>\nقد تشمل المستجدات\nأنشطة اللجنة،\nوالإعلانات العامة،\nوالفعاليات،\nوالتغطية الإعلامية،\nوالتطورات المتعلقة بالسياسات.\n</p>\n\n<p>\nستُضاف المعلومات الجديدة\nعندما تصبح متاحة.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     LANGUAGE NOTICE\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nمعلومات اللغة\n</strong>\n\n<p>\nتعرض هذه الصفحة العربية\nالأخبار والإعلانات\nمن قاعدة بيانات المنشورات الحالية\nالتابعة للجنة المدنية.\n</p>\n\n<p>\nبعض المقالات\nمتاحة باللغة الكورية فقط.\nوتُعرض العناوين\nوالأوصاف الأصلية باللغة الكورية\nدون ترجمة آلية.\n</p>\n\n<p>\nيمكن فتح المقال الأصلي\nأو المصدر المرتبط به\nمن خلال الرابط المتاح،\nعند وجوده.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     SEARCH\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\n  type=\"search\"\n  id=\"searchInput\"\n  placeholder=\"ابحث في عناوين الأخبار أو الكلمات المفتاحية\"\n  aria-label=\"البحث في الأخبار والإعلانات\"\n>\n\n</div>\n\n\u003c!-- =====================================\n     FILTERS\n===================================== -->\n\n<nav\n  class=\"filters\"\n  aria-label=\"تصفية الأخبار حسب الفئة\"\n>\n\n<button\n  type=\"button\"\n  class=\"active\"\n  data-category=\"all\"\n  aria-pressed=\"true\"\n>\nجميع الأخبار\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"notice\"\n  aria-pressed=\"false\"\n>\nالإعلانات\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"activity\"\n  aria-pressed=\"false\"\n>\nأنشطة اللجنة\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"event\"\n  aria-pressed=\"false\"\n>\nالفعاليات\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"press\"\n  aria-pressed=\"false\"\n>\nالتغطية الإعلامية\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"policy\"\n  aria-pressed=\"false\"\n>\nمستجدات السياسات\n</button>\n\n</nav>\n\n\u003c!-- =====================================\n     NEWS LIST\n===================================== -->\n\n<div\n  class=\"news-list\"\n  id=\"newsList\"\n  aria-live=\"polite\"\n>\n</div>\n\n<p\n  class=\"empty\"\n  id=\"empty\"\n  hidden\n>\nلا توجد أخبار تطابق معايير البحث.\n</p>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n\n<strong>\nاللجنة المدنية لدعم استقطاب<br>\nالمركز العالمي للذكاء الاصطناعي<br>\nإلى مدينة غويانغ الخاصة\n</strong>\n\n</p>\n\n<p>\nمقاطعة غيونغي،\nجمهورية كوريا\n</p>\n\n<p>\nمع المواطنين،\nومع مقاطعة غيونغي،\nومع العالم.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ar\">\nالصفحة الرئيسية العربية\n</a>\n\n&nbsp; | &nbsp;\n\n<a\n  href=\"news.html\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE NEWS MODULE\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE CONNECTION\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   DOM ELEMENTS\n===================================== */\n\nconst newsList =\n  document.getElementById(\"newsList\");\n\nconst searchInput =\n  document.getElementById(\"searchInput\");\n\nconst empty =\n  document.getElementById(\"empty\");\n\n/* =====================================\n   CATEGORY NAMES\n===================================== */\n\nconst categoryNames = {\n\n  notice: \"الإعلانات\",\n\n  activity: \"أنشطة اللجنة\",\n\n  event: \"الفعاليات\",\n\n  press: \"التغطية الإعلامية\",\n\n  policy: \"مستجدات السياسات\"\n\n};\n\n/* =====================================\n   STATE\n===================================== */\n\nlet news = [];\n\nlet currentCategory = \"all\";\n\nlet loadFailed = false;\n\n/* =====================================\n   DATE FORMATTING\n===================================== */\n\nfunction formatDate(value) {\n\n  if (!value) return \"\";\n\n  const date = new Date(value);\n\n  if (Number.isNaN(date.getTime())) {\n    return String(value).slice(0, 10);\n  }\n\n  return [\n    date.getFullYear(),\n    String(date.getMonth() + 1).padStart(2, \"0\"),\n    String(date.getDate()).padStart(2, \"0\")\n  ].join(\".\");\n\n}\n\n/* =====================================\n   KOREAN TEXT DETECTION\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   LINK VALIDATION\n===================================== */\n\nfunction getSafeLink(value) {\n\n  if (!value) return \"\";\n\n  try {\n\n    const url = new URL(\n      value,\n      window.location.href\n    );\n\n    if (\n      url.protocol !== \"https:\" &&\n      url.protocol !== \"http:\"\n    ) {\n      return \"\";\n    }\n\n    return url.href;\n\n  } catch (error) {\n\n    return \"\";\n\n  }\n\n}\n\n/* =====================================\n   LOAD NEWS\n===================================== */\n\nasync function loadNews() {\n\n  newsList.innerHTML =\n    '<div class=\"status\">' +\n    'جارٍ تحميل الأخبار والإعلانات...' +\n    '</div>';\n\n  empty.hidden = true;\n\n  const combinedNews = [];\n\n  let successfulQueries = 0;\n\n  /* =====================================\n     1. NEWS POSTS\n  ===================================== */\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id,title,category,description,link,published_at\"\n        )\n        .order(\"published_at\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    successfulQueries++;\n\n    for (const item of data || []) {\n\n      combinedNews.push({\n\n        id: \"news-\" + item.id,\n\n        date: formatDate(\n          item.published_at\n        ),\n\n        sortDate:\n          item.published_at || \"\",\n\n        category:\n          item.category || \"\",\n\n        categoryName:\n          categoryNames[item.category] ||\n          \"أخرى\",\n\n        title:\n          item.title || \"\",\n\n        description:\n          item.description || \"\",\n\n        link:\n          item.link || \"\"\n\n      });\n\n    }\n\n  } catch (error) {\n\n    console.error(\n      \"News posts query failed:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     2. SELECTED BOARD POSTS\n  ===================================== */\n\n  try {\n\n    const {\n      data: placements,\n      error\n    } =\n      await supabase\n        .from(\"board_post_placements\")\n        .select(\"post_id,placement\")\n        .in(\"placement\", [\n          \"notice\",\n          \"activity\"\n        ]);\n\n    if (error) {\n      throw error;\n    }\n\n    if (\n      placements &&\n      placements.length > 0\n    ) {\n\n      const postIds = [\n        ...new Set(\n          placements.map(\n            item => item.post_id\n          )\n        )\n      ];\n\n      const {\n        data: posts,\n        error: postError\n      } =\n        await supabase\n          .from(\"board_posts\")\n          .select(\n            \"id,title,content,created_at\"\n          )\n          .in(\"id\", postIds);\n\n      if (postError) {\n        throw postError;\n      }\n\n      const postMap = new Map(\n        (posts || []).map(post => [\n          String(post.id),\n          post\n        ])\n      );\n\n      for (const placement of placements) {\n\n        const post = postMap.get(\n          String(placement.post_id)\n        );\n\n        if (!post) continue;\n\n        const content =\n          post.content || \"\";\n\n        combinedNews.push({\n\n          id:\n            \"board-\" +\n            placement.placement +\n            \"-\" +\n            post.id,\n\n          date:\n            formatDate(\n              post.created_at\n            ),\n\n          sortDate:\n            post.created_at || \"\",\n\n          category:\n            placement.placement,\n\n          categoryName:\n            categoryNames[\n              placement.placement\n            ] || \"أخرى\",\n\n          title:\n            post.title || \"\",\n\n          description:\n            content.length > 200\n              ? content.slice(0, 200) + \"...\"\n              : content,\n\n          link:\n            \"board.html?post=\" +\n            encodeURIComponent(post.id)\n\n        });\n\n      }\n\n    }\n\n    successfulQueries++;\n\n  } catch (error) {\n\n    console.error(\n      \"Selected board posts query failed:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     3. SORT NEWS\n  ===================================== */\n\n  combinedNews.sort((a, b) =>\n    String(b.sortDate)\n      .localeCompare(\n        String(a.sortDate)\n      )\n  );\n\n  news = combinedNews;\n\n  /* =====================================\n     4. HANDLE QUERY FAILURE\n  ===================================== */\n\n  if (successfulQueries === 0) {\n\n    loadFailed = true;\n\n    newsList.innerHTML =\n      '<div class=\"status\">' +\n      'تعذر تحميل الأخبار حالياً. ' +\n      'يرجى المحاولة مرة أخرى لاحقاً.' +\n      '</div>';\n\n    empty.hidden = true;\n\n    return;\n\n  }\n\n  loadFailed = false;\n\n  renderNews();\n\n  console.log(\n    \"Arabic news page loaded:\",\n    news.length,\n    \"items\"\n  );\n\n}\n\n/* =====================================\n   RENDER NEWS\n===================================== */\n\nfunction renderNews() {\n\n  if (loadFailed) return;\n\n  const keyword =\n    searchInput.value\n      .trim()\n      .toLowerCase();\n\n  const filtered = news.filter(item => {\n\n    const categoryMatch =\n      currentCategory === \"all\" ||\n      item.category === currentCategory;\n\n    const searchText = [\n      item.title,\n      item.description,\n      item.categoryName,\n      item.date\n    ].join(\" \").toLowerCase();\n\n    return (\n      categoryMatch &&\n      searchText.includes(keyword)\n    );\n\n  });\n\n  filtered.sort((a, b) =>\n    String(b.sortDate || b.date || \"\")\n      .localeCompare(\n        String(a.sortDate || a.date || \"\")\n      )\n  );\n\n  newsList.innerHTML = \"\";\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"news-item\";\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className = \"category\";\n\n    category.textContent =\n      item.categoryName;\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className = \"date\";\n\n    date.textContent =\n      item.date;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description;\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* =====================================\n       KOREAN CONTENT NOTICE\n    ===================================== */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"المحتوى الأصلي باللغة الكورية\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* =====================================\n       ARTICLE LINK\n    ===================================== */\n\n    const safeLink =\n      getSafeLink(item.link);\n\n    if (safeLink) {\n\n      const link =\n        document.createElement(\"a\");\n\n      link.className =\n        \"news-link\";\n\n      link.href =\n        safeLink;\n\n      const url =\n        new URL(safeLink);\n\n      const isBoardLink =\n        url.origin ===\n          window.location.origin &&\n        url.pathname.endsWith(\n          \"/board.html\"\n        );\n\n      if (isBoardLink) {\n\n        link.target = \"_self\";\n\n      } else {\n\n        link.target = \"_blank\";\n\n        link.rel =\n          \"noopener noreferrer\";\n\n      }\n\n      link.textContent =\n        \"اقرأ المزيد\";\n\n      card.appendChild(link);\n\n    }\n\n    newsList.appendChild(card);\n\n  });\n\n  empty.hidden =\n    filtered.length !== 0;\n\n}\n\n/* =====================================\n   CATEGORY FILTERS\n===================================== */\n\ndocument\n  .querySelectorAll(\"[data-category]\")\n  .forEach(button => {\n\n    button.addEventListener(\n      \"click\",\n      () => {\n\n        currentCategory =\n          button.dataset.category;\n\n        document\n          .querySelectorAll(\n            \"[data-category]\"\n          )\n          .forEach(btn => {\n\n            const isActive =\n              btn.dataset.category ===\n              currentCategory;\n\n            btn.classList.toggle(\n              \"active\",\n              isActive\n            );\n\n            btn.setAttribute(\n              \"aria-pressed\",\n              String(isActive)\n            );\n\n          });\n\n        renderNews();\n\n      }\n    );\n\n  });\n\n/* =====================================\n   SEARCH\n===================================== */\n\nsearchInput.addEventListener(\n  \"input\",\n  renderNews\n);\n\n/* =====================================\n   INITIAL LOAD\n===================================== */\n\nloadNews();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=de": "<!DOCTYPE html>\n<html lang=\"de\">\n\n<head>\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<title>\nNachrichten und Bekanntmachungen |\nInitiative für ein globales KI-Zentrum\n</title>\n\n<meta name=\"description\"\ncontent=\"Nachrichten, Bekanntmachungen, Aktivitäten, Veranstaltungen und politische Entwicklungen des Bürgerkomitees zur Förderung der Ansiedlung eines globalen KI-Zentrums in der Sonderstadt Goyang, Republik Korea.\">\n\n<style>\n\n/* =====================================\n   GRUNDEINSTELLUNGEN\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   KOPFBEREICH\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 17px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  padding: 10px 20px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* =====================================\n   HAUPTINHALT\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n/* =====================================\n   SUCHE\n===================================== */\n\n.search-box {\n  margin-bottom: 25px;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 16px;\n  border: 1px solid #c5d5e8;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* =====================================\n   KATEGORIEFILTER\n===================================== */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  border: 1px solid #0754a6;\n  background: white;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   NACHRICHTENKARTEN\n===================================== */\n\n.news-list {\n  display: grid;\n  gap: 18px;\n}\n\n.news-item {\n  background: white;\n  border-radius: 12px;\n  padding: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n  border-left: 5px solid #168de0;\n}\n\n.news-item h3 {\n  color: #0754a6;\n  margin: 10px 0;\n  font-size: 21px;\n  overflow-wrap: anywhere;\n}\n\n.category {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 4px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.date {\n  color: #68788c;\n  font-size: 14px;\n}\n\n.news-item p {\n  color: #46566d;\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.content-language {\n  display: inline-block;\n  color: #68788c;\n  font-size: 13px;\n  margin-top: 8px;\n}\n\n.news-link {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 10px 17px;\n  border-radius: 6px;\n  text-decoration: none;\n  font-weight: bold;\n  margin-top: 12px;\n}\n\n.news-link:hover {\n  background: #003a7a;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  color: #68788c;\n}\n\n.status {\n  background: white;\n  padding: 25px;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   FUSSZEILE\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   MOBILE ANSICHT\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .intro,\n  .news-item {\n    padding: 20px;\n  }\n\n  .news-link {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     KOPFBEREICH\n===================================== -->\n\n<header>\n\n<h1>\nNachrichten und Bekanntmachungen\n</h1>\n\n<p>\nInitiative für ein globales KI-Zentrum<br>\nSonderstadt Goyang, Republik Korea\n</p>\n\n<p>\nAktuelle Informationen über\nbürgerschaftliche Aktivitäten,\ninternationale Zusammenarbeit,\npolitische Vorschläge\nund wichtige Entwicklungen.\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=de\"\nclass=\"home-link\">\n← Deutsche Startseite\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     EINFÜHRUNG\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nAktuelle Nachrichten des Bürgerkomitees\n</h2>\n\n<p>\nDiese Seite informiert\nüber die Aktivitäten\ndes Bürgerkomitees zur Förderung\nder Ansiedlung eines globalen KI-Zentrums\nin der Sonderstadt Goyang.\n</p>\n\n<p>\nDie Veröffentlichungen können\nAktivitäten des Komitees,\nöffentliche Bekanntmachungen,\nVeranstaltungen,\nMedienberichte\nund politische Entwicklungen umfassen.\n</p>\n\n<p>\nNeue Informationen werden ergänzt,\nsobald sie verfügbar sind.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     SPRACHHINWEIS\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nSprachinformationen\n</strong>\n\n<p>\nDiese deutschsprachige Seite\nzeigt Nachrichten und Bekanntmachungen\naus der bestehenden\nVeröffentlichungsdatenbank\ndes Bürgerkomitees an.\n</p>\n\n<p>\nEinige Artikel sind ausschließlich\nin koreanischer Sprache verfügbar.\nDie ursprünglichen koreanischen Titel\nund Beschreibungen werden\nohne automatische Übersetzung angezeigt.\n</p>\n\n<p>\nSofern verfügbar,\nkann der Originalartikel\noder die zugehörige Quelle\nüber den bereitgestellten Link\ngeöffnet werden.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     SUCHE\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\ntype=\"search\"\nid=\"searchInput\"\nplaceholder=\"Nachrichtentitel oder Stichwörter suchen\"\naria-label=\"Nachrichten und Bekanntmachungen durchsuchen\">\n\n</div>\n\n\u003c!-- =====================================\n     FILTER\n===================================== -->\n\n<nav class=\"filters\"\naria-label=\"Nachrichten nach Kategorie filtern\">\n\n<button\ntype=\"button\"\nclass=\"active\"\ndata-category=\"all\"\naria-pressed=\"true\">\nAlle Nachrichten\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"notice\"\naria-pressed=\"false\">\nBekanntmachungen\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"activity\"\naria-pressed=\"false\">\nAktivitäten des Komitees\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"event\"\naria-pressed=\"false\">\nVeranstaltungen\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"press\"\naria-pressed=\"false\">\nMedienberichte\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"policy\"\naria-pressed=\"false\">\nPolitische Entwicklungen\n</button>\n\n</nav>\n\n\u003c!-- =====================================\n     NACHRICHTENLISTE\n===================================== -->\n\n<div\nclass=\"news-list\"\nid=\"newsList\"\naria-live=\"polite\">\n</div>\n\n<p\nclass=\"empty\"\nid=\"empty\"\nhidden>\nKeine Nachrichten entsprechen\nIhren Suchkriterien.\n</p>\n\n</main>\n\n\u003c!-- =====================================\n     FUSSZEILE\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nBürgerkomitee zur Förderung<br>\nder Ansiedlung eines globalen KI-Zentrums<br>\nin der Sonderstadt Goyang\n</strong>\n</p>\n\n<p>\nProvinz Gyeonggi,\nRepublik Korea\n</p>\n\n<p>\nMit den Bürgerinnen und Bürgern,<br>\nmit der Provinz Gyeonggi<br>\nund mit der Welt.\n</p>\n\n<p>\n<a href=\"index.html?lang=de\">\nDeutsche Startseite\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE-NACHRICHTENMODUL\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE-VERBINDUNG\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   DOM-ELEMENTE\n===================================== */\n\nconst newsList =\n  document.getElementById(\"newsList\");\n\nconst searchInput =\n  document.getElementById(\"searchInput\");\n\nconst empty =\n  document.getElementById(\"empty\");\n\n/* =====================================\n   KATEGORIENAMEN\n===================================== */\n\nconst categoryNames = {\n\n  notice: \"Bekanntmachungen\",\n\n  activity: \"Aktivitäten des Komitees\",\n\n  event: \"Veranstaltungen\",\n\n  press: \"Medienberichte\",\n\n  policy: \"Politische Entwicklungen\"\n\n};\n\n/* =====================================\n   STATUS\n===================================== */\n\nlet news = [];\n\nlet currentCategory = \"all\";\n\nlet loadFailed = false;\n\n/* =====================================\n   DATUMSFORMATIERUNG\n===================================== */\n\nfunction formatDate(value) {\n\n  if (!value) return \"\";\n\n  const date = new Date(value);\n\n  if (Number.isNaN(date.getTime())) {\n    return String(value).slice(0, 10);\n  }\n\n  return [\n    date.getFullYear(),\n    String(date.getMonth() + 1).padStart(2, \"0\"),\n    String(date.getDate()).padStart(2, \"0\")\n  ].join(\".\");\n\n}\n\n/* =====================================\n   KOREANISCHE TEXTE ERKENNEN\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   LINK-VALIDIERUNG\n===================================== */\n\nfunction getSafeLink(value) {\n\n  if (!value) return \"\";\n\n  try {\n\n    const url = new URL(\n      value,\n      window.location.href\n    );\n\n    if (\n      url.protocol !== \"https:\" &&\n      url.protocol !== \"http:\"\n    ) {\n      return \"\";\n    }\n\n    return url.href;\n\n  } catch (error) {\n\n    return \"\";\n\n  }\n\n}\n\n/* =====================================\n   NACHRICHTEN LADEN\n===================================== */\n\nasync function loadNews() {\n\n  newsList.innerHTML =\n    '<div class=\"status\">' +\n    'Nachrichten und Bekanntmachungen werden geladen...' +\n    '</div>';\n\n  empty.hidden = true;\n\n  const combinedNews = [];\n\n  let successfulQueries = 0;\n\n  /* =====================================\n     1. NACHRICHTENBEITRÄGE\n  ===================================== */\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id,title,category,description,link,published_at\"\n        )\n        .order(\"published_at\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    successfulQueries++;\n\n    for (const item of data || []) {\n\n      combinedNews.push({\n\n        id: \"news-\" + item.id,\n\n        date: formatDate(\n          item.published_at\n        ),\n\n        sortDate:\n          item.published_at || \"\",\n\n        category:\n          item.category || \"\",\n\n        categoryName:\n          categoryNames[item.category] ||\n          \"Sonstiges\",\n\n        title:\n          item.title || \"\",\n\n        description:\n          item.description || \"\",\n\n        link:\n          item.link || \"\"\n\n      });\n\n    }\n\n  } catch (error) {\n\n    console.error(\n      \"Abfrage der Nachrichtenbeiträge fehlgeschlagen:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     2. AUSGEWÄHLTE FORENBEITRÄGE\n  ===================================== */\n\n  try {\n\n    const {\n      data: placements,\n      error\n    } =\n      await supabase\n        .from(\"board_post_placements\")\n        .select(\"post_id,placement\")\n        .in(\"placement\", [\n          \"notice\",\n          \"activity\"\n        ]);\n\n    if (error) {\n      throw error;\n    }\n\n    if (\n      placements &&\n      placements.length > 0\n    ) {\n\n      const postIds = [\n        ...new Set(\n          placements.map(\n            item => item.post_id\n          )\n        )\n      ];\n\n      const {\n        data: posts,\n        error: postError\n      } =\n        await supabase\n          .from(\"board_posts\")\n          .select(\n            \"id,title,content,created_at\"\n          )\n          .in(\"id\", postIds);\n\n      if (postError) {\n        throw postError;\n      }\n\n      const postMap = new Map(\n        (posts || []).map(post => [\n          String(post.id),\n          post\n        ])\n      );\n\n      for (const placement of placements) {\n\n        const post = postMap.get(\n          String(placement.post_id)\n        );\n\n        if (!post) continue;\n\n        const content =\n          post.content || \"\";\n\n        combinedNews.push({\n\n          id:\n            \"board-\" +\n            placement.placement +\n            \"-\" +\n            post.id,\n\n          date:\n            formatDate(\n              post.created_at\n            ),\n\n          sortDate:\n            post.created_at || \"\",\n\n          category:\n            placement.placement,\n\n          categoryName:\n            categoryNames[\n              placement.placement\n            ] || \"Sonstiges\",\n\n          title:\n            post.title || \"\",\n\n          description:\n            content.length > 200\n              ? content.slice(0, 200) + \"...\"\n              : content,\n\n          link:\n            \"board.html?post=\" +\n            encodeURIComponent(post.id)\n\n        });\n\n      }\n\n    }\n\n    successfulQueries++;\n\n  } catch (error) {\n\n    console.error(\n      \"Abfrage ausgewählter Forenbeiträge fehlgeschlagen:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     3. NACHRICHTEN SORTIEREN\n  ===================================== */\n\n  combinedNews.sort((a, b) =>\n    String(b.sortDate)\n      .localeCompare(\n        String(a.sortDate)\n      )\n  );\n\n  news = combinedNews;\n\n  /* =====================================\n     4. FEHLERBEHANDLUNG\n  ===================================== */\n\n  if (successfulQueries === 0) {\n\n    loadFailed = true;\n\n    newsList.innerHTML =\n      '<div class=\"status\">' +\n      'Nachrichten können derzeit nicht geladen werden. ' +\n      'Bitte versuchen Sie es später erneut.' +\n      '</div>';\n\n    empty.hidden = true;\n\n    return;\n\n  }\n\n  loadFailed = false;\n\n  renderNews();\n\n  console.log(\n    \"Deutsche Nachrichtenseite geladen:\",\n    news.length,\n    \"Einträge\"\n  );\n\n}\n\n/* =====================================\n   NACHRICHTEN ANZEIGEN\n===================================== */\n\nfunction renderNews() {\n\n  if (loadFailed) return;\n\n  const keyword =\n    searchInput.value\n      .trim()\n      .toLowerCase();\n\n  const filtered = news.filter(item => {\n\n    const categoryMatch =\n      currentCategory === \"all\" ||\n      item.category === currentCategory;\n\n    const searchText = [\n      item.title,\n      item.description,\n      item.categoryName,\n      item.date\n    ].join(\" \").toLowerCase();\n\n    return (\n      categoryMatch &&\n      searchText.includes(keyword)\n    );\n\n  });\n\n  filtered.sort((a, b) =>\n    String(b.sortDate || b.date || \"\")\n      .localeCompare(\n        String(a.sortDate || a.date || \"\")\n      )\n  );\n\n  newsList.innerHTML = \"\";\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"news-item\";\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className = \"category\";\n\n    category.textContent =\n      item.categoryName;\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className = \"date\";\n\n    date.textContent =\n      item.date;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description;\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* =====================================\n       HINWEIS AUF KOREANISCHE INHALTE\n    ===================================== */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"Originalinhalt auf Koreanisch\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* =====================================\n       ARTIKELLINK\n    ===================================== */\n\n    const safeLink =\n      getSafeLink(item.link);\n\n    if (safeLink) {\n\n      const link =\n        document.createElement(\"a\");\n\n      link.className =\n        \"news-link\";\n\n      link.href =\n        safeLink;\n\n      const url =\n        new URL(safeLink);\n\n      const isBoardLink =\n        url.origin ===\n          window.location.origin &&\n        url.pathname.endsWith(\n          \"/board.html\"\n        );\n\n      if (isBoardLink) {\n\n        link.target = \"_self\";\n\n      } else {\n\n        link.target = \"_blank\";\n\n        link.rel =\n          \"noopener noreferrer\";\n\n      }\n\n      link.textContent =\n        \"Weiterlesen\";\n\n      card.appendChild(link);\n\n    }\n\n    newsList.appendChild(card);\n\n  });\n\n  empty.hidden =\n    filtered.length !== 0;\n\n}\n\n/* =====================================\n   KATEGORIEFILTER\n===================================== */\n\ndocument\n  .querySelectorAll(\"[data-category]\")\n  .forEach(button => {\n\n    button.addEventListener(\n      \"click\",\n      () => {\n\n        currentCategory =\n          button.dataset.category;\n\n        document\n          .querySelectorAll(\n            \"[data-category]\"\n          )\n          .forEach(btn => {\n\n            const isActive =\n              btn.dataset.category ===\n              currentCategory;\n\n            btn.classList.toggle(\n              \"active\",\n              isActive\n            );\n\n            btn.setAttribute(\n              \"aria-pressed\",\n              String(isActive)\n            );\n\n          });\n\n        renderNews();\n\n      }\n    );\n\n  });\n\n/* =====================================\n   SUCHE\n===================================== */\n\nsearchInput.addEventListener(\n  \"input\",\n  renderNews\n);\n\n/* =====================================\n   ERSTER LADEVORGANG\n===================================== */\n\nloadNews();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=en": "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<title>\nNews & Announcements |\nGlobal AI Hub Initiative\n</title>\n\n<meta name=\"description\"\ncontent=\"News, announcements, activities, events and policy updates from the Citizens' Promotion Committee for Attracting the Global AI Hub to Goyang Special City, Republic of Korea.\">\n\n<style>\n\n/* =====================================\n   BASIC SETTINGS\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   HEADER\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 17px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  padding: 10px 20px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* =====================================\n   MAIN CONTENT\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n/* =====================================\n   SEARCH\n===================================== */\n\n.search-box {\n  margin-bottom: 25px;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 16px;\n  border: 1px solid #c5d5e8;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* =====================================\n   CATEGORY FILTERS\n===================================== */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  border: 1px solid #0754a6;\n  background: white;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   NEWS CARDS\n===================================== */\n\n.news-list {\n  display: grid;\n  gap: 18px;\n}\n\n.news-item {\n  background: white;\n  border-radius: 12px;\n  padding: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n  border-left: 5px solid #168de0;\n}\n\n.news-item h3 {\n  color: #0754a6;\n  margin: 10px 0;\n  font-size: 21px;\n  overflow-wrap: anywhere;\n}\n\n.category {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 4px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.date {\n  color: #68788c;\n  font-size: 14px;\n}\n\n.news-item p {\n  color: #46566d;\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.content-language {\n  display: inline-block;\n  color: #68788c;\n  font-size: 13px;\n  margin-top: 8px;\n}\n\n.news-link {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 10px 17px;\n  border-radius: 6px;\n  text-decoration: none;\n  font-weight: bold;\n  margin-top: 12px;\n}\n\n.news-link:hover {\n  background: #003a7a;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  color: #68788c;\n}\n\n.status {\n  background: white;\n  padding: 25px;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   FOOTER\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .intro,\n  .news-item {\n    padding: 20px;\n  }\n\n  .news-link {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header>\n\n<h1>\nNews & Announcements\n</h1>\n\n<p>\nGlobal AI Hub Initiative<br>\nGoyang Special City, Republic of Korea\n</p>\n\n<p>\nUpdates on civic activities,\ninternational cooperation,\npolicy proposals,\nand major developments.\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=en\"\nclass=\"home-link\">\n← English Home\n</a>\n\n<a href=\"news.html\"\nclass=\"home-link\"\nlang=\"ko\">\n한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     INTRODUCTION\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nLatest News from the Citizens' Promotion Committee\n</h2>\n\n<p>\nThis page provides information\nabout the activities of the\nCitizens' Promotion Committee\nfor Attracting the Global AI Hub\nto Goyang Special City.\n</p>\n\n<p>\nUpdates may include\nCommittee activities,\npublic announcements,\nevents,\nmedia coverage,\nand policy developments.\n</p>\n\n<p>\nNew information will be added\nas it becomes available.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     LANGUAGE NOTICE\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nLanguage Information\n</strong>\n\n<p>\nThis English-language page\ndisplays news and announcements\nfrom the Committee's existing\npublication database.\n</p>\n\n<p>\nSome articles are available\nonly in Korean.\nOriginal Korean-language titles\nand descriptions are displayed\nwithout automatic translation.\n</p>\n\n<p>\nWhere available,\nthe original article or related\nsource can be opened\nusing the link provided.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     SEARCH\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\ntype=\"search\"\nid=\"searchInput\"\nplaceholder=\"Search news titles or keywords\"\naria-label=\"Search news and announcements\">\n\n</div>\n\n\u003c!-- =====================================\n     FILTERS\n===================================== -->\n\n<nav class=\"filters\"\naria-label=\"Filter news by category\">\n\n<button\ntype=\"button\"\nclass=\"active\"\ndata-category=\"all\"\naria-pressed=\"true\">\nAll News\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"notice\"\naria-pressed=\"false\">\nAnnouncements\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"activity\"\naria-pressed=\"false\">\nCommittee Activities\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"event\"\naria-pressed=\"false\">\nEvents\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"press\"\naria-pressed=\"false\">\nMedia Coverage\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"policy\"\naria-pressed=\"false\">\nPolicy Updates\n</button>\n\n</nav>\n\n\u003c!-- =====================================\n     NEWS LIST\n===================================== -->\n\n<div\nclass=\"news-list\"\nid=\"newsList\"\naria-live=\"polite\">\n</div>\n\n<p\nclass=\"empty\"\nid=\"empty\"\nhidden>\nNo news items match your search.\n</p>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nCitizens' Promotion Committee<br>\nfor Attracting the Global AI Hub<br>\nto Goyang Special City\n</strong>\n</p>\n\n<p>\nGyeonggi Province,\nRepublic of Korea\n</p>\n\n<p>\nWith Citizens,\nWith Gyeonggi Province,\nand With the World.\n</p>\n\n<p>\n<a href=\"index.html?lang=en\">\nEnglish Home\n</a>\n&nbsp; | &nbsp;\n<a href=\"news.html\" lang=\"ko\">\n한국어\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE NEWS MODULE\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE CONNECTION\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   DOM ELEMENTS\n===================================== */\n\nconst newsList =\n  document.getElementById(\"newsList\");\n\nconst searchInput =\n  document.getElementById(\"searchInput\");\n\nconst empty =\n  document.getElementById(\"empty\");\n\n/* =====================================\n   CATEGORY NAMES\n===================================== */\n\nconst categoryNames = {\n\n  notice: \"Announcements\",\n\n  activity: \"Committee Activities\",\n\n  event: \"Events\",\n\n  press: \"Media Coverage\",\n\n  policy: \"Policy Updates\"\n\n};\n\n/* =====================================\n   STATE\n===================================== */\n\nlet news = [];\n\nlet currentCategory = \"all\";\n\nlet loadFailed = false;\n\n/* =====================================\n   DATE FORMATTING\n===================================== */\n\nfunction formatDate(value) {\n\n  if (!value) return \"\";\n\n  const date = new Date(value);\n\n  if (Number.isNaN(date.getTime())) {\n    return String(value).slice(0, 10);\n  }\n\n  return [\n    date.getFullYear(),\n    String(date.getMonth() + 1).padStart(2, \"0\"),\n    String(date.getDate()).padStart(2, \"0\")\n  ].join(\".\");\n\n}\n\n/* =====================================\n   KOREAN TEXT DETECTION\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   LINK VALIDATION\n===================================== */\n\nfunction getSafeLink(value) {\n\n  if (!value) return \"\";\n\n  try {\n\n    const url = new URL(\n      value,\n      window.location.href\n    );\n\n    if (\n      url.protocol !== \"https:\" &&\n      url.protocol !== \"http:\"\n    ) {\n      return \"\";\n    }\n\n    return url.href;\n\n  } catch (error) {\n\n    return \"\";\n\n  }\n\n}\n\n/* =====================================\n   LOAD NEWS\n===================================== */\n\nasync function loadNews() {\n\n  newsList.innerHTML =\n    '<div class=\"status\">' +\n    'Loading news and announcements...' +\n    '</div>';\n\n  empty.hidden = true;\n\n  const combinedNews = [];\n\n  let successfulQueries = 0;\n\n  /* =====================================\n     1. NEWS POSTS\n  ===================================== */\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id,title,category,description,link,published_at\"\n        )\n        .order(\"published_at\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    successfulQueries++;\n\n    for (const item of data || []) {\n\n      combinedNews.push({\n\n        id: \"news-\" + item.id,\n\n        date: formatDate(\n          item.published_at\n        ),\n\n        sortDate:\n          item.published_at || \"\",\n\n        category:\n          item.category || \"\",\n\n        categoryName:\n          categoryNames[item.category] ||\n          \"Other\",\n\n        title:\n          item.title || \"\",\n\n        description:\n          item.description || \"\",\n\n        link:\n          item.link || \"\"\n\n      });\n\n    }\n\n  } catch (error) {\n\n    console.error(\n      \"News posts query failed:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     2. SELECTED BOARD POSTS\n  ===================================== */\n\n  try {\n\n    const {\n      data: placements,\n      error\n    } =\n      await supabase\n        .from(\"board_post_placements\")\n        .select(\"post_id,placement\")\n        .in(\"placement\", [\n          \"notice\",\n          \"activity\"\n        ]);\n\n    if (error) {\n      throw error;\n    }\n\n    if (\n      placements &&\n      placements.length > 0\n    ) {\n\n      const postIds = [\n        ...new Set(\n          placements.map(\n            item => item.post_id\n          )\n        )\n      ];\n\n      const {\n        data: posts,\n        error: postError\n      } =\n        await supabase\n          .from(\"board_posts\")\n          .select(\n            \"id,title,content,created_at\"\n          )\n          .in(\"id\", postIds);\n\n      if (postError) {\n        throw postError;\n      }\n\n      const postMap = new Map(\n        (posts || []).map(post => [\n          String(post.id),\n          post\n        ])\n      );\n\n      for (const placement of placements) {\n\n        const post = postMap.get(\n          String(placement.post_id)\n        );\n\n        if (!post) continue;\n\n        const content =\n          post.content || \"\";\n\n        combinedNews.push({\n\n          id:\n            \"board-\" +\n            placement.placement +\n            \"-\" +\n            post.id,\n\n          date:\n            formatDate(\n              post.created_at\n            ),\n\n          sortDate:\n            post.created_at || \"\",\n\n          category:\n            placement.placement,\n\n          categoryName:\n            categoryNames[\n              placement.placement\n            ] || \"Other\",\n\n          title:\n            post.title || \"\",\n\n          description:\n            content.length > 200\n              ? content.slice(0, 200) + \"...\"\n              : content,\n\n          link:\n            \"board.html?post=\" +\n            encodeURIComponent(post.id)\n\n        });\n\n      }\n\n    }\n\n    successfulQueries++;\n\n  } catch (error) {\n\n    console.error(\n      \"Selected board posts query failed:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     3. SORT NEWS\n  ===================================== */\n\n  combinedNews.sort((a, b) =>\n    String(b.sortDate)\n      .localeCompare(\n        String(a.sortDate)\n      )\n  );\n\n  news = combinedNews;\n\n  /* =====================================\n     4. HANDLE QUERY FAILURE\n  ===================================== */\n\n  if (successfulQueries === 0) {\n\n    loadFailed = true;\n\n    newsList.innerHTML =\n      '<div class=\"status\">' +\n      'Unable to load news at this time. ' +\n      'Please try again later.' +\n      '</div>';\n\n    empty.hidden = true;\n\n    return;\n\n  }\n\n  loadFailed = false;\n\n  renderNews();\n\n  console.log(\n    \"English news page loaded:\",\n    news.length,\n    \"items\"\n  );\n\n}\n\n/* =====================================\n   RENDER NEWS\n===================================== */\n\nfunction renderNews() {\n\n  if (loadFailed) return;\n\n  const keyword =\n    searchInput.value\n      .trim()\n      .toLowerCase();\n\n  const filtered = news.filter(item => {\n\n    const categoryMatch =\n      currentCategory === \"all\" ||\n      item.category === currentCategory;\n\n    const searchText = [\n      item.title,\n      item.description,\n      item.categoryName,\n      item.date\n    ].join(\" \").toLowerCase();\n\n    return (\n      categoryMatch &&\n      searchText.includes(keyword)\n    );\n\n  });\n\n  filtered.sort((a, b) =>\n    String(b.sortDate || b.date || \"\")\n      .localeCompare(\n        String(a.sortDate || a.date || \"\")\n      )\n  );\n\n  newsList.innerHTML = \"\";\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"news-item\";\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className = \"category\";\n\n    category.textContent =\n      item.categoryName;\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className = \"date\";\n\n    date.textContent =\n      item.date;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description;\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* =====================================\n       KOREAN CONTENT NOTICE\n    ===================================== */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"Original content in Korean\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* =====================================\n       ARTICLE LINK\n    ===================================== */\n\n    const safeLink =\n      getSafeLink(item.link);\n\n    if (safeLink) {\n\n      const link =\n        document.createElement(\"a\");\n\n      link.className =\n        \"news-link\";\n\n      link.href =\n        safeLink;\n\n      const url =\n        new URL(safeLink);\n\n      const isBoardLink =\n        url.origin ===\n          window.location.origin &&\n        url.pathname.endsWith(\n          \"/board.html\"\n        );\n\n      if (isBoardLink) {\n\n        link.target = \"_self\";\n\n      } else {\n\n        link.target = \"_blank\";\n\n        link.rel =\n          \"noopener noreferrer\";\n\n      }\n\n      link.textContent =\n        \"Read More\";\n\n      card.appendChild(link);\n\n    }\n\n    newsList.appendChild(card);\n\n  });\n\n  empty.hidden =\n    filtered.length !== 0;\n\n}\n\n/* =====================================\n   CATEGORY FILTERS\n===================================== */\n\ndocument\n  .querySelectorAll(\"[data-category]\")\n  .forEach(button => {\n\n    button.addEventListener(\n      \"click\",\n      () => {\n\n        currentCategory =\n          button.dataset.category;\n\n        document\n          .querySelectorAll(\n            \"[data-category]\"\n          )\n          .forEach(btn => {\n\n            const isActive =\n              btn.dataset.category ===\n              currentCategory;\n\n            btn.classList.toggle(\n              \"active\",\n              isActive\n            );\n\n            btn.setAttribute(\n              \"aria-pressed\",\n              String(isActive)\n            );\n\n          });\n\n        renderNews();\n\n      }\n    );\n\n  });\n\n/* =====================================\n   SEARCH\n===================================== */\n\nsearchInput.addEventListener(\n  \"input\",\n  renderNews\n);\n\n/* =====================================\n   INITIAL LOAD\n===================================== */\n\nloadNews();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=es": "<!DOCTYPE html>\n<html lang=\"es\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nNoticias y Avisos | Centro Global de IA en Goyang\n</title>\n\n<meta name=\"description\"\ncontent=\"Noticias, avisos, actividades y acontecimientos del Comité Ciudadano de Promoción para la Atracción del Centro Global de IA a la Ciudad Especial de Goyang, República de Corea.\">\n\n<link rel=\"canonical\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/news.html?lang=es\">\n\n<link rel=\"alternate\" hreflang=\"es\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/news.html?lang=es\">\n\n<link rel=\"alternate\" hreflang=\"en\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/news.html?lang=en\">\n\n<link rel=\"alternate\" hreflang=\"ko\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/news.html\">\n\n<style>\n\n/* CONFIGURACIÓN GENERAL */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nsummary:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* ENCABEZADO */\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 40px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 16px;\n  color: #e3efff;\n}\n\n/* NAVEGACIÓN */\n\n.top-navigation {\n  background: #10315e;\n  padding: 12px 18px;\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  align-items: center;\n  gap: 12px;\n}\n\n.top-navigation > a {\n  color: white;\n  text-decoration: none;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.top-navigation > a:hover {\n  color: #ffdf5a;\n}\n\n/* SELECTOR DE IDIOMA */\n\n.language-dropdown {\n  position: relative;\n  z-index: 1000;\n}\n\n.language-dropdown summary {\n  display: inline-flex;\n  align-items: center;\n  padding: 9px 15px;\n  background: #ffe44d;\n  color: #003b79;\n  border-radius: 6px;\n  font-size: 13px;\n  font-weight: bold;\n  cursor: pointer;\n  list-style: none;\n}\n\n.language-dropdown summary::-webkit-details-marker {\n  display: none;\n}\n\n.language-options {\n  position: absolute;\n  top: calc(100% + 7px);\n  right: 0;\n  min-width: 180px;\n  padding: 8px;\n  background: white;\n  border: 1px solid #cbdff5;\n  border-radius: 8px;\n  box-shadow: 0 5px 18px rgba(0,0,0,0.18);\n}\n\n.language-options a {\n  display: block;\n  padding: 10px 12px;\n  color: #0754a6;\n  border-radius: 5px;\n  text-decoration: none;\n  font-size: 14px;\n}\n\n.language-options a:hover,\n.language-options a[aria-current=\"page\"] {\n  background: #eaf4ff;\n}\n\n.language-options a[aria-current=\"page\"] {\n  font-weight: bold;\n}\n\n/* CONTENIDO */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n/* BÚSQUEDA */\n\n.search-box {\n  margin-bottom: 25px;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 16px;\n  border: 1px solid #c5d5e8;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* FILTROS */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  border: 1px solid #0754a6;\n  background: white;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n/* NOTICIAS */\n\n.news-list {\n  display: grid;\n  gap: 18px;\n}\n\n.news-item {\n  background: white;\n  border-radius: 12px;\n  padding: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n  border-left: 5px solid #168de0;\n}\n\n.news-item h3 {\n  color: #0754a6;\n  margin: 10px 0;\n  font-size: 21px;\n  overflow-wrap: anywhere;\n}\n\n.category {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 4px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.date {\n  color: #68788c;\n  font-size: 14px;\n}\n\n.news-item p {\n  color: #46566d;\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.content-language {\n  display: block;\n  color: #68788c;\n  font-size: 13px;\n  margin-top: 8px;\n}\n\n.news-link {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 10px 17px;\n  border-radius: 6px;\n  text-decoration: none;\n  font-weight: bold;\n  margin-top: 12px;\n}\n\n.news-link:hover {\n  background: #003a7a;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  color: #68788c;\n}\n\n.status {\n  background: white;\n  padding: 25px;\n  border-radius: 10px;\n  color: #596a80;\n  margin-bottom: 20px;\n}\n\n/* ENLACES */\n\n.related-links {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-top: 30px;\n}\n\n.related-links h2 {\n  color: #0754a6;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 8px 8px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* PIE DE PÁGINA */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* MÓVIL */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 30px 12px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .intro,\n  .news-item,\n  .related-links {\n    padding: 20px;\n  }\n\n  .news-link,\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n  .filters button {\n    flex: 1 1 auto;\n  }\n\n  .language-options {\n    right: auto;\n    left: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- ENCABEZADO -->\n\n<header>\n\n<h1>\nNoticias y Avisos\n</h1>\n\n<p>\nIniciativa del Centro Global de Inteligencia Artificial<br>\nCiudad Especial de Goyang, República de Corea\n</p>\n\n<p>\nActividades ciudadanas, cooperación internacional,<br>\npropuestas de políticas y principales acontecimientos.\n</p>\n\n</header>\n\n\u003c!-- NAVEGACIÓN -->\n\n<nav class=\"top-navigation\"\naria-label=\"Navegación principal\">\n\n<a href=\"index.html?lang=es\">\n← Inicio\n</a>\n\n<a href=\"hub.html?lang=es\">\nCentro Global de IA\n</a>\n\n<a href=\"committee.html?lang=es\">\nComité Ciudadano\n</a>\n\n<a href=\"history.html?lang=es\">\nCronología\n</a>\n\n<a href=\"strategy.html?lang=es\">\nEstrategia\n</a>\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"Seleccionar idioma\">\n🌐 Idioma ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a href=\"news.html?lang=es\"\nlang=\"es\"\naria-current=\"page\">\nEspañol ✓\n</a>\n\n<a href=\"news.html?lang=en\"\nlang=\"en\">\nEnglish\n</a>\n\n<a href=\"news.html\"\nlang=\"ko\">\n한국어\n</a>\n\n</div>\n\n</details>\n\n</nav>\n\n<main>\n\n\u003c!-- INTRODUCCIÓN -->\n\n<section class=\"intro\">\n\n<h2>\nÚltimas noticias del Comité Ciudadano de Promoción\n</h2>\n\n<p>\nEsta página ofrece información\nsobre las actividades del Comité Ciudadano\nde Promoción para la Atracción\ndel Centro Global de Inteligencia Artificial\na la Ciudad Especial de Goyang.\n</p>\n\n<p>\nLas publicaciones pueden incluir\nactividades del Comité,\navisos públicos,\neventos,\ncobertura de prensa\ny novedades relacionadas\ncon las políticas públicas.\n</p>\n\n<p>\nLa información se actualizará\na medida que se publiquen\nnuevos contenidos.\n</p>\n\n</section>\n\n\u003c!-- INFORMACIÓN SOBRE EL IDIOMA -->\n\n<div class=\"language-notice\">\n\n<strong>\nInformación sobre el idioma\n</strong>\n\n<p>\nEsta página en español muestra\nnoticias y avisos procedentes\nde la base de datos\nde publicaciones del Comité.\n</p>\n\n<p>\nAlgunas publicaciones\nestán disponibles únicamente\nen coreano.\nLos títulos y las descripciones\noriginales se muestran\nsin traducción automática.\n</p>\n\n<p>\nCuando exista un enlace,\npodrá abrir la publicación original\no la fuente relacionada.\n</p>\n\n</div>\n\n\u003c!-- BÚSQUEDA -->\n\n<div class=\"search-box\">\n\n<input\ntype=\"search\"\nid=\"searchInput\"\nplaceholder=\"Buscar noticias, títulos o palabras clave\"\naria-label=\"Buscar noticias y avisos\">\n\n</div>\n\n\u003c!-- FILTROS -->\n\n<nav class=\"filters\"\naria-label=\"Filtrar noticias por categoría\">\n\n<button\ntype=\"button\"\nclass=\"active\"\ndata-category=\"all\"\naria-pressed=\"true\">\nTodas las noticias\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"notice\"\naria-pressed=\"false\">\nAvisos\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"activity\"\naria-pressed=\"false\">\nActividades del Comité\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"event\"\naria-pressed=\"false\">\nEventos\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"press\"\naria-pressed=\"false\">\nCobertura de prensa\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"policy\"\naria-pressed=\"false\">\nActualizaciones de políticas\n</button>\n\n</nav>\n\n\u003c!-- LISTA DE NOTICIAS -->\n\n<div\nclass=\"news-list\"\nid=\"newsList\"\naria-live=\"polite\">\n</div>\n\n<p\nclass=\"empty\"\nid=\"empty\"\nhidden>\nNo se encontraron publicaciones\nque coincidan con la búsqueda.\n</p>\n\n\u003c!-- ENLACES RELACIONADOS -->\n\n<section class=\"related-links\">\n\n<h2>\nMás información\n</h2>\n\n<p>\nExplore las actividades,\nla estrategia\ny los principales acontecimientos\nde la iniciativa\ndel Centro Global de IA.\n</p>\n\n<a href=\"index.html?lang=es\"\nclass=\"button\">\nInicio en español\n</a>\n\n<a href=\"committee.html?lang=es\"\nclass=\"button\">\nComité Ciudadano\n</a>\n\n<a href=\"history.html?lang=es\"\nclass=\"button\">\nCronología\n</a>\n\n<a href=\"strategy.html?lang=es\"\nclass=\"button\">\nEstrategia\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIE DE PÁGINA -->\n\n<footer>\n\n<p>\n<strong>\nComité Ciudadano de Promoción<br>\npara la Atracción del Centro Global de IA<br>\na la Ciudad Especial de Goyang\n</strong>\n</p>\n\n<p>\nProvincia de Gyeonggi,\nRepública de Corea\n</p>\n\n<p>\nCon los ciudadanos,<br>\ncon Gyeonggi<br>\ny con el mundo.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=es\">\nInicio en español\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"news.html?lang=en\"\nlang=\"en\">\nEnglish\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"news.html\"\nlang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n\u003c!-- MÓDULO DE NOTICIAS SUPABASE -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* CONEXIÓN SUPABASE */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* ELEMENTOS */\n\nconst newsList =\n  document.getElementById(\"newsList\");\n\nconst searchInput =\n  document.getElementById(\"searchInput\");\n\nconst empty =\n  document.getElementById(\"empty\");\n\n/* CATEGORÍAS */\n\nconst categoryNames = {\n  notice: \"Avisos\",\n  activity: \"Actividades del Comité\",\n  event: \"Eventos\",\n  press: \"Cobertura de prensa\",\n  policy: \"Actualizaciones de políticas\"\n};\n\n/* ESTADO */\n\nlet news = [];\nlet currentCategory = \"all\";\nlet loadFailed = false;\nlet partialFailure = false;\n\n/* FECHAS */\n\nfunction formatDate(valu
