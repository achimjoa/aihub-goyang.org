<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0754a6">

<title>활동 소식·공지사항 | 글로벌 AI 허브 유치위원회</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Malgun Gothic", Arial, sans-serif;
  background: #f4f8fc;
  color: #17315b;
  line-height: 1.7;
}

header {
  background: linear-gradient(135deg, #0754a6, #10315e);
  color: white;
  text-align: center;
  padding: 55px 20px;
}

header h1 {
  font-size: clamp(28px, 5vw, 42px);
  margin: 0 0 15px;
}

header p { font-size: 17px; }

.home-link {
  display: inline-block;
  background: white;
  color: #0754a6;
  padding: 10px 20px;
  border-radius: 7px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 15px;
}

main {
  max-width: 1150px;
  margin: auto;
  padding: 35px 15px;
}

.intro {
  background: white;
  padding: 30px;
  border-radius: 12px;
  margin-bottom: 25px;
}

.intro h2 {
  color: #0754a6;
  margin-top: 0;
}

.search-box {
  margin-bottom: 25px;
}

.search-box input {
  width: 100%;
  padding: 16px;
  border: 1px solid #c5d5e8;
  border-radius: 8px;
  font-size: 16px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 25px;
}

.filters button {
  border: 1px solid #0754a6;
  background: white;
  color: #0754a6;
  padding: 10px 16px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

.filters button.active {
  background: #0754a6;
  color: white;
}

.news-list {
  display: grid;
  gap: 18px;
}

.news-item {
  background: white;
  border-radius: 12px;
  padding: 25px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
  border-left: 5px solid #168de0;
}

.news-item h3 {
  color: #0754a6;
  margin: 10px 0;
  font-size: 21px;
}

.category {
  display: inline-block;
  background: #e7f1ff;
  color: #0754a6;
  padding: 4px 10px;
  border-radius: 5px;
  font-size: 13px;
  font-weight: bold;
}

.date {
  color: #68788c;
  font-size: 14px;
}

.news-item p {
  color: #46566d;
}

.news-link {
  display: inline-block;
  background: #0754a6;
  color: white;
  padding: 10px 17px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
}

.empty {
  text-align: center;
  padding: 35px;
  color: #68788c;
}

footer {
  background: #10315e;
  color: white;
  text-align: center;
  padding: 35px 15px;
  margin-top: 40px;
}

@media (max-width: 600px) {
  header { padding: 40px 15px; }
  main { padding: 20px 12px; }
  .intro, .news-item { padding: 20px; }
}
</style>
</head>

<body>

<header>
  <h1>활동 소식·공지사항</h1>

  <p>
    경기도 글로벌 AI 허브 유치<br>
    고양특례시 범시민추진위원회
  </p>

  <p>
    글로벌 AI 허브 유치를 위한
    시민사회 활동과 주요 소식을 전합니다.
  </p>

  <a href="index.html" class="home-link">
    ← 홈페이지로 돌아가기
  </a>
</header>

<main>

<section class="intro">
  <h2>위원회 소식</h2>

  <p>
    범시민추진위원회의 활동,
    주요 행사, 정책 제안,
    언론보도 및 공지사항을 안내합니다.
  </p>

  <p>
    새로운 소식은 지속적으로 추가할 예정입니다.
  </p>
</section>

<div class="search-box">
  <input
    type="search"
    id="searchInput"
    placeholder="소식 제목 또는 키워드 검색"
    aria-label="활동 소식 검색">
</div>

<div class="filters">
  <button class="active" data-category="all">전체</button>
  <button data-category="notice">공지사항</button>
  <button data-category="activity">위원회 활동</button>
  <button data-category="event">행사 소식</button>
  <button data-category="press">언론보도</button>
  <button data-category="policy">정책 소식</button>
</div>

<div class="news-list" id="newsList"></div>

<p class="empty" id="empty" hidden>
  검색 조건에 맞는 소식이 없습니다.
</p>

</main>

<footer>
  <p>
    경기도 글로벌 AI 허브 유치<br>
    고양특례시 범시민추진위원회
  </p>
  <p>시민의 힘으로, 경기도의 역량으로, 세계와 함께!</p>
</footer>

<script type="module">

/* =====================================
   제145-2-6-3단계
   Supabase 라이브러리 연결
===================================== */

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* =====================================
   Supabase 연결 정보
===================================== */

const SUPABASE_URL =
  "https://gugkwqpvtwivqudkimvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

/* Supabase 클라이언트 생성 */

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
  
/*
  새로운 소식 등록 방법

  아래 news 배열에 게시물 하나를 추가하면
  홈페이지에 자동으로 표시됩니다.

  link에는 실제 연결 주소를 입력합니다.
  연결 주소가 없으면 빈 문자열("")로 둡니다.
*/

/* =====================================
   제145-2-6-5단계
   활동 소식 데이터 저장 배열
===================================== */

let news = [];

/* =====================================
   제145-2-6-5단계
   Supabase 활동 소식 불러오기
===================================== */

/* =====================================
   활동 소식 + 게시판 선택 게시물 통합 조회
===================================== */

async function loadNews() {

  newsList.textContent =
    "활동 소식을 불러오고 있습니다.";

  empty.hidden = true;

  const categoryNames = {
    notice: "공지사항",
    activity: "위원회 활동",
    event: "행사 소식",
    press: "언론보도",
    policy: "정책 소식"
  };

  /* 날짜 표시 */

  function formatDate(value) {

    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return String(value).slice(0, 10);
    }

    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, "0"),
      String(date.getDate()).padStart(2, "0")
    ].join(".");

  }

  const combinedNews = [];

  let successfulQueries = 0;

  /* =====================================
     1. 기존 활동 소식 조회
  ===================================== */

  try {

    const { data, error } =
      await supabase
        .from("news_posts")
        .select(
          "id,title,category,description,link,published_at"
        )
        .order("published_at", {
          ascending: false
        });

    if (error) {
      throw error;
    }

    successfulQueries++;

    for (const item of data || []) {

      combinedNews.push({

        id: "news-" + item.id,

        date: formatDate(item.published_at),

        sortDate: item.published_at || "",

        category: item.category,

        categoryName:
          categoryNames[item.category] || "기타",

        title: item.title || "",

        description: item.description || "",

        link: item.link || ""

      });

    }

  } catch (error) {

    console.error(
      "기존 활동 소식 조회 오류:",
      error
    );

  }

  /* =====================================
     2. 관리자 선택 게시물 조회
  ===================================== */

  try {

    const { data: placements, error } =
      await supabase
        .from("board_post_placements")
        .select("post_id,placement")
        .in("placement", [
          "notice",
          "activity"
        ]);

    if (error) {
      throw error;
    }

    if (placements && placements.length > 0) {

      const postIds = [
        ...new Set(
          placements.map(item => item.post_id)
        )
      ];

      const {
        data: posts,
        error: postError
      } =
        await supabase
          .from("board_posts")
          .select(
            "id,title,content,created_at"
          )
          .in("id", postIds);

      if (postError) {
        throw postError;
      }

      const postMap = new Map(
        (posts || []).map(post => [
          String(post.id),
          post
        ])
      );

      for (const placement of placements) {

        const post = postMap.get(
          String(placement.post_id)
        );

        if (!post) continue;

        const content = post.content || "";

        combinedNews.push({

          id:
            "board-" +
            placement.placement +
            "-" +
            post.id,

          date: formatDate(post.created_at),

          sortDate: post.created_at || "",

          category: placement.placement,

          categoryName:
            categoryNames[placement.placement],

          title: post.title || "",

          description:
            content.length > 200
              ? content.slice(0, 200) + "..."
              : content,

          link:
            "board.html?post=" +
            encodeURIComponent(post.id)

        });

      }

    }

    successfulQueries++;

  } catch (error) {

    console.error(
      "관리자 선택 게시물 조회 오류:",
      error
    );

  }

  /* =====================================
     3. 날짜순 정렬
  ===================================== */

  combinedNews.sort((a, b) =>
    b.sortDate.localeCompare(a.sortDate)
  );

  news = combinedNews;

  /* =====================================
     4. 화면 갱신
  ===================================== */

  if (successfulQueries === 0) {

    newsList.textContent =
      "활동 소식을 불러오지 못했습니다. " +
      "잠시 후 다시 시도해 주세요.";

    empty.hidden = true;

    return;

  }

  renderNews();

  console.log(
    "통합 활동 소식 조회 완료:",
    news.length,
    "건"
  );

}
  
let currentCategory = "all";

const newsList = document.getElementById("newsList");
const searchInput = document.getElementById("searchInput");
const empty = document.getElementById("empty");

function renderNews() {

  const keyword = searchInput.value.trim().toLowerCase();

  const filtered = news.filter(item => {

    const categoryMatch =
      currentCategory === "all" ||
      item.category === currentCategory;

    const searchText = [
      item.title,
      item.description,
      item.categoryName,
      item.date
    ].join(" ").toLowerCase();

    return categoryMatch && searchText.includes(keyword);
  });

  filtered.sort((a, b) =>
  (b.sortDate || b.date || "")
    .localeCompare(
      a.sortDate || a.date || ""
    )
);
  
  newsList.innerHTML = "";

  filtered.forEach(item => {

    const card = document.createElement("article");
    card.className = "news-item";

    const category = document.createElement("span");
    category.className = "category";
    category.textContent = item.categoryName;

    const date = document.createElement("p");
    date.className = "date";
    date.textContent = item.date;

    const title = document.createElement("h3");
    title.textContent = item.title;

    const description = document.createElement("p");
    description.textContent = item.description;

    card.appendChild(category);
    card.appendChild(date);
    card.appendChild(title);
    card.appendChild(description);

    if (item.link) {

      const link = document.createElement("a");
      link.className = "news-link";
      link.href = item.link;
      if (
  item.link.startsWith("board.html?")
) {

  /* 게시판 게시물은 현재 창에서 열기 */

  link.target = "_self";

} else {

  /* 기존 외부 링크는 새 창에서 열기 */

  link.target = "_blank";
  link.rel = "noopener noreferrer";

}
      
      link.textContent = "자세히 보기";

      card.appendChild(link);
    }

    newsList.appendChild(card);
  });

  empty.hidden = filtered.length !== 0;
}

document.querySelectorAll("[data-category]").forEach(button => {

  button.addEventListener("click", () => {

    currentCategory = button.dataset.category;

    document.querySelectorAll("[data-category]")
      .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderNews();
  });
});

/* =====================================
   활동 소식 검색 및 초기 조회
===================================== */

searchInput.addEventListener(
  "input",
  renderNews
);

/* Supabase 데이터 불러오기 */

loadNews();
  
</script>

</body>
</html>
