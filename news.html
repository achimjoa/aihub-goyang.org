e) {\n\n  if (!value) return \"\";\n\n  const date = new Date(value);\n\n  if (Number.isNaN(date.getTime())) {\n    return String(value).slice(0, 10);\n  }\n\n  return [\n    date.getFullYear(),\n    String(date.getMonth() + 1).padStart(2, \"0\"),\n    String(date.getDate()).padStart(2, \"0\")\n  ].join(\".\");\n\n}\n\n/* DETECCIÓN DE COREANO */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* VALIDACIÓN DE ENLACES */\n\nfunction getSafeLink(value) {\n\n  if (!value) return \"\";\n\n  try {\n\n    const url = new URL(\n      value,\n      window.location.href\n    );\n\n    if (\n      url.protocol !== \"https:\" &&\n      url.protocol !== \"http:\"\n    ) {\n      return \"\";\n    }\n\n    return url.href;\n\n  } catch (error) {\n    return \"\";\n  }\n\n}\n\n/* CARGAR NOTICIAS */\n\nasync function loadNews() {\n\n  newsList.innerHTML =\n    '<div class=\"status\">' +\n    'Cargando noticias y avisos...' +\n    '</div>';\n\n  empty.hidden = true;\n\n  const combinedNews = [];\n\n  let successfulQueries = 0;\n  let failedQueries = 0;\n\n  /* 1. PUBLICACIONES DE NOTICIAS */\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id,title,category,description,link,published_at\"\n        )\n        .order(\"published_at\", {\n          ascending: false\n        });\n\n    if (error) throw error;\n\n    successfulQueries++;\n\n    for (const item of data || []) {\n\n      combinedNews.push({\n\n        id: \"news-\" + item.id,\n\n        date: formatDate(\n          item.published_at\n        ),\n\n        sortDate:\n          item.published_at || \"\",\n\n        category:\n          item.category || \"\",\n\n        categoryName:\n          categoryNames[item.category] ||\n          \"Otros\",\n\n        title:\n          item.title || \"\",\n\n        description:\n          item.description || \"\",\n\n        link:\n          item.link || \"\"\n\n      });\n\n    }\n\n  } catch (error) {\n\n    failedQueries++;\n\n    console.error(\n      \"Error al consultar noticias:\",\n      error\n    );\n\n  }\n\n  /* 2. PUBLICACIONES DEL TABLÓN */\n\n  try {\n\n    const {\n      data: placements,\n      error\n    } =\n      await supabase\n        .from(\"board_post_placements\")\n        .select(\"post_id,placement\")\n        .in(\"placement\", [\n          \"notice\",\n          \"activity\"\n        ]);\n\n    if (error) throw error;\n\n    if (\n      placements &&\n      placements.length > 0\n    ) {\n\n      const postIds = [\n        ...new Set(\n          placements.map(\n            item => item.post_id\n          )\n        )\n      ];\n\n      const {\n        data: posts,\n        error: postError\n      } =\n        await supabase\n          .from(\"board_posts\")\n          .select(\n            \"id,title,content,created_at\"\n          )\n          .in(\"id\", postIds);\n\n      if (postError) throw postError;\n\n      const postMap = new Map(\n        (posts || []).map(post => [\n          String(post.id),\n          post\n        ])\n      );\n\n      for (const placement of placements) {\n\n        const post = postMap.get(\n          String(placement.post_id)\n        );\n\n        if (!post) continue;\n\n        const content =\n          post.content || \"\";\n\n        combinedNews.push({\n\n          id:\n            \"board-\" +\n            placement.placement +\n            \"-\" +\n            post.id,\n\n          date:\n            formatDate(\n              post.created_at\n            ),\n\n          sortDate:\n            post.created_at || \"\",\n\n          category:\n            placement.placement,\n\n          categoryName:\n            categoryNames[\n              placement.placement\n            ] || \"Otros\",\n\n          title:\n            post.title || \"\",\n\n          description:\n            content.length > 200\n              ? content.slice(0, 200) + \"...\"\n              : content,\n\n          link:\n            \"board.html?post=\" +\n            encodeURIComponent(post.id)\n\n        });\n\n      }\n\n    }\n\n    successfulQueries++;\n\n  } catch (error) {\n\n    failedQueries++;\n\n    console.error(\n      \"Error al consultar el tablón:\",\n      error\n    );\n\n  }\n\n  /* 3. ORDENAR */\n\n  combinedNews.sort((a, b) =>\n    String(b.sortDate)\n      .localeCompare(\n        String(a.sortDate)\n      )\n  );\n\n  news = combinedNews;\n\n  /* 4. CONTROL DE ERRORES */\n\n  if (successfulQueries === 0) {\n\n    loadFailed = true;\n\n    newsList.innerHTML =\n      '<div class=\"status\">' +\n      'No se pueden cargar las noticias ' +\n      'en este momento. ' +\n      'Inténtelo de nuevo más tarde.' +\n      '</div>';\n\n    empty.hidden = true;\n\n    return;\n\n  }\n\n  loadFailed = false;\n  partialFailure = failedQueries > 0;\n\n  renderNews();\n\n  console.log(\n    \"Página de noticias en español:\",\n    news.length,\n    \"publicaciones\"\n  );\n\n}\n\n/* MOSTRAR NOTICIAS */\n\nfunction renderNews() {\n\n  if (loadFailed) return;\n\n  const keyword =\n    searchInput.value\n      .trim()\n      .toLowerCase();\n\n  const filtered = news.filter(item => {\n\n    const categoryMatch =\n      currentCategory === \"all\" ||\n      item.category === currentCategory;\n\n    const searchText = [\n      item.title,\n      item.description,\n      item.categoryName,\n      item.date\n    ].join(\" \").toLowerCase();\n\n    return (\n      categoryMatch &&\n      searchText.includes(keyword)\n    );\n\n  });\n\n  filtered.sort((a, b) =>\n    String(b.sortDate || b.date || \"\")\n      .localeCompare(\n        String(a.sortDate || a.date || \"\")\n      )\n  );\n\n  newsList.innerHTML = \"\";\n\n  /* ADVERTENCIA DE CARGA PARCIAL */\n\n  if (partialFailure) {\n\n    const warning =\n      document.createElement(\"div\");\n\n    warning.className = \"status\";\n\n    warning.textContent =\n      \"Aviso: algunas publicaciones \" +\n      \"no se han podido cargar. \" +\n      \"La lista puede estar incompleta.\";\n\n    newsList.appendChild(warning);\n\n  }\n\n  /* CREAR TARJETAS */\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"news-item\";\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className = \"category\";\n\n    category.textContent =\n      item.categoryName;\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className = \"date\";\n    date.textContent = item.date;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent = item.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description;\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* AVISO DE CONTENIDO COREANO */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"Contenido original en coreano\";\n\n      card.appendChild(languageNotice);\n\n    }\n\n    /* ENLACE AL ARTÍCULO */\n\n    const safeLink =\n      getSafeLink(item.link);\n\n    if (safeLink) {\n\n      const link =\n        document.createElement(\"a\");\n\n      link.className = \"news-link\";\n      link.href = safeLink;\n\n      const url = new URL(safeLink);\n\n      const isBoardLink =\n        url.origin ===\n          window.location.origin &&\n        url.pathname.endsWith(\n          \"/board.html\"\n        );\n\n      if (isBoardLink) {\n\n        link.target = \"_self\";\n\n      } else {\n\n        link.target = \"_blank\";\n\n        link.rel =\n          \"noopener noreferrer\";\n\n      }\n\n      link.textContent =\n        \"Leer más\";\n\n      card.appendChild(link);\n\n    }\n\n    newsList.appendChild(card);\n\n  });\n\n  /* SIN RESULTADOS */\n\n  if (news.length === 0 && !partialFailure) {\n\n    empty.textContent =\n      \"Todavía no hay publicaciones disponibles.\";\n\n  } else {\n\n    empty.textContent =\n      \"No se encontraron publicaciones \" +\n      \"que coincidan con la búsqueda.\";\n\n  }\n\n  empty.hidden =\n    filtered.length !== 0;\n\n}\n\n/* FILTROS */\n\ndocument\n  .querySelectorAll(\"[data-category]\")\n  .forEach(button => {\n\n    button.addEventListener(\n      \"click\",\n      () => {\n\n        currentCategory =\n          button.dataset.category;\n\n        document\n          .querySelectorAll(\n            \"[data-category]\"\n          )\n          .forEach(btn => {\n\n            const isActive =\n              btn.dataset.category ===\n              currentCategory;\n\n            btn.classList.toggle(\n              \"active\",\n              isActive\n            );\n\n            btn.setAttribute(\n              \"aria-pressed\",\n              String(isActive)\n            );\n\n          });\n\n        renderNews();\n\n      }\n    );\n\n  });\n\n/* BÚSQUEDA */\n\nsearchInput.addEventListener(\n  \"input\",\n  renderNews\n);\n\n/* CARGA INICIAL */\n\nloadNews();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=fr": "<!DOCTYPE html>\n<html lang=\"fr\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<title>\nActualités et annonces |\nInitiative du Centre mondial de l'IA\n</title>\n\n<meta name=\"description\"\ncontent=\"Actualités, annonces, activités, événements et informations sur les politiques publiques du Comité citoyen de promotion pour l'implantation du Centre mondial de l'IA à Goyang, République de Corée.\">\n\n<style>\n\n/* =====================================\n   CONFIGURATION GÉNÉRALE\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   EN-TÊTE\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 17px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  padding: 10px 20px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   CONTENU PRINCIPAL\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n/* =====================================\n   RECHERCHE\n===================================== */\n\n.search-box {\n  margin-bottom: 25px;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 16px;\n  border: 1px solid #c5d5e8;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* =====================================\n   FILTRES\n===================================== */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  border: 1px solid #0754a6;\n  background: white;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   CARTES D'ACTUALITÉS\n===================================== */\n\n.news-list {\n  display: grid;\n  gap: 18px;\n}\n\n.news-item {\n  background: white;\n  border-radius: 12px;\n  padding: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n  border-left: 5px solid #168de0;\n}\n\n.news-item h3 {\n  color: #0754a6;\n  margin: 10px 0;\n  font-size: 21px;\n  overflow-wrap: anywhere;\n}\n\n.category {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 4px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.date {\n  color: #68788c;\n  font-size: 14px;\n}\n\n.news-item p {\n  color: #46566d;\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.content-language {\n  display: inline-block;\n  color: #68788c;\n  font-size: 13px;\n  margin-top: 8px;\n}\n\n.news-link {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 10px 17px;\n  border-radius: 6px;\n  text-decoration: none;\n  font-weight: bold;\n  margin-top: 12px;\n}\n\n.news-link:hover {\n  background: #003a7a;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  color: #68788c;\n}\n\n.status {\n  background: white;\n  padding: 25px;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   PIED DE PAGE\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   VERSION MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .intro,\n  .news-item {\n    padding: 20px;\n  }\n\n  .news-link {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     EN-TÊTE\n===================================== -->\n\n<header>\n\n<h1>\nActualités et annonces\n</h1>\n\n<p>\nInitiative du Centre mondial de l'IA<br>\nVille spéciale de Goyang, République de Corée\n</p>\n\n<p>\nInformations sur les activités citoyennes,\nla coopération internationale,\nles propositions de politiques publiques\net les principales évolutions du projet.\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=fr\"\nclass=\"home-link\">\n← Accueil — Français\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     INTRODUCTION\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nDernières actualités du Comité citoyen de promotion\n</h2>\n\n<p>\nCette page présente les activités\ndu Comité citoyen de promotion\npour l'implantation du Centre mondial de l'IA\ndans la ville spéciale de Goyang.\n</p>\n\n<p>\nLes informations publiées\npeuvent comprendre\nles activités du Comité,\nles annonces publiques,\nles événements,\nla couverture médiatique\net les évolutions\ndes politiques publiques.\n</p>\n\n<p>\nDe nouvelles informations\nseront ajoutées\nau fur et à mesure\nde leur disponibilité.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     INFORMATIONS LINGUISTIQUES\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nInformations linguistiques\n</strong>\n\n<p>\nCette page en français\naffiche les actualités et les annonces\nprovenant de la base de données\nexistante du Comité.\n</p>\n\n<p>\nCertains articles\nsont disponibles uniquement en coréen.\nLes titres et descriptions\nrédigés en coréen\nsont affichés dans leur langue originale,\nsans traduction automatique.\n</p>\n\n<p>\nLorsque cela est possible,\nvous pouvez consulter\nl'article original\nou la source correspondante\nen cliquant sur le lien fourni.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     RECHERCHE\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\ntype=\"search\"\nid=\"searchInput\"\nplaceholder=\"Rechercher des actualités ou des mots-clés\"\naria-label=\"Rechercher dans les actualités et les annonces\">\n\n</div>\n\n\u003c!-- =====================================\n     FILTRES\n===================================== -->\n\n<nav class=\"filters\"\naria-label=\"Filtrer les actualités par catégorie\">\n\n<button\ntype=\"button\"\nclass=\"active\"\ndata-category=\"all\"\naria-pressed=\"true\">\nToutes les actualités\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"notice\"\naria-pressed=\"false\">\nAnnonces\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"activity\"\naria-pressed=\"false\">\nActivités du Comité\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"event\"\naria-pressed=\"false\">\nÉvénements\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"press\"\naria-pressed=\"false\">\nRevue de presse\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"policy\"\naria-pressed=\"false\">\nActualités des politiques publiques\n</button>\n\n</nav>\n\n\u003c!-- =====================================\n     LISTE DES ACTUALITÉS\n===================================== -->\n\n<div\nclass=\"news-list\"\nid=\"newsList\"\naria-live=\"polite\">\n</div>\n\n<p\nclass=\"empty\"\nid=\"empty\"\nhidden>\nAucune actualité ne correspond\nà votre recherche.\n</p>\n\n</main>\n\n\u003c!-- =====================================\n     PIED DE PAGE\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nComité citoyen de promotion<br>\npour l'implantation du Centre mondial de l'IA<br>\ndans la ville spéciale de Goyang\n</strong>\n</p>\n\n<p>\nProvince de Gyeonggi,\nRépublique de Corée\n</p>\n\n<p>\nAvec les citoyens,<br>\navec la province de Gyeonggi<br>\net avec le monde.\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\">\nAccueil — Français\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     MODULE SUPABASE\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   CONNEXION SUPABASE\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   ÉLÉMENTS DOM\n===================================== */\n\nconst newsList =\n  document.getElementById(\"newsList\");\n\nconst searchInput =\n  document.getElementById(\"searchInput\");\n\nconst empty =\n  document.getElementById(\"empty\");\n\n/* =====================================\n   NOMS DES CATÉGORIES\n===================================== */\n\nconst categoryNames = {\n\n  notice: \"Annonces\",\n\n  activity: \"Activités du Comité\",\n\n  event: \"Événements\",\n\n  press: \"Revue de presse\",\n\n  policy: \"Actualités des politiques publiques\"\n\n};\n\n/* =====================================\n   ÉTAT\n===================================== */\n\nlet news = [];\n\nlet currentCategory = \"all\";\n\nlet loadFailed = false;\n\n/* =====================================\n   FORMATAGE DES DATES\n===================================== */\n\nfunction formatDate(value) {\n\n  if (!value) return \"\";\n\n  const date = new Date(value);\n\n  if (Number.isNaN(date.getTime())) {\n    return String(value).slice(0, 10);\n  }\n\n  return new Intl.DateTimeFormat(\n    \"fr-FR\",\n    {\n      year: \"numeric\",\n      month: \"2-digit\",\n      day: \"2-digit\",\n      timeZone: \"Asia/Seoul\"\n    }\n  ).format(date);\n\n}\n\n/* =====================================\n   DÉTECTION DU CORÉEN\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   VALIDATION DES LIENS\n===================================== */\n\nfunction getSafeLink(value) {\n\n  if (!value) return \"\";\n\n  try {\n\n    const url = new URL(\n      value,\n      window.location.href\n    );\n\n    if (\n      url.protocol !== \"https:\" &&\n      url.protocol !== \"http:\"\n    ) {\n      return \"\";\n    }\n\n    return url.href;\n\n  } catch (error) {\n\n    return \"\";\n\n  }\n\n}\n\n/* =====================================\n   CHARGEMENT DES ACTUALITÉS\n===================================== */\n\nasync function loadNews() {\n\n  newsList.innerHTML =\n    '<div class=\"status\">' +\n    'Chargement des actualités et des annonces...' +\n    '</div>';\n\n  empty.hidden = true;\n\n  const combinedNews = [];\n\n  let successfulQueries = 0;\n\n  /* =====================================\n     1. PUBLICATIONS D'ACTUALITÉS\n  ===================================== */\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id,title,category,description,link,published_at\"\n        )\n        .order(\"published_at\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    successfulQueries++;\n\n    for (const item of data || []) {\n\n      combinedNews.push({\n\n        id: \"news-\" + item.id,\n\n        date: formatDate(\n          item.published_at\n        ),\n\n        sortDate:\n          item.published_at || \"\",\n\n        category:\n          item.category || \"\",\n\n        categoryName:\n          categoryNames[item.category] ||\n          \"Autres\",\n\n        title:\n          item.title || \"\",\n\n        description:\n          item.description || \"\",\n\n        link:\n          item.link || \"\"\n\n      });\n\n    }\n\n  } catch (error) {\n\n    console.error(\n      \"Échec du chargement des actualités :\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     2. PUBLICATIONS DU FORUM\n  ===================================== */\n\n  try {\n\n    const {\n      data: placements,\n      error\n    } =\n      await supabase\n        .from(\"board_post_placements\")\n        .select(\"post_id,placement\")\n        .in(\"placement\", [\n          \"notice\",\n          \"activity\"\n        ]);\n\n    if (error) {\n      throw error;\n    }\n\n    if (\n      placements &&\n      placements.length > 0\n    ) {\n\n      const postIds = [\n        ...new Set(\n          placements.map(\n            item => item.post_id\n          )\n        )\n      ];\n\n      const {\n        data: posts,\n        error: postError\n      } =\n        await supabase\n          .from(\"board_posts\")\n          .select(\n            \"id,title,content,created_at\"\n          )\n          .in(\"id\", postIds);\n\n      if (postError) {\n        throw postError;\n      }\n\n      const postMap = new Map(\n        (posts || []).map(post => [\n          String(post.id),\n          post\n        ])\n      );\n\n      for (const placement of placements) {\n\n        const post = postMap.get(\n          String(placement.post_id)\n        );\n\n        if (!post) continue;\n\n        const content =\n          post.content || \"\";\n\n        combinedNews.push({\n\n          id:\n            \"board-\" +\n            placement.placement +\n            \"-\" +\n            post.id,\n\n          date:\n            formatDate(\n              post.created_at\n            ),\n\n          sortDate:\n            post.created_at || \"\",\n\n          category:\n            placement.placement,\n\n          categoryName:\n            categoryNames[\n              placement.placement\n            ] || \"Autres\",\n\n          title:\n            post.title || \"\",\n\n          description:\n            content.length > 200\n              ? content.slice(0, 200) + \"...\"\n              : content,\n\n          link:\n            \"board.html?post=\" +\n            encodeURIComponent(post.id)\n\n        });\n\n      }\n\n    }\n\n    successfulQueries++;\n\n  } catch (error) {\n\n    console.error(\n      \"Échec du chargement des publications du forum :\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     3. TRI DES ACTUALITÉS\n  ===================================== */\n\n  combinedNews.sort((a, b) =>\n    String(b.sortDate)\n      .localeCompare(\n        String(a.sortDate)\n      )\n  );\n\n  news = combinedNews;\n\n  /* =====================================\n     4. GESTION DES ERREURS\n  ===================================== */\n\n  if (successfulQueries === 0) {\n\n    loadFailed = true;\n\n    newsList.innerHTML =\n      '<div class=\"status\">' +\n      'Impossible de charger les actualités ' +\n      'pour le moment. ' +\n      'Veuillez réessayer plus tard.' +\n      '</div>';\n\n    empty.hidden = true;\n\n    return;\n\n  }\n\n  loadFailed = false;\n\n  renderNews();\n\n  console.log(\n    \"Page française des actualités chargée :\",\n    news.length,\n    \"publications\"\n  );\n\n}\n\n/* =====================================\n   AFFICHAGE DES ACTUALITÉS\n===================================== */\n\nfunction renderNews() {\n\n  if (loadFailed) return;\n\n  const keyword =\n    searchInput.value\n      .trim()\n      .toLowerCase();\n\n  const filtered = news.filter(item => {\n\n    const categoryMatch =\n      currentCategory === \"all\" ||\n      item.category === currentCategory;\n\n    const searchText = [\n      item.title,\n      item.description,\n      item.categoryName,\n      item.date\n    ].join(\" \").toLowerCase();\n\n    return (\n      categoryMatch &&\n      searchText.includes(keyword)\n    );\n\n  });\n\n  filtered.sort((a, b) =>\n    String(b.sortDate || b.date || \"\")\n      .localeCompare(\n        String(a.sortDate || a.date || \"\")\n      )\n  );\n\n  newsList.innerHTML = \"\";\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"news-item\";\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className = \"category\";\n\n    category.textContent =\n      item.categoryName;\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className = \"date\";\n\n    date.textContent =\n      item.date;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description;\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* =====================================\n       AVIS SUR LA LANGUE DU CONTENU\n    ===================================== */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"Contenu original en coréen\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* =====================================\n       LIEN VERS L'ARTICLE\n    ===================================== */\n\n    const safeLink =\n      getSafeLink(item.link);\n\n    if (safeLink) {\n\n      const link =\n        document.createElement(\"a\");\n\n      link.className =\n        \"news-link\";\n\n      link.href =\n        safeLink;\n\n      const url =\n        new URL(safeLink);\n\n      const isBoardLink =\n        url.origin ===\n          window.location.origin &&\n        url.pathname.endsWith(\n          \"/board.html\"\n        );\n\n      if (isBoardLink) {\n\n        link.target = \"_self\";\n\n      } else {\n\n        link.target = \"_blank\";\n\n        link.rel =\n          \"noopener noreferrer\";\n\n      }\n\n      link.textContent =\n        \"Lire la suite\";\n\n      card.appendChild(link);\n\n    }\n\n    newsList.appendChild(card);\n\n  });\n\n  empty.hidden =\n    filtered.length !== 0;\n\n}\n\n/* =====================================\n   FILTRES PAR CATÉGORIE\n===================================== */\n\ndocument\n  .querySelectorAll(\"[data-category]\")\n  .forEach(button => {\n\n    button.addEventListener(\n      \"click\",\n      () => {\n\n        currentCategory =\n          button.dataset.category;\n\n        document\n          .querySelectorAll(\n            \"[data-category]\"\n          )\n          .forEach(btn => {\n\n            const isActive =\n              btn.dataset.category ===\n              currentCategory;\n\n            btn.classList.toggle(\n              \"active\",\n              isActive\n            );\n\n            btn.setAttribute(\n              \"aria-pressed\",\n              String(isActive)\n            );\n\n          });\n\n        renderNews();\n\n      }\n    );\n\n  });\n\n/* =====================================\n   RECHERCHE\n===================================== */\n\nsearchInput.addEventListener(\n  \"input\",\n  renderNews\n);\n\n/* =====================================\n   CHARGEMENT INITIAL\n===================================== */\n\nloadNews();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=it": "<!DOCTYPE html>\n<html lang=\"it\">\n\n<head>\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<title>\nNotizie e comunicazioni |\nIniziativa per un Polo Globale dell'IA\n</title>\n\n<meta name=\"description\"\ncontent=\"Notizie, comunicazioni, attività, eventi e aggiornamenti sulle politiche del Comitato Civico Promotore per l'insediamento del Polo Globale dell'IA nella Città Speciale di Goyang, Repubblica di Corea.\">\n\n<style>\n\n/* =====================================\n   IMPOSTAZIONI GENERALI\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   INTESTAZIONE\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 17px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  padding: 10px 20px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* =====================================\n   CONTENUTO PRINCIPALE\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n/* =====================================\n   RICERCA\n===================================== */\n\n.search-box {\n  margin-bottom: 25px;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 16px;\n  border: 1px solid #c5d5e8;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* =====================================\n   FILTRI PER CATEGORIA\n===================================== */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  border: 1px solid #0754a6;\n  background: white;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   SCHEDE DELLE NOTIZIE\n===================================== */\n\n.news-list {\n  display: grid;\n  gap: 18px;\n}\n\n.news-item {\n  background: white;\n  border-radius: 12px;\n  padding: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n  border-left: 5px solid #168de0;\n}\n\n.news-item h3 {\n  color: #0754a6;\n  margin: 10px 0;\n  font-size: 21px;\n  overflow-wrap: anywhere;\n}\n\n.category {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 4px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.date {\n  color: #68788c;\n  font-size: 14px;\n}\n\n.news-item p {\n  color: #46566d;\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.content-language {\n  display: inline-block;\n  color: #68788c;\n  font-size: 13px;\n  margin-top: 8px;\n}\n\n.news-link {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 10px 17px;\n  border-radius: 6px;\n  text-decoration: none;\n  font-weight: bold;\n  margin-top: 12px;\n}\n\n.news-link:hover {\n  background: #003a7a;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  color: #68788c;\n}\n\n.status {\n  background: white;\n  padding: 25px;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   PIÈ DI PAGINA\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   VERSIONE MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .intro,\n  .news-item {\n    padding: 20px;\n  }\n\n  .news-link {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     INTESTAZIONE\n===================================== -->\n\n<header>\n\n<h1>\nNotizie e comunicazioni\n</h1>\n\n<p>\nIniziativa per un Polo Globale dell'IA<br>\nCittà Speciale di Goyang, Repubblica di Corea\n</p>\n\n<p>\nAggiornamenti sulle attività civiche,\nsulla cooperazione internazionale,\nsulle proposte politiche\ne sui principali sviluppi.\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=it\"\nclass=\"home-link\">\n← Homepage italiana\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     INTRODUZIONE\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nUltime notizie dal Comitato Civico Promotore\n</h2>\n\n<p>\nQuesta pagina fornisce informazioni\nsulle attività del Comitato Civico Promotore\nper l'insediamento del Polo Globale dell'IA\nnella Città Speciale di Goyang.\n</p>\n\n<p>\nGli aggiornamenti possono comprendere\nattività del Comitato,\ncomunicazioni pubbliche,\neventi,\nrassegne stampa\ne sviluppi delle politiche.\n</p>\n\n<p>\nNuove informazioni saranno aggiunte\nnon appena disponibili.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     INFORMAZIONI SULLA LINGUA\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nInformazioni sulla lingua\n</strong>\n\n<p>\nQuesta pagina in lingua italiana\nmostra notizie e comunicazioni\nprovenienti dal database\ndelle pubblicazioni esistenti\ndel Comitato.\n</p>\n\n<p>\nAlcuni articoli sono disponibili\nsoltanto in lingua coreana.\nI titoli e le descrizioni originali\nin coreano vengono visualizzati\nsenza traduzione automatica.\n</p>\n\n<p>\nQuando disponibile,\nè possibile aprire l'articolo originale\no la relativa fonte\nattraverso il collegamento fornito.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     RICERCA\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\ntype=\"search\"\nid=\"searchInput\"\nplaceholder=\"Cerca notizie, titoli o parole chiave\"\naria-label=\"Cerca notizie e comunicazioni\">\n\n</div>\n\n\u003c!-- =====================================\n     FILTRI\n===================================== -->\n\n<nav class=\"filters\"\naria-label=\"Filtra le notizie per categoria\">\n\n<button\ntype=\"button\"\nclass=\"active\"\ndata-category=\"all\"\naria-pressed=\"true\">\nTutte le notizie\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"notice\"\naria-pressed=\"false\">\nComunicazioni\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"activity\"\naria-pressed=\"false\">\nAttività del Comitato\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"event\"\naria-pressed=\"false\">\nEventi\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"press\"\naria-pressed=\"false\">\nRassegna stampa\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"policy\"\naria-pressed=\"false\">\nAggiornamenti sulle politiche\n</button>\n\n</nav>\n\n\u003c!-- =====================================\n     ELENCO DELLE NOTIZIE\n===================================== -->\n\n<div\nclass=\"news-list\"\nid=\"newsList\"\naria-live=\"polite\">\n</div>\n\n<p\nclass=\"empty\"\nid=\"empty\"\nhidden>\nNessuna notizia corrisponde alla ricerca.\n</p>\n\n</main>\n\n\u003c!-- =====================================\n     PIÈ DI PAGINA\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nComitato Civico Promotore<br>\nper l'insediamento del Polo Globale dell'IA<br>\nnella Città Speciale di Goyang\n</strong>\n</p>\n\n<p>\nProvincia di Gyeonggi,\nRepubblica di Corea\n</p>\n\n<p>\nCon i cittadini,<br>\ncon la Provincia di Gyeonggi<br>\ne con il mondo.\n</p>\n\n<p>\n<a href=\"index.html?lang=it\">\nHomepage italiana\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     MODULO NOTIZIE SUPABASE\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   CONNESSIONE SUPABASE\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   ELEMENTI DOM\n===================================== */\n\nconst newsList =\n  document.getElementById(\"newsList\");\n\nconst searchInput =\n  document.getElementById(\"searchInput\");\n\nconst empty =\n  document.getElementById(\"empty\");\n\n/* =====================================\n   NOMI DELLE CATEGORIE\n===================================== */\n\nconst categoryNames = {\n\n  notice: \"Comunicazioni\",\n\n  activity: \"Attività del Comitato\",\n\n  event: \"Eventi\",\n\n  press: \"Rassegna stampa\",\n\n  policy: \"Aggiornamenti sulle politiche\"\n\n};\n\n/* =====================================\n   STATO\n===================================== */\n\nlet news = [];\n\nlet currentCategory = \"all\";\n\nlet loadFailed = false;\n\n/* =====================================\n   FORMATTAZIONE DELLA DATA\n===================================== */\n\nfunction formatDate(value) {\n\n  if (!value) return \"\";\n\n  const date = new Date(value);\n\n  if (Number.isNaN(date.getTime())) {\n    return String(value).slice(0, 10);\n  }\n\n  return [\n    date.getFullYear(),\n    String(date.getMonth() + 1).padStart(2, \"0\"),\n    String(date.getDate()).padStart(2, \"0\")\n  ].join(\".\");\n\n}\n\n/* =====================================\n   RILEVAMENTO DEL TESTO COREANO\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   VALIDAZIONE DEI COLLEGAMENTI\n===================================== */\n\nfunction getSafeLink(value) {\n\n  if (!value) return \"\";\n\n  try {\n\n    const url = new URL(\n      value,\n      window.location.href\n    );\n\n    if (\n      url.protocol !== \"https:\" &&\n      url.protocol !== \"http:\"\n    ) {\n      return \"\";\n    }\n\n    return url.href;\n\n  } catch (error) {\n\n    return \"\";\n\n  }\n\n}\n\n/* =====================================\n   CARICAMENTO DELLE NOTIZIE\n===================================== */\n\nasync function loadNews() {\n\n  newsList.innerHTML =\n    '<div class=\"status\">' +\n    'Caricamento delle notizie e delle comunicazioni...' +\n    '</div>';\n\n  empty.hidden = true;\n\n  const combinedNews = [];\n\n  let successfulQueries = 0;\n\n  /* =====================================\n     1. NEWS POSTS\n  ===================================== */\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id,title,category,description,link,published_at\"\n        )\n        .order(\"published_at\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    successfulQueries++;\n\n    for (const item of data || []) {\n\n      combinedNews.push({\n\n        id: \"news-\" + item.id,\n\n        date: formatDate(\n          item.published_at\n        ),\n\n        sortDate:\n          item.published_at || \"\",\n\n        category:\n          item.category || \"\",\n\n        categoryName:\n          categoryNames[item.category] ||\n          \"Altro\",\n\n        title:\n          item.title || \"\",\n\n        description:\n          item.description || \"\",\n\n        link:\n          item.link || \"\"\n\n      });\n\n    }\n\n  } catch (error) {\n\n    console.error(\n      \"Errore nel caricamento delle notizie:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     2. POST SELEZIONATI DEL FORUM\n  ===================================== */\n\n  try {\n\n    const {\n      data: placements,\n      error\n    } =\n      await supabase\n        .from(\"board_post_placements\")\n        .select(\"post_id,placement\")\n        .in(\"placement\", [\n          \"notice\",\n          \"activity\"\n        ]);\n\n    if (error) {\n      throw error;\n    }\n\n    if (\n      placements &&\n      placements.length > 0\n    ) {\n\n      const postIds = [\n        ...new Set(\n          placements.map(\n            item => item.post_id\n          )\n        )\n      ];\n\n      const {\n        data: posts,\n        error: postError\n      } =\n        await supabase\n          .from(\"board_posts\")\n          .select(\n            \"id,title,content,created_at\"\n          )\n          .in(\"id\", postIds);\n\n      if (postError) {\n        throw postError;\n      }\n\n      const postMap = new Map(\n        (posts || []).map(post => [\n          String(post.id),\n          post\n        ])\n      );\n\n      for (const placement of placements) {\n\n        const post = postMap.get(\n          String(placement.post_id)\n        );\n\n        if (!post) continue;\n\n        const content =\n          post.content || \"\";\n\n        combinedNews.push({\n\n          id:\n            \"board-\" +\n            placement.placement +\n            \"-\" +\n            post.id,\n\n          date:\n            formatDate(\n              post.created_at\n            ),\n\n          sortDate:\n            post.created_at || \"\",\n\n          category:\n            placement.placement,\n\n          categoryName:\n            categoryNames[\n              placement.placement\n            ] || \"Altro\",\n\n          title:\n            post.title || \"\",\n\n          description:\n            content.length > 200\n              ? content.slice(0, 200) + \"...\"\n              : content,\n\n          link:\n            \"board.html?post=\" +\n            encodeURIComponent(post.id)\n\n        });\n\n      }\n\n    }\n\n    successfulQueries++;\n\n  } catch (error) {\n\n    console.error(\n      \"Errore nel caricamento dei post selezionati:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     3. ORDINAMENTO DELLE NOTIZIE\n  ===================================== */\n\n  combinedNews.sort((a, b) =>\n    String(b.sortDate)\n      .localeCompare(\n        String(a.sortDate)\n      )\n  );\n\n  news = combinedNews;\n\n  /* =====================================\n     4. GESTIONE DEGLI ERRORI\n  ===================================== */\n\n  if (successfulQueries === 0) {\n\n    loadFailed = true;\n\n    newsList.innerHTML =\n      '<div class=\"status\">' +\n      'Impossibile caricare le notizie in questo momento. ' +\n      'Riprova più tardi.' +\n      '</div>';\n\n    empty.hidden = true;\n\n    return;\n\n  }\n\n  loadFailed = false;\n\n  renderNews();\n\n  console.log(\n    \"Pagina delle notizie in italiano caricata:\",\n    news.length,\n    \"elementi\"\n  );\n\n}\n\n/* =====================================\n   VISUALIZZAZIONE DELLE NOTIZIE\n===================================== */\n\nfunction renderNews() {\n\n  if (loadFailed) return;\n\n  const keyword =\n    searchInput.value\n      .trim()\n      .toLowerCase();\n\n  const filtered = news.filter(item => {\n\n    const categoryMatch =\n      currentCategory === \"all\" ||\n      item.category === currentCategory;\n\n    const searchText = [\n      item.title,\n      item.description,\n      item.categoryName,\n      item.date\n    ].join(\" \").toLowerCase();\n\n    return (\n      categoryMatch &&\n      searchText.includes(keyword)\n    );\n\n  });\n\n  filtered.sort((a, b) =>\n    String(b.sortDate || b.date || \"\")\n      .localeCompare(\n        String(a.sortDate || a.date || \"\")\n      )\n  );\n\n  newsList.innerHTML = \"\";\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"news-item\";\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className = \"category\";\n\n    category.textContent =\n      item.categoryName;\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className = \"date\";\n\n    date.textContent =\n      item.date;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description;\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* =====================================\n       AVVISO SULLA LINGUA ORIGINALE\n    ===================================== */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"Contenuto originale in coreano\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* =====================================\n       COLLEGAMENTO ALL'ARTICOLO\n    ===================================== */\n\n    const safeLink =\n      getSafeLink(item.link);\n\n    if (safeLink) {\n\n      const link =\n        document.createElement(\"a\");\n\n      link.className =\n        \"news-link\";\n\n      link.href =\n        safeLink;\n\n      const url =\n        new URL(safeLink);\n\n      const isBoardLink =\n        url.origin ===\n          window.location.origin &&\n        url.pathname.endsWith(\n          \"/board.html\"\n        );\n\n      if (isBoardLink) {\n\n        link.target = \"_self\";\n\n      } else {\n\n        link.target = \"_blank\";\n\n        link.rel =\n          \"noopener noreferrer\";\n\n      }\n\n      link.textContent =\n        \"Leggi di più\";\n\n      card.appendChild(link);\n\n    }\n\n    newsList.appendChild(card);\n\n  });\n\n  empty.hidden =\n    filtered.length !== 0;\n\n}\n\n/* =====================================\n   FILTRI PER CATEGORIA\n===================================== */\n\ndocument\n  .querySelectorAll(\"[data-category]\")\n  .forEach(button => {\n\n    button.addEventListener(\n      \"click\",\n      () => {\n\n        currentCategory =\n          button.dataset.category;\n\n        document\n          .querySelectorAll(\n            \"[data-category]\"\n          )\n          .forEach(btn => {\n\n            const isActive =\n              btn.dataset.category ===\n              currentCategory;\n\n            btn.classList.toggle(\n              \"active\",\n              isActive\n            );\n\n            btn.setAttribute(\n              \"aria-pressed\",\n              String(isActive)\n            );\n\n          });\n\n        renderNews();\n\n      }\n    );\n\n  });\n\n/* =====================================\n   RICERCA\n===================================== */\n\nsearchInput.addEventListener(\n  \"input\",\n  renderNews\n);\n\n/* =====================================\n   CARICAMENTO INIZIALE\n===================================== */\n\nloadNews();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=ja": "<!DOCTYPE html>\n<html lang=\"ja\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nニュース・お知らせ |\nグローバルAIハブ構想\n</title>\n\n<meta\n  name=\"description\"\n  content=\"高陽特例市グローバルAIハブ誘致市民推進委員会のニュース、お知らせ、活動、イベント、政策動向をご案内します。\"\n>\n\n<style>\n\n/* =====================================\n   基本設定\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n\n  font-family:\n    \"Noto Sans JP\",\n    \"Hiragino Kaku Gothic ProN\",\n    \"Yu Gothic\",\n    Meiryo,\n    Arial,\n    sans-serif;\n\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ヘッダー\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 17px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  padding: 10px 20px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* =====================================\n   メインコンテンツ\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n/* =====================================\n   検索\n===================================== */\n\n.search-box {\n  margin-bottom: 25px;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 16px;\n  border: 1px solid #c5d5e8;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* =====================================\n   カテゴリーフィルター\n===================================== */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  border: 1px solid #0754a6;\n  background: white;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   ニュースカード\n===================================== */\n\n.news-list {\n  display: grid;\n  gap: 18px;\n}\n\n.news-item {\n  background: white;\n  border-radius: 12px;\n  padding: 25px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.06);\n  border-left: 5px solid #168de0;\n}\n\n.news-item h3 {\n  color: #0754a6;\n  margin: 10px 0;\n  font-size: 21px;\n  overflow-wrap: anywhere;\n}\n\n.category {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 4px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.date {\n  color: #68788c;\n  font-size: 14px;\n}\n\n.news-item p {\n  color: #46566d;\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.content-language {\n  display: inline-block;\n  color: #68788c;\n  font-size: 13px;\n  margin-top: 8px;\n}\n\n.news-link {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 10px 17px;\n  border-radius: 6px;\n  text-decoration: none;\n  font-weight: bold;\n  margin-top: 12px;\n}\n\n.news-link:hover {\n  background: #003a7a;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  color: #68788c;\n}\n\n.status {\n  background: white;\n  padding: 25px;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   フッター\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   モバイル対応\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .intro,\n  .news-item {\n    padding: 20px;\n  }\n\n  .news-link {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ヘッダー\n===================================== -->\n\n<header>\n\n<h1>\nニュース・お知らせ\n</h1>\n\n<p>\nグローバルAIハブ構想<br>\n大韓民国・京畿道 高陽特例市\n</p>\n\n<p>\n市民活動、\n国際協力、\n政策提案、\n主な進展に関する最新情報\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ja\"\n  class=\"home-link\"\n>\n  ← 日本語ホーム\n</a>\n\n<a\n  href=\"news.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n>\n  한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     はじめに\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\n市民推進委員会の最新ニュース\n</h2>\n\n<p>\nこのページでは、\n高陽特例市グローバルAIハブ誘致\n市民推進委員会の活動に関する\n情報をお届けします。\n</p>\n\n<p>\n委員会の活動、\nお知らせ、\nイベント、\nメディア報道、\n政策動向などを掲載します。\n</p>\n\n<p>\n新しい情報は、\n公開され次第、\n順次追加されます。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     言語に関するご案内\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\n掲載記事の言語について\n</strong>\n\n<p>\nこの日本語ページでは、\n市民推進委員会の既存の\nニュース・お知らせデータベースに\n登録された記事を表示しています。\n</p>\n\n<p>\n一部の記事は韓国語のみで\n提供されています。\n</p>\n\n<p>\n韓国語の記事タイトルと本文は、\n自動翻訳せず、\n原文のまま表示します。\n</p>\n\n<p>\n記事の原文や関連資料は、\nリンクがある場合、\nそのリンクからご覧いただけます。\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     検索\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\n  type=\"search\"\n  id=\"searchInput\"\n  placeholder=\"ニュースのタイトルやキーワードを検索\"\n  aria-label=\"ニュース・お知らせを検索\"\n>\n\n</div>\n\n\u003c!-- =====================================\n     カテゴリーフィルター\n===================================== -->\n\n<nav\n  class=\"filters\"\n  aria-label=\"ニュースのカテゴリーを選択\"\n>\n\n<button\n  type=\"button\"\n  class=\"active\"\n  data-category=\"all\"\n  aria-pressed=\"true\"\n>\n  すべて\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"notice\"\n  aria-pressed=\"false\"\n>\n  お知らせ\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"activity\"\n  aria-pressed=\"false\"\n>\n  委員会活動\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"event\"\n  aria-pressed=\"false\"\n>\n  イベント\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"press\"\n  aria-pressed=\"false\"\n>\n  メディア報道\n</button>\n\n<button\n  type=\"button\"\n  data-category=\"policy\"\n  aria-pressed=\"false\"\n>\n  政策動向\n</button>\n\n</nav>\n\n\u003c!-- =====================================\n     ニュース一覧\n===================================== -->\n\n<div\n  class=\"news-list\"\n  id=\"newsList\"\n  aria-live=\"polite\"\n>\n</div>\n\n<p\n  class=\"empty\"\n  id=\"empty\"\n  hidden\n>\n  検索条件に一致する記事はありません。\n</p>\n\n</main>\n\n\u003c!-- =====================================\n     フッター\n===================================== -->\n\n<footer>\n\n<p>\n\n<strong>\n高陽特例市グローバルAIハブ誘致<br>\n市民推進委員会\n</strong>\n\n</p>\n\n<p>\n大韓民国・京畿道\n</p>\n\n<p>\n市民とともに、京畿道とともに、<br>\nそして世界とともに。\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ja\">\n日本語ホーム\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"news.html\" lang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE ニュースモジュール\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE 接続\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   DOM 要素\n===================================== */\n\nconst newsList =\n  document.getElementById(\"newsList\");\n\nconst searchInput =\n  document.getElementById(\"searchInput\");\n\nconst empty =\n  document.getElementById(\"empty\");\n\n/* =====================================\n   カテゴリー名\n===================================== */\n\nconst categoryNames = {\n\n  notice: \"お知らせ\",\n\n  activity: \"委員会活動\",\n\n  event: \"イベント\",\n\n  press: \"メディア報道\",\n\n  policy: \"政策動向\"\n\n};\n\n/* =====================================\n   状態管理\n===================================== */\n\nlet news = [];\n\nlet currentCategory = \"all\";\n\nlet loadFailed = false;\n\n/* =====================================\n   日付表示\n===================================== */\n\nfunction formatDate(value) {\n\n  if (!value) return \"\";\n\n  const date = new Date(value);\n\n  if (Number.isNaN(date.getTime())) {\n    return String(value).slice(0, 10);\n  }\n\n  return [\n    date.getFullYear(),\n    String(date.getMonth() + 1).padStart(2, \"0\"),\n    String(date.getDate()).padStart(2, \"0\")\n  ].join(\".\");\n\n}\n\n/* =====================================\n   韓国語テキスト判定\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   リンクの安全性確認\n===================================== */\n\nfunction getSafeLink(value) {\n\n  if (!value) return \"\";\n\n  try {\n\n    const url = new URL(\n      value,\n      window.location.href\n    );\n\n    if (\n      url.protocol !== \"https:\" &&\n      url.protocol !== \"http:\"\n    ) {\n      return \"\";\n    }\n\n    return url.href;\n\n  } catch (error) {\n\n    return \"\";\n\n  }\n\n}\n\n/* =====================================\n   ニュース読み込み\n===================================== */\n\nasync function loadNews() {\n\n  newsList.innerHTML =\n    '<div class=\"status\">' +\n    'ニュース・お知らせを読み込んでいます...' +\n    '</div>';\n\n  empty.hidden = true;\n\n  const combinedNews = [];\n\n  let successfulQueries = 0;\n\n  /* =====================================\n     1. ニュース記事\n  ===================================== */\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id,title,category,description,link,published_at\"\n        )\n        .order(\"published_at\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    successfulQueries++;\n\n    for (const item of data || []) {\n\n      combinedNews.push({\n\n        id: \"news-\" + item.id,\n\n        date: formatDate(\n          item.published_at\n        ),\n\n        sortDate:\n          item.published_at || \"\",\n\n        category:\n          item.category || \"\",\n\n        categoryName:\n          categoryNames[item.category] ||\n          \"その他\",\n\n        title:\n          item.title || \"\",\n\n        description:\n          item.description || \"\",\n\n        link:\n          item.link || \"\"\n\n      });\n\n    }\n\n  } catch (error) {\n\n    console.error(\n      \"ニュース記事の取得に失敗:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     2. 掲示板の記事\n  ===================================== */\n\n  try {\n\n    const {\n      data: placements,\n      error\n    } =\n      await supabase\n        .from(\"board_post_placements\")\n        .select(\"post_id,placement\")\n        .in(\"placement\", [\n          \"notice\",\n          \"activity\"\n        ]);\n\n    if (error) {\n      throw error;\n    }\n\n    if (\n      placements &&\n      placements.length > 0\n    ) {\n\n      const postIds = [\n        ...new Set(\n          placements.map(\n            item => item.post_id\n          )\n        )\n      ];\n\n      const {\n        data: posts,\n        error: postError\n      } =\n        await supabase\n          .from(\"board_posts\")\n          .select(\n            \"id,title,content,created_at\"\n          )\n          .in(\"id\", postIds);\n\n      if (postError) {\n        throw postError;\n      }\n\n      const postMap = new Map(\n        (posts || []).map(post => [\n          String(post.id),\n          post\n        ])\n      );\n\n      for (const placement of placements) {\n\n        const post = postMap.get(\n          String(placement.post_id)\n        );\n\n        if (!post) continue;\n\n        const content =\n          post.content || \"\";\n\n        combinedNews.push({\n\n          id:\n            \"board-\" +\n            placement.placement +\n            \"-\" +\n            post.id,\n\n          date:\n            formatDate(\n              post.created_at\n            ),\n\n          sortDate:\n            post.created_at || \"\",\n\n          category:\n            placement.placement,\n\n          categoryName:\n            categoryNames[\n              placement.placement\n            ] || \"その他\",\n\n          title:\n            post.title || \"\",\n\n          description:\n            content.length > 200\n              ? content.slice(0, 200) + \"...\"\n              : content,\n\n          link:\n            \"board.html?post=\" +\n            encodeURIComponent(post.id)\n\n        });\n\n      }\n\n    }\n\n    successfulQueries++;\n\n  } catch (error) {\n\n    console.error(\n      \"掲示板の記事取得に失敗:\",\n      error\n    );\n\n  }\n\n  /* =====================================\n     3. 日付順に並べ替え\n  ===================================== */\n\n  combinedNews.sort((a, b) =>\n    String(b.sortDate)\n      .localeCompare(\n        String(a.sortDate)\n      )\n  );\n\n  news = combinedNews;\n\n  /* =====================================\n     4. 読み込みエラー処理\n  ===================================== */\n\n  if (successfulQueries === 0) {\n\n    loadFailed = true;\n\n    newsList.innerHTML =\n      '<div class=\"status\">' +\n      '現在ニュースを読み込めません。' +\n      'しばらくしてからもう一度お試しください。' +\n      '</div>';\n\n    empty.hidden = true;\n\n    return;\n\n  }\n\n  loadFailed = false;\n\n  renderNews();\n\n  console.log(\n    \"日本語ニュースページ読み込み完了:\",\n    news.length,\n    \"件\"\n  );\n\n}\n\n/* =====================================\n   ニュース表示\n===================================== */\n\nfunction renderNews() {\n\n  if (loadFailed) return;\n\n  const keyword =\n    searchInput.value\n      .trim()\n      .toLowerCase();\n\n  const filtered = news.filter(item => {\n\n    const categoryMatch =\n      currentCategory === \"all\" ||\n      item.category === currentCategory;\n\n    const searchText = [\n      item.title,\n      item.description,\n      item.categoryName,\n      item.date\n    ].join(\" \").toLowerCase();\n\n    return (\n      categoryMatch &&\n      searchText.includes(keyword)\n    );\n\n  });\n\n  filtered.sort((a, b) =>\n    String(b.sortDate || b.date || \"\")\n      .localeCompare(\n        String(a.sortDate || a.date || \"\")\n      )\n  );\n\n  newsList.innerHTML = \"\";\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"news-item\";\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className = \"category\";\n\n    category.textContent =\n      item.categoryName;\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className = \"date\";\n\n    date.textContent =\n      item.date;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description;\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* =====================================\n       韓国語原文の表示\n    ===================================== */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"原文：韓国語\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* =====================================\n       記事へのリンク\n    ===================================== */\n\n    const safeLink =\n      getSafeLink(item.link);\n\n    if (safeLink) {\n\n      const link =\n        document.createElement(\"a\");\n\n      link.className =\n        \"news-link\";\n\n      link.href =\n        safeLink;\n\n      const url =\n        new URL(safeLink);\n\n      const isBoardLink =\n        url.origin ===\n          window.location.origin &&\n        url.pathname.endsWith(\n          \"/board.html\"\n        );\n\n      if (isBoardLink) {\n\n        link.target = \"_self\";\n\n      } else {\n\n        link.target = \"_blank\";\n\n        link.rel =\n          \"noopener noreferrer\";\n\n      }\n\n      link.textContent =\n        \"続きを読む\";\n\n      card.appendChild(link);\n\n    }\n\n    newsList.appendChild(card);\n\n  });\n\n  empty.hidden =\n    filtered.length !== 0;\n\n}\n\n/* =====================================\n   カテゴリーフィルター\n===================================== */\n\ndocument\n  .querySelectorAll(\"[data-category]\")\n  .forEach(button => {\n\n    button.addEventListener(\n      \"click\",\n      () => {\n\n        currentCategory =\n          button.dataset.category;\n\n        document\n          .querySelectorAll(\n            \"[data-category]\"\n          )\n          .forEach(btn => {\n\n            const isActive =\n              btn.dataset.category ===\n              currentCategory;\n\n            btn.classList.toggle(\n              \"active\",\n              isActive\n            );\n\n            btn.setAttribute(\n              \"aria-pressed\",\n              String(isActive)\n            );\n\n          });\n\n        renderNews();\n\n      }\n    );\n\n  });\n\n/* =====================================\n   検索\n===================================== */\n\nsearchInput.addEventListener(\n  \"input\",\n  renderNews\n);\n\n/* =====================================\n   初期読み込み\n===================================== */\n\nloadNews();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=ru": "<!DOCTYPE html>\n<html lang=\"ru\">\n\n<head>\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<title>\nНовости и объявления |\nИнициатива «Глобальный центр ИИ»\n</title>\n\n<meta name=\"description\"\ncontent=\"Новости, объявления, мероприятия, деятельность и политические инициативы Гражданского комитета содействия размещению Глобального центра ИИ в особом городе Коян, Республика Корея.\">\n\n<style>\n\n/* =====================================\n   ОСНОВНЫЕ НАСТРОЙКИ\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ШАПКА САЙТА\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 17px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  padding: 10px 20px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   ОСНОВНОЕ СОДЕРЖИМОЕ\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n/* =====================================\n   ПОИСК\n===================================== */\n\n.search-box {\n  margin-bottom: 25px;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 16px;\n  border: 1px solid #c5d5e8;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* =====================================\n   ФИЛЬТРЫ КАТЕГОРИЙ\n===================================== */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  border: 1px solid #0754a6;\n  background: white;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   КАРТОЧКИ НОВОСТЕЙ\n===================================== */\n\n.news-list {\n  display: grid;\n  gap: 18px;\n}\n\n.news-item {\n  background: white;\n  border-radius: 12px;\n  padding: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n  border-left: 5px solid #168de0;\n}\n\n.news-item h3 {\n  color: #0754a6;\n  margin: 10px 0;\n  font-size: 21px;\n  overflow-wrap: anywhere;\n}\n\n.category {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 4px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.date {\n  color: #68788c;\n  font-size: 14px;\n}\n\n.news-item p {\n  color: #46566d;\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.content-language {\n  display: inline-block;\n  color: #68788c;\n  font-size: 13px;\n  margin-top: 8px;\n}\n\n.news-link {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 10px 17px;\n  border-radius: 6px;\n  text-decoration: none;\n  font-weight: bold;\n  margin-top: 12px;\n}\n\n.news-link:hover {\n  background: #003a7a;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  color: #68788c;\n}\n\n.status {\n  background: white;\n  padding: 25px;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   ПОДВАЛ САЙТА\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   МОБИЛЬНАЯ ВЕРСИЯ\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .intro,\n  .news-item {\n    padding: 20px;\n  }\n\n  .news-link {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ШАПКА САЙТА\n===================================== -->\n\n<header>\n\n<h1>\nНовости и объявления\n</h1>\n\n<p>\nИнициатива «Глобальный центр ИИ»<br>\nОсобый город Коян, Республика Корея\n</p>\n\n<p>\nИнформация о гражданских инициативах,<br>\nмеждународном сотрудничестве,<br>\nполитических предложениях<br>\nи основных событиях.\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=ru\"\nclass=\"home-link\">\n← Главная страница\n</a>\n\n<a href=\"news.html\"\nclass=\"home-link\"\nlang=\"ko\">\n한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     ВВЕДЕНИЕ\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nПоследние новости Гражданского комитета содействия\n</h2>\n\n<p>\nНа этой странице представлена\nинформация о деятельности\nГражданского комитета содействия\nразмещению Глобального центра ИИ\nв особом городе Коян.\n</p>\n\n<p>\nПубликации могут включать\nинформацию о деятельности Комитета,\nобщественные объявления,\nмероприятия,\nпубликации в средствах массовой информации\nи новости государственной политики.\n</p>\n\n<p>\nНовая информация будет добавляться\nпо мере её поступления.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     ИНФОРМАЦИЯ О ЯЗЫКЕ\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nИнформация о языке публикаций\n</strong>\n\n<p>\nНа этой русскоязычной странице\nотображаются новости и объявления\nиз существующей базы публикаций\nГражданского комитета содействия.\n</p>\n\n<p>\nНекоторые материалы доступны\nтолько на корейском языке.\nОригинальные корейские заголовки\nи описания отображаются\nбез автоматического перевода.\n</p>\n\n<p>\nПри наличии соответствующей ссылки\nможно открыть оригинальную статью\nили связанный источник информации.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     ПОИСК\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\ntype=\"search\"\nid=\"searchInput\"\nplaceholder=\"Поиск новостей по заголовку или ключевым словам\"\naria-label=\"Поиск новостей и объявлений\">\n\n</div>\n\n\u003c!-- =====================================\n     ФИЛЬТРЫ\n===================================== -->\n\n<nav class=\"filters\"\naria-label=\"Фильтр новостей по категориям\">\n\n<button\ntype=\"button\"\nclass=\"active\"\ndata-category=\"all\"\naria-pressed=\"true\">\nВсе новости\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"notice\"\naria-pressed=\"false\">\nОбъявления\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"activity\"\naria-pressed=\"false\">\nДеятельность комитета\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"event\"\naria-pressed=\"false\">\nМероприятия\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"press\"\naria-pressed=\"false\">\nПубликации в СМИ\n</button>\n\n<button\ntype=\"button\"\ndata-category=\"policy\"\naria-pressed=\"false\">\nНовости государственной политики\n</button>\n\n</nav>\n\n\u003c!-- =====================================\n     СПИСОК НОВОСТЕЙ\n===================================== -->\n\n<div\nclass=\"news-list\"\nid=\"newsList\"\naria-live=\"polite\">\n</div>\n\n<p\nclass=\"empty\"\nid=\"empty\"\nhidden>\nПо вашему запросу новости не найдены.\n</p>\n\n</main>\n\n\u003c!-- =====================================\n     ПОДВАЛ САЙТА\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nГражданский комитет содействия<br>\nразмещению Глобального центра ИИ<br>\nв особом городе Коян\n</strong>\n</p>\n\n<p>\nПровинция Кёнгидо,<br>\nРеспублика Корея\n</p>\n\n<p>\nВместе с гражданами,<br>\nвместе с провинцией Кёнгидо<br>\nи вместе со всем миром.\n</p>\n\n<p>\n<a href=\"index.html?lang=ru\">\nГлавная страница\n</a>\n&nbsp; | &nbsp;\n<a href=\"news.html\" lang=\"ko\">\n한국어\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     МОДУЛЬ НОВОСТЕЙ SUPABASE\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   ПОДКЛЮЧЕНИЕ К SUPABASE\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   ЭЛЕМЕНТЫ СТРАНИЦЫ\n===================================== */\n\nconst newsList =\n  document.getElementById(\"newsList\");\n\nconst searchInput =\n  document.getElementById(\"searchInput\");\n\nconst empty =\n  document.getElementById(\"empty\");\n\n/* =====================================\n   НАЗВАНИЯ КАТЕГОРИЙ\n===================================== */\n\nconst categoryNames = {\n\n  notice: \"Объявления\",\n\n  activity: \
