diciones\npara una cooperación internacional\nsignificativa, al tiempo que se generan\noportunidades de investigación,\ninnovación, empleo\ny desarrollo regional sostenible.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- 2. SEIS PRIORIDADES -->\n\n<section id=\"prioridades\">\n\n<h2>\n2. Seis prioridades estratégicas\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- ESTRATEGIA 1 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nEstrategia 01\n</span>\n\n<h3>\nFortalecimiento de la competitividad territorial\n</h3>\n\n<p>\nEvaluar los recursos existentes\nde Goyang, incluida\nla accesibilidad metropolitana,\nlas instalaciones para convenciones\ninternacionales,\nlas instituciones sanitarias,\nla educación,\nlos servicios culturales\ny las condiciones de vida.\n</p>\n\n<p>\nDesarrollar propuestas\nbasadas en evidencia\nque respondan\na los requisitos reales\ny a los criterios de evaluación\nde posibles socios internacionales.\n</p>\n\n</article>\n\n\u003c!-- ESTRATEGIA 2 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nEstrategia 02\n</span>\n\n<h3>\nConstrucción de la cooperación institucional\n</h3>\n\n<p>\nExplorar la cooperación\nentre la provincia de Gyeonggi,\nla Ciudad Especial de Goyang,\nlas autoridades nacionales competentes,\nlas universidades,\nlas instituciones de investigación,\nlas empresas\ny la sociedad civil.\n</p>\n\n<p>\nDefinir posibles funciones\ny responsabilidades institucionales\ny fomentar debates coordinados\nsobre políticas\ny actividades preparatorias.\n</p>\n\n</article>\n\n\u003c!-- ESTRATEGIA 3 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nEstrategia 03\n</span>\n\n<h3>\nApoyo al establecimiento inicial\n</h3>\n\n<p>\nEvaluar las condiciones necesarias\npara que las organizaciones internacionales\ny las instituciones colaboradoras\npuedan establecer\ny mantener operaciones eficaces.\n</p>\n\n<p>\nLos posibles requisitos incluyen\ninstalaciones de oficinas,\ntransporte,\nvivienda,\neducación,\natención sanitaria\ny otros servicios esenciales.\n</p>\n\n<p>\nLos mecanismos específicos\nde apoyo dependerían\nde la legislación aplicable,\nlos presupuestos disponibles,\nlos requisitos institucionales\ny las consultas formales.\n</p>\n\n</article>\n\n\u003c!-- ESTRATEGIA 4 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nEstrategia 04\n</span>\n\n<h3>\nAmpliación de la cooperación internacional\nen IA de interés público\n</h3>\n\n<p>\nExplorar aplicaciones responsables\nde inteligencia artificial\nen salud pública,\nseguridad alimentaria,\nprotección climática y ambiental,\nresiliencia ante desastres,\nempleo y educación.\n</p>\n\n<p>\nIdentificar oportunidades\npara la investigación colaborativa,\nlos proyectos piloto,\nel intercambio de conocimientos\ny la cooperación práctica\nentre organizaciones internacionales,\ninstituciones de investigación\ny empresas tecnológicas.\n</p>\n\n</article>\n\n\u003c!-- ESTRATEGIA 5 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nEstrategia 05\n</span>\n\n<h3>\nVinculación de la innovación\ncon el empleo y el desarrollo regional\n</h3>\n\n<p>\nExplorar formas de conectar\nla iniciativa del Centro Global de IA\ncon la investigación y el desarrollo,\nla innovación tecnológica,\nlos servicios profesionales\ny las oportunidades\npara las empresas locales.\n</p>\n\n<p>\nPromover debates sobre políticas\nrelacionadas con el empleo de calidad,\nel desarrollo de los jóvenes,\nla formación profesional\ny el crecimiento regional sostenible.\n</p>\n\n</article>\n\n\u003c!-- ESTRATEGIA 6 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nEstrategia 06\n</span>\n\n<h3>\nFomento de la participación ciudadana\n</h3>\n\n<p>\nPromover la participación voluntaria\nde los ciudadanos\nmediante información pública,\nexpresiones de apoyo en línea,\ninscripción en el Comité\ny actividades de divulgación.\n</p>\n\n<p>\nFomentar una participación cívica\nresponsable basada\nen información objetiva,\ndiálogo constructivo\ny propuestas de políticas viables.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- 3. CONDICIONES DE ESTABLECIMIENTO -->\n\n<section id=\"condiciones\">\n\n<h2>\n3. Condiciones para el establecimiento inicial\ny las operaciones\n</h2>\n\n<p>\nLa viabilidad a largo plazo\nde un centro de cooperación internacional\ndepende de la capacidad\nde las instituciones participantes\npara operar eficazmente\ny apoyar a su personal.\n</p>\n\n<p>\nLos siguientes ámbitos\nrequerirían evaluaciones detalladas\ny consultas institucionales.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nEspacios de oficina e instalaciones\n</h3>\n\n<p>\nEvaluar instalaciones adecuadas\npara operaciones institucionales,\nactividades de investigación,\nreuniones internacionales\ne intercambios profesionales.\n</p>\n\n<p>\nLos requisitos pueden incluir\nconectividad digital,\naccesibilidad,\nseguridad\ne infraestructura para reuniones.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nTransporte y accesibilidad\n</h3>\n\n<p>\nEvaluar el acceso\na aeropuertos internacionales,\nprincipales destinos metropolitanos,\nposibles ubicaciones de oficinas\ny zonas residenciales.\n</p>\n\n<p>\nDeben considerarse\nla fiabilidad del transporte,\nlas condiciones de desplazamiento\ny la accesibilidad.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nVivienda y condiciones de vida\n</h3>\n\n<p>\nEvaluar las opciones residenciales,\nla educación,\nla atención sanitaria\ny los servicios cotidianos\npara el personal internacional\ny sus familiares acompañantes.\n</p>\n\n<p>\nLas necesidades reales dependerían\nde la composición del personal\ny de los requisitos institucionales.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nApoyo administrativo e institucional\n</h3>\n\n<p>\nExplorar posibles mecanismos\nde coordinación\nentre las autoridades competentes\npara abordar requisitos administrativos,\ncooperación institucional\ny procedimientos operativos.\n</p>\n\n<p>\nCualquier acuerdo estaría sujeto\na las responsabilidades\ny procesos de aprobación\nde las instituciones correspondientes.\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\nEstas consideraciones representan\námbitos propuestos\npara evaluar la viabilidad.\nNo constituyen compromisos financieros\nconfirmados,\nasignaciones de instalaciones\nni acuerdos de apoyo institucional.\n</p>\n\n</section>\n\n\u003c!-- 4. IMPLEMENTACIÓN -->\n\n<section id=\"implementacion\">\n\n<h2>\n4. De la preparación a las operaciones sostenibles\n</h2>\n\n<p>\nLa iniciativa del Centro Global de IA\nrequiere una planificación\nque vaya más allá\ndel proceso inicial\nde selección de ubicación.\n</p>\n\n<p>\nLas siguientes cuatro fases\ndescriben un enfoque de política propuesto,\nno un calendario de implementación\noficialmente aprobado.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nFase 01\n</span>\n\n<h3>\nConstrucción de las bases\n</h3>\n\n<p>\nPromover la comprensión pública,\nevaluar la competitividad territorial,\nrealizar investigaciones sobre políticas\ny explorar la cooperación institucional.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nFase 02\n</span>\n\n<h3>\nDesarrollo de una propuesta práctica\n</h3>\n\n<p>\nPerfeccionar las posibles propuestas\nde atracción\ny las medidas de apoyo operativo\na partir de las necesidades institucionales,\nlos requisitos de ubicación\ny los criterios de evaluación pertinentes.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nFase 03\n</span>\n\n<h3>\nApoyo al establecimiento inicial\n</h3>\n\n<p>\nSi se selecciona formalmente\nuna ubicación,\nexplorar acuerdos relativos\na instalaciones de oficinas,\ncondiciones de vida\ny coordinación administrativa\nmediante consultas\ncon las autoridades competentes.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nFase 04\n</span>\n\n<h3>\nAmpliación de la cooperación internacional\n</h3>\n\n<p>\nExplorar oportunidades\npara investigaciones colaborativas,\nproyectos piloto,\nconferencias internacionales,\nformación profesional\ny asociaciones a largo plazo.\n</p>\n\n</article>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nPreparación\n→ Propuesta práctica\n→ Establecimiento inicial\n→ Cooperación sostenible\n</strong>\n\n<p>\nLa implementación dependería\nde las decisiones institucionales,\nlos recursos disponibles\ny los acuerdos formales.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- 5. TRES ETAPAS -->\n\n<section id=\"cooperacion\">\n\n<h2>\n5. Marco de cooperación en tres etapas\n</h2>\n\n<p>\nJunto con el enfoque\nde implementación en cuatro fases,\nla iniciativa propone\ntres prioridades a largo plazo\npara las instituciones participantes.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nEtapa 1 — Establecimiento inicial\n</h3>\n\n<p>\nIdentificar las condiciones físicas,\nadministrativas\ny de vida necesarias\npara que las organizaciones\npotencialmente participantes\npuedan establecer sus operaciones.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nEtapa 2 — Apoyo operativo\n</h3>\n\n<p>\nExplorar mecanismos\nde coordinación institucional,\ncooperación en investigación,\ndemostración tecnológica,\nreuniones internacionales\ne intercambios profesionales.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nEtapa 3 — Crecimiento compartido\n</h3>\n\n<p>\nBuscar oportunidades\npara que las organizaciones internacionales\navancen en sus respectivos mandatos\ny, al mismo tiempo,\ncontribuyan a la investigación colaborativa,\nla innovación\ny el desarrollo regional sostenible.\n</p>\n\n</article>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nEstablecimiento inicial\n→ Apoyo operativo\n→ Crecimiento compartido\n</strong>\n\n<p>\nEste marco constituye\nuna propuesta estratégica.\nLas medidas específicas requerirían\nconsultas y decisiones formales\nde las instituciones pertinentes.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- 6. ECONOMÍA -->\n\n<section id=\"economia\">\n\n<h2>\n6. Empleo y desarrollo económico regional\n</h2>\n\n<p>\nUn objetivo importante\nde la iniciativa del Centro Global de IA\nes explorar cómo\nla cooperación internacional\npodría crear nuevas oportunidades\npara la economía regional de Goyang.\n</p>\n\n<p>\nSi se amplía la cooperación institucional,\nlas posibles actividades\npodrían incluir\ninvestigación y desarrollo en IA,\nservicios profesionales,\nconferencias internacionales,\nprogramas de formación\ny desarrollo empresarial\nrelacionado con la tecnología.\n</p>\n\n<p>\nConectar estas actividades\ncon empresas locales,\nuniversidades\ny jóvenes profesionales\nsería una consideración importante\nde política pública a largo plazo.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nInvestigación e innovación\n</h3>\n\n<p>\nPosible colaboración\nentre universidades,\ninstituciones de investigación,\nempresas tecnológicas\ny organizaciones internacionales.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nEmpleo profesional\n</h3>\n\n<p>\nPosibles oportunidades\nen investigación,\nanálisis de datos,\ncooperación internacional,\ntraducción,\ngestión de conferencias\ny servicios profesionales.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nDesarrollo de los jóvenes\n</h3>\n\n<p>\nOportunidades para explorar\nprogramas de formación,\ndesarrollo de competencias,\nintercambios profesionales\ny trayectorias laborales\nrelacionadas con la IA\ny la cooperación internacional.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nOportunidades para empresas locales\n</h3>\n\n<p>\nPosibles conexiones\nentre la cooperación internacional\ny los proveedores locales\nde servicios,\nlas empresas tecnológicas\ny las redes de innovación.\n</p>\n\n</article>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nEl Centro Global de IA propuesto\nbusca conectar la cooperación internacional\ncon la innovación sostenible,\nlas oportunidades de empleo\ny el desarrollo económico regional.\n</strong>\n\n</div>\n\n<p class=\"note\">\nLos impactos económicos reales,\nlas inversiones\ny los resultados de empleo\ndependerían de la escala,\nla estructura\ny la implementación\nde los proyectos futuros.\nNo se garantiza ningún resultado específico.\n</p>\n\n<a href=\"goyang.html?lang=es\"\nclass=\"button\">\nExplorar las ventajas de Goyang\n</a>\n\n</section>\n\n\u003c!-- 7. COMITÉ -->\n\n<section id=\"comite\">\n\n<h2>\n7. Función del Comité Ciudadano de Promoción\n</h2>\n\n<p>\nEl Comité Ciudadano de Promoción\nes una iniciativa cívica\nque apoya la propuesta\nde atraer el Centro Global de IA\na la Ciudad Especial de Goyang.\n</p>\n\n<p>\nEl Comité busca fomentar\nla participación pública,\npromover debates sobre políticas\ny aumentar el conocimiento\nde las posibles oportunidades\nde cooperación internacional\ny desarrollo regional.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nConsulta pública\n</h3>\n\n<p>\nRecoger las perspectivas ciudadanas\nmediante comunicación pública,\nparticipación en línea\ny actividades comunitarias.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nInvestigación y propuestas de políticas\n</h3>\n\n<p>\nExaminar la competitividad territorial,\nlos requisitos institucionales\ny los posibles modelos de cooperación\npara desarrollar propuestas\nde políticas prácticas.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nParticipación ciudadana\n</h3>\n\n<p>\nFomentar la participación voluntaria\nmediante la inscripción en el Comité,\nlas actividades de sensibilización pública\ny otras iniciativas cívicas.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nTransparencia y rendición de cuentas\n</h3>\n\n<p>\nPromover operaciones responsables,\ncomunicación pública\ne informes transparentes\nsobre las actividades del Comité.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- 8. SITUACIÓN INSTITUCIONAL -->\n\n<section id=\"situacion\">\n\n<h2>\n8. Situación institucional y aclaraciones importantes\n</h2>\n\n<p>\nLa estrategia para atraer\nel Centro Global de IA\npresentada en este sitio web\nes una propuesta promovida\npor el Comité Ciudadano de Promoción.\n</p>\n\n<p>\nNo debe interpretarse\ncomo un plan de implementación\ngubernamental oficialmente aprobado\nni como un compromiso confirmado\npor ninguna organización internacional.\n</p>\n\n<p>\nCualquier futura decisión\nsobre la ubicación,\nparticipación institucional,\nprovisión de instalaciones,\napoyo financiero\no mecanismo operativo\nrequeriría consultas adecuadas\ny aprobación formal\nde las autoridades responsables.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nEl Comité busca promover\nun diálogo constructivo\ny una planificación basada en evidencia\npara apoyar una iniciativa\nde cooperación internacional\nrealista y sostenible.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- 9. CONCLUSIÓN -->\n\n<section id=\"futuro\">\n\n<h2>\n9. Construyendo juntos el futuro\n</h2>\n\n<p>\nLa iniciativa propuesta\ndel Centro Global de IA\nofrece una oportunidad\npara explorar cómo\nla Ciudad Especial de Goyang\npodría contribuir\na la cooperación internacional\nmientras se prepara\npara nuevas oportunidades\nde desarrollo regional.\n</p>\n\n<p>\nEl Comité Ciudadano de Promoción\ncontinuará fomentando\nla sensibilización pública,\nel debate constructivo\nsobre políticas\ny la participación cívica responsable.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nInteligencia Artificial para la Humanidad.<br>\nCooperación Internacional para un Futuro Mejor.<br>\nCrecimiento Compartido para la Ciudad Especial de Goyang.\n</strong>\n\n</div>\n\n<a href=\"index.html?lang=es\"\nclass=\"button\">\n← Página principal en español\n</a>\n\n<a href=\"hub.html?lang=es\"\nclass=\"button secondary\">\nAcerca del Centro Global de IA\n</a>\n\n<a href=\"goyang.html?lang=es\"\nclass=\"button secondary\">\n¿Por qué Goyang?\n</a>\n\n<a href=\"agencies.html?lang=es\"\nclass=\"button secondary\">\nOrganizaciones internacionales\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIE DE PÁGINA -->\n\n<footer>\n\n<p>\n<strong>\nIniciativa del Centro Global de IA<br>\nCiudad Especial de Goyang,<br>\nProvincia de Gyeonggi,<br>\nRepública de Corea\n</strong>\n</p>\n\n<p>\nComité Ciudadano de Promoción\npara la Atracción del Centro Global de IA\na la Ciudad Especial de Goyang\n</p>\n\n<p>\nInteligencia Artificial para la Humanidad.<br>\nCooperación Internacional para un Futuro Mejor.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=es\">\nInicio en español\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"strategy.html?lang=en\"\nlang=\"en\">\nEnglish\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"strategy.html\"\nlang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=fr": "<!DOCTYPE html>\n<html lang=\"fr\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<meta name=\"description\"\ncontent=\"Découvrez la stratégie proposée pour l'implantation du Centre mondial de l'IA à Goyang : six priorités stratégiques, conditions d'installation des organisations internationales, coopération institutionnelle et développement régional durable.\">\n\n<title>\nStratégie d'implantation du Centre mondial de l'IA |\nVille spéciale de Goyang\n</title>\n\n<style>\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n.intro {\n  font-size: 18px;\n}\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.strategy-number {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 4px 12px;\n  border-radius: 6px;\n  font-size: 14px;\n  margin-bottom: 10px;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  .intro {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- EN-TÊTE -->\n\n<header>\n\n<h1>\nStratégie d'implantation du Centre mondial de l'IA\n</h1>\n\n<p>\nPréparer la ville spéciale de Goyang<br>\nà la coopération internationale,\nà l'innovation responsable en IA\net au développement durable\n</p>\n\n<p>\nProvince de Gyeonggi, République de Corée\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=fr\" class=\"home-link\">\n← Accueil\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- VISION -->\n\n<section>\n\n<div class=\"slogan\">\n\nUn nouveau moteur de croissance pour Goyang.<br>\nDe nouvelles possibilités d'emploi.<br>\nUn Centre mondial de l'IA pour la coopération internationale.\n\n</div>\n\n</section>\n\n\u003c!-- INTRODUCTION -->\n\n<section>\n\n<h2>\n1. Vision stratégique\n</h2>\n\n<div class=\"intro\">\n\n<p>\nLe projet de Centre mondial de l'IA\nreprésente une occasion\npour la ville spéciale de Goyang\nd'explorer un nouveau rôle\nen tant que centre\nde coopération internationale\net d'intelligence artificielle responsable.\n</p>\n\n<p>\nL'implantation réussie\nd'institutions internationales\nnécessite davantage\nque l'enthousiasme du public.\n</p>\n\n<p>\nElle exige une évaluation objective\ndes avantages du territoire,\ndes plans de mise en œuvre réalistes,\nune coordination institutionnelle\net des dispositifs opérationnels durables.\n</p>\n\n<p>\nLe Comité citoyen de promotion\ncherche à élaborer\ndes propositions constructives\nreliant les ressources existantes de Goyang\naux besoins\ndes partenaires internationaux potentiels.\n</p>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nL'objectif ne consiste pas simplement\nà attirer des bureaux\nd'organisations internationales.\n</strong>\n\n<p>\nLa vision plus large\nconsiste à créer les conditions\nd'une coopération internationale significative\ntout en favorisant\nde nouvelles possibilités\nde recherche,\nd'innovation,\nd'emploi\net de développement régional durable.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- SIX PRIORITÉS STRATÉGIQUES -->\n\n<section>\n\n<h2>\n2. Six priorités stratégiques\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- STRATÉGIE 01 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nStratégie 01\n</span>\n\n<h3>\nRenforcer la compétitivité territoriale\n</h3>\n\n<p>\nÉvaluer les ressources existantes de Goyang,\nnotamment son accessibilité métropolitaine,\nses infrastructures internationales\nde congrès,\nses établissements de santé,\nses ressources éducatives,\nses équipements culturels\net ses conditions de vie.\n</p>\n\n<p>\nÉlaborer des propositions\nfondées sur des données probantes\nrépondant aux besoins réels\net aux critères d'évaluation\ndes partenaires internationaux potentiels.\n</p>\n\n</article>\n\n\u003c!-- STRATÉGIE 02 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nStratégie 02\n</span>\n\n<h3>\nRenforcer la coopération institutionnelle\n</h3>\n\n<p>\nExplorer les possibilités de coopération\nentre la province de Gyeonggi,\nla ville spéciale de Goyang,\nles autorités nationales compétentes,\nles universités,\nles établissements de recherche,\nles entreprises\net la société civile.\n</p>\n\n<p>\nClarifier les rôles\net les responsabilités institutionnelles\nqui pourraient être envisagés,\net encourager\ndes discussions coordonnées\nsur les politiques publiques\net les activités préparatoires.\n</p>\n\n</article>\n\n\u003c!-- STRATÉGIE 03 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nStratégie 03\n</span>\n\n<h3>\nSoutenir l'installation initiale\n</h3>\n\n<p>\nÉvaluer les conditions nécessaires\npour permettre\naux organisations internationales\net aux institutions partenaires\nd'établir et de maintenir\ndes activités efficaces.\n</p>\n\n<p>\nLes besoins potentiels comprennent\nles bureaux,\nles transports,\nle logement,\nl'éducation,\nles soins de santé\net les autres services essentiels.\n</p>\n\n<p>\nLes mesures de soutien spécifiques\ndépendraient\ndes lois applicables,\ndes budgets disponibles,\ndes exigences institutionnelles\net des consultations formelles.\n</p>\n\n</article>\n\n\u003c!-- STRATÉGIE 04 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nStratégie 04\n</span>\n\n<h3>\nDévelopper la coopération internationale\nen IA d'intérêt public\n</h3>\n\n<p>\nExplorer les applications responsables de l'IA\ndans les domaines\nde la santé publique,\nde la sécurité alimentaire,\ndu climat,\nde la protection de l'environnement,\nde la résilience face aux catastrophes,\nde l'emploi\net de l'éducation.\n</p>\n\n<p>\nIdentifier les possibilités\nde recherche collaborative,\nde projets pilotes,\nd'échange de connaissances\net de coopération pratique\nentre les organisations internationales,\nles établissements de recherche\net les entreprises technologiques.\n</p>\n\n</article>\n\n\u003c!-- STRATÉGIE 05 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nStratégie 05\n</span>\n\n<h3>\nRelier l'innovation,\nl'emploi\net le développement régional\n</h3>\n\n<p>\nExplorer les moyens\nde relier l'initiative du Centre mondial de l'IA\nà la recherche et au développement,\nà l'innovation technologique,\naux services professionnels\net aux possibilités\noffertes aux entreprises locales.\n</p>\n\n<p>\nPromouvoir des discussions\nsur les politiques publiques\nrelatives à l'emploi de qualité,\nau développement des jeunes,\nà la formation professionnelle\net à la croissance régionale durable.\n</p>\n\n</article>\n\n\u003c!-- STRATÉGIE 06 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nStratégie 06\n</span>\n\n<h3>\nEncourager la participation citoyenne\n</h3>\n\n<p>\nPromouvoir la participation volontaire\ndes citoyens\ngrâce à l'information du public,\naux manifestations de soutien en ligne,\nà l'inscription au Comité\net aux activités de sensibilisation.\n</p>\n\n<p>\nEncourager un engagement citoyen responsable\nfondé sur des informations objectives,\nun dialogue constructif\net des propositions\nde politiques publiques réalisables.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- CONDITIONS D'INSTALLATION -->\n\n<section>\n\n<h2>\n3. Installation initiale et conditions opérationnelles\n</h2>\n\n<p>\nLa viabilité à long terme\nd'un centre de coopération internationale\ndépend de la capacité\ndes institutions participantes\nà fonctionner efficacement\net à répondre aux besoins\nde leur personnel.\n</p>\n\n<p>\nLes domaines suivants\nnécessiteraient\ndes évaluations détaillées\net des consultations.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nBureaux et installations\n</h3>\n\n<p>\nÉvaluer les installations adaptées\naux activités institutionnelles,\nà la recherche,\naux réunions internationales\net aux échanges professionnels.\n</p>\n\n<p>\nLes exigences pourraient comprendre\nla connectivité numérique,\nl'accessibilité,\nla sécurité\net les infrastructures de réunion.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nTransports et accessibilité\n</h3>\n\n<p>\nÉvaluer l'accès\naux aéroports internationaux,\naux principales destinations métropolitaines,\naux emplacements potentiels des bureaux\net aux zones résidentielles.\n</p>\n\n<p>\nLa fiabilité des transports,\nles conditions de déplacement quotidien\net l'accessibilité\ndevraient être prises en compte.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nLogement et conditions de vie\n</h3>\n\n<p>\nÉvaluer les possibilités de logement,\nles établissements d'enseignement,\nles soins de santé\net les services quotidiens\ndestinés au personnel international\net aux membres de leur famille.\n</p>\n\n<p>\nLes besoins réels\ndépendraient\ndes effectifs envisagés\net des exigences institutionnelles.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nSoutien administratif et institutionnel\n</h3>\n\n<p>\nExplorer les possibilités\nde coordination\nentre les autorités compétentes\npour répondre\naux exigences administratives,\naux besoins de coopération institutionnelle\net aux procédures opérationnelles.\n</p>\n\n<p>\nTout dispositif serait soumis\naux responsabilités\net aux procédures d'approbation\ndes institutions concernées.\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\nCes éléments représentent\ndes domaines proposés\npour l'évaluation de la faisabilité.\nIls ne constituent pas\ndes engagements financiers confirmés,\ndes attributions de locaux\nou des accords\nde soutien institutionnel.\n</p>\n\n</section>\n\n\u003c!-- QUATRE PHASES -->\n\n<section>\n\n<h2>\n4. De la préparation au fonctionnement durable\n</h2>\n\n<p>\nL'initiative du Centre mondial de l'IA\nnécessite une planification\nqui dépasse\nle processus initial\nde sélection du lieu d'implantation.\n</p>\n\n<p>\nLes quatre phases suivantes\ndécrivent une approche proposée\nen matière de politiques publiques,\net non un calendrier de mise en œuvre\nofficiellement approuvé.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nPhase 01\n</span>\n\n<h3>\nConstruire les fondations\n</h3>\n\n<p>\nDévelopper la compréhension du public,\névaluer la compétitivité territoriale,\nmener des recherches\nsur les politiques publiques\net explorer\nla coopération institutionnelle.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nPhase 02\n</span>\n\n<h3>\nÉlaborer une proposition concrète\n</h3>\n\n<p>\nAffiner les propositions potentielles\nd'implantation\net les mesures de soutien opérationnel\nen fonction des besoins institutionnels,\ndes exigences relatives au site\net des critères d'évaluation pertinents.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nPhase 03\n</span>\n\n<h3>\nSoutenir l'installation initiale\n</h3>\n\n<p>\nSi un site est officiellement sélectionné,\nexplorer les dispositions\nrelatives aux bureaux,\naux conditions de vie\net à la coordination administrative,\nen consultation\navec les autorités compétentes.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nPhase 04\n</span>\n\n<h3>\nDévelopper la coopération internationale\n</h3>\n\n<p>\nExplorer les possibilités\nde recherche collaborative,\nde projets pilotes,\nde conférences internationales,\nde formation professionnelle\net de partenariats à long terme.\n</p>\n\n</article>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nPréparation\n→ Proposition concrète\n→ Installation initiale\n→ Coopération durable\n</strong>\n\n<p>\nLa mise en œuvre dépendrait\ndes décisions institutionnelles,\ndes ressources disponibles\net des accords formels.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- CADRE EN TROIS ÉTAPES -->\n\n<section>\n\n<h2>\n5. Cadre de coopération en trois étapes\n</h2>\n\n<p>\nParallèlement à l'approche\nde mise en œuvre en quatre phases,\nl'initiative propose\ntrois priorités à long terme\npour les institutions participantes.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nÉtape 1 — Installation initiale\n</h3>\n\n<p>\nIdentifier les conditions matérielles,\nadministratives\net de vie quotidienne\nnécessaires\npour permettre\naux organisations participantes potentielles\nd'établir leurs activités.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nÉtape 2 — Soutien opérationnel\n</h3>\n\n<p>\nExplorer les mécanismes\nde coordination institutionnelle,\nde coopération scientifique,\nde démonstration technologique,\nde réunions internationales\net d'échanges professionnels.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nÉtape 3 — Croissance partagée\n</h3>\n\n<p>\nRechercher des possibilités\npermettant aux organisations internationales\nde poursuivre leurs missions respectives\ntout en contribuant\nà la coopération scientifique,\nà l'innovation\net au développement régional durable.\n</p>\n\n</article>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nInstallation initiale\n→ Soutien opérationnel\n→ Croissance partagée\n</strong>\n\n<p>\nCe cadre constitue\nune proposition stratégique.\nLes mesures spécifiques\nnécessiteraient\ndes consultations\net des décisions formelles\ndes institutions compétentes.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- ÉCONOMIE -->\n\n<section>\n\n<h2>\n6. Emploi et développement économique régional\n</h2>\n\n<p>\nUn objectif important\nde l'initiative du Centre mondial de l'IA\nest d'explorer\ncomment la coopération internationale\npourrait créer\nde nouvelles possibilités\npour l'économie régionale de Goyang.\n</p>\n\n<p>\nSi la coopération institutionnelle\nse développe,\nles activités potentielles\npourraient comprendre\nla recherche et le développement en IA,\nles services professionnels,\nles conférences internationales,\nles programmes de formation\net le développement d'entreprises technologiques.\n</p>\n\n<p>\nRelier ces activités\naux entreprises locales,\naux universités\net aux jeunes professionnels\nconstituerait\nun enjeu important\ndes politiques publiques à long terme.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nRecherche et innovation\n</h3>\n\n<p>\nCoopération potentielle\nentre les universités,\nles établissements de recherche,\nles entreprises technologiques\net les organisations internationales.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nEmplois qualifiés\n</h3>\n\n<p>\nPossibilités potentielles\ndans la recherche,\nl'analyse de données,\nla coopération internationale,\nla traduction,\nl'organisation de conférences\net les services professionnels.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nDéveloppement des jeunes\n</h3>\n\n<p>\nPossibilités d'explorer\nla formation,\nle développement des compétences,\nles échanges professionnels\net les parcours de carrière\nliés à l'IA\net à la coopération internationale.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nPossibilités pour les entreprises locales\n</h3>\n\n<p>\nLiens potentiels\nentre la coopération internationale\net les prestataires de services locaux,\nles entreprises technologiques\net les réseaux d'innovation.\n</p>\n\n</article>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nLe Centre mondial de l'IA proposé\ncherche à relier\nla coopération internationale\nà l'innovation durable,\naux possibilités d'emploi\net au développement économique régional.\n</strong>\n\n</div>\n\n<p class=\"note\">\nLes effets économiques réels,\nles investissements\net les résultats en matière d'emploi\ndépendraient\nde l'ampleur,\nde la structure\net de la mise en œuvre\ndes projets futurs.\nAucun résultat particulier\nn'est garanti.\n</p>\n\n<a href=\"goyang.html?lang=fr\"\nclass=\"button\">\nDécouvrir les atouts de Goyang →\n</a>\n\n</section>\n\n\u003c!-- COMITÉ CITOYEN -->\n\n<section>\n\n<h2>\n7. Rôle du Comité citoyen de promotion\n</h2>\n\n<p>\nLe Comité citoyen de promotion\nest une initiative citoyenne\nsoutenant le projet\nd'implantation du Centre mondial de l'IA\ndans la ville spéciale de Goyang.\n</p>\n\n<p>\nLe Comité cherche\nà encourager la participation du public,\nà promouvoir les discussions\nsur les politiques publiques\net à sensibiliser\naux possibilités potentielles\nde coopération internationale\net de développement régional.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nConsultation publique\n</h3>\n\n<p>\nRecueillir les points de vue des citoyens\ngrâce à la communication publique,\nà la participation en ligne\net à l'engagement communautaire.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nRecherche et propositions\nsur les politiques publiques\n</h3>\n\n<p>\nExaminer la compétitivité territoriale,\nles exigences institutionnelles\net les modèles potentiels de coopération\nafin d'élaborer\ndes propositions concrètes\nde politiques publiques.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nMobilisation citoyenne\n</h3>\n\n<p>\nEncourager la participation volontaire\ngrâce à l'inscription au Comité,\naux activités de sensibilisation\net aux autres initiatives citoyennes.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nTransparence et responsabilité\n</h3>\n\n<p>\nPromouvoir un fonctionnement responsable,\nune communication publique\net des rapports transparents\nsur les activités du Comité.\n</p>\n\n</article>\n\n</div>\n\n<a href=\"committee.html?lang=fr\"\nclass=\"button\">\nDécouvrir le Comité citoyen →\n</a>\n\n<a href=\"participate.html?lang=fr\"\nclass=\"button\">\nParticiper à l'initiative →\n</a>\n\n</section>\n\n\u003c!-- STATUT INSTITUTIONNEL -->\n\n<section>\n\n<h2>\n8. Statut institutionnel et précisions importantes\n</h2>\n\n<p>\nLa stratégie d'implantation\ndu Centre mondial de l'IA\nprésentée sur ce site\nest une proposition\npromue par le Comité citoyen de promotion.\n</p>\n\n<p>\nElle ne doit pas être interprétée\ncomme un plan de mise en œuvre\nofficiellement approuvé\npar le gouvernement,\nni comme un engagement confirmé\nd'une organisation internationale.\n</p>\n\n<p>\nToute décision future\nconcernant le choix du site,\nla participation institutionnelle,\nla mise à disposition d'installations,\nle soutien financier\nou les modalités opérationnelles\nnécessiterait\ndes consultations appropriées\net une approbation formelle\ndes autorités compétentes.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nLe Comité cherche à promouvoir\nun dialogue constructif\net une planification\nfondée sur des données probantes\nafin de soutenir\nune initiative de coopération internationale\nréaliste et durable.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- CONCLUSION -->\n\n<section>\n\n<h2>\n9. Construire l'avenir ensemble\n</h2>\n\n<p>\nLe projet de Centre mondial de l'IA\noffre une occasion\nd'explorer comment\nla ville spéciale de Goyang\npourrait contribuer\nà la coopération internationale\ntout en se préparant\nà de nouvelles possibilités\nde développement régional.\n</p>\n\n<p>\nLe Comité citoyen de promotion\ncontinuera à promouvoir\nla sensibilisation du public,\ndes discussions constructives\nsur les politiques publiques\net une participation citoyenne responsable.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nL'intelligence artificielle au service de l'humanité.<br>\nLa coopération internationale pour un avenir meilleur.<br>\nUne croissance partagée pour la ville spéciale de Goyang.\n</strong>\n\n</div>\n\n<a href=\"index.html?lang=fr\"\nclass=\"button\">\nAccueil — Version française\n</a>\n\n<a href=\"agencies.html?lang=fr\"\nclass=\"button\">\nOrganisations internationales →\n</a>\n\n<a href=\"participate.html?lang=fr\"\nclass=\"button\">\nParticipation citoyenne →\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIED DE PAGE -->\n\n<footer>\n\n<p>\n<strong>\nInitiative du Centre mondial de l'IA<br>\nVille spéciale de Goyang,<br>\nProvince de Gyeonggi,<br>\nRépublique de Corée\n</strong>\n</p>\n\n<p>\nComité citoyen de promotion\npour l'implantation du Centre mondial de l'IA\ndans la ville spéciale de Goyang\n</p>\n\n<p>\nL'intelligence artificielle\nau service de l'humanité.<br>\nLa coopération internationale\npour un avenir meilleur.\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\">\nAccueil\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=it": "<!DOCTYPE html>\n<html lang=\"it\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<meta name=\"description\"\ncontent=\"Scopri la strategia proposta per l'insediamento del Polo Globale dell'IA nella Città Speciale di Goyang: sei priorità strategiche, cooperazione internazionale, condizioni operative e sviluppo regionale sostenibile.\">\n\n<title>\nStrategia per l'insediamento del Polo Globale dell'IA |\nCittà Speciale di Goyang\n</title>\n\n<style>\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n.intro {\n  font-size: 18px;\n}\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.strategy-number {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 4px 12px;\n  border-radius: 6px;\n  font-size: 14px;\n  margin-bottom: 10px;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  .intro {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- INTESTAZIONE -->\n\n<header>\n\n<h1>\nStrategia per l'insediamento<br>\ndel Polo Globale dell'IA\n</h1>\n\n<p>\nPreparare la Città Speciale di Goyang<br>\nalla cooperazione internazionale,<br>\nall'innovazione responsabile nell'IA<br>\ne allo sviluppo sostenibile\n</p>\n\n<p>\nProvincia di Gyeonggi, Repubblica di Corea\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=it\" class=\"home-link\">\n← Homepage italiana\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- VISIONE -->\n\n<section>\n\n<div class=\"slogan\">\n\nUn nuovo motore di crescita per Goyang.<br>\nNuove opportunità di occupazione.<br>\nUn Polo Globale dell'IA per la cooperazione internazionale.\n\n</div>\n\n</section>\n\n\u003c!-- 1. VISIONE STRATEGICA -->\n\n<section>\n\n<h2>\n1. Visione strategica\n</h2>\n\n<div class=\"intro\">\n\n<p>\nIl Polo Globale dell'IA proposto\nrappresenta un'opportunità\nper la Città Speciale di Goyang\ndi esplorare un nuovo ruolo\ncome centro di cooperazione internazionale\ne di sviluppo responsabile\ndell'intelligenza artificiale.\n</p>\n\n<p>\nL'insediamento di istituzioni internazionali\nrichiede molto più\ndel semplice entusiasmo pubblico.\n</p>\n\n<p>\nSono necessari\nuna valutazione obiettiva\ndei vantaggi territoriali,\npiani di attuazione concreti,\ncoordinamento istituzionale\ne soluzioni operative sostenibili.\n</p>\n\n<p>\nIl Comitato Civico Promotore\nintende elaborare proposte costruttive\nche colleghino le risorse esistenti di Goyang\nalle esigenze dei potenziali partner internazionali.\n</p>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nL'obiettivo non consiste semplicemente\nnell'attirare uffici di organizzazioni internazionali.\n</strong>\n\n<p>\nLa visione più ampia\nè creare le condizioni\nper una cooperazione internazionale significativa,\ngenerando al tempo stesso\nopportunità per la ricerca,\nl'innovazione,\nl'occupazione\ne lo sviluppo regionale sostenibile.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- 2. SEI PRIORITÀ STRATEGICHE -->\n\n<section>\n\n<h2>\n2. Sei priorità strategiche\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- STRATEGIA 01 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nStrategia 01\n</span>\n\n<h3>\nRafforzare la competitività territoriale\n</h3>\n\n<p>\nValutare le risorse esistenti di Goyang,\ntra cui l'accessibilità metropolitana,\nle infrastrutture congressuali internazionali,\nle istituzioni sanitarie,\nl'istruzione,\nle strutture culturali\ne le condizioni di vita.\n</p>\n\n<p>\nElaborare proposte basate su dati concreti\nche rispondano\nalle effettive esigenze\ne ai criteri di valutazione\ndei potenziali partner internazionali.\n</p>\n\n</article>\n\n\u003c!-- STRATEGIA 02 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nStrategia 02\n</span>\n\n<h3>\nCostruire la cooperazione istituzionale\n</h3>\n\n<p>\nEsplorare forme di cooperazione\ntra la Provincia di Gyeonggi,\nla Città Speciale di Goyang,\nle autorità nazionali competenti,\nle università,\ngli istituti di ricerca,\nle imprese\ne la società civile.\n</p>\n\n<p>\nChiarire i potenziali ruoli\ne le responsabilità istituzionali,\nincoraggiando discussioni coordinate\nsulle politiche\ne sulle attività preparatorie.\n</p>\n\n</article>\n\n\u003c!-- STRATEGIA 03 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nStrategia 03\n</span>\n\n<h3>\nSostenere l'insediamento iniziale\n</h3>\n\n<p>\nValutare le condizioni necessarie\naffinché le organizzazioni internazionali\ne le istituzioni partner\npossano avviare\ne mantenere attività operative efficaci.\n</p>\n\n<p>\nLe potenziali esigenze comprendono\nspazi per uffici,\ntrasporti,\nalloggi,\nistruzione,\nassistenza sanitaria\ne altri servizi essenziali.\n</p>\n\n<p>\nLe specifiche misure di sostegno\ndipenderebbero\ndalla legislazione applicabile,\ndalle risorse finanziarie disponibili,\ndalle esigenze istituzionali\ne dalle consultazioni formali.\n</p>\n\n</article>\n\n\u003c!-- STRATEGIA 04 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nStrategia 04\n</span>\n\n<h3>\nAmpliare la cooperazione internazionale\nnell'IA di interesse pubblico\n</h3>\n\n<p>\nEsplorare applicazioni responsabili\ndell'intelligenza artificiale\nnella salute pubblica,\nnella sicurezza alimentare,\nnella protezione climatica e ambientale,\nnella resilienza alle catastrofi,\nnell'occupazione\ne nell'istruzione.\n</p>\n\n<p>\nIndividuare opportunità\ndi ricerca collaborativa,\nprogetti pilota,\nscambio di conoscenze\ne cooperazione pratica\ntra organizzazioni internazionali,\nistituti di ricerca\ne imprese tecnologiche.\n</p>\n\n</article>\n\n\u003c!-- STRATEGIA 05 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nStrategia 05\n</span>\n\n<h3>\nCollegare innovazione, occupazione\ne sviluppo regionale\n</h3>\n\n<p>\nEsplorare modalità\nper collegare l'iniziativa\ndel Polo Globale dell'IA\nalla ricerca e sviluppo,\nall'innovazione tecnologica,\nai servizi professionali\ne alle opportunità\nper le imprese locali.\n</p>\n\n<p>\nPromuovere il dibattito sulle politiche\nrelative all'occupazione di qualità,\nallo sviluppo professionale dei giovani,\nalla formazione delle competenze\ne alla crescita regionale sostenibile.\n</p>\n\n</article>\n\n\u003c!-- STRATEGIA 06 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nStrategia 06\n</span>\n\n<h3>\nIncoraggiare la partecipazione dei cittadini\n</h3>\n\n<p>\nPromuovere la partecipazione volontaria\ndei cittadini\nattraverso l'informazione pubblica,\nle manifestazioni di sostegno online,\nla registrazione al Comitato\ne le attività di sensibilizzazione.\n</p>\n\n<p>\nIncoraggiare un impegno civico responsabile\nbasato su informazioni obiettive,\ndialogo costruttivo\ne proposte politiche realizzabili.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- 3. CONDIZIONI DI INSEDIAMENTO -->\n\n<section>\n\n<h2>\n3. Insediamento iniziale e condizioni operative\n</h2>\n\n<p>\nLa sostenibilità a lungo termine\ndi un centro di cooperazione internazionale\ndipende dalla capacità\ndelle istituzioni partecipanti\ndi operare efficacemente\ne sostenere il proprio personale.\n</p>\n\n<p>\nI seguenti ambiti\nrichiederebbero valutazioni dettagliate\ne consultazioni.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nSpazi per uffici e infrastrutture\n</h3>\n\n<p>\nValutare strutture adeguate\nper le attività istituzionali,\nla ricerca,\ngli incontri internazionali\ne gli scambi professionali.\n</p>\n\n<p>\nLe esigenze potrebbero comprendere\nconnettività digitale,\naccessibilità,\nsicurezza\ne infrastrutture per riunioni.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nTrasporti e accessibilità\n</h3>\n\n<p>\nValutare i collegamenti\ncon gli aeroporti internazionali,\nle principali destinazioni metropolitane,\nle potenziali sedi degli uffici\ne le aree residenziali.\n</p>\n\n<p>\nDovrebbero essere considerate\nl'affidabilità dei trasporti,\nle condizioni degli spostamenti quotidiani\ne l'accessibilità.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nAlloggi e condizioni di vita\n</h3>\n\n<p>\nValutare le opzioni residenziali,\nl'istruzione,\nl'assistenza sanitaria\ne i servizi quotidiani\nper il personale internazionale\ne i familiari accompagnatori.\n</p>\n\n<p>\nLe esigenze effettive\ndipenderebbero\ndalla composizione del personale\ne dai requisiti istituzionali.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nSostegno amministrativo e istituzionale\n</h3>\n\n<p>\nEsplorare il possibile coordinamento\ntra le autorità competenti\nper affrontare\nle esigenze amministrative,\nla cooperazione istituzionale\ne le procedure operative.\n</p>\n\n<p>\nQualsiasi accordo\nsarebbe soggetto\nalle competenze\ne alle procedure di approvazione\ndelle istituzioni interessate.\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\nQuesti elementi rappresentano\nambiti proposti\nper la valutazione della fattibilità.\nNon costituiscono\nimpegni finanziari confermati,\nassegnazioni di strutture\no accordi di sostegno istituzionale.\n</p>\n\n</section>\n\n\u003c!-- 4. QUATTRO FASI DI ATTUAZIONE -->\n\n<section>\n\n<h2>\n4. Dalla preparazione alle attività sostenibili\n</h2>\n\n<p>\nL'iniziativa del Polo Globale dell'IA\nrichiede una pianificazione\nche vada oltre\nil processo iniziale\ndi selezione della sede.\n</p>\n\n<p>\nLe seguenti quattro fasi\ndescrivono un approccio politico proposto,\nnon un calendario di attuazione\nufficialmente approvato.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nFase 01\n</span>\n\n<h3>\nCostruire le basi\n</h3>\n\n<p>\nSviluppare la comprensione pubblica,\nvalutare la competitività territoriale,\ncondurre ricerche sulle politiche\ned esplorare la cooperazione istituzionale.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nFase 02\n</span>\n\n<h3>\nElaborare una proposta concreta\n</h3>\n\n<p>\nPerfezionare le potenziali proposte\ndi insediamento\ne le misure di sostegno operativo\nsulla base delle esigenze istituzionali,\ndei requisiti relativi alla sede\ne dei criteri di valutazione pertinenti.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nFase 03\n</span>\n\n<h3>\nSostenere l'insediamento iniziale\n</h3>\n\n<p>\nQualora una sede venga formalmente selezionata,\nesplorare soluzioni\nper gli spazi destinati agli uffici,\nle condizioni di vita\ne il coordinamento amministrativo\nattraverso consultazioni\ncon le autorità competenti.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\nFase 04\n</span>\n\n<h3>\nAmpliare la cooperazione internazionale\n</h3>\n\n<p>\nEsplorare opportunità\ndi ricerca collaborativa,\nprogetti pilota,\nconferenze internazionali,\nformazione professionale\ne partenariati a lungo termine.\n</p>\n\n</article>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nPreparazione\n→ Proposta concreta\n→ Insediamento iniziale\n→ Cooperazione sostenibile\n</strong>\n\n<p>\nL'attuazione dipenderebbe\ndalle decisioni istituzionali,\ndalle risorse disponibili\ne dagli accordi formali.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- 5. COOPERAZIONE IN TRE FASI -->\n\n<section>\n\n<h2>\n5. Quadro di cooperazione in tre fasi\n</h2>\n\n<p>\nParallelamente all'approccio attuativo\narticolato in quattro fasi,\nl'iniziativa propone\ntre priorità a lungo termine\nper le istituzioni partecipanti.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nFase 1 — Insediamento iniziale\n</h3>\n\n<p>\nIndividuare le condizioni fisiche,\namministrative\ne abitative necessarie\naffinché le potenziali organizzazioni partecipanti\npossano avviare le proprie attività.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nFase 2 — Supporto operativo\n</h3>\n\n<p>\nEsplorare meccanismi\ndi coordinamento istituzionale,\ncooperazione nella ricerca,\nsperimentazione tecnologica,\nincontri internazionali\ne scambi professionali.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nFase 3 — Crescita condivisa\n</h3>\n\n<p>\nRicercare opportunità\naffinché le organizzazioni internazionali\npossano perseguire\ni rispettivi mandati istituzionali,\ncontribuendo al tempo stesso\nalla collaborazione nella ricerca,\nall'innovazione\ne allo sviluppo regionale sostenibile.\n</p>\n\n</article>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nInsediamento iniziale\n→ Supporto operativo\n→ Crescita condivisa\n</strong>\n\n<p>\nQuesto quadro costituisce\nuna proposta strategica.\nLe misure specifiche\nrichiederebbero consultazioni\ne decisioni formali\nda parte delle istituzioni competenti.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- 6. OCCUPAZIONE ED ECONOMIA -->\n\n<section>\n\n<h2>\n6. Occupazione e sviluppo economico regionale\n</h2>\n\n<p>\nUn obiettivo importante\ndell'iniziativa del Polo Globale dell'IA\nè esplorare come\nla cooperazione internazionale\npossa creare nuove opportunità\nper l'economia regionale di Goyang.\n</p>\n\n<p>\nSe la cooperazione istituzionale\ndovesse ampliarsi,\nle potenziali attività\npotrebbero comprendere\nricerca e sviluppo nell'IA,\nservizi professionali,\nconferenze internazionali,\nprogrammi di formazione\ne sviluppo di imprese tecnologiche.\n</p>\n\n<p>\nCollegare queste attività\nalle imprese locali,\nalle università\ne ai giovani professionisti\ncostituirebbe un'importante\nconsiderazione politica a lungo termine.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nRicerca e innovazione\n</h3>\n\n<p>\nPotenziale collaborazione\ntra università,\nistituti di ricerca,\nimprese tecnologiche\ne organizzazioni internazionali.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nOccupazione qualificata\n</h3>\n\n<p>\nPotenziali opportunità\nnella ricerca,\nnell'analisi dei dati,\nnella cooperazione internazionale,\nnella traduzione,\nnella gestione di conferenze\ne nei servizi professionali.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nSviluppo professionale dei giovani\n</h3>\n\n<p>\nOpportunità di esplorare\nprogrammi di formazione,\nsviluppo delle competenze,\nscambi professionali\ne percorsi di carriera\nlegati all'IA\ne alla cooperazione internazionale.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nOpportunità per le imprese locali\n</h3>\n\n<p>\nPotenziali collegamenti\ntra la cooperazione internazionale\ne i fornitori locali di servizi,\nle imprese tecnologiche\ne le reti di innovazione.\n</p>\n\n</article>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nIl Polo Globale dell'IA proposto\nmira a collegare\nla cooperazione internazionale\nall'innovazione sostenibile,\nalle opportunità occupazionali\ne allo sviluppo economico regionale.\n</strong>\n\n</div>\n\n<p class=\"note\">\nGli effetti economici effettivi,\ngli investimenti\ne i risultati occupazionali\ndipenderebbero\ndalla dimensione,\ndalla struttura\ne dall'attuazione\ndei progetti futuri.\nNon viene garantito\nalcun risultato specifico.\n</p>\n\n<a href=\"goyang.html?lang=it\"\nclass=\"button\">\nScopri i vantaggi territoriali di Goyang\n</a>\n\n</section>\n\n\u003c!-- 7. RUOLO DEL COMITATO -->\n\n<section>\n\n<h2>\n7. Ruolo del Comitato Civico Promotore\n</h2>\n\n<p>\nIl Comitato Civico Promotore\nè un'iniziativa civica\nche sostiene la proposta\ndi insediamento\ndel Polo Globale dell'IA\nnella Città Speciale di Goyang.\n</p>\n\n<p>\nIl Comitato intende\nincoraggiare la partecipazione pubblica,\npromuovere il dibattito sulle politiche\ne sensibilizzare l'opinione pubblica\nsulle potenziali opportunità\ndi cooperazione internazionale\ne sviluppo regionale.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nConsultazione pubblica\n</h3>\n\n<p>\nRaccogliere le opinioni dei cittadini\nattraverso la comunicazione pubblica,\nla partecipazione online\ne il coinvolgimento delle comunità locali.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nRicerca e proposte politiche\n</h3>\n\n<p>\nEsaminare la competitività territoriale,\ni requisiti istituzionali\ne i potenziali modelli di cooperazione\nper elaborare proposte politiche concrete.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nCoinvolgimento dei cittadini\n</h3>\n\n<p>\nIncoraggiare la partecipazione volontaria\nattraverso la registrazione al Comitato,\nle attività di sensibilizzazione pubblica\ne altre iniziative civiche.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nTrasparenza e responsabilità\n</h3>\n\n<p>\nPromuovere una gestione responsabile,\nuna comunicazione pubblica efficace\ne una rendicontazione trasparente\ndelle attività del Comitato.\n</p>\n\n</article>\n\n</div>\n\n<a href=\"committee.html?lang=it\"\nclass=\"button\">\nScopri il Comitato Civico Promotore\n</a>\n\n<a href=\"participate.html?lang=it\"\nclass=\"button\">\nPartecipazione dei cittadini\n</a>\n\n</section>\n\n\u003c!-- 8. CHIARIMENTI ISTITUZIONALI -->\n\n<section>\n\n<h2>\n8. Stato istituzionale e chiarimenti importanti\n</h2>\n\n<p>\nLa strategia per l'insediamento\ndel Polo Globale dell'IA\npresentata su questo sito\nè una proposta promossa\ndal Comitato Civico Promotore.\n</p>\n\n<p>\nNon deve essere interpretata\ncome un piano governativo\nufficialmente approvato\nné come un impegno confermato\nda parte di alcuna organizzazione internazionale.\n</p>\n\n<p>\nQualsiasi futura decisione\nrelativa alla sede,\nalla partecipazione istituzionale,\nalla disponibilità di strutture,\nal sostegno finanziario\no alle modalità operative\nrichiederebbe consultazioni appropriate\ne approvazioni formali\nda parte delle autorità responsabili.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nIl Comitato intende promuovere\nun dialogo costruttivo\ne una pianificazione basata su dati concreti\nper sostenere\nun'iniziativa di cooperazione internazionale\nrealistica e sostenibile.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- 9. COSTRUIRE IL FUTURO -->\n\n<section>\n\n<h2>\n9. Costruire insieme il futuro\n</h2>\n\n<p>\nIl Polo Globale dell'IA proposto\noffre l'opportunità\ndi esplorare come\nla Città Speciale di Goyang\npossa contribuire\nalla cooperazione internazionale,\npreparandosi al tempo stesso\na nuove opportunità\ndi sviluppo regionale.\n</p>\n\n<p>\nIl Comitato Civico Promotore\ncontinuerà a promuovere\nla sensibilizzazione pubblica,\nun dibattito costruttivo sulle politiche\ne una partecipazione civica responsabile.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nIntelligenza artificiale al servizio dell'umanità.<br>\nCooperazione internazionale per un futuro migliore.<br>\nCrescita condivisa per la Città Speciale di Goyang.\n</strong>\n\n</div>\n\n<a href=\"index.html?lang=it\"\nclass=\"button\">\nHomepage italiana\n</a>\n\n<a href=\"agencies.html?lang=it\"\nclass=\"button\">\nOrganizzazioni internazionali\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIÈ DI PAGINA -->\n\n<footer>\n\n<p>\n<strong>\nIniziativa per un Polo Globale dell'IA<br>\nCittà Speciale di Goyang,<br>\nProvincia di Gyeonggi,<br>\nRepubblica di Corea\n</strong>\n</p>\n\n<p>\nComitato Civico Promotore\nper l'insediamento del Polo Globale dell'IA\nnella Città Speciale di Goyang\n</p>\n\n<p>\nIntelligenza artificiale al servizio dell'umanità.<br>\nCooperazione internazionale per un futuro migliore.\n</p>\n\n<p>\n<a href=\"index.html?lang=it\">\nHomepage italiana\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=ja": "<!DOCTYPE html>\n<html lang=\"ja\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<meta name=\"description\"\ncontent=\"高陽特例市グローバルAIハブ誘致戦略。6つの重点戦略、国際機関の初期拠点整備、運営支援、4段階の実施計画、3段階の国際協力体制、雇用創出と持続可能な地域発展について紹介します。\">\n\n<title>\nグローバルAIハブ誘致戦略 |\n高陽特例市\n</title>\n\n<style>\n\n/* =====================================\n   基本設定\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n\n  font-family:\n    \"Noto Sans JP\",\n    \"Hiragino Kaku Gothic ProN\",\n    \"Yu Gothic\",\n    Meiryo,\n    Arial,\n    sans-serif;\n\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ヘッダー\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   メインコンテンツ\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   スローガン\n===================================== */\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n.intro {\n  font-size: 18px;\n}\n\n/* =====================================\n   強調表示\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n/* =====================================\n   グリッド\n===================================== */\n\n.grid {\n  display: grid;\n\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.strategy-number {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 4px 12px;\n  border-radius: 6px;\n  font-size: 14px;\n  margin-bottom: 10px;\n}\n\n/* =====================================\n   ボタン\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   フッター\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   モバイル対応\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  .intro {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ヘッダー\n===================================== -->\n\n<header>\n\n<h1>\nグローバルAIハブ誘致戦略\n</h1>\n\n<p>\n国際協力、責任あるAIイノベーション、<br>\n持続可能な発展に向けた<br>\n高陽特例市の準備\n</p>\n\n<p>\n大韓民国・京畿道\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=ja\"\nclass=\"home-link\">\n← 日本語ホーム\n</a>\n\n<a href=\"strategy.html\"\nclass=\"home-link\"\nlang=\"ko\">\n한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     ビジョン\n===================================== -->\n\n<section>\n\n<div class=\"slogan\">\n\n高陽特例市の新たな成長エンジン。<br>\n雇用の新たな機会。<br>\n国際協力のためのグローバルAIハブ。\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     1. 戦略的ビジョン\n===================================== -->\n\n<section>\n\n<h2>\n1. 戦略的ビジョン\n</h2>\n\n<div class=\"intro\">\n\n<p>\n構想中のグローバルAIハブは、\n高陽特例市が\n国際協力と責任ある人工知能の\n拠点として新たな役割を\n模索する機会となります。\n</p>\n\n<p>\n国際機関の誘致を成功させるには、\n市民の熱意だけでは\n十分ではありません。\n</p>\n\n<p>\n立地上の優位性に関する\n客観的な評価、\n実践的な実施計画、\n関係機関の連携、\n持続可能な運営体制が\n必要です。\n</p>\n\n<p>\n市民推進委員会は、\n高陽特例市の既存資源と\n将来の国際協力機関のニーズを\n結び付ける建設的な提案の\n策定を目指しています。\n</p>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n目標は単に国際機関の事務所を\n誘致することではありません。\n</strong>\n\n<p>\nより広いビジョンは、\n実質的な国際協力のための\n条件を整備するとともに、\n研究、\nイノベーション、\n雇用、\n持続可能な地域発展の\n機会を創出することです。\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     2. 6つの重点戦略\n===================================== -->\n\n<section>\n\n<h2>\n2. 6つの重点戦略\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- Strategy 01 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\n戦略 01\n</span>\n\n<h3>\n立地競争力の強化\n</h3>\n\n<p>\n首都圏へのアクセス、\n国際コンベンション施設、\n医療機関、\n教育、\n文化施設、\n生活環境など、\n高陽特例市の既存資源を\n評価します。\n</p>\n\n<p>\n将来の国際協力機関の\n実際の要件や評価基準に\n対応する、\n客観的な根拠に基づく\n政策提案を策定します。\n</p>\n\n</article>\n\n\u003c!-- Strategy 02 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\n戦略 02\n</span>\n\n<h3>\n関係機関との協力体制の構築\n</h3>\n\n<p>\n京畿道、\n高陽特例市、\n関係する中央政府機関、\n大学、\n研究機関、\n企業、\n市民社会の間での\n協力の可能性を探ります。\n</p>\n\n<p>\n関係機関の潜在的な役割と\n責任を明確にし、\n調整された政策議論や\n準備活動を促進します。\n</p>\n\n</article>\n\n\u003c!-- Strategy 03 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\n戦略 03\n</span>\n\n<h3>\n初期拠点の整備支援\n</h3>\n\n<p>\n国際機関や協力機関が\n効果的な活動を開始し、\n継続できるよう、\n必要な条件を評価します。\n</p>\n\n<p>\n想定される要件には、\n事務所施設、\n交通、\n住宅、\n教育、\n医療、\nその他の基本サービスが\n含まれます。\n</p>\n\n<p>\n具体的な支援措置は、\n適用される法令、\n利用可能な予算、\n機関ごとの要件、\n正式な協議の結果に\n左右されます。\n</p>\n\n</article>\n\n\u003c!-- Strategy 04 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\n戦略 04\n</span>\n\n<h3>\n公益のためのAI国際協力の拡大\n</h3>\n\n<p>\n公衆衛生、\n食料安全保障、\n気候変動、\n環境保護、\n災害への対応力、\n雇用、\n教育などの分野における\n責任あるAI活用の可能性を\n探ります。\n</p>\n\n<p>\n国際機関、\n研究機関、\n技術企業の間で、\n共同研究、\n実証事業、\n知識交流、\n実践的な協力の機会を\n特定します。\n</p>\n\n</article>\n\n\u003c!-- Strategy 05 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\n戦略 05\n</span>\n\n<h3>\nイノベーションと雇用・地域発展の連携\n</h3>\n\n<p>\nグローバルAIハブ構想を、\n研究開発、\n技術革新、\n専門サービス、\n地域企業の事業機会と\n結び付ける方法を探ります。\n</p>\n\n<p>\n質の高い雇用、\n若者の能力開発、\n技能訓練、\n持続可能な地域成長に関する\n政策議論を促進します。\n</p>\n\n</article>\n\n\u003c!-- Strategy 06 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\n戦略 06\n</span>\n\n<h3>\n市民参加の促進\n</h3>\n\n<p>\n情報提供、\nオンラインでの支持表明、\n委員会への登録、\n広報活動を通じて、\n市民の自発的な参加を\n促進します。\n</p>\n\n<p>\n客観的な情報、\n建設的な対話、\n実現可能な政策提案に基づく、\n責任ある市民参加を\n奨励します。\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. 初期拠点の整備と運営条件\n===================================== -->\n\n<section>\n\n<h2>\n3. 初期拠点の整備と運営条件\n</h2>\n\n<p>\n国際協力拠点の長期的な存続可能性は、\n参加機関が効果的に活動し、\n職員を支援できるかどうかに\n左右されます。\n</p>\n\n<p>\n以下の分野については、\n詳細な評価と協議が\n必要です。\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\n事務所スペースと施設\n</h3>\n\n<p>\n機関の運営、\n研究活動、\n国際会議、\n専門家交流に適した\n施設を評価します。\n</p>\n\n<p>\n必要な条件には、\nデジタル接続環境、\nアクセシビリティ、\nセキュリティ、\n会議インフラなどが\n含まれる可能性があります。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n交通とアクセス\n</h3>\n\n<p>\n国際空港、\n首都圏の主要拠点、\n候補となる事務所の立地、\n住宅地へのアクセスを\n評価します。\n</p>\n\n<p>\n交通の信頼性、\n通勤環境、\n移動の利便性を\n考慮する必要があります。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n住宅と生活環境\n</h3>\n\n<p>\n国際機関の職員と\n同行する家族のための\n住宅、\n教育、\n医療、\n日常生活サービスを\n評価します。\n</p>\n\n<p>\n実際のニーズは、\n人員配置や\n機関ごとの要件に\n左右されます。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n行政・制度面の支援\n</h3>\n\n<p>\n行政上の要件、\n機関間協力、\n運営手続きに対応するため、\n関係当局の間での\n連携の可能性を探ります。\n</p>\n\n<p>\nあらゆる措置は、\n関係機関の権限と\n承認手続きに従う\n必要があります。\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\nこれらは実現可能性を評価するための\n提案分野であり、\n財政支援、\n施設の提供、\n機関間支援協定などが\n確定していることを\n意味するものではありません。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     4. 準備から持続可能な運営へ\n===================================== -->\n\n<section>\n\n<h2>\n4. 準備から持続可能な運営へ\n</h2>\n\n<p>\nグローバルAIハブ構想には、\n初期の立地選定過程を超えた\n長期的な計画が必要です。\n</p>\n\n<p>\n以下の4段階は、\n提案されている政策的な進め方を\n示したものであり、\n正式に承認された\n実施日程ではありません。\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- Phase 01 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\n第1段階\n</span>\n\n<h3>\n基盤構築\n</h3>\n\n<p>\n市民の理解を深め、\n立地競争力を評価し、\n政策研究を実施するとともに、\n関係機関との協力の可能性を\n探ります。\n</p>\n\n</article>\n\n\u003c!-- Phase 02 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\n第2段階\n</span>\n\n<h3>\n実践的な提案の策定\n</h3>\n\n<p>\n関係機関のニーズ、\n立地条件、\n関連する評価基準に基づき、\n誘致提案と運営支援策を\n具体化します。\n</p>\n\n</article>\n\n\u003c!-- Phase 03 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\n第3段階\n</span>\n\n<h3>\n初期拠点の整備支援\n</h3>\n\n<p>\n立地が正式に選定された場合、\n関係当局との協議を通じて、\n事務所施設、\n生活環境、\n行政上の連携に関する\n支援措置を検討します。\n</p>\n\n</article>\n\n\u003c!-- Phase 04 -->\n\n<article class=\"card\">\n\n<span class=\"strategy-number\">\n第4段階\n</span>\n\n<h3>\n国際協力の拡大\n</h3>\n\n<p>\n共同研究、\n実証事業、\n国際会議、\n専門研修、\n長期的な協力関係の\n可能性を探ります。\n</p>\n\n</article>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n基盤構築\n→ 実践的な提案の策定\n→ 初期拠点の整備\n→ 持続可能な国際協力\n</strong>\n\n<p>\n実施には、\n関係機関の決定、\n利用可能な資源、\n正式な合意が必要です。\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     5. 3段階の協力体制\n===================================== -->\n\n<section>\n\n<h2>\n5. 3段階の協力体制\n</h2>\n\n<p>\n4段階の実施計画に加え、\n本構想では、\n参加機関のための\n3つの長期的な重点課題を\n提案しています。\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- Stage 1 -->\n\n<article class=\"card\">\n\n<h3>\n第1段階 — 初期拠点の整備\n</h3>\n\n<p>\n参加を検討する機関が\n活動を開始するために必要な\n物理的条件、\n行政上の条件、\n生活環境を\n明確にします。\n</p>\n\n</article>\n\n\u003c!-- Stage 2 -->\n\n<article class=\"card\">\n\n<h3>\n第2段階 — 運営支援\n</h3>\n\n<p>\n機関間の連携、\n研究協力、\n技術実証、\n国際会議、\n専門家交流のための\n仕組みを検討します。\n</p>\n\n</article>\n\n\u003c!-- Stage 3 -->\n\n<article class=\"card\">\n\n<h3>\n第3段階 — 共生発展\n</h3>\n\n<p>\n国際機関がそれぞれの使命を\n果たすとともに、\n共同研究、\nイノベーション、\n持続可能な地域発展に\n貢献できる機会を\n模索します。\n</p>\n\n</article>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n初期拠点の整備\n→ 運営支援\n→ 共生発展\n</strong>\n\n<p>\nこの枠組みは戦略的な提案です。\n具体的な措置には、\n関係機関との協議と\n正式な決定が必要です。\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     6. 雇用創出と地域経済の発展\n===================================== -->\n\n<section>\n\n<h2>\n6. 雇用創出と地域経済の発展\n</h2>\n\n<p>\nグローバルAIハブ構想の\n重要な目標の一つは、\n国際協力が高陽特例市の\n地域経済にどのような\n新しい機会をもたらすかを\n探ることです。\n</p>\n\n<p>\n機関間協力が拡大した場合、\nAI研究開発、\n専門サービス、\n国際会議、\n研修プログラム、\n技術関連事業の発展などが\n想定されます。\n</p>\n\n<p>\nこれらの活動を\n地域企業、\n大学、\n若手専門人材と\n結び付けることは、\n重要な長期的政策課題となります。\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\n研究とイノベーション\n</h3>\n\n<p>\n大学、\n研究機関、\n技術企業、\n国際機関の間での\n協力の可能性。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n専門職雇用\n</h3>\n\n<p>\n研究、\nデータ分析、\n国際協力、\n翻訳、\n会議運営、\n専門サービスなどにおける\n雇用機会の可能性。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n若者の能力開発\n</h3>\n\n<p>\nAIと国際協力に関連する\n研修、\n技能開発、\n専門家交流、\nキャリア形成の機会。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n地域企業の事業機会\n</h3>\n\n<p>\n国際協力と\n地域のサービス事業者、\n技術企業、\nイノベーションネットワークとの\n連携の可能性。\n</p>\n\n</article>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nグローバルAIハブ構想は、\n国際協力を\n持続可能なイノベーション、\n雇用機会、\n地域経済の発展と\n結び付けることを目指しています。\n</strong>\n\n</div>\n\n<p class=\"note\">\n実際の経済効果、\n投資、\n雇用創出の成果は、\n将来の事業規模、\n構造、\n実施状況によって異なります。\n特定の成果が保証されるものではありません。\n</p>\n\n<a href=\"goyang.html?lang=ja\"\nclass=\"button\">\n高陽特例市の立地上の強みを見る\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     7. 市民推進委員会の役割\n===================================== -->\n\n<section>\n\n<h2>\n7. 市民推進委員会の役割\n</h2>\n\n<p>\n市民推進委員会は、\n高陽特例市への\nグローバルAIハブ誘致構想を\n支持する市民主体の取り組みです。\n</p>\n\n<p>\n委員会は、\n市民参加を促進し、\n政策議論を活性化するとともに、\n国際協力と地域発展の\n潜在的な機会に対する\n理解を広げることを\n目指しています。\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\n市民との意見交換\n</h3>\n\n<p>\n情報発信、\nオンライン参加、\n地域社会との交流を通じて、\n市民の意見を収集します。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n政策研究と提案\n</h3>\n\n<p>\n立地競争力、\n機関ごとの要件、\n潜在的な協力モデルを検討し、\n実践的な政策提案を策定します。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n市民参加\n</h3>\n\n<p>\n委員会への登録、\n広報活動、\nその他の市民活動を通じて、\n自発的な参加を促進します。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n透明性と説明責任\n</h3>\n\n<p>\n責任ある運営、\n市民への情報提供、\n委員会活動の透明な報告を\n促進します。\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     8. 制度的位置づけと重要事項\n===================================== -->\n\n<section>\n\n<h2>\n8. 制度的位置づけと重要事項\n</h2>\n\n<p>\n本ウェブサイトで紹介する\nグローバルAIハブ誘致戦略は、\n市民推進委員会が提案する\n構想です。\n</p>\n\n<p>\n政府によって正式に承認された\n実施計画、\nまたは国際機関による\n参加の確約として\n解釈されるべきものではありません。\n</p>\n\n<p>\n将来の立地決定、\n機関の参加、\n施設の提供、\n財政支援、\n運営体制の整備には、\n関係当局との適切な協議と\n正式な承認が必要です。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n委員会は、\n現実的かつ持続可能な\n国際協力構想を支えるため、\n建設的な対話と\n客観的な根拠に基づく\n計画策定を目指しています。\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     9. ともに未来を築く\n===================================== -->\n\n<section>\n\n<h2>\n9. ともに未来を築く\n</h2>\n\n<p>\nグローバルAIハブ構想は、\n高陽特例市が\n新たな地域発展の機会に備えながら、\n国際協力に貢献する方法を\n模索する機会を提供します。\n</p>\n\n<p>\n市民推進委員会は、\n市民の理解促進、\n建設的な政策議論、\n責任ある市民参加を\n引き続き推進します。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n人類のための人工知能。<br>\nより良い未来に向けた国際協力。<br>\n高陽特例市の共生発展。\n</strong>\n\n</div>\n\n<a href=\"index.html?lang=ja\"\nclass=\"button\">\n日本語ホームページ\n</a>\n\n<a href=\"agencies.html?lang=ja\"\nclass=\"button\">\n国際機関について\n</a>\n\n<a href=\"strategy.html\"\nclass=\"button\"\nlang=\"ko\">\n韓国語原文を見る\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     フッター\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nグローバルAIハブ構想<br>\n大韓民国・京畿道 高陽特例市\n</strong>\n</p>\n\n<p>\n高陽特例市グローバルAIハブ誘致<br>\n市民推進委員会\n</p>\n\n<p>\n人類のための人工知能。<br>\nより良い未来に向けた国際協力。\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ja\">\n日本語ホーム\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"strategy.html\"\nlang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=ru": "<!DOCTYPE html>\n<html lang=\"ru\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<meta name=\"description\"\ncontent=\"Стратегия привлечения Глобального центра искусственного интеллекта в особый город Коян: шесть стратегических приоритетов, международное сотрудничество, поддержка деятельности организаций и устойчивое региональное развитие.\">\n\n<title>\nСтратегия привлечения Глобального центра ИИ |\nОсобый город Коян\n</title>\n\n<style>\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight
