const supabase = createClient(

);

/* 화면 요소 */

const message =
  document.getElementById("message");

const listView =
  document.getElementById("listView");

const detailView =
  document.getElementById("detailView");

/* =====================================
   안내 메시지
===================================== */

function showMessage(text, isError = false) {

  message.textContent = text;

  message.style.color =
    isError ? "#b91c1c" : "#0754a6";

}

/* =====================================
   화면 전환
===================================== */

function showView(view) {

  listView.hidden = true;
  detailView.hidden = true;
  writeView.hidden = true;

  view.hidden = false;

}

/* =====================================
   회원 권한 확인
===================================== */

async function checkMember() {

  const { data, error } =
    await supabase.auth.getUser();

  if (error || !data.user) {
    currentUser = null;
    approvedMember = false;
    return;
  }

  currentUser = data.user;

  const result =
    await supabase.rpc("is_approved_member");

  if (result.error) {
    approvedMember = false;
    showMessage(
      "회원 권한 확인 중 오류가 발생했습니다.",
      true
    );
    return;
  }

  approvedMember = result.data === true;

  writeButton.hidden = !approvedMember;

}

/* =====================================
   게시글 목록
===================================== */

async function loadPosts() {

  showView(listView);

  showMessage("게시글을 불러오고 있습니다.");

  const { data, error } =
    await supabase
      .from("board_posts")
      .select("id, title, created_at")
      .order("created_at", {
        ascending: false
      });

  if (error) {
    showMessage(
      "게시글을 불러오지 못했습니다.\n" +
      error.message,
      true
    );
    return;
  }

  postList.replaceChildren();

  if (data.length === 0) {
    showMessage(
      "아직 등록된 게시글이 없습니다."
    );
    return;
  }

  data.forEach(post => {

    const row =
      document.createElement("tr");

    const idCell =
      document.createElement("td");

    idCell.textContent = post.id;

    const titleCell =
      document.createElement("td");

    const titleButton =
      document.createElement("button");

    titleButton.type = "button";
    titleButton.className = "post-title";
    titleButton.textContent = post.title;

    titleButton.style.background = "none";
    titleButton.style.border = "none";
    titleButton.style.padding = "0";
    titleButton.style.textAlign = "left";

    titleButton.addEventListener("click", () => {
      openPost(post.id);
    });

    titleCell.appendChild(titleButton);

    const dateCell =
      document.createElement("td");

    dateCell.textContent =
      new Date(post.created_at)
        .toLocaleDateString("ko-KR");

    row.append(
      idCell,
      titleCell,
      dateCell
    );

    postList.appendChild(row);

  });

  showMessage(
    `게시글 ${data.length}건을 불러왔습니다.`
  );

}

/* =====================================
   게시글 상세 보기
===================================== */

async function openPost(postId) {

  const { data, error } =
    await supabase
      .from("board_posts")
      .select("id, title, content, created_at")
      .eq("id", postId)
      .single();

  if (error) {
    showMessage(
      "게시글을 불러오지 못했습니다.",
      true
    );
    return;
  }

  document.getElementById("detailTitle")
    .textContent = data.title;

  document.getElementById("detailDate")
    .textContent =
      new Date(data.created_at)
        .toLocaleString("ko-KR");

 document.getElementById("detailContent")
    .textContent = data.content;

  showView(detailView);

  /* 첨부사진 불러오기 */

  await loadPostImages(data.id);

  showMessage("");

}

/* =====================================
   글쓰기
===================================== */

writeButton.addEventListener("click", () => {

  if (!approvedMember) {
    showMessage(
      "관리자 승인을 받은 회원만 글을 작성할 수 있습니다.",
      true
    );
    return;
  }

  postForm.reset();

  showView(writeView);

  showMessage("");

});

/* =====================================
   게시글 등록
===================================== */

postForm.addEventListener("submit", async event => {

  event.preventDefault();

  if (!currentUser || !approvedMember) {
    showMessage(
      "글쓰기 권한이 없습니다.",
      true
    );
    return;
  }

  const title =
    document.getElementById("postTitle")
      .value.trim();

  const content =
    document.getElementById("postContent")
      .value.trim();

  if (!title || !content) {
    showMessage(
      "제목과 내용을 입력해 주세요.",
      true
    );
    return;
  }

  submitButton.disabled = true;

  showMessage("게시글을 등록하고 있습니다.");

  try {

    /* 게시글 저장 */

const { data: post, error: postError } =
  await supabase
    .from("board_posts")
    .insert({
      author_id: currentUser.id,
      title: title,
      content: content
    })
    .select("id")
    .single();

if (postError) {
  throw postError;
}

/* =====================================
   사진 최대 10장 업로드
===================================== */

const selectedPhotos = Array.from(
  document.getElementById("photoFiles").files
);

const allowedTypes = [
  "image/jpeg",
  "image/png",
  "image/webp",
  "image/gif"
];

const maxFileSize = 20 * 1024 * 1024;

/* 사진 개수 검사 */

if (selectedPhotos.length > 10) {
  throw new Error(
    "사진은 최대 10장까지 첨부할 수 있습니다."
  );
}

/* 업로드 전 파일 검사 */

for (const file of selectedPhotos) {

  if (!allowedTypes.includes(file.type)) {
    throw new Error(
      "지원하지 않는 사진 형식입니다: " +
      file.name
    );
  }

  if (file.size > maxFileSize) {
    throw new Error(
      "20MB를 초과한 사진이 있습니다: " +
      file.name
    );
  }

}

/* 이번 작업에서 업로드한 파일 기록 */

const uploadedFiles = [];

try {

  for (const file of selectedPhotos) {

    showMessage(
      `사진 업로드 중... ` +
      `${uploadedFiles.length + 1}/${selectedPhotos.length}`
    );

    const extension =
      file.name.split(".").pop().toLowerCase();

    const filePath =
      currentUser.id + "/" +
      crypto.randomUUID() + "." + extension;

    /* Storage 업로드 */

    const { error: uploadError } =
      await supabase.storage
        .from("board-images")
        .upload(filePath, file, {
          contentType: file.type,
          upsert: false
        });

    if (uploadError) {
      throw uploadError;
    }

    uploadedFiles.push(filePath);

    /* 첨부정보 등록 */

    const { error: attachmentError } =
      await supabase
        .from("board_attachments")
        .insert({
          post_id: post.id,
          uploader_id: currentUser.id,
          file_name: file.name,
          file_path: filePath,
          file_type: file.type,
          file_size: file.size,
          attachment_type: "image"
        });

    if (attachmentError) {
      throw attachmentError;
    }

  }

} catch (error) {

  console.error(
    "사진 업로드 오류:",
    error
  );

  /* 업로드한 파일 정리 시도 */

  if (uploadedFiles.length > 0) {

    const { error: cleanupError } =
      await supabase.storage
        .from("board-images")
        .remove(uploadedFiles);

    if (cleanupError) {
      console.error(
        "사진 정리 실패:",
        cleanupError
      );
    }

  }

  throw error;

}

/* =====================================
   문서파일 업로드
===================================== */

const selectedDocuments = Array.from(
  document.getElementById("documentFiles").files
);

/* 문서 선택 여부 확인 */

console.log(
  "선택된 문서파일:",
  selectedDocuments
);

alert(
  "문서 업로드 코드 실행 확인\n" +
  "선택된 파일 수: " +
  selectedDocuments.length
);

const allowedExtensions = [
  "pdf",
  "hwp",
  "hwpx",
  "doc",
  "docx",
  "xls",
  "xlsx",
  "ppt",
  "pptx",
  "zip"
];

const maxDocumentSize = 20 * 1024 * 1024;

/* 파일 검사 */

for (const file of selectedDocuments) {

  const extension =
    file.name.split(".").pop().toLowerCase();

  if (!allowedExtensions.includes(extension)) {
    throw new Error(
      "지원하지 않는 문서 형식입니다: " +

    );
  }

  if (file.size > maxDocumentSize) {
    throw new Error(
      "문서파일은 개당 20MB 이하만 가능합니다: " +
      file.name
    );
  }

}

/* 문서 업로드 */

for (const file of selectedDocuments) {

  const extension =
    file.name.split(".").pop().toLowerCase();

  const filePath =
    currentUser.id + "/" +
    crypto.randomUUID() + "." + extension;

  showMessage(
    "문서파일을 업로드하고 있습니다: " +

  );

  const { error: uploadError } =
    await supabase.storage

      .upload(filePath, file, {
        contentType:
          file.type || "application/octet-stream",
        upsert: false
      });

  if (uploadError) {
    throw new Error(
      "문서 업로드 실패: " +
      uploadError.message
    );
  }

  /* 첨부정보 등록 */

  const { error: attachmentError } =
    await supabase
      .from("board_attachments")
      .insert({
        post_id: post.id,
        uploader_id: currentUser.id,
        file_name: file.name,
        file_path: filePath,
        file_type:
          file.type || "application/octet-stream",
        file_size: file.size,
        attachment_type: "document"
      });

  if (attachmentError) {
    throw new Error(
      "문서는 Storage에 저장되었지만 " +
      "첨부정보 등록에 실패했습니다.\n" +
      "오류 코드: " +
      (attachmentError.code || "없음") +
      "\n오류 내용: " +
      attachmentError.message
    );
  }

}
    
    postForm.reset();

    await loadPosts();

    showMessage(
      "게시글이 정상적으로 등록되었습니다."
    );

  } catch (error) {

    showMessage(
      "게시글 등록 중 오류가 발생했습니다.\n" +
      error.message,
      true
    );

  } finally {

    submitButton.disabled = false;

  }

});

async function initialize() {

  await checkMember();

  await loadPosts();

}

/* =====================================
   사진 미리보기
===================================== */

const photoFiles =
  document.getElementById("photoFiles");

const photoPreview =
  document.getElementById("photoPreview");

photoFiles.addEventListener("change", () => {

  photoPreview.replaceChildren();

  const files = Array.from(photoFiles.files);

  if (files.length > 10) {
    alert("사진은 최대 10장까지 첨부할 수 있습니다.");
    photoFiles.value = "";
    return;
  }

  files.forEach(file => {

    if (![
      "image/jpeg",
      "image/png",
      "image/webp",
      "image/gif"
    ].includes(file.type)) {
      alert("지원하지 않는 사진 형식입니다.");
      photoFiles.value = "";
      photoPreview.replaceChildren();
      return;
    }

    if (file.size > 20 * 1024 * 1024) {
      alert("사진은 파일당 20MB 이하만 가능합니다.");
      photoFiles.value = "";
      photoPreview.replaceChildren();
      return;
    }

    const img = document.createElement("img");

    const url = URL.createObjectURL(file);

    img.src = url;

    img.onload = () => {
      URL.revokeObjectURL(url);
    };

    photoPreview.appendChild(img);

  });

});

async function loadPostImages(postId) {

  const imageArea =
    document.getElementById("postImages");

  if (!imageArea) return;

  imageArea.replaceChildren();

  const { data, error } =
    await supabase
      .from("board_attachments")
      .select("*")
      .eq("post_id", postId)
      .eq("attachment_type", "image");

  if (error) {
    console.error("첨부사진 조회 오류:", error);
    return;
  }

  for (const file of data || []) {

    const { data: urlData } =
      supabase.storage
        .from("board-images")
        .getPublicUrl(file.file_path);

    const img = document.createElement("img");

    img.src = urlData.publicUrl;
    img.alt = file.file_name || "첨부사진";
    img.loading = "lazy";

    img.addEventListener("click", () => {

      window.open(
        urlData.publicUrl,
        "_blank",
        "noopener,noreferrer"
      );

    });

    imageArea.appendChild(img);

  }

}
  
initialize();

</script>
