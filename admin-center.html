&&\n      event.target.id === \"page-initialization\") {\n    document.getElementById(\"adminMessage\").textContent = \"관리자 인증 프로그램을 불러오지 못했습니다. 연결을 확인한 뒤 다시 시도해 주세요.\";\n  }\n}, true);\n\u003c/script>\n\u003cscript type=\"module\" id=\"page-initialization\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* Supabase 연결 */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* 화면 요소 */\n\nconst $ = id => document.getElementById(id);\n\nconst adminMessage = $(\"adminMessage\");\nconst adminMenu = $(\"adminMenu\");\n\nlet adminAuthenticated = false;\n\n/* =====================================\n   관리자 인증\n===================================== */\n\nasync function initializeAdminCenter() {\n\n  adminAuthenticated = false;\n  adminMenu.hidden = true;\n  $(\"discussionAdminPanel\").hidden = true;\n\n  try {\n\n    const { data, error } =\n      await supabase.auth.getUser();\n\n    if (error || !data.user) {\n\n      adminMessage.textContent =\n        \"로그인이 필요합니다.\\n\" +\n        \"로그인 후 다시 접속해 주세요.\";\n\n      return;\n    }\n\n    const [admin, superAdmin] = await Promise.allSettled([\n      supabase.rpc(\"is_admin\"),\n      supabase.rpc(\"is_super_admin\")\n    ]);\n    const granted = [admin, superAdmin].some(result =>\n      result.status === \"fulfilled\" && !result.value.error && result.value.data === true\n    );\n\n    if (!granted) {\n      const failed = [admin, superAdmin].find(result =>\n        result.status === \"rejected\" || result.value.error\n      );\n      if (failed) throw failed.reason || failed.value.error;\n\n\n      adminMessage.textContent =\n        \"관리자 권한이 없습니다.\";\n\n      return;\n    }\n\n    adminAuthenticated = true;\n\n    adminMessage.textContent =\n      \"관리자 인증이 완료되었습니다.\";\n\n    adminMenu.hidden = false;\n    void enableGrade1Review();\n\n  } catch (error) {\n\n    console.error(\n      \"통합 관리센터 오류:\",\n      error\n    );\n\n    adminMessage.textContent =\n      \"관리자 인증 중 오류가 발생했습니다.\\n\" +\n      error.message;\n  }\n}\n\n/* =====================================\n   토론 관리 메시지\n===================================== */\n\nfunction showDiscussionAdminMessage(message) {\n\n  $(\"discussionAdminMessage\").textContent = message;\n}\n\n/* =====================================\n   전체 토론 게시글 조회\n===================================== */\n\nasync function loadAdminDiscussions() {\n\n  if (!adminAuthenticated) {\n    return;\n  }\n\n  const list = $(\"discussionAdminList\");\n\n  list.replaceChildren();\n\n  showDiscussionAdminMessage(\n    \"토론 게시글을 불러오는 중입니다.\"\n  );\n\n  try {\n\n    const { data, error } = await supabase.rpc(\n  \"admin_get_knowledge_discussions_v2\"\n);\n\n    if (error) {\n      throw error;\n    }\n\n    const items = data || [];\n\n    showDiscussionAdminMessage(\n      \"전체 토론 게시글 \" + items.length + \"건\"\n    );\n\n    renderAdminDiscussions(items);\n\n  } catch (error) {\n\n    showDiscussionAdminMessage(\n      \"토론 목록 조회 실패: \" + error.message\n    );\n  }\n}\n\n/* =====================================\n   관리자 게시글 목록 표시\n===================================== */\n\nfunction renderAdminDiscussions(items) {\n\n  const list = $(\"discussionAdminList\");\n\n  list.replaceChildren();\n\n  if (!items.length) {\n\n    const empty = document.createElement(\"p\");\n\n    empty.textContent =\n      \"등록된 토론 게시글이 없습니다.\";\n\n    list.appendChild(empty);\n\n    return;\n  }\n\n  items.forEach(item => {\n\n    const article = document.createElement(\"article\");\n\n    article.className = \"discussion-admin-item\";\n\n    const title = document.createElement(\"h3\");\n\n    title.textContent =\n      item.document_title || \"자료명 없음\";\n\n    const meta = document.createElement(\"div\");\n\n    meta.className = \"discussion-meta\";\n\n    const created = item.created_at\n      ? new Date(item.created_at).toLocaleString(\"ko-KR\")\n      : \"-\";\n\n    meta.textContent =\n      \"작성자: \" + (item.author_name || \"회원\") +\n      \" | 작성일: \" + created +\n      \" | 게시글 ID: \" + item.id;\n\n    const content = document.createElement(\"div\");\n\n    content.className = \"discussion-content\";\n\n    // 게시글 내용을 HTML로 실행하지 않음\n    content.textContent = item.content || \"\";\n\n    const status = document.createElement(\"div\");\n\n    status.className = \"discussion-status\";\n\n    /* =====================================\n   게시글 관리 상태 구분\n===================================== */\n\nswitch (item.moderation_status) {\n\n  case \"visible\":\n\n    status.classList.add(\"status-visible\");\n    status.textContent = \"상태: 공개\";\n    break;\n\n  case \"admin_hidden\":\n\n    status.classList.add(\"status-hidden\");\n    status.textContent = \"상태: 관리자 숨김\";\n    break;\n\n  case \"member_deleted\":\n\n    status.classList.add(\"status-hidden\");\n    status.textContent = \"상태: 회원 삭제\";\n    break;\n\n  case \"legacy_deleted\":\n\n    status.classList.add(\"status-hidden\");\n    status.textContent = \"상태: 과거 삭제 기록\";\n    break;\n\n  default:\n\n    status.classList.add(\"status-hidden\");\n    status.textContent = \"상태: 확인 필요\";\n}\n\n/* =====================================\n   게시글 상태별 관리 버튼\n===================================== */\n\nconst button = document.createElement(\"button\");\n\nbutton.type = \"button\";\n\nconst canHide =\n  item.moderation_status === \"visible\";\n\nconst canRestore =\n  item.moderation_status === \"admin_hidden\";\n\nif (canHide || canRestore) {\n\n  button.className = canRestore\n    ? \"action-button restore\"\n    : \"action-button danger\";\n\n  button.textContent = canRestore\n    ? \"게시글 복원\"\n    : \"게시글 숨김\";\n\n  button.addEventListener(\"click\", async () => {\n\n  const nextDeleted = canHide;\n\n  const actionName = canHide\n    ? \"게시글 숨김\"\n    : \"게시글 복원\";\n\n  /* =====================================\n     관리자 처리 사유 입력\n  ===================================== */\n\n  const reasonInput = prompt(\n    actionName + \" 처리 사유를 입력하세요.\\n\" +\n    \"(필수 입력, 최대 1000자)\"\n  );\n\n  // 취소 버튼을 누른 경우\n  if (reasonInput === null) {\n    return;\n  }\n\n  const reason = reasonInput.trim();\n\n  // 빈 사유 입력 방지\n  if (!reason) {\n    alert(\"관리자 처리 사유를 입력해야 합니다.\");\n    return;\n  }\n\n  // 최대 길이 확인\n  if (reason.length > 1000) {\n    alert(\"처리 사유는 1000자 이내로 입력해야 합니다.\");\n    return;\n  }\n\n  /* =====================================\n     최종 처리 확인\n  ===================================== */\n\n  const confirmed = confirm(\n    actionName + \"을 진행하시겠습니까?\\n\\n\" +\n    \"처리 사유:\\n\" + reason\n  );\n\n  if (!confirmed) {\n    return;\n  }\n\n  button.disabled = true;\n\n  try {\n\n    /* =====================================\n       V2 관리자 처리 함수 호출\n    ===================================== */\n\n    const { data, error } = await supabase.rpc(\n      \"admin_set_knowledge_discussion_visibility_v2\",\n      {\n        p_discussion_id: item.id,\n        p_is_deleted: nextDeleted,\n        p_reason: reason\n      }\n    );\n\n    if (error) {\n      throw error;\n    }\n\n    if (data !== true) {\n      throw new Error(\n        \"게시글 상태 변경에 실패했습니다.\"\n      );\n    }\n\n    /* =====================================\n       처리 완료 후 목록 새로고침\n    ===================================== */\n\n    await loadAdminDiscussions();\n\n    alert(\n      actionName + \" 처리가 완료되었습니다.\"\n    );\n\n  } catch (error) {\n\n    showDiscussionAdminMessage(\n      \"게시글 관리 실패: \" + error.message\n    );\n\n    alert(\n      \"게시글 관리 중 오류가 발생했습니다.\\n\" +\n      error.message\n    );\n\n  } finally {\n\n    button.disabled = false;\n  }\n\n});    \n\n} else {\n\n  button.className = \"action-button\";\n\n  button.textContent = \"복원 불가\";\n\n  button.disabled = true;\n}\n    \n \n    \n    article.append(\n      title,\n      meta,\n      content,\n      status,\n      button\n    );\n\n    list.appendChild(article);\n  });\n}\n\n/* =====================================\n   토론 관리 화면 열기\n===================================== */\n\n$(\"openDiscussionAdmin\").addEventListener(\n  \"click\",\n  async () => {\n\n    if (!adminAuthenticated) {\n      return;\n    }\n\n    $(\"discussionAdminPanel\").hidden = false;\n\n    $(\"discussionAdminPanel\").scrollIntoView({\n      behavior: \"smooth\",\n      block: \"start\"\n    });\n\n    await loadAdminDiscussions();\n  }\n);\n\n/* =====================================\n   새로고침\n===================================== */\n\n$(\"refreshDiscussions\").addEventListener(\n  \"click\",\n  loadAdminDiscussions\n);\n\n/* =====================================\n   관리 화면 닫기\n===================================== */\n\n$(\"closeDiscussionAdmin\").addEventListener(\n  \"click\",\n  () => {\n\n    $(\"discussionAdminPanel\").hidden = true;\n\n    $(\"adminMenu\").scrollIntoView({\n      behavior: \"smooth\",\n      block: \"start\"\n    });\n  }\n);\n\n/* =====================================\n   관리자 토론 감사기록 조회\n===================================== */\n\nasync function loadModerationLogs() {\n\n  if (!adminAuthenticated) {\n    return;\n  }\n\n  const list = $(\"moderationLogsList\");\n\n  list.replaceChildren();\n\n  $(\"moderationLogsMessage\").textContent =\n    \"감사기록을 불러오는 중입니다.\";\n\n  try {\n\n    const { data, error } = await supabase.rpc(\n      \"admin_get_knowledge_discussion_moderation_logs\"\n    );\n\n    if (error) {\n      throw error;\n    }\n\n    const logs = data || [];\n\n    $(\"moderationLogsMessage\").textContent =\n      \"전체 감사기록 \" + logs.length + \"건\";\n\n    if (!logs.length) {\n\n      const empty = document.createElement(\"p\");\n\n      empty.textContent =\n        \"등록된 감사기록이 없습니다.\";\n\n      list.appendChild(empty);\n\n      return;\n    }\n\n    logs.forEach(log => {\n\n      const article = document.createElement(\"article\");\n\n      article.className = \"discussion-admin-item\";\n\n      const title = document.createElement(\"h3\");\n\n      title.textContent =\n        \"게시글 ID \" + log.discussion_id +\n        \" — \" + (log.document_title || \"자료명 없음\");\n\n      const meta = document.createElement(\"div\");\n\n      meta.className = \"discussion-meta\";\n\n      const actionName =\n        log.action_type === \"hide\"\n          ? \"게시글 숨김\"\n          : log.action_type === \"restore\"\n            ? \"게시글 복원\"\n            : \"기타 처리\";\n\n      const actionDate = log.action_at\n        ? new Date(log.action_at).toLocaleString(\"ko-KR\")\n        : \"-\";\n\n      meta.textContent =\n        \"처리 유형: \" + actionName + \"\\n\" +\n        \"처리 관리자: \" + (log.action_by || \"-\") + \"\\n\" +\n        \"처리 시각: \" + actionDate + \"\\n\" +\n        \"이전 상태: \" + log.previous_status + \"\\n\" +\n        \"변경 상태: \" + log.new_status;\n\n      meta.style.whiteSpace = \"pre-line\";\n\n      const reasonTitle = document.createElement(\"strong\");\n\n      reasonTitle.textContent = \"처리 사유\";\n\n      const reason = document.createElement(\"div\");\n\n      reason.className = \"discussion-content\";\n\n      // 감사기록 내용을 HTML로 실행하지 않음\n      reason.textContent = log.reason || \"사유 없음\";\n\n      article.append(\n        title,\n        meta,\n        reasonTitle,\n        reason\n      );\n\n      list.appendChild(article);\n    });\n\n  } catch (error) {\n\n    $(\"moderationLogsMessage\").textContent =\n      \"감사기록 조회 실패: \" + error.message;\n  }\n}\n\n/* =====================================\n   감사기록 화면 열기\n===================================== */\n\n$(\"openModerationLogs\").addEventListener(\n  \"click\",\n  async () => {\n\n    if (!adminAuthenticated) {\n      return;\n    }\n\n    $(\"moderationLogsPanel\").hidden = false;\n\n    await loadModerationLogs();\n\n    $(\"moderationLogsPanel\").scrollIntoView({\n      behavior: \"smooth\",\n      block: \"start\"\n    });\n  }\n);\n\n/* =====================================\n   감사기록 새로고침\n===================================== */\n\n$(\"refreshModerationLogs\").addEventListener(\n  \"click\",\n  loadModerationLogs\n);\n\n/* =====================================\n   감사기록 화면 닫기\n===================================== */\n\n$(\"closeModerationLogs\").addEventListener(\n  \"click\",\n  () => {\n\n    $(\"moderationLogsPanel\").hidden = true;\n  }\n);\n  \n/* =====================================\n   최초 실행\n===================================== */\n\n/* 최고관리자 전용 1급회원 승급 심사 */\nconst grade1Panel = $(\"grade1ReviewPanel\");\nconst grade1List = $(\"grade1ReviewList\");\nconst grade1Message = $(\"grade1ReviewMessage\");\nlet grade1Authorized = false;\nlet grade1Busy = false;\n\nasync function enableGrade1Review() {\n  grade1Authorized = false;\n  $(\"memberManagementMenu\").hidden = true;\n  $(\"grade1ReviewMenu\").hidden = true;\n  grade1Panel.hidden = true;\n\n  try {\n    const { data, error } = await supabase.rpc(\"is_super_admin\");\n    if (error) throw error;\n    grade1Authorized = data === true;\n    $(\"memberManagementMenu\").hidden = !grade1Authorized;\n    $(\"grade1ReviewMenu\").hidden = !grade1Authorized;\n  } catch (error) {\n    console.error(\"최고관리자 권한 확인 실패\", error);\n  }\n}\n\nfunction setGrade1Busy(busy) {\n  grade1Busy = busy;\n  for (const button of grade1Panel.querySelectorAll(\"button:not(#closeGrade1Review)\")) {\n    button.disabled = busy;\n  }\n}\n\nasync function showGrade1Evidence(path, button) {\n  if (!grade1Authorized || grade1Busy) return;\n  try {\n    const { data, error } = await supabase.storage\n      .from(\"member-verification\").createSignedUrl(path, 60);\n    if (error) throw error;\n    const link = document.createElement(\"a\");\n    link.href = data.signedUrl;\n    link.target = \"_blank\";\n    link.rel = \"noopener noreferrer\";\n    link.textContent = \"증빙자료 열기 (60초 이내)\";\n    button.parentElement.querySelector(\"a\")?.remove();\n    button.after(link);\n    link.focus();\n  } catch (error) {\n    grade1Message.textContent = \"증빙자료 링크를 만들지 못했습니다. \" + error.message;\n  }\n}\n\nfunction grade1Button(label, handler, style = \"\") {\n  const button = document.createElement(\"button\");\n  button.type = \"button\";\n  button.className = (\"action-button \" + style).trim();\n  button.textContent = label;\n  button.addEventListener(\"click\", handler);\n  return button;\n}\n\nfunction renderGrade1Request(request, currentGrade) {\n  const item = document.createElement(\"article\");\n  item.className = \"discussion-admin-item\";\n\n  const title = document.createElement(\"h3\");\n  title.textContent = (request.full_name || \"이름 미등록\") + \" · 신청번호 \" + request.request_id;\n  item.append(title);\n\n  const status = request.status ?? request.request_status;\n  const labels = {\n    pending: \"심사 대기\", approved: \"승인\", rejected: \"반려\",\n    revision_requested: \"보완 요청\", revoked: \"승인 취소\"\n  };\n  const details = document.createElement(\"div\");\n  details.className = \"discussion-meta\";\n  for (const [label, value] of [\n    [\"상태\", labels[status] ?? status], [\"전화번호\", request.phone],\n    [\"소속\", request.organization], [\"직책\", request.position_title],\n    [\"신청 사유\", request.request_reason ?? request.reason], [\"기존 심사 의견\", request.review_note],\n    [\"증빙자료\", request.evidence_path ? \"첨부됨\" : \"미첨부\"]\n  ]) {\n    const line = document.createElement(\"div\");\n    line.textContent = label + \" · \" + (value || \"—\");\n    details.append(line);\n  }\n  if (request.status === \"approved\" && !currentGrade) {\n    const gradeNotice = document.createElement(\"div\");\n    gradeNotice.textContent = \"현재 회원등급을 확인할 수 없어 승급 승인 취소를 사용할 수 없습니다.\";\n    details.append(gradeNotice);\n  }\n  item.append(details);\n\n  if (request.evidence_path) {\n    const evidence = document.createElement(\"div\");\n    evidence.className = \"discussion-toolbar\";\n    evidence.append(grade1Button(\"증빙자료 확인\", event => {\n      void showGrade1Evidence(request.evidence_path, event.currentTarget);\n    }));\n    item.append(evidence);\n  }\n\n  if (status === \"pending\") {\n    const actions = document.createElement(\"div\");\n    actions.className = \"discussion-toolbar\";\n    for (const [label, action, style] of [\n      [\"승인\", \"approve\", \"restore\"],\n      [\"반려\", \"reject\", \"danger\"],\n      [\"보완 요청\", \"request_revision\", \"\"]\n    ]) {\n      actions.append(grade1Button(label, () => {\n        void reviewGrade1Request(request.request_id, action, label);\n      }, style));\n    }\n    item.append(actions);\n  }\n\n  if (grade1Authorized && request.status === \"approved\" && currentGrade === \"grade1\") {\n    const actions = document.createElement(\"div\");\n    actions.className = \"discussion-toolbar\";\n    actions.append(grade1Button(\"승급 승인 취소\", () => {\n      void revokeGrade1Request(request.request_id);\n    }, \"danger\"));\n    item.append(actions);\n  }\n  return item;\n}\n\nasync function loadGrade1Requests() {\n  const { data, error } = await supabase.rpc(\"get_grade1_requests\");\n  if (error) throw error;\n  const requests = data ?? [];\n  const userIds = [...new Set(requests\n    .filter(request => request.status === \"approved\" && !request.member_grade && request.user_id)\n    .map(request => request.user_id))];\n  const grades = new Map();\n\n  // 기존 목록 RPC에 현재 등급이 없는 경우 대상 회원의 등급만 조회합니다.\n  for (let start = 0; start < userIds.length; start += 100) {\n    try {\n      const { data: profiles, error: profileError } = await supabase\n        .from(\"profiles\")\n        .select(\"id, member_grade\")\n        .in(\"id\", userIds.slice(start, start + 100));\n      if (profileError) throw profileError;\n      for (const profile of profiles ?? []) {\n        grades.set(profile.id, profile.member_grade);\n      }\n    } catch (error) {\n      console.warn(\"현재 회원등급 조회 실패\", error);\n    }\n  }\n\n  grade1List.replaceChildren(...requests.map(request =>\n    renderGrade1Request(request, request.member_grade || grades.get(request.user_id))\n  ));\n  return requests.length;\n}\n\nasync function refreshGrade1Review() {\n  if (!grade1Authorized || grade1Busy) return;\n  setGrade1Busy(true);\n  grade1Message.textContent = \"승급 신청을 불러오는 중입니다.\";\n  try {\n    const count = await loadGrade1Requests();\n    grade1Message.textContent = count ? `승급 신청 ${count}건` : \"접수된 승급 신청이 없습니다.\";\n  } catch (error) {\n    grade1List.replaceChildren();\n    grade1Message.textContent = \"승급 신청 조회 실패 · \" + error.message;\n  } finally {\n    setGrade1Busy(false);\n  }\n}\n\nasync function reviewGrade1Request(requestId, action, label) {\n  if (!grade1Authorized || grade1Busy) return;\n  const note = window.prompt(`신청번호 ${requestId} · ${label} 의견을 입력해 주세요.`, \"\");\n  if (note === null || !window.confirm(`신청번호 ${requestId}에 대해 ${label} 처리하시겠습니까?`)) return;\n\n  await saveGrade1Decision(\"review_grade1_upgrade\", {\n    p_request_id: requestId,\n    p_action: action,\n    p_review_note: note.trim()\n  }, label);\n}\n\nasync function revokeGrade1Request(requestId) {\n  if (!grade1Authorized || grade1Busy) return;\n  const input = window.prompt(`신청번호 ${requestId} · 승급 승인 취소 사유를 입력해 주세요.`, \"\");\n  if (input === null) return;\n\n  const reason = input.trim();\n  if (!reason) {\n    grade1Message.textContent = \"승급 승인 취소 사유를 입력해 주세요.\";\n    window.alert(\"승급 승인 취소 사유를 입력해 주세요.\");\n    return;\n  }\n\n  if (!window.confirm(`신청번호 ${requestId}의 승급 승인을 취소하고 해당 회원을 일반회원으로 변경하시겠습니까?`)) return;\n\n  await saveGrade1Decision(\"revoke_grade1_upgrade\", {\n    p_request_id: requestId,\n    p_reason: reason\n  }, \"승급 승인 취소\");\n}\n\nasync function saveGrade1Decision(rpcName, params, label) {\n  if (!grade1Authorized || grade1Busy) return;\n  setGrade1Busy(true);\n  let saved = false;\n  try {\n    grade1Message.textContent = \"심사 결과를 저장하는 중입니다.\";\n    const { error } = await supabase.rpc(rpcName, params);\n    if (error) throw error;\n    saved = true;\n    grade1List.replaceChildren();\n    await loadGrade1Requests();\n    grade1Message.textContent = label + \" 처리가 완료되었습니다.\";\n  } catch (error) {\n    grade1Message.textContent = saved\n      ? label + \" 처리 완료. 목록을 갱신하지 못했습니다. 새로고침을 눌러 주세요.\"\n      : \"승급 심사 실패 · \" + error.message;\n  } finally {\n    setGrade1Busy(false);\n  }\n}\n\n$(\"openGrade1Review\").addEventListener(\"click\", () => {\n  if (!grade1Authorized) return;\n  grade1Panel.hidden = false;\n  $(\"grade1ReviewHeading\").focus();\n  grade1Panel.scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n  void refreshGrade1Review();\n});\n$(\"refreshGrade1Review\").addEventListener(\"click\", refreshGrade1Review);\n$(\"closeGrade1Review\").addEventListener(\"click\", () => {\n  grade1Panel.hidden = true;\n  $(\"openGrade1Review\").focus();\n});\n\ninitializeAdminCenter();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "view=admin-news": "<!DOCTYPE html>\n<html lang=\"ko\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<title>\n  활동 소식 관리 | 통합 관리센터\n</title>\n\n<style>\n\n/* =====================================\n   기본 화면\n===================================== */\n\nbody {\n  margin: 0;\n  font-family:\n    \"Malgun Gothic\",\n    \"Apple SD Gothic Neo\",\n    sans-serif;\n  background: #f5f7fb;\n  color: #222;\n}\n\nheader {\n  background: #0b5394;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nheader h1 {\n  margin: 0 0 15px;\n  font-size: 28px;\n}\n\nheader p {\n  line-height: 1.8;\n}\n\n.home-link {\n  display: inline-block;\n  margin-top: 15px;\n  padding: 11px 20px;\n  background: white;\n  color: #0b5394;\n  text-decoration: none;\n  border-radius: 8px;\n  font-weight: bold;\n}\n\nmain {\n  max-width: 1100px;\n  margin: 30px auto;\n  padding: 0 15px;\n}\n\nsection {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.06);\n}\n\nh2 {\n  color: #0b5394;\n}\n\nbutton {\n  padding: 11px 18px;\n  border: none;\n  border-radius: 7px;\n  cursor: pointer;\n  font-size: 15px;\n}\n\n.primary-button {\n  background: #0b5394;\n  color: white;\n}\n\n.primary-button:hover {\n  background: #073763;\n}\n\n.status {\n  padding: 15px;\n  background: #eef3f9;\n  border-radius: 8px;\n  line-height: 1.8;\n}\n\n/* =====================================\n   관리자 활동 소식 목록\n===================================== */\n\n.table-wrap {\n  width: 100%;\n  overflow-x: auto;\n  margin-top: 25px;\n}\n\n.news-table {\n  width: 100%;\n  border-collapse: collapse;\n  background: white;\n}\n\n.news-table th {\n  background: #eef3f9;\n  color: #0b5394;\n  font-weight: bold;\n}\n\n.news-table th,\n.news-table td {\n  padding: 14px 12px;\n  border-bottom: 1px solid #ddd;\n  text-align: left;\n  line-height: 1.6;\n}\n\n.news-table tbody tr:hover {\n  background: #f7faff;\n}\n\n.news-table td:first-child {\n  width: 65px;\n  text-align: center;\n}\n\n.news-table td:last-child {\n  white-space: nowrap;\n}\n\n@media (max-width: 600px) {\n\n  .news-table th,\n  .news-table td {\n    padding: 10px 7px;\n    font-size: 13px;\n  }\n\n}\n\n/* =====================================\n   활동 소식 등록 화면\n===================================== */\n\n.form-group {\n  margin-bottom: 22px;\n}\n\n.form-group label {\n  display: block;\n  margin-bottom: 8px;\n  font-weight: bold;\n  color: #333;\n}\n\n.form-group input,\n.form-group select,\n.form-group textarea {\n  width: 100%;\n  box-sizing: border-box;\n  padding: 12px;\n  border: 1px solid #ccc;\n  border-radius: 7px;\n  font-family: inherit;\n  font-size: 15px;\n}\n\n.form-group textarea {\n  resize: vertical;\n  line-height: 1.7;\n}\n\n.form-group input:focus,\n.form-group select:focus,\n.form-group textarea:focus {\n  outline: 2px solid #0b5394;\n  border-color: #0b5394;\n}\n\n.form-actions {\n  display: flex;\n  gap: 12px;\n  margin-top: 25px;\n}\n\n.form-actions button {\n  min-width: 110px;\n}\n\n#newsCancelButton {\n  background: #e5e7eb;\n  color: #333;\n}\n\n/* =====================================\n   활동 소식 수정 버튼\n===================================== */\n\n.news-edit-button {\n  padding: 8px 14px;\n  border: none;\n  border-radius: 6px;\n  background: #0b5394;\n  color: white;\n  font-size: 14px;\n  cursor: pointer;\n  white-space: nowrap;\n}\n\n.news-edit-button:disabled {\n  background: #d1d5db;\n  color: #6b7280;\n  cursor: not-allowed;\n}\n\n.news-edit-button:not(:disabled):hover {\n  background: #073b6b;\n}\n\n/* =====================================\n   활동 소식 삭제 버튼\n===================================== */\n\n.news-delete-button {\n  margin-left: 8px;\n  padding: 8px 14px;\n  border: none;\n  border-radius: 6px;\n  background: #b91c1c;\n  color: white;\n  font-size: 14px;\n  cursor: pointer;\n  white-space: nowrap;\n}\n\n.news-delete-button:disabled {\n  background: #d1d5db;\n  color: #6b7280;\n  cursor: not-allowed;\n}\n\n.news-delete-button:not(:disabled):hover {\n  background: #991b1b;\n}\n  \nfooter {\n  text-align: center;\n  padding: 30px 15px;\n  color: #666;\n  line-height: 1.8;\n}\n\n/* hidden 속성 보호 */\n\n[hidden] {\n  display: none !important;\n}\n\n@media (max-width: 600px) {\n\n  header h1 {\n    font-size: 22px;\n  }\n\n  section {\n    padding: 20px;\n  }\n\n}\n\n</style>\n\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n\n  <h1>📰 활동 소식 관리</h1>\n\n  <p>\n    경기도 글로벌 AI 허브 유치<br>\n    고양특례시 범시민추진위원회\n  </p>\n\n  \n\n</header>\n\n<main>\n\n  \n\u003c!-- =====================================\n     관리자 인증 상태\n===================================== -->\n\n<section id=\"authStatus\">\n\n  <h2>관리자 권한 확인</h2>\n\n  <p\n    id=\"authMessage\"\n    class=\"status\"\n    role=\"status\"\n  >\n    로그인 및 관리자 권한을 확인하고 있습니다.\n  </p>\n\n</section>\n\n\u003c!-- =====================================\n     활동 소식 관리 화면\n===================================== -->\n\n<section id=\"newsAdminArea\" hidden>\n\n  <h2>활동 소식 목록</h2>\n\n  <p>\n    위원회 활동, 공지사항,\n    행사 소식 및 정책 소식을 관리합니다.\n  </p>\n\n  <button\n    type=\"button\"\n    id=\"newsWriteButton\"\n    class=\"primary-button\"\n    disabled\n  >\n    ＋ 새 활동 소식 등록\n  </button>\n\n \u003c!-- =====================================\n     활동 소식 목록\n===================================== -->\n\n<div class=\"table-wrap\">\n\n  <table class=\"news-table\">\n\n    <thead>\n\n      <tr>\n        <th>번호</th>\n        <th>활동 소식 제목</th>\n        <th>분류</th>\n        <th>게시일</th>\n    <th>관리</th>\n      </tr>\n\n    </thead>\n\n    <tbody id=\"adminNewsList\">\n\n      <tr>\n        <td colspan=\"5\">\n          활동 소식을 불러오고 있습니다.\n        </td>\n      </tr>\n\n    </tbody>\n\n  </table>\n\n</div>\n</section>\n\n\u003c!-- =====================================\n     제145-2-7-4-1단계\n     새 활동 소식 등록 화면\n===================================== -->\n\n<section id=\"newsWriteView\" hidden>\n\n  <h2>📰 새 활동 소식 등록</h2>\n\n  <p>\n    위원회 활동, 공지사항 및\n    행사 소식을 등록합니다.\n  </p>\n\n  <form id=\"newsForm\">\n\n    \u003c!-- 제목 -->\n\n    <div class=\"form-group\">\n\n      <label for=\"newsTitle\">\n        소식 제목 *\n      </label>\n\n      <input\n        type=\"text\"\n        id=\"newsTitle\"\n        maxlength=\"200\"\n        required\n      >\n\n    </div>\n\n    \u003c!-- 분류 -->\n\n    <div class=\"form-group\">\n\n      <label for=\"newsCategory\">\n        소식 분류 *\n      </label>\n\n      <select\n        id=\"newsCategory\"\n        required\n      >\n\n        <option value=\"notice\">공지사항</option>\n        <option value=\"activity\">위원회 활동</option>\n        <option value=\"event\">행사 소식</option>\n        <option value=\"press\">언론보도</option>\n        <option value=\"policy\">정책 소식</option>\n\n      </select>\n\n    </div>\n\n    \u003c!-- 게시 날짜 -->\n\n    <div class=\"form-group\">\n\n      <label for=\"newsDate\">\n        게시 날짜 *\n      </label>\n\n      <input\n        type=\"date\"\n        id=\"newsDate\"\n        required\n      >\n\n    </div>\n\n    \u003c!-- 소식 설명 -->\n\n    <div class=\"form-group\">\n\n      <label for=\"newsDescription\">\n        소식 내용\n      </label>\n\n      <textarea\n        id=\"newsDescription\"\n        rows=\"8\"\n      ></textarea>\n\n    </div>\n\n    \u003c!-- 관련 링크 -->\n\n    <div class=\"form-group\">\n\n      <label for=\"newsLink\">\n        관련 기사·자료 링크\n      </label>\n\n      <input\n        type=\"url\"\n        id=\"newsLink\"\n        placeholder=\"https://example.com\"\n      >\n\n    </div>\n\n    \u003c!-- 버튼 -->\n\n    <div class=\"form-actions\">\n\n      <button\n  type=\"submit\"\n  id=\"newsSubmitButton\"\n  class=\"primary-button\"\n>\n  활동 소식 등록\n</button>\n\n      <button\n        type=\"button\"\n        id=\"newsCancelButton\"\n      >\n        취소\n      </button>\n\n    </div>\n\n  </form>\n\n</section>\n  \n</main>\n\n<footer>\n\n  경기도 글로벌 AI 허브 유치<br>\n  고양특례시 범시민추진위원회\n\n</footer>\n\n\u003c!-- =====================================\n     Supabase 관리자 인증\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* Supabase 연결 정보 */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* 화면 요소 */\n\nconst authMessage =\n  document.getElementById(\"authMessage\");\n\nconst newsAdminArea =\n  document.getElementById(\"newsAdminArea\");\n\n\n/* =====================================\n   제145-2-7-3단계\n   관리자 활동 소식 목록 조회\n===================================== */\n\nconst adminNewsList =\n  document.getElementById(\"adminNewsList\");\n\n/* =====================================\n   제145-2-8-2-1단계\n   언론보도 관리 모드 확인\n===================================== */\n\nconst newsUrlParams =\n  new URLSearchParams(window.location.search);\n\nconst pressManagementMode =\n  newsUrlParams.get(\"category\") === \"press\";\n\n/* 언론보도 관리 화면 제목 */\n\nif (pressManagementMode) {\n\n  const adminHeading =\n    document.querySelector(\n      \"#newsAdminArea h2\"\n    );\n\n  if (adminHeading) {\n\n    adminHeading.textContent =\n      \"📺 언론보도 관리\";\n\n  }\n\n}\n  \n/* 분류 이름 */\n\nfunction newsCategoryName(category) {\n\n  const names = {\n    notice: \"공지사항\",\n    activity: \"위원회 활동\",\n    event: \"행사 소식\",\n    press: \"언론보도\",\n    policy: \"정책 소식\"\n  };\n\n  return names[category] || \"기타\";\n\n}\n\n/* 목록 안내 메시지 */\n\nfunction showNewsMessage(message) {\n\n  adminNewsList.replaceChildren();\n\n  const row =\n    document.createElement(\"tr\");\n\n  const cell =\n    document.createElement(\"td\");\n\n  cell.colSpan = 5;\n  cell.textContent = message;\n\n  row.appendChild(cell);\n  adminNewsList.appendChild(row);\n\n}\n\n/* Supabase 목록 조회 */\n\nasync function loadAdminNews() {\n\n  showNewsMessage(\n    \"활동 소식을 불러오고 있습니다.\"\n  );\n\n  try {\n  \n/* Supabase 조회 조건 */\n\nlet query = supabase\n  .from(\"news_posts\")\n  .select(\n    \"id, title, category, published_at\"\n  );\n\n/* 언론보도 전용 관리 모드 */\n\nif (pressManagementMode) {\n\n  query = query.eq(\n    \"category\",\n    \"press\"\n  );\n\n}\n\n/* 최신 게시물 순서 */\n\nconst { data, error } =\n  await query\n    .order(\"published_at\", {\n      ascending: false\n    })\n    .order(\"id\", {\n      ascending: false\n    });\n  \n    if (error) {\n      throw error;\n    }\n\n    adminNewsList.replaceChildren();\n\n    if (!data || data.length === 0) {\n\n      showNewsMessage(\n        \"등록된 활동 소식이 없습니다.\"\n      );\n\n      return;\n    }\n\n    data.forEach((item, index) => {\n\n      const row =\n        document.createElement(\"tr\");\n\n      const values = [\n        index + 1,\n        item.title || \"\",\n        newsCategoryName(item.category),\n        item.published_at || \"\"\n      ];\n\n      values.forEach(value => {\n\n        const cell =\n          document.createElement(\"td\");\n\n        cell.textContent = value;\n\n        row.appendChild(cell);\n\n      });\n\n/* =====================================\n   활동 소식 수정 버튼\n===================================== */\n\nconst actionCell =\n  document.createElement(\"td\");\n\nconst editButton =\n  document.createElement(\"button\");\n\neditButton.type = \"button\";\n\neditButton.textContent = \"✏️ 수정\";\n\neditButton.className = \"news-edit-button\";\n\n/* 수정 기능은 다음 단계에서 연결 */\n\n/* 수정 버튼 활성화 */\n\neditButton.disabled = false;\n\neditButton.title =\n  \"활동 소식 수정\";\n\n/* 수정 화면 열기 */\n\neditButton.addEventListener(\n  \"click\",\n  () => {\n\n    openNewsEdit(item.id);\n\n  }\n);\n\nactionCell.appendChild(editButton);\n\n/* =====================================\n   제145-2-7-6-2단계\n   활동 소식 삭제 버튼 표시\n===================================== */\n\nconst deleteButton =\n  document.createElement(\"button\");\n\ndeleteButton.type = \"button\";\n\ndeleteButton.textContent = \"🗑️ 삭제\";\n\ndeleteButton.className =\n  \"news-delete-button\";\n\n/* =====================================\n   제145-2-7-6-3단계\n   활동 소식 삭제 대상 확인\n===================================== */\n\n/* 삭제 버튼 활성화 */\n\ndeleteButton.disabled = false;\n\ndeleteButton.title =\n  \"활동 소식 삭제\";\n\n/* 삭제 대상 확인 */\n\ndeleteButton.addEventListener(\n  \"click\",\n  () => {\n\n    confirmNewsDelete(\n      item.id,\n      item.title\n    );\n\n  }\n);\n\nactionCell.appendChild(deleteButton);\n      \nactionCell.appendChild(deleteButton);\n      \nrow.appendChild(actionCell);\n      \n      adminNewsList.appendChild(row);\n\n    });\n\n    console.log(\n      \"관리자 활동 소식 조회 완료:\",\n      data.length,\n      \"건\"\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"관리자 활동 소식 조회 오류:\",\n      error\n    );\n\n    showNewsMessage(\n      \"활동 소식을 불러오지 못했습니다: \" +\n      error.message\n    );\n\n  }\n\n}\n\n  \n/* =====================================\n   제145-2-7-4-1단계\n   활동 소식 등록 화면 제어\n===================================== */\n\nconst newsWriteButton =\n  document.getElementById(\"newsWriteButton\");\n\nconst newsWriteView =\n  document.getElementById(\"newsWriteView\");\n\nconst newsForm =\n  document.getElementById(\"newsForm\");\n\nconst newsDate =\n  document.getElementById(\"newsDate\");\n\nconst newsCancelButton =\n  document.getElementById(\"newsCancelButton\");\n\n/* 등록 화면 열기 */\n\n/* =====================================\n   제145-2-8-2-2단계\n   언론보도 등록 화면 자동 설정\n===================================== */\n\nnewsWriteButton.addEventListener(\n  \"click\",\n  () => {\n\n    /* 새 등록 모드 */\n\n    editingNewsId = null;\n\n    newsForm.reset();\n\n    /* 게시 날짜 기본값 */\n\n    newsDate.value =\n      new Date().toLocaleDateString(\"en-CA\");\n\n    /* 등록 화면 제목 */\n\n    const writeHeading =\n      document.querySelector(\n        \"#newsWriteView h2\"\n      );\n\n    /* 분류 선택 요소 */\n\n    const categorySelect =\n      document.getElementById(\n        \"newsCategory\"\n      );\n\n    if (pressManagementMode) {\n\n      /* 언론보도 등록 모드 */\n\n      if (writeHeading) {\n        writeHeading.textContent =\n          \"📺 새 언론보도 등록\";\n      }\n\n      categorySelect.value = \"press\";\n\n      categorySelect.disabled = true;\n\n      newsSubmitButton.textContent =\n        \"언론보도 등록\";\n\n    } else {\n\n      /* 일반 활동 소식 등록 모드 */\n\n      if (writeHeading) {\n        writeHeading.textContent =\n          \"📰 새 활동 소식 등록\";\n      }\n\n      categorySelect.disabled = false;\n\n      newsSubmitButton.textContent =\n        \"활동 소식 등록\";\n\n    }\n\n    /* 저장 버튼 활성화 */\n\n    newsSubmitButton.disabled = false;\n\n    /* 화면 전환 */\n\n    newsAdminArea.hidden = true;\n\n    newsWriteView.hidden = false;\n\n  }\n);\n  \n/* 등록·수정 취소 */\n\nnewsCancelButton.addEventListener(\n  \"click\",\n  () => {\n\n/* 분류 선택 상태 복구 */\n\ndocument.getElementById(\n  \"newsCategory\"\n).disabled = false;\n    \n    newsForm.reset();\n\n    editingNewsId = null;\n\n    newsSubmitButton.disabled = false;\n\n    newsSubmitButton.textContent =\n      \"활동 소식 등록\";\n\n    newsWriteView.hidden = true;\n\n    newsAdminArea.hidden = false;\n\n  }\n);\n\n  /* =====================================\n   제145-2-7-4-2단계\n   활동 소식 Supabase 저장\n===================================== */\n\nconst newsSubmitButton =\n  document.getElementById(\"newsSubmitButton\");\n\nlet newsSaving = false;\n\n/* =====================================\n   활동 소식 수정 대상 관리\n===================================== */\n\nlet editingNewsId = null;\n  \nnewsForm.addEventListener(\n  \"submit\",\n  async event => {\n\n    event.preventDefault();\n\n\n    \n    /* 중복 제출 방지 */\n\n    if (newsSaving) {\n      return;\n    }\n\n    /* 입력값 확인 */\n\n    const title =\n      document.getElementById(\"newsTitle\")\n        .value.trim();\n\n    /* =====================================\n   제145-2-8-2-3단계\n   언론보도 저장 분류 보호\n===================================== */\n\nconst selectedCategory =\n  document.getElementById(\n    \"newsCategory\"\n  ).value;\n\nconst category =\n  pressManagementMode\n    ? \"press\"\n    : selectedCategory;\n\n    const publishedAt =\n      document.getElementById(\"newsDate\")\n        .value;\n\n    const description =\n      document.getElementById(\"newsDescription\")\n        .value.trim();\n\n    const link =\n      document.getElementById(\"newsLink\")\n        .value.trim();\n\n    if (!title) {\n      alert(\"소식 제목을 입력해 주세요.\");\n      return;\n    }\n\n    const allowedCategories = [\n      \"notice\",\n      \"activity\",\n      \"event\",\n      \"press\",\n      \"policy\"\n    ];\n\n    if (!allowedCategories.includes(category)) {\n      alert(\"올바른 소식 분류를 선택해 주세요.\");\n      return;\n    }\n\n    if (\n      !/^\\d{4}-\\d{2}-\\d{2}$/.test(publishedAt) ||\n      Number.isNaN(\n        Date.parse(publishedAt + \"T00:00:00Z\")\n      )\n    ) {\n      alert(\"올바른 게시 날짜를 선택해 주세요.\");\n      return;\n    }\n\n    /* 관련 링크 확인 */\n\n    if (link) {\n\n      try {\n\n        const url = new URL(link);\n\n        if (url.protocol !== \"https:\") {\n          throw new Error(\"HTTPS 주소만 허용됩니다.\");\n        }\n\n      } catch {\n\n        alert(\n          \"올바른 HTTPS 관련 링크를 입력해 주세요.\"\n        );\n\n        return;\n      }\n\n    }\n\n    /* 저장 시작 */\n\n    newsSaving = true;\n\n    newsSubmitButton.disabled = true;\n\n    newsSubmitButton.textContent =\n      \"등록 중...\";\n\n    try {\n\n      /* 로그인 상태 확인 */\n\n      const { data: authData, error: authError } =\n        await supabase.auth.getUser();\n\n      if (authError || !authData.user) {\n        throw new Error(\n          \"로그인 상태를 확인할 수 없습니다.\"\n        );\n      }\n\n      /* 관리자 권한 재확인 */\n\n      const { data: isAdmin, error: adminError } =\n        await supabase.rpc(\"is_admin\");\n\n      if (adminError || isAdmin !== true) {\n        throw new Error(\n          \"관리자 권한을 확인할 수 없습니다.\"\n        );\n      }\n\n     /* =====================================\n   활동 소식 등록·수정 구분 저장\n===================================== */\n\nconst newsData = {\n\n  title: title,\n\n  category: category,\n\n  published_at: publishedAt,\n\n  description: description,\n\n  link: link\n\n};\n\nlet saveError = null;\n\nif (editingNewsId !== null) {\n\n  /* 기존 활동 소식 수정 */\n\n  const { data, error } =\n    await supabase\n      .from(\"news_posts\")\n      .update(newsData)\n      .eq(\"id\", editingNewsId)\n      .select(\"id\");\n\n  if (error) {\n    throw error;\n  }\n\n  if (!data || data.length !== 1) {\n    throw new Error(\n      \"수정된 게시물을 확인할 수 없습니다.\"\n    );\n  }\n\n} else {\n\n  /* 새로운 활동 소식 등록 */\n\n  const { error } =\n    await supabase\n      .from(\"news_posts\")\n      .insert({\n\n        ...newsData,\n\n        author_id: authData.user.id\n\n      });\n\n  if (error) {\n    throw error;\n  }\n\n}\n\n\n      \n      /* 입력 화면 초기화 */\n\n/* 수정 여부 기록 */\n\nconst wasEditing =\n  editingNewsId !== null;\n\n/* 수정 상태 초기화 */\n\neditingNewsId = null;\n      \n      newsForm.reset();\n\n      newsWriteView.hidden = true;\n\n      newsAdminArea.hidden = false;\n\n      /* 목록 갱신 */\n\n      await loadAdminNews();\n\n      alert(\n  wasEditing\n    ? \"활동 소식이 정상적으로 수정되었습니다.\"\n    : \"활동 소식이 정상적으로 등록되었습니다.\"\n);\n\n    } catch (error) {\n\n      console.error(\n        \"활동 소식 등록 오류:\",\n        error\n      );\n\n      alert(\n        \"활동 소식 등록 중 오류가 발생했습니다.\\n\" +\n        error.message\n      );\n\n    } finally {\n\n      newsSaving = false;\n\n      newsSubmitButton.disabled = false;\n\n      newsSubmitButton.textContent =\n        \"활동 소식 등록\";\n\n    }\n\n  }\n);\n\n/* =====================================\n   제145-2-7-5-2단계\n   활동 소식 수정 화면 열기\n===================================== */\n\nasync function openNewsEdit(newsId) {\n\n  try {\n\n    /* 로그인 상태 확인 */\n\n    const { data: authData, error: authError } =\n      await supabase.auth.getUser();\n\n    if (authError || !authData.user) {\n\n      throw new Error(\n        \"로그인 상태를 확인할 수 없습니다.\"\n      );\n\n    }\n\n    /* 관리자 권한 확인 */\n\n    const { data: isAdmin, error: adminError } =\n      await supabase.rpc(\"is_admin\");\n\n    if (adminError || isAdmin !== true) {\n\n      throw new Error(\n        \"관리자 권한을 확인할 수 없습니다.\"\n      );\n\n    }\n\n    /* 기존 게시물 조회 */\n\n    const { data: news, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id, title, category, published_at, description, link\"\n        )\n        .eq(\"id\", newsId)\n        .single();\n\n    if (error) {\n      throw error;\n    }\n\n    if (!news) {\n\n      throw new Error(\n        \"수정할 활동 소식을 찾을 수 없습니다.\"\n      );\n\n    }\n\n    /* 수정 대상 저장 */\n\n    editingNewsId = news.id;\n\n    /* 기존 내용 입력 */\n\n    document.getElementById(\"newsTitle\").value =\n      news.title || \"\";\n\n/* =====================================\n   제145-2-8-2-5단계\n   언론보도 수정 분류 보호\n===================================== */\n\nconst categorySelect =\n  document.getElementById(\n    \"newsCategory\"\n  );\n\nif (pressManagementMode) {\n\n  /* 언론보도 분류 고정 */\n\n  categorySelect.value = \"press\";\n\n  categorySelect.disabled = true;\n\n} else {\n\n  /* 일반 활동 소식 관리 */\n\n  categorySelect.disabled = false;\n\n}\n    \n    document.getElementById(\"newsCategory\").value =\n      news.category || \"notice\";\n\n    document.getElementById(\"newsDate\").value =\n      news.published_at\n        ? String(news.published_at).slice(0, 10)\n        : \"\";\n\n    document.getElementById(\"newsDescription\").value =\n      news.description || \"\";\n\n    document.getElementById(\"newsLink\").value =\n      news.link || \"\";\n\n    /* 수정 화면 표시 */\n\n/* 수정 화면 제목 */\n\nconst writeHeading =\n  document.querySelector(\n    \"#newsWriteView h2\"\n  );\n\nif (writeHeading) {\n\n  writeHeading.textContent =\n    pressManagementMode\n      ? \"📺 언론보도 수정\"\n      : \"📰 활동 소식 수정\";\n\n}\n    \n    newsAdminArea.hidden = true;\n\n    newsWriteView.hidden = false;\n\n    /* 수정 저장 버튼 활성화 */\n\nnewsSubmitButton.disabled = false;\n\nnewsSubmitButton.textContent =\n  pressManagementMode\n    ? \"언론보도 수정 저장\"\n    : \"수정 내용 저장\";\n\n    console.log(\n      \"활동 소식 수정 화면 준비 완료:\",\n      news.id\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"활동 소식 수정 화면 오류:\",\n      error\n    );\n\n    alert(\n      \"수정 화면을 열지 못했습니다.\\n\" +\n      error.message\n    );\n\n  }\n\n}\n\n/* =====================================\n   제145-2-7-6-3단계\n   활동 소식 삭제 확인 함수\n===================================== */\n\n/* =====================================\n   제145-2-7-6-4단계\n   활동 소식 Supabase 삭제 기능\n===================================== */\n\nlet newsDeleting = false;\n\nasync function confirmNewsDelete(newsId, newsTitle) {\n\n  /* 중복 삭제 방지 */\n\n  if (newsDeleting) {\n    return;\n  }\n\n  /* 삭제 대상 확인 */\n\n  const confirmed = window.confirm(\n    \"다음 활동 소식을 삭제하시겠습니까?\\n\\n\" +\n    \"제목: \" + newsTitle + \"\\n\\n\" +\n    \"삭제 후 복구하기 어려울 수 있습니다.\"\n  );\n\n  if (!confirmed) {\n    return;\n  }\n\n  /* 삭제 시작 */\n\n  newsDeleting = true;\n\n  try {\n\n    /* 로그인 상태 재확인 */\n\n    const { data: authData, error: authError } =\n      await supabase.auth.getUser();\n\n    if (authError || !authData.user) {\n\n      throw new Error(\n        \"로그인 상태를 확인할 수 없습니다.\"\n      );\n\n    }\n\n    /* 관리자 권한 재확인 */\n\n    const { data: isAdmin, error: adminError } =\n      await supabase.rpc(\"is_admin\");\n\n    if (adminError || isAdmin !== true) {\n\n      throw new Error(\n        \"관리자 권한을 확인할 수 없습니다.\"\n      );\n\n    }\n\n    /* Supabase 게시물 삭제 */\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .delete()\n        .eq(\"id\", newsId)\n        .select(\"id\");\n\n    if (error) {\n      throw error;\n    }\n\n    /* 실제 삭제 여부 확인 */\n\n    if (!data || data.length !== 1) {\n\n      throw new Error(\n        \"삭제된 게시물을 확인할 수 없습니다.\"\n      );\n\n    }\n\n    /* 관리자 목록 갱신 */\n\n    await loadAdminNews();\n\n    alert(\n      \"활동 소식이 정상적으로 삭제되었습니다.\"\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"활동 소식 삭제 오류:\",\n      error\n    );\n\n    alert(\n      \"활동 소식 삭제 처리 중 오류가 발생했습니다.\\n\" +\n      error.message +\n      \"\\n\\n목록을 새로고침하여 삭제 여부를 확인해 주세요.\"\n    );\n\n  } finally {\n\n    newsDeleting = false;\n\n  }\n\n}\n  \n  /* =====================================\n   관리자 인증\n===================================== */\n\nasync function checkNewsAdmin() {\n\n  newsAdminArea.hidden = true;\n\n  authMessage.textContent =\n    \"관리자 권한을 확인하고 있습니다.\";\n\n  try {\n\n    /* 로그인 확인 */\n\n    const { data: authData, error: authError } =\n      await supabase.auth.getUser();\n\n    if (authError || !authData.user) {\n\n      throw new Error(\n        \"로그인이 필요합니다.\"\n      );\n\n    }\n\n    /* 관리자 권한 확인 */\n\n    const { data: isAdmin, error: adminError } =\n      await supabase.rpc(\"is_admin\");\n\n    if (adminError) {\n      throw adminError;\n    }\n\n    if (isAdmin !== true) {\n\n      throw new Error(\n        \"관리자 권한이 없습니다.\"\n      );\n\n    }\n\n /* 인증 성공 */\n\nauthMessage.textContent =\n  \"관리자 인증이 완료되었습니다.\";\n\nnewsAdminArea.hidden = false;\n\n/* 등록 화면 열기 버튼 활성화 */\n\nnewsWriteButton.disabled = false;\n\n/* 관리자 활동 소식 목록 조회 */\n\nawait loadAdminNews();\n\n  } catch (error) {\n\n    console.error(\n      \"활동 소식 관리자 인증 오류:\",\n      error\n    );\n\n    newsAdminArea.hidden = true;\n\n    authMessage.textContent =\n      error.message;\n\n  }\n\n}\n\n/* =====================================\n   제145-2-8-2-1단계\n   언론보도 관리 화면 구분\n===================================== */\n\nfunction setNewsManagementTitle() {\n\n  if (!pressManagementMode) {\n    return;\n  }\n\n  const heading =\n    document.querySelector(\n      \"#newsAdminArea h2\"\n    );\n\n  if (heading) {\n\n    heading.textContent =\n      \"📺 언론보도 관리\";\n\n  }\n\n}\n  \n/* 페이지 시작 */\n\nsetNewsManagementTitle();\n\n/* =====================================\n   제145-2-8-2-1단계\n   언론보도 관리 화면 제목 설정\n===================================== */\n\nfunction applyPressManagementView() {\n\n  const params =\n    new URLSearchParams(\n      window.location.search\n    );\n\n  const isPress =\n    params.get(\"category\") === \"press\";\n\n  if (!isPress) {\n    return;\n  }\n\n/* =====================================\n   최상단 관리자 화면 제목 변경\n===================================== */\n\nconst pageHeading =\n  document.querySelector(\n    \"header h1\"\n  );\n\nif (pageHeading) {\n\n  pageHeading.textContent =\n    \"📺 언론보도 관리\";\n\n}\n  \n  /* 관리자 화면 제목 */\n\n  const heading =\n    document.querySelector(\n      \"#newsAdminArea h2\"\n    );\n\n  if (heading) {\n\n    heading.textContent =\n      \"📺 언론보도 목록\";\n\n  }\n\n  /* 관리자 화면 안내 문구 */\n\n  const description =\n    document.querySelector(\n      \"#newsAdminArea > p\"\n    );\n\n  if (description) {\n\n    description.textContent =\n      \"신문기사와 방송 보도자료를 관리합니다.\";\n\n  }\n\n  /* 등록 버튼 문구 */\n\n  const writeButton =\n    document.getElementById(\n      \"newsWriteButton\"\n    );\n\n  if (writeButton) {\n\n    writeButton.textContent =\n      \"＋ 새 언론보도 등록\";\n\n  }\n\n}\n\n/* 언론보도 화면 적용 */\n\napplyPressManagementView();\n\n /* =====================================\n   언론보도 날짜 명칭 변경\n===================================== */\n\nif (pressManagementMode) {\n\n  const dateLabel =\n    document.querySelector(\n      'label[for=\"newsDate\"]'\n    );\n\n  if (dateLabel) {\n\n    dateLabel.textContent =\n      \"보도(방영)일자 *\";\n\n  }\n\n} \n  \ncheckNewsAdmin();\n\n\u003c/script>\n\n</body>\n\n</html>\n",
  "view=admin-resources": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<title>관리자 통합자료실 | 글로벌 AI 허브</title>\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\n[hidden] {\n  display: none !important;\n}\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", Arial, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\nheader {\n  background: #0754a6;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n}\n\nheader h1 {\n  margin: 0;\n  font-size: clamp(24px, 4vw, 32px);\n}\n\nheader a {\n  color: white;\n}\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 25px 15px;\n}\n\nsection {\n  background: white;\n  border-radius: 12px;\n  padding: 25px;\n  margin-bottom: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.08);\n}\n\nh2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\nlabel {\n  display: block;\n  font-weight: bold;\n  margin-top: 15px;\n}\n\ninput,\nselect,\ntextarea {\n  width: 100%;\n  padding: 11px;\n  margin-top: 5px;\n  border: 1px solid #cbd5e1;\n  border-radius: 6px;\n  font: inherit;\n}\n\ntextarea {\n  min-height: 120px;\n  resize: vertical;\n}\n\nbutton {\n  padding: 11px 17px;\n  margin: 8px 5px 5px 0;\n  border: 0;\n  border-radius: 6px;\n  background: #0754a6;\n  color: white;\n  cursor: pointer;\n  font-weight: bold;\n}\n\nbutton:hover {\n  opacity: .9;\n}\n\nbutton:disabled {\n  opacity: .5;\n  cursor: not-allowed;\n}\n\nbutton.secondary {\n  background: #64748b;\n}\n\nbutton.danger {\n  background: #b42318;\n}\n\n.toolbar {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 12px;\n}\n\n.row {\n  padding: 15px 0;\n  border-bottom: 1px solid #e2e8f0;\n}\n\n.row:last-child {\n  border-bottom: 0;\n}\n\n.muted {\n  color: #64748b;\n}\n\n.error {\n  color: #b42318;\n}\n\n.success {\n  color: #087443;\n}\n\n.photo-preview {\n  display: block;\n  max-width: 180px;\n  max-height: 150px;\n  object-fit: contain;\n  margin-top: 10px;\n}\n\n.status {\n  padding: 12px;\n  margin-top: 15px;\n  border-radius: 6px;\n  background: #f1f5f9;\n  white-space: pre-wrap;\n}\n\n.category-row {\n  border-bottom: 1px solid #e2e8f0;\n  padding: 15px 0;\n}\n\n.category-row strong {\n  display: block;\n}\n\n.category-status {\n  display: inline-block;\n  padding: 3px 10px;\n  border-radius: 20px;\n  background: #eaf4ff;\n  color: #0754a6;\n  font-size: 13px;\n}\n\n.category-status.inactive {\n  background: #f1f5f9;\n  color: #64748b;\n}\n\nfooter {\n  text-align: center;\n  background: #10315e;\n  color: white;\n  padding: 30px 15px;\n}\n\n@media(max-width:600px) {\n  section {\n    padding: 18px;\n  }\n\n  .toolbar {\n    flex-direction: column;\n    align-items: stretch;\n  }\n\n  .toolbar button {\n    width: 100%;\n  }\n}\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n  <h1>관리자 통합자료실</h1>\n\n  <p>\n    경기도 글로벌 AI 허브 유치<br>\n    고양특례시 범시민추진위원회\n  </p>\n\n  <a href=\"index.html\">\n    ← 홈페이지로 돌아가기\n  </a>\n</header>\n\n<main>\n\n\u003c!-- 관리자 로그인 -->\n\n<section id=\"loginSection\">\n\n  <h2>관리자 로그인</h2>\n\n  <form id=\"loginForm\">\n\n    <label for=\"email\">이메일</label>\n    <input\n      id=\"email\"\n      type=\"email\"\n      autocomplete=\"username\"\n      required\n    >\n\n    <label for=\"password\">비밀번호</label>\n    <input\n      id=\"password\"\n      type=\"password\"\n      autocomplete=\"current-password\"\n      required\n    >\n\n    <button type=\"submit\" id=\"loginButton\">\n      로그인\n    </button>\n\n  </form>\n\n  <p id=\"loginMessage\" role=\"status\"></p>\n\n</section>\n\n\u003c!-- 관리자 전용 영역 -->\n\n<div id=\"adminArea\" hidden>\n\n<section>\n\n  <div class=\"toolbar\">\n\n    <strong id=\"adminEmail\"></strong>\n\n    <button\n      id=\"logoutButton\"\n      type=\"button\"\n      class=\"secondary\">\n      로그아웃\n    </button>\n\n    <a href=\"gallery.html\">\n      📸 시민활동 사진기록관 보기\n    </a>\n\n  </div>\n\n</section>\n\n\u003c!-- 자료 등록 및 수정 -->\n\n<section id=\"resourceEditorSection\">\n\n  <h2 id=\"formHeading\">\n    자료 등록\n  </h2>\n\n  <form id=\"resourceForm\">\n\n    <label for=\"resourceCategory\">\n      자료 종류\n    </label>\n\n    <select id=\"resourceCategory\" required>\n      <option value=\"document\">문서</option>\n      <option value=\"image\">사진</option>\n      <option value=\"video\">동영상</option>\n      <option value=\"audio\">음성</option>\n      <option value=\"other\">기타</option>\n    </select>\n\n    <label for=\"resourceTitle\">\n      자료 제목\n    </label>\n\n    <input\n      id=\"resourceTitle\"\n      maxlength=\"300\"\n      required\n    >\n\n    <label for=\"resourceContent\">\n      자료 설명\n    </label>\n\n    <textarea id=\"resourceContent\"></textarea>\n\n    \u003c!-- 사진 전용 입력 -->\n\n    <div id=\"photoFields\" hidden>\n\n      <label for=\"photoActivityCategory\">\n        사진 활동 분류\n      </label>\n\n      <select id=\"photoActivityCategory\"></select>\n\n      <label for=\"photoEventName\">\n        행사명\n      </label>\n\n      <input\n        id=\"photoEventName\"\n        maxlength=\"200\"\n      >\n\n      <label for=\"photoEventDate\">\n        행사일\n      </label>\n\n      <input\n        id=\"photoEventDate\"\n        type=\"date\"\n      >\n\n    </div>\n\n    \u003c!-- 동영상 전용 입력 -->\n\n    <div id=\"videoFields\" hidden>\n\n      <label for=\"youtubeUrl\">\n        유튜브 주소\n      </label>\n\n      <input\n        id=\"youtubeUrl\"\n        type=\"url\"\n        placeholder=\"https://www.youtube.com/watch?v=...\"\n      >\n\n    </div>\n\n    \u003c!-- 첨부파일 -->\n\n    <label for=\"resourceFiles\">\n      첨부파일\n    </label>\n\n    <input\n      id=\"resourceFiles\"\n      type=\"file\"\n      multiple\n    >\n\n    <p class=\"muted\">\n      사진은 최대 10개까지 등록할 수 있으며,\n      사진 파일당 최대 크기는 20MB입니다.\n    </p>\n\n    <div id=\"existingAttachments\"></div>\n\n    <button\n      id=\"saveButton\"\n      type=\"submit\">\n      자료 저장\n    </button>\n\n    <button\n      id=\"cancelEditButton\"\n      type=\"button\"\n      class=\"secondary\"\n      hidden>\n      수정 취소\n    </button>\n\n    <p\n      id=\"saveMessage\"\n      class=\"status\"\n      role=\"status\">\n    </p>\n\n  </form>\n\n</section>\n\n\u003c!-- 등록 자료 목록 -->\n\n<section>\n\n  <h2>등록된 자료</h2>\n\n  <button\n    id=\"refreshResources\"\n    type=\"button\">\n    목록 새로고침\n  </button>\n\n  <div id=\"resourceList\">\n    자료를 불러오고 있습니다.\n  </div>\n\n</section>\n\n\u003c!-- 활동 분류 관리 -->\n\n<section>\n\n  <h2>📂 사진 활동 분류 관리</h2>\n\n  <p>\n    시민활동 사진기록관에서 사용하는\n    활동 분류를 관리합니다.\n  </p>\n\n  <form id=\"categoryForm\">\n\n    <label for=\"categoryCode\">\n      분류 코드\n    </label>\n\n    <input\n      id=\"categoryCode\"\n      placeholder=\"예: campaign\"\n      required\n    >\n\n    <label for=\"categoryNameKo\">\n      한글 분류명\n    </label>\n\n    <input\n      id=\"categoryNameKo\"\n      required\n    >\n\n    <label for=\"categoryNameEn\">\n      영문 분류명\n    </label>\n\n    <input id=\"categoryNameEn\">\n\n    <label for=\"categorySort\">\n      표시 순서\n    </label>\n\n    <input\n      id=\"categorySort\"\n      type=\"number\"\n      value=\"0\"\n      required\n    >\n\n    <button type=\"submit\">\n      활동 분류 추가\n    </button>\n\n  </form>\n\n  <div id=\"categoryList\"></div>\n\n</section>\n\n</div>\n\n</main>\n\n<footer>\n\n  <p>\n    경기도 글로벌 AI 허브 유치<br>\n    고양특례시 범시민추진위원회\n  </p>\n\n  <p>\n    AI for All · AI for Humanity\n  </p>\n\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   Supabase 연결\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   기본 설정\n===================================== */\n\nconst $ = id =>\n  document.getElementById(id);\n\nconst MAX_PHOTOS = 10;\n\nconst MAX_PHOTO_BYTES =\n  20 * 1024 * 1024;\n\nlet currentUser = null;\n\nlet editingId = null;\n\nlet attachments = [];\n\nlet categories = [];\n\nlet saving = false;\n\n/* =====================================\n   공통 함수\n===================================== */\n\nfunction message(id, text, isError = false) {\n\n  const element = $(id);\n\n  element.textContent = text;\n\n  element.className =\n    isError ? \"status error\" : \"status success\";\n\n}\n\nfunction createButton(\n  text,\n  action,\n  className = \"\"\n) {\n\n  const element =\n    document.createElement(\"button\");\n\n  element.type = \"button\";\n  element.textContent = text;\n  element.className = className;\n\n  element.addEventListener(\n    \"click\",\n    action\n  );\n\n  return element;\n\n}\n\nfunction createParagraph(text) {\n\n  const element =\n    document.createElement(\"p\");\n\n  element.textContent = text;\n\n  return element;\n\n}\n\n/* =====================================\n   관리자 권한 확인\n===================================== */\n\nasync function verifyAdmin() {\n\n  const {\n    data: { user },\n    error\n  } = await supabase.auth.getUser();\n\n  if (error || !user) {\n    return null;\n  }\n\n  const result =\n    await supabase.rpc(\n      \"is_resource_admin\"\n    );\n\n  if (\n    result.error ||\n    result.data !== true\n  ) {\n    return null;\n  }\n\n  return user;\n\n}\n\n/* =====================================\n   로그인 상태 확인\n===================================== */\n\nasync function refreshAuth() {\n\n  currentUser =\n    await verifyAdmin();\n\n  $(\"loginSection\").hidden =\n    Boolean(currentUser);\n\n  $(\"adminArea\").hidden =\n    !currentUser;\n\n  if (!currentUser) {\n    return;\n  }\n\n  $(\"adminEmail\").textContent =\n    currentUser.email || \"\";\n\n  const results =\n    await Promise.allSettled([\n      loadCategories(),\n      loadResources()\n    ]);\n\n  results.forEach((result, index) => {\n\n    if (result.status === \"rejected\") {\n\n      console.error(\n        \"관리자 초기화 오류:\",\n        result.reason\n      );\n\n      if (index === 0) {\n        $(\"categoryList\").textContent =\n          \"활동 분류를 불러오지 못했습니다.\";\n      }\n\n    }\n\n  });\n\n}\n\n/* =====================================\n   로그인\n===================================== */\n\n$(\"loginForm\").addEventListener(\n  \"submit\",\n  async event => {\n\n    event.preventDefault();\n\n    const loginButton =\n      $(\"loginButton\");\n\n    loginButton.disabled = true;\n\n    try {\n\n      const { error } =\n        await supabase.auth.signInWithPassword({\n          email: $(\"email\").value.trim(),\n          password: $(\"password\").value\n        });\n\n      if (error) {\n        throw error;\n      }\n\n      await refreshAuth();\n\n      if (!currentUser) {\n        throw new Error(\n          \"관리자 권한이 없습니다.\"\n        );\n      }\n\n      $(\"password\").value = \"\";\n\n    } catch (error) {\n\n      message(\n        \"loginMessage\",\n        error.message,\n        true\n      );\n\n    } finally {\n\n      loginButton.disabled = false;\n\n    }\n\n  }\n);\n\n/* =====================================\n   로그아웃\n===================================== */\n\n$(\"logoutButton\").addEventListener(\n  \"click\",\n  async () => {\n\n    const { error } =\n      await supabase.auth.signOut();\n\n    if (error) {\n      alert(error.message);\n      return;\n    }\n\n    currentUser = null;\n\n    resetEditor();\n\n    $(\"adminArea\").hidden = true;\n\n    $(\"loginSection\").hidden = false;\n\n    $(\"password\").value = \"\";\n\n  }\n);\n\n/* =====================================\n   자료 종류별 입력 항목\n===================================== */\n\nfunction updateCategoryFields() {\n\n  const category =\n    $(\"resourceCategory\").value;\n\n  const isImage =\n    category === \"image\";\n\n  const isVideo =\n    category === \"video\";\n\n  $(\"photoFields\").hidden =\n    !isImage;\n\n  $(\"videoFields\").hidden =\n    !isVideo;\n\n  $(\"photoActivityCategory\").required =\n    isImage;\n\n  $(\"photoEventName\").required =\n    isImage && !editingId;\n\n  $(\"photoEventDate\").required =\n    isImage && !editingId;\n\n  $(\"resourceFiles\").accept =\n    isImage ? \"image/*\" : \"\";\n\n}\n\n$(\"resourceCategory\").addEventListener(\n  \"change\",\n  updateCategoryFields\n);\n\n/* =====================================\n   활동 분류 조회\n===================================== */\n\nasync function loadCategories() {\n\n  const { data, error } =\n    await supabase\n      .from(\"photo_activity_categories\")\n      .select(`\n        code,\n        name_ko,\n        name_en,\n        sort_order,\n        is_active\n      `)\n      .order(\"sort_order\", {\n        ascending: true\n      });\n\n  if (error) {\n    throw error;\n  }\n\n  categories = data || [];\n\n  renderCategorySelect();\n\n  renderCategoryManager();\n\n}\n\n/* =====================================\n   사진 분류 선택 메뉴\n===================================== */\n\nfunction renderCategorySelect() {\n\n  const select =\n    $(\"photoActivityCategory\");\n\n  const previousValue =\n    select.value;\n\n  select.replaceChildren();\n\n  select.add(\n    new Option(\n      \"활동 분류를 선택하세요\",\n      \"\"\n    )\n  );\n\n  categories\n    .filter(item => item.is_active)\n    .forEach(item => {\n\n      select.add(\n        new Option(\n          item.name_ko,\n          item.code\n        )\n      );\n\n    });\n\n  if (\n    previousValue &&\n    !Array.from(select.options).some(\n      option =>\n        option.value === previousValue\n    )\n  ) {\n\n    select.add(\n      new Option(\n        previousValue + \" (기존 분류)\",\n        previousValue\n      )\n    );\n\n  }\n\n  select.value =\n    previousValue;\n\n}\n\n/* =====================================\n   활동 분류 관리 목록\n===================================== */\n\nfunction renderCategoryManager() {\n\n  const container =\n    $(\"categoryList\");\n\n  container.replaceChildren();\n\n  categories.forEach(category => {\n\n    const row =\n      document.createElement(\"div\");\n\n    row.className =\n      \"category-row\";\n\n    const title =\n      document.createElement(\"strong\");\n\n    title.textContent =\n      `${category.name_ko} (${category.code})`;\n\n    const status =\n      document.createElement(\"span\");\n\n    status.className =\n      \"category-status\" +\n      (\n        category.is_active\n          ? \"\"\n          : \" inactive\"\n      );\n\n    status.textContent =\n      category.is_active\n        ? \"활성\"\n        : \"비활성\";\n\n    const editButton =\n      createButton(\n        \"이름·순서 수정\",\n        async () => {\n\n          const nameKo = prompt(\n            \"한글 분류명\",\n            category.name_ko\n          );\n\n          if (nameKo === null) {\n            return;\n          }\n\n          if (!nameKo.trim()) {\n            alert(\"분류명을 입력하세요.\");\n            return;\n          }\n\n          const nameEn = prompt(\n            \"영문 분류명\",\n            category.name_en || \"\"\n          );\n\n          if (nameEn === null) {\n            return;\n          }\n\n          const sort = prompt(\n            \"표시 순서\",\n            String(\n              category.sort_order ?? 0\n            )\n          );\n\n          if (sort === null) {\n            return;\n          }\n\n          if (\n            sort.trim() === \"\" ||\n            !Number.isInteger(Number(sort))\n          ) {\n            alert(\"올바른 순서를 입력하세요.\");\n            return;\n          }\n\n          await updateCategory(\n            category.code,\n            {\n              name_ko: nameKo.trim(),\n              name_en:\n                nameEn.trim() || null,\n              sort_order: Number(sort)\n            }\n          );\n\n        }\n      );\n\n    const toggleButton =\n      createButton(\n        category.is_active\n          ? \"비활성화\"\n          : \"활성화\",\n        async () => {\n\n          await updateCategory(\n            category.code,\n            {\n              is_active:\n                !category.is_active\n            }\n          );\n\n        },\n        \"secondary\"\n      );\n\n    row.append(\n      title,\n      status,\n      document.createElement(\"br\"),\n      editButton,\n      toggleButton\n    );\n\n    container.appendChild(row);\n\n  });\n\n}\n\n/* =====================================\n   활동 분류 수정\n===================================== */\n\nasync function updateCategory(\n  code,\n  changes\n) {\n\n  try {\n\n    if (!await verifyAdmin()) {\n      throw new Error(\n        \"관리자 권한이 없습니다.\"\n      );\n    }\n\n    const { error } =\n      await supabase\n        .from(\"photo_activity_categories\")\n        .update(changes)\n        .eq(\"code\", code);\n\n    if (error) {\n      throw error;\n    }\n\n    await loadCategories();\n\n  } catch (error) {\n\n    alert(\n      \"활동 분류 수정 실패: \" +\n      error.message\n    );\n\n  }\n\n}\n\n/* =====================================\n   활동 분류 추가\n===================================== */\n\n$(\"categoryForm\").addEventListener(\n  \"submit\",\n  async event => {\n\n    event.preventDefault();\n\n    try {\n\n      if (!await verifyAdmin()) {\n        throw new Error(\n          \"관리자 권한이 없습니다.\"\n        );\n      }\n\n      const code =\n        $(\"categoryCode\")\n          .value.trim()\n          .toLowerCase();\n\n      const nameKo =\n        $(\"categoryNameKo\")\n          .value.trim();\n\n      const nameEn =\n        $(\"categoryNameEn\")\n          .value.trim();\n\n      const sort =\n        Number(\n          $(\"categorySort\").value\n        );\n\n      if (\n        !/^[a-z][a-z0-9_-]*$/.test(code)\n      ) {\n        throw new Error(\n          \"분류 코드는 영문 소문자로 시작해야 합니다.\"\n        );\n      }\n\n      if (!nameKo) {\n        throw new Error(\n          \"한글 분류명을 입력하세요.\"\n        );\n      }\n\n      if (!Number.isInteger(sort)) {\n        throw new Error(\n          \"표시 순서를 확인하세요.\"\n        );\n      }\n\n      const { error } =\n        await supabase\n          .from(\"photo_activity_categories\")\n          .insert({\n            code,\n            name_ko: nameKo,\n            name_en: nameEn || null,\n            sort_order: sort,\n            is_active: true\n          });\n\n      if (error) {\n        throw error;\n      }\n\n      $(\"categoryForm\").reset();\n\n      await loadCategories();\n\n      alert(\n        \"활동 분류가 추가되었습니다.\"\n      );\n\n    } catch (error) {\n\n      alert(error.message);\n\n    }\n\n  }\n);\n\n/* =====================================\n   자료 목록 조회\n===================================== */\n\nasync function loadResources() {\n\n  const container =\n    $(\"resourceList\");\n\n  container.textContent =\n    \"자료를 불러오고 있습니다.\";\n\n  const { data, error } =\n    await supabase\n      .from(\"resource_posts\")\n      .select(`\n        id,\n        title,\n        content,\n        category,\n        youtube_url,\n        activity_category,\n        event_name,\n        event_date,\n        created_at\n      `)\n      .order(\"created_at\", {\n        ascending: false\n      })\n      .limit(500);\n\n  if (error) {\n\n    container.textContent =\n      \"자료 조회 실패: \" +\n      error.message;\n\n    return;\n\n  }\n\n  container.replaceChildren();\n\n  if (!data?.length) {\n\n    container.append(\n      createParagraph(\n        \"등록된 자료가 없습니다.\"\n      )\n    );\n\n    return;\n\n  }\n\n  data.forEach(post => {\n\n    const row =\n      document.createElement(\"div\");\n\n    row.className = \"row\";\n\n    const title =\n      document.createElement(\"strong\");\n\n    title.textContent =\n      post.title || \"제목 없음\";\n\n    const info =\n      createParagraph(\n        `${post.category} · ${\n          post.event_name ||\n          post.created_at?.slice(0, 10) ||\n          \"\"\n        }`\n      );\n\n    info.className = \"muted\";\n\n    const editButton =\n      createButton(\n        \"수정\",\n        () => editResource(post)\n      );\n\n    const deleteButton =\n      createButton(\n        \"삭제\",\n        () => deleteResource(post),\n        \"danger\"\n      );\n\n    row.append(\n      title,\n      info,\n      editButton,\n      deleteButton\n    );\n\n    container.appendChild(row);\n\n  });\n\n}\n\n$(\"refreshResources\").addEventListener(\n  \"click\",\n  loadResources\n);\n\n/* =====================================\n   기존 첨부파일 조회\n===================================== */\n\nasync function loadAttachments(postId) {\n\n  const { data, error } =\n    await supabase\n      .from(\"resource_attachments\")\n      .select(`\n        resource_id,\n        file_name,\n        file_path,\n        file_type,\n        attachment_type\n      `)\n      .eq(\"resource_id\", postId);\n\n  if (error) {\n    throw error;\n  }\n\n  attachments = data || [];\n\n  renderAttachments();\n\n}\n\n/* =====================================\n   첨부파일 목록\n===================================== */\n\nfunction renderAttachments() {\n\n  const container =\n    $(\"existingAttachments\");\n\n  container.replaceChildren();\n\n  if (!editingId) {\n    return;\n  }\n\n  const heading =\n    document.createElement(\"h3\");\n\n  heading.textContent =\n    \"기존 첨부파일\";\n\n  container.appendChild(heading);\n\n  if (attachments.length === 0) {\n\n    container.append(\n      createParagraph(\n        \"등록된 첨부파일이 없습니다.\"\n      )\n    );\n\n    return;\n\n  }\n\n  attachments.forEach(file => {\n\n    const row =\n      document.createElement(\"div\");\n\n    row.className = \"row\";\n\n    const { data } =\n      supabase.storage\n        .from(\"resource-files\")\n        .getPublicUrl(file.file_path);\n\n    const link =\n      document.createElement(\"a\");\n\n    link.href = data.publicUrl;\n\n    link.target = \"_blank\";\n\n    link.rel =\n      \"noopener noreferrer\";\n\n    link.textContent =\n      file.file_name ||\n      \"첨부파일 보기\";\n\n    row.appendChild(link);\n\n    const isImage =\n      file.file_type?.startsWith(\n        \"image/\"\n      );\n\n    if (isImage) {\n\n      const img =\n        document.createElement(\"img\");\n\n      img.src = data.publicUrl;\n\n      img.alt =\n        file.file_name ||\n        \"첨부 사진\";\n\n      img.className =\n        \"photo-preview\";\n\n      row.appendChild(img);\n\n    }\n\n    const deleteButton =\n      createButton(\n        \"첨부 삭제\",\n        async () => {\n\n          if (\n            !confirm(\n              \"이 첨부파일을 삭제하시겠습니까?\"\n            )\n          ) {\n            return;\n          }\n\n          try {\n\n            if (!await verifyAdmin()) {\n              throw new Error(\n                \"관리자 권한이 없습니다.\"\n              );\n            }\n\n            const postId = editingId;\n\n            const { error } =\n              await supabase\n                .from(\"resource_attachments\")\n                .delete()\n                .eq(\n                  \"resource_id\",\n                  postId\n                )\n                .eq(\n                  \"file_path\",\n                  file.file_path\n                );\n\n            if (error) {\n              throw error;\n            }\n\n            const removed =\n              await supabase.storage\n                .from(\"resource-files\")\n                .remove([\n                  file.file_path\n                ]);\n\n            if (removed.error) {\n\n              console.warn(\n                \"Storage 정리 필요:\",\n                removed.error\n              );\n\n              alert(\n                \"첨부 연결은 삭제되었지만 \" +\n                \"저장소 파일 정리가 필요합니다.\"\n              );\n\n            }\n\n            await loadAttachments(postId);\n\n          } catch (error) {\n\n            alert(\n              \"첨부 삭제 실패: \" +\n              error.message\n            );\n\n          }\n\n        },\n        \"danger\"\n      );\n\n    row.appendChild(\n      document.createElement(\"br\")\n    );\n\n    row.appendChild(deleteButton);\n\n    container.appendChild(row);\n\n  });\n\n}\n\n/* =====================================\n   자료 수정\n===================================== */\n\nasync function editResource(post) {\n\n  editingId = post.id;\n\n  $(\"formHeading\").textContent =\n    \"자료 수정\";\n\n  $(\"resourceCategory\").value =\n    post.category;\n\n  $(\"resourceTitle\").value =\n    post.title || \"\";\n\n  $(\"resourceContent\").value =\n    post.content || \"\";\n\n  $(\"youtubeUrl\").value =\n    post.youtube_url || \"\";\n\n  updateCategoryFields();\n\n  const select =\n    $(\"photoActivityCategory\");\n\n  select.value =\n    post.activity_category || \"\";\n\n  if (\n    post.activity_category &&\n    !select.value\n  ) {\n\n    select.add(\n      new Option(\n        post.activity_category +\n        \" (기존 분류)\",\n        post.activity_category\n      )\n    );\n\n    select.value =\n      post.activity_category;\n\n  }\n\n  $(\"photoEventName\").value =\n    post.event_name || \"\";\n\n  $(\"photoEventDate\").value =\n    post.event_date\n      ? String(post.event_date).slice(0, 10)\n      : \"\";\n\n  $(\"cancelEditButton\").hidden =\n    false;\n\n  $(\"resourceFiles\").value = \"\";\n\n  try {\n\n    await loadAttachments(post.id);\n\n  } catch (error) {\n\n    message(\n      \"saveMessage\",\n      \"첨부파일 조회 실패: \" +\n      error.message,\n      true\n    );\n\n  }\n\n  $(\"resourceEditorSection\")\n    .scrollIntoView({\n      behavior: \"smooth\"\n    });\n\n}\n\n/* =====================================\n   수정 취소\n===================================== */\n\nfunction resetEditor() {\n\n  editingId = null;\n\n  attachments = [];\n\n  $(\"resourceForm\").reset();\n\n  $(\"formHeading\").textContent =\n    \"자료 등록\";\n\n  $(\"cancelEditButton\").hidden =\n    true;\n\n  $(\"existingAttachments\")\n    .replaceChildren();\n\n  $(\"saveMessage\").textContent = \"\";\n\n  updateCategoryFields();\n\n}\n\n$(\"cancelEditButton\").addEventListener(\n  \"click\",\n  resetEditor\n);\n\n/* =====================================\n   첨부파일 종류\n===================================== */\n\nfunction getAttachmentType(category) {\n\n  if (category === \"image\") {\n    return \"image\";\n  }\n\n  if (category === \"audio\") {\n    return \"audio\";\n  }\n\n  if (category === \"video\") {\n    return \"video\";\n  }\n\n  return \"document\";\n\n}\n\n/* =====================================\n   파일 업로드\n===================================== */\n\nasync function uploadFiles(\n  postId,\n  category\n) {\n\n  const files =\n    Array.from(\n      $(\"resourceFiles\").files\n    );\n\n  if (files.length === 0) {\n    return;\n  }\n\n  if (category === \"image\") {\n\n    const { data: existing, error } =\n      await supabase\n        .from(\"resource_attachments\")\n        .select(\"file_path,attachment_type\")\n        .eq(\"resource_id\", postId)\n        .eq(\"attachment_type\", \"image\");\n\n    if (error) {\n      throw error;\n    }\n\n    const existingCount =\n      existing?.length || 0;\n\n    if (\n      existingCount + files.length >\n      MAX_PHOTOS\n    ) {\n      throw new Error(\n        \"사진은 최대 10개까지 등록할 수 있습니다.\"\n      );\n    }\n\n    for (const file of files) {\n\n      if (\n        !file.type.startsWith(\"image/\")\n      ) {\n        throw new Error(\n          \"사진 파일만 등록할 수 있습니다.\"\n        );\n      }\n\n      if (\n        file.size > MAX_PHOTO_BYTES\n      ) {\n        throw new Error(\n          \"사진 파일당 최대 크기는 20MB입니다.\"\n        );\n      }\n\n    }\n\n  }\n\n  for (const file of files) {\n\n    const safeName =\n      file.name\n        .replace(\n          /[^a-zA-Z0-9._-]/g,\n          \"_\"\n        )\n        .slice(-120);\n\n    const {\n  data: { user },\n  error: userError\n} = await supabase.auth.getUser();\n\nif (userError || !user) {\n  throw new Error(\n    \"로그인 사용자 정보를 확인할 수 없습니다.\"\n  );\n}\n\nconst path =\n  `${user.id}/resources/${postId}/` +\n  `${crypto.randomUUID()}-${safeName}`;\n    const uploaded =\n      await supabase.storage\n        .from(\"resource-files\")\n        .upload(path, file, {\n          contentType:\n            file.type ||\n            \"application/octet-stream\",\n          upsert: false\n        });\n\n    if (uploaded.error) {\n      throw uploaded.error;\n    }\n\n    const inserted =\n  await supabase\n    .from(\"resource_attachments\")\n    .insert({\n      resource_id: postId,\n      uploader_id: user.id,\n      file_name: file.name,\n      file_path: path,\n      file_type:\n        file.type ||\n        \"application/octet-stream\",\n      file_size: file.size,\n      attachment_type:\n        getAttachmentType(category)\n    });\n\n    if (inserted.error) {\n\n      await supabase.storage\n        .from(\"resource-files\")\n        .remove([path]);\n\n      throw inserted.error;\n\n    }\n\n  }\n\n}\n\n/* =====================================\n   자료 저장\n===================================== */\n\n$(\"resourceForm\").addEventListener(\n  \"submit\",\n  async event => {\n\n    event.preventDefau
