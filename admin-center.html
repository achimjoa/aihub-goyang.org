ry[1].trim() &&\n      Number.isInteger(entry[2]) &&\n      entry[2] >= 1 &&\n      entry[2] <= totalPages\n    )\n  ) {\n    showMessage(\"createMessage\", \"목차 형식 오류\", true);\n    return;\n  }\n\n  const confirmed = confirm(\n    \"신규 전자책을 비공개 등록하시겠습니까?\\n\\n\" +\n    \"제목: \" + title + \"\\n\" +\n    \"발간번호: \" + issueCode + \"\\n\" +\n    \"구분: \" + edition + \"\\n\" +\n    \"페이지: \" + totalPages\n  );\n\n  if (!confirmed) return;\n\n  creating = true;\n  $(\"createButton\").disabled = true;\n\n  showMessage(\"createMessage\", \"등록 처리 중입니다.\");\n\n  try {\n\n    const result = await callAdmin({\n      action: \"create\",\n      title,\n      issue_code: issueCode,\n      ebook_edition: edition,\n      total_pages: totalPages,\n      contents\n    });\n\n    registrationComplete = true;\n\n    $(\"createButton\").textContent = \"등록 완료\";\n\n    showMessage(\n      \"createMessage\",\n      \"등록 성공!\\n문서 ID: \" +\n      result.document_id +\n      \"\\n발간번호: \" +\n      result.issue_code +\n      \"\\n게시 상태: 비공개\"\n    );\n\n    await loadEbooks();\n\n  } catch (error) {\n\n    if (error.status === 409) {\n      showMessage(\n        \"createMessage\",\n        \"이미 등록된 발간번호입니다. 목록을 확인하세요.\",\n        true\n      );\n    } else {\n      registrationNeedsReview = true;\n\n      showMessage(\n        \"createMessage\",\n        \"등록 결과 확인 필요: \" +\n        error.message +\n        \"\\n중복 등록 방지를 위해 버튼을 잠갔습니다.\" +\n        \"\\n목록을 새로고침하여 확인하세요.\",\n        true\n      );\n    }\n\n  } finally {\n    creating = false;\n\n    if (\n      !registrationComplete &&\n      !registrationNeedsReview\n    ) {\n      $(\"createButton\").disabled = false;\n    }\n  }\n}\n\n// ==========================================\n// 이벤트\n// ==========================================\n\n$(\"refreshButton\").addEventListener(\n  \"click\",\n  loadEbooks\n);\n\n$(\"createForm\").addEventListener(\n  \"submit\",\n  createEbook\n);\n\ninitialize().catch(error => {\n  showMessage(\n    \"authMessage\",\n    \"초기화 실패: \" + error.message,\n    true\n  );\n});\n\n\u003c/script>\n</body>\n</html>\n",
  "view=admin-ebooks-preview-test": "<!DOCTYPE html>\n<html lang=\"ko\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<title>비공개 전자책 관리자 미리보기 시험</title>\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", Arial, sans-serif;\n  background: #f3f7fc;\n  color: #17315b;\n}\n\n[hidden] {\n  display: none !important;\n}\n\nheader {\n  background: #0754a6;\n  color: white;\n  text-align: center;\n  padding: 28px 15px;\n}\n\nheader h1 {\n  margin: 0 0 12px;\n  font-size: 26px;\n}\n\nmain {\n  max-width: 950px;\n  margin: auto;\n  padding: 24px 15px;\n}\n\nsection {\n  background: white;\n  padding: 25px;\n  margin-bottom: 24px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.07);\n}\n\nh2 {\n  color: #0754a6;\n}\n\n.message {\n  padding: 15px;\n  margin: 15px 0;\n  background: #eef4fc;\n  border-radius: 8px;\n  line-height: 1.8;\n  white-space: pre-wrap;\n}\n\n.success {\n  color: #167347;\n}\n\n.error {\n  color: #b42318;\n}\n\n.notice {\n  padding: 15px;\n  background: #fff8e8;\n  border-left: 4px solid #d9a441;\n  line-height: 1.8;\n}\n\n.reader {\n  text-align: center;\n}\n\n#pageImage {\n  display: block;\n  max-width: 100%;\n  height: auto;\n  max-height: 85vh;\n  margin: 20px auto;\n  border: 1px solid #dce6f2;\n  border-radius: 6px;\n  object-fit: contain;\n}\n\n.controls {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  gap: 10px;\n  flex-wrap: wrap;\n  margin: 20px 0;\n}\n\nbutton {\n  padding: 12px 18px;\n  background: #0754a6;\n  color: white;\n  border: none;\n  border-radius: 7px;\n  cursor: pointer;\n  font: inherit;\n}\n\nbutton:disabled {\n  opacity: .45;\n  cursor: not-allowed;\n}\n\n#pageInfo {\n  min-width: 110px;\n  font-weight: bold;\n  text-align: center;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 25px;\n}\n\na {\n  color: #0754a6;\n}\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n  <h1>📚 비공개 전자책 관리자 미리보기</h1>\n  <p>고양특례시 글로벌 AI 허브 디지털 도서관</p>\n</header>\n\n<main>\n\n<section>\n\n<h2>1. 관리자 인증</h2>\n\n<div\n  id=\"authMessage\"\n  class=\"message\"\n  role=\"status\"\n  aria-live=\"polite\"\n>\n로그인 상태를 확인하고 있습니다.\n</div>\n\n</section>\n\n<section>\n\n<h2>2. 시험 전자책 정보</h2>\n\n<p><strong>문서 ID:</strong> 12</p>\n\n<p>\n<strong>전자책 제목:</strong>\n디지털 도서관 관리센터 등록 시험\n</p>\n\n<p><strong>발간번호:</strong> issue-test-02</p>\n\n<p><strong>전체 페이지:</strong> 3쪽</p>\n\n<p><strong>게시 상태:</strong> 비공개</p>\n\n<div class=\"notice\">\n이 페이지는 관리자 전용 시험 페이지입니다.\n비공개 전자책의 본문 이미지는 서버에서\n관리자 권한을 확인한 후에만 열람할 수 있습니다.\n</div>\n\n</section>\n\n<section id=\"previewSection\" hidden>\n\n<h2>3. 전자책 미리보기</h2>\n\n<div class=\"controls\">\n\n<button id=\"firstButton\" type=\"button\">\n표지\n</button>\n\n<button id=\"prevButton\" type=\"button\">\n이전\n</button>\n\n<span id=\"pageInfo\">표지 / 3</span>\n\n<button id=\"nextButton\" type=\"button\">\n다음\n</button>\n\n<button id=\"lastButton\" type=\"button\">\n마지막\n</button>\n\n</div>\n\n<div id=\"previewMessage\"\n     class=\"message\"\n     role=\"status\"\n     aria-live=\"polite\">\n미리보기를 준비하고 있습니다.\n</div>\n\n<div id=\"reader\" class=\"reader\" hidden>\n\n<img\n  id=\"pageImage\"\n  alt=\"전자책 이미지\"\n  referrerpolicy=\"no-referrer\"\n>\n\n</div>\n\n</section>\n\n<section>\n\n<h2>4. 시험 안내</h2>\n\n<p>\n본문은 1~3쪽까지 열람할 수 있습니다.\n</p>\n\n<p>\n시험 전자책은 비공개 상태로 유지됩니다.\n</p>\n\n<p>\n<a href=\"admin-center.html?view=admin-ebooks-upload-test\">\n전자책 이미지 업로드 시험 페이지\n</a>\n</p>\n\n<p>\n<a href=\"admin-center.html?view=admin-ebooks-test\">\n전자책 관리 시험 페이지\n</a>\n</p>\n\n</section>\n\n</main>\n\n<footer>\n고양특례시 글로벌 AI 허브 디지털 도서관\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n// ==========================================\n// 1. Supabase 설정\n// ==========================================\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n// ==========================================\n// 2. 시험 전자책 설정\n// ==========================================\n\nconst DOCUMENT_ID = 12;\n\nconst ISSUE_CODE = \"issue-test-02\";\n\nconst TOTAL_PAGES = 3;\n\nconst COVER_URL =\n  SUPABASE_URL +\n  \"/storage/v1/object/public/\" +\n  \"knowledge-public/ebooks/covers/\" +\n  ISSUE_CODE + \".webp\";\n\nconst $ = id =>\n  document.getElementById(id);\n\nlet currentPage = 0;\nlet pageLoading = false;\nlet authorized = false;\n\n// ==========================================\n// 3. 메시지\n// ==========================================\n\nfunction showMessage(\n  id,\n  message,\n  isError = false\n) {\n\n  const element = $(id);\n\n  element.textContent = message;\n\n  element.classList.toggle(\n    \"error\",\n    isError\n  );\n\n  element.classList.toggle(\n    \"success\",\n    !isError\n  );\n\n}\n\n// ==========================================\n// 4. 관리자 인증\n// ==========================================\n\nasync function initialize() {\n\n  $(\"previewSection\").hidden = true;\n\n  try {\n\n    const {\n      data,\n      error\n    } = await supabase.auth.getUser();\n\n    if (\n      error ||\n      !data.user\n    ) {\n\n      showMessage(\n        \"authMessage\",\n        \"로그인이 필요합니다.\",\n        true\n      );\n\n      return;\n\n    }\n\n    // 실제 관리자 권한은 Edge Function에서 검증합니다.\n    // 따라서 첫 번째 본문 페이지 요청으로\n    // 서버의 권한 검증을 수행합니다.\n\n    showMessage(\n      \"authMessage\",\n      \"로그인 확인 완료. 관리자 권한을 검증하고 있습니다.\"\n    );\n\n    const result =\n      await requestPreviewPage(1);\n\n    authorized = true;\n\n    $(\"previewSection\").hidden = false;\n\n    showMessage(\n      \"authMessage\",\n      \"관리자 미리보기 권한 인증이 완료되었습니다.\"\n    );\n\n    // 권한 확인 후 표지부터 표시\n    showCover();\n\n  } catch (error) {\n\n    authorized = false;\n\n    $(\"previewSection\").hidden = true;\n\n    showMessage(\n      \"authMessage\",\n      \"관리자 인증 실패: \" +\n      error.message,\n      true\n    );\n\n  }\n\n}\n\n// ==========================================\n// 5. 미리보기 URL 요청\n// ==========================================\n\nasync function requestPreviewPage(\n  pageNumber\n) {\n\n  const {\n    data,\n    error\n  } = await supabase.auth.getSession();\n\n  if (\n    error ||\n    !data.session?.access_token\n  ) {\n\n    throw new Error(\n      \"로그인 세션이 없습니다.\"\n    );\n\n  }\n\n  const response = await fetch(\n    SUPABASE_URL +\n    \"/functions/v1/knowledge-ebook-preview\",\n    {\n      method: \"POST\",\n\n      headers: {\n        \"Content-Type\":\n          \"application/json\",\n\n        \"apikey\":\n          SUPABASE_KEY,\n\n        \"Authorization\":\n          \"Bearer \" +\n          data.session.access_token\n      },\n\n      body: JSON.stringify({\n        document_id: DOCUMENT_ID,\n        page_number: pageNumber\n      })\n    }\n  );\n\n  let result;\n\n  try {\n\n    result = await response.json();\n\n  } catch {\n\n    throw new Error(\n      \"서버 응답을 확인할 수 없습니다. HTTP \" +\n      response.status\n    );\n\n  }\n\n  if (\n    !response.ok ||\n    result.success !== true\n  ) {\n\n    throw new Error(\n      result.error ||\n      \"미리보기 접근이 거부되었습니다.\"\n    );\n\n  }\n\n  if (\n    !result.signed_url\n  ) {\n\n    throw new Error(\n      \"이미지 열람 주소가 없습니다.\"\n    );\n\n  }\n\n  // ======================================\n  // URL 검증\n  // ======================================\n\n  const url = new URL(\n    result.signed_url\n  );\n\n  if (\n    url.protocol !== \"https:\" ||\n    url.origin !== SUPABASE_URL ||\n    !url.pathname.startsWith(\n      \"/storage/v1/object/sign/knowledge-private/\"\n    )\n  ) {\n\n    throw new Error(\n      \"허용되지 않은 이미지 주소입니다.\"\n    );\n\n  }\n\n  return url.href;\n\n}\n\n// ==========================================\n// 6. 표지 표시\n// ==========================================\n\nfunction showCover() {\n\n  $(\"pageImage\").src =\n    COVER_URL;\n\n  $(\"pageImage\").alt =\n    \"시험 전자책 표지\";\n\n  currentPage = 0;\n\n  $(\"pageInfo\").textContent =\n    \"표지 / \" + TOTAL_PAGES;\n\n  $(\"reader\").hidden = false;\n\n  $(\"previewMessage\").hidden = true;\n\n  updateControls();\n\n}\n\n// ==========================================\n// 7. 본문 페이지 표시\n// ==========================================\n\nasync function showPage(\n  pageNumber\n) {\n\n  if (!authorized) return;\n\n  if (pageNumber === 0) {\n    showCover();\n    return;\n  }\n\n  if (\n    pageNumber < 1 ||\n    pageNumber > TOTAL_PAGES\n  ) {\n    return;\n  }\n\n  showMessage(\n    \"previewMessage\",\n    pageNumber +\n    \"쪽을 불러오는 중입니다.\"\n  );\n\n  $(\"previewMessage\").hidden = false;\n\n  try {\n\n    const signedUrl =\n      await requestPreviewPage(\n        pageNumber\n      );\n\n    $(\"pageImage\").src =\n      signedUrl;\n\n    $(\"pageImage\").alt =\n      \"시험 전자책 \" +\n      pageNumber + \"쪽\";\n\n    currentPage =\n      pageNumber;\n\n    $(\"pageInfo\").textContent =\n      currentPage +\n      \" / \" +\n      TOTAL_PAGES;\n\n    $(\"reader\").hidden = false;\n\n    $(\"previewMessage\").hidden = true;\n\n  } catch (error) {\n\n    showMessage(\n      \"previewMessage\",\n      \"페이지 열람 실패: \" +\n      error.message,\n      true\n    );\n\n  } finally {\n\n    updateControls();\n\n  }\n\n}\n\n// ==========================================\n// 8. 페이지 이동\n// ==========================================\n\nasync function goToPage(number) {\n\n  if (\n    pageLoading ||\n    !authorized\n  ) {\n    return;\n  }\n\n  const target =\n    Number(number);\n\n  if (\n    !Number.isInteger(target) ||\n    target < 0 ||\n    target > TOTAL_PAGES\n  ) {\n    return;\n  }\n\n  if (\n    target === currentPage\n  ) {\n    return;\n  }\n\n  pageLoading = true;\n\n  updateControls();\n\n  try {\n\n    await showPage(target);\n\n  } finally {\n\n    pageLoading = false;\n\n    updateControls();\n\n  }\n\n}\n\n// ==========================================\n// 9. 버튼 상태\n// ==========================================\n\nfunction updateControls() {\n\n  const atStart =\n    currentPage <= 0;\n\n  const atEnd =\n    currentPage >= TOTAL_PAGES;\n\n  $(\"firstButton\").disabled =\n    pageLoading || atStart;\n\n  $(\"prevButton\").disabled =\n    pageLoading || atStart;\n\n  $(\"nextButton\").disabled =\n    pageLoading || atEnd;\n\n  $(\"lastButton\").disabled =\n    pageLoading || atEnd;\n\n}\n\n// ==========================================\n// 10. 버튼 이벤트\n// ==========================================\n\n$(\"firstButton\").addEventListener(\n  \"click\",\n  () => goToPage(0)\n);\n\n$(\"prevButton\").addEventListener(\n  \"click\",\n  () => goToPage(\n    currentPage - 1\n  )\n);\n\n$(\"nextButton\").addEventListener(\n  \"click\",\n  () => goToPage(\n    currentPage + 1\n  )\n);\n\n$(\"lastButton\").addEventListener(\n  \"click\",\n  () => goToPage(\n    TOTAL_PAGES\n  )\n);\n\n// ==========================================\n// 11. 시작\n// ==========================================\n\ninitialize();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "view=admin-ebooks-upload-test": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<title>전자책 이미지 업로드 시험</title>\n\n<style>\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", Arial, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n}\n\n[hidden] { display: none !important; }\n\nheader {\n  background: #0754a6;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n}\n\nmain {\n  max-width: 850px;\n  margin: auto;\n  padding: 25px 15px;\n}\n\nsection {\n  background: white;\n  padding: 25px;\n  margin-bottom: 24px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.07);\n}\n\nh2 { color: #0754a6; }\n\nlabel {\n  display: block;\n  margin: 18px 0 7px;\n  font-weight: bold;\n}\n\ninput, select {\n  width: 100%;\n  padding: 12px;\n  border: 1px solid #c5d5e8;\n  border-radius: 7px;\n  font: inherit;\n}\n\nbutton {\n  padding: 12px 20px;\n  background: #0754a6;\n  color: white;\n  border: none;\n  border-radius: 7px;\n  cursor: pointer;\n  margin-top: 15px;\n}\n\nbutton:disabled {\n  opacity: .5;\n  cursor: not-allowed;\n}\n\n.message {\n  padding: 15px;\n  background: #eef4fc;\n  border-radius: 8px;\n  margin-top: 15px;\n  line-height: 1.8;\n  white-space: pre-wrap;\n}\n\n.error { color: #b42318; }\n.success { color: #167347; }\n\n.notice {\n  padding: 15px;\n  background: #fff8e8;\n  border-left: 4px solid #d9a441;\n  line-height: 1.8;\n}\n\n#preview {\n  display: block;\n  max-width: 100%;\n  max-height: 450px;\n  margin: 20px auto;\n  border: 1px solid #dce6f2;\n  border-radius: 8px;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 25px;\n}\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n<h1>📚 전자책 이미지 업로드 시험</h1>\n<p>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</p>\n</header>\n\n<main>\n\n<section>\n<h2>1. 관리자 인증</h2>\n\n<div id=\"authMessage\"\n     class=\"message\"\n     role=\"status\"\n     aria-live=\"polite\">\n로그인 상태를 확인하고 있습니다.\n</div>\n</section>\n\n<section id=\"uploadSection\" hidden>\n\n<h2>2. 시험 전자책 정보</h2>\n\n<p><strong>문서 ID:</strong> 12</p>\n<p><strong>발간번호:</strong> issue-test-02</p>\n<p><strong>전체 페이지:</strong> 3쪽</p>\n<p><strong>게시 상태:</strong> 비공개</p>\n\n<div class=\"notice\">\n시험 전자책 ID 12에만 이미지를 업로드합니다.\n기존 전자책 제1호·제2호는 변경하지 않습니다.\n동일 경로에 파일이 있으면 덮어쓰지 않습니다.\n</div>\n\n<h2>3. 이미지 업로드</h2>\n\n<form id=\"uploadForm\">\n\n<label for=\"uploadType\">이미지 구분</label>\n\n<select id=\"uploadType\" required>\n<option value=\"page\">본문 페이지</option>\n<option value=\"cover\">표지</option>\n</select>\n\n<div id=\"pageField\">\n<label for=\"pageNumber\">페이지 번호</label>\n\n<select id=\"pageNumber\">\n<option value=\"1\">1쪽</option>\n<option value=\"2\">2쪽</option>\n<option value=\"3\">3쪽</option>\n</select>\n</div>\n\n<label for=\"imageFile\">WebP 이미지 선택</label>\n\n<input\n  id=\"imageFile\"\n  type=\"file\"\n  accept=\".webp,image/webp\"\n  required\n>\n\n<img id=\"preview\" alt=\"이미지 미리보기\" hidden>\n\n<div id=\"fileInfo\" class=\"message\">\n선택된 파일이 없습니다.\n</div>\n\n<button id=\"uploadButton\" type=\"submit\">\n이미지 업로드\n</button>\n\n</form>\n\n<div id=\"uploadMessage\"\n     class=\"message\"\n     role=\"status\"\n     aria-live=\"polite\">\n업로드 준비 완료\n</div>\n\n</section>\n\n<section>\n<h2>4. 시험 안내</h2>\n\n<p>\n이번 페이지에서는 WebP 이미지 업로드만 수행합니다.\n전자책 게시 상태는 변경하지 않습니다.\n</p>\n\n<p>\n<a href=\"admin-center.html?view=admin-ebooks-create-test\">\n전자책 등록 시험 페이지로 돌아가기\n</a>\n</p>\n</section>\n\n</main>\n\n<footer>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\nconst $ = id => document.getElementById(id);\n\nconst DOCUMENT_ID = 12;\nconst MAX_FILE_SIZE = 10 * 1024 * 1024;\n\nlet authorized = false;\nlet uploading = false;\nlet previewUrl = null;\n\n// ==========================================\n// 메시지\n// ==========================================\n\nfunction showMessage(id, message, isError = false) {\n  const el = $(id);\n  el.textContent = message;\n  el.classList.toggle(\"error\", isError);\n  el.classList.toggle(\"success\", !isError);\n}\n\n// ==========================================\n// 관리자 인증\n// ==========================================\n\nasync function initialize() {\n\n  $(\"uploadSection\").hidden = true;\n\n  try {\n\n    const { data, error } =\n      await supabase.auth.getUser();\n\n    if (error || !data.user) {\n      showMessage(\n        \"authMessage\",\n        \"로그인이 필요합니다.\",\n        true\n      );\n      return;\n    }\n\n    // 관리자 권한은 Edge Function에서 검증\n    authorized = true;\n\n    $(\"uploadSection\").hidden = false;\n\n    showMessage(\n      \"authMessage\",\n      \"로그인 확인 완료. 업로드 권한은 서버에서 검증합니다.\"\n    );\n\n  } catch (error) {\n    showMessage(\n      \"authMessage\",\n      \"인증 오류: \" + error.message,\n      true\n    );\n  }\n}\n\n// ==========================================\n// 업로드 유형 변경\n// ==========================================\n\n$(\"uploadType\").addEventListener(\"change\", () => {\n  $(\"pageField\").hidden =\n    $(\"uploadType\").value === \"cover\";\n});\n\n// ==========================================\n// 이미지 미리보기\n// ==========================================\n\n$(\"imageFile\").addEventListener(\"change\", () => {\n\n  const file = $(\"imageFile\").files[0];\n\n  if (previewUrl) {\n    URL.revokeObjectURL(previewUrl);\n    previewUrl = null;\n  }\n\n  $(\"preview\").hidden = true;\n  $(\"preview\").removeAttribute(\"src\");\n\n  if (!file) {\n    showMessage(\"fileInfo\", \"선택된 파일이 없습니다.\");\n    return;\n  }\n\n  showMessage(\n    \"fileInfo\",\n    \"파일명: \" + file.name +\n    \"\\n형식: \" + file.type +\n    \"\\n크기: \" +\n    (file.size / 1024).toFixed(1) + \" KB\"\n  );\n\n  if (file.type !== \"image/webp\") {\n    showMessage(\n      \"uploadMessage\",\n      \"WebP 파일만 업로드할 수 있습니다.\",\n      true\n    );\n    return;\n  }\n\n  previewUrl = URL.createObjectURL(file);\n\n  $(\"preview\").src = previewUrl;\n  $(\"preview\").hidden = false;\n});\n\n// ==========================================\n// 이미지 업로드\n// ==========================================\n\nasync function uploadImage(event) {\n\n  event.preventDefault();\n\n  if (!authorized || uploading) return;\n\n  const file = $(\"imageFile\").files[0];\n\n  if (!file) {\n    showMessage(\n      \"uploadMessage\",\n      \"이미지 파일을 선택하세요.\",\n      true\n    );\n    return;\n  }\n\n  if (\n    file.type !== \"image/webp\" ||\n    file.size <= 0 ||\n    file.size > MAX_FILE_SIZE\n  ) {\n    showMessage(\n      \"uploadMessage\",\n      \"10MB 이하의 WebP 파일만 업로드할 수 있습니다.\",\n      true\n    );\n    return;\n  }\n\n  const uploadType = $(\"uploadType\").value;\n  const pageNumber = Number($(\"pageNumber\").value);\n\n  const target =\n    uploadType === \"cover\"\n      ? \"표지\"\n      : \"본문 \" + pageNumber + \"쪽\";\n\n  if (!confirm(\n    target + \" 이미지를 업로드하시겠습니까?\\n\\n\" +\n    \"문서 ID: 12\\n\" +\n    \"발간번호: issue-test-02\\n\" +\n    \"파일명: \" + file.name\n  )) return;\n\n  uploading = true;\n  $(\"uploadButton\").disabled = true;\n\n  showMessage(\n    \"uploadMessage\",\n    \"이미지를 업로드하고 있습니다.\"\n  );\n\n  try {\n\n    const { data, error } =\n      await supabase.auth.getSession();\n\n    if (error || !data.session?.access_token) {\n      throw new Error(\"로그인 세션이 없습니다.\");\n    }\n\n    const form = new FormData();\n\n    form.append(\"document_id\", String(DOCUMENT_ID));\n    form.append(\"upload_type\", uploadType);\n    form.append(\"page_number\", String(pageNumber));\n    form.append(\"file\", file);\n\n    const response = await fetch(\n      SUPABASE_URL +\n      \"/functions/v1/knowledge-ebook-upload\",\n      {\n        method: \"POST\",\n        headers: {\n          \"apikey\": SUPABASE_KEY,\n          \"Authorization\":\n            \"Bearer \" + data.session.access_token\n        },\n        body: form\n      }\n    );\n\n    let result;\n\n    try {\n      result = await response.json();\n    } catch {\n      throw new Error(\n        \"서버 응답을 확인할 수 없습니다. HTTP \" +\n        response.status\n      );\n    }\n\n    if (!response.ok || result.success !== true) {\n      throw new Error(\n        result.error || \"업로드에 실패했습니다.\"\n      );\n    }\n\n    showMessage(\n      \"uploadMessage\",\n      \"업로드 성공!\\n\" +\n      \"저장소: \" + result.bucket +\n      \"\\n저장 경로: \" + result.path +\n      \"\\n파일 크기: \" + result.file_size + \" bytes\"\n    );\n\n    $(\"imageFile\").value = \"\";\n\n    if (previewUrl) {\n      URL.revokeObjectURL(previewUrl);\n      previewUrl = null;\n    }\n\n    $(\"preview\").hidden = true;\n    $(\"preview\").removeAttribute(\"src\");\n\n  } catch (error) {\n\n    showMessage(\n      \"uploadMessage\",\n      \"업로드 실패: \" + error.message +\n      \"\\n저장 여부를 확인하기 전에는 같은 파일을 다시 업로드하지 마세요.\",\n      true\n    );\n\n  } finally {\n    uploading = false;\n    $(\"uploadButton\").disabled = false;\n  }\n}\n\n// ==========================================\n// 이벤트\n// ==========================================\n\n$(\"uploadForm\").addEventListener(\n  \"submit\",\n  uploadImage\n);\n\ninitialize();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "view=knowledge-ebook-replace-v3": "<!DOCTYPE html>\n<html lang=\"ko\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\n      content=\"width=device-width, initial-scale=1\">\n\n<title>전자책 이미지 안전 교체 시험</title>\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", Arial, sans-serif;\n  background: #f3f7fc;\n  color: #17315b;\n}\n\n[hidden] {\n  display: none !important;\n}\n\nheader {\n  background: #0754a6;\n  color: white;\n  padding: 28px 15px;\n  text-align: center;\n}\n\nheader h1 {\n  margin: 0 0 10px;\n  font-size: 25px;\n}\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 24px 15px;\n}\n\nsection {\n  background: white;\n  border-radius: 12px;\n  padding: 25px;\n  margin-bottom: 24px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.07);\n}\n\nh2 {\n  color: #0754a6;\n}\n\n.message {\n  background: #eef4fc;\n  padding: 15px;\n  border-radius: 8px;\n  margin: 15px 0;\n  line-height: 1.8;\n  white-space: pre-wrap;\n}\n\n.success {\n  color: #167347;\n}\n\n.error {\n  color: #b42318;\n}\n\n.warning {\n  background: #fff8e8;\n  border-left: 4px solid #d9a441;\n  padding: 15px;\n  line-height: 1.8;\n  margin: 15px 0;\n  white-space: pre-line;\n}\n\nbutton {\n  padding: 12px 18px;\n  background: #0754a6;\n  color: white;\n  border: none;\n  border-radius: 7px;\n  cursor: pointer;\n  font: inherit;\n}\n\nbutton:disabled {\n  opacity: .45;\n  cursor: not-allowed;\n}\n\nselect,\ninput[type=\"file\"] {\n  padding: 10px;\n  border: 1px solid #c8d5e5;\n  border-radius: 7px;\n  font: inherit;\n  max-width: 100%;\n}\n\nlabel {\n  display: block;\n  margin: 12px 0;\n  font-weight: bold;\n}\n\n.compare {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 20px;\n  margin-top: 20px;\n}\n\n.imageBox {\n  border: 1px solid #dce6f2;\n  border-radius: 10px;\n  padding: 15px;\n  text-align: center;\n  background: #fafcff;\n}\n\n.imageBox h3 {\n  margin-top: 0;\n}\n\n.imageBox img {\n  display: block;\n  max-width: 100%;\n  max-height: 650px;\n  height: auto;\n  margin: 15px auto;\n  object-fit: contain;\n}\n\n.info {\n  font-size: 14px;\n  line-height: 1.8;\n  white-space: pre-line;\n  overflow-wrap: anywhere;\n}\n\n.controls {\n  display: flex;\n  gap: 12px;\n  flex-wrap: wrap;\n  margin: 20px 0;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  padding: 25px;\n  text-align: center;\n}\n\n@media(max-width:700px) {\n  .compare {\n    grid-template-columns: 1fr;\n  }\n}\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n<h1>📚 전자책 이미지 안전 교체 시험</h1>\n<p>고양특례시 글로벌 AI 허브 디지털 도서관</p>\n</header>\n\n<main>\n\n<section>\n<h2>1. 관리자 인증</h2>\n\n<div\n  id=\"authMessage\"\n  class=\"message\"\n  role=\"status\"\n  aria-live=\"polite\">\n로그인 상태를 확인하고 있습니다.\n</div>\n\n<div\n  id=\"permissionMessage\"\n  class=\"message\"\n  role=\"status\"\n  aria-live=\"polite\">\n교체 권한을 확인하고 있습니다.\n</div>\n</section>\n\n<section>\n<h2>2. 시험 전자책 정보</h2>\n\n<p><strong>문서 ID:</strong> 12</p>\n\n<p>\n<strong>전자책 제목:</strong>\n디지털 도서관 관리센터 등록 시험\n</p>\n\n<p><strong>발간번호:</strong> issue-test-02</p>\n<p><strong>전체 페이지:</strong> 3쪽</p>\n<p><strong>게시 상태:</strong> 비공개</p>\n\n<div class=\"warning\">\n⚠️ 실제 이미지 교체 시험\n\n시험 대상: 전자책 ID 12\n\n교체 페이지: 본문 2쪽\n\n기존 이미지의 별도 백업을 확보한 후\n최고관리자 확인을 거쳐 실행합니다.\n\n이 작업은 실제 Supabase Storage 파일을 변경합니다.\n\n9번·10번 전자책은 변경하지 않습니다.\n</div>\n</section>\n\n<section id=\"workSection\" hidden>\n\n<h2>3. 이미지 교체 대상 선택</h2>\n\n<label for=\"pageSelect\">\n교체할 본문 페이지\n</label>\n\n<select id=\"pageSelect\">\n<option value=\"2\" selected>\n본문 2쪽 (실제 교체 시험 대상)\n</option>\n</select>\n\n<div class=\"controls\">\n<button id=\"loadButton\" type=\"button\">\n기존 이미지 불러오기\n</button>\n</div>\n\n<div\n  id=\"loadMessage\"\n  class=\"message\"\n  role=\"status\"\n  aria-live=\"polite\">\n교체할 페이지를 선택해 주세요.\n</div>\n\n</section>\n\n<section id=\"compareSection\" hidden>\n\n<h2>4. 기존 이미지와 신규 이미지 비교</h2>\n\n<div class=\"compare\">\n\n<div class=\"imageBox\">\n\n<h3>기존 이미지</h3>\n\n<img\n  id=\"oldImage\"\n  alt=\"기존 전자책 이미지\"\n  referrerpolicy=\"no-referrer\"\n  hidden\n>\n\n<div id=\"oldInfo\" class=\"info\">\n이미지를 불러오지 않았습니다.\n</div>\n\n</div>\n\n<div class=\"imageBox\">\n\n<h3>신규 이미지</h3>\n\n<label for=\"newFile\">\n교체할 WebP 이미지 선택\n</label>\n\n<input\n  type=\"file\"\n  id=\"newFile\"\n  accept=\".webp,image/webp\"\n>\n\n<img\n  id=\"newImage\"\n  alt=\"신규 전자책 이미지\"\n  hidden\n>\n\n<div id=\"newInfo\" class=\"info\">\n파일을 선택하지 않았습니다.\n</div>\n\n</div>\n\n</div>\n\n</section>\n\n<section id=\"confirmSection\" hidden>\n\n<h2>5. 교체 전 최종 확인</h2>\n\n<div id=\"confirmInfo\" class=\"message\">\n교체 정보를 확인하고 있습니다.\n</div>\n\n<label>\n<input\n  type=\"checkbox\"\n  id=\"confirmCheck\"\n>\n기존 이미지를 신규 이미지로 교체하는 작업임을 확인했습니다.\n</label>\n\n<div class=\"controls\">\n<button\n  id=\"replaceButton\"\n  type=\"button\"\n  disabled>\n최고관리자 이미지 교체 실행\n</button>\n</div>\n\n<div\n  id=\"replaceResult\"\n  class=\"message\"\n  role=\"status\"\n  aria-live=\"polite\"\n  hidden>\n</div>\n\n<div class=\"warning\">\n실제 교체 권한은 최고관리자에게만 있습니다.\n\n시험 대상은 전자책 ID 12의 본문 2쪽입니다.\n\n오류가 발생하면 작업 기록을 확인하기 전까지 재시도하지 마세요.\n</div>\n\n</section>\n\n</main>\n\n<footer>\n고양특례시 글로벌 AI 허브 디지털 도서관\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n// ==========================================\n// 1. Supabase 설정\n// ==========================================\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n// ==========================================\n// 제189-12-6-9-6-17단계\n// 전자책 이미지 교체 페이지 제한 시험\n//\n// 실제 이미지 전송 없음\n// 실제 교체 실행 없음\n// ==========================================\n\nasync function testEbookReplacePageBlock(\n  pageNumber\n) {\n\n  // 시험 대상은 1쪽과 3쪽만 허용\n  if (![1, 3].includes(pageNumber)) {\n    console.error(\n      \"시험은 본문 1쪽과 3쪽만 허용됩니다.\"\n    );\n    return;\n  }\n\n  const {\n    data: { session },\n    error: sessionError\n  } = await supabase.auth.getSession();\n\n  if (\n    sessionError ||\n    !session?.access_token\n  ) {\n    console.error(\n      \"로그인 세션을 확인할 수 없습니다.\"\n    );\n    return;\n  }\n\n  const form = new FormData();\n\n  form.append(\n    \"document_id\",\n    \"12\"\n  );\n\n  form.append(\n    \"page_number\",\n    String(pageNumber)\n  );\n\n  form.append(\n    \"confirmation\",\n    \"TEST\"\n  );\n\n  // 이미지 파일은 절대 첨부하지 않음\n\n  const response = await fetch(\n    SUPABASE_URL +\n    \"/functions/v1/knowledge-ebook-replace-v3\",\n    {\n      method: \"POST\",\n\n      headers: {\n        Authorization:\n          \"Bearer \" +\n          session.access_token,\n\n        apikey:\n          SUPABASE_KEY\n      },\n\n      body: form\n    }\n  );\n\n  const result =\n    await response.json();\n\n  console.log(\n    \"시험 페이지:\",\n    pageNumber\n  );\n\n  console.log(\n    \"HTTP 상태:\",\n    response.status\n  );\n\n  console.log(\n    \"서버 응답:\",\n    result\n  );\n\n  if (\n    response.status === 403 &&\n    result.success === false &&\n    result.error ===\n      \"현재 이미지 교체 시험은 본문 2쪽만 허용됩니다.\"\n  ) {\n\n    console.log(\n      \"✅ 본문 \" +\n      pageNumber +\n      \"쪽 교체 차단 정상\"\n    );\n\n  } else {\n\n    console.warn(\n      \"⚠️ 예상과 다른 응답입니다. 추가 확인이 필요합니다.\"\n    );\n\n  }\n\n}\n\n// 콘솔에서 시험할 수 있도록 등록\nwindow.testEbookReplacePageBlock =\n  testEbookReplacePageBlock;\n      \n// ==========================================\n// 2. 시험 설정\n// ==========================================\n\nconst DOCUMENT_ID = 12;\nconst TOTAL_PAGES = 3;\nconst REPLACE_TEST_PAGE = 2;\n\nconst MAX_FILE_SIZE =\n  10 * 1024 * 1024;\n\n// 안전성 검증 모드\n// 현재는 실제 교체 요청을 전송하지 않음\n\nconst ENABLE_ACTUAL_REPLACEMENT = true;\n\nconst $ = id =>\n  document.getElementById(id);\n\nlet authorized = false;\nlet isSuperAdmin = false;\n\nlet selectedPage = 1;\nlet selectedFile = null;\n\nlet oldImageLoaded = false;\n\nlet objectUrl = null;\nlet loadSequence = 0;\nlet fileSequence = 0;\n\nlet replacementInProgress = false;\nlet replacementBlocked = false;\n\n// ==========================================\n// 3. 메시지\n// ==========================================\n\nfunction showMessage(\n  id,\n  message,\n  isError = false\n) {\n\n  const element = $(id);\n\n  element.textContent = message;\n\n  element.classList.toggle(\n    \"error\",\n    isError\n  );\n\n  element.classList.toggle(\n    \"success\",\n    !isError\n  );\n\n}\n\n// ==========================================\n// 4. 실행 버튼 상태\n// ==========================================\n\nfunction updateReplaceButton() {\n\n  const canReplace =\n    ENABLE_ACTUAL_REPLACEMENT &&\n    authorized &&\n    isSuperAdmin &&\n    selectedPage === REPLACE_TEST_PAGE &&\n    oldImageLoaded &&\n    selectedFile !== null &&\n    $(\"confirmCheck\").checked &&\n    !replacementInProgress &&\n    !replacementBlocked;\n\n  $(\"replaceButton\").disabled =\n    !canReplace;\n\n}\n\n// ==========================================\n// 5. 로그인 토큰\n// ==========================================\n\nasync function getAccessToken() {\n\n  const {\n    data,\n    error\n  } = await supabase.auth.getSession();\n\n  if (\n    error ||\n    !data.session?.access_token\n  ) {\n    throw new Error(\n      \"로그인 세션이 없습니다.\"\n    );\n  }\n\n  return data.session.access_token;\n\n}\n\n// ==========================================\n// 6. 미리보기 요청\n// ==========================================\n\nasync function requestPreviewPage(\n  pageNumber\n) {\n\n  const token =\n    await getAccessToken();\n\n  const response = await fetch(\n    SUPABASE_URL +\n    \"/functions/v1/knowledge-ebook-page-access\",\n    {\n      method: \"POST\",\n\n      headers: {\n        \"Content-Type\":\n          \"application/json\",\n\n        \"apikey\":\n          SUPABASE_KEY,\n\n        \"Authorization\":\n          \"Bearer \" + token\n      },\n\n      body: JSON.stringify({\n        document_id: DOCUMENT_ID,\n        page_number: pageNumber\n      })\n    }\n  );\n\n  let result;\n\n  try {\n    result = await response.json();\n  } catch {\n    throw new Error(\n      \"미리보기 서버 응답을 확인할 수 없습니다.\"\n    );\n  }\n\n  if (\n    !response.ok ||\n    result.success !== true\n  ) {\n    throw new Error(\n      result.error ||\n      \"미리보기 권한이 없습니다.\"\n    );\n  }\n\n  if (!result.signed_url) {\n    throw new Error(\n      \"이미지 주소가 없습니다.\"\n    );\n  }\n\n  const url =\n    new URL(result.signed_url);\n\n  if (\n    url.protocol !== \"https:\" ||\n    url.origin !== SUPABASE_URL ||\n    !url.pathname.startsWith(\n      \"/storage/v1/object/sign/knowledge-private/\"\n    )\n  ) {\n    throw new Error(\n      \"허용되지 않은 이미지 주소입니다.\"\n    );\n  }\n\n  return url.href;\n\n}\n\n// ==========================================\n// 7. 최고관리자 교체 권한 확인\n// ==========================================\n\nasync function verifyReplacePermission() {\n\n  const token =\n    await getAccessToken();\n\n  // 이미지 파일이나 교체 정보를 보내지 않음\n  // 서버의 권한 검사 결과만 확인\n\n  const response = await fetch(\n    SUPABASE_URL +\n    \"/functions/v1/knowledge-ebook-replace\",\n    {\n      method: \"POST\",\n\n      headers: {\n        \"apikey\": SUPABASE_KEY,\n\n        \"Authorization\":\n          \"Bearer \" + token\n      }\n    }\n  );\n\n  let result;\n\n  try {\n    result = await response.json();\n  } catch {\n    throw new Error(\n      \"교체 권한 확인 응답을 읽을 수 없습니다.\"\n    );\n  }\n\n  if (\n    response.status === 400 &&\n    result.error ===\n      \"multipart/form-data 형식의 요청이 필요합니다.\"\n  ) {\n    return true;\n  }\n\n  if (response.status === 403) {\n    return false;\n  }\n\n  throw new Error(\n    result.error ||\n    \"교체 권한 확인에 실패했습니다.\"\n  );\n\n}\n\n// ==========================================\n// 8. 관리자 인증\n// ==========================================\n\nasync function initialize() {\n\n  $(\"workSection\").hidden = true;\n\n  try {\n\n    const {\n      data,\n      error\n    } = await supabase.auth.getUser();\n\n    if (\n      error ||\n      !data.user\n    ) {\n      throw new Error(\n        \"로그인이 필요합니다.\"\n      );\n    }\n\n    showMessage(\n      \"authMessage\",\n      \"관리자 미리보기 권한을 확인하고 있습니다.\"\n    );\n\n    await requestPreviewPage(1);\n\n    authorized = true;\n\n    $(\"workSection\").hidden = false;\n\n    showMessage(\n      \"authMessage\",\n      \"관리자 인증 완료. 이미지 비교가 가능합니다.\"\n    );\n\n    try {\n\n      isSuperAdmin =\n        await verifyReplacePermission();\n\n      if (isSuperAdmin) {\n\n        showMessage(\n          \"permissionMessage\",\n          \"최고관리자 교체 권한 인증 완료.\"\n        );\n\n      } else {\n\n        showMessage(\n          \"permissionMessage\",\n          \"일반관리자: 이미지 비교만 가능합니다. 실제 교체 권한은 없습니다.\"\n        );\n\n      }\n\n    } catch (permissionError) {\n\n      isSuperAdmin = false;\n\n      showMessage(\n        \"permissionMessage\",\n        \"교체 권한 확인 실패: \" +\n        permissionError.message,\n        true\n      );\n\n    }\n\n  } catch (error) {\n\n    authorized = false;\n    isSuperAdmin = false;\n\n    showMessage(\n      \"authMessage\",\n      \"관리자 인증 실패: \" +\n      error.message,\n      true\n    );\n\n    showMessage(\n      \"permissionMessage\",\n      \"교체 권한을 확인할 수 없습니다.\",\n      true\n    );\n\n  }\n\n  updateReplaceButton();\n\n}\n\n// ==========================================\n// 9. 기존 이미지 불러오기\n// ==========================================\n\nasync function loadOldImage() {\n\n  if (\n    !authorized ||\n    replacementInProgress ||\n    replacementBlocked\n  ) {\n    return;\n  }\n\n  const sequence = ++loadSequence;\n\n  const pageNumber =\n    Number($(\"pageSelect\").value);\n\n  if (\n    !Number.isSafeInteger(pageNumber) ||\n    pageNumber < 1 ||\n    pageNumber > TOTAL_PAGES\n  ) {\n    return;\n  }\n\n  selectedPage = pageNumber;\n\n  oldImageLoaded = false;\n  selectedFile = null;\n\n  ++fileSequence;\n\n  $(\"newFile\").value = \"\";\n\n  clearNewImage();\n\n  $(\"compareSection\").hidden = true;\n  $(\"confirmSection\").hidden = true;\n\n  $(\"loadButton\").disabled = true;\n\n  updateReplaceButton();\n\n  showMessage(\n    \"loadMessage\",\n    \"본문 \" +\n    pageNumber +\n    \"쪽 이미지를 불러오는 중입니다.\"\n  );\n\n  try {\n\n    const url =\n      await requestPreviewPage(pageNumber);\n\n    if (sequence !== loadSequence) return;\n\n    const image = $(\"oldImage\");\n\n    image.hidden = true;\n\n    await new Promise(\n      (resolve, reject) => {\n\n        image.onload = resolve;\n\n        image.onerror = () =>\n          reject(\n            new Error(\n              \"기존 이미지 표시 실패\"\n            )\n          );\n\n        image.src = url;\n\n      }\n    );\n\n    if (sequence !== loadSequence) return;\n\n    image.hidden = false;\n\n    oldImageLoaded = true;\n\n    $(\"oldInfo\").textContent =\n      \"본문 \" +\n      pageNumber +\n      \"쪽 / \" +\n      image.naturalWidth +\n      \" × \" +\n      image.naturalHeight;\n\n    $(\"compareSection\").hidden = false;\n\n    showMessage(\n      \"loadMessage\",\n      \"기존 이미지 불러오기 성공\"\n    );\n\n  } catch (error) {\n\n    if (sequence !== loadSequence) return;\n\n    showMessage(\n      \"loadMessage\",\n      \"기존 이미지 불러오기 실패: \" +\n      error.message,\n      true\n    );\n\n  } finally {\n\n    if (sequence === loadSequence) {\n      $(\"loadButton\").disabled = false;\n    }\n\n    updateReplaceButton();\n\n  }\n\n}\n\n// ==========================================\n// 10. 신규 이미지 초기화\n// ==========================================\n\nfunction clearNewImage() {\n\n  if (objectUrl) {\n    URL.revokeObjectURL(objectUrl);\n    objectUrl = null;\n  }\n\n  $(\"newImage\").removeAttribute(\"src\");\n\n  $(\"newImage\").hidden = true;\n\n  $(\"newInfo\").textContent =\n    \"파일을 선택하지 않았습니다.\";\n\n  $(\"confirmSection\").hidden = true;\n\n  $(\"confirmCheck\").checked = false;\n\n  updateReplaceButton();\n\n}\n\n// ==========================================\n// 11. WebP 검사\n// ==========================================\n\nasync function validateWebP(file) {\n\n  if (\n    file.type !== \"image/webp\" ||\n    file.size <= 0 ||\n    file.size > MAX_FILE_SIZE\n  ) {\n    throw new Error(\n      \"10MB 이하 WebP 파일만 허용됩니다.\"\n    );\n  }\n\n  const header =\n    new Uint8Array(\n      await file.slice(0, 12).arrayBuffer()\n    );\n\n  if (header.length < 12) {\n    throw new Error(\n      \"올바른 WebP 파일이 아닙니다.\"\n    );\n  }\n\n  const riff =\n    String.fromCharCode(\n      ...header.slice(0, 4)\n    );\n\n  const webp =\n    String.fromCharCode(\n      ...header.slice(8, 12)\n    );\n\n  if (\n    riff !== \"RIFF\" ||\n    webp !== \"WEBP\"\n  ) {\n    throw new Error(\n      \"WebP 형식 검증에 실패했습니다.\"\n    );\n  }\n\n}\n\n// ==========================================\n// 12. 신규 이미지 선택\n// ==========================================\n\nasync function handleNewFile() {\n\n  if (\n    replacementInProgress ||\n    replacementBlocked\n  ) {\n    return;\n  }\n\n  const sequence = ++fileSequence;\n\n  selectedFile = null;\n\n  clearNewImage();\n\n  if (!oldImageLoaded) return;\n\n  const file =\n    $(\"newFile\").files[0];\n\n  if (!file) return;\n\n  try {\n\n    await validateWebP(file);\n\n    if (sequence !== fileSequence) return;\n\n    objectUrl =\n      URL.createObjectURL(file);\n\n    const image =\n      $(\"newImage\");\n\n    await new Promise(\n      (resolve, reject) => {\n\n        image.onload = resolve;\n\n        image.onerror = () =>\n          reject(\n            new Error(\n              \"신규 이미지 표시 실패\"\n            )\n          );\n\n        image.src = objectUrl;\n\n      }\n    );\n\n    if (sequence !== fileSequence) return;\n\n    selectedFile = file;\n\n    image.hidden = false;\n\n    $(\"newInfo\").textContent =\n      \"파일명: \" + file.name +\n      \"\\n파일 크기: \" +\n      (file.size / 1024).toFixed(1) +\n      \" KB\" +\n      \"\\n이미지 크기: \" +\n      image.naturalWidth +\n      \" × \" +\n      image.naturalHeight;\n\n    $(\"confirmSection\").hidden = false;\n\n    $(\"confirmCheck\").checked = false;\n\n    $(\"confirmInfo\").textContent =\n      \"교체 대상: 본문 \" +\n      selectedPage +\n      \"쪽\" +\n      \"\\n신규 파일: \" +\n      file.name +\n      \"\\n실제 교체 시험 허용 페이지: 2쪽\";\n\n    updateReplaceButton();\n\n  } catch (error) {\n\n    if (sequence !== fileSequence) return;\n\n    selectedFile = null;\n\n    clearNewImage();\n\n    $(\"newInfo\").textContent =\n      \"파일 검사 실패: \" +\n      error.message;\n\n  }\n\n}\n\n// ==========================================\n// 13. 실제 이미지 교체 요청\n// ==========================================\n\nasync function executeReplacement() {\n\n  // 안전성 검증 모드에서는 실행 금지\n\n  if (!ENABLE_ACTUAL_REPLACEMENT) {\n    return;\n  }\n\n  if (\n    !authorized ||\n    !isSuperAdmin ||\n    replacementInProgress ||\n    replacementBlocked\n  ) {\n    return;\n  }\n\n  if (\n    selectedPage !== REPLACE_TEST_PAGE ||\n    !oldImageLoaded ||\n    !selectedFile ||\n    !$(\"confirmCheck\").checked\n  ) {\n    return;\n  }\n\n  const fileToSend = selectedFile;\n\n  const confirmed = window.confirm(\n    \"시험 전자책 ID 12의 본문 2쪽을 실제 교체합니다.\\n\\n\" +\n    \"원본 백업을 확인했습니까?\\n\\n\" +\n    \"이 작업은 실제 Storage 파일을 변경합니다.\"\n  );\n\n  if (!confirmed) return;\n\n  replacementInProgress = true;\n\n  updateReplaceButton();\n\n  $(\"replaceResult\").hidden = false;\n\n  showMessage(\n    \"replaceResult\",\n    \"최고관리자 권한을 다시 확인하고 있습니다.\"\n  );\n\n  try {\n\n    const permission =\n      await verifyReplacePermission();\n\n    if (!permission) {\n      throw new Error(\n        \"최고관리자 권한이 없습니다.\"\n      );\n    }\n\n    await validateWebP(fileToSend);\n\n    const token =\n      await getAccessToken();\n\n    const form = new FormData();\n\n    form.append(\n      \"document_id\",\n      String(DOCUMENT_ID)\n    );\n\n    form.append(\n      \"page_number\",\n      String(REPLACE_TEST_PAGE)\n    );\n\n    form.append(\n      \"confirmation\",\n      \"REPLACE\"\n    );\n\n    form.append(\n      \"file\",\n      fileToSend\n    );\n\n    // 실제 요청을 시작하기 전에 재실행 잠금\n\n    replacementBlocked = true;\n\n    sessionStorage.setItem(\n      \"ebook-replace-test-12-2-locked\",\n      \"true\"\n    );\n\n    showMessage(\n      \"replaceResult\",\n      \"이미지 교체 요청 중입니다.\\n재시도하지 마세요.\"\n    );\n\n    const response = await fetch(\n      SUPABASE_URL +\n      \"/functions/v1/knowledge-ebook-replace\",\n      {\n        method: \"POST\",\n\n        headers: {\n          \"apikey\": SUPABASE_KEY,\n\n          \"Authorization\":\n            \"Bearer \" + token\n        },\n\n        body: form\n      }\n    );\n\n    let result;\n\n    try {\n      result = await response.json();\n    } catch {\n      throw new Error(\n        \"서버 응답을 읽을 수 없습니다. DB 작업 기록을 확인해 주세요.\"\n      );\n    }\n\n    if (\n      !response.ok ||\n      result.success !== true\n    ) {\n\n      showMessage(\n        \"replaceResult\",\n\n        \"교체 결과 확인 필요\\n\\n\" +\n\n        \"HTTP 상태: \" +\n        response.status +\n\n        \"\\n작업 ID: \" +\n        (result.job_id || \"없음\") +\n\n        \"\\n오류: \" +\n        (result.error || \"알 수 없는 오류\") +\n\n        \"\\n\\n재시도하지 마세요.\",\n\n        true\n      );\n\n      return;\n    }\n\n    showMessage(\n      \"replaceResult\",\n\n      \"이미지 교체 함수 실행 성공\\n\\n\" +\n\n      \"문서 ID: \" +\n      result.document_id +\n\n      \"\\n페이지: \" +\n      result.page_number +\n\n      \"\\n작업 ID: \" +\n      result.job_id +\n\n      \"\\n백업 경로: \" +\n      result.backup_path +\n\n      \"\\n\\nStorage 및 DB 작업 기록을 확인해 주세요.\"\n    );\n\n  } catch (error) {\n\n    showMessage(\n      \"replaceResult\",\n\n      \"교체 처리 중 오류 발생\\n\\n\" +\n\n      error.message +\n\n      \"\\n\\n작업 기록 확인 전 재시도 금지\",\n\n      true\n    );\n\n  } finally {\n\n    replacementInProgress = false;\n\n    updateReplaceButton();\n\n  }\n\n}\n\n// ==========================================\n// 14. 페이지 변경\n// ==========================================\n\n$(\"pageSelect\").addEventListener(\n  \"change\",\n  () => {\n\n    if (\n      replacementInProgress ||\n      replacementBlocked\n    ) {\n      $(\"pageSelect\").value =\n        String(selectedPage);\n      return;\n    }\n\n    ++loadSequence;\n    ++fileSequence;\n\n    selectedPage =\n      Number($(\"pageSelect\").value);\n\n    oldImageLoaded = false;\n    selectedFile = null;\n\n    $(\"oldImage\").hidden = true;\n    $(\"oldImage\").removeAttribute(\"src\");\n\n    $(\"newFile\").value = \"\";\n\n    clearNewImage();\n\n    $(\"compareSection\").hidden = true;\n    $(\"confirmSection\").hidden = true;\n\n    $(\"loadButton\").disabled = false;\n\n    showMessage(\n      \"loadMessage\",\n      \"페이지를 선택한 후 기존 이미지를 불러와 주세요.\"\n    );\n\n    updateReplaceButton();\n\n  }\n);\n\n// ==========================================\n// 15. 이벤트\n// ==========================================\n\n$(\"loadButton\").addEventListener(\n  \"click\",\n  loadOldImage\n);\n\n$(\"newFile\").addEventListener(\n  \"change\",\n  handleNewFile\n);\n\n$(\"confirmCheck\").addEventListener(\n  \"change\",\n  updateReplaceButton\n);\n\n$(\"replaceButton\").addEventListener(\n  \"click\",\n  executeReplacement\n);\n\n// ==========================================\n// 16. 이전 요청 잠금 확인\n// ==========================================\n\nif (\n  sessionStorage.getItem(\n    \"ebook-replace-test-12-2-locked\"\n  ) === \"true\"\n) {\n\n  replacementBlocked = true;\n\n  $(\"replaceResult\").hidden = false;\n\n  showMessage(\n    \"replaceResult\",\n    \"이 브라우저에서 이미지 교체 요청 이력이 감지되었습니다.\\n\" +\n    \"DB 작업 기록을 확인하기 전에는 재실행하지 마세요.\",\n    true\n  );\n\n}\n\n// ==========================================\n// 17. 임시 URL 정리\n// ==========================================\n\nwindow.addEventListener(\n  \"pagehide\",\n  () => {\n\n    if (objectUrl) {\n      URL.revokeObjectURL(objectUrl);\n    }\n\n  }\n);\n\n// ==========================================\n// 18. 시작\n// ==========================================\n\ninitialize();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "view=admin-ebook-pages": "<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Full 전자책 페이지 유지관리</title>\n<style>\nbody { font: 1rem system-ui; color: #17324b; margin: 2rem auto; max-width: 58rem; padding: 0 1rem; }\nfieldset { margin: 1rem 0; border: 1px solid #a9b9c9; border-radius: .5rem; }\n[hidden] { display:none!important; }\nlabel { display:block; margin:.5rem 0; }\ninput:not([type=checkbox]),textarea { box-sizing:border-box; width:min(100%,32rem); }\nbutton,input,textarea { font:inherit; padding:.35rem; }\nbutton { margin:.25rem .5rem .25rem 0; }\n.scroll { max-height:22rem; overflow:auto; }\nth,td { padding:.35rem .75rem; border-bottom:1px solid #ddd; }\n</style>\n</head><body>\n<nav><a href=\"admin-center.html\">← 관리센터로</a> · <a href=\"admin-center.html?view=admin-ebooks-test\">등록 전자책 목록</a></nav>\n<main><h1>Full 전자책 페이지 유지관리</h1>\n<p id=\"message\" role=\"status\">관리자 인증을 확인하고 있습니다.</p>\n<div id=\"workspace\" hidden>\n<fieldset id=\"controls\">\n\n<p>단순 생성 화면에서 최종 등록된 전자책의 본문을 관리합니다.</p>\n<label>문서 ID <input id=\"document-id\" type=\"number\" min=\"1\" step=\"1\"></label>\n<button type=\"button\" id=\"lookup\">페이지 상태 조회</button>\n<section id=\"tools\" hidden>\n<p id=\"summary\"></p>\n<div class=\"scroll\" tabindex=\"0\">\n<table><thead><tr><th>쪽</th><th>상태</th><th>삭제 선택</th></tr></thead><tbody id=\"rows\"></tbody></table>\n</div>\n<div id=\"delete-tools\" hidden>\n<button type=\"button\" id=\"delete-selected\">선택한 본문 페이지 삭제</button>\n<button type=\"button\" id=\"delete-all\">전체 본문 삭제</button>\n</div>\n<h2>재업로드 및 작업 재개</h2>\n<label>본문 페이지 번호 <input id=\"page-number\" type=\"number\" min=\"1\" step=\"1\"></label>\n<label>WebP 이미지 <input id=\"image\" type=\"file\" accept=\".webp,image/webp\"></label>\n<button type=\"button\" id=\"reupload\">빈 페이지 재업로드</button>\n<button type=\"button\" id=\"resume\">중단된 작업 재개</button>\n</section>\n\n</fieldset></div>\n</main>\n\u003cscript type=\"module\">\nimport { createClient } from \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\nconst FUNCTION = \"knowledge-ebook-pages\";\n\nconst client = createClient(SUPABASE_URL, SUPABASE_KEY);\nasync function request(action, data = {}) {\n  const { data: result, error } = await client.functions.invoke(FUNCTION, { body: { action, ...data } });\n  let details = result;\n  if (error?.context?.json) {\n    try { details = await error.context.json(); } catch {}\n  }\n  if (error || result?.success !== true) {\n    const context = [\n      details?.error_code,\n      details?.failed_page ? \"실패 페이지 \" + details.failed_page : \"\",\n      Array.isArray(details?.completed) ? \"완료 \" + details.completed.length + \"개\" : \"\"\n    ].filter(Boolean);\n    throw new Error((details?.error || error?.message || \"서버 요청에 실패했습니다.\") +\n      (context.length ? \" (\" + context.join(\" · \") + \")\" : \"\"));\n  }\n  return result;\n}\nasync function webp(file) {\n  if (!file || !/\\.webp$/i.test(file.name) || file.size > 5 * 1024 * 1024) {\n    throw new Error(\"5 MiB 이하의 WebP 파일을 선택하세요.\");\n  }\n  const header = new TextDecoder().decode(await file.slice(0, 12).arrayBuffer());\n  if (!header.startsWith(\"RIFF\") || header.slice(8) !== \"WEBP\") throw new Error(\"WebP 이미지 형식을 확인하세요.\");\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = () => resolve(String(reader.result).split(\",\")[1]);\n    reader.onerror = () => reject(new Error(\"파일을 읽지 못했습니다: \" + file.name));\n    reader.readAsDataURL(file);\n  });\n}\n\nconst $ = id => document.getElementById(id);\nlet identity;\nlet book;\nconst labels = {active:\"등록\",empty:\"빈 페이지\",deleting:\"삭제 작업 중\",uploading:\"재업로드 작업 중\"};\nfunction documentId() {\n  const id = $(\"document-id\").valueAsNumber;\n  if (!Number.isSafeInteger(id) || id < 1) throw new Error(\"올바른 문서 ID를 입력하세요.\");\n  if ([9,10,11,12].includes(id)) throw new Error(\"기존 보호 전자책은 이 화면에서 수정할 수 없습니다.\");\n  return id;\n}\nasync function run(operation) {\n  $(\"controls\").disabled = true;\n  try { await operation(); }\n  catch (error) { $(\"message\").textContent = error.message; }\n  finally { $(\"controls\").disabled = false; }\n}\nasync function loadPages() {\n  book = null;\n  $(\"tools\").hidden = true;\n  $(\"rows\").replaceChildren();\n  const id = documentId();\n  const result = await request(\"list\", { document_id: id });\n  book = result;\n  for (const item of result.pages) {\n    const row = document.createElement(\"tr\");\n    for (const value of [item.page_number, labels[item.status] ?? item.status]) {\n      const cell = document.createElement(\"td\");\n      cell.textContent = value;\n      row.append(cell);\n    }\n    const cell = document.createElement(\"td\");\n    if (identity.admin_level === \"super_admin\" && item.status === \"active\") {\n      const checkbox = document.createElement(\"input\");\n      checkbox.type = \"checkbox\";\n      checkbox.value = item.page_number;\n      checkbox.setAttribute(\"aria-label\", item.page_number + \"쪽 삭제 선택\");\n      cell.append(checkbox);\n    }\n    row.append(cell);\n    $(\"rows\").append(row);\n  }\n  $(\"tools\").hidden = false;\n  $(\"summary\").textContent = \"문서 ID \" + id + \" · 본문 \" + result.total_pages + \"쪽\";\n}\nasync function changePage(action, data) {\n  if (!book || book.document_id !== documentId()) throw new Error(\"먼저 대상 전자책을 조회하세요.\");\n  let failure;\n  try {\n    await request(action, { document_id: book.document_id, ...data });\n  } catch (error) { failure = error; }\n  try { await loadPages(); } catch (error) { if (!failure) throw error; }\n  if (failure) throw failure;\n  $(\"message\").textContent = \"서버 작업을 완료했습니다. 페이지 상태를 확인하세요.\";\n}\n$(\"lookup\").addEventListener(\"click\", () => run(async () => {\n  await loadPages();\n  $(\"message\").textContent = \"페이지 상태를 조회했습니다.\";\n}));\n$(\"document-id\").addEventListener(\"input\", () => { book = null; $(\"tools\").hidden = true; });\n$(\"delete-selected\").addEventListener(\"click\", () => run(async () => {\n  const selected = [...$(\"rows\").querySelectorAll(\"input:checked\")].map(input => Number(input.value));\n  if (!selected.length) throw new Error(\"삭제할 본문 페이지를 선택하세요.\");\n  if (confirm(\"문서 \" + book.document_id + \"의 선택한 \" + selected.length + \"개 본문 이미지를 삭제하시겠습니까?\")) {\n    await changePage(\"delete-pages\", { page_numbers: selected });\n  }\n}));\n$(\"delete-all\").addEventListener(\"click\", () => run(async () => {\n  if (confirm(\"문서 \" + book.document_id + \"의 전체 본문 이미지를 삭제하시겠습니까? 표지는 유지됩니다.\")) {\n    await changePage(\"delete-all-pages\", { confirm_delete_all: true });\n  }\n}));\nfunction pickedPage() {\n  const number = $(\"page-number\").valueAsNumber;\n  const item = book?.pages.find(page => page.page_number === number);\n  if (!item) throw new Error(\"조회된 본문 페이지 번호를 입력하세요.\");\n  return item;\n}\n$(\"reupload\").addEventListener(\"click\", () => run(async () => {\n  const page = pickedPage();\n  if (page.status !== \"empty\") throw new Error(\"빈 페이지에만 다시 업로드할 수 있습니다.\");\n  await changePage(\"upload-page\", { page_number: page.page_number, image_base64: await webp($(\"image\").files[0]) });\n}));\n$(\"resume\").addEventListener(\"click\", () => run(async () => {\n  const page = pickedPage();\n  if (![\"deleting\", \"uploading\"].includes(page.status)) throw new Error(\"재개할 작업이 없습니다.\");\n  const data = { page_number: page.page_number };\n  if (page.status === \"uploading\") data.image_base64 = await webp($(\"image\").files[0]);\n  if (confirm(page.page_number + \"쪽 작업을 재개하시겠습니까?\")) await changePage(\"resume\", data);\n}));\nrun(async () => {\n  identity = await request(\"ping\");\n  $(\"delete-tools\").hidden = identity.admin_level !== \"super_admin\";\n  $(\"workspace\").hidden = false;\n  $(\"message\").textContent = \"관리자 인증을 확인했습니다.\";\n  const id = new URLSearchParams(location.search).get(\"document_id\");\n  if (id && /^[1-9][0-9]*$/.test(id)) {\n    $(\"document-id\").value = id;\n    await loadPages();\n  }\n});\n\n\u003c/script></body></html>\n"

<script>

  const selected = keys.find(key => Object.hasOwn(pages, key)) || "default";
  const page = pages[selected];
  const opening = /^\s*<!doctype html>\s*(<html\b[^>]*>)\s*<head\b[^>]*>/i.exec(page);

  // Keep the original URL and let the initial HTML parser run the page scripts.
  const root = new DOMParser().parseFromString(opening[1], "text/html").documentElement;
  for (const attribute of root.attributes) {
    document.documentElement.setAttribute(attribute.name, attribute.value);
  }
  data.remove();
  document.write(page.slice(opening[0].length));
})();
</script>
