lt();\n\n    if (saving) {\n      return;\n    }\n\n    saving = true;\n\n    $(\"saveButton\").disabled = true;\n\n    let savedPostId = editingId;\n\n    let databaseSaved = false;\n\n    try {\n\n      const admin =\n        await verifyAdmin();\n\n      if (!admin) {\n        throw new Error(\n          \"관리자 권한이 없습니다.\"\n        );\n      }\n\n      currentUser = admin;\n\n      const category =\n        $(\"resourceCategory\").value;\n\n      const payload = {\n\n        title:\n          $(\"resourceTitle\")\n            .value.trim(),\n\n        content:\n          $(\"resourceContent\")\n            .value.trim() || null,\n\n        category,\n\n        youtube_url:\n          category === \"video\"\n            ? $(\"youtubeUrl\")\n                .value.trim() || null\n            : null\n\n      };\n\n      if (!payload.title) {\n        throw new Error(\n          \"자료 제목을 입력하세요.\"\n        );\n      }\n\n      if (category === \"image\") {\n\n        payload.activity_category =\n          $(\"photoActivityCategory\")\n            .value || null;\n\n        payload.event_name =\n          $(\"photoEventName\")\n            .value.trim() || null;\n\n        payload.event_date =\n          $(\"photoEventDate\")\n            .value || null;\n\n        if (\n          !payload.activity_category\n        ) {\n          throw new Error(\n            \"사진 활동 분류를 선택하세요.\"\n          );\n        }\n\n        if (\n          !editingId &&\n          (\n            !payload.event_name ||\n            !payload.event_date\n          )\n        ) {\n          throw new Error(\n            \"행사명과 행사일을 입력하세요.\"\n          );\n        }\n\n      }\n\n      let postId = editingId;\n\n      if (editingId) {\n\n        const { error } =\n          await supabase\n            .from(\"resource_posts\")\n            .update(payload)\n            .eq(\"id\", editingId);\n\n        if (error) {\n          throw error;\n        }\n\n      } else {\n\n        const { data, error } =\n          await supabase\n            .from(\"resource_posts\")\n            .insert({\n              ...payload,\n              author_id:\n                currentUser.id\n            })\n            .select(\"id\")\n            .single();\n\n        if (error) {\n          throw error;\n        }\n\n        postId = data.id;\n\n        savedPostId = postId;\n\n      }\n\n      databaseSaved = true;\n\n      /*\n       * 게시물 저장 성공 후에는\n       * 파일 업로드 실패 시에도\n       * 게시물 ID를 유지합니다.\n       */\n\n      editingId = postId;\n\n      $(\"formHeading\").textContent =\n        \"자료 수정\";\n\n      $(\"cancelEditButton\").hidden =\n        false;\n\n      updateCategoryFields();\n\n      await uploadFiles(\n        postId,\n        category\n      );\n\n      resetEditor();\n\n      message(\n        \"saveMessage\",\n        \"자료와 첨부파일이 저장되었습니다.\"\n      );\n\n      await loadResources();\n\n    } catch (error) {\n\n      console.error(\n        \"자료 저장 오류:\",\n        error\n      );\n\n      if (\n        databaseSaved &&\n        savedPostId\n      ) {\n\n        editingId = savedPostId;\n\n        $(\"formHeading\").textContent =\n          \"자료 수정 및 첨부파일 재등록\";\n\n        $(\"cancelEditButton\").hidden =\n          false;\n\n        updateCategoryFields();\n\n        try {\n\n          await loadAttachments(\n            savedPostId\n          );\n\n        } catch (attachmentError) {\n\n          console.error(\n            attachmentError\n          );\n\n        }\n\n        message(\n          \"saveMessage\",\n          \"게시물은 저장되었지만 \" +\n          \"첨부파일 처리에 실패했습니다.\\n\" +\n          \"기존 첨부파일 목록을 확인한 후 \" +\n          \"다시 저장하세요.\\n\" +\n          error.message,\n          true\n        );\n\n      } else {\n\n        message(\n          \"saveMessage\",\n          \"자료 저장 실패: \" +\n          error.message,\n          true\n        );\n\n      }\n\n    } finally {\n\n      saving = false;\n\n      $(\"saveButton\").disabled =\n        false;\n\n    }\n\n  }\n);\n\n/* =====================================\n   자료 삭제\n===================================== */\n\nasync function deleteResource(post) {\n\n  if (\n    !confirm(\n      `\"${post.title}\" 자료를 삭제하시겠습니까?\\n` +\n      \"삭제한 자료는 복구할 수 없습니다.\"\n    )\n  ) {\n    return;\n  }\n\n  try {\n\n    if (!await verifyAdmin()) {\n      throw new Error(\n        \"관리자 권한이 없습니다.\"\n      );\n    }\n\n    const { data: files, error: fileError } =\n      await supabase\n        .from(\"resource_attachments\")\n        .select(\"file_path\")\n        .eq(\"resource_id\", post.id);\n\n    if (fileError) {\n      throw fileError;\n    }\n\n    const { error: attachmentError } =\n      await supabase\n        .from(\"resource_attachments\")\n        .delete()\n        .eq(\"resource_id\", post.id);\n\n    if (attachmentError) {\n      throw attachmentError;\n    }\n\n    const { error: postError } =\n      await supabase\n        .from(\"resource_posts\")\n        .delete()\n        .eq(\"id\", post.id);\n\n    if (postError) {\n      throw postError;\n    }\n\n    const paths =\n      (files || [])\n        .map(file => file.file_path)\n        .filter(Boolean);\n\n    if (paths.length > 0) {\n\n      const { error: storageError } =\n        await supabase.storage\n          .from(\"resource-files\")\n          .remove(paths);\n\n      if (storageError) {\n\n        console.warn(\n          \"Storage 파일 정리 필요:\",\n          storageError\n        );\n\n        alert(\n          \"게시물은 삭제되었지만 \" +\n          \"저장소 파일 정리가 필요합니다.\"\n        );\n\n      }\n\n    }\n\n    if (editingId === post.id) {\n      resetEditor();\n    }\n\n    await loadResources();\n\n  } catch (error) {\n\n    alert(\n      \"자료 삭제 실패: \" +\n      error.message\n    );\n\n  }\n\n}\n\n/* =====================================\n   최초 실행\n===================================== */\n\nupdateCategoryFields();\n\nrefreshAuth().catch(error => {\n\n  console.error(\n    \"관리자 초기화 오류:\",\n    error\n  );\n\n  message(\n    \"loginMessage\",\n    \"관리자 화면 초기화에 실패했습니다. \" +\n    error.message,\n    true\n  );\n\n});\n\n\u003c/script>\n\n</body>\n</html>\n",
  "view=admin-library": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>디지털 도서관 관리 | 글로벌 AI 허브</title>\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\n[hidden] {\n  display: none !important;\n}\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", Arial, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nheader h1 {\n  margin: 0 0 12px;\n  font-size: clamp(25px, 4vw, 34px);\n}\n\nheader a {\n  display: inline-block;\n  margin-top: 12px;\n  padding: 10px 18px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 25px 15px;\n}\n\nsection {\n  background: white;\n  padding: 25px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.07);\n}\n\nh2 {\n  margin-top: 0;\n  color: #0754a6;\n}\n\nlabel {\n  display: block;\n  margin-top: 15px;\n  font-weight: bold;\n}\n\ninput,\nselect,\ntextarea {\n  width: 100%;\n  padding: 12px;\n  margin-top: 6px;\n  border: 1px solid #c5d5e8;\n  border-radius: 7px;\n  font: inherit;\n}\n\ntextarea {\n  min-height: 120px;\n  resize: vertical;\n}\n\nbutton {\n  padding: 11px 17px;\n  margin: 8px 6px 5px 0;\n  border: 0;\n  border-radius: 7px;\n  background: #0754a6;\n  color: white;\n  cursor: pointer;\n  font-weight: bold;\n}\n\nbutton.secondary {\n  background: #64748b;\n}\n\nbutton.danger {\n  background: #b42318;\n}\n\nbutton:disabled {\n  opacity: .5;\n  cursor: not-allowed;\n}\n\n.toolbar {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 12px;\n}\n\n.status {\n  padding: 14px;\n  margin-top: 15px;\n  border-radius: 8px;\n  background: #eef4fb;\n  white-space: pre-wrap;\n}\n\n.status.error {\n  background: #fff1f2;\n  color: #991b1b;\n}\n\n.status.success {\n  background: #e8f5e9;\n  color: #176534;\n}\n\n.muted {\n  color: #64748b;\n}\n\n.document-row {\n  padding: 20px 0;\n  border-bottom: 1px solid #e2e8f0;\n}\n\n.document-row:last-child {\n  border-bottom: 0;\n}\n\n.document-row h3 {\n  margin: 0 0 8px;\n  color: #0754a6;\n}\n\n.document-meta {\n  color: #64748b;\n  font-size: 14px;\n}\n\n.badge {\n  display: inline-block;\n  padding: 4px 10px;\n  margin-right: 6px;\n  border-radius: 6px;\n  background: #e7f1ff;\n  color: #0754a6;\n  font-size: 13px;\n}\n\n.badge.private {\n  background: #fff3d9;\n  color: #8a5900;\n}\n\nfooter {\n  text-align: center;\n  padding: 30px 15px;\n  background: #10315e;\n  color: white;\n}\n\n@media(max-width:600px) {\n  section {\n    padding: 18px;\n  }\n\n  .toolbar {\n    align-items: stretch;\n    flex-direction: column;\n  }\n}\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n  <h1>📚 디지털 도서관 관리</h1>\n\n  <p>\n    경기도 글로벌 AI 허브 유치<br>\n    고양특례시 범시민추진위원회\n  </p>\n\n  \n</header>\n\n<main>\n\n<section id=\"authSection\">\n\n  <h2>관리자 인증</h2>\n\n  <p id=\"authMessage\" class=\"status\" role=\"status\">\n    관리자 권한을 확인하고 있습니다.\n  </p>\n\n  <a href=\"index.html?view=login\">\n    회원 로그인 페이지\n  </a>\n\n</section>\n\n<div id=\"adminArea\" hidden>\n\n<section>\n\n  <div class=\"toolbar\">\n\n    <strong id=\"adminEmail\"></strong>\n\n    <button id=\"refreshButton\" type=\"button\">\n      자료 목록 새로고침\n    </button>\n\n    <a href=\"library.html\" target=\"_blank\"\n       rel=\"noopener noreferrer\">\n      시민용 지식자료실 보기\n    </a>\n\n  </div>\n\n</section>\n\n<section id=\"editorSection\">\n\n  <h2 id=\"formHeading\">새 자료 등록</h2>\n\n  <p class=\"muted\">\n    1차 관리 화면입니다.\n    원문 파일과 표지 등록 기능은\n    다음 단계에서 연결합니다.\n  </p>\n\n  <form id=\"documentForm\">\n\n    <label for=\"documentType\">자료 종류 *</label>\n\n    <select id=\"documentType\" required>\n  <option value=\"ebook\">전자책</option>\n  <option value=\"policy\">정책·연구자료</option>\n  <option value=\"document\">일반 문서·기타 자료</option>\n</select>\n\n    <label for=\"documentTitle\">자료 제목 *</label>\n\n    <input\n      id=\"documentTitle\"\n      maxlength=\"300\"\n      required\n    >\n\n    <label for=\"documentAuthor\">저자·발행기관</label>\n\n    <input id=\"documentAuthor\">\n\n    <label for=\"documentDate\">발행일</label>\n\n    <input id=\"documentDate\" type=\"date\">\n\n    <label for=\"documentCategory\">세부 분류</label>\n\n    <input\n      id=\"documentCategory\"\n      placeholder=\"예: AI 정책, 연구보고서\"\n    >\n\n    <label for=\"documentAbstract\">자료 초록</label>\n\n    <textarea id=\"documentAbstract\"></textarea>\n\n    <label for=\"documentDescription\">상세 설명</label>\n\n    <textarea id=\"documentDescription\"></textarea>\n\n\u003c!-- =====================================\n     원문 파일 등록\n===================================== -->\n\n\u003c!-- 원문 파일 관리 -->\n\n<div id=\"currentFileSection\" hidden>\n\n  <h3>현재 등록된 원문 파일</h3>\n\n  <div class=\"status\">\n\n    <p id=\"currentFileName\"></p>\n\n    <p id=\"currentFileStatus\"></p>\n\n  </div>\n\n  <p class=\"muted\">\n    새로운 파일을 선택하지 않으면\n    기존 원문 파일이 유지됩니다.\n  </p>\n\n</div>\n\n<label for=\"documentFile\">\n  원문 파일 첨부 또는 교체\n</label>\n\n<input\n  id=\"documentFile\"\n  type=\"file\"\n  accept=\".pdf,.epub,.doc,.docx,.hwp,.hwpx,.ppt,.pptx,.xls,.xlsx,.txt\"\n/>\n\n<p id=\"selectedFileInfo\" class=\"muted\">\n  선택된 새 파일이 없습니다.\n</p>\n\n<p class=\"muted\">\n  PDF, 전자책 및 문서 파일을 첨부할 수 있습니다.\n  원문 파일은 비공개 저장소에 보관됩니다.\n</p>\n    \n    <label for=\"securityGrade\">공개 등급 *</label>\n\n    <select id=\"securityGrade\" required>\n      <option value=\"3\">3급 · 공개자료</option>\n      <option value=\"2\">2급 · 회원자료</option>\n      <option value=\"1\">1급 · 대외비</option>\n    </select>\n\n    <p class=\"status\">\n      신규 자료는 비공개 상태로 등록됩니다.\n      기존 자료의 공개 여부도\n      이번 화면에서는 변경하지 않습니다.\n    </p>\n\n    <button id=\"saveButton\" type=\"submit\">\n      자료 저장\n    </button>\n\n    <button\n      id=\"cancelButton\"\n      type=\"button\"\n      class=\"secondary\"\n      hidden>\n      수정 취소\n    </button>\n\n    <p id=\"saveMessage\" class=\"status\" role=\"status\"></p>\n\n  </form>\n\n</section>\n\n<section>\n\n  <h2>등록된 도서관 자료</h2>\n\n  <label for=\"searchInput\">자료 검색</label>\n\n  <input\n    id=\"searchInput\"\n    type=\"search\"\n    placeholder=\"제목 또는 저자 검색\"\n  >\n\n  <p id=\"listMessage\" class=\"status\" role=\"status\">\n    자료 목록을 불러오고 있습니다.\n  </p>\n\n  <div id=\"documentList\"></div>\n\n</section>\n\n</div>\n\n</main>\n\n<footer>\n  경기도 글로벌 AI 허브 유치<br>\n  고양특례시 범시민추진위원회\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\nconst $ = id => document.getElementById(id);\n\nlet currentUser = null;\nlet documents = [];\nlet editingId = null;\nlet saving = false;\n\nfunction showMessage(id, text, error = false) {\n  const element = $(id);\n  element.textContent = text;\n  element.className =\n    error ? \"status error\" : \"status success\";\n}\n\nfunction gradeName(grade) {\n  const names = {\n    1: \"1급 · 대외비\",\n    2: \"2급 · 회원자료\",\n    3: \"3급 · 공개자료\"\n  };\n\n  return names[Number(grade)] || \"등급 미확인\";\n}\n\nfunction typeName(type) {\n\n  const names = {\n    ebook: \"전자책\",\n    policy: \"정책·연구자료\",\n    document: \"일반 문서·기타 자료\",\n    photo: \"사진\",\n    video: \"동영상\",\n    audio: \"음성\"\n  };\n\n  return names[type] || type || \"기타 자료\";\n\n}\n\n/* 기존 원문 파일 표시 */\n\nfunction displayCurrentFile(doc) {\n\n  const section = $(\"currentFileSection\");\n\n  if (!doc || !doc.file_path) {\n\n    section.hidden = true;\n\n    $(\"currentFileName\").textContent = \"\";\n\n    $(\"currentFileStatus\").textContent = \"\";\n\n    return;\n  }\n\n  section.hidden = false;\n\n  const storedName =\n    doc.file_path.split(\"/\").pop();\n\n  $(\"currentFileName\").textContent =\n    \"📄 저장된 파일: \" + storedName;\n\n  $(\"currentFileStatus\").textContent =\n    \"원문 파일 경로가 등록되어 있습니다.\";\n\n}\n  \n/* 관리자 권한 확인 */\n\nasync function verifyAdmin() {\n\n  const { data, error } =\n    await supabase.auth.getUser();\n\n  if (error || !data.user) {\n    throw new Error(\"관리자 로그인이 필요합니다.\");\n  }\n\n  const result =\n    await supabase.rpc(\"is_resource_admin\");\n\n  if (result.error) {\n    throw result.error;\n  }\n\n  if (result.data !== true) {\n    throw new Error(\"자료실 관리자 권한이 없습니다.\");\n  }\n\n  return data.user;\n}\n\n/* 초기 인증 */\n\nasync function initialize() {\n\n  try {\n\n    currentUser = await verifyAdmin();\n\n    $(\"adminEmail\").textContent =\n      currentUser.email || \"\";\n\n    $(\"authSection\").hidden = true;\n    $(\"adminArea\").hidden = false;\n\n    await loadDocuments();\n\n  } catch (error) {\n\n    $(\"adminArea\").hidden = true;\n\n    showMessage(\n      \"authMessage\",\n      error.message,\n      true\n    );\n\n  }\n}\n\n/* 자료 목록 조회 */\n\nasync function loadDocuments() {\n\n  showMessage(\n    \"listMessage\",\n    \"자료 목록을 불러오고 있습니다.\"\n  );\n\n  const { data, error } =\n    await supabase\n      .from(\"knowledge_documents\")\n      .select(`\n        id,\n        title,\n        abstract,\n        description,\n        document_type,\n        category,\n        security_grade,\n        author,\n        published_at,\n        is_published,\n        file_path,\n        thumbnail_url\n      `)\n      .is(\"deleted_at\", null)\n      .order(\"id\", {\n        ascending: false\n      });\n\n  if (error) {\n\n    showMessage(\n      \"listMessage\",\n      \"자료 조회 실패: \" + error.message,\n      true\n    );\n\n    return;\n  }\n\n  documents = data || [];\n\n  showMessage(\n    \"listMessage\",\n    \"등록 자료 \" + documents.length + \"건\"\n  );\n\n  renderDocuments();\n}\n\n/* 목록 표시 */\n\nfunction renderDocuments() {\n\n  const keyword =\n    $(\"searchInput\").value.trim().toLowerCase();\n\n  const filtered = documents.filter(doc => {\n\n    const text = [\n      doc.title,\n      doc.author\n    ].filter(Boolean).join(\" \").toLowerCase();\n\n    return text.includes(keyword);\n  });\n\n  const container = $(\"documentList\");\n\n  container.replaceChildren();\n\n  if (filtered.length === 0) {\n    const empty = document.createElement(\"p\");\n    empty.textContent = \"검색 조건에 맞는 자료가 없습니다.\";\n    container.appendChild(empty);\n    return;\n  }\n\n  filtered.forEach(doc => {\n\n    const row = document.createElement(\"article\");\n    row.className = \"document-row\";\n\n    const title = document.createElement(\"h3\");\n    title.textContent = doc.title || \"제목 없음\";\n\n    const meta = document.createElement(\"p\");\n    meta.className = \"document-meta\";\n\n    meta.textContent = [\n      typeName(doc.document_type),\n      gradeName(doc.security_grade),\n      doc.author || \"\",\n      doc.published_at || \"\"\n    ].filter(Boolean).join(\" · \");\n\n    const status = document.createElement(\"span\");\n    status.className =\n      doc.is_published ? \"badge\" : \"badge private\";\n\n    status.textContent =\n      doc.is_published ? \"공개 설정\" : \"비공개 설정\";\n\n/* =====================================\n   원문 파일 등록 상태 표시\n===================================== */\n\nconst fileStatus =\n  document.createElement(\"span\");\n\nfileStatus.className =\n  doc.file_path ? \"badge\" : \"badge private\";\n\nfileStatus.textContent =\n  doc.file_path\n    ? \"📄 원문 등록됨\"\n    : \"📄 원문 없음\";\n    \n    const editButton = document.createElement(\"button\");\n    editButton.type = \"button\";\n    editButton.textContent = \"수정\";\n\n    editButton.addEventListener(\"click\", () => {\n      editDocument(doc);\n    });\n\n    const deleteButton = document.createElement(\"button\");\n    deleteButton.type = \"button\";\n    deleteButton.className = \"danger\";\n    deleteButton.textContent = \"삭제\";\n\n    deleteButton.addEventListener(\"click\", () => {\n      deleteDocument(doc);\n    });\n\n/* =====================================\n   제173-2단계\n   공개·비공개 전환 버튼\n===================================== */\n\nconst publishButton = document.createElement(\"button\");\n\npublishButton.type = \"button\";\n\npublishButton.className = \"secondary\";\n\npublishButton.textContent =\n  doc.is_published\n    ? \"비공개로 전환\"\n    : \"공개로 전환\";\n\npublishButton.addEventListener(\"click\", () => {\n  toggleDocumentPublished(doc, publishButton);\n});\n    \n    const openButton = document.createElement(\"button\");\n\nopenButton.type = \"button\";\nopenButton.textContent = \"원문 열람\";\nopenButton.className = \"secondary\";\n\nopenButton.disabled = !doc.file_path;\n\nopenButton.addEventListener(\"click\", () => {\n  openAdminDocument(doc, openButton);\n});\n\nrow.append(\n  title,\n  meta,\n  status,\n  fileStatus,\n  document.createElement(\"br\"),\n  editButton,\n  deleteButton,\n  openButton,\n  publishButton\n);\n\n    container.appendChild(row);\n  });\n}\n\n/* 수정 화면 */\n\nfunction editDocument(doc) {\n\n  editingId = doc.id;\n\n  displayCurrentFile(doc);\n\n  $(\"formHeading\").textContent = \"자료 수정\";\n\n  const typeSelect = $(\"documentType\");\n\nconst existingType =\n  doc.document_type || \"document\";\n\nif (\n  !Array.from(typeSelect.options).some(\n    option => option.value === existingType\n  )\n) {\n\n  typeSelect.add(\n    new Option(\n      typeName(existingType) + \" (기존 자료 종류)\",\n      existingType\n    )\n  );\n\n}\n\ntypeSelect.value = existingType;\n\n  $(\"documentTitle\").value =\n    doc.title || \"\";\n\n  $(\"documentAuthor\").value =\n    doc.author || \"\";\n\n  $(\"documentDate\").value =\n    doc.published_at\n      ? String(doc.published_at).slice(0, 10)\n      : \"\";\n\n  $(\"documentCategory\").value =\n    doc.category || \"\";\n\n  $(\"documentAbstract\").value =\n    doc.abstract || \"\";\n\n  $(\"documentDescription\").value =\n    doc.description || \"\";\n\n  $(\"securityGrade\").value =\n    String(doc.security_grade ?? 3);\n\n  $(\"cancelButton\").hidden = false;\n\n  $(\"saveMessage\").textContent = \"\";\n\n  $(\"editorSection\").scrollIntoView({\n    behavior: \"smooth\"\n  });\n}\n\n/* 입력 초기화 */\n\nfunction resetEditor() {\n\n  editingId = null;\n\n  $(\"documentForm\").reset();\n\n  displayCurrentFile(null);\n\n$(\"selectedFileInfo\").textContent =\n  \"선택된 새 파일이 없습니다.\";\n\n  $(\"formHeading\").textContent = \"새 자료 등록\";\n\n  $(\"cancelButton\").hidden = true;\n\n  $(\"saveMessage\").textContent = \"\";\n}\n\n$(\"cancelButton\").addEventListener(\n  \"click\",\n  resetEditor\n);\n\n/* 자료 저장 */\n\n/* =====================================\n   원문 파일 업로드\n===================================== */\n\n/* =====================================\n   원문 파일 업로드 및 DB 연결\n===================================== */\n\n/* =====================================\n   원문 파일 업로드 및 DB 연결\n   관리자 전용 RPC 방식\n===================================== */\n\nasync function uploadDocumentFile(\n  documentId,\n  file\n) {\n\n  if (!file) {\n    return;\n  }\n\n  // 1. 관리자 권한 확인\n  const user = await verifyAdmin();\n\n  const BUCKET = \"knowledge-private\";\n\n  // 2. 파일 형식 확인\n  const extension =\n    file.name.split(\".\").pop().toLowerCase();\n\n  const allowedExtensions = [\n    \"pdf\", \"epub\", \"doc\", \"docx\",\n    \"hwp\", \"hwpx\", \"ppt\", \"pptx\",\n    \"xls\", \"xlsx\", \"txt\"\n  ];\n\n  if (!allowedExtensions.includes(extension)) {\n    throw new Error(\n      \"허용되지 않은 파일 형식입니다.\"\n    );\n  }\n\n  // 3. 안전한 파일명 생성\n  const safeName = file.name\n    .replace(/[^a-zA-Z0-9._-]/g, \"_\")\n    .slice(-120);\n\n  const filePath =\n    `${user.id}/documents/${documentId}/` +\n    `${crypto.randomUUID()}-${safeName}`;\n\n  // 4. Storage 업로드\n  showMessage(\n    \"saveMessage\",\n    \"원문 파일을 업로드하고 있습니다.\"\n  );\n\n  const { error: uploadError } =\n    await supabase.storage\n      .from(BUCKET)\n      .upload(filePath, file, {\n        contentType:\n          file.type || \"application/octet-stream\",\n        upsert: false\n      });\n\n  if (uploadError) {\n    throw new Error(\n      \"원문 파일 업로드 실패: \" +\n      uploadError.message\n    );\n  }\n\n  // 5. 관리자 전용 RPC 호출\n  showMessage(\n    \"saveMessage\",\n    \"원문 파일과 자료 정보를 연결하고 있습니다.\"\n  );\n\n  const { error: rpcError } =\n    await supabase.rpc(\n      \"save_knowledge_document_file\",\n      {\n        p_document_id: documentId,\n        p_file_path: filePath\n      }\n    );\n\n  if (rpcError) {\n\n    console.error(\n      \"원문 연결 RPC 오류:\",\n      rpcError\n    );\n\n    // DB 연결 실패 시 업로드한 새 파일 정리\n    const { error: cleanupError } =\n      await supabase.storage\n        .from(BUCKET)\n        .remove([filePath]);\n\n    if (cleanupError) {\n      console.error(\n        \"업로드 파일 정리 실패:\",\n        cleanupError\n      );\n    }\n\n    throw new Error(\n      \"원문 파일 연결 실패: \" +\n      rpcError.message\n    );\n  }\n\n  // 6. 연결 결과 확인\n  const { data: savedDocument, error: verifyError } =\n    await supabase\n      .from(\"knowledge_documents\")\n      .select(\"file_path\")\n      .eq(\"id\", documentId)\n      .single();\n\n  if (verifyError) {\n    throw new Error(\n      \"원문 연결 확인 실패: \" +\n      verifyError.message\n    );\n  }\n\n  if (savedDocument.file_path !== filePath) {\n    throw new Error(\n      \"저장된 원문 파일 경로가 일치하지 않습니다.\"\n    );\n  }\n\n  console.log(\n    \"원문 파일 업로드 및 연결 성공:\",\n    {\n      documentId,\n      filePath\n    }\n  );\n\n  return filePath;\n}\n\n\n  \n$(\"documentForm\").addEventListener(\n  \"submit\",\n  async event => {\n\n    event.preventDefault();\n\n    if (saving) return;\n\n    saving = true;\n    $(\"saveButton\").disabled = true;\n\n    try {\n\n      currentUser = await verifyAdmin();\n\n      const payload = {\n        title: $(\"documentTitle\").value.trim(),\n        author: $(\"documentAuthor\").value.trim() || null,\n        published_at: $(\"documentDate\").value || null,\n        category: $(\"documentCategory\").value.trim() || null,\n        abstract: $(\"documentAbstract\").value.trim() || null,\n        description: $(\"documentDescription\").value.trim() || null,\n        document_type: $(\"documentType\").value,\n        security_grade: Number($(\"securityGrade\").value)\n      };\n\n      if (!payload.title) {\n        throw new Error(\"자료 제목을 입력하세요.\");\n      }\n\n      if (![1, 2, 3].includes(payload.security_grade)) {\n        throw new Error(\"공개 등급을 확인하세요.\");\n      }\n\n      if (editingId !== null) {\n\n  const documentId = editingId;\n\n  const { data, error } =\n    await supabase\n      .from(\"knowledge_documents\")\n      .update(payload)\n      .eq(\"id\", documentId)\n      .select(\"id\");\n\n  if (error) {\n    throw error;\n  }\n\n  if (!data || data.length !== 1) {\n    throw new Error(\n      \"수정 결과를 확인할 수 없습니다.\"\n    );\n  }\n\n  /* 수정 시 원문 파일 업로드 */\n\n  const file =\n  $(\"documentFile\").files[0];\n\nconsole.log(\n  \"원문 파일 선택 확인:\",\n  file\n    ? {\n        name: file.name,\n        size: file.size,\n        type: file.type\n      }\n    : \"선택된 파일 없음\"\n);\n\n  if (file) {\n\n    showMessage(\n      \"saveMessage\",\n      \"자료 정보 저장 완료. 원문 파일을 업로드하고 있습니다.\"\n    );\n\n    await uploadDocumentFile(\n      documentId,\n      file\n    );\n\n  }\n\n} else {\n\n        /* 신규 자료 등록 */\n\n        const { data, error } =\n          await supabase\n            .from(\"knowledge_documents\")\n            .insert({\n              ...payload,\n              is_published: false,\n              created_by: currentUser.id\n            })\n            .select(\"id\");\n\n        if (error) throw error;\n\n        if (!data || data.length !== 1) {\n          throw new Error(\n            \"등록 결과를 확인할 수 없습니다.\"\n          );\n        }\n\n        /* 원문 파일 업로드 */\n\n       const file =\n  $(\"documentFile\").files[0];\n\nconsole.log(\n  \"원문 파일 선택 확인:\",\n  file\n    ? {\n        name: file.name,\n        size: file.size,\n        type: file.type\n      }\n    : \"선택된 파일 없음\"\n);\n\n        if (file) {\n\n          await uploadDocumentFile(\n            data[0].id,\n            file\n          );\n\n        }\n\n      }\n\n     await loadDocuments();\n\nif (editingId !== null) {\n\n  const updatedDocument = documents.find(\n    doc => String(doc.id) === String(editingId)\n  );\n\n  if (updatedDocument) {\n    displayCurrentFile(updatedDocument);\n  }\n\n} else {\n\n  resetEditor();\n\n}\n\nshowMessage(\n  \"saveMessage\",\n  \"자료가 정상적으로 저장되었습니다.\"\n);\n\n        } catch (error) {\n\n      console.error(\n        \"디지털 도서관 자료 저장 오류:\",\n        error\n      );\n\n      showMessage(\n        \"saveMessage\",\n        \"자료 저장 처리 중 오류가 발생했습니다.\\n\" +\n        \"자료 정보는 저장되었을 수 있으나 \" +\n        \"원문 파일 등록은 완료되지 않았을 수 있습니다.\\n\\n\" +\n        \"오류 내용: \" + error.message +\n        \"\\n\\n자료 목록을 새로고침하여 \" +\n        \"원문 등록 상태를 확인하세요.\",\n        true\n      );\n\n   } finally {\n\n      saving = false;\n\n      $(\"saveButton\").disabled = false;\n\n    }\n\n  }\n);\n  \n/* 자료 삭제 */\n\nasync function deleteDocument(doc) {\n  if ([9, 10, 11, 12].includes(Number(doc.id))) {\n    alert(\"보호 전자책은 삭제할 수 없습니다.\");\n    return;\n  }\n  const entered = prompt(`\"${doc.title}\" 삭제 사유를 입력하세요. 접근 기록은 보존됩니다.`, \"\");\n  if (entered === null) return;\n  const reason = entered.trim();\n  if (!reason || reason.length > 1000) {\n    alert(\"삭제 사유는 1~1000자로 입력해야 합니다.\");\n    return;\n  }\n  if (!confirm(\"이 자료를 논리 삭제하시겠습니까?\")) return;\n\n  try {\n    const { data: allowed, error: roleError } = await supabase.rpc(\"is_super_admin\");\n    if (roleError) throw roleError;\n    if (allowed !== true) throw new Error(\"최고관리자만 자료를 삭제할 수 있습니다.\");\n\n    const { data, error } = await supabase.rpc(\"admin_soft_delete_knowledge_document\", {\n      p_document_id: doc.id,\n      p_reason: reason\n    });\n    if (error) throw error;\n    if (data !== true) throw new Error(\"삭제가 승인되지 않았습니다.\");\n\n    const { data: remaining, error: checkError } = await supabase\n      .from(\"knowledge_documents\")\n      .select(\"id\")\n      .eq(\"id\", doc.id)\n      .is(\"deleted_at\", null);\n    if (checkError) throw checkError;\n    if (!Array.isArray(remaining) || remaining.length) throw new Error(\"자료가 여전히 삭제되지 않은 상태입니다.\");\n\n    if (String(editingId) === String(doc.id)) resetEditor();\n    await loadDocuments();\n    alert(\"자료를 목록에서 삭제했습니다.\");\n  } catch (error) {\n    alert(\"자료 삭제 확인 실패: \" + error.message);\n  }\n}\n\nasync function openAdminDocument(doc, button) {\n\n  if (!doc.file_path) {\n    alert(\"등록된 원문 파일이 없습니다.\");\n    return;\n  }\n\n  button.disabled = true;\n  button.textContent = \"권한 확인 중...\";\n\n  try {\n\n    await verifyAdmin();\n\n    const { data, error } =\n      await supabase.auth.getSession();\n\n    if (error || !data.session?.access_token) {\n      throw new Error(\"관리자 로그인이 필요합니다.\");\n    }\n\n    const response = await fetch(\n      SUPABASE_URL +\n      \"/functions/v1/knowledge-document-access\",\n      {\n        method: \"POST\",\n        headers: {\n          \"Content-Type\": \"application/json\",\n          \"apikey\": SUPABASE_KEY,\n          \"Authorization\":\n            \"Bearer \" + data.session.access_token\n        },\n        body: JSON.stringify({\n          document_id: doc.id\n        })\n      }\n    );\n\n    const result = await response.json();\n\n    if (!response.ok || !result.success) {\n      throw new Error(\n        result.error ||\n        result.message ||\n        \"원문 열람 권한이 없습니다.\"\n      );\n    }\n\n    if (!result.signed_url) {\n      throw new Error(\n        \"원문 열람 주소가 발급되지 않았습니다.\"\n      );\n    }\n\n    const url = new URL(result.signed_url);\n\n    if (\n      url.protocol !== \"https:\" ||\n      url.origin !== SUPABASE_URL ||\n      !url.pathname.startsWith(\n        \"/storage/v1/object/sign/knowledge-private/\"\n      )\n    ) {\n      throw new Error(\"허용되지 않은 파일 주소입니다.\");\n    }\n\n    window.open(\n      url.href,\n      \"_blank\",\n      \"noopener,noreferrer\"\n    );\n\n  } catch (error) {\n\n    alert(\n      \"원문 열람 실패\\n\\n\" + error.message\n    );\n\n  } finally {\n\n    button.disabled = false;\n    button.textContent = \"원문 열람\";\n\n  }\n}\n\n/* =====================================\n   제173-2단계\n   디지털 도서관 공개 상태 변경\n===================================== */\n\nasync function toggleDocumentPublished(doc, button) {\n\n  const nextPublished = !doc.is_published;\n\n  const actionText =\n    nextPublished\n      ? \"공개\"\n      : \"비공개\";\n\n  const confirmed = confirm(\n    `\"${doc.title}\" 자료를 ${actionText} 상태로 전환하시겠습니까?\\n\\n` +\n    (\n      nextPublished\n        ? \"공개 전환 후에는 자료의 보안 등급에 따라 열람이 허용됩니다.\"\n        : \"비공개 전환 후에는 일반 이용자의 원문 열람이 차단됩니다.\"\n    )\n  );\n\n  if (!confirmed) {\n    return;\n  }\n\n  button.disabled = true;\n  button.textContent = \"변경 중...\";\n\n  try {\n\n    // 관리자 권한 재확인\n    await verifyAdmin();\n\n    // 관리자 전용 RPC 호출\n    const { data, error } =\n      await supabase.rpc(\n        \"set_knowledge_document_published\",\n        {\n          p_document_id: doc.id,\n          p_is_published: nextPublished\n        }\n      );\n\n    if (error) {\n      throw error;\n    }\n\n    if (data !== true) {\n      throw new Error(\n        \"공개 상태 변경 결과를 확인할 수 없습니다.\"\n      );\n    }\n\n    // 자료 목록 새로고침\n    await loadDocuments();\n\n    alert(\n      `자료가 ${actionText} 상태로 변경되었습니다.`\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"자료 공개 상태 변경 오류:\",\n      error\n    );\n\n    alert(\n      \"공개 상태 변경 실패\\n\\n\" +\n      error.message\n    );\n\n  } finally {\n\n    button.disabled = false;\n\n    button.textContent =\n      doc.is_published\n        ? \"비공개로 전환\"\n        : \"공개로 전환\";\n\n  }\n\n}\n  \n/* 이벤트 */\n\n/* 새로 선택한 원문 파일 표시 */\n\n$(\"documentFile\").addEventListener(\n  \"change\",\n  function () {\n\n    const file = this.files[0];\n\n    if (!file) {\n\n      $(\"selectedFileInfo\").textContent =\n        \"선택된 새 파일이 없습니다.\";\n\n      return;\n    }\n\n    $(\"selectedFileInfo\").textContent =\n      \"새로 선택한 파일: \" +\n      file.name +\n      \" (\" +\n      (file.size / 1024).toFixed(1) +\n      \" KB)\";\n\n  }\n);\n  \n$(\"searchInput\").addEventListener(\n  \"input\",\n  renderDocuments\n);\n\n$(\"refreshButton\").addEventListener(\n  \"click\",\n  loadDocuments\n);\n\n/* 최초 실행 */\n\ninitialize();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "view=admin-ebooks-create": "<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Full 전자책 신규 생성</title>\n<style>\nbody { font: 1rem system-ui; color: #17324b; margin: 2rem auto; max-width: 58rem; padding: 0 1rem; }\nfieldset { margin: 1rem 0; border: 1px solid #a9b9c9; border-radius: .5rem; }\n[hidden] { display:none!important; }\nlabel { display:block; margin:.5rem 0; }\ninput:not([type=checkbox]),textarea { box-sizing:border-box; width:min(100%,32rem); }\nbutton,input,textarea { font:inherit; padding:.35rem; }\nbutton { margin:.25rem .5rem .25rem 0; }\n.scroll { max-height:22rem; overflow:auto; }\nth,td { padding:.35rem .75rem; border-bottom:1px solid #ddd; }\n</style>\n</head><body>\n<nav><a href=\"admin-center.html\">← 관리센터로</a> · <a href=\"admin-center.html?view=admin-ebooks-test\">등록 전자책 목록</a></nav>\n<main><h1>Full 전자책 신규 생성</h1>\n<p id=\"message\" role=\"status\">관리자 인증을 확인하고 있습니다.</p>\n<div id=\"workspace\" hidden>\n<fieldset id=\"controls\">\n\n<h2>1. 작업 생성</h2>\n<label>발간번호 <input id=\"issue\" placeholder=\"issue-03\" maxlength=\"80\"></label>\n<label>본문 쪽수 <input id=\"total\" type=\"number\" min=\"1\" max=\"2000\" step=\"1\"></label>\n<button type=\"button\" id=\"create\">새 작업 생성</button>\n<h2>2. 작업 상태와 파일 업로드</h2>\n<label>작업 ID <input id=\"job\" spellcheck=\"false\" autocomplete=\"off\"></label>\n<button type=\"button\" id=\"status\">상태 확인</button>\n<p id=\"state\" aria-live=\"polite\"></p>\n<label>표지 cover.webp 또는 0000.webp와 번호가 붙은 본문 WebP\n<input id=\"files\" type=\"file\" accept=\".webp,image/webp\" multiple></label>\n<button type=\"button\" id=\"upload\" disabled>선택 파일 업로드</button>\n<button type=\"button\" id=\"reset\" disabled>미완료 작업 전체 초기화</button>\n<h2>3. 최종 등록</h2>\n<label>제목 <input id=\"title\" maxlength=\"300\"></label>\n<label>저자 <input id=\"author\" maxlength=\"300\"></label>\n<label>초록 <textarea id=\"abstract\" maxlength=\"5000\"></textarea></label>\n<label>설명 <textarea id=\"description\" maxlength=\"20000\"></textarea></label>\n<button type=\"button\" id=\"finalize\" disabled>최종 등록</button>\n<a id=\"manage\" hidden>등록한 전자책 페이지 관리 →</a>\n\n</fieldset></div>\n</main>\n\u003cscript type=\"module\">\nimport { createClient } from \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\nconst FUNCTION = \"knowledge-ebook-create\";\n\nconst client = createClient(SUPABASE_URL, SUPABASE_KEY);\nasync function request(action, data = {}) {\n  const { data: result, error } = await client.functions.invoke(FUNCTION, { body: { action, ...data } });\n  let details = result;\n  if (error?.context?.json) {\n    try { details = await error.context.json(); } catch {}\n  }\n  if (error || result?.success !== true) {\n    const context = [\n      details?.error_code,\n      details?.failed_page ? \"실패 페이지 \" + details.failed_page : \"\",\n      Array.isArray(details?.completed) ? \"완료 \" + details.completed.length + \"개\" : \"\"\n    ].filter(Boolean);\n    throw new Error((details?.error || error?.message || \"서버 요청에 실패했습니다.\") +\n      (context.length ? \" (\" + context.join(\" · \") + \")\" : \"\"));\n  }\n  return result;\n}\nasync function webp(file) {\n  if (!file || !/\\.webp$/i.test(file.name) || file.size > 5 * 1024 * 1024) {\n    throw new Error(\"5 MiB 이하의 WebP 파일을 선택하세요.\");\n  }\n  const header = new TextDecoder().decode(await file.slice(0, 12).arrayBuffer());\n  if (!header.startsWith(\"RIFF\") || header.slice(8) !== \"WEBP\") throw new Error(\"WebP 이미지 형식을 확인하세요.\");\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = () => resolve(String(reader.result).split(\",\")[1]);\n    reader.onerror = () => reject(new Error(\"파일을 읽지 못했습니다: \" + file.name));\n    reader.readAsDataURL(file);\n  });\n}\n\nconst $ = id => document.getElementById(id);\nlet current = null;\nconst cacheKey = \"goyang-full-ebook-job\";\nconst jobPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;\n\ntry { $(\"job\").value = sessionStorage.getItem(cacheKey) || \"\"; } catch {}\nfunction remember(id) {\n  try {\n    if (id) sessionStorage.setItem(cacheKey, id);\n    else sessionStorage.removeItem(cacheKey);\n  } catch {}\n}\nfunction jobId() {\n  const id = $(\"job\").value.trim();\n  if (!jobPattern.test(id)) throw new Error(\"작업 ID(UUID)를 입력하세요.\");\n  return id;\n}\nasync function withJob(action, body = {}) {\n  return request(action, { job_id: jobId(), ...body });\n}\nfunction renderState() {\n  const loaded = current && current.job_id === $(\"job\").value.trim();\n  const writable = loaded && [\"pending\", \"uploading\"].includes(current.status) && !current.operation_active;\n  $(\"upload\").disabled = !writable;\n  $(\"reset\").disabled = !writable;\n  $(\"finalize\").disabled = !writable || !current.cover_completed || current.uploaded_pages !== current.total_pages;\n  const documentId = loaded && current.document_id;\n  $(\"manage\").hidden = !documentId;\n  if (documentId) $(\"manage\").href = \"admin-center.html?view=admin-ebook-pages&document_id=\" + encodeURIComponent(documentId);\n}\nasync function loadStatus() {\n  current = null;\n  renderState();\n  const result = await withJob(\"status\");\n  current = result;\n  remember(result.job_id);\n  const status = {\n    pending: \"대기\", uploading: \"업로드 중\", completed: \"등록 완료\"\n  }[result.status] || result.status;\n  $(\"state\").textContent = [\n    result.issue_code + \" · \" + status,\n    \"표지 \" + (result.cover_completed ? \"등록\" : \"미등록\"),\n    \"본문 \" + result.uploaded_pages + \" / \" + result.total_pages,\n    result.operation_active ? \"서버 작업 진행 중\" : \"\",\n    result.document_id ? \"문서 ID \" + result.document_id : \"\"\n  ].filter(Boolean).join(\" · \");\n  renderState();\n  return result;\n}\nasync function run(operation) {\n  $(\"controls\").disabled = true;\n  try { await operation(); }\n  catch (error) { $(\"message\").textContent = error.message; }\n  finally { $(\"controls\").disabled = false; renderState(); }\n}\n$(\"job\").addEventListener(\"input\", () => {\n  $(\"state\").textContent = \"\";\n  renderState();\n});\n$(\"create\").addEventListener(\"click\", () => run(async () => {\n  const issue = $(\"issue\").value.trim();\n  const total = $(\"total\").valueAsNumber;\n  if (!/^[A-Za-z0-9_-]{1,80}$/.test(issue)) throw new Error(\"발간번호는 영문, 숫자, 밑줄 또는 하이픈으로 입력하세요.\");\n  if (!Number.isSafeInteger(total) || total < 1 || total > 2000) throw new Error(\"본문 쪽수는 1~2000입니다.\");\n  const result = await request(\"create\", { issue_code: issue, total_pages: total });\n  if (!jobPattern.test(result.job?.id || \"\")) throw new Error(\"서버가 작업 ID를 반환하지 않았습니다.\");\n  $(\"job\").value = result.job.id;\n  remember(result.job.id);\n  $(\"message\").textContent = result.message;\n  await loadStatus();\n}));\n$(\"status\").addEventListener(\"click\", () => run(async () => {\n  await loadStatus();\n  $(\"message\").textContent = \"작업 상태를 확인했습니다.\";\n}));\n$(\"upload\").addEventListener(\"click\", () => run(async () => {\n  const info = await loadStatus();\n  const files = new Map();\n  for (const file of $(\"files\").files) {\n    const name = /^(cover|[0-9]{1,4})\\.webp$/i.exec(file.name);\n    const page = name ? (name[1].toLowerCase() === \"cover\" ? 0 : Number(name[1])) : -1;\n    if (page < 0 || page > info.total_pages || files.has(page)) throw new Error(\"잘못되었거나 중복된 파일 이름: \" + file.name);\n    files.set(page, file);\n  }\n  if (!files.size) throw new Error(\"업로드할 파일을 선택하세요.\");\n  const completed = new Set(info.completed_pages);\n  if (info.cover_completed) completed.add(0);\n  let uploaded = 0;\n  let failure;\n  try {\n    for (const [page, file] of [...files].sort(([a], [b]) => a - b)) {\n      if (completed.has(page)) continue;\n      $(\"message\").textContent = (page === 0 ? \"표지\" : page + \"쪽\") + \" 업로드 중…\";\n      await withJob(\"upload\", { page_number: page, image_base64: await webp(file) });\n      uploaded++;\n    }\n  } catch (error) { failure = error; }\n  try { await loadStatus(); } catch (error) { if (!failure) throw error; }\n  if (failure) throw failure;\n  $(\"message\").textContent = uploaded + \"개 파일을 업로드했습니다. 이미 등록된 쪽은 건너뛰었습니다.\";\n}));\n$(\"reset\").addEventListener(\"click\", () => run(async () => {\n  if (!confirm(\"이 미완료 작업과 업로드한 파일을 모두 삭제하시겠습니까?\")) return;\n  const result = await withJob(\"reset\", { confirm_reset: true });\n  current = null;\n  $(\"job\").value = \"\";\n  $(\"state\").textContent = \"\";\n  remember(\"\");\n  $(\"message\").textContent = result.message;\n}));\n$(\"finalize\").addEventListener(\"click\", () => run(async () => {\n  const title = $(\"title\").value.trim();\n  if (!title) throw new Error(\"전자책 제목을 입력하세요.\");\n  if (!confirm(\"표지와 본문을 최종 등록하시겠습니까?\")) return;\n  const result = await withJob(\"finalize\", {\n    confirm_finalize: true, title, author: $(\"author\").value.trim(),\n    abstract: $(\"abstract\").value.trim(), description: $(\"description\").value.trim()\n  });\n  $(\"message\").textContent = result.message + \" 문서 ID: \" + result.document_id;\n  await loadStatus();\n}));\nrun(async () => {\n  await request(\"ping\");\n  $(\"workspace\").hidden = false;\n  $(\"message\").textContent = \"관리자 인증을 확인했습니다.\";\n  if (jobPattern.test($(\"job\").value)) await loadStatus();\n});\n\n\u003c/script></body></html>\n",
  "view=admin-ebooks-replace": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\ncontent=\"width=device-width,initial-scale=1\">\n\n<title>전자책 이미지 교체 관리</title>\n\n<style>\n*{\n  box-sizing:border-box;\n}\n\nbody{\n  margin:0;\n  font-family:\"Malgun Gothic\",Arial,sans-serif;\n  background:#f3f7fc;\n  color:#17315b;\n}\n\nheader{\n  background:#0754a6;\n  color:white;\n  text-align:center;\n  padding:28px 15px;\n}\n\nmain{\n  max-width:1100px;\n  margin:auto;\n  padding:24px 15px;\n}\n\nsection{\n  background:white;\n  padding:25px;\n  border-radius:12px;\n  margin-bottom:20px;\n}\n\nselect,input,button{\n  padding:12px;\n  font:inherit;\n  max-width:100%;\n}\n\nselect{\n  width:100%;\n  margin:10px 0;\n}\n\nbutton{\n  background:#0754a6;\n  color:white;\n  border:0;\n  border-radius:7px;\n  cursor:pointer;\n}\n\nbutton:disabled{\n  opacity:.5;\n  cursor:not-allowed;\n}\n\n.compare{\n  display:grid;\n  grid-template-columns:1fr 1fr;\n  gap:20px;\n}\n\n.imageBox{\n  padding:15px;\n  border:1px solid #dce6f2;\n  text-align:center;\n}\n\n.imageBox img{\n  max-width:100%;\n  max-height:650px;\n  object-fit:contain;\n}\n\n.message{\n  padding:15px;\n  background:#eef4fc;\n  border-radius:8px;\n  margin:15px 0;\n  white-space:pre-wrap;\n}\n\n.actionArea{\n  margin-top:25px;\n  text-align:center;\n}\n\n.replaceButton{\n  background:#087344;\n  padding:15px 35px;\n  font-weight:bold;\n  font-size:17px;\n}\n\n[hidden]{\n  display:none!important;\n}\n\n@media(max-width:700px){\n  .compare{\n    grid-template-columns:1fr;\n  }\n}\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n<h1>📚 전자책 이미지 교체 관리</h1>\n<p>디지털 도서관 통합 관리센터</p>\n</header>\n\n<main>\n\n<section>\n<h2>관리자 인증</h2>\n\n<div id=\"message\" class=\"message\">\n관리자 권한을 확인하고 있습니다.\n</div>\n</section>\n\n<section id=\"workArea\" hidden>\n\n<h2>전자책 선택</h2>\n\n<select id=\"bookSelect\">\n<option value=\"\">\n전자책을 선택하세요\n</option>\n</select>\n\n<h2>페이지 선택</h2>\n\n<select id=\"pageSelect\">\n<option value=\"\">\n페이지를 선택하세요\n</option>\n</select>\n\n<button id=\"loadButton\" type=\"button\">\n기존 이미지 불러오기\n</button>\n\n</section>\n\n<section id=\"compareArea\" hidden>\n\n<h2>이미지 교체</h2>\n\n<div class=\"compare\">\n\n<div class=\"imageBox\">\n<h3>현재 이미지</h3>\n\n<img\n  id=\"oldImage\"\n  alt=\"현재 이미지\">\n</div>\n\n<div class=\"imageBox\">\n\n<h3>교체할 이미지</h3>\n\n<input\n  type=\"file\"\n  id=\"newFile\"\n  accept=\".webp,image/webp\"\n>\n\n<br><br>\n\n<img\n  id=\"newImage\"\n  alt=\"교체할 이미지\"\n  hidden>\n\n</div>\n\n</div>\n\n<div class=\"actionArea\">\n\n<button\n  id=\"replaceButton\"\n  class=\"replaceButton\"\n  type=\"button\"\n  disabled>\n이미지 교체 실행\n</button>\n\n</div>\n\n</section>\n\n<p>\n\n</p>\n\n</main>\n\n\u003cscript type=\"module\">\n\nimport {createClient} from\n\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\nconst URL_BASE =\n\"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst KEY =\n\"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase =\ncreateClient(URL_BASE,KEY);\n\nconst $ = id =>\ndocument.getElementById(id);\n\nlet objectUrl = null;\nlet selectedFile = null;\nlet loadedDocumentId = null;\nlet loadedPageNumber = null;\nlet replacing = false;\n\n// ======================================\n// 공통 메시지\n// ======================================\n\nfunction message(text){\n  $(\"message\").textContent=text;\n}\n\n// ======================================\n// 로그인 토큰\n// ======================================\n\nasync function getToken(){\n\n  const {data,error} =\n    await supabase.auth.getSession();\n\n  if(\n    error ||\n    !data.session?.access_token\n  ){\n    throw new Error(\n      \"로그인이 필요합니다.\"\n    );\n  }\n\n  return data.session.access_token;\n}\n\n// ======================================\n// 조회용 Edge Function\n// ======================================\n\nasync function invoke(\n  action,\n  payload={}\n){\n\n  const token=await getToken();\n\n  const response=await fetch(\n  URL_BASE+\n  \"/functions/v1/knowledge-ebook-replace\",\n    {\n      method:\"POST\",\n\n      headers:{\n        \"Content-Type\":\"application/json\",\n        \"apikey\":KEY,\n        \"Authorization\":\"Bearer \"+token\n      },\n\n      body:JSON.stringify({\n        action,\n        ...payload\n      })\n    }\n  );\n\n  const result=await response.json();\n\n  if(\n    !response.ok ||\n    result.success!==true\n  ){\n    throw new Error(\n      result.error ||\n      \"서버 요청 실패\"\n    );\n  }\n\n  return result;\n}\n\n// ======================================\n// 교체 버튼 상태\n// ======================================\n\nfunction updateReplaceButton(){\n\n  $(\"replaceButton\").disabled =\n    replacing ||\n    !selectedFile ||\n    loadedDocumentId===null ||\n    loadedPageNumber===null;\n}\n\n// ======================================\n// 신규 이미지 초기화\n// ======================================\n\nfunction resetNewImage(){\n\n  if(objectUrl){\n    URL.revokeObjectURL(objectUrl);\n    objectUrl=null;\n  }\n\n  selectedFile=null;\n\n  $(\"newFile\").value=\"\";\n  $(\"newImage\").removeAttribute(\"src\");\n  $(\"newImage\").hidden=true;\n\n  updateReplaceButton();\n}\n\n// ======================================\n// 기존 이미지 초기화\n// ======================================\n\nfunction resetPreview(){\n\n  loadedDocumentId=null;\n  loadedPageNumber=null;\n\n  $(\"oldImage\").removeAttribute(\"src\");\n\n  $(\"compareArea\").hidden=true;\n\n  resetNewImage();\n}\n\n// ======================================\n// 초기화\n// ======================================\n\nasync function initialize(){\n\n  try{\n\n    const result=await invoke(\"list\");\n\n    for(const book of result.ebooks){\n\n      const option=\n        document.createElement(\"option\");\n\n      option.value=book.document_id;\n\n      const title=\n        book.knowledge_documents?.title ||\n        book.issue_code;\n\n      option.textContent=\n        book.document_id+\" · \"+title;\n\n      $(\"bookSelect\").append(option);\n    }\n\n    $(\"workArea\").hidden=false;\n\n    message(\"최고관리자 인증 완료\");\n\n    const requested = new URLSearchParams(window.location.search).get(\"document_id\");\n    const selector = $(\"bookSelect\");\n    if (requested && [...selector.options].some(option => option.value === requested)) {\n      selector.value = requested;\n      selector.dispatchEvent(new Event(\"change\"));\n    }\n\n  }catch(error){\n\n    message(\n      \"접근 실패: \"+error.message\n    );\n\n  }\n}\n\n// ======================================\n// 전자책 선택\n// ======================================\n\n$(\"bookSelect\").addEventListener(\n\"change\",\nasync()=>{\n\n  $(\"pageSelect\").replaceChildren(\n    new Option(\n      \"페이지를 선택하세요\",\n      \"\"\n    )\n  );\n\n  resetPreview();\n\n  const id=\n    Number($(\"bookSelect\").value);\n\n  if(!id)return;\n\n  try{\n\n    const result=await invoke(\n      \"detail\",\n      {document_id:id}\n    );\n\n    for(\n      let page=1;\n      page<=result.ebook.total_pages;\n      page++\n    ){\n\n      $(\"pageSelect\").add(\n        new Option(\n          \"본문 \"+page+\"쪽\",\n          page\n        )\n      );\n\n    }\n\n    message(\n      \"전자책을 선택했습니다.\"\n    );\n\n  }catch(error){\n\n    message(error.message);\n\n  }\n\n});\n\n// ======================================\n// 페이지 변경\n// ======================================\n\n$(\"pageSelect\").addEventListener(\n\"change\",\n()=>{\n\n  resetPreview();\n\n});\n\n// ======================================\n// 기존 이미지 불러오기\n// ======================================\n\n$(\"loadButton\").addEventListener(\n\"click\",\nasync()=>{\n\n  const id=\n    Number($(\"bookSelect\").value);\n\n  const page=\n    Number($(\"pageSelect\").value);\n\n  if(!id || !page){\n\n    message(\n      \"전자책과 페이지를 선택하세요.\"\n    );\n\n    return;\n  }\n\n  try{\n\n    const result=await invoke(\n      \"preview\",\n      {\n        document_id:id,\n        page_number:page\n      }\n    );\n\n    const img=$(\"oldImage\");\n\n    img.src=result.signed_url;\n\n    loadedDocumentId=id;\n    loadedPageNumber=page;\n\n    $(\"compareArea\").hidden=false;\n\n    resetNewImage();\n\n    message(\n      \"기존 이미지를 불러왔습니다.\"\n    );\n\n  }catch(error){\n\n    message(error.message);\n\n  }\n\n});\n\n// ======================================\n// 신규 이미지 선택\n// ======================================\n\n$(\"newFile\").addEventListener(\n\"change\",\nevent=>{\n\n  if(objectUrl){\n    URL.revokeObjectURL(objectUrl);\n    objectUrl=null;\n  }\n\n  selectedFile=null;\n\n  $(\"newImage\").hidden=true;\n\n  const file=event.target.files[0];\n\n  if(!file){\n    updateReplaceButton();\n    return;\n  }\n\n  if(\n    file.type!==\"image/webp\" ||\n    file.size<=0 ||\n    file.size>10*1024*1024\n  ){\n\n    event.target.value=\"\";\n\n    message(\n      \"10MB 이하 WebP 파일만 선택하세요.\"\n    );\n\n    updateReplaceButton();\n    return;\n  }\n\n  selectedFile=file;\n\n  objectUrl=\n    URL.createObjectURL(file);\n\n  $(\"newImage\").src=objectUrl;\n  $(\"newImage\").hidden=false;\n\n  updateReplaceButton();\n\n  message(\n    \"교체할 이미지가 준비되었습니다.\"\n  );\n\n});\n\n// ======================================\n// 실제 이미지 교체\n// ======================================\n\n$(\"replaceButton\").addEventListener(\n\"click\",\nasync()=>{\n\n  if(replacing)return;\n\n  if(\n    !selectedFile ||\n    loadedDocumentId===null ||\n    loadedPageNumber===null\n  ){\n\n    message(\n      \"전자책, 페이지, 이미지를 선택하세요.\"\n    );\n\n    return;\n  }\n\n  const documentId=loadedDocumentId;\n  const pageNumber=loadedPageNumber;\n  const file=selectedFile;\n\n  const confirmed=confirm(\n    \"선택한 전자책의 \"+\n    pageNumber+\n    \"쪽 이미지를 교체하시겠습니까?\"\n  );\n\n  if(!confirmed)return;\n\n  replacing=true;\n  updateReplaceButton();\n\n  $(\"bookSelect\").disabled=true;\n  $(\"pageSelect\").disabled=true;\n  $(\"loadButton\").disabled=true;\n  $(\"newFile\").disabled=true;\n\n  message(\n    \"이미지를 교체하고 있습니다.\"\n  );\n\n  try{\n\n    const token=await getToken();\n\n    const form=new FormData();\n\n    form.append(\n      \"document_id\",\n      String(documentId)\n    );\n\n    form.append(\n      \"page_number\",\n      String(pageNumber)\n    );\n\n    form.append(\n      \"confirmation\",\n      \"REPLACE\"\n    );\n\n    form.append(\n      \"file\",\n      file\n    );\n\n    const response=await fetch(\n      URL_BASE+\n      \"/functions/v1/knowledge-ebook-replace\",\n      {\n        method:\"POST\",\n\n        headers:{\n          \"apikey\":KEY,\n          \"Authorization\":\"Bearer \"+token\n        },\n\n        body:form\n      }\n    );\n\n    const result=await response.json();\n\n    if(\n      !response.ok ||\n      result.success!==true\n    ){\n\n      throw new Error(\n        result.error ||\n        \"이미지 교체에 실패했습니다.\"\n      );\n\n    }\n\n    message(\n      \"이미지 교체가 완료되었습니다.\\n\"+\n      \"전자책 ID: \"+documentId+\"\\n\"+\n      \"페이지: \"+pageNumber\n    );\n\n    resetPreview();\n\n  }catch(error){\n\n    message(\n      \"교체 실패: \"+error.message\n    );\n\n  }finally{\n\n    replacing=false;\n\n    $(\"bookSelect\").disabled=false;\n    $(\"pageSelect\").disabled=false;\n    $(\"loadButton\").disabled=false;\n    $(\"newFile\").disabled=false;\n\n    updateReplaceButton();\n\n  }\n\n});\n\n// ======================================\n// 페이지 종료\n// ======================================\n\nwindow.addEventListener(\n\"pagehide\",\n()=>{\n\n  if(objectUrl){\n    URL.revokeObjectURL(objectUrl);\n  }\n\n});\n\ninitialize();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "view=admin-ebooks-test": "<!DOCTYPE html>\n<html lang=\"ko\">\n\n<head>\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<title>\n등록 전자책 관리 | 글로벌 AI 허브\n</title>\n\n<style>\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", Arial, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n}\n\n[hidden] {\n  display: none !important;\n}\n\nheader {\n  background: #0754a6;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nheader h1 {\n  margin: 0 0 12px;\n  font-size: 28px;\n}\n\nheader p {\n  line-height: 1.7;\n}\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 30px 15px;\n}\n\nsection {\n  background: white;\n  padding: 25px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.07);\n}\n\nh2 {\n  color: #0754a6;\n}\n\nbutton {\n  padding: 12px 20px;\n  background: #0754a6;\n  color: white;\n  border: none;\n  border-radius: 7px;\n  font-size: 15px;\n  cursor: pointer;\n}\n\nbutton:disabled {\n  opacity: 0.5;\n  cursor: not-allowed;\n}\n\n.message {\n  padding: 15px;\n  background: #eef4fc;\n  border-radius: 8px;\n  line-height: 1.8;\n  white-space: pre-wrap;\n}\n\n.error {\n  color: #b42318;\n}\n\n.success {\n  color: #167347;\n}\n\n.table-wrap {\n  overflow-x: auto;\n}\n\ntable {\n  width: 100%;\n  border-collapse: collapse;\n  margin-top: 20px;\n}\n\nth,\ntd {\n  border: 1px solid #dce6f2;\n  padding: 12px;\n  text-align: left;\n}\n\nth {\n  background: #eef4fc;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 25px;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n\n<h1>📚 등록 전자책 관리</h1>\n\n<p>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</p>\n\n</header>\n\n<main>\n\n<section>\n\n<h2>1. 관리자 인증</h2>\n\n<div\n  id=\"authMessage\"\n  class=\"message\"\n  role=\"status\"\n  aria-live=\"polite\"\n>\n로그인 상태를 확인하고 있습니다.\n</div>\n\n</section>\n\n<section id=\"ebookSection\" hidden>\n\n<h2>2. 등록 전자책 목록</h2>\n\n<p>\nSupabase Edge Function을 통해\n전자책 목록을 조회합니다.\n</p>\n\n<button\n  id=\"refreshButton\"\n  type=\"button\"\n>\n전자책 목록 새로고침\n</button>\n\n<div\n  id=\"listMessage\"\n  class=\"message\"\n  role=\"status\"\n  aria-live=\"polite\"\n  style=\"margin-top:20px;\"\n>\n목록 조회 준비 완료\n</div>\n\n<div class=\"table-wrap\">\n\n<table>\n\n<thead>\n<tr>\n<th>ID</th>\n<th>전자책 제목</th>\n<th>발간번호</th>\n<th>구분</th>\n<th>페이지</th>\n<th>게시 상태</th>\n<th>관리</th>\n</tr>\n</thead>\n\n<tbody id=\"ebookList\"></tbody>\n\n</table>\n\n</div>\n\n</section>\n\n\n\n</main>\n\n<footer>\n\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n// ==========================================\n// 1. Supabase 연결\n// 기존 관리센터와 동일한 설정\n// ==========================================\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\nconst $ = id =>\n  document.getElementById(id);\n\nlet authorized = false;\nlet loading = false;\n\n// ==========================================\n// 2. 메시지 표시\n// ==========================================\n\nfunction showMessage(\n  id,\n  message,\n  isError = false\n) {\n\n  const element = $(id);\n\n  element.textContent = message;\n\n  element.classList.toggle(\n    \"error\",\n    isError\n  );\n\n  element.classList.toggle(\n    \"success\",\n    !isError\n  );\n\n}\n\n// ==========================================\n// 3. 로그인 확인\n// ==========================================\n\nasync function initialize() {\n\n  authorized = false;\n\n  $(\"ebookSection\").hidden = true;\n\n  showMessage(\n    \"authMessage\",\n    \"로그인 상태를 확인하고 있습니다.\"\n  );\n\n  try {\n\n    const {\n      data,\n      error\n    } = await supabase.auth.getUser();\n\n    if (error || !data.user) {\n\n      showMessage(\n        \"authMessage\",\n        \"로그인이 필요합니다. 홈페이지에서 로그인한 후 다시 접속해 주세요.\",\n        true\n      );\n\n      return;\n    }\n\n    // 서버에서 실제 관리자 권한을 검증합니다.\n    // 여기서는 로그인 여부만 확인합니다.\n\n    showMessage(\n      \"authMessage\",\n      \"로그인 확인 완료. 전자책 관리 권한을 검사합니다.\"\n    );\n\n    await loadEbooks();\n\n  } catch (error) {\n\n    showMessage(\n      \"authMessage\",\n      \"인증 오류: \" + error.message,\n      true\n    );\n\n  }\n\n}\n\n// ==========================================\n// 4. Edge Function 호출\n// ==========================================\n\nasync function requestEbookList() {\n\n  const {\n    data: sessionData,\n    error: sessionError\n  } = await supabase.auth.getSession();\n\n  if (\n    sessionError ||\n    !sessionData.session?.access_token\n  ) {\n\n    throw new Error(\n      \"로그인 세션이 없습니다.\"\n    );\n\n  }\n\n  const accessToken =\n    sessionData.session.access_token;\n\n  const response = await fetch(\n    SUPABASE_URL +\n    \"/functions/v1/knowledge-ebook-admin\",\n    {\n      method: \"POST\",\n\n      headers: {\n        \"Content-Type\": \"application/json\",\n        \"apikey\": SUPABASE_KEY,\n        \"Authorization\":\n          \"Bearer \" + accessToken\n      },\n\n      body: JSON.stringify({\n        action: \"list\"\n      })\n    }\n  );\n\n  let result;\n\n  try {\n    result = await response.json();\n  } catch {\n    throw new Error(\n      \"서버 응답을 해석할 수 없습니다. HTTP \" +\n      response.status\n    );\n  }\n\n  if (\n    !response.ok ||\n    result.success !== true\n  ) {\n\n    const error = new Error(\n      result.error ||\n      \"전자책 목록 조회에 실패했습니다.\"\n    );\n\n    error.status = response.status;\n\n    throw error;\n  }\n\n  if (!Array.isArray(result.ebooks)) {\n    throw new Error(\n      \"전자책 목록 응답 형식이 올바르지 않습니다.\"\n    );\n  }\n\n  return result.ebooks;\n\n}\n\n// ==========================================\n// 5. 전자책 목록 조회\n// ==========================================\n\nasync function loadEbooks() {\n\n  if (loading) {\n    return;\n  }\n\n  loading = true;\n\n  $(\"refreshButton\").disabled = true;\n\n  showMessage(\n    \"listMessage\",\n    \"전자책 목록을 불러오는 중입니다.\"\n  );\n\n  try {\n\n    const ebooks =\n      await requestEbookList();\n\n    authorized = true;\n\n    $(\"ebookSection\").hidden = false;\n\n    showMessage(\n      \"authMessage\",\n      \"전자책 관리 권한 인증이 완료되었습니다.\"\n    );\n\n    renderEbooks(ebooks);\n\n    showMessage(\n      \"listMessage\",\n      \"전자책 \" +\n      ebooks.length +\n      \"권을 정상적으로 조회했습니다.\"\n    );\n\n  } catch (error) {\n\n    authorized = false;\n\n    $(\"ebookList\").replaceChildren();\n\n    if (error.status === 403) {\n\n      $(\"ebookSection\").hidden = true;\n\n      showMessage(\n        \"authMessage\",\n        \"전자책 관리 권한이 없습니다.\",\n        true\n      );\n\n    } else if (error.status === 401) {\n\n      $(\"ebookSection\").hidden = true;\n\n      showMessage(\n        \"authMessage\",\n        \"로그인 인증이 만료되었거나 유효하지 않습니다.\",\n        true\n      );\n\n    } else {\n\n      $(\"ebookSection\").hidden = true;\n\n      showMessage(\n        \"authMessage\",\n        \"전자책 목록 조회 실패: \" +\n        error.message,\n        true\n      );\n\n    }\n\n  } finally {\n\n    loading = false;\n\n    $(\"refreshButton\").disabled = false;\n\n  }\n\n}\n\n// ==========================================\n// 6. 목록 표시\n// ==========================================\n\nfunction renderEbooks(ebooks) {\n\n  const tbody = $(\"ebookList\");\n\n  tbody.replaceChildren();\n\n  if (!ebooks.length) {\n\n    const tr = document.createElement(\"tr\");\n\n    const td = document.createElement(\"td\");\n\n    td.colSpan = 7;\n\n    td.textContent =\n      \"등록된 전자책이 없습니다.\";\n\n    tr.appendChild(td);\n\n    tbody.appendChild(tr);\n\n    return;\n  }\n\n  ebooks.forEach(book => {\n\n    const tr = document.createElement(\"tr\");\n\n    const values = [\n      book.id,\n      book.title,\n      book.issue_code || \"-\",\n      book.ebook_edition || \"-\",\n      book.total_pages ?? \"-\",\n      book.is_published\n        ? \"게시\"\n        : \"비공개\"\n    ];\n\n    values.forEach(value => {\n\n      const td =\n        document.createElement(\"td\");\n\n      td.textContent =\n        String(value ?? \"\");\n\n      tr.appendChild(td);\n\n    });\n\n    const actionCell = document.createElement(\"td\");\n    const documentId = Number(book.document_id ?? book.id);\n    if (Number.isSafeInteger(documentId) && documentId > 0) {\n      const edit = document.createElement(\"a\");\n      edit.href = \"admin-center.html?view=admin-ebooks-replace&document_id=\" + documentId;\n      edit.textContent = \"페이지 이미지 교체\";\n      actionCell.appendChild(edit);\n      if (![9, 10, 11, 12].includes(documentId)) {\n        const maintenance = document.createElement(\"a\");\n        maintenance.href = \"admin-center.html?view=admin-ebook-pages&document_id=\" + documentId;\n        maintenance.textContent = \"본문 페이지 유지관리\";\n        actionCell.append(document.createElement(\"br\"), maintenance);\n      }\n    }\n    tr.appendChild(actionCell);\n    tbody.appendChild(tr);\n\n  });\n\n}\n\n// ==========================================\n// 7. 새로고침\n// ==========================================\n\n$(\"refreshButton\").addEventListener(\n  \"click\",\n  async () => {\n\n    if (!authorized) {\n      return;\n    }\n\n    await loadEbooks();\n\n  }\n);\n\n// ==========================================\n// 8. 최초 실행\n// ==========================================\n\ninitialize();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "view=admin-ebooks-create-test": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<title>전자책 신규 등록 시험 | 글로벌 AI 허브</title>\n\n<style>\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", Arial, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n}\n\n[hidden] { display: none !important; }\n\nheader {\n  background: #0754a6;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n}\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 25px 15px;\n}\n\nsection {\n  background: white;\n  padding: 25px;\n  margin-bottom: 24px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.07);\n}\n\nh2 { color: #0754a6; }\n\nlabel {\n  display: block;\n  margin: 18px 0 7px;\n  font-weight: bold;\n}\n\ninput, select, textarea {\n  width: 100%;\n  padding: 12px;\n  border: 1px solid #c5d5e8;\n  border-radius: 7px;\n  font: inherit;\n}\n\ntextarea {\n  min-height: 170px;\n  font-family: Consolas, monospace;\n  line-height: 1.6;\n}\n\nbutton {\n  padding: 12px 20px;\n  background: #0754a6;\n  color: white;\n  border: none;\n  border-radius: 7px;\n  cursor: pointer;\n  margin-top: 12px;\n}\n\nbutton:disabled {\n  opacity: .5;\n  cursor: not-allowed;\n}\n\n.message {\n  padding: 15px;\n  background: #eef4fc;\n  border-radius: 8px;\n  margin-top: 15px;\n  line-height: 1.8;\n  white-space: pre-wrap;\n}\n\n.error { color: #b42318; }\n.success { color: #167347; }\n\n.notice {\n  padding: 15px;\n  background: #fff8e8;\n  border-left: 4px solid #d9a441;\n  line-height: 1.8;\n}\n\n.table-wrap { overflow-x: auto; }\n\ntable {\n  width: 100%;\n  border-collapse: collapse;\n  margin-top: 20px;\n}\n\nth, td {\n  border: 1px solid #dce6f2;\n  padding: 12px;\n  text-align: left;\n}\n\nth { background: #eef4fc; }\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 25px;\n}\n\na { color: #0754a6; }\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n<h1>📚 디지털 도서관 전자책 등록 시험</h1>\n<p>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</p>\n</header>\n\n<main>\n\n<section>\n<h2>1. 관리자 인증</h2>\n<div id=\"authMessage\" class=\"message\" role=\"status\" aria-live=\"polite\">\n로그인 상태를 확인하고 있습니다.\n</div>\n</section>\n\n<section id=\"ebookSection\" hidden>\n\n<h2>2. 등록 전자책 목록</h2>\n\n<button id=\"refreshButton\" type=\"button\">\n전자책 목록 새로고침\n</button>\n\n<div id=\"listMessage\" class=\"message\" role=\"status\" aria-live=\"polite\">\n목록 조회 준비 완료\n</div>\n\n<div class=\"table-wrap\">\n<table>\n<thead>\n<tr>\n<th>ID</th>\n<th>전자책 제목</th>\n<th>발간번호</th>\n<th>구분</th>\n<th>페이지</th>\n<th>게시 상태</th>\n</tr>\n</thead>\n<tbody id=\"ebookList\"></tbody>\n</table>\n</div>\n\n</section>\n\n<section id=\"createSection\" hidden>\n\n<h2>3. 신규 전자책 비공개 등록</h2>\n\n<div class=\"notice\">\n이 단계에서는 전자책 기본 정보만 등록합니다.\n이미지는 업로드하지 않으며,\n신규 전자책은 비공개 상태로 저장됩니다.\n</div>\n\n<form id=\"createForm\">\n\n<label for=\"title\">전자책 제목</label>\n<input\n  id=\"title\"\n  type=\"text\"\n  maxlength=\"300\"\n  required\n  value=\"디지털 도서관 관리센터 등록 시험\"\n>\n\n<label for=\"issueCode\">발간번호</label>\n<input\n  id=\"issueCode\"\n  type=\"text\"\n  maxlength=\"64\"\n  pattern=\"[a-z0-9][a-z0-9-]*\"\n  required\n  value=\"issue-test-02\"\n>\n\n<label for=\"edition\">전자책 구분</label>\n<select id=\"edition\" required>\n<option value=\"total\">Total - 관리자 전용</option>\n<option value=\"intro\">Intro - 공개용</option>\n</select>\n\n<label for=\"totalPages\">전체 페이지 수</label>\n<input\n  id=\"totalPages\"\n  type=\"number\"\n  min=\"1\"\n  max=\"10000\"\n  step=\"1\"\n  required\n  value=\"3\"\n>\n\n<label for=\"contents\">목차 JSON</label>\n<textarea id=\"contents\" required>[\n  [1, \"앞표지\", 1],\n  [1, \"등록 기능 시험\", 2],\n  [1, \"시험 완료\", 3]\n]</textarea>\n\n<p>게시 상태: <strong>비공개</strong></p>\n\n<button id=\"createButton\" type=\"submit\">\n신규 전자책 비공개 등록\n</button>\n\n</form>\n\n<div id=\"createMessage\" class=\"message\" role=\"status\" aria-live=\"polite\">\n등록 준비 완료\n</div>\n\n</section>\n\n<section>\n<h2>4. 시험 안내</h2>\n<p>\n관리자 인증, 목록 조회, 신규 전자책 비공개 등록을 시험합니다.\n</p>\n<p>\n기존 전자책 수정·삭제·게시 변경 및 이미지 업로드는 수행하지 않습니다.\n</p>\n<p>\n<a href=\"admin-center.html?view=admin-ebooks-test\">기존 목록 조회 시험 페이지</a>\n</p>\n</section>\n\n</main>\n\n<footer>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\nconst $ = id => document.getElementById(id);\n\nlet authorized = false;\nlet loading = false;\nlet creating = false;\nlet registrationComplete = false;\nlet registrationNeedsReview = false;\n\n// ==========================================\n// 메시지\n// ==========================================\n\nfunction showMessage(id, message, isError = false) {\n  const el = $(id);\n  el.textContent = message;\n  el.classList.toggle(\"error\", isError);\n  el.classList.toggle(\"success\", !isError);\n}\n\n// ==========================================\n// Edge Function 호출\n// ==========================================\n\nasync function callAdmin(payload) {\n\n  const { data, error } =\n    await supabase.auth.getSession();\n\n  if (error || !data.session?.access_token) {\n    throw new Error(\"로그인 세션이 없습니다.\");\n  }\n\n  let response;\n\n  try {\n    response = await fetch(\n      SUPABASE_URL +\n      \"/functions/v1/knowledge-ebook-admin\",\n      {\n        method: \"POST\",\n        headers: {\n          \"Content-Type\": \"application/json\",\n          \"apikey\": SUPABASE_KEY,\n          \"Authorization\":\n            \"Bearer \" + data.session.access_token\n        },\n        body: JSON.stringify(payload)\n      }\n    );\n  } catch {\n    throw new Error(\n      \"서버 연결에 실패했습니다. 등록 여부를 확인한 후 다시 시도하세요.\"\n    );\n  }\n\n  let result;\n\n  try {\n    result = await response.json();\n  } catch {\n    throw new Error(\n      \"서버 응답을 확인할 수 없습니다. HTTP \" +\n      response.status\n    );\n  }\n\n  if (!response.ok || result.success !== true) {\n    const err = new Error(\n      result.error || \"요청 처리에 실패했습니다.\"\n    );\n    err.status = response.status;\n    throw err;\n  }\n\n  return result;\n}\n\n// ==========================================\n// 로그인 확인\n// ==========================================\n\nasync function initialize() {\n\n  $(\"ebookSection\").hidden = true;\n  $(\"createSection\").hidden = true;\n\n  const { data, error } =\n    await supabase.auth.getUser();\n\n  if (error || !data.user) {\n    showMessage(\n      \"authMessage\",\n      \"로그인이 필요합니다.\",\n      true\n    );\n    return;\n  }\n\n  await loadEbooks();\n}\n\n// ==========================================\n// 목록 조회\n// ==========================================\n\nasync function loadEbooks() {\n\n  if (loading) return;\n\n  loading = true;\n  $(\"refreshButton\").disabled = true;\n\n  try {\n\n    const result = await callAdmin({\n      action: \"list\"\n    });\n\n    if (!Array.isArray(result.ebooks)) {\n      throw new Error(\"목록 응답 형식이 올바르지 않습니다.\");\n    }\n\n    authorized = true;\n\n    $(\"ebookSection\").hidden = false;\n    $(\"createSection\").hidden = false;\n\n    showMessage(\n      \"authMessage\",\n      \"전자책 관리 권한 인증이 완료되었습니다.\"\n    );\n\n    renderEbooks(result.ebooks);\n\n    showMessage(\n      \"listMessage\",\n      \"전자책 \" + result.ebooks.length +\n      \"권을 정상적으로 조회했습니다.\"\n    );\n\n    // 등록 결과가 불확실했던 경우 목록에서 확인\n    if (registrationNeedsReview) {\n      const code = $(\"issueCode\").value.trim();\n\n      const found = result.ebooks.find(\n        book => book.issue_code === code\n      );\n\n      if (found) {\n        registrationComplete = true;\n        registrationNeedsReview = false;\n        $(\"createButton\").disabled = true;\n        $(\"createButton\").textContent = \"등록 확인 완료\";\n\n        showMessage(\n          \"createMessage\",\n          \"목록에서 발간번호 \" + code +\n          \"의 등록을 확인했습니다.\\n문서 ID: \" +\n          found.id\n        );\n      } else {\n        showMessage(\n          \"createMessage\",\n          \"목록에서 해당 발간번호를 찾지 못했습니다.\\n\" +\n          \"등록 결과가 불확실하므로 서버 상태를 확인하기 전에는 재등록하지 마세요.\",\n          true\n        );\n      }\n    }\n\n  } catch (error) {\n\n    authorized = false;\n    $(\"ebookSection\").hidden = true;\n    $(\"createSection\").hidden = true;\n\n    showMessage(\n      \"authMessage\",\n      \"조회 실패: \" + error.message,\n      true\n    );\n\n  } finally {\n    loading = false;\n    $(\"refreshButton\").disabled = false;\n  }\n}\n\n// ==========================================\n// 목록 렌더링\n// ==========================================\n\nfunction renderEbooks(ebooks) {\n\n  const tbody = $(\"ebookList\");\n  tbody.replaceChildren();\n\n  ebooks.forEach(book => {\n\n    const tr = document.createElement(\"tr\");\n\n    [\n      book.id,\n      book.title,\n      book.issue_code || \"-\",\n      book.ebook_edition || \"-\",\n      book.total_pages ?? \"-\",\n      book.is_published ? \"게시\" : \"비공개\"\n    ].forEach(value => {\n\n      const td = document.createElement(\"td\");\n      td.textContent = String(value ?? \"\");\n      tr.appendChild(td);\n\n    });\n\n    tbody.appendChild(tr);\n  });\n\n  if (!ebooks.length) {\n    const tr = document.createElement(\"tr\");\n    const td = document.createElement(\"td\");\n    td.colSpan = 6;\n    td.textContent = \"등록된 전자책이 없습니다.\";\n    tr.appendChild(td);\n    tbody.appendChild(tr);\n  }\n}\n\n// ==========================================\n// 신규 등록\n// ==========================================\n\nasync function createEbook(event) {\n\n  event.preventDefault();\n\n  if (\n    !authorized ||\n    creating ||\n    registrationComplete ||\n    registrationNeedsReview\n  ) return;\n\n  const title = $(\"title\").value.trim();\n  const issueCode = $(\"issueCode\").value.trim();\n  const edition = $(\"edition\").value;\n  const totalPages = Number($(\"totalPages\").value);\n\n  if (!title || title.length > 300) {\n    showMessage(\"createMessage\", \"제목을 확인하세요.\", true);\n    return;\n  }\n\n  if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(issueCode)) {\n    showMessage(\"createMessage\", \"발간번호 형식 오류\", true);\n    return;\n  }\n\n  if (![\"intro\", \"total\"].includes(edition)) {\n    showMessage(\"createMessage\", \"전자책 구분 오류\", true);\n    return;\n  }\n\n  if (\n    !Number.isSafeInteger(totalPages) ||\n    totalPages < 1 ||\n    totalPages > 10000\n  ) {\n    showMessage(\"createMessage\", \"페이지 수 오류\", true);\n    return;\n  }\n\n  let contents;\n\n  try {\n    contents = JSON.parse($(\"contents\").value);\n  } catch {\n    showMessage(\"createMessage\", \"목차 JSON 문법 오류\", true);\n    return;\n  }\n\n  if (\n    !Array.isArray(contents) ||\n    !contents.every(entry =>\n      Array.isArray(entry) &&\n      entry.length === 3 &&\n      Number.isInteger(entry[0]) &&\n      entry[0] >= 1 &&\n      typeof entry[1] === \"string\" &&\n      ent
