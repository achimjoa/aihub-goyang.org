bled {\n  opacity: .5;\n  cursor: not-allowed;\n}\n\nlabel {\n  display: block;\n  font-weight: bold;\n  margin: 15px 0 6px;\n}\n\ninput,\ntextarea,\nselect {\n  width: 100%;\n  padding: 12px;\n  border: 1px solid #cbd5e1;\n  border-radius: 7px;\n  font: inherit;\n}\n\ntextarea {\n  min-height: 100px;\n}\n\n#message {\n  white-space: pre-line;\n  margin: 15px 0;\n}\n\n[hidden] {\n  display: none !important;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 25px;\n}\n\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n\n<h1>홈페이지 배너 관리</h1>\n\n<p>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</p>\n\n<p>\n\n&nbsp; | &nbsp;\n<a href=\"index.html\">홈페이지</a>\n</p>\n\n</header>\n\n<main>\n\n<p id=\"message\" role=\"status\" aria-live=\"polite\">\n관리자 권한을 확인하고 있습니다.\n</p>\n\n<div id=\"adminArea\" hidden>\n\n<section class=\"panel\">\n\n<h2>배너 운영 현황</h2>\n\n<div class=\"summary\">\n\n<div class=\"summary-card\">\n중앙 홍보\n<strong id=\"centerCount\">0 / 10</strong>\n</div>\n\n<div class=\"summary-card\">\n좌측 광고\n<strong id=\"leftCount\">0 / 10</strong>\n</div>\n\n<div class=\"summary-card\">\n우측 광고\n<strong id=\"rightCount\">0 / 10</strong>\n</div>\n\n</div>\n\n</section>\n\n<section class=\"panel\">\n\n<h2>배너 위치별 관리</h2>\n\n<p>\n배너를 선택하면 등록·수정할 수 있습니다.\n비공개 배너는 홈페이지에 표시되지 않습니다.\n</p>\n\n<div id=\"bannerList\" class=\"banner-list\"></div>\n\n</section>\n\n<section id=\"editPanel\" class=\"panel\" hidden>\n\n<h2 id=\"editHeading\">배너 수정</h2>\n\n<form id=\"bannerForm\">\n\n<input type=\"hidden\" id=\"bannerId\">\n\n<label for=\"bannerTitle\">배너 제목</label>\n<input id=\"bannerTitle\" maxlength=\"200\">\n\n<label for=\"bannerDescription\">설명</label>\n<textarea id=\"bannerDescription\"></textarea>\n\n<label for=\"bannerImage\">썸네일 이미지 URL</label>\n<input\n  id=\"bannerImage\"\n  type=\"url\"\n  placeholder=\"https://example.com/banner.jpg\">\n\n<label for=\"bannerLink\">연결 URL</label>\n<input\n  id=\"bannerLink\"\n  type=\"text\"\n  placeholder=\"https://example.com 또는 board.html?post=15\">\n\n<label for=\"bannerActive\">공개 상태</label>\n<select id=\"bannerActive\">\n<option value=\"false\">비공개</option>\n<option value=\"true\">공개</option>\n</select>\n\n<p>\n공개 배너는 이미지 URL과 연결 URL이 모두 필요합니다.\n</p>\n\n<button type=\"submit\" id=\"saveButton\" class=\"primary\">\n저장\n</button>\n\n<button type=\"button\" id=\"clearButton\" class=\"danger\">\n배너 내용 초기화\n</button>\n\n<button type=\"button\" id=\"cancelButton\" class=\"secondary\">\n취소\n</button>\n\n</form>\n\n</section>\n\n</div>\n\n</main>\n\n<footer>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\nconst supabase = createClient(\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\",\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\"\n);\n\nconst $ = id => document.getElementById(id);\n\nlet banners = [];\nlet selectedBanner = null;\n\nfunction showMessage(text, error = false) {\n  $(\"message\").textContent = text;\n  $(\"message\").style.color =\n    error ? \"#b91c1c\" : \"#0754a6\";\n}\n\nfunction checkUrl(value, allowRelative = false) {\n\n  if (!value) return false;\n\n  try {\n    const url = new URL(value, location.href);\n\n    if (![\"http:\", \"https:\"].includes(url.protocol)) {\n      return false;\n    }\n\n    if (!allowRelative && !/^https?:\\/\\//i.test(value)) {\n      return false;\n    }\n\n    if (allowRelative && !/^https?:\\/\\//i.test(value)) {\n\n      if (\n        value.startsWith(\"//\") ||\n        value.startsWith(\"/\") ||\n        value.includes(\"\\\\\")\n      ) {\n        return false;\n      }\n\n      const relative = value.split(/[?#]/)[0];\n\n      if (\n        relative.split(\"/\").includes(\"..\") ||\n        !/^[a-zA-Z0-9_./-]+$/.test(relative)\n      ) {\n        return false;\n      }\n\n    }\n\n    return true;\n\n  } catch {\n    return false;\n  }\n}\n\nasync function initialize() {\n\n  try {\n\n    const { data: userData, error: userError } =\n      await supabase.auth.getUser();\n\n    if (userError || !userData.user) {\n      showMessage(\n        \"로그인이 필요합니다. 로그인 후 다시 접속해 주세요.\",\n        true\n      );\n      return;\n    }\n\n    const { data: isAdmin, error: adminError } =\n      await supabase.rpc(\"is_resource_admin\");\n\n    if (adminError) throw adminError;\n\n    if (isAdmin !== true) {\n      showMessage(\"배너 관리 권한이 없습니다.\", true);\n      return;\n    }\n\n    $(\"adminArea\").hidden = false;\n\n    await loadBanners();\n\n  } catch (error) {\n\n    console.error(error);\n    showMessage(\n      \"관리자 화면 초기화 오류: \" + error.message,\n      true\n    );\n\n  }\n}\n\nasync function loadBanners() {\n\n  const { data, error } =\n    await supabase\n      .from(\"homepage_banners\")\n      .select(\"*\")\n      .order(\"slot_number\", { ascending: true });\n\n  if (error) {\n    showMessage(\"배너 조회 오류: \" + error.message, true);\n    return;\n  }\n\n  banners = data || [];\n\n  renderBanners();\n\n  showMessage(\"배너 정보를 불러왔습니다.\");\n}\n\nfunction renderBanners() {\n\n  const list = $(\"bannerList\");\n  list.replaceChildren();\n\n  const positions = [\n    [\"center\", \"중앙 홍보\"],\n    [\"left\", \"좌측 광고\"],\n    [\"right\", \"우측 광고\"]\n  ];\n\n  for (const [position, label] of positions) {\n\n    const items = banners\n      .filter(item => item.position === position)\n      .sort((a, b) => a.slot_number - b.slot_number);\n\n    const activeCount =\n      items.filter(item => item.is_active).length;\n\n    $(position + \"Count\").textContent =\n      activeCount + \" / 10\";\n\n    for (const banner of items) {\n\n      const card = document.createElement(\"article\");\n      card.className = \"banner-card\";\n\n      const heading = document.createElement(\"h3\");\n      heading.textContent =\n        label + \" \" + banner.slot_number + \"번\";\n\n      const status = document.createElement(\"p\");\n      status.className =\n        \"status \" + (banner.is_active ? \"active\" : \"inactive\");\n\n      status.textContent =\n        banner.is_active ? \"● 공개\" : \"● 비공개\";\n\n      card.append(heading, status);\n\n      if (banner.image_url && checkUrl(banner.image_url)) {\n\n        const img = document.createElement(\"img\");\n        img.src = banner.image_url;\n        img.alt = banner.title || \"배너 이미지\";\n        img.loading = \"lazy\";\n\n        card.appendChild(img);\n      }\n\n      const title = document.createElement(\"p\");\n      title.textContent = banner.title || \"미등록 배너\";\n\n      card.appendChild(title);\n\n      const editButton = document.createElement(\"button\");\n      editButton.className = \"primary\";\n      editButton.textContent = \"관리\";\n\n      editButton.addEventListener(\"click\", () => {\n        openEditor(banner);\n      });\n\n      card.appendChild(editButton);\n      list.appendChild(card);\n    }\n  }\n}\n\nfunction openEditor(banner) {\n\n  selectedBanner = banner;\n\n  $(\"bannerId\").value = banner.id;\n  $(\"bannerTitle\").value = banner.title || \"\";\n  $(\"bannerDescription\").value =\n    banner.description || \"\";\n  $(\"bannerImage\").value = banner.image_url || \"\";\n  $(\"bannerLink\").value = banner.link_url || \"\";\n  $(\"bannerActive\").value = String(banner.is_active);\n\n  $(\"editHeading\").textContent =\n    banner.position.toUpperCase() +\n    \" \" + banner.slot_number + \"번 배너 관리\";\n\n  $(\"editPanel\").hidden = false;\n\n  $(\"editPanel\").scrollIntoView({\n    behavior: \"smooth\",\n    block: \"start\"\n  });\n}\n\n$(\"bannerForm\").addEventListener(\"submit\", async event => {\n\n  event.preventDefault();\n\n  if (!selectedBanner) return;\n\n  const title = $(\"bannerTitle\").value.trim();\n  const description =\n    $(\"bannerDescription\").value.trim();\n  const imageUrl = $(\"bannerImage\").value.trim();\n  const linkUrl = $(\"bannerLink\").value.trim();\n  const isActive = $(\"bannerActive\").value === \"true\";\n\n  if (imageUrl && !checkUrl(imageUrl)) {\n    showMessage(\"올바른 이미지 URL을 입력하세요.\", true);\n    return;\n  }\n\n  if (linkUrl && !checkUrl(linkUrl, true)) {\n    showMessage(\"올바른 연결 URL을 입력하세요.\", true);\n    return;\n  }\n\n  if (isActive && (!title || !imageUrl || !linkUrl)) {\n    showMessage(\n      \"공개 배너는 제목·이미지·연결 URL이 필요합니다.\",\n      true\n    );\n    return;\n  }\n\n  $(\"saveButton\").disabled = true;\n\n  try {\n\n    const { error } =\n      await supabase\n        .from(\"homepage_banners\")\n        .update({\n          title: title || null,\n          description: description || null,\n          image_url: imageUrl || null,\n          link_url: linkUrl || null,\n          is_active: isActive,\n          updated_at: new Date().toISOString()\n        })\n        .eq(\"id\", selectedBanner.id);\n\n    if (error) throw error;\n\n    $(\"editPanel\").hidden = true;\n    selectedBanner = null;\n\n    await loadBanners();\n    showMessage(\"배너가 저장되었습니다.\");\n\n  } catch (error) {\n\n    showMessage(\"저장 오류: \" + error.message, true);\n\n  } finally {\n\n    $(\"saveButton\").disabled = false;\n\n  }\n});\n\n$(\"clearButton\").addEventListener(\"click\", async () => {\n\n  if (!selectedBanner) return;\n\n  if (!confirm(\"이 배너의 등록 내용을 초기화하시겠습니까?\")) {\n    return;\n  }\n\n  $(\"clearButton\").disabled = true;\n\n  try {\n\n    const { error } =\n      await supabase\n        .from(\"homepage_banners\")\n        .update({\n          title: null,\n          description: null,\n          image_url: null,\n          link_url: null,\n          is_active: false,\n          updated_at: new Date().toISOString()\n        })\n        .eq(\"id\", selectedBanner.id);\n\n    if (error) throw error;\n\n    $(\"editPanel\").hidden = true;\n    selectedBanner = null;\n\n    await loadBanners();\n    showMessage(\"배너 내용이 초기화되었습니다.\");\n\n  } catch (error) {\n\n    showMessage(\"초기화 오류: \" + error.message, true);\n\n  } finally {\n\n    $(\"clearButton\").disabled = false;\n\n  }\n});\n\n$(\"cancelButton\").addEventListener(\"click\", () => {\n  $(\"editPanel\").hidden = true;\n  selectedBanner = null;\n});\n\ninitialize();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "view=admin-accounts": "<!DOCTYPE html>\n<html lang=\"ko\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\n      content=\"width=device-width, initial-scale=1.0\">\n\n<title>입금 계좌 관리 | 글로벌 AI 허브</title>\n\n<style>\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", Arial, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\nheader {\n  background: #0754a6;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nheader h1 {\n  margin: 0 0 12px;\n}\n\n.home-return {\n  margin-top: 25px;\n}\n\n.home-return a {\n  display: inline-block;\n  padding: 10px 20px;\n  margin: 5px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\nmain {\n  max-width: 1100px;\n  margin: 35px auto;\n  padding: 0 15px;\n}\n\n.account-card {\n  background: white;\n  padding: 30px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.08);\n}\n\n.account-card h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.form-group {\n  margin-bottom: 18px;\n}\n\n.form-group label {\n  display: block;\n  margin-bottom: 7px;\n  font-weight: bold;\n}\n\n.form-group input {\n  width: 100%;\n  padding: 12px;\n  border: 1px solid #cbd8e6;\n  border-radius: 6px;\n  font-size: 16px;\n}\n\n.save-button {\n  padding: 12px 30px;\n  background: #0754a6;\n  color: white;\n  border: none;\n  border-radius: 7px;\n  font-size: 16px;\n  font-weight: bold;\n  cursor: pointer;\n}\n\n.save-button:hover {\n  background: #003b79;\n}\n\n.save-button:disabled {\n  opacity: 0.5;\n  cursor: not-allowed;\n}\n\n#message {\n  padding: 15px;\n  margin-bottom: 25px;\n  background: #eaf4ff;\n  border-radius: 8px;\n  white-space: pre-line;\n}\n\nfooter {\n  margin-top: 40px;\n  padding: 30px;\n  background: #10315e;\n  color: white;\n  text-align: center;\n}\n\n[hidden] {\n  display: none !important;\n}\n\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n\n  <h1>입금 계좌 관리</h1>\n\n  <p>\n    경기도 글로벌 AI 허브 유치<br>\n    고양특례시 범시민추진위원회\n  </p>\n\n  <div class=\"home-return\">\n\n    \n\n    <a href=\"index.html\">\n      홈페이지\n    </a>\n\n  </div>\n\n</header>\n\n<main>\n\n<p id=\"message\" role=\"status\" aria-live=\"polite\">\n  관리자 권한을 확인하고 있습니다.\n</p>\n\n<div id=\"accountArea\" hidden>\n\n  \u003c!-- 후원회원 계좌 -->\n\n  <section class=\"account-card\">\n\n    <h2>① 후원회원 참여회비 계좌</h2>\n\n    <form id=\"membershipForm\">\n\n      <div class=\"form-group\">\n        <label for=\"membershipBank\">은행명</label>\n        <input\n          id=\"membershipBank\"\n          type=\"text\"\n          maxlength=\"100\"\n          required>\n      </div>\n\n      <div class=\"form-group\">\n        <label for=\"membershipNumber\">계좌번호</label>\n        <input\n          id=\"membershipNumber\"\n          type=\"text\"\n          maxlength=\"100\"\n          required>\n      </div>\n\n      <div class=\"form-group\">\n        <label for=\"membershipHolder\">예금주</label>\n        <input\n          id=\"membershipHolder\"\n          type=\"text\"\n          maxlength=\"100\"\n          required>\n      </div>\n\n      <button class=\"save-button\" type=\"submit\">\n        후원회원 계좌 저장\n      </button>\n\n    </form>\n\n  </section>\n\n  \u003c!-- 홍보현수막 계좌 -->\n\n  <section class=\"account-card\">\n\n    <h2>② 홍보현수막 게시비용 계좌</h2>\n\n    <form id=\"bannerForm\">\n\n      <div class=\"form-group\">\n        <label for=\"bannerBank\">은행명</label>\n        <input\n          id=\"bannerBank\"\n          type=\"text\"\n          maxlength=\"100\"\n          required>\n      </div>\n\n      <div class=\"form-group\">\n        <label for=\"bannerNumber\">계좌번호</label>\n        <input\n          id=\"bannerNumber\"\n          type=\"text\"\n          maxlength=\"100\"\n          required>\n      </div>\n\n      <div class=\"form-group\">\n        <label for=\"bannerHolder\">예금주</label>\n        <input\n          id=\"bannerHolder\"\n          type=\"text\"\n          maxlength=\"100\"\n          required>\n      </div>\n\n      <button class=\"save-button\" type=\"submit\">\n        현수막 계좌 저장\n      </button>\n\n    </form>\n\n  </section>\n\n</div>\n\n</main>\n\n<footer>\n  경기도 글로벌 AI 허브 유치<br>\n  고양특례시 범시민추진위원회\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\nconst message =\n  document.getElementById(\"message\");\n\nconst accountArea =\n  document.getElementById(\"accountArea\");\n\nlet isSaving = false;\n\nfunction showMessage(text, isError = false) {\n\n  message.textContent = text;\n\n  message.style.color =\n    isError ? \"#b91c1c\" : \"#0754a6\";\n\n}\n\n/* 관리자 권한 확인 */\n\nasync function checkAdmin() {\n\n  const { data: userData, error: userError } =\n    await supabase.auth.getUser();\n\n  if (userError || !userData.user) {\n\n    showMessage(\n      \"로그인이 필요합니다.\",\n      true\n    );\n\n    return false;\n  }\n\n  const { data: isAdmin, error } =\n    await supabase.rpc(\"is_admin\");\n\n  if (error || isAdmin !== true) {\n\n    showMessage(\n      \"관리자 권한이 없습니다.\",\n      true\n    );\n\n    return false;\n  }\n\n  return true;\n}\n\n/* 계좌 조회 */\n\nasync function loadAccounts() {\n\n  const { data, error } =\n    await supabase\n      .from(\"payment_accounts\")\n      .select(\n        \"account_type, bank_name, account_number, account_holder\"\n      );\n\n  if (error) {\n\n    showMessage(\n      \"계좌 조회 오류: \" + error.message,\n      true\n    );\n\n    return;\n  }\n\n  for (const account of data || []) {\n\n    const prefix =\n      account.account_type === \"membership\"\n        ? \"membership\"\n        : account.account_type === \"banner\"\n          ? \"banner\"\n          : null;\n\n    if (!prefix) continue;\n\n    document.getElementById(prefix + \"Bank\").value =\n      account.bank_name || \"\";\n\n    document.getElementById(prefix + \"Number\").value =\n      account.account_number || \"\";\n\n    document.getElementById(prefix + \"Holder\").value =\n      account.account_holder || \"\";\n\n  }\n\n  accountArea.hidden = false;\n\n  showMessage(\n    \"계좌 정보를 불러왔습니다.\"\n  );\n\n}\n\n/* 계좌 저장 */\n\nasync function saveAccount(type, prefix) {\n\n  if (isSaving) return;\n\n  const bank =\n    document.getElementById(prefix + \"Bank\")\n      .value.trim();\n\n  const number =\n    document.getElementById(prefix + \"Number\")\n      .value.trim();\n\n  const holder =\n    document.getElementById(prefix + \"Holder\")\n      .value.trim();\n\n  if (!bank || !number || !holder) {\n\n    showMessage(\n      \"은행명, 계좌번호, 예금주를 모두 입력해 주세요.\",\n      true\n    );\n\n    return;\n  }\n\n  isSaving = true;\n\n  const buttons =\n    accountArea.querySelectorAll(\"button\");\n\n  buttons.forEach(button => {\n    button.disabled = true;\n  });\n\n  try {\n\n    const { error } =\n      await supabase\n        .from(\"payment_accounts\")\n        .update({\n          bank_name: bank,\n          account_number: number,\n          account_holder: holder,\n          updated_at: new Date().toISOString()\n        })\n        .eq(\"account_type\", type);\n\n    if (error) throw error;\n\n    showMessage(\n      \"계좌 정보가 저장되었습니다.\"\n    );\n\n  } catch (error) {\n\n    showMessage(\n      \"계좌 저장 오류: \" + error.message,\n      true\n    );\n\n  } finally {\n\n    isSaving = false;\n\n    buttons.forEach(button => {\n      button.disabled = false;\n    });\n\n  }\n\n}\n\n/* 저장 버튼 연결 */\n\ndocument.getElementById(\"membershipForm\")\n  .addEventListener(\"submit\", async event => {\n\n    event.preventDefault();\n\n    await saveAccount(\n      \"membership\",\n      \"membership\"\n    );\n\n  });\n\ndocument.getElementById(\"bannerForm\")\n  .addEventListener(\"submit\", async event => {\n\n    event.preventDefault();\n\n    await saveAccount(\n      \"banner\",\n      \"banner\"\n    );\n\n  });\n\n/* 초기 실행 */\n\nasync function initialize() {\n\n  const admin = await checkAdmin();\n\n  if (!admin) return;\n\n  await loadAccounts();\n\n}\n\ninitialize();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "view=knowledge-access-test": "<!DOCTYPE html>\n<html lang=\"ko\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\n      content=\"width=device-width, initial-scale=1.0\">\n\n<title>지식자료실 접근 권한 시험</title>\n\n<style>\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", Arial, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\nheader {\n  background: #0754a6;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n}\n\nheader h1 {\n  margin: 0;\n  font-size: 27px;\n}\n\nmain {\n  max-width: 850px;\n  margin: 35px auto;\n  padding: 0 15px;\n}\n\nsection {\n  background: white;\n  padding: 25px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.08);\n}\n\nh2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\nbutton {\n  padding: 12px 20px;\n  margin: 6px;\n  border: none;\n  border-radius: 7px;\n  background: #0754a6;\n  color: white;\n  font-size: 15px;\n  font-weight: bold;\n  cursor: pointer;\n}\n\nbutton:hover {\n  background: #10315e;\n}\n\nbutton:disabled {\n  opacity: 0.6;\n  cursor: not-allowed;\n}\n\n.status {\n  padding: 15px;\n  background: #eef4fb;\n  border-radius: 8px;\n  margin-top: 15px;\n  white-space: pre-line;\n}\n\n.result {\n  padding: 15px;\n  margin-top: 15px;\n  border-radius: 8px;\n  background: #f1f5f9;\n  white-space: pre-line;\n  overflow-wrap: anywhere;\n}\n\n.success {\n  background: #e8f5e9;\n  color: #176534;\n}\n\n.failure {\n  background: #fff1f2;\n  color: #991b1b;\n}\n\n.test-buttons {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n}\n\nfooter {\n  text-align: center;\n  padding: 25px;\n  background: #10315e;\n  color: white;\n}\n\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n  <h1>지식자료실 접근 권한 시험</h1>\n  <p>제172-12단계 · 회원 인증 및 자료 등급 검증</p>\n</header>\n\n<main>\n\n<section>\n\n<h2>① 회원 로그인 상태</h2>\n\n<div id=\"memberStatus\" class=\"status\">\n  회원정보 확인 중...\n</div>\n\n<button id=\"refreshButton\">\n  로그인 상태 새로 확인\n</button>\n\n<a href=\"index.html?view=login\">\n  <button type=\"button\">\n    로그인 페이지\n  </button>\n</a>\n\n</section>\n\n<section>\n\n<h2>② 자료별 접근 권한 시험</h2>\n\n<p>\n  각 버튼을 누르면 Supabase 서버에서\n  실제 자료 접근 권한을 검사합니다.\n</p>\n\n<div class=\"test-buttons\">\n\n<button data-document-id=\"1\">\n  3급 공개자료 시험\n</button>\n\n<button data-document-id=\"2\">\n  2급 회원자료 시험\n</button>\n\n<button data-document-id=\"3\">\n  1급 대외비 자료 시험\n</button>\n\n</div>\n\n<div id=\"testResult\" class=\"result\">\n  시험 버튼을 선택해 주세요.\n</div>\n\n</section>\n\n<section>\n\n<h2>③ 시험 기준</h2>\n\n<p>\n  <strong>3급:</strong>\n  누구나 열람할 수 있는 공개자료\n</p>\n\n<p>\n  <strong>2급:</strong>\n  관리자가 승인한 로그인 회원에게 공개\n</p>\n\n<p>\n  <strong>1급:</strong>\n  승인 회원 중 신원확인과 자료별 열람 승인을\n  완료한 회원에게 공개\n</p>\n\n<p>\n  이 페이지에서는 실제 원문 파일을 열지 않고\n  접근 권한과 임시 주소 발급 여부만 확인합니다.\n</p>\n\n</section>\n\n</main>\n\n<footer>\n  경기도 글로벌 AI 허브 유치<br>\n  고양특례시 범시민추진위원회\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n// ===============================================\n// 1. 기존 로그인 시스템과 동일한 Supabase 설정\n// ===============================================\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\nconst memberStatus =\n  document.getElementById(\"memberStatus\");\n\nconst testResult =\n  document.getElementById(\"testResult\");\n\nconst refreshButton =\n  document.getElementById(\"refreshButton\");\n\nconst testButtons =\n  document.querySelectorAll(\n    \"[data-document-id]\"\n  );\n\n// ===============================================\n// 2. 회원 상태 확인\n// ===============================================\n\nasync function checkMemberStatus() {\n\n  memberStatus.textContent =\n    \"회원정보 확인 중...\";\n\n  try {\n\n    const { data, error } =\n      await supabase.auth.getUser();\n\n    if (error || !data.user) {\n\n      memberStatus.textContent =\n        \"현재 로그인하지 않은 상태입니다.\";\n\n      return;\n    }\n\n    const user = data.user;\n\n    const {\n      data: profile,\n      error: profileError\n    } = await supabase\n      .from(\"profiles\")\n      .select(\n        \"member_role, approval_status\"\n      )\n      .eq(\"id\", user.id)\n      .maybeSingle();\n\n    if (profileError || !profile) {\n\n      memberStatus.textContent =\n        \"로그인은 확인되었으나 \" +\n        \"회원 승인 정보를 조회할 수 없습니다.\";\n\n      return;\n    }\n\n    const approved =\n      profile.approval_status === \"approved\";\n\n    memberStatus.textContent =\n      \"로그인 상태: 로그인됨\\n\" +\n      \"회원 역할: \" + profile.member_role + \"\\n\" +\n      \"승인 상태: \" + profile.approval_status + \"\\n\" +\n      \"정식 회원: \" +\n      (approved ? \"승인 완료\" : \"미승인\");\n\n  } catch (error) {\n\n    memberStatus.textContent =\n      \"회원정보 확인 중 오류가 발생했습니다.\";\n\n  }\n\n}\n\n// ===============================================\n// 3. 자료 접근 시험\n// ===============================================\n\nasync function testDocumentAccess(documentId) {\n\n  testButtons.forEach(button => {\n    button.disabled = true;\n  });\n\n  testResult.className = \"result\";\n\n  testResult.textContent =\n    \"자료 ID \" + documentId +\n    \" 접근 권한 확인 중...\";\n\n  try {\n\n    // Edge Function 호출\n    // Supabase 클라이언트가 현재 세션의\n    // 인증정보를 사용하도록 구성\n\n    const { data, error } =\n      await supabase.functions.invoke(\n        \"knowledge-document-access\",\n        {\n          body: {\n            document_id: documentId\n          }\n        }\n      );\n\n    // HTTP 오류가 발생한 경우에도\n    // 서버가 반환한 JSON을 확인\n\n    if (error) {\n\n      let errorMessage =\n        \"서버 요청에 실패했습니다.\";\n\n      let httpStatus = \"확인 불가\";\n\n      if (error.context?.status) {\n        httpStatus = error.context.status;\n      }\n\n      if (error.context) {\n\n        try {\n\n          const errorBody =\n            await error.context.json();\n\n          if (errorBody?.error) {\n            errorMessage = errorBody.error;\n          }\n\n        } catch (_) {\n          // 오류 응답이 JSON이 아닐 수 있음\n        }\n\n      }\n\n      testResult.className =\n        \"result failure\";\n\n      testResult.textContent =\n        \"자료 ID: \" + documentId + \"\\n\" +\n        \"HTTP 상태: \" + httpStatus + \"\\n\" +\n        \"접근 결과: 거부 또는 요청 실패\\n\" +\n        \"사유: \" + errorMessage;\n\n      return;\n    }\n\n    if (data?.success === true) {\n\n      testResult.className =\n        \"result success\";\n\n      testResult.textContent =\n        \"자료 ID: \" + data.document_id + \"\\n\" +\n        \"자료명: \" + data.title + \"\\n\" +\n        \"공개 등급: \" + data.security_grade + \"급\\n\" +\n        \"접근 결과: 허용\\n\" +\n        \"임시 주소 발급: \" +\n        (data.signed_url ? \"성공\" : \"실패\") + \"\\n\" +\n        \"유효기간: \" + data.expires_in + \"초\";\n\n    } else {\n\n      testResult.className =\n        \"result failure\";\n\n      testResult.textContent =\n        \"자료 ID: \" + documentId + \"\\n\" +\n        \"접근 결과: 거부\\n\" +\n        \"사유: \" +\n        (data?.error || \"알 수 없는 오류\");\n\n    }\n\n  } catch (error) {\n\n    testResult.className =\n      \"result failure\";\n\n    testResult.textContent =\n      \"시험 중 오류가 발생했습니다.\";\n\n  } finally {\n\n    testButtons.forEach(button => {\n      button.disabled = false;\n    });\n\n  }\n\n}\n\n// ===============================================\n// 4. 버튼 이벤트\n// ===============================================\n\nrefreshButton.addEventListener(\n  \"click\",\n  checkMemberStatus\n);\n\ntestButtons.forEach(button => {\n\n  button.addEventListener(\"click\", () => {\n\n    const documentId =\n      Number(button.dataset.documentId);\n\n    testDocumentAccess(documentId);\n\n  });\n\n});\n\n// ===============================================\n// 5. 초기 실행\n// ===============================================\n\ncheckMemberStatus();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "view=knowledge-admin-test": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>지식자료실 관리자 시험</title>\n\n<style>\n*{box-sizing:border-box}\nbody{\n  margin:0;\n  font-family:\"Malgun Gothic\",Arial,sans-serif;\n  background:#f4f8fc;\n  color:#17315b;\n  line-height:1.7;\n}\nheader{\n  background:#0754a6;\n  color:white;\n  text-align:center;\n  padding:30px 15px;\n}\nheader h1{margin:0;font-size:28px}\nheader p{margin:10px 0}\nmain{\n  max-width:1100px;\n  margin:35px auto;\n  padding:0 18px;\n}\nsection{\n  background:white;\n  padding:28px;\n  border-radius:12px;\n  margin-bottom:25px;\n  box-shadow:0 3px 12px #00000012;\n}\nh2{color:#0754a6;margin-top:0}\nh3{color:#17315b}\nbutton,.link{\n  display:inline-block;\n  background:#0754a6;\n  color:white;\n  border:0;\n  border-radius:7px;\n  padding:11px 18px;\n  margin:5px 5px 5px 0;\n  font-size:15px;\n  font-weight:bold;\n  cursor:pointer;\n  text-decoration:none;\n}\nbutton:hover,.link:hover{background:#063e7a}\nbutton:disabled{opacity:.5;cursor:not-allowed}\n.danger{background:#b42318}\n.danger:hover{background:#861b14}\nselect,input{\n  width:100%;\n  padding:12px;\n  border:1px solid #cbd5e1;\n  border-radius:7px;\n  font-size:15px;\n  margin:8px 0 15px;\n}\nlabel{display:block;font-weight:bold}\n.status{\n  background:#eef4fb;\n  padding:16px;\n  border-radius:8px;\n  white-space:pre-line;\n  margin-top:15px;\n}\n.success{background:#e8f5e9;color:#176534}\n.failure{background:#fff1f2;color:#991b1b}\n.grid{\n  display:grid;\n  grid-template-columns:1fr 1fr;\n  gap:20px;\n}\ntable{\n  width:100%;\n  border-collapse:collapse;\n  margin-top:15px;\n  font-size:14px;\n}\nth,td{\n  border:1px solid #dce6f2;\n  padding:10px;\n  text-align:left;\n}\nth{background:#eef4fb}\n.table-wrap{overflow-x:auto}\n[hidden]{display:none!important}\nfooter{\n  text-align:center;\n  background:#10315e;\n  color:white;\n  padding:25px;\n}\n@media(max-width:700px){\n  .grid{grid-template-columns:1fr}\n  section{padding:20px}\n}\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n<h1>지식자료실 관리자 시험</h1>\n<p>제172-16단계 · 1급 자료 열람 승인 및 기록 관리</p>\n\n</header>\n\n<main>\n\n<section>\n<h2>① 관리자 인증</h2>\n<div id=\"adminStatus\" class=\"status\">\n관리자 권한 확인 중...\n</div>\n</section>\n\n<div id=\"adminContent\" hidden>\n\n<section>\n<h2>② 회원 및 자료 선택</h2>\n\n<div class=\"grid\">\n\n<div>\n<label for=\"memberSelect\">승인 회원</label>\n<select id=\"memberSelect\">\n<option value=\"\">회원을 선택하세요</option>\n</select>\n</div>\n\n<div>\n<label for=\"documentSelect\">1급 자료</label>\n<select id=\"documentSelect\">\n<option value=\"\">자료를 선택하세요</option>\n</select>\n</div>\n\n</div>\n\n<button id=\"refreshButton\">목록 새로고침</button>\n\n<div id=\"selectionStatus\" class=\"status\">\n회원과 자료를 선택해 주세요.\n</div>\n</section>\n\n<section>\n<h2>③ 회원 신원확인</h2>\n\n<p>\n관리자가 회원의 신원을 확인한 후 승인합니다.\n신원확인만으로 1급 자료의 열람이 허용되지는 않습니다.\n</p>\n\n<button id=\"verifyButton\">신원확인 승인</button>\n\n<button id=\"unverifyButton\" class=\"danger\">\n신원확인 취소\n</button>\n\n<div id=\"verificationResult\" class=\"status\">\n처리 대기 중\n</div>\n</section>\n\n<section>\n<h2>④ 1급 자료별 열람 승인</h2>\n\n<p>\n신원확인이 완료된 회원에게 특정 1급 자료의\n열람 권한을 부여합니다.\n</p>\n\n<label for=\"expiryDate\">\n승인 만료일 (선택)\n</label>\n\n<input type=\"date\" id=\"expiryDate\">\n\n<button id=\"approveButton\">\n자료 열람 승인\n</button>\n\n<button id=\"revokeButton\" class=\"danger\">\n자료 열람 승인 취소\n</button>\n\n<div id=\"approvalResult\" class=\"status\">\n처리 대기 중\n</div>\n</section>\n\n<section>\n<h2>⑤ 자료별 승인 현황</h2>\n\n<button id=\"loadApprovalsButton\">\n승인 현황 조회\n</button>\n\n<div class=\"table-wrap\">\n<table>\n<thead>\n<tr>\n<th>회원</th>\n<th>자료</th>\n<th>상태</th>\n<th>승인일</th>\n<th>만료일</th>\n</tr>\n</thead>\n<tbody id=\"approvalTable\">\n<tr><td colspan=\"5\">조회 전</td></tr>\n</tbody>\n</table>\n</div>\n</section>\n\n<section>\n<h2>⑥ 1급 자료 열람기록</h2>\n\n<button id=\"loadLogsButton\">\n열람기록 조회\n</button>\n\n<div class=\"table-wrap\">\n<table>\n<thead>\n<tr>\n<th>회원</th>\n<th>자료</th>\n<th>접근 유형</th>\n<th>요청 시각</th>\n</tr>\n</thead>\n<tbody id=\"logTable\">\n<tr><td colspan=\"4\">조회 전</td></tr>\n</tbody>\n</table>\n</div>\n</section>\n\n</div>\n</main>\n\n<footer>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</footer>\n\n\u003cscript type=\"module\">\n\nimport {createClient} from\n\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\nconst SUPABASE_URL =\n\"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n\"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase=createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\nconst $=id=>document.getElementById(id);\n\nlet members=[];\nlet documents=[];\nlet verifications=[];\nlet approvals=[];\n\nfunction message(id,text,success=null){\n  const el=$(id);\n  el.textContent=text;\n  el.className=\"status\";\n  if(success===true)el.classList.add(\"success\");\n  if(success===false)el.classList.add(\"failure\");\n}\n\nfunction dateText(value){\n  return value\n    ?new Date(value).toLocaleString(\"ko-KR\")\n    :\"-\";\n}\n\nfunction selectedMember(){\n  return $(\"memberSelect\").value;\n}\n\nfunction selectedDocument(){\n  return Number($(\"documentSelect\").value);\n}\n\nfunction memberName(id){\n  const m=members.find(x=>x.id===id);\n  return m\n    ?(m.full_name||m.email||\"회원\")\n    :\"회원 정보 없음\";\n}\n\nfunction documentName(id){\n  const d=documents.find(x=>x.id===id);\n  return d?d.title:\"자료 \"+id;\n}\n\nfunction requireSelection(needDocument=false){\n  if(!selectedMember()){\n    alert(\"회원을 선택해 주세요.\");\n    return false;\n  }\n  if(needDocument&&!selectedDocument()){\n    alert(\"1급 자료를 선택해 주세요.\");\n    return false;\n  }\n  return true;\n}\n\nfunction setBusy(busy){\n  document.querySelectorAll(\n    \"#adminContent button\"\n  ).forEach(button=>{\n    button.disabled=busy;\n  });\n}\n\nasync function initialize(){\n\n  try{\n\n    const {data,error}=\n      await supabase.auth.getUser();\n\n    if(error||!data.user){\n      message(\n        \"adminStatus\",\n        \"로그인이 필요합니다.\",\n        false\n      );\n      return;\n    }\n\n    const {data:isAdmin,error:adminError}=\n      await supabase.rpc(\"is_resource_admin\");\n\n    if(adminError)throw adminError;\n\n    if(isAdmin!==true){\n      message(\n        \"adminStatus\",\n        \"관리자 권한이 없습니다.\",\n        false\n      );\n      return;\n    }\n\n    message(\n      \"adminStatus\",\n      \"관리자 인증 완료\",\n      true\n    );\n\n    $(\"adminContent\").hidden=false;\n\n    await loadData();\n\n  }catch(error){\n\n    message(\n      \"adminStatus\",\n      \"관리자 인증 오류: \"+error.message,\n      false\n    );\n\n  }\n}\n\nasync function loadData(){\n\n  setBusy(true);\n\n  try{\n\n    const [\n      memberResult,\n      documentResult,\n      verificationResult,\n      approvalResult\n    ]=await Promise.all([\n\n      supabase\n        .from(\"profiles\")\n        .select(\n          \"id,full_name,email,member_role,approval_status\"\n        )\n        .eq(\"approval_status\",\"approved\")\n        .order(\"full_name\"),\n\n      supabase\n        .from(\"knowledge_documents\")\n        .select(\"id,title,security_grade\")\n        .eq(\"security_grade\",1)\n        .order(\"id\"),\n\n      supabase\n        .from(\"knowledge_member_verifications\")\n        .select(\"user_id,is_verified\"),\n\n      supabase\n        .from(\"knowledge_access_approvals\")\n        .select(\n          \"document_id,user_id,is_active,expires_at,approved_at\"\n        )\n\n    ]);\n\n    for(const r of [\n      memberResult,\n      documentResult,\n      verificationResult,\n      approvalResult\n    ]){\n      if(r.error)throw r.error;\n    }\n\n    members=memberResult.data||[];\n    documents=documentResult.data||[];\n    verifications=verificationResult.data||[];\n    approvals=approvalResult.data||[];\n\n    const previousMember=selectedMember();\n    const previousDocument=$(\"documentSelect\").value;\n\n    $(\"memberSelect\").replaceChildren(\n      new Option(\"회원을 선택하세요\",\"\"),\n      ...members.map(m=>\n        new Option(\n          (m.full_name||m.email||\"회원\")+\n          \" (\"+m.member_role+\")\",\n          m.id\n        )\n      )\n    );\n\n    $(\"documentSelect\").replaceChildren(\n      new Option(\"자료를 선택하세요\",\"\"),\n      ...documents.map(d=>\n        new Option(d.title,d.id)\n      )\n    );\n\n    $(\"memberSelect\").value=previousMember;\n    $(\"documentSelect\").value=previousDocument;\n\n    updateSelection();\n\n    message(\n      \"selectionStatus\",\n      \"회원 \"+members.length+\"명, \"+\n      \"1급 자료 \"+documents.length+\"건 조회 완료\",\n      true\n    );\n\n  }catch(error){\n\n    message(\n      \"selectionStatus\",\n      \"목록 조회 실패: \"+error.message,\n      false\n    );\n\n  }finally{\n    setBusy(false);\n  }\n}\n\nfunction updateSelection(){\n\n  const userId=selectedMember();\n  const documentId=selectedDocument();\n\n  if(!userId)return;\n\n  const verified=verifications.some(\n    v=>v.user_id===userId&&v.is_verified===true\n  );\n\n  const approval=approvals.find(\n    a=>a.user_id===userId&&\n       a.document_id===documentId\n  );\n\n  const valid=approval?.is_active===true&&\n    (!approval.expires_at||\n      new Date(approval.expires_at)>new Date());\n\n  message(\n    \"selectionStatus\",\n    \"회원: \"+memberName(userId)+\"\\n\"+\n    \"신원확인: \"+(verified?\"완료\":\"미완료\")+\"\\n\"+\n    \"선택 자료: \"+\n    (documentId?documentName(documentId):\"없음\")+\"\\n\"+\n    \"자료별 승인: \"+\n    (valid?\"유효\":\"없음 또는 만료\")\n  );\n}\n\nasync function verifyMember(verified){\n\n  if(!requireSelection())return;\n\n  const userId=selectedMember();\n\n  const question=verified\n    ?\"해당 회원의 신원확인을 승인하시겠습니까?\"\n    :\"해당 회원의 신원확인을 취소하시겠습니까?\";\n\n  if(!confirm(question))return;\n\n  setBusy(true);\n\n  try{\n\n    const {data,error}=await supabase.rpc(\n      \"admin_verify_knowledge_member\",\n      {\n        p_user_id:userId,\n        p_verified:verified\n      }\n    );\n\n    if(error)throw error;\n    if(data!==true)throw new Error(\"처리 결과 확인 실패\");\n\n    message(\n      \"verificationResult\",\n      verified\n        ?\"신원확인 승인 완료\"\n        :\"신원확인 취소 완료\",\n      true\n    );\n\n    await loadData();\n\n  }catch(error){\n\n    message(\n      \"verificationResult\",\n      error.message,\n      false\n    );\n\n  }finally{\n    setBusy(false);\n  }\n}\n\nasync function approveAccess(){\n\n  if(!requireSelection(true))return;\n\n  const userId=selectedMember();\n  const documentId=selectedDocument();\n\n  const expiry=$(\"expiryDate\").value;\n\n  let expiresAt=null;\n\n  if(expiry){\n    const date=new Date(expiry+\"T23:59:59\");\n    if(date<=new Date()){\n      alert(\"미래의 만료일을 선택해 주세요.\");\n      return;\n    }\n    expiresAt=date.toISOString();\n  }\n\n  if(!confirm(\"선택한 자료의 열람을 승인하시겠습니까?\")){\n    return;\n  }\n\n  setBusy(true);\n\n  try{\n\n    const {data,error}=await supabase.rpc(\n      \"admin_approve_knowledge_access\",\n      {\n        p_document_id:documentId,\n        p_user_id:userId,\n        p_expires_at:expiresAt\n      }\n    );\n\n    if(error)throw error;\n    if(data!==true)throw new Error(\"승인 결과 확인 실패\");\n\n    message(\n      \"approvalResult\",\n      \"자료별 열람 승인 완료\",\n      true\n    );\n\n    await loadData();\n\n  }catch(error){\n\n    message(\n      \"approvalResult\",\n      error.message,\n      false\n    );\n\n  }finally{\n    setBusy(false);\n  }\n}\n\nasync function revokeAccess(){\n\n  if(!requireSelection(true))return;\n\n  const userId=selectedMember();\n  const documentId=selectedDocument();\n\n  if(!confirm(\"선택한 자료의 열람 승인을 취소하시겠습니까?\")){\n    return;\n  }\n\n  setBusy(true);\n\n  try{\n\n    const {data,error}=await supabase.rpc(\n      \"admin_revoke_knowledge_access\",\n      {\n        p_document_id:documentId,\n        p_user_id:userId\n      }\n    );\n\n    if(error)throw error;\n    if(data!==true)throw new Error(\"취소 결과 확인 실패\");\n\n    message(\n      \"approvalResult\",\n      \"자료별 열람 승인 취소 완료\",\n      true\n    );\n\n    await loadData();\n\n  }catch(error){\n\n    message(\n      \"approvalResult\",\n      error.message,\n      false\n    );\n\n  }finally{\n    setBusy(false);\n  }\n}\n\nfunction renderTable(id,rows,columns){\n\n  const tbody=$(id);\n  tbody.replaceChildren();\n\n  if(!rows.length){\n    const tr=document.createElement(\"tr\");\n    const td=document.createElement(\"td\");\n    td.colSpan=columns;\n    td.textContent=\"조회된 기록이 없습니다.\";\n    tr.appendChild(td);\n    tbody.appendChild(tr);\n    return;\n  }\n\n  rows.forEach(row=>{\n    const tr=document.createElement(\"tr\");\n    row.forEach(value=>{\n      const td=document.createElement(\"td\");\n      td.textContent=String(value??\"-\");\n      tr.appendChild(td);\n    });\n    tbody.appendChild(tr);\n  });\n}\n\nasync function loadApprovals(){\n\n  try{\n\n    const {data,error}=await supabase\n      .from(\"knowledge_access_approvals\")\n      .select(\n        \"user_id,document_id,is_active,approved_at,expires_at\"\n      )\n      .order(\"approved_at\",{ascending:false})\n      .limit(100);\n\n    if(error)throw error;\n\n    renderTable(\n      \"approvalTable\",\n      (data||[]).map(a=>[\n        memberName(a.user_id),\n        documentName(a.document_id),\n        a.is_active?\"승인\":\"취소\",\n        dateText(a.approved_at),\n        dateText(a.expires_at)\n      ]),\n      5\n    );\n\n  }catch(error){\n    alert(\"승인 현황 조회 실패: \"+error.message);\n  }\n}\n\nasync function loadLogs(){\n\n  try{\n\n    const {data,error}=await supabase\n      .from(\"knowledge_access_logs\")\n      .select(\n        \"user_id,document_id,access_type,accessed_at\"\n      )\n      .order(\"accessed_at\",{ascending:false})\n      .limit(100);\n\n    if(error)throw error;\n\n    renderTable(\n      \"logTable\",\n      (data||[]).map(log=>[\n        memberName(log.user_id),\n        documentName(log.document_id),\n        log.access_type,\n        dateText(log.accessed_at)\n      ]),\n      4\n    );\n\n  }catch(error){\n    alert(\"열람기록 조회 실패: \"+error.message);\n  }\n}\n\n$(\"memberSelect\").addEventListener(\n  \"change\",updateSelection\n);\n\n$(\"documentSelect\").addEventListener(\n  \"change\",updateSelection\n);\n\n$(\"refreshButton\").addEventListener(\n  \"click\",loadData\n);\n\n$(\"verifyButton\").addEventListener(\n  \"click\",()=>verifyMember(true)\n);\n\n$(\"unverifyButton\").addEventListener(\n  \"click\",()=>verifyMember(false)\n);\n\n$(\"approveButton\").addEventListener(\n  \"click\",approveAccess\n);\n\n$(\"revokeButton\").addEventListener(\n  \"click\",revokeAccess\n);\n\n$(\"loadApprovalsButton\").addEventListener(\n  \"click\",loadApprovals\n);\n\n$(\"loadLogsButton\").addEventListener(\n  \"click\",loadLogs\n);\n\ninitialize();\n\n\u003c/script>\n</body>\n</html>\n",
  "view=knowledge-security-test": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n<title>지식자료실 보안 검증</title>\n\n<style>\n*{\n  box-sizing:border-box;\n}\n\nbody{\n  margin:0;\n  font-family:\"Malgun Gothic\",Arial,sans-serif;\n  background:#f4f8fc;\n  color:#17315b;\n  line-height:1.7;\n}\n\nheader{\n  background:#0754a6;\n  color:white;\n  text-align:center;\n  padding:30px 15px;\n}\n\nheader h1{\n  margin:0;\n  font-size:27px;\n}\n\nheader p{\n  margin:10px 0 0;\n}\n\nmain{\n  max-width:1000px;\n  margin:35px auto;\n  padding:0 18px;\n}\n\nsection{\n  background:white;\n  padding:28px;\n  border-radius:12px;\n  margin-bottom:25px;\n  box-shadow:0 3px 12px #00000012;\n}\n\nh2{\n  color:#0754a6;\n  margin-top:0;\n}\n\nbutton,.link{\n  display:inline-block;\n  background:#0754a6;\n  color:white;\n  border:0;\n  border-radius:7px;\n  padding:12px 20px;\n  margin:6px 5px 6px 0;\n  font-size:15px;\n  font-weight:bold;\n  cursor:pointer;\n  text-decoration:none;\n}\n\nbutton:hover,.link:hover{\n  background:#063e7a;\n}\n\nbutton:disabled{\n  opacity:.5;\n  cursor:not-allowed;\n}\n\n.status{\n  background:#eef4fb;\n  padding:17px;\n  border-radius:8px;\n  margin-top:15px;\n  white-space:pre-line;\n  overflow-wrap:anywhere;\n}\n\n.success{\n  background:#e8f5e9;\n  color:#176534;\n}\n\n.failure{\n  background:#fff1f2;\n  color:#991b1b;\n}\n\n.warning{\n  background:#fff7e6;\n  color:#92400e;\n}\n\ntable{\n  width:100%;\n  border-collapse:collapse;\n  margin-top:18px;\n  font-size:14px;\n}\n\nth,td{\n  border:1px solid #dce6f2;\n  padding:12px;\n  text-align:left;\n}\n\nth{\n  background:#eef4fb;\n}\n\n.table-wrap{\n  overflow-x:auto;\n}\n\n[hidden]{\n  display:none!important;\n}\n\nfooter{\n  text-align:center;\n  background:#10315e;\n  color:white;\n  padding:25px;\n}\n\n@media(max-width:700px){\n  section{\n    padding:20px;\n  }\n}\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n<h1>지식자료실 보안 검증</h1>\n<p>제172-30단계 · 일반회원 데이터 접근 차단 시험</p>\n</header>\n\n<main>\n\n<section>\n\n<h2>① 시험 계정 확인</h2>\n\n<div id=\"memberStatus\" class=\"status\">\n로그인 상태 확인 중...\n</div>\n\n<a class=\"link\" href=\"index.html?view=login\">\n로그인 페이지\n</a>\n\n</section>\n\n<section id=\"testSection\" hidden>\n\n<h2>② 관리자 전용 데이터 접근 시험</h2>\n\n<p>\n일반회원의 인증정보로 관리자 전용 테이블에\n직접 SELECT 요청을 실행합니다.\n</p>\n\n<p>\n이 시험은 데이터를 읽기만 하며\n추가·수정·삭제하지 않습니다.\n</p>\n\n<button id=\"runTestButton\">\n보안 시험 실행\n</button>\n\n<div id=\"testStatus\" class=\"status\">\n시험 대기 중\n</div>\n\n<div class=\"table-wrap\">\n\n<table>\n\n<thead>\n<tr>\n<th>시험 대상</th>\n<th>조회 결과</th>\n<th>판정</th>\n</tr>\n</thead>\n\n<tbody id=\"resultTable\">\n\n<tr>\n<td colspan=\"3\">\n시험 실행 전\n</td>\n</tr>\n\n</tbody>\n\n</table>\n\n</div>\n\n</section>\n\n<section>\n\n<h2>③ 시험 결과 종합</h2>\n\n<div id=\"summary\" class=\"status\">\n시험을 실행하면 결과가 표시됩니다.\n</div>\n\n<p>\n이 시험은 현재 로그인한 일반회원의\n데이터베이스 조회 권한을 확인합니다.\n</p>\n\n<p>\n실제 대외비 파일의 Storage 접근 차단과\n임시 URL 만료 검증은 별도로 진행합니다.\n</p>\n\n</section>\n\n</main>\n\n<footer>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</footer>\n\n\u003cscript type=\"module\">\n\nimport {createClient} from\n\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\nconst SUPABASE_URL =\n\"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n\"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase=createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\nconst $=id=>document.getElementById(id);\n\nlet verifiedMember=false;\n\nconst testTargets=[\n  {\n    name:\"회원 신원확인 정보\",\n    table:\"knowledge_member_verifications\",\n    column:\"user_id\"\n  },\n  {\n    name:\"자료별 열람 승인정보\",\n    table:\"knowledge_access_approvals\",\n    column:\"id\"\n  },\n  {\n    name:\"1급 자료 열람기록\",\n    table:\"knowledge_access_logs\",\n    column:\"id\"\n  },\n  {\n    name:\"관리자 승인·취소 이력\",\n    table:\"knowledge_approval_history\",\n    column:\"id\"\n  },\n  {\n    name:\"자료 원문 및 파일 경로\",\n    table:\"knowledge_document_contents\",\n    column:\"document_id\"\n  }\n];\n\nfunction message(id,text,type=\"\"){\n\n  const el=$(id);\n\n  el.textContent=text;\n  el.className=\"status\";\n\n  if(type){\n    el.classList.add(type);\n  }\n}\n\nasync function checkMember(){\n\n  verifiedMember=false;\n  $(\"testSection\").hidden=true;\n\n  try{\n\n    const {data,error}=\n      await supabase.auth.getUser();\n\n    if(error||!data.user){\n\n      message(\n        \"memberStatus\",\n        \"로그인하지 않은 상태입니다.\",\n        \"warning\"\n      );\n\n      return;\n    }\n\n    const {data:profile,error:profileError}=\n      await supabase\n        .from(\"profiles\")\n        .select(\n          \"member_role,approval_status\"\n        )\n        .eq(\"id\",data.user.id)\n        .single();\n\n    if(profileError)throw profileError;\n\n    if(\n      profile.member_role!==\"member\"||\n      profile.approval_status!==\"approved\"\n    ){\n\n      message(\n        \"memberStatus\",\n        \"현재 계정은 승인된 일반회원이 아닙니다.\\n\"+\n        \"회원 역할: \"+profile.member_role+\"\\n\"+\n        \"승인 상태: \"+profile.approval_status,\n        \"warning\"\n      );\n\n      return;\n    }\n\n    const {data:isAdmin,error:adminError}=\n      await supabase.rpc(\"is_resource_admin\");\n\n    if(adminError)throw adminError;\n\n    if(isAdmin!==false){\n\n      message(\n        \"memberStatus\",\n        \"관리자 권한이 감지되었거나 확인되지 않았습니다.\\n\"+\n        \"보안 시험을 중단합니다.\",\n        \"warning\"\n      );\n\n      return;\n    }\n\n    verifiedMember=true;\n\n    message(\n      \"memberStatus\",\n      \"로그인 확인: 정상\\n\"+\n      \"회원 역할: member\\n\"+\n      \"승인 상태: approved\\n\"+\n      \"관리자 권한: 없음\\n\"+\n      \"보안 시험 실행 가능\",\n      \"success\"\n    );\n\n    $(\"testSection\").hidden=false;\n\n  }catch(error){\n\n    message(\n      \"memberStatus\",\n      \"회원 확인 실패: \"+error.message,\n      \"failure\"\n    );\n\n  }\n}\n\nfunction addResult(name,result,judgment){\n\n  const tbody=$(\"resultTable\");\n\n  const tr=document.createElement(\"tr\");\n\n  [name,result,judgment].forEach(value=>{\n\n    const td=document.createElement(\"td\");\n\n    td.textContent=value;\n\n    tr.appendChild(td);\n\n  });\n\n  tbody.appendChild(tr);\n}\n\nasync function runSecurityTest(){\n\n  if(!verifiedMember){\n    alert(\"승인된 일반회원만 시험할 수 있습니다.\");\n    return;\n  }\n\n  const button=$(\"runTestButton\");\n\n  button.disabled=true;\n\n  $(\"resultTable\").replaceChildren();\n\n  message(\n    \"testStatus\",\n    \"관리자 전용 테이블 접근 시험 진행 중...\"\n  );\n\n  let blocked=0;\n  let exposed=0;\n  let uncertain=0;\n\n  try{\n\n    for(const target of testTargets){\n\n      try{\n\n        const {data,error}=\n          await supabase\n            .from(target.table)\n            .select(target.column)\n            .limit(1);\n\n        if(error){\n\n          blocked++;\n\n          addResult(\n            target.name,\n            \"조회 거부: \"+error.message,\n            \"차단 확인\"\n          );\n\n        }else if(data&&data.length>0){\n\n          exposed++;\n\n          addResult(\n            target.name,\n            \"데이터 \"+data.length+\"건 반환\",\n            \"보안 점검 필요\"\n          );\n\n        }else{\n\n          uncertain++;\n\n          addResult(\n            target.name,\n            \"조회 결과 0건\",\n            \"추가 검증 필요\"\n          );\n\n        }\n\n      }catch(error){\n\n        uncertain++;\n\n        addResult(\n          target.name,\n          \"요청 오류: \"+error.message,\n          \"추가 검증 필요\"\n        );\n\n      }\n    }\n\n    message(\n      \"testStatus\",\n      \"5개 테이블 접근 시험 완료\",\n      \"success\"\n    );\n\n    const summaryText=\n      \"시험 대상: \"+testTargets.length+\"개\\n\"+\n      \"접근 차단 확인: \"+blocked+\"개\\n\"+\n      \"데이터 반환: \"+exposed+\"개\\n\"+\n      \"추가 검증 필요: \"+uncertain+\"개\";\n\n    if(exposed>0){\n\n      message(\n        \"summary\",\n        summaryText+\n        \"\\n\\n관리자 전용 데이터가 반환되었습니다.\"+\n        \"\\n보안 설정을 점검해야 합니다.\",\n        \"failure\"\n      );\n\n    }else if(uncertain>0){\n\n      message(\n        \"summary\",\n        summaryText+\n        \"\\n\\n데이터 반환은 확인되지 않았으나\"+\n        \"\\nRLS 차단 여부를 추가 확인해야 합니다.\",\n        \"warning\"\n      );\n\n    }else{\n\n      message(\n        \"summary\",\n        summaryText+\n        \"\\n\\n현재 일반회원 계정의 조회 요청이 모두 거부되었습니다.\",\n        \"success\"\n      );\n\n    }\n\n  }finally{\n\n    button.disabled=false;\n\n  }\n}\n\n$(\"runTestButton\").addEventListener(\n  \"click\",\n  runSecurityTest\n);\n\ncheckMember();\n\n\u003c/script>\n\n</body>\n</html>\n"
}
</script>
<script>
(() => {
  const data = document.getElementById("page-variants");
  const pages = JSON.parse(data.textContent);
  const params = new URLSearchParams(window.location.search);
  const keys = ["view", "lang"].map(key => key + "=" + params.get(key));
  const selected = keys.find(key => Object.hasOwn(pages, key)) || "default";
  const page = pages[selected];
  const opening = /^\s*<!doctype html>\s*(<html\b[^>]*>)\s*<head\b[^>]*>/i.exec(page);

  // Keep the original URL and let the initial HTML parser run the page scripts.
  const root = new DOMParser().parseFromString(opening[1], "text/html").documentElement;
  for (const attribute of root.attributes) {
    document.documentElement.setAttribute(attribute.name, attribute.value);
  }
  data.remove();
  document.write(page.slice(opening[0].length));
})();
</script>
