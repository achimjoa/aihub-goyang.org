ent(\"td\");\n      cell.textContent = value;\n      row.appendChild(cell);\n    }\n\n    const actionCell = document.createElement(\"td\");\n\n    if (\n      member.id !== currentAdminId &&\n      member.member_role === \"member\"\n    ) {\n\n      const approveButton =\n        document.createElement(\"button\");\n\n      approveButton.textContent = \"승인\";\n      approveButton.className = \"approve\";\n\n      approveButton.disabled =\n        member.approval_status === \"approved\";\n\n      approveButton.addEventListener(\"click\", () => {\n        changeApproval(\n          member.id,\n          member.full_name,\n          \"approved\"\n        );\n      });\n\n      const rejectButton =\n        document.createElement(\"button\");\n\n      rejectButton.textContent = \"거절\";\n      rejectButton.className = \"reject\";\n\n      rejectButton.disabled =\n        member.approval_status === \"rejected\";\n\n      rejectButton.addEventListener(\"click\", () => {\n        changeApproval(\n          member.id,\n          member.full_name,\n          \"rejected\"\n        );\n      });\n\n      actionCell.append(\n        approveButton,\n        rejectButton\n      );\n\n    } else {\n      actionCell.textContent = \"관리자 계정\";\n    }\n\n    row.appendChild(actionCell);\n    memberList.appendChild(row);\n  }\n\n  memberArea.hidden = false;\n\n  showMessage(\n    `회원 ${data.length}명의 정보를 불러왔습니다.`\n  );\n}\n\n/* 승인 또는 거절 */\n\nasync function changeApproval(\n  memberId,\n  memberName,\n  status\n) {\n\n  if (busy) return;\n\n  const action =\n    status === \"approved\" ? \"승인\" : \"거절\";\n\n  const confirmed = confirm(\n    `${memberName || \"해당 회원\"}님을 ${action}하시겠습니까?`\n  );\n\n  if (!confirmed) return;\n\n  busy = true;\n\n  memberArea.querySelectorAll(\"button\")\n    .forEach(button => button.disabled = true);\n\n  try {\n\n    const { error } = await supabase.rpc(\n      \"manage_member_approval\",\n      {\n        target_user_id: memberId,\n        new_status: gout\");\n\nlet currentAdminId = null;\nlet isSuperAdmin = false;\nlet busy = false;\n\nfunction showMessage(text, isError = false) {\n  message.textContent = text;\n  message.style.color =\n    isError ? \"#b91c1c\" : \"#0754a6\";\n}\n\nfunction setBusy(value) {\n  busy = value;\n\n  document.querySelectorAll(\n    \"#memberArea button, #upgradePanel button\"\n  ).forEach(button => {\n    button.disabled = value;\n  });\n}\n\nfunction addCell(row, value) {\n  const cell = document.createElement(\"td\");\n  cell.textContent = value ?? \"\";\n  row.appendChild(cell);\n  return cell;\n}\n\nfunction addButton(parent, label, className, handler) {\n  const button = document.createElement(\"button\");\n\n  button.textContent = label;\n  button.className = className;\n\n  button.addEventListener(\"click\", handler);\n\n  parent.appendChild(button);\n\n  return button;\n}\n\n/* 로그인 및 관리자 권한 확인 */\n\nasync function checkAdmin() {\n\n  const { data: userData, error: userError } =\n    await supabase.auth.getUser();\n\n  const user = userError ? null : userData.user;\n\n  navLogin.hidden = !!user;\n  navSignup.hidden = !!user;\n  navLogout.hidden = !user;\n  isSuperAdmin = false;\n\n  if (!user) {\n    showMessage(\"로그인이 필요합니다.\", true);\n    return false;\n  }\n\n  currentAdminId = user.id;\n\n  const [admin, superAdmin] = await Promise.allSettled([\n    supabase.rpc(\"is_admin\"),\n    supabase.rpc(\"is_super_admin\")\n  ]);\n  const granted = result => result.status === \"fulfilled\" &&\n    !result.value.error && result.value.data === true;\n  isSuperAdmin = granted(superAdmin);\n\n  if (!granted(admin) && !isSuperAdmin) {\n    const failed = [admin, superAdmin].some(result =>\n      result.status === \"rejected\" || result.value.error\n    );\n    showMessage(failed ? \"관리자 권한을 확인하지 못했습니다.\" : \"관리자 권한이 없습니다.\", true);\n    return false;\n  }\n\n  return true;\n}\n\n/* 회원 목록 */\n\nasync function loadMembers() {\n\n  memberArea.hidden = true;\n\n  const { data, error } = await supabase\n    .from(\"profiles\")\n    .select(\n      \"id, full_name, email, member_role, \" +\n      \"member_grade, admin_level, approval_status\"\n    )\n    .order(\"created_at\", { ascending: false });\n\n  if (error) {\n    showMessage(\n      \"회원 목록 조회 실패:\\n\" + error.message,\n      true\n    );\n    return;\n  }\n\n  memberList.replaceChildren();\n\n  for (const member of data || []) {\n\n    const row = document.createElement(\"tr\");\n\n    addCell(row, member.full_name);\n    addCell(row, member.email);\n    addCell(row, member.member_role);\n\n    addCell(\n      row,\n      member.member_grade === \"grade1\"\n        ? \"1급회원\"\n        : \"일반회원\"\n    );\n\n    addCell(\n      row,\n      member.admin_level === \"super_admin\"\n        ? \"최고관리자\"\n        : member.admin_level === \"admin\"\n          ? \"관리자\"\n          : \"없음\"\n    );\n\n    addCell(row, member.approval_status);\n\n    const actions = document.createElement(\"td\");\n\n    /* 기존 회원가입 승인·거절 */\n\n    if (\n      member.id !== currentAdminId &&\n      member.member_role === \"member\"\n    ) {\n\n      const approve = addButton(\n        actions,\n        \"가입 승인\",\n        \"approve\",\n        () => changeApproval(\n          member,\n          \"approved\"\n        )\n      );\n\n      approve.disabled =\n        member.approval_status === \"approved\";\n\n      const reject = addButton(\n        actions,\n        \"가입 거절\",\n        \"reject\",\n        () => changeApproval(\n          member,\n          \"rejected\"\n        )\n      );\n\n      reject.disabled =\n        member.approval_status === \"rejected\";\n    }\n\n    /* 최고관리자 전용 관리자 지정·취소 */\n\n    if (\n      isSuperAdmin &&\n      member.id !== currentAdminId &&\n      member.approval_status === \"approved\"\n    ) {\n\n      if (\n        member.member_role === \"member\" &&\n        member.admin_level === \"none\"\n      ) {\n        addButton(\n          actions,\n          \"관리자로 지정\",\n          \"approve\",\n          () => changeAdminRole(member, \"grant\")\n        );\n      }\n\n      if (\n        member.member_role === \"admin\" &&\n        member.admin_level === \"admin\"\n      ) {\n        addButton(\n          actions,\n          \"관리자 권한 취소\",\n          \"reject\",\n          () => changeAdminRole(member, \"revoke\")\n        );\n      }\n    }\n\n    if (!actions.hasChildNodes()) {\n      actions.textContent = \"변경 권한 없음\";\n    }\n\n    row.appendChild(actions);\n    memberList.appendChild(row);\n  }\n\n  memberArea.hidden = false;\n\n  showMessage(\n    `회원 ${(data || []).length}명의 정보를 불러왔습니다.`\n  );\n}\n\n/* 기존 회원가입 승인·거절 */\n\nasync function changeApproval(member, status) {\n\n  if (busy) return;\n\n  const label =\n    status === \"approved\" ? \"승인\" : \"거절\";\n\n  if (!confirm(\n    `${member.full_name || \"해당 회원\"}님의 가입을 ${label}하시겠습니까?`\n  )) return;\n\n  setBusy(true);\n\n  try {\n\n    const { error } = await supabase.rpc(\n      \"manage_member_approval\",\n      {\n        target_user_id: member.id,\n        new_status: status\n      }\n    );\n\n    if (error) throw error;\n\n    await loadMembers();\n\n    showMessage(`회원가입 ${label} 완료`);\n\n  } catch (error) {\n\n    showMessage(\n      \"회원가입 처리 실패:\\n\" + error.message,\n      true\n    );\n\n  } finally {\n    setBusy(false);\n  }\n}\n\n/* 관리자 지정·취소 */\n\nasync function changeAdminRole(member, action) {\n\n  if (busy || !isSuperAdmin) return;\n\n  const label =\n    action === \"grant\"\n      ? \"관리자로 지정\"\n      : \"관리자 권한 취소\";\n\n  if (!confirm(\n    `${member.full_name || \"해당 회원\"}님의 ${label}를 진행하시겠습니까?`\n  )) return;\n\n  setBusy(true);\n\n  try {\n\n    const { error } = await supabase.rpc(\n      \"manage_admin_role\",\n      {\n        p_target_user_id: member.id,\n        p_action: action,\n        p_reason: \"최고관리자 직접 처리\"\n      }\n    );\n\n    if (error) throw error;\n\n    await loadMembers();\n\n    showMessage(`${label} 완료`);\n\n  } catch (error) {\n\n    showMessage(\n      \"관리자 권한 변경 실패:\\n\" + error.message,\n      true\n    );\n\n  } finally {\n    setBusy(false);\n  }\n}\n\n/* 증빙자료 열람 */\n\nasync function viewEvidence(path) {\n\n  if (!isSuperAdmin || !path) return;\n\n  const { data, error } =\n    await supabase.storage\n      .from(\"member-verification\")\n      .createSignedUrl(path, 60);\n\n  if (error) {\n    alert(\"증빙자료 열람 실패:\\n\" + error.message);\n    return;\n  }\n\n  window.open(\n    data.signedUrl,\n    \"_blank\",\n    \"noopener,noreferrer\"\n  );\n}\n\n/* 1급회원 승급 신청 목록 */\n\nasync function loadUpgradeRequests() {\n\n  if (!isSuperAdmin) return;\n\n  upgradePanel.hidden = false;\n\n  const { data, error } =\n    await supabase.rpc(\"get_grade1_requests\");\n\n  if (error) {\n    upgradeMessage.textContent =\n      \"승급 신청 조회 실패: \" + error.message;\n    return;\n  }\n\n  upgradeList.replaceChildren();\n\n  for (const request of data || []) {\n\n    const row = document.createElement(\"tr\");\n\n    addCell(row, request.full_name);\n    addCell(row, request.phone);\n    addCell(row, request.organization);\n    addCell(row, request.position_title);\n    addCell(row, request.status);\n\n    const actions = document.createElement(\"td\");\n\n    if (request.evidence_path) {\n      addButton(\n        actions,\n        \"📄 증빙자료 확인\",\n        \"secondary\",\n        () => viewEvidence(request.evidence_path)\n      );\n    }\n\n    if (request.status === \"pending\") {\n\n      /*\n       * 서버 측 증빙자료 검증이 완료되기 전까지\n       * 승급 승인 버튼은 비활성화합니다.\n       */\n\n      const approve = addButton(\n        actions,\n        \"승급 승인\",\n        \"approve\",\n        () => reviewUpgrade(\n          request.request_id,\n          \"approve\"\n        )\n      );\n\n      approve.disabled = true;\n      approve.title =\n        \"증빙자료 서버 검증 완료 후 활성화\";\n\n      addButton(\n        actions,\n        \"보완 요청\",\n        \"secondary\",\n        () => reviewUpgrade(\n          request.request_id,\n          \"request_revision\"\n        )\n      );\n\n      addButton(\n        actions,\n        \"승급 거절\",\n        \"reject\",\n        () => reviewUpgrade(\n          request.request_id,\n          \"reject\"\n        )\n      );\n    }\n\n    row.appendChild(actions);\n    upgradeList.appendChild(row);\n  }\n\n  upgradeMessage.textContent =\n    `승급 신청 ${(data || []).length}건을 불러왔습니다.`;\n}\n\n/* 승급 심사 */\n\nasync function reviewUpgrade(requestId, action) {\n\n  if (busy || !isSuperAdmin) return;\n\n  /*\n   * 검증 전 승급 승인 차단\n   */\n  if (action === \"approve\") {\n    alert(\n      \"증빙자료 서버 검증이 완료되지 않아 \" +\n      \"승급 승인을 사용할 수 없습니다.\"\n    );\n    return;\n  }\n\n  const labels = {\n    reject: \"승급 거절\",\n    request_revision: \"자료 보완 요청\"\n  };\n\n  const label = labels[action];\n\n  if (!label) return;\n\n  if (!confirm(`${label} 처리하시겠습니까?`)) {\n    return;\n  }\n\n  const note = prompt(\"심사 의견을 입력하세요.\", \"\");\n\n  if (note === null) return;\n\n  setBusy(true);\n\n  try {\n\n    const { error } = await supabase.rpc(\n      \"review_grade1_upgrade\",\n      {\n        p_request_id: requestId,\n        p_action: action,\n        p_review_note: note\n      }\n    );\n\n    if (error) throw error;\n\n    await loadUpgradeRequests();\n\n    alert(`${label} 완료`);\n\n  } catch (error) {\n\n    alert(\n      \"승급 심사 실패:\\n\" + error.message\n    );\n\n  } finally {\n    setBusy(false);\n  }\n}\n\n/* 로그아웃 */\n\nnavLogout.addEventListener(\"click\", async () => {\n\n  const { error } = await supabase.auth.signOut();\n\n  if (error) {\n    alert(\"로그아웃 실패: \" + error.message);\n    return;\n  }\n\n  window.location.href = \"index.html\";\n});\n\n/* 초기화 */\n\nasync function initialize() {\n\n  try {\n\n    const allowed = await checkAdmin();\n\n    if (!allowed) return;\n\n    await loadMembers();\n\n    if (isSuperAdmin) {\n      await loadUpgradeRequests();\n    }\n\n  } catch (error) {\n\n    showMessage(\n      \"관리자 화면 실행 오류:\\n\" + error.message,\n      true\n    );\n  }\n}\n\ninitialize();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "view=knowledge-access": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>1급 자료 열람 권한 및 기록 관리</title>\n\n<style>\n*{box-sizing:border-box}\nbody{\n  margin:0;\n  font-family:\"Malgun Gothic\",Arial,sans-serif;\n  background:#f4f8fc;\n  color:#17315b;\n  line-height:1.7;\n}\nheader{\n  background:#0754a6;\n  color:white;\n  text-align:center;\n  padding:30px 15px;\n}\nheader h1{margin:0;font-size:28px}\nheader p{margin:10px 0}\nmain{\n  max-width:1100px;\n  margin:35px auto;\n  padding:0 18px;\n}\nsection{\n  background:white;\n  padding:28px;\n  border-radius:12px;\n  margin-bottom:25px;\n  box-shadow:0 3px 12px #00000012;\n}\nh2{color:#0754a6;margin-top:0}\nh3{color:#17315b}\nbutton,.link{\n  display:inline-block;\n  background:#0754a6;\n  color:white;\n  border:0;\n  border-radius:7px;\n  padding:11px 18px;\n  margin:5px 5px 5px 0;\n  font-size:15px;\n  font-weight:bold;\n  cursor:pointer;\n  text-decoration:none;\n}\nbutton:hover,.link:hover{background:#063e7a}\nbutton:disabled{opacity:.5;cursor:not-allowed}\n.danger{background:#b42318}\n.danger:hover{background:#861b14}\nselect,input{\n  width:100%;\n  padding:12px;\n  border:1px solid #cbd5e1;\n  border-radius:7px;\n  font-size:15px;\n  margin:8px 0 15px;\n}\nlabel{display:block;font-weight:bold}\n.status{\n  background:#eef4fb;\n  padding:16px;\n  border-radius:8px;\n  white-space:pre-line;\n  margin-top:15px;\n}\n.success{background:#e8f5e9;color:#176534}\n.failure{background:#fff1f2;color:#991b1b}\n.grid{\n  display:grid;\n  grid-template-columns:1fr 1fr;\n  gap:20px;\n}\ntable{\n  width:100%;\n  border-collapse:collapse;\n  margin-top:15px;\n  font-size:14px;\n}\nth,td{\n  border:1px solid #dce6f2;\n  padding:10px;\n  text-align:left;\n}\nth{background:#eef4fb}\n.table-wrap{overflow-x:auto}\n[hidden]{display:none!important}\nfooter{\n  text-align:center;\n  background:#10315e;\n  color:white;\n  padding:25px;\n}\n@media(max-width:700px){\n  .grid{grid-template-columns:1fr}\n  section{padding:20px}\n}\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"admin-center.html\"><span aria-hidden=\"true\">←</span>관리센터로</a></div>\n\n\n<header>\n<a href=\"admin.html?view=admin-test\">통합 회원관리로 돌아가기</a>\n<h1>1급 자료 열람 권한 및 기록 관리</h1>\n<p>최고관리자용 · 자료별 열람 승인, 권한 회수 및 열람기록 조회</p>\n\n</header>\n\n<main>\n\n<section>\n<h2>① 관리자 인증</h2>\n<div id=\"adminStatus\" class=\"status\">\n관리자 권한 확인 중...\n</div>\n</section>\n\n<div id=\"adminContent\" hidden>\n<section>\n  <h2>1급 자료 접근 신청 심사</h2>\n  <label>신청 상태\n    <select id=\"requestFilter\">\n      <option value=\"pending\">심사 대기</option>\n      <option value=\"approved\">승인</option>\n      <option value=\"rejected\">거절</option>\n      <option value=\"cancelled\">취소</option>\n      <option value=\"\">전체</option>\n    </select>\n  </label>\n  <label>승인 만료일 (선택) <input type=\"date\" id=\"requestExpiry\"></label>\n  <button type=\"button\" id=\"refreshRequests\">신청 목록 새로고침</button>\n  <p id=\"requestStatus\" role=\"status\"></p><p id=\"requestOutcome\" role=\"status\"></p>\n  <div class=\"table-wrap\"><table>\n    <thead><tr><th>신청자</th><th>자료</th><th>신청 사유</th><th>상태</th><th>신청일</th><th>심사 사유</th><th>처리</th></tr></thead>\n    <tbody id=\"requestRows\"></tbody>\n  </table></div>\n</section>\n<section>\n  <h2>열람 권한 처리 이력</h2>\n  <button type=\"button\" id=\"loadDecisionHistory\">처리 이력 조회</button>\n  <p id=\"decisionStatus\" role=\"status\"></p>\n  <div class=\"table-wrap\"><table>\n    <thead><tr><th>조치</th><th>대상 회원</th><th>자료</th><th>처리자 ID</th></tr></thead>\n    <tbody id=\"decisionRows\"></tbody>\n  </table></div>\n</section>\n\n<section>\n<h2>② 회원 및 자료 선택</h2>\n\n<div class=\"grid\">\n\n<div>\n<label for=\"memberSelect\">승인 회원</label>\n<select id=\"memberSelect\">\n<option value=\"\">회원을 선택하세요</option>\n</select>\n</div>\n\n<div>\n<label for=\"documentSelect\">1급 자료</label>\n<select id=\"documentSelect\">\n<option value=\"\">자료를 선택하세요</option>\n</select>\n</div>\n\n</div>\n\n<button id=\"refreshButton\">목록 새로고침</button>\n\n<div id=\"selectionStatus\" class=\"status\">\n회원과 자료를 선택해 주세요.\n</div>\n</section>\n\n<section>\n<h2>③ 1급 자료별 열람 승인</h2>\n\n<p>\n신원확인이 완료된 회원에게 특정 1급 자료의\n열람 권한을 부여합니다.\n</p>\n\n<label for=\"expiryDate\">\n승인 만료일 (선택)\n</label>\n\n<input type=\"date\" id=\"expiryDate\">\n\n<button id=\"approveButton\">\n자료 열람 승인\n</button>\n\n<button id=\"revokeButton\" class=\"danger\">\n자료 열람 승인 취소\n</button>\n\n<div id=\"approvalResult\" class=\"status\">\n처리 대기 중\n</div>\n</section>\n\n<section>\n<h2>④ 자료별 승인 현황</h2>\n\n<button id=\"loadApprovalsButton\">\n승인 현황 조회\n</button>\n\n<div class=\"table-wrap\">\n<table>\n<thead>\n<tr>\n<th>회원</th>\n<th>자료</th>\n<th>상태</th>\n<th>승인일</th>\n<th>만료일</th>\n</tr>\n</thead>\n<tbody id=\"approvalTable\">\n<tr><td colspan=\"5\">조회 전</td></tr>\n</tbody>\n</table>\n</div>\n</section>\n\n<section>\n<h2>⑤ 1급 자료 열람기록</h2>\n\n<button id=\"loadLogsButton\">\n열람기록 조회\n</button>\n\n<div class=\"table-wrap\">\n<table>\n<thead>\n<tr>\n<th>회원</th>\n<th>자료</th>\n<th>접근 유형</th>\n<th>요청 시각</th>\n</tr>\n</thead>\n<tbody id=\"logTable\">\n<tr><td colspan=\"4\">조회 전</td></tr>\n</tbody>\n</table>\n</div>\n</section>\n\n</div>\n</main>\n\n<footer>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</footer>\n\n\u003cscript type=\"module\">\n\nimport {createClient} from\n\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\nconst SUPABASE_URL =\n\"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n\"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase=createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\nconst $=id=>document.getElementById(id);\n\nlet members=[];\nlet documents=[];\nlet verifications=[];\nlet approvals=[];\n\nfunction message(id,text,success=null){\n  const el=$(id);\n  el.textContent=text;\n  el.className=\"status\";\n  if(success===true)el.classList.add(\"success\");\n  if(success===false)el.classList.add(\"failure\");\n}\n\nfunction dateText(value){\n  return value\n    ?new Date(value).toLocaleString(\"ko-KR\")\n    :\"-\";\n}\n\nfunction selectedMember(){\n  return $(\"memberSelect\").value;\n}\n\nfunction selectedDocument(){\n  return Number($(\"documentSelect\").value);\n}\n\nfunction memberName(id){\n  const m=members.find(x=>x.id===id);\n  return m\n    ?(m.full_name||m.email||\"회원\")\n    :\"회원 정보 없음\";\n}\n\nfunction documentName(id){\n  const d=documents.find(x=>x.id===id);\n  return d?d.title:\"자료 \"+id;\n}\n\nfunction requireSelection(needDocument=false){\n  if(!selectedMember()){\n    alert(\"회원을 선택해 주세요.\");\n    return false;\n  }\n  if(needDocument&&!selectedDocument()){\n    alert(\"1급 자료를 선택해 주세요.\");\n    return false;\n  }\n  return true;\n}\n\nfunction setBusy(busy){\n  document.querySelectorAll(\n    \"#adminContent button\"\n  ).forEach(button=>{\n    button.disabled=busy;\n  });\n}\n\nasync function initialize(){\n\n  try{\n\n    const {data,error}=\n      await supabase.auth.getUser();\n\n    if(error||!data.user){\n      message(\n        \"adminStatus\",\n        \"로그인이 필요합니다.\",\n        false\n      );\n      return;\n    }\n\n    const {data:isAdmin,error:adminError}=\n      await supabase.rpc(\"is_super_admin\");\n\n    if(adminError)throw adminError;\n\n    if(isAdmin!==true){\n      message(\n        \"adminStatus\",\n        \"최고관리자 권한이 필요합니다.\",\n        false\n      );\n      return;\n    }\n\n    message(\n      \"adminStatus\",\n      \"관리자 인증 완료\",\n      true\n    );\n\n    $(\"adminContent\").hidden=false;\n\n    await loadData();\n    await loadAccessRequests();\n\n  }catch(error){\n\n    message(\n      \"adminStatus\",\n      \"관리자 인증 오류: \"+error.message,\n      false\n    );\n\n  }\n}\n\nasync function loadData(){\n\n  setBusy(true);\n\n  try{\n\n    const [\n      memberResult,\n      documentResult,\n      verificationResult,\n      approvalResult\n    ]=await Promise.all([\n\n      supabase\n        .from(\"profiles\")\n        .select(\n          \"id,full_name,email,member_role,approval_status\"\n        )\n        .eq(\"approval_status\",\"approved\")\n        .order(\"full_name\"),\n\n      supabase\n        .from(\"knowledge_documents\")\n        .select(\"id,title,security_grade\")\n        .eq(\"security_grade\",1)\n        .is(\"deleted_at\",null)\n        .order(\"id\"),\n\n      supabase\n        .from(\"knowledge_member_verifications\")\n        .select(\"user_id,is_verified\"),\n\n      supabase\n        .from(\"knowledge_access_approvals\")\n        .select(\n          \"document_id,user_id,is_active,expires_at,approved_at\"\n        )\n\n    ]);\n\n    for(const r of [\n      memberResult,\n      documentResult,\n      verificationResult,\n      approvalResult\n    ]){\n      if(r.error)throw r.error;\n    }\n\n    members=memberResult.data||[];\n    documents=documentResult.data||[];\n    verifications=verificationResult.data||[];\n    approvals=approvalResult.data||[];\n\n    const previousMember=selectedMember();\n    const previousDocument=$(\"documentSelect\").value;\n\n    $(\"memberSelect\").replaceChildren(\n      new Option(\"회원을 선택하세요\",\"\"),\n      ...members.map(m=>\n        new Option(\n          (m.full_name||m.email||\"회원\")+\n          \" (\"+m.member_role+\")\",\n          m.id\n        )\n      )\n    );\n\n    $(\"documentSelect\").replaceChildren(\n      new Option(\"자료를 선택하세요\",\"\"),\n      ...documents.map(d=>\n        new Option(d.title,d.id)\n      )\n    );\n\n    $(\"memberSelect\").value=previousMember;\n    $(\"documentSelect\").value=previousDocument;\n\n    updateSelection();\n\n    message(\n      \"selectionStatus\",\n      \"회원 \"+members.length+\"명, \"+\n      \"1급 자료 \"+documents.length+\"건 조회 완료\",\n      true\n    );\n\n  }catch(error){\n\n    message(\n      \"selectionStatus\",\n      \"목록 조회 실패: \"+error.message,\n      false\n    );\n\n  }finally{\n    setBusy(false);\n  }\n}\n\nfunction updateSelection(){\n\n  const userId=selectedMember();\n  const documentId=selectedDocument();\n\n  if(!userId)return;\n\n  const verified=verifications.some(\n    v=>v.user_id===userId&&v.is_verified===true\n  );\n\n  const approval=approvals.find(\n    a=>a.user_id===userId&&\n       a.document_id===documentId\n  );\n\n  const valid=approval?.is_active===true&&\n    (!approval.expires_at||\n      new Date(approval.expires_at)>new Date());\n\n  message(\n    \"selectionStatus\",\n    \"회원: \"+memberName(userId)+\"\\n\"+\n    \"신원확인: \"+(verified?\"완료\":\"미완료\")+\"\\n\"+\n    \"선택 자료: \"+\n    (documentId?documentName(documentId):\"없음\")+\"\\n\"+\n    \"자료별 승인: \"+\n    (valid?\"유효\":\"없음 또는 만료\")\n  );\n}\n\nasync function approveAccess(){\n\n  if(!requireSelection(true))return;\n\n  const userId=selectedMember();\n  const documentId=selectedDocument();\n\n  const expiry=$(\"expiryDate\").value;\n\n  let expiresAt=null;\n\n  if(expiry){\n    const date=new Date(expiry+\"T23:59:59\");\n    if(date<=new Date()){\n      alert(\"미래의 만료일을 선택해 주세요.\");\n      return;\n    }\n    expiresAt=date.toISOString();\n  }\n\n  if(!confirm(\"선택한 자료의 열람을 승인하시겠습니까?\")){\n    return;\n  }\n\n  setBusy(true);\n\n  try{\n\n    const {data,error}=await supabase.rpc(\n      \"admin_approve_knowledge_access\",\n      {\n        p_document_id:documentId,\n        p_user_id:userId,\n        p_expires_at:expiresAt\n      }\n    );\n\n    if(error)throw error;\n    if(data!==true)throw new Error(\"승인 결과 확인 실패\");\n\n    message(\n      \"approvalResult\",\n      \"자료별 열람 승인 완료\",\n      true\n    );\n\n    await loadData();\n\n  }catch(error){\n\n    message(\n      \"approvalResult\",\n      error.message,\n      false\n    );\n\n  }finally{\n    setBusy(false);\n  }\n}\n\nasync function revokeAccess(){\n\n  if(!requireSelection(true))return;\n\n  const userId=selectedMember();\n  const documentId=selectedDocument();\n\n  if(!confirm(\"선택한 자료의 열람 승인을 취소하시겠습니까?\")){\n    return;\n  }\n\n  setBusy(true);\n\n  try{\n\n    const {data,error}=await supabase.rpc(\n      \"admin_revoke_knowledge_access\",\n      {\n        p_document_id:documentId,\n        p_user_id:userId\n      }\n    );\n\n    if(error)throw error;\n    if(data!==true)throw new Error(\"취소 결과 확인 실패\");\n\n    message(\n      \"approvalResult\",\n      \"자료별 열람 승인 취소 완료\",\n      true\n    );\n\n    await loadData();\n\n  }catch(error){\n\n    message(\n      \"approvalResult\",\n      error.message,\n      false\n    );\n\n  }finally{\n    setBusy(false);\n  }\n}\n\nfunction renderTable(id,rows,columns){\n\n  const tbody=$(id);\n  tbody.replaceChildren();\n\n  if(!rows.length){\n    const tr=document.createElement(\"tr\");\n    const td=document.createElement(\"td\");\n    td.colSpan=columns;\n    td.textContent=\"조회된 기록이 없습니다.\";\n    tr.appendChild(td);\n    tbody.appendChild(tr);\n    return;\n  }\n\n  rows.forEach(row=>{\n    const tr=document.createElement(\"tr\");\n    row.forEach(value=>{\n      const td=document.createElement(\"td\");\n      td.textContent=String(value??\"-\");\n      tr.appendChild(td);\n    });\n    tbody.appendChild(tr);\n  });\n}\n\nasync function loadApprovals(){\n\n  try{\n\n    const {data,error}=await supabase\n      .from(\"knowledge_access_approvals\")\n      .select(\n        \"user_id,document_id,is_active,approved_at,expires_at\"\n      )\n      .order(\"approved_at\",{ascending:false})\n      .limit(100);\n\n    if(error)throw error;\n\n    renderTable(\n      \"approvalTable\",\n      (data||[]).map(a=>[\n        memberName(a.user_id),\n        documentName(a.document_id),\n        a.is_active?\"승인\":\"취소\",\n        dateText(a.approved_at),\n        dateText(a.expires_at)\n      ]),\n      5\n    );\n\n  }catch(error){\n    alert(\"승인 현황 조회 실패: \"+error.message);\n  }\n}\n\nasync function loadLogs(){\n\n  try{\n\n    const {data,error}=await supabase\n      .from(\"knowledge_access_logs\")\n      .select(\n        \"user_id,document_id,access_type,accessed_at\"\n      )\n      .order(\"accessed_at\",{ascending:false})\n      .limit(100);\n\n    if(error)throw error;\n\n    renderTable(\n      \"logTable\",\n      (data||[]).map(log=>[\n        memberName(log.user_id),\n        documentName(log.document_id),\n        log.access_type,\n        dateText(log.accessed_at)\n      ]),\n      4\n    );\n\n  }catch(error){\n    alert(\"열람기록 조회 실패: \"+error.message);\n  }\n}\n\n$(\"memberSelect\").addEventListener(\n  \"change\",updateSelection\n);\n\n$(\"documentSelect\").addEventListener(\n  \"change\",updateSelection\n);\n\n$(\"refreshButton\").addEventListener(\n  \"click\",loadData\n);\n\n$(\"approveButton\").addEventListener(\n  \"click\",approveAccess\n);\n\n$(\"revokeButton\").addEventListener(\n  \"click\",revokeAccess\n);\n\n$(\"loadApprovalsButton\").addEventListener(\n  \"click\",loadApprovals\n);\n\n$(\"loadLogsButton\").addEventListener(\n  \"click\",loadLogs\n);\nlet reviewing = false;\nasync function loadAccessRequests() {\n  const status = $(\"requestFilter\").value || null;\n  const body = $(\"requestRows\");\n  body.replaceChildren();\n  try {\n    const { data, error } = await supabase.rpc(\"admin_list_knowledge_access_requests\", { p_status: status });\n    if (error) throw error;\n    if (($(\"requestFilter\").value || null) !== status) return;\n    for (const req of data || []) {\n      const tr = document.createElement(\"tr\");\n      for (const value of [req.member_name || req.member_email || req.user_id, req.document_title,\n        req.request_reason, { pending: \"대기\", approved: \"승인\", rejected: \"거절\", cancelled: \"취소\" }[req.request_status] || req.request_status,\n        dateText(req.requested_at), req.review_reason]) {\n        const td = document.createElement(\"td\");\n        td.textContent = value ?? \"\";\n        tr.append(td);\n      }\n      const actions = document.createElement(\"td\");\n      if (req.request_status === \"pending\") {\n        for (const [decision, label] of [[\"approve\", \"승인\"], [\"reject\", \"거절\"]]) {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.textContent = label;\n          button.onclick = () => reviewAccess(req, decision, label);\n          actions.append(button);\n        }\n      }\n      tr.append(actions);\n      body.append(tr);\n    }\n    $(\"requestStatus\").textContent = (data?.length ?? 0) + \"건\";\n  } catch (error) { $(\"requestStatus\").textContent = \"신청 조회 실패: \" + error.message; }\n}\n\nasync function reviewAccess(req, decision, label) {\n  if (reviewing) return;\n  const enteredReason = prompt(label + \" 사유를 입력하세요.\" + (decision === \"reject\" ? \" (필수)\" : \" (선택)\"), \"\");\n  if (enteredReason === null) return;\n  const reason = enteredReason.trim();\n  if ((decision === \"reject\" && !reason) || reason.length > 2000) {\n    $(\"requestStatus\").textContent = \"거절 사유는 필수이며, 처리 사유는 최대 2000자입니다.\";\n    return;\n  }\n  const expires = decision === \"approve\" && $(\"requestExpiry\").value\n    ? new Date($(\"requestExpiry\").value + \"T23:59:59\") : null;\n  if (expires && (!(expires > new Date()))) {\n    $(\"requestStatus\").textContent = \"미래의 만료일을 입력하세요.\";\n    return;\n  }\n  if (!confirm(\"신청 #\" + req.request_id + \"을 \" + label + \"하시겠습니까?\")) return;\n  reviewing = true;\n  try {\n    const { data, error } = await supabase.rpc(\"admin_review_knowledge_access_request\", {\n      p_request_id: req.request_id, p_decision: decision, p_reason: reason || null,\n      p_expires_at: expires ? expires.toISOString() : null\n    });\n    if (error) throw error;\n    if (data !== true) throw new Error(\"서버에서 처리 결과를 확인할 수 없습니다.\");\n    await loadAccessRequests();\n    $(\"requestOutcome\").textContent = \"신청 #\" + req.request_id + \" \" + label + \" 완료\";\n  } catch (error) { $(\"requestOutcome\").textContent = label + \" 실패: \" + error.message; }\n  finally { reviewing = false; }\n}\n$(\"requestFilter\").addEventListener(\"change\", loadAccessRequests);\n$(\"refreshRequests\").addEventListener(\"click\", loadAccessRequests);\n$(\"loadDecisionHistory\").addEventListener(\"click\", async () => {\n  try {\n    const { data, error } = await supabase.from(\"knowledge_approval_history\")\n      .select(\"action_type,target_user_id,document_id,action_by\").limit(100);\n    if (error) throw error;\n    renderTable(\"decisionRows\", (data || []).map(row => [\n      { approve: \"승인\", reject: \"거절\", revoke: \"회수\" }[row.action_type] || row.action_type,\n      memberName(row.target_user_id), documentName(row.document_id), row.action_by\n    ]), 4);\n    $(\"decisionStatus\").textContent = (data?.length ?? 0) + \"건\";\n  } catch (error) { $(\"decisionStatus\").textContent = \"처리 이력 조회 실패: \" + error.message; }\n});\n\ninitialize();\n\n\u003c/script>\n</body>\n</html>\n"
}
</script>
<script>
(() => {
  const data = document.getElementById("page-variants");
  const pages = JSON.parse(data.textContent);
  const params = new URLSearchParams(window.location.search);
  const keys = ["view", "lang"].map(key => key + "=" + params.get(key));
  const selected = keys.find(key => Object.hasOwn(pages, key)) || "default";
  const page = pages[selected];
  const opening = /^\s*<!doctype html>\s*(<html\b[^>]*>)\s*<head\b[^>]*>/i.exec(page);

  // Keep the original URL and let the initial HTML parser run the page scripts.
  const root = new DOMParser().parseFromString(opening[1], "text/html").documentElement;
  for (const attribute of root.attributes) {
    document.documentElement.setAttribute(attribute.name, attribute.value);
  }
  data.remove();
  document.write(page.slice(opening[0].length));
})();
</script>
