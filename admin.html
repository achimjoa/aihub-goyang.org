tAdminId = null;\nlet isSuperAdmin = false;\nlet busy = false;\n\nfunction showMessage(text, isError = false) {\n  message.textContent = text;\n  message.style.color =\n    isError ? \"#b91c1c\" : \"#0754a6\";\n}\n\nfunction setBusy(value) {\n  busy = value;\n\n  document.querySelectorAll(\n    \"#memberArea button, #upgradePanel button\"\n  ).forEach(button => {\n    button.disabled = value;\n  });\n}\n\nfunction addCell(row, value) {\n  const cell = document.createElement(\"td\");\n  cell.textContent = value ?? \"\";\n  row.appendChild(cell);\n  return cell;\n}\n\nfunction addButton(parent, label, className, handler) {\n  const button = document.createElement(\"button\");\n\n  button.textContent = label;\n  button.className = className;\n\n  button.addEventListener(\"click\", handler);\n\n  parent.appendChild(button);\n\n  return button;\n}\n\n/* 로그인 및 관리자 권한 확인 */\n\nasync function checkAdmin() {\n\n  const { data: userData, error: userError } =\n    await supabase.auth.getUser();\n\n  const user = userError ? null : userData.user;\n\n  navLogin.hidden = !!user;\n  navSignup.hidden = !!user;\n  navLogout.hidden = !user;\n  navAdmin.hidden = true;\n\n  if (!user) {\n    showMessage(\"로그인이 필요합니다.\", true);\n    return false;\n  }\n\n  currentAdminId = user.id;\n\n  const { data: isAdmin, error } =\n    await supabase.rpc(\"is_admin\");\n\n  if (error || isAdmin !== true) {\n    showMessage(\"관리자 권한이 없습니다.\", true);\n    return false;\n  }\n\n  navAdmin.hidden = false;\n\n  const {\n    data: superAdmin,\n    error: superError\n  } = await supabase.rpc(\"is_super_admin\");\n\n  if (superError) {\n    showMessage(\n      \"최고관리자 권한 확인에 실패했습니다.\\n\" +\n      superError.message,\n      true\n    );\n    return false;\n  }\n\n  isSuperAdmin = superAdmin === true;\n\n  return true;\n}\n\n/* 회원 목록 */\n\nasync function loadMembers() {\n\n  memberArea.hidden = true;\n\n  const { data, error } = await supabase\n    .from(\"profiles\")\n    .select(\n      \"id, full_name, email, member_role, \" +\n      \"member_grade, admin_level, approval_status\"\n    )\n    .order(\"created_at\", { ascending: false });\n\n  if (error) {\n    showMessage(\n      \"회원 목록 조회 실패:\\n\" + error.message,\n      true\n    );\n    return;\n  }\n\n  memberList.replaceChildren();\n\n  for (const member of data || []) {\n\n    const row = document.createElement(\"tr\");\n\n    addCell(row, member.full_name);\n    addCell(row, member.email);\n    addCell(row, member.member_role);\n\n    addCell(\n      row,\n      member.member_grade === \"grade1\"\n        ? \"1급회원\"\n        : \"일반회원\"\n    );\n\n    addCell(\n      row,\n      member.admin_level === \"super_admin\"\n        ? \"최고관리자\"\n        : member.admin_level === \"admin\"\n          ? \"관리자\"\n          : \"없음\"\n    );\n\n    addCell(row, member.approval_status);\n\n    const actions = document.createElement(\"td\");\n\n    /* 기존 회원가입 승인·거절 */\n\n    if (\n      member.id !== currentAdminId &&\n      member.member_role === \"member\"\n    ) {\n\n      const approve = addButton(\n        actions,\n        \"가입 승인\",\n        \"approve\",\n        () => changeApproval(\n          member,\n          \"approved\"\n        )\n      );\n\n      approve.disabled =\n        member.approval_status === \"approved\";\n\n      const reject = addButton(\n        actions,\n        \"가입 거절\",\n        \"reject\",\n        () => changeApproval(\n          member,\n          \"rejected\"\n        )\n      );\n\n      reject.disabled =\n        member.approval_status === \"rejected\";\n    }\n\n    /* 최고관리자 전용 관리자 지정·취소 */\n\n    if (\n      isSuperAdmin &&\n      member.id !== currentAdminId &&\n      member.approval_status === \"approved\"\n    ) {\n\n      if (\n        member.member_role === \"member\" &&\n        member.admin_level === \"none\"\n      ) {\n        addButton(\n          actions,\n          \"관리자로 지정\",\n          \"approve\",\n          () => changeAdminRole(member, \"grant\")\n        );\n      }\n\n      if (\n        member.member_role === \"admin\" &&\n        member.admin_level === \"admin\"\n      ) {\n        addButton(\n          actions,\n          \"관리자 권한 취소\",\n          \"reject\",\n          () => changeAdminRole(member, \"revoke\")\n        );\n      }\n    }\n\n    if (!actions.hasChildNodes()) {\n      actions.textContent = \"변경 권한 없음\";\n    }\n\n    row.appendChild(actions);\n    memberList.appendChild(row);\n  }\n\n  memberArea.hidden = false;\n\n  showMessage(\n    `회원 ${(data || []).length}명의 정보를 불러왔습니다.`\n  );\n}\n\n/* 기존 회원가입 승인·거절 */\n\nasync function changeApproval(member, status) {\n\n  if (busy) return;\n\n  const label =\n    status === \"approved\" ? \"승인\" : \"거절\";\n\n  if (!confirm(\n    `${member.full_name || \"해당 회원\"}님의 가입을 ${label}하시겠습니까?`\n  )) return;\n\n  setBusy(true);\n\n  try {\n\n    const { error } = await supabase.rpc(\n      \"manage_member_approval\",\n      {\n        target_user_id: member.id,\n        new_status: status\n      }\n    );\n\n    if (error) throw error;\n\n    await loadMembers();\n\n    showMessage(`회원가입 ${label} 완료`);\n\n  } catch (error) {\n\n    showMessage(\n      \"회원가입 처리 실패:\\n\" + error.message,\n      true\n    );\n\n  } finally {\n    setBusy(false);\n  }\n}\n\n/* 관리자 지정·취소 */\n\nasync function changeAdminRole(member, action) {\n\n  if (busy || !isSuperAdmin) return;\n\n  const label =\n    action === \"grant\"\n      ? \"관리자로 지정\"\n      : \"관리자 권한 취소\";\n\n  if (!confirm(\n    `${member.full_name || \"해당 회원\"}님의 ${label}를 진행하시겠습니까?`\n  )) return;\n\n  setBusy(true);\n\n  try {\n\n    const { error } = await supabase.rpc(\n      \"manage_admin_role\",\n      {\n        p_target_user_id: member.id,\n        p_action: action,\n        p_reason: \"최고관리자 직접 처리\"\n      }\n    );\n\n    if (error) throw error;\n\n    await loadMembers();\n\n    showMessage(`${label} 완료`);\n\n  } catch (error) {\n\n    showMessage(\n      \"관리자 권한 변경 실패:\\n\" + error.message,\n      true\n    );\n\n  } finally {\n    setBusy(false);\n  }\n}\n\n/* 증빙자료 열람 */\n\nasync function viewEvidence(path) {\n\n  if (!isSuperAdmin || !path) return;\n\n  const { data, error } =\n    await supabase.storage\n      .from(\"member-verification\")\n      .createSignedUrl(path, 60);\n\n  if (error) {\n    alert(\"증빙자료 열람 실패:\\n\" + error.message);\n    return;\n  }\n\n  window.open(\n    data.signedUrl,\n    \"_blank\",\n    \"noopener,noreferrer\"\n  );\n}\n\n/* 1급회원 승급 신청 목록 */\n\nasync function loadUpgradeRequests() {\n\n  if (!isSuperAdmin) return;\n\n  upgradePanel.hidden = false;\n\n  const { data, error } =\n    await supabase.rpc(\"get_grade1_requests\");\n\n  if (error) {\n    upgradeMessage.textContent =\n      \"승급 신청 조회 실패: \" + error.message;\n    return;\n  }\n\n  upgradeList.replaceChildren();\n\n  for (const request of data || []) {\n\n    const row = document.createElement(\"tr\");\n\n    addCell(row, request.full_name);\n    addCell(row, request.phone);\n    addCell(row, request.organization);\n    addCell(row, request.position_title);\n    addCell(row, request.status);\n\n    const actions = document.createElement(\"td\");\n\n    if (request.evidence_path) {\n      addButton(\n        actions,\n        \"📄 증빙자료 확인\",\n        \"secondary\",\n        () => viewEvidence(request.evidence_path)\n      );\n    }\n\n    if (request.status === \"pending\") {\n\n      /*\n       * 서버 측 증빙자료 검증이 완료되기 전까지\n       * 승급 승인 버튼은 비활성화합니다.\n       */\n\n      const approve = addButton(\n        actions,\n        \"승급 승인\",\n        \"approve\",\n        () => reviewUpgrade(\n          request.request_id,\n          \"approve\"\n        )\n      );\n\n      approve.disabled = true;\n      approve.title =\n        \"증빙자료 서버 검증 완료 후 활성화\";\n\n      addButton(\n        actions,\n        \"보완 요청\",\n        \"secondary\",\n        () => reviewUpgrade(\n          request.request_id,\n          \"request_revision\"\n        )\n      );\n\n      addButton(\n        actions,\n        \"승급 거절\",\n        \"reject\",\n        () => reviewUpgrade(\n          request.request_id,\n          \"reject\"\n        )\n      );\n    }\n\n    row.appendChild(actions);\n    upgradeList.appendChild(row);\n  }\n\n  upgradeMessage.textContent =\n    `승급 신청 ${(data || []).length}건을 불러왔습니다.`;\n}\n\n/* 승급 심사 */\n\nasync function reviewUpgrade(requestId, action) {\n\n  if (busy || !isSuperAdmin) return;\n\n  /*\n   * 검증 전 승급 승인 차단\n   */\n  if (action === \"approve\") {\n    alert(\n      \"증빙자료 서버 검증이 완료되지 않아 \" +\n      \"승급 승인을 사용할 수 없습니다.\"\n    );\n    return;\n  }\n\n  const labels = {\n    reject: \"승급 거절\",\n    request_revision: \"자료 보완 요청\"\n  };\n\n  const label = labels[action];\n\n  if (!label) return;\n\n  if (!confirm(`${label} 처리하시겠습니까?`)) {\n    return;\n  }\n\n  const note = prompt(\"심사 의견을 입력하세요.\", \"\");\n\n  if (note === null) return;\n\n  setBusy(true);\n\n  try {\n\n    const { error } = await supabase.rpc(\n      \"review_grade1_upgrade\",\n      {\n        p_request_id: requestId,\n        p_action: action,\n        p_review_note: note\n      }\n    );\n\n    if (error) throw error;\n\n    await loadUpgradeRequests();\n\n    alert(`${label} 완료`);\n\n  } catch (error) {\n\n    alert(\n      \"승급 심사 실패:\\n\" + error.message\n    );\n\n  } finally {\n    setBusy(false);\n  }\n}\n\n/* 로그아웃 */\n\nnavLogout.addEventListener(\"click\", async () => {\n\n  const { error } = await supabase.auth.signOut();\n\n  if (error) {\n    alert(\"로그아웃 실패: \" + error.message);\n    return;\n  }\n\n  window.location.href = \"index.html\";\n});\n\n/* 초기화 */\n\nasync function initialize() {\n\n  try {\n\n    const allowed = await checkAdmin();\n\n    if (!allowed) return;\n\n    await loadMembers();\n\n    if (isSuperAdmin) {\n      await loadUpgradeRequests();\n    }\n\n  } catch (error) {\n\n    showMessage(\n      \"관리자 화면 실행 오류:\\n\" + error.message,\n      true\n    );\n  }\n}\n\ninitialize();\n\n\u003c/script>\n\n</body>\n</html>\n"
}
</script>
<script>
(() => {
  const data = document.getElementById("page-variants");
  const pages = JSON.parse(data.textContent);
  const params = new URLSearchParams(window.location.search);
  const keys = ["view", "lang"].map(key => key + "=" + params.get(key));
  const selected = keys.find(key => Object.hasOwn(pages, key)) || "default";
  const page = pages[selected];
  const opening = /^\s*<!doctype html>\s*(<html\b[^>]*>)\s*<head\b[^>]*>/i.exec(page);

  // Keep the original URL and let the initial HTML parser run the page scripts.
  const root = new DOMParser().parseFromString(opening[1], "text/html").documentElement;
  for (const attribute of root.attributes) {
    document.documentElement.setAttribute(attribute.name, attribute.value);
  }
  data.remove();
  document.write(page.slice(opening[0].length));
})();
</script>
