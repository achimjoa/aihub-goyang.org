<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>회원관리 | 글로벌 AI 허브</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Malgun Gothic", Arial, sans-serif;
  background: #f4f8fc;
  color: #17315b;
}

header {
  background: #0754a6;
  color: white;
  text-align: center;
  padding: 35px 15px;
}

header h1 {
  margin: 0 0 12px;
}

header p {
  line-height: 1.7;
}

.home-return {
  margin-top: 25px;
}

.home-return a {
  display: inline-block;
  padding: 12px 25px;
  margin: 5px;
  background: white;
  color: #0754a6;
  border-radius: 8px;
  font-weight: bold;
  text-decoration: none;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 35px 15px;
}

.admin-panel {
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
  color: #0754a6;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 25px;
}

th, td {
  border-bottom: 1px solid #dce6f2;
  padding: 14px;
  text-align: left;
}

th {
  background: #eaf4ff;
}

button {
  padding: 8px 14px;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  margin: 3px;
}

.approve {
  background: #0754a6;
  color: white;
}

.reject {
  background: #b91c1c;
  color: white;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#message {
  white-space: pre-line;
  margin-top: 20px;
}

footer {
  background: #10315e;
  color: white;
  text-align: center;
  padding: 30px 15px;
  margin-top: 40px;
  line-height: 1.8;
}

@media (max-width: 600px) {
  .admin-panel {
    padding: 18px;
  }

  th, td {
    padding: 10px;
    font-size: 13px;
  }
}
</style>
</head>

<body>

<header>
  <h1>관리자 회원관리</h1>

  <p>
    경기도 글로벌 AI 허브 유치<br>
    고양특례시 범시민추진위원회
  </p>

  <div class="home-return">

  <a href="index.html">
    ← 홈페이지로 돌아가기
  </a>

  <a href="admin-center.html">
    ← 통합 관리센터로 돌아가기
  </a>

</div>
</header>

<main>

<section class="admin-panel">

  <h2>회원가입 신청 관리</h2>

  <p>
    관리자만 회원가입 신청자를 확인하고
    승인하거나 거절할 수 있습니다.
  </p>

  <p id="message" role="status" aria-live="polite">
    관리자 권한을 확인하고 있습니다.
  </p>

  <div class="table-wrap" id="memberArea" hidden>

    <table>
      <thead>
        <tr>
          <th>이름</th>
          <th>이메일</th>
          <th>회원 역할</th>
          <th>승인 상태</th>
          <th>관리</th>
        </tr>
      </thead>

      <tbody id="memberList"></tbody>
    </table>

  </div>

</section>

<section class="admin-panel" id="upgradePanel"
         style="margin-top:25px" hidden>

  <h2>1급회원 승급 심사</h2>

  <p>최고관리자 전용 회원 승급 심사 화면입니다.</p>

  <p id="upgradeMessage" role="status"></p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>신청자</th>
          <th>전화번호</th>
          <th>소속</th>
          <th>직책</th>
          <th>신청 상태</th>
          <th>심사</th>
        </tr>
      </thead>

      <tbody id="upgradeList"></tbody>
    </table>
  </div>

</section>
      
</main>

<footer>
  경기도 글로벌 AI 허브 유치<br>
  고양특례시 범시민추진위원회
</footer>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* Supabase 연결 */

const SUPABASE_URL =
  "https://gugkwqpvtwivqudkimvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const message = document.getElementById("message");
const memberList = document.getElementById("memberList");
const memberArea = document.getElementById("memberArea");

let currentAdminId = null;
let busy = false;

let isSuperAdmin = false;

async function checkSuperAdmin() {
  const { data, error } =
    await supabase.rpc("is_super_admin");

  if (error) {
    throw new Error(
      "최고관리자 권한 확인 실패: " + error.message
    );
  }

async function changeAdminRole(
  memberId,
  memberName,
  action
) {
  if (busy || !isSuperAdmin) return;

  const actionName =
    action === "grant"
      ? "관리자로 지정"
      : "관리자 권한 취소";

  if (!confirm(
    `${memberName || "해당 회원"}님의 ${actionName}를 진행하시겠습니까?`
  )) {
    return;
  }

  busy = true;

  memberArea.querySelectorAll("button")
    .forEach(button => button.disabled = true);

  try {
    const { error } = await supabase.rpc(
      "manage_admin_role",
      {
        p_target_user_id: memberId,
        p_action: action,
        p_reason: "최고관리자 직접 처리"
      }
    );

    if (error) throw error;

    await loadMembers();

    showMessage(
      `${actionName} 처리가 완료되었습니다.`
    );

  } catch (error) {
    await loadMembers();

    showMessage(
      `${actionName} 처리 중 오류가 발생했습니다.\n` +
      error.message,
      true
    );
  } finally {
    busy = false;
  }
}
      
  isSuperAdmin = data === true;
}
      
/* 안내 메시지 */

function showMessage(text, isError = false) {
  message.textContent = text;
  message.style.color =
    isError ? "#b91c1c" : "#0754a6";
}

/* 관리자 확인 */

async function checkAdmin() {

  const { data: userData, error: userError } =
    await supabase.auth.getUser();

  if (userError || !userData.user) {
    showMessage(
      "로그인이 필요합니다. 로그인 페이지로 이동해 주세요.",
      true
    );
    return false;
  }

  currentAdminId = userData.user.id;

  const { data: isAdmin, error } =
    await supabase.rpc("is_admin");

  if (error) {
    showMessage(
      "관리자 권한 확인 중 오류가 발생했습니다.\n" +
      error.message,
      true
    );
    return false;
  }

  if (isAdmin !== true) {
    showMessage(
      "관리자 권한이 없습니다.",
      true
    );
    return false;
  }
async function loadUpgradeRequests() {

  if (!isSuperAdmin) return;

  const panel = document.getElementById("upgradePanel");
  const list = document.getElementById("upgradeList");
  const msg = document.getElementById("upgradeMessage");

  const { data, error } =
    await supabase.rpc("get_grade1_requests");

  if (error) {
    msg.textContent = error.message;
    return;
  }

  list.replaceChildren();

  for (const request of data) {

    const row = document.createElement("tr");

    const values = [
      request.full_name,
      request.phone,
      request.organization,
      request.position_title,
      request.status
    ];

    for (const value of values) {
      const td = document.createElement("td");
      td.textContent = value || "";
      row.appendChild(td);
    }

    const actionCell = document.createElement("td");

    if (request.status === "pending") {

      for (const [label, action] of [
        ["승급 승인", "approve"],
        ["보완 요청", "request_revision"],
        ["승급 거절", "reject"]
      ]) {

        const button = document.createElement("button");

        button.textContent = label;
        button.className =
          action === "approve" ? "approve" : "reject";

        button.addEventListener("click", () => {
          reviewUpgrade(request.request_id, action);
        });

        actionCell.appendChild(button);
      }
    }

    row.appendChild(actionCell);
    list.appendChild(row);
  }

  panel.hidden = false;
  msg.textContent = `승급 신청 ${data.length}건`;
}

async function reviewUpgrade(requestId, action) {

  if (!isSuperAdmin || busy) return;

  const labels = {
    approve: "승급 승인",
    reject: "승급 거절",
    request_revision: "자료 보완 요청"
  };

  const label = labels[action];

  if (!label) return;

  if (!confirm(`${label} 처리하시겠습니까?`)) {
    return;
  }

  const note = prompt(
    "심사 의견을 입력해 주세요.",
    ""
  );

  if (note === null) return;

  busy = true;

  try {

    const { error } = await supabase.rpc(
      "review_grade1_upgrade",
      {
        p_request_id: requestId,
        p_action: action,
        p_review_note: note
      }
    );

    if (error) throw error;

    await loadUpgradeRequests();

    alert(`${label} 처리가 완료되었습니다.`);

  } catch (error) {

    alert(
      "승급 심사 처리 중 오류가 발생했습니다.\n" +
      error.message
    );

  } finally {
    busy = false;
  }
}

async function viewEvidence(filePath) {

  if (!isSuperAdmin) {
    alert("최고관리자만 열람할 수 있습니다.");
    return;
  }

  if (!filePath) {
    alert("제출된 증빙자료가 없습니다.");
    return;
  }

  const { data, error } =
    await supabase.storage
      .from("member-verification")
      .createSignedUrl(filePath, 60);

  if (error) {
    alert(
      "증빙자료를 열 수 없습니다.\n" +
      error.message
    );
    return;
  }

  window.open(
    data.signedUrl,
    "_blank",
    "noopener,noreferrer"
  );
}
      
  return true;
}

/* 회원 목록 조회 */

async function loadMembers() {

  memberArea.hidden = true;

  const { data, error } =
    await supabase
      .from("profiles")
      .select(
  "id, full_name, email, member_role, " +
  "member_grade, admin_level, approval_status"
)
      .order("created_at", { ascending: false });

  if (error) {
    showMessage(
      "회원 목록을 불러오지 못했습니다.\n" +
      error.message,
      true
    );
    return;
  }

  memberList.replaceChildren();

  for (const member of data) {

    const row = document.createElement("tr");

    const values = [
      member.full_name || "",
      member.email || "",
      member.member_role || "",
      member.approval_status || ""
    ];

    for (const value of values) {
      const cell = document.createElement("td");
      cell.textContent = value;
      row.appendChild(cell);
    }

    const actionCell = document.createElement("td");

   if (request.evidence_path) {

  const evidenceButton =
    document.createElement("button");

  evidenceButton.textContent = "📄 증빙자료 확인";
  evidenceButton.className = "approve";

  evidenceButton.addEventListener("click", () => {
    viewEvidence(request.evidence_path);
  });

  actionCell.appendChild(evidenceButton);
}     

    if (
      member.id !== currentAdminId &&
      member.member_role === "member"
    ) {

      const approveButton =
        document.createElement("button");

      approveButton.textContent = "승인";
      approveButton.className = "approve";

      approveButton.disabled =
        member.approval_status === "approved";

      approveButton.addEventListener("click", () => {
        changeApproval(
          member.id,
          member.full_name,
          "approved"
        );
      });

      const rejectButton =
        document.createElement("button");

      rejectButton.textContent = "거절";
      rejectButton.className = "reject";

      rejectButton.disabled =
        member.approval_status === "rejected";

      rejectButton.addEventListener("click", () => {
        changeApproval(
          member.id,
          member.full_name,
          "rejected"
        );
      });

      actionCell.append(
        approveButton,
        rejectButton
      );

    } else {
      actionCell.textContent = "관리자 계정";
    }

if (
  isSuperAdmin &&
  member.id !== currentAdminId &&
  member.approval_status === "approved" &&
  member.admin_level !== "super_admin"
) {
  const roleButton =
    document.createElement("button");

  const isCurrentAdmin =
    member.member_role === "admin" &&
    member.admin_level === "admin";

  roleButton.textContent =
    isCurrentAdmin
      ? "관리자 권한 취소"
      : "관리자로 지정";

  roleButton.className =
    isCurrentAdmin ? "reject" : "approve";

  roleButton.addEventListener("click", () => {
    changeAdminRole(
      member.id,
      member.full_name,
      isCurrentAdmin ? "revoke" : "grant"
    );
  });

  actionCell.appendChild(roleButton);
}
        
    row.appendChild(actionCell);
    memberList.appendChild(row);
  }

  memberArea.hidden = false;

  showMessage(
    `회원 ${data.length}명의 정보를 불러왔습니다.`
  );
}

/* 승인 또는 거절 */

async function changeApproval(
  memberId,
  memberName,
  status
) {

  if (busy) return;

  const action =
    status === "approved" ? "승인" : "거절";

  const confirmed = confirm(
    `${memberName || "해당 회원"}님을 ${action}하시겠습니까?`
  );

  if (!confirmed) return;

  busy = true;

  memberArea.querySelectorAll("button")
    .forEach(button => button.disabled = true);

  try {

    const { error } = await supabase.rpc(
      "manage_member_approval",
      {
        target_user_id: memberId,
        new_status: status
      }
    );

    if (error) throw error;

    await loadMembers();

    showMessage(
      `회원 ${action} 처리가 완료되었습니다.`
    );

  } catch (error) {

    showMessage(
      `회원 ${action} 처리 중 오류가 발생했습니다.\n` +
      error.message,
      true
    );

    await loadMembers();

  } finally {

    busy = false;

  }
}

/* 최초 실행 */

async function initialize() {

  try {

    const isAdmin = await checkAdmin();

   if (isAdmin) {
  await checkSuperAdmin();
  await loadMembers();

  if (isSuperAdmin) {
    await loadUpgradeRequests();
  }
}

  } catch (error) {

    showMessage(
      "관리자 페이지를 불러오지 못했습니다.\n" +
      error.message,
      true
    );

  }
}

initialize();

</script>

</body>
</html>
