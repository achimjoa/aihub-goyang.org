ection id=\"intro\">\n\n<h2>1. 홈페이지에 오신 것을 환영합니다</h2>\n\n<p>\n경기도 글로벌 AI 허브 유치\n고양특례시 범시민추진위원회 홈페이지는\n글로벌 AI 허브 유치의 필요성을 알리고,\n시민의 관심과 참여를 모으기 위한\n공식 온라인 소통 창구입니다.\n</p>\n\n<p>\n홈페이지에서는 글로벌 AI 허브에 관한\n정보를 확인하고, 위원회의 활동을 살펴보며,\n다양한 시민참여 활동에 동참하실 수 있습니다.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n고양시에 성장동력을 달라!<br>\n고양시에 일자리를 달라!<br>\n글로벌 AI 허브는 고양특례시로!\n</strong>\n\n</div>\n\n<p>\nPC와 스마트폰에서 이용할 수 있으며,\n별도의 프로그램 설치 없이\n인터넷 브라우저로 접속할 수 있습니다.\n</p>\n\n</section>\n\n<section id=\"menus\">\n\n<h2>2. 주요 메뉴 안내</h2>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>위원회 소개</h3>\n\n<p>\n위원회의 설립 취지와\n활동 방향을 확인합니다.\n</p>\n\n<a class=\"button secondary\"\nhref=\"committee.html\">\n자세히 보기\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>글로벌 AI 허브</h3>\n\n<p>\n글로벌 AI 허브의 개념과\n국제협력 비전을 알아봅니다.\n</p>\n\n<a class=\"button secondary\"\nhref=\"hub.html\">\n자세히 보기\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>고양특례시 유치 경쟁력</h3>\n\n<p>\n고양특례시가 글로벌 AI 허브\n유치에 적합한 이유를 살펴봅니다.\n</p>\n\n<a class=\"button secondary\"\nhref=\"goyang.html\">\n자세히 보기\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>9개 국제기구</h3>\n\n<p>\n국제기구별 주요 역할과\nAI 협력 가능성을 확인합니다.\n</p>\n\n<a class=\"button secondary\"\nhref=\"agencies.html\">\n자세히 보기\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>유치 전략</h3>\n\n<p>\n초기 안착, 운영 지원,\n동반 성장의 3단계 전략을 소개합니다.\n</p>\n\n<a class=\"button secondary\"\nhref=\"strategy.html\">\n자세히 보기\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>시민참여센터</h3>\n\n<p>\n온라인 서명과 각종 시민참여\n신청을 안내합니다.\n</p>\n\n<a class=\"button\"\nhref=\"participate.html\">\n시민참여센터\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n<section id=\"participation\">\n\n<h2>3. 시민참여 방법</h2>\n\n<p>\n시민참여센터에서는\n다음 다섯 가지 참여 신청을\n이용하실 수 있습니다.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>① 온라인 유치 동의 서명</h3>\n\n<p>\n글로벌 AI 허브의 고양특례시 유치를\n지지하는 시민의 뜻을 모읍니다.\n</p>\n\n<ol class=\"steps\">\n<li>온라인 서명 버튼을 선택합니다.</li>\n<li>신청서의 필수 정보를 입력합니다.</li>\n<li>개인정보 관련 안내를 확인합니다.</li>\n<li>제출 버튼을 누릅니다.</li>\n</ol>\n\n<a class=\"button\"\nhref=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\n온라인 서명 참여\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>② 범시민추진위원 등록</h3>\n\n<p>\n글로벌 AI 허브 유치운동에\n적극적으로 참여하고자 하는 시민은\n추진위원 등록을 신청할 수 있습니다.\n</p>\n\n<p>\n성명, 전화번호, 행정동,\n소속 단체 등 신청서에서\n요구하는 정보를 입력합니다.\n</p>\n\n<a class=\"button\"\nhref=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\n추진위원 등록\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>③ 후원회원 가입</h3>\n\n<p>\n글로벌 AI 허브 유치 활동을\n후원하고자 하는 분은\n후원회원 가입을 신청할 수 있습니다.\n</p>\n\n<p>\n신청서를 제출한 후\n홈페이지에 표시된 공식 계좌정보와\n납부 안내를 확인해 주세요.\n</p>\n\n<a class=\"button\"\nhref=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\n후원회원 가입\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>④ 홍보현수막 게시 신청</h3>\n\n<p>\n글로벌 AI 허브 유치 홍보를 위한\n현수막 게시를 신청할 수 있습니다.\n</p>\n\n<p>\n게시 장소와 관련 법령,\n게시 가능 여부를 확인해 주세요.\n</p>\n\n<a class=\"button\"\nhref=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\n현수막 게시 신청\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>⑤ 차량 홍보 스티커 신청</h3>\n\n<p>\n차량을 이용한 유치 홍보에\n참여하고자 하는 시민은\n홍보 스티커를 신청할 수 있습니다.\n</p>\n\n<p>\n성명, 전화번호, 행정동,\n신청 수량 등 필요한 정보를\n입력합니다.\n</p>\n\n<a class=\"button\"\nhref=\"https://forms.gle/cisRHEsN61pxVycG8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\n차량 스티커 신청\n</a>\n\n</div>\n\n</div>\n\n<p class=\"note\">\n※ 신청 가능 여부와 실제 처리 일정은\n위원회의 운영 상황에 따라 달라질 수 있습니다.\n</p>\n\n</section>\n\n<section id=\"account\">\n\n<h2>4. 후원회비 및 현수막 비용 안내</h2>\n\n<p>\n후원회원 가입이나 홍보현수막 게시 신청 후\n비용을 납부하려는 경우,\n시민참여센터에 표시된 공식 계좌정보를\n확인하시기 바랍니다.\n</p>\n\n<div class=\"highlight\">\n\n<strong>입금 전 확인사항</strong>\n\n<p>\n은행명, 계좌번호, 예금주를\n반드시 확인해 주세요.\n</p>\n\n<p>\n신청서 제출과 실제 입금은\n별도의 절차입니다.\n</p>\n\n<p>\n계좌정보가 표시되지 않거나\n내용이 불분명한 경우에는\n임의로 입금하지 마시고\n공식 안내를 확인해 주세요.\n</p>\n\n</div>\n\n<a class=\"button\"\nhref=\"participate.html\">\n공식 계좌정보 확인\n</a>\n\n<p class=\"note\">\n※ 계좌정보는 변경될 수 있으므로\n이 안내 페이지에는 계좌번호를\n직접 기재하지 않습니다.\n</p>\n\n</section>\n\n<section id=\"board\">\n\n<h2>5. 게시판과 활동자료 이용</h2>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>시민참여 게시판</h3>\n\n<p>\n글로벌 AI 허브 유치 관련\n시민 의견과 정보를 공유하는 공간입니다.\n</p>\n\n<a class=\"button secondary\"\nhref=\"board.html\">\n게시판 바로가기\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>활동 소식</h3>\n\n<p>\n위원회의 주요 행사와\n활동 소식을 확인합니다.\n</p>\n\n<a class=\"button secondary\"\nhref=\"news.html\">\n활동 소식 보기\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>언론보도</h3>\n\n<p>\n글로벌 AI 허브 유치와 관련된\n언론 기사를 살펴봅니다.\n</p>\n\n<a class=\"button secondary\"\nhref=\"press.html\">\n언론보도 보기\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>활동 연혁</h3>\n\n<p>\n위원회의 주요 활동을\n시간순으로 확인합니다.\n</p>\n\n<a class=\"button secondary\"\nhref=\"history.html\">\n활동 연혁 보기\n</a>\n\n</div>\n\n</div>\n\n<p>\n게시판에서는 다른 사람을 존중하고,\n개인정보나 허위정보를 게시하지\n않도록 유의해 주세요.\n</p>\n\n</section>\n\n<section id=\"faq\">\n\n<h2>6. 자주 묻는 질문</h2>\n\n<div class=\"faq\">\n\n<h3>Q. 홈페이지 이용에 회원가입이 필요한가요?</h3>\n\n<p>\n일반적인 정보 열람은\n회원가입 없이 이용할 수 있습니다.\n다만 일부 기능은 로그인이나\n별도의 권한이 필요할 수 있습니다.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>Q. 온라인 서명과 추진위원 등록은 같은가요?</h3>\n\n<p>\n아닙니다.\n온라인 서명은 유치 지지 의사를\n표시하는 참여 방식이며,\n추진위원 등록은 위원회 활동에\n참여하기 위한 별도 신청입니다.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>Q. 온라인 서명에 참여하면 회비를 내야 하나요?</h3>\n\n<p>\n온라인 서명과 후원회원 가입은\n서로 다른 참여 방식입니다.\n온라인 서명 자체가\n후원회비 납부를 의미하지는 않습니다.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>Q. 후원회원 가입 신청만 하면 입금도 완료되나요?</h3>\n\n<p>\n아닙니다.\n신청서 제출과 실제 입금은\n별개의 절차입니다.\n공식 계좌정보를 확인해 주세요.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>Q. 9개 국제기구의 고양특례시 입주가 확정되었나요?</h3>\n\n<p>\n아닙니다.\n홈페이지에 소개된 국제기구는\n글로벌 AI 허브 구상과 관련하여\n협력 가능성을 검토하는 대상입니다.\n참여나 입주가 확정되었다는\n의미는 아닙니다.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>Q. 현수막 신청 후 바로 설치할 수 있나요?</h3>\n\n<p>\n신청서 제출만으로\n게시가 승인되는 것은 아닙니다.\n관련 법령과 장소별 허용 기준을\n확인해야 합니다.\n</p>\n\n</div>\n\n</section>\n\n<section id=\"help\">\n\n<h2>7. 홈페이지 이용 도움말</h2>\n\n<h3>홈페이지가 열리지 않을 때</h3>\n\n<p>\n인터넷 연결과 주소를 확인하고\n잠시 후 다시 접속해 주세요.\n</p>\n\n<h3>화면이 정상적으로 보이지 않을 때</h3>\n\n<p>\n새로고침하거나 다른 브라우저에서\n접속해 보시기 바랍니다.\n</p>\n\n<h3>신청서가 열리지 않을 때</h3>\n\n<p>\n신청 버튼을 다시 선택하거나\n다른 브라우저로 접속해 보세요.\n</p>\n\n<h3>계좌정보가 보이지 않을 때</h3>\n\n<p>\n페이지를 새로고침한 후 확인해 주세요.\n문제가 계속되면 임의로 입금하지 말고\n위원회의 공식 안내를 확인하시기 바랍니다.\n</p>\n\n<h3>개인정보 보호</h3>\n\n<p>\n신청서 제출 전에 개인정보 수집·이용\n안내를 확인해 주세요.\n공개 게시판에는 다른 사람의\n개인정보를 게시하지 마세요.\n</p>\n\n<a class=\"button secondary\"\nhref=\"privacy.html\">\n개인정보처리방침\n</a>\n\n</section>\n\n<section>\n\n<h2>8. 시민 여러분의 참여를 기다립니다</h2>\n\n<p>\n글로벌 AI 허브의 고양특례시 유치는\n새로운 성장동력과 양질의 일자리,\n지역경제의 미래를 준비하는\n공동의 과제입니다.\n</p>\n\n<p>\n시민 여러분께서는\n온라인 서명과 추진위원 등록,\n후원회원 가입 및 홍보활동 등\n다양한 방법으로 함께하실 수 있습니다.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n시민 한 분 한 분의 관심과 참여가<br>\n고양특례시의 새로운 미래를 만듭니다.\n</strong>\n\n</div>\n\n<a class=\"button\"\nhref=\"participate.html\">\n시민참여센터 바로가기\n</a>\n\n<a class=\"button secondary\"\nhref=\"index.html\">\n홈페이지 첫 화면\n</a>\n\n</section>\n\n</main>\n\n<footer>\n\n<p>\n<strong>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</strong>\n</p>\n\n<p>\n시민의 힘으로, 경기도의 역량으로, 세계와 함께!\n</p>\n\n<p>\n<a href=\"index.html\">\n홈페이지\n</a>\n&nbsp; | &nbsp;\n<a href=\"participate.html\">\n시민참여\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=ar": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<meta\n  name=\"description\"\n  content=\"دليل استخدام الموقع الإلكتروني لمبادرة المركز العالمي للذكاء الاصطناعي في مدينة غويانغ الخاصة. تعرف على أقسام الموقع وطرق المشاركة المدنية والأخبار والخدمات الإلكترونية.\"\n>\n\n<title>\nدليل استخدام الموقع الإلكتروني |\nمبادرة المركز العالمي للذكاء الاصطناعي\n</title>\n\n<style>\n\n/* =====================================\n   BASIC SETTINGS\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  direction: rtl;\n  font-family:\n    Tahoma,\n    Arial,\n    \"Noto Naskh Arabic\",\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.9;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   HEADER\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 50px 20px;\n}\n\nheader h1 {\n  margin: 0 0 15px;\n  font-size: clamp(28px, 5vw, 42px);\n  line-height: 1.5;\n}\n\nheader p {\n  font-size: 18px;\n  margin: 10px 0;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 22px;\n  background: white;\n  color: #0754a6;\n  border-radius: 8px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   QUICK NAVIGATION\n===================================== */\n\n.quick-nav {\n  max-width: 1150px;\n  margin: 25px auto;\n  padding: 0 15px;\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  justify-content: center;\n}\n\n.quick-nav a {\n  padding: 10px 16px;\n  background: #e4f0ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 25px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n.quick-nav a:hover {\n  background: #d3e7ff;\n}\n\n/* =====================================\n   MAIN\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n  scroll-margin-top: 20px;\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   CARDS\n===================================== */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 18px;\n}\n\n.card {\n  padding: 22px;\n  background: #f4f8fc;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   BUTTONS\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 11px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: #0754a6;\n}\n\n.button.secondary:hover {\n  background: #d3e7ff;\n}\n\n/* =====================================\n   RTL HIGHLIGHT\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-right: 5px solid #168de0;\n  border-left: none;\n  padding: 22px;\n  border-radius: 8px;\n  margin: 20px 0;\n}\n\n/* =====================================\n   RTL STEPS\n===================================== */\n\n.steps {\n  padding-right: 24px;\n  padding-left: 0;\n}\n\n.steps li {\n  margin-bottom: 8px;\n}\n\n/* =====================================\n   NOTES\n===================================== */\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   FAQ\n===================================== */\n\n.faq {\n  margin-bottom: 22px;\n}\n\n.faq h3 {\n  margin-bottom: 6px;\n}\n\n.faq p {\n  margin-top: 0;\n}\n\n/* =====================================\n   FOOTER\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 35px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 35px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 18px;\n  }\n\n  .button {\n    width: 100%;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header>\n\n<h1>\nدليل استخدام الموقع الإلكتروني\n</h1>\n\n<p>\nمبادرة المركز العالمي للذكاء الاصطناعي<br>\nمدينة غويانغ الخاصة،\nمقاطعة غيونغي،\nجمهورية كوريا\n</p>\n\n<p>\nدليل المعلومات والتنقل\nوالمشاركة المدنية\nعبر الموقع الإلكتروني\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ar\"\n  class=\"home-link\"\n>\n← الصفحة الرئيسية العربية\n</a>\n\n<a\n  href=\"guide.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</div>\n\n</header>\n\n\u003c!-- =====================================\n     QUICK NAVIGATION\n===================================== -->\n\n<nav\n  class=\"quick-nav\"\n  aria-label=\"التنقل السريع في دليل استخدام الموقع\"\n>\n\n<a href=\"#intro\">\nمقدمة\n</a>\n\n<a href=\"#menus\">\nالأقسام الرئيسية\n</a>\n\n<a href=\"#participation\">\nالمشاركة\n</a>\n\n<a href=\"#account\">\nمعلومات الدفع\n</a>\n\n<a href=\"#board\">\nالأخبار والموارد\n</a>\n\n<a href=\"#faq\">\nالأسئلة الشائعة\n</a>\n\n<a href=\"#help\">\nالمساعدة\n</a>\n\n</nav>\n\n<main>\n\n\u003c!-- =====================================\n     1. INTRODUCTION\n===================================== -->\n\n<section id=\"intro\">\n\n<h2>\n1. مرحباً بكم في موقعنا\n</h2>\n\n<p>\nمرحباً بكم في الموقع الإلكتروني\nللجنة المدنية لدعم استقطاب\nالمركز العالمي للذكاء الاصطناعي\nإلى مدينة غويانغ الخاصة.\n</p>\n\n<p>\nيوفر هذا الموقع معلومات\nحول المركز العالمي المقترح\nللذكاء الاصطناعي،\nوأنشطة اللجنة،\nوالمزايا التنافسية\nلموقع مدينة غويانغ،\nوفرص المشاركة العامة.\n</p>\n\n<p>\nكما يقدم الموقع\nرؤية للتعاون الدولي المحتمل\nفي مواجهة التحديات العالمية\nمن خلال التطبيقات المسؤولة\nللذكاء الاصطناعي.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nفرص نمو جديدة لغويانغ!<br>\nالمزيد من فرص العمل عالية الجودة لغويانغ!<br>\nلنجلب المركز العالمي للذكاء الاصطناعي إلى غويانغ!\n</strong>\n\n</div>\n\n<p>\nيمكن الوصول إلى الموقع\nباستخدام جهاز كمبيوتر،\nأو جهاز لوحي،\nأو هاتف ذكي.\n</p>\n\n<p>\nلا يلزم تثبيت برامج إضافية.\nيكفي استخدام متصفح إنترنت عادي.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     2. MAIN WEBSITE SECTIONS\n===================================== -->\n\n<section id=\"menus\">\n\n<h2>\n2. الأقسام الرئيسية للموقع\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- COMMITTEE -->\n\n<div class=\"card\">\n\n<h3>\nحول اللجنة المدنية الداعمة\n</h3>\n\n<p>\nتعرفوا على تأسيس اللجنة المدنية،\nورسالتها،\nومبادئها التوجيهية،\nوأنشطتها الرئيسية.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"committee.html?lang=ar\"\n>\nاستكشاف\n</a>\n\n</div>\n\n\u003c!-- GLOBAL AI HUB -->\n\n<div class=\"card\">\n\n<h3>\nحول المركز العالمي للذكاء الاصطناعي\n</h3>\n\n<p>\nتعرفوا على المركز العالمي المقترح\nللذكاء الاصطناعي،\nورؤيته للتعاون الدولي،\nوالتطبيقات المحتملة\nللذكاء الاصطناعي\nفي خدمة المصلحة العامة.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"hub.html?lang=ar\"\n>\nاستكشاف\n</a>\n\n</div>\n\n\u003c!-- GOYANG -->\n\n<div class=\"card\">\n\n<h3>\nلماذا مدينة غويانغ الخاصة؟\n</h3>\n\n<p>\nتعرفوا على المزايا الجغرافية\nلمدينة غويانغ،\nوبنيتها التحتية الحضرية،\nوقدرتها التنافسية المحتملة\nبوصفها موقعاً\nللمركز العالمي للذكاء الاصطناعي.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"goyang.html?lang=ar\"\n>\nاستكشاف\n</a>\n\n</div>\n\n\u003c!-- INTERNATIONAL ORGANIZATIONS -->\n\n<div class=\"card\">\n\n<h3>\nالمنظمات الدولية التسع\n</h3>\n\n<p>\nاستكشفوا مهام\nتسع منظمات دولية،\nوالمجالات المحتملة\nللتعاون المرتبط\nبالذكاء الاصطناعي.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"agencies.html?lang=ar\"\n>\nاستكشاف\n</a>\n\n</div>\n\n\u003c!-- STRATEGY -->\n\n<div class=\"card\">\n\n<h3>\nاستراتيجية استقطاب المركز\n</h3>\n\n<p>\nتعرفوا على الاستراتيجية المقترحة\nللتأسيس الأولي،\nوالدعم التشغيلي،\nوتحقيق النمو المشترك\nعلى المدى الطويل.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"strategy.html?lang=ar\"\n>\nاستكشاف\n</a>\n\n</div>\n\n\u003c!-- PARTICIPATION -->\n\n<div class=\"card\">\n\n<h3>\nمركز المشاركة المدنية\n</h3>\n\n<p>\nاطلعوا على معلومات\nحول حملة التوقيعات الإلكترونية،\nوالتسجيل في اللجنة،\nوالعضوية الداعمة،\nوبرامج المشاركة الأخرى.\n</p>\n\n<a\n  class=\"button\"\n  href=\"participate.html?lang=ar\"\n>\nمركز المشاركة المدنية\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. HOW TO PARTICIPATE\n===================================== -->\n\n<section id=\"participation\">\n\n<h2>\n3. كيفية المشاركة\n</h2>\n\n<p>\nيوفر مركز المشاركة المدنية\nمعلومات حول خمسة برامج\nرئيسية للمشاركة.\n</p>\n\n<p class=\"note\">\nتتوفر استمارات التقديم\nحالياً باللغة الكورية.\nيرجى مراجعة المعلومات\nوإشعارات الخصوصية\nقبل تقديم أي استمارة.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- SIGNATURE CAMPAIGN -->\n\n<div class=\"card\">\n\n<h3>\n① حملة الدعم الإلكتروني\n</h3>\n\n<p>\nعبّروا عن دعمكم\nلاستقطاب المركز العالمي المقترح\nللذكاء الاصطناعي\nإلى مدينة غويانغ الخاصة.\n</p>\n\n<ol class=\"steps\">\n\n<li>\nاختاروا زر المشاركة\nفي حملة الدعم الإلكتروني.\n</li>\n\n<li>\nأدخلوا المعلومات المطلوبة\nفي استمارة التقديم.\n</li>\n\n<li>\nراجعوا إشعار الخصوصية.\n</li>\n\n<li>\nأرسلوا الاستمارة المكتملة.\n</li>\n\n</ol>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\nالمشاركة في الحملة\n</a>\n\n</div>\n\n\u003c!-- COMMITTEE REGISTRATION -->\n\n<div class=\"card\">\n\n<h3>\n② التسجيل في اللجنة\n</h3>\n\n<p>\nيمكن للمواطنين\nالمهتمين بالمشاركة الفعالة\nفي مبادرة المركز العالمي\nللذكاء الاصطناعي\nالتقدم بطلب التسجيل\nأعضاءً في اللجنة.\n</p>\n\n<p>\nيرجى تقديم المعلومات\nالمطلوبة في استمارة التسجيل.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\nالتسجيل\n</a>\n\n</div>\n\n\u003c!-- SUPPORTING MEMBERSHIP -->\n\n<div class=\"card\">\n\n<h3>\n③ العضوية الداعمة\n</h3>\n\n<p>\nيمكن للأفراد الراغبين\nفي دعم أنشطة اللجنة\nالتقدم بطلب\nللحصول على العضوية الداعمة.\n</p>\n\n<p>\nبعد تقديم الطلب،\nيرجى مراجعة معلومات الدفع الرسمية\nالمعروضة في مركز المشاركة المدنية.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\nطلب العضوية الداعمة\n</a>\n\n</div>\n\n\u003c!-- BANNER -->\n\n<div class=\"card\">\n\n<h3>\n④ طلب لافتة ترويجية\n</h3>\n\n<p>\nتقدموا بطلب\nلعرض لافتات ترويجية\nتدعم مبادرة المركز العالمي\nالمقترح للذكاء الاصطناعي.\n</p>\n\n<p>\nيرجى التحقق\nمن اللوائح المحلية المعمول بها،\nومتطلبات الموقع،\nوالتصاريح اللازمة\nلتركيب اللافتات.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\nطلب لافتة ترويجية\n</a>\n\n</div>\n\n\u003c!-- VEHICLE STICKER -->\n\n<div class=\"card\">\n\n<h3>\n⑤ ملصق ترويجي للمركبات\n</h3>\n\n<p>\nتقدموا بطلب\nللحصول على ملصق ترويجي\nللمساعدة في تعزيز\nالوعي العام\nبمبادرة المركز العالمي\nللذكاء الاصطناعي.\n</p>\n\n<p>\nيرجى تقديم المعلومات المطلوبة،\nبما في ذلك بيانات الاتصال\nوالكمية المطلوبة.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/cisRHEsN61pxVycG8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\nطلب ملصق للمركبة\n</a>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nقد تختلف مواعيد قبول الطلبات\nومعالجتها\nوفقاً لظروف تشغيل اللجنة.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     4. PAYMENT INFORMATION\n===================================== -->\n\n<section id=\"account\">\n\n<h2>\n4. مدفوعات العضوية الداعمة واللافتات الترويجية\n</h2>\n\n<p>\nإذا كنتم ترغبون\nفي دفع مساهمة العضوية الداعمة\nأو تكلفة لافتة ترويجية،\nفيرجى مراجعة معلومات\nالحساب البنكي الرسمي\nالمعروضة في مركز المشاركة المدنية.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nمعلومات مهمة بشأن الدفع\n</strong>\n\n<p>\nقبل إجراء أي تحويل مالي،\nتحققوا من اسم البنك،\nورقم الحساب،\nواسم صاحب الحساب.\n</p>\n\n<p>\nإن تقديم الطلب\nوإتمام التحويل البنكي\nإجراءان منفصلان.\n</p>\n\n<p>\nإذا لم تظهر معلومات الحساب\nأو كانت غير واضحة،\nفلا تحولوا أي أموال\nحتى يتم تأكيد المعلومات\nمن خلال الإرشادات الرسمية\nالصادرة عن اللجنة.\n</p>\n\n</div>\n\n<a\n  class=\"button\"\n  href=\"participate.html?lang=ar\"\n>\nالتحقق من معلومات الدفع الرسمية\n</a>\n\n<p class=\"note\">\nقد تتغير معلومات الحساب البنكي.\nولهذا السبب،\nلا تُدرج أرقام الحسابات\nمباشرة في هذا الدليل.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     5. NEWS AND RESOURCES\n===================================== -->\n\n<section id=\"board\">\n\n<h2>\n5. الأخبار والأنشطة والموارد\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- COMMUNITY BOARD -->\n\n<div class=\"card\">\n\n<h3>\nمنتدى النقاش المجتمعي\n</h3>\n\n<p>\nمساحة لتبادل آراء المواطنين\nوالمعلومات المتعلقة\nبمبادرة المركز العالمي\nللذكاء الاصطناعي.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"board.html\"\n>\nزيارة المنتدى (باللغة الكورية)\n</a>\n\n</div>\n\n\u003c!-- NEWS -->\n\n<div class=\"card\">\n\n<h3>\nالأخبار والإعلانات\n</h3>\n\n<p>\nاطلعوا على آخر المستجدات\nالمتعلقة بأنشطة اللجنة،\nوالفعاليات،\nوالتطورات المهمة.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"news.html?lang=ar\"\n>\nعرض الأخبار\n</a>\n\n</div>\n\n\u003c!-- PRESS -->\n\n<div class=\"card\">\n\n<h3>\nالتغطية الإعلامية\n</h3>\n\n<p>\nاستكشفوا المقالات الصحفية،\nوالتقارير التلفزيونية والإذاعية،\nوغيرها من التغطيات الإعلامية\nالمتعلقة بمبادرة المركز العالمي\nللذكاء الاصطناعي.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"press.html?lang=ar\"\n>\nعرض التغطية الإعلامية\n</a>\n\n</div>\n\n\u003c!-- HISTORY -->\n\n<div class=\"card\">\n\n<h3>\nالتسلسل الزمني وأبرز المحطات\n</h3>\n\n<p>\nراجعوا أبرز التطورات\nوأنشطة اللجنة\nحسب ترتيبها الزمني.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"history.html?lang=ar\"\n>\nعرض التسلسل الزمني\n</a>\n\n</div>\n\n</div>\n\n<p>\nقد تتوفر بعض الموارد المرتبطة\nوالمقالات الإخبارية الأصلية\nباللغة الكورية فقط.\n</p>\n\n<p>\nعند المشاركة\nفي المناقشات الإلكترونية،\nيرجى احترام المستخدمين الآخرين،\nوتجنب مشاركة المعلومات الشخصية\nأو المحتوى المضلل.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     6. FAQ\n===================================== -->\n\n<section id=\"faq\">\n\n<h2>\n6. الأسئلة الشائعة\n</h2>\n\n\u003c!-- FAQ 1 -->\n\n<div class=\"faq\">\n\n<h3>\nس. هل أحتاج إلى التسجيل\nلاستخدام هذا الموقع؟\n</h3>\n\n<p>\nيمكن الوصول إلى المعلومات العامة\nدون تسجيل.\nوقد تتطلب بعض الوظائف التفاعلية\nتسجيل الدخول\nأو الحصول على صلاحيات إضافية.\n</p>\n\n</div>\n\n\u003c!-- FAQ 2 -->\n\n<div class=\"faq\">\n\n<h3>\nس. هل المشاركة في حملة الدعم الإلكتروني\nهي نفسها التسجيل في اللجنة؟\n</h3>\n\n<p>\nلا.\nتتيح حملة الدعم الإلكتروني\nللأفراد التعبير عن دعمهم\nللمركز العالمي المقترح\nللذكاء الاصطناعي.\n</p>\n\n<p>\nأما التسجيل في اللجنة\nفهو إجراء منفصل\nللراغبين في المشاركة\nفي أنشطة اللجنة.\n</p>\n\n</div>\n\n\u003c!-- FAQ 3 -->\n\n<div class=\"faq\">\n\n<h3>\nس. هل تتطلب المشاركة\nفي حملة الدعم الإلكتروني\nدفع رسوم عضوية؟\n</h3>\n\n<p>\nلا.\nحملة الدعم الإلكتروني\nوالعضوية الداعمة\nبرنامجان منفصلان للمشاركة.\n</p>\n\n<p>\nولا يعني توقيع استمارة الدعم\nفي حد ذاته\nالالتزام بدفع مساهمة عضوية.\n</p>\n\n</div>\n\n\u003c!-- FAQ 4 -->\n\n<div class=\"faq\">\n\n<h3>\nس. هل يؤدي تقديم طلب العضوية الداعمة\nإلى إتمام الدفع تلقائياً؟\n</h3>\n\n<p>\nلا.\nتقديم الطلب\nوتحويل الأموال\nإجراءان منفصلان.\n</p>\n\n<p>\nيرجى التحقق\nمن معلومات الدفع الرسمية\nقبل إجراء أي تحويل مالي.\n</p>\n\n</div>\n\n\u003c!-- FAQ 5 -->\n\n<div class=\"faq\">\n\n<h3>\nس. هل أكدت المنظمات الدولية التسع\nانتقالها إلى مدينة غويانغ؟\n</h3>\n\n<p>\nلا.\nتُعرض المنظمات الدولية\nالمذكورة في هذا الموقع\nفي سياق التعاون المحتمل\nضمن مبادرة المركز العالمي\nللذكاء الاصطناعي.\n</p>\n\n<p>\nولا يعني إدراجها\nأن مشاركتها،\nأو إنشاء مكاتب لها،\nأو انتقالها إلى غويانغ\nقد تأكد رسمياً.\n</p>\n\n</div>\n\n\u003c!-- FAQ 6 -->\n\n<div class=\"faq\">\n\n<h3>\nس. هل يمكن تركيب لافتة ترويجية\nفور تقديم الطلب؟\n</h3>\n\n<p>\nلا.\nإن تقديم الطلب\nلا يمنح تلقائياً\nإذن تركيب اللافتة.\n</p>\n\n<p>\nيجب الالتزام\nبالقوانين ذات الصلة،\nواللوائح المحلية،\nوالمتطلبات الخاصة بالموقع.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. WEBSITE HELP\n===================================== -->\n\n<section id=\"help\">\n\n<h2>\n7. المساعدة في استخدام الموقع\n</h2>\n\n<h3>\nإذا تعذر فتح الموقع الإلكتروني\n</h3>\n\n<p>\nتحققوا من اتصال الإنترنت\nوعنوان الموقع الإلكتروني.\nثم حاولوا الوصول إلى الصفحة\nمرة أخرى بعد فترة قصيرة.\n</p>\n\n<h3>\nإذا لم تظهر الصفحة بصورة صحيحة\n</h3>\n\n<p>\nحدثوا الصفحة\nأو جربوا متصفحاً آخر.\n</p>\n\n<h3>\nإذا تعذر فتح استمارة التقديم\n</h3>\n\n<p>\nاختاروا زر التقديم مرة أخرى\nأو افتحوا الاستمارة\nباستخدام متصفح آخر.\n</p>\n\n<h3>\nإذا لم تظهر معلومات الحساب البنكي\n</h3>\n\n<p>\nحدثوا صفحة مركز المشاركة المدنية\nوتحققوا مرة أخرى.\n</p>\n\n<p>\nإذا استمرت المشكلة،\nفلا تحولوا أي أموال\nحتى يتم تأكيد معلومات الحساب\nمن خلال الإرشادات الرسمية\nالصادرة عن اللجنة.\n</p>\n\n<h3>\nحماية البيانات الشخصية\n</h3>\n\n<p>\nراجعوا الإشعار المتعلق\nبجمع البيانات الشخصية\nواستخدامها\nقبل تقديم أي طلب.\n</p>\n\n<p>\nلا تنشروا المعلومات الشخصية\nالخاصة بأشخاص آخرين\nفي منتديات النقاش العامة.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"privacy.html\"\n>\nسياسة الخصوصية (باللغة الكورية)\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. CLOSING\n===================================== -->\n\n<section>\n\n<h2>\n8. شاركونا في بناء مستقبل غويانغ\n</h2>\n\n<p>\nيمثل المركز العالمي المقترح\nللذكاء الاصطناعي\nفرصة لاستكشاف\nآفاق جديدة للنمو،\nوفرص العمل عالية الجودة،\nوالتعاون الدولي\nلمدينة غويانغ الخاصة.\n</p>\n\n<p>\nيمكن للمواطنين\nوالأفراد المهتمين\nالمشاركة من خلال\nحملة الدعم الإلكتروني،\nوالتسجيل في اللجنة،\nوالعضوية الداعمة،\nوأنشطة التوعية العامة.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nكل تعبير عن الاهتمام،\nوكل مشاركة إيجابية،\nيمكن أن يسهم\nفي رسم مستقبل غويانغ.\n</strong>\n\n</div>\n\n<a\n  class=\"button\"\n  href=\"participate.html?lang=ar\"\n>\nمركز المشاركة المدنية\n</a>\n\n<a\n  class=\"button secondary\"\n  href=\"index.html?lang=ar\"\n>\nالصفحة الرئيسية العربية\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n\n<strong>\nاللجنة المدنية لدعم استقطاب<br>\nالمركز العالمي للذكاء الاصطناعي<br>\nإلى مدينة غويانغ الخاصة\n</strong>\n\n</p>\n\n<p>\nمقاطعة غيونغي،\nجمهورية كوريا\n</p>\n\n<p>\nمع المواطنين،\nومع مقاطعة غيونغي،\nومع العالم.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ar\">\nالصفحة الرئيسية العربية\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"participate.html?lang=ar\">\nالمشاركة المدنية\n</a>\n\n&nbsp; | &nbsp;\n\n<a\n  href=\"guide.html\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=de": "<!DOCTYPE html>\n<html lang=\"de\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<meta name=\"description\"\ncontent=\"Benutzerhandbuch für die Website der Initiative für ein globales KI-Zentrum in der Sonderstadt Goyang. Informationen zur Navigation, Bürgerbeteiligung, zu Nachrichten und Online-Diensten.\">\n\n<title>\nWebsite-Benutzerhandbuch |\nInitiative für ein globales KI-Zentrum\n</title>\n\n<style>\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    Arial,\n    Helvetica,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* KOPFBEREICH */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 50px 20px;\n}\n\nheader h1 {\n  margin: 0 0 15px;\n  font-size: clamp(28px, 5vw, 42px);\n}\n\nheader p {\n  font-size: 18px;\n  margin: 10px 0;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 22px;\n  background: white;\n  color: #0754a6;\n  border-radius: 8px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* SCHNELLNAVIGATION */\n\n.quick-nav {\n  max-width: 1150px;\n  margin: 25px auto;\n  padding: 0 15px;\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  justify-content: center;\n}\n\n.quick-nav a {\n  padding: 10px 16px;\n  background: #e4f0ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 25px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* HAUPTINHALT */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n  scroll-margin-top: 20px;\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* KARTEN */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 18px;\n}\n\n.card {\n  padding: 22px;\n  background: #f4f8fc;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* SCHALTFLÄCHEN */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 11px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: #0754a6;\n}\n\n/* HERVORHEBUNG */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 22px;\n  border-radius: 8px;\n  margin: 20px 0;\n}\n\n/* SCHRITTE */\n\n.steps {\n  padding-left: 24px;\n}\n\n.steps li {\n  margin-bottom: 8px;\n}\n\n/* HINWEISE */\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* FAQ */\n\n.faq {\n  margin-bottom: 22px;\n}\n\n.faq h3 {\n  margin-bottom: 6px;\n}\n\n.faq p {\n  margin-top: 0;\n}\n\n/* FUSSZEILE */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 35px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* MOBILE ANSICHT */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 35px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 18px;\n  }\n\n  .button {\n    width: 100%;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- KOPFBEREICH -->\n\n<header>\n\n<h1>\nWebsite-Benutzerhandbuch\n</h1>\n\n<p>\nInitiative für ein globales KI-Zentrum<br>\nSonderstadt Goyang,\nProvinz Gyeonggi,\nRepublik Korea\n</p>\n\n<p>\nEin Leitfaden zu Informationen,\nNavigation\nund Bürgerbeteiligung\nauf dieser Website\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=de\"\nclass=\"home-link\">\n← Deutsche Startseite\n</a>\n\n</div>\n\n</header>\n\n\u003c!-- SCHNELLNAVIGATION -->\n\n<nav\nclass=\"quick-nav\"\naria-label=\"Navigation im Website-Benutzerhandbuch\">\n\n<a href=\"#intro\">\nEinführung\n</a>\n\n<a href=\"#menus\">\nHauptbereiche\n</a>\n\n<a href=\"#participation\">\nBürgerbeteiligung\n</a>\n\n<a href=\"#account\">\nZahlungsinformationen\n</a>\n\n<a href=\"#board\">\nNachrichten und Ressourcen\n</a>\n\n<a href=\"#faq\">\nHäufige Fragen\n</a>\n\n<a href=\"#help\">\nHilfe\n</a>\n\n</nav>\n\n<main>\n\n\u003c!-- =====================================\n     1. EINFÜHRUNG\n===================================== -->\n\n<section id=\"intro\">\n\n<h2>\n1. Willkommen auf unserer Website\n</h2>\n\n<p>\nWillkommen auf der offiziellen Website\ndes Bürgerkomitees zur Förderung\nder Ansiedlung eines globalen KI-Zentrums\nin der Sonderstadt Goyang.\n</p>\n\n<p>\nDiese Website bietet Informationen\nüber das geplante globale KI-Zentrum,\ndie Aktivitäten des Bürgerkomitees,\ndie Standortvorteile Goyangs\nund Möglichkeiten\nzur Bürgerbeteiligung.\n</p>\n\n<p>\nDarüber hinaus stellt sie\ndie mögliche Rolle\ninternationaler Zusammenarbeit\nbei der Bewältigung\nglobaler Herausforderungen\ndurch verantwortungsvolle Anwendungen\nkünstlicher Intelligenz vor.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nNeue Wachstumschancen für Goyang!<br>\nMehr hochwertige Arbeitsplätze für Goyang!<br>\nDas globale KI-Zentrum nach Goyang holen!\n</strong>\n\n</div>\n\n<p>\nDie Website kann\nmit einem Computer,\nTablet\noder Smartphone\naufgerufen werden.\n</p>\n\n<p>\nZusätzliche Software\nist nicht erforderlich.\nEin gewöhnlicher Internetbrowser\nist ausreichend.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     2. HAUPTBEREICHE\n===================================== -->\n\n<section id=\"menus\">\n\n<h2>\n2. Hauptbereiche der Website\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- BÜRGERKOMITEE -->\n\n<div class=\"card\">\n\n<h3>\nÜber das Bürgerkomitee\n</h3>\n\n<p>\nErfahren Sie mehr\nüber die Gründung,\ndie Aufgaben,\ndie Leitprinzipien\nund die wichtigsten Aktivitäten\ndes Bürgerkomitees.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"committee.html?lang=de\">\nEntdecken\n</a>\n\n</div>\n\n\u003c!-- GLOBALES KI-ZENTRUM -->\n\n<div class=\"card\">\n\n<h3>\nÜber das globale KI-Zentrum\n</h3>\n\n<p>\nEntdecken Sie\ndas geplante globale KI-Zentrum,\nseine Vision\nfür internationale Zusammenarbeit\nund mögliche KI-Anwendungen\nim öffentlichen Interesse.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"hub.html?lang=de\">\nEntdecken\n</a>\n\n</div>\n\n\u003c!-- GOYANG -->\n\n<div class=\"card\">\n\n<h3>\nWarum die Sonderstadt Goyang?\n</h3>\n\n<p>\nErfahren Sie mehr\nüber die Standortvorteile,\ndie städtische Infrastruktur\nund die potenzielle Wettbewerbsfähigkeit\nGoyangs als Standort\nfür ein globales KI-Zentrum.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"goyang.html?lang=de\">\nEntdecken\n</a>\n\n</div>\n\n\u003c!-- INTERNATIONALE ORGANISATIONEN -->\n\n<div class=\"card\">\n\n<h3>\nNeun internationale Organisationen\n</h3>\n\n<p>\nEntdecken Sie die Aufgaben\nvon neun internationalen Organisationen\nund mögliche Bereiche\nder KI-bezogenen Zusammenarbeit.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"agencies.html?lang=de\">\nEntdecken\n</a>\n\n</div>\n\n\u003c!-- STRATEGIE -->\n\n<div class=\"card\">\n\n<h3>\nAnsiedlungsstrategie\n</h3>\n\n<p>\nErfahren Sie mehr\nüber die vorgeschlagene Strategie\nfür die anfängliche Einrichtung,\ndie operative Unterstützung\nund das gemeinsame\nlangfristige Wachstum.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"strategy.html?lang=de\">\nEntdecken\n</a>\n\n</div>\n\n\u003c!-- BÜRGERBETEILIGUNG -->\n\n<div class=\"card\">\n\n<h3>\nBürgerbeteiligungszentrum\n</h3>\n\n<p>\nHier finden Sie Informationen\nüber Online-Unterschriften,\ndie Registrierung\nim Bürgerkomitee,\nFördermitgliedschaften\nund weitere Beteiligungsprogramme.\n</p>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=de\">\nZum Bürgerbeteiligungszentrum\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. BÜRGERBETEILIGUNG\n===================================== -->\n\n<section id=\"participation\">\n\n<h2>\n3. So können Sie sich beteiligen\n</h2>\n\n<p>\nDas Bürgerbeteiligungszentrum\ninformiert über fünf\nverschiedene Beteiligungsprogramme.\n</p>\n\n<p class=\"note\">\nDie Antragsformulare\nsind derzeit\nin koreanischer Sprache verfügbar.\nBitte prüfen Sie\ndie Informationen\nund Datenschutzhinweise,\nbevor Sie ein Formular absenden.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- UNTERSTÜTZUNGSKAMPAGNE -->\n\n<div class=\"card\">\n\n<h3>\n① Online-Unterstützungskampagne\n</h3>\n\n<p>\nBekunden Sie Ihre Unterstützung\nfür das geplante globale KI-Zentrum\nin der Sonderstadt Goyang.\n</p>\n\n<ol class=\"steps\">\n\n<li>\nWählen Sie die Schaltfläche\nfür die Online-Unterstützungskampagne.\n</li>\n\n<li>\nGeben Sie die im Formular\nangeforderten Informationen ein.\n</li>\n\n<li>\nLesen Sie den Datenschutzhinweis.\n</li>\n\n<li>\nSenden Sie das ausgefüllte Formular ab.\n</li>\n\n</ol>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nAn der Kampagne teilnehmen\n</a>\n\n</div>\n\n\u003c!-- REGISTRIERUNG -->\n\n<div class=\"card\">\n\n<h3>\n② Registrierung im Bürgerkomitee\n</h3>\n\n<p>\nBürgerinnen und Bürger,\ndie sich aktiv\nan der Initiative\nfür ein globales KI-Zentrum\nbeteiligen möchten,\nkönnen sich als Mitglieder\ndes Bürgerkomitees registrieren.\n</p>\n\n<p>\nBitte geben Sie\ndie im Registrierungsformular\nangeforderten Informationen ein.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nRegistrieren\n</a>\n\n</div>\n\n\u003c!-- FÖRDERMITGLIEDSCHAFT -->\n\n<div class=\"card\">\n\n<h3>\n③ Fördermitgliedschaft\n</h3>\n\n<p>\nPersonen,\ndie die Aktivitäten\ndes Bürgerkomitees unterstützen möchten,\nkönnen eine Fördermitgliedschaft beantragen.\n</p>\n\n<p>\nNach dem Absenden des Antrags\nprüfen Sie bitte\ndie offiziellen Zahlungsinformationen\nim Bürgerbeteiligungszentrum.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nFördermitgliedschaft beantragen\n</a>\n\n</div>\n\n\u003c!-- WERBEBANNER -->\n\n<div class=\"card\">\n\n<h3>\n④ Antrag auf ein Werbebanner\n</h3>\n\n<p>\nBeantragen Sie\ndie Anbringung eines Werbebanners\nzur Unterstützung\nder geplanten Initiative\nfür ein globales KI-Zentrum.\n</p>\n\n<p>\nBitte beachten Sie\ndie geltenden örtlichen Vorschriften,\nStandortanforderungen\nund erforderlichen Genehmigungen.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nWerbebanner beantragen\n</a>\n\n</div>\n\n\u003c!-- FAHRZEUGAUFKLEBER -->\n\n<div class=\"card\">\n\n<h3>\n⑤ Werbeaufkleber für Fahrzeuge\n</h3>\n\n<p>\nBeantragen Sie\neinen Werbeaufkleber,\num das öffentliche Bewusstsein\nfür die Initiative\neines globalen KI-Zentrums zu stärken.\n</p>\n\n<p>\nGeben Sie\ndie erforderlichen Informationen an,\neinschließlich Kontaktdaten\nund der gewünschten Stückzahl.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/cisRHEsN61pxVycG8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nFahrzeugaufkleber beantragen\n</a>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nDie Verfügbarkeit\nder Antragsmöglichkeiten\nund die Bearbeitungszeiten\nkönnen je nach Arbeitsabläufen\ndes Bürgerkomitees variieren.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     4. ZAHLUNGSINFORMATIONEN\n===================================== -->\n\n<section id=\"account\">\n\n<h2>\n4. Fördermitgliedschaft und Zahlungen für Werbebanner\n</h2>\n\n<p>\nWenn Sie einen Beitrag\nzur Fördermitgliedschaft\noder die Kosten\nfür ein Werbebanner bezahlen möchten,\nprüfen Sie bitte\ndie offiziellen Bankkontoinformationen\nim Bürgerbeteiligungszentrum.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nWichtige Zahlungsinformationen\n</strong>\n\n<p>\nÜberprüfen Sie\nvor einer Überweisung\nden Namen der Bank,\ndie Kontonummer\nund den Kontoinhaber.\n</p>\n\n<p>\nDas Einreichen eines Antrags\nund die Durchführung\neiner Banküberweisung\nsind zwei getrennte Vorgänge.\n</p>\n\n<p>\nWenn die Kontoinformationen\nnicht angezeigt werden\noder unklar erscheinen,\nüberweisen Sie bitte kein Geld,\nbevor die Angaben\ndurch offizielle Informationen\ndes Bürgerkomitees bestätigt wurden.\n</p>\n\n</div>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=de\">\nOffizielle Zahlungsinformationen prüfen\n</a>\n\n<p class=\"note\">\nBankkontoinformationen\nkönnen sich ändern.\nAus diesem Grund\nwerden Kontonummern\nin diesem Benutzerhandbuch\nnicht direkt angegeben.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     5. NACHRICHTEN UND RESSOURCEN\n===================================== -->\n\n<section id=\"board\">\n\n<h2>\n5. Nachrichten, Aktivitäten und Ressourcen\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- DISKUSSIONSFORUM -->\n\n<div class=\"card\">\n\n<h3>\nÖffentliches Diskussionsforum\n</h3>\n\n<p>\nEin Raum\nfür den Austausch\nvon Bürgermeinungen\nund Informationen\nüber die Initiative\nfür ein globales KI-Zentrum.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"board.html\">\nForum besuchen (Koreanisch)\n</a>\n\n</div>\n\n\u003c!-- NACHRICHTEN -->\n\n<div class=\"card\">\n\n<h3>\nNachrichten und Bekanntmachungen\n</h3>\n\n<p>\nLesen Sie aktuelle Informationen\nüber die Aktivitäten\ndes Bürgerkomitees,\nVeranstaltungen\nund wichtige Entwicklungen.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"news.html?lang=de\">\nNachrichten ansehen\n</a>\n\n</div>\n\n\u003c!-- PRESSE -->\n\n<div class=\"card\">\n\n<h3>\nPresse und Medienberichte\n</h3>\n\n<p>\nEntdecken Sie Zeitungsartikel,\nFernseh- und Rundfunkberichte\nsowie weitere Medienveröffentlichungen\nüber die Initiative\nfür ein globales KI-Zentrum.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"press.html?lang=de\">\nMedienberichte ansehen\n</a>\n\n</div>\n\n\u003c!-- CHRONOLOGIE -->\n\n<div class=\"card\">\n\n<h3>\nChronologie und Meilensteine\n</h3>\n\n<p>\nInformieren Sie sich\nüber wichtige Entwicklungen\nund Aktivitäten\ndes Bürgerkomitees\nin chronologischer Reihenfolge.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"history.html?lang=de\">\nChronologie ansehen\n</a>\n\n</div>\n\n</div>\n\n<p>\nEinige verlinkte Ressourcen\nund Originalnachrichten\nsind möglicherweise\nnur in koreanischer Sprache verfügbar.\n</p>\n\n<p>\nBitte respektieren Sie\nbei der Teilnahme\nan Online-Diskussionen\nandere Nutzerinnen und Nutzer.\nVermeiden Sie\ndie Veröffentlichung\npersonenbezogener Daten\noder irreführender Inhalte.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     6. HÄUFIG GESTELLTE FRAGEN\n===================================== -->\n\n<section id=\"faq\">\n\n<h2>\n6. Häufig gestellte Fragen\n</h2>\n\n<div class=\"faq\">\n\n<h3>\nF. Muss ich mich registrieren,\num diese Website zu nutzen?\n</h3>\n\n<p>\nAllgemeine Informationen\nkönnen ohne Registrierung\nabgerufen werden.\nEinige interaktive Funktionen\nkönnen eine Anmeldung\noder zusätzliche Berechtigungen erfordern.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nF. Ist die Online-Unterstützungskampagne\ndasselbe wie die Registrierung\nim Bürgerkomitee?\n</h3>\n\n<p>\nNein.\nDie Online-Unterstützungskampagne\nermöglicht es Einzelpersonen,\nihre Unterstützung\nfür das geplante globale KI-Zentrum\nzum Ausdruck zu bringen.\n</p>\n\n<p>\nDie Registrierung\nim Bürgerkomitee\nist ein gesondertes Verfahren\nfür Personen,\ndie sich an den Aktivitäten\ndes Komitees beteiligen möchten.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nF. Ist für die Teilnahme\nan der Online-Unterstützungskampagne\nein Mitgliedsbeitrag erforderlich?\n</h3>\n\n<p>\nNein.\nDie Online-Unterstützungskampagne\nund die Fördermitgliedschaft\nsind voneinander getrennte\nBeteiligungsprogramme.\n</p>\n\n<p>\nMit der Unterzeichnung\ndes Unterstützungsformulars\ngeht keine Verpflichtung\nzur Zahlung eines Mitgliedsbeitrags einher.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nF. Ist die Zahlung\nmit dem Absenden\ndes Fördermitgliedschaftsantrags abgeschlossen?\n</h3>\n\n<p>\nNein.\nDie Antragstellung\nund die Überweisung\nsind getrennte Vorgänge.\n</p>\n\n<p>\nBitte überprüfen Sie\ndie offiziellen Zahlungsinformationen,\nbevor Sie eine Überweisung vornehmen.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nF. Haben die neun internationalen Organisationen\nihren Umzug nach Goyang bereits bestätigt?\n</h3>\n\n<p>\nNein.\nDie auf dieser Website\nvorgestellten internationalen Organisationen\nwerden im Zusammenhang\nmit möglichen Kooperationen\nim Rahmen der Initiative\nfür ein globales KI-Zentrum behandelt.\n</p>\n\n<p>\nIhre Erwähnung bedeutet nicht,\ndass eine Beteiligung,\ndie Einrichtung eines Büros\noder ein Umzug nach Goyang\noffiziell bestätigt wurde.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nF. Darf ein Werbebanner\nunmittelbar nach der Antragstellung\nangebracht werden?\n</h3>\n\n<p>\nNein.\nDie Einreichung eines Antrags\nberechtigt nicht automatisch\nzur Anbringung eines Werbebanners.\n</p>\n\n<p>\nDie geltenden Gesetze,\nörtlichen Vorschriften\nund standortspezifischen Anforderungen\nmüssen eingehalten werden.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. WEBSITE-HILFE\n===================================== -->\n\n<section id=\"help\">\n\n<h2>\n7. Hilfe zur Website\n</h2>\n\n<h3>\nWenn sich die Website nicht öffnen lässt\n</h3>\n\n<p>\nÜberprüfen Sie\nIhre Internetverbindung\nund die Website-Adresse.\nVersuchen Sie,\ndie Seite nach kurzer Zeit\nerneut aufzurufen.\n</p>\n\n<h3>\nWenn die Seite nicht richtig angezeigt wird\n</h3>\n\n<p>\nLaden Sie die Seite neu\noder versuchen Sie es\nmit einem anderen Browser.\n</p>\n\n<h3>\nWenn sich ein Antragsformular nicht öffnen lässt\n</h3>\n\n<p>\nWählen Sie\ndie entsprechende Schaltfläche erneut\noder öffnen Sie das Formular\nmit einem anderen Browser.\n</p>\n\n<h3>\nWenn die Bankkontoinformationen\nnicht angezeigt werden\n</h3>\n\n<p>\nLaden Sie das Bürgerbeteiligungszentrum\nerneut und prüfen Sie\ndie Angaben noch einmal.\n</p>\n\n<p>\nWenn das Problem weiterhin besteht,\nüberweisen Sie bitte kein Geld,\nbevor die Kontoinformationen\ndurch offizielle Informationen\ndes Bürgerkomitees bestätigt wurden.\n</p>\n\n<h3>\nSchutz personenbezogener Daten\n</h3>\n\n<p>\nLesen Sie\nvor der Einreichung eines Antrags\ndie entsprechenden Hinweise\nzur Erhebung\nund Verwendung personenbezogener Daten.\n</p>\n\n<p>\nVeröffentlichen Sie\nkeine personenbezogenen Daten\nanderer Personen\nin öffentlichen Diskussionsforen.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"privacy.html\">\nDatenschutzerklärung (Koreanisch)\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. ABSCHLUSS\n===================================== -->\n\n<section>\n\n<h2>\n8. Gestalten Sie mit uns die Zukunft Goyangs\n</h2>\n\n<p>\nDas geplante globale KI-Zentrum\nbietet der Sonderstadt Goyang\ndie Möglichkeit,\nneue Wachstumschancen,\nhochwertige Beschäftigung\nund internationale Zusammenarbeit\nzu erschließen.\n</p>\n\n<p>\nBürgerinnen und Bürger\nsowie weitere Interessierte\nkönnen sich\ndurch die Online-Unterstützungskampagne,\ndie Registrierung im Bürgerkomitee,\nFördermitgliedschaften\nund öffentliche Informationsaktivitäten\nbeteiligen.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nJedes Zeichen des Interesses\nund jede Form der Beteiligung\nkann dazu beitragen,\ndie Zukunft Goyangs zu gestalten.\n</strong>\n\n</div>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=de\">\nBürgerbeteiligungszentrum\n</a>\n\n<a\nclass=\"button secondary\"\nhref=\"index.html?lang=de\">\nDeutsche Startseite\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- FUSSZEILE -->\n\n<footer>\n\n<p>\n<strong>\nBürgerkomitee zur Förderung<br>\nder Ansiedlung eines globalen KI-Zentrums<br>\nin der Sonderstadt Goyang\n</strong>\n</p>\n\n<p>\nProvinz Gyeonggi,\nRepublik Korea\n</p>\n\n<p>\nMit den Bürgerinnen und Bürgern,<br>\nmit der Provinz Gyeonggi<br>\nund mit der Welt.\n</p>\n\n<p>\n<a href=\"index.html?lang=de\">\nDeutsche Startseite\n</a>\n&nbsp; | &nbsp;\n<a href=\"participate.html?lang=de\">\nBürgerbeteiligung\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=en": "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<meta name=\"description\"\ncontent=\"Website user guide for the Global AI Hub initiative in Goyang Special City. Learn how to explore information, participate in civic activities, access news, and use online services.\">\n\n<title>\nWebsite User Guide |\nGlobal AI Hub Initiative\n</title>\n\n<style>\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    Arial,\n    Helvetica,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* HEADER */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 50px 20px;\n}\n\nheader h1 {\n  margin: 0 0 15px;\n  font-size: clamp(28px, 5vw, 42px);\n}\n\nheader p {\n  font-size: 18px;\n  margin: 10px 0;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 22px;\n  background: white;\n  color: #0754a6;\n  border-radius: 8px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* QUICK NAVIGATION */\n\n.quick-nav {\n  max-width: 1150px;\n  margin: 25px auto;\n  padding: 0 15px;\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  justify-content: center;\n}\n\n.quick-nav a {\n  padding: 10px 16px;\n  background: #e4f0ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 25px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* MAIN */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n  scroll-margin-top: 20px;\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* CARDS */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 18px;\n}\n\n.card {\n  padding: 22px;\n  background: #f4f8fc;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* BUTTONS */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 11px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: #0754a6;\n}\n\n/* HIGHLIGHT */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 22px;\n  border-radius: 8px;\n  margin: 20px 0;\n}\n\n/* STEPS */\n\n.steps {\n  padding-left: 24px;\n}\n\n.steps li {\n  margin-bottom: 8px;\n}\n\n/* NOTES */\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* FAQ */\n\n.faq {\n  margin-bottom: 22px;\n}\n\n.faq h3 {\n  margin-bottom: 6px;\n}\n\n.faq p {\n  margin-top: 0;\n}\n\n/* FOOTER */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 35px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* MOBILE */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 35px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 18px;\n  }\n\n  .button {\n    width: 100%;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- HEADER -->\n\n<header>\n\n<h1>\nWebsite User Guide\n</h1>\n\n<p>\nGlobal AI Hub Initiative<br>\nGoyang Special City,\nGyeonggi Province,\nRepublic of Korea\n</p>\n\n<p>\nA Guide to Website Information,\nNavigation,\nand Citizen Participation\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=en\"\nclass=\"home-link\">\n← English Home\n</a>\n\n<a href=\"guide.html\"\nclass=\"home-link\"\nlang=\"ko\">\n한국어\n</a>\n\n</div>\n\n</header>\n\n\u003c!-- QUICK NAVIGATION -->\n\n<nav\nclass=\"quick-nav\"\naria-label=\"Website guide navigation\">\n\n<a href=\"#intro\">\nIntroduction\n</a>\n\n<a href=\"#menus\">\nMain Sections\n</a>\n\n<a href=\"#participation\">\nParticipation\n</a>\n\n<a href=\"#account\">\nPayment Information\n</a>\n\n<a href=\"#board\">\nNews & Resources\n</a>\n\n<a href=\"#faq\">\nFAQ\n</a>\n\n<a href=\"#help\">\nHelp\n</a>\n\n</nav>\n\n<main>\n\n\u003c!-- =====================================\n     1. INTRODUCTION\n===================================== -->\n\n<section id=\"intro\">\n\n<h2>\n1. Welcome to Our Website\n</h2>\n\n<p>\nWelcome to the official website\nof the Citizens' Promotion Committee\nfor Attracting the Global AI Hub\nto Goyang Special City.\n</p>\n\n<p>\nThis website provides information\nabout the proposed Global AI Hub,\nthe Committee's activities,\nGoyang's location advantages,\nand opportunities\nfor public participation.\n</p>\n\n<p>\nIt also introduces\nthe potential role\nof international cooperation\nin addressing global challenges\nthrough responsible applications\nof artificial intelligence.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nNew Growth Opportunities for Goyang!<br>\nMore High-Quality Jobs for Goyang!<br>\nBring the Global AI Hub to Goyang!\n</strong>\n\n</div>\n\n<p>\nThe website can be accessed\nusing a computer,\ntablet,\nor smartphone.\n</p>\n\n<p>\nNo additional software\nis required.\nA standard internet browser\nis sufficient.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     2. MAIN SECTIONS\n===================================== -->\n\n<section id=\"menus\">\n\n<h2>\n2. Main Website Sections\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- COMMITTEE -->\n\n<div class=\"card\">\n\n<h3>\nAbout the Committee\n</h3>\n\n<p>\nLearn about the establishment,\nmission,\nguiding principles,\nand major activities\nof the Citizens' Promotion Committee.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"committee.html?lang=en\">\nExplore\n</a>\n\n</div>\n\n\u003c!-- HUB -->\n\n<div class=\"card\">\n\n<h3>\nAbout the Global AI Hub\n</h3>\n\n<p>\nExplore the proposed Global AI Hub,\nits international cooperation vision,\nand potential public-interest\nAI applications.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"hub.html?lang=en\">\nExplore\n</a>\n\n</div>\n\n\u003c!-- GOYANG -->\n\n<div class=\"card\">\n\n<h3>\nWhy Goyang Special City?\n</h3>\n\n<p>\nLearn about Goyang's\nlocation advantages,\nurban infrastructure,\nand potential competitiveness\nas a Global AI Hub location.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"goyang.html?lang=en\">\nExplore\n</a>\n\n</div>\n\n\u003c!-- AGENCIES -->\n\n<div class=\"card\">\n\n<h3>\nNine International Organizations\n</h3>\n\n<p>\nExplore the missions\nof nine international organizations\nand potential areas\nfor AI-related cooperation.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"agencies.html?lang=en\">\nExplore\n</a>\n\n</div>\n\n\u003c!-- STRATEGY -->\n\n<div class=\"card\">\n\n<h3>\nAttraction Strategy\n</h3>\n\n<p>\nLearn about the proposed strategy\nfor initial establishment,\noperational support,\nand shared long-term growth.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"strategy.html?lang=en\">\nExplore\n</a>\n\n</div>\n\n\u003c!-- PARTICIPATION -->\n\n<div class=\"card\">\n\n<h3>\nCitizen Participation Center\n</h3>\n\n<p>\nFind information\nabout online signatures,\nCommittee registration,\nsupporting membership,\nand other participation programs.\n</p>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=en\">\nParticipation Center\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. PARTICIPATION\n===================================== -->\n\n<section id=\"participation\">\n\n<h2>\n3. How to Participate\n</h2>\n\n<p>\nThe Citizen Participation Center\nprovides information\nabout five participation programs.\n</p>\n\n<p class=\"note\">\nThe application forms\nare currently available in Korean.\nPlease review the information\nand privacy notices\nbefore submitting a form.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- SIGNATURE -->\n\n<div class=\"card\">\n\n<h3>\n① Online Support Campaign\n</h3>\n\n<p>\nExpress your support\nfor the proposed Global AI Hub\nin Goyang Special City.\n</p>\n\n<ol class=\"steps\">\n\n<li>\nSelect the online support button.\n</li>\n\n<li>\nEnter the information requested\nin the application form.\n</li>\n\n<li>\nReview the privacy notice.\n</li>\n\n<li>\nSubmit the completed form.\n</li>\n\n</ol>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nJoin the Campaign\n</a>\n\n</div>\n\n\u003c!-- COMMITTEE -->\n\n<div class=\"card\">\n\n<h3>\n② Committee Registration\n</h3>\n\n<p>\nCitizens interested\nin actively participating\nin the Global AI Hub initiative\nmay apply to register\nas Committee members.\n</p>\n\n<p>\nPlease provide the information\nrequested in the registration form.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nRegister\n</a>\n\n</div>\n\n\u003c!-- SUPPORTING MEMBERSHIP -->\n\n<div class=\"card\">\n\n<h3>\n③ Supporting Membership\n</h3>\n\n<p>\nIndividuals wishing\nto support the Committee's\nactivities may apply\nfor supporting membership.\n</p>\n\n<p>\nAfter submitting the application,\nplease review the official\npayment information\ndisplayed in the\nCitizen Participation Center.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nApply for Membership\n</a>\n\n</div>\n\n\u003c!-- BANNER -->\n\n<div class=\"card\">\n\n<h3>\n④ Promotional Banner Application\n</h3>\n\n<p>\nApply to display\npromotional banners\nsupporting the proposed\nGlobal AI Hub initiative.\n</p>\n\n<p>\nPlease verify applicable\nlocal regulations,\nlocation requirements,\nand placement permissions.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nApply for a Banner\n</a>\n\n</div>\n\n\u003c!-- STICKER -->\n\n<div class=\"card\">\n\n<h3>\n⑤ Vehicle Promotion Sticker\n</h3>\n\n<p>\nApply for a promotional sticker\nto help raise awareness\nof the Global AI Hub initiative.\n</p>\n\n<p>\nProvide the required information,\nincluding contact details\nand the requested quantity.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/cisRHEsN61pxVycG8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nApply for a Sticker\n</a>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nApplication availability\nand processing schedules\nmay vary according\nto the Committee's operations.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     4. PAYMENT INFORMATION\n===================================== -->\n\n<section id=\"account\">\n\n<h2>\n4. Supporting Membership and Banner Payments\n</h2>\n\n<p>\nIf you wish to pay\na supporting membership contribution\nor a promotional banner cost,\nplease check the official\npayment account information\ndisplayed in the\nCitizen Participation Center.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nImportant Payment Information\n</strong>\n\n<p>\nBefore making a transfer,\nverify the bank name,\naccount number,\nand account holder.\n</p>\n\n<p>\nSubmitting an application\nand completing a bank transfer\nare separate procedures.\n</p>\n\n<p>\nIf the account information\nis not displayed\nor appears unclear,\ndo not transfer funds\nuntil the information\nhas been confirmed\nthrough the Committee's\nofficial guidance.\n</p>\n\n</div>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=en\">\nCheck Official Payment Information\n</a>\n\n<p class=\"note\">\nBank account information\nmay change.\nFor this reason,\naccount numbers\nare not reproduced\ndirectly in this guide.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     5. NEWS AND RESOURCES\n===================================== -->\n\n<section id=\"board\">\n\n<h2>\n5. News, Activities, and Resources\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- BOARD -->\n\n<div class=\"card\">\n\n<h3>\nCommunity Discussion Board\n</h3>\n\n<p>\nA space for sharing\ncitizen perspectives\nand information\nabout the Global AI Hub initiative.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"board.html\">\nVisit Board (Korean)\n</a>\n\n</div>\n\n\u003c!-- NEWS -->\n\n<div class=\"card\">\n\n<h3>\nNews & Announcements\n</h3>\n\n<p>\nRead updates\non Committee activities,\nevents,\nand important developments.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"news.html?lang=en\">\nView News\n</a>\n\n</div>\n\n\u003c!-- PRESS -->\n\n<div class=\"card\">\n\n<h3>\nMedia Coverage\n</h3>\n\n<p>\nExplore newspaper articles,\nbroadcast reports,\nand other media coverage\nrelated to the Global AI Hub initiative.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"press.html?lang=en\">\nView Media Coverage\n</a>\n\n</div>\n\n\u003c!-- HISTORY -->\n\n<div class=\"card\">\n\n<h3>\nTimeline and Milestones\n</h3>\n\n<p>\nReview major developments\nand Committee activities\nin chronological order.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"history.html?lang=en\">\nView Timeline\n</a>\n\n</div>\n\n</div>\n\n<p>\nSome linked resources\nand original news articles\nmay be available only in Korean.\n</p>\n\n<p>\nWhen participating\nin online discussions,\nplease respect other users\nand avoid sharing\npersonal information\nor misleading content.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     6. FAQ\n===================================== -->\n\n<section id=\"faq\">\n\n<h2>\n6. Frequently Asked Questions\n</h2>\n\n<div class=\"faq\">\n\n<h3>\nQ. Do I need to register\nto use this website?\n</h3>\n\n<p>\nGeneral information\ncan be accessed\nwithout registration.\nSome interactive functions\nmay require login\nor additional permissions.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. Is the online support campaign\nthe same as Committee registration?\n</h3>\n\n<p>\nNo.\nThe online support campaign\nallows individuals\nto express support\nfor the proposed Global AI Hub.\n</p>\n\n<p>\nCommittee registration\nis a separate process\nfor those wishing\nto participate\nin Committee activities.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. Does joining the online support campaign\nrequire a membership payment?\n</h3>\n\n<p>\nNo.\nThe online support campaign\nand supporting membership\nare separate participation programs.\n</p>\n\n<p>\nSigning the support form\ndoes not itself\nconstitute a commitment\nto pay a membership contribution.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. Does submitting a supporting\nmembership application\ncomplete the payment?\n</h3>\n\n<p>\nNo.\nSubmitting the application\nand transferring funds\nare separate procedures.\n</p>\n\n<p>\nPlease verify\nthe official payment information\nbefore making a transfer.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. Have the nine international organizations\nconfirmed their relocation to Goyang?\n</h3>\n\n<p>\nNo.\nThe international organizations\nintroduced on this website\nare discussed in connection\nwith potential cooperation\nunder the Global AI Hub initiative.\n</p>\n\n<p>\nTheir inclusion\ndoes not mean\nthat participation,\noffice establishment,\nor relocation to Goyang\nhas been officially confirmed.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. Can a promotional banner\nbe installed immediately\nafter submitting an application?\n</h3>\n\n<p>\nNo.\nSubmitting an application\ndoes not automatically\nauthorize banner installation.\n</p>\n\n<p>\nRelevant laws,\nlocal regulations,\nand location-specific requirements\nmust be observed.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. WEBSITE HELP\n===================================== -->\n\n<section id=\"help\">\n\n<h2>\n7. Website Help\n</h2>\n\n<h3>\nIf the Website Does Not Open\n</h3>\n\n<p>\nCheck your internet connection\nand website address.\nTry accessing the page again\nafter a short interval.\n</p>\n\n<h3>\nIf the Page Does Not Display Correctly\n</h3>\n\n<p>\nRefresh the page\nor try another browser.\n</p>\n\n<h3>\nIf an Application Form Does Not Open\n</h3>\n\n<p>\nSelect the application button again\nor open the form\nusing another browser.\n</p>\n\n<h3>\nIf Payment Account Information\nIs Not Displayed\n</h3>\n\n<p>\nRefresh the\nCitizen Participation Center\nand check again.\n</p>\n\n<p>\nIf the problem continues,\ndo not transfer funds\nuntil the account information\nhas been confirmed\nthrough official Committee guidance.\n</p>\n\n<h3>\nPersonal Data Protection\n</h3>\n\n<p>\nReview the relevant\npersonal data collection\nand use notice\nbefore submitting\nan application.\n</p>\n\n<p>\nDo not post\nanother person's\npersonal information\non public discussion boards.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"privacy.html\">\nPrivacy Policy (Korean)\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. CLOSING\n===================================== -->\n\n<section>\n\n<h2>\n8. Join Us in Building Goyang's Future\n</h2>\n\n<p>\nThe proposed Global AI Hub\nrepresents an opportunity\nto explore new growth,\nhigh-quality employment,\nand international cooperation\nfor Goyang Special City.\n</p>\n\n<p>\nCitizens and interested individuals\nmay participate\nthrough the online support campaign,\nCommittee registration,\nsupporting membership,\nand public awareness activities.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nEvery Expression of Interest\nand Every Act of Participation\nCan Help Shape\nGoyang's Future.\n</strong>\n\n</div>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=en\">\nCitizen Participation Center\n</a>\n\n<a\nclass=\"button secondary\"\nhref=\"index.html?lang=en\">\nEnglish Homepage\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- FOOTER -->\n\n<footer>\n\n<p>\n<strong>\nCitizens' Promotion Committee<br>\nfor Attracting the Global AI Hub<br>\nto Goyang Special City\n</strong>\n</p>\n\n<p>\nGyeonggi Province,\nRepublic of Korea\n</p>\n\n<p>\nWith Citizens,\nWith Gyeonggi Province,\nand With the World.\n</p>\n\n<p>\n<a href=\"index.html?lang=en\">\nEnglish Home\n</a>\n&nbsp; | &nbsp;\n<a href=\"participate.html?lang=en\">\nCitizen Participation\n</a>\n&nbsp; | &nbsp;\n<a href=\"guide.html\" lang=\"ko\">\n한국어\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=es": "<!DOCTYPE html>\n<html lang=\"es\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<meta name=\"description\"\ncontent=\"Guía de uso del sitio web de la iniciativa del Centro Global de Inteligencia Artificial en la Ciudad Especial de Goyang. Información, navegación, participación ciudadana y servicios en línea.\">\n\n<title>\nGuía de Uso del Sitio Web |\nCentro Global de IA en Goyang\n</title>\n\n<link rel=\"canonical\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/guide.html?lang=es\">\n\n<link rel=\"alternate\" hreflang=\"es\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/guide.html?lang=es\">\n\n<link rel=\"alternate\" hreflang=\"en\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/guide.html?lang=en\">\n\n<link rel=\"alternate\" hreflang=\"ko\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/guide.html\">\n\n<style>\n\n/* CONFIGURACIÓN GENERAL */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible,\nsummary:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* ENCABEZADO */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 50px 20px;\n}\n\nheader h1 {\n  margin: 0 0 15px;\n  font-size: clamp(28px, 5vw, 42px);\n}\n\nheader p {\n  font-size: 18px;\n  margin: 10px 0;\n  color: #e3efff;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  align-items: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 22px;\n  background: white;\n  color: #0754a6;\n  border-radius: 8px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* SELECTOR DE IDIOMA */\n\n.language-dropdown {\n  position: relative;\n  z-index: 1000;\n}\n\n.language-dropdown summary {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  padding: 10px 18px;\n  background: #ffe44d;\n  color: #003b79;\n  border-radius: 8px;\n  font-size: 14px;\n  font-weight: bold;\n  cursor: pointer;\n  list-style: none;\n}\n\n.language-dropdown summary::-webkit-details-marker {\n  display: none;\n}\n\n.language-options {\n  position: absolute;\n  top: calc(100% + 7px);\n  right: 0;\n  min-width: 180px;\n  padding: 8px;\n  background: white;\n  border: 1px solid #cbdff5;\n  border-radius: 8px;\n  box-shadow: 0 5px 18px rgba(0,0,0,.18);\n  text-align: left;\n}\n\n.language-options a {\n  display: block;\n  padding: 10px 12px;\n  color: #0754a6;\n  text-decoration: none;\n  border-radius: 5px;\n  font-size: 14px;\n}\n\n.language-options a:hover,\n.language-options a[aria-current=\"page\"] {\n  background: #eaf4ff;\n}\n\n.language-options a[aria-current=\"page\"] {\n  font-weight: bold;\n}\n\n/* NAVEGACIÓN RÁPIDA */\n\n.quick-nav {\n  max-width: 1150px;\n  margin: 25px auto;\n  padding: 0 15px;\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  justify-content: center;\n}\n\n.quick-nav a {\n  padding: 10px 16px;\n  background: #e4f0ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 25px;\n  text-decoration: none;\n  font-weight: bold;\n  font-size: 14px;\n}\n\n.quick-nav a:hover {\n  background: #cce2ff;\n}\n\n/* CONTENIDO PRINCIPAL */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n  scroll-margin-top: 20px;\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* TARJETAS */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 18px;\n}\n\n.card {\n  padding: 22px;\n  background: #f4f8fc;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* BOTONES */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 11px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: #0754a6;\n}\n\n.button.secondary:hover {\n  background: #cce2ff;\n}\n\n/* BLOQUES DESTACADOS */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 22px;\n  border-radius: 8px;\n  margin: 20px 0;\n}\n\n/* PASOS */\n\n.steps {\n  padding-left: 24px;\n}\n\n.steps li {\n  margin-bottom: 8px;\n}\n\n/* NOTAS */\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* PREGUNTAS FRECUENTES */\n\n.faq {\n  margin-bottom: 22px;\n}\n\n.faq h3 {\n  margin-bottom: 6px;\n}\n\n.faq p {\n  margin-top: 0;\n}\n\n/* PIE DE PÁGINA */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 35px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* DISEÑO MÓVIL */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 35px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 18px;\n  }\n\n  .button {\n    width: 100%;\n    text-align: center;\n  }\n\n  .language-options {\n    right: auto;\n    left: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- ENCABEZADO -->\n\n<header>\n\n<h1>\nGuía de Uso del Sitio Web\n</h1>\n\n<p>\nIniciativa del Centro Global\nde Inteligencia Artificial<br>\nCiudad Especial de Goyang,\nProvincia de Gyeonggi,\nRepública de Corea\n</p>\n\n<p>\nGuía de información,\nnavegación y participación ciudadana\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=es\"\nclass=\"home-link\">\n← Inicio en español\n</a>\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"Seleccionar idioma\">\n🌐 Idioma ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a href=\"guide.html?lang=es\"\nlang=\"es\"\naria-current=\"page\">\nEspañol ✓\n</a>\n\n<a href=\"guide.html?lang=en\"\nlang=\"en\">\nEnglish\n</a>\n\n<a href=\"guide.html\"\nlang=\"ko\">\n한국어\n</a>\n\n</div>\n\n</details>\n\n</div>\n\n</header>\n\n\u003c!-- NAVEGACIÓN RÁPIDA -->\n\n<nav\nclass=\"quick-nav\"\naria-label=\"Navegación de la guía\">\n\n<a href=\"#intro\">\nIntroducción\n</a>\n\n<a href=\"#menus\">\nSecciones principales\n</a>\n\n<a href=\"#participation\">\nParticipación\n</a>\n\n<a href=\"#account\">\nInformación de pago\n</a>\n\n<a href=\"#board\">\nNoticias y recursos\n</a>\n\n<a href=\"#faq\">\nPreguntas frecuentes\n</a>\n\n<a href=\"#help\">\nAyuda\n</a>\n\n</nav>\n\n<main>\n\n\u003c!-- =====================================\n     1. INTRODUCCIÓN\n===================================== -->\n\n<section id=\"intro\">\n\n<h2>\n1. Bienvenidos a Nuestro Sitio Web\n</h2>\n\n<p>\nBienvenidos al sitio web oficial\ndel Comité Ciudadano de Promoción\npara la Atracción del Centro Global\nde Inteligencia Artificial\na la Ciudad Especial de Goyang.\n</p>\n\n<p>\nEste sitio web proporciona información\nsobre la propuesta del Centro Global de IA,\nlas actividades del Comité,\nlas ventajas de ubicación de Goyang\ny las oportunidades de participación ciudadana.\n</p>\n\n<p>\nTambién presenta\nel posible papel\nde la cooperación internacional\npara afrontar desafíos globales\nmediante aplicaciones responsables\nde la inteligencia artificial.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n¡Nuevas oportunidades de crecimiento para Goyang!<br>\n¡Más empleos de calidad para Goyang!<br>\n¡Atraigamos el Centro Global de IA a Goyang!\n</strong>\n\n</div>\n\n<p>\nPuede acceder a este sitio web\ndesde un ordenador,\nuna tableta\no un teléfono inteligente.\n</p>\n\n<p>\nNo es necesario instalar\nningún programa adicional.\nEs suficiente utilizar\nun navegador de Internet convencional.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     2. SECCIONES PRINCIPALES\n===================================== -->\n\n<section id=\"menus\">\n\n<h2>\n2. Secciones Principales del Sitio Web\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- COMITÉ -->\n\n<div class=\"card\">\n\n<h3>\nAcerca del Comité\n</h3>\n\n<p>\nConozca la creación,\nla misión,\nlos principios rectores\ny las principales actividades\ndel Comité Ciudadano de Promoción.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"committee.html?lang=es\">\nExplorar\n</a>\n\n</div>\n\n\u003c!-- CENTRO GLOBAL DE IA -->\n\n<div class=\"card\">\n\n<h3>\nAcerca del Centro Global de IA\n</h3>\n\n<p>\nExplore la propuesta\ndel Centro Global de IA,\nsu visión de cooperación internacional\ny las posibles aplicaciones\nde inteligencia artificial\nde interés público.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"hub.html?lang=es\">\nExplorar\n</a>\n\n</div>\n\n\u003c!-- GOYANG -->\n\n<div class=\"card\">\n\n<h3>\n¿Por qué la Ciudad Especial de Goyang?\n</h3>\n\n<p>\nConozca las ventajas\nde ubicación de Goyang,\nsu infraestructura urbana\ny su posible competitividad\ncomo sede del Centro Global de IA.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"goyang.html?lang=es\">\nExplorar\n</a>\n\n</div>\n\n\u003c!-- ORGANIZACIONES INTERNACIONALES -->\n\n<div class=\"card\">\n\n<h3>\nNueve Organizaciones Internacionales\n</h3>\n\n<p>\nConozca las misiones\nde nueve organizaciones internacionales\ny las posibles áreas\nde cooperación relacionadas\ncon la inteligencia artificial.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"agencies.html?lang=es\">\nExplorar\n</a>\n\n</div>\n\n\u003c!-- ESTRATEGIA -->\n\n<div class=\"card\">\n\n<h3>\nEstrategia de Atracción\n</h3>\n\n<p>\nConozca la estrategia propuesta\npara el establecimiento inicial,\nel apoyo operativo\ny el crecimiento compartido\na largo plazo.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"strategy.html?lang=es\">\nExplorar\n</a>\n\n</div>\n\n\u003c!-- PARTICIPACIÓN -->\n\n<div class=\"card\">\n\n<h3>\nCentro de Participación Ciudadana\n</h3>\n\n<p>\nEncuentre información\nsobre firmas de apoyo,\ninscripción en el Comité,\nafiliación como miembro colaborador\ny otros programas de participación.\n</p>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=es\">\nCentro de Participación\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. PARTICIPACIÓN\n===================================== -->\n\n<section id=\"participation\">\n\n<h2>\n3. Cómo Participar\n</h2>\n\n<p>\nEl Centro de Participación Ciudadana\nofrece información\nsobre cinco programas\nde participación.\n</p>\n\n<p class=\"note\">\nLos formularios de solicitud\nestán disponibles actualmente\nen coreano.\nRevise la información\ny los avisos de privacidad\nantes de enviar un formulario.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- CAMPAÑA DE APOYO -->\n\n<div class=\"card\">\n\n<h3>\n① Campaña de Apoyo en Línea\n</h3>\n\n<p>\nExprese su apoyo\na la propuesta\nde establecer el Centro Global de IA\nen la Ciudad Especial de Goyang.\n</p>\n\n<ol class=\"steps\">\n\n<li>\nSeleccione el botón\nde participación en la campaña.\n</li>\n\n<li>\nIntroduzca la información solicitada\nen el formulario.\n</li>\n\n<li>\nRevise el aviso de privacidad.\n</li>\n\n<li>\nEnvíe el formulario completado.\n</li>\n\n</ol>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nParticipar en la Campaña\n</a>\n\n</div>\n\n\u003c!-- INSCRIPCIÓN EN EL COMITÉ -->\n\n<div class=\"card\">\n\n<h3>\n② Inscripción en el Comité\n</h3>\n\n<p>\nLos ciudadanos interesados\nen participar activamente\nen la iniciativa\ndel Centro Global de IA\npueden solicitar\nsu inscripción como miembros\ndel Comité.\n</p>\n\n<p>\nProporcione la información\nsolicitada en el
