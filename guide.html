formulario\nde inscripción.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nInscribirse\n</a>\n\n</div>\n\n\u003c!-- MIEMBROS COLABORADORES -->\n\n<div class=\"card\">\n\n<h3>\n③ Afiliación como Miembro Colaborador\n</h3>\n\n<p>\nLas personas que deseen\napoyar las actividades\ndel Comité\npueden solicitar\nsu afiliación\ncomo miembros colaboradores.\n</p>\n\n<p>\nDespués de presentar\nla solicitud,\nconsulte la información oficial\nde pago disponible\nen el Centro\nde Participación Ciudadana.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nSolicitar Afiliación\n</a>\n\n</div>\n\n\u003c!-- PANCARTAS -->\n\n<div class=\"card\">\n\n<h3>\n④ Solicitud de Pancartas Promocionales\n</h3>\n\n<p>\nSolicite la instalación\nde pancartas promocionales\nen apoyo de la propuesta\ndel Centro Global de IA.\n</p>\n\n<p>\nVerifique las normas locales,\nlos requisitos de ubicación\ny las autorizaciones necesarias\npara su instalación.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nSolicitar una Pancarta\n</a>\n\n</div>\n\n\u003c!-- ADHESIVOS -->\n\n<div class=\"card\">\n\n<h3>\n⑤ Adhesivos Promocionales para Vehículos\n</h3>\n\n<p>\nSolicite un adhesivo promocional\npara contribuir\na la difusión\nde la iniciativa\ndel Centro Global de IA.\n</p>\n\n<p>\nProporcione la información requerida,\nincluidos los datos de contacto\ny la cantidad solicitada.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/cisRHEsN61pxVycG8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nSolicitar un Adhesivo\n</a>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nLa disponibilidad\nde los programas\ny los plazos de tramitación\npueden variar\nsegún las actividades\ndel Comité.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     4. INFORMACIÓN DE PAGO\n===================================== -->\n\n<section id=\"account\">\n\n<h2>\n4. Pagos de Miembros Colaboradores\ny Pancartas Promocionales\n</h2>\n\n<p>\nSi desea realizar\nuna contribución\ncomo miembro colaborador\no pagar el coste\nde una pancarta promocional,\nconsulte la información\nde las cuentas bancarias oficiales\ndisponible en el\nCentro de Participación Ciudadana.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nInformación Importante sobre Pagos\n</strong>\n\n<p>\nAntes de realizar\nuna transferencia,\nverifique el nombre del banco,\nel número de cuenta\ny el titular de la cuenta.\n</p>\n\n<p>\nLa presentación\nde una solicitud\ny la realización\nde una transferencia bancaria\nson procedimientos independientes.\n</p>\n\n<p>\nSi la información\nde la cuenta bancaria\nno aparece\no no está clara,\nno transfiera fondos\nhasta confirmar los datos\nmediante las indicaciones oficiales\ndel Comité.\n</p>\n\n</div>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=es\">\nConsultar Información Oficial de Pago\n</a>\n\n<p class=\"note\">\nLa información bancaria\npuede cambiar.\nPor esta razón,\nlos números de cuenta\nno se reproducen directamente\nen esta guía.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     5. NOTICIAS Y RECURSOS\n===================================== -->\n\n<section id=\"board\">\n\n<h2>\n5. Noticias, Actividades y Recursos\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- TABLÓN -->\n\n<div class=\"card\">\n\n<h3>\nForo de Debate Ciudadano\n</h3>\n\n<p>\nEspacio para compartir\nopiniones ciudadanas\ne información\nsobre la iniciativa\ndel Centro Global de IA.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"board.html\">\nVisitar el Foro (en coreano)\n</a>\n\n</div>\n\n\u003c!-- NOTICIAS -->\n\n<div class=\"card\">\n\n<h3>\nNoticias y Avisos\n</h3>\n\n<p>\nConsulte las novedades\nsobre las actividades\ndel Comité,\nlos eventos\ny los principales acontecimientos.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"news.html?lang=es\">\nVer Noticias\n</a>\n\n</div>\n\n\u003c!-- PRENSA -->\n\n<div class=\"card\">\n\n<h3>\nCobertura de Prensa\n</h3>\n\n<p>\nExplore artículos\nde periódicos,\nreportajes de televisión\ny otras informaciones\nde los medios\nrelacionadas\ncon la iniciativa\ndel Centro Global de IA.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"press.html?lang=es\">\nVer Cobertura de Prensa\n</a>\n\n</div>\n\n\u003c!-- CRONOLOGÍA -->\n\n<div class=\"card\">\n\n<h3>\nCronología y Principales Acontecimientos\n</h3>\n\n<p>\nRevise los principales\nacontecimientos\ny las actividades\ndel Comité\nen orden cronológico.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"history.html?lang=es\">\nVer Cronología\n</a>\n\n</div>\n\n</div>\n\n<p>\nAlgunos recursos\ny artículos originales\npueden estar disponibles\núnicamente en coreano.\n</p>\n\n<p>\nAl participar\nen debates en línea,\nrespete a los demás usuarios\ny evite compartir\ninformación personal\no contenidos engañosos.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     6. PREGUNTAS FRECUENTES\n===================================== -->\n\n<section id=\"faq\">\n\n<h2>\n6. Preguntas Frecuentes\n</h2>\n\n<div class=\"faq\">\n\n<h3>\nP. ¿Es necesario registrarse\npara utilizar este sitio web?\n</h3>\n\n<p>\nLa información general\npuede consultarse\nsin necesidad de registrarse.\nAlgunas funciones interactivas\npueden requerir\ninicio de sesión\no permisos adicionales.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nP. ¿La campaña de apoyo en línea\nes lo mismo que la inscripción\nen el Comité?\n</h3>\n\n<p>\nNo.\nLa campaña de apoyo en línea\npermite expresar\nel respaldo ciudadano\na la propuesta\ndel Centro Global de IA.\n</p>\n\n<p>\nLa inscripción en el Comité\nes un procedimiento independiente\npara quienes deseen\nparticipar en sus actividades.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nP. ¿Participar en la campaña\nde apoyo requiere pagar\nuna cuota de afiliación?\n</h3>\n\n<p>\nNo.\nLa campaña de apoyo\ny la afiliación\ncomo miembro colaborador\nson programas diferentes.\n</p>\n\n<p>\nFirmar el formulario de apoyo\nno implica por sí mismo\nningún compromiso\nde realizar una contribución económica.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nP. ¿La presentación\nde una solicitud\nde afiliación\ncompleta automáticamente\nel pago?\n</h3>\n\n<p>\nNo.\nLa presentación\nde la solicitud\ny la transferencia de fondos\nson procedimientos independientes.\n</p>\n\n<p>\nVerifique la información\noficial de pago\nantes de realizar\nuna transferencia.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nP. ¿Las nueve organizaciones\ninternacionales\nhan confirmado\nsu traslado a Goyang?\n</h3>\n\n<p>\nNo.\nLas organizaciones internacionales\npresentadas en este sitio web\nse mencionan\nen relación con posibles\námbitos de cooperación\ndentro de la iniciativa\ndel Centro Global de IA.\n</p>\n\n<p>\nSu inclusión\nno significa\nque su participación,\nel establecimiento\nde oficinas\no su traslado a Goyang\nhayan sido oficialmente confirmados.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nP. ¿Se puede instalar\nuna pancarta promocional\ninmediatamente después\nde presentar la solicitud?\n</h3>\n\n<p>\nNo.\nLa presentación\nde una solicitud\nno autoriza automáticamente\nla instalación\nde una pancarta.\n</p>\n\n<p>\nDeben respetarse\nlas leyes aplicables,\nlas normas locales\ny los requisitos específicos\nde cada ubicación.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. AYUDA\n===================================== -->\n\n<section id=\"help\">\n\n<h2>\n7. Ayuda para Utilizar el Sitio Web\n</h2>\n\n<h3>\nSi el Sitio Web No Se Abre\n</h3>\n\n<p>\nCompruebe su conexión\na Internet\ny la dirección del sitio web.\nIntente acceder nuevamente\ndespués de unos momentos.\n</p>\n\n<h3>\nSi la Página No Se Muestra Correctamente\n</h3>\n\n<p>\nActualice la página\no utilice otro navegador.\n</p>\n\n<h3>\nSi un Formulario de Solicitud No Se Abre\n</h3>\n\n<p>\nSeleccione nuevamente\nel botón de solicitud\no abra el formulario\ncon otro navegador.\n</p>\n\n<h3>\nSi No Aparece\nla Información Bancaria\n</h3>\n\n<p>\nActualice la página\ndel Centro de Participación Ciudadana\ny vuelva a comprobar\nla información.\n</p>\n\n<p>\nSi el problema continúa,\nno transfiera fondos\nhasta confirmar\nla información bancaria\nmediante las indicaciones\noficiales del Comité.\n</p>\n\n<h3>\nProtección de Datos Personales\n</h3>\n\n<p>\nRevise el aviso correspondiente\nsobre recopilación\ny utilización\nde datos personales\nantes de presentar\nuna solicitud.\n</p>\n\n<p>\nNo publique\ninformación personal\nde otras personas\nen foros públicos.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"privacy.html\">\nPolítica de Privacidad (en coreano)\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. MENSAJE FINAL\n===================================== -->\n\n<section>\n\n<h2>\n8. Construyamos Juntos\nel Futuro de Goyang\n</h2>\n\n<p>\nLa propuesta\ndel Centro Global de IA\nrepresenta una oportunidad\npara explorar\nnuevas fuentes de crecimiento,\nempleos de calidad\ny cooperación internacional\nen la Ciudad Especial de Goyang.\n</p>\n\n<p>\nLos ciudadanos\ny las personas interesadas\npueden participar\nmediante la campaña\nde apoyo en línea,\nla inscripción en el Comité,\nla afiliación\ncomo miembros colaboradores\ny las actividades\nde sensibilización pública.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nCada expresión de interés\ny cada acto de participación\npueden contribuir\na construir\nel futuro de Goyang.\n</strong>\n\n</div>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=es\">\nCentro de Participación Ciudadana\n</a>\n\n<a\nclass=\"button secondary\"\nhref=\"index.html?lang=es\">\nPágina Principal en Español\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIE DE PÁGINA -->\n\n<footer>\n\n<p>\n<strong>\nComité Ciudadano de Promoción<br>\npara la Atracción del Centro Global de IA<br>\na la Ciudad Especial de Goyang\n</strong>\n</p>\n\n<p>\nProvincia de Gyeonggi,\nRepública de Corea\n</p>\n\n<p>\nCon los ciudadanos,<br>\ncon la provincia de Gyeonggi<br>\ny con el mundo.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=es\">\nInicio en español\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"participate.html?lang=es\">\nParticipación Ciudadana\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"guide.html?lang=en\" lang=\"en\">\nEnglish\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"guide.html\" lang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=fr": "<!DOCTYPE html>\n<html lang=\"fr\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<meta name=\"description\"\ncontent=\"Guide d'utilisation du site de l'initiative du Centre mondial de l'IA à Goyang. Découvrez les informations, les activités citoyennes, les actualités et les services en ligne.\">\n\n<title>\nGuide d'utilisation du site |\nInitiative du Centre mondial de l'IA\n</title>\n\n<style>\n\n/* CONFIGURATION GÉNÉRALE */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    Arial,\n    Helvetica,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* EN-TÊTE */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 50px 20px;\n}\n\nheader h1 {\n  margin: 0 0 15px;\n  font-size: clamp(28px, 5vw, 42px);\n}\n\nheader p {\n  font-size: 18px;\n  margin: 10px 0;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 22px;\n  background: white;\n  color: #0754a6;\n  border-radius: 8px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* NAVIGATION RAPIDE */\n\n.quick-nav {\n  max-width: 1150px;\n  margin: 25px auto;\n  padding: 0 15px;\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  justify-content: center;\n}\n\n.quick-nav a {\n  padding: 10px 16px;\n  background: #e4f0ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 25px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n.quick-nav a:hover {\n  background: #d2e6ff;\ style>\n\n</head>\n\n<body>\n\n\u003c!-- EN-TÊTE -->\n\n<header>\n\n<h1>\nGuide d'utilisation du site\n</h1>\n\n<p>\nInitiative du Centre mondial de l'IA<br>\nVille spéciale de Goyang,<br>\nProvince de Gyeonggi,<br>\nRépublique de Corée\n</p>\n\n<p>\nGuide des informations,\nde la navigation\net de la participation citoyenne\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=fr\"\nclass=\"home-link\">\n← Accueil — Français\n</a>\n\n</div>\n\n</header>\n\n\u003c!-- NAVIGATION RAPIDE -->\n\n<nav\nclass=\"quick-nav\"\naria-label=\"Navigation dans le guide du site\">\n\n<a href=\"#intro\">\nIntroduction\n</a>\n\n<a href=\"#menus\">\nRubriques principales\n</a>\n\n<a href=\"#participation\">\nParticipation\n</a>\n\n<a href=\"#account\">\nPaiements\n</a>\n\n<a href=\"#board\">\nActualités et ressources\n</a>\n\n<a href=\"#faq\">\nFAQ\n</a>\n\n<a href=\"#help\">\nAssistance\n</a>\n\n</nav>\n\n<main>\n\n\u003c!-- =====================================\n     1. INTRODUCTION\n===================================== -->\n\n<section id=\"intro\">\n\n<h2>\n1. Bienvenue sur notre site\n</h2>\n\n<p>\nBienvenue sur le site officiel\ndu Comité citoyen de promotion\npour l'implantation\ndu Centre mondial de l'IA\ndans la ville spéciale de Goyang.\n</p>\n\n<p>\nCe site présente\nle projet de Centre mondial de l'IA,\nles activités du Comité,\nles avantages territoriaux de Goyang\net les possibilités\nde participation citoyenne.\n</p>\n\n<p>\nIl présente également\nle rôle potentiel\nde la coopération internationale\ndans la recherche de solutions\naux défis mondiaux\ngrâce à des applications responsables\nde l'intelligence artificielle.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nDe nouvelles possibilités de croissance pour Goyang !<br>\nDavantage d'emplois de qualité pour Goyang !<br>\nAccueillons le Centre mondial de l'IA à Goyang !\n</strong>\n\n</div>\n\n<p>\nLe site est accessible\ndepuis un ordinateur,\nune tablette\nou un smartphone.\n</p>\n\n<p>\nAucun logiciel supplémentaire\nn'est nécessaire.\nUn navigateur Internet standard suffit.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     2. RUBRIQUES PRINCIPALES\n===================================== -->\n\n<section id=\"menus\">\n\n<h2>\n2. Principales rubriques du site\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- COMITÉ -->\n\n<div class=\"card\">\n\n<h3>\nPrésentation du Comité\n</h3>\n\n<p>\nDécouvrez la création,\nla mission,\nles principes directeurs\net les principales activités\ndu Comité citoyen de promotion.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"committee.html?lang=fr\">\nDécouvrir\n</a>\n\n</div>\n\n\u003c!-- CENTRE MONDIAL DE L'IA -->\n\n<div class=\"card\">\n\n<h3>\nPrésentation du Centre mondial de l'IA\n</h3>\n\n<p>\nDécouvrez le projet\nde Centre mondial de l'IA,\nsa vision de coopération internationale\net les applications potentielles\nde l'IA au service de l'intérêt public.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"hub.html?lang=fr\">\nDécouvrir\n</a>\n\n</div>\n\n\u003c!-- GOYANG -->\n\n<div class=\"card\">\n\n<h3>\nPourquoi la ville spéciale de Goyang ?\n</h3>\n\n<p>\nDécouvrez les avantages territoriaux\nde Goyang,\nses infrastructures urbaines\net sa compétitivité potentielle\nen tant que site d'implantation\ndu Centre mondial de l'IA.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"goyang.html?lang=fr\">\nDécouvrir\n</a>\n\n</div>\n\n\u003c!-- ORGANISATIONS INTERNATIONALES -->\n\n<div class=\"card\">\n\n<h3>\nNeuf organisations internationales\n</h3>\n\n<p>\nDécouvrez les missions\nde neuf organisations internationales\net les domaines potentiels\nde coopération liés à l'IA.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"agencies.html?lang=fr\">\nDécouvrir\n</a>\n\n</div>\n\n\u003c!-- STRATÉGIE -->\n\n<div class=\"card\">\n\n<h3>\nStratégie d'implantation\n</h3>\n\n<p>\nDécouvrez la stratégie proposée\npour l'installation initiale,\nle soutien opérationnel\net la croissance partagée à long terme.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"strategy.html?lang=fr\">\nDécouvrir\n</a>\n\n</div>\n\n\u003c!-- PARTICIPATION -->\n\n<div class=\"card\">\n\n<h3>\nCentre de participation citoyenne\n</h3>\n\n<p>\nTrouvez des informations\nsur la campagne de soutien en ligne,\nl'inscription au Comité,\nl'adhésion en tant que membre de soutien\net les autres programmes\nde participation citoyenne.\n</p>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=fr\">\nCentre de participation\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. PARTICIPATION\n===================================== -->\n\n<section id=\"participation\">\n\n<h2>\n3. Comment participer\n</h2>\n\n<p>\nLe Centre de participation citoyenne\nprésente cinq programmes\nde participation.\n</p>\n\n<p class=\"note\">\nLes formulaires de candidature\nsont actuellement disponibles en coréen.\nVeuillez examiner attentivement\nles informations\net les avis de confidentialité\navant de soumettre un formulaire.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- CAMPAGNE DE SOUTIEN -->\n\n<div class=\"card\">\n\n<h3>\n① Campagne de soutien en ligne\n</h3>\n\n<p>\nExprimez votre soutien\nau projet de Centre mondial de l'IA\ndans la ville spéciale de Goyang.\n</p>\n\n<ol class=\"steps\">\n\n<li>\nSélectionnez le bouton\nde participation à la campagne.\n</li>\n\n<li>\nSaisissez les informations demandées\ndans le formulaire.\n</li>\n\n<li>\nConsultez l'avis\nrelatif à la protection\ndes données personnelles.\n</li>\n\n<li>\nEnvoyez le formulaire rempli.\n</li>\n\n</ol>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nParticiper à la campagne\n</a>\n\n</div>\n\n\u003c!-- INSCRIPTION AU COMITÉ -->\n\n<div class=\"card\">\n\n<h3>\n② Inscription au Comité\n</h3>\n\n<p>\nLes citoyens souhaitant\nparticiper activement\nà l'initiative du Centre mondial de l'IA\npeuvent demander\nà devenir membres du Comité.\n</p>\n\n<p>\nVeuillez fournir\nles informations demandées\ndans le formulaire d'inscription.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nS'inscrire\n</a>\n\n</div>\n\n\u003c!-- MEMBRES DE SOUTIEN -->\n\n<div class=\"card\">\n\n<h3>\n③ Adhésion en tant que membre de soutien\n</h3>\n\n<p>\nLes personnes souhaitant\nsoutenir les activités du Comité\npeuvent demander\nà devenir membres de soutien.\n</p>\n\n<p>\nAprès avoir envoyé votre demande,\nveuillez consulter\nles informations officielles\nrelatives au paiement\ndans le Centre de participation citoyenne.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nDemander l'adhésion\n</a>\n\n</div>\n\n\u003c!-- BANDEROLES -->\n\n<div class=\"card\">\n\n<h3>\n④ Demande de banderole promotionnelle\n</h3>\n\n<p>\nDemandez l'installation\nd'une banderole promotionnelle\nsoutenant le projet\nde Centre mondial de l'IA.\n</p>\n\n<p>\nVeuillez vérifier\nles réglementations locales applicables,\nles exigences relatives à l'emplacement\net les autorisations nécessaires.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nDemander une banderole\n</a>\n\n</div>\n\n\u003c!-- AUTOCOLLANTS -->\n\n<div class=\"card\">\n\n<h3>\n⑤ Autocollant promotionnel pour véhicule\n</h3>\n\n<p>\nDemandez un autocollant promotionnel\nafin de contribuer\nà la sensibilisation du public\nau projet de Centre mondial de l'IA.\n</p>\n\n<p>\nFournissez les informations nécessaires,\nnotamment vos coordonnées\net la quantité souhaitée.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/cisRHEsN61pxVycG8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nDemander un autocollant\n</a>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nLa disponibilité des formulaires\net les délais de traitement\npeuvent varier\nen fonction des activités du Comité.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     4. PAIEMENTS\n===================================== -->\n\n<section id=\"account\">\n\n<h2>\n4. Cotisations et paiements des banderoles\n</h2>\n\n<p>\nSi vous souhaitez verser\nune contribution\nen tant que membre de soutien\nou payer les frais\nd'une banderole promotionnelle,\nveuillez consulter\nles coordonnées bancaires officielles\naffichées dans le\nCentre de participation citoyenne.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nInformations importantes concernant les paiements\n</strong>\n\n<p>\nAvant d'effectuer un virement,\nvérifiez le nom de la banque,\nle numéro de compte\net le nom du titulaire du compte.\n</p>\n\n<p>\nL'envoi d'un formulaire\net la réalisation\nd'un virement bancaire\nconstituent deux procédures distinctes.\n</p>\n\n<p>\nSi les coordonnées bancaires\nne sont pas affichées\nou semblent incertaines,\nn'effectuez aucun virement\navant d'avoir confirmé\nles informations\nauprès du Comité\npar ses canaux officiels.\n</p>\n\n</div>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=fr\">\nVérifier les coordonnées bancaires officielles\n</a>\n\n<p class=\"note\">\nLes coordonnées bancaires\npeuvent être modifiées.\nC'est pourquoi\nles numéros de compte\nne sont pas reproduits\ndirectement dans ce guide.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     5. ACTUALITÉS ET RESSOURCES\n===================================== -->\n\n<section id=\"board\">\n\n<h2>\n5. Actualités, activités et ressources\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- FORUM -->\n\n<div class=\"card\">\n\n<h3>\nForum de discussion citoyen\n</h3>\n\n<p>\nUn espace permettant\nde partager\nles points de vue des citoyens\net des informations\nsur l'initiative\ndu Centre mondial de l'IA.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"board.html\">\nConsulter le forum (coréen)\n</a>\n\n</div>\n\n\u003c!-- ACTUALITÉS -->\n\n<div class=\"card\">\n\n<h3>\nActualités et annonces\n</h3>\n\n<p>\nConsultez les informations\nsur les activités du Comité,\nles événements\net les principales évolutions du projet.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"news.html?lang=fr\">\nVoir les actualités\n</a>\n\n</div>\n\n\u003c!-- PRESSE -->\n\n<div class=\"card\">\n\n<h3>\nRevue de presse\n</h3>\n\n<p>\nDécouvrez les articles de journaux,\nles reportages audiovisuels\net les autres publications médiatiques\nliés à l'initiative\ndu Centre mondial de l'IA.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"press.html?lang=fr\">\nVoir la revue de presse\n</a>\n\n</div>\n\n\u003c!-- CHRONOLOGIE -->\n\n<div class=\"card\">\n\n<h3>\nChronologie et principales étapes\n</h3>\n\n<p>\nConsultez les principales évolutions\net les activités du Comité\ndans l'ordre chronologique.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"history.html?lang=fr\">\nVoir la chronologie\n</a>\n\n</div>\n\n</div>\n\n<p>\nCertaines ressources\net certains articles originaux\npeuvent être disponibles\nuniquement en coréen.\n</p>\n\n<p>\nLorsque vous participez\nà des discussions en ligne,\nveuillez respecter\nles autres utilisateurs\net éviter de publier\ndes informations personnelles\nou des contenus trompeurs.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     6. FAQ\n===================================== -->\n\n<section id=\"faq\">\n\n<h2>\n6. Foire aux questions\n</h2>\n\n<div class=\"faq\">\n\n<h3>\nQ. Dois-je m'inscrire\npour utiliser ce site ?\n</h3>\n\n<p>\nLes informations générales\nsont accessibles\nsans inscription.\nCertaines fonctions interactives\npeuvent nécessiter\nune connexion\nou des autorisations supplémentaires.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. La campagne de soutien en ligne\nest-elle identique\nà l'inscription au Comité ?\n</h3>\n\n<p>\nNon.\nLa campagne de soutien en ligne\npermet aux personnes intéressées\nd'exprimer leur soutien\nau projet de Centre mondial de l'IA.\n</p>\n\n<p>\nL'inscription au Comité\nest une procédure distincte\ndestinée aux personnes souhaitant\nparticiper aux activités du Comité.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. La participation\nà la campagne de soutien en ligne\nnécessite-t-elle\nle paiement d'une cotisation ?\n</h3>\n\n<p>\nNon.\nLa campagne de soutien en ligne\net l'adhésion en tant que membre de soutien\nsont deux programmes distincts.\n</p>\n\n<p>\nSigner le formulaire de soutien\nne constitue pas\nun engagement à verser\nune contribution financière.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. L'envoi d'une demande d'adhésion\nen tant que membre de soutien\nsignifie-t-il que le paiement est effectué ?\n</h3>\n\n<p>\nNon.\nL'envoi de la demande\net le virement bancaire\nconstituent deux procédures distinctes.\n</p>\n\n<p>\nVeuillez vérifier\nles coordonnées bancaires officielles\navant d'effectuer un virement.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. Les neuf organisations internationales\nont-elles confirmé\nleur installation à Goyang ?\n</h3>\n\n<p>\nNon.\nLes organisations internationales\nprésentées sur ce site\nsont évoquées\ndans le cadre\ndes possibilités de coopération\nliées à l'initiative\ndu Centre mondial de l'IA.\n</p>\n\n<p>\nLeur présentation\nne signifie pas\nque leur participation,\nl'établissement de bureaux\nou leur installation à Goyang\nont été officiellement confirmés.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. Une banderole promotionnelle\npeut-elle être installée immédiatement\naprès l'envoi d'une demande ?\n</h3>\n\n<p>\nNon.\nL'envoi d'une demande\nn'autorise pas automatiquement\nl'installation d'une banderole.\n</p>\n\n<p>\nLes lois applicables,\nles réglementations locales\net les exigences propres\nà chaque emplacement\ndoivent être respectées.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. ASSISTANCE\n===================================== -->\n\n<section id=\"help\">\n\n<h2>\n7. Assistance pour l'utilisation du site\n</h2>\n\n<h3>\nSi le site ne s'ouvre pas\n</h3>\n\n<p>\nVérifiez votre connexion Internet\net l'adresse du site.\nEssayez d'accéder de nouveau\nà la page après quelques instants.\n</p>\n\n<h3>\nSi la page ne s'affiche pas correctement\n</h3>\n\n<p>\nActualisez la page\nou essayez un autre navigateur.\n</p>\n\n<h3>\nSi un formulaire de candidature\nne s'ouvre pas\n</h3>\n\n<p>\nCliquez de nouveau\nsur le bouton correspondant\nou ouvrez le formulaire\navec un autre navigateur.\n</p>\n\n<h3>\nSi les coordonnées bancaires\nne sont pas affichées\n</h3>\n\n<p>\nActualisez la page\ndu Centre de participation citoyenne\net vérifiez de nouveau.\n</p>\n\n<p>\nSi le problème persiste,\nn'effectuez aucun virement\navant d'avoir confirmé\nles coordonnées bancaires\nauprès du Comité\npar ses canaux officiels.\n</p>\n\n<h3>\nProtection des données personnelles\n</h3>\n\n<p>\nConsultez l'avis\nrelatif à la collecte\net à l'utilisation\ndes données personnelles\navant de soumettre\nun formulaire.\n</p>\n\n<p>\nNe publiez pas\nles informations personnelles\nd'une autre personne\nsur les forums publics.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"privacy.html\">\nPolitique de confidentialité (coréen)\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. CONCLUSION\n===================================== -->\n\n<section>\n\n<h2>\n8. Construisons ensemble l'avenir de Goyang\n</h2>\n\n<p>\nLe projet de Centre mondial de l'IA\nreprésente une occasion\nd'explorer\nde nouvelles possibilités de croissance,\ndes emplois de qualité\net la coopération internationale\npour la ville spéciale de Goyang.\n</p>\n\n<p>\nLes citoyens\net les personnes intéressées\npeuvent participer\ngrâce à la campagne\nde soutien en ligne,\nà l'inscription au Comité,\nà l'adhésion\nen tant que membre de soutien\net aux activités\nde sensibilisation du public.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nChaque manifestation d'intérêt\net chaque acte de participation\npeuvent contribuer\nà façonner l'avenir de Goyang.\n</strong>\n\n</div>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=fr\">\nCentre de participation citoyenne\n</a>\n\n<a\nclass=\"button secondary\"\nhref=\"index.html?lang=fr\">\nAccueil — Français\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIED DE PAGE -->\n\n<footer>\n\n<p>\n<strong>\nComité citoyen de promotion<br>\npour l'implantation du Centre mondial de l'IA<br>\ndans la ville spéciale de Goyang\n</strong>\n</p>\n\n<p>\nProvince de Gyeonggi,<br>\nRépublique de Corée\n</p>\n\n<p>\nAvec les citoyens,<br>\navec la province de Gyeonggi<br>\net avec le monde.\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\">\nAccueil — Français\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"participate.html?lang=fr\">\nParticipation citoyenne\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=it": "<!DOCTYPE html>\n<html lang=\"it\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<meta name=\"description\"\ncontent=\"Guida all'utilizzo del sito web dell'iniziativa per un Polo Globale dell'IA nella Città Speciale di Goyang. Scopri come consultare le informazioni, partecipare alle attività civiche, leggere le notizie e utilizzare i servizi online.\">\n\n<title>\nGuida all'utilizzo del sito web |\nIniziativa per un Polo Globale dell'IA\n</title>\n\n<style>\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    Arial,\n    Helvetica,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* INTESTAZIONE */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 50px 20px;\n}\n\nheader h1 {\n  margin: 0 0 15px;\n  font-size: clamp(28px, 5vw, 42px);\n}\n\nheader p {\n  font-size: 18px;\n  margin: 10px 0;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 22px;\n  background: white;\n  color: #0754a6;\n  border-radius: 8px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* NAVIGAZIONE RAPIDA */\n\n.quick-nav {\n  max-width: 1150px;\n  margin: 25px auto;\n  padding: 0 15px;\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  justify-content: center;\n}\n\n.quick-nav a {\n  padding: 10px 16px;\n  background: #e4f0ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 25px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* CONTENUTO PRINCIPALE */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n  scroll-margin-top: 20px;\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* SCHEDE */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 18px;\n}\n\n.card {\n  padding: 22px;\n  background: #f4f8fc;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* PULSANTI */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 11px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: #0754a6;\n}\n\n/* RIQUADRI IN EVIDENZA */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 22px;\n  border-radius: 8px;\n  margin: 20px 0;\n}\n\n/* PROCEDURE */\n\n.steps {\n  padding-left: 24px;\n}\n\n.steps li {\n  margin-bottom: 8px;\n}\n\n/* NOTE */\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* DOMANDE FREQUENTI */\n\n.faq {\n  margin-bottom: 22px;\n}\n\n.faq h3 {\n  margin-bottom: 6px;\n}\n\n.faq p {\n  margin-top: 0;\n}\n\n/* PIÈ DI PAGINA */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 35px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* VERSIONE MOBILE */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 35px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 18px;\n  }\n\n  .button {\n    width: 100%;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- INTESTAZIONE -->\n\n<header>\n\n<h1>\nGuida all'utilizzo del sito web\n</h1>\n\n<p>\nIniziativa per un Polo Globale dell'IA<br>\nCittà Speciale di Goyang,<br>\nProvincia di Gyeonggi,<br>\nRepubblica di Corea\n</p>\n\n<p>\nGuida alle informazioni del sito,<br>\nalla navigazione<br>\ne alla partecipazione dei cittadini\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=it\"\nclass=\"home-link\">\n← Homepage italiana\n</a>\n\n</div>\n\n</header>\n\n\u003c!-- NAVIGAZIONE RAPIDA -->\n\n<nav\nclass=\"quick-nav\"\naria-label=\"Navigazione della guida al sito\">\n\n<a href=\"#intro\">\nIntroduzione\n</a>\n\n<a href=\"#menus\">\nSezioni principali\n</a>\n\n<a href=\"#participation\">\nPartecipazione\n</a>\n\n<a href=\"#account\">\nInformazioni sui pagamenti\n</a>\n\n<a href=\"#board\">\nNotizie e risorse\n</a>\n\n<a href=\"#faq\">\nDomande frequenti\n</a>\n\n<a href=\"#help\">\nAssistenza\n</a>\n\n</nav>\n\n<main>\n\n\u003c!-- =====================================\n     1. INTRODUZIONE\n===================================== -->\n\n<section id=\"intro\">\n\n<h2>\n1. Benvenuti nel nostro sito web\n</h2>\n\n<p>\nBenvenuti nel sito web ufficiale\ndel Comitato Civico Promotore\nper l'insediamento\ndel Polo Globale dell'IA\nnella Città Speciale di Goyang.\n</p>\n\n<p>\nQuesto sito fornisce informazioni\nsul Polo Globale dell'IA proposto,\nsulle attività del Comitato,\nsui vantaggi territoriali di Goyang\ne sulle opportunità\ndi partecipazione pubblica.\n</p>\n\n<p>\nPresenta inoltre\nil potenziale ruolo\ndella cooperazione internazionale\nnell'affrontare le sfide globali\nattraverso applicazioni responsabili\ndell'intelligenza artificiale.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nNuove opportunità di crescita per Goyang!<br>\nPiù posti di lavoro qualificati per Goyang!<br>\nPortiamo il Polo Globale dell'IA a Goyang!\n</strong>\n\n</div>\n\n<p>\nIl sito web è accessibile\ntramite computer,\ntablet\no smartphone.\n</p>\n\n<p>\nNon è necessario\ninstallare software aggiuntivo.\nÈ sufficiente utilizzare\nun normale browser Internet.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     2. SEZIONI PRINCIPALI\n===================================== -->\n\n<section id=\"menus\">\n\n<h2>\n2. Sezioni principali del sito\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- COMITATO -->\n\n<div class=\"card\">\n\n<h3>\nIl Comitato Civico Promotore\n</h3>\n\n<p>\nScopri la costituzione,\nla missione,\ni principi guida\ne le principali attività\ndel Comitato Civico Promotore.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"committee.html?lang=it\">\nEsplora\n</a>\n\n</div>\n\n\u003c!-- POLO GLOBALE DELL'IA -->\n\n<div class=\"card\">\n\n<h3>\nIl Polo Globale dell'IA\n</h3>\n\n<p>\nScopri il Polo Globale dell'IA proposto,\nla sua visione\ndi cooperazione internazionale\ne le potenziali applicazioni\ndell'intelligenza artificiale\nper il bene pubblico.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"hub.html?lang=it\">\nEsplora\n</a>\n\n</div>\n\n\u003c!-- GOYANG -->\n\n<div class=\"card\">\n\n<h3>\nPerché la Città Speciale di Goyang?\n</h3>\n\n<p>\nScopri i vantaggi territoriali di Goyang,\nle sue infrastrutture urbane\ne la sua potenziale competitività\ncome sede del Polo Globale dell'IA.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"goyang.html?lang=it\">\nEsplora\n</a>\n\n</div>\n\n\u003c!-- ORGANIZZAZIONI INTERNAZIONALI -->\n\n<div class=\"card\">\n\n<h3>\nNove organizzazioni internazionali\n</h3>\n\n<p>\nEsplora le missioni\ndi nove organizzazioni internazionali\ne i potenziali ambiti\ndi cooperazione legati\nall'intelligenza artificiale.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"agencies.html?lang=it\">\nEsplora\n</a>\n\n</div>\n\n\u003c!-- STRATEGIA -->\n\n<div class=\"card\">\n\n<h3>\nStrategia per l'insediamento\n</h3>\n\n<p>\nScopri la strategia proposta\nper l'insediamento iniziale,\nil sostegno operativo\ne la crescita condivisa\na lungo termine.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"strategy.html?lang=it\">\nEsplora\n</a>\n\n</div>\n\n\u003c!-- PARTECIPAZIONE -->\n\n<div class=\"card\">\n\n<h3>\nCentro di partecipazione dei cittadini\n</h3>\n\n<p>\nTrova informazioni\nsulla campagna di sostegno online,\nsull'iscrizione al Comitato,\nsull'adesione come socio sostenitore\ne sugli altri programmi\ndi partecipazione.\n</p>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=it\">\nCentro di partecipazione\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. PARTECIPAZIONE\n===================================== -->\n\n<section id=\"participation\">\n\n<h2>\n3. Come partecipare\n</h2>\n\n<p>\nIl Centro di partecipazione dei cittadini\nfornisce informazioni\nsu cinque programmi di partecipazione.\n</p>\n\n<p class=\"note\">\nI moduli di domanda\nsono attualmente disponibili\nin lingua coreana.\nPrima di inviare un modulo,\nsi prega di leggere attentamente\nle informazioni\ne le informative sulla privacy.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- CAMPAGNA DI SOSTEGNO -->\n\n<div class=\"card\">\n\n<h3>\n① Campagna di sostegno online\n</h3>\n\n<p>\nEsprimi il tuo sostegno\nall'iniziativa proposta\nper il Polo Globale dell'IA\nnella Città Speciale di Goyang.\n</p>\n\n<ol class=\"steps\">\n\n<li>\nSeleziona il pulsante\ndella campagna di sostegno online.\n</li>\n\n<li>\nInserisci le informazioni richieste\nnel modulo di partecipazione.\n</li>\n\n<li>\nLeggi l'informativa sulla privacy.\n</li>\n\n<li>\nInvia il modulo compilato.\n</li>\n\n</ol>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nPartecipa alla campagna\n</a>\n\n</div>\n\n\u003c!-- ISCRIZIONE AL COMITATO -->\n\n<div class=\"card\">\n\n<h3>\n② Iscrizione al Comitato\n</h3>\n\n<p>\nI cittadini interessati\na partecipare attivamente\nall'iniziativa del Polo Globale dell'IA\npossono richiedere\nl'iscrizione al Comitato.\n</p>\n\n<p>\nSi prega di fornire\nle informazioni richieste\nnel modulo di registrazione.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nIscriviti\n</a>\n\n</div>\n\n\u003c!-- SOCI SOSTENITORI -->\n\n<div class=\"card\">\n\n<h3>\n③ Adesione come socio sostenitore\n</h3>\n\n<p>\nLe persone che desiderano\nsostenere le attività del Comitato\npossono richiedere\nl'adesione come soci sostenitori.\n</p>\n\n<p>\nDopo aver presentato\nla domanda di adesione,\nsi prega di consultare\nle informazioni ufficiali\nsui pagamenti\nvisualizzate nel\nCentro di partecipazione dei cittadini.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nRichiedi l'adesione\n</a>\n\n</div>\n\n\u003c!-- STRISCIONI -->\n\n<div class=\"card\">\n\n<h3>\n④ Richiesta di striscioni promozionali\n</h3>\n\n<p>\nRichiedi l'installazione\ndi striscioni promozionali\na sostegno dell'iniziativa proposta\nper il Polo Globale dell'IA.\n</p>\n\n<p>\nSi prega di verificare\ni regolamenti locali applicabili,\ni requisiti relativi\nai luoghi di installazione\ne le autorizzazioni necessarie.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nRichiedi uno striscione\n</a>\n\n</div>\n\n\u003c!-- ADESIVI -->\n\n<div class=\"card\">\n\n<h3>\n⑤ Adesivo promozionale per veicoli\n</h3>\n\n<p>\nRichiedi un adesivo promozionale\nper contribuire\na far conoscere\nl'iniziativa del Polo Globale dell'IA.\n</p>\n\n<p>\nFornisci le informazioni richieste,\ncompresi i recapiti\ne la quantità desiderata.\n</p>\n\n<a\nclass=\"button\"\nhref=\"https://forms.gle/cisRHEsN61pxVycG8\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\nRichiedi un adesivo\n</a>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nLa disponibilità dei programmi\ne i tempi di elaborazione\ndelle domande\npossono variare\nin base alle attività del Comitato.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     4. INFORMAZIONI SUI PAGAMENTI\n===================================== -->\n\n<section id=\"account\">\n\n<h2>\n4. Pagamenti per i soci sostenitori\ne gli striscioni promozionali\n</h2>\n\n<p>\nSe desideri versare\nun contributo come socio sostenitore\no pagare il costo\ndi uno striscione promozionale,\nconsulta le informazioni ufficiali\nsui conti bancari\nvisualizzate nel\nCentro di partecipazione dei cittadini.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nInformazioni importanti sui pagamenti\n</strong>\n\n<p>\nPrima di effettuare\nun bonifico bancario,\nverifica il nome della banca,\nil numero di conto\ne l'intestatario.\n</p>\n\n<p>\nLa presentazione della domanda\ne il completamento\ndel bonifico bancario\nsono due procedure distinte.\n</p>\n\n<p>\nSe le informazioni sul conto\nnon vengono visualizzate\no risultano poco chiare,\nnon trasferire denaro\nfinché i dati non siano stati confermati\nattraverso le comunicazioni ufficiali\ndel Comitato.\n</p>\n\n</div>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=it\">\nVerifica le informazioni ufficiali sui pagamenti\n</a>\n\n<p class=\"note\">\nLe informazioni sui conti bancari\npossono cambiare.\nPer questo motivo,\ni numeri di conto\nnon sono riportati direttamente\nin questa guida.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     5. NOTIZIE E RISORSE\n===================================== -->\n\n<section id=\"board\">\n\n<h2>\n5. Notizie, attività e risorse\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- BACHECA -->\n\n<div class=\"card\">\n\n<h3>\nForum di discussione della comunità\n</h3>\n\n<p>\nUno spazio per condividere\nopinioni dei cittadini\ne informazioni\nsull'iniziativa del Polo Globale dell'IA.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"board.html\">\nVisita il forum (in coreano)\n</a>\n\n</div>\n\n\u003c!-- NOTIZIE -->\n\n<div class=\"card\">\n\n<h3>\nNotizie e comunicazioni\n</h3>\n\n<p>\nLeggi gli aggiornamenti\nsulle attività del Comitato,\nsugli eventi\ne sui principali sviluppi.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"news.html?lang=it\">\nVisualizza le notizie\n</a>\n\n</div>\n\n\u003c!-- RASSEGNA STAMPA -->\n\n<div class=\"card\">\n\n<h3>\nRassegna stampa\n</h3>\n\n<p>\nEsplora articoli di giornale,\nservizi radiotelevisivi\ne altre notizie dei media\nrelative all'iniziativa\ndel Polo Globale dell'IA.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"press.html?lang=it\">\nVisualizza la rassegna stampa\n</a>\n\n</div>\n\n\u003c!-- CRONOLOGIA -->\n\n<div class=\"card\">\n\n<h3>\nCronologia e principali tappe\n</h3>\n\n<p>\nEsamina i principali sviluppi\ne le attività del Comitato\nin ordine cronologico.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"history.html?lang=it\">\nVisualizza la cronologia\n</a>\n\n</div>\n\n</div>\n\n<p>\nAlcune risorse collegate\ne alcuni articoli originali\npotrebbero essere disponibili\nsoltanto in lingua coreana.\n</p>\n\n<p>\nQuando partecipi\nalle discussioni online,\nrispetta gli altri utenti\ned evita di condividere\ninformazioni personali\no contenuti fuorvianti.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     6. DOMANDE FREQUENTI\n===================================== -->\n\n<section id=\"faq\">\n\n<h2>\n6. Domande frequenti\n</h2>\n\n<div class=\"faq\">\n\n<h3>\nD. È necessario registrarsi\nper utilizzare questo sito web?\n</h3>\n\n<p>\nLe informazioni generali\nsono accessibili\nsenza registrazione.\nAlcune funzioni interattive\npotrebbero richiedere\nl'accesso a un account\no autorizzazioni aggiuntive.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nD. La campagna di sostegno online\nequivale all'iscrizione al Comitato?\n</h3>\n\n<p>\nNo.\nLa campagna di sostegno online\nconsente alle persone\ndi esprimere il proprio sostegno\nall'iniziativa proposta\nper il Polo Globale dell'IA.\n</p>\n\n<p>\nL'iscrizione al Comitato\nè una procedura separata\nper coloro che desiderano\npartecipare alle attività del Comitato.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nD. La partecipazione alla campagna\ndi sostegno online\nrichiede il pagamento\ndi una quota associativa?\n</h3>\n\n<p>\nNo.\nLa campagna di sostegno online\ne l'adesione come socio sostenitore\nsono programmi di partecipazione distinti.\n</p>\n\n<p>\nLa firma del modulo di sostegno\nnon comporta di per sé\nalcun impegno\na versare un contributo associativo.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nD. La presentazione\ndella domanda di adesione\ncome socio sostenitore\ncompleta il pagamento?\n</h3>\n\n<p>\nNo.\nLa presentazione della domanda\ne il trasferimento dei fondi\nsono due procedure distinte.\n</p>\n\n<p>\nSi prega di verificare\nle informazioni ufficiali\nsui pagamenti\nprima di effettuare un bonifico.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nD. Le nove organizzazioni internazionali\nhanno confermato\nil loro trasferimento a Goyang?\n</h3>\n\n<p>\nNo.\nLe organizzazioni internazionali\npresentate su questo sito\nsono menzionate\nin relazione a potenziali opportunità\ndi cooperazione\nnell'ambito dell'iniziativa\nper un Polo Globale dell'IA.\n</p>\n\n<p>\nLa loro inclusione\nnon significa\nche la partecipazione,\nl'apertura di uffici\no il trasferimento a Goyang\nsiano stati ufficialmente confermati.\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nD. È possibile installare\nuno striscione promozionale\nimmediatamente dopo\nla presentazione della domanda?\n</h3>\n\n<p>\nNo.\nLa presentazione della domanda\nnon autorizza automaticamente\nl'installazione dello striscione.\n</p>\n\n<p>\nDevono essere rispettate\nle leggi applicabili,\ni regolamenti locali\ne i requisiti specifici\ndel luogo di installazione.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. ASSISTENZA\n===================================== -->\n\n<section id=\"help\">\n\n<h2>\n7. Assistenza per l'utilizzo del sito\n</h2>\n\n<h3>\nSe il sito web non si apre\n</h3>\n\n<p>\nControlla la connessione Internet\ne l'indirizzo del sito.\nProva ad accedere nuovamente\nalla pagina dopo qualche istante.\n</p>\n\n<h3>\nSe la pagina non viene visualizzata correttamente\n</h3>\n\n<p>\nAggiorna la pagina\noppure prova a utilizzare\nun altro browser.\n</p>\n\n<h3>\nSe un modulo di domanda non si apre\n</h3>\n\n<p>\nSeleziona nuovamente\nil pulsante della domanda\noppure apri il modulo\nutilizzando un altro browser.\n</p>\n\n<h3>\nSe le informazioni sul conto bancario\nnon vengono visualizzate\n</h3>\n\n<p>\nAggiorna il\nCentro di partecipazione dei cittadini\ne controlla nuovamente.\n</p>\n\n<p>\nSe il problema persiste,\nnon trasferire fondi\nfinché le informazioni sul conto\nnon siano state confermate\nattraverso le comunicazioni ufficiali\ndel Comitato.\n</p>\n\n<h3>\nProtezione dei dati personali\n</h3>\n\n<p>\nPrima di presentare una domanda,\nconsulta la relativa informativa\nsulla raccolta\ne sull'utilizzo\ndei dati personali.\n</p>\n\n<p>\nNon pubblicare\ninformazioni personali\ndi altre persone\nnei forum di discussione pubblici.\n</p>\n\n<a\nclass=\"button secondary\"\nhref=\"privacy.html\">\nInformativa sulla privacy (in coreano)\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. CONCLUSIONE\n===================================== -->\n\n<section>\n\n<h2>\n8. Costruiamo insieme il futuro di Goyang\n</h2>\n\n<p>\nIl Polo Globale dell'IA proposto\nrappresenta un'opportunità\nper esplorare nuove prospettive\ndi crescita,\noccupazione di qualità\ne cooperazione internazionale\nper la Città Speciale di Goyang.\n</p>\n\n<p>\nI cittadini e le persone interessate\npossono partecipare\nattraverso la campagna\ndi sostegno online,\nl'iscrizione al Comitato,\nl'adesione come soci sostenitori\ne le attività di sensibilizzazione pubblica.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nOgni manifestazione di interesse\ne ogni forma di partecipazione\npossono contribuire\na costruire il futuro di Goyang.\n</strong>\n\n</div>\n\n<a\nclass=\"button\"\nhref=\"participate.html?lang=it\">\nCentro di partecipazione dei cittadini\n</a>\n\n<a\nclass=\"button secondary\"\nhref=\"index.html?lang=it\">\nHomepage italiana\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIÈ DI PAGINA -->\n\n<footer>\n\n<p>\n<strong>\nComitato Civico Promotore<br>\nper l'insediamento del Polo Globale dell'IA<br>\nnella Città Speciale di Goyang\n</strong>\n</p>\n\n<p>\nProvincia di Gyeonggi,<br>\nRepubblica di Corea\n</p>\n\n<p>\nCon i cittadini,<br>\ncon la Provincia di Gyeonggi<br>\ne con il mondo.\n</p>\n\n<p>\n<a href=\"index.html?lang=it\">\nHomepage italiana\n</a>\n&nbsp; | &nbsp;\n<a href=\"participate.html?lang=it\">\nPartecipazione dei cittadini\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=ja": "<!DOCTYPE html>\n<html lang=\"ja\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<meta\n  name=\"description\"\n  content=\"高陽特例市グローバルAIハブ構想のウェブサイト利用ガイド。情報の閲覧方法、市民参加、ニュース、オンライン申請、賛助会費のお支払い、よくあるご質問についてご案内します。\"\n>\n\n<title>\nウェブサイト利用ガイド |\nグローバルAIハブ構想\n</title>\n\n<style>\n\n/* =====================================\n   基本設定\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n\n  font-family:\n    \"Noto Sans JP\",\n    \"Hiragino Kaku Gothic ProN\",\n    \"Yu Gothic\",\n    Meiryo,\n    Arial,\n    sans-serif;\n\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ヘッダー\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 50px 20px;\n}\n\nheader h1 {\n  margin: 0 0 15px;\n  font-size: clamp(28px, 5vw, 42px);\n}\n\nheader p {\n  font-size: 18px;\n  margin: 10px 0;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 22px;\n  background: white;\n  color: #0754a6;\n  border-radius: 8px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   クイックナビゲーション\n===================================== */\n\n.quick-nav {\n  max-width: 1150px;\n  margin: 25px auto;\n  padding: 0 15px;\n\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  justify-content: center;\n}\n\n.quick-nav a {\n  padding: 10px 16px;\n  background: #e4f0ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 25px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n.quick-nav a:hover {\n  background: #cfe4ff;\n}\n\n/* =====================================\n   メインコンテンツ\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n\n  scroll-margin-top: 20px;\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   カード\n===================================== */\n\n.grid {\n  display: grid;\n\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n\n  gap: 18px;\n}\n\n.card {\n  padding: 22px;\n  background: #f4f8fc;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   ボタン\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 11px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: #0754a6;\n}\n\n.button.secondary:hover {\n  background: #cfe4ff;\n}\n\n/* =====================================\n   強調表示\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 22px;\n  border-radius: 8px;\n  margin: 20px 0;\n}\n\n/* =====================================\n   手順\n===================================== */\n\n.steps {\n  padding-left: 24px;\n}\n\n.steps li {\n  margin-bottom: 8px;\n}\n\n/* =====================================\n   注意事項\n===================================== */\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   よくあるご質問\n===================================== */\n\n.faq {\n  margin-bottom: 22px;\n}\n\n.faq h3 {\n  margin-bottom: 6px;\n}\n\n.faq p {\n  margin-top: 0;\n}\n\n/* =====================================\n   フッター\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 35px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   モバイル対応\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 35px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 18px;\n  }\n\n  .button {\n    width: 100%;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ヘッダー\n===================================== -->\n\n<header>\n\n<h1>\nウェブサイト利用ガイド\n</h1>\n\n<p>\nグローバルAIハブ構想<br>\n大韓民国・京畿道 高陽特例市\n</p>\n\n<p>\nウェブサイトの情報、\n各ページの閲覧方法、\n市民参加に関するご案内\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ja\"\n  class=\"home-link\"\n>\n  ← 日本語ホーム\n</a>\n\n<a\n  href=\"guide.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n>\n  한국어\n</a>\n\n</div>\n\n</header>\n\n\u003c!-- =====================================\n     クイックナビゲーション\n===================================== -->\n\n<nav\n  class=\"quick-nav\"\n  aria-label=\"ウェブサイト利用ガイドのナビゲーション\"\n>\n\n<a href=\"#intro\">\nはじめに\n</a>\n\n<a href=\"#menus\">\n主なメニュー\n</a>\n\n<a href=\"#participation\">\n市民参加\n</a>\n\n<a href=\"#account\">\nお支払い情報\n</a>\n\n<a href=\"#board\">\nニュース・資料\n</a>\n\n<a href=\"#faq\">\nよくあるご質問\n</a>\n\n<a href=\"#help\">\nヘルプ\n</a>\n\n</nav>\n\n<main>\n\n\u003c!-- =====================================\n     1. はじめに\n===================================== -->\n\n<section id=\"intro\">\n\n<h2>\n1. ウェブサイトへようこそ\n</h2>\n\n<p>\n高陽特例市グローバルAIハブ誘致\n市民推進委員会の\n公式ウェブサイトへようこそ。\n</p>\n\n<p>\nこのウェブサイトでは、\nグローバルAIハブ構想、\n市民推進委員会の活動、\n高陽特例市の立地上の強み、\n市民参加の機会などに関する\n情報を提供しています。\n</p>\n\n<p>\nまた、\n人工知能の責任ある活用を通じて\n地球規模の課題に取り組むための\n国際協力の可能性についても\nご紹介しています。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n高陽特例市に新たな成長機会を！<br>\n高陽特例市に質の高い雇用を！<br>\nグローバルAIハブを高陽特例市へ！\n</strong>\n\n</div>\n\n<p>\nこのウェブサイトは、\nパソコン、\nタブレット、\nスマートフォンから\nご利用いただけます。\n</p>\n\n<p>\n特別なソフトウェアの\nインストールは必要ありません。\n一般的なインターネットブラウザで\n閲覧できます。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     2. 主なメニュー\n===================================== -->\n\n<section id=\"menus\">\n\n<h2>\n2. ウェブサイトの主なメニュー\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- 市民推進委員会 -->\n\n<div class=\"card\">\n\n<h3>\n市民推進委員会について\n</h3>\n\n<p>\n市民推進委員会の設立、\n目的、\n基本方針、\n主な活動について\nご紹介します。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"committee.html?lang=ja\"\n>\n  詳しく見る\n</a>\n\n</div>\n\n\u003c!-- グローバルAIハブ -->\n\n<div class=\"card\">\n\n<h3>\nグローバルAIハブについて\n</h3>\n\n<p>\nグローバルAIハブ構想、\n国際協力のビジョン、\n公益のためのAI活用の\n可能性について\nご紹介します。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"hub.html?lang=ja\"\n>\n  詳しく見る\n</a>\n\n</div>\n\n\u003c!-- 高陽特例市 -->\n\n<div class=\"card\">\n\n<h3>\nなぜ高陽特例市なのか？\n</h3>\n\n<p>\n高陽特例市の\n立地上の強み、\n都市インフラ、\nグローバルAIハブの\n候補地としての\n潜在的な競争力を\nご紹介します。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"goyang.html?lang=ja\"\n>\n  詳しく見る\n</a>\n\n</div>\n\n\u003c!-- 国際機関 -->\n\n<div class=\"card\">\n\n<h3>\n9つの国際機関\n</h3>\n\n<p>\n9つの国際機関の\n使命と役割、\nAIに関連する\n潜在的な協力分野について\nご紹介します。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"agencies.html?lang=ja\"\n>\n  詳しく見る\n</a>\n\n</div>\n\n\u003c!-- 誘致戦略 -->\n\n<div class=\"card\">\n\n<h3>\nグローバルAIハブ誘致戦略\n</h3>\n\n<p>\n初期拠点の整備、\n運営支援、\n長期的な共同成長に向けた\n誘致戦略について\nご紹介します。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"strategy.html?lang=ja\"\n>\n  詳しく見る\n</a>\n\n</div>\n\n\u003c!-- 市民参加 -->\n\n<div class=\"card\">\n\n<h3>\n市民参加センター\n</h3>\n\n<p>\nオンライン署名運動、\n市民推進委員会への登録、\n賛助会員制度、\nその他の参加プログラムについて\nご案内します。\n</p>\n\n<a\n  class=\"button\"\n  href=\"participate.html?lang=ja\"\n>\n  市民参加センター\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. 市民参加\n===================================== -->\n\n<section id=\"participation\">\n\n<h2>\n3. 市民参加の方法\n</h2>\n\n<p>\n市民参加センターでは、\n5つの主な参加プログラムについて\nご案内しています。\n</p>\n\n<p class=\"note\">\n現在、\n各種申請フォームは\n韓国語で提供されています。\n申請前に、\nフォームの内容と\n個人情報の取扱いに関する\n説明をご確認ください。\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- 署名運動 -->\n\n<div class=\"card\">\n\n<h3>\n① オンライン署名運動\n</h3>\n\n<p>\nグローバルAIハブの\n高陽特例市への誘致を支持する\nオンライン署名運動に\n参加できます。\n</p>\n\n<ol class=\"steps\">\n\n<li>\nオンライン署名ボタンを選択します。\n</li>\n\n<li>\n申請フォームに必要な情報を入力します。\n</li>\n\n<li>\n個人情報の取扱いに関する説明を確認します。\n</li>\n\n<li>\n入力内容を確認して送信します。\n</li>\n\n</ol>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  署名運動に参加する\n</a>\n\n</div>\n\n\u003c!-- 委員会登録 -->\n\n<div class=\"card\">\n\n<h3>\n② 市民推進委員会への登録\n</h3>\n\n<p>\nグローバルAIハブ構想に\n積極的に参加したい市民は、\n市民推進委員会への\n登録を申し込むことができます。\n</p>\n\n<p>\n登録フォームに記載された\n必要事項を入力してください。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  委員会に登録する\n</a>\n\n</div>\n\n\u003c!-- 賛助会員 -->\n\n<div class=\"card\">\n\n<h3>\n③ 賛助会員への登録\n</h3>\n\n<p>\n市民推進委員会の活動を\n支援したい方は、\n賛助会員として\n登録を申し込むことができます。\n</p>\n\n<p>\n申請フォームを提出した後、\n市民参加センターに表示される\n正式な振込口座情報を\nご確認ください。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  賛助会員に申し込む\n</a>\n\n</div>\n\n\u003c!-- 横断幕 -->\n\n<div class=\"card\">\n\n<h3>\n④ 広報横断幕の申請\n</h3>\n\n<p>\nグローバルAIハブ構想を\n支持する広報横断幕の\n掲示を申し込むことができます。\n</p>\n\n<p>\n申請前に、\n地域の条例、\n設置場所に関する条件、\n必要な許可などを\nご確認ください。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  広報横断幕を申し込む\n</a>\n\n</div>\n\n\u003c!-- ステッカー -->\n\n<div class=\"card\">\n\n<h3>\n⑤ 車両用広報ステッカーの申請\n</h3>\n\n<p>\nグローバルAIハブ構想に対する\n市民の関心を広げるため、\n車両用広報ステッカーを\n申し込むことができます。\n</p>\n\n<p>\n連絡先や希望数量など、\n申請フォームに記載された\n必要事項を入力してください。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/cisRHEsN61pxVycG8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  ステッカーを申し込む\n</a>\n\n</div>\n\n</div>\n\n<p class=\"note\">\n申請の受付状況や\n処理日程は、\n市民推進委員会の\n運営状況によって\n変更される場合があります。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     4. お支払い情報\n===================================== -->\n\n<section id=\"account\">\n\n<h2>\n4. 賛助会費・広報横断幕費用のお支払い\n</h2>\n\n<p>\n賛助会費や\n広報横断幕の費用を\nお支払いになる場合は、\n市民参加センターに表示される\n正式な振込口座情報を\nご確認ください。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nお支払いに関する重要なお知らせ\n</strong>\n\n<p>\nお振り込みの前に、\n銀行名、\n口座番号、\n口座名義人を\n必ずご確認ください。\n</p>\n\n<p>\n申請フォームの提出と\n銀行振込は\nそれぞれ別の手続きです。\n</p>\n\n<p>\n口座情報が表示されない場合や、\n内容が不明確な場合は、\n市民推進委員会の\n公式案内によって\n確認できるまで\n送金しないでください。\n</p>\n\n</div>\n\n<a\n  class=\"button\"\n  href=\"participate.html?lang=ja\"\n>\n  正式な振込口座情報を確認する\n</a>\n\n<p class=\"note\">\n銀行口座情報は\n変更される可能性があります。\nそのため、\nこの利用ガイドには\n口座番号を直接掲載していません。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     5. ニュース・資料\n===================================== -->\n\n<section id=\"board\">\n\n<h2>\n5. ニュース・活動・関連資料\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- 掲示板 -->\n\n<div class=\"card\">\n\n<h3>\n市民交流掲示板\n</h3>\n\n<p>\nグローバルAIハブ構想に関する\n市民の意見や\n関連情報を共有するための\n掲示板です。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"board.html\"\n>\n  掲示板を見る（韓国語）\n</a>\n\n</div>\n\n\u003c!-- ニュース -->\n\n<div class=\"card\">\n\n<h3>\nニュース・お知らせ\n</h3>\n\n<p>\n市民推進委員会の活動、\nイベント、\n主な進展に関する\n最新情報をご覧いただけます。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"news.html?lang=ja\"\n>\n  ニュースを見る\n</a>\n\n</div>\n\n\u003c!-- メディア報道 -->\n\n<div class=\"card\">\n\n<h3>\nメディア報道\n</h3>\n\n<p>\nグローバルAIハブ構想に関する\n新聞記事、\n放送報道、\nその他のメディア情報を\nご紹介します。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"press.html?lang=ja\"\n>\n  メディア報道を見る\n</a>\n\n</div>\n\n\u003c!-- 推進経緯 -->\n\n<div class=\"card\">\n\n<h3>\n推進経緯と主な沿革\n</h3>\n\n<p>\nグローバルAIハブ構想に関する\n主な進展や\n市民推進委員会の活動を\n時系列でご覧いただけます。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"history.html?lang=ja\"\n>\n  主な沿革を見る\n</a>\n\n</div>\n\n</div>\n\n<p>\nリンク先の資料や\n報道記事の原文は、\n韓国語のみで提供されている\n場合があります。\n</p>\n\n<p>\nオンラインで意見交換を行う際は、\n他の利用者を尊重し、\n個人情報や\n誤解を招く情報を\n投稿しないよう\nご注意ください。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     6. よくあるご質問\n===================================== -->\n\n<section id=\"faq\">\n\n<h2>\n6. よくあるご質問\n</h2>\n\n<div class=\"faq\">\n\n<h3>\nQ. このウェブサイトを利用するには\n会員登録が必要ですか？\n</h3>\n\n<p>\n一般的な情報は、\n会員登録なしで\n閲覧できます。\n</p>\n\n<p>\n一部の双方向機能では、\nログインや\n追加の利用権限が\n必要となる場合があります。\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. オンライン署名運動と\n市民推進委員会への登録は\n同じものですか？\n</h3>\n\n<p>\nいいえ。\nオンライン署名運動は、\nグローバルAIハブの\n高陽特例市への誘致に対する\n支持を表明するものです。\n</p>\n\n<p>\n市民推進委員会への登録は、\n委員会の活動への参加を\n希望する方のための\n別の手続きです。\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. オンライン署名運動への参加には\n会費の支払いが必要ですか？\n</h3>\n\n<p>\nいいえ。\nオンライン署名運動と\n賛助会員制度は、\nそれぞれ独立した\n参加プログラムです。\n</p>\n\n<p>\n署名フォームを提出しても、\n賛助会費の支払いを\n約束したことにはなりません。\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. 賛助会員の申請フォームを\n提出すれば、\n支払いも完了しますか？\n</h3>\n\n<p>\nいいえ。\n申請フォームの提出と\n銀行振込は、\nそれぞれ別の手続きです。\n</p>\n\n<p>\n送金前に、\n正式な振込口座情報を\n必ずご確認ください。\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. 9つの国際機関の\n高陽特例市への移転は\n正式に決定していますか？\n</h3>\n\n<p>\nいいえ。\nこのウェブサイトで紹介している\n国際機関は、\nグローバルAIハブ構想における\n潜在的な協力の可能性に\n関連して紹介されています。\n</p>\n\n<p>\nこれらの国際機関が\n掲載されていることは、\nグローバルAIハブへの参加、\n事務所の設置、\n高陽特例市への移転が\n正式に決定したことを\n意味するものではありません。\n</p>\n\n</div>\n\n<div class=\"faq\">\n\n<h3>\nQ. 広報横断幕を申し込めば、\nすぐに設置できますか？\n</h3>\n\n<p>\nいいえ。\n申請フォームの提出によって、\n横断幕の設置が\n自動的に許可されるわけでは\nありません。\n</p>\n\n<p>\n関係法令、\n地域の条例、\n設置場所ごとの条件を\n遵守する必要があります。\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. ヘルプ\n===================================== -->\n\n<section id=\"help\">\n\n<h2>\n7. ウェブサイトのご利用に関するヘルプ\n</h2>\n\n<h3>\nウェブサイトが開かない場合\n</h3>\n\n<p>\nインターネット接続と\nウェブサイトのアドレスを\nご確認ください。\n</p>\n\n<p>\nしばらく時間をおいてから\n再度アクセスしてください。\n</p>\n\n<h3>\nページが正しく表示されない場合\n</h3>\n\n<p>\nページを再読み込みするか、\n別のブラウザで\nお試しください。\n</p>\n\n<h3>\n申請フォームが開かない場合\n</h3>\n\n<p>\n申請ボタンをもう一度選択するか、\n別のブラウザで\nフォームを開いてください。\n</p>\n\n<h3>\n振込口座情報が表示されない場合\n</h3>\n\n<p>\n市民参加センターのページを\n再読み込みし、\nもう一度ご確認ください。\n</p>\n\n<p>\n問題が解決しない場合は、\n市民推進委員会の\n公式案内によって\n口座情報が確認できるまで\n送金しないでください。\n</p>\n\n<h3>\n個人情報の保護\n</h3>\n\n<p>\n申請フォームを提出する前に、\n個人情報の収集および利用に関する\n説明をご確認ください。\n</p>\n\n<p>\n公開掲示板には、\n他人の個人情報を\n投稿しないでください。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"privacy.html\"\n>\n  個人情報保護方針（韓国語）\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. 最後に\n===================================== -->\n\n<section>\n\n<h2>\n8. 高陽特例市の未来をともに築く\n</h2>\n\n<p>\nグローバルAIハブ構想は、\n高陽特例市における\n新たな成長、\n質の高い雇用、\n国際協力の可能性を\n広げる機会となり得ます。\n</p>\n\n<p>\n市民や関心をお持ちの皆様は、\nオンライン署名運動、\n市民推進委員会への登録、\n賛助会員制度、\n広報活動などを通じて\n参加することができます。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n一人ひとりの関心と参加が、<br>\n高陽特例市の未来を<br>\n築く力となります。\n</strong>\n\n</div>\n\n<a\n  class=\"button\"\n  href=\"participate.html?lang=ja\"\n>\n  市民参加センター\n</a>\n\n<a\n  class=\"button secondary\"\n  href=\"index.html?lang=ja\"\n>\n  日本語ホームページ\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     フッター\n===================================== -->\n\n<footer>\n\n<p>\n\n<strong>\n高陽特例市グローバルAIハブ誘致<br>\n市民推進委員会\n</strong>\n\n</p>\n\n<p>\n大韓民国・京畿道\n</p>\n\n<p>\n市民とともに、京畿道とともに、<br>\nそして世界とともに。\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ja\">\n日本語ホーム\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"participate.html?lang=ja\">\n市民参加\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"guide.html\" lang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
