  padding: 10px 16px;\n  background: #e4f0ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 25px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* =====================================\n   ОСНОВНОЕ СОДЕРЖИМОЕ\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n  scroll-margin-top: 20px;\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   КАРТОЧКИ\n===================================== */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 18px;\n}\n\n.card {\n  padding: 22px;\n  background: #f4f8fc;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   КНОПКИ\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 11px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: #0754a6;\n}\n\n/* =====================================\n   ВЫДЕЛЕННЫЕ БЛОКИ\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 22px;\n  border-radius: 8px;\n  margin: 20px 0;\n}\n\n/* =====================================\n   ПОШАГОВЫЕ ИНСТРУКЦИИ\n===================================== */\n\n.steps {\n  padding-left: 24px;\n}\n\n.steps li {\n  margin-bottom: 8px;\n}\n\n/* =====================================\n   ПРИМЕЧАНИЯ\n===================================== */\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   ЧАСТО ЗАДАВАЕМЫЕ ВОПРОСЫ\n===================================== */\n\n.faq {\n  margin-bottom: 22px;\n}\n\n.faq h3 {\n  margin-bottom: 6px;\n}\n\n.faq p {\n  margin-top: 0;\n}\n\n/* =====================================\n   ПОДВАЛ САЙТА\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 35px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   МОБИЛЬНАЯ ВЕРСИЯ\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 35px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 18px;\n  }\n\n  .button {\n    width: 100%;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ШАПКА САЙТА\n===================================== -->\n\n<header>\n\n<h1>\nРуководство пользователя сайта\n</h1>\n\n<p>\nИнициатива «Глобальный центр ИИ»<br>\nОсобый город Коян,<br>\nпровинция Кёнгидо,<br>\nРеспублика Корея\n</p>\n\n<p>\nРуководство по информации сайта,<br>\nнавигации<br>\nи участию граждан\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ru\"\n  class=\"home-link\"\n>\n  ← Главная страница\n</a>\n\n<a\n  href=\"guide.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n>\n  한국어\n</a>\n\n</div>\n\n</header>\n\n\u003c!-- =====================================\n     БЫСТРАЯ НАВИГАЦИЯ\n===================================== -->\n\n<nav\n  class=\"quick-nav\"\n  aria-label=\"Навигация по руководству пользователя\"\n>\n\n<a href=\"#intro\">\nВведение\n</a>\n\n<a href=\"#menus\">\nОсновные разделы\n</a>\n\n<a href=\"#participation\">\nУчастие\n</a>\n\n<a href=\"#account\">\nПлатёжная информация\n</a>\n\n<a href=\"#board\">\nНовости и материалы\n</a>\n\n<a href=\"#faq\">\nВопросы и ответы\n</a>\n\n<a href=\"#help\">\nПомощь\n</a>\n\n</nav>\n\n<main>\n\n\u003c!-- =====================================\n     1. ВВЕДЕНИЕ\n===================================== -->\n\n<section id=\"intro\">\n\n<h2>\n1. Добро пожаловать на наш сайт\n</h2>\n\n<p>\nДобро пожаловать\nна официальный сайт\nГражданского комитета содействия\nразмещению Глобального центра ИИ\nв особом городе Коян.\n</p>\n\n<p>\nЭтот сайт предоставляет информацию\nо предлагаемой инициативе\n«Глобальный центр ИИ»,\nдеятельности Комитета,\nпреимуществах расположения Кояна\nи возможностях участия общественности.\n</p>\n\n<p>\nЗдесь также рассматривается\nпотенциальная роль\nмеждународного сотрудничества\nв решении глобальных проблем\nпосредством ответственного\nприменения искусственного интеллекта.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nНовые возможности роста для Кояна!<br>\nБольше качественных рабочих мест для Кояна!<br>\nПривлечём Глобальный центр ИИ в Коян!\n</strong>\n\n</div>\n\n<p>\nСайт доступен\nс компьютера,\nпланшета\nили смартфона.\n</p>\n\n<p>\nУстановка дополнительного\nпрограммного обеспечения\nне требуется.\nДостаточно обычного\nинтернет-браузера.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     2. ОСНОВНЫЕ РАЗДЕЛЫ\n===================================== -->\n\n<section id=\"menus\">\n\n<h2>\n2. Основные разделы сайта\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- КОМИТЕТ -->\n\n<div class=\"card\">\n\n<h3>\nО Гражданском комитете\n</h3>\n\n<p>\nУзнайте об истории создания,\nмиссии,\nосновных принципах\nи ключевых направлениях деятельности\nГражданского комитета содействия.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"committee.html?lang=ru\"\n>\n  Подробнее\n</a>\n\n</div>\n\n\u003c!-- ГЛОБАЛЬНЫЙ ЦЕНТР ИИ -->\n\n<div class=\"card\">\n\n<h3>\nО Глобальном центре ИИ\n</h3>\n\n<p>\nОзнакомьтесь\nс предлагаемой инициативой\n«Глобальный центр ИИ»,\nеё видением международного сотрудничества\nи потенциальными направлениями\nприменения ИИ\nв общественных интересах.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"hub.html?lang=ru\"\n>\n  Подробнее\n</a>\n\n</div>\n\n\u003c!-- КОЯН -->\n\n<div class=\"card\">\n\n<h3>\nПочему особый город Коян?\n</h3>\n\n<p>\nУзнайте о преимуществах\nгеографического расположения Кояна,\nгородской инфраструктуре\nи потенциальной конкурентоспособности\nгорода как места размещения\nГлобального центра ИИ.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"goyang.html?lang=ru\"\n>\n  Подробнее\n</a>\n\n</div>\n\n\u003c!-- МЕЖДУНАРОДНЫЕ ОРГАНИЗАЦИИ -->\n\n<div class=\"card\">\n\n<h3>\nДевять международных организаций\n</h3>\n\n<p>\nОзнакомьтесь с задачами\nдевяти международных организаций\nи потенциальными направлениями\nсотрудничества\nв области искусственного интеллекта.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"agencies.html?lang=ru\"\n>\n  Подробнее\n</a>\n\n</div>\n\n\u003c!-- СТРАТЕГИЯ -->\n\n<div class=\"card\">\n\n<h3>\nСтратегия привлечения\n</h3>\n\n<p>\nУзнайте о предлагаемой стратегии\nпервоначального размещения,\nоперационной поддержки\nи совместного долгосрочного развития.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"strategy.html?lang=ru\"\n>\n  Подробнее\n</a>\n\n</div>\n\n\u003c!-- УЧАСТИЕ ГРАЖДАН -->\n\n<div class=\"card\">\n\n<h3>\nЦентр участия граждан\n</h3>\n\n<p>\nНайдите информацию\nоб онлайн-кампании поддержки,\nрегистрации в Комитете,\nподдерживающем членстве\nи других программах участия.\n</p>\n\n<a\n  class=\"button\"\n  href=\"participate.html?lang=ru\"\n>\n  Центр участия граждан\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. УЧАСТИЕ ГРАЖДАН\n===================================== -->\n\n<section id=\"participation\">\n\n<h2>\n3. Как принять участие\n</h2>\n\n<p>\nЦентр участия граждан\nпредоставляет информацию\nо пяти основных программах участия.\n</p>\n\n<p class=\"note\">\nФормы заявок\nв настоящее время\nдоступны на корейском языке.\nПеред отправкой формы\nпожалуйста, ознакомьтесь\nс соответствующей информацией\nи уведомлениями\nо защите персональных данных.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- ОНЛАЙН-КАМПАНИЯ -->\n\n<div class=\"card\">\n\n<h3>\n① Онлайн-кампания поддержки\n</h3>\n\n<p>\nВыразите свою поддержку\nпредлагаемому размещению\nГлобального центра ИИ\nв особом городе Коян.\n</p>\n\n<ol class=\"steps\">\n\n<li>\nНажмите кнопку участия\nв онлайн-кампании.\n</li>\n\n<li>\nВведите информацию,\nзапрашиваемую\nв регистрационной форме.\n</li>\n\n<li>\nОзнакомьтесь\nс уведомлением\nо защите персональных данных.\n</li>\n\n<li>\nОтправьте заполненную форму.\n</li>\n\n</ol>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Присоединиться к кампании\n</a>\n\n</div>\n\n\u003c!-- РЕГИСТРАЦИЯ В КОМИТЕТЕ -->\n\n<div class=\"card\">\n\n<h3>\n② Регистрация в Комитете\n</h3>\n\n<p>\nГраждане,\nзаинтересованные\nв активном участии\nв инициативе «Глобальный центр ИИ»,\nмогут подать заявку\nна регистрацию\nв качестве членов Комитета.\n</p>\n\n<p>\nПожалуйста,\nпредоставьте информацию,\nзапрашиваемую\nв регистрационной форме.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Зарегистрироваться\n</a>\n\n</div>\n\n\u003c!-- ПОДДЕРЖИВАЮЩЕЕ ЧЛЕНСТВО -->\n\n<div class=\"card\">\n\n<h3>\n③ Поддерживающее членство\n</h3>\n\n<p>\nЛица,\nжелающие поддержать\nдеятельность Комитета,\nмогут подать заявку\nна поддерживающее членство.\n</p>\n\n<p>\nПосле подачи заявки\nознакомьтесь\nс официальной платёжной информацией,\nразмещённой\nв Центре участия граждан.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Подать заявку на членство\n</a>\n\n</div>\n\n\u003c!-- РЕКЛАМНЫЙ БАННЕР -->\n\n<div class=\"card\">\n\n<h3>\n④ Заявка на рекламный баннер\n</h3>\n\n<p>\nПодайте заявку\nна размещение рекламного баннера\nв поддержку предлагаемой инициативы\n«Глобальный центр ИИ».\n</p>\n\n<p>\nПожалуйста,\nпроверьте применимые\nместные нормативные требования,\nусловия размещения\nи необходимые разрешения.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Подать заявку на баннер\n</a>\n\n</div>\n\n\u003c!-- АВТОМОБИЛЬНАЯ НАКЛЕЙКА -->\n\n<div class=\"card\">\n\n<h3>\n⑤ Рекламная наклейка на автомобиль\n</h3>\n\n<p>\nПодайте заявку\nна получение рекламной наклейки,\nчтобы помочь повысить\nобщественную осведомлённость\nоб инициативе «Глобальный центр ИИ».\n</p>\n\n<p>\nУкажите необходимые сведения,\nвключая контактную информацию\nи запрашиваемое количество наклеек.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/cisRHEsN61pxVycG8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Подать заявку на наклейку\n</a>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nДоступность программ\nи сроки обработки заявок\nмогут изменяться\nв зависимости\nот деятельности Комитета.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     4. ПЛАТЁЖНАЯ ИНФОРМАЦИЯ\n===================================== -->\n\n<section id=\"account\">\n\n<h2>\n4. Оплата членских взносов\nи рекламных баннеров\n</h2>\n\n<p>\nЕсли вы хотите внести\nчленский взнос\nили оплатить расходы\nна рекламный баннер,\nпожалуйста,\nпроверьте официальные\nбанковские реквизиты,\nуказанные\nв Центре участия граждан.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nВажная информация об оплате\n</strong>\n\n<p>\nПеред переводом денежных средств\nпроверьте название банка,\nномер счёта\nи имя владельца счёта.\n</p>\n\n<p>\nПодача заявки\nи осуществление банковского перевода\nявляются отдельными процедурами.\n</p>\n\n<p>\nЕсли банковские реквизиты\nне отображаются\nили вызывают сомнения,\nне переводите денежные средства,\nпока информация\nне будет подтверждена\nчерез официальные каналы Комитета.\n</p>\n\n</div>\n\n<a\n  class=\"button\"\n  href=\"participate.html?lang=ru\"\n>\n  Проверить официальные банковские реквизиты\n</a>\n\n<p class=\"note\">\nБанковские реквизиты\nмогут изменяться.\nПо этой причине\nномера счетов\nне приводятся\nнепосредственно\nв данном руководстве.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     5. НОВОСТИ И МАТЕРИАЛЫ\n===================================== -->\n\n<section id=\"board\">\n\n<h2>\n5. Новости, деятельность\nи информационные материалы\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- ФОРУМ -->\n\n<div class=\"card\">\n\n<h3>\nОбщественный дискуссионный форум\n</h3>\n\n<p>\nПространство для обмена\nмнениями граждан\nи информацией,\nсвязанной с инициативой\n«Глобальный центр ИИ».\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"board.html\"\n>\n  Перейти на форум (на корейском языке)\n</a>\n\n</div>\n\n\u003c!-- НОВОСТИ -->\n\n<div class=\"card\">\n\n<h3>\nНовости и объявления\n</h3>\n\n<p>\nЧитайте обновления\nо деятельности Комитета,\nмероприятиях\nи важных событиях.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"news.html?lang=ru\"\n>\n  Смотреть новости\n</a>\n\n</div>\n\n\u003c!-- СМИ -->\n\n<div class=\"card\">\n\n<h3>\nПубликации в СМИ\n</h3>\n\n<p>\nОзнакомьтесь\nс газетными статьями,\nтелевизионными репортажами\nи другими публикациями\nв средствах массовой информации,\nсвязанными с инициативой\n«Глобальный центр ИИ».\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"press.html?lang=ru\"\n>\n  Смотреть публикации в СМИ\n</a>\n\n</div>\n\n\u003c!-- ХРОНОЛОГИЯ -->\n\n<div class=\"card\">\n\n<h3>\nХронология и основные этапы\n</h3>\n\n<p>\nОзнакомьтесь\nс основными событиями\nи деятельностью Комитета\nв хронологическом порядке.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"history.html?lang=ru\"\n>\n  Смотреть хронологию\n</a>\n\n</div>\n\n</div>\n\n<p>\nНекоторые связанные материалы\nи оригинальные новостные статьи\nмогут быть доступны\nтолько на корейском языке.\n</p>\n\n<p>\nПри участии\nв онлайн-дискуссиях\nуважайте других пользователей\nи избегайте публикации\nперсональных данных\nили вводящей в заблуждение информации.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     6. ЧАСТО ЗАДАВАЕМЫЕ ВОПРОСЫ\n===================================== -->\n\n<section id=\"faq\">\n\n<h2>\n6. Часто задаваемые вопросы\n</h2>\n\n\u003c!-- FAQ 1 -->\n\n<div class=\"faq\">\n\n<h3>\nВопрос. Нужно ли регистрироваться,\nчтобы пользоваться сайтом?\n</h3>\n\n<p>\nОбщая информация\nдоступна без регистрации.\nДля некоторых интерактивных функций\nможет потребоваться вход\nв учётную запись\nили дополнительные разрешения.\n</p>\n\n</div>\n\n\u003c!-- FAQ 2 -->\n\n<div class=\"faq\">\n\n<h3>\nВопрос. Является ли участие\nв онлайн-кампании поддержки\nрегистрацией в Комитете?\n</h3>\n\n<p>\nНет.\nОнлайн-кампания поддержки\nпозволяет отдельным лицам\nвыразить поддержку\nпредлагаемой инициативе\n«Глобальный центр ИИ».\n</p>\n\n<p>\nРегистрация в Комитете\nпредставляет собой\nотдельную процедуру\nдля лиц,\nжелающих участвовать\nв деятельности Комитета.\n</p>\n\n</div>\n\n\u003c!-- FAQ 3 -->\n\n<div class=\"faq\">\n\n<h3>\nВопрос. Требуется ли\nуплата членского взноса\nдля участия\nв онлайн-кампании поддержки?\n</h3>\n\n<p>\nНет.\nОнлайн-кампания поддержки\nи поддерживающее членство\nявляются отдельными\nпрограммами участия.\n</p>\n\n<p>\nПодписание формы поддержки\nсамо по себе\nне означает обязательства\nпо уплате членского взноса.\n</p>\n\n</div>\n\n\u003c!-- FAQ 4 -->\n\n<div class=\"faq\">\n\n<h3>\nВопрос. Означает ли\nподача заявки\nна поддерживающее членство,\nчто оплата завершена?\n</h3>\n\n<p>\nНет.\nПодача заявки\nи банковский перевод\nявляются отдельными процедурами.\n</p>\n\n<p>\nПеред переводом денежных средств\nпожалуйста,\nпроверьте официальные\nбанковские реквизиты.\n</p>\n\n</div>\n\n\u003c!-- FAQ 5 -->\n\n<div class=\"faq\">\n\n<h3>\nВопрос. Подтвердили ли\nдевять международных организаций\nсвоё перемещение в Коян?\n</h3>\n\n<p>\nНет.\nМеждународные организации,\nпредставленные на этом сайте,\nрассматриваются\nв контексте потенциального сотрудничества\nв рамках инициативы\n«Глобальный центр ИИ».\n</p>\n\n<p>\nИх упоминание\nне означает,\nчто участие,\nоткрытие представительств\nили перемещение в Коян\nбыли официально подтверждены.\n</p>\n\n</div>\n\n\u003c!-- FAQ 6 -->\n\n<div class=\"faq\">\n\n<h3>\nВопрос. Можно ли установить\nрекламный баннер\nсразу после подачи заявки?\n</h3>\n\n<p>\nНет.\nПодача заявки\nне означает автоматического\nразрешения\nна установку рекламного баннера.\n</p>\n\n<p>\nНеобходимо соблюдать\nсоответствующее законодательство,\nместные нормативные требования\nи условия,\nдействующие\nв конкретном месте размещения.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. ПОМОЩЬ\n===================================== -->\n\n<section id=\"help\">\n\n<h2>\n7. Помощь при использовании сайта\n</h2>\n\n<h3>\nЕсли сайт не открывается\n</h3>\n\n<p>\nПроверьте подключение\nк интернету\nи правильность адреса сайта.\nПопробуйте открыть страницу\nповторно через некоторое время.\n</p>\n\n<h3>\nЕсли страница отображается неправильно\n</h3>\n\n<p>\nОбновите страницу\nили попробуйте использовать\nдругой браузер.\n</p>\n\n<h3>\nЕсли форма заявки не открывается\n</h3>\n\n<p>\nНажмите кнопку подачи заявки\nещё раз\nили откройте форму\nв другом браузере.\n</p>\n\n<h3>\nЕсли банковские реквизиты\nне отображаются\n</h3>\n\n<p>\nОбновите страницу\nЦентра участия граждан\nи проверьте информацию повторно.\n</p>\n\n<p>\nЕсли проблема сохраняется,\nне переводите денежные средства,\nпока банковские реквизиты\nне будут подтверждены\nчерез официальные каналы Комитета.\n</p>\n\n<h3>\nЗащита персональных данных\n</h3>\n\n<p>\nПеред подачей заявки\nознакомьтесь\nс соответствующим уведомлением\nо сборе и использовании\nперсональных данных.\n</p>\n\n<p>\nНе публикуйте\nперсональные данные\nдругих лиц\nна общественных\nдискуссионных форумах.\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"privacy.html\"\n>\n  Политика конфиденциальности\n  (на корейском языке)\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. ЗАКЛЮЧЕНИЕ\n===================================== -->\n\n<section>\n\n<h2>\n8. Вместе создадим будущее Кояна\n</h2>\n\n<p>\nПредлагаемая инициатива\n«Глобальный центр ИИ»\nпредставляет собой возможность\nдля особого города Коян\nизучить новые направления роста,\nсоздания качественных рабочих мест\nи международного сотрудничества.\n</p>\n\n<p>\nГраждане\nи другие заинтересованные лица\nмогут принять участие\nв онлайн-кампании поддержки,\nзарегистрироваться в Комитете,\nстать поддерживающими членами\nили участвовать\nв мероприятиях\nпо повышению общественной осведомлённости.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nКаждое проявление интереса\nи каждый шаг участия\nмогут помочь\nформировать будущее Кояна.\n</strong>\n\n</div>\n\n<a\n  class=\"button\"\n  href=\"participate.html?lang=ru\"\n>\n  Центр участия граждан\n</a>\n\n<a\n  class=\"button secondary\"\n  href=\"index.html?lang=ru\"\n>\n  Главная страница\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     ПОДВАЛ САЙТА\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nГражданский комитет содействия<br>\nразмещению Глобального центра ИИ<br>\nв особом городе Коян\n</strong>\n</p>\n\n<p>\nПровинция Кёнгидо,<br>\nРеспублика Корея\n</p>\n\n<p>\nВместе с гражданами,<br>\nвместе с провинцией Кёнгидо<br>\nи вместе со всем миром.\n</p>\n\n<p>\n<a href=\"index.html?lang=ru\">\nГлавная страница\n</a>\n&nbsp; | &nbsp;\n<a href=\"participate.html?lang=ru\">\nУчастие граждан\n</a>\n&nbsp; | &nbsp;\n<a href=\"guide.html\" lang=\"ko\">\n한국어\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",

问题\n===================================== */\n\n.faq {\n  margin-bottom: 22px;\n}\n\n.faq h3 {\n  margin-bottom: 6px;\n}\n\n.faq p {\n  margin-top: 0;\n}\n\n/* =====================================\n   页脚\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 35px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   移动设备\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 35px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 18px;\n  }\n\n  .button {\n    width: 100%;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     页眉\n===================================== -->\n\n<header>\n\n<h1>\n网站使用指南\n</h1>\n\n<p>\n全球人工智能枢纽倡议<br>\n大韩民国京畿道高阳特例市\n</p>\n\n<p>\n网站信息、页面导航<br>\n及市民参与指南\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=zh\"\n  class=\"home-link\"\n>\n  ← 中文首页\n</a>\n\n<a\n  href=\"guide.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n>\n  한국어\n</a>\n\n</div>\n\n</header>\n\n\u003c!-- =====================================\n     快速导航\n===================================== -->\n\n<nav\n  class=\"quick-nav\"\n  aria-label=\"网站使用指南导航\"\n>\n\n<a href=\"#intro\">\n网站介绍\n</a>\n\n<a href=\"#menus\">\n主要栏目\n</a>\n\n<a href=\"#participation\">\n参与方式\n</a>\n\n<a href=\"#account\">\n缴费说明\n</a>\n\n<a href=\"#board\">\n新闻与资料\n</a>\n\n<a href=\"#faq\">\n常见问题\n</a>\n\n<a href=\"#help\">\n使用帮助\n</a>\n\n</nav>\n\n<main>\n\n\u003c!-- =====================================\n     1. 网站介绍\n===================================== -->\n\n<section id=\"intro\">\n\n<h2>\n1. 欢迎访问本网站\n</h2>\n\n<p>\n欢迎访问\n高阳特例市全球人工智能枢纽\n引进市民推进委员会官方网站。\n</p>\n\n<p>\n本网站提供有关\n拟议中的全球人工智能枢纽、\n市民推进委员会活动、\n高阳特例市区位优势\n以及公众参与机会等信息。\n</p>\n\n<p>\n本网站还介绍\n通过负责任地应用人工智能，\n加强国际合作\n并应对全球共同挑战的\n潜在发展方向。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n为高阳创造新的增长机遇！<br>\n为高阳创造更多高质量就业岗位！<br>\n让全球人工智能枢纽落户高阳！\n</strong>\n\n</div>\n\n<p>\n您可以使用电脑、\n平板电脑\n或智能手机访问本网站。\n</p>\n\n<p>\n无需安装其他软件，\n使用普通互联网浏览器\n即可浏览网站内容。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     2. 网站主要栏目\n===================================== -->\n\n<section id=\"menus\">\n\n<h2>\n2. 网站主要栏目\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- 市民推进委员会 -->\n\n<div class=\"card\">\n\n<h3>\n关于市民推进委员会\n</h3>\n\n<p>\n了解市民推进委员会的\n成立背景、\n使命、\n基本原则\n以及主要活动。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"committee.html?lang=zh\"\n>\n  了解更多\n</a>\n\n</div>\n\n\u003c!-- 全球人工智能枢纽 -->\n\n<div class=\"card\">\n\n<h3>\n关于全球人工智能枢纽\n</h3>\n\n<p>\n了解拟议中的\n全球人工智能枢纽、\n国际合作愿景\n以及人工智能\n在公共利益领域的\n潜在应用方向。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"hub.html?lang=zh\"\n>\n  了解更多\n</a>\n\n</div>\n\n\u003c!-- 高阳特例市 -->\n\n<div class=\"card\">\n\n<h3>\n为什么选择高阳特例市？\n</h3>\n\n<p>\n了解高阳特例市的\n区位优势、\n城市基础设施\n以及作为全球人工智能枢纽\n潜在选址地的竞争优势。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"goyang.html?lang=zh\"\n>\n  了解更多\n</a>\n\n</div>\n\n\u003c!-- 国际组织 -->\n\n<div class=\"card\">\n\n<h3>\n九个国际组织\n</h3>\n\n<p>\n了解九个国际组织的\n主要使命，\n以及人工智能相关\n国际合作的潜在领域。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"agencies.html?lang=zh\"\n>\n  了解更多\n</a>\n\n</div>\n\n\u003c!-- 引进战略 -->\n\n<div class=\"card\">\n\n<h3>\n全球人工智能枢纽引进战略\n</h3>\n\n<p>\n了解有关初期入驻、\n运营支持\n以及长期共同发展的\n拟议战略。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"strategy.html?lang=zh\"\n>\n  了解更多\n</a>\n\n</div>\n\n\u003c!-- 市民参与 -->\n\n<div class=\"card\">\n\n<h3>\n市民参与中心\n</h3>\n\n<p>\n了解在线支持签名活动、\n市民推进委员会成员登记、\n支持会员申请\n以及其他公众参与项目。\n</p>\n\n<a\n  class=\"button\"\n  href=\"participate.html?lang=zh\"\n>\n  前往市民参与中心\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. 市民参与方式\n===================================== -->\n\n<section id=\"participation\">\n\n<h2>\n3. 如何参与\n</h2>\n\n<p>\n市民参与中心\n提供五项主要参与项目\n的相关信息。\n</p>\n\n<p class=\"note\">\n申请表目前仅提供韩语版本。\n提交申请前，\n请仔细阅读相关说明\n及个人信息保护事项。\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- ① 在线支持活动 -->\n\n<div class=\"card\">\n\n<h3>\n① 在线支持签名活动\n</h3>\n\n<p>\n通过在线签名，\n表达您对全球人工智能枢纽\n落户高阳特例市的支持。\n</p>\n\n<ol class=\"steps\">\n\n<li>\n点击在线支持活动按钮。\n</li>\n\n<li>\n填写申请表要求的信息。\n</li>\n\n<li>\n阅读个人信息保护说明。\n</li>\n\n<li>\n提交填写完成的表格。\n</li>\n\n</ol>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  参加支持签名活动\n</a>\n\n</div>\n\n\u003c!-- ② 推进委员会登记 -->\n\n<div class=\"card\">\n\n<h3>\n② 市民推进委员会成员登记\n</h3>\n\n<p>\n希望积极参与\n全球人工智能枢纽倡议的市民，\n可以申请登记成为\n市民推进委员会成员。\n</p>\n\n<p>\n请按照登记表的要求\n填写相关信息。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  申请登记\n</a>\n\n</div>\n\n\u003c!-- ③ 支持会员 -->\n\n<div class=\"card\">\n\n<h3>\n③ 支持会员申请\n</h3>\n\n<p>\n希望支持市民推进委员会\n相关活动的人士，\n可以申请成为支持会员。\n</p>\n\n<p>\n提交申请后，\n请查看市民参与中心\n显示的正式缴费账户信息。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  申请成为支持会员\n</a>\n\n</div>\n\n\u003c!-- ④ 宣传横幅 -->\n\n<div class=\"card\">\n\n<h3>\n④ 宣传横幅申请\n</h3>\n\n<p>\n申请设置支持\n全球人工智能枢纽倡议的\n宣传横幅。\n</p>\n\n<p>\n请事先确认\n适用的当地管理规定、\n设置地点要求\n以及相关许可条件。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  申请宣传横幅\n</a>\n\n</div>\n\n\u003c!-- ⑤ 车辆宣传贴纸 -->\n\n<div class=\"card\">\n\n<h3>\n⑤ 车辆宣传贴纸申请\n</h3>\n\n<p>\n申请车辆宣传贴纸，\n帮助提高公众对\n全球人工智能枢纽倡议的认知。\n</p>\n\n<p>\n请填写必要信息，\n包括联系方式\n及申请数量。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/cisRHEsN61pxVycG8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  申请车辆宣传贴纸\n</a>\n\n</div>\n\n</div>\n\n<p class=\"note\">\n各项申请的受理情况\n及处理时间，\n可能根据市民推进委员会\n的实际运营情况有所调整。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     4. 缴费说明\n===================================== -->\n\n<section id=\"account\">\n\n<h2>\n4. 支持会员及宣传横幅缴费说明\n</h2>\n\n<p>\n如需缴纳支持会员会费\n或宣传横幅相关费用，\n请前往市民参与中心，\n查看正式公布的\n指定银行账户信息。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n重要缴费说明\n</strong>\n\n<p>\n汇款前，\n请务必确认银行名称、\n账号\n及账户持有人。\n</p>\n\n<p>\n提交申请\n与完成银行转账\n是两个独立的程序。\n</p>\n\n<p>\n如果账户信息\n未正常显示\n或内容不明确，\n请暂勿汇款。\n</p>\n\n<p>\n应通过市民推进委员会的\n正式说明渠道\n确认账户信息后，\n再进行转账。\n</p>\n\n</div>\n\n<a\n  class=\"button\"\n  href=\"participate.html?lang=zh\"\n>\n  查看正式缴费账户信息\n</a>\n\n<p class=\"note\">\n银行账户信息可能发生变化。\n因此，\n本指南不直接刊登\n银行账号。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     5. 新闻与资料\n===================================== -->\n\n<section id=\"board\">\n\n<h2>\n5. 最新消息、活动与资料\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- 讨论公告板 -->\n\n<div class=\"card\">\n\n<h3>\n市民交流公告板\n</h3>\n\n<p>\n分享市民观点\n以及与全球人工智能枢纽倡议\n有关的信息。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"board.html\"\n>\n  访问公告板（韩语）\n</a>\n\n</div>\n\n\u003c!-- 最新消息 -->\n\n<div class=\"card\">\n\n<h3>\n最新消息与公告\n</h3>\n\n<p>\n了解市民推进委员会活动、\n各类会议和活动\n以及重要发展动态。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"news.html?lang=zh\"\n>\n  查看最新消息\n</a>\n\n</div>\n\n\u003c!-- 媒体报道 -->\n\n<div class=\"card\">\n\n<h3>\n媒体报道\n</h3>\n\n<p>\n浏览有关全球人工智能枢纽倡议的\n报纸文章、\n电视新闻\n以及其他媒体报道。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"press.html?lang=zh\"\n>\n  查看媒体报道\n</a>\n\n</div>\n\n\u003c!-- 发展历程 -->\n\n<div class=\"card\">\n\n<h3>\n发展历程与重要里程碑\n</h3>\n\n<p>\n按照时间顺序，\n了解全球人工智能枢纽倡议\n的主要发展进程\n以及市民推进委员会活动。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"history.html?lang=zh\"\n>\n  查看发展历程\n</a>\n\n</div>\n\n</div>\n\n<p>\n部分链接资料\n及新闻报道原文\n可能仅提供韩语版本。\n</p>\n\n<p>\n参与在线讨论时，\n请尊重其他用户，\n避免公开他人的个人信息\n或传播误导性内容。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     6. 常见问题\n===================================== -->\n\n<section id=\"faq\">\n\n<h2>\n6. 常见问题\n</h2>\n\n\u003c!-- FAQ 1 -->\n\n<div class=\"faq\">\n\n<h3>\n问：使用本网站需要注册会员吗？\n</h3>\n\n<p>\n不需要。\n一般信息无需注册\n即可浏览。\n</p>\n\n<p>\n部分互动功能\n可能需要登录\n或取得额外权限。\n</p>\n\n</div>\n\n\u003c!-- FAQ 2 -->\n\n<div class=\"faq\">\n\n<h3>\n问：在线支持签名活动\n与市民推进委员会成员登记\n是同一回事吗？\n</h3>\n\n<p>\n不是。\n在线支持签名活动\n旨在让参与者表达\n对全球人工智能枢纽倡议的支持。\n</p>\n\n<p>\n市民推进委员会成员登记\n则是希望参与委员会活动的人士\n所使用的独立申请程序。\n</p>\n\n</div>\n\n\u003c!-- FAQ 3 -->\n\n<div class=\"faq\">\n\n<h3>\n问：参加在线支持签名活动\n需要缴纳会员费吗？\n</h3>\n\n<p>\n不需要。\n在线支持签名活动\n与支持会员申请\n是两个独立的参与项目。\n</p>\n\n<p>\n提交在线支持签名表格，\n并不意味着\n承诺缴纳支持会员会费。\n</p>\n\n</div>\n\n\u003c!-- FAQ 4 -->\n\n<div class=\"faq\">\n\n<h3>\n问：提交支持会员申请后，\n是否就完成了缴费？\n</h3>\n\n<p>\n不是。\n提交支持会员申请\n与完成银行转账\n是两个独立的程序。\n</p>\n\n<p>\n汇款前，\n请务必确认\n正式公布的缴费账户信息。\n</p>\n\n</div>\n\n\u003c!-- FAQ 5 -->\n\n<div class=\"faq\">\n\n<h3>\n问：九个国际组织\n是否已经正式决定\n迁至高阳特例市？\n</h3>\n\n<p>\n没有。\n本网站介绍的九个国际组织，\n是在全球人工智能枢纽倡议框架下，\n就潜在合作可能性\n进行讨论的相关机构。\n</p>\n\n<p>\n这些机构出现在本网站中，\n并不意味着其参与、\n设立办事机构\n或迁至高阳特例市\n已经获得正式确认。\n</p>\n\n</div>\n\n\u003c!-- FAQ 6 -->\n\n<div class=\"faq\">\n\n<h3>\n问：提交宣传横幅申请后，\n可以立即设置横幅吗？\n</h3>\n\n<p>\n不可以。\n提交申请\n并不代表已经获得\n宣传横幅设置许可。\n</p>\n\n<p>\n必须遵守相关法律、\n当地管理规定\n以及设置地点的具体要求。\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. 网站使用帮助\n===================================== -->\n\n<section id=\"help\">\n\n<h2>\n7. 网站使用帮助\n</h2>\n\n<h3>\n网站无法打开时\n</h3>\n\n<p>\n请检查互联网连接\n及网站地址。\n</p>\n\n<p>\n稍等片刻后，\n尝试重新访问页面。\n</p>\n\n<h3>\n页面显示不正常时\n</h3>\n\n<p>\n请刷新页面，\n或尝试使用其他浏览器。\n</p>\n\n<h3>\n申请表无法打开时\n</h3>\n\n<p>\n请再次点击申请按钮，\n或使用其他浏览器\n打开申请表。\n</p>\n\n<h3>\n缴费账户信息未显示时\n</h3>\n\n<p>\n请刷新市民参与中心页面，\n然后重新确认。\n</p>\n\n<p>\n如果问题仍然存在，\n在通过市民推进委员会\n正式渠道确认账户信息之前，\n请勿汇款。\n</p>\n\n<h3>\n个人信息保护\n</h3>\n\n<p>\n提交申请之前，\n请仔细阅读\n有关个人信息收集\n及使用的说明。\n</p>\n\n<p>\n请勿在公开讨论区\n发布他人的个人信息。\n</p>\n\n<a\n  class=\"button secondary\"\n  href=\"privacy.html\"\n>\n  个人信息保护政策（韩语）\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. 共同开创高阳未来\n===================================== -->\n\n<section>\n\n<h2>\n8. 共同开创高阳的未来\n</h2>\n\n<p>\n拟议中的全球人工智能枢纽\n为高阳特例市探索\n新的经济增长机遇、\n高质量就业岗位\n以及国际合作\n提供了新的可能性。\n</p>\n\n<p>\n广大市民及有意参与的人士，\n可以通过在线支持签名活动、\n市民推进委员会成员登记、\n支持会员申请\n以及公众宣传活动\n表达支持并参与相关工作。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n每一份关注，<br>\n每一次参与，<br>\n都将有助于共同塑造<br>\n高阳特例市的未来。\n</strong>\n\n</div>\n\n<a\n  class=\"button\"\n  href=\"participate.html?lang=zh\"\n>\n  前往市民参与中心\n</a>\n\n<a\n  class=\"button secondary\"\n  href=\"index.html?lang=zh\"\n>\n  返回中文首页\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     页脚\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\n高阳特例市全球人工智能枢纽<br>\n引进市民推进委员会\n</strong>\n</p>\n\n<p>\n大韩民国京畿道\n</p>\n\n<p>\n与市民同行，<br>\n与京畿道同行，<br>\n与世界同行。\n</p>\n\n<p>\n\n<a href=\"index.html?lang=zh\">\n中文首页\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"participate.html?lang=zh\">\n市民参与\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"guide.html\" lang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n"
}
