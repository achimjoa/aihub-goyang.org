<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>관리자 통합자료실 | 글로벌 AI 허브</title>

<style>
* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  font-family: "Malgun Gothic", Arial, sans-serif;
  background: #f4f8fc;
  color: #17315b;
  line-height: 1.7;
}

header {
  background: #0754a6;
  color: white;
  text-align: center;
  padding: 30px 15px;
}

header h1 {
  margin: 0;
  font-size: clamp(24px, 4vw, 32px);
}

header a {
  color: white;
}

main {
  max-width: 1150px;
  margin: auto;
  padding: 25px 15px;
}

section {
  background: white;
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 25px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h2 {
  color: #0754a6;
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  margin-top: 5px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font: inherit;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  padding: 11px 17px;
  margin: 8px 5px 5px 0;
  border: 0;
  border-radius: 6px;
  background: #0754a6;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: .9;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

button.secondary {
  background: #64748b;
}

button.danger {
  background: #b42318;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}

.row {
  padding: 15px 0;
  border-bottom: 1px solid #e2e8f0;
}

.row:last-child {
  border-bottom: 0;
}

.muted {
  color: #64748b;
}

.error {
  color: #b42318;
}

.success {
  color: #087443;
}

.photo-preview {
  display: block;
  max-width: 180px;
  max-height: 150px;
  object-fit: contain;
  margin-top: 10px;
}

.status {
  padding: 12px;
  margin-top: 15px;
  border-radius: 6px;
  background: #f1f5f9;
  white-space: pre-wrap;
}

.category-row {
  border-bottom: 1px solid #e2e8f0;
  padding: 15px 0;
}

.category-row strong {
  display: block;
}

.category-status {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  background: #eaf4ff;
  color: #0754a6;
  font-size: 13px;
}

.category-status.inactive {
  background: #f1f5f9;
  color: #64748b;
}

footer {
  text-align: center;
  background: #10315e;
  color: white;
  padding: 30px 15px;
}

@media(max-width:600px) {
  section {
    padding: 18px;
  }

  .toolbar {
    flex-direction: column;
    align-items: stretch;
  }

  .toolbar button {
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <h1>관리자 통합자료실</h1>

  <p>
    경기도 글로벌 AI 허브 유치<br>
    고양특례시 범시민추진위원회
  </p>

  <a href="index.html">
    ← 홈페이지로 돌아가기
  </a>
</header>

<main>

<!-- 관리자 로그인 -->

<section id="loginSection">

  <h2>관리자 로그인</h2>

  <form id="loginForm">

    <label for="email">이메일</label>
    <input
      id="email"
      type="email"
      autocomplete="username"
      required
    >

    <label for="password">비밀번호</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginButton">
      로그인
    </button>

  </form>

  <p id="loginMessage" role="status"></p>

</section>

<!-- 관리자 전용 영역 -->

<div id="adminArea" hidden>

<section>

  <div class="toolbar">

    <strong id="adminEmail"></strong>

    <button
      id="logoutButton"
      type="button"
      class="secondary">
      로그아웃
    </button>

    <a href="gallery.html">
      📸 시민활동 사진기록관 보기
    </a>

</section>

<!-- 자료 등록 및 수정 -->

<section id="resourceEditorSection">

  <h2 id="formHeading">
    자료 등록
  </h2>

  <form id="resourceForm">

    <label for="resourceCategory">
      자료 종류
    </label>

    <select id="resourceCategory" required>
      <option value="document">문서</option>
      <option value="image">사진</option>
      <option value="video">동영상</option>

      <option value="other">기타</option>
    </select>

    <label for="resourceTitle">
      자료 제목
    </label>

    <input
      id="resourceTitle"
      maxlength="300"
      required
    >

    <label for="resourceContent">
      자료 설명
    </label>

    <textarea id="resourceContent"></textarea>

    <!-- 사진 전용 입력 -->

    <div id="photoFields" hidden>

      <label for="photoActivityCategory">
        사진 활동 분류
      </label>

      <select id="photoActivityCategory"></select>

      <label for="photoEventName">

    <!-- 동영상 전용 입력 -->

        유튜브 주소

      <input
        id="youtubeUrl"

    </div>

    <!-- 첨부파일 -->

    <label for="resourceFiles">
      첨부파일
    </label>

    <input
      id="resourceFiles"
      type="file"

    >

    <p class="muted">

    <div id="existingAttachments"></div>

    <button
      id="saveButton"
      type="submit">
      자료 저장
    </button>

    <button

      type="button"
      class="secondary"
      hidden>
      수정 취소
    </button>

    <p
      id="saveMessage"
      class="status"
      role="status">
    </p>

  </form>

</section>

<!-- 등록 자료 목록 -->

<section>

  <h2>등록된 자료</h2>

  <button
    id="refreshResources"
    type="button">
    목록 새로고침
  </button>

  <div id="resourceList">
    자료를 불러오고 있습니다.
  </div>

</section>

<!-- 활동 분류 관리 -->

<section>

  <h2>📂 사진 활동 분류 관리</h2>

  <p>
    시민활동 사진기록관에서 사용하는
    활동 분류를 관리합니다.
  </p>

  <form id="categoryForm">

    <label for="categoryCode">
      분류 코드
    </label>

    <input
      id="categoryCode"
      placeholder="예: campaign"
      required
    >

    <label for="categoryNameKo">
      한글 분류명
    </label>

    <input
      id="categoryNameKo"
      required
    >

    <label for="categoryNameEn">
      영문 분류명
    </label>

    <input id="categoryNameEn">

    <label for="categorySort">
      표시 순서
    </label>

    <input
      id="categorySort"
      type="number"
      value="0"
      required
    >

    <button type="submit">
      활동 분류 추가
    </button>

  </form>

  <div id="categoryList"></div>

</section>

</div>

</main>

<footer>

  <p>
    경기도 글로벌 AI 허브 유치<br>
    고양특례시 범시민추진위원회
  </p>

  <p>
    AI for All · AI for Humanity
  </p>

</footer>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* =====================================
   Supabase 연결
===================================== */

const SUPABASE_URL =
  "https://gugkwqpvtwivqudkimvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* =====================================
   기본 설정
===================================== */

const $ = id =>
  document.getElementById(id);

const MAX_PHOTOS = 10;

const MAX_PHOTO_BYTES =
  20 * 1024 * 1024;

let currentUser = null;

let editingId = null;

let attachments = [];

let categories = [];

let saving = false;

/* =====================================
   공통 함수
===================================== */

function message(id, text, isError = false) {

  const element = $(id);

  element.textContent = text;

  element.className =
    isError ? "status error" : "status success";

}

function createButton(
  text,
  action,
  className = ""
) {

  const element =
    document.createElement("button");

  element.type = "button";
  element.textContent = text;
  element.className = className;

  element.addEventListener(
    "click",
    action
  );

  return element;

}

function createParagraph(text) {

  const element =
    document.createElement("p");

  element.textContent = text;

  return element;

}

/* =====================================
   관리자 권한 확인
===================================== */

async function verifyAdmin() {

  const {
    data: { user },
    error
  } = await supabase.auth.getUser();

  if (error || !user) {
    return null;
  }

  const result =
    await supabase.rpc(
      "is_resource_admin"
    );

  if (
    result.error ||
    result.data !== true
  ) {
    return null;
  }

  return user;

}

/* =====================================
   로그인 상태 확인
===================================== */

async function refreshAuth() {

  currentUser =
    await verifyAdmin();

  $("loginSection").hidden =
    Boolean(currentUser);

  $("adminArea").hidden =
    !currentUser;

  if (!currentUser) {
    return;
  }

  $("adminEmail").textContent =
    currentUser.email || "";

  const results =
    await Promise.allSettled([
      loadCategories(),
      loadResources()
    ]);

  results.forEach((result, index) => {

    if (result.status === "rejected") {

      console.error(
        "관리자 초기화 오류:",
        result.reason
      );

      if (index === 0) {
        $("categoryList").textContent =
          "활동 분류를 불러오지 못했습니다.";
      }

    }

  });

}

/* =====================================
   로그인
===================================== */

$("loginForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const loginButton =
      $("loginButton");

    loginButton.disabled = true;

    try {

      const { error } =
        await supabase.auth.signInWithPassword({
          email: $("email").value.trim(),
          password: $("password").value
        });

      if (error) {
        throw error;
      }

      await refreshAuth();

      if (!currentUser) {
        throw new Error(
          "관리자 권한이 없습니다."
        );
      }

      $("password").value = "";

    } catch (error) {

      message(
        "loginMessage",
        error.message,
        true
      );

    } finally {

      loginButton.disabled = false;

    }

  }
);

/* =====================================
   로그아웃
===================================== */

$("logoutButton").addEventListener(
  "click",
  async () => {

    const { error } =
      await supabase.auth.signOut();

    if (error) {
      alert(error.message);
      return;
    }

    currentUser = null;

    resetEditor();

    $("adminArea").hidden = true;

    $("loginSection").hidden = false;

    $("password").value = "";

  }
);

/* =====================================
   자료 종류별 입력 항목
===================================== */

function updateCategoryFields() {

  const category =
    $("resourceCategory").value;

  const isImage =
    category === "image";

  const isVideo =
    category === "video";

  $("photoFields").hidden =
    !isImage;

  $("videoFields").hidden =
    !isVideo;

  $("photoActivityCategory").required =
    isImage;

  $("photoEventName").required =
    isImage && !editingId;

  $("photoEventDate").required =
    isImage && !editingId;

  $("resourceFiles").accept =
    isImage ? "image/*" : "";

}

$("resourceCategory").addEventListener(
  "change",
  updateCategoryFields
);

/* =====================================
   활동 분류 조회
===================================== */

async function loadCategories() {

  const { data, error } =
    await supabase
      .from("photo_activity_categories")
      .select(`
        code,
        name_ko,
        name_en,
        sort_order,
        is_active
      `)
      .order("sort_order", {
        ascending: true
      });

  if (error) {
    throw error;
  }

  categories = data || [];

  renderCategorySelect();

  renderCategoryManager();

}

/* =====================================
   사진 분류 선택 메뉴
===================================== */

function renderCategorySelect() {

  const select =
    $("photoActivityCategory");

  const previousValue =
    select.value;

  select.replaceChildren();

  select.add(
    new Option(
      "활동 분류를 선택하세요",
      ""
    )
  );

  categories
    .filter(item => item.is_active)
    .forEach(item => {

      select.add(
        new Option(
          item.name_ko,
          item.code
        )
      );

    });

  if (
    previousValue &&
    !Array.from(select.options).some(
      option =>
        option.value === previousValue
    )
  ) {

    select.add(
      new Option(
        previousValue + " (기존 분류)",
        previousValue
      )
    );

  }

  select.value =
    previousValue;

}

/* =====================================
   활동 분류 관리 목록
===================================== */

function renderCategoryManager() {

  const container =
    $("categoryList");

  container.replaceChildren();

  categories.forEach(category => {

    const row =
      document.createElement("div");

    row.className =
      "category-row";

    const title =
      document.createElement("strong");

    title.textContent =
      `${category.name_ko} (${category.code})`;

    const status =
      document.createElement("span");

    status.className =
      "category-status" +
      (
        category.is_active
          ? ""
          : " inactive"
      );

    status.textContent =
      category.is_active
        ? "활성"
        : "비활성";

    const editButton =
      createButton(
        "이름·순서 수정",
        async () => {

          const nameKo = prompt(
            "한글 분류명",
            category.name_ko
          );

          if (nameKo === null) {
            return;
          }

          if (!nameKo.trim()) {
            alert("분류명을 입력하세요.");
            return;
          }

          const nameEn = prompt(
            "영문 분류명",
            category.name_en || ""
          );

          if (nameEn === null) {
            return;
          }

          const sort = prompt(
            "표시 순서",
            String(
              category.sort_order ?? 0
            )
          );

          if (sort === null) {
            return;
          }

          if (
            sort.trim() === "" ||
            !Number.isInteger(Number(sort))
          ) {
            alert("올바른 순서를 입력하세요.");
            return;
          }

          await updateCategory(
            category.code,
            {
              name_ko: nameKo.trim(),
              name_en:
                nameEn.trim() || null,
              sort_order: Number(sort)
            }
          );

        }
      );

    const toggleButton =
      createButton(
        category.is_active
          ? "비활성화"
          : "활성화",
        async () => {

          await updateCategory(
            category.code,
            {
              is_active:
                !category.is_active
            }
          );

        },
        "secondary"
      );

    row.append(
      title,
      status,
      document.createElement("br"),
      editButton,
      toggleButton
    );

    container.appendChild(row);

  });

}

/* =====================================
   활동 분류 수정
===================================== */

async function updateCategory(
  code,
  changes
) {

  try {

    if (!await verifyAdmin()) {
      throw new Error(
        "관리자 권한이 없습니다."
      );
    }

    const { error } =
      await supabase
        .from("photo_activity_categories")
        .update(changes)
        .eq("code", code);

    if (error) {
      throw error;
    }

    await loadCategories();

  } catch (error) {

    alert(
      "활동 분류 수정 실패: " +
      error.message
    );

  }

}

/* =====================================
   활동 분류 추가
===================================== */

$("categoryForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    try {

      if (!await verifyAdmin()) {
        throw new Error(
          "관리자 권한이 없습니다."
        );
      }

      const code =
        $("categoryCode")
          .value.trim()
          .toLowerCase();

      const nameKo =
        $("categoryNameKo")
          .value.trim();

      const nameEn =
        $("categoryNameEn")
          .value.trim();

      const sort =
        Number(
          $("categorySort").value
        );

      if (
        !/^[a-z][a-z0-9_-]*$/.test(code)
      ) {
        throw new Error(
          "분류 코드는 영문 소문자로 시작해야 합니다."
        );
      }

      if (!nameKo) {
        throw new Error(
          "한글 분류명을 입력하세요."
        );
      }

      if (!Number.isInteger(sort)) {
        throw new Error(
          "표시 순서를 확인하세요."
        );
      }

      const { error } =
        await supabase
          .from("photo_activity_categories")
          .insert({
            code,
            name_ko: nameKo,
            name_en: nameEn || null,
            sort_order: sort,
            is_active: true
          });

      if (error) {
        throw error;
      }

      $("categoryForm").reset();

      await loadCategories();

      alert(
        "활동 분류가 추가되었습니다."
      );

    } catch (error) {

      alert(error.message);

    }

  }
);

/* =====================================
   자료 목록 조회
===================================== */

async function loadResources() {

  const container =
    $("resourceList");

  container.textContent =
    "자료를 불러오고 있습니다.";

  const { data, error } =
    await supabase
      .from("resource_posts")
      .select(`
        id,
        title,
        content,
        category,
        youtube_url,
        activity_category,
        event_name,
        event_date,
        created_at
      `)
      .order("created_at", {
        ascending: false
      })
      .limit(500);

  if (error) {

    container.textContent =
      "자료 조회 실패: " +
      error.message;

    return;

  }

  container.replaceChildren();

  if (!data?.length) {

    container.append(
      createParagraph(
        "등록된 자료가 없습니다."
      )
    );

    return;

  }

  data.forEach(post => {

    const row =
      document.createElement("div");

    row.className = "row";

    const title =
      document.createElement("strong");

    title.textContent =
      post.title || "제목 없음";

    const info =
      createParagraph(
        `${post.category} · ${
          post.event_name ||
          post.created_at?.slice(0, 10) ||
          ""
        }`
      );

    info.className = "muted";

    const editButton =
      createButton(
        "수정",
        () => editResource(post)
      );

    const deleteButton =
      createButton(
        "삭제",
        () => deleteResource(post),
        "danger"
      );

    row.append(
      title,
      info,
      editButton,
      deleteButton
    );

    container.appendChild(row);

  });

}

$("refreshResources").addEventListener(
  "click",
  loadResources
);

/* =====================================
   기존 첨부파일 조회
===================================== */

async function loadAttachments(postId) {

  const { data, error } =
    await supabase
      .from("resource_attachments")
      .select(`
        resource_id,
        file_name,
        file_path,
        file_type,
        attachment_type
      `)
      .eq("resource_id", postId);

  if (error) {
    throw error;
  }

  attachments = data || [];

  renderAttachments();

}

/* =====================================
   첨부파일 목록
===================================== */

function renderAttachments() {

  const container =
    $("existingAttachments");

  container.replaceChildren();

  if (!editingId) {
    return;
  }

  const heading =
    document.createElement("h3");

  heading.textContent =
    "기존 첨부파일";

  container.appendChild(heading);

  if (attachments.length === 0) {

    container.append(
      createParagraph(
        "등록된 첨부파일이 없습니다."
      )
    );

    return;

  }

  attachments.forEach(file => {

    const row =
      document.createElement("div");

    row.className = "row";

    const { data } =
      supabase.storage
        .from("resource-files")
        .getPublicUrl(file.file_path);

    const link =
      document.createElement("a");

    link.href = data.publicUrl;

    link.target = "_blank";

    link.rel =
      "noopener noreferrer";

    link.textContent =
      file.file_name ||
      "첨부파일 보기";

    row.appendChild(link);

    const isImage =
      file.file_type?.startsWith(
        "image/"
      );

    if (isImage) {

      const img =
        document.createElement("img");

      img.src = data.publicUrl;

      img.alt =
        file.file_name ||
        "첨부 사진";

      img.className =
        "photo-preview";

      row.appendChild(img);

    }

    const deleteButton =
      createButton(
        "첨부 삭제",
        async () => {

          if (
            !confirm(
              "이 첨부파일을 삭제하시겠습니까?"
            )
          ) {
            return;
          }

          try {

            if (!await verifyAdmin()) {
              throw new Error(
                "관리자 권한이 없습니다."
              );
            }

            const postId = editingId;

            const { error } =
              await supabase
                .from("resource_attachments")
                .delete()
                .eq(
                  "resource_id",
                  postId
                )
                .eq(
                  "file_path",
                  file.file_path
                );

            if (error) {
              throw error;
            }

            const removed =
              await supabase.storage
                .from("resource-files")
                .remove([
                  file.file_path
                ]);

            if (removed.error) {

              console.warn(
                "Storage 정리 필요:",
                removed.error
              );

              alert(
                "첨부 연결은 삭제되었지만 " +
                "저장소 파일 정리가 필요합니다."
              );

            }

            await loadAttachments(postId);

          } catch (error) {

            alert(
              "첨부 삭제 실패: " +
              error.message
            );

          }

        },
        "danger"
      );

    row.appendChild(
      document.createElement("br")
    );

    row.appendChild(deleteButton);

    container.appendChild(row);

  });

}

/* =====================================
   자료 수정
===================================== */

async function editResource(post) {

  editingId = post.id;

  $("formHeading").textContent =
    "자료 수정";

  $("resourceCategory").value =
    post.category;

  $("resourceTitle").value =
    post.title || "";

  $("resourceContent").value =
    post.content || "";

  $("youtubeUrl").value =
    post.youtube_url || "";

  updateCategoryFields();

  const select =
    $("photoActivityCategory");

  select.value =
    post.activity_category || "";

  if (
    post.activity_category &&
    !select.value
  ) {

    select.add(
      new Option(
        post.activity_category +
        " (기존 분류)",
        post.activity_category
      )
    );

    select.value =
      post.activity_category;

  }

  $("photoEventName").value =
    post.event_name || "";

  $("photoEventDate").value =
    post.event_date
      ? String(post.event_date).slice(0, 10)
      : "";

  $("cancelEditButton").hidden =
    false;

  $("resourceFiles").value = "";

  try {

    await loadAttachments(post.id);

  } catch (error) {

    message(
      "saveMessage",
      "첨부파일 조회 실패: " +
      error.message,
      true
    );

  }

  $("resourceEditorSection")
    .scrollIntoView({
      behavior: "smooth"
    });

}

/* =====================================
   수정 취소
===================================== */

function resetEditor() {

  editingId = null;

  attachments = [];

  $("resourceForm").reset();

  $("formHeading").textContent =
    "자료 등록";

  $("cancelEditButton").hidden =
    true;

  $("existingAttachments")
    .replaceChildren();

  $("saveMessage").textContent = "";

  updateCategoryFields();

}

$("cancelEditButton").addEventListener(
  "click",
  resetEditor
);

/* =====================================
   첨부파일 종류
===================================== */

function getAttachmentType(category) {

  if (category === "image") {
    return "image";
  }

  if (category === "audio") {
    return "audio";
  }

  if (category === "video") {
    return "video";
  }

  return "document";

}

/* =====================================
   파일 업로드
===================================== */

async function uploadFiles(
  postId,
  category
) {

  const files =
    Array.from(
      $("resourceFiles").files
    );

  if (files.length === 0) {
    return;
  }

  if (category === "image") {

    const { data: existing, error } =
      await supabase
        .from("resource_attachments")
        .select("file_path,attachment_type")
        .eq("resource_id", postId)
        .eq("attachment_type", "image");

    if (error) {
      throw error;
    }

    const existingCount =
      existing?.length || 0;

    if (
      existingCount + files.length >
      MAX_PHOTOS
    ) {
      throw new Error(
        "사진은 최대 10개까지 등록할 수 있습니다."
      );
    }

    for (const file of files) {

      if (
        !file.type.startsWith("image/")
      ) {
        throw new Error(
          "사진 파일만 등록할 수 있습니다."
        );
      }

      if (
        file.size > MAX_PHOTO_BYTES
      ) {
        throw new Error(
          "사진 파일당 최대 크기는 20MB입니다."
        );
      }

    }

  }

  for (const file of files) {

    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        )
        .slice(-120);

    const path =
      `resources/${postId}/` +
      `${crypto.randomUUID()}-${safeName}`;

    const uploaded =
      await supabase.storage
        .from("resource-files")
        .upload(path, file, {
          contentType:
            file.type ||
            "application/octet-stream",
          upsert: false
        });

    if (uploaded.error) {
      throw uploaded.error;
    }

    const inserted =
      await supabase
        .from("resource_attachments")
        .insert({
          resource_id: postId,
          file_name: file.name,
          file_path: path,
          file_type:
            file.type ||
            "application/octet-stream",
          attachment_type:
            getAttachmentType(category)
        });

    if (inserted.error) {

      await supabase.storage
        .from("resource-files")
        .remove([path]);

      throw inserted.error;

    }

  }

}

/* =====================================
   자료 저장
===================================== */

$("resourceForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    if (saving) {
      return;
    }

    saving = true;

    $("saveButton").disabled = true;

    let savedPostId = editingId;

    let databaseSaved = false;

    try {

      const admin =
        await verifyAdmin();

      if (!admin) {
        throw new Error(
          "관리자 권한이 없습니다."
        );
      }

      currentUser = admin;

      const category =
        $("resourceCategory").value;

      const payload = {

        title:
          $("resourceTitle")
            .value.trim(),

        content:
          $("resourceContent")
            .value.trim() || null,

        category,

        youtube_url:
          category === "video"
            ? $("youtubeUrl")
                .value.trim() || null
            : null

      };

      if (!payload.title) {
        throw new Error(
          "자료 제목을 입력하세요."
        );
      }

      if (category === "image") {

        payload.activity_category =
          $("photoActivityCategory")
            .value || null;

        payload.event_name =
          $("photoEventName")
            .value.trim() || null;

        payload.event_date =
          $("photoEventDate")
            .value || null;

        if (
          !payload.activity_category
        ) {
          throw new Error(
            "사진 활동 분류를 선택하세요."
          );
        }

        if (
          !editingId &&
          (
            !payload.event_name ||
            !payload.event_date
          )
        ) {
          throw new Error(
            "행사명과 행사일을 입력하세요."
          );
        }

      }

      let postId = editingId;

      if (editingId) {

        const { error } =
          await supabase
            .from("resource_posts")
            .update(payload)
            .eq("id", editingId);

        if (error) {
          throw error;
        }

      } else {

        const { data, error } =
          await supabase
            .from("resource_posts")
            .insert({
              ...payload,
              author_id:
                currentUser.id
            })
            .select("id")
            .single();

        if (error) {
          throw error;
        }

        postId = data.id;

        savedPostId = postId;

      }

      databaseSaved = true;

      /*
       * 게시물 저장 성공 후에는
       * 파일 업로드 실패 시에도
       * 게시물 ID를 유지합니다.
       */

      editingId = postId;

      $("formHeading").textContent =
        "자료 수정";

      $("cancelEditButton").hidden =
        false;

      updateCategoryFields();

      await uploadFiles(
        postId,
        category
      );

      resetEditor();

      message(
        "saveMessage",
        "자료와 첨부파일이 저장되었습니다."
      );

      await loadResources();

    } catch (error) {

      console.error(
        "자료 저장 오류:",
        error
      );

      if (
        databaseSaved &&
        savedPostId
      ) {

        editingId = savedPostId;

        $("formHeading").textContent =
          "자료 수정 및 첨부파일 재등록";

        $("cancelEditButton").hidden =
          false;

        updateCategoryFields();

        try {

          await loadAttachments(
            savedPostId
          );

        } catch (attachmentError) {

          console.error(
            attachmentError
          );

        }

        message(
          "saveMessage",
          "게시물은 저장되었지만 " +
          "첨부파일 처리에 실패했습니다.\n" +
          "기존 첨부파일 목록을 확인한 후 " +
          "다시 저장하세요.\n" +
          error.message,
          true
        );

      } else {

        message(
          "saveMessage",
          "자료 저장 실패: " +
          error.message,
          true
        );

      }

    } finally {

      saving = false;

      $("saveButton").disabled =
        false;

    }

  }
);

/* =====================================
   자료 삭제
===================================== */

async function deleteResource(post) {

  if (
    !confirm(
      `"${post.title}" 자료를 삭제하시겠습니까?\n` +
      "삭제한 자료는 복구할 수 없습니다."
    )
  ) {
    return;
  }

  try {

    if (!await verifyAdmin()) {
      throw new Error(
        "관리자 권한이 없습니다."
      );
    }

    const { data: files, error: fileError } =
      await supabase
        .from("resource_attachments")
        .select("file_path")
        .eq("resource_id", post.id);

    if (fileError) {
      throw fileError;
    }

    const { error: attachmentError } =
      await supabase
        .from("resource_attachments")
        .delete()
        .eq("resource_id", post.id);

    if (attachmentError) {
      throw attachmentError;
    }

    const { error: postError } =
      await supabase
        .from("resource_posts")
        .delete()
        .eq("id", post.id);

    if (postError) {
      throw postError;
    }

    const paths =
      (files || [])
        .map(file => file.file_path)
        .filter(Boolean);

    if (paths.length > 0) {

      const { error: storageError } =
        await supabase.storage
          .from("resource-files")
          .remove(paths);

      if (storageError) {

        console.warn(
          "Storage 파일 정리 필요:",
          storageError
        );

        alert(
          "게시물은 삭제되었지만 " +
          "저장소 파일 정리가 필요합니다."
        );

      }

    }

    if (editingId === post.id) {
      resetEditor();
    }

    await loadResources();

  } catch (error) {

    alert(
      "자료 삭제 실패: " +
      error.message
    );

  }

}

   최초 실행

  message(
    "loginMessage",
    "관리자 화면 초기화에 실패했습니다. " +

    true
  );

});
