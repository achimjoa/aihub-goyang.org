<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>통합 자료실 관리 | 글로벌 AI 허브</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Malgun Gothic", Arial, sans-serif;
  background: #f4f8fc;
  color: #17315b;
}

header {
  background: #0754a6;
  color: white;
  text-align: center;
  padding: 40px 15px;
}

header h1 {
  margin: 0 0 15px;
}

header p {
  line-height: 1.8;
}

.home-return {
  margin-top: 25px;
}

.home-return a {
  display: inline-block;
  background: white;
  color: #0754a6;
  padding: 12px 22px;
  margin: 5px;
  border-radius: 8px;
  font-weight: bold;
  text-decoration: none;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 35px 15px;
}

section {
  background: white;
  padding: 30px;
  border-radius: 12px;
  margin-bottom: 30px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

h2 {
  color: #0754a6;
}

#adminMessage {
  line-height: 1.8;
  white-space: pre-line;
}

#resourceArea[hidden] {
  display: none;
}

.category-buttons {
  margin: 25px 0;
}

.category-buttons button {
  padding: 10px 18px;
  margin: 4px;
  border: 1px solid #ccc;
  border-radius: 7px;
  background: white;
  cursor: pointer;
}

.category-buttons button.active {
  background: #0754a6;
  color: white;
  border-color: #0754a6;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 15px;
  border-bottom: 1px solid #ddd;
  text-align: left;
}

th {
  background: #eaf1f9;
}

footer {
  background: #10315e;
  color: white;
  text-align: center;
  padding: 30px 15px;
  line-height: 1.8;
}

@media (max-width: 600px) {

  section {
    padding: 20px;
  }

  th, td {
    padding: 10px;
    font-size: 13px;
  }

}

/* =====================================
   관리자 자료 등록 버튼
===================================== */

.resource-admin-actions {
  margin: 25px 0;
}

#resourceWriteButton {
  padding: 12px 22px;
  background: #0754a6;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

#resourceWriteButton:disabled {
  background: #9ca3af;
  cursor: not-allowed;
}

/* =====================================
   자료 등록 입력 화면
===================================== */

#resourceWriteView[hidden] {
  display: none;
}

.form-group {
  margin-bottom: 24px;
}

.form-group label {
  display: block;
  font-weight: bold;
  margin-bottom: 10px;
  color: #0754a6;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 15px;
  font-family: inherit;
}

.form-group textarea {
  resize: vertical;
}

.form-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 25px;
}

.form-actions button {
  padding: 12px 24px;
  border: none;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

#resourceSubmitButton {
  background: #0754a6;
  color: white;
}

#resourceSubmitButton:disabled {
  background: #9ca3af;
  cursor: not-allowed;
}

#resourceCancelButton {
  background: #e5e7eb;
  color: #17315b;
}

/* =====================================
   관리자 자료실 제목 버튼
===================================== */

.resource-title-button {
  background: transparent;
  border: none;
  padding: 0;
  margin: 0;

  color: #0754a6;
  font-size: inherit;
  font-family: inherit;
  font-weight: 600;

  text-align: left;
  text-decoration: underline;

  cursor: pointer;
}

.resource-title-button:hover {
  color: #003b7a;
}

.resource-title-button:focus-visible {
  outline: 2px solid #0754a6;
  outline-offset: 4px;
}
  
</style>

</head>

<body>

<header>

  <h1>📚 통합 자료실 관리</h1>

  <p>
    경기도 글로벌 AI 허브 유치<br>
    고양특례시 범시민추진위원회
  </p>

  <div class="home-return">

    <a href="admin-center.html">
      ← 통합 관리센터로 돌아가기
    </a>

    <a href="index.html">
      ← 홈페이지로 돌아가기
    </a>

  </div>

</header>

<main>

<section>

  <h2>관리자 인증</h2>

  <p
    id="adminMessage"
    role="status"
    aria-live="polite"
  >
    관리자 권한을 확인하고 있습니다.
  </p>

</section>

<section id="resourceArea" hidden>

  <h2>자료 목록</h2>

  <p>
    기존 통합 자료실에 등록된 자료를
    확인할 수 있습니다.
  </p>

<!-- =====================================
     관리자 자료 등록 버튼
===================================== -->

<div class="resource-admin-actions">

  <button
    type="button"
    id="resourceWriteButton"
    disabled
    title="자료 등록 기능 연결 준비 중"
  >
    ＋ 새 자료 등록
  </button>

</div>
  
  <div class="category-buttons">

    <button type="button"
      class="active"
      data-category="all">전체</button>

    <button type="button"
      data-category="document">문서</button>

    <button type="button"
      data-category="image">사진</button>

    <button type="button"
      data-category="video">동영상</button>

    <button type="button"
      data-category="audio">음성</button>

    <button type="button"
      data-category="other">기타</button>

  </div>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>번호</th>
          <th>자료 제목</th>
          <th>분류</th>
          <th>등록일</th>
        </tr>
      </thead>

      <tbody id="resourceList"></tbody>

    </table>

  </div>

</section>

<!-- =====================================
     관리자 자료 등록 화면
===================================== -->

<section id="resourceWriteView" hidden>

  <h2>새 자료 등록</h2>

  <p>
    통합 자료실에 게시할 자료를
    등록합니다.
  </p>

  <form id="resourceForm">

    <!-- 자료 제목 -->

    <div class="form-group">

      <label for="resourceTitle">
        자료 제목 *
      </label>

      <input
        type="text"
        id="resourceTitle"
        maxlength="200"
        required
      >

    </div>

    <!-- 자료 분류 -->

    <div class="form-group">

      <label for="resourceCategory">
        자료 분류 *
      </label>

      <select
        id="resourceCategory"
        required
      >

        <option value="document">문서</option>
        <option value="image">사진</option>
        <option value="video">동영상</option>
        <option value="audio">음성</option>
        <option value="other">기타</option>

      </select>

    </div>

    <!-- 자료 설명 -->

    <div class="form-group">

      <label for="resourceContent">
        자료 설명
      </label>

      <textarea
        id="resourceContent"
        rows="8"
      ></textarea>

    </div>

    <!-- 문서 첨부 -->

    <div class="form-group">

      <label for="resourceDocuments">
        📎 문서 첨부
      </label>

      <input
        type="file"
        id="resourceDocuments"
        accept=".pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip"
        multiple
      >

    </div>

    <!-- 사진 첨부 -->

    <div class="form-group">

      <label for="resourcePhotos">
        📷 사진 첨부
      </label>

      <input
        type="file"
        id="resourcePhotos"
        accept="image/jpeg,image/png,image/webp,image/gif"
        multiple
      >

    </div>

    <!-- 음성 첨부 -->

    <div class="form-group">

      <label for="resourceAudio">
        🎵 음성 첨부
      </label>

      <input
        type="file"
        id="resourceAudio"
        accept=".mp3,.wav,.m4a"
        multiple
      >

    </div>

    <p>
      첨부파일은 총 10개까지 등록할 수 있으며,
      파일당 최대 20MB입니다.
    </p>

    <!-- YouTube 주소 -->

    <div class="form-group">

      <label for="resourceYoutube">
        ▶️ YouTube 영상 주소
      </label>

      <input
        type="url"
        id="resourceYoutube"
        placeholder="https://www.youtube.com/watch?v=..."
      >

    </div>

    <!-- 버튼 -->

    <div class="form-actions">

      <button
  type="submit"
  id="resourceSubmitButton"
>
  자료 등록
</button>

      <button
        type="button"
        id="resourceCancelButton"
      >
        취소
      </button>

    </div>

  </form>

</section>
  
</main>

<footer>

  경기도 글로벌 AI 허브 유치<br>
  고양특례시 범시민추진위원회

</footer>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* Supabase 연결 */

const SUPABASE_URL =
  "https://gugkwqpvtwivqudkimvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* 화면 요소 */

const adminMessage =
  document.getElementById("adminMessage");

const resourceArea =
  document.getElementById("resourceArea");

const resourceList =
  document.getElementById("resourceList");

const categoryButtons =
  document.querySelectorAll(
    "[data-category]"
  );

/* 현재 분류 */

let currentCategory = "all";

/* 관리자 확인 */

async function checkAdmin() {

  const { data, error } =
    await supabase.auth.getUser();

  if (error || !data.user) {

    adminMessage.textContent =
      "로그인이 필요합니다.";

    return false;
  }

  const result =
    await supabase.rpc("is_admin");

  if (result.error) {

    adminMessage.textContent =
      "관리자 권한 확인 오류:\n" +
      result.error.message;

    return false;
  }

  if (result.data !== true) {

    adminMessage.textContent =
      "관리자 권한이 없습니다.";

    return false;
  }

  adminMessage.textContent =
    "관리자 인증이 완료되었습니다.";

  return true;
}

/* 분류 이름 */

function categoryName(category) {

  const names = {
    document: "문서",
    image: "사진",
    video: "동영상",
    audio: "음성",
    other: "기타"
  };

  return names[category] || "기타";
}

/* 자료 목록 조회 */

async function loadResources() {

  resourceList.replaceChildren();

  const loadingRow =
    document.createElement("tr");

  const loadingCell =
    document.createElement("td");

  loadingCell.colSpan = 4;
  loadingCell.textContent =
    "자료를 불러오고 있습니다.";

  loadingRow.appendChild(loadingCell);
  resourceList.appendChild(loadingRow);

  let query = supabase
    .from("resource_posts")
    .select(
      "id, title, category, created_at"
    );

  if (currentCategory !== "all") {

    query = query.eq(
      "category",
      currentCategory
    );
  }

  const { data, error } =
    await query.order(
      "created_at",
      { ascending: false }
    );

  resourceList.replaceChildren();

  if (error) {

    const row =
      document.createElement("tr");

    const cell =
      document.createElement("td");

    cell.colSpan = 4;
    cell.textContent =
      "자료 조회 오류: " +
      error.message;

    row.appendChild(cell);
    resourceList.appendChild(row);

    return;
  }

  if (!data || data.length === 0) {

    const row =
      document.createElement("tr");

    const cell =
      document.createElement("td");

    cell.colSpan = 4;
    cell.textContent =
      "등록된 자료가 없습니다.";

    row.appendChild(cell);
    resourceList.appendChild(row);

    return;
  }

  for (const resource of data) {

    const row =
      document.createElement("tr");

    const values = [

      resource.id,

      resource.title || "",

      categoryName(
        resource.category
      ),

      resource.created_at
        ? new Date(
            resource.created_at
          ).toLocaleDateString("ko-KR")
        : ""

    ];

    /* =====================================
   144-5-5-9-1단계
   자료 제목 클릭 버튼 생성
===================================== */

values.forEach((value, index) => {

  const cell =
    document.createElement("td");

  /* 두 번째 열은 자료 제목 */

  if (index === 1) {

    const titleButton =
      document.createElement("button");

    titleButton.type = "button";

    titleButton.textContent = value;

    titleButton.className =
      "resource-title-button";

    /* 상세보기 연결 예정 */

    titleButton.addEventListener(
      "click",
      () => {

        alert(
          "선택한 자료 번호: " +
          resource.id
        );

      }
    );

    cell.appendChild(titleButton);

  } else {

    cell.textContent = value;

  }

  row.appendChild(cell);

});

    resourceList.appendChild(row);
  }

}

/* 분류 버튼 */

categoryButtons.forEach(button => {

  button.addEventListener(
    "click",
    async () => {

      currentCategory =
        button.dataset.category;

      categoryButtons.forEach(item => {
        item.classList.remove("active");
      });

      button.classList.add("active");

      await loadResources();

    }
  );

});

/* =====================================
   관리자 자료 등록 화면 전환
===================================== */

const resourceWriteButton =
  document.getElementById("resourceWriteButton");

const resourceWriteView =
  document.getElementById("resourceWriteView");

const resourceCancelButton =
  document.getElementById("resourceCancelButton");

const resourceForm =
  document.getElementById("resourceForm");

/* 자료 등록 화면 열기 */

resourceWriteButton.addEventListener(
  "click",
  () => {

    if (resourceArea.hidden) {
      return;
    }

    resourceArea.hidden = true;
    resourceWriteView.hidden = false;

    document.getElementById(
      "resourceTitle"
    ).focus();

  }
);

/* 자료 등록 취소 */

resourceCancelButton.addEventListener(
  "click",
  () => {

    resourceForm.reset();

    resourceWriteView.hidden = true;
    resourceArea.hidden = false;

  }
);

/* =====================================
   144-5-5-7단계
   관리자 자료 등록 기능
   첨부파일 없는 자료부터 등록
===================================== */

const resourceSubmitButton =
  document.getElementById("resourceSubmitButton");

let resourceSaving = false;

resourceForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    /* 중복 제출 방지 */

    if (resourceSaving) {
      return;
    }

    /* 관리자 권한 재확인 */

    const { data: isAdmin, error: adminError } =
      await supabase.rpc("is_admin");

    if (adminError || isAdmin !== true) {

      alert(
        "관리자 권한을 확인할 수 없습니다."
      );

      return;
    }

    /* 로그인 사용자 확인 */

    const { data: authData, error: authError } =
      await supabase.auth.getUser();

    if (authError || !authData.user) {

      alert(
        "로그인 상태를 확인할 수 없습니다."
      );

      return;
    }

    /* 입력값 */

    const title =
      document.getElementById("resourceTitle")
        .value.trim();

    const category =
      document.getElementById("resourceCategory")
        .value;

    const content =
      document.getElementById("resourceContent")
        .value.trim();

    const youtubeUrl =
      document.getElementById("resourceYoutube")
        .value.trim();

    /* 제목 확인 */

    if (!title) {

      alert("자료 제목을 입력해 주세요.");

      return;
    }

    /* 자료 분류 확인 */

    const allowedCategories = [
      "document",
      "image",
      "video",
      "audio",
      "other"
    ];

    if (!allowedCategories.includes(category)) {

      alert("올바른 자료 분류를 선택해 주세요.");

      return;
    }

    /* 첨부파일 확인 */

    const selectedFiles = [

      ...document.getElementById(
        "resourceDocuments"
      ).files,

      ...document.getElementById(
        "resourcePhotos"
      ).files,

      ...document.getElementById(
        "resourceAudio"
      ).files

    ];

    /* =====================================
   144-5-5-8-1단계
   첨부파일 사전 검사
===================================== */

/* 전체 첨부파일 개수 확인 */

if (selectedFiles.length > 10) {

  alert(
    "첨부파일은 문서·사진·음성을 합쳐 " +
    "최대 10개까지 등록할 수 있습니다."
  );

  return;
}

/* 파일당 최대 20MB */

const maxFileSize = 20 * 1024 * 1024;

/* 허용 확장자 */

const allowedExtensions = {

  resourceDocuments: [
    "pdf", "hwp", "hwpx",
    "doc", "docx",
    "xls", "xlsx",
    "ppt", "pptx", "zip"
  ],

  resourcePhotos: [
    "jpg", "jpeg", "png",
    "webp", "gif"
  ],

  resourceAudio: [
    "mp3", "wav", "m4a"
  ]

};

/* 파일 종류별 검사 */

for (const [inputId, extensions] of
  Object.entries(allowedExtensions)) {

  const input =
    document.getElementById(inputId);

  for (const file of input.files) {

    const extension =
      file.name.split(".").pop().toLowerCase();

    /* 확장자 검사 */

    if (!extensions.includes(extension)) {

      alert(
        "지원하지 않는 파일 형식입니다:\n" +
        file.name
      );

      return;
    }

    /* 빈 파일 검사 */

    if (file.size === 0) {

      alert(
        "빈 파일은 등록할 수 없습니다:\n" +
        file.name
      );

      return;
    }

    /* 파일 크기 검사 */

    if (file.size > maxFileSize) {

      alert(
        "파일당 최대 20MB까지 등록할 수 있습니다:\n" +
        file.name
      );

      return;
    }

  }

}

    /* YouTube 주소 검사 */

    if (youtubeUrl) {

      let url;

      try {

        url = new URL(youtubeUrl);

      } catch {

        alert(
          "올바른 YouTube 주소를 입력해 주세요."
        );

        return;
      }

      const allowedHosts = [
        "youtube.com",
        "www.youtube.com",
        "m.youtube.com",
        "youtu.be",
        "www.youtu.be"
      ];

      if (
        url.protocol !== "https:" ||
        !allowedHosts.includes(
          url.hostname.toLowerCase()
        )
      ) {

        alert(
          "HTTPS YouTube 주소만 등록할 수 있습니다."
        );

        return;
      }
    }

    /* 저장 시작 */

    resourceSaving = true;

    resourceSubmitButton.disabled = true;

    resourceSubmitButton.textContent =
      "자료 등록 중...";

    try {

      /* Supabase 게시물 저장 */

      const { data: resource, error } =
        await supabase
          .from("resource_posts")
          .insert({

            title: title,

            category: category,

            content: content,

            youtube_url:
              youtubeUrl || null,

            author_id:
              authData.user.id

          })
          .select("id")
          .single();

      if (error) {
        throw error;
      }

      if (!resource) {

        throw new Error(
          "등록된 자료를 확인할 수 없습니다."
        );
      }

/* =====================================
   144-5-5-8-2단계
   첨부파일 업로드 및 정보 저장
===================================== */

/* 파일 종류별 업로드 목록 */

const uploadItems = [

  ...Array.from(
    document.getElementById("resourceDocuments").files
  ).map(file => ({
    file,
    type: "document"
  })),

  ...Array.from(
    document.getElementById("resourcePhotos").files
  ).map(file => ({
    file,
    type: "image"
  })),

  ...Array.from(
    document.getElementById("resourceAudio").files
  ).map(file => ({
    file,
    type: "audio"
  }))

];

/* 업로드된 파일 경로 */

const uploadedPaths = [];

try {

  for (let i = 0; i < uploadItems.length; i++) {

    const item = uploadItems[i];
    const file = item.file;

    const extension =
      file.name.split(".").pop().toLowerCase();

    /* 관리자 UID 폴더에 저장 */

    const filePath =
      authData.user.id + "/" +
      crypto.randomUUID() + "." + extension;

    /* 진행 상황 표시 */

    resourceSubmitButton.textContent =
      `파일 업로드 중 (${i + 1}/${uploadItems.length})`;

    /* Supabase Storage 업로드 */

    const { error: uploadError } =
      await supabase.storage
        .from("resource-files")
        .upload(filePath, file, {

          contentType:
            file.type || "application/octet-stream",

          upsert: false

        });

    if (uploadError) {
      throw new Error(
        "파일 업로드 실패: " +
        file.name + "\n" +
        uploadError.message
      );
    }

    uploadedPaths.push(filePath);

    /* 첨부파일 정보 저장 */

    const { error: attachmentError } =
      await supabase
        .from("resource_attachments")
        .insert({

          resource_id: resource.id,

          uploader_id: authData.user.id,

          file_name: file.name,

          file_path: filePath,

          file_type:
            file.type || "application/octet-stream",

          file_size: file.size,

          attachment_type: item.type

        });

    if (attachmentError) {
      throw new Error(
        "첨부파일 정보 저장 실패: " +
        file.name + "\n" +
        attachmentError.message
      );
    }

  }

} catch (uploadError) {

  );
