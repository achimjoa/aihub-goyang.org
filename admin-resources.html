<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>통합 자료실 관리 | 글로벌 AI 허브</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Malgun Gothic", Arial, sans-serif;
  background: #f4f8fc;
  color: #17315b;
}

header {
  background: #0754a6;
  color: white;
  text-align: center;
  padding: 40px 15px;
}

header h1 {
  margin: 0 0 15px;
}

header p {
  line-height: 1.8;
}

.home-return {
  margin-top: 25px;
}

.home-return a {
  display: inline-block;
  background: white;
  color: #0754a6;
  padding: 12px 22px;
  margin: 5px;
  border-radius: 8px;
  font-weight: bold;
  text-decoration: none;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 35px 15px;
}

section {
  background: white;
  padding: 30px;
  border-radius: 12px;
  margin-bottom: 30px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

h2 {
  color: #0754a6;
}

#adminMessage {
  line-height: 1.8;
  white-space: pre-line;
}

#resourceArea[hidden] {
  display: none;
}

.category-buttons {
  margin: 25px 0;
}

.category-buttons button {
  padding: 10px 18px;
  margin: 4px;
  border: 1px solid #ccc;
  border-radius: 7px;
  background: white;
  cursor: pointer;
}

.category-buttons button.active {
  background: #0754a6;
  color: white;
  border-color: #0754a6;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 15px;
  border-bottom: 1px solid #ddd;
  text-align: left;
}

th {
  background: #eaf1f9;
}

footer {
  background: #10315e;
  color: white;
  text-align: center;
  padding: 30px 15px;
  line-height: 1.8;
}

@media (max-width: 600px) {

  section {
    padding: 20px;
  }

  th, td {
    padding: 10px;
    font-size: 13px;
  }

}

/* =====================================
   관리자 자료 등록 버튼
===================================== */

.resource-admin-actions {
  margin: 25px 0;
}

#resourceWriteButton {
  padding: 12px 22px;
  background: #0754a6;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

#resourceWriteButton:disabled {
  background: #9ca3af;
  cursor: not-allowed;
}
  
</style>

</head>

<body>

<header>

  <h1>📚 통합 자료실 관리</h1>

  <p>
    경기도 글로벌 AI 허브 유치<br>
    고양특례시 범시민추진위원회
  </p>

  <div class="home-return">

    <a href="admin-center.html">
      ← 통합 관리센터로 돌아가기
    </a>

    <a href="index.html">
      ← 홈페이지로 돌아가기
    </a>

  </div>

</header>

<main>

<section>

  <h2>관리자 인증</h2>

  <p
    id="adminMessage"
    role="status"
    aria-live="polite"
  >
    관리자 권한을 확인하고 있습니다.
  </p>

</section>

<section id="resourceArea" hidden>

  <h2>자료 목록</h2>

  <p>
    기존 통합 자료실에 등록된 자료를
    확인할 수 있습니다.
  </p>

<!-- =====================================
     관리자 자료 등록 버튼
===================================== -->

<div class="resource-admin-actions">

  <button
    type="button"
    id="resourceWriteButton"
    disabled
    title="자료 등록 기능 연결 준비 중"
  >
    ＋ 새 자료 등록
  </button>

</div>
  
  <div class="category-buttons">

    <button type="button"
      class="active"
      data-category="all">전체</button>

    <button type="button"
      data-category="document">문서</button>

    <button type="button"
      data-category="image">사진</button>

    <button type="button"
      data-category="video">동영상</button>

    <button type="button"
      data-category="audio">음성</button>

    <button type="button"
      data-category="other">기타</button>

  </div>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>번호</th>
          <th>자료 제목</th>
          <th>분류</th>
          <th>등록일</th>
        </tr>
      </thead>

      <tbody id="resourceList"></tbody>

    </table>

  </div>

</section>

</main>

<footer>

  경기도 글로벌 AI 허브 유치<br>
  고양특례시 범시민추진위원회

</footer>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* Supabase 연결 */

const SUPABASE_URL =
  "https://gugkwqpvtwivqudkimvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* 화면 요소 */

const adminMessage =
  document.getElementById("adminMessage");

const resourceArea =
  document.getElementById("resourceArea");

const resourceList =
  document.getElementById("resourceList");

const categoryButtons =
  document.querySelectorAll(
    "[data-category]"
  );

/* 현재 분류 */

let currentCategory = "all";

/* 관리자 확인 */

async function checkAdmin() {

  const { data, error } =
    await supabase.auth.getUser();

  if (error || !data.user) {

    adminMessage.textContent =
      "로그인이 필요합니다.";

    return false;
  }

  const result =
    await supabase.rpc("is_admin");

  if (result.error) {

    adminMessage.textContent =
      "관리자 권한 확인 오류:\n" +
      result.error.message;

    return false;
  }

  if (result.data !== true) {

    adminMessage.textContent =
      "관리자 권한이 없습니다.";

    return false;
  }

  adminMessage.textContent =
    "관리자 인증이 완료되었습니다.";

  return true;
}

/* 분류 이름 */

function categoryName(category) {

  const names = {
    document: "문서",
    image: "사진",
    video: "동영상",
    audio: "음성",
    other: "기타"
  };

  return names[category] || "기타";
}

/* 자료 목록 조회 */

async function loadResources() {

  resourceList.replaceChildren();

  const loadingRow =
    document.createElement("tr");

  const loadingCell =
    document.createElement("td");

  loadingCell.colSpan = 4;
  loadingCell.textContent =
    "자료를 불러오고 있습니다.";

  loadingRow.appendChild(loadingCell);
  resourceList.appendChild(loadingRow);

  let query = supabase
    .from("resource_posts")
    .select(
      "id, title, category, created_at"
    );

  if (currentCategory !== "all") {

    query = query.eq(
      "category",
      currentCategory
    );
  }

  const { data, error } =
    await query.order(
      "created_at",
      { ascending: false }
    );

  resourceList.replaceChildren();

  if (error) {

    const row =
      document.createElement("tr");

    const cell =
      document.createElement("td");

    cell.colSpan = 4;
    cell.textContent =
      "자료 조회 오류: " +
      error.message;

    row.appendChild(cell);
    resourceList.appendChild(row);

    return;
  }

  if (!data || data.length === 0) {

    const row =
      document.createElement("tr");

    const cell =
      document.createElement("td");

    cell.colSpan = 4;
    cell.textContent =
      "등록된 자료가 없습니다.";

    row.appendChild(cell);
    resourceList.appendChild(row);

    return;
  }

  for (const resource of data) {

    const row =
      document.createElement("tr");

    const values = [

      resource.id,

      resource.title || "",

      categoryName(
        resource.category
      ),

      resource.created_at
        ? new Date(
            resource.created_at
          ).toLocaleDateString("ko-KR")
        : ""

    ];

    for (const value of values) {

      const cell =
        document.createElement("td");

      cell.textContent = value;

      row.appendChild(cell);
    }

    resourceList.appendChild(row);
  }

}

/* 분류 버튼 */

categoryButtons.forEach(button => {

  button.addEventListener(
    "click",
    async () => {

      currentCategory =
        button.dataset.category;

      categoryButtons.forEach(item => {
        item.classList.remove("active");
      });

      button.classList.add("active");

      await loadResources();

    }
  );

});

/* 최초 실행 */

async function initialize() {

  resourceArea.hidden = true;

  try {

    const isAdmin =
      await checkAdmin();

    if (!isAdmin) {
      return;
    }

    resourceArea.hidden = false;

    await loadResources();

  } catch (error) {

    console.error(
      "자료실 관리 오류:",
      error
    );

    adminMessage.textContent =
      "자료실 관리 화면을 불러오지 못했습니다.\n" +
      error.message;

    resourceArea.hidden = true;

  }

}

initialize();

</script>

</body>
</html>
