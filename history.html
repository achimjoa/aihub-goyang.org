\nh3 {\n  color: #0754a6;\n}\n\n.intro {\n  text-align: center;\n}\n\n/* =====================================\n   分类筛选按钮\n===================================== */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  background: white;\n  border: 1px solid #0754a6;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n  font-size: 14px;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n.filters button:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   时间轴\n===================================== */\n\n.timeline {\n  border-left: 4px solid #168de0;\n  margin-left: 12px;\n  padding-left: 25px;\n}\n\n.event {\n  position: relative;\n  padding: 0 0 25px;\n}\n\n.event::before {\n  content: \"\";\n  position: absolute;\n  left: -34px;\n  top: 8px;\n  width: 14px;\n  height: 14px;\n  background: #168de0;\n  border-radius: 50%;\n}\n\n.date {\n  color: #0754a6;\n  font-weight: bold;\n  font-size: 17px;\n}\n\n.type {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 3px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  margin: 8px 0;\n}\n\n.event h3 {\n  margin: 5px 0;\n  color: #17315b;\n}\n\n.event p {\n  margin: 5px 0;\n  color: #46566d;\n}\n\n/* =====================================\n   未来重点任务\n===================================== */\n\n.future {\n  border-left: 4px solid #1b9a80;\n  padding-left: 20px;\n  margin-top: 20px;\n}\n\n/* =====================================\n   重要说明\n===================================== */\n\n.note {\n  background: #fff8e8;\n  padding: 20px;\n  border-radius: 8px;\n  margin-top: 25px;\n}\n\n/* =====================================\n   按钮\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   页脚\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   移动设备\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     页眉\n===================================== -->\n\n<header>\n\n<h1>\n全球人工智能枢纽倡议<br>\n发展历程与重要里程碑\n</h1>\n\n<p>\n韩国中央政府 · 京畿道<br>\n高阳特例市 · 市民推进委员会\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=zh\"\n  class=\"home-link\"\n>\n  ← 中文首页\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     发展历程介绍\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\n迈向全球人工智能枢纽的发展历程\n</h2>\n\n<p>\n本时间轴介绍\n大韩民国全球人工智能枢纽倡议\n的主要发展进程，\n以及为推动拟议中的全球人工智能枢纽\n落户高阳特例市\n而开展的重要活动。\n</p>\n\n<p>\n市民参与、\n政策准备\n以及机构间合作，\n是未来开展国际合作的重要基础。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     分类筛选按钮\n===================================== -->\n\n<nav\n  class=\"filters\"\n  aria-label=\"按机构筛选发展历程\"\n>\n\n<button\n  type=\"button\"\n  class=\"active\"\n  data-type=\"all\"\n  aria-pressed=\"true\"\n>\n  全部事件\n</button>\n\n<button\n  type=\"button\"\n  data-type=\"government\"\n  aria-pressed=\"false\"\n>\n  韩国中央政府\n</button>\n\n<button\n  type=\"button\"\n  data-type=\"gyeonggi\"\n  aria-pressed=\"false\"\n>\n  京畿道\n</button>\n\n<button\n  type=\"button\"\n  data-type=\"goyang\"\n  aria-pressed=\"false\"\n>\n  高阳特例市\n</button>\n\n<button\n  type=\"button\"\n  data-type=\"civic\"\n  aria-pressed=\"false\"\n>\n  市民推进委员会\n</button>\n\n</nav>\n\n\u003c!-- =====================================\n     主要发展历程\n===================================== -->\n\n<section>\n\n<h2>\n主要发展历程\n</h2>\n\n<div\n  class=\"timeline\"\n  id=\"timeline\"\n  aria-live=\"polite\"\n>\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     未来重点任务\n===================================== -->\n\n<section>\n\n<h2>\n未来重点任务\n</h2>\n\n\u003c!-- 重点任务 01 -->\n\n<div class=\"future\">\n\n<h3>\n准备全球人工智能枢纽选址评估\n</h3>\n\n<p>\n审查政府正式公告\n以及选址评价标准，\n利用客观支持性证据\n说明高阳特例市的竞争优势\n和实施计划。\n</p>\n\n</div>\n\n\u003c!-- 重点任务 02 -->\n\n<div class=\"future\">\n\n<h3>\n为国际组织初期入驻做好准备\n</h3>\n\n<p>\n针对潜在参与机构\n可能需要的办公设施、\n居住条件、\n医疗、\n教育、\n交通\n以及其他服务，\n制定切实可行的建议方案。\n</p>\n\n</div>\n\n\u003c!-- 重点任务 03 -->\n\n<div class=\"future\">\n\n<h3>\n筹备公共利益人工智能试点项目\n</h3>\n\n<p>\n研究人工智能辅助基本医疗服务\n以及应对复杂危机等领域\n潜在合作项目的可行性。\n</p>\n\n<p>\n确定潜在合作伙伴机构，\n并评估实施项目所需的条件。\n</p>\n\n</div>\n\n\u003c!-- 重要说明 -->\n\n<div class=\"note\">\n\n<strong>\n重要说明\n</strong>\n\n<p>\n未来的实施时间表\n可能根据政府正式公告\n以及相关机构的决定\n发生变化。\n</p>\n\n<p>\n本页面旨在总结\n主要发展进程和活动。\n</p>\n\n<p>\n这并不意味着\n所有未来计划\n或机构合作安排\n均已获得正式确认。\n</p>\n\n</div>\n\n<a\n  href=\"strategy.html?lang=zh\"\n  class=\"button\"\n>\n  全球人工智能枢纽引进战略\n</a>\n\n<a\n  href=\"committee.html?lang=zh\"\n  class=\"button\"\n>\n  关于市民推进委员会\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     页脚\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\n高阳特例市全球人工智能枢纽<br>\n引进市民推进委员会\n</strong>\n</p>\n\n<p>\n与市民同行，<br>\n与京畿道同行，<br>\n与世界同行。\n</p>\n\n<p>\n<a href=\"index.html?lang=zh\">\n中文首页\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     JavaScript\n     发展历程数据与筛选功能\n===================================== -->\n\n\u003cscript>\n\nconst events = [\n\n  /* =====================================\n     2026年3月10日\n  ===================================== */\n\n  {\n    date: \"2026.03.10\",\n    type: \"government\",\n    label: \"韩国中央政府\",\n    title: \"政府发布全球人工智能枢纽倡议相关公告\",\n    description:\n      \"有关全球人工智能枢纽倡议的政府层面讨论和筹备工作进一步推进。\"\n  },\n\n  /* =====================================\n     2026年3月16日\n  ===================================== */\n\n  {\n    date: \"2026.03.16\",\n    type: \"government\",\n    label: \"韩国中央政府\",\n    title: \"韩国国务总理与联合国代表举行会谈\",\n    description:\n      \"双方就与全球人工智能枢纽倡议相关的国际合作进行了讨论。\"\n  },\n\n  /* =====================================\n     2026年3月17日\n  ===================================== */\n\n  {\n    date: \"2026.03.17\",\n    type: \"government\",\n    label: \"韩国中央政府\",\n    title: \"韩国政府与国际组织推进签署合作意向书\",\n    description:\n      \"相关方面推动就全球人工智能枢纽倡议的合作事项签署意向书。\"\n  },\n\n  /* =====================================\n     2026年4月9日\n  ===================================== */\n\n  {\n    date: \"2026.04.09\",\n    type: \"government\",\n    label: \"韩国中央政府\",\n    title: \"韩国国务总理就全球人工智能枢纽倡议作出指示\",\n    description:\n      \"建立了围绕全球人工智能枢纽倡议开展政府部门间合作的制度框架。\"\n  },\n\n  /* =====================================\n     2026年5月21日\n  ===================================== */\n\n  {\n    date: \"2026.05.21\",\n    type: \"government\",\n    label: \"韩国中央政府\",\n    title: \"国际组织与多边开发银行发表联合声明\",\n    description:\n      \"九个国际组织和五家多边开发银行发表了有关合作的联合声明。\"\n  },\n\n  /* =====================================\n     2026年9月7日\n  ===================================== */\n\n  {\n    date: \"2026.09.07\",\n    type: \"civic\",\n    label: \"市民推进委员会\",\n    title: \"高阳特例市市民推进委员会正式成立\",\n    description:\n      \"在高阳湖水公园花卉展示馆举行成立大会，正式启动由市民主导的全球人工智能枢纽引进活动。\"\n  },\n\n  /* =====================================\n     2026年10月12日\n  ===================================== */\n\n  {\n    date: \"2026.10.12\",\n    type: \"gyeonggi\",\n    label: \"京畿道\",\n    title: \"京畿道全球人工智能枢纽引进支持工作组成立\",\n    description:\n      \"京畿道成立专门工作组，支持制定引进战略并促进机构间合作。\"\n  },\n\n  /* =====================================\n     2026年10月14日\n  ===================================== */\n\n  {\n    date: \"2026.10.14\",\n    type: \"government\",\n    label: \"韩国中央政府\",\n    title: \"举行全球人工智能枢纽选址评价标准公众听证会\",\n    description:\n      \"在世宗会议中心介绍并讨论全球人工智能枢纽选址评价标准草案。\"\n  },\n\n  /* =====================================\n     2026年10月15日\n  ===================================== */\n\n  {\n    date: \"2026.10.15\",\n    type: \"civic\",\n    label: \"市民推进委员会\",\n    title: \"提出选址评价标准改进建议\",\n    description:\n      \"围绕国际组织初期入驻条件、当地社区接受度以及公共利益人工智能试点项目等事项提出改进建议。\"\n  },\n\n  /* =====================================\n     2026年10月20日\n  ===================================== */\n\n  {\n    date: \"2026.10.20\",\n    type: \"civic\",\n    label: \"市民推进委员会\",\n    title: \"参加第七届高阳创新战略研讨会\",\n    description:\n      \"与会者强调，应完善引进战略、争取机构合作、建立实施体系，并确保相关建议具有充分的支持性证据。\"\n  },\n\n  /* =====================================\n     2026年10月26日\n  ===================================== */\n\n  {\n    date: \"2026.10.26\",\n    type: \"goyang\",\n    label: \"高阳特例市\",\n    title: \"高阳特例市议会通过支持引进全球人工智能枢纽的决议\",\n    description:\n      \"高阳特例市议会在全体议员参与下，一致通过呼吁引进全球人工智能枢纽的决议。\"\n  },\n\n  /* =====================================\n     2026年10月30日\n  ===================================== */\n\n  {\n    date: \"2026.10.30\",\n    type: \"gyeonggi\",\n    label: \"京畿道\",\n    title: \"举行京畿道全球人工智能枢纽引进战略论坛\",\n    description:\n      \"在高阳特例市韩国国际展览中心（KINTEX）举行论坛，讨论引进战略及国际合作事宜。\"\n  }\n\n];\n\n/* =====================================\n   当前筛选类别\n===================================== */\n\nlet currentType = \"all\";\n\n/* =====================================\n   时间轴渲染函数\n===================================== */\n\nfunction renderTimeline() {\n\n  const timeline =\n    document.getElementById(\"timeline\");\n\n  timeline.innerHTML = \"\";\n\n  const filtered = events\n\n    .filter(event =>\n      currentType === \"all\" ||\n      event.type === currentType\n    )\n\n    .sort((a, b) =>\n      a.date.localeCompare(b.date)\n    );\n\n  filtered.forEach(event => {\n\n    const item =\n      document.createElement(\"article\");\n\n    item.className = \"event\";\n\n    const date =\n      document.createElement(\"div\");\n\n    date.className = \"date\";\n    date.textContent = event.date;\n\n    const type =\n      document.createElement(\"span\");\n\n    type.className = \"type\";\n    type.textContent = event.label;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent = event.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      event.description;\n\n    item.appendChild(date);\n    item.appendChild(type);\n    item.appendChild(title);\n    item.appendChild(description);\n\n    timeline.appendChild(item);\n\n  });\n\n}\n\n/* =====================================\n   筛选按钮事件\n===================================== */\n\ndocument\n  .querySelectorAll(\"[data-type]\")\n  .forEach(button => {\n\n    button.addEventListener(\n      \"click\",\n      () => {\n\n        currentType =\n          button.dataset.type;\n\n        document\n          .querySelectorAll(\"[data-type]\")\n          .forEach(btn => {\n\n            const isActive =\n              btn.dataset.type === currentType;\n\n            btn.classList.toggle(\n              \"active\",\n              isActive\n            );\n\n            btn.setAttribute(\n              \"aria-pressed\",\n              String(isActive)\n            );\n\n          });\n\n        renderTimeline();\n\n      }\n    );\n\n  });\n\n/* =====================================\n   初始显示全部事件\n===================================== */\n\nrenderTimeline();\n\n\u003c/script>\n\n</body>\n</html>\n"
}
</script>
<script>
(() => {
  const data = document.getElementById("page-variants");
  const pages = JSON.parse(data.textContent);
  const params = new URLSearchParams(window.location.search);
  const keys = ["view", "lang"].map(key => key + "=" + params.get(key));
  const selected = keys.find(key => Object.hasOwn(pages, key)) || "default";
  const page = pages[selected];
  const opening = /^\s*<!doctype html>\s*(<html\b[^>]*>)\s*<head\b[^>]*>/i.exec(page);

  // Keep the original URL and let the initial HTML parser run the page scripts.
  const root = new DOMParser().parseFromString(opening[1], "text/html").documentElement;
  for (const attribute of root.attributes) {
    document.documentElement.setAttribute(attribute.name, attribute.value);
  }
  data.remove();
  document.write(page.slice(opening[0].length));
})();
</script>
