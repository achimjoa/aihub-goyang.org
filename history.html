tle = document.createElement(\"h3\");\n    title.textContent = event.title;\n\n    const description = document.createElement(\"p\");\n    description.textContent = event.description;\n\n    item.appendChild(date);\n    item.appendChild(type);\n    item.appendChild(title);\n    item.appendChild(description);\n\n    timeline.appendChild(item);\n  });\n}\n\ndocument.querySelectorAll(\"[data-type]\").forEach(button => {\n\n  button.addEventListener(\"click\", () => {\n\n    currentType = button.dataset.type;\n\n    document.querySelectorAll(\"[data-type]\")\n      .forEach(btn => btn.classList.remove(\"active\"));\n\n    button.classList.add(\"active\");\n\n    renderTimeline();\n  });\n});\n\nrenderTimeline();\n\n\u003c/script>\n\n</body>\n</html>\n",

ius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   INTRO\n===================================== */\n\n.intro {\n  text-align: center;\n}\n\n/* =====================================\n   FILTER BUTTONS\n===================================== */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  background: white;\n  border: 1px solid #0754a6;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n  font-family: inherit;\n  font-size: 15px;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n.filters button:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   RTL TIMELINE\n===================================== */\n\n.timeline {\n  border-right: 4px solid #168de0;\n  border-left: none;\n  margin-right: 12px;\n  margin-left: 0;\n  padding-right: 25px;\n  padding-left: 0;\n}\n\n.event {\n  position: relative;\n  padding: 0 0 25px;\n}\n\n.event::before {\n  content: \"\";\n  position: absolute;\n  right: -34px;\n  left: auto;\n  top: 8px;\n  width: 14px;\n  height: 14px;\n  background: #168de0;\n  border-radius: 50%;\n}\n\n.date {\n  color: #0754a6;\n  font-weight: bold;\n  font-size: 17px;\n  direction: ltr;\n  unicode-bidi: isolate;\n  text-align: right;\n}\n\n.type {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 3px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  margin: 8px 0;\n}\n\n.event h3 {\n  margin: 5px 0;\n  color: #17315b;\n}\n\n.event p {\n  margin: 5px 0;\n  color: #46566d;\n}\n\n/* =====================================\n   FUTURE PRIORITIES\n===================================== */\n\n.future {\n  border-right: 4px solid #1b9a80;\n  border-left: none;\n  padding-right: 20px;\n  padding-left: 0;\n  margin-top: 20px;\n}\n\n/* =====================================\n   NOTICE\n===================================== */\n\n.note {\n  background: #fff8e8;\n  padding: 20px;\n  border-radius: 8px;\n  margin-top: 25px;\n}\n\n/* =====================================\n   BUTTON\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 0 0 10px;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   FOOTER\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 20px;\n  }\n\n  .filters button {\n    flex: 1 1 auto;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-left: 0;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header>\n\n<h1>\nمبادرة المركز العالمي للذكاء الاصطناعي<br>\nالتسلسل الزمني وأبرز المحطات\n</h1>\n\n<p>\nالحكومة الوطنية · مقاطعة غيونغي<br>\nمدينة غويانغ الخاصة · اللجنة المدنية الداعمة\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ar\"\n  class=\"home-link\"\n>\n→ الصفحة الرئيسية العربية\n</a>\n\n<a\n  href=\"history.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     INTRODUCTION\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nالمسيرة نحو المركز العالمي للذكاء الاصطناعي\n</h2>\n\n<p>\nيعرض هذا التسلسل الزمني\nأبرز التطورات المتعلقة\nبمبادرة المركز العالمي\nللذكاء الاصطناعي\nفي جمهورية كوريا،\nإلى جانب الأنشطة\nالتي نُفذت دعماً\nلاستقطاب المركز المقترح\nإلى مدينة غويانغ الخاصة.\n</p>\n\n<p>\nتُعد مشاركة المواطنين،\nوالإعداد للسياسات،\nوالتعاون المؤسسي\nأسساً مهمة\nللتعاون الدولي المستقبلي.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     FILTERS\n===================================== -->\n\n<nav\n  class=\"filters\"\n  aria-label=\"تصفية التسلسل الزمني حسب الجهة\"\n>\n\n<button\n  type=\"button\"\n  class=\"active\"\n  data-type=\"all\"\n  aria-pressed=\"true\"\n>\nجميع الأحداث\n</button>\n\n<button\n  type=\"button\"\n  data-type=\"government\"\n  aria-pressed=\"false\"\n>\nالحكومة الوطنية\n</button>\n\n<button\n  type=\"button\"\n  data-type=\"gyeonggi\"\n  aria-pressed=\"false\"\n>\nمقاطعة غيونغي\n</button>\n\n<button\n  type=\"button\"\n  data-type=\"goyang\"\n  aria-pressed=\"false\"\n>\nمدينة غويانغ الخاصة\n</button>\n\n<button\n  type=\"button\"\n  data-type=\"civic\"\n  aria-pressed=\"false\"\n>\nاللجنة المدنية الداعمة\n</button>\n\n</nav>\n\n\u003c!-- =====================================\n     TIMELINE\n===================================== -->\n\n<section>\n\n<h2>\nأبرز المحطات\n</h2>\n\n<div\n  class=\"timeline\"\n  id=\"timeline\"\n  aria-live=\"polite\"\n>\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     FUTURE PRIORITIES\n===================================== -->\n\n<section>\n\n<h2>\nالأولويات المستقبلية\n</h2>\n\n\u003c!-- PRIORITY 1 -->\n\n<div class=\"future\">\n\n<h3>\nالاستعداد لتقييم اختيار الموقع\n</h3>\n\n<p>\nمراجعة الإعلانات الحكومية الرسمية\nومعايير التقييم،\nوتقديم المزايا التنافسية\nلمدينة غويانغ\nوخطط التنفيذ\nباستخدام أدلة موضوعية داعمة.\n</p>\n\n</div>\n\n\u003c!-- PRIORITY 2 -->\n\n<div class=\"future\">\n\n<h3>\nالاستعداد للتأسيس الأولي\nللمنظمات الدولية\n</h3>\n\n<p>\nتطوير مقترحات عملية\nللمرافق المكتبية،\nوالظروف السكنية،\nوالرعاية الصحية،\nوالتعليم،\nوالنقل،\nوغيرها من الخدمات\nالتي قد تحتاج إليها\nالمؤسسات المشاركة.\n</p>\n\n</div>\n\n\u003c!-- PRIORITY 3 -->\n\n<div class=\"future\">\n\n<h3>\nالاستعداد للمشاريع التجريبية\nللذكاء الاصطناعي لخدمة المصلحة العامة\n</h3>\n\n<p>\nدراسة جدوى مشاريع التعاون المحتملة\nفي الرعاية الصحية الأساسية\nالمدعومة بالذكاء الاصطناعي،\nوالاستجابة للأزمات المعقدة.\n</p>\n\n<p>\nتحديد المؤسسات الشريكة المحتملة\nوتقييم متطلبات التنفيذ.\n</p>\n\n</div>\n\n\u003c!-- IMPORTANT NOTICE -->\n\n<div class=\"note\">\n\n<strong>\nإشعار مهم\n</strong>\n\n<p>\nقد تتغير الجداول الزمنية المستقبلية\nوفقاً للإعلانات الحكومية الرسمية\nوالقرارات المؤسسية.\n</p>\n\n<p>\nتلخص هذه الصفحة\nأبرز التطورات والأنشطة.\nولا يعني ذلك\nأن جميع الخطط المستقبلية\nأو الترتيبات المؤسسية\nقد تم تأكيدها رسمياً.\n</p>\n\n</div>\n\n<a\n  href=\"strategy.html?lang=ar\"\n  class=\"button\"\n>\nاستراتيجية استقطاب المركز العالمي للذكاء الاصطناعي\n</a>\n\n<a\n  href=\"committee.html?lang=ar\"\n  class=\"button\"\n>\nحول اللجنة المدنية الداعمة\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n\n<strong>\nاللجنة المدنية لدعم استقطاب<br>\nالمركز العالمي للذكاء الاصطناعي<br>\nإلى مدينة غويانغ الخاصة\n</strong>\n\n</p>\n\n<p>\nمع المواطنين،\nومع مقاطعة غيونغي،\nومع العالم.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ar\">\nالصفحة الرئيسية العربية\n</a>\n\n&nbsp; | &nbsp;\n\n<a\n  href=\"history.html\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     JAVASCRIPT TIMELINE\n===================================== -->\n\n\u003cscript>\n\nconst events = [\n\n  /* =====================================\n     NATIONAL GOVERNMENT\n  ===================================== */\n\n  {\n    date: \"2026.03.10\",\n    type: \"government\",\n    label: \"الحكومة الوطنية\",\n    title:\n      \"إعلان حكومي بشأن مبادرة المركز العالمي للذكاء الاصطناعي\",\n    description:\n      \"اكتسبت المناقشات والتحضيرات على المستوى الحكومي المتعلقة بمبادرة المركز العالمي للذكاء الاصطناعي زخماً متزايداً.\"\n  },\n\n  {\n    date: \"2026.03.16\",\n    type: \"government\",\n    label: \"الحكومة الوطنية\",\n    title:\n      \"اجتماع بين رئيس الوزراء وممثلي الأمم المتحدة\",\n    description:\n      \"جرت مناقشات بشأن التعاون الدولي المتعلق بمبادرة المركز العالمي للذكاء الاصطناعي.\"\n  },\n\n  {\n    date: \"2026.03.17\",\n    type: \"government\",\n    label: \"الحكومة الوطنية\",\n    title:\n      \"خطابات نوايا بين الحكومة والمنظمات الدولية\",\n    description:\n      \"بُذلت جهود لإبرام خطابات نوايا بشأن التعاون في مبادرة المركز العالمي للذكاء الاصطناعي.\"\n  },\n\n  {\n    date: \"2026.04.09\",\n    type: \"government\",\n    label: \"الحكومة الوطنية\",\n    title:\n      \"توجيه من رئيس الوزراء بشأن مبادرة المركز العالمي للذكاء الاصطناعي\",\n    description:\n      \"تم إنشاء إطار مؤسسي للتعاون بين الجهات الحكومية بشأن مبادرة المركز العالمي للذكاء الاصطناعي.\"\n  },\n\n  {\n    date: \"2026.05.21\",\n    type: \"government\",\n    label: \"الحكومة الوطنية\",\n    title:\n      \"بيان مشترك صادر عن المنظمات الدولية وبنوك التنمية متعددة الأطراف\",\n    description:\n      \"أُعلن بيان مشترك بشأن التعاون من جانب تسع منظمات دولية وخمسة بنوك تنمية متعددة الأطراف.\"\n  },\n\n  /* =====================================\n     CITIZENS' COMMITTEE\n  ===================================== */\n\n  {\n    date: \"2026.09.07\",\n    type: \"civic\",\n    label: \"اللجنة المدنية الداعمة\",\n    title:\n      \"تدشين اللجنة المدنية الداعمة\",\n    description:\n      \"أُطلقت الحملة المدنية لاستقطاب المركز العالمي للذكاء الاصطناعي في مركز معارض الزهور بحديقة بحيرة غويانغ.\"\n  },\n\n  /* =====================================\n     GYEONGGI PROVINCE\n  ===================================== */\n\n  {\n    date: \"2026.10.12\",\n    type: \"gyeonggi\",\n    label: \"مقاطعة غيونغي\",\n    title:\n      \"إطلاق فريق عمل مقاطعة غيونغي لدعم استقطاب المركز العالمي للذكاء الاصطناعي\",\n    description:\n      \"أُطلق فريق عمل على مستوى المقاطعة لدعم تطوير استراتيجية الاستقطاب والتعاون المؤسسي.\"\n  },\n\n  /* =====================================\n     NATIONAL GOVERNMENT\n  ===================================== */\n\n  {\n    date: \"2026.10.14\",\n    type: \"government\",\n    label: \"الحكومة الوطنية\",\n    title:\n      \"جلسة استماع عامة بشأن معايير تقييم اختيار الموقع\",\n    description:\n      \"تم عرض ومناقشة مسودة معايير تقييم اختيار موقع المركز العالمي للذكاء الاصطناعي في مركز سيجونغ للمؤتمرات.\"\n  },\n\n  /* =====================================\n     CITIZENS' COMMITTEE\n  ===================================== */\n\n  {\n    date: \"2026.10.15\",\n    type: \"civic\",\n    label: \"اللجنة المدنية الداعمة\",\n    title:\n      \"توصيات لتحسين معايير تقييم اختيار الموقع\",\n    description:\n      \"أُعدت توصيات تتعلق بشروط التأسيس الأولي، وتقبّل المجتمع المحلي، والمشاريع التجريبية للذكاء الاصطناعي لخدمة المصلحة العامة.\"\n  },\n\n  {\n    date: \"2026.10.20\",\n    type: \"civic\",\n    label: \"اللجنة المدنية الداعمة\",\n    title:\n      \"المشاركة في الندوة السابعة لاستراتيجية الابتكار في غويانغ\",\n    description:\n      \"أكد المشاركون أهمية استكمال استراتيجية الاستقطاب، وطلب التعاون المؤسسي، وإنشاء هيكل للتنفيذ، وتأمين الأدلة الداعمة.\"\n  },\n\n  /* =====================================\n     GOYANG SPECIAL CITY\n  ===================================== */\n\n  {\n    date: \"2026.10.26\",\n    type: \"goyang\",\n    label: \"مدينة غويانغ الخاصة\",\n    title:\n      \"قرار مجلس مدينة غويانغ الخاصة لدعم استقطاب المركز العالمي للذكاء الاصطناعي\",\n    description:\n      \"اعتمد مجلس المدينة بالإجماع قراراً يدعو إلى استقطاب المركز العالمي للذكاء الاصطناعي، بمشاركة جميع أعضاء المجلس.\"\n  },\n\n  /* =====================================\n     GYEONGGI PROVINCE\n  ===================================== */\n\n  {\n    date: \"2026.10.30\",\n    type: \"gyeonggi\",\n    label: \"مقاطعة غيونغي\",\n    title:\n      \"منتدى مقاطعة غيونغي لاستراتيجية استقطاب المركز العالمي للذكاء الاصطناعي\",\n    description:\n      \"عُقد منتدى في مركز كينتكس بمدينة غويانغ الخاصة لمناقشة استراتيجيات الاستقطاب والتعاون الدولي.\"\n  }\n\n];\n\n/* =====================================\n   FILTER STATE\n===================================== */\n\nlet currentType = \"all\";\n\n/* =====================================\n   RENDER TIMELINE\n===================================== */\n\nfunction renderTimeline() {\n\n  const timeline =\n    document.getElementById(\"timeline\");\n\n  timeline.innerHTML = \"\";\n\n  const filtered = events\n    .filter(event =>\n      currentType === \"all\" ||\n      event.type === currentType\n    )\n    .sort((a, b) =>\n      a.date.localeCompare(b.date)\n    );\n\n  filtered.forEach(event => {\n\n    const item =\n      document.createElement(\"article\");\n\n    item.className = \"event\";\n\n    const date =\n      document.createElement(\"div\");\n\n    date.className = \"date\";\n    date.textContent = event.date;\n\n    const type =\n      document.createElement(\"span\");\n\n    type.className = \"type\";\n    type.textContent = event.label;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent = event.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      event.description;\n\n    item.appendChild(date);\n    item.appendChild(type);\n    item.appendChild(title);\n    item.appendChild(description);\n\n    timeline.appendChild(item);\n\n  });\n\n}\n\n/* =====================================\n   FILTER BUTTON EVENTS\n===================================== */\n\ndocument\n  .querySelectorAll(\"[data-type]\")\n  .forEach(button => {\n\n    button.addEventListener(\"click\", () => {\n\n      currentType = button.dataset.type;\n\n      document\n        .querySelectorAll(\"[data-type]\")\n        .forEach(btn => {\n\n          const isActive =\n            btn.dataset.type === currentType;\n\n          btn.classList.toggle(\n            \"active\",\n            isActive\n          );\n\n          btn.setAttribute(\n            \"aria-pressed\",\n            String(isActive)\n          );\n\n        });\n\n      renderTimeline();\n\n    });\n\n  });\n\n/* =====================================\n   INITIAL RENDER\n===================================== */\n\nrenderTimeline();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=de": "<!DOCTYPE html>\n<html lang=\"de\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nGlobales KI-Zentrum | Chronologie und Meilensteine\n</title>\n\n<meta name=\"description\"\ncontent=\"Entdecken Sie die Chronologie der Initiative für ein globales KI-Zentrum in der Republik Korea sowie wichtige Aktivitäten der Zentralregierung, der Provinz Gyeonggi, der Sonderstadt Goyang und des Bürgerkomitees.\">\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  padding: 10px 20px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 30px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.intro {\n  text-align: center;\n}\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  background: white;\n  border: 1px solid #0754a6;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n.filters button:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n.timeline {\n  border-left: 4px solid #168de0;\n  margin-left: 12px;\n  padding-left: 25px;\n}\n\n.event {\n  position: relative;\n  padding: 0 0 25px;\n}\n\n.event::before {\n  content: \"\";\n  position: absolute;\n  left: -34px;\n  top: 8px;\n  width: 14px;\n  height: 14px;\n  background: #168de0;\n  border-radius: 50%;\n}\n\n.date {\n  color: #0754a6;\n  font-weight: bold;\n  font-size: 17px;\n}\n\n.type {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 3px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  margin: 8px 0;\n}\n\n.event h3 {\n  margin: 5px 0;\n  color: #17315b;\n}\n\n.event p {\n  margin: 5px 0;\n  color: #46566d;\n}\n\n.future {\n  border-left: 4px solid #1b9a80;\n  padding-left: 20px;\n  margin-top: 20px;\n}\n\n.note {\n  background: #fff8e8;\n  padding: 20px;\n  border-radius: 8px;\n  margin-top: 25px;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n}\n</style>\n</head>\n\n<body>\n\n<header>\n  <h1>\n    Initiative für ein globales KI-Zentrum<br>\n    Chronologie und Meilensteine\n  </h1>\n\n  <p>\n    Zentralregierung · Provinz Gyeonggi<br>\n    Sonderstadt Goyang · Bürgerkomitee\n  </p>\n\n  <div class=\"header-links\">\n    <a href=\"index.html?lang=de\" class=\"home-link\">\n      ← Deutsche Startseite\n    </a>\n  </div>\n</header>\n\n<main>\n\n\u003c!-- EINFÜHRUNG -->\n\n<section class=\"intro\">\n  <h2>\n    Der Weg zum globalen KI-Zentrum\n  </h2>\n\n  <p>\n    Diese Chronologie stellt\n    wichtige Entwicklungen\n    im Zusammenhang mit der Initiative\n    für ein globales KI-Zentrum\n    in der Republik Korea dar.\n  </p>\n\n  <p>\n    Sie umfasst außerdem Aktivitäten,\n    die zur Unterstützung\n    der geplanten Ansiedlung\n    des globalen KI-Zentrums\n    in der Sonderstadt Goyang\n    durchgeführt wurden.\n  </p>\n\n  <p>\n    Bürgerbeteiligung,\n    politische Vorbereitung\n    und institutionelle Zusammenarbeit\n    bilden wichtige Grundlagen\n    für die zukünftige\n    internationale Zusammenarbeit.\n  </p>\n</section>\n\n\u003c!-- FILTER -->\n\n<nav class=\"filters\"\n     aria-label=\"Chronologie nach Organisation filtern\">\n\n  <button\n    type=\"button\"\n    class=\"active\"\n    data-type=\"all\"\n    aria-pressed=\"true\">\n    Alle Ereignisse\n  </button>\n\n  <button\n    type=\"button\"\n    data-type=\"government\"\n    aria-pressed=\"false\">\n    Zentralregierung\n  </button>\n\n  <button\n    type=\"button\"\n    data-type=\"gyeonggi\"\n    aria-pressed=\"false\">\n    Provinz Gyeonggi\n  </button>\n\n  <button\n    type=\"button\"\n    data-type=\"goyang\"\n    aria-pressed=\"false\">\n    Sonderstadt Goyang\n  </button>\n\n  <button\n    type=\"button\"\n    data-type=\"civic\"\n    aria-pressed=\"false\">\n    Bürgerkomitee\n  </button>\n\n</nav>\n\n\u003c!-- CHRONOLOGIE -->\n\n<section>\n  <h2>Wichtige Meilensteine</h2>\n\n  <div\n    class=\"timeline\"\n    id=\"timeline\"\n    aria-live=\"polite\">\n  </div>\n\n</section>\n\n\u003c!-- ZUKÜNFTIGE PRIORITÄTEN -->\n\n<section>\n\n  <h2>\n    Zukünftige Prioritäten\n  </h2>\n\n  <div class=\"future\">\n    <h3>\n      Vorbereitung auf die Bewertung\n      zur Standortauswahl\n    </h3>\n\n    <p>\n      Prüfung offizieller Regierungsankündigungen\n      und Bewertungskriterien\n      sowie Darstellung\n      der Wettbewerbsfähigkeit Goyangs\n      und seiner Umsetzungspläne\n      anhand objektiver Nachweise.\n    </p>\n  </div>\n\n  <div class=\"future\">\n    <h3>\n      Vorbereitung der ersten Ansiedlung\n      internationaler Organisationen\n    </h3>\n\n    <p>\n      Entwicklung praktischer Vorschläge\n      für Büroräume,\n      Wohnbedingungen,\n      Gesundheitsversorgung,\n      Bildung,\n      Verkehrsanbindungen\n      und weitere Dienstleistungen,\n      die von teilnehmenden Institutionen\n      benötigt werden könnten.\n    </p>\n  </div>\n\n  <div class=\"future\">\n    <h3>\n      Vorbereitung gemeinwohlorientierter\n      KI-Pilotprojekte\n    </h3>\n\n    <p>\n      Untersuchung der Machbarkeit\n      möglicher Kooperationsprojekte\n      im Bereich KI-gestützter\n      medizinischer Grundversorgung\n      und bei der Bewältigung\n      komplexer Krisen.\n    </p>\n\n    <p>\n      Identifizierung potenzieller\n      Partnerinstitutionen\n      und Bewertung\n      der Voraussetzungen\n      für eine praktische Umsetzung.\n    </p>\n  </div>\n\n  <div class=\"note\">\n    <strong>Wichtiger Hinweis</strong>\n\n    <p>\n      Zukünftige Zeitpläne\n      können sich aufgrund\n      offizieller Regierungsankündigungen\n      und institutioneller Entscheidungen ändern.\n    </p>\n\n    <p>\n      Diese Seite fasst\n      wichtige Entwicklungen\n      und Aktivitäten zusammen.\n    </p>\n\n    <p>\n      Sie bedeutet nicht,\n      dass sämtliche zukünftigen Pläne\n      oder institutionellen Vereinbarungen\n      bereits offiziell bestätigt wurden.\n    </p>\n  </div>\n\n  <a href=\"strategy.html?lang=de\" class=\"button\">\n    Strategie zur Ansiedlung des globalen KI-Zentrums\n  </a>\n\n  <a href=\"committee.html?lang=de\" class=\"button\">\n    Über das Bürgerkomitee\n  </a>\n\n</section>\n\n</main>\n\n<footer>\n\n  <p>\n    <strong>\n      Bürgerkomitee zur Förderung<br>\n      der Ansiedlung eines globalen KI-Zentrums<br>\n      in der Sonderstadt Goyang\n    </strong>\n  </p>\n\n  <p>\n    Mit den Bürgerinnen und Bürgern,<br>\n    mit der Provinz Gyeonggi<br>\n    und mit der Welt.\n  </p>\n\n  <p>\n    <a href=\"index.html?lang=de\">\n      Deutsche Startseite\n    </a>\n  </p>\n\n</footer>\n\n\u003cscript>\n\n/*\n  CHRONOLOGIE DER GLOBALEN KI-ZENTRUM-INITIATIVE\n\n  Alle Ereignisse wurden aus der\n  englischen Originalversion übernommen\n  und ins Deutsche übersetzt.\n\n  Die Filterfunktionen bleiben erhalten.\n*/\n\nconst events = [\n\n  {\n    date: \"2026.03.10\",\n    type: \"government\",\n    label: \"Zentralregierung\",\n    title:\n      \"Regierungsankündigung zur Initiative für ein globales KI-Zentrum\",\n    description:\n      \"Die Diskussionen und Vorbereitungen auf Regierungsebene zur Initiative für ein globales KI-Zentrum gewannen an Dynamik.\"\n  },\n\n  {\n    date: \"2026.03.16\",\n    type: \"government\",\n    label: \"Zentralregierung\",\n    title:\n      \"Treffen zwischen dem Premierminister und Vertretern der Vereinten Nationen\",\n    description:\n      \"Es fanden Gespräche über die internationale Zusammenarbeit im Zusammenhang mit der Initiative für ein globales KI-Zentrum statt.\"\n  },\n\n  {\n    date: \"2026.03.17\",\n    type: \"government\",\n    label: \"Zentralregierung\",\n    title:\n      \"Absichtserklärungen zwischen der Regierung und internationalen Organisationen\",\n    description:\n      \"Es wurden Bemühungen unternommen, Absichtserklärungen über die Zusammenarbeit im Rahmen der Initiative für ein globales KI-Zentrum abzuschließen.\"\n  },\n\n  {\n    date: \"2026.04.09\",\n    type: \"government\",\n    label: \"Zentralregierung\",\n    title:\n      \"Anweisung des Premierministers zur Initiative für ein globales KI-Zentrum\",\n    description:\n      \"Ein institutioneller Rahmen für die Zusammenarbeit zwischen Regierungsstellen im Zusammenhang mit der Initiative für ein globales KI-Zentrum wurde geschaffen.\"\n  },\n\n  {\n    date: \"2026.05.21\",\n    type: \"government\",\n    label: \"Zentralregierung\",\n    title:\n      \"Gemeinsame Erklärung internationaler Organisationen und multilateraler Entwicklungsbanken\",\n    description:\n      \"Neun internationale Organisationen und fünf multilaterale Entwicklungsbanken veröffentlichten eine gemeinsame Erklärung zur Zusammenarbeit.\"\n  },\n\n  {\n    date: \"2026.09.07\",\n    type: \"civic\",\n    label: \"Bürgerkomitee\",\n    title:\n      \"Gründungsfeier des Bürgerkomitees\",\n    description:\n      \"Die von Bürgerinnen und Bürgern getragene Initiative zur Ansiedlung des globalen KI-Zentrums wurde im Blumenausstellungszentrum am Goyang-Seepark offiziell ins Leben gerufen.\"\n  },\n\n  {\n    date: \"2026.10.12\",\n    type: \"gyeonggi\",\n    label: \"Provinz Gyeonggi\",\n    title:\n      \"Einrichtung einer Taskforce der Provinz Gyeonggi zur Unterstützung der Ansiedlung des globalen KI-Zentrums\",\n    description:\n      \"Eine Taskforce auf Provinzebene wurde eingerichtet, um die Entwicklung der Ansiedlungsstrategie und die institutionelle Zusammenarbeit zu unterstützen.\"\n  },\n\n  {\n    date: \"2026.10.14\",\n    type: \"government\",\n    label: \"Zentralregierung\",\n    title:\n      \"Öffentliche Anhörung zu den Bewertungskriterien für die Standortauswahl\",\n    description:\n      \"Im Sejong Convention Center wurde ein Entwurf der Bewertungskriterien für die Standortauswahl des globalen KI-Zentrums vorgestellt und diskutiert.\"\n  },\n\n  {\n    date: \"2026.10.15\",\n    type: \"civic\",\n    label: \"Bürgerkomitee\",\n    title:\n      \"Empfehlungen zur Verbesserung der Bewertungskriterien für die Standortauswahl\",\n    description:\n      \"Es wurden Empfehlungen zu den Bedingungen für die anfängliche Ansiedlung, zur Akzeptanz in der Bevölkerung und zu gemeinwohlorientierten KI-Pilotprojekten ausgearbeitet.\"\n  },\n\n  {\n    date: \"2026.10.20\",\n    type: \"civic\",\n    label: \"Bürgerkomitee\",\n    title:\n      \"Teilnahme am 7. Seminar zur Innovationsstrategie Goyangs\",\n    description:\n      \"Die Teilnehmer betonten die Bedeutung der Fertigstellung einer Ansiedlungsstrategie, der institutionellen Zusammenarbeit, des Aufbaus einer Umsetzungsstruktur und der Sicherung objektiver Nachweise.\"\n  },\n\n  {\n    date: \"2026.10.26\",\n    type: \"goyang\",\n    label: \"Sonderstadt Goyang\",\n    title:\n      \"Resolution des Stadtrats von Goyang zur Unterstützung der Ansiedlung des globalen KI-Zentrums\",\n    description:\n      \"Der Stadtrat verabschiedete unter Beteiligung sämtlicher Ratsmitglieder einstimmig eine Resolution zur Förderung der Ansiedlung des globalen KI-Zentrums.\"\n  },\n\n  {\n    date: \"2026.10.30\",\n    type: \"gyeonggi\",\n    label: \"Provinz Gyeonggi\",\n    title:\n      \"Strategieforum der Provinz Gyeonggi zur Ansiedlung des globalen KI-Zentrums\",\n    description:\n      \"Im KINTEX in der Sonderstadt Goyang fand ein Forum statt, bei dem Ansiedlungsstrategien und Möglichkeiten der internationalen Zusammenarbeit diskutiert wurden.\"\n  }\n\n];\n\n/*\n  AKTUELL AUSGEWÄHLTER FILTER\n*/\n\nlet currentType = \"all\";\n\n/*\n  CHRONOLOGIE ANZEIGEN\n*/\n\nfunction renderTimeline() {\n\n  const timeline =\n    document.getElementById(\"timeline\");\n\n  timeline.innerHTML = \"\";\n\n  const filtered = events\n    .filter(event =>\n      currentType === \"all\" ||\n      event.type === currentType\n    )\n    .sort((a, b) =>\n      a.date.localeCompare(b.date)\n    );\n\n  filtered.forEach(event => {\n\n    const item =\n      document.createElement(\"article\");\n\n    item.className = \"event\";\n\n    const date =\n      document.createElement(\"div\");\n\n    date.className = \"date\";\n    date.textContent = event.date;\n\n    const type =\n      document.createElement(\"span\");\n\n    type.className = \"type\";\n    type.textContent = event.label;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent = event.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      event.description;\n\n    item.appendChild(date);\n    item.appendChild(type);\n    item.appendChild(title);\n    item.appendChild(description);\n\n    timeline.appendChild(item);\n\n  });\n\n}\n\n/*\n  FILTER-SCHALTFLÄCHEN\n*/\n\ndocument\n  .querySelectorAll(\"[data-type]\")\n  .forEach(button => {\n\n    button.addEventListener(\"click\", () => {\n\n      currentType = button.dataset.type;\n\n      document\n        .querySelectorAll(\"[data-type]\")\n        .forEach(btn => {\n\n          const isActive =\n            btn.dataset.type === currentType;\n\n          btn.classList.toggle(\n            \"active\",\n            isActive\n          );\n\n          btn.setAttribute(\n            \"aria-pressed\",\n            String(isActive)\n          );\n\n        });\n\n      renderTimeline();\n\n    });\n\n  });\n\n/*\n  ERSTE ANZEIGE\n*/\n\nrenderTimeline();\n\n\u003c/script>\n\n</body>\n</html>\n",

ovince<br>\n    Goyang Special City · Citizens' Promotion Committee\n  </p>\n\n  <div class=\"header-links\">\n    <a href=\"index.html?lang=en\" class=\"home-link\">\n      ← English Home\n    </a>\n\n    <a href=\"history.html\" class=\"home-link\" lang=\"ko\">\n      한국어\n    </a>\n  </div>\n</header>\n\n<main>\n\n<section class=\"intro\">\n  <h2>\n    The Journey Toward the Global AI Hub\n  </h2>\n\n  <p>\n    This timeline presents major developments\n    related to the Global AI Hub initiative\n    in the Republic of Korea,\n    together with activities undertaken\n    in support of attracting the proposed Hub\n    to Goyang Special City.\n  </p>\n\n  <p>\n    Citizen participation,\n    policy preparation,\n    and institutional cooperation\n    are important foundations\n    for future international collaboration.\n  </p>\n</section>\n\n\u003c!-- Filters -->\n\n<nav class=\"filters\" aria-label=\"Filter timeline by organization\">\n\n  <button\n    type=\"button\"\n    class=\"active\"\n    data-type=\"all\"\n    aria-pressed=\"true\">\n    All Events\n  </button>\n\n  <button\n    type=\"button\"\n    data-type=\"government\"\n    aria-pressed=\"false\">\n    National Government\n  </button>\n\n  <button\n    type=\"button\"\n    data-type=\"gyeonggi\"\n    aria-pressed=\"false\">\n    Gyeonggi Province\n  </button>\n\n  <button\n    type=\"button\"\n    data-type=\"goyang\"\n    aria-pressed=\"false\">\n    Goyang Special City\n  </button>\n\n  <button\n    type=\"button\"\n    data-type=\"civic\"\n    aria-pressed=\"false\">\n    Citizens' Promotion Committee\n  </button>\n\n</nav>\n\n\u003c!-- Timeline -->\n\n<section>\n  <h2>Major Milestones</h2>\n\n  <div\n    class=\"timeline\"\n    id=\"timeline\"\n    aria-live=\"polite\">\n  </div>\n\n</section>\n\n\u003c!-- Future priorities -->\n\n<section>\n\n  <h2>\n    Future Priorities\n  </h2>\n\n  <div class=\"future\">\n    <h3>\n      Preparing for the Site-Selection Evaluation\n    </h3>\n\n    <p>\n      Review official government announcements\n      and evaluation criteria,\n      and present Goyang's competitiveness\n      and implementation plans\n      using objective supporting evidence.\n    </p>\n  </div>\n\n  <div class=\"future\">\n    <h3>\n      Preparing for the Initial Establishment\n      of International Organizations\n    </h3>\n\n    <p>\n      Develop practical proposals\n      for office facilities,\n      residential conditions,\n      healthcare,\n      education,\n      transportation,\n      and other services\n      that may be required\n      by participating institutions.\n    </p>\n  </div>\n\n  <div class=\"future\">\n    <h3>\n      Preparing Public-Interest AI Pilot Projects\n    </h3>\n\n    <p>\n      Examine the feasibility\n      of potential cooperation projects\n      in AI-enabled essential healthcare\n      and responses to complex crises.\n    </p>\n\n    <p>\n      Identify potential partner institutions\n      and assess the requirements\n      for implementation.\n    </p>\n  </div>\n\n  <div class=\"note\">\n    <strong>Important Notice</strong>\n\n    <p>\n      Future schedules may change\n      according to official government\n      announcements and institutional decisions.\n    </p>\n\n    <p>\n      This page summarizes major developments\n      and activities.\n      It does not imply that all future plans\n      or institutional arrangements\n      have been officially confirmed.\n    </p>\n  </div>\n\n  <a href=\"strategy.html?lang=en\" class=\"button\">\n    Global AI Hub Attraction Strategy\n  </a>\n\n  <a href=\"committee.html?lang=en\" class=\"button\">\n    About the Citizens' Promotion Committee\n  </a>\n\n</section>\n\n</main>\n\n<footer>\n\n  <p>\n    <strong>\n      Citizens' Promotion Committee<br>\n      for Attracting the Global AI Hub<br>\n      to Goyang Special City\n    </strong>\n  </p>\n\n  <p>\n    With Citizens, With Gyeonggi Province,<br>\n    and With the World.\n  </p>\n\n  <p>\n    <a href=\"index.html?lang=en\">\n      English Home\n    </a>\n    &nbsp; | &nbsp;\n    <a href=\"history.html\" lang=\"ko\">\n      한국어\n    </a>\n  </p>\n\n</footer>\n\n\u003cscript>\n\nconst events = [\n\n  {\n    date: \"2026.03.10\",\n    type: \"government\",\n    label: \"National Government\",\n    title: \"Government Announcement on the Global AI Hub Initiative\",\n    description:\n      \"Government-level discussions and preparations concerning the Global AI Hub initiative gained momentum.\"\n  },\n\n  {\n    date: \"2026.03.16\",\n    type: \"government\",\n    label: \"National Government\",\n    title: \"Meeting Between the Prime Minister and UN Representatives\",\n    description:\n      \"Discussions on international cooperation related to the Global AI Hub initiative took place.\"\n  },\n\n  {\n    date: \"2026.03.17\",\n    type: \"government\",\n    label: \"National Government\",\n    title: \"Letter of Intent Between the Government and International Organizations\",\n    description:\n      \"Efforts were made to conclude letters of intent concerning cooperation on the Global AI Hub initiative.\"\n  },\n\n  {\n    date: \"2026.04.09\",\n    type: \"government\",\n    label: \"National Government\",\n    title: \"Prime Ministerial Directive on the Global AI Hub Initiative\",\n    description:\n      \"An institutional framework for intergovernmental cooperation on the Global AI Hub initiative was established.\"\n  },\n\n  {\n    date: \"2026.05.21\",\n    type: \"government\",\n    label: \"National Government\",\n    title: \"Joint Statement by International Organizations and Multilateral Development Banks\",\n    description:\n      \"A joint statement concerning cooperation was announced by nine international organizations and five multilateral development banks.\"\n  },\n\n  {\n    date: \"2026.09.07\",\n    type: \"civic\",\n    label: \"Citizens' Promotion Committee\",\n    title: \"Inauguration of the Citizens' Promotion Committee\",\n    description:\n      \"The civic-led campaign to attract the Global AI Hub was launched at the Flower Exhibition Center in Goyang Lake Park.\"\n  },\n\n  {\n    date: \"2026.10.12\",\n    type: \"gyeonggi\",\n    label: \"Gyeonggi Province\",\n    title: \"Launch of Gyeonggi Province's Global AI Hub Attraction Support Task Force\",\n    description:\n      \"A provincial task force was launched to support attraction strategy development and institutional cooperation.\"\n  },\n\n  {\n    date: \"2026.10.14\",\n    type: \"government\",\n    label: \"National Government\",\n    title: \"Public Hearing on Site-Selection Evaluation Criteria\",\n    description:\n      \"A draft of the Global AI Hub site-selection evaluation criteria was presented and discussed at the Sejong Convention Center.\"\n  },\n\n  {\n    date: \"2026.10.15\",\n    type: \"civic\",\n    label: \"Citizens' Promotion Committee\",\n    title: \"Recommendations for Improving Site-Selection Evaluation Criteria\",\n    description:\n      \"Recommendations were prepared concerning initial establishment conditions, community acceptance, and public-interest AI pilot projects.\"\n  },\n\n  {\n    date: \"2026.10.20\",\n    type: \"civic\",\n    label: \"Citizens' Promotion Committee\",\n    title: \"Participation in the 7th Goyang Innovation Strategy Seminar\",\n    description:\n      \"Participants emphasized the importance of finalizing an attraction strategy, requesting institutional cooperation, establishing an implementation structure, and securing supporting evidence.\"\n  },\n\n  {\n    date: \"2026.10.26\",\n    type: \"goyang\",\n    label: \"Goyang Special City\",\n    title: \"Goyang Special City Council Resolution Supporting the Global AI Hub\",\n    description:\n      \"The City Council unanimously adopted a resolution calling for the attraction of the Global AI Hub, with participation by all council members.\"\n  },\n\n  {\n    date: \"2026.10.30\",\n    type: \"gyeonggi\",\n    label: \"Gyeonggi Province\",\n    title: \"Gyeonggi Province Global AI Hub Attraction Strategy Forum\",\n    description:\n      \"A forum was held at KINTEX in Goyang Special City to discuss attraction strategies and international cooperation.\"\n  }\n\n];\n\nlet currentType = \"all\";\n\nfunction renderTimeline() {\n\n  const timeline = document.getElementById(\"timeline\");\n\n  timeline.innerHTML = \"\";\n\n  const filtered = events\n    .filter(event =>\n      currentType === \"all\" ||\n      event.type === currentType\n    )\n    .sort((a, b) =>\n      a.date.localeCompare(b.date)\n    );\n\n  filtered.forEach(event => {\n\n    const item = document.createElement(\"article\");\n    item.className = \"event\";\n\n    const date = document.createElement(\"div\");\n    date.className = \"date\";\n    date.textContent = event.date;\n\n    const type = document.createElement(\"span\");\n    type.className = \"type\";\n    type.textContent = event.label;\n\n    const title = document.createElement(\"h3\");\n    title.textContent = event.title;\n\n    const description = document.createElement(\"p\");\n    description.textContent = event.description;\n\n    item.appendChild(date);\n    item.appendChild(type);\n    item.appendChild(title);\n    item.appendChild(description);\n\n    timeline.appendChild(item);\n\n  });\n\n}\n\ndocument.querySelectorAll(\"[data-type]\").forEach(button => {\n\n  button.addEventListener(\"click\", () => {\n\n    currentType = button.dataset.type;\n\n    document.querySelectorAll(\"[data-type]\")\n      .forEach(btn => {\n\n        const isActive =\n          btn.dataset.type === currentType;\n\n        btn.classList.toggle(\n          \"active\",\n          isActive\n        );\n\n        btn.setAttribute(\n          \"aria-pressed\",\n          String(isActive)\n        );\n\n      });\n\n    renderTimeline();\n\n  });\n\n});\n\nrenderTimeline();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=es": "<!DOCTYPE html>\n<html lang=\"es\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\n      content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nCronología y Principales Acontecimientos |\nCentro Global de IA en Goyang\n</title>\n\n<meta name=\"description\"\ncontent=\"Cronología de la iniciativa del Centro Global de Inteligencia Artificial y las actividades del Gobierno Nacional, la Provincia de Gyeonggi, la Ciudad Especial de Goyang y el Comité Ciudadano de Promoción.\">\n\n<link rel=\"canonical\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/history.html?lang=es\">\n\n<link rel=\"alternate\" hreflang=\"es\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/history.html?lang=es\">\n\n<link rel=\"alternate\" hreflang=\"en\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/history.html?lang=en\">\n\n<link rel=\"alternate\" hreflang=\"ko\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/history.html\">\n\n<style>\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nbutton:focus-visible,\nsummary:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* ENCABEZADO */\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 30px 20px;\n}\n\nheader h1 {\n  font-size: clamp(25px, 4vw, 38px);\n  margin: 0 0 12px;\n  line-height: 1.4;\n}\n\nheader p {\n  font-size: 16px;\n  color: #e3efff;\n  margin: 5px 0;\n}\n\n/* NAVEGACIÓN */\n\n.top-navigation {\n  background: #10315e;\n  padding: 12px 18px;\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  align-items: center;\n  gap: 12px;\n}\n\n.top-navigation > a {\n  color: white;\n  text-decoration: none;\n  font-size:
