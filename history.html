#168de0;\n  margin-left: 12px;\n  padding-left: 25px;\n}\n\n.event {\n  position: relative;\n  padding: 0 0 25px;\n}\n\n.event::before {\n  content: \"\";\n  position: absolute;\n  left: -34px;\n  top: 8px;\n  width: 14px;\n  height: 14px;\n  background: #168de0;\n  border-radius: 50%;\n}\n\n.date {\n  color: #0754a6;\n  font-weight: bold;\n  font-size: 17px;\n}\n\n.type {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 3px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  margin: 8px 0;\n}\n\n.event h3 {\n  margin: 5px 0;\n  color: #17315b;\n}\n\n.event p {\n  margin: 5px 0;\n  color: #46566d;\n}\n\n/* PRIORIDADES FUTURAS */\n\n.future {\n  border-left: 4px solid #1b9a80;\n  padding-left: 20px;\n  margin-top: 20px;\n}\n\n.note {\n  background: #fff8e8;\n  padding: 20px;\n  border-radius: 8px;\n  margin-top: 25px;\n}\n\n/* BOTONES */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: #0754a6;\n}\n\n.button.secondary:hover {\n  background: #cce2ff;\n}\n\n/* PIE DE PÁGINA */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* MÓVIL */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 25px 12px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 20px;\n  }\n\n  .filters button {\n    flex: 1 1 auto;\n    font-size: 13px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n  .language-options {\n    right: auto;\n    left: 0;\n  }\n\n}\n\n</style>\n</head>\n\n<body>\n\n<header>\n\n<h1>\nIniciativa del Centro Global de IA<br>\nCronología y Principales Acontecimientos\n</h1>\n\n<p>\nGobierno Nacional · Provincia de Gyeonggi<br>\nCiudad Especial de Goyang ·\nComité Ciudadano de Promoción\n</p>\n\n</header>\n\n<nav class=\"top-navigation\"\naria-label=\"Navegación principal\">\n\n<a href=\"index.html?lang=es\">← Inicio</a>\n<a href=\"#introduccion\">Introducción</a>\n<a href=\"#acontecimientos\">Acontecimientos</a>\n<a href=\"#prioridades\">Prioridades futuras</a>\n<a href=\"committee.html?lang=es\">Comité Ciudadano</a>\n<a href=\"strategy.html?lang=es\">Estrategia</a>\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"Seleccionar idioma\">\n🌐 Idioma ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a href=\"history.html?lang=es\"\nlang=\"es\"\naria-current=\"page\">\nEspañol ✓\n</a>\n\n<a href=\"history.html?lang=en\" lang=\"en\">\nEnglish\n</a>\n\n<a href=\"history.html\" lang=\"ko\">\n한국어\n</a>\n\n</div>\n</details>\n</nav>\n\n<main>\n\n<section class=\"intro\" id=\"introduccion\">\n\n<h2>\nEl camino hacia el Centro Global de IA\n</h2>\n\n<p>\nEsta cronología presenta los principales\nacontecimientos relacionados con la iniciativa\ndel Centro Global de Inteligencia Artificial\nen la República de Corea, junto con las\nactividades realizadas para apoyar la propuesta\nde establecer el Centro en la Ciudad Especial\nde Goyang.\n</p>\n\n<p>\nLa participación ciudadana, la preparación\nde políticas públicas y la cooperación\ninstitucional constituyen bases importantes\npara la futura colaboración internacional.\n</p>\n\n</section>\n\n<nav class=\"filters\"\naria-label=\"Filtrar acontecimientos por institución\">\n\n<button type=\"button\"\nclass=\"active\"\ndata-type=\"all\"\naria-pressed=\"true\">\nTodos los acontecimientos\n</button>\n\n<button type=\"button\"\ndata-type=\"government\"\naria-pressed=\"false\">\nGobierno Nacional\n</button>\n\n<button type=\"button\"\ndata-type=\"gyeonggi\"\naria-pressed=\"false\">\nProvincia de Gyeonggi\n</button>\n\n<button type=\"button\"\ndata-type=\"goyang\"\naria-pressed=\"false\">\nCiudad Especial de Goyang\n</button>\n\n<button type=\"button\"\ndata-type=\"civic\"\naria-pressed=\"false\">\nComité Ciudadano de Promoción\n</button>\n\n</nav>\n\n<section id=\"acontecimientos\">\n\n<h2>Principales acontecimientos</h2>\n\n<div class=\"timeline\"\nid=\"timeline\"\naria-live=\"polite\">\n</div>\n\n</section>\n\n<section id=\"prioridades\">\n\n<h2>Prioridades futuras</h2>\n\n<div class=\"future\">\n\n<h3>\nPreparación para la evaluación\nde selección de ubicación\n</h3>\n\n<p>\nExaminar los anuncios oficiales del Gobierno\ny los criterios de evaluación, y presentar\nla competitividad de la Ciudad Especial\nde Goyang y sus planes de implementación\nmediante pruebas objetivas y documentación\nde respaldo.\n</p>\n\n</div>\n\n<div class=\"future\">\n\n<h3>\nPreparación para el establecimiento inicial\nde organizaciones internacionales\n</h3>\n\n<p>\nDesarrollar propuestas prácticas relacionadas\ncon instalaciones de oficinas, condiciones\nresidenciales, atención sanitaria, educación,\ntransporte y otros servicios que puedan\nnecesitar las instituciones participantes.\n</p>\n\n</div>\n\n<div class=\"future\">\n\n<h3>\nPreparación de proyectos piloto\nde IA de interés público\n</h3>\n\n<p>\nExaminar la viabilidad de posibles proyectos\nde cooperación en atención sanitaria esencial\napoyada por inteligencia artificial y respuestas\na crisis complejas.\n</p>\n\n<p>\nIdentificar posibles instituciones colaboradoras\ny evaluar los requisitos necesarios\npara su implementación.\n</p>\n\n</div>\n\n<div class=\"note\">\n\n<strong>Aviso importante</strong>\n\n<p>\nLos calendarios futuros podrán modificarse\nde acuerdo con los anuncios oficiales\ndel Gobierno y las decisiones institucionales.\n</p>\n\n<p>\nEsta página resume los principales\nacontecimientos y actividades relacionados\ncon la iniciativa.\n</p>\n\n<p>\nNo implica que todos los planes futuros\no acuerdos institucionales hayan sido\noficialmente confirmados.\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=es\" class=\"button\">\nEstrategia de Atracción del Centro Global de IA\n</a>\n\n<a href=\"committee.html?lang=es\" class=\"button\">\nAcerca del Comité Ciudadano de Promoción\n</a>\n\n</section>\n\n<section>\n\n<h2>Más información</h2>\n\n<p>\nExplore las páginas relacionadas con\nla iniciativa del Centro Global de IA\nen la Ciudad Especial de Goyang.\n</p>\n\n<a href=\"index.html?lang=es\" class=\"button\">\n← Página principal en español\n</a>\n\n<a href=\"hub.html?lang=es\" class=\"button secondary\">\nAcerca del Centro Global de IA\n</a>\n\n<a href=\"goyang.html?lang=es\" class=\"button secondary\">\n¿Por qué Goyang?\n</a>\n\n<a href=\"agencies.html?lang=es\" class=\"button secondary\">\nOrganizaciones internacionales\n</a>\n\n</section>\n\n</main>\n\n<footer>\n\n<p>\n<strong>\nComité Ciudadano de Promoción<br>\npara la Atracción del Centro Global de IA<br>\na la Ciudad Especial de Goyang\n</strong>\n</p>\n\n<p>\nCon los ciudadanos,<br>\ncon la provincia de Gyeonggi<br>\ny con el mundo.\n</p>\n\n<p>\n<a href=\"index.html?lang=es\">Inicio en español</a>\n&nbsp; | &nbsp;\n<a href=\"history.html?lang=en\" lang=\"en\">English</a>\n&nbsp; | &nbsp;\n<a href=\"history.html\" lang=\"ko\">한국어</a>\n</p>\n\n</footer>\n\n\u003cscript>\n\n/* DATOS DE LA CRONOLOGÍA */\n\nconst events = [\n\n{\n  date: \"2026.03.10\",\n  type: \"government\",\n  label: \"Gobierno Nacional\",\n  title:\n    \"Anuncio gubernamental sobre la iniciativa del Centro Global de IA\",\n  description:\n    \"Las conversaciones y los preparativos a nivel gubernamental relacionados con la iniciativa del Centro Global de IA cobraron impulso.\"\n},\n\n{\n  date: \"2026.03.16\",\n  type: \"government\",\n  label: \"Gobierno Nacional\",\n  title:\n    \"Reunión entre el Primer Ministro y representantes de las Naciones Unidas\",\n  description:\n    \"Se celebraron conversaciones sobre cooperación internacional relacionadas con la iniciativa del Centro Global de IA.\"\n},\n\n{\n  date: \"2026.03.17\",\n  type: \"government\",\n  label: \"Gobierno Nacional\",\n  title:\n    \"Cartas de intención entre el Gobierno y organizaciones internacionales\",\n  description:\n    \"Se realizaron gestiones para formalizar cartas de intención relativas a la cooperación en la iniciativa del Centro Global de IA.\"\n},\n\n{\n  date: \"2026.04.09\",\n  type: \"government\",\n  label: \"Gobierno Nacional\",\n  title:\n    \"Instrucción del Primer Ministro sobre la iniciativa del Centro Global de IA\",\n  description:\n    \"Se estableció un marco institucional para la cooperación intergubernamental relacionada con la iniciativa del Centro Global de IA.\"\n},\n\n{\n  date: \"2026.05.21\",\n  type: \"government\",\n  label: \"Gobierno Nacional\",\n  title:\n    \"Declaración conjunta de organizaciones internacionales y bancos multilaterales de desarrollo\",\n  description:\n    \"Nueve organizaciones internacionales y cinco bancos multilaterales de desarrollo anunciaron una declaración conjunta sobre cooperación.\"\n},\n\n{\n  date: \"2026.09.07\",\n  type: \"civic\",\n  label: \"Comité Ciudadano de Promoción\",\n  title:\n    \"Inauguración del Comité Ciudadano de Promoción\",\n  description:\n    \"La campaña ciudadana para atraer el Centro Global de IA se puso en marcha en el Centro de Exposiciones Florales del Parque del Lago de Goyang.\"\n},\n\n{\n  date: \"2026.10.12\",\n  type: \"gyeonggi\",\n  label: \"Provincia de Gyeonggi\",\n  title:\n    \"Creación del Grupo de Trabajo de Gyeonggi para apoyar la atracción del Centro Global de IA\",\n  description:\n    \"Se creó un grupo de trabajo provincial para apoyar el desarrollo de estrategias de atracción y la cooperación institucional.\"\n},\n\n{\n  date: \"2026.10.14\",\n  type: \"government\",\n  label: \"Gobierno Nacional\",\n  title:\n    \"Audiencia pública sobre los criterios de evaluación para la selección de ubicación\",\n  description:\n    \"Se presentó y debatió un borrador de los criterios de evaluación para seleccionar la ubicación del Centro Global de IA en el Centro de Convenciones de Sejong.\"\n},\n\n{\n  date: \"2026.10.15\",\n  type: \"civic\",\n  label: \"Comité Ciudadano de Promoción\",\n  title:\n    \"Recomendaciones para mejorar los criterios de evaluación de ubicación\",\n  description:\n    \"Se prepararon recomendaciones sobre las condiciones de establecimiento inicial, la aceptación comunitaria y los proyectos piloto de IA de interés público.\"\n},\n\n{\n  date: \"2026.10.20\",\n  type: \"civic\",\n  label: \"Comité Ciudadano de Promoción\",\n  title:\n    \"Participación en el VII Seminario de Estrategia de Innovación de Goyang\",\n  description:\n    \"Los participantes destacaron la importancia de finalizar una estrategia de atracción, solicitar cooperación institucional, establecer una estructura de implementación y asegurar documentación de respaldo.\"\n},\n\n{\n  date: \"2026.10.26\",\n  type: \"goyang\",\n  label: \"Ciudad Especial de Goyang\",\n  title:\n    \"Resolución del Consejo Municipal de Goyang en apoyo de la atracción del Centro Global de IA\",\n  description:\n    \"El Consejo Municipal aprobó por unanimidad una resolución solicitando la atracción del Centro Global de IA, con la participación de todos sus miembros.\"\n},\n\n{\n  date: \"2026.10.30\",\n  type: \"gyeonggi\",\n  label: \"Provincia de Gyeonggi\",\n  title:\n    \"Foro de Estrategia de Atracción del Centro Global de IA de la Provincia de Gyeonggi\",\n  description:\n    \"Se celebró un foro en KINTEX, en la Ciudad Especial de Goyang, para debatir estrategias de atracción y cooperación internacional.\"\n}\n\n];\n\n/* FILTRO ACTUAL */\n\nlet currentType = \"all\";\n\n/* MOSTRAR CRONOLOGÍA */\n\nfunction renderTimeline() {\n\n  const timeline =\n    document.getElementById(\"timeline\");\n\n  timeline.innerHTML = \"\";\n\n  const filtered = events\n    .filter(event =>\n      currentType === \"all\" ||\n      event.type === currentType\n    )\n    .sort((a, b) =>\n      a.date.localeCompare(b.date)\n    );\n\n  filtered.forEach(event => {\n\n    const item =\n      document.createElement(\"article\");\n\n    item.className = \"event\";\n\n    const date =\n      document.createElement(\"div\");\n\n    date.className = \"date\";\n    date.textContent = event.date;\n\n    const type =\n      document.createElement(\"span\");\n\n    type.className = \"type\";\n    type.textContent = event.label;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent = event.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      event.description;\n\n    item.appendChild(date);\n    item.appendChild(type);\n    item.appendChild(title);\n    item.appendChild(description);\n\n    timeline.appendChild(item);\n\n  });\n\n}\n\n/* BOTONES DE FILTRO */\n\ndocument\n  .querySelectorAll(\"[data-type]\")\n  .forEach(button => {\n\n    button.addEventListener(\"click\", () => {\n\n      currentType = button.dataset.type;\n\n      document\n        .querySelectorAll(\"[data-type]\")\n        .forEach(btn => {\n\n          const isActive =\n            btn.dataset.type === currentType;\n\n          btn.classList.toggle(\n            \"active\",\n            isActive\n          );\n\n          btn.setAttribute(\n            \"aria-pressed\",\n            String(isActive)\n          );\n\n        });\n\n      renderTimeline();\n\n    });\n\n  });\n\n/* CARGA INICIAL */\n\nrenderTimeline();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=fr": "<!DOCTYPE html>\n<html lang=\"fr\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<title>\nInitiative du Centre mondial de l'IA |\nChronologie et principales étapes\n</title>\n\n<meta name=\"description\"\ncontent=\"Découvrez la chronologie de l'initiative du Centre mondial de l'IA en République de Corée et les principales activités du gouvernement national, de la province de Gyeonggi, de la ville spéciale de Goyang et du Comité citoyen de promotion.\">\n\n<style>\n\n/* CONFIGURATION GÉNÉRALE */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* EN-TÊTE */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  padding: 10px 20px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* CONTENU PRINCIPAL */\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 30px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.intro {\n  text-align: center;\n}\n\n/* FILTRES */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  background: white;\n  border: 1px solid #0754a6;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n.filters button:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* CHRONOLOGIE */\n\n.timeline {\n  border-left: 4px solid #168de0;\n  margin-left: 12px;\n  padding-left: 25px;\n}\n\n.event {\n  position: relative;\n  padding: 0 0 25px;\n}\n\n.event::before {\n  content: \"\";\n  position: absolute;\n  left: -34px;\n  top: 8px;\n  width: 14px;\n  height: 14px;\n  background: #168de0;\n  border-radius: 50%;\n}\n\n.date {\n  color: #0754a6;\n  font-weight: bold;\n  font-size: 17px;\n}\n\n.type {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 3px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  margin: 8px 0;\n}\n\n.event h3 {\n  margin: 5px 0;\n  color: #17315b;\n}\n\n.event p {\n  margin: 5px 0;\n  color: #46566d;\n}\n\n/* PRIORITÉS FUTURES */\n\n.future {\n  border-left: 4px solid #1b9a80;\n  padding-left: 20px;\n  margin-top: 20px;\n}\n\n.note {\n  background: #fff8e8;\n  padding: 20px;\n  border-radius: 8px;\n  margin-top: 25px;\n}\n\n/* BOUTONS */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* PIED DE PAGE */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* VERSION MOBILE */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- EN-TÊTE -->\n\n<header>\n\n<h1>\nInitiative du Centre mondial de l'IA<br>\nChronologie et principales étapes\n</h1>\n\n<p>\nGouvernement national · Province de Gyeonggi<br>\nVille spéciale de Goyang · Comité citoyen de promotion\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=fr\" class=\"home-link\">\n← Accueil — Français\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- INTRODUCTION -->\n\n<section class=\"intro\">\n\n<h2>\nLe parcours vers le Centre mondial de l'IA\n</h2>\n\n<p>\nCette chronologie présente\nles principales évolutions\nliées à l'initiative du Centre mondial de l'IA\nen République de Corée,\nainsi que les activités entreprises\npour soutenir l'implantation\ndu Centre proposé\ndans la ville spéciale de Goyang.\n</p>\n\n<p>\nLa participation citoyenne,\nla préparation des politiques publiques\net la coopération institutionnelle\nconstituent des fondements importants\npour une future collaboration internationale.\n</p>\n\n</section>\n\n\u003c!-- FILTRES -->\n\n<nav class=\"filters\"\naria-label=\"Filtrer la chronologie par organisation\">\n\n<button\ntype=\"button\"\nclass=\"active\"\ndata-type=\"all\"\naria-pressed=\"true\">\nTous les événements\n</button>\n\n<button\ntype=\"button\"\ndata-type=\"government\"\naria-pressed=\"false\">\nGouvernement national\n</button>\n\n<button\ntype=\"button\"\ndata-type=\"gyeonggi\"\naria-pressed=\"false\">\nProvince de Gyeonggi\n</button>\n\n<button\ntype=\"button\"\ndata-type=\"goyang\"\naria-pressed=\"false\">\nVille spéciale de Goyang\n</button>\n\n<button\ntype=\"button\"\ndata-type=\"civic\"\naria-pressed=\"false\">\nComité citoyen de promotion\n</button>\n\n</nav>\n\n\u003c!-- CHRONOLOGIE -->\n\n<section>\n\n<h2>\nPrincipales étapes\n</h2>\n\n<div\nclass=\"timeline\"\nid=\"timeline\"\naria-live=\"polite\">\n</div>\n\n</section>\n\n\u003c!-- PRIORITÉS FUTURES -->\n\n<section>\n\n<h2>\nPriorités futures\n</h2>\n\n<div class=\"future\">\n\n<h3>\nPréparation à l'évaluation\npour la sélection du site\n</h3>\n\n<p>\nExaminer les annonces officielles\ndu gouvernement\net les critères d'évaluation,\npuis présenter\nles atouts concurrentiels de Goyang\net ses plans de mise en œuvre\nà partir de données objectives\net d'éléments justificatifs.\n</p>\n\n</div>\n\n<div class=\"future\">\n\n<h3>\nPréparation à l'installation initiale\ndes organisations internationales\n</h3>\n\n<p>\nÉlaborer des propositions pratiques\nconcernant les bureaux,\nles conditions de logement,\nles soins de santé,\nl'éducation,\nles transports\net les autres services\nsusceptibles d'être nécessaires\naux institutions participantes.\n</p>\n\n</div>\n\n<div class=\"future\">\n\n<h3>\nPréparation de projets pilotes d'IA\nau service de l'intérêt public\n</h3>\n\n<p>\nExaminer la faisabilité\nde projets de coopération potentiels\ndans les domaines\ndes soins de santé essentiels\nassistés par l'intelligence artificielle\net des réponses\naux crises complexes.\n</p>\n\n<p>\nIdentifier les institutions partenaires potentielles\net évaluer les conditions\nnécessaires à leur mise en œuvre.\n</p>\n\n</div>\n\n<div class=\"note\">\n\n<strong>\nAvis important\n</strong>\n\n<p>\nLes calendriers futurs\npeuvent être modifiés\nen fonction des annonces officielles\ndu gouvernement\net des décisions institutionnelles.\n</p>\n\n<p>\nCette page résume\nles principales évolutions\net les activités entreprises.\nElle ne signifie pas\nque tous les projets futurs\nou les dispositifs institutionnels\nont été officiellement confirmés.\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=fr\" class=\"button\">\nStratégie d'implantation du Centre mondial de l'IA\n</a>\n\n<a href=\"committee.html?lang=fr\" class=\"button\">\nPrésentation du Comité citoyen de promotion\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIED DE PAGE -->\n\n<footer>\n\n<p>\n<strong>\nComité citoyen de promotion<br>\npour l'implantation du Centre mondial de l'IA<br>\ndans la ville spéciale de Goyang\n</strong>\n</p>\n\n<p>\nAvec les citoyens,<br>\navec la province de Gyeonggi<br>\net avec le monde.\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\">\nAccueil — Français\n</a>\n</p>\n\n</footer>\n\n\u003c!-- JAVASCRIPT : CHRONOLOGIE -->\n\n\u003cscript>\n\nconst events = [\n\n  {\n    date: \"2026.03.10\",\n    type: \"government\",\n    label: \"Gouvernement national\",\n    title: \"Annonce gouvernementale concernant l'initiative du Centre mondial de l'IA\",\n    description:\n      \"Les discussions et les préparatifs au niveau gouvernemental concernant l'initiative du Centre mondial de l'IA se sont intensifiés.\"\n  },\n\n  {\n    date: \"2026.03.16\",\n    type: \"government\",\n    label: \"Gouvernement national\",\n    title: \"Réunion entre le Premier ministre et des représentants des Nations Unies\",\n    description:\n      \"Des discussions ont eu lieu concernant la coopération internationale liée à l'initiative du Centre mondial de l'IA.\"\n  },\n\n  {\n    date: \"2026.03.17\",\n    type: \"government\",\n    label: \"Gouvernement national\",\n    title: \"Lettres d'intention entre le gouvernement et des organisations internationales\",\n    description:\n      \"Des démarches ont été entreprises pour conclure des lettres d'intention relatives à la coopération dans le cadre de l'initiative du Centre mondial de l'IA.\"\n  },\n\n  {\n    date: \"2026.04.09\",\n    type: \"government\",\n    label: \"Gouvernement national\",\n    title: \"Directive du Premier ministre concernant l'initiative du Centre mondial de l'IA\",\n    description:\n      \"Un cadre institutionnel de coopération interministérielle concernant l'initiative du Centre mondial de l'IA a été établi.\"\n  },\n\n  {\n    date: \"2026.05.21\",\n    type: \"government\",\n    label: \"Gouvernement national\",\n    title: \"Déclaration conjointe d'organisations internationales et de banques multilatérales de développement\",\n    description:\n      \"Une déclaration conjointe concernant la coopération a été annoncée par neuf organisations internationales et cinq banques multilatérales de développement.\"\n  },\n\n  {\n    date: \"2026.09.07\",\n    type: \"civic\",\n    label: \"Comité citoyen de promotion\",\n    title: \"Inauguration du Comité citoyen de promotion\",\n    description:\n      \"La campagne citoyenne visant à attirer le Centre mondial de l'IA a été lancée au Centre d'exposition florale du parc du lac de Goyang.\"\n  },\n\n  {\n    date: \"2026.10.12\",\n    type: \"gyeonggi\",\n    label: \"Province de Gyeonggi\",\n    title: \"Lancement du groupe de travail provincial pour soutenir l'implantation du Centre mondial de l'IA\",\n    description:\n      \"Un groupe de travail provincial a été créé pour soutenir l'élaboration de la stratégie d'implantation et la coopération institutionnelle.\"\n  },\n\n  {\n    date: \"2026.10.14\",\n    type: \"government\",\n    label: \"Gouvernement national\",\n    title: \"Audition publique sur les critères d'évaluation pour la sélection du site\",\n    description:\n      \"Un projet de critères d'évaluation pour la sélection du site du Centre mondial de l'IA a été présenté et discuté au Centre de congrès de Sejong.\"\n  },\n\n  {\n    date: \"2026.10.15\",\n    type: \"civic\",\n    label: \"Comité citoyen de promotion\",\n    title: \"Recommandations visant à améliorer les critères d'évaluation pour la sélection du site\",\n    description:\n      \"Des recommandations ont été préparées concernant les conditions d'installation initiale, l'acceptation par la communauté locale et les projets pilotes d'IA au service de l'intérêt public.\"\n  },\n\n  {\n    date: \"2026.10.20\",\n    type: \"civic\",\n    label: \"Comité citoyen de promotion\",\n    title: \"Participation au 7e séminaire sur la stratégie d'innovation de Goyang\",\n    description:\n      \"Les participants ont souligné l'importance de finaliser une stratégie d'implantation, de solliciter la coopération institutionnelle, de mettre en place une structure de mise en œuvre et de réunir des éléments justificatifs.\"\n  },\n\n  {\n    date: \"2026.10.26\",\n    type: \"goyang\",\n    label: \"Ville spéciale de Goyang\",\n    title: \"Résolution du Conseil municipal de Goyang en faveur du Centre mondial de l'IA\",\n    description:\n      \"Le Conseil municipal a adopté à l'unanimité une résolution appelant à l'implantation du Centre mondial de l'IA, avec la participation de tous ses membres.\"\n  },\n\n  {\n    date: \"2026.10.30\",\n    type: \"gyeonggi\",\n    label: \"Province de Gyeonggi\",\n    title: \"Forum stratégique de la province de Gyeonggi consacré à l'implantation du Centre mondial de l'IA\",\n    description:\n      \"Un forum s'est tenu au KINTEX, dans la ville spéciale de Goyang, afin de discuter des stratégies d'implantation et de coopération internationale.\"\n  }\n\n];\n\n/* FILTRE ACTIF */\n\nlet currentType = \"all\";\n\n/* AFFICHAGE DE LA CHRONOLOGIE */\n\nfunction renderTimeline() {\n\n  const timeline =\n    document.getElementById(\"timeline\");\n\n  timeline.innerHTML = \"\";\n\n  const filtered = events\n    .filter(event =>\n      currentType === \"all\" ||\n      event.type === currentType\n    )\n    .sort((a, b) =>\n      a.date.localeCompare(b.date)\n    );\n\n  filtered.forEach(event => {\n\n    const item =\n      document.createElement(\"article\");\n\n    item.className = \"event\";\n\n    const date =\n      document.createElement(\"div\");\n\n    date.className = \"date\";\n    date.textContent = event.date;\n\n    const type =\n      document.createElement(\"span\");\n\n    type.className = \"type\";\n    type.textContent = event.label;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent = event.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      event.description;\n\n    item.appendChild(date);\n    item.appendChild(type);\n    item.appendChild(title);\n    item.appendChild(description);\n\n    timeline.appendChild(item);\n\n  });\n\n}\n\n/* GESTION DES BOUTONS DE FILTRAGE */\n\ndocument\n.querySelectorAll(\"[data-type]\")\n.forEach(button => {\n\n  button.addEventListener(\"click\", () => {\n\n    currentType = button.dataset.type;\n\n    document\n    .querySelectorAll(\"[data-type]\")\n    .forEach(btn => {\n\n      const isActive =\n        btn.dataset.type === currentType;\n\n      btn.classList.toggle(\n        \"active\",\n        isActive\n      );\n\n      btn.setAttribute(\n        \"aria-pressed\",\n        String(isActive)\n      );\n\n    });\n\n    renderTimeline();\n\n  });\n\n});\n\n/* AFFICHAGE INITIAL */\n\nrenderTimeline();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=it": "<!DOCTYPE html>\n<html lang=\"it\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<title>\nIniziativa per un Polo Globale dell'IA |\nCronologia e principali tappe\n</title>\n\n<meta name=\"description\"\ncontent=\"Scopri la cronologia dell'iniziativa per un Polo Globale dell'IA nella Repubblica di Corea e le principali attività del Governo nazionale, della Provincia di Gyeonggi, della Città Speciale di Goyang e del Comitato Civico Promotore.\">\n\n<style>\n\n/* IMPOSTAZIONI GENERALI */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* INTESTAZIONE */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  padding: 10px 20px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* CONTENUTO PRINCIPALE */\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 30px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.intro {\n  text-align: center;\n}\n\n/* FILTRI */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  background: white;\n  border: 1px solid #0754a6;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n.filters button:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* CRONOLOGIA */\n\n.timeline {\n  border-left: 4px solid #168de0;\n  margin-left: 12px;\n  padding-left: 25px;\n}\n\n.event {\n  position: relative;\n  padding: 0 0 25px;\n}\n\n.event::before {\n  content: \"\";\n  position: absolute;\n  left: -34px;\n  top: 8px;\n  width: 14px;\n  height: 14px;\n  background: #168de0;\n  border-radius: 50%;\n}\n\n.date {\n  color: #0754a6;\n  font-weight: bold;\n  font-size: 17px;\n}\n\n.type {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 3px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  margin: 8px 0;\n}\n\n.event h3 {\n  margin: 5px 0;\n  color: #17315b;\n}\n\n.event p {\n  margin: 5px 0;\n  color: #46566d;\n}\n\n/* PRIORITÀ FUTURE */\n\n.future {\n  border-left: 4px solid #1b9a80;\n  padding-left: 20px;\n  margin-top: 20px;\n}\n\n.note {\n  background: #fff8e8;\n  padding: 20px;\n  border-radius: 8px;\n  margin-top: 25px;\n}\n\n/* PULSANTI */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* PIÈ DI PAGINA */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* VERSIONE MOBILE */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 20px;\n  }\n\n  .filters {\n    gap: 8px;\n  }\n\n  .filters button {\n    padding: 9px 12px;\n    font-size: 13px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- INTESTAZIONE -->\n\n<header>\n\n<h1>\nIniziativa per un Polo Globale dell'IA<br>\nCronologia e principali tappe\n</h1>\n\n<p>\nGoverno nazionale · Provincia di Gyeonggi<br>\nCittà Speciale di Goyang · Comitato Civico Promotore\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=it\"\nclass=\"home-link\">\n← Homepage italiana\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- INTRODUZIONE -->\n\n<section class=\"intro\">\n\n<h2>\nIl percorso verso il Polo Globale dell'IA\n</h2>\n\n<p>\nQuesta cronologia presenta\ni principali sviluppi\nrelativi all'iniziativa\nper un Polo Globale dell'IA\nnella Repubblica di Corea,\ninsieme alle attività intraprese\nper sostenere la proposta\ndi insediamento del Polo\nnella Città Speciale di Goyang.\n</p>\n\n<p>\nLa partecipazione dei cittadini,\nla preparazione delle politiche\ne la cooperazione istituzionale\ncostituiscono basi importanti\nper la futura collaborazione internazionale.\n</p>\n\n</section>\n\n\u003c!-- FILTRI PER ORGANIZZAZIONE -->\n\n<nav class=\"filters\"\naria-label=\"Filtra la cronologia per organizzazione\">\n\n<button\ntype=\"button\"\nclass=\"active\"\ndata-type=\"all\"\naria-pressed=\"true\">\nTutti gli eventi\n</button>\n\n<button\ntype=\"button\"\ndata-type=\"government\"\naria-pressed=\"false\">\nGoverno nazionale\n</button>\n\n<button\ntype=\"button\"\ndata-type=\"gyeonggi\"\naria-pressed=\"false\">\nProvincia di Gyeonggi\n</button>\n\n<button\ntype=\"button\"\ndata-type=\"goyang\"\naria-pressed=\"false\">\nCittà Speciale di Goyang\n</button>\n\n<button\ntype=\"button\"\ndata-type=\"civic\"\naria-pressed=\"false\">\nComitato Civico Promotore\n</button>\n\n</nav>\n\n\u003c!-- CRONOLOGIA -->\n\n<section>\n\n<h2>\nPrincipali tappe\n</h2>\n\n<div\nclass=\"timeline\"\nid=\"timeline\"\naria-live=\"polite\">\n</div>\n\n</section>\n\n\u003c!-- PRIORITÀ FUTURE -->\n\n<section>\n\n<h2>\nPriorità future\n</h2>\n\n<div class=\"future\">\n\n<h3>\nPreparazione alla valutazione\nper la selezione della sede\n</h3>\n\n<p>\nEsaminare gli annunci ufficiali\ndel Governo\ne i criteri di valutazione,\npresentando la competitività\ndella Città Speciale di Goyang\ne i relativi piani di attuazione\nsulla base di dati oggettivi\ne documentazione di supporto.\n</p>\n\n</div>\n\n<div class=\"future\">\n\n<h3>\nPreparazione all'insediamento iniziale\ndelle organizzazioni internazionali\n</h3>\n\n<p>\nElaborare proposte concrete\nrelative agli spazi per uffici,\nalle condizioni abitative,\nall'assistenza sanitaria,\nall'istruzione,\nai trasporti\ne ad altri servizi\nche potrebbero essere necessari\nalle istituzioni partecipanti.\n</p>\n\n</div>\n\n<div class=\"future\">\n\n<h3>\nPreparazione di progetti pilota\ndi IA per il bene pubblico\n</h3>\n\n<p>\nEsaminare la fattibilità\ndi potenziali progetti di cooperazione\nnell'assistenza sanitaria essenziale\nsupportata dall'intelligenza artificiale\ne nella risposta\nalle crisi complesse.\n</p>\n\n<p>\nIndividuare potenziali istituzioni partner\ne valutare i requisiti\nnecessari per l'attuazione.\n</p>\n\n</div>\n\n<div class=\"note\">\n\n<strong>\nAvviso importante\n</strong>\n\n<p>\nI calendari futuri\npotrebbero subire modifiche\nin base agli annunci ufficiali\ndel Governo\ne alle decisioni istituzionali.\n</p>\n\n<p>\nQuesta pagina riassume\ni principali sviluppi\ne le attività intraprese.\n</p>\n\n<p>\nNon implica che tutti i piani futuri\no gli accordi istituzionali\nsiano stati ufficialmente confermati.\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=it\"\nclass=\"button\">\nStrategia per l'insediamento\ndel Polo Globale dell'IA\n</a>\n\n<a href=\"committee.html?lang=it\"\nclass=\"button\">\nInformazioni sul Comitato Civico Promotore\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIÈ DI PAGINA -->\n\n<footer>\n\n<p>\n<strong>\nComitato Civico Promotore<br>\nper l'insediamento del Polo Globale dell'IA<br>\nnella Città Speciale di Goyang\n</strong>\n</p>\n\n<p>\nCon i cittadini,<br>\ncon la Provincia di Gyeonggi<br>\ne con il mondo.\n</p>\n\n<p>\n<a href=\"index.html?lang=it\">\nHomepage italiana\n</a>\n</p>\n\n</footer>\n\n\u003c!-- JAVASCRIPT: CRONOLOGIA INTERATTIVA -->\n\n\u003cscript>\n\nconst events = [\n\n  /* 1. GOVERNO NAZIONALE */\n\n  {\n    date: \"2026.03.10\",\n    type: \"government\",\n    label: \"Governo nazionale\",\n    title:\n      \"Annuncio governativo sull'iniziativa per un Polo Globale dell'IA\",\n    description:\n      \"Le discussioni e i preparativi a livello governativo relativi all'iniziativa per un Polo Globale dell'IA hanno acquisito nuovo slancio.\"\n  },\n\n  /* 2. GOVERNO NAZIONALE */\n\n  {\n    date: \"2026.03.16\",\n    type: \"government\",\n    label: \"Governo nazionale\",\n    title:\n      \"Incontro tra il Primo Ministro e i rappresentanti delle Nazioni Unite\",\n    description:\n      \"Si sono svolte discussioni sulla cooperazione internazionale relativa all'iniziativa per un Polo Globale dell'IA.\"\n  },\n\n  /* 3. GOVERNO NAZIONALE */\n\n  {\n    date: \"2026.03.17\",\n    type: \"government\",\n    label: \"Governo nazionale\",\n    title:\n      \"Lettere d'intenti tra il Governo e le organizzazioni internazionali\",\n    description:\n      \"Sono state intraprese iniziative per concludere lettere d'intenti riguardanti la cooperazione nell'ambito del Polo Globale dell'IA.\"\n  },\n\n  /* 4. GOVERNO NAZIONALE */\n\n  {\n    date: \"2026.04.09\",\n    type: \"government\",\n    label: \"Governo nazionale\",\n    title:\n      \"Direttiva del Primo Ministro sull'iniziativa per un Polo Globale dell'IA\",\n    description:\n      \"È stato istituito un quadro istituzionale per la cooperazione intergovernativa relativa all'iniziativa per un Polo Globale dell'IA.\"\n  },\n\n  /* 5. GOVERNO NAZIONALE */\n\n  {\n    date: \"2026.05.21\",\n    type: \"government\",\n    label: \"Governo nazionale\",\n    title:\n      \"Dichiarazione congiunta delle organizzazioni internazionali e delle banche multilaterali di sviluppo\",\n    description:\n      \"Nove organizzazioni internazionali e cinque banche multilaterali di sviluppo hanno annunciato una dichiarazione congiunta riguardante la cooperazione.\"\n  },\n\n  /* 6. COMITATO CIVICO */\n\n  {\n    date: \"2026.09.07\",\n    type: \"civic\",\n    label: \"Comitato Civico Promotore\",\n    title:\n      \"Inaugurazione del Comitato Civico Promotore\",\n    description:\n      \"La campagna promossa dalla società civile per attirare il Polo Globale dell'IA è stata avviata presso il Centro Espositivo dei Fiori nel Parco del Lago di Goyang.\"\n  },\n\n  /* 7. PROVINCIA DI GYEONGGI */\n\n  {\n    date: \"2026.10.12\",\n    type: \"gyeonggi\",\n    label: \"Provincia di Gyeonggi\",\n    title:\n      \"Avvio della task force provinciale per sostenere l'insediamento del Polo Globale dell'IA\",\n    description:\n      \"È stata istituita una task force provinciale per sostenere lo sviluppo della strategia di insediamento e la cooperazione istituzionale.\"\n  },\n\n  /* 8. GOVERNO NAZIONALE */\n\n  {\n    date: \"2026.10.14\",\n    type: \"government\",\n    label: \"Governo nazionale\",\n    title:\n      \"Audizione pubblica sui criteri di valutazione per la selezione della sede\",\n    description:\n      \"Una bozza dei criteri di valutazione per la selezione della sede del Polo Globale dell'IA è stata presentata e discussa presso il Centro Congressi di Sejong.\"\n  },\n\n  /* 9. COMITATO CIVICO */\n\n  {\n    date: \"2026.10.15\",\n    type: \"civic\",\n    label: \"Comitato Civico Promotore\",\n    title:\n      \"Raccomandazioni per migliorare i criteri di valutazione della sede\",\n    description:\n      \"Sono state elaborate raccomandazioni relative alle condizioni di insediamento iniziale, all'accettazione da parte della comunità e ai progetti pilota di IA per il bene pubblico.\"\n  },\n\n  /* 10. COMITATO CIVICO */\n\n  {\n    date: \"2026.10.20\",\n    type: \"civic\",\n    label: \"Comitato Civico Promotore\",\n    title:\n      \"Partecipazione al 7° Seminario sulla Strategia di Innovazione di Goyang\",\n    description:\n      \"I partecipanti hanno sottolineato l'importanza di finalizzare una strategia di insediamento, richiedere la cooperazione istituzionale, definire una struttura di attuazione e raccogliere documentazione di supporto.\"\n  },\n\n  /* 11. CITTÀ SPECIALE DI GOYANG */\n\n  {\n    date: \"2026.10.26\",\n    type: \"goyang\",\n    label: \"Città Speciale di Goyang\",\n    title:\n      \"Risoluzione del Consiglio comunale di Goyang a sostegno del Polo Globale dell'IA\",\n    description:\n      \"Il Consiglio comunale ha adottato all'unanimità una risoluzione a favore dell'insediamento del Polo Globale dell'IA, con la partecipazione di tutti i consiglieri.\"\n  },\n\n  /* 12. PROVINCIA DI GYEONGGI */\n\n  {\n    date: \"2026.10.30\",\n    type: \"gyeonggi\",\n    label: \"Provincia di Gyeonggi\",\n    title:\n      \"Forum strategico della Provincia di Gyeonggi per l'insediamento del Polo Globale dell'IA\",\n    description:\n      \"Presso il KINTEX della Città Speciale di Goyang si è tenuto un forum dedicato alle strategie di insediamento e alla cooperazione internazionale.\"\n  }\n\n];\n\n/* FILTRO ATTIVO */\n\nlet currentType = \"all\";\n\n/* VISUALIZZAZIONE DELLA CRONOLOGIA */\n\nfunction renderTimeline() {\n\n  const timeline =\n    document.getElementById(\"timeline\");\n\n  timeline.innerHTML = \"\";\n\n  const filtered = events\n    .filter(event =>\n      currentType === \"all\" ||\n      event.type === currentType\n    )\n    .sort((a, b) =>\n      a.date.localeCompare(b.date)\n    );\n\n  filtered.forEach(event => {\n\n    const item =\n      document.createElement(\"article\");\n\n    item.className = \"event\";\n\n    const date =\n      document.createElement(\"div\");\n\n    date.className = \"date\";\n    date.textContent = event.date;\n\n    const type =\n      document.createElement(\"span\");\n\n    type.className = \"type\";\n    type.textContent = event.label;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent = event.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      event.description;\n\n    item.appendChild(date);\n    item.appendChild(type);\n    item.appendChild(title);\n    item.appendChild(description);\n\n    timeline.appendChild(item);\n\n  });\n\n}\n\n/* GESTIONE DEI PULSANTI FILTRO */\n\ndocument\n  .querySelectorAll(\"[data-type]\")\n  .forEach(button => {\n\n    button.addEventListener(\"click\", () => {\n\n      currentType = button.dataset.type;\n\n      document\n        .querySelectorAll(\"[data-type]\")\n        .forEach(btn => {\n\n          const isActive =\n            btn.dataset.type === currentType;\n\n          btn.classList.toggle(\n            \"active\",\n            isActive\n          );\n\n          btn.setAttribute(\n            \"aria-pressed\",\n            String(isActive)\n          );\n\n        });\n\n      renderTimeline();\n\n    });\n\n  });\n\n/* VISUALIZZAZIONE INIZIALE */\n\nrenderTimeline();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=ja": "<!DOCTYPE html>\n<html lang=\"ja\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nグローバルAIハブ構想 | 推進経緯と主な沿革\n</title>\n\n<meta name=\"description\"\ncontent=\"大韓民国におけるグローバルAIハブ構想の推進経緯と、中央政府、京畿道、高陽特例市、市民推進委員会による主な活動を紹介します。\">\n\n<style>\n\n/* =====================================\n   基本設定\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    \"Noto Sans JP\",\n    \"Hiragino Kaku Gothic ProN\",\n    \"Yu Gothic\",\n    Meiryo,\n    Arial,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ヘッダー\n===================================== */\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  padding: 10px 20px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* =====================================\n   メインコンテンツ\n===================================== */\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 30px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.intro {\n  text-align: center;\n}\n\n/* =====================================\n   フィルター\n===================================== */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  background: white;\n  border: 1px solid #0754a6;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n.filters button:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   タイムライン\n===================================== */\n\n.timeline {\n  border-left: 4px solid #168de0;\n  margin-left: 12px;\n  padding-left: 25px;\n}\n\n.event {\n  position: relative;\n  padding: 0 0 25px;\n}\n\n.event::before {\n  content: \"\";\n  position: absolute;\n  left: -34px;\n  top: 8px;\n  width: 14px;\n  height: 14px;\n  background: #168de0;\n  border-radius: 50%;\n}\n\n.date {\n  color: #0754a6;\n  font-weight: bold;\n  font-size: 17px;\n}\n\n.type {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 3px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  margin: 8px 0;\n}\n\n.event h3 {\n  margin: 5px 0;\n  color: #17315b;\n}\n\n.event p {\n  margin: 5px 0;\n  color: #46566d;\n}\n\n/* =====================================\n   今後の重点課題\n===================================== */\n\n.future {\n  border-left: 4px solid #1b9a80;\n  padding-left: 20px;\n  margin-top: 20px;\n}\n\n.note {\n  background: #fff8e8;\n  padding: 20px;\n  border-radius: 8px;\n  margin-top: 25px;\n}\n\n/* =====================================\n   ボタン\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   フッター\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   モバイル対応\n===================================== */\n\n@media (max-width: 600px) {\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n}\n\n</style>\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ヘッダー\n===================================== -->\n\n<header>\n\n<h1>\nグローバルAIハブ構想<br>\n推進経緯と主な沿革\n</h1>\n\n<p>\n中央政府・京畿道<br>\n高陽特例市・市民推進委員会\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=ja\" class=\"home-link\">\n← 日本語ホーム\n</a>\n\n<a href=\"history.html\" class=\"home-link\" lang=\"ko\">\n한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     はじめに\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nグローバルAIハブ構想の歩み\n</h2>\n\n<p>\nこのタイムラインでは、\n大韓民国における\nグローバルAIハブ構想に関連する\n主な進展と、\n構想中のグローバルAIハブを\n高陽特例市へ誘致するための\n活動を紹介します。\n</p>\n\n<p>\n市民参加、\n政策面の準備、\n関係機関の協力は、\n将来の国際協力に向けた\n重要な基盤となります。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     機関別フィルター\n===================================== -->\n\n<nav\nclass=\"filters\"\naria-label=\"組織別に沿革を絞り込む\"\n>\n\n<button\ntype=\"button\"\nclass=\"active\"\ndata-type=\"all\"\naria-pressed=\"true\">\nすべて\n</button>\n\n<button\ntype=\"button\"\ndata-type=\"government\"\naria-pressed=\"false\">\n中央政府\n</button>\n\n<button\ntype=\"button\"\ndata-type=\"gyeonggi\"\naria-pressed=\"false\">\n京畿道\n</button>\n\n<button\ntype=\"button\"\ndata-type=\"goyang\"\naria-pressed=\"false\">\n高陽特例市\n</button>\n\n<button\ntype=\"button\"\ndata-type=\"civic\"\naria-pressed=\"false\">\n市民推進委員会\n</button>\n\n</nav>\n\n\u003c!-- =====================================\n     主な沿革\n===================================== -->\n\n<section>\n\n<h2>\n主な沿革\n</h2>\n\n<div\nclass=\"timeline\"\nid=\"timeline\"\naria-live=\"polite\">\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     今後の重点課題\n===================================== -->\n\n<section>\n\n<h2>\n今後の重点課題\n</h2>\n\n<div class=\"future\">\n\n<h3>\n立地選定評価への準備\n</h3>\n\n<p>\n政府の公式発表と\n評価基準を確認し、\n客観的な根拠資料に基づいて、\n高陽特例市の競争力と\n実施計画を提示します。\n</p>\n\n</div>\n\n<div class=\"future\">\n\n<h3>\n国際機関の初期拠点整備への準備\n</h3>\n\n<p>\n参加機関に必要となる可能性がある\n事務所施設、\n住宅環境、\n医療、\n教育、\n交通、\nその他のサービスについて、\n実践的な提案を策定します。\n</p>\n\n</div>\n\n<div class=\"future\">\n\n<h3>\n公益のためのAI実証事業の準備\n</h3>\n\n<p>\nAIを活用した\n必要不可欠な医療サービスと、\n複合的な危機への対応に関する\n潜在的な協力事業の\n実現可能性を検討します。\n</p>\n\n<p>\n協力先となり得る機関を特定し、\n実施に必要な条件を\n評価します。\n</p>\n\n</div>\n\n<div class=\"note\">\n\n<strong>\n重要なお知らせ\n</strong>\n\n<p>\n今後の日程は、\n政府の公式発表や\n関係機関の決定によって\n変更される可能性があります。\n</p>\n\n<p>\n本ページは、\n主な進展と活動を\nまとめたものです。\nすべての将来計画や\n機関間の取り決めが\n正式に確定したことを\n意味するものではありません。\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=ja\" class=\"button\">\nグローバルAIハブ誘致戦略\n</a>\n\n<a href=\"committee.html?lang=ja\" class=\"button\">\n市民推進委員会について\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     フッター\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\n高陽特例市グローバルAIハブ誘致<br>\n市民推進委員会\n</strong>\n</p>\n\n<p>\n市民とともに、京畿道とともに、<br>\nそして世界とともに。\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ja\">\n日本語ホーム\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"history.html\" lang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     タイムライン JavaScript\n===================================== -->\n\n\u003cscript>\n\nconst events = [\n\n  {\n    date: \"2026.03.10\",\n    type: \"government\",\n    label: \"中央政府\",\n    title: \"グローバルAIハブ構想に関する政府発表\",\n    description:\n      \"グローバルAIハブ構想に関する政府レベルの協議と準備が本格化しました。\"\n  },\n\n  {\n    date: \"2026.03.16\",\n    type: \"government\",\n    label: \"中央政府\",\n    title: \"国務総理と国連代表者との会合\",\n    description:\n      \"グローバルAIハブ構想に関連する国際協力について協議が行われました。\"\n  },\n\n  {\n    date: \"2026.03.17\",\n    type: \"government\",\n    label: \"中央政府\",\n    title: \"政府と国際機関との意向書\",\n    description:\n      \"グローバルAIハブ構想に関する協力について、意向書の締結に向けた取り組みが行われました。\"\n  },\n\n  {\n    date: \"2026.04.09\",\n    type: \"government\",\n    label: \"中央政府\",\n    title: \"グローバルAIハブ構想に関する国務総理の指示\",\n    description:\n      \"グローバルAIハブ構想に関する政府機関間の協力体制が整備されました。\"\n  },\n\n  {\n    date: \"2026.05.21\",\n    type: \"government\",\n    label: \"中央政府\",\n    title: \"国際機関と多国間開発銀行による共同声明\",\n    description:\n      \"9つの国際機関と5つの多国間開発銀行による協力に関する共同声明が発表されました。\"\n  },\n\n  {\n    date: \"2026.09.07\",\n    type: \"civic\",\n    label: \"市民推進委員会\",\n    title: \"市民推進委員会発足式\",\n    description:\n      \"高陽湖水公園の花展示館で、グローバルAIハブ誘致に向けた市民主導の活動が開始されました。\"\n  },\n\n  {\n    date: \"2026.10.12\",\n    type: \"gyeonggi\",\n    label: \"京畿道\",\n    title: \"京畿道グローバルAIハブ誘致支援タスクフォース発足\",\n    description:\n      \"誘致戦略の策定と関係機関の協力を支援するため、京畿道のタスクフォースが発足しました。\"\n  },\n\n  {\n    date: \"2026.10.14\",\n    type: \"government\",\n    label: \"中央政府\",\n    title: \"立地選定評価基準に関する公聴会\",\n    description:\n      \"世宗コンベンションセンターで、グローバルAIハブ立地選定評価基準の草案が提示され、議論されました。\"\n  },\n\n  {\n    date: \"2026.10.15\",\n    type: \"civic\",\n    label: \"市民推進委員会\",\n    title: \"立地選定評価基準の改善に関する提言\",\n    description:\n      \"初期拠点の整備条件、地域社会の受容性、公益のためのAI実証事業に関する提言が作成されました。\"\n  },\n\n  {\n    date: \"2026.10.20\",\n    type: \"civic\",\n    label: \"市民推進委員会\",\n    title: \"第7回高陽イノベーション戦略セミナーへの参加\",\n    description:\n      \"参加者は、誘致戦略の具体化、関係機関への協力要請、実施体制の構築、根拠資料の確保の重要性を強調しました。\"\n  },\n\n  {\n    date: \"2026.10.26\",\n    type: \"goyang\",\n    label: \"高陽特例市\",\n    title: \"高陽特例市議会によるグローバルAIハブ誘致促進決議\",\n    description:\n      \"市議会は、全議員の参加により、グローバルAIハブの誘致を求める決議を全会一致で採択しました。\"\n  },\n\n  {\n    date: \"2026.10.30\",\n    type: \"gyeonggi\",\n    label: \"京畿道\",\n    title: \"京畿道グローバルAIハブ誘致戦略フォーラム\",\n    description:\n      \"高陽特例市のKINTEXで、誘致戦略と国際協力について議論するフォーラムが開催されました。\"\n  }\n\n];\n\n/* =====================================\n   現在のフィルター\n===================================== */\n\nlet currentType = \"all\";\n\n/* =====================================\n   タイムライン描画\n===================================== */\n\nfunction renderTimeline() {\n\n  const timeline =\n    document.getElementById(\"timeline\");\n\n  timeline.innerHTML = \"\";\n\n  const filtered = events\n\n    .filter(event =>\n      currentType === \"all\" ||\n      event.type === currentType\n    )\n\n    .sort((a, b) =>\n      a.date.localeCompare(b.date)\n    );\n\n  filtered.forEach(event => {\n\n    const item =\n      document.createElement(\"article\");\n\n    item.className = \"event\";\n\n    const date =\n      document.createElement(\"div\");\n\n    date.className = \"date\";\n    date.textContent = event.date;\n\n    const type =\n      document.createElement(\"span\");\n\n    type.className = \"type\";\n    type.textContent = event.label;\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent = event.title;\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      event.description;\n\n    item.appendChild(date);\n    item.appendChild(type);\n    item.appendChild(title);\n    item.appendChild(description);\n\n    timeline.appendChild(item);\n\n  });\n\n}\n\n/* =====================================\n   フィルターボタン\n===================================== */\n\ndocument\n  .querySelectorAll(\"[data-type]\")\n  .forEach(button => {\n\n    button.addEventListener(\"click\", () => {\n\n      currentType = button.dataset.type;\n\n      document\n        .querySelectorAll(\"[data-type]\")\n        .forEach(btn => {\n\n          const isActive =\n            btn.dataset.type === currentType;\n\n          btn.classList.toggle(\n            \"active\",\n            isActive\n          );\n\n          btn.setAttribute(\n            \"aria-pressed\",\n            String(isActive)\n          );\n\n        });\n\n      renderTimeline();\n\n    });\n\n  });\n\n/* =====================================\n   初期表示\n===================================== */\n\nrenderTimeline();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=ru": "<!DOCTYPE html>\n<html lang=\"ru\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nИнициатива «Глобальный центр ИИ» |\nХронология и основные этапы\n</title>\n\n<meta name=\"description\"\ncontent=\"Хронология инициативы «Глобальный центр ИИ» в Республике Корея и основные мероприятия правительства, провинции Кёнгидо, особого города Коян и Гражданского комитета содействия.\">\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  padding: 10px 20px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 30px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.intro {\n  text-align: center;\n}\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 25px;\n}\n\n.filters button {\n  background: white;\n  border: 1px solid #0754a6;\n  color: #0754a6;\n  padding: 10px 16px;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n.filters button:hover {\n  background: #e7f1ff;\n}\n\n.filters button.active:hover {\n  background: #003a7a;\n}\n\n.filters button:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n.timeline {\n  border-left: 4px solid #168de0;\n  margin-left: 12px;\n  padding-left: 25px;\n}\n\n.event {\n  position: relative;\n  padding: 0 0 25px;\n}\n\n.event::before {\n  content: \"\";\n  position: absolute;\n  left: -34px;\n  top: 8px;\n  width: 14px;\n  height: 14px;\n  background: #168de0;\n  border-radius: 50%;\n}\n\n.date {\n  color: #0754a6;\n  font-weight: bold;\n  font-size: 17px;\n}\n\n.type {\n  display: inline-block;\n  background: #e7f1ff;\n  color: #0754a6;\n  padding: 3px 10px;\n  border-radius: 5px;\n  font-size: 13px;\n  margin: 8px 0;\n}\n\n.event h3 {\n  margin: 5px 0;\n  color: #17315b;\n}\n\n.event p {\n  margin: 5px 0;\n  color: #46566d;\n}\n\n.future {\n  border-left: 4px solid #1b9a80;\n  padding-left: 20px;\n  margin-top: 20px;\n}\n\n.note {\n  background: #fff8e8;\n  padding: 20px;\n  border-radius: 8px;\n  margin-top: 25px;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n}\n</style>\n</head>\n\n<body>\n\n<header>\n  <h1>\n    Инициатива «Глобальный центр ИИ»<br>\n    Хронология и основные этапы\n  </h1>\n\n  <p>\n    Правительство Республики Корея · Провинция Кёнгидо<br>\n    Особый город Коян · Гражданский комитет содействия\n  </p>\n\n  <div class=\"header-links\">\n    <a href=\"index.html?lang=ru\" class=\"home-link\">\n      ← Главная страница\n    </a>\n\n    <a href=\"history.html\" class=\"home-link\" lang=\"ko\">\n      한국어\n    </a>\n  </div>\n</header>\n\n<main>\n\n\u003c!-- ВВЕДЕНИЕ -->\n\n<section class=\"intro\">\n  <h2>\n    Путь к созданию Глобального центра ИИ\n  </h2>\n\n  <p>\n    В этой хронологии представлены\n    основные события, связанные\n    с инициативой «Глобальный центр ИИ»\n    в Республике Корея,\n    а также мероприятия,\n    направленные на поддержку\n    размещения предлагаемого центра\n    в особом городе Коян.\n  </p>\n\n  <p>\n    Участие граждан,\n    подготовка предложений\n    в области государственной политики\n    и институциональное сотрудничество\n    являются важной основой\n    для будущего международного взаимодействия.\n  </p>\n</section>\n\n\u003c!-- ФИЛЬТРЫ -->\n\n<nav class=\"filters\"\n     aria-label=\"Фильтр хронологии по организациям\">\n\n  <button\n    type=\"button\"\n    class=\"active\"\n    data-type=\"all\"\n    aria-pressed=\"true\">\n    Все события\n  </button>\n\n  <button\n    type=\"button\"\n    data-type=\"government\"\n    aria-pressed=\"false\">\n    Правительство Республики Корея\n  </button>\n\n  <button\n    type=\"button\"\n    data-type=\"gyeonggi\"\n    aria-pressed=\"false\">\n    Провинция Кёнгидо\n  </button>\n\n  <button\n    type=\"button\"\n    data-type=\"goyang\"\n    aria-pressed=\"false\">\n    Особый город Коян\n  </button>\n\n  <button\n    type=\"button\"\n    data-type=\"civic\"\n    aria-pressed=\"false\">\n    Гражданский комитет содействия\n  </button>\n\n</nav>\n\n\u003c!-- ХРОНОЛОГИЯ -->\n\n<section>\n  <h2>\n    Основные этапы\n  </h2>\n\n  <div\n    class=\"timeline\"\n    id=\"timeline\"\n    aria-live=\"polite\">\n  </div>\n\n</section>\n\n\u003c!-- БУДУЩИЕ ПРИОРИТЕТЫ -->\n\n<section>\n\n  <h2>\n    Будущие приоритеты\n  </h2>\n\n  <div class=\"future\">\n    <h3>\n      Подготовка к оценке\n      при выборе места размещения\n    </h3>\n\n    <p>\n      Изучение официальных\n      правительственных объявлений\n      и критериев оценки,\n      а также представление\n      конкурентных преимуществ Кояна\n      и планов реализации\n      на основе объективных\n      подтверждающих данных.\n    </p>\n  </div>\n\n  <div class=\"future\">\n    <h3>\n      Подготовка к первоначальному размещению\n      международных организаций\n    </h3>\n\n    <p>\n      Разработка практических предложений\n      по офисным помещениям,\n      жилищным условиям,\n      медицинскому обслуживанию,\n      образованию,\n      транспорту\n      и другим услугам,\n      которые могут потребоваться\n      участвующим учреждениям.\n    </p>\n  </div>\n\n  <div class=\"future\">\n    <h3>\n      Подготовка пилотных проектов ИИ\n      в общественных интересах\n    </h3>\n\n    <p>\n      Изучение осуществимости\n      потенциальных проектов сотрудничества\n      в области применения ИИ\n      для оказания основных\n      медицинских услуг\n      и реагирования\n      на комплексные кризисы.\n    </p>\n\n    <p>\n      Определение потенциальных\n      партнёрских учреждений\n      и оценка требований\n      к реализации проектов.\n    </p>\n  </div>\n\n  <div class=\"note\">\n    <strong>\n      Важное уведомление\n    </strong>\n\n    <p>\n      Будущие сроки реализации\n      могут изменяться\n      в зависимости от официальных\n      правительственных объявлений\n      и институциональных решений.\n    </p>\n\n    <p>\n      На этой странице обобщены\n      основные события\n      и направления деятельности.\n      Это не означает,\n      что все будущие планы\n      или институциональные договорённости\n      получили официальное подтверждение.\n    </p>\n  </div>\n\n  <a href=\"strategy.html?lang=ru\" class=\"button\">\n    Стратегия привлечения Глобального центра ИИ\n  </a>\n\n  <a href=\"committee.html?lang=ru\" class=\"button\">\n    О Гражданском комитете содействия\n  </a>\n\n</section>\n\n</main>\n\n<footer>\n\n  <p>\n    <strong>\n      Гражданский комитет содействия<br>\n      размещению Глобального центра ИИ<br>\n      в особом городе Коян\n    </strong>\n  </p>\n\n  <p>\n    Вместе с гражданами,\n    вместе с провинцией Кёнгидо<br>\n    и вместе со всем миром.\n  </p>\n\n  <p>\n    <a href=\"index.html?lang=ru\">\n      Главная страница\n    </a>\n    &nbsp; | &nbsp;\n    <a href=\"history.html\" lang=\"ko\">\n      한국어\n    </a>\n  </p>\n\n</footer>\n\n\u003cscript>\n\n/* =========================================\n   ДАННЫЕ ХРОНОЛОГИИ\n========================================= */\n\nconst events = [\n\n  {\n    date: \"2026.03.10\",\n    type: \"government\",\n    label: \"Правительство Республики Корея\",\n    title: \"Правительственное объявление об инициативе «Глобальный центр ИИ»\",\n    description:\n      \"Активизировались обсуждения и подготовительные мероприятия на правительственном уровне, связанные с инициативой «Глобальный центр ИИ».\"\n  },\n\n  {\n    date: \"2026.03.16\",\n    type: \"government\",\n    label: \"Правительство Республики Корея\",\n    title: \"Встреча премьер-министра с представителями ООН\",\n    description:\n      \"Состоялись обсуждения международного сотрудничества, связанного с инициативой «Глобальный центр ИИ».\"\n  },\n\n  {\n    date: \"2026.03.17\",\n    type: \"government\",\n    label: \"Правительство Республики Корея\",\n    title: \"Письма о намерениях между правительством и международными организациями\",\n    description:\n      \"Предпринимались усилия по заключению писем о намерениях относительно сотрудничества в рамках инициативы «Глобальный центр ИИ».\"\n  },\n\n  {\n    date: \"2026.04.09\",\n    type: \"government\",\n    label: \"Правительство Республики Корея\",\n    title: \"Поручение премьер-министра по инициативе «Глобальный центр ИИ»\",\n    description:\n      \"Была создана институциональная основа для межведомственного сотрудничества по инициативе «Глобальный центр ИИ».\"\n  },\n\n  {\n    date: \"2026.05.21\",\n    type: \"government\",\n    label: \"Правительство Республики Корея\",\n    title: \"Совместное заявление международных организаций и многосторонних банков развития\",\n    description:\n      \"Было опубликовано совместное заявление о сотрудничестве девяти международных организаций и пяти многосторонних банков развития.\"\n  },\n\n  {\n    date: \"2026.09.07\",\n    type: \"civic\",\n    label: \"Гражданский комитет содействия\",\n    title: \"Официальное открытие Гражданского комитета содействия\",\n    description:\n      \"В Выставочном центре цветов в парке озера Коян началась гражданская кампания в поддержку привлечения Глобального центра ИИ.\"\n  },\n\n  {\n    date: \"2026.10.12\",\n    type: \"gyeonggi\",\n    label: \"Провинция Кёнгидо\",\n    title: \"Создание рабочей группы провинции Кёнгидо по поддержке привлечения Глобального центра ИИ\",\n    description:\n      \"Была создана провинциальная рабочая группа для поддержки разработки стратегии привлечения и институционального сотрудничества.\"\n  },\n\n  {\n    date: \"2026.10.14\",\n    type: \"government\",\n    label: \"Правительство Республики Корея\",\n    title: \"Общественные слушания по критериям оценки при выборе места размещения\",\n    description:\n      \"В Конгресс-центре Седжона был представлен и обсуждён проект критериев оценки мест размещения Глобального центра ИИ.\"\n  },\n\n  {\n    date: \"2026.10.15\",\n    type: \"civic\",\n    label: \"Гражданский комитет содействия\",\n    title: \"Рекомендации по совершенствованию критериев оценки при выборе места размещения\",\n    description:\n      \"Были подготовлены рекомендации по условиям первоначального размещения, поддержке со стороны местного сообщества и пилотным проектам ИИ в общественных интересах.\"\n  },\n\n  {\n    date: \"2026.10.20\",\n    type: \"civic\",\n    label: \"Гражданский комитет содействия\",\n    title: \"Участие в 7-м семинаре по инновационной стратегии Кояна\",\n    description:\n      \"Участники подчеркнули важность завершения разработки стратегии привлечения, обращения за институциональной поддержкой, формирования структуры реализации и обеспечения подтверждающих данных.\"\n  },\n\n  {\n    date: \"2026.10.26\",\n    type: \"goyang\",\n    label: \"Особый город Коян\",\n    title: \"Резолюция городского совета Кояна в поддержку привлечения Глобального центра ИИ\",\n    description:\n      \"Городской совет единогласно принял резолюцию с призывом привлечь Глобальный центр ИИ при участии всех членов совета.\"\n  },\n\n  {\n    date: \"2026.10.30\",\n    type: \"gyeonggi\",\n    label: \"Провинция Кёнгидо\",\n    title: \"Форум провинции Кёнгидо по стратегии привлечения Глобального центра ИИ\",\n    description:\n      \"В выставочном комплексе KINTEX в особом городе Коян состоялся форум, посвящённый стратегиям привлечения и международному сотрудничеству.\"\n  }\n\n];\n\n/* =========================================\n   ТЕКУЩИЙ ФИЛЬТР\n========================================= */\n\nlet currentType = \"all\";\n\n/* =========================================\n   ОТОБРАЖЕНИЕ ХРОНОЛОГИИ\n========================================= */\n\nfunction renderTimeline() {\n\n  const timeline = document.getElementById(\"timeline\");\n\n  timeline.innerHTML = \"\";\n\n  const filtered = events\n    .filter(event =>\n      currentType === \"all\" ||\n      event.type === currentType\n    )\n    .sort((a, b) =>\n      a.date.localeCompare(b.date)\n    );\n\n  filtered.forEach(event => {\n\n    const item = document.createElement(\"article\");\n    item.className = \"event\";\n\n    const date = document.createElement(\"div\");\n    date.className = \"date\";\n    date.textContent = event.date;\n\n    const type = document.createElement(\"span\");\n    type.className = \"type\";\n    type.textContent = event.label;\n\n    const title = document.createElement(\"h3\");\n    title.textContent = event.title;\n\n    const description = document.createElement(\"p\");\n    description.textContent = event.description;\n\n    item.appendChild(date);\n    item.appendChild(type);\n    item.appendChild(title);\n    item.appendChild(description);\n\n    timeline.appendChild(item);\n\n  });\n\n}\n\n/* =========================================\n   ОБРАБОТКА КНОПОК ФИЛЬТРА\n========================================= */\n\ndocument.querySelectorAll(\"[data-type]\").forEach(button => {\n\n  button.addEventListener(\"click\", () => {\n\n    currentType = button.dataset.type;\n\n    document.querySelectorAll(\"[data-type]\")\n      .forEach(btn => {\n\n        const isActive =\n          btn.dataset.type === currentType;\n\n        btn.classList.toggle(\n          \"active\",\n          isActive\n        );\n\n        btn.setAttribute(\n          \"aria-pressed\",\n          String(isActive)\n        );\n\n      });\n\n    renderTimeline();\n\n  });\n\n});\n\n/* =========================================\n   ПЕРВОНАЧАЛЬНОЕ ОТОБРАЖЕНИЕ\n========================================= */\n\nrenderTimeline();\n\n\u003c/script>\n\n</body>\n</html>\n",
