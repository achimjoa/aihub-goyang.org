    경기도 글로벌 AI 허브 유치<br>\n    고양특례시 범시민추진위원회\n  </p>\n\n  \n</header>\n\n<main>\n\n<section>\n  <div class=\"slogan\">\n    고양시에 성장동력을 달라!<br>\n    고양시에 일자리를 달라!<br>\n    글로벌 AI 허브는 고양특례시로!\n  </div>\n</section>\n\n<section>\n  <h2>위원회 설립 목적</h2>\n\n  <p>\n    경기도 글로벌 AI 허브 유치\n    고양특례시 범시민추진위원회는\n    고양특례시의 새로운 성장동력 확보와\n    양질의 일자리 창출, 지역경제 활성화 및\n    국제협력도시로의 도약을 위해\n    시민의 뜻과 역량을 모으는\n    시민사회 추진조직입니다.\n  </p>\n\n  <p>\n    위원회는 글로벌 AI 허브가\n    고양특례시에 유치될 수 있도록\n    시민 공감대를 형성하고,\n    정책 연구와 유치 전략 개발,\n    관계기관 협력 및 시민참여 운동을\n    추진합니다.\n  </p>\n\n  <p>\n    글로벌 AI 허브는\n    국제기구의 사무공간을 마련하는 데\n    그치는 사업이 아니라,\n    인공지능을 활용하여\n    인류 공동의 문제 해결에 기여하는\n    국제협력 거점으로 발전해야 합니다.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      시민의 참여로 유치 기반을 넓히고,\n      실현 가능한 정책과 협력으로\n      고양특례시의 새로운 미래를 준비하겠습니다.\n    </strong>\n  </div>\n</section>\n\n<section>\n  <h2>위원회 운영 방향</h2>\n\n  <p>\n    범시민추진위원회는\n    시민의 자발적인 참여를 바탕으로\n    공공성과 투명성을 확보하고,\n    실현 가능한 정책과 객관적인 자료에 근거하여\n    글로벌 AI 허브 유치운동을 추진합니다.\n  </p>\n\n  <div class=\"principles\">\n\n    <article class=\"principle-card\">\n      <h3>① 시민 중심의 참여</h3>\n      <p>\n        시민과 시민사회단체,\n        전문가와 지역 기업 등\n        다양한 주체가 자발적으로 참여하는\n        범시민 유치운동을 추진합니다.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>② 정책과 근거 중심</h3>\n      <p>\n        객관적인 자료와 정책 연구를 바탕으로\n        고양특례시의 유치 경쟁력을 분석하고\n        실현 가능한 대안을 제시합니다.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>③ 폭넓은 협력</h3>\n      <p>\n        고양특례시와 경기도,\n        정부 및 관계기관,\n        대학과 연구기관,\n        기업 및 시민사회와\n        협력 기반을 확대합니다.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>④ 공공성과 투명성</h3>\n      <p>\n        시민의 신뢰를 바탕으로\n        위원회 활동과 주요 추진 상황을\n        공개하고 책임 있는 운영을 지향합니다.\n      </p>\n    </article>\n\n  </div>\n</section>\n\n<section>\n  <h2>주요 추진 사업</h2>\n\n  <div class=\"principles\">\n\n    <article class=\"principle-card\">\n      <h3>시민 공감대 확산</h3>\n      <p>\n        온라인 서명과 홍보활동,\n        시민 소통을 통해\n        글로벌 AI 허브 유치의 필요성을 알리고\n        시민의 뜻을 모읍니다.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>유치 정책 연구</h3>\n      <p>\n        고양특례시의 도시 자산과\n        국제협력 수요를 분석하여\n        경쟁력 있는 유치 전략과\n        정책 대안을 제안합니다.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>협력 기반 확대</h3>\n      <p>\n        공공기관, 의료기관,\n        대학, 연구기관 및 기업 등과\n        협력 가능성을 검토하고\n        국제협력 기반을 넓힙니다.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>지역 발전 기회 확대</h3>\n      <p>\n        글로벌 AI 허브 유치를\n        연구개발과 산업 활동,\n        청년 일자리 및 지역경제 성장의\n        기회로 연결할 수 있는\n        정책 방향을 모색합니다.\n      </p>\n    </article>\n\n  </div>\n\n  <p>\n    위 사업들은 위원회의 추진 방향과\n    정책 목표를 설명한 것으로,\n    국제기구의 입주나 개별 협력사업의\n    확정을 의미하지 않습니다.\n  </p>\n</section>\n\n<section>\n  <h2>위원장 인사말</h2>\n\n  <div class=\"greeting\">\n\n    <p>존경하는 고양특례시민 여러분!</p>\n\n    <p>\n      우리는 지금 고양특례시의 미래를 결정할\n      중요한 기회 앞에 서 있습니다.\n    </p>\n\n    <p>\n      지난 수십 년 동안 고양특례시는\n      수도권의 대표적인 주거도시로 성장했지만,\n      시민들이 기대하는 양질의 일자리와\n      지속가능한 성장동력을 충분히 확보하지 못했습니다.\n    </p>\n\n    <p>\n      글로벌 AI 허브 유치는\n      이러한 도시의 구조적 과제를 해결하고\n      고양특례시가 세계와 협력하는\n      국제도시로 도약할 수 있는 기회입니다.\n    </p>\n\n    <p>\n      그러나 글로벌 AI 허브는\n      단순히 국제기구의 사무실을 유치하는\n      사업이어서는 안 됩니다.\n    </p>\n\n    <p>\n      인공지능을 활용하여\n      질병과 기아, 기후위기와 재난,\n      난민과 이주, 실업과 교육격차 등\n      인류가 직면한 문제를 해결하는 데\n      기여해야 합니다.\n    </p>\n\n    <p>\n      고양특례시는 이러한 국제협력에\n      필요한 다양한 자산을 갖추고 있습니다.\n      중요한 것은 그 자산을 실제로 활용할 수 있는\n      구체적이고 실현 가능한 계획을\n      마련하는 것입니다.\n    </p>\n\n    <p>\n      우리 범시민추진위원회는\n      시민들의 열망을 모으는 데 그치지 않고,\n      정책을 연구하고 협력을 조직하며\n      실질적인 준비와 성과를 만들어가겠습니다.\n    </p>\n\n    <p>\n      경기도 시민사회는 연대하고,\n      도민은 단결합시다.\n    </p>\n\n    <p>\n      고양특례시의 미래를 위해,\n      그리고 인류의 더 나은 미래를 위해\n      함께해 주십시오.\n    </p>\n\n    <p>감사합니다.</p>\n\n    <div class=\"signature\">\n      경기도 글로벌 AI 허브 유치<br>\n      고양특례시 범시민추진위원회<br>\n      위원장 홍영표\n    </div>\n\n  </div>\n</section>\n\n<section>\n  <h2>범시민추진위원회 조직도</h2>\n\n  <p>\n    다양한 분야의 시민사회가 참여하여\n    글로벌 AI 허브 고양특례시 유치를\n    추진하고 있습니다.\n  </p>\n\n  <a\n    href=\"committee-chart.jpg\"\n    target=\"_blank\"\n    rel=\"noopener noreferrer\">\n\n    <img\n      class=\"chart\"\n      src=\"committee-chart.jpg\"\n      alt=\"글로벌 AI 허브 유치 범시민추진위원회 조직도\"\n      loading=\"lazy\">\n\n  </a>\n\n  <p class=\"chart-link\">\n    조직도를 누르면 크게 볼 수 있습니다.\n  </p>\n</section>\n\n<section>\n  <h2>주요 추진 경과</h2>\n\n  <div class=\"timeline\">\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">2026.09.07</div>\n      <div>글로벌 AI 허브 유치 범시민추진위원회 발대식</div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">2026.10.14</div>\n      <div>글로벌 AI 허브 입지 선정 평가기준 공청회</div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">2026.10.15</div>\n      <div>글로벌 AI 허브 입지 선정 평가기준 개선 건의서 작성</div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">2026.10.20</div>\n      <div>제7회 고양혁신전략세미나 참여</div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">2026.10.26</div>\n      <div>고양특례시의회 글로벌 AI 허브 유치 촉구 결의</div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">2026.10.30</div>\n      <div>경기도 글로벌 AI 허브 유치전략 포럼</div>\n    </div>\n\n  </div>\n</section>\n\n<section>\n  <h2>시민 여러분의 참여를 기다립니다</h2>\n\n  <p>\n    글로벌 AI 허브 유치는\n    고양특례시의 미래 성장 기회를 확대하고\n    국제협력도시로 도약하기 위한\n    시민사회의 공동 과제입니다.\n  </p>\n\n  <p>\n    온라인 유치 동의 서명과\n    범시민추진위원 등록,\n    후원회원 가입 및 홍보활동에\n    함께해 주십시오.\n  </p>\n\n  <a href=\"participate.html\" class=\"button\">\n    시민참여센터 바로가기\n  </a>\n</section>\n\n</main>\n\n<footer>\n  <p>\n    경기도 글로벌 AI 허브 유치<br>\n    고양특례시 범시민추진위원회\n  </p>\n\n  <p>\n    시민의 힘으로, 경기도의 역량으로, 세계와 함께!\n  </p>\n</footer>\n\n</body>\n</html>\n",
  "lang=ar": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nحول اللجنة المدنية الداعمة |\nمبادرة المركز العالمي للذكاء الاصطناعي\n</title>\n\n<meta\n  name=\"description\"\n  content=\"تعرف على اللجنة المدنية لدعم استقطاب المركز العالمي للذكاء الاصطناعي إلى مدينة غويانغ الخاصة، بما في ذلك أهدافها ومبادئها وأنشطتها وكلمة رئيس اللجنة وهيكلها التنظيمي وأبرز محطاتها.\"\n>\n\n<style>\n\n/* =====================================\n   BASIC SETTINGS\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  direction: rtl;\n  font-family:\n    Tahoma,\n    Arial,\n    \"Noto Naskh Arabic\",\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.9;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   HEADER\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n  line-height: 1.5;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n/* =====================================\n   MAIN\n===================================== */\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   SLOGAN\n===================================== */\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.8;\n}\n\n/* =====================================\n   GREETING\n===================================== */\n\n.greeting {\n  font-size: 17px;\n}\n\n.greeting p {\n  margin-bottom: 20px;\n}\n\n.signature {\n  text-align: right;\n  margin-top: 30px;\n  font-weight: bold;\n}\n\n/* =====================================\n   ORGANIZATIONAL CHART\n===================================== */\n\n.chart {\n  display: block;\n  width: 100%;\n  height: auto;\n  border-radius: 8px;\n  cursor: zoom-in;\n}\n\n.chart-link {\n  display: block;\n  text-align: center;\n  margin-top: 15px;\n  color: #0754a6;\n}\n\n/* =====================================\n   TIMELINE RTL\n===================================== */\n\n.timeline {\n  border-right: 4px solid #168de0;\n  border-left: none;\n  padding-right: 25px;\n  padding-left: 0;\n}\n\n.timeline-item {\n  margin-bottom: 25px;\n}\n\n.timeline-date {\n  font-weight: bold;\n  color: #0754a6;\n}\n\n/* =====================================\n   BUTTONS\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 0 0 10px;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   PRINCIPLES\n===================================== */\n\n.principles {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(230px, 1fr));\n  gap: 18px;\n}\n\n.principle-card {\n  background: #f4f8fc;\n  padding: 22px;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.principle-card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   HIGHLIGHT\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-right: 5px solid #168de0;\n  border-left: none;\n  padding: 22px;\n  border-radius: 8px;\n  margin-top: 20px;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* =====================================\n   FOOTER\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .greeting {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-left: 0;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header>\n\n<h1>\nحول اللجنة المدنية الداعمة\n</h1>\n\n<p>\nاللجنة المدنية لدعم استقطاب<br>\nالمركز العالمي للذكاء الاصطناعي<br>\nإلى مدينة غويانغ الخاصة\n</p>\n\n<p>\nمقاطعة غيونغي، جمهورية كوريا\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ar\"\n  class=\"home-link\"\n>\n→ الصفحة الرئيسية العربية\n</a>\n\n<a\n  href=\"committee.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     SLOGAN\n===================================== -->\n\n<section>\n\n<div class=\"slogan\">\n\nمحرك جديد للنمو في غويانغ.<br>\nفرص جديدة للتوظيف.<br>\nمركز عالمي للذكاء الاصطناعي من أجل التعاون الدولي.\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     1. PURPOSE\n===================================== -->\n\n<section>\n\n<h2>\n1. أهداف اللجنة المدنية\n</h2>\n\n<p>\nاللجنة المدنية لدعم استقطاب\nالمركز العالمي للذكاء الاصطناعي\nإلى مدينة غويانغ الخاصة\nهي مبادرة يقودها المجتمع المدني،\nأُنشئت لجمع المواطنين\nوالجهات المعنية في المجتمع المحلي\nلدعم التنمية المستقبلية\nلمدينة غويانغ.\n</p>\n\n<p>\nتسعى اللجنة إلى المساهمة\nفي تطوير فرص جديدة للنمو،\nوتوفير فرص عمل عالية الجودة،\nوتعزيز الحيوية الاقتصادية الإقليمية،\nودعم إمكانات غويانغ\nبوصفها مدينة للتعاون الدولي.\n</p>\n\n<p>\nتشمل أنشطتها\nتعزيز الوعي العام،\nوإجراء البحوث المتعلقة بالسياسات،\nوتطوير استراتيجيات الاستقطاب،\nوتشجيع التعاون المؤسسي،\nوتعزيز مشاركة المواطنين.\n</p>\n\n<p>\nتؤمن اللجنة\nبأن المركز العالمي للذكاء الاصطناعي\nيجب أن يكون أكثر\nمن مجرد موقع\nلمكاتب المنظمات الدولية.\n</p>\n\n<p>\nبل ينبغي أن يتطور\nإلى منصة للتعاون الدولي\nتستكشف التطبيقات المسؤولة\nللذكاء الاصطناعي\nلمواجهة التحديات العالمية المشتركة.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nمن خلال مشاركة المواطنين،\nومقترحات السياسات القائمة على الأدلة،\nوالتعاون البنّاء،\nتسعى اللجنة إلى المساهمة\nفي إعداد مستقبل جديد\nلمدينة غويانغ الخاصة.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     2. PRINCIPLES\n===================================== -->\n\n<section>\n\n<h2>\n2. المبادئ التوجيهية\n</h2>\n\n<p>\nتعزز اللجنة\nالمشاركة المدنية الطوعية،\nوالمساءلة العامة،\nوالشفافية،\nوتطوير السياسات\nالقائمة على الأدلة.\n</p>\n\n<div class=\"principles\">\n\n\u003c!-- PRINCIPLE 1 -->\n\n<article class=\"principle-card\">\n\n<h3>\n01. المشاركة المرتكزة على المواطنين\n</h3>\n\n<p>\nتشجيع المشاركة الطوعية\nللمواطنين،\nوالمنظمات المدنية،\nوالخبراء،\nوالشركات المحلية،\nوغيرهم من الجهات المعنية\nفي المجتمع المحلي.\n</p>\n\n</article>\n\n\u003c!-- PRINCIPLE 2 -->\n\n<article class=\"principle-card\">\n\n<h3>\n02. السياسات القائمة على الأدلة\n</h3>\n\n<p>\nتحليل المزايا الجغرافية\nلمدينة غويانغ\nباستخدام المعلومات الموضوعية\nوالبحوث المتعلقة بالسياسات،\nوتطوير مقترحات عملية\nلمبادرة المركز العالمي للذكاء الاصطناعي.\n</p>\n\n</article>\n\n\u003c!-- PRINCIPLE 3 -->\n\n<article class=\"principle-card\">\n\n<h3>\n03. التعاون المؤسسي الواسع\n</h3>\n\n<p>\nاستكشاف فرص التعاون\nمع مدينة غويانغ الخاصة،\nومقاطعة غيونغي،\nوالسلطات الوطنية المعنية،\nوالجامعات،\nوالمؤسسات البحثية،\nوالشركات،\nوالمجتمع المدني.\n</p>\n\n</article>\n\n\u003c!-- PRINCIPLE 4 -->\n\n<article class=\"principle-card\">\n\n<h3>\n04. الشفافية والمساءلة\n</h3>\n\n<p>\nتعزيز العمليات المسؤولة،\nوالتواصل العام،\nوالشفافية\nفي أنشطة اللجنة\nوتطوراتها الرئيسية.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. ACTIVITIES\n===================================== -->\n\n<section>\n\n<h2>\n3. الأنشطة الرئيسية\n</h2>\n\n<div class=\"principles\">\n\n\u003c!-- ACTIVITY 1 -->\n\n<article class=\"principle-card\">\n\n<h3>\nالتوعية العامة والمشاركة\n</h3>\n\n<p>\nتعزيز فهم الجمهور\nلمبادرة المركز العالمي للذكاء الاصطناعي\nمن خلال التعبير عن الدعم عبر الإنترنت،\nوأنشطة التواصل المجتمعي،\nوالاتصال بالمواطنين.\n</p>\n\n</article>\n\n\u003c!-- ACTIVITY 2 -->\n\n<article class=\"principle-card\">\n\n<h3>\nالبحوث والمقترحات المتعلقة بالسياسات\n</h3>\n\n<p>\nتقييم الموارد الحضرية\nلمدينة غويانغ\nوالمتطلبات المحتملة\nللتعاون الدولي،\nبهدف تطوير استراتيجيات\nاستقطاب تنافسية\nوتوصيات عملية للسياسات.\n</p>\n\n</article>\n\n\u003c!-- ACTIVITY 3 -->\n\n<article class=\"principle-card\">\n\n<h3>\nتوسيع التعاون\n</h3>\n\n<p>\nاستكشاف فرص التعاون\nمع المؤسسات العامة،\nوالمؤسسات الصحية،\nوالجامعات،\nوالمؤسسات البحثية،\nوالشركات.\n</p>\n\n</article>\n\n\u003c!-- ACTIVITY 4 -->\n\n<article class=\"principle-card\">\n\n<h3>\nفرص التنمية الإقليمية\n</h3>\n\n<p>\nدراسة سبل ربط\nالمركز العالمي المقترح للذكاء الاصطناعي\nبالبحث والتطوير،\nوالأنشطة الصناعية،\nوتوظيف الشباب،\nوالنمو الإقليمي المستدام.\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\nتصف هذه الأنشطة\nأهداف اللجنة\nواتجاهاتها المقترحة.\nولا تعني وجود قرارات مؤكدة\nبشأن انتقال المؤسسات،\nأو شراكات مؤسسية رسمية،\nأو مشاريع معتمدة.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     4. CHAIRPERSON MESSAGE\n===================================== -->\n\n<section>\n\n<h2>\n4. كلمة رئيس اللجنة\n</h2>\n\n<div class=\"greeting\">\n\n<p>\nأعزائي مواطني مدينة غويانغ الخاصة،\n</p>\n\n<p>\nنقف اليوم أمام لحظة مهمة\nيمكن أن تسهم\nفي رسم مستقبل\nمدينة غويانغ الخاصة.\n</p>\n\n<p>\nعلى مدى العقود الماضية،\nتطورت غويانغ\nلتصبح مدينة سكنية رئيسية\nفي منطقة العاصمة سيول.\nومع ذلك،\nلم تتمكن المدينة بعد\nمن توفير فرص عمل عالية الجودة\nومحركات نمو مستدامة\nبالمستوى الذي يلبي\nتطلعات مواطنيها.\n</p>\n\n<p>\nيمثل المركز العالمي المقترح\nللذكاء الاصطناعي\nفرصة لمعالجة\nهذه التحديات الهيكلية،\nوالمساهمة في تطوير غويانغ\nلتصبح مدينة\nذات روابط دولية واسعة.\n</p>\n\n<p>\nومع ذلك،\nيجب ألا يتحول\nالمركز العالمي للذكاء الاصطناعي\nإلى مجرد مشروع\nلاستقطاب مكاتب\nالمنظمات الدولية.\n</p>\n\n<p>\nبل ينبغي أن يسهم\nفي مواجهة التحديات\nالتي تواجه البشرية،\nبما في ذلك الأمراض والجوع،\nوتغير المناخ والكوارث،\nواللاجئون والهجرة،\nوالبطالة،\nوعدم المساواة التعليمية،\nمن خلال التطبيقات المسؤولة\nللذكاء الاصطناعي.\n</p>\n\n<p>\nتمتلك مدينة غويانغ الخاصة\nمجموعة متنوعة من الموارد\nالتي يمكن أن تدعم\nالتعاون الدولي.\nوما يهم الآن\nهو تطوير خطط ملموسة،\nوعملية،\nوقابلة للتحقيق،\nللاستفادة الفعالة\nمن هذه الموارد.\n</p>\n\n<p>\nلن تكتفي لجنتنا المدنية\nبجمع الحماس الشعبي.\nبل سنعمل على دراسة\nالخيارات المتعلقة بالسياسات،\nوتشجيع التعاون،\nوالسعي نحو الاستعداد الجاد\nوتحقيق نتائج ملموسة.\n</p>\n\n<p>\nفلنعمل معاً\nمن خلال المجتمع المدني\nفي جميع أنحاء مقاطعة غيونغي،\nوليتحد المواطنون\nحول رؤية مشتركة.\n</p>\n\n<p>\nمن أجل مستقبل\nمدينة غويانغ الخاصة،\nومن أجل مستقبل أفضل\nللبشرية،\nأدعوكم إلى الانضمام إلينا.\n</p>\n\n<p>\nشكراً لكم.\n</p>\n\n<div class=\"signature\">\n\nهونغ يونغ بيو<br>\nرئيس اللجنة<br>\nاللجنة المدنية لدعم استقطاب<br>\nالمركز العالمي للذكاء الاصطناعي<br>\nإلى مدينة غويانغ الخاصة\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     5. ORGANIZATIONAL CHART\n===================================== -->\n\n<section>\n\n<h2>\n5. الهيكل التنظيمي\n</h2>\n\n<p>\nتجمع اللجنة مشاركين\nمن مختلف مجالات المجتمع المدني\nلدعم مبادرة المركز العالمي\nالمقترح للذكاء الاصطناعي\nفي مدينة غويانغ الخاصة.\n</p>\n\n<a\n  href=\"committee-chart.jpg\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n\n<img\n  class=\"chart\"\n  src=\"committee-chart.jpg\"\n  alt=\"الهيكل التنظيمي للجنة المدنية لدعم استقطاب المركز العالمي للذكاء الاصطناعي إلى مدينة غويانغ الخاصة\"\n  loading=\"lazy\"\n>\n\n</a>\n\n<p class=\"chart-link\">\nاضغط على المخطط التنظيمي\nلعرض صورة أكبر.\n</p>\n\n<p class=\"note\">\nالمخطط التنظيمي\nمتاح باللغة الكورية.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     6. TIMELINE\n===================================== -->\n\n<section>\n\n<h2>\n6. أبرز المحطات والإنجازات\n</h2>\n\n<div class=\"timeline\">\n\n\u003c!-- MILESTONE 1 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n7 سبتمبر 2026\n</div>\n\n<div>\nحفل تدشين\nاللجنة المدنية لدعم استقطاب\nالمركز العالمي للذكاء الاصطناعي.\n</div>\n\n</div>\n\n\u003c!-- MILESTONE 2 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n14 أكتوبر 2026\n</div>\n\n<div>\nجلسة استماع عامة\nبشأن معايير تقييم\nاختيار موقع\nالمركز العالمي للذكاء الاصطناعي.\n</div>\n\n</div>\n\n\u003c!-- MILESTONE 3 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n15 أكتوبر 2026\n</div>\n\n<div>\nإعداد توصيات\nلتحسين معايير تقييم\nاختيار موقع\nالمركز العالمي للذكاء الاصطناعي.\n</div>\n\n</div>\n\n\u003c!-- MILESTONE 4 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n20 أكتوبر 2026\n</div>\n\n<div>\nالمشاركة في الندوة السابعة\nلاستراتيجية الابتكار\nفي مدينة غويانغ.\n</div>\n\n</div>\n\n\u003c!-- MILESTONE 5 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n26 أكتوبر 2026\n</div>\n\n<div>\nاعتماد مجلس مدينة غويانغ الخاصة\nقراراً يدعو إلى استقطاب\nالمركز العالمي للذكاء الاصطناعي.\n</div>\n\n</div>\n\n\u003c!-- MILESTONE 6 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n30 أكتوبر 2026\n</div>\n\n<div>\nمنتدى استراتيجية\nاستقطاب المركز العالمي\nللذكاء الاصطناعي\nفي مقاطعة غيونغي.\n</div>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nتعكس المحطات المذكورة أعلاه\nالأنشطة والتطورات\nالواردة في النسخة الكورية\nمن صفحة التعريف باللجنة.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     7. PARTICIPATION\n===================================== -->\n\n<section>\n\n<h2>\n7. مشاركة المواطنين\n</h2>\n\n<p>\nالمركز العالمي المقترح\nللذكاء الاصطناعي\nهو مبادرة مدنية مشتركة\nتهدف إلى توسيع\nفرص النمو المستقبلية\nلمدينة غويانغ،\nودعم تطورها\nبوصفها مدينة للتعاون الدولي.\n</p>\n\n<p>\nيُشجَّع المواطنون\nعلى المشاركة\nمن خلال التعبير عن الدعم عبر الإنترنت،\nوالتسجيل في اللجنة،\nوالعضوية الداعمة،\nوأنشطة التوعية العامة.\n</p>\n\n<a\n  href=\"participate.html?lang=ar\"\n  class=\"button\"\n>\nمركز المشاركة المدنية\n</a>\n\n<a\n  href=\"index.html?lang=ar\"\n  class=\"button\"\n>\nالصفحة الرئيسية العربية\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. INSTITUTIONAL STATUS\n===================================== -->\n\n<section>\n\n<h2>\n8. الوضع المؤسسي\n</h2>\n\n<p>\nاللجنة المدنية الداعمة\nهي منظمة يقودها المجتمع المدني\nوتدعم مبادرة المركز العالمي\nالمقترح للذكاء الاصطناعي\nفي مدينة غويانغ الخاصة.\n</p>\n\n<p>\nولا تُقدَّم اللجنة\nبوصفها منظمة دولية\nأو سلطة حكومية\nمسؤولة عن القرارات الرسمية\nالمتعلقة باختيار الموقع.\n</p>\n\n<p>\nوسيتطلب أي قرار مستقبلي\nبشأن المشاركة المؤسسية الرسمية،\nأو اختيار الموقع،\nأو تدابير الدعم العام،\nالحصول على الموافقات\nوفقاً لإجراءات\nالسلطات المعنية.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nتسعى اللجنة\nإلى المساهمة\nمن خلال المشاركة العامة،\nومقترحات السياسات البنّاءة،\nوالتعاون المسؤول.\n</strong>\n\n</div>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n\n<strong>\nاللجنة المدنية لدعم استقطاب<br>\nالمركز العالمي للذكاء الاصطناعي<br>\nإلى مدينة غويانغ الخاصة\n</strong>\n\n</p>\n\n<p>\nمقاطعة غيونغي، جمهورية كوريا\n</p>\n\n<p>\nمع المواطنين،\nومع مقاطعة غيونغي،\nومع العالم.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ar\">\nالصفحة الرئيسية العربية\n</a>\n\n&nbsp; | &nbsp;\n\n<a\n  href=\"committee.html\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=de": "<!DOCTYPE html>\n<html lang=\"de\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nÜber das Bürgerkomitee |\nInitiative für ein globales KI-Zentrum\n</title>\n\n<meta name=\"description\"\ncontent=\"Erfahren Sie mehr über das Bürgerkomitee zur Förderung der Ansiedlung eines globalen KI-Zentrums in der Sonderstadt Goyang, seine Ziele, Grundsätze, Aktivitäten, die Botschaft des Vorsitzenden, die Organisationsstruktur und wichtige Meilensteine.\">\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n.greeting {\n  font-size: 17px;\n}\n\n.greeting p {\n  margin-bottom: 20px;\n}\n\n.signature {\n  text-align: right;\n  margin-top: 30px;\n  font-weight: bold;\n}\n\n.chart {\n  display: block;\n  width: 100%;\n  height: auto;\n  border-radius: 8px;\n  cursor: zoom-in;\n}\n\n.chart-link {\n  display: block;\n  text-align: center;\n  margin-top: 15px;\n  color: #0754a6;\n}\n\n.timeline {\n  border-left: 4px solid #168de0;\n  padding-left: 25px;\n}\n\n.timeline-item {\n  margin-bottom: 25px;\n}\n\n.timeline-date {\n  font-weight: bold;\n  color: #0754a6;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.principles {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(230px, 1fr));\n  gap: 18px;\n}\n\n.principle-card {\n  background: #f4f8fc;\n  padding: 22px;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.principle-card h3 {\n  margin-top: 0;\n}\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 22px;\n  border-radius: 8px;\n  margin-top: 20px;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .greeting {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n}\n</style>\n</head>\n\n<body>\n\n<header>\n  <h1>\n    Über das Bürgerkomitee\n  </h1>\n\n  <p>\n    Bürgerkomitee zur Förderung<br>\n    der Ansiedlung eines globalen KI-Zentrums<br>\n    in der Sonderstadt Goyang\n  </p>\n\n  <p>\n    Provinz Gyeonggi, Republik Korea\n  </p>\n\n  <div class=\"header-links\">\n    <a href=\"index.html?lang=de\" class=\"home-link\">\n      ← Deutsche Startseite\n    </a>\n  </div>\n</header>\n\n<main>\n\n\u003c!-- SLOGAN -->\n\n<section>\n  <div class=\"slogan\">\n    Ein neuer Wachstumsmotor für Goyang.<br>\n    Neue Beschäftigungsmöglichkeiten.<br>\n    Ein globales KI-Zentrum für internationale Zusammenarbeit.\n  </div>\n</section>\n\n\u003c!-- 1. ZIELE -->\n\n<section>\n  <h2>1. Ziele des Bürgerkomitees</h2>\n\n  <p>\n    Das Bürgerkomitee zur Förderung\n    der Ansiedlung eines globalen KI-Zentrums\n    in der Sonderstadt Goyang\n    ist eine von Bürgerinnen und Bürgern\n    getragene Initiative.\n  </p>\n\n  <p>\n    Es wurde gegründet,\n    um die Bevölkerung\n    und verschiedene gesellschaftliche Akteure\n    zusammenzubringen\n    und die zukünftige Entwicklung\n    der Sonderstadt Goyang zu unterstützen.\n  </p>\n\n  <p>\n    Das Komitee möchte\n    zur Schaffung neuer Wachstumschancen,\n    hochwertiger Arbeitsplätze,\n    einer lebendigen regionalen Wirtschaft\n    und zur Entwicklung Goyangs\n    als Stadt der internationalen Zusammenarbeit beitragen.\n  </p>\n\n  <p>\n    Zu seinen Aktivitäten gehören\n    die Förderung des öffentlichen Bewusstseins,\n    politische Forschung,\n    die Entwicklung von Ansiedlungsstrategien,\n    die Unterstützung institutioneller Zusammenarbeit\n    und die Förderung der Bürgerbeteiligung.\n  </p>\n\n  <p>\n    Das Komitee ist überzeugt,\n    dass das globale KI-Zentrum\n    mehr sein sollte\n    als ein Standort\n    für die Büros internationaler Organisationen.\n  </p>\n\n  <p>\n    Es sollte sich\n    zu einer internationalen Kooperationsplattform entwickeln,\n    die verantwortungsvolle Anwendungen\n    künstlicher Intelligenz untersucht,\n    um gemeinsame globale Herausforderungen\n    zu bewältigen.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      Durch Bürgerbeteiligung,\n      evidenzbasierte politische Vorschläge\n      und konstruktive Zusammenarbeit\n      möchte das Komitee dazu beitragen,\n      eine neue Zukunft\n      für die Sonderstadt Goyang vorzubereiten.\n    </strong>\n  </div>\n</section>\n\n\u003c!-- 2. GRUNDSÄTZE -->\n\n<section>\n  <h2>2. Leitprinzipien</h2>\n\n  <p>\n    Das Komitee setzt sich\n    für freiwilliges bürgerschaftliches Engagement,\n    öffentliche Rechenschaftspflicht,\n    Transparenz\n    und evidenzbasierte Politikentwicklung ein.\n  </p>\n\n  <div class=\"principles\">\n\n    <article class=\"principle-card\">\n      <h3>01. Bürgerorientierte Beteiligung</h3>\n      <p>\n        Förderung der freiwilligen Beteiligung\n        von Bürgerinnen und Bürgern,\n        zivilgesellschaftlichen Organisationen,\n        Fachleuten,\n        lokalen Unternehmen\n        und weiteren gesellschaftlichen Akteuren.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>02. Evidenzbasierte Politik</h3>\n      <p>\n        Analyse der Standortvorteile Goyangs\n        anhand objektiver Informationen\n        und politischer Forschung\n        sowie Entwicklung praktischer Vorschläge\n        für die Initiative eines globalen KI-Zentrums.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>03. Umfassende institutionelle Zusammenarbeit</h3>\n      <p>\n        Erkundung von Kooperationsmöglichkeiten\n        mit der Sonderstadt Goyang,\n        der Provinz Gyeonggi,\n        zuständigen nationalen Behörden,\n        Universitäten,\n        Forschungseinrichtungen,\n        Unternehmen\n        und der Zivilgesellschaft.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>04. Transparenz und Rechenschaftspflicht</h3>\n      <p>\n        Förderung verantwortungsvoller Abläufe,\n        öffentlicher Kommunikation\n        und Transparenz\n        bei den Aktivitäten\n        und wichtigen Entwicklungen des Komitees.\n      </p>\n    </article>\n\n  </div>\n</section>\n\n\u003c!-- 3. AKTIVITÄTEN -->\n\n<section>\n  <h2>3. Hauptaktivitäten</h2>\n\n  <div class=\"principles\">\n\n    <article class=\"principle-card\">\n      <h3>Öffentlichkeitsarbeit und Bürgerbeteiligung</h3>\n      <p>\n        Förderung des öffentlichen Verständnisses\n        für die Initiative eines globalen KI-Zentrums\n        durch Online-Unterstützungsbekundungen,\n        Informationskampagnen\n        und Kommunikation mit der Bevölkerung.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>Politische Forschung und Vorschläge</h3>\n      <p>\n        Bewertung der städtischen Ressourcen Goyangs\n        und möglicher Anforderungen\n        internationaler Zusammenarbeit,\n        um wettbewerbsfähige Ansiedlungsstrategien\n        und politische Empfehlungen zu entwickeln.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>Ausbau der Zusammenarbeit</h3>\n      <p>\n        Erkundung von Kooperationsmöglichkeiten\n        mit öffentlichen Institutionen,\n        Gesundheitseinrichtungen,\n        Universitäten,\n        Forschungseinrichtungen\n        und Unternehmen.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>Chancen für die Regionalentwicklung</h3>\n      <p>\n        Untersuchung von Möglichkeiten,\n        das geplante globale KI-Zentrum\n        mit Forschung und Entwicklung,\n        industriellen Aktivitäten,\n        Jugendbeschäftigung\n        und nachhaltigem regionalem Wachstum\n        zu verbinden.\n      </p>\n    </article>\n\n  </div>\n\n  <p class=\"note\">\n    Diese Aktivitäten beschreiben\n    die Ziele und vorgeschlagenen\n    Handlungsrichtungen des Komitees.\n    Sie bedeuten keine bestätigten\n    Standortverlagerungsentscheidungen,\n    formellen institutionellen Partnerschaften\n    oder genehmigten Projekte.\n  </p>\n</section>\n\n\u003c!-- 4. GRUSSWORT DES VORSITZENDEN -->\n\n<section>\n  <h2>4. Grußwort des Vorsitzenden</h2>\n\n  <div class=\"greeting\">\n\n    <p>\n      Sehr geehrte Bürgerinnen und Bürger\n      der Sonderstadt Goyang,\n    </p>\n\n    <p>\n      wir stehen an einem wichtigen Wendepunkt,\n      der die Zukunft\n      der Sonderstadt Goyang prägen könnte.\n    </p>\n\n    <p>\n      In den vergangenen Jahrzehnten\n      hat sich Goyang\n      zu einer bedeutenden Wohnstadt\n      innerhalb der Metropolregion Seoul entwickelt.\n      Dennoch verfügt die Stadt\n      noch nicht über ausreichend\n      hochwertige Beschäftigungsmöglichkeiten\n      und nachhaltige Wachstumsmotoren,\n      um den Erwartungen\n      ihrer Bürgerinnen und Bürger gerecht zu werden.\n    </p>\n\n    <p>\n      Das geplante globale KI-Zentrum\n      bietet eine Gelegenheit,\n      diese strukturellen Herausforderungen anzugehen\n      und Goyang dabei zu unterstützen,\n      sich zu einer international vernetzten Stadt\n      zu entwickeln.\n    </p>\n\n    <p>\n      Das globale KI-Zentrum darf jedoch\n      nicht lediglich zu einem Projekt werden,\n      das auf die Ansiedlung\n      von Büros internationaler Organisationen abzielt.\n    </p>\n\n    <p>\n      Es sollte dazu beitragen,\n      die Herausforderungen der Menschheit\n      zu bewältigen.\n      Dazu gehören Krankheiten und Hunger,\n      Klimawandel und Naturkatastrophen,\n      Flüchtlingsfragen und Migration,\n      Arbeitslosigkeit\n      sowie Bildungsungleichheit.\n    </p>\n\n    <p>\n      Durch den verantwortungsvollen Einsatz\n      künstlicher Intelligenz\n      können neue Wege zur Bewältigung\n      dieser Herausforderungen eröffnet werden.\n    </p>\n\n    <p>\n      Die Sonderstadt Goyang verfügt\n      über zahlreiche Ressourcen,\n      die internationale Zusammenarbeit\n      unterstützen könnten.\n      Entscheidend ist jetzt,\n      konkrete,\n      praktische\n      und realisierbare Pläne zu entwickeln,\n      um diese Ressourcen wirksam zu nutzen.\n    </p>\n\n    <p>\n      Unser Bürgerkomitee\n      wird sich nicht darauf beschränken,\n      öffentliche Begeisterung zu sammeln.\n      Wir werden politische Handlungsoptionen untersuchen,\n      die Zusammenarbeit fördern\n      und auf eine sinnvolle Vorbereitung\n      sowie greifbare Ergebnisse hinarbeiten.\n    </p>\n\n    <p>\n      Lassen Sie uns\n      die Zivilgesellschaft\n      in der gesamten Provinz Gyeonggi\n      zusammenbringen\n      und die Bürgerinnen und Bürger\n      um eine gemeinsame Vision vereinen.\n    </p>\n\n    <p>\n      Für die Zukunft\n      der Sonderstadt Goyang\n      und für eine bessere Zukunft\n      der Menschheit\n      lade ich Sie herzlich ein,\n      sich uns anzuschließen.\n    </p>\n\n    <p>\n      Vielen Dank.\n    </p>\n\n    <div class=\"signature\">\n      Hong Young-pyo<br>\n      Vorsitzender<br>\n      des Bürgerkomitees zur Förderung<br>\n      der Ansiedlung eines globalen KI-Zentrums<br>\n      in der Sonderstadt Goyang\n    </div>\n\n  </div>\n</section>\n\n\u003c!-- 5. ORGANISATIONSSTRUKTUR -->\n\n<section>\n  <h2>5. Organisationsstruktur</h2>\n\n  <p>\n    Das Komitee bringt\n    Teilnehmerinnen und Teilnehmer\n    aus verschiedenen Bereichen\n    der Zivilgesellschaft zusammen,\n    um die geplante Initiative\n    eines globalen KI-Zentrums\n    in der Sonderstadt Goyang zu unterstützen.\n  </p>\n\n  <a href=\"committee-chart.jpg\"\n     target=\"_blank\"\n     rel=\"noopener noreferrer\">\n\n    <img\n      class=\"chart\"\n      src=\"committee-chart.jpg\"\n      alt=\"Organigramm des Bürgerkomitees zur Förderung der Ansiedlung eines globalen KI-Zentrums in der Sonderstadt Goyang\"\n      loading=\"lazy\">\n\n  </a>\n\n  <p class=\"chart-link\">\n    Klicken Sie auf das Organigramm,\n    um eine größere Ansicht zu öffnen.\n  </p>\n\n  <p class=\"note\">\n    Das Organigramm liegt\n    in koreanischer Sprache vor.\n  </p>\n</section>\n\n\u003c!-- 6. MEILENSTEINE -->\n\n<section>\n  <h2>6. Wichtige Meilensteine</h2>\n\n  <div class=\"timeline\">\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        7. September 2026\n      </div>\n      <div>\n        Gründungsfeier des Bürgerkomitees\n        zur Förderung der Ansiedlung\n        eines globalen KI-Zentrums.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        14. Oktober 2026\n      </div>\n      <div>\n        Öffentliche Anhörung\n        zu den Bewertungskriterien\n        für die Standortauswahl\n        des globalen KI-Zentrums.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        15. Oktober 2026\n      </div>\n      <div>\n        Ausarbeitung von Empfehlungen\n        zur Verbesserung\n        der Bewertungskriterien\n        für die Standortauswahl\n        des globalen KI-Zentrums.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        20. Oktober 2026\n      </div>\n      <div>\n        Teilnahme am 7. Seminar\n        zur Innovationsstrategie Goyangs.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        26. Oktober 2026\n      </div>\n      <div>\n        Der Stadtrat der Sonderstadt Goyang\n        verabschiedete eine Resolution,\n        die die Ansiedlung\n        des globalen KI-Zentrums fordert.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        30. Oktober 2026\n      </div>\n      <div>\n        Strategieforum der Provinz Gyeonggi\n        zur Ansiedlung des globalen KI-Zentrums.\n      </div>\n    </div>\n\n  </div>\n\n  <p class=\"note\">\n    Die oben genannten Meilensteine\n    entsprechen den Aktivitäten\n    und Entwicklungen,\n    die in der koreanischsprachigen\n    Vorstellung des Bürgerkomitees aufgeführt sind.\n  </p>\n</section>\n\n\u003c!-- 7. BÜRGERBETEILIGUNG -->\n\n<section>\n  <h2>7. Bürgerbeteiligung</h2>\n\n  <p>\n    Das geplante globale KI-Zentrum\n    ist eine gemeinsame zivilgesellschaftliche Initiative,\n    die darauf abzielt,\n    die zukünftigen Wachstumschancen Goyangs\n    zu erweitern\n    und seine Entwicklung\n    als Stadt der internationalen Zusammenarbeit\n    zu unterstützen.\n  </p>\n\n  <p>\n    Bürgerinnen und Bürger\n    sind eingeladen,\n    sich durch Online-Unterstützungsbekundungen,\n    Registrierung im Bürgerkomitee,\n    Fördermitgliedschaften\n    und öffentliche Informationskampagnen\n    zu beteiligen.\n  </p>\n\n  <a href=\"participate.html?lang=de\"\n     class=\"button\">\n    Zentrum für Bürgerbeteiligung\n  </a>\n\n  <a href=\"index.html?lang=de\"\n     class=\"button\">\n    Deutsche Startseite\n  </a>\n\n</section>\n\n\u003c!-- 8. INSTITUTIONELLER STATUS -->\n\n<section>\n  <h2>8. Institutioneller Status</h2>\n\n  <p>\n    Das Bürgerkomitee\n    ist eine von Bürgerinnen und Bürgern\n    getragene Organisation,\n    die die geplante Initiative\n    eines globalen KI-Zentrums\n    in der Sonderstadt Goyang unterstützt.\n  </p>\n\n  <p>\n    Das Komitee ist weder\n    eine internationale Organisation\n    noch eine Regierungsbehörde,\n    die für offizielle\n    Standortentscheidungen zuständig ist.\n  </p>\n\n  <p>\n    Jede formelle institutionelle Beteiligung,\n    Standortentscheidung\n    oder öffentliche Unterstützungsmaßnahme\n    würde eine Genehmigung\n    gemäß den Verfahren\n    der zuständigen Behörden erfordern.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      Das Komitee möchte\n      durch bürgerschaftliches Engagement,\n      konstruktive politische Vorschläge\n      und verantwortungsvolle Zusammenarbeit\n      einen Beitrag leisten.\n    </strong>\n  </div>\n</section>\n\n</main>\n\n<footer>\n  <p>\n    <strong>\n      Bürgerkomitee zur Förderung<br>\n      der Ansiedlung eines globalen KI-Zentrums<br>\n      in der Sonderstadt Goyang\n    </strong>\n  </p>\n\n  <p>\n    Provinz Gyeonggi, Republik Korea\n  </p>\n\n  <p>\n    Mit den Bürgerinnen und Bürgern,<br>\n    mit der Provinz Gyeonggi<br>\n    und mit der Welt.\n  </p>\n\n  <p>\n    <a href=\"index.html?lang=de\">\n      Deutsche Startseite\n    </a>\n  </p>\n</footer>\n\n</body>\n</html>\n",
  "lang=en": "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nAbout the Citizens' Promotion Committee |\nGlobal AI Hub Initiative\n</title>\n\n<meta name=\"description\"\ncontent=\"Learn about the Citizens' Promotion Committee for Attracting the Global AI Hub to Goyang Special City, including its mission, principles, activities, chairperson's message, organizational structure, and milestones.\">\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n.greeting {\n  font-size: 17px;\n}\n\n.greeting p {\n  margin-bottom: 20px;\n}\n\n.signature {\n  text-align: right;\n  margin-top: 30px;\n  font-weight: bold;\n}\n\n.chart {\n  display: block;\n  width: 100%;\n  height: auto;\n  border-radius: 8px;\n  cursor: zoom-in;\n}\n\n.chart-link {\n  display: block;\n  text-align: center;\n  margin-top: 15px;\n  color: #0754a6;\n}\n\n.timeline {\n  border-left: 4px solid #168de0;\n  padding-left: 25px;\n}\n\n.timeline-item {\n  margin-bottom: 25px;\n}\n\n.timeline-date {\n  font-weight: bold;\n  color: #0754a6;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.principles {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(230px, 1fr));\n  gap: 18px;\n}\n\n.principle-card {\n  background: #f4f8fc;\n  padding: 22px;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.principle-card h3 {\n  margin-top: 0;\n}\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 22px;\n  border-radius: 8px;\n  margin-top: 20px;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .greeting {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n}\n</style>\n</head>\n\n<body>\n\n<header>\n  <h1>\n    About the Citizens' Promotion Committee\n  </h1>\n\n  <p>\n    Citizens' Promotion Committee<br>\n    for Attracting the Global AI Hub<br>\n    to Goyang Special City\n  </p>\n\n  <p>\n    Gyeonggi Province, Republic of Korea\n  </p>\n\n  <div class=\"header-links\">\n    <a href=\"index.html?lang=en\" class=\"home-link\">\n      ← English Home\n    </a>\n\n    <a href=\"committee.html\"\n       class=\"home-link\"\n       lang=\"ko\">\n      한국어\n    </a>\n  </div>\n</header>\n\n<main>\n\n\u003c!-- Slogan -->\n\n<section>\n  <div class=\"slogan\">\n    A New Growth Engine for Goyang.<br>\n    New Opportunities for Employment.<br>\n    A Global AI Hub for International Cooperation.\n  </div>\n</section>\n\n\u003c!-- Purpose -->\n\n<section>\n  <h2>1. Purpose of the Committee</h2>\n\n  <p>\n    The Citizens' Promotion Committee\n    for Attracting the Global AI Hub\n    to Goyang Special City is a\n    civic-led initiative established\n    to bring together citizens\n    and community stakeholders\n    in support of Goyang's\n    future development.\n  </p>\n\n  <p>\n    The Committee seeks to contribute\n    to the development of new\n    growth opportunities,\n    high-quality employment,\n    regional economic vitality,\n    and Goyang's potential\n    as a city of international cooperation.\n  </p>\n\n  <p>\n    Its activities include\n    building public awareness,\n    conducting policy research,\n    developing attraction strategies,\n    encouraging institutional cooperation,\n    and promoting citizen participation.\n  </p>\n\n  <p>\n    The Committee believes that\n    the Global AI Hub should be\n    more than a location\n    for international offices.\n  </p>\n\n  <p>\n    It should develop into\n    an international cooperation platform\n    that explores responsible\n    applications of artificial intelligence\n    to address shared global challenges.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      Through citizen participation,\n      evidence-based policy proposals,\n      and constructive cooperation,\n      the Committee seeks to help prepare\n      a new future for Goyang Special City.\n    </strong>\n  </div>\n</section>\n\n\u003c!-- Principles -->\n\n<section>\n  <h2>2. Guiding Principles</h2>\n\n  <p>\n    The Committee promotes\n    voluntary civic participation,\n    public accountability,\n    transparency,\n    and evidence-based policy development.\n  </p>\n\n  <div class=\"principles\">\n\n    <article class=\"principle-card\">\n      <h3>01. Citizen-Centered Participation</h3>\n      <p>\n        Encourage voluntary participation\n        by citizens,\n        civic organizations,\n        experts,\n        local businesses,\n        and other community stakeholders.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>02. Evidence-Based Policy</h3>\n      <p>\n        Analyze Goyang's location advantages\n        using objective information\n        and policy research,\n        and develop practical proposals\n        for the Global AI Hub initiative.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>03. Broad Institutional Cooperation</h3>\n      <p>\n        Explore opportunities\n        for cooperation with\n        Goyang Special City,\n        Gyeonggi Province,\n        relevant national authorities,\n        universities,\n        research institutions,\n        businesses,\n        and civil society.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>04. Transparency and Accountability</h3>\n      <p>\n        Promote responsible operations,\n        public communication,\n        and transparency\n        in the Committee's activities\n        and major developments.\n      </p>\n    </article>\n\n  </div>\n</section>\n\n\u003c!-- Activities -->\n\n<section>\n  <h2>3. Major Activities</h2>\n\n  <div class=\"principles\">\n\n    <article class=\"principle-card\">\n      <h3>Public Awareness and Engagement</h3>\n      <p>\n        Encourage public understanding\n        of the Global AI Hub initiative\n        through online expressions of support,\n        outreach activities,\n        and communication with citizens.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>Policy Research and Proposals</h3>\n      <p>\n        Assess Goyang's urban assets\n        and potential international\n        cooperation requirements\n        to develop competitive\n        attraction strategies\n        and policy recommendations.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>Expanding Cooperation</h3>\n      <p>\n        Explore opportunities\n        for cooperation with\n        public institutions,\n        healthcare organizations,\n        universities,\n        research institutions,\n        and businesses.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>Regional Development Opportunities</h3>\n      <p>\n        Examine ways to connect\n        the proposed Global AI Hub\n        with research and development,\n        industrial activity,\n        youth employment,\n        and sustainable regional growth.\n      </p>\n    </article>\n\n  </div>\n\n  <p class=\"note\">\n    These activities describe\n    the Committee's objectives\n    and proposed directions.\n    They do not imply confirmed\n    relocation decisions,\n    formal institutional partnerships,\n    or approved projects.\n  </p>\n</section>\n\n\u003c!-- Chairperson's Message -->\n\n<section>\n  <h2>4. Message from the Chairperson</h2>\n\n  <div class=\"greeting\">\n\n    <p>\n      Dear Citizens of Goyang Special City,\n    </p>\n\n    <p>\n      We stand at an important moment\n      that could shape the future\n      of Goyang Special City.\n    </p>\n\n    <p>\n      Over the past several decades,\n      Goyang has developed\n      into a major residential city\n      in the Seoul metropolitan region.\n      However, the city has not yet\n      secured sufficient high-quality\n      employment opportunities\n      and sustainable growth engines\n      to meet the expectations\n      of its citizens.\n    </p>\n\n    <p>\n      The proposed Global AI Hub\n      represents an opportunity\n      to address these structural challenges\n      and help Goyang develop\n      into an internationally connected city.\n    </p>\n\n    <p>\n      Yet the Global AI Hub\n      must not become merely\n      a project to attract\n      the offices of international organizations.\n    </p>\n\n    <p>\n      It should contribute\n      to addressing the challenges\n      facing humanity,\n      including disease and hunger,\n      climate change and disasters,\n      refugees and migration,\n      unemployment,\n      and educational inequality,\n      through responsible applications\n      of artificial intelligence.\n    </p>\n\n    <p>\n      Goyang Special City possesses\n      a range of assets\n      that could support\n      international cooperation.\n      What matters now\n      is developing concrete,\n      practical,\n      and achievable plans\n      to make effective use\n      of these assets.\n    </p>\n\n    <p>\n      Our Citizens' Promotion Committee\n      will go beyond gathering\n      public enthusiasm.\n      We will study policy options,\n      encourage cooperation,\n      and work toward\n      meaningful preparation\n      and tangible results.\n    </p>\n\n    <p>\n      Let civil society\n      across Gyeonggi Province\n      work together,\n      and let its citizens\n      unite around a shared vision.\n    </p>\n\n    <p>\n      For the future\n      of Goyang Special City,\n      and for a better future\n      for humanity,\n      I invite you to join us.\n    </p>\n\n    <p>\n      Thank you.\n    </p>\n\n    <div class=\"signature\">\n      Hong Young-pyo<br>\n      Chairperson<br>\n      Citizens' Promotion Committee<br>\n      for Attracting the Global AI Hub<br>\n      to Goyang Special City\n    </div>\n\n  </div>\n</section>\n\n\u003c!-- Organizational Chart -->\n\n<section>\n  <h2>5. Organizational Structure</h2>\n\n  <p>\n    The Committee brings together\n    participants from different\n    areas of civil society\n    to support the proposed\n    Global AI Hub initiative\n    in Goyang Special City.\n  </p>\n\n  <a href=\"committee-chart.jpg\"\n     target=\"_blank\"\n     rel=\"noopener noreferrer\">\n\n    <img\n      class=\"chart\"\n      src=\"committee-chart.jpg\"\n      alt=\"Organizational chart of the Citizens' Promotion Committee for Attracting the Global AI Hub to Goyang Special City\"\n      loading=\"lazy\">\n\n  </a>\n\n  <p class=\"chart-link\">\n    Select the organizational chart\n    to view a larger image.\n  </p>\n\n  <p class=\"note\">\n    The organizational chart\n    is provided in Korean.\n  </p>\n</section>\n\n\u003c!-- Timeline -->\n\n<section>\n  <h2>6. Major Milestones</h2>\n\n  <div class=\"timeline\">\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        September 7, 2026\n      </div>\n      <div>\n        Inauguration ceremony\n        of the Citizens' Promotion Committee\n        for Attracting the Global AI Hub.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        October 14, 2026\n      </div>\n      <div>\n        Public hearing on the evaluation criteria\n        for selecting the Global AI Hub location.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        October 15, 2026\n      </div>\n      <div>\n        Preparation of recommendations\n        for improving the Global AI Hub\n        site-selection evaluation criteria.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        October 20, 2026\n      </div>\n      <div>\n        Participation in the 7th\n        Goyang Innovation Strategy Seminar.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        October 26, 2026\n      </div>\n      <div>\n        Goyang Special City Council\n        adopted a resolution\n        calling for the attraction\n        of the Global AI Hub.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        October 30, 2026\n      </div>\n      <div>\n        Gyeonggi Province Global AI Hub\n        Attraction Strategy Forum.\n      </div>\n    </div>\n\n  </div>\n\n  <p class=\"note\">\n    The milestones above\n    reflect the activities\n    and developments listed\n    in the Korean-language\n    Committee introduction.\n  </p>\n</section>\n\n\u003c!-- Participation -->\n\n<section>\n  <h2>7. Citizen Participation</h2>\n\n  <p>\n    The proposed Global AI Hub\n    is a shared civic initiative\n    aimed at expanding\n    Goyang's future growth opportunities\n    and supporting its development\n    as a city of international cooperation.\n  </p>\n\n  <p>\n    Citizens are encouraged\n    to participate through\n    online expressions of support,\n    Committee registration,\n    supporting membership,\n    and public awareness activities.\n  </p>\n\n  <a href=\"participate.html\"\n     class=\"button\">\n    Citizen Participation Center (Korean)\n  </a>\n\n  <a href=\"index.html?lang=en\"\n     class=\"button\">\n    English Homepage\n  </a>\n\n</section>\n\n\u003c!-- Clarification -->\n\n<section>\n  <h2>8. Institutional Status</h2>\n\n  <p>\n    The Citizens' Promotion Committee\n    is a civic-led organization\n    supporting the proposed\n    Global AI Hub initiative\n    in Goyang Special City.\n  </p>\n\n  <p>\n    The Committee is not presented\n    as an international organization\n    or as a government authority\n    responsible for official\n    site-selection decisions.\n  </p>\n\n  <p>\n    Any formal institutional participation,\n    location decision,\n    or public support measure\n    would require approval\n    through the procedures\n    of the relevant authorities.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      The Committee seeks to contribute\n      through public engagement,\n      constructive policy proposals,\n      and responsible cooperation.\n    </strong>\n  </div>\n</section>\n\n</main>\n\n<footer>\n  <p>\n    <strong>\n      Citizens' Promotion Committee<br>\n      for Attracting the Global AI Hub<br>\n      to Goyang Special City\n    </strong>\n  </p>\n\n  <p>\n    Gyeonggi Province, Republic of Korea\n  </p>\n\n  <p>\n    With Citizens, With Gyeonggi Province,\n    and With the World.\n  </p>\n\n  <p>\n    <a href=\"index.html?lang=en\">\n      English Home\n    </a>\n    &nbsp; | &nbsp;\n    <a href=\"committee.html\" lang=\"ko\">\n      한국어\n    </a>\n  </p>\n</footer>\n\n</body>\n</html>\n",
  "lang=es": "<!DOCTYPE html>\n<html lang=\"es\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nComité Ciudadano de Promoción |\nCentro Global de IA en Goyang\n</title>\n\n<meta name=\"description\"\ncontent=\"Conozca el Comité Ciudadano de Promoción para la Atracción del Centro Global de IA a la Ciudad Especial de Goyang: misión, principios, actividades, mensaje del presidente, estructura organizativa y principales acontecimientos.\">\n\n<link rel=\"canonical\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/committee.html?lang=es\">\n\n<link rel=\"alternate\" hreflang=\"es\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/committee.html?lang=es\">\n\n<link rel=\"alternate\" hreflang=\"en\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/committee.html?lang=en\">\n\n<link rel=\"alternate\" hreflang=\"ko\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/committee.html\">\n\n<style>\n\n/* CONFIGURACIÓN GENERAL */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* ENCABEZADO */\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 35px 20px;\n}\n\nheader h1 {\n  font-size: clamp(25px, 4vw, 38px);\n  margin: 0 0 12px;\n  line-height: 1.4;\n}\n\nheader p {\n  font-size: 16px;\n  color: #e3efff;\n  margin: 7px 0;\n}\n\n/* NAVEGACIÓN */\n\n.top-navigation {\n  background: #10315e;\n  padding: 12px 18px;\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  align-items: center;\n  gap: 12px;\n}\n\n.top-navigation > a {\n  color: white;\n  text-decoration: none;\n  font-size: 1 \n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* MENSAJE DEL PRESIDENTE */\n\n.greeting {\n  font-size: 17px;\n}\n\n.greeting p {\n  margin-bottom: 20px;\n}\n\n.signature {\n  text-align: right;\n  margin-top: 35px;\n  font-weight: bold;\n  line-height: 1.9;\n}\n\n/* ORGANIGRAMA */\n\n.chart {\n  display: block;\n  width: 100%;\n  height: auto;\n  border-radius: 8px;\n  cursor: zoom-in;\n}\n\n.chart-link {\n  display: block;\n  text-align: center;\n  margin-top: 15px;\n  color: #0754a6;\n}\n\n/* CRONOLOGÍA */\n\n.timeline {\n  border-left: 4px solid #168de0;\n  padding-left: 25px;\n}\n\n.timeline-item {\n  margin-bottom: 25px;\n}\n\n.timeline-date {\n  font-weight: bold;\n  color: #0754a6;\n  margin-bottom: 5px;\n}\n\n/* DESTACADOS */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 22px;\n  border-radius: 8px;\n  margin-top: 20px;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* BOTONES */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: #0754a6;\n}\n\n.button.secondary:hover {\n  background: #cce2ff;\n}\n\n/* PIE DE PÁGINA */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* MÓVIL */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 25px 12px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  .greeting {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- ENCABEZADO -->\n\n<header>\n\n<h1>\nAcerca del Comité Ciudadano de Promoción\n</h1>\n\n<p>\nComité Ciudadano de Promoción<br>\npara la Atracción del Centro Global<br>\nde Inteligencia Artificial<br>\na la Ciudad Especial de Goyang\n</p>\n\n<p>\nProvincia de Gyeonggi, República de Corea\n</p>\n\n</header>\n\n\u003c!-- NAVEGACIÓN -->\n\n<nav class=\"top-navigation\"\naria-label=\"Navegación principal\">\n\n<a href=\"index.html?lang=es\">\n← Inicio\n</a>\n\n<a href=\"#objetivos\">\nObjetivos\n</a>\n\n<a href=\"#principios\">\nPrincipios\n</a>\n\n<a href=\"#actividades\">\nActividades\n</a>\n\n<a href=\"#presidente\">\nPresidente\n</a>\n\n<a href=\"#organizacion\">\nOrganización\n</a>\n\n<a href=\"#historia\">\nHistoria\n</a>\n\n<a href=\"#participacion\">\nParticipación\n</a>\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"Seleccionar idioma\">\n🌐 Idioma ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a href=\"committee.html?lang=es\"\nlang=\"es\"\naria-current=\"page\">\nEspañol ✓\n</a>\n\n<a href=\"committee.html?lang=en\"\nlang=\"en\">\nEnglish\n</a>\n\n<a href=\"committee.html\"\nlang=\"ko\">\n한국어\n</a>\n\n</div>\n\n</details>\n\n</nav>\n\n<main>\n\n\u003c!-- LEMA -->\n\n<section>\n\n<div class=\"slogan\">\n\nUn nuevo motor de crecimiento para Goyang.<br>\nNuevas oportunidades de empleo.<br>\nUn Centro Global de IA para la cooperación internacional.\n\n</div>\n\n</section>\n\n\u003c!-- 1. OBJETIVOS -->\n\n<section id=\"objetivos\">\n\n<h2>\n1. Objetivos del Comité\n</h2>\n\n<p>\nEl Comité Ciudadano de Promoción\npara la Atracción del Centro Global\nde Inteligencia Artificial\na la Ciudad Especial de Goyang\nes una iniciativa impulsada\npor la sociedad civil\ncon el propósito de reunir\na ciudadanos\ny representantes de la comunidad\nen apoyo del desarrollo futuro\nde Goyang.\n</p>\n\n<p>\nEl Comité busca contribuir\na la creación de nuevas oportunidades\nde crecimiento,\nempleo de calidad,\ndinamismo económico regional\ny al desarrollo del potencial\nde Goyang como ciudad\nde cooperación internacional.\n</p>\n\n<p>\nSus actividades incluyen\nla sensibilización pública,\nla investigación sobre políticas,\nel desarrollo de estrategias\npara atraer el Centro Global de IA,\nel fomento de la cooperación institucional\ny la promoción\nde la participación ciudadana.\n</p>\n\n<p>\nEl Comité considera\nque el Centro Global de IA\ndebe ser mucho más\nque una sede de oficinas\nde organizaciones internacionales.\n</p>\n\n<p>\nDebe desarrollarse\ncomo una plataforma\nde cooperación internacional\nque explore aplicaciones responsables\nde inteligencia artificial\npara afrontar desafíos globales\ncompartidos.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nMediante la participación ciudadana,\nlas propuestas de políticas\nbasadas en evidencia\ny la cooperación constructiva,\nel Comité busca contribuir\na preparar un nuevo futuro\npara la Ciudad Especial de Goyang.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- 2. PRINCIPIOS -->\n\n<section id=\"principios\">\n\n<h2>\n2. Principios fundamentales\n</h2>\n\n<p>\nEl Comité promueve\nla participación cívica voluntaria,\nla responsabilidad pública,\nla transparencia\ny el desarrollo de políticas\nbasadas en evidencia.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\n01. Participación centrada en los ciudadanos\n</h3>\n\n<p>\nFomentar la participación voluntaria\nde ciudadanos,\norganizaciones cívicas,\nexpertos,\nempresas locales\ny otros representantes\nde la comunidad.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n02. Políticas basadas en evidencia\n</h3>\n\n<p>\nAnalizar las ventajas territoriales\nde Goyang mediante información objetiva\ne investigación sobre políticas,\ny desarrollar propuestas prácticas\npara la iniciativa\ndel Centro Global de IA.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n03. Amplia cooperación institucional\n</h3>\n\n<p>\nExplorar oportunidades\nde cooperación\ncon la Ciudad Especial de Goyang,\nla provincia de Gyeonggi,\nlas autoridades nacionales competentes,\nuniversidades,\ninstituciones de investigación,\nempresas\ny organizaciones de la sociedad civil.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n04. Transparencia y responsabilidad\n</h3>\n\n<p>\nPromover una gestión responsable,\nla comunicación pública\ny la transparencia\nen las actividades\ny principales acontecimientos\ndel Comité.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- 3. ACTIVIDADES -->\n\n<section id=\"actividades\">\n\n<h2>\n3. Actividades principales\n</h2>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nSensibilización y participación pública\n</h3>\n\n<p>\nPromover la comprensión pública\nde la iniciativa del Centro Global de IA\nmediante expresiones de apoyo en línea,\nactividades de divulgación\ny comunicación con los ciudadanos.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nInvestigación y propuestas de políticas\n</h3>\n\n<p>\nEvaluar los recursos urbanos\nde Goyang\ny los posibles requisitos\nde cooperación internacional\npara desarrollar estrategias\ncompetitivas de atracción\ny recomendaciones de políticas.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nAmpliación de la cooperación\n</h3>\n\n<p>\nExplorar oportunidades\nde cooperación\ncon instituciones públicas,\norganizaciones sanitarias,\nuniversidades,\ninstituciones de investigación\ny empresas.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nOportunidades de desarrollo regional\n</h3>\n\n<p>\nExaminar formas de conectar\nel Centro Global de IA propuesto\ncon la investigación y el desarrollo,\nla actividad industrial,\nel empleo juvenil\ny el crecimiento regional sostenible.\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\nEstas actividades describen\nlos objetivos y las orientaciones\npropuestas por el Comité.\nNo implican decisiones confirmadas\nde traslado,\nalianzas institucionales formales\nni proyectos aprobados.\n</p>\n\n</section>\n\n\u003c!-- 4. MENSAJE DEL PRESIDENTE -->\n\n<section id=\"presidente\">\n\n<h2>\n4. Mensaje del Presidente\n</h2>\n\n<div class=\"greeting\">\n\n<p>\nEstimados ciudadanos\nde la Ciudad Especial de Goyang:\n</p>\n\n<p>\nNos encontramos\nen un momento importante\nque podría determinar\nel futuro de nuestra ciudad.\n</p>\n\n<p>\nDurante las últimas décadas,\nGoyang se ha desarrollado\ncomo una importante ciudad residencial\ndentro de la región metropolitana de Seúl.\nSin embargo,\ntodavía no ha conseguido\nsuficientes oportunidades\nde empleo de calidad\nni motores de crecimiento sostenible\nque respondan plenamente\na las expectativas\nde sus ciudadanos.\n</p>\n\n<p>\nLa propuesta\ndel Centro Global\nde Inteligencia Artificial\nrepresenta una oportunidad\npara afrontar estos desafíos estructurales\ny ayudar a Goyang\na convertirse en una ciudad\nconectada internacionalmente.\n</p>\n\n<p>\nNo obstante,\nel Centro Global de IA\nno debe convertirse\nsimplemente en un proyecto\npara atraer oficinas\nde organizaciones internacionales.\n</p>\n\n<p>\nDebe contribuir\na afrontar los desafíos\nque enfrenta la humanidad,\nincluidas las enfermedades\ny el hambre,\nel cambio climático\ny los desastres,\nlos refugiados\ny la migración,\nel desempleo\ny la desigualdad educativa,\nmediante aplicaciones responsables\nde inteligencia artificial.\n</p>\n\n<p>\nLa Ciudad Especial de Goyang\nposee diversos recursos\nque podrían apoyar\nla cooperación internacional.\nLo que importa ahora\nes desarrollar planes concretos,\nprácticos\ny realizables\npara aprovechar eficazmente\nestos recursos.\n</p>\n\n<p>\nNuestro Comité Ciudadano de Promoción\nirá más allá\nde reunir el entusiasmo público.\nEstudiaremos opciones de políticas,\nfomentaremos la cooperación\ny trabajaremos\npara lograr una preparación significativa\ny resultados tangibles.\n</p>\n\n<p>\nInvito a la sociedad civil\nde toda la provincia de Gyeonggi\na trabajar conjuntamente,\ny a sus ciudadanos\na unirse en torno\na una visión compartida.\n</p>\n\n<p>\nPor el futuro\nde la Ciudad Especial de Goyang\ny por un futuro mejor\npara la humanidad,\nles invito a participar\nen esta iniciativa.\n</p>\n\n<p>\nMuchas gracias.\n</p>\n\n<div class=\"signature\">\n\nHong Young-pyo<br>\n\nPresidente<br>\n\nComité Ciudadano de Promoción<br>\n\npara la Atracción del Centro Global de IA<br>\n\na la Ciudad Especial de Goyang\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- 5. ORGANIGRAMA -->\n\n<section id=\"organizacion\">\n\n<h2>\n5. Estructura organizativa\n</h2>\n\n<p>\nEl Comité reúne\na participantes\nde diferentes sectores\nde la sociedad civil\npara apoyar\nla iniciativa propuesta\ndel Centro Global de IA\nen la Ciudad Especial de Goyang.\n</p>\n\n<a href=\"committee-chart.jpg\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\"\naria-label=\"Abrir el organigrama en tamaño completo\">\n\n<img\nclass=\"chart\"\nsrc=\"committee-chart.jpg\"\nalt=\"Organigrama del Comité Ciudadano de Promoción para la Atracción del Centro Global de IA a la Ciudad Especial de Goyang\"\nloading=\"lazy\">\n\n</a>\n\n<p class=\"chart-link\">\nSeleccione el organigrama\npara visualizar una imagen ampliada.\n</p>\n\n<p class=\"note\">\nEl organigrama original\nse presenta en idioma coreano.\n</p>\n\n</section>\n\n\u003c!-- 6. PRINCIPALES ACONTECIMIENTOS -->\n\n<section id=\"historia\">\n\n<h2>\n6. Principales acontecimientos\n</h2>\n\n<div class=\"timeline\">\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n7 de septiembre de 2026\n</div>\n\n<div>\nCeremonia de inauguración\ndel Comité Ciudadano de Promoción\npara la Atracción del Centro Global de IA.\n</div>\n\n</div>\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n14 de octubre de 2026\n</div>\n\n<div>\nAudiencia pública\nsobre los criterios de evaluación\npara seleccionar\nla ubicación del Centro Global de IA.\n</div>\n\n</div>\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n15 de octubre de 2026\n</div>\n\n<div>\nPreparación de recomendaciones\npara mejorar\nlos criterios de evaluación\nde la selección de ubicación\ndel Centro Global de IA.\n</div>\n\n</div>\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n20 de octubre de 2026\n</div>\n\n<div>\nParticipación\nen el VII Seminario\nde Estrategia de Innovación de Goyang.\n</div>\n\n</div>\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n26 de octubre de 2026\n</div>\n\n<div>\nEl Consejo Municipal\nde la Ciudad Especial de Goyang\naprobó una resolución\nque solicita la atracción\ndel Centro Global de IA.\n</div>\n\n</div>\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n30 de octubre de 2026\n</div>\n\n<div>\nForo sobre la Estrategia\nde Atracción del Centro Global de IA\na la provincia de Gyeonggi.\n</div>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nLos acontecimientos anteriores\nreflejan las actividades\ny los principales hitos\nincluidos en la presentación\ndel Comité en idioma coreano.\n</p>\n\n</section>\n\n\u003c!-- 7. PARTICIPACIÓN CIUDADANA -->\n\n<section id=\"participacion\">\n\n<h2>\n7. Participación ciudadana\n</h2>\n\n<p>\nLa propuesta\ndel Centro Global de IA\nes una iniciativa cívica compartida\nque busca ampliar\nlas oportunidades\nde crecimiento futuro de Goyang\ny apoyar su desarrollo\ncomo ciudad\nde cooperación internacional.\n</p>\n\n<p>\nSe invita a los ciudadanos\na participar mediante\nexpresiones de apoyo en línea,\ninscripción en el Comité,\nafiliación como miembros colaboradores\ny actividades\nde sensibilización pública.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nCon los ciudadanos,\ncon la provincia de Gyeonggi\ny con el mundo.\n</strong>\n\n<p>\nLa participación ciudadana\npuede contribuir\na construir una base social sólida\npara una cooperación internacional\nresponsable y sostenible.\n</p>\n\n</div>\n\n<a href=\"participate.html\"\nclass=\"button\"\nlang=\"ko\"\nhreflang=\"ko\">\n\nCentro de Participación Ciudadana\n(en coreano)\n\n</a>\n\n<a href=\"index.html?lang=es\"\nclass=\"button secondary\">\n\nPágina principal en español\n\n</a>\n\n</section>\n\n\u003c!-- 8. SITUACIÓN INSTITUCIONAL -->\n\n<section id=\"situacion\">\n\n<h2>\n8. Situación institucional\n</h2>\n\n<p>\nEl Comité Ciudadano de Promoción\nes una organización\nimpulsada por la sociedad civil\nque apoya\nla iniciativa propuesta\ndel Centro Global de IA\nen la Ciudad Especial de Goyang.\n</p>\n\n<p>\nEl Comité no se presenta\ncomo una organización internacional\nni como una autoridad gubernamental\nresponsable\nde las decisiones oficiales\nsobre la selección de ubicación.\n</p>\n\n<p>\nCualquier participación institucional formal,\ndecisión de ubicación\no medida de apoyo público\nrequeriría aprobación\nmediante los procedimientos\nde las autoridades competentes.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nEl Comité busca contribuir\nmediante la participación pública,\nlas propuestas constructivas\nde políticas\ny la cooperación responsable.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- ENLACES RELACIONADOS -->\n\n<section>\n\n<h2>\n9. Más información\n</h2>\n\n<p>\nConozca más sobre\nla iniciativa del Centro Global de IA,\nlas ventajas de Goyang,\nla cooperación internacional\ny las estrategias propuestas.\n</p>\n\n<a href=\"index.html?lang=es\"\nclass=\"button\">\n\n← Inicio en español\n\n</a>\n\n<a href=\"hub.html?lang=es\"\nclass=\"button secondary\">\n\nAcerca del Centro Global de IA\n\n</a>\n\n<a href=\"goyang.html?lang=es\"\nclass=\"button secondary\">\n\n¿Por qué Goyang?\n\n</a>\n\n<a href=\"agencies.html?lang=es\"\nclass=\"button secondary\">\n\nOrganizaciones internacionales\n\n</a>\n\n<a href=\"strategy.html?lang=es\"\nclass=\"button secondary\">\n\nEstrategia de desarrollo\n\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIE DE PÁGINA -->\n\n<footer>\n\n<p>\n\n<strong>\n\nComité Ciudadano de Promoción<br>\n\npara la Atracción del Centro Global de IA<br>\n\na la Ciudad Especial de Goyang\n\n</strong>\n\n</p>\n\n<p>\nProvincia de Gyeonggi,\nRepública de Corea\n</p>\n\n<p>\nCon los ciudadanos,\ncon Gyeonggi\ny con el mundo.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=es\">\nInicio en español\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"committee.html?lang=en\"\nlang=\"en\">\nEnglish\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"committee.html\"\nlang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
