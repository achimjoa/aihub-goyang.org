le spéciale de Goyang\n</p>\n\n<p>\nProvince de Gyeonggi, République de Corée\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=fr\" class=\"home-link\">\n← Accueil\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- SLOGAN -->\n\n<section>\n\n<div class=\"slogan\">\nUn nouveau moteur de croissance pour Goyang.<br>\nDe nouvelles possibilités d'emploi.<br>\nUn Centre mondial de l'IA pour la coopération internationale.\n</div>\n\n</section>\n\n\u003c!-- 1. MISSION -->\n\n<section>\n\n<h2>\n1. Mission du Comité\n</h2>\n\n<p>\nLe Comité citoyen de promotion\npour l'implantation du Centre mondial de l'IA\ndans la ville spéciale de Goyang\nest une initiative portée par la société civile,\ncréée pour rassembler les citoyens\net les acteurs de la communauté locale\nautour du développement futur de Goyang.\n</p>\n\n<p>\nLe Comité cherche à contribuer\nà l'émergence de nouvelles possibilités\nde croissance,\nà la création d'emplois de qualité,\nau dynamisme économique régional\net au développement de Goyang\nen tant que ville de coopération internationale.\n</p>\n\n<p>\nSes activités comprennent\nla sensibilisation du public,\nla recherche sur les politiques publiques,\nl'élaboration de stratégies d'implantation,\nl'encouragement de la coopération institutionnelle\net la promotion de la participation citoyenne.\n</p>\n\n<p>\nLe Comité estime que\nle Centre mondial de l'IA\nne devrait pas être simplement\nun lieu accueillant les bureaux\nd'organisations internationales.\n</p>\n\n<p>\nIl devrait devenir\nune plateforme de coopération internationale\npermettant d'explorer\ndes applications responsables\nde l'intelligence artificielle\nafin de relever\nles défis mondiaux communs.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nGrâce à la participation citoyenne,\nà des propositions de politiques publiques\nfondées sur des données probantes\net à une coopération constructive,\nle Comité souhaite contribuer\nà préparer un nouvel avenir\npour la ville spéciale de Goyang.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- 2. PRINCIPES -->\n\n<section>\n\n<h2>\n2. Principes directeurs\n</h2>\n\n<p>\nLe Comité encourage\nla participation volontaire des citoyens,\nla responsabilité envers le public,\nla transparence\net l'élaboration de politiques publiques\nfondées sur des données probantes.\n</p>\n\n<div class=\"principles\">\n\n<article class=\"principle-card\">\n\n<h3>\n01. Participation centrée sur les citoyens\n</h3>\n\n<p>\nEncourager la participation volontaire\ndes citoyens,\ndes organisations de la société civile,\ndes experts,\ndes entreprises locales\net des autres acteurs\nde la communauté.\n</p>\n\n</article>\n\n<article class=\"principle-card\">\n\n<h3>\n02. Politiques fondées sur des données probantes\n</h3>\n\n<p>\nAnalyser les avantages territoriaux\nde Goyang\nà partir d'informations objectives\net de recherches\nsur les politiques publiques,\npuis élaborer des propositions concrètes\npour l'initiative du Centre mondial de l'IA.\n</p>\n\n</article>\n\n<article class=\"principle-card\">\n\n<h3>\n03. Coopération institutionnelle élargie\n</h3>\n\n<p>\nExplorer les possibilités de coopération\navec la ville spéciale de Goyang,\nla province de Gyeonggi,\nles autorités nationales compétentes,\nles universités,\nles établissements de recherche,\nles entreprises\net la société civile.\n</p>\n\n</article>\n\n<article class=\"principle-card\">\n\n<h3>\n04. Transparence et responsabilité\n</h3>\n\n<p>\nPromouvoir un fonctionnement responsable,\nune communication ouverte avec le public\net la transparence\ndans les activités du Comité\net ses principales évolutions.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- 3. ACTIVITÉS -->\n\n<section>\n\n<h2>\n3. Activités principales\n</h2>\n\n<div class=\"principles\">\n\n<article class=\"principle-card\">\n\n<h3>\nSensibilisation et mobilisation du public\n</h3>\n\n<p>\nFavoriser la compréhension\nde l'initiative du Centre mondial de l'IA\ngrâce aux manifestations de soutien en ligne,\naux activités de sensibilisation\net à la communication avec les citoyens.\n</p>\n\n</article>\n\n<article class=\"principle-card\">\n\n<h3>\nRecherche et propositions\nsur les politiques publiques\n</h3>\n\n<p>\nÉvaluer les ressources urbaines de Goyang\net les besoins potentiels\nde coopération internationale\nafin d'élaborer\ndes stratégies d'implantation compétitives\net des recommandations\nen matière de politiques publiques.\n</p>\n\n</article>\n\n<article class=\"principle-card\">\n\n<h3>\nÉlargissement de la coopération\n</h3>\n\n<p>\nExplorer les possibilités de coopération\navec les institutions publiques,\nles établissements de santé,\nles universités,\nles établissements de recherche\net les entreprises.\n</p>\n\n</article>\n\n<article class=\"principle-card\">\n\n<h3>\nPossibilités de développement régional\n</h3>\n\n<p>\nÉtudier les moyens de relier\nle projet de Centre mondial de l'IA\nà la recherche et au développement,\naux activités industrielles,\nà l'emploi des jeunes\net à une croissance régionale durable.\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\nCes activités décrivent\nles objectifs et les orientations proposées\npar le Comité.\nElles ne signifient pas\nque des décisions d'implantation,\ndes partenariats institutionnels officiels\nou des projets ont été confirmés.\n</p>\n\n</section>\n\n\u003c!-- 4. MESSAGE DU PRÉSIDENT -->\n\n<section>\n\n<h2>\n4. Message du président\n</h2>\n\n<div class=\"greeting\">\n\n<p>\nChères citoyennes,\nchers citoyens de la ville spéciale de Goyang,\n</p>\n\n<p>\nNous nous trouvons aujourd'hui\nà un moment important\nqui pourrait façonner\nl'avenir de notre ville.\n</p>\n\n<p>\nAu cours des dernières décennies,\nGoyang s'est développée\npour devenir une grande ville résidentielle\nde la région métropolitaine de Séoul.\nCependant,\nelle ne dispose pas encore\nde suffisamment d'emplois de qualité\nni de moteurs de croissance durables\npour répondre pleinement\naux attentes de ses citoyens.\n</p>\n\n<p>\nLe projet de Centre mondial de l'IA\nreprésente une occasion\nde relever ces défis structurels\net de contribuer à faire de Goyang\nune ville davantage ouverte\nsur la coopération internationale.\n</p>\n\n<p>\nToutefois,\nle Centre mondial de l'IA\nne doit pas devenir\nun simple projet visant\nà attirer les bureaux\nd'organisations internationales.\n</p>\n\n<p>\nIl doit contribuer\nà relever les défis\nauxquels l'humanité est confrontée,\nnotamment les maladies et la faim,\nle changement climatique\net les catastrophes,\nles réfugiés et les migrations,\nle chômage\net les inégalités éducatives,\ngrâce à des applications responsables\nde l'intelligence artificielle.\n</p>\n\n<p>\nLa ville spéciale de Goyang\npossède de nombreuses ressources\nsusceptibles de soutenir\nla coopération internationale.\nCe qui importe maintenant,\nc'est d'élaborer des plans\nconcrets, pratiques et réalisables\npour utiliser efficacement\nces ressources.\n</p>\n\n<p>\nNotre Comité citoyen de promotion\nne se limitera pas\nà susciter l'enthousiasme du public.\nNous étudierons les possibilités\nen matière de politiques publiques,\nencouragerons la coopération\net travaillerons\nà une préparation sérieuse\net à des résultats tangibles.\n</p>\n\n<p>\nQue la société civile\nde toute la province de Gyeonggi\nunisse ses efforts,\net que ses citoyens\nse rassemblent autour\nd'une vision commune.\n</p>\n\n<p>\nPour l'avenir\nde la ville spéciale de Goyang\net pour un avenir meilleur\npour l'humanité,\nje vous invite\nà vous joindre à nous.\n</p>\n\n<p>\nJe vous remercie.\n</p>\n\n<div class=\"signature\">\n\nHong Young-pyo<br>\nPrésident<br>\nComité citoyen de promotion<br>\npour l'implantation du Centre mondial de l'IA<br>\ndans la ville spéciale de Goyang\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- 5. ORGANIGRAMME -->\n\n<section>\n\n<h2>\n5. Organigramme\n</h2>\n\n<p>\nLe Comité rassemble\ndes participants issus\nde différents secteurs\nde la société civile\nafin de soutenir\nle projet de Centre mondial de l'IA\ndans la ville spéciale de Goyang.\n</p>\n\n<a href=\"committee-chart.jpg\"\ntarget=\"_blank\"\nrel=\"noopener noreferrer\">\n\n<img\nclass=\"chart\"\nsrc=\"committee-chart.jpg\"\nalt=\"Organigramme du Comité citoyen de promotion pour l'implantation du Centre mondial de l'IA dans la ville spéciale de Goyang\"\nloading=\"lazy\">\n\n</a>\n\n<p class=\"chart-link\">\nCliquez sur l'organigramme\npour afficher une image agrandie.\n</p>\n\n<p class=\"note\">\nL'organigramme est présenté en coréen.\n</p>\n\n</section>\n\n\u003c!-- 6. PRINCIPALES ÉTAPES -->\n\n<section>\n\n<h2>\n6. Principales étapes\n</h2>\n\n<div class=\"timeline\">\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n7 septembre 2026\n</div>\n\n<div>\nCérémonie d'inauguration\ndu Comité citoyen de promotion\npour l'implantation du Centre mondial de l'IA.\n</div>\n\n</div>\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n14 octobre 2026\n</div>\n\n<div>\nAudition publique consacrée\naux critères d'évaluation\npour la sélection\ndu site d'implantation\ndu Centre mondial de l'IA.\n</div>\n\n</div>\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n15 octobre 2026\n</div>\n\n<div>\nPréparation de recommandations\nvisant à améliorer\nles critères d'évaluation\npour la sélection\ndu site d'implantation\ndu Centre mondial de l'IA.\n</div>\n\n</div>\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n20 octobre 2026\n</div>\n\n<div>\nParticipation au 7e séminaire\nsur la stratégie d'innovation de Goyang.\n</div>\n\n</div>\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n26 octobre 2026\n</div>\n\n<div>\nAdoption par le Conseil municipal\nde la ville spéciale de Goyang\nd'une résolution appelant\nà l'implantation\ndu Centre mondial de l'IA.\n</div>\n\n</div>\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n30 octobre 2026\n</div>\n\n<div>\nForum stratégique\nde la province de Gyeonggi\nconsacré à l'implantation\ndu Centre mondial de l'IA.\n</div>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nLes étapes présentées ci-dessus\nreprennent les activités\net les événements mentionnés\ndans la présentation du Comité\nen langue coréenne.\n</p>\n\n</section>\n\n\u003c!-- 7. PARTICIPATION -->\n\n<section>\n\n<h2>\n7. Participation citoyenne\n</h2>\n\n<p>\nLe projet de Centre mondial de l'IA\nest une initiative citoyenne commune\nvisant à élargir\nles possibilités de croissance future\nde Goyang\net à soutenir son développement\nen tant que ville\nde coopération internationale.\n</p>\n\n<p>\nLes citoyens sont invités\nà participer\ngrâce aux manifestations\nde soutien en ligne,\nà l'inscription au Comité,\nà l'adhésion en tant que membre de soutien\net aux activités\nde sensibilisation du public.\n</p>\n\n<a href=\"participate.html?lang=fr\"\nclass=\"button\">\nCentre de participation citoyenne →\n</a>\n\n<a href=\"index.html?lang=fr\"\nclass=\"button\">\nAccueil — Version française\n</a>\n\n</section>\n\n\u003c!-- 8. STATUT INSTITUTIONNEL -->\n\n<section>\n\n<h2>\n8. Statut institutionnel\n</h2>\n\n<p>\nLe Comité citoyen de promotion\nest une organisation\nissue de la société civile\nqui soutient\nle projet de Centre mondial de l'IA\ndans la ville spéciale de Goyang.\n</p>\n\n<p>\nLe Comité n'est pas présenté\ncomme une organisation internationale\nni comme une autorité gouvernementale\nresponsable des décisions officielles\nconcernant la sélection\ndu site d'implantation.\n</p>\n\n<p>\nToute participation institutionnelle officielle,\ntoute décision relative au lieu d'implantation\nou toute mesure de soutien public\nnécessiterait une approbation\nselon les procédures\ndes autorités compétentes.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nLe Comité cherche à contribuer\nà cette initiative\npar la mobilisation du public,\ndes propositions constructives\nde politiques publiques\net une coopération responsable.\n</strong>\n\n</div>\n\n</section>\n\n</main>\n\n\u003c!-- PIED DE PAGE -->\n\n<footer>\n\n<p>\n<strong>\nComité citoyen de promotion<br>\npour l'implantation du Centre mondial de l'IA<br>\ndans la ville spéciale de Goyang\n</strong>\n</p>\n\n<p>\nProvince de Gyeonggi, République de Corée\n</p>\n\n<p>\nAvec les citoyens,\navec la province de Gyeonggi\net avec le monde.\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\">\nAccueil — Version française\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=it": "<!DOCTYPE html>\n<html lang=\"it\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nIl Comitato Civico Promotore |\nIniziativa per un Polo Globale dell'IA\n</title>\n\n<meta name=\"description\"\ncontent=\"Scopri il Comitato Civico Promotore per l'insediamento del Polo Globale dell'IA nella Città Speciale di Goyang: missione, principi, attività, messaggio del presidente, struttura organizzativa e principali tappe.\">\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n.greeting {\n  font-size: 17px;\n}\n\n.greeting p {\n  margin-bottom: 20px;\n}\n\n.signature {\n  text-align: right;\n  margin-top: 30px;\n  font-weight: bold;\n}\n\n.chart {\n  display: block;\n  width: 100%;\n  height: auto;\n  border-radius: 8px;\n  cursor: zoom-in;\n}\n\n.chart-link {\n  display: block;\n  text-align: center;\n  margin-top: 15px;\n  color: #0754a6;\n}\n\n.timeline {\n  border-left: 4px solid #168de0;\n  padding-left: 25px;\n}\n\n.timeline-item {\n  margin-bottom: 25px;\n}\n\n.timeline-date {\n  font-weight: bold;\n  color: #0754a6;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.principles {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(230px, 1fr));\n  gap: 18px;\n}\n\n.principle-card {\n  background: #f4f8fc;\n  padding: 22px;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.principle-card h3 {\n  margin-top: 0;\n}\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 22px;\n  border-radius: 8px;\n  margin-top: 20px;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .greeting {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n}\n</style>\n</head>\n\n<body>\n\n<header>\n  <h1>\n    Il Comitato Civico Promotore\n  </h1>\n\n  <p>\n    Comitato Civico Promotore<br>\n    per l'insediamento del Polo Globale dell'IA<br>\n    nella Città Speciale di Goyang\n  </p>\n\n  <p>\n    Provincia di Gyeonggi, Repubblica di Corea\n  </p>\n\n  <div class=\"header-links\">\n    <a href=\"index.html?lang=it\" class=\"home-link\">\n      ← Homepage italiana\n    </a>\n  </div>\n</header>\n\n<main>\n\n\u003c!-- SLOGAN -->\n\n<section>\n  <div class=\"slogan\">\n    Un nuovo motore di crescita per Goyang.<br>\n    Nuove opportunità di occupazione.<br>\n    Un Polo Globale dell'IA per la cooperazione internazionale.\n  </div>\n</section>\n\n\u003c!-- 1. SCOPO DEL COMITATO -->\n\n<section>\n  <h2>1. Scopo del Comitato</h2>\n\n  <p>\n    Il Comitato Civico Promotore\n    per l'insediamento del Polo Globale dell'IA\n    nella Città Speciale di Goyang\n    è un'iniziativa promossa dalla società civile,\n    istituita per riunire i cittadini\n    e i soggetti interessati della comunità\n    a sostegno dello sviluppo futuro di Goyang.\n  </p>\n\n  <p>\n    Il Comitato intende contribuire\n    alla creazione di nuove opportunità di crescita,\n    all'occupazione di qualità,\n    alla vitalità economica regionale\n    e allo sviluppo del potenziale di Goyang\n    come città di cooperazione internazionale.\n  </p>\n\n  <p>\n    Le sue attività comprendono\n    la sensibilizzazione dell'opinione pubblica,\n    la ricerca sulle politiche,\n    l'elaborazione di strategie di insediamento,\n    la promozione della cooperazione istituzionale\n    e l'incoraggiamento della partecipazione dei cittadini.\n  </p>\n\n  <p>\n    Il Comitato ritiene\n    che il Polo Globale dell'IA\n    debba essere molto più\n    di una semplice sede\n    per gli uffici delle organizzazioni internazionali.\n  </p>\n\n  <p>\n    Dovrebbe svilupparsi\n    come una piattaforma di cooperazione internazionale\n    capace di esplorare applicazioni responsabili\n    dell'intelligenza artificiale\n    per affrontare le sfide globali condivise.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      Attraverso la partecipazione dei cittadini,\n      proposte politiche basate su dati concreti\n      e una cooperazione costruttiva,\n      il Comitato intende contribuire\n      alla preparazione di un nuovo futuro\n      per la Città Speciale di Goyang.\n    </strong>\n  </div>\n</section>\n\n\u003c!-- 2. PRINCIPI GUIDA -->\n\n<section>\n  <h2>2. Principi guida</h2>\n\n  <p>\n    Il Comitato promuove\n    la partecipazione civica volontaria,\n    la responsabilità pubblica,\n    la trasparenza\n    e lo sviluppo di politiche\n    basate su dati concreti.\n  </p>\n\n  <div class=\"principles\">\n\n    <article class=\"principle-card\">\n      <h3>01. Partecipazione incentrata sui cittadini</h3>\n      <p>\n        Incoraggiare la partecipazione volontaria\n        di cittadini,\n        organizzazioni civiche,\n        esperti,\n        imprese locali\n        e altri soggetti interessati\n        della comunità.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>02. Politiche basate su dati concreti</h3>\n      <p>\n        Analizzare i vantaggi territoriali di Goyang\n        attraverso informazioni obiettive\n        e ricerche sulle politiche,\n        elaborando proposte pratiche\n        per l'iniziativa del Polo Globale dell'IA.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>03. Ampia cooperazione istituzionale</h3>\n      <p>\n        Esplorare opportunità di cooperazione\n        con la Città Speciale di Goyang,\n        la Provincia di Gyeonggi,\n        le autorità nazionali competenti,\n        le università,\n        gli istituti di ricerca,\n        le imprese\n        e la società civile.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>04. Trasparenza e responsabilità</h3>\n      <p>\n        Promuovere una gestione responsabile,\n        la comunicazione pubblica\n        e la trasparenza\n        nelle attività del Comitato\n        e nei principali sviluppi.\n      </p>\n    </article>\n\n  </div>\n</section>\n\n\u003c!-- 3. ATTIVITÀ PRINCIPALI -->\n\n<section>\n  <h2>3. Attività principali</h2>\n\n  <div class=\"principles\">\n\n    <article class=\"principle-card\">\n      <h3>Sensibilizzazione e coinvolgimento pubblico</h3>\n      <p>\n        Favorire la comprensione pubblica\n        dell'iniziativa del Polo Globale dell'IA\n        attraverso manifestazioni di sostegno online,\n        attività di sensibilizzazione\n        e comunicazione con i cittadini.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>Ricerca e proposte politiche</h3>\n      <p>\n        Valutare le risorse urbane di Goyang\n        e i potenziali requisiti\n        della cooperazione internazionale\n        per sviluppare strategie competitive\n        di insediamento\n        e raccomandazioni politiche.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>Ampliamento della cooperazione</h3>\n      <p>\n        Esplorare opportunità di cooperazione\n        con istituzioni pubbliche,\n        organizzazioni sanitarie,\n        università,\n        istituti di ricerca\n        e imprese.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>Opportunità di sviluppo regionale</h3>\n      <p>\n        Esaminare modalità\n        per collegare il Polo Globale dell'IA proposto\n        alla ricerca e sviluppo,\n        alle attività industriali,\n        all'occupazione giovanile\n        e alla crescita regionale sostenibile.\n      </p>\n    </article>\n\n  </div>\n\n  <p class=\"note\">\n    Queste attività descrivono\n    gli obiettivi e gli orientamenti proposti\n    dal Comitato.\n    Non implicano decisioni confermate\n    di trasferimento,\n    partenariati istituzionali formali\n    o progetti approvati.\n  </p>\n</section>\n\n\u003c!-- 4. MESSAGGIO DEL PRESIDENTE -->\n\n<section>\n  <h2>4. Messaggio del Presidente</h2>\n\n  <div class=\"greeting\">\n\n    <p>\n      Cari cittadini della Città Speciale di Goyang,\n    </p>\n\n    <p>\n      Ci troviamo in un momento importante\n      che potrebbe determinare\n      il futuro della Città Speciale di Goyang.\n    </p>\n\n    <p>\n      Negli ultimi decenni,\n      Goyang si è sviluppata\n      fino a diventare\n      una delle principali città residenziali\n      dell'area metropolitana di Seul.\n      Tuttavia, la città non ha ancora\n      assicurato sufficienti opportunità\n      di occupazione di qualità\n      e motori di crescita sostenibile\n      in grado di soddisfare\n      le aspettative dei suoi cittadini.\n    </p>\n\n    <p>\n      Il Polo Globale dell'IA proposto\n      rappresenta un'opportunità\n      per affrontare queste sfide strutturali\n      e contribuire allo sviluppo di Goyang\n      come città connessa a livello internazionale.\n    </p>\n\n    <p>\n      Tuttavia, il Polo Globale dell'IA\n      non deve diventare\n      semplicemente un progetto\n      volto ad attirare\n      gli uffici delle organizzazioni internazionali.\n    </p>\n\n    <p>\n      Deve contribuire\n      ad affrontare le sfide dell'umanità,\n      tra cui malattie e fame,\n      cambiamento climatico e catastrofi,\n      rifugiati e migrazioni,\n      disoccupazione\n      e disuguaglianze educative,\n      attraverso applicazioni responsabili\n      dell'intelligenza artificiale.\n    </p>\n\n    <p>\n      La Città Speciale di Goyang\n      possiede numerose risorse\n      che potrebbero sostenere\n      la cooperazione internazionale.\n      Ciò che conta ora\n      è elaborare piani concreti,\n      pratici e realizzabili\n      per utilizzare efficacemente\n      queste risorse.\n    </p>\n\n    <p>\n      Il nostro Comitato Civico Promotore\n      andrà oltre\n      la semplice raccolta\n      dell'entusiasmo pubblico.\n      Studieremo le opzioni politiche,\n      incoraggeremo la cooperazione\n      e lavoreremo\n      per una preparazione significativa\n      e risultati tangibili.\n    </p>\n\n    <p>\n      Invitiamo la società civile\n      dell'intera Provincia di Gyeonggi\n      a collaborare\n      e i suoi cittadini\n      a unirsi attorno\n      a una visione condivisa.\n    </p>\n\n    <p>\n      Per il futuro\n      della Città Speciale di Goyang\n      e per un futuro migliore\n      per l'umanità,\n      vi invito a unirvi a noi.\n    </p>\n\n    <p>\n      Grazie.\n    </p>\n\n    <div class=\"signature\">\n      Hong Young-pyo<br>\n      Presidente<br>\n      Comitato Civico Promotore<br>\n      per l'insediamento del Polo Globale dell'IA<br>\n      nella Città Speciale di Goyang\n    </div>\n\n  </div>\n</section>\n\n\u003c!-- 5. STRUTTURA ORGANIZZATIVA -->\n\n<section>\n  <h2>5. Struttura organizzativa</h2>\n\n  <p>\n    Il Comitato riunisce\n    partecipanti provenienti\n    da diversi settori della società civile\n    per sostenere l'iniziativa proposta\n    del Polo Globale dell'IA\n    nella Città Speciale di Goyang.\n  </p>\n\n  <a href=\"committee-chart.jpg\"\n     target=\"_blank\"\n     rel=\"noopener noreferrer\">\n\n    <img\n      class=\"chart\"\n      src=\"committee-chart.jpg\"\n      alt=\"Organigramma del Comitato Civico Promotore per l'insediamento del Polo Globale dell'IA nella Città Speciale di Goyang\"\n      loading=\"lazy\">\n\n  </a>\n\n  <p class=\"chart-link\">\n    Selezionare l'organigramma\n    per visualizzare un'immagine ingrandita.\n  </p>\n\n  <p class=\"note\">\n    L'organigramma è disponibile in lingua coreana.\n  </p>\n</section>\n\n\u003c!-- 6. PRINCIPALI TAPPE -->\n\n<section>\n  <h2>6. Principali tappe</h2>\n\n  <div class=\"timeline\">\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        7 settembre 2026\n      </div>\n      <div>\n        Cerimonia di inaugurazione\n        del Comitato Civico Promotore\n        per l'insediamento del Polo Globale dell'IA.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        14 ottobre 2026\n      </div>\n      <div>\n        Audizione pubblica\n        sui criteri di valutazione\n        per la selezione della sede\n        del Polo Globale dell'IA.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        15 ottobre 2026\n      </div>\n      <div>\n        Preparazione di raccomandazioni\n        per migliorare i criteri di valutazione\n        relativi alla selezione della sede\n        del Polo Globale dell'IA.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        20 ottobre 2026\n      </div>\n      <div>\n        Partecipazione al 7° Seminario\n        sulla Strategia di Innovazione di Goyang.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        26 ottobre 2026\n      </div>\n      <div>\n        Il Consiglio della Città Speciale di Goyang\n        ha adottato una risoluzione\n        a favore dell'insediamento\n        del Polo Globale dell'IA.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        30 ottobre 2026\n      </div>\n      <div>\n        Forum strategico\n        della Provincia di Gyeonggi\n        per l'insediamento\n        del Polo Globale dell'IA.\n      </div>\n    </div>\n\n  </div>\n\n  <p class=\"note\">\n    Le tappe sopra riportate\n    riflettono le attività\n    e gli sviluppi elencati\n    nella presentazione del Comitato\n    in lingua coreana.\n  </p>\n</section>\n\n\u003c!-- 7. PARTECIPAZIONE DEI CITTADINI -->\n\n<section>\n  <h2>7. Partecipazione dei cittadini</h2>\n\n  <p>\n    Il Polo Globale dell'IA proposto\n    è un'iniziativa civica condivisa\n    che mira ad ampliare\n    le opportunità di crescita futura di Goyang\n    e a sostenere il suo sviluppo\n    come città di cooperazione internazionale.\n  </p>\n\n  <p>\n    I cittadini sono incoraggiati\n    a partecipare attraverso\n    manifestazioni di sostegno online,\n    registrazione al Comitato,\n    adesione come soci sostenitori\n    e attività di sensibilizzazione pubblica.\n  </p>\n\n  <a href=\"participate.html?lang=it\"\n     class=\"button\">\n    Centro di partecipazione dei cittadini\n  </a>\n\n  <a href=\"index.html?lang=it\"\n     class=\"button\">\n    Homepage italiana\n  </a>\n\n</section>\n\n\u003c!-- 8. STATO ISTITUZIONALE -->\n\n<section>\n  <h2>8. Stato istituzionale</h2>\n\n  <p>\n    Il Comitato Civico Promotore\n    è un'organizzazione promossa\n    dalla società civile\n    che sostiene l'iniziativa proposta\n    del Polo Globale dell'IA\n    nella Città Speciale di Goyang.\n  </p>\n\n  <p>\n    Il Comitato non è presentato\n    come un'organizzazione internazionale\n    né come un'autorità governativa\n    responsabile delle decisioni ufficiali\n    relative alla selezione della sede.\n  </p>\n\n  <p>\n    Qualsiasi partecipazione istituzionale formale,\n    decisione relativa alla sede\n    o misura di sostegno pubblico\n    richiederebbe l'approvazione\n    attraverso le procedure\n    delle autorità competenti.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      Il Comitato intende contribuire\n      attraverso il coinvolgimento pubblico,\n      proposte politiche costruttive\n      e una cooperazione responsabile.\n    </strong>\n  </div>\n</section>\n\n</main>\n\n<footer>\n  <p>\n    <strong>\n      Comitato Civico Promotore<br>\n      per l'insediamento del Polo Globale dell'IA<br>\n      nella Città Speciale di Goyang\n    </strong>\n  </p>\n\n  <p>\n    Provincia di Gyeonggi, Repubblica di Corea\n  </p>\n\n  <p>\n    Con i cittadini, con la Provincia di Gyeonggi\n    e con il mondo.\n  </p>\n\n  <p>\n    <a href=\"index.html?lang=it\">\n      Homepage italiana\n    </a>\n  </p>\n</footer>\n\n</body>\n</html>\n",
  "lang=ja": "<!DOCTYPE html>\n<html lang=\"ja\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\n市民推進委員会について |\nグローバルAIハブ構想\n</title>\n\n<meta name=\"description\"\ncontent=\"高陽特例市グローバルAIハブ誘致市民推進委員会について紹介します。委員会の目的、基本原則、主要活動、委員長のご挨拶、組織構成、主な沿革、市民参加についてご案内します。\">\n\n<style>\n\n/* =====================================\n   基本設定\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n\n  font-family:\n    \"Noto Sans JP\",\n    \"Hiragino Kaku Gothic ProN\",\n    \"Yu Gothic\",\n    Meiryo,\n    Arial,\n    sans-serif;\n\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ヘッダー\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   メインコンテンツ\n===================================== */\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   スローガン\n===================================== */\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n/* =====================================\n   委員長のご挨拶\n===================================== */\n\n.greeting {\n  font-size: 17px;\n}\n\n.greeting p {\n  margin-bottom: 20px;\n}\n\n.signature {\n  text-align: right;\n  margin-top: 30px;\n  font-weight: bold;\n}\n\n/* =====================================\n   組織図\n===================================== */\n\n.chart {\n  display: block;\n  width: 100%;\n  height: auto;\n  border-radius: 8px;\n  cursor: zoom-in;\n}\n\n.chart-link {\n  display: block;\n  text-align: center;\n  margin-top: 15px;\n  color: #0754a6;\n}\n\n/* =====================================\n   沿革\n===================================== */\n\n.timeline {\n  border-left: 4px solid #168de0;\n  padding-left: 25px;\n}\n\n.timeline-item {\n  margin-bottom: 25px;\n}\n\n.timeline-date {\n  font-weight: bold;\n  color: #0754a6;\n}\n\n/* =====================================\n   ボタン\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   基本原則・主要活動\n===================================== */\n\n.principles {\n  display: grid;\n\n  grid-template-columns:\n    repeat(auto-fit, minmax(230px, 1fr));\n\n  gap: 18px;\n}\n\n.principle-card {\n  background: #f4f8fc;\n  padding: 22px;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.principle-card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   強調表示\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 22px;\n  border-radius: 8px;\n  margin-top: 20px;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* =====================================\n   フッター\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   モバイル対応\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .greeting {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ヘッダー\n===================================== -->\n\n<header>\n\n<h1>\n市民推進委員会について\n</h1>\n\n<p>\n高陽特例市グローバルAIハブ誘致<br>\n市民推進委員会\n</p>\n\n<p>\n大韓民国・京畿道\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=ja\"\nclass=\"home-link\">\n← 日本語ホーム\n</a>\n\n<a href=\"committee.html\"\nclass=\"home-link\"\nlang=\"ko\">\n한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     スローガン\n===================================== -->\n\n<section>\n\n<div class=\"slogan\">\n\n高陽特例市の新たな成長エンジン。<br>\n雇用の新たな機会。<br>\n国際協力のためのグローバルAIハブ。\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     1. 市民推進委員会の目的\n===================================== -->\n\n<section>\n\n<h2>\n1. 市民推進委員会の目的\n</h2>\n\n<p>\n高陽特例市グローバルAIハブ誘致\n市民推進委員会は、\n高陽特例市の将来の発展を支えるため、\n市民と地域社会の関係者が\n力を合わせることを目的として\n設立された市民主体の組織です。\n</p>\n\n<p>\n委員会は、\n新たな成長機会の創出、\n質の高い雇用の拡大、\n地域経済の活性化、\nそして国際協力都市としての\n高陽特例市の可能性を\n高めることを目指しています。\n</p>\n\n<p>\n主な活動には、\n市民の理解促進、\n政策研究、\n誘致戦略の策定、\n関係機関との協力の促進、\n市民参加の拡大などがあります。\n</p>\n\n<p>\n委員会は、\nグローバルAIハブが\n単に国際機関の事務所を\n集める場所にとどまっては\nならないと考えています。\n</p>\n\n<p>\n人工知能を責任ある方法で活用し、\n人類が直面する共通の課題に\n取り組むための\n国際協力プラットフォームへと\n発展することが重要です。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n市民参加、\n客観的な根拠に基づく政策提案、\n建設的な協力を通じて、\n委員会は高陽特例市の\n新たな未来を準備することに\n貢献していきます。\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     2. 4つの基本原則\n===================================== -->\n\n<section>\n\n<h2>\n2. 4つの基本原則\n</h2>\n\n<p>\n委員会は、\n自発的な市民参加、\n公共的な説明責任、\n透明性、\n客観的な根拠に基づく\n政策形成を重視しています。\n</p>\n\n<div class=\"principles\">\n\n<article class=\"principle-card\">\n\n<h3>\n01. 市民中心の参加\n</h3>\n\n<p>\n市民、\n市民団体、\n専門家、\n地域企業、\nその他の地域社会の関係者による\n自発的な参加を促進します。\n</p>\n\n</article>\n\n<article class=\"principle-card\">\n\n<h3>\n02. 根拠に基づく政策\n</h3>\n\n<p>\n客観的な情報と\n政策研究を通じて、\n高陽特例市の立地上の強みを分析し、\nグローバルAIハブ構想のための\n実践的な政策提案を策定します。\n</p>\n\n</article>\n\n<article class=\"principle-card\">\n\n<h3>\n03. 幅広い機関間協力\n</h3>\n\n<p>\n高陽特例市、\n京畿道、\n関係する中央政府機関、\n大学、\n研究機関、\n企業、\n市民社会との\n協力の可能性を探ります。\n</p>\n\n</article>\n\n<article class=\"principle-card\">\n\n<h3>\n04. 透明性と説明責任\n</h3>\n\n<p>\n責任ある組織運営、\n市民への情報提供、\n委員会の活動と\n主要な進展に関する\n透明性の確保を推進します。\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. 主な活動\n===================================== -->\n\n<section>\n\n<h2>\n3. 主な活動\n</h2>\n\n<div class=\"principles\">\n\n<article class=\"principle-card\">\n\n<h3>\n市民の理解促進と参加\n</h3>\n\n<p>\nオンラインでの支持表明、\n広報活動、\n市民との対話を通じて、\nグローバルAIハブ構想に対する\n市民の理解を深めます。\n</p>\n\n</article>\n\n<article class=\"principle-card\">\n\n<h3>\n政策研究と提案\n</h3>\n\n<p>\n高陽特例市の都市資源と\n国際協力に必要となる\n潜在的な条件を評価し、\n競争力のある誘致戦略と\n政策提言を策定します。\n</p>\n\n</article>\n\n<article class=\"principle-card\">\n\n<h3>\n協力関係の拡大\n</h3>\n\n<p>\n公共機関、\n医療機関、\n大学、\n研究機関、\n企業との\n協力の可能性を探ります。\n</p>\n\n</article>\n\n<article class=\"principle-card\">\n\n<h3>\n地域発展の機会創出\n</h3>\n\n<p>\n構想中のグローバルAIハブを、\n研究開発、\n産業活動、\n若者の雇用、\n持続可能な地域成長と\n結び付ける方法を検討します。\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\nこれらの活動は、\n委員会の目標と\n提案する方向性を示すものです。\n国際機関の移転決定、\n正式な機関間協力、\n承認済み事業が\n確定していることを\n意味するものではありません。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     4. 委員長のご挨拶\n===================================== -->\n\n<section>\n\n<h2>\n4. 委員長のご挨拶\n</h2>\n\n<div class=\"greeting\">\n\n<p>\n高陽特例市の市民の皆様へ\n</p>\n\n<p>\n私たちは今、\n高陽特例市の未来を左右する\n重要な時期を迎えています。\n</p>\n\n<p>\n高陽特例市は、\n過去数十年にわたり、\nソウル首都圏の主要な\n住宅都市として発展してきました。\n</p>\n\n<p>\nしかし、\n市民の期待に応えるだけの\n質の高い雇用機会と\n持続可能な成長エンジンを、\nいまだ十分に確保できていません。\n</p>\n\n<p>\nグローバルAIハブ構想は、\nこうした構造的な課題に取り組み、\n高陽特例市が国際社会と\nつながる都市へと\n発展するための\n新たな機会となり得ます。\n</p>\n\n<p>\nしかし、\nグローバルAIハブは、\n単に国際機関の事務所を\n誘致する事業に\nとどまってはなりません。\n</p>\n\n<p>\n疾病と飢餓、\n気候変動と災害、\n難民と移住、\n失業、\n教育格差など、\n人類が直面する課題の解決に、\n責任ある人工知能の活用を通じて\n貢献するものでなければなりません。\n</p>\n\n<p>\n高陽特例市には、\n国際協力を支える可能性のある\n多様な資源が存在しています。\n</p>\n\n<p>\n今重要なのは、\nこれらの資源を効果的に活用するため、\n具体的で、\n実践的で、\n実現可能な計画を\n策定することです。\n</p>\n\n<p>\n私たち市民推進委員会は、\n市民の熱意を集めることだけに\nとどまりません。\n</p>\n\n<p>\n政策の選択肢を研究し、\n協力を促進し、\n実質的な準備と\n具体的な成果の実現に向けて\n取り組んでまいります。\n</p>\n\n<p>\n京畿道全域の市民社会が\n力を合わせ、\n市民が共通のビジョンの下に\n結集することを願っています。\n</p>\n\n<p>\n高陽特例市の未来のために、\nそして人類のより良い未来のために、\n皆様のご参加を\n心よりお願い申し上げます。\n</p>\n\n<p>\nありがとうございます。\n</p>\n\n<div class=\"signature\">\n\n洪永杓（ホン・ヨンピョ）<br>\n委員長<br>\n高陽特例市グローバルAIハブ誘致<br>\n市民推進委員会\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     5. 組織構成\n===================================== -->\n\n<section>\n\n<h2>\n5. 組織構成\n</h2>\n\n<p>\n委員会は、\n高陽特例市のグローバルAIハブ構想を\n支援するため、\n市民社会のさまざまな分野から\n参加者が集まる組織です。\n</p>\n\n<a\n  href=\"committee-chart.jpg\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n\n<img\n  class=\"chart\"\n  src=\"committee-chart.jpg\"\n  alt=\"高陽特例市グローバルAIハブ誘致市民推進委員会の組織図\"\n  loading=\"lazy\"\n>\n\n</a>\n\n<p class=\"chart-link\">\n組織図をクリックすると、\n拡大画像をご覧いただけます。\n</p>\n\n<p class=\"note\">\n組織図は韓国語で作成されています。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     6. 主な沿革\n===================================== -->\n\n<section>\n\n<h2>\n6. 主な沿革\n</h2>\n\n<div class=\"timeline\">\n\n\u003c!-- 2026.09.07 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n2026年9月7日\n</div>\n\n<div>\nグローバルAIハブ誘致\n市民推進委員会発足式\n</div>\n\n</div>\n\n\u003c!-- 2026.10.14 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n2026年10月14日\n</div>\n\n<div>\nグローバルAIハブ立地選定\n評価基準に関する公聴会\n</div>\n\n</div>\n\n\u003c!-- 2026.10.15 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n2026年10月15日\n</div>\n\n<div>\nグローバルAIハブ立地選定\n評価基準の改善に関する\n提言の作成\n</div>\n\n</div>\n\n\u003c!-- 2026.10.20 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n2026年10月20日\n</div>\n\n<div>\n第7回高陽イノベーション\n戦略セミナーへの参加\n</div>\n\n</div>\n\n\u003c!-- 2026.10.26 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n2026年10月26日\n</div>\n\n<div>\n高陽特例市議会による\nグローバルAIハブ誘致促進決議の採択\n</div>\n\n</div>\n\n\u003c!-- 2026.10.30 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n2026年10月30日\n</div>\n\n<div>\n京畿道グローバルAIハブ\n誘致戦略フォーラム\n</div>\n\n</div>\n\n</div>\n\n<p class=\"note\">\n上記の沿革は、\n韓国語版の委員会紹介に\n掲載されている活動と\n主な進展を反映しています。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     7. 市民参加\n===================================== -->\n\n<section>\n\n<h2>\n7. 市民参加\n</h2>\n\n<p>\nグローバルAIハブ構想は、\n高陽特例市の将来的な\n成長機会を広げ、\n国際協力都市としての発展を\n支えることを目指す\n市民共同の取り組みです。\n</p>\n\n<p>\n市民の皆様には、\nオンラインでの支持表明、\n委員会への登録、\n賛助会員としての参加、\n広報活動などを通じた\n自発的な参加をお願いしています。\n</p>\n\n<a\n  href=\"participate.html?lang=ja\"\n  class=\"button\"\n>\n市民参加センター\n</a>\n\n<a\n  href=\"index.html?lang=ja\"\n  class=\"button\"\n>\n日本語ホームページ\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. 制度的位置づけ\n===================================== -->\n\n<section>\n\n<h2>\n8. 制度的位置づけ\n</h2>\n\n<p>\n市民推進委員会は、\n高陽特例市における\nグローバルAIハブ構想を\n支持する市民主体の組織です。\n</p>\n\n<p>\n委員会は、\n国際機関として、\nまたは正式な立地選定を\n決定する政府機関として\n位置付けられているものではありません。\n</p>\n\n<p>\n国際機関の正式な参加、\n立地の決定、\n公的支援措置などには、\n関係当局の所定の手続きに基づく\n承認が必要です。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n委員会は、\n市民参加、\n建設的な政策提案、\n責任ある協力を通じて、\nグローバルAIハブ構想に\n貢献することを目指しています。\n</strong>\n\n</div>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     フッター\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\n高陽特例市グローバルAIハブ誘致<br>\n市民推進委員会\n</strong>\n</p>\n\n<p>\n大韓民国・京畿道\n</p>\n\n<p>\n市民とともに、<br>\n京畿道とともに、<br>\n世界とともに。\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ja\">\n日本語ホーム\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"committee.html\" lang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=ru": "<!DOCTYPE html>\n<html lang=\"ru\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nО Гражданском комитете содействия |\nИнициатива «Глобальный центр ИИ»\n</title>\n\n<meta name=\"description\"\ncontent=\"Информация о Гражданском комитете содействия размещению Глобального центра ИИ в особом городе Коян: цели, принципы, деятельность, обращение председателя, организационная структура и основные этапы работы.\">\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n.greeting {\n  font-size: 17px;\n}\n\n.greeting p {\n  margin-bottom: 20px;\n}\n\n.signature {\n  text-align: right;\n  margin-top: 30px;\n  font-weight: bold;\n}\n\n.chart {\n  display: block;\n  width: 100%;\n  height: auto;\n  border-radius: 8px;\n  cursor: zoom-in;\n}\n\n.chart-link {\n  display: block;\n  text-align: center;\n  margin-top: 15px;\n  color: #0754a6;\n}\n\n.timeline {\n  border-left: 4px solid #168de0;\n  padding-left: 25px;\n}\n\n.timeline-item {\n  margin-bottom: 25px;\n}\n\n.timeline-date {\n  font-weight: bold;\n  color: #0754a6;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.principles {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(230px, 1fr));\n  gap: 18px;\n}\n\n.principle-card {\n  background: #f4f8fc;\n  padding: 22px;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.principle-card h3 {\n  margin-top: 0;\n}\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 22px;\n  border-radius: 8px;\n  margin-top: 20px;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .greeting {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n}\n</style>\n</head>\n\n<body>\n\n<header>\n  <h1>\n    О Гражданском комитете содействия\n  </h1>\n\n  <p>\n    Гражданский комитет содействия<br>\n    размещению Глобального центра ИИ<br>\n    в особом городе Коян\n  </p>\n\n  <p>\n    Провинция Кёнгидо, Республика Корея\n  </p>\n\n  <div class=\"header-links\">\n    <a href=\"index.html?lang=ru\" class=\"home-link\">\n      ← Главная страница\n    </a>\n\n    <a href=\"committee.html\"\n       class=\"home-link\"\n       lang=\"ko\">\n      한국어\n    </a>\n  </div>\n</header>\n\n<main>\n\n\u003c!-- СЛОГАН -->\n\n<section>\n  <div class=\"slogan\">\n    Новый двигатель роста для Кояна.<br>\n    Новые возможности трудоустройства.<br>\n    Глобальный центр ИИ для международного сотрудничества.\n  </div>\n</section>\n\n\u003c!-- 1. ЦЕЛИ КОМИТЕТА -->\n\n<section>\n  <h2>1. Цели Комитета</h2>\n\n  <p>\n    Гражданский комитет содействия\n    размещению Глобального центра ИИ\n    в особом городе Коян\n    представляет собой инициативу,\n    созданную по инициативе граждан\n    для объединения жителей\n    и представителей местного сообщества\n    в поддержку будущего развития Кояна.\n  </p>\n\n  <p>\n    Комитет стремится содействовать\n    созданию новых возможностей\n    экономического роста,\n    качественных рабочих мест,\n    повышению экономической активности региона\n    и развитию потенциала Кояна\n    как города международного сотрудничества.\n  </p>\n\n  <p>\n    Его деятельность включает\n    повышение общественной осведомлённости,\n    проведение исследований\n    в области государственной политики,\n    разработку стратегий привлечения,\n    содействие институциональному сотрудничеству\n    и поощрение участия граждан.\n  </p>\n\n  <p>\n    Комитет считает,\n    что Глобальный центр ИИ\n    должен стать чем-то большим,\n    чем просто местом размещения\n    представительств международных организаций.\n  </p>\n\n  <p>\n    Он должен развиваться\n    как платформа международного сотрудничества,\n    изучающая возможности\n    ответственного применения\n    искусственного интеллекта\n    для решения общих глобальных проблем.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      Посредством участия граждан,\n      разработки политических предложений\n      на основе объективных данных\n      и конструктивного сотрудничества\n      Комитет стремится содействовать\n      подготовке нового будущего\n      для особого города Коян.\n    </strong>\n  </div>\n</section>\n\n\u003c!-- 2. ПРИНЦИПЫ -->\n\n<section>\n  <h2>2. Основные принципы деятельности</h2>\n\n  <p>\n    Комитет поддерживает\n    добровольное участие граждан,\n    общественную подотчётность,\n    прозрачность\n    и разработку государственной политики\n    на основе объективных данных.\n  </p>\n\n  <div class=\"principles\">\n\n    <article class=\"principle-card\">\n      <h3>01. Участие с ориентацией на граждан</h3>\n      <p>\n        Поощрение добровольного участия\n        граждан,\n        общественных организаций,\n        экспертов,\n        местных предприятий\n        и других представителей\n        местного сообщества.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>02. Политика на основе объективных данных</h3>\n      <p>\n        Анализ преимуществ расположения Кояна\n        с использованием объективной информации\n        и исследований в области политики,\n        а также разработка практических предложений\n        по инициативе Глобального центра ИИ.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>03. Широкое институциональное сотрудничество</h3>\n      <p>\n        Изучение возможностей сотрудничества\n        с особым городом Коян,\n        провинцией Кёнгидо,\n        соответствующими национальными органами,\n        университетами,\n        научно-исследовательскими учреждениями,\n        предприятиями\n        и гражданским обществом.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>04. Прозрачность и подотчётность</h3>\n      <p>\n        Содействие ответственному управлению,\n        открытому информированию общественности\n        и прозрачности деятельности Комитета\n        и основных этапов её развития.\n      </p>\n    </article>\n\n  </div>\n</section>\n\n\u003c!-- 3. ОСНОВНАЯ ДЕЯТЕЛЬНОСТЬ -->\n\n<section>\n  <h2>3. Основные направления деятельности</h2>\n\n  <div class=\"principles\">\n\n    <article class=\"principle-card\">\n      <h3>Информирование и участие общественности</h3>\n      <p>\n        Повышение общественного понимания\n        инициативы Глобального центра ИИ\n        посредством выражения поддержки\n        через интернет,\n        информационно-просветительских мероприятий\n        и общения с гражданами.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>Исследования и предложения в области политики</h3>\n      <p>\n        Оценка городских ресурсов Кояна\n        и потенциальных требований\n        международного сотрудничества\n        для разработки конкурентоспособных\n        стратегий привлечения\n        и рекомендаций в области политики.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>Расширение сотрудничества</h3>\n      <p>\n        Изучение возможностей сотрудничества\n        с государственными учреждениями,\n        медицинскими организациями,\n        университетами,\n        научно-исследовательскими учреждениями\n        и предприятиями.\n      </p>\n    </article>\n\n    <article class=\"principle-card\">\n      <h3>Возможности регионального развития</h3>\n      <p>\n        Изучение способов объединения\n        предлагаемого Глобального центра ИИ\n        с научными исследованиями и разработками,\n        промышленной деятельностью,\n        занятостью молодёжи\n        и устойчивым региональным ростом.\n      </p>\n    </article>\n\n  </div>\n\n  <p class=\"note\">\n    Указанные направления деятельности\n    отражают цели Комитета\n    и предлагаемые направления работы.\n    Они не означают подтверждённых решений\n    о перемещении организаций,\n    официальных институциональных партнёрств\n    или утверждённых проектов.\n  </p>\n</section>\n\n\u003c!-- 4. ОБРАЩЕНИЕ ПРЕДСЕДАТЕЛЯ -->\n\n<section>\n  <h2>4. Обращение председателя</h2>\n\n  <div class=\"greeting\">\n\n    <p>\n      Уважаемые жители особого города Коян!\n    </p>\n\n    <p>\n      Мы находимся на важном этапе,\n      который может определить\n      будущее особого города Коян.\n    </p>\n\n    <p>\n      За последние несколько десятилетий\n      Коян превратился\n      в крупный жилой город\n      Сеульского столичного региона.\n      Однако городу пока не удалось\n      создать достаточное количество\n      качественных рабочих мест\n      и устойчивых источников роста,\n      отвечающих ожиданиям его жителей.\n    </p>\n\n    <p>\n      Предлагаемый Глобальный центр ИИ\n      представляет собой возможность\n      решить эти структурные проблемы\n      и содействовать развитию Кояна\n      как города,\n      активно связанного\n      с международным сообществом.\n    </p>\n\n    <p>\n      Однако Глобальный центр ИИ\n      не должен превращаться\n      лишь в проект по привлечению\n      представительств международных организаций.\n    </p>\n\n    <p>\n      Он должен способствовать\n      решению проблем,\n      стоящих перед человечеством,\n      включая болезни и голод,\n      изменение климата\n      и стихийные бедствия,\n      проблемы беженцев и миграции,\n      безработицу\n      и неравенство в образовании,\n      посредством ответственного применения\n      искусственного интеллекта.\n    </p>\n\n    <p>\n      Особый город Коян располагает\n      разнообразными ресурсами,\n      которые могут способствовать\n      международному сотрудничеству.\n      Сейчас особенно важно\n      разработать конкретные,\n      практические\n      и осуществимые планы\n      эффективного использования\n      этих ресурсов.\n    </p>\n\n    <p>\n      Наш Гражданский комитет содействия\n      не ограничится\n      лишь объединением\n      общественного энтузиазма.\n      Мы будем изучать\n      возможные политические решения,\n      поощрять сотрудничество\n      и работать над содержательной подготовкой\n      и достижением ощутимых результатов.\n    </p>\n\n    <p>\n      Пусть гражданское общество\n      всей провинции Кёнгидо\n      объединит свои усилия,\n      а её жители сплотятся\n      вокруг общего видения будущего.\n    </p>\n\n    <p>\n      Ради будущего\n      особого города Коян\n      и лучшего будущего\n      всего человечества\n      я приглашаю вас\n      присоединиться к нам.\n    </p>\n\n    <p>\n      Благодарю вас.\n    </p>\n\n    <div class=\"signature\">\n      Хон Ён Пхё<br>\n      Председатель<br>\n      Гражданского комитета содействия<br>\n      размещению Глобального центра ИИ<br>\n      в особом городе Коян\n    </div>\n\n  </div>\n</section>\n\n\u003c!-- 5. ОРГАНИЗАЦИОННАЯ СТРУКТУРА -->\n\n<section>\n  <h2>5. Организационная структура</h2>\n\n  <p>\n    Комитет объединяет\n    представителей различных\n    сфер гражданского общества\n    для поддержки предлагаемой инициативы\n    Глобального центра ИИ\n    в особом городе Коян.\n  </p>\n\n  <a href=\"committee-chart.jpg\"\n     target=\"_blank\"\n     rel=\"noopener noreferrer\">\n\n    <img\n      class=\"chart\"\n      src=\"committee-chart.jpg\"\n      alt=\"Организационная структура Гражданского комитета содействия размещению Глобального центра ИИ в особом городе Коян\"\n      loading=\"lazy\">\n\n  </a>\n\n  <p class=\"chart-link\">\n    Нажмите на организационную схему,\n    чтобы открыть увеличенное изображение.\n  </p>\n\n  <p class=\"note\">\n    Организационная схема представлена\n    на корейском языке.\n  </p>\n</section>\n\n\u003c!-- 6. ОСНОВНЫЕ ЭТАПЫ -->\n\n<section>\n  <h2>6. Основные этапы деятельности</h2>\n\n  <div class=\"timeline\">\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        7 сентября 2026 года\n      </div>\n      <div>\n        Церемония официального открытия\n        Гражданского комитета содействия\n        размещению Глобального центра ИИ.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        14 октября 2026 года\n      </div>\n      <div>\n        Общественные слушания\n        по критериям оценки\n        при выборе места размещения\n        Глобального центра ИИ.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        15 октября 2026 года\n      </div>\n      <div>\n        Подготовка рекомендаций\n        по совершенствованию критериев оценки\n        при выборе места размещения\n        Глобального центра ИИ.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        20 октября 2026 года\n      </div>\n      <div>\n        Участие в седьмом\n        семинаре по инновационной стратегии Кояна.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        26 октября 2026 года\n      </div>\n      <div>\n        Совет особого города Коян\n        принял резолюцию,\n        призывающую к привлечению\n        Глобального центра ИИ.\n      </div>\n    </div>\n\n    <div class=\"timeline-item\">\n      <div class=\"timeline-date\">\n        30 октября 2026 года\n      </div>\n      <div>\n        Форум по стратегии привлечения\n        Глобального центра ИИ\n        в провинцию Кёнгидо.\n      </div>\n    </div>\n\n  </div>\n\n  <p class=\"note\">\n    Указанные этапы отражают\n    мероприятия и события,\n    перечисленные в корейскоязычном\n    разделе, посвящённом Комитету.\n  </p>\n</section>\n\n\u003c!-- 7. УЧАСТИЕ ГРАЖДАН -->\n\n<section>\n  <h2>7. Участие граждан</h2>\n\n  <p>\n    Предлагаемый Глобальный центр ИИ\n    представляет собой\n    совместную гражданскую инициативу,\n    направленную на расширение\n    возможностей будущего роста Кояна\n    и содействие его развитию\n    как города международного сотрудничества.\n  </p>\n\n  <p>\n    Гражданам предлагается участвовать\n    посредством выражения поддержки\n    через интернет,\n    регистрации в Комитете,\n    участия в программе поддерживающего членства\n    и информационно-просветительской деятельности.\n  </p>\n\n  <a href=\"participate.html?lang=ru\"\n     class=\"button\">\n    Центр участия граждан\n  </a>\n\n  <a href=\"index.html?lang=ru\"\n     class=\"button\">\n    Главная страница\n  </a>\n\n</section>\n\n\u003c!-- 8. ИНСТИТУЦИОНАЛЬНЫЙ СТАТУС -->\n\n<section>\n  <h2>8. Институциональный статус</h2>\n\n  <p>\n    Гражданский комитет содействия\n    является организацией,\n    созданной по инициативе граждан\n    для поддержки предлагаемого\n    Глобального центра ИИ\n    в особом городе Коян.\n  </p>\n\n  <p>\n    Комитет не является\n    международной организацией\n    или государственным органом,\n    уполномоченным принимать\n    официальные решения\n    о выборе места размещения.\n  </p>\n\n  <p>\n    Любое официальное участие учреждений,\n    решение о размещении\n    или мера государственной поддержки\n    потребует утверждения\n    в соответствии с процедурами\n    соответствующих компетентных органов.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      Комитет стремится вносить вклад\n      посредством участия общественности,\n      конструктивных предложений\n      в области государственной политики\n      и ответственного сотрудничества.\n    </strong>\n  </div>\n</section>\n\n</main>\n\n<footer>\n  <p>\n    <strong>\n      Гражданский комитет содействия<br>\n      размещению Глобального центра ИИ<br>\n      в особом городе Коян\n    </strong>\n  </p>\n\n  <p>\n    Провинция Кёнгидо, Республика Корея\n  </p>\n\n  <p>\n    Вместе с гражданами,\n    вместе с провинцией Кёнгидо\n    и вместе со всем миром.\n  </p>\n\n  <p>\n    <a href=\"index.html?lang=ru\">\n      Главная страница\n    </a>\n    &nbsp; | &nbsp;\n    <a href=\"committee.html\" lang=\"ko\">\n      한국어\n    </a>\n  </p>\n</footer>\n\n</body>\n</html>\n",
  "lang=zh": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\n关于市民推进委员会 | 全球人工智能枢纽倡议\n</title>\n\n<meta\n  name=\"description\"\n  content=\"了解高阳特例市全球人工智能枢纽引进市民推进委员会的宗旨、基本原则、主要活动、委员长致辞、组织架构及重要发展历程。\"\n>\n\n<style>\n\n/* =====================================\n   基本设置\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    \"Microsoft YaHei\",\n    \"PingFang SC\",\n    \"Noto Sans SC\",\n    Arial,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   页眉\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 42px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   主要内容\n===================================== */\n\nmain {\n  max-width: 1100px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   宣传标语\n===================================== */\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n/* =====================================\n   委员长致辞\n===================================== */\n\n.greeting {\n  font-size: 17px;\n}\n\n.greeting p {\n  margin-bottom: 20px;\n}\n\n.signature {\n  text-align: right;\n  margin-top: 30px;\n  font-weight: bold;\n}\n\n/* =====================================\n   组织架构图\n===================================== */\n\n.chart {\n  display: block;\n  width: 100%;\n  height: auto;\n  border-radius: 8px;\n  cursor: zoom-in;\n}\n\n.chart-link {\n  display: block;\n  text-align: center;\n  margin-top: 15px;\n  color: #0754a6;\n}\n\n/* =====================================\n   发展历程\n===================================== */\n\n.timeline {\n  border-left: 4px solid #168de0;\n  padding-left: 25px;\n}\n\n.timeline-item {\n  margin-bottom: 25px;\n}\n\n.timeline-date {\n  font-weight: bold;\n  color: #0754a6;\n}\n\n/* =====================================\n   按钮\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   基本原则卡片\n===================================== */\n\n.principles {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(230px, 1fr));\n  gap: 18px;\n}\n\n.principle-card {\n  background: #f4f8fc;\n  padding: 22px;\n  border-radius: 10px;\n  border-top: 4px solid #168de0;\n}\n\n.principle-card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   重点信息\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 22px;\n  border-radius: 8px;\n  margin-top: 20px;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* =====================================\n   页脚\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   移动设备\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .greeting {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     页眉\n===================================== -->\n\n<header>\n\n<h1>\n关于市民推进委员会\n</h1>\n\n<p>\n高阳特例市全球人工智能枢纽<br>\n引进市民推进委员会\n</p>\n\n<p>\n大韩民国京畿道\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=zh\"\n  class=\"home-link\"\n>\n  ← 中文首页\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     宣传标语\n===================================== -->\n\n<section>\n\n<div class=\"slogan\">\n\n高阳发展的新增长动力。<br>\n\n创造就业的新机遇。<br>\n\n促进国际合作的全球人工智能枢纽。\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     1. 推进委员会的宗旨\n===================================== -->\n\n<section>\n\n<h2>\n1. 推进委员会的宗旨\n</h2>\n\n<p>\n高阳特例市全球人工智能枢纽\n引进市民推进委员会\n是一项由市民主导的民间倡议，\n旨在汇聚市民\n及当地社会各界的力量，\n共同支持高阳特例市的未来发展。\n</p>\n\n<p>\n委员会希望为创造新的增长机会、\n高质量就业、\n增强区域经济活力，\n以及提升高阳市作为\n国际合作城市的发展潜力\n作出贡献。\n</p>\n\n<p>\n委员会的主要活动包括\n提高公众认知、\n开展政策研究、\n制定引进战略、\n促进机构间合作，\n以及鼓励市民参与。\n</p>\n\n<p>\n委员会认为，\n全球人工智能枢纽\n不应仅仅成为\n国际组织办公机构的集中地。\n</p>\n\n<p>\n它应发展成为一个国际合作平台，\n探索如何负责任地应用人工智能，\n共同应对人类面临的全球性挑战。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n通过市民参与、\n以客观证据为基础的政策建议\n以及建设性合作，\n委员会希望为高阳特例市\n开创新的未来做好准备。\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     2. 四项基本原则\n===================================== -->\n\n<section>\n\n<h2>\n2. 四项基本原则\n</h2>\n\n<p>\n委员会坚持自愿参与、\n公共责任、\n透明运作\n以及以客观证据为基础的政策制定原则。\n</p>\n\n<div class=\"principles\">\n\n\u003c!-- 原则 01 -->\n\n<article class=\"principle-card\">\n\n<h3>\n01. 以市民为中心的参与\n</h3>\n\n<p>\n鼓励市民、\n民间组织、\n专家、\n当地企业\n以及其他社区利益相关方\n自愿参与。\n</p>\n\n</article>\n\n\u003c!-- 原则 02 -->\n\n<article class=\"principle-card\">\n\n<h3>\n02. 以客观证据为基础的政策\n</h3>\n\n<p>\n利用客观信息\n和政策研究成果，\n分析高阳特例市的区位优势，\n并为全球人工智能枢纽倡议\n制定切实可行的政策建议。\n</p>\n\n</article>\n\n\u003c!-- 原则 03 -->\n\n<article class=\"principle-card\">\n\n<h3>\n03. 广泛的机构合作\n</h3>\n\n<p>\n探索与高阳特例市、\n京畿道、\n韩国相关中央政府部门、\n大学、\n科研机构、\n企业\n以及民间社会\n开展合作的机会。\n</p>\n\n</article>\n\n\u003c!-- 原则 04 -->\n\n<article class=\"principle-card\">\n\n<h3>\n04. 透明度与责任\n</h3>\n\n<p>\n推动负责任的组织运营、\n公开信息交流，\n并提高委员会活动\n及重大进展的透明度。\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. 主要活动\n===================================== -->\n\n<section>\n\n<h2>\n3. 主要活动\n</h2>\n\n<div class=\"principles\">\n\n\u003c!-- 活动 01 -->\n\n<article class=\"principle-card\">\n\n<h3>\n公众认知与参与\n</h3>\n\n<p>\n通过线上支持活动、\n宣传推广\n以及与市民的沟通交流，\n增进公众对全球人工智能枢纽倡议的理解。\n</p>\n\n</article>\n\n\u003c!-- 活动 02 -->\n\n<article class=\"principle-card\">\n\n<h3>\n政策研究与建议\n</h3>\n\n<p>\n评估高阳特例市的城市资源\n及潜在国际合作需求，\n制定具有竞争力的引进战略\n和政策建议。\n</p>\n\n</article>\n\n\u003c!-- 活动 03 -->\n\n<article class=\"principle-card\">\n\n<h3>\n扩大合作\n</h3>\n\n<p>\n探索与公共机构、\n医疗机构、\n大学、\n科研机构\n以及企业\n开展合作的机会。\n</p>\n\n</article>\n\n\u003c!-- 活动 04 -->\n\n<article class=\"principle-card\">\n\n<h3>\n区域发展机会\n</h3>\n\n<p>\n研究如何将拟议中的\n全球人工智能枢纽\n与科研开发、\n产业活动、\n青年就业\n以及区域可持续增长相结合。\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\n上述活动描述的是\n委员会的目标\n和拟议中的发展方向。\n这并不意味着\n任何机构迁址决定、\n正式合作伙伴关系\n或具体项目已经获得批准。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     4. 委员长致辞\n===================================== -->\n\n<section>\n\n<h2>\n4. 委员长致辞\n</h2>\n\n<div class=\"greeting\">\n\n<p>\n尊敬的高阳特例市市民朋友们：\n</p>\n\n<p>\n我们正站在一个\n可能决定高阳特例市未来发展的\n重要历史时刻。\n</p>\n\n<p>\n过去几十年来，\n高阳特例市已经发展成为\n首尔首都圈的重要居住城市。\n</p>\n\n<p>\n然而，\n为了满足市民对未来发展的期待，\n高阳市仍需要创造更多\n高质量的就业机会，\n并培育可持续发展的新增长动力。\n</p>\n\n<p>\n拟议中的全球人工智能枢纽\n为解决这些结构性挑战、\n推动高阳市发展成为\n与国际社会紧密联系的城市，\n提供了新的机遇。\n</p>\n\n<p>\n但是，\n全球人工智能枢纽\n绝不能仅仅成为\n吸引国际组织设立办事机构的项目。\n</p>\n\n<p>\n我们希望通过负责任地应用人工智能，\n为解决人类共同面临的挑战\n作出贡献。\n</p>\n\n<p>\n这些挑战包括疾病与饥饿、\n气候变化与自然灾害、\n难民与人口迁移、\n失业问题\n以及教育不平等。\n</p>\n\n<p>\n高阳特例市拥有\n能够支持国际合作的多种资源。\n</p>\n\n<p>\n当前最重要的是\n制定具体、\n切实可行\n并且能够实现的计划，\n充分发挥这些资源的优势。\n</p>\n\n<p>\n我们的市民推进委员会\n不会仅仅停留在\n汇聚公众热情的阶段。\n</p>\n\n<p>\n我们将研究政策方案、\n推动各方合作，\n并努力做好具有实际意义的准备工作，\n争取取得切实成果。\n</p>\n\n<p>\n让京畿道各地的民间社会\n携手合作，\n让广大市民\n围绕共同的愿景团结起来。\n</p>\n\n<p>\n为了高阳特例市的未来，\n也为了人类更加美好的未来，\n诚挚邀请各位市民\n与我们携手同行。\n</p>\n\n<p>\n谢谢大家。\n</p>\n\n<div class=\"signature\">\n\nHong Young-pyo<br>\n\n委员长<br>\n\n高阳特例市全球人工智能枢纽<br>\n\n引进市民推进委员会\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     5. 组织架构\n===================================== -->\n\n<section>\n\n<h2>\n5. 组织架构\n</h2>\n\n<p>\n委员会汇聚来自\n不同民间社会领域的参与者，\n共同支持在高阳特例市\n推动拟议中的\n全球人工智能枢纽倡议。\n</p>\n\n<a\n  href=\"committee-chart.jpg\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n\n<img\n  class=\"chart\"\n  src=\"committee-chart.jpg\"\n  alt=\"高阳特例市全球人工智能枢纽引进市民推进委员会组织架构图\"\n  loading=\"lazy\"\n>\n\n</a>\n\n<p class=\"chart-link\">\n点击组织架构图可查看大图。\n</p>\n\n<p class=\"note\">\n组织架构图目前以韩语提供。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     6. 主要发展历程\n===================================== -->\n\n<section>\n\n<h2>\n6. 主要发展历程\n</h2>\n\n<div class=\"timeline\">\n\n\u003c!-- 2026.09.07 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n2026年9月7日\n</div>\n\n<div>\n举行全球人工智能枢纽\n引进市民推进委员会成立大会。\n</div>\n\n</div>\n\n\u003c!-- 2026.10.14 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n2026年10月14日\n</div>\n\n<div>\n举行全球人工智能枢纽\n选址评价标准公众听证会。\n</div>\n\n</div>\n\n\u003c!-- 2026.10.15 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n2026年10月15日\n</div>\n\n<div>\n制定关于改进全球人工智能枢纽\n选址评价标准的建议。\n</div>\n\n</div>\n\n\u003c!-- 2026.10.20 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n2026年10月20日\n</div>\n\n<div>\n参加第七届高阳创新战略研讨会。\n</div>\n\n</div>\n\n\u003c!-- 2026.10.26 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n2026年10月26日\n</div>\n\n<div>\n高阳特例市议会通过\n呼吁引进全球人工智能枢纽的决议。\n</div>\n\n</div>\n\n\u003c!-- 2026.10.30 -->\n\n<div class=\"timeline-item\">\n\n<div class=\"timeline-date\">\n2026年10月30日\n</div>\n\n<div>\n举行京畿道全球人工智能枢纽\n引进战略论坛。\n</div>\n\n</div>\n\n</div>\n\n<p class=\"note\">\n上述主要发展历程\n依据韩语版委员会介绍页面\n所列的活动和进展整理。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     7. 市民参与\n===================================== -->\n\n<section>\n\n<h2>\n7. 市民参与\n</h2>\n\n<p>\n拟议中的全球人工智能枢纽\n是一项共同参与的民间倡议，\n旨在扩大高阳特例市\n未来的发展机会，\n并支持其建设成为\n国际合作城市。\n</p>\n\n<p>\n委员会鼓励市民通过\n线上支持活动、\n推进委员会成员登记、\n支持会员加入\n以及公众宣传活动\n自愿参与。\n</p>\n\n<a\n  href=\"participate.html?lang=zh\"\n  class=\"button\"\n>\n  市民参与中心\n</a>\n\n<a\n  href=\"index.html?lang=zh\"\n  class=\"button\"\n>\n  中文首页\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. 机构定位与现状\n===================================== -->\n\n<section>\n\n<h2>\n8. 机构定位与现状\n</h2>\n\n<p>\n市民推进委员会\n是支持在高阳特例市\n推动拟议中的\n全球人工智能枢纽倡议的\n民间组织。\n</p>\n\n<p>\n委员会并非国际组织，\n也不是负责正式选址决定的\n政府主管机构。\n</p>\n\n<p>\n任何正式的机构参与、\n选址决定\n或公共支持措施，\n均须按照相关主管部门的程序\n获得批准。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n委员会希望通过公众参与、\n建设性的政策建议\n以及负责任的合作，\n为全球人工智能枢纽倡议\n作出积极贡献。\n</strong>\n\n</div>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     页脚\n===================================== -->\n\n<footer>\n\n<p>\n\n<strong>\n高阳特例市全球人工智能枢纽<br>\n引进市民推进委员会\n</strong>\n\n</p>\n\n<p>\n大韩民国京畿道\n</p>\n\n<p>\n与市民同行，<br>\n与京畿道同行，<br>\n与世界同行。\n</p>\n\n<p>\n\n<a href=\"index.html?lang=zh\">\n中文首页\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n"
}
</script>
<script>
(() => {
  const data = document.getElementById("page-variants");
  const pages = JSON.parse(data.textContent);
  const params = new URLSearchParams(window.location.search);
  const keys = ["view", "lang"].map(key => key + "=" + params.get(key));
  const selected = keys.find(key => Object.hasOwn(pages, key)) || "default";
  const page = pages[selected];
  const opening = /^\s*<!doctype html>\s*(<html\b[^>]*>)\s*<head\b[^>]*>/i.exec(page);

  // Keep the original URL and let the initial HTML parser run the page scripts.
  const root = new DOMParser().parseFromString(opening[1], "text/html").documentElement;
  for (const attribute of root.attributes) {
    document.documentElement.setAttribute(attribute.name, attribute.value);
  }
  data.remove();
  document.write(page.slice(opening[0].length));
})();
</script>
