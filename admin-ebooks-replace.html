<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>전자책 이미지 교체 관리</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Malgun Gothic",Arial,sans-serif;
  background:#f3f7fc;
  color:#17315b;
}

header{
  background:#0754a6;
  color:white;
  text-align:center;
  padding:28px 15px;
}

main{
  max-width:1100px;
  margin:auto;
  padding:24px 15px;
}

section{
  background:white;
  padding:25px;
  border-radius:12px;
  margin-bottom:20px;
}

select,input,button{
  padding:12px;
  font:inherit;
  max-width:100%;
}

select{
  width:100%;
  margin:10px 0;
}

button{
  background:#0754a6;
  color:white;
  border:0;
  border-radius:7px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.compare{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.imageBox{
  padding:15px;
  border:1px solid #dce6f2;
  text-align:center;
}

.imageBox img{
  max-width:100%;
  max-height:650px;
  object-fit:contain;
}

.message{
  padding:15px;
  background:#eef4fc;
  border-radius:8px;
  margin:15px 0;
  white-space:pre-wrap;
}

.actionArea{
  margin-top:25px;
  text-align:center;
}

.replaceButton{
  background:#087344;
  padding:15px 35px;
  font-weight:bold;
  font-size:17px;
}

[hidden]{
  display:none!important;
}

@media(max-width:700px){
  .compare{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
<h1>📚 전자책 이미지 교체 관리</h1>
<p>디지털 도서관 통합 관리센터</p>
</header>

<main>

<section>
<h2>관리자 인증</h2>

<div id="message" class="message">
관리자 권한을 확인하고 있습니다.
</div>
</section>

<section id="workArea" hidden>

<h2>전자책 선택</h2>

<select id="bookSelect">
<option value="">
전자책을 선택하세요
</option>
</select>

<h2>페이지 선택</h2>

<select id="pageSelect">
<option value="">
페이지를 선택하세요
</option>
</select>

<button id="loadButton" type="button">
기존 이미지 불러오기
</button>

</section>

<section id="compareArea" hidden>

<h2>이미지 교체</h2>

<div class="compare">

<div class="imageBox">
<h3>현재 이미지</h3>

<img
  id="oldImage"
  alt="현재 이미지">
</div>

<div class="imageBox">

<h3>교체할 이미지</h3>

<input
  type="file"
  id="newFile"
  accept=".webp,image/webp"
>

<br><br>

<img
  id="newImage"
  alt="교체할 이미지"
  hidden>

</div>

</div>

<div class="actionArea">

<button
  id="replaceButton"
  class="replaceButton"
  type="button"
  disabled>
이미지 교체 실행
</button>

</div>

</section>

<p>
<a href="admin-center.html">
← 통합 관리센터로 돌아가기
</a>
</p>

</main>

<script type="module">

import {createClient} from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const URL_BASE =
"https://gugkwqpvtwivqudkimvy.supabase.co";

const KEY =
"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase =
createClient(URL_BASE,KEY);

const $ = id =>
document.getElementById(id);

let objectUrl = null;
let selectedFile = null;
let loadedDocumentId = null;
let loadedPageNumber = null;
let replacing = false;

// ======================================
// 공통 메시지
// ======================================

function message(text){
  $("message").textContent=text;
}

// ======================================
// 로그인 토큰
// ======================================

async function getToken(){

  const {data,error} =
    await supabase.auth.getSession();

  if(
    error ||
    !data.session?.access_token
  ){
    throw new Error(
      "로그인이 필요합니다."
    );
  }

  return data.session.access_token;
}

// ======================================
// 조회용 Edge Function
// ======================================

async function invoke(
  action,
  payload={}
){

  const token=await getToken();

  const response=await fetch(
  URL_BASE+
  "/functions/v1/knowledge-ebook-replace",
    {
      method:"POST",

      headers:{
        "Content-Type":"application/json",
        "apikey":KEY,
        "Authorization":"Bearer "+token
      },

      body:JSON.stringify({
        action,
        ...payload
      })
    }
  );

  const result=await response.json();

  if(
    !response.ok ||
    result.success!==true
  ){
    throw new Error(
      result.error ||
      "서버 요청 실패"
    );
  }

  return result;
}

// ======================================
// 교체 버튼 상태
// ======================================

function updateReplaceButton(){

  $("replaceButton").disabled =
    replacing ||
    !selectedFile ||
    loadedDocumentId===null ||
    loadedPageNumber===null;
}

// ======================================
// 신규 이미지 초기화
// ======================================

function resetNewImage(){

  if(objectUrl){
    URL.revokeObjectURL(objectUrl);
    objectUrl=null;
  }

  selectedFile=null;

  $("newFile").value="";
  $("newImage").removeAttribute("src");
  $("newImage").hidden=true;

  updateReplaceButton();
}

// ======================================
// 기존 이미지 초기화
// ======================================

function resetPreview(){

  loadedDocumentId=null;
  loadedPageNumber=null;

  $("oldImage").removeAttribute("src");

  $("compareArea").hidden=true;

  resetNewImage();
}

// ======================================
// 초기화
// ======================================

async function initialize(){

  try{

    const result=await invoke("list");

    for(const book of result.ebooks){

      const option=
        document.createElement("option");

      option.value=book.document_id;

      const title=
        book.knowledge_documents?.title ||
        book.issue_code;

      option.textContent=
        book.document_id+" · "+title;

      $("bookSelect").append(option);
    }

    $("workArea").hidden=false;

    message("최고관리자 인증 완료");

  }catch(error){

    message(
      "접근 실패: "+error.message
    );

  }
}

// ======================================
// 전자책 선택
// ======================================

$("bookSelect").addEventListener(
"change",
async()=>{

  $("pageSelect").replaceChildren(
    new Option(
      "페이지를 선택하세요",
      ""
    )
  );

  resetPreview();

  const id=
    Number($("bookSelect").value);

  if(!id)return;

  try{

    const result=await invoke(
      "detail",
      {document_id:id}
    );

    for(
      let page=1;
      page<=result.ebook.total_pages;
      page++
    ){

      $("pageSelect").add(
        new Option(
          "본문 "+page+"쪽",
          page
        )
      );

    }

    message(
      "전자책을 선택했습니다."
    );

  }catch(error){

    message(error.message);

  }

});

// ======================================
// 페이지 변경
// ======================================

$("pageSelect").addEventListener(
"change",
()=>{

  resetPreview();

});

// ======================================
// 기존 이미지 불러오기
// ======================================

$("loadButton").addEventListener(
"click",
async()=>{

  const id=
    Number($("bookSelect").value);

  const page=
    Number($("pageSelect").value);

  if(!id || !page){

    message(
      "전자책과 페이지를 선택하세요."
    );

    return;
  }

  try{

    const result=await invoke(
      "preview",
      {
        document_id:id,
        page_number:page
      }
    );

    const img=$("oldImage");

    img.src=result.signed_url;

    loadedDocumentId=id;
    loadedPageNumber=page;

    $("compareArea").hidden=false;

    resetNewImage();

    message(
      "기존 이미지를 불러왔습니다."
    );

  }catch(error){

    message(error.message);

  }

});

// ======================================
// 신규 이미지 선택
// ======================================

$("newFile").addEventListener(
"change",
event=>{

  if(objectUrl){
    URL.revokeObjectURL(objectUrl);
    objectUrl=null;
  }

  selectedFile=null;

  $("newImage").hidden=true;

  const file=event.target.files[0];

  if(!file){
    updateReplaceButton();
    return;
  }

  if(
    file.type!=="image/webp" ||
    file.size<=0 ||
    file.size>10*1024*1024
  ){

    event.target.value="";

    message(
      "10MB 이하 WebP 파일만 선택하세요."
    );

    updateReplaceButton();
    return;
  }

  selectedFile=file;

  objectUrl=
    URL.createObjectURL(file);

  $("newImage").src=objectUrl;
  $("newImage").hidden=false;

  updateReplaceButton();

  message(
    "교체할 이미지가 준비되었습니다."
  );

});

// ======================================
// 실제 이미지 교체
// ======================================

$("replaceButton").addEventListener(
"click",
async()=>{

  if(replacing)return;

  if(
    !selectedFile ||
    loadedDocumentId===null ||
    loadedPageNumber===null
  ){

    message(
      "전자책, 페이지, 이미지를 선택하세요."
    );

    return;
  }

  const documentId=loadedDocumentId;
  const pageNumber=loadedPageNumber;
  const file=selectedFile;

  const confirmed=confirm(
    "선택한 전자책의 "+
    pageNumber+
    "쪽 이미지를 교체하시겠습니까?"
  );

  if(!confirmed)return;

  replacing=true;
  updateReplaceButton();

  $("bookSelect").disabled=true;
  $("pageSelect").disabled=true;
  $("loadButton").disabled=true;
  $("newFile").disabled=true;

  message(
    "이미지를 교체하고 있습니다."
  );

  try{

    const token=await getToken();

    const form=new FormData();

    form.append(
      "document_id",
      String(documentId)
    );

    form.append(
      "page_number",
      String(pageNumber)
    );

    form.append(
      "confirmation",
      "REPLACE"
    );

    form.append(
      "file",
      file
    );

    const response=await fetch(
      URL_BASE+
      "/functions/v1/knowledge-ebook-replace",
      {
        method:"POST",

        headers:{
          "apikey":KEY,
          "Authorization":"Bearer "+token
        },

        body:form
      }
    );

    const result=await response.json();

    if(
      !response.ok ||
      result.success!==true
    ){

      throw new Error(
        result.error ||
        "이미지 교체에 실패했습니다."
      );

    }

    message(
      "이미지 교체가 완료되었습니다.\n"+
      "전자책 ID: "+documentId+"\n"+
      "페이지: "+pageNumber
    );

    resetPreview();

  }catch(error){

    message(
      "교체 실패: "+error.message
    );

  }finally{

    replacing=false;

    $("bookSelect").disabled=false;
    $("pageSelect").disabled=false;
    $("loadButton").disabled=false;
    $("newFile").disabled=false;

    updateReplaceButton();

  }

});

// ======================================
// 페이지 종료
// ======================================

window.addEventListener(
"pagehide",
()=>{

  if(objectUrl){
    URL.revokeObjectURL(objectUrl);
  }

});

initialize();

</script>

</body>
</html>
