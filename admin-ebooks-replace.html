<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전자책 이미지 교체 준비</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Malgun Gothic",Arial,sans-serif;
  background:#f3f7fc;
  color:#17315b;
}
header{
  background:#0754a6;
  color:white;
  text-align:center;
  padding:28px 15px;
}
main{
  max-width:1100px;
  margin:auto;
  padding:24px 15px;
}
section{
  background:white;
  padding:25px;
  border-radius:12px;
  margin-bottom:20px;
}
select,input,button{
  padding:12px;
  font:inherit;
  max-width:100%;
}
select{width:100%;margin:10px 0}
button{
  background:#0754a6;
  color:white;
  border:0;
  border-radius:7px;
  cursor:pointer;
}
button:disabled{opacity:.5}
.compare{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
.imageBox{
  padding:15px;
  border:1px solid #dce6f2;
  text-align:center;
}
.imageBox img{
  max-width:100%;
  max-height:650px;
  object-fit:contain;
}
.message{
  padding:15px;
  background:#eef4fc;
  border-radius:8px;
  margin:15px 0;
  white-space:pre-wrap;
}
.warning{
  background:#fff8e8;
  padding:15px;
  border-left:4px solid #d9a441;
}
[hidden]{display:none!important}
@media(max-width:700px){
  .compare{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h1>📚 전자책 이미지 교체 준비</h1>
<p>제193-3단계 · 안전 시험 모드</p>
</header>

<main>

<section>
<h2>관리자 인증</h2>
<div id="message" class="message">
관리자 권한을 확인하고 있습니다.
</div>
</section>

<section id="workArea" hidden>

<h2>전자책 선택</h2>
<select id="bookSelect">
<option value="">전자책을 선택하세요</option>
</select>

<h2>페이지 선택</h2>
<select id="pageSelect">
<option value="">페이지를 선택하세요</option>
</select>

<button id="loadButton" type="button">
기존 이미지 불러오기
</button>

</section>

<section id="compareArea" hidden>

<h2>이미지 비교</h2>

<div class="compare">

<div class="imageBox">
<h3>기존 이미지</h3>
<img id="oldImage" alt="기존 이미지">
</div>

<div class="imageBox">
<h3>신규 이미지</h3>
<input
  type="file"
  id="newFile"
  accept=".webp,image/webp"
>
<br><br>
<img id="newImage" alt="신규 이미지" hidden>
</div>

</div>

<p class="warning">
현재는 안전 시험 모드입니다.<br>
이미지 비교만 가능하며 실제 교체는 실행되지 않습니다.
</p>

</section>

<p>
<a href="admin-center.html">
← 통합 관리센터로 돌아가기
</a>
</p>

</main>

<script type="module">

import {createClient} from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const URL_BASE =
"https://gugkwqpvtwivqudkimvy.supabase.co";

const KEY =
"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase = createClient(URL_BASE,KEY);

const $ = id => document.getElementById(id);

let objectUrl = null;

async function invoke(action,payload={}){

  const {data,error} =
    await supabase.auth.getSession();

  if(error || !data.session?.access_token){
    throw new Error("로그인이 필요합니다.");
  }

  const response = await fetch(
    URL_BASE+"/functions/v1/knowledge-ebook-replace-v2",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":KEY,
        "Authorization":"Bearer "+data.session.access_token
      },
      body:JSON.stringify({action,...payload})
    }
  );

  const result = await response.json();

  if(!response.ok || result.success!==true){
    throw new Error(result.error || "서버 요청 실패");
  }

  return result;
}

function message(text){
  $("message").textContent=text;
}

async function initialize(){

  try{

    const result=await invoke("list");

    for(const book of result.ebooks){

      const option=document.createElement("option");

      option.value=book.document_id;

      const title =
        book.knowledge_documents?.title ||
        book.issue_code;

      option.textContent=
        book.document_id+" · "+title;

      $("bookSelect").append(option);
    }

    $("workArea").hidden=false;

    message("최고관리자 인증 완료");

  }catch(error){
    message("접근 실패: "+error.message);
  }
}

$("bookSelect").addEventListener("change",async()=>{

  $("pageSelect").replaceChildren(
    new Option("페이지를 선택하세요","")
  );

  $("compareArea").hidden=true;

  const id=Number($("bookSelect").value);

  if(!id)return;

  try{

    const result=await invoke("detail",{
      document_id:id
    });

    for(let page=1;page<=result.ebook.total_pages;page++){
      $("pageSelect").add(
        new Option("본문 "+page+"쪽",page)
      );
    }

  }catch(error){
    message(error.message);
  }
});

$("loadButton").addEventListener("click",async()=>{

  const id=Number($("bookSelect").value);
  const page=Number($("pageSelect").value);

  if(!id || !page)return;

  try{

    const result=await invoke("preview",{
      document_id:id,
      page_number:page
    });

    const img=$("oldImage");

    img.src=result.signed_url;

    $("compareArea").hidden=false;

    message("기존 이미지 불러오기 완료");

  }catch(error){
    message(error.message);
  }
});

$("newFile").addEventListener("change",event=>{

  if(objectUrl){
    URL.revokeObjectURL(objectUrl);
    objectUrl=null;
  }

  const file=event.target.files[0];

  if(!file)return;

  if(
    file.type!=="image/webp" ||
    file.size>10*1024*1024
  ){
    message("10MB 이하 WebP 파일만 선택하세요.");
    return;
  }

  objectUrl=URL.createObjectURL(file);

  $("newImage").src=objectUrl;
  $("newImage").hidden=false;

  message("신규 이미지 비교 준비 완료");
});

window.addEventListener("pagehide",()=>{
  if(objectUrl)URL.revokeObjectURL(objectUrl);
});

initialize();

</script>
</body>
</html>
