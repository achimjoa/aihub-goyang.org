=\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(SUPABASE_URL, SUPABASE_KEY);\n\nconst NEW_PHOTO_MS = 7 * 24 * 60 * 60 * 1000;\n\nlet currentPhotoCategory = \"all\";\nlet activityCategories = [];\nlet photoPosts = [];\nlet photoAttachments = [];\n\nconst filters = document.getElementById(\"photo-filters\");\nconst newPhotoGallery = document.getElementById(\"new-photo-gallery\");\nconst activityPhotoGallery = document.getElementById(\"supabase-photo-gallery\");\nconst newPhotoSection = document.getElementById(\"new-photo-section\");\nconst activityPhotoSection = document.getElementById(\"activity-photo-section\");\nconst viewer = document.getElementById(\"viewer\");\nconst largePhoto = document.getElementById(\"largePhoto\");\n\nconst launchPhotos = [\n  { file: \"activity-03.jpg\", title: \"2026.09.07 범시민추진위원회 발대식\" },\n  { file: \"launch-02.jpg\", title: \"2026.09.07 발대식 행사장 전경\" },\n  { file: \"launch-03.jpg\", title: \"2026.09.07 발대식 참석자\" },\n  { file: \"launch-04.jpg\", title: \"2026.09.07 발대식 주요 행사\" },\n  { file: \"launch-05.jpg\", title: \"2026.09.07 발대식 기념사진\" }\n];\n\nfunction openPhoto(src, title) {\n  largePhoto.src = src;\n  largePhoto.alt = title || \"확대 사진\";\n  viewer.style.display = \"flex\";\n  viewer.setAttribute(\"aria-hidden\", \"false\");\n  document.body.style.overflow = \"hidden\";\n  document.getElementById(\"closePhotoButton\").focus();\n}\n\nfunction closePhoto() {\n  viewer.style.display = \"none\";\n  viewer.setAttribute(\"aria-hidden\", \"true\");\n  largePhoto.removeAttribute(\"src\");\n  document.body.style.overflow = \"\";\n}\n\ndocument.getElementById(\"closePhotoButton\")\n  .addEventListener(\"click\", closePhoto);\n\nviewer.addEventListener(\"click\", event => {\n  if (event.target === viewer) closePhoto();\n});\n\ndocument.addEventListener(\"keydown\", event => {\n  if (event.key === \"Escape\" && viewer.style.display === \"flex\") {\n    closePhoto();\n  }\n});\n\nfunction connectStaticPhotos() {\n  document.querySelectorAll(\".event-record[data-category] .photo img\")\n    .forEach(img => {\n      img.addEventListener(\"click\", () => openPhoto(img.src, img.alt));\n    });\n}\n\nfunction renderLaunchPhotos() {\n  const gallery = document.getElementById(\"launch-gallery\");\n  gallery.replaceChildren();\n\n  launchPhotos.forEach(photo => {\n    const card = document.createElement(\"div\");\n    card.className = \"photo\";\n\n    const img = document.createElement(\"img\");\n    img.src = \"images/\" + photo.file;\n    img.alt = photo.title;\n    img.loading = \"lazy\";\n\n    const caption = document.createElement(\"p\");\n    caption.className = \"photo-title\";\n    caption.textContent = photo.title;\n\n    card.append(img, caption);\n    gallery.appendChild(card);\n  });\n}\n\nasync function loadActivityCategories() {\n  const { data, error } = await supabase\n    .from(\"photo_activity_categories\")\n    .select(\"code,name_ko,name_en,sort_order\")\n    .eq(\"is_active\", true)\n    .order(\"sort_order\", { ascending: true });\n\n  if (error) throw error;\n\n  activityCategories = data || [];\n}\n\nfunction getCategoryName(code) {\n  const category = activityCategories.find(item => item.code === code);\n  if (category) return category.name_ko;\n\n  const fallback = {\n    signature: \"시민 서명운동\",\n    solidarity: \"시민사회 연대\",\n    promotion: \"홍보활동\",\n    culture: \"문화예술\",\n    other: \"기타 활동\"\n  };\n\n  return fallback[code] || code || \"미분류 활동\";\n}\n\n/* =====================================\n   제175-5-14-38단계\n   미분류 활동 필터 최종 정리\n===================================== */\n\nfunction renderCategoryFilters() {\n\n  filters.replaceChildren();\n\n  const staticCodes = [\n    ...document.querySelectorAll(\n      \".event-record[data-category]\"\n    )\n  ].map(section => section.dataset.category);\n\n  const codes = new Set([\n    ...staticCodes,\n    ...activityCategories.map(item => item.code),\n    ...photoPosts\n      .map(post => post.activity_category)\n      .filter(Boolean)\n  ]);\n\n  codes.delete(\"all\");\n  codes.delete(\"uncategorized\");\n\n  const categories = [\n    {\n      code: \"all\",\n      name_ko: \"전체\"\n    },\n\n    ...[...codes].map(code => ({\n      code,\n      name_ko: getCategoryName(code)\n    })),\n\n    {\n      code: \"uncategorized\",\n      name_ko: \"미분류 활동\"\n    }\n  ];\n\n  categories.forEach(category => {\n\n    const btn = document.createElement(\"button\");\n\n    btn.type = \"button\";\n    btn.dataset.category = category.code;\n    btn.textContent = category.name_ko;\n\n    btn.addEventListener(\"click\", () => {\n      filterPhotos(category.code);\n    });\n\n    filters.appendChild(btn);\n\n  });\n\n  filterPhotos(currentPhotoCategory);\n\n}\n  \nfunction isNewPhoto(createdAt) {\n  if (!createdAt) return false;\n  const created = new Date(createdAt).getTime();\n  if (!Number.isFinite(created)) return false;\n  const elapsed = Date.now() - created;\n  return elapsed >= 0 && elapsed < NEW_PHOTO_MS;\n}\n\nfunction formatEventDate(value) {\n  if (!value) return \"\";\n\n  const date = new Date(value);\n  if (Number.isNaN(date.getTime())) return \"\";\n\n  return date.toLocaleDateString(\"ko-KR\", {\n    year: \"numeric\",\n    month: \"long\",\n    day: \"numeric\",\n    timeZone: \"UTC\"\n  });\n}\n\nfunction createPhotoCard(post, file) {\n  const { data } = supabase.storage\n    .from(\"resource-files\")\n    .getPublicUrl(file.file_path);\n\n  if (!data?.publicUrl) return null;\n\n  const card = document.createElement(\"div\");\n  card.className = \"photo\";\n  card.dataset.category = post.activity_category || \"uncategorized\";\n\n  const img = document.createElement(\"img\");\n  img.src = data.publicUrl;\n  img.alt = post.event_name || post.title || file.file_name || \"활동 사진\";\n  img.loading = \"lazy\";\n  img.addEventListener(\"click\", () => openPhoto(img.src, img.alt));\n\n  const title = document.createElement(\"p\");\n  title.className = \"photo-title\";\n  title.textContent = post.event_name || post.title || \"활동 사진\";\n\n  const category = document.createElement(\"span\");\n  category.className = \"photo-category\";\n  category.textContent = getCategoryName(post.activity_category);\n\n  card.append(img, title, category);\n\n  if (post.event_date) {\n    const date = document.createElement(\"p\");\n    date.className = \"photo-description\";\n    date.textContent = \"행사일: \" + formatEventDate(post.event_date);\n    card.appendChild(date);\n  }\n\n  if (post.content) {\n    const description = document.createElement(\"p\");\n    description.className = \"photo-description\";\n    description.textContent = post.content;\n    card.appendChild(description);\n  }\n\n  return card;\n}\n\nasync function loadSupabasePhotos() {\n  const { data: posts, error: postError } = await supabase\n    .from(\"resource_posts\")\n    .select(\"id,title,content,activity_category,event_name,event_date,created_at\")\n    .eq(\"category\", \"image\")\n    .order(\"created_at\", { ascending: false });\n\n  if (postError) throw postError;\n\n  photoPosts = posts || [];\n  photoAttachments = [];\n\n  if (photoPosts.length) {\n    const ids = photoPosts.map(post => post.id);\n\n    // 대량 게시물에서도 URL 길이 제한을 피하도록 나누어 조회\n    for (let i = 0; i < ids.length; i += 100) {\n      const batch = ids.slice(i, i + 100);\n\n      const { data, error } = await supabase\n        .from(\"resource_attachments\")\n        .select(\"resource_id,file_name,file_path,file_type,attachment_type\")\n        .in(\"resource_id\", batch)\n        .eq(\"attachment_type\", \"image\");\n\n      if (error) throw error;\n\n      photoAttachments.push(...(data || []));\n    }\n  }\n\n  renderPhotoGalleries();\n  renderCategoryFilters();\n}\n\nfunction renderPhotoGalleries() {\n  newPhotoGallery.replaceChildren();\n  activityPhotoGallery.replaceChildren();\n\n  let newCount = 0;\n  let totalCount = 0;\n\n  const filesByPost = new Map();\n\n  photoAttachments.forEach(file => {\n    if (!filesByPost.has(file.resource_id)) {\n      filesByPost.set(file.resource_id, []);\n    }\n    filesByPost.get(file.resource_id).push(file);\n  });\n\n  photoPosts.forEach(post => {\n    const files = (filesByPost.get(post.id) || []).filter(file =>\n      file.file_type?.startsWith(\"image/\") ||\n      /\\.(jpg|jpeg|png|gif|webp|avif)$/i.test(file.file_name || \"\")\n    );\n\n    files.forEach(file => {\n      const card = createPhotoCard(post, file);\n      if (!card) return;\n\n      activityPhotoGallery.appendChild(card);\n      totalCount++;\n\n      if (isNewPhoto(post.created_at)) {\n        const newCard = createPhotoCard(post, file);\n        if (newCard) {\n          newPhotoGallery.appendChild(newCard);\n          newCount++;\n        }\n      }\n    });\n  });\n\n  if (!newCount) {\n    const p = document.createElement(\"p\");\n    p.className = \"empty-message\";\n    p.textContent = \"최근 7일 이내 등록된 활동 사진이 없습니다.\";\n    newPhotoGallery.appendChild(p);\n  }\n\n  if (!totalCount) {\n    const p = document.createElement(\"p\");\n    p.className = \"empty-message\";\n    p.textContent = \"등록된 활동 사진이 없습니다.\";\n    activityPhotoGallery.appendChild(p);\n  }\n\n  filterPhotos(currentPhotoCategory);\n}\n\nfunction filterPhotos(category) {\n  currentPhotoCategory = category;\n\n  filters.querySelectorAll(\"button\").forEach(btn => {\n    btn.classList.toggle(\"active\", btn.dataset.category === category);\n  });\n\n  document.querySelectorAll(\".event-record[data-category]\")\n    .forEach(section => {\n      section.hidden =\n        category !== \"all\" && section.dataset.category !== category;\n    });\n\n  // 최근 등록 사진도 선택한 분류에 따라 표시\n  let visibleNewCount = 0;\n\n  newPhotoGallery.querySelectorAll(\".photo\").forEach(card => {\n    const visible =\n      category === \"all\" || card.dataset.category === category;\n    card.hidden = !visible;\n    if (visible) visibleNewCount++;\n  });\n\n  newPhotoSection.hidden = category !== \"all\" && visibleNewCount === 0;\n\n  let visibleCount = 0;\n\n  activityPhotoGallery.querySelectorAll(\".photo\").forEach(card => {\n    const visible =\n      category === \"all\" || card.dataset.category === category;\n    card.hidden = !visible;\n    if (visible) visibleCount++;\n  });\n\n  activityPhotoSection.hidden = category !== \"all\" && visibleCount === 0;\n}\n\nasync function initializeGallery() {\n  renderLaunchPhotos();\n  connectStaticPhotos();\n  renderCategoryFilters();\n\n  try {\n    await loadActivityCategories();\n    renderCategoryFilters();\n  } catch (error) {\n    console.error(\"활동 분류 조회 오류:\", error);\n  }\n\n  try {\n    await loadSupabasePhotos();\n    console.log(\"시민활동 사진기록관 조회 완료\");\n  } catch (error) {\n    console.error(\"활동 사진 조회 오류:\", error);\n\n    const p = document.createElement(\"p\");\n    p.className = \"empty-message\";\n    p.textContent = \"활동 사진을 불러오지 못했습니다.\";\n    activityPhotoGallery.replaceChildren(p);\n  }\n}\n\ninitializeGallery();\n\u003c/script>\n\n</body>\n</html>\n",
  "view=gallery-test": "<!DOCTYPE html>\n<html lang=\"ko\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<title>\n관리자 통합자료실 | 글로벌 AI 허브\n</title>\n\n<style>\n\n/* =====================================\n   기본 설정\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\n[hidden] {\n  display: none !important;\n}\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", Arial, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\nheader {\n  background: #0754a6;\n  color: white;\n  text-align: center;\n  padding: 32px 15px;\n}\n\nheader h1 {\n  margin: 0;\n  font-size: clamp(24px, 4vw, 34px);\n}\n\nheader p {\n  margin: 12px 0;\n}\n\nheader a {\n  color: white;\n}\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 30px 15px;\n}\n\nsection {\n  background: white;\n  border-radius: 12px;\n  padding: 28px;\n  margin-bottom: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.08);\n}\n\nh2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\nlabel {\n  display: block;\n  font-weight: bold;\n  margin-top: 15px;\n}\n\ninput,\nselect,\ntextarea {\n  width: 100%;\n  padding: 11px;\n  margin-top: 5px;\n  border: 1px solid #cbd5e1;\n  border-radius: 7px;\n  font: inherit;\n}\n\ntextarea {\n  min-height: 120px;\n  resize: vertical;\n}\n\nbutton {\n  padding: 11px 17px;\n  margin: 8px 5px 5px 0;\n  border: 0;\n  border-radius: 7px;\n  background: #0754a6;\n  color: white;\n  cursor: pointer;\n  font-weight: bold;\n}\n\nbutton:hover {\n  opacity: .9;\n}\n\nbutton:disabled {\n  opacity: .5;\n  cursor: not-allowed;\n}\n\nbutton.secondary {\n  background: #64748b;\n}\n\nbutton.danger {\n  background: #b42318;\n}\n\n.toolbar {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 12px;\n}\n\n.row {\n  padding: 16px 0;\n  border-bottom: 1px solid #e2e8f0;\n}\n\n.row:last-child {\n  border-bottom: 0;\n}\n\n.muted {\n  color: #64748b;\n}\n\n.error {\n  color: #b42318;\n}\n\n.success {\n  color: #087443;\n}\n\n.status {\n  margin-top: 15px;\n  padding: 12px;\n  background: #f1f5f9;\n  border-radius: 7px;\n  white-space: pre-wrap;\n}\n\n.photo-preview {\n  display: block;\n  max-width: 190px;\n  max-height: 160px;\n  object-fit: contain;\n  margin-top: 10px;\n  border-radius: 6px;\n}\n\n.category-row {\n  padding: 15px 0;\n  border-bottom: 1px solid #e2e8f0;\n}\n\n.category-row strong {\n  display: block;\n}\n\n.category-status {\n  display: inline-block;\n  padding: 3px 10px;\n  border-radius: 20px;\n  background: #eaf4ff;\n  color: #0754a6;\n  font-size: 13px;\n}\n\n.category-status.inactive {\n  background: #f1f5f9;\n  color: #64748b;\n}\n\n.notice {\n  background: #fff8e1;\n  border-left: 4px solid #e6a700;\n  padding: 14px;\n  border-radius: 6px;\n  color: #694b00;\n}\n\n@media(max-width:600px) {\n\n  section {\n    padding: 18px;\n  }\n\n  .toolbar {\n    flex-direction: column;\n    align-items: stretch;\n  }\n\n  .toolbar button {\n    width: 100%;\n  }\n\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n}\n\n</style>\n\n</head>\n\n<body>\n\n<header>\n\n<h1>관리자 통합자료실</h1>\n\n<p>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</p>\n\n<a href=\"index.html\">\n← 홈페이지로 돌아가기\n</a>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n   관리자 로그인\n===================================== -->\n\n<section id=\"loginSection\">\n\n<h2>관리자 로그인</h2>\n\n<form id=\"loginForm\">\n\n<label for=\"email\">\n이메일\n</label>\n\n<input\n  id=\"email\"\n  type=\"email\"\n  autocomplete=\"username\"\n  required\n>\n\n<label for=\"password\">\n비밀번호\n</label>\n\n<input\n  id=\"password\"\n  type=\"password\"\n  autocomplete=\"current-password\"\n  required\n>\n\n<button\n  id=\"loginButton\"\n  type=\"submit\">\n로그인\n</button>\n\n</form>\n\n<p\n  id=\"loginMessage\"\n  role=\"status\">\n</p>\n\n</section>\n\n\u003c!-- =====================================\n   관리자 영역\n===================================== -->\n\n<div id=\"adminArea\" hidden>\n\n<section>\n\n<div class=\"toolbar\">\n\n<strong id=\"adminEmail\"></strong>\n\n<button\n  id=\"logoutButton\"\n  type=\"button\"\n  class=\"secondary\">\n로그아웃\n</button>\n\n<a href=\"gallery.html\">\n📸 시민활동 사진기록관 보기\n</a>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n   자료 등록 및 수정\n===================================== -->\n\n<section id=\"resourceEditorSection\">\n\n<h2 id=\"formHeading\">\n자료 등록\n</h2>\n\n<form id=\"resourceForm\">\n\n<label for=\"resourceCategory\">\n자료 종류\n</label>\n\n<select\n  id=\"resourceCategory\"\n  required>\n\n<option value=\"document\">\n문서\n</option>\n\n<option value=\"image\">\n사진\n</option>\n\n<option value=\"video\">\n동영상\n</option>\n\n<option value=\"audio\">\n음성\n</option>\n\n<option value=\"other\">\n기타\n</option>\n\n</select>\n\n<p class=\"muted\">\n기존 자료 수정 시 자료 종류는 변경할 수 없습니다.\n</p>\n\n<label for=\"resourceTitle\">\n자료 제목\n</label>\n\n<input\n  id=\"resourceTitle\"\n  maxlength=\"300\"\n  required\n>\n\n<label for=\"resourceContent\">\n자료 설명\n</label>\n\n<textarea\n  id=\"resourceContent\">\n</textarea>\n\n\u003c!-- 사진 전용 입력 -->\n\n<div id=\"photoFields\" hidden>\n\n<label for=\"photoActivityCategory\">\n사진 활동 분류\n</label>\n\n<select id=\"photoActivityCategory\">\n</select>\n\n<label for=\"photoEventName\">\n행사명\n</label>\n\n<input\n  id=\"photoEventName\"\n  maxlength=\"200\"\n>\n\n<label for=\"photoEventDate\">\n행사일\n</label>\n\n<input\n  id=\"photoEventDate\"\n  type=\"date\"\n>\n\n</div>\n\n\u003c!-- 동영상 전용 입력 -->\n\n<div id=\"videoFields\" hidden>\n\n<label for=\"youtubeUrl\">\n유튜브 주소\n</label>\n\n<input\n  id=\"youtubeUrl\"\n  type=\"url\"\n  placeholder=\"https://www.youtube.com/watch?v=...\"\n>\n\n</div>\n\n\u003c!-- 첨부파일 -->\n\n<label for=\"resourceFiles\">\n첨부파일\n</label>\n\n<input\n  id=\"resourceFiles\"\n  type=\"file\"\n  multiple\n>\n\n<p class=\"muted\">\n사진은 게시물당 최대 10개이며,\n사진 파일당 최대 크기는 20MB입니다.\n</p>\n\n<div id=\"existingAttachments\"></div>\n\n<button\n  id=\"saveButton\"\n  type=\"submit\">\n자료 저장\n</button>\n\n<button\n  id=\"cancelEditButton\"\n  type=\"button\"\n  class=\"secondary\"\n  hidden>\n수정 취소\n</button>\n\n<p\n  id=\"saveMessage\"\n  class=\"status\"\n  role=\"status\">\n</p>\n\n</form>\n\n</section>\n\n\u003c!-- =====================================\n   등록 자료 목록\n===================================== -->\n\n<section>\n\n<h2>등록된 자료</h2>\n\n<button\n  id=\"refreshResources\"\n  type=\"button\">\n목록 새로고침\n</button>\n\n<div id=\"resourceList\">\n자료를 불러오고 있습니다.\n</div>\n\n</section>\n\n\u003c!-- =====================================\n   활동 분류 관리\n===================================== -->\n\n<section>\n\n<h2>\n📂 사진 활동 분류 관리\n</h2>\n\n<p>\n시민활동 사진기록관의\n활동 분류를 관리합니다.\n</p>\n\n<p class=\"notice\">\n활동 분류를 비활성화하면\n사진기록관의 분류 메뉴에서 제외됩니다.\n기존 사진 게시물은 삭제되지 않습니다.\n</p>\n\n<form id=\"categoryForm\">\n\n<label for=\"categoryCode\">\n분류 코드\n</label>\n\n<input\n  id=\"categoryCode\"\n  placeholder=\"예: campaign\"\n  required\n>\n\n<label for=\"categoryNameKo\">\n한글 분류명\n</label>\n\n<input\n  id=\"categoryNameKo\"\n  required\n>\n\n<label for=\"categoryNameEn\">\n영문 분류명\n</label>\n\n<input id=\"categoryNameEn\">\n\n<label for=\"categorySort\">\n표시 순서\n</label>\n\n<input\n  id=\"categorySort\"\n  type=\"number\"\n  value=\"0\"\n  required\n>\n\n<button type=\"submit\">\n활동 분류 추가\n</button>\n\n</form>\n\n<div id=\"categoryList\"></div>\n\n</section>\n\n</div>\n\n</main>\n\n<footer>\n\n<p>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</p>\n\n<p>\nAI for All · AI for Humanity\n</p>\n\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   Supabase 연결\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   기본 설정\n===================================== */\n\nconst $ = id =>\n  document.getElementById(id);\n\nconst MAX_PHOTOS = 10;\n\nconst MAX_PHOTO_BYTES =\n  20 * 1024 * 1024;\n\nlet currentUser = null;\n\nlet editingId = null;\n\nlet editingCategory = null;\n\nlet attachments = [];\n\nlet categories = [];\n\nlet saving = false;\n\n/* =====================================\n   공통 함수\n===================================== */\n\nfunction message(\n  id,\n  text,\n  isError = false\n) {\n\n  const element = $(id);\n\n  element.textContent = text;\n\n  element.className =\n    isError\n      ? \"status error\"\n      : \"status success\";\n\n}\n\nfunction createButton(\n  text,\n  action,\n  className = \"\"\n) {\n\n  const element =\n    document.createElement(\"button\");\n\n  element.type = \"button\";\n\n  element.textContent = text;\n\n  element.className = className;\n\n  element.addEventListener(\n    \"click\",\n    action\n  );\n\n  return element;\n\n}\n\nfunction createParagraph(text) {\n\n  const element =\n    document.createElement(\"p\");\n\n  element.textContent = text;\n\n  return element;\n\n}\n\n/* =====================================\n   관리자 권한 확인\n===================================== */\n\nasync function verifyAdmin() {\n\n  const {\n    data: { user },\n    error\n  } = await supabase.auth.getUser();\n\n  if (error || !user) {\n    return null;\n  }\n\n  const result =\n    await supabase.rpc(\n      \"is_resource_admin\"\n    );\n\n  if (\n    result.error ||\n    result.data !== true\n  ) {\n    return null;\n  }\n\n  return user;\n\n}\n\n/* =====================================\n   로그인 상태\n===================================== */\n\nasync function refreshAuth() {\n\n  currentUser =\n    await verifyAdmin();\n\n  $(\"loginSection\").hidden =\n    Boolean(currentUser);\n\n  $(\"adminArea\").hidden =\n    !currentUser;\n\n  if (!currentUser) {\n    return;\n  }\n\n  $(\"adminEmail\").textContent =\n    currentUser.email || \"\";\n\n  const results =\n    await Promise.allSettled([\n      loadCategories(),\n      loadResources()\n    ]);\n\n  results.forEach((result, index) => {\n\n    if (result.status === \"rejected\") {\n\n      console.error(\n        \"관리자 초기화 오류:\",\n        result.reason\n      );\n\n      if (index === 0) {\n\n        $(\"categoryList\").textContent =\n          \"활동 분류를 불러오지 못했습니다.\";\n\n      }\n\n    }\n\n  });\n\n}\n\n/* =====================================\n   로그인\n===================================== */\n\n$(\"loginForm\").addEventListener(\n  \"submit\",\n  async event => {\n\n    event.preventDefault();\n\n    const loginButton =\n      $(\"loginButton\");\n\n    loginButton.disabled = true;\n\n    try {\n\n      const { error } =\n        await supabase.auth.signInWithPassword({\n          email: $(\"email\").value.trim(),\n          password: $(\"password\").value\n        });\n\n      if (error) {\n        throw error;\n      }\n\n      await refreshAuth();\n\n      if (!currentUser) {\n        throw new Error(\n          \"관리자 권한이 없습니다.\"\n        );\n      }\n\n      $(\"password\").value = \"\";\n\n    } catch (error) {\n\n      message(\n        \"loginMessage\",\n        error.message,\n        true\n      );\n\n    } finally {\n\n      loginButton.disabled = false;\n\n    }\n\n  }\n);\n\n/* =====================================\n   로그아웃\n===================================== */\n\n$(\"logoutButton\").addEventListener(\n  \"click\",\n  async () => {\n\n    const { error } =\n      await supabase.auth.signOut();\n\n    if (error) {\n      alert(error.message);\n      return;\n    }\n\n    currentUser = null;\n\n    resetEditor();\n\n    $(\"adminArea\").hidden = true;\n\n    $(\"loginSection\").hidden = false;\n\n    $(\"password\").value = \"\";\n\n  }\n);\n\n/* =====================================\n   자료 종류별 입력\n===================================== */\n\nfunction updateCategoryFields() {\n\n  const category =\n    $(\"resourceCategory\").value;\n\n  const isImage =\n    category === \"image\";\n\n  const isVideo =\n    category === \"video\";\n\n  $(\"photoFields\").hidden =\n    !isImage;\n\n  $(\"videoFields\").hidden =\n    !isVideo;\n\n  $(\"photoActivityCategory\").required =\n    isImage;\n\n  $(\"photoEventName\").required =\n    isImage && !editingId;\n\n  $(\"photoEventDate\").required =\n    isImage && !editingId;\n\n  $(\"resourceFiles\").accept =\n    isImage ? \"image/*\" : \"\";\n\n}\n\n$(\"resourceCategory\").addEventListener(\n  \"change\",\n  updateCategoryFields\n);\n\n/* =====================================\n   활동 분류 조회\n===================================== */\n\nasync function loadCategories() {\n\n  const { data, error } =\n    await supabase\n      .from(\"photo_activity_categories\")\n      .select(`\n        code,\n        name_ko,\n        name_en,\n        sort_order,\n        is_active\n      `)\n      .order(\"sort_order\", {\n        ascending: true\n      });\n\n  if (error) {\n    throw error;\n  }\n\n  categories = data || [];\n\n  renderCategorySelect();\n\n  renderCategoryManager();\n\n}\n\n/* =====================================\n   사진 분류 선택\n===================================== */\n\nfunction renderCategorySelect() {\n\n  const select =\n    $(\"photoActivityCategory\");\n\n  const previousValue =\n    select.value;\n\n  select.replaceChildren();\n\n  select.add(\n    new Option(\n      \"활동 분류를 선택하세요\",\n      \"\"\n    )\n  );\n\n  categories\n    .filter(item => item.is_active)\n    .forEach(item => {\n\n      select.add(\n        new Option(\n          item.name_ko,\n          item.code\n        )\n      );\n\n    });\n\n  if (\n    previousValue &&\n    !Array.from(select.options).some(\n      option =>\n        option.value === previousValue\n    )\n  ) {\n\n    select.add(\n      new Option(\n        previousValue + \" (기존 분류)\",\n        previousValue\n      )\n    );\n\n  }\n\n  select.value =\n    previousValue;\n\n}\n\n/* =====================================\n   활동 분류 관리\n===================================== */\n\nfunction renderCategoryManager() {\n\n  const container =\n    $(\"categoryList\");\n\n  container.replaceChildren();\n\n  categories.forEach(category => {\n\n    const row =\n      document.createElement(\"div\");\n\n    row.className =\n      \"category-row\";\n\n    const title =\n      document.createElement(\"strong\");\n\n    title.textContent =\n      `${category.name_ko} (${category.code})`;\n\n    const status =\n      document.createElement(\"span\");\n\n    status.className =\n      \"category-status\" +\n      (\n        category.is_active\n          ? \"\"\n          : \" inactive\"\n      );\n\n    status.textContent =\n      category.is_active\n        ? \"활성\"\n        : \"비활성\";\n\n    const editButton =\n      createButton(\n        \"이름·순서 수정\",\n        async () => {\n\n          const nameKo = prompt(\n            \"한글 분류명\",\n            category.name_ko\n          );\n\n          if (nameKo === null) {\n            return;\n          }\n\n          if (!nameKo.trim()) {\n            alert(\"분류명을 입력하세요.\");\n            return;\n          }\n\n          const nameEn = prompt(\n            \"영문 분류명\",\n            category.name_en || \"\"\n          );\n\n          if (nameEn === null) {\n            return;\n          }\n\n          const sort = prompt(\n            \"표시 순서\",\n            String(\n              category.sort_order ?? 0\n            )\n          );\n\n          if (sort === null) {\n            return;\n          }\n\n          if (\n            sort.trim() === \"\" ||\n            !Number.isInteger(Number(sort))\n          ) {\n            alert(\"올바른 순서를 입력하세요.\");\n            return;\n          }\n\n          await updateCategory(\n            category.code,\n            {\n              name_ko: nameKo.trim(),\n              name_en:\n                nameEn.trim() || null,\n              sort_order: Number(sort)\n            }\n          );\n\n        }\n      );\n\n    const toggleButton =\n      createButton(\n        category.is_active\n          ? \"비활성화\"\n          : \"활성화\",\n        async () => {\n\n          await updateCategory(\n            category.code,\n            {\n              is_active:\n                !category.is_active\n            }\n          );\n\n        },\n        \"secondary\"\n      );\n\n    row.append(\n      title,\n      status,\n      document.createElement(\"br\"),\n      editButton,\n      toggleButton\n    );\n\n    container.appendChild(row);\n\n  });\n\n}\n\n/* =====================================\n   활동 분류 수정\n===================================== */\n\nasync function updateCategory(\n  code,\n  changes\n) {\n\n  try {\n\n    if (!await verifyAdmin()) {\n      throw new Error(\n        \"관리자 권한이 없습니다.\"\n      );\n    }\n\n    const { error } =\n      await supabase\n        .from(\"photo_activity_categories\")\n        .update(changes)\n        .eq(\"code\", code);\n\n    if (error) {\n      throw error;\n    }\n\n    await loadCategories();\n\n  } catch (error) {\n\n    alert(\n      \"활동 분류 수정 실패: \" +\n      error.message\n    );\n\n  }\n\n}\n\n/* =====================================\n   활동 분류 추가\n===================================== */\n\n$(\"categoryForm\").addEventListener(\n  \"submit\",\n  async event => {\n\n    event.preventDefault();\n\n    try {\n\n      if (!await verifyAdmin()) {\n        throw new Error(\n          \"관리자 권한이 없습니다.\"\n        );\n      }\n\n      const code =\n        $(\"categoryCode\")\n          .value.trim()\n          .toLowerCase();\n\n      const nameKo =\n        $(\"categoryNameKo\")\n          .value.trim();\n\n      const nameEn =\n        $(\"categoryNameEn\")\n          .value.trim();\n\n      const sort =\n        Number(\n          $(\"categorySort\").value\n        );\n\n      if (\n        !/^[a-z][a-z0-9_-]*$/.test(code)\n      ) {\n        throw new Error(\n          \"분류 코드는 영문 소문자로 시작해야 합니다.\"\n        );\n      }\n\n      if (!nameKo) {\n        throw new Error(\n          \"한글 분류명을 입력하세요.\"\n        );\n      }\n\n      if (!Number.isInteger(sort)) {\n        throw new Error(\n          \"표시 순서를 확인하세요.\"\n        );\n      }\n\n      const { error } =\n        await supabase\n          .from(\"photo_activity_categories\")\n          .insert({\n            code,\n            name_ko: nameKo,\n            name_en: nameEn || null,\n            sort_order: sort,\n            is_active: true\n          });\n\n      if (error) {\n        throw error;\n      }\n\n      $(\"categoryForm\").reset();\n\n      await loadCategories();\n\n      alert(\n        \"활동 분류가 추가되었습니다.\"\n      );\n\n    } catch (error) {\n\n      alert(error.message);\n\n    }\n\n  }\n);\n\n/* =====================================\n   자료 목록\n===================================== */\n\nasync function loadResources() {\n\n  const container =\n    $(\"resourceList\");\n\n  container.textContent =\n    \"자료를 불러오고 있습니다.\";\n\n  const { data, error } =\n    await supabase\n      .from(\"resource_posts\")\n      .select(`\n        id,\n        title,\n        content,\n        category,\n        youtube_url,\n        activity_category,\n        event_name,\n        event_date,\n        created_at\n      `)\n      .order(\"created_at\", {\n        ascending: false\n      })\n      .limit(500);\n\n  if (error) {\n\n    container.textContent =\n      \"자료 조회 실패: \" +\n      error.message;\n\n    return;\n\n  }\n\n  container.replaceChildren();\n\n  if (!data?.length) {\n\n    container.append(\n      createParagraph(\n        \"등록된 자료가 없습니다.\"\n      )\n    );\n\n    return;\n\n  }\n\n  data.forEach(post => {\n\n    const row =\n      document.createElement(\"div\");\n\n    row.className = \"row\";\n\n    const title =\n      document.createElement(\"strong\");\n\n    title.textContent =\n      post.title || \"제목 없음\";\n\n    const info =\n      createParagraph(\n        `${post.category} · ${\n          post.event_name ||\n          post.created_at?.slice(0, 10) ||\n          \"\"\n        }`\n      );\n\n    info.className = \"muted\";\n\n    const editButton =\n      createButton(\n        \"수정\",\n        () => editResource(post)\n      );\n\n    const deleteButton =\n      createButton(\n        \"삭제\",\n        () => deleteResource(post),\n        \"danger\"\n      );\n\n    row.append(\n      title,\n      info,\n      editButton,\n      deleteButton\n    );\n\n    container.appendChild(row);\n\n  });\n\n}\n\n$(\"refreshResources\").addEventListener(\n  \"click\",\n  loadResources\n);\n\n/* =====================================\n   첨부파일 조회\n===================================== */\n\nasync function loadAttachments(postId) {\n\n  const { data, error } =\n    await supabase\n      .from(\"resource_attachments\")\n      .select(`\n        resource_id,\n        file_name,\n        file_path,\n        file_type,\n        attachment_type\n      `)\n      .eq(\"resource_id\", postId);\n\n  if (error) {\n    throw error;\n  }\n\n  attachments = data || [];\n\n  renderAttachments();\n\n}\n\n/* =====================================\n   첨부파일 목록\n===================================== */\n\nfunction renderAttachments() {\n\n  const container =\n    $(\"existingAttachments\");\n\n  container.replaceChildren();\n\n  if (!editingId) {\n    return;\n  }\n\n  const heading =\n    document.createElement(\"h3\");\n\n  heading.textContent =\n    \"기존 첨부파일\";\n\n  container.appendChild(heading);\n\n  if (attachments.length === 0) {\n\n    container.append(\n      createParagraph(\n        \"등록된 첨부파일이 없습니다.\"\n      )\n    );\n\n    return;\n\n  }\n\n  attachments.forEach(file => {\n\n    const row =\n      document.createElement(\"div\");\n\n    row.className = \"row\";\n\n    const { data } =\n      supabase.storage\n        .from(\"resource-files\")\n        .getPublicUrl(file.file_path);\n\n    const link =\n      document.createElement(\"a\");\n\n    link.href = data.publicUrl;\n\n    link.target = \"_blank\";\n\n    link.rel =\n      \"noopener noreferrer\";\n\n    link.textContent =\n      file.file_name ||\n      \"첨부파일 보기\";\n\n    row.appendChild(link);\n\n    if (\n      file.file_type?.startsWith(\"image/\")\n    ) {\n\n      const img =\n        document.createElement(\"img\");\n\n      img.src = data.publicUrl;\n\n      img.alt =\n        file.file_name ||\n        \"첨부 사진\";\n\n      img.className =\n        \"photo-preview\";\n\n      row.appendChild(img);\n\n    }\n\n    const deleteButton =\n      createButton(\n        \"첨부 삭제\",\n        async () => {\n\n          if (\n            !confirm(\n              \"이 첨부파일을 삭제하시겠습니까?\"\n            )\n          ) {\n            return;\n          }\n\n          try {\n\n            if (!await verifyAdmin()) {\n              throw new Error(\n                \"관리자 권한이 없습니다.\"\n              );\n            }\n\n            const postId =\n              editingId;\n\n            const { error } =\n              await supabase\n                .from(\"resource_attachments\")\n                .delete()\n                .eq(\n                  \"resource_id\",\n                  postId\n                )\n                .eq(\n                  \"file_path\",\n                  file.file_path\n                );\n\n            if (error) {\n              throw error;\n            }\n\n            const removed =\n              await supabase.storage\n                .from(\"resource-files\")\n                .remove([\n                  file.file_path\n                ]);\n\n            if (removed.error) {\n\n              console.warn(\n                \"Storage 정리 필요:\",\n                removed.error\n              );\n\n              alert(\n                \"첨부 연결은 삭제되었지만 \" +\n                \"저장소 파일 정리가 필요합니다.\"\n              );\n\n            }\n\n            await loadAttachments(postId);\n\n          } catch (error) {\n\n            alert(\n              \"첨부 삭제 실패: \" +\n              error.message\n            );\n\n          }\n\n        },\n        \"danger\"\n      );\n\n    row.append(\n      document.createElement(\"br\"),\n      deleteButton\n    );\n\n    container.appendChild(row);\n\n  });\n\n}\n\n/* =====================================\n   자료 수정\n===================================== */\n\nasync function editResource(post) {\n\n  editingId = post.id;\n\n  editingCategory = post.category;\n\n  $(\"formHeading\").textContent =\n    \"자료 수정\";\n\n  $(\"resourceCategory\").value =\n    post.category;\n\n  $(\"resourceCategory\").disabled =\n    true;\n\n  $(\"resourceTitle\").value =\n    post.title || \"\";\n\n  $(\"resourceContent\").value =\n    post.content || \"\";\n\n  $(\"youtubeUrl\").value =\n    post.youtube_url || \"\";\n\n  updateCategoryFields();\n\n  const select =\n    $(\"photoActivityCategory\");\n\n  select.value =\n    post.activity_category || \"\";\n\n  if (\n    post.activity_category &&\n    !select.value\n  ) {\n\n    select.add(\n      new Option(\n        post.activity_category +\n        \" (기존 분류)\",\n        post.activity_category\n      )\n    );\n\n    select.value =\n      post.activity_category;\n\n  }\n\n  $(\"photoEventName\").value =\n    post.event_name || \"\";\n\n  $(\"photoEventDate\").value =\n    post.event_date\n      ? String(post.event_date).slice(0, 10)\n      : \"\";\n\n  $(\"resourceFiles\").value = \"\";\n\n  $(\"cancelEditButton\").hidden =\n    false;\n\n  try {\n\n    await loadAttachments(post.id);\n\n  } catch (error) {\n\n    message(\n      \"saveMessage\",\n      \"첨부파일 조회 실패: \" +\n      error.message,\n      true\n    );\n\n  }\n\n  $(\"resourceEditorSection\")\n    .scrollIntoView({\n      behavior: \"smooth\"\n    });\n\n}\n\n/* =====================================\n   수정 취소\n===================================== */\n\nfunction resetEditor() {\n\n  editingId = null;\n\n  editingCategory = null;\n\n  attachments = [];\n\n  $(\"resourceForm\").reset();\n\n  $(\"resourceCategory\").disabled =\n    false;\n\n  $(\"formHeading\").textContent =\n    \"자료 등록\";\n\n  $(\"cancelEditButton\").hidden =\n    true;\n\n  $(\"existingAttachments\")\n    .replaceChildren();\n\n  $(\"saveMessage\").textContent = \"\";\n\n  updateCategoryFields();\n\n}\n\n$(\"cancelEditButton\").addEventListener(\n  \"click\",\n  resetEditor\n);\n\n/* =====================================\n   첨부파일 종류\n===================================== */\n\nfunction getAttachmentType(category) {\n\n  if (category === \"image\") {\n    return \"image\";\n  }\n\n  if (category === \"audio\") {\n    return \"audio\";\n  }\n\n  if (category === \"video\") {\n    return \"video\";\n  }\n\n  return \"document\";\n\n}\n\n/* =====================================\n   사진 파일 검증\n===================================== */\n\nasync function validateFiles(\n  postId,\n  category,\n  files\n) {\n\n  if (category !== \"image\") {\n    return;\n  }\n\n  const { data, error } =\n    await supabase\n      .from(\"resource_attachments\")\n      .select(\"file_path\")\n      .eq(\"resource_id\", postId)\n      .eq(\"attachment_type\", \"image\");\n\n  if (error) {\n    throw error;\n  }\n\n  const existingCount =\n    data?.length || 0;\n\n  if (\n    existingCount + files.length >\n    MAX_PHOTOS\n  ) {\n    throw new Error(\n      \"사진은 최대 10개까지 등록할 수 있습니다.\"\n    );\n  }\n\n  for (const file of files) {\n\n    if (\n      !file.type.startsWith(\"image/\")\n    ) {\n      throw new Error(\n        \"사진 파일만 등록할 수 있습니다.\"\n      );\n    }\n\n    if (\n      file.size > MAX_PHOTO_BYTES\n    ) {\n      throw new Error(\n        \"사진 파일당 최대 크기는 20MB입니다.\"\n      );\n    }\n\n  }\n\n}\n\n/* =====================================\n   파일 업로드\n===================================== */\n\nasync function uploadFiles(\n  postId,\n  category\n) {\n\n  const files =\n    Array.from(\n      $(\"resourceFiles\").files\n    );\n\n  if (!files.length) {\n    return;\n  }\n\n  await validateFiles(\n    postId,\n    category,\n    files\n  );\n\n  const uploadedNames = [];\n\n  for (const file of files) {\n\n    const safeName =\n      file.name\n        .replace(\n          /[^a-zA-Z0-9._-]/g,\n          \"_\"\n        )\n        .slice(-120);\n\n    const path =\n      `resources/${postId}/` +\n      `${crypto.randomUUID()}-${safeName}`;\n\n    const uploaded =\n      await supabase.storage\n        .from(\"resource-files\")\n        .upload(path, file, {\n          contentType:\n            file.type ||\n            \"application/octet-stream\",\n          upsert: false\n        });\n\n    if (uploaded.error) {\n      throw uploaded.error;\n    }\n\n    const inserted =\n      await supabase\n        .from(\"resource_attachments\")\n        .insert({\n          resource_id: postId,\n          file_name: file.name,\n          file_path: path,\n          file_type:\n            file.type ||\n            \"application/octet-stream\",\n          attachment_type:\n            getAttachmentType(category)\n        });\n\n    if (inserted.error) {\n\n      await supabase.storage\n        .from(\"resource-files\")\n        .remove([path]);\n\n      throw inserted.error;\n\n    }\n\n    uploadedNames.push(file.name);\n\n  }\n\n  $(\"resourceFiles\").value = \"\";\n\n  return uploadedNames;\n\n}\n\n/* =====================================\n   자료 저장\n===================================== */\n\n$(\"resourceForm\").addEventListener(\n  \"submit\",\n  async event => {\n\n    event.preventDefault();\n\n    if (saving) {\n      return;\n    }\n\n    saving = true;\n\n    $(\"saveButton\").disabled = true;\n\n    let savedPostId = editingId;\n\n    let databaseSaved = false;\n\n    try {\n\n      const admin =\n        await verifyAdmin();\n\n      if (!admin) {\n        throw new Error(\n          \"관리자 권한이 없습니다.\"\n        );\n      }\n\n      currentUser = admin;\n\n      const category =\n        editingCategory ||\n        $(\"resourceCategory\").value;\n\n      const payload = {\n\n        title:\n          $(\"resourceTitle\")\n            .value.trim(),\n\n        content:\n          $(\"resourceContent\")\n            .value.trim() || null,\n\n        category,\n\n        youtube_url:\n          category === \"video\"\n            ? $(\"youtubeUrl\")\n                .value.trim() || null\n            : null\n\n      };\n\n      if (!payload.title) {\n        throw new Error(\n          \"자료 제목을 입력하세요.\"\n        );\n      }\n\n      if (category === \"image\") {\n\n        payload.activity_category =\n          $(\"photoActivityCategory\")\n            .value || null;\n\n        payload.event_name =\n          $(\"photoEventName\")\n            .value.trim() || null;\n\n        payload.event_date =\n          $(\"photoEventDate\")\n            .value || null;\n\n        if (\n          !payload.activity_category\n        ) {\n          throw new Error(\n            \"사진 활동 분류를 선택하세요.\"\n          );\n        }\n\n        if (\n          !editingId &&\n          (\n            !payload.event_name ||\n            !payload.event_date\n          )\n        ) {\n          throw new Error(\n            \"행사명과 행사일을 입력하세요.\"\n          );\n        }\n\n      }\n\n      let postId = editingId;\n\n      if (editingId) {\n\n        const { error } =\n          await supabase\n            .from(\"resource_posts\")\n            .update(payload)\n            .eq(\"id\", editingId);\n\n        if (error) {\n          throw error;\n        }\n\n      } else {\n\n        const { data, error } =\n          await supabase\n            .from(\"resource_posts\")\n            .insert({\n              ...payload,\n              author_id:\n                currentUser.id\n            })\n            .select(\"id\")\n            .single();\n\n        if (error) {\n          throw error;\n        }\n\n        postId = data.id;\n\n        savedPostId = postId;\n\n      }\n\n      databaseSaved = true;\n\n      editingId = postId;\n\n      editingCategory = category;\n\n      $(\"resourceCategory\").disabled =\n        true;\n\n      $(\"formHeading\").textContent =\n        \"자료 수정\";\n\n      $(\"cancelEditButton\").hidden =\n        false;\n\n      updateCategoryFields();\n\n      await uploadFiles(\n        postId,\n        category\n      );\n\n      resetEditor();\n\n      message(\n        \"saveMessage\",\n        \"자료와 첨부파일이 정상적으로 저장되었습니다.\"\n      );\n\n      await loadResources();\n\n    } catch (error) {\n\n      console.error(\n        \"자료 저장 오류:\",\n        error\n      );\n\n      if (\n        databaseSaved &&\n        savedPostId\n      ) {\n\n        editingId = savedPostId;\n\n        editingCategory =\n          $(\"resourceCategory\").value;\n\n        $(\"resourceCategory\").disabled =\n          true;\n\n        $(\"formHeading\").textContent =\n          \"자료 수정 및 첨부파일 재등록\";\n\n        $(\"cancelEditButton\").hidden =\n          false;\n\n        updateCategoryFields();\n\n        try {\n\n          await loadAttachments(\n            savedPostId\n          );\n\n        } catch (attachmentError) {\n\n          console.error(\n            attachmentError\n          );\n\n        }\n\n        message(\n          \"saveMessage\",\n          \"게시물은 저장되었지만 \" +\n          \"첨부파일 처리에 실패했습니다.\\n\" +\n          \"기존 첨부파일 목록을 확인한 후 \" +\n          \"필요한 파일만 다시 등록하세요.\\n\" +\n          error.message,\n          true\n        );\n\n      } else {\n\n        message(\n          \"saveMessage\",\n          \"자료 저장 실패: \" +\n          error.message,\n          true\n        );\n\n      }\n\n    } finally {\n\n      saving = false;\n\n      $(\"saveButton\").disabled =\n        false;\n\n    }\n\n  }\n);\n\n/* =====================================\n   자료 삭제\n===================================== */\n\nasync function deleteResource(post) {\n\n  if (\n    !confirm(\n      `\"${post.title}\" 자료를 삭제하시겠습니까?\\n` +\n      \"삭제한 자료는 복구할 수 없습니다.\"\n    )\n  ) {\n    return;\n  }\n\n  try {\n\n    if (!await verifyAdmin()) {\n      throw new Error(\n        \"관리자 권한이 없습니다.\"\n      );\n    }\n\n    const { data: files, error: fileError } =\n      await supabase\n        .from(\"resource_attachments\")\n        .select(\"file_path\")\n        .eq(\"resource_id\", post.id);\n\n    if (fileError) {\n      throw fileError;\n    }\n\n    const { error: attachmentError } =\n      await supabase\n        .from(\"resource_attachments\")\n        .delete()\n        .eq(\"resource_id\", post.id);\n\n    if (attachmentError) {\n      throw attachmentError;\n    }\n\n    const { error: postError } =\n      await supabase\n        .from(\"resource_posts\")\n        .delete()\n        .eq(\"id\", post.id);\n\n    if (postError) {\n      throw postError;\n    }\n\n    const paths =\n      (files || [])\n        .map(file => file.file_path)\n        .filter(Boolean);\n\n    if (paths.length > 0) {\n\n      const { error: storageError } =\n        await supabase.storage\n          .from(\"resource-files\")\n          .remove(paths);\n\n      if (storageError) {\n\n        console.warn(\n          \"Storage 파일 정리 필요:\",\n          storageError\n        );\n\n        alert(\n          \"게시물은 삭제되었지만 \" +\n          \"저장소 파일 정리가 필요합니다.\"\n        );\n\n      }\n\n    }\n\n    if (editingId === post.id) {\n      resetEditor();\n    }\n\n    await loadResources();\n\n  } catch (error) {\n\n    alert(\n      \"자료 삭제 실패: \" +\n      error.message\n    );\n\n  }\n\n}\n\n/* =====================================\n   최초 실행\n===================================== */\n\nupdateCategoryFields();\n\nrefreshAuth().catch(error => {\n\n  console.error(\n    \"관리자 초기화 오류:\",\n    error\n  );\n\n  message(\n    \"loginMessage\",\n    \"관리자 화면 초기화에 실패했습니다. \" +\n    error.message,\n    true\n  );\n\n});\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=en": "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\n      content=\"width=device-width, initial-scale=1.0\">\n\n<title>Photo Gallery | Global AI Hub Goyang</title>\n\n<style>\n\n/* ===============================\n   BASIC\n================================ */\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\n/* ===============================\n   HEADER\n================================ */\n\nheader {\n  background: #0754a6;\n  color: white;\n  text-align: center;\n  padding: 35px 15px 30px;\n}\n\nheader h1 {\n  font-size: clamp(24px, 4vw, 38px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  margin: 10px 0 20px;\n}\n\n/* LANGUAGE */\n\n.language {\n  display: flex;\n  justify-content: center;\n  gap: 10px;\n  margin-top: 15px;\n}\n\n.language a {\n  display: inline-block;\n  padding: 7px 15px;\n  border: 1px solid white;\n  border-radius: 6px;\n  color: white;\n  text-decoration: none;\n}\n\n.language a.active {\n  background: white;\n  color: #0754a6;\n}\n\n/* HOME BUTTON */\n\n.home-return {\n  text-align: center;\n  margin: 25px 0 10px;\n}\n\n.home-return a {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  border: 2px solid white;\n  border-radius: 8px;\n  padding: 12px 28px;\n  font-weight: bold;\n  text-decoration: none;\n  box-shadow: 0 3px 10px rgba(0,0,0,0.15);\n}\n\n.home-return a:hover {\n  background: #ffe44d;\n  border-color: #ffe44d;\n}\n\n/* ===============================\n   MAIN\n================================ */\n\nmain {\n  max-width: 1200px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n/* INTRO */\n\n.intro {\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.intro h2 {\n  font-size: clamp(22px, 3vw, 30px);\n}\n\n.intro p {\n  color: #46566d;\n}\n\n/* FILTERS */\n\n.filters {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 10px;\n  margin-bottom: 35px;\n}\n\n.filters button {\n  padding: 12px 18px;\n  border: 1px solid #0754a6;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\n.filters button.active {\n  background: #0754a6;\n  color: white;\n}\n\n/* ===============================\n   EVENT RECORD\n================================ */\n\n.event-record {\n  background: white;\n  border-left: 6px solid #0754a6;\n  border-radius: 12px;\n  padding: 30px;\n  margin: 30px 0;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.08);\n}\n\n.event-record h2 {\n  color: #0754a6;\n  font-size: clamp(22px, 3vw, 30px);\n  margin: 15px 0;\n}\n\n.event-date {\n  display: inline-block;\n  background: #eaf4ff;\n  color: #0754a6;\n  padding: 6px 14px;\n  border-radius: 20px;\n  font-size: 14px;\n  font-weight: bold;\n}\n\n.event-location {\n  font-weight: bold;\n  color: #46566d;\n}\n\n.event-description {\n  line-height: 1.9;\n  color: #34465f;\n}\n\n/* ===============================\n   GALLERY\n================================ */\n\n.gallery {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n  gap: 20px;\n  margin-top: 25px;\n}\n\n.photo {\n  background: white;\n  border: 1px solid #e1e8f2;\n  border-radius: 12px;\n  overflow: hidden;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.1);\n}\n\n.photo img {\n  display: block;\n  width: 100%;\n  height: 220px;\n  object-fit: cover;\n  cursor: pointer;\n}\n\n.photo-title {\n  padding: 15px;\n  margin: 0;\n  font-weight: bold;\n}\n\n.photo-description {\n  padding: 0 15px 15px;\n  margin: 0;\n}\n\n/* ===============================\n   PHOTO VIEWER\n================================ */\n\n.viewer {\n  display: none;\n  position: fixed;\n  inset: 0;\n  background: rgba(0,0,0,0.92);\n  justify-content: center;\n  align-items: center;\n  z-index: 1000;\n}\n\n.viewer img {\n  max-width: 95%;\n  max-height: 85%;\n  object-fit: contain;\n}\n\n.close {\n  position: absolute;\n  top: 15px;\n  right: 25px;\n  color: white;\n  background: transparent;\n  border: 0;\n  font-size: 40px;\n  cursor: pointer;\n}\n\n/* FOOTER */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 30px 15px;\n  margin-top: 40px;\n}\n\n/* MOBILE */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 28px 12px;\n  }\n\n  main {\n    padding: 25px 12px;\n  }\n\n  .event-record {\n    padding: 20px;\n  }\n\n  .event-record h2 {\n    font-size: 22px;\n  }\n\n  .gallery {\n    grid-template-columns: 1fr;\n  }\n\n  .filters button {\n    padding: 10px 12px;\n    font-size: 13px;\n  }\n\n}\n\n</style>\n</head>\n\n<body>\n\n\u003c!-- ===============================\n     HEADER\n================================ -->\n\n<header>\n\n<h1>Photo Gallery</h1>\n\n<p>\nGoyang Citizens' Committee for Hosting<br>\nthe Global AI Hub in Gyeonggi Province\n</p>\n\n<div class=\"language\">\n\n<a href=\"gallery.html\" lang=\"ko\">\n한국어\n</a>\n\n<a href=\"gallery.html?lang=en\"\n   class=\"active\"\n   aria-current=\"page\">\nEnglish\n</a>\n\n</div>\n\n<div class=\"home-return\">\n\n<a href=\"index.html?lang=en\">\n← Back to Home\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- ===============================\n     1. INTRODUCTION\n================================ -->\n\n<div class=\"intro\">\n\n<h2>Our Activities in Pictures</h2>\n\n<p>\nExplore the activities of citizens,\ncivic organizations and community leaders\nworking together to bring\nthe Global AI Hub to Goyang.\n</p>\n\n</div>\n\n\u003c!-- ===============================\n     2. PHOTO FILTERS\n================================ -->\n\n<div class=\"filters\">\n\n<button class=\"active\"\n        onclick=\"filterPhotos('all',this)\">\nAll\n</button>\n\n<button onclick=\"filterPhotos('signature',this)\">\nSignature Campaign\n</button>\n\n<button onclick=\"filterPhotos('solidarity',this)\">\nCivic Solidarity\n</button>\n\n<button onclick=\"filterPhotos('promotion',this)\">\nPromotion\n</button>\n\n<button onclick=\"filterPhotos('culture',this)\">\nArts & Culture\n</button>\n\n</div>\n\n\u003c!-- ===============================\n     3. DECLARATION CEREMONY\n     AUGUST 25, 2026\n================================ -->\n\n<section class=\"event-record\"\n         id=\"declaration-event\"\n         data-category=\"solidarity\">\n\n<span class=\"event-date\">\nAugust 25, 2026 · 10:00 AM\n</span>\n\n<h2>\nGoyang City's Declaration Ceremony\nfor Hosting the UN Global AI Hub\n</h2>\n\n<p class=\"event-location\">\n📍 National Assembly Members' Office Building,\nConference Room No. 2\n</p>\n\n<p>\n<strong>Hosted by:</strong>\nNational Assembly Members\nKim Sung-hoe, Han Jun-ho,\nLee Ki-heon, and Kim Young-hwan\n</p>\n\n<p>\n<strong>Organized by:</strong>\nGoyang Special City and\nGoyang Research Institute\n</p>\n\n<p class=\"event-description\">\nOn August 25, 2026,\nGoyang Special City held a declaration ceremony\nat the National Assembly to demonstrate\nits commitment to hosting the UN Global AI Hub.\n</p>\n\n<p class=\"event-description\">\nLawmakers, local government representatives,\nand community members expressed their\ncollective support for Goyang's bid.\n</p>\n\n<div class=\"gallery\">\n\n<div class=\"photo\">\n<img src=\"images/declaration-01.jpg\"\n     alt=\"Declaration Ceremony Speech\"\n     loading=\"lazy\"\n     onclick=\"openPhoto(this.src,this.alt)\">\n<p class=\"photo-title\">\nDeclaration Ceremony Speech\n</p>\n</div>\n\n<div class=\"photo\">\n<img src=\"images/declaration-02.jpg\"\n     alt=\"Participants Expressing Their Support\"\n     loading=\"lazy\"\n     onclick=\"openPhoto(this.src,this.alt)\">\n<p class=\"photo-title\">\nParticipants Expressing Their Support\n</p>\n</div>\n\n<div class=\"photo\">\n<img src=\"images/declaration-03.jpg\"\n     alt=\"Declaration Ceremony Group Photo\"\n     loading=\"lazy\"\n     onclick=\"openPhoto(this.src,this.alt)\">\n<p class=\"photo-title\">\nDeclaration Ceremony Group Photo\n</p>\n</div>\n\n<div class=\"photo\">\n<img src=\"images/declaration-04.jpg\"\n     alt=\"Declaration Ceremony Proceedings\"\n     loading=\"lazy\"\n     onclick=\"openPhoto(this.src,this.alt)\">\n<p class=\"photo-title\">\nDeclaration Ceremony Proceedings\n</p>\n</div>\n\n<div class=\"photo\">\n<img src=\"images/declaration-05.jpg\"\n     alt=\"Participants at the Ceremony\"\n     loading=\"lazy\"\n     onclick=\"openPhoto(this.src,this.alt)\">\n<p class=\"photo-title\">\nParticipants at the Ceremony\n</p>\n</div>\n\n<div class=\"photo\">\n<img src=\"images/declaration-06.jpg\"\n     alt=\"Declaration Ceremony Venue\"\n     loading=\"lazy\"\n     onclick=\"openPhoto(this.src,this.alt)\">\n<p class=\"photo-title\">\nDeclaration Ceremony Venue\n</p>\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- ===============================\n     4. PEACEFUL COEXISTENCE FORUM\n     AUGUST 25, 2026\n================================ -->\n\n<section class=\"event-record\"\n         id=\"peace-event\"\n         data-category=\"solidarity\">\n\n<span class=\"event-date\">\nAugust 25, 2026\n</span>\n\n<h2>\nCitizens' Forum on Peaceful Coexistence\non the Korean Peninsula\n</h2>\n\n<p class=\"event-location\">\n📍 Gawaji Grand Auditorium,\nIlsanseo-gu Office, Goyang\n</p>\n\n<p>\nA citizens' forum was held\nto discuss peaceful coexistence\non the Korean Peninsula.\n</p>\n\n<p>\nThis event is documented\nas part of Goyang's civic history\nof peace and coexistence.\n</p>\n\n<div class=\"gallery\">\n\n<div class=\"photo\">\n\n<img\nsrc=\"images/peace-forum-20260825.png\"\nalt=\"Policy presentation by Hong Young-pyo\"\nloading=\"lazy\"\nonclick=\"openPhoto(this.src,this.alt)\">\n\n<p class=\"photo-title\">\nPolicy Presentation on Peaceful Coexistence\n</p>\n\n<p class=\"photo-description\">\nPresenter: Hong Young-pyo<br>\nCo-Representative,\nGoyang Citizens' Association\n</p>\n\n<p class=\"photo-description\">\nTopic: Utilizing the Northeast Asia Peace Archives\nand Building a Self-Sustaining Ecosystem\nin Goyang through Community Engagement\n</p>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- ===============================\n     5. LAUNCH CEREMONY\n     SEPTEMBER 7, 2026\n================================ -->\n\n<section class=\"event-record\"\n         id=\"launch-event\"\n         data-category=\"solidarity\">\n\n<span class=\"event-date\">\nSeptember 7, 2026\n</span>\n\n<h2>\nLaunch Ceremony of the\nGoyang Citizens' Committee\n</h2>\n\n<p class=\"event-location\">\n📍 Goyang Lake Park Flower Exhibition Center\n</p>\n\n<p>\nThe Goyang Citizens' Committee\nofficially launched its campaign\nto bring the Global AI Hub to Goyang.\n</p>\n\n<div class=\"gallery\" id=\"launch-gallery\"></div>\n\n</section>\n\n\u003c!-- ===============================\n     6. GLOBAL AI HUB FORUM\n     OCTOBER 8, 2026\n================================ -->\n\n<section class=\"event-record\"\n         id=\"forum-event\"\n         data-category=\"promotion\">\n\n<span class=\"event-date\">\nOctober 8, 2026 · 2:00 PM\n</span>\n\n<h2>\nGoyang Global AI Hub Forum\n</h2>\n\n<p class=\"event-location\">\n📍 G-ROUND 877, 10th Floor,\nSeongsa Creative Innovation Campus,\nGoyang\n</p>\n\n<p>\n<strong>Organizers:</strong>\nGoyang Special City and\nGoyang Research Institute\n</p>\n\n<p>\nThe forum discussed strategies\nand cooperation opportunities\nfor attracting the Global AI Hub\nto Goyang.\n</p>\n\n<div class=\"gallery\">\n\n<div class=\"photo\">\n\n<img src=\"images/forum-20261008.png\"\n     alt=\"Goyang Global AI Hub Forum\"\n     loading=\"lazy\"\n     onclick=\"openPhoto(this.src,this.alt)\">\n\n<p class=\"photo-title\">\nOfficial Forum Poster\n</p>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- ===============================\n     7. INNOVATION STRATEGY SEMINAR\n     OCTOBER 20, 2026\n================================ -->\n\n<section class=\"event-record\"\n         id=\"seminar-event\"\n         data-category=\"promotion\">\n\n<span class=\"event-date\">\nOctober 20, 2026 · 7:30–9:30 AM\n</span>\n\n<h2>\n7th Goyang Innovation Strategy Seminar\n</h2>\n\n<p class=\"event-location\">\n📍 G-ROUND 877, 10th Floor,\nSeongsa Creative Innovation Campus,\nGoyang\n</p>\n\n<p>\n<strong>Organizers:</strong>\nGoyang Research Institute and\nGoyang Chamber of Commerce and Industry\n</p>\n\n<p>\nThe seminar examined strategies\nfor attracting the Global AI Hub\nto Goyang.\n</p>\n\n<p>\nDuring the panel discussion,\nthe Citizens' Committee emphasized\nthe importance of institutional cooperation,\nan implementation team,\nand practical results.\n</p>\n\n<div class=\"gallery\">\n\n<div class=\"photo\">\n\n<img src=\"images/seminar-20261020.png\"\n     alt=\"7th Goyang Innovation Strategy Seminar\"\n     loading=\"lazy\"\n     onclick=\"openPhoto(this.src,this.alt)\">\n\n<p class=\"photo-title\">\nOfficial Seminar Program\n</p>\n\n</div>\n\n</div>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     Step 145-2-9-9-5\n     Supabase New Activity Photos\n===================================== -->\n\n<section\n  class=\"event-record\"\n  id=\"supabase-photo-section\"\n  >\n\n  <h2>\n    📸 New Activity Photos\n  </h2>\n\n  <p>\n    Explore the latest activities of the\n    Goyang Citizens' Committee.\n  </p>\n\n  <div\n    class=\"gallery\"\n    id=\"supabase-photo-gallery\"\n    aria-live=\"polite\"\n  >\n\n    <p>\n      Preparing to load new activity photos.\n    </p>\n\n  </div>\n\n</section>\n      \n\u003c!-- ===============================\n     PHOTO VIEWER\n================================ -->\n\n<div class=\"viewer\"\n     id=\"viewer\"\n     role=\"dialog\"\n     aria-modal=\"true\"\n     aria-label=\"Enlarged photo\">\n\n<button class=\"close\"\n        aria-label=\"Close\"\n        onclick=\"closePhoto()\">×</button>\n\n<img id=\"largePhoto\" alt=\"Enlarged photo\">\n\n</div>\n\n\u003c!-- FOOTER -->\n\n<footer>\n\n<p>\nGoyang Citizens' Committee for Hosting<br>\nthe Global AI Hub in Gyeonggi Province\n</p>\n\n<p>\nAI for All · AI for Humanity\n</p>\n\n</footer>\n\n\u003cscript>\n\n/* ===============================\n   LAUNCH CEREMONY PHOTOS\n================================ */\n\nconst launchPhotos = [\n\n{\nfile: \"activity-03.jpg\",\ntitle: \"Launch Ceremony\"\n},\n\n{\nfile: \"launch-02.jpg\",\ntitle: \"Launch Ceremony — Venue\"\n},\n\n{\nfile: \"launch-03.jpg\",\ntitle: \"Launch Ceremony — Participants\"\n},\n\n{\nfile: \"launch-04.jpg\",\ntitle: \"Launch Ceremony — Main Event\"\n},\n\n{\nfile: \"launch-05.jpg\",\ntitle: \"Launch Ceremony — Group Photo\"\n}\n\n];\n\n/* CREATE LAUNCH PHOTO CARDS */\n\nfunction renderLaunchPhotos() {\n\n  const gallery =\n    document.getElementById(\"launch-gallery\");\n\n  gallery.innerHTML = \"\";\n\n  launchPhotos.forEach(photo => {\n\n    const card = document.createElement(\"div\");\n    card.className = \"photo\";\n\n    const img = document.createElement(\"img\");\n\n    img.src = \"images/\" + photo.file;\n    img.alt = photo.title;\n    img.loading = \"lazy\";\n\n    img.onclick = () =>\n      openPhoto(img.src, photo.title);\n\n    const caption = document.createElement(\"p\");\n    caption.className = \"photo-title\";\n    caption.textContent = photo.title;\n\n    card.appendChild(img);\n    card.appendChild(caption);\n\n    gallery.appendChild(card);\n\n  });\n\n}\n\n/* =====================================\n   Step 145-2-9-10-8-2\n   Activity Photo Category Filtering\n===================================== */\n\nfunction filterPhotos(category, button) {\n\n  /* 1. Highlight selected button */\n\n  document.querySelectorAll(\".filters button\")\n    .forEach(b => b.classList.remove(\"active\"));\n\n  button.classList.add(\"active\");\n\n\n  /* 2. Filter existing event records */\n\n  document.querySelectorAll(\".event-record\")\n    .forEach(section => {\n\n      const eventCategory =\n        section.dataset.category;\n\n      section.style.display =\n        category === \"all\" ||\n        eventCategory === category\n          ? \"block\"\n          : \"none\";\n\n    });\n\n\n  /* 3. Filter Supabase activity photos */\n\n  document.querySelectorAll(\n    \"#supabase-photo-gallery .photo\"\n  ).forEach(card => {\n\n    const photoCategory =\n      card.dataset.category;\n\n    card.style.display =\n      category === \"all\" ||\n      photoCategory === category\n        ? \"\"\n        : \"none\";\n\n  });\n\n}\n\n/* ===============================\n   PHOTO VIEWER\n================================ */\n\nfunction openPhoto(src, title) {\n\n  const viewer =\n    document.getElementById(\"viewer\");\n\n  const largePhoto =\n    document.getElementById(\"largePhoto\");\n\n  largePhoto.src = src;\n  largePhoto.alt = title;\n\n  viewer.style.display = \"flex\";\n\n}\n\nfunction closePhoto() {\n\n  document.getElementById(\"viewer\")\n    .style.display = \"none\";\n\n}\n\ndocument.addEventListener(\"keydown\", event => {\n\n  if (event.key === \"Escape\") {\n    closePhoto();\n  }\n\n});\n\ndocument.getElementById(\"viewer\")\n  .addEventListener(\"click\", event => {\n\n    if (event.target.id === \"viewer\") {\n      closePhoto();\n    }\n\n  });\n\n/* INITIAL DISPLAY */\n\nrenderLaunchPhotos();\n\n\u003c/script>\n\n\u003c!-- =====================================\n     Step 145-2-9-9-6\n     Supabase Activity Photos\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* Supabase configuration */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\n/*\n  Enter the same public key\n  used in gallery.html.\n*/\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* Photo gallery container */\n\nconst photoGallery =\n  document.getElementById(\n    \"supabase-photo-gallery\"\n  );\n\n/* Display message */\n\nfunction showPhotoMessage(message) {\n\n  photoGallery.replaceChildren();\n\n  const paragraph =\n    document.createElement(\"p\");\n\n  paragraph.textContent = message;\n\n  photoGallery.appendChild(paragraph);\n\n}\n\n/* =====================================\n   Load activity photos\n===================================== */\n\nasync function loadSupabasePhotos() {\n\n  try {\n\n    showPhotoMessage(\n      \"Loading new activity photos...\"\n    );\n\n    /* Load photo posts */\n\n    const { data: posts, error: postError } =\n      await supabase\n        .from(\"resource_posts\")\n        .select(\n  \"id, title, content, activity_category, created_at\"\n)\n        .eq(\"category\", \"image\")\n        .order(\"created_at\", {\n          ascending: false\n        });\n\n    if (postError) {\n      throw postError;\n    }\n\n    if (!posts || posts.length === 0) {\n\n      showPhotoMessage(\n        \"No activity photos have been registered.\"\n      );\n\n      return;\n    }\n\n    /* Resource IDs */\n\n    const resourceIds =\n      posts.map(post => post.id);\n\n    /* Load attachments */\n\n    const {\n      data: attachments,\n      error: attachmentError\n    } =\n      await supabase\n        .from(\"resource_attachments\")\n        .select(\n          \"resource_id, file_name, file_path, file_type, attachment_type\"\n        )\n        .in(\"resource_id\", resourceIds)\n        .eq(\"attachment_type\", \"image\");\n\n    if (attachmentError) {\n      throw attachmentError;\n    }\n\n    photoGallery.replaceChildren();\n\n    let photoCount = 0;\n\n    posts.forEach(post => {\n\n      const files =\n        (attachments || []).filter(file =>\n          file.resource_id === post.id &&\n          file.file_type?.startsWith(\"image/\")\n        );\n\n      files.forEach(file => {\n\n        /* Public Storage URL */\n\n        const { data: urlData } =\n          supabase.storage\n            .from(\"resource-files\")\n            .getPublicUrl(file.file_path);\n\n        if (!urlData?.publicUrl) {\n          return;\n        }\n\n        /* Photo card */\n\n        const card =\n          document.createElement(\"div\");\n\n        card.className = \"photo\";\n\n/* Activity category */\n\ncard.dataset.category =\n  post.activity_category || \"uncategorized\";\n            \n        const img =\n          document.createElement(\"img\");\n\n        img.src = urlData.publicUrl;\n\n        img.alt =\n          post.title || file.file_name;\n\n        img.loading = \"lazy\";\n\n        /* Existing photo viewer */\n\n        img.onclick = () => {\n\n          window.openPhoto(\n            img.src,\n            img.alt\n          );\n\n        };\n\n        /* Photo title */\n\n        const caption =\n          document.createElement(\"p\");\n\n        caption.className = \"photo-title\";\n\n        caption.textContent =\n          post.title || \"Activity Photo\";\n\n        card.appendChild(img);\n        card.appendChild(caption);\n\n        /* Photo description */\n\n        if (post.content) {\n\n          const description =\n            document.createElement(\"p\");\n\n          description.className =\n            \"photo-description\";\n\n          description.textContent =\n            post.content;\n\n          card.appendChild(description);\n\n        }\n\n        photoGallery.appendChild(card);\n\n        photoCount++;\n\n      });\n\n    });\n\n    if (photoCount === 0) {\n\n      showPhotoMessage(\n        \"No photo files are available.\"\n      );\n\n      return;\n    }\n\n/* =====================================\n   Step 145-2-9-10-8-3\n   Preserve Selected Photo Category\n===================================== */\n\n/* Find currently selected filter */\n\nconst activeButton =\n  document.querySelector(\n    \".filters button.active\"\n  );\n\n/* Reapply selected category */\n\nif (activeButton) {\n\n  const category =\n    activeButton.getAttribute(\"onclick\")\n      ?.match(/filterPhotos\\('([^']+)'/)?.[1];\n\n  if (category) {\n\n    window.filterPhotos(\n      category,\n      activeButton\n    );\n\n  }\n\n}\n        \n    console.log(\n      \"Supabase activity photos loaded:\",\n      photoCount\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"Supabase activity photo error:\",\n      error\n    );\n\n    showPhotoMessage(\n      \"Unable to load new activity photos.\"\n    );\n\n  }\n\n}\n\n/* Initial load */\n\nloadSupabasePhotos();\n\n\u003c/script>\n      \n</body>\n</html>\n"
}
</script>

document.addEventListener("DOMContentLoaded", () => {
  const pages = JSON.parse(document.getElementById("page-variants").textContent);
  const params = new URLSearchParams(window.location.search);

  const selected = variants.find(key => Object.hasOwn(pages, key)) || "default";

  // Load the selected document with its original markup and script order.
  document.open();

  document.close();
}, { once: true });
