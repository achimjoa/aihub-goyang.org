<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  활동 소식 관리 | 통합 관리센터
</title>

<style>

/* =====================================
   기본 화면
===================================== */

body {
  margin: 0;
  font-family:
    "Malgun Gothic",
    "Apple SD Gothic Neo",
    sans-serif;
  background: #f5f7fb;
  color: #222;
}

header {
  background: #0b5394;
  color: white;
  text-align: center;
  padding: 35px 15px;
}

header h1 {
  margin: 0 0 15px;
  font-size: 28px;
}

header p {
  line-height: 1.8;
}

.home-link {
  display: inline-block;
  margin-top: 15px;
  padding: 11px 20px;
  background: white;
  color: #0b5394;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
}

main {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 15px;
}

section {
  background: white;
  padding: 30px;
  border-radius: 12px;
  margin-bottom: 25px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

h2 {
  color: #0b5394;
}

button {
  padding: 11px 18px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-size: 15px;
}

.primary-button {
  background: #0b5394;
  color: white;
}

.primary-button:hover {
  background: #073763;
}

.status {
  padding: 15px;
  background: #eef3f9;
  border-radius: 8px;
  line-height: 1.8;
}

/* =====================================
   관리자 활동 소식 목록
===================================== */

.table-wrap {
  width: 100%;
  overflow-x: auto;
  margin-top: 25px;
}

.news-table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

.news-table th {
  background: #eef3f9;
  color: #0b5394;
  font-weight: bold;
}

.news-table th,
.news-table td {
  padding: 14px 12px;
  border-bottom: 1px solid #ddd;
  text-align: left;
  line-height: 1.6;
}

.news-table tbody tr:hover {
  background: #f7faff;
}

.news-table td:first-child {
  width: 65px;
  text-align: center;
}

.news-table td:last-child {
  white-space: nowrap;
}

@media (max-width: 600px) {

  .news-table th,
  .news-table td {
    padding: 10px 7px;
    font-size: 13px;
  }

}
  
footer {
  text-align: center;
  padding: 30px 15px;
  color: #666;
  line-height: 1.8;
}

/* hidden 속성 보호 */

[hidden] {
  display: none !important;
}

@media (max-width: 600px) {

  header h1 {
    font-size: 22px;
  }

  section {
    padding: 20px;
  }

}

</style>

</head>

<body>

<header>

  <h1>📰 활동 소식 관리</h1>

  <p>
    경기도 글로벌 AI 허브 유치<br>
    고양특례시 범시민추진위원회
  </p>

  <a
    href="admin-center.html"
    class="home-link"
  >
    ← 통합 관리센터로 돌아가기
  </a>

</header>

<main>

<!-- =====================================
     관리자 인증 상태
===================================== -->

<section id="authStatus">

  <h2>관리자 권한 확인</h2>

  <p
    id="authMessage"
    class="status"
    role="status"
  >
    로그인 및 관리자 권한을 확인하고 있습니다.
  </p>

</section>

<!-- =====================================
     활동 소식 관리 화면
===================================== -->

<section id="newsAdminArea" hidden>

  <h2>활동 소식 목록</h2>

  <p>
    위원회 활동, 공지사항,
    행사 소식 및 정책 소식을 관리합니다.
  </p>

  <button
    type="button"
    id="newsWriteButton"
    class="primary-button"
    disabled
  >
    ＋ 새 활동 소식 등록
  </button>

 <!-- =====================================
     활동 소식 목록
===================================== -->

<div class="table-wrap">

  <table class="news-table">

    <thead>

      <tr>
        <th>번호</th>
        <th>활동 소식 제목</th>
        <th>분류</th>
        <th>게시일</th>
      </tr>

    </thead>

    <tbody id="adminNewsList">

      <tr>
        <td colspan="4">
          활동 소식을 불러오고 있습니다.
        </td>
      </tr>

    </tbody>

  </table>

</div>
</section>

</main>

<footer>

  경기도 글로벌 AI 허브 유치<br>
  고양특례시 범시민추진위원회

</footer>

<!-- =====================================
     Supabase 관리자 인증
===================================== -->

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* Supabase 연결 정보 */

const SUPABASE_URL =
  "https://gugkwqpvtwivqudkimvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* 화면 요소 */

const authMessage =
  document.getElementById("authMessage");

const newsAdminArea =
  document.getElementById("newsAdminArea");

/* =====================================
   관리자 인증
===================================== */

async function checkNewsAdmin() {

  newsAdminArea.hidden = true;

  authMessage.textContent =
    "관리자 권한을 확인하고 있습니다.";

  try {

    /* 로그인 확인 */

    const { data: authData, error: authError } =
      await supabase.auth.getUser();

    if (authError || !authData.user) {

      throw new Error(
        "로그인이 필요합니다."
      );

    }

    /* 관리자 권한 확인 */

    const { data: isAdmin, error: adminError } =
      await supabase.rpc("is_admin");

    if (adminError) {
      throw adminError;
    }

    if (isAdmin !== true) {

      throw new Error(
        "관리자 권한이 없습니다."
      );

    }

    /* 인증 성공 */

    authMessage.textContent =
      "관리자 인증이 완료되었습니다.";

    newsAdminArea.hidden = false;

  } catch (error) {

    console.error(
      "활동 소식 관리자 인증 오류:",
      error
    );

    newsAdminArea.hidden = true;

    authMessage.textContent =
      error.message;

  }

}

/* 페이지 시작 */

checkNewsAdmin();

</script>

</body>

</html>
