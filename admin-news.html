<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  활동 소식 관리 | 통합 관리센터
</title>

<style>

/* =====================================
   기본 화면
===================================== */

body {
  margin: 0;
  font-family:
    "Malgun Gothic",
    "Apple SD Gothic Neo",
    sans-serif;
  background: #f5f7fb;
  color: #222;
}

header {
  background: #0b5394;
  color: white;
  text-align: center;
  padding: 35px 15px;
}

header h1 {
  margin: 0 0 15px;
  font-size: 28px;
}

header p {
  line-height: 1.8;
}

.home-link {
  display: inline-block;
  margin-top: 15px;
  padding: 11px 20px;
  background: white;
  color: #0b5394;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
}

main {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 15px;
}

section {
  background: white;
  padding: 30px;
  border-radius: 12px;
  margin-bottom: 25px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

h2 {
  color: #0b5394;
}

button {
  padding: 11px 18px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-size: 15px;
}

.primary-button {
  background: #0b5394;
  color: white;
}

.primary-button:hover {
  background: #073763;
}

.status {
  padding: 15px;
  background: #eef3f9;
  border-radius: 8px;
  line-height: 1.8;
}

/* =====================================
   관리자 활동 소식 목록
===================================== */

.table-wrap {
  width: 100%;
  overflow-x: auto;
  margin-top: 25px;
}

.news-table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

.news-table th {
  background: #eef3f9;
  color: #0b5394;
  font-weight: bold;
}

.news-table th,
.news-table td {
  padding: 14px 12px;
  border-bottom: 1px solid #ddd;
  text-align: left;
  line-height: 1.6;
}

.news-table tbody tr:hover {
  background: #f7faff;
}

.news-table td:first-child {
  width: 65px;
  text-align: center;
}

.news-table td:last-child {
  white-space: nowrap;
}

@media (max-width: 600px) {

  .news-table th,
  .news-table td {
    padding: 10px 7px;
    font-size: 13px;
  }

}

/* =====================================
   활동 소식 등록 화면
===================================== */

.form-group {
  margin-bottom: 22px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
  color: #333;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-family: inherit;
  font-size: 15px;
}

.form-group textarea {
  resize: vertical;
  line-height: 1.7;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: 2px solid #0b5394;
  border-color: #0b5394;
}

.form-actions {
  display: flex;
  gap: 12px;
  margin-top: 25px;
}

.form-actions button {
  min-width: 110px;
}

#newsCancelButton {
  background: #e5e7eb;
  color: #333;
}

/* =====================================
   활동 소식 수정 버튼
===================================== */

.news-edit-button {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  background: #0b5394;
  color: white;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}

.news-edit-button:disabled {
  background: #d1d5db;
  color: #6b7280;
  cursor: not-allowed;
}

.news-edit-button:not(:disabled):hover {
  background: #073b6b;
}
  
footer {
  text-align: center;
  padding: 30px 15px;
  color: #666;
  line-height: 1.8;
}

/* hidden 속성 보호 */

[hidden] {
  display: none !important;
}

@media (max-width: 600px) {

  header h1 {
    font-size: 22px;
  }

  section {
    padding: 20px;
  }

}

</style>

</head>

<body>

<header>

  <h1>📰 활동 소식 관리</h1>

  <p>
    경기도 글로벌 AI 허브 유치<br>
    고양특례시 범시민추진위원회
  </p>

  <a
    href="admin-center.html"
    class="home-link"
  >
    ← 통합 관리센터로 돌아가기
  </a>

</header>

<main>

  
<!-- =====================================
     관리자 인증 상태
===================================== -->

<section id="authStatus">

  <h2>관리자 권한 확인</h2>

  <p
    id="authMessage"
    class="status"
    role="status"
  >
    로그인 및 관리자 권한을 확인하고 있습니다.
  </p>

</section>

<!-- =====================================
     활동 소식 관리 화면
===================================== -->

<section id="newsAdminArea" hidden>

  <h2>활동 소식 목록</h2>

  <p>
    위원회 활동, 공지사항,
    행사 소식 및 정책 소식을 관리합니다.
  </p>

  <button
    type="button"
    id="newsWriteButton"
    class="primary-button"
    disabled
  >
    ＋ 새 활동 소식 등록
  </button>

 <!-- =====================================
     활동 소식 목록
===================================== -->

<div class="table-wrap">

  <table class="news-table">

    <thead>

      <tr>
        <th>번호</th>
        <th>활동 소식 제목</th>
        <th>분류</th>
        <th>게시일</th>
    <th>관리</th>
      </tr>

    </thead>

    <tbody id="adminNewsList">

      <tr>
        <td colspan="5">
          활동 소식을 불러오고 있습니다.
        </td>
      </tr>

    </tbody>

  </table>

</div>
</section>

<!-- =====================================
     제145-2-7-4-1단계
     새 활동 소식 등록 화면
===================================== -->

<section id="newsWriteView" hidden>

  <h2>📰 새 활동 소식 등록</h2>

  <p>
    위원회 활동, 공지사항 및
    행사 소식을 등록합니다.
  </p>

  <form id="newsForm">

    <!-- 제목 -->

    <div class="form-group">

      <label for="newsTitle">
        소식 제목 *
      </label>

      <input
        type="text"
        id="newsTitle"
        maxlength="200"
        required
      >

    </div>

    <!-- 분류 -->

    <div class="form-group">

      <label for="newsCategory">
        소식 분류 *
      </label>

      <select
        id="newsCategory"
        required
      >

        <option value="notice">공지사항</option>
        <option value="activity">위원회 활동</option>
        <option value="event">행사 소식</option>
        <option value="press">언론보도</option>
        <option value="policy">정책 소식</option>

      </select>

    </div>

    <!-- 게시 날짜 -->

    <div class="form-group">

      <label for="newsDate">
        게시 날짜 *
      </label>

      <input
        type="date"
        id="newsDate"
        required
      >

    </div>

    <!-- 소식 설명 -->

    <div class="form-group">

      <label for="newsDescription">
        소식 내용
      </label>

      <textarea
        id="newsDescription"
        rows="8"
      ></textarea>

    </div>

    <!-- 관련 링크 -->

    <div class="form-group">

      <label for="newsLink">
        관련 기사·자료 링크
      </label>

      <input
        type="url"
        id="newsLink"
        placeholder="https://example.com"
      >

    </div>

    <!-- 버튼 -->

    <div class="form-actions">

      <button
  type="submit"
  id="newsSubmitButton"
  class="primary-button"
>
  활동 소식 등록
</button>

      <button
        type="button"
        id="newsCancelButton"
      >
        취소
      </button>

    </div>

  </form>

</section>
  
</main>

<footer>

  경기도 글로벌 AI 허브 유치<br>
  고양특례시 범시민추진위원회

</footer>

<!-- =====================================
     Supabase 관리자 인증
===================================== -->

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* Supabase 연결 정보 */

const SUPABASE_URL =
  "https://gugkwqpvtwivqudkimvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* 화면 요소 */

const authMessage =
  document.getElementById("authMessage");

const newsAdminArea =
  document.getElementById("newsAdminArea");


/* =====================================
   제145-2-7-3단계
   관리자 활동 소식 목록 조회
===================================== */

const adminNewsList =
  document.getElementById("adminNewsList");

/* 분류 이름 */

function newsCategoryName(category) {

  const names = {
    notice: "공지사항",
    activity: "위원회 활동",
    event: "행사 소식",
    press: "언론보도",
    policy: "정책 소식"
  };

  return names[category] || "기타";

}

/* 목록 안내 메시지 */

function showNewsMessage(message) {

  adminNewsList.replaceChildren();

  const row =
    document.createElement("tr");

  const cell =
    document.createElement("td");

  cell.colSpan = 5;
  cell.textContent = message;

  row.appendChild(cell);
  adminNewsList.appendChild(row);

}

/* Supabase 목록 조회 */

async function loadAdminNews() {

  showNewsMessage(
    "활동 소식을 불러오고 있습니다."
  );

  try {

    const { data, error } =
      await supabase
        .from("news_posts")
        .select(
          "id, title, category, published_at"
        )
        .order("published_at", {
          ascending: false
        })
        .order("id", {
          ascending: false
        });

    if (error) {
      throw error;
    }

    adminNewsList.replaceChildren();

    if (!data || data.length === 0) {

      showNewsMessage(
        "등록된 활동 소식이 없습니다."
      );

      return;
    }

    data.forEach((item, index) => {

      const row =
        document.createElement("tr");

      const values = [
        index + 1,
        item.title || "",
        newsCategoryName(item.category),
        item.published_at || ""
      ];

      values.forEach(value => {

        const cell =
          document.createElement("td");

        cell.textContent = value;

        row.appendChild(cell);

      });

/* =====================================
   활동 소식 수정 버튼
===================================== */

const actionCell =
  document.createElement("td");

const editButton =
  document.createElement("button");

editButton.type = "button";

editButton.textContent = "✏️ 수정";

editButton.className = "news-edit-button";

/* 수정 기능은 다음 단계에서 연결 */

editButton.disabled = true;

editButton.title =
  "수정 기능 연결 준비 중";

actionCell.appendChild(editButton);

row.appendChild(actionCell);
      
      adminNewsList.appendChild(row);

    });

    console.log(
      "관리자 활동 소식 조회 완료:",
      data.length,
      "건"
    );

  } catch (error) {

    console.error(
      "관리자 활동 소식 조회 오류:",
      error
    );

    showNewsMessage(
      "활동 소식을 불러오지 못했습니다: " +
      error.message
    );

  }

}

  
/* =====================================
   제145-2-7-4-1단계
   활동 소식 등록 화면 제어
===================================== */

const newsWriteButton =
  document.getElementById("newsWriteButton");

const newsWriteView =
  document.getElementById("newsWriteView");

const newsForm =
  document.getElementById("newsForm");

const newsDate =
  document.getElementById("newsDate");

const newsCancelButton =
  document.getElementById("newsCancelButton");

/* 등록 화면 열기 */

newsWriteButton.addEventListener(
  "click",
  () => {

    newsForm.reset();

    newsDate.value =
      new Date().toLocaleDateString("en-CA");

    newsAdminArea.hidden = true;

    newsWriteView.hidden = false;

  }
);

/* 등록 취소 */

newsCancelButton.addEventListener(
  "click",
  () => {

    newsForm.reset();

    newsWriteView.hidden = true;

    newsAdminArea.hidden = false;

  }
);

  /* =====================================
   제145-2-7-4-2단계
   활동 소식 Supabase 저장
===================================== */

const newsSubmitButton =
  document.getElementById("newsSubmitButton");

let newsSaving = false;

newsForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    /* 중복 제출 방지 */

    if (newsSaving) {
      return;
    }

    /* 입력값 확인 */

    const title =
      document.getElementById("newsTitle")
        .value.trim();

    const category =
      document.getElementById("newsCategory")
        .value;

    const publishedAt =
      document.getElementById("newsDate")
        .value;

    const description =
      document.getElementById("newsDescription")
        .value.trim();

    const link =
      document.getElementById("newsLink")
        .value.trim();

    if (!title) {
      alert("소식 제목을 입력해 주세요.");
      return;
    }

    const allowedCategories = [
      "notice",
      "activity",
      "event",
      "press",
      "policy"
    ];

    if (!allowedCategories.includes(category)) {
      alert("올바른 소식 분류를 선택해 주세요.");
      return;
    }

    if (
      !/^\d{4}-\d{2}-\d{2}$/.test(publishedAt) ||
      Number.isNaN(
        Date.parse(publishedAt + "T00:00:00Z")
      )
    ) {
      alert("올바른 게시 날짜를 선택해 주세요.");
      return;
    }

    /* 관련 링크 확인 */

    if (link) {

      try {

        const url = new URL(link);

        if (url.protocol !== "https:") {
          throw new Error("HTTPS 주소만 허용됩니다.");
        }

      } catch {

        alert(
          "올바른 HTTPS 관련 링크를 입력해 주세요."
        );

        return;
      }

    }

    /* 저장 시작 */

    newsSaving = true;

    newsSubmitButton.disabled = true;

    newsSubmitButton.textContent =
      "등록 중...";

    try {

      /* 로그인 상태 확인 */

      const { data: authData, error: authError } =
        await supabase.auth.getUser();

      if (authError || !authData.user) {
        throw new Error(
          "로그인 상태를 확인할 수 없습니다."
        );
      }

      /* 관리자 권한 재확인 */

      const { data: isAdmin, error: adminError } =
        await supabase.rpc("is_admin");

      if (adminError || isAdmin !== true) {
        throw new Error(
          "관리자 권한을 확인할 수 없습니다."
        );
      }

      /* Supabase 저장 */

      const { error } =
        await supabase
          .from("news_posts")
          .insert({

            title: title,
            category: category,
            published_at: publishedAt,
            description: description,
            link: link,
            author_id: authData.user.id

          });

      if (error) {
        throw error;
      }

      /* 입력 화면 초기화 */

      newsForm.reset();

      newsWriteView.hidden = true;

      newsAdminArea.hidden = false;

      /* 목록 갱신 */

      await loadAdminNews();

      alert(
        "활동 소식이 정상적으로 등록되었습니다."
      );

    } catch (error) {

      console.error(
        "활동 소식 등록 오류:",
        error
      );

      alert(
        "활동 소식 등록 중 오류가 발생했습니다.\n" +
        error.message
      );

    } finally {

      newsSaving = false;

      newsSubmitButton.disabled = false;

      newsSubmitButton.textContent =
        "활동 소식 등록";

    }

  }
);
  
  /* =====================================
   관리자 인증
===================================== */

async function checkNewsAdmin() {

  newsAdminArea.hidden = true;

  authMessage.textContent =
    "관리자 권한을 확인하고 있습니다.";

  try {

    /* 로그인 확인 */

    const { data: authData, error: authError } =
      await supabase.auth.getUser();

    if (authError || !authData.user) {

      throw new Error(
        "로그인이 필요합니다."
      );

    }

    /* 관리자 권한 확인 */

    const { data: isAdmin, error: adminError } =
      await supabase.rpc("is_admin");

    if (adminError) {
      throw adminError;
    }

    if (isAdmin !== true) {

      throw new Error(
        "관리자 권한이 없습니다."
      );

    }

 /* 인증 성공 */

authMessage.textContent =
  "관리자 인증이 완료되었습니다.";

newsAdminArea.hidden = false;

/* 등록 화면 열기 버튼 활성화 */

newsWriteButton.disabled = false;

/* 관리자 활동 소식 목록 조회 */

await loadAdminNews();

  } catch (error) {

    console.error(
      "활동 소식 관리자 인증 오류:",
      error
    );

    newsAdminArea.hidden = true;

    authMessage.textContent =
      error.message;

  }

}

/* 페이지 시작 */

checkNewsAdmin();

</script>

</body>

</html>
