<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지식자료실 접근 권한 시험</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f4f8fc;color:#17315b;
  font-family:"Malgun Gothic",Arial,sans-serif;
  line-height:1.7
}
header{
  background:#0754a6;color:white;
  text-align:center;padding:28px 15px
}
header h1{margin:0;font-size:26px}
main{max-width:820px;margin:35px auto;padding:0 16px}
section{
  background:white;border-radius:12px;
  padding:25px;margin-bottom:22px;
  box-shadow:0 3px 12px #00000012
}
h2{color:#0754a6;margin-top:0}
button,.link{
  display:inline-block;background:#0754a6;
  color:white;border:0;border-radius:8px;
  padding:12px 18px;margin:5px 4px 5px 0;
  font-size:15px;font-weight:bold;
  cursor:pointer;text-decoration:none
}
button:hover,.link:hover{background:#10315e}
button:disabled{opacity:.5;cursor:wait}
.status,.result{
  background:#eef4fb;border-radius:8px;
  padding:17px;margin-top:15px;
  white-space:pre-line;overflow-wrap:anywhere
}
.success{background:#e8f5e9;color:#176534}
.failure{background:#fff1f2;color:#991b1b}
footer{
  text-align:center;background:#10315e;
  color:white;padding:25px
}
</style>
</head>
<body>

<header>
<h1>지식자료실 접근 권한 시험</h1>
<p>제172단계 · 회원 인증 및 자료 등급 검증</p>
</header>

<main>

<section>
<h2>① 로그인 및 회원 승인 상태</h2>
<div id="memberStatus" class="status">확인 중...</div>
<button id="refreshButton">상태 새로 확인</button>
<a class="link" href="login.html">회원 로그인</a>
</section>

<section>
<h2>② 자료별 접근 시험</h2>
<p>각 버튼을 누르면 서버에서 실제 접근 권한을 검사합니다.</p>

<button data-id="1">3급 공개자료</button>
<button data-id="2">2급 회원자료</button>
<button data-id="3">1급 대외비 자료</button>

<div id="result" class="result">
시험할 자료를 선택해 주세요.
</div>
</section>

<section>
<h2>③ 시험 기준</h2>
<p><strong>3급:</strong> 비회원도 접근 가능</p>
<p><strong>2급:</strong> 관리자 승인 회원만 접근 가능</p>
<p><strong>1급:</strong> 신원확인 및 자료별 승인 필요</p>
<p>
이 페이지는 접근 권한만 시험합니다.
원문 파일을 직접 열거나 다운로드하지 않습니다.
</p>
</section>

</main>

<footer>
경기도 글로벌 AI 허브 유치<br>
고양특례시 범시민추진위원회
</footer>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const URL =
"https://gugkwqpvtwivqudkimvy.supabase.co";

const KEY =
"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase = createClient(URL,KEY);

const memberStatus =
document.getElementById("memberStatus");

const result =
document.getElementById("result");

const buttons =
document.querySelectorAll("[data-id]");

async function checkMember(){

  memberStatus.textContent="회원정보 확인 중...";

  try{

    const {data,error} =
      await supabase.auth.getUser();

    if(error || !data.user){
      memberStatus.textContent="로그인하지 않은 상태입니다.";
      return;
    }

    const {data:profile,error:profileError} =
      await supabase
      .from("profiles")
      .select("member_role,approval_status")
      .eq("id",data.user.id)
      .maybeSingle();

    if(profileError || !profile){
      memberStatus.textContent=
        "로그인은 확인되었으나 회원정보 조회에 실패했습니다.";
      return;
    }

    memberStatus.textContent=
      "로그인: 확인됨\n"+
      "회원 역할: "+profile.member_role+"\n"+
      "승인 상태: "+profile.approval_status;

  }catch(e){
    memberStatus.textContent="회원 확인 오류";
  }
}

async function testAccess(id){

  buttons.forEach(b=>b.disabled=true);
  result.className="result";
  result.textContent="자료 "+id+" 접근 확인 중...";

  try{

    const {data,error} =
      await supabase.functions.invoke(
        "knowledge-document-access",
        {body:{document_id:id}}
      );

    if(error){

      let message="요청 처리 실패";
      let status="확인 불가";

      if(error.context){

        status=error.context.status || status;

        try{
          const body=await error.context.json();
          message=body.error || message;
        }catch(e){}
      }

      result.className="result failure";
      result.textContent=
        "자료 ID: "+id+"\n"+
        "HTTP 상태: "+status+"\n"+
        "접근 결과: 거부 또는 오류\n"+
        "사유: "+message;

      return;
    }

    if(data?.success===true){

      result.className="result success";

      result.textContent=
        "자료 ID: "+data.document_id+"\n"+
        "자료명: "+data.title+"\n"+
        "공개 등급: "+data.security_grade+"급\n"+
        "접근 결과: 허용\n"+
        "임시 주소 발급: "+
        (data.signed_url?"성공":"실패")+"\n"+
        "유효기간: "+data.expires_in+"초";

    }else{

      result.className="result failure";

      result.textContent=
        "자료 ID: "+id+"\n"+
        "접근 결과: 거부\n"+
        "사유: "+(data?.error || "알 수 없는 오류");
    }

  }catch(e){

    result.className="result failure";
    result.textContent="시험 요청 중 오류가 발생했습니다.";

  }finally{

    buttons.forEach(b=>b.disabled=false);

  }
}

document.getElementById("refreshButton")
.addEventListener("click",checkMember);

buttons.forEach(button=>{
  button.addEventListener("click",()=>{
    testAccess(Number(button.dataset.id));
  });
});

checkMember();

</script>
</body>
</html>
