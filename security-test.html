<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>자료실 RPC 보안 시험</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #243247;
      margin: 0;
      padding: 30px 16px;
    }

    main {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.07);
    }

    h1 {
      color: #0754a6;
      font-size: 25px;
    }

    button {
      padding: 12px 20px;
      background: #0754a6;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      margin: 10px 0;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    pre {
      background: #f0f4f9;
      padding: 18px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }

    .notice {
      background: #fff8e6;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>

</head>

<body>

<main>

  <h1>자료실 RPC 보안 시험</h1>

  <div class="notice">
    이 페이지는 일반회원의 관리자 전용
    RPC 접근 차단 여부를 확인합니다.
    데이터 변경 작업은 수행하지 않습니다.
  </div>

  <button id="runTest" type="button">
    보안 시험 실행
  </button>

  <pre id="result" role="status">
시험 대기 중
  </pre>

</main>

<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =====================================
   Supabase 연결
===================================== */

const SUPABASE_URL =
  "https://gugkwqpvtwivqudkimvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const button = document.getElementById("runTest");

const result = document.getElementById("result");


/* =====================================
   보안 시험
===================================== */

async function runSecurityTest() {

  button.disabled = true;

  result.textContent =
    "로그인 상태를 확인하고 있습니다...\n";

  try {

    /* =====================================
       1. 실제 로그인 사용자 확인
    ===================================== */

    const {
      data: userData,
      error: userError
    } = await supabase.auth.getUser();

    if (userError) {
      throw userError;
    }

    const user = userData?.user;

    if (!user) {

      result.textContent =
        "시험 중단\n\n" +
        "로그인된 사용자가 없습니다.\n" +
        "먼저 일반회원 계정으로 자료실에 로그인하세요.";

      return;
    }

    result.textContent =
      "① 로그인 상태: 인증됨\n" +
      "사용자 ID: " + user.id + "\n\n";


    /* =====================================
       2. 관리자 권한 확인
    ===================================== */

    const {
      data: isAdmin,
      error: adminError
    } = await supabase.rpc(
      "is_resource_admin"
    );

    if (adminError) {
      throw adminError;
    }

    result.textContent +=
      "② 관리자 권한: " + isAdmin + "\n\n";

    if (isAdmin !== false) {

      result.textContent +=
        "시험 중단\n" +
        "일반회원 계정이 아닌 것으로 확인되었습니다.\n" +
        "일반회원 계정으로 다시 로그인하세요.";

      return;
    }


    /* =====================================
       3. 관리자 감사기록 접근 시험
    ===================================== */

    result.textContent +=
      "③ 관리자 감사기록 접근 시험 중...\n";

    const {
      data: logs,
      error: logsError,
      status: httpStatus
    } = await supabase.rpc(
      "admin_get_knowledge_discussion_moderation_logs"
    );

    if (logsError) {

      const denied =
        logsError.message.includes(
          "관리자 권한이 없습니다"
        );

      result.textContent +=
        "\nHTTP 상태: " + httpStatus + "\n" +
        "서버 응답: " + logsError.message + "\n\n";

      if (denied) {

        result.textContent +=
          "PASS\n" +
          "일반회원의 관리자 감사기록 조회가 차단되었습니다.";

      } else {

        result.textContent +=
          "추가 확인 필요\n" +
          "RPC 호출에 오류가 발생했지만 " +
          "관리자 권한 차단 오류인지는 확인되지 않았습니다.";
      }

    } else {

      result.textContent +=
        "\nFAIL\n" +
        "일반회원이 관리자 감사기록 RPC를 " +
        "오류 없이 실행했습니다.\n" +
        "반환 기록 수: " +
        (Array.isArray(logs) ? logs.length : "확인 불가");

    }

  } catch (error) {

    result.textContent +=
      "\n시험 오류: " + error.message;

  } finally {

    button.disabled = false;
  }
}

button.addEventListener(
  "click",
  runSecurityTest
);

</script>

</body>
</html>
