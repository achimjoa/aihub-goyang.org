  "default": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>글로벌 AI 허브 소개 | 고양특례시 범시민추진위원회</title>\n\n<meta name=\"description\"\ncontent=\"글로벌 AI 허브의 비전과 주요 기능, 국제기구 협력 구상 및 고양특례시 유치의 필요성을 안내합니다.\">\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", \"Noto Sans KR\", Arial, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 15px;\n}\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.8;\n}\n\n.intro {\n  font-size: 18px;\n}\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover,\n.button:focus-visible {\n  background: #003a7a;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .intro {\n    font-size: 16px;\n  }\n}\n</style>\n</head>\n\n<body>\n\n<header>\n  <h1>글로벌 AI 허브 소개</h1>\n\n  <p>\n    인공지능으로 인류 공동의 문제를 해결하는<br>\n    공공 AI 국제협력의 새로운 거점\n  </p>\n\n  <a href=\"index.html\" class=\"home-link\">\n    ← 홈페이지로 돌아가기\n  </a>\n</header>\n\n<main>\n\n<section>\n  <div class=\"slogan\">\n    AI 기술을 넘어 인류의 미래로!<br>\n    국제협력의 새로운 중심,<br>\n    글로벌 AI 허브\n  </div>\n</section>\n\n<section>\n  <h2>글로벌 AI 허브란 무엇인가?</h2>\n\n  <div class=\"intro\">\n    <p>\n      글로벌 AI 허브는 국제기구와 정부,\n      대학, 연구기관, 기업 및 시민사회가\n      협력하여 인공지능 기술을\n      인류 공동의 이익을 위해 활용하는\n      국제협력 거점을 지향합니다.\n    </p>\n\n    <p>\n      인공지능은 산업과 경제를 변화시키는\n      핵심 기술인 동시에\n      질병과 기아, 기후위기,\n      재난과 교육격차 등\n      인류가 직면한 다양한 문제를\n      해결하는 데 활용될 수 있습니다.\n    </p>\n\n    <p>\n      글로벌 AI 허브는 이러한 가능성을\n      국제협력과 공공정책,\n      연구개발 및 현장 적용으로 연결하는\n      협력 플랫폼을 목표로 합니다.\n    </p>\n  </div>\n\n  <div class=\"highlight\">\n    <strong>\n      글로벌 AI 허브의 핵심은\n      국제기구의 단순한 집적이 아니라,\n      인공지능을 활용한 국제협력과\n      공동 문제 해결에 있습니다.\n    </strong>\n  </div>\n</section>\n\n<section>\n  <h2>왜 글로벌 AI 허브가 필요한가?</h2>\n\n  <p>\n    인류가 직면한 주요 문제는\n    어느 한 국가나 기관의 노력만으로\n    해결하기 어렵습니다.\n  </p>\n\n  <p>\n    감염병 대응과 보건의료,\n    식량안보와 기후변화,\n    재난 예방과 대응,\n    난민과 이주,\n    노동시장 변화와 교육격차 등은\n    국가 간 협력과 정보 공유,\n    과학기술의 활용이 필요한 분야입니다.\n  </p>\n\n  <p>\n    인공지능은 방대한 데이터를 분석하고\n    위험을 예측하며,\n    정책과 현장의 의사결정을 지원하는\n    수단이 될 수 있습니다.\n  </p>\n\n  <p>\n    그러나 AI 기술이 실제 공공의 이익으로\n    연결되기 위해서는\n    신뢰할 수 있는 데이터,\n    국제적 협력체계,\n    윤리적 기준,\n    전문인력과 지속적인 운영 기반이 필요합니다.\n  </p>\n\n  <p>\n    글로벌 AI 허브는 이러한 요소를\n    연결하는 국제협력 플랫폼으로\n    발전하는 것을 목표로 합니다.\n  </p>\n</section>\n\n<section>\n  <h2>글로벌 AI 허브의 주요 기능</h2>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>① 국제협력 플랫폼</h3>\n      <p>\n        국제기구와 정부,\n        연구기관 및 기업 간\n        협력과 정보 교류를 촉진하고\n        공동사업 발굴을 지원합니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>② 공공 AI 연구개발</h3>\n      <p>\n        보건의료, 환경, 재난,\n        교육 등 공공문제 해결에 필요한\n        AI 기술과 활용 방안을\n        연구하는 협력 기반을 모색합니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>③ 국제 공동사업</h3>\n      <p>\n        국제적 수요와 지역의 기술 역량을\n        연결하여 공동 연구,\n        시범사업 및 현장 적용 기회를\n        발굴하는 것을 지향합니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>④ 전문인력 양성</h3>\n      <p>\n        국제협력과 인공지능을 이해하는\n        전문인력의 교육과 교류를 지원하고\n        청년의 진로 및 성장 기회를\n        확대하는 방안을 모색합니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>⑤ 산업과 창업 연계</h3>\n      <p>\n        AI 기업과 연구기관,\n        국제협력 수요를 연결하여\n        기술 실증과 사업화,\n        창업 및 산업 발전의\n        기회를 확대하고자 합니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>⑥ 책임 있는 AI 활용</h3>\n      <p>\n        개인정보 보호와 안전,\n        공정성 및 인권을 고려하는\n        책임 있는 AI 활용 원칙을\n        국제협력 과정에 반영합니다.\n      </p>\n    </article>\n\n  </div>\n</section>\n\n<section>\n  <h2>국제협력의 주요 분야</h2>\n\n  <p>\n    글로벌 AI 허브는 다양한 국제기구와\n    전문기관의 역할을 고려하여\n    다음과 같은 분야에서\n    협력 가능성을 모색합니다.\n  </p>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>보건의료</h3>\n      <p>\n        질병 예방과 감염병 대응,\n        의료정보 분석 및\n        공공보건 역량 강화\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>식량과 농업</h3>\n      <p>\n        식량안보, 농업 생산성,\n        기후변화 대응 및\n        지속가능한 농업\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>기후환경</h3>\n      <p>\n        기후위기 대응,\n        환경정보 분석,\n        생태계 보호 및\n        지속가능발전\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>재난과 안전</h3>\n      <p>\n        재난 위험 예측,\n        조기경보,\n        재난 대응과\n        피해 최소화\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>난민과 이주</h3>\n      <p>\n        인도적 지원,\n        이주 관련 정보 분석,\n        취약계층 보호 및\n        국제협력\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>노동과 교육</h3>\n      <p>\n        미래 일자리,\n        직업훈련,\n        교육 접근성 및\n        디지털 격차 완화\n      </p>\n    </article>\n\n  </div>\n\n  <p class=\"note\">\n    ※ 위 분야는 글로벌 AI 허브의\n    국제협력 가능성을 설명한 것으로,\n    특정 국제기구의 참여나\n    개별 사업의 확정을 의미하지 않습니다.\n  </p>\n\n  <a href=\"agencies.html\" class=\"button\">\n    9개 국제기구 협력 구상 보기\n  </a>\n</section>\n\n<section>\n  <h2>글로벌 AI 허브와 고양특례시</h2>\n\n  <p>\n    고양특례시는 수도권 접근성과\n    국제회의 기반,\n    의료기관과 교육·문화시설,\n    쾌적한 정주환경 등\n    다양한 도시 자산을 보유하고 있습니다.\n  </p>\n\n  <p>\n    이러한 기반을 활용하여\n    글로벌 AI 허브와 국제협력 기능을\n    연계한다면\n    고양특례시가 공공 AI 국제협력의\n    거점으로 성장할 가능성을\n    확대할 수 있습니다.\n  </p>\n\n  <p>\n    국제협력 활동이 실제로 확대될 경우\n    연구개발과 기업 활동,\n    전문서비스 및 지역 소비 등\n    다양한 분야에서 새로운\n    경제적 기회가 만들어질 수 있습니다.\n  </p>\n\n  <p>\n    특히 청년 인재의 성장과\n    양질의 일자리 창출,\n    지역 기업의 기술혁신,\n    국제교류 확대 등은\n    글로벌 AI 허브 유치를 통해\n    추구할 수 있는 중요한 정책 목표입니다.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      글로벌 AI 허브 유치는\n      고양특례시의 새로운 성장동력을 확보하고,\n      일자리와 지역경제의 기회를 확대하기 위한\n      미래 전략입니다.\n    </strong>\n  </div>\n\n  <p>\n    다만 구체적인 경제적 효과는\n    실제 유치 규모와 참여기관,\n    사업 내용 및 운영 방식에 따라\n    달라질 수 있습니다.\n  </p>\n\n  <a href=\"goyang.html\" class=\"button\">\n    고양특례시 유치 경쟁력 보기\n  </a>\n</section>\n\n<section>\n  <h2>글로벌 AI 허브 유치를 위한 추진 방향</h2>\n\n  <p>\n    범시민추진위원회는\n    글로벌 AI 허브 유치를 위해\n    시민의 뜻을 모으고\n    고양특례시의 도시 역량을\n    구체적인 정책 제안으로 연결하고자 합니다.\n  </p>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>시민 공감대 형성</h3>\n      <p>\n        온라인 서명과 홍보활동을 통해\n        유치 필요성에 대한\n        시민의 이해와 참여를 확대합니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>유치 경쟁력 강화</h3>\n      <p>\n        고양특례시의 입지와\n        국제협력 기반을 분석하고\n        실현 가능한 정책 대안을\n        제시합니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>관계기관 협력</h3>\n      <p>\n        경기도와 고양특례시,\n        정부 및 관계기관과\n        협력할 수 있는 방안을\n        모색합니다.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>지속가능한 운영 기반</h3>\n      <p>\n        유치 이후에도 국제협력과\n        지역 발전이 지속될 수 있도록\n        운영 및 협력체계에 관한\n        정책 방향을 제안합니다.\n      </p>\n    </article>\n\n  </div>\n\n  <a href=\"strategy.html\" class=\"button\">\n    글로벌 AI 허브 유치 전략 보기\n  </a>\n</section>\n\n<section>\n  <h2>시민의 참여가 미래를 만듭니다</h2>\n\n  <p>\n    글로벌 AI 허브 유치는\n    행정기관만의 과제가 아닙니다.\n  </p>\n\n  <p>\n    시민과 지역사회,\n    대학과 연구기관,\n    기업과 전문가들이 함께\n    고양특례시의 미래를 준비하는\n    공동의 과제입니다.\n  </p>\n\n  <p>\n    범시민추진위원회는\n    시민의 자발적인 참여를 바탕으로\n    유치운동을 추진하고 있습니다.\n  </p>\n\n  <p>\n    온라인 유치 동의 서명,\n    범시민추진위원 등록,\n    후원회원 가입 및 홍보활동에\n    함께해 주시기 바랍니다.\n  </p>\n\n  <a href=\"participate.html\" class=\"button\">\n    시민참여센터 바로가기\n  </a>\n</section>\n\n</main>\n\n<footer>\n  <p>\n    경기도 글로벌 AI 허브 유치<br>\n    고양특례시 범시민추진위원회\n  </p>\n\n  <p>\n    시민의 힘으로, 경기도의 역량으로, 세계와 함께!\n  </p>\n\n  <p>\n    <a href=\"index.html\" style=\"color:white;\">\n      홈페이지로 돌아가기\n    </a>\n  </p>\n</footer>\n\n</body>\n</html>\n",

: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .intro {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-left: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header>\n\n<h1>\nحول المركز العالمي للذكاء الاصطناعي\n</h1>\n\n<p>\nمنصة مقترحة للتعاون الدولي<br>\nلمواجهة التحديات العالمية\nمن خلال الذكاء الاصطناعي\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ar\"\n  class=\"home-link\"\n>\n  → الصفحة الرئيسية العربية\n</a>\n\n<a\n  href=\"hub.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n  한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     VISION\n===================================== -->\n\n<section>\n\n<div class=\"slogan\">\n\nما وراء تكنولوجيا الذكاء الاصطناعي،\nنحو مستقبل الإنسانية.<br>\n\nمركز جديد للتعاون الدولي.<br>\n\nالمركز العالمي للذكاء الاصطناعي.\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     1. WHAT IS GLOBAL AI HUB\n===================================== -->\n\n<section>\n\n<h2>\n1. ما هو المركز العالمي للذكاء الاصطناعي؟\n</h2>\n\n<div class=\"intro\">\n\n<p>\nيُتصوَّر المركز العالمي المقترح\nللذكاء الاصطناعي\nبوصفه منصة للتعاون الدولي\nتتيح للمنظمات الدولية،\nوالحكومات،\nوالجامعات،\nوالمؤسسات البحثية،\nوالشركات،\nوالمجتمع المدني\nاستكشاف سبل استخدام\nالذكاء الاصطناعي\nلتحقيق المصلحة العامة.\n</p>\n\n<p>\nيُعد الذكاء الاصطناعي\nإحدى التقنيات الرئيسية\nالتي تُحدث تحولاً\nفي الصناعات والاقتصادات.\n</p>\n\n<p>\nكما يمتلك القدرة\nعلى المساهمة\nفي مواجهة التحديات العالمية،\nبما في ذلك الأمراض،\nوالجوع،\nوتغير المناخ،\nوالكوارث،\nوعدم المساواة\nفي فرص التعليم.\n</p>\n\n<p>\nوتسعى مبادرة المركز العالمي\nللذكاء الاصطناعي\nإلى ربط هذه الإمكانات\nبالتعاون الدولي،\nوالسياسات العامة،\nوالبحث والتطوير،\nوالتطبيقات العملية.\n</p>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nلا يقتصر الهدف الأساسي\nللمركز العالمي للذكاء الاصطناعي\nعلى جمع المنظمات الدولية\nفي موقع واحد،\nبل يتمثل في تشجيع\nالتعاون الدولي\nوالحلول الجماعية للمشكلات\nمن خلال التطبيقات المسؤولة\nللذكاء الاصطناعي.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     2. WHY NEEDED\n===================================== -->\n\n<section>\n\n<h2>\n2. لماذا نحتاج إلى مركز عالمي للذكاء الاصطناعي؟\n</h2>\n\n<p>\nلا يمكن معالجة\nالعديد من التحديات\nالتي تواجه البشرية\nبفعالية\nمن خلال عمل دولة واحدة\nأو مؤسسة واحدة\nبمفردها.\n</p>\n\n<p>\nفحالات الطوارئ\nفي الصحة العامة،\nوانعدام الأمن الغذائي،\nوتغير المناخ،\nوالوقاية من الكوارث\nوالاستجابة لها،\nوالنزوح القسري،\nوالهجرة،\nوالتغيرات في أسواق العمل،\nوعدم المساواة التعليمية،\nكلها قضايا تتطلب\nالتعاون الدولي،\nوتبادل المعلومات،\nوالابتكار العلمي.\n</p>\n\n<p>\nيمكن للذكاء الاصطناعي\nأن يدعم تحليل\nكميات كبيرة من المعلومات،\nويساعد في تحديد\nالمخاطر الناشئة،\nويدعم اتخاذ القرارات\nفي السياسات العامة\nوالعمليات العملية.\n</p>\n\n<p>\nومع ذلك،\nفإن تحويل قدرات\nالذكاء الاصطناعي\nإلى فوائد عامة ملموسة\nيتطلب بيانات موثوقة،\nوتعاوناً مؤسسياً فعالاً،\nوضمانات أخلاقية،\nوكوادر مهنية مؤهلة،\nوترتيبات تشغيلية مستدامة.\n</p>\n\n<p>\nوتسعى مبادرة المركز العالمي\nللذكاء الاصطناعي\nإلى جمع هذه العناصر\nضمن إطار\nللتعاون الدولي.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     3. SIX CORE FUNCTIONS\n===================================== -->\n\n<section>\n\n<h2>\n3. الوظائف الأساسية الست للمركز العالمي للذكاء الاصطناعي\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- FUNCTION 1 -->\n\n<article class=\"card\">\n\n<h3>\n01. منصة للتعاون الدولي\n</h3>\n\n<p>\nتيسير الحوار،\nوتبادل المعلومات،\nواستكشاف فرص التعاون\nبين المنظمات الدولية،\nوالحكومات،\nوالمؤسسات البحثية،\nوالشركات.\n</p>\n\n</article>\n\n\u003c!-- FUNCTION 2 -->\n\n<article class=\"card\">\n\n<h3>\n02. أبحاث الذكاء الاصطناعي للمصلحة العامة\n</h3>\n\n<p>\nاستكشاف البحث والتطوير المشترك\nلتطبيقات الذكاء الاصطناعي\nالتي تعالج التحديات العامة\nفي مجالات الرعاية الصحية،\nوحماية البيئة،\nوالقدرة على مواجهة الكوارث،\nوالتعليم،\nوالمجالات ذات الصلة.\n</p>\n\n</article>\n\n\u003c!-- FUNCTION 3 -->\n\n<article class=\"card\">\n\n<h3>\n03. المشاريع الدولية المشتركة\n</h3>\n\n<p>\nتحديد فرص البحث التعاوني،\nوالمشاريع التجريبية،\nوالتطبيقات العملية،\nمن خلال ربط الاحتياجات الدولية\nبالقدرات التكنولوجية المحلية.\n</p>\n\n</article>\n\n\u003c!-- FUNCTION 4 -->\n\n<article class=\"card\">\n\n<h3>\n04. التطوير المهني\n</h3>\n\n<p>\nاستكشاف فرص التعليم،\nوالتدريب،\nوالتبادل المهني\nللأشخاص العاملين\nفي المجالات المشتركة\nبين الذكاء الاصطناعي\nوالتعاون الدولي.\n</p>\n\n</article>\n\n\u003c!-- FUNCTION 5 -->\n\n<article class=\"card\">\n\n<h3>\n05. الصناعة وريادة الأعمال\n</h3>\n\n<p>\nاستكشاف الروابط\nبين شركات الذكاء الاصطناعي،\nوالمؤسسات البحثية،\nواحتياجات التعاون الدولي،\nلدعم التجارب التقنية،\nوريادة الأعمال،\nوالابتكار الصناعي.\n</p>\n\n</article>\n\n\u003c!-- FUNCTION 6 -->\n\n<article class=\"card\">\n\n<h3>\n06. الذكاء الاصطناعي المسؤول\n</h3>\n\n<p>\nتعزيز مراعاة\nالخصوصية،\nوالسلامة،\nوالإنصاف،\nوحقوق الإنسان،\nوالمساءلة\nفي تطوير تقنيات\nالذكاء الاصطناعي\nواستخدامها.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     4. PRIORITY AREAS\n===================================== -->\n\n<section>\n\n<h2>\n4. المجالات ذات الأولوية للتعاون الدولي\n</h2>\n\n<p>\nتسعى مبادرة المركز العالمي\nللذكاء الاصطناعي\nإلى استكشاف فرص التعاون\nفي المجالات المرتبطة\nبمهام المنظمات الدولية\nوخبرات المؤسسات المتخصصة.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- HEALTH -->\n\n<article class=\"card\">\n\n<h3>\nالصحة العامة\n</h3>\n\n<p>\nالوقاية من الأمراض،\nوالاستجابة للأمراض المعدية،\nوتحليل المعلومات الصحية،\nوتعزيز قدرات الصحة العامة.\n</p>\n\n</article>\n\n\u003c!-- FOOD -->\n\n<article class=\"card\">\n\n<h3>\nالغذاء والزراعة\n</h3>\n\n<p>\nالأمن الغذائي،\nوالإنتاجية الزراعية،\nوالتكيف مع تغير المناخ،\nوالزراعة المستدامة.\n</p>\n\n</article>\n\n\u003c!-- CLIMATE -->\n\n<article class=\"card\">\n\n<h3>\nالمناخ والبيئة\n</h3>\n\n<p>\nالعمل المناخي،\nوتحليل البيانات البيئية،\nوحماية النظم البيئية،\nوالتنمية المستدامة.\n</p>\n\n</article>\n\n\u003c!-- DISASTER -->\n\n<article class=\"card\">\n\n<h3>\nمخاطر الكوارث والسلامة\n</h3>\n\n<p>\nتقييم مخاطر الكوارث،\nوأنظمة الإنذار المبكر،\nوالاستجابة للطوارئ،\nوالحد من آثار الكوارث.\n</p>\n\n</article>\n\n\u003c!-- REFUGEES -->\n\n<article class=\"card\">\n\n<h3>\nاللاجئون والهجرة\n</h3>\n\n<p>\nالمساعدات الإنسانية،\nوالمعلومات المتعلقة بالهجرة،\nوحماية الفئات الضعيفة،\nوالتعاون الدولي.\n</p>\n\n</article>\n\n\u003c!-- EMPLOYMENT -->\n\n<article class=\"card\">\n\n<h3>\nالتوظيف والتعليم\n</h3>\n\n<p>\nمستقبل العمل،\nوالتدريب المهني،\nوإمكانية الوصول إلى التعليم،\nوالحد من أوجه عدم المساواة الرقمية.\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\nتصف هذه المجالات\nفرص التعاون المحتملة.\nولا تعني مشاركة مؤكدة\nمن أي منظمة دولية\nأو الموافقة\nعلى مشاريع محددة.\n</p>\n\n<a\n  href=\"agencies.html?lang=ar\"\n  class=\"button\"\n>\nاستكشاف المنظمات الدولية التسع\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     5. GOYANG\n===================================== -->\n\n<section>\n\n<h2>\n5. المركز العالمي للذكاء الاصطناعي ومدينة غويانغ الخاصة\n</h2>\n\n<p>\nتقع مدينة غويانغ الخاصة\nفي مقاطعة غيونغي\nضمن منطقة العاصمة سيول\nفي جمهورية كوريا.\n</p>\n\n<p>\nوتتميز المدينة\nبسهولة الوصول إليها\nمن المنطقة الحضرية الكبرى،\nوبالبنية التحتية\nللمؤتمرات الدولية،\nوالمؤسسات الصحية،\nوالمرافق التعليمية والثقافية،\nوالبيئة الحضرية المتطورة.\n</p>\n\n<p>\nتوفر هذه المقومات\nأساساً لاستكشاف\nإمكانات مدينة غويانغ\nكمركز للذكاء الاصطناعي\nالموجَّه لخدمة المصلحة العامة\nوالتعاون الدولي.\n</p>\n\n<p>\nوإذا توسع التعاون الدولي\nعلى أرض الواقع،\nفقد تنشأ فرص جديدة\nفي البحث والتطوير،\nوالأنشطة التجارية،\nوالخدمات المهنية،\nوالاقتصاد الإقليمي.\n</p>\n\n<p>\nوتشمل الأهداف المهمة\nعلى المدى الطويل\nالتطوير المهني للشباب،\nوتوفير فرص عمل عالية الجودة،\nوتعزيز الابتكار التكنولوجي\nلدى الشركات المحلية،\nوتوسيع نطاق التبادل الدولي.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nيمثل استقطاب\nالمركز العالمي المقترح\nللذكاء الاصطناعي\nاستراتيجية محتملة\nلتعزيز فرص النمو المستقبلية\nلمدينة غويانغ،\nوتحسين آفاق التوظيف،\nودعم التنمية الاقتصادية الإقليمية.\n</strong>\n\n</div>\n\n<p>\nوستعتمد النتائج الاقتصادية الفعلية\nعلى حجم المشاركة المؤسسية المستقبلية،\nوطبيعة الأنشطة التعاونية،\nوالترتيبات التشغيلية\nالتي سيتم اعتمادها في النهاية.\n</p>\n\n<a\n  href=\"goyang.html?lang=ar\"\n  class=\"button\"\n>\nلماذا مدينة غويانغ الخاصة؟\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     6. STRATEGY\n===================================== -->\n\n<section>\n\n<h2>\n6. استراتيجية التطوير المقترحة\n</h2>\n\n<p>\nتسعى اللجنة المدنية الداعمة\nإلى تشجيع المشاركة العامة\nوربط نقاط القوة الحضرية\nلمدينة غويانغ\nبمقترحات سياسية عملية\nتخدم مبادرة المركز العالمي\nللذكاء الاصطناعي.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- STRATEGY 1 -->\n\n<article class=\"card\">\n\n<h3>\nالتوعية العامة والمشاركة\n</h3>\n\n<p>\nتوسيع فهم الجمهور\nوتشجيع المشاركة الطوعية\nمن خلال التعبير\nعن الدعم عبر الإنترنت\nوأنشطة التواصل المجتمعي.\n</p>\n\n</article>\n\n\u003c!-- STRATEGY 2 -->\n\n<article class=\"card\">\n\n<h3>\nتعزيز القدرة التنافسية للموقع\n</h3>\n\n<p>\nتقييم المزايا الجغرافية\nلمدينة غويانغ\nومقومات التعاون الدولي،\nوتطوير مقترحات سياسية عملية\nقائمة على الأدلة.\n</p>\n\n</article>\n\n\u003c!-- STRATEGY 3 -->\n\n<article class=\"card\">\n\n<h3>\nالتعاون المؤسسي\n</h3>\n\n<p>\nاستكشاف فرص التعاون\nمع مقاطعة غيونغي،\nومدينة غويانغ الخاصة،\nوالسلطات الوطنية المعنية،\nوالمؤسسات الأخرى.\n</p>\n\n</article>\n\n\u003c!-- STRATEGY 4 -->\n\n<article class=\"card\">\n\n<h3>\nالتشغيل المستدام\n</h3>\n\n<p>\nتطوير مقترحات سياسية\nتتعلق بأطر التعاون\nطويلة الأمد\nوالترتيبات التشغيلية المستدامة.\n</p>\n\n</article>\n\n</div>\n\n<a\n  href=\"strategy.html?lang=ar\"\n  class=\"button\"\n>\nاستكشاف استراتيجية المركز العالمي للذكاء الاصطناعي\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     7. PARTICIPATION\n===================================== -->\n\n<section>\n\n<h2>\n7. مشاركة المواطنين والمسؤولية المشتركة\n</h2>\n\n<p>\nلا تقتصر مبادرة\nالمركز العالمي المقترح\nللذكاء الاصطناعي\nعلى السلطات العامة وحدها.\n</p>\n\n<p>\nبل تمثل أيضاً فرصة\nللمواطنين،\nوالمجتمعات المحلية،\nوالجامعات،\nوالمؤسسات البحثية،\nوالشركات،\nوالمهنيين\nللمساهمة في النقاشات\nالمتعلقة بمستقبل مدينة غويانغ.\n</p>\n\n<p>\nتشجع اللجنة المدنية الداعمة\nالمشاركة العامة الطوعية\nفي هذه المبادرة.\n</p>\n\n<p>\nوتشمل الأنشطة\nالتعبير عن الدعم عبر الإنترنت،\nوالتسجيل في اللجنة،\nوالعضوية الداعمة،\nوحملات التوعية العامة.\n</p>\n\n<a\n  href=\"participate.html?lang=ar\"\n  class=\"button\"\n>\nمركز المشاركة المدنية\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. INSTITUTIONAL STATUS\n===================================== -->\n\n<section>\n\n<h2>\n8. الوضع المؤسسي للمبادرة\n</h2>\n\n<p>\nالمركز العالمي للذكاء الاصطناعي\nفي مدينة غويانغ\nهو مبادرة مقترحة\nتدعمها اللجنة المدنية.\n</p>\n\n<p>\nولا تشكل مقترحات اللجنة\nقراراً رسمياً\nبشأن اختيار الموقع،\nأو مشروعاً حكومياً معتمداً،\nأو التزاماً\nمن أي منظمة دولية.\n</p>\n\n<p>\nوستتطلب المشاركة المؤسسية المستقبلية،\nوالتمويل،\nوقرارات تحديد الموقع،\nوالترتيبات التشغيلية،\nإجراء المشاورات المناسبة\nوالحصول على الموافقات الرسمية\nمن السلطات المسؤولة.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nتسعى المبادرة\nإلى تعزيز التعاون الدولي المسؤول،\nوالحوار البنّاء بشأن السياسات،\nوالاستعداد العملي\nللفرص المستقبلية.\n</strong>\n\n</div>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n\n<strong>\nمبادرة المركز العالمي للذكاء الاصطناعي<br>\nمدينة غويانغ الخاصة،<br>\nمقاطعة غيونغي، جمهورية كوريا\n</strong>\n\n</p>\n\n<p>\nاللجنة المدنية لدعم استقطاب\nالمركز العالمي للذكاء الاصطناعي\nإلى مدينة غويانغ الخاصة\n</p>\n\n<p>\nمع المواطنين،\nومع مقاطعة غيونغي،\nومع العالم.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ar\">\nالصفحة الرئيسية العربية\n</a>\n\n&nbsp; | &nbsp;\n\n<a\n  href=\"hub.html\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=de": "<!DOCTYPE html>\n<html lang=\"de\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nÜber das globale KI-Zentrum | Sonderstadt Goyang\n</title>\n\n<meta name=\"description\"\ncontent=\"Erfahren Sie mehr über das geplante globale KI-Zentrum in der Sonderstadt Goyang, seine Vision, internationale Partnerschaften und verantwortungsvolle KI-Anwendungen zur Bewältigung globaler Herausforderungen.\">\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.8;\n}\n\n.intro {\n  font-size: 18px;\n}\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .intro {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n}\n</style>\n</head>\n\n<body>\n\n<header>\n  <h1>Über das globale KI-Zentrum</h1>\n\n  <p>\n    Eine geplante internationale Kooperationsplattform<br>\n    zur Bewältigung globaler Herausforderungen mithilfe von KI\n  </p>\n\n  <div class=\"header-links\">\n    <a href=\"index.html?lang=de\" class=\"home-link\">\n      ← Deutsche Startseite\n    </a>\n  </div>\n</header>\n\n<main>\n\n\u003c!-- VISION -->\n\n<section>\n  <div class=\"slogan\">\n    Über die KI-Technologie hinaus – für die Zukunft der Menschheit.<br>\n    Ein neues Zentrum der internationalen Zusammenarbeit.<br>\n    Das globale KI-Zentrum.\n  </div>\n</section>\n\n\u003c!-- 1. WAS IST DAS GLOBALE KI-ZENTRUM? -->\n\n<section>\n  <h2>1. Was ist das globale KI-Zentrum?</h2>\n\n  <div class=\"intro\">\n\n    <p>\n      Das geplante globale KI-Zentrum\n      ist als internationale Kooperationsplattform vorgesehen,\n      auf der internationale Organisationen,\n      Regierungen, Universitäten,\n      Forschungseinrichtungen,\n      Unternehmen und die Zivilgesellschaft\n      gemeinsam Möglichkeiten erkunden können,\n      künstliche Intelligenz\n      zum Wohle der Allgemeinheit einzusetzen.\n    </p>\n\n    <p>\n      Künstliche Intelligenz ist eine Schlüsseltechnologie,\n      die Industrien und Volkswirtschaften verändert.\n      Gleichzeitig bietet sie das Potenzial,\n      zur Bewältigung globaler Herausforderungen\n      wie Krankheiten, Hunger,\n      Klimawandel, Naturkatastrophen\n      und Bildungsungleichheit beizutragen.\n    </p>\n\n    <p>\n      Die Initiative für ein globales KI-Zentrum\n      möchte diese Möglichkeiten\n      mit internationaler Zusammenarbeit,\n      öffentlicher Politik,\n      Forschung und Entwicklung\n      sowie praktischen Anwendungen verbinden.\n    </p>\n\n  </div>\n\n  <div class=\"highlight\">\n    <strong>\n      Das zentrale Ziel des globalen KI-Zentrums\n      besteht nicht lediglich darin,\n      internationale Organisationen\n      an einem Standort zusammenzubringen,\n      sondern internationale Zusammenarbeit\n      und gemeinsame Problemlösungen\n      durch verantwortungsvolle KI-Anwendungen\n      zu fördern.\n    </strong>\n  </div>\n</section>\n\n\u003c!-- 2. WARUM WIRD EIN GLOBALES KI-ZENTRUM BENÖTIGT? -->\n\n<section>\n  <h2>2. Warum wird ein globales KI-Zentrum benötigt?</h2>\n\n  <p>\n    Viele Herausforderungen,\n    vor denen die Menschheit steht,\n    können nicht wirksam\n    von einem einzelnen Land\n    oder einer einzelnen Institution\n    allein bewältigt werden.\n  </p>\n\n  <p>\n    Gesundheitskrisen,\n    Ernährungsunsicherheit,\n    Klimawandel,\n    Katastrophenvorsorge und -bewältigung,\n    erzwungene Vertreibung,\n    Migration,\n    Veränderungen auf den Arbeitsmärkten\n    und Bildungsungleichheit\n    erfordern internationale Zusammenarbeit,\n    Informationsaustausch\n    und wissenschaftliche Innovation.\n  </p>\n\n  <p>\n    KI kann dabei helfen,\n    große Informationsmengen zu analysieren,\n    neu entstehende Risiken zu erkennen\n    und Entscheidungsprozesse\n    in der öffentlichen Politik\n    sowie im praktischen Betrieb zu unterstützen.\n  </p>\n\n  <p>\n    Damit die Möglichkeiten der KI\n    tatsächlich einen gesellschaftlichen Nutzen schaffen,\n    sind jedoch zuverlässige Daten,\n    wirksame institutionelle Zusammenarbeit,\n    ethische Schutzmaßnahmen,\n    qualifizierte Fachkräfte\n    und nachhaltige Betriebsstrukturen erforderlich.\n  </p>\n\n  <p>\n    Das geplante globale KI-Zentrum\n    möchte diese Elemente\n    in einem internationalen Kooperationsrahmen\n    zusammenführen.\n  </p>\n\n</section>\n\n\u003c!-- 3. SECHS KERNFUNKTIONEN -->\n\n<section>\n  <h2>3. Sechs Kernfunktionen des globalen KI-Zentrums</h2>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>01. Plattform für internationale Zusammenarbeit</h3>\n      <p>\n        Förderung des Dialogs,\n        des Informationsaustauschs\n        und möglicher Kooperationen\n        zwischen internationalen Organisationen,\n        Regierungen,\n        Forschungseinrichtungen\n        und Unternehmen.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>02. Gemeinwohlorientierte KI-Forschung</h3>\n      <p>\n        Erkundung gemeinsamer Forschungs-\n        und Entwicklungsprojekte\n        für KI-Anwendungen,\n        die gesellschaftliche Herausforderungen\n        im Gesundheitswesen,\n        Umweltschutz,\n        Katastrophenschutz,\n        Bildungsbereich\n        und verwandten Gebieten angehen.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>03. Internationale Gemeinschaftsprojekte</h3>\n      <p>\n        Ermittlung von Möglichkeiten\n        für gemeinsame Forschung,\n        Pilotprojekte\n        und praktische Anwendungen\n        durch die Verbindung\n        internationaler Bedürfnisse\n        mit lokalen technologischen Kompetenzen.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>04. Fachliche Weiterbildung</h3>\n      <p>\n        Erkundung von Bildungs-,\n        Ausbildungs-\n        und internationalen Austauschmöglichkeiten\n        für Fachkräfte,\n        die an der Schnittstelle\n        zwischen KI\n        und internationaler Zusammenarbeit tätig sind.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>05. Industrie und Unternehmertum</h3>\n      <p>\n        Förderung möglicher Verbindungen\n        zwischen KI-Unternehmen,\n        Forschungseinrichtungen\n        und internationalen Kooperationsbedürfnissen,\n        um Technologiedemonstrationen,\n        Unternehmertum\n        und industrielle Innovation zu unterstützen.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>06. Verantwortungsvolle KI</h3>\n      <p>\n        Förderung der Berücksichtigung\n        von Datenschutz,\n        Sicherheit,\n        Fairness,\n        Menschenrechten\n        und Rechenschaftspflicht\n        bei der Entwicklung\n        und Nutzung von KI-Technologien.\n      </p>\n    </article>\n\n  </div>\n</section>\n\n\u003c!-- 4. PRIORITÄRE KOOPERATIONSBEREICHE -->\n\n<section>\n  <h2>4. Vorrangige Bereiche der internationalen Zusammenarbeit</h2>\n\n  <p>\n    Die Initiative für ein globales KI-Zentrum\n    möchte Kooperationsmöglichkeiten\n    in Bereichen erkunden,\n    die mit den Aufgaben\n    und Fachkompetenzen\n    internationaler Organisationen\n    und spezialisierter Institutionen\n    in Verbindung stehen.\n  </p>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>Öffentliche Gesundheit</h3>\n      <p>\n        Krankheitsprävention,\n        Bekämpfung von Infektionskrankheiten,\n        Analyse von Gesundheitsinformationen\n        und Stärkung\n        der öffentlichen Gesundheitsversorgung.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Ernährung und Landwirtschaft</h3>\n      <p>\n        Ernährungssicherheit,\n        landwirtschaftliche Produktivität,\n        Anpassung an den Klimawandel\n        und nachhaltige Landwirtschaft.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Klima und Umwelt</h3>\n      <p>\n        Klimaschutz,\n        Analyse von Umweltdaten,\n        Schutz von Ökosystemen\n        und nachhaltige Entwicklung.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Katastrophenvorsorge und Sicherheit</h3>\n      <p>\n        Bewertung von Katastrophenrisiken,\n        Frühwarnsysteme,\n        Notfallmaßnahmen\n        und Verringerung\n        der Auswirkungen von Katastrophen.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Flüchtlinge und Migration</h3>\n      <p>\n        Humanitäre Hilfe,\n        migrationsbezogene Informationen,\n        Schutz gefährdeter Bevölkerungsgruppen\n        und internationale Zusammenarbeit.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Beschäftigung und Bildung</h3>\n      <p>\n        Zukunft der Arbeit,\n        berufliche Weiterbildung,\n        Zugang zu Bildung\n        und Verringerung\n        digitaler Ungleichheiten.\n      </p>\n    </article>\n\n  </div>\n\n  <p class=\"note\">\n    Diese Bereiche beschreiben mögliche\n    Kooperationsfelder.\n    Sie bedeuten weder\n    eine bestätigte Beteiligung\n    einer internationalen Organisation\n    noch eine Genehmigung\n    konkreter Projekte.\n  </p>\n\n  <a href=\"agencies.html?lang=de\" class=\"button\">\n    Neun internationale Organisationen entdecken\n  </a>\n</section>\n\n\u003c!-- 5. GOYANG -->\n\n<section>\n  <h2>5. Das globale KI-Zentrum und die Sonderstadt Goyang</h2>\n\n  <p>\n    Die Sonderstadt Goyang liegt\n    in der Provinz Gyeonggi\n    innerhalb der Metropolregion Seoul\n    in der Republik Korea.\n  </p>\n\n  <p>\n    Die Stadt verfügt\n    über eine gute Erreichbarkeit\n    innerhalb der Metropolregion,\n    internationale Kongressinfrastruktur,\n    Gesundheitseinrichtungen,\n    Bildungs- und Kulturangebote\n    sowie ein etabliertes städtisches Umfeld.\n  </p>\n\n  <p>\n    Diese Standortvorteile\n    bilden eine Grundlage,\n    um Goyangs Potenzial\n    als Zentrum für gemeinwohlorientierte KI\n    und internationale Zusammenarbeit\n    zu untersuchen.\n  </p>\n\n  <p>\n    Sollte sich die internationale Zusammenarbeit\n    in der Praxis ausweiten,\n    könnten neue Möglichkeiten\n    in Forschung und Entwicklung,\n    wirtschaftlichen Aktivitäten,\n    professionellen Dienstleistungen\n    und der regionalen Wirtschaft entstehen.\n  </p>\n\n  <p>\n    Zu den wichtigen langfristigen Zielen gehören\n    die berufliche Entwicklung junger Menschen,\n    hochwertige Arbeitsplätze,\n    technologische Innovationen\n    in lokalen Unternehmen\n    und ein erweiterter internationaler Austausch.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      Die Ansiedlung des geplanten globalen KI-Zentrums\n      stellt eine mögliche Strategie dar,\n      um die zukünftigen Wachstumschancen,\n      Beschäftigungsperspektiven\n      und die regionale Wirtschaftsentwicklung\n      der Sonderstadt Goyang zu stärken.\n    </strong>\n  </div>\n\n  <p>\n    Die tatsächlichen wirtschaftlichen Ergebnisse\n    würden vom Umfang\n    der zukünftigen institutionellen Beteiligung,\n    der Art der Kooperationsaktivitäten\n    und den letztlich vereinbarten\n    Betriebsstrukturen abhängen.\n  </p>\n\n  <a href=\"goyang.html?lang=de\" class=\"button\">\n    Warum die Sonderstadt Goyang?\n  </a>\n</section>\n\n\u003c!-- 6. ENTWICKLUNGSSTRATEGIE -->\n\n<section>\n  <h2>6. Vorgeschlagene Entwicklungsstrategie</h2>\n\n  <p>\n    Das Bürgerkomitee zur Förderung\n    der Ansiedlung eines globalen KI-Zentrums\n    möchte die Beteiligung der Öffentlichkeit fördern\n    und die städtischen Stärken Goyangs\n    mit praktischen politischen Vorschlägen\n    für die Initiative verbinden.\n  </p>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>Öffentlichkeitsarbeit und Bürgerbeteiligung</h3>\n      <p>\n        Erweiterung des öffentlichen Verständnisses\n        und der freiwilligen Beteiligung\n        durch Online-Unterstützungsbekundungen\n        und Informationskampagnen.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Stärkung der Standortwettbewerbsfähigkeit</h3>\n      <p>\n        Bewertung der Standortvorteile Goyangs\n        und seiner Möglichkeiten\n        zur internationalen Zusammenarbeit\n        sowie Entwicklung praktischer,\n        evidenzbasierter politischer Vorschläge.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Institutionelle Zusammenarbeit</h3>\n      <p>\n        Erkundung möglicher Kooperationen\n        mit der Provinz Gyeonggi,\n        der Sonderstadt Goyang,\n        zuständigen nationalen Behörden\n        und weiteren Institutionen.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Nachhaltiger Betrieb</h3>\n      <p>\n        Entwicklung politischer Vorschläge\n        zu langfristigen Kooperationsrahmen\n        und nachhaltigen Betriebsstrukturen.\n      </p>\n    </article>\n\n  </div>\n\n  <a href=\"strategy.html?lang=de\" class=\"button\">\n    Entwicklungsstrategie entdecken\n  </a>\n</section>\n\n\u003c!-- 7. BÜRGERBETEILIGUNG -->\n\n<section>\n  <h2>7. Bürgerbeteiligung und gemeinsame Verantwortung</h2>\n\n  <p>\n    Das geplante globale KI-Zentrum\n    ist nicht ausschließlich\n    eine Angelegenheit öffentlicher Behörden.\n  </p>\n\n  <p>\n    Es bietet auch Bürgerinnen und Bürgern,\n    lokalen Gemeinschaften,\n    Universitäten,\n    Forschungseinrichtungen,\n    Unternehmen und Fachkräften\n    die Möglichkeit,\n    sich an Diskussionen\n    über die Zukunft Goyangs zu beteiligen.\n  </p>\n\n  <p>\n    Das Bürgerkomitee\n    fördert die freiwillige Beteiligung\n    der Öffentlichkeit an der Initiative.\n  </p>\n\n  <p>\n    Zu den Aktivitäten gehören\n    Online-Unterstützungsbekundungen,\n    die Registrierung im Komitee,\n    Fördermitgliedschaften\n    und öffentliche Informationskampagnen.\n  </p>\n\n  <a href=\"participate.html?lang=de\" class=\"button\">\n    Zentrum für Bürgerbeteiligung\n  </a>\n</section>\n\n\u003c!-- 8. INSTITUTIONELLER STATUS -->\n\n<section>\n  <h2>8. Institutioneller Status</h2>\n\n  <p>\n    Das globale KI-Zentrum in Goyang\n    ist eine vorgeschlagene Initiative,\n    die vom Bürgerkomitee unterstützt wird.\n  </p>\n\n  <p>\n    Die Vorschläge des Komitees\n    stellen weder eine offizielle Standortentscheidung\n    noch ein genehmigtes Regierungsprojekt\n    oder eine verbindliche Zusage\n    einer internationalen Organisation dar.\n  </p>\n\n  <p>\n    Eine zukünftige institutionelle Beteiligung,\n    die Finanzierung,\n    Standortentscheidungen\n    und Betriebsvereinbarungen\n    würden entsprechende Konsultationen\n    und formelle Genehmigungen\n    durch die zuständigen Behörden erfordern.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      Die Initiative möchte\n      verantwortungsvolle internationale Zusammenarbeit,\n      konstruktiven politischen Dialog\n      und praktische Vorbereitungen\n      für zukünftige Möglichkeiten fördern.\n    </strong>\n  </div>\n</section>\n\n</main>\n\n<footer>\n  <p>\n    <strong>\n      Initiative für ein globales KI-Zentrum<br>\n      Sonderstadt Goyang,\n      Provinz Gyeonggi,\n      Republik Korea\n    </strong>\n  </p>\n\n  <p>\n    Bürgerkomitee zur Förderung\n    der Ansiedlung eines globalen KI-Zentrums\n    in der Sonderstadt Goyang\n  </p>\n\n  <p>\n    Mit den Bürgerinnen und Bürgern,\n    mit der Provinz Gyeonggi\n    und mit der Welt.\n  </p>\n\n  <p>\n    <a href=\"index.html?lang=de\">\n      Deutsche Startseite\n    </a>\n  </p>\n</footer>\n\n</body>\n</html>\n",
  "lang=en": "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nAbout the Global AI Hub | Goyang Special City\n</title>\n\n<meta name=\"description\"\ncontent=\"Learn about the proposed Global AI Hub in Goyang Special City, its vision, public-interest AI cooperation, international partnerships, and potential contributions to global challenges.\">\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.8;\n}\n\n.intro {\n  font-size: 18px;\n}\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .intro {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n}\n</style>\n</head>\n\n<body>\n\n<header>\n  <h1>About the Global AI Hub</h1>\n\n  <p>\n    A Proposed International Cooperation Platform<br>\n    for Addressing Global Challenges through AI\n  </p>\n\n  <div class=\"header-links\">\n    <a href=\"index.html?lang=en\" class=\"home-link\">\n      ← English Home\n    </a>\n\n    <a href=\"hub.html\" class=\"home-link\" lang=\"ko\">\n      한국어\n    </a>\n  </div>\n</header>\n\n<main>\n\n\u003c!-- Vision -->\n\n<section>\n  <div class=\"slogan\">\n    Beyond AI Technology, Toward Humanity's Future.<br>\n    A New Center for International Cooperation.<br>\n    The Global AI Hub.\n  </div>\n</section>\n\n\u003c!-- What is the Global AI Hub? -->\n\n<section>\n  <h2>1. What Is the Global AI Hub?</h2>\n\n  <div class=\"intro\">\n\n    <p>\n      The proposed Global AI Hub is envisioned\n      as an international cooperation platform\n      where international organizations,\n      governments, universities,\n      research institutions,\n      businesses, and civil society\n      can explore ways to use\n      artificial intelligence\n      for the common good.\n    </p>\n\n    <p>\n      Artificial intelligence is a key technology\n      transforming industries and economies.\n      It also has the potential to contribute\n      to addressing global challenges,\n      including disease, hunger,\n      climate change, disasters,\n      and educational inequality.\n    </p>\n\n    <p>\n      The Global AI Hub initiative seeks\n      to connect these possibilities\n      with international cooperation,\n      public policy,\n      research and development,\n      and practical applications.\n    </p>\n\n  </div>\n\n  <div class=\"highlight\">\n    <strong>\n      The central purpose of the Global AI Hub\n      is not simply to bring international\n      organizations together in one location,\n      but to encourage international cooperation\n      and collective problem-solving\n      through responsible applications of AI.\n    </strong>\n  </div>\n</section>\n\n\u003c!-- Why needed -->\n\n<section>\n  <h2>2. Why Is a Global AI Hub Needed?</h2>\n\n  <p>\n    Many of the challenges facing humanity\n    cannot be addressed effectively\n    by a single country\n    or institution acting alone.\n  </p>\n\n  <p>\n    Public health emergencies,\n    food insecurity,\n    climate change,\n    disaster prevention and response,\n    forced displacement,\n    migration,\n    changes in labor markets,\n    and educational inequality\n    require international cooperation,\n    information exchange,\n    and scientific innovation.\n  </p>\n\n  <p>\n    AI can support the analysis\n    of large volumes of information,\n    help identify emerging risks,\n    and assist decision-making\n    in public policy\n    and practical operations.\n  </p>\n\n  <p>\n    However, translating AI capabilities\n    into meaningful public benefits\n    requires reliable data,\n    effective institutional cooperation,\n    ethical safeguards,\n    skilled professionals,\n    and sustainable operating arrangements.\n  </p>\n\n  <p>\n    The proposed Global AI Hub\n    seeks to bring these elements together\n    through an international\n    cooperation framework.\n  </p>\n\n</section>\n\n\u003c!-- Functions -->\n\n<section>\n  <h2>3. Six Core Functions of the Global AI Hub</h2>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>01. International Cooperation Platform</h3>\n      <p>\n        Facilitate dialogue,\n        information exchange,\n        and potential cooperation\n        among international organizations,\n        governments,\n        research institutions,\n        and businesses.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>02. Public-Interest AI Research</h3>\n      <p>\n        Explore collaborative research\n        and development of AI applications\n        that address public challenges\n        in healthcare,\n        environmental protection,\n        disaster resilience,\n        education,\n        and related fields.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>03. International Joint Projects</h3>\n      <p>\n        Identify opportunities\n        for collaborative research,\n        pilot projects,\n        and practical applications\n        by connecting international needs\n        with local technological capabilities.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>04. Professional Development</h3>\n      <p>\n        Explore education,\n        training,\n        and professional exchange\n        opportunities for people\n        working at the intersection\n        of AI and international cooperation.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>05. Industry and Entrepreneurship</h3>\n      <p>\n        Explore connections among\n        AI businesses,\n        research institutions,\n        and international cooperation needs\n        to support technology demonstration,\n        entrepreneurship,\n        and industrial innovation.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>06. Responsible AI</h3>\n      <p>\n        Promote consideration\n        of privacy,\n        safety,\n        fairness,\n        human rights,\n        and accountability\n        in the development\n        and use of AI technologies.\n      </p>\n    </article>\n\n  </div>\n</section>\n\n\u003c!-- Cooperation areas -->\n\n<section>\n  <h2>4. Priority Areas for International Cooperation</h2>\n\n  <p>\n    The Global AI Hub initiative\n    seeks to explore cooperation\n    in fields relevant\n    to the mandates and expertise\n    of international organizations\n    and specialized institutions.\n  </p>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>Public Health</h3>\n      <p>\n        Disease prevention,\n        infectious disease response,\n        health information analysis,\n        and strengthening public health capacity.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Food and Agriculture</h3>\n      <p>\n        Food security,\n        agricultural productivity,\n        climate adaptation,\n        and sustainable agriculture.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Climate and Environment</h3>\n      <p>\n        Climate action,\n        environmental data analysis,\n        ecosystem protection,\n        and sustainable development.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Disaster Risk and Safety</h3>\n      <p>\n        Disaster risk assessment,\n        early-warning systems,\n        emergency response,\n        and reducing disaster impacts.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Refugees and Migration</h3>\n      <p>\n        Humanitarian assistance,\n        migration-related information,\n        protection of vulnerable populations,\n        and international cooperation.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Employment and Education</h3>\n      <p>\n        Future employment,\n        vocational training,\n        educational accessibility,\n        and reducing digital inequalities.\n      </p>\n    </article>\n\n  </div>\n\n  <p class=\"note\">\n    These areas describe potential\n    fields of cooperation.\n    They do not imply confirmed\n    participation by any\n    international organization\n    or approval of specific projects.\n  </p>\n\n  <a href=\"agencies.html?lang=en\" class=\"button\">\n    Explore Nine International Organizations\n  </a>\n</section>\n\n\u003c!-- Goyang -->\n\n<section>\n  <h2>5. The Global AI Hub and Goyang Special City</h2>\n\n  <p>\n    Goyang Special City is located\n    in Gyeonggi Province,\n    within the Seoul metropolitan region\n    of the Republic of Korea.\n  </p>\n\n  <p>\n    The city offers metropolitan accessibility,\n    international convention infrastructure,\n    healthcare institutions,\n    educational and cultural facilities,\n    and an established urban environment.\n  </p>\n\n  <p>\n    These assets provide a foundation\n    for exploring Goyang's potential\n    as a center for public-interest AI\n    and international cooperation.\n  </p>\n\n  <p>\n    If international cooperation\n    expands in practice,\n    new opportunities could emerge\n    in research and development,\n    business activities,\n    professional services,\n    and the regional economy.\n  </p>\n\n  <p>\n    Important long-term objectives\n    include professional development\n    for young people,\n    high-quality employment,\n    technological innovation\n    among local businesses,\n    and expanded international exchange.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      Attracting the proposed Global AI Hub\n      represents a potential strategy\n      for strengthening Goyang's\n      future growth opportunities,\n      employment prospects,\n      and regional economic development.\n    </strong>\n  </div>\n\n  <p>\n    Actual economic outcomes\n    would depend on the scale\n    of future institutional participation,\n    the nature of cooperative activities,\n    and the operational arrangements\n    ultimately established.\n  </p>\n\n  <a href=\"goyang.html?lang=en\" class=\"button\">\n    Why Goyang Special City?\n  </a>\n</section>\n\n\u003c!-- Strategy -->\n\n<section>\n  <h2>6. Proposed Development Strategy</h2>\n\n  <p>\n    The Citizens' Promotion Committee\n    seeks to encourage public participation\n    and connect Goyang's urban strengths\n    with practical policy proposals\n    for the Global AI Hub initiative.\n  </p>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>Public Awareness and Engagement</h3>\n      <p>\n        Expand public understanding\n        and voluntary participation\n        through online expressions of support\n        and outreach activities.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Strengthening Location Competitiveness</h3>\n      <p>\n        Assess Goyang's location advantages\n        and international cooperation assets,\n        and develop practical,\n        evidence-based policy proposals.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Institutional Cooperation</h3>\n      <p>\n        Explore potential cooperation\n        with Gyeonggi Province,\n        Goyang Special City,\n        relevant national authorities,\n        and other institutions.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Sustainable Operations</h3>\n      <p>\n        Develop policy proposals\n        concerning long-term\n        cooperation frameworks\n        and sustainable operating arrangements.\n      </p>\n    </article>\n\n  </div>\n\n  <a href=\"strategy.html?lang=en\" class=\"button\">\n    Explore the Global AI Hub Strategy\n  </a>\n</section>\n\n\u003c!-- Participation -->\n\n<section>\n  <h2>7. Citizen Participation and Shared Responsibility</h2>\n\n  <p>\n    The proposed Global AI Hub\n    is not solely a matter\n    for public authorities.\n  </p>\n\n  <p>\n    It is also an opportunity\n    for citizens,\n    local communities,\n    universities,\n    research institutions,\n    businesses,\n    and professionals\n    to contribute to discussions\n    about Goyang's future.\n  </p>\n\n  <p>\n    The Citizens' Promotion Committee\n    encourages voluntary public participation\n    in the initiative.\n  </p>\n\n  <p>\n    Activities include\n    online expressions of support,\n    Committee registration,\n    supporting membership,\n    and public awareness campaigns.\n  </p>\n\n  <a href=\"participate.html\" class=\"button\">\n    Citizen Participation Center (Korean)\n  </a>\n</section>\n\n\u003c!-- Institutional clarification -->\n\n<section>\n  <h2>8. Institutional Status</h2>\n\n  <p>\n    The Global AI Hub in Goyang\n    is a proposed initiative\n    supported by the\n    Citizens' Promotion Committee.\n  </p>\n\n  <p>\n    The Committee's proposals\n    do not constitute\n    an official site-selection decision,\n    an approved government project,\n    or a commitment\n    by any international organization.\n  </p>\n\n  <p>\n    Future institutional participation,\n    funding,\n    location decisions,\n    and operational arrangements\n    would require appropriate consultation\n    and formal approval\n    by the responsible authorities.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      The initiative seeks to promote\n      responsible international cooperation,\n      constructive policy dialogue,\n      and practical preparation\n      for future opportunities.\n    </strong>\n  </div>\n</section>\n\n</main>\n\n<footer>\n  <p>\n    <strong>\n      Global AI Hub Initiative<br>\n      Goyang Special City,\n      Gyeonggi Province,\n      Republic of Korea\n    </strong>\n  </p>\n\n  <p>\n    Citizens' Promotion Committee\n    for Attracting the Global AI Hub\n    to Goyang Special City\n  </p>\n\n  <p>\n    With Citizens, With Gyeonggi Province,\n    and With the World.\n  </p>\n\n  <p>\n    <a href=\"index.html?lang=en\">\n      English Home\n    </a>\n    &nbsp; | &nbsp;\n    <a href=\"hub.html\" lang=\"ko\">\n      한국어\n    </a>\n  </p>\n</footer>\n\n</body>\n</html>\n",

kground: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* DISEÑO MÓVIL */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 18px 12px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .intro {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n</head>\n\n<body>\n\n<header>\n  <h1>Acerca del Centro Global de Inteligencia Artificial</h1>\n\n  <p>\n    Una plataforma propuesta de cooperación internacional<br>\n    para afrontar los desafíos globales mediante la IA\n  </p>\n</header>\n\n<nav class=\"top-navigation\" aria-label=\"Navegación principal\">\n\n  <a href=\"index.html?lang=es\">\n    ← Inicio\n  </a>\n\n  <a href=\"#vision\">Visión</a>\n\n  <a href=\"#funciones\">Funciones</a>\n\n  <a href=\"#cooperacion\">Cooperación</a>\n\n  <a href=\"#goyang\">Goyang</a>\n\n  <a href=\"#estrategia\">Estrategia</a>\n\n  <a href=\"#participacion\">Participación</a>\n\n  <details class=\"language-dropdown\">\n\n    <summary aria-label=\"Seleccionar idioma\">\n      🌐 Idioma ▾\n    </summary>\n\n    <div class=\"language-options\">\n\n      <a href=\"hub.html?lang=es\"\n         lang=\"es\"\n         aria-current=\"page\">\n        Español ✓\n      </a>\n\n      <a href=\"hub.html?lang=en\" lang=\"en\">\n        English\n      </a>\n\n      <a href=\"hub.html\" lang=\"ko\">\n        한국어\n      </a>\n\n    </div>\n\n  </details>\n\n</nav>\n\n<main>\n\n\u003c!-- VISIÓN -->\n\n<section id=\"vision\">\n\n  <div class=\"slogan\">\n    Más allá de la tecnología de IA,<br>\n    hacia el futuro de la humanidad.<br>\n    Un nuevo centro de cooperación internacional.<br>\n    El Centro Global de IA.\n  </div>\n\n</section>\n\n\u003c!-- 1. QUÉ ES EL CENTRO GLOBAL DE IA -->\n\n<section>\n\n<h2>1. ¿Qué es el Centro Global de Inteligencia Artificial?</h2>\n\n<div class=\"intro\">\n\n<p>\nEl Centro Global de Inteligencia Artificial\nes una iniciativa concebida como una plataforma\nde cooperación internacional en la que\norganizaciones internacionales, gobiernos,\nuniversidades, instituciones de investigación,\nempresas y sociedad civil puedan explorar\nformas de utilizar la inteligencia artificial\nen beneficio del bien común.\n</p>\n\n<p>\nLa inteligencia artificial es una tecnología\nfundamental que está transformando\nlas industrias y las economías.\nTambién tiene el potencial de contribuir\na afrontar desafíos globales como\nlas enfermedades, el hambre,\nel cambio climático, los desastres\ny la desigualdad educativa.\n</p>\n\n<p>\nLa iniciativa del Centro Global de IA\nbusca conectar estas posibilidades\ncon la cooperación internacional,\nlas políticas públicas,\nla investigación y el desarrollo,\ny las aplicaciones prácticas.\n</p>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nEl propósito central del Centro Global de IA\nno consiste simplemente en reunir\norganizaciones internacionales\nen un mismo lugar, sino en fomentar\nla cooperación internacional\ny la resolución colectiva de problemas\nmediante aplicaciones responsables\nde la inteligencia artificial.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- 2. NECESIDAD -->\n\n<section>\n\n<h2>2. ¿Por qué es necesario un Centro Global de IA?</h2>\n\n<p>\nMuchos de los desafíos que enfrenta\nla humanidad no pueden resolverse\neficazmente mediante la actuación\naislada de un solo país o institución.\n</p>\n\n<p>\nLas emergencias de salud pública,\nla inseguridad alimentaria,\nel cambio climático,\nla prevención y respuesta ante desastres,\nel desplazamiento forzado,\nla migración,\nlos cambios en los mercados laborales\ny la desigualdad educativa\nrequieren cooperación internacional,\nintercambio de información\ne innovación científica.\n</p>\n\n<p>\nLa inteligencia artificial puede facilitar\nel análisis de grandes volúmenes\nde información, ayudar a identificar\nriesgos emergentes y apoyar\nla toma de decisiones\nen las políticas públicas\ny las operaciones prácticas.\n</p>\n\n<p>\nSin embargo, transformar las capacidades\nde la IA en beneficios públicos reales\nrequiere datos fiables,\ncooperación institucional eficaz,\ngarantías éticas,\nprofesionales cualificados\ny mecanismos operativos sostenibles.\n</p>\n\n<p>\nEl Centro Global de IA propuesto\nbusca reunir estos elementos\nmediante un marco de cooperación internacional.\n</p>\n\n</section>\n\n\u003c!-- 3. FUNCIONES -->\n\n<section id=\"funciones\">\n\n<h2>3. Seis funciones principales del Centro Global de IA</h2>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>01. Plataforma de cooperación internacional</h3>\n\n<p>\nFacilitar el diálogo,\nel intercambio de información\ny la posible cooperación\nentre organizaciones internacionales,\ngobiernos, instituciones de investigación\ny empresas.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>02. Investigación de IA para el interés público</h3>\n\n<p>\nExplorar la investigación colaborativa\ny el desarrollo de aplicaciones de IA\nque aborden desafíos públicos\nen salud, protección ambiental,\nresiliencia ante desastres,\neducación y ámbitos relacionados.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>03. Proyectos internacionales conjuntos</h3>\n\n<p>\nIdentificar oportunidades\nde investigación colaborativa,\nproyectos piloto y aplicaciones prácticas,\nconectando las necesidades internacionales\ncon las capacidades tecnológicas locales.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>04. Desarrollo profesional</h3>\n\n<p>\nExplorar oportunidades de educación,\nformación e intercambio profesional\npara quienes trabajan\nen la intersección de la inteligencia\nartificial y la cooperación internacional.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>05. Industria y emprendimiento</h3>\n\n<p>\nExplorar conexiones entre empresas de IA,\ninstituciones de investigación\ny necesidades de cooperación internacional\npara apoyar demostraciones tecnológicas,\nemprendimiento e innovación industrial.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>06. Inteligencia artificial responsable</h3>\n\n<p>\nPromover la consideración\nde la privacidad, la seguridad,\nla equidad, los derechos humanos\ny la rendición de cuentas\nen el desarrollo y uso\nde tecnologías de inteligencia artificial.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- 4. COOPERACIÓN -->\n\n<section id=\"cooperacion\">\n\n<h2>4. Ámbitos prioritarios de cooperación internacional</h2>\n\n<p>\nLa iniciativa del Centro Global de IA\nbusca explorar oportunidades de cooperación\nen ámbitos relacionados con los mandatos\ny conocimientos especializados\nde organizaciones internacionales\ne instituciones especializadas.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>Salud pública</h3>\n\n<p>\nPrevención de enfermedades,\nrespuesta ante enfermedades infecciosas,\nanálisis de información sanitaria\ny fortalecimiento de las capacidades\nde salud pública.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>Alimentación y agricultura</h3>\n\n<p>\nSeguridad alimentaria,\nproductividad agrícola,\nadaptación climática\ny agricultura sostenible.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>Clima y medio ambiente</h3>\n\n<p>\nAcción climática,\nanálisis de datos ambientales,\nprotección de ecosistemas\ny desarrollo sostenible.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>Riesgo de desastres y seguridad</h3>\n\n<p>\nEvaluación de riesgos de desastres,\nsistemas de alerta temprana,\nrespuesta ante emergencias\ny reducción de sus impactos.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>Refugiados y migración</h3>\n\n<p>\nAsistencia humanitaria,\ninformación relacionada con la migración,\nprotección de poblaciones vulnerables\ny cooperación internacional.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>Empleo y educación</h3>\n\n<p>\nFuturo del empleo,\nformación profesional,\naccesibilidad educativa\ny reducción de las desigualdades digitales.\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\nEstos ámbitos describen posibles\ncampos de cooperación.\nNo implican la participación confirmada\nde ninguna organización internacional\nni la aprobación de proyectos específicos.\n</p>\n\n<a href=\"index.html?lang=es#organizations\" class=\"button\">\nConocer las nueve organizaciones internacionales\n</a>\n\n</section>\n\n\u003c!-- 5. GOYANG -->\n\n<section id=\"goyang\">\n\n<h2>5. El Centro Global de IA y la Ciudad Especial de Goyang</h2>\n\n<p>\nLa Ciudad Especial de Goyang\nse encuentra en la provincia de Gyeonggi,\ndentro de la región metropolitana de Seúl,\nen la República de Corea.\n</p>\n\n<p>\nLa ciudad ofrece accesibilidad metropolitana,\ninfraestructura para convenciones internacionales,\ninstituciones sanitarias,\ninstalaciones educativas y culturales,\ny un entorno urbano consolidado.\n</p>\n\n<p>\nEstos recursos constituyen una base\npara explorar el potencial de Goyang\ncomo centro de inteligencia artificial\nde interés público y cooperación internacional.\n</p>\n\n<p>\nSi la cooperación internacional\nse amplía en la práctica,\npodrían surgir nuevas oportunidades\nen investigación y desarrollo,\nactividades empresariales,\nservicios profesionales\ny economía regional.\n</p>\n\n<p>\nEntre los objetivos importantes\na largo plazo se encuentran\nel desarrollo profesional de los jóvenes,\nel empleo de calidad,\nla innovación tecnológica\nen las empresas locales\ny la ampliación del intercambio internacional.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nLa atracción del Centro Global de IA propuesto\nrepresenta una estrategia potencial\npara fortalecer las oportunidades\nde crecimiento futuro de Goyang,\nsus perspectivas de empleo\ny el desarrollo económico regional.\n</strong>\n\n</div>\n\n<p>\nLos resultados económicos reales\ndependerían de la escala\nde la futura participación institucional,\nla naturaleza de las actividades\nde cooperación y los mecanismos\noperativos que finalmente se establezcan.\n</p>\n\n<a href=\"index.html?lang=es#goyang\" class=\"button\">\n¿Por qué la Ciudad Especial de Goyang?\n</a>\n\n</section>\n\n\u003c!-- 6. ESTRATEGIA -->\n\n<section id=\"estrategia\">\n\n<h2>6. Estrategia de desarrollo propuesta</h2>\n\n<p>\nEl Comité Ciudadano de Promoción\nbusca fomentar la participación pública\ny conectar las fortalezas urbanas de Goyang\ncon propuestas de políticas prácticas\npara la iniciativa del Centro Global de IA.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>Concienciación y participación ciudadana</h3>\n\n<p>\nAmpliar el conocimiento público\ny la participación voluntaria\nmediante expresiones de apoyo en línea\ny actividades de divulgación.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>Fortalecimiento de la competitividad territorial</h3>\n\n<p>\nEvaluar las ventajas de ubicación de Goyang\ny sus recursos para la cooperación internacional,\ny desarrollar propuestas de políticas prácticas\nbasadas en evidencia.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>Cooperación institucional</h3>\n\n<p>\nExplorar posibles formas de cooperación\ncon la provincia de Gyeonggi,\nla Ciudad Especial de Goyang,\nlas autoridades nacionales competentes\ny otras instituciones.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>Operaciones sostenibles</h3>\n\n<p>\nDesarrollar propuestas de políticas\nrelacionadas con marcos de cooperación\na largo plazo y mecanismos\noperativos sostenibles.\n</p>\n\n</article>\n\n</div>\n\n<a href=\"index.html?lang=es#strategy\" class=\"button\">\nExplorar la estrategia del Centro Global de IA\n</a>\n\n</section>\n\n\u003c!-- 7. PARTICIPACIÓN -->\n\n<section id=\"participacion\">\n\n<h2>7. Participación ciudadana y responsabilidad compartida</h2>\n\n<p>\nEl Centro Global de IA propuesto\nno es únicamente un asunto\nde las autoridades públicas.\n</p>\n\n<p>\nTambién representa una oportunidad\npara que ciudadanos,\ncomunidades locales,\nuniversidades,\ninstituciones de investigación,\nempresas y profesionales\ncontribuyan al debate\nsobre el futuro de Goyang.\n</p>\n\n<p>\nEl Comité Ciudadano de Promoción\nfomenta la participación pública voluntaria\nen la iniciativa.\n</p>\n\n<p>\nLas actividades incluyen\nexpresiones de apoyo en línea,\nregistro en el Comité,\nafiliación como miembro colaborador\ny campañas de sensibilización pública.\n</p>\n\n<a href=\"participate.html\" class=\"button\"\nlang=\"ko\" hreflang=\"ko\">\nCentro de participación ciudadana (en coreano)\n</a>\n\n</section>\n\n\u003c!-- 8. SITUACIÓN INSTITUCIONAL -->\n\n<section>\n\n<h2>8. Situación institucional de la iniciativa</h2>\n\n<p>\nEl Centro Global de IA en Goyang\nes una iniciativa propuesta\nque cuenta con el apoyo\ndel Comité Ciudadano de Promoción.\n</p>\n\n<p>\nLas propuestas del Comité\nno constituyen una decisión oficial\nsobre la selección de la sede,\nun proyecto gubernamental aprobado\nni un compromiso de ninguna\norganización internacional.\n</p>\n\n<p>\nLa futura participación institucional,\nla financiación,\nlas decisiones sobre ubicación\ny los mecanismos operativos\nrequerirían las consultas pertinentes\ny la aprobación formal\nde las autoridades responsables.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nLa iniciativa busca promover\nla cooperación internacional responsable,\nel diálogo constructivo sobre políticas\ny la preparación práctica\npara futuras oportunidades.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- NAVEGACIÓN FINAL -->\n\n<section>\n\n<h2>Más información</h2>\n\n<p>\nContinúe explorando la iniciativa\ndel Centro Global de IA\ny sus oportunidades de cooperación.\n</p>\n\n<a href=\"index.html?lang=es\" class=\"button\">\n← Página principal en español\n</a>\n\n<a href=\"index.html?lang=es#organizations\" class=\"button\">\nOrganizaciones internacionales\n</a>\n\n<a href=\"index.html?lang=es#goyang\" class=\"button\">\n¿Por qué Goyang?\n</a>\n\n<a href=\"index.html?lang=es#strategy\" class=\"button\">\nEstrategia\n</a>\n\n</section>\n\n</main>\n\n<footer>\n\n<p>\n<strong>\nIniciativa del Centro Global de Inteligencia Artificial<br>\nCiudad Especial de Goyang,\nProvincia de Gyeonggi,\nRepública de Corea\n</strong>\n</p>\n\n<p>\nComité Ciudadano de Promoción\npara la Atracción del Centro Global de IA\na la Ciudad Especial de Goyang\n</p>\n\n<p>\nCon los ciudadanos,\ncon la provincia de Gyeonggi\ny con el mundo.\n</p>\n\n<p>\n<a href=\"index.html?lang=es\">\nInicio en español\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"hub.html?lang=en\" lang=\"en\">\nEnglish\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"hub.html\" lang=\"ko\">\n한국어\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=fr": "<!DOCTYPE html>\n<html lang=\"fr\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nPrésentation du Centre mondial de l'IA | Ville spéciale de Goyang\n</title>\n\n<meta name=\"description\"\ncontent=\"Découvrez le projet de Centre mondial de l'intelligence artificielle à Goyang, sa vision, ses fonctions, ses domaines de coopération internationale et ses contributions potentielles aux défis mondiaux.\">\n\n<style>\n\n/* CONFIGURATION GÉNÉRALE */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* EN-TÊTE */\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* CONTENU */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* SLOGAN */\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.8;\n}\n\n.intro {\n  font-size: 18px;\n}\n\n/* ENCADRÉ */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n/* GRILLE */\n\n.grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* BOUTONS */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* PIED DE PAGE */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* VERSION MOBILE */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .intro {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n</head>\n\n<body>\n\n\u003c!-- EN-TÊTE -->\n\n<header>\n\n<h1>\nPrésentation du Centre mondial de l'IA\n</h1>\n\n<p>\nUne plateforme proposée de coopération internationale<br>\npour relever les défis mondiaux grâce à l'intelligence artificielle\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=fr\" class=\"home-link\">\n← Accueil\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- VISION -->\n\n<section>\n\n<div class=\"slogan\">\n\nAu-delà de la technologie,\nvers l'avenir de l'humanité.<br>\n\nUn nouveau centre\nde coopération internationale.<br>\n\nLe Centre mondial de l'IA.\n\n</div>\n\n</section>\n\n\u003c!-- PRÉSENTATION -->\n\n<section>\n\n<h2>\n1. Qu'est-ce que le Centre mondial de l'IA ?\n</h2>\n\n<div class=\"intro\">\n\n<p>\nLe projet de Centre mondial de l'intelligence artificielle\nest conçu comme une plateforme\nde coopération internationale\noù les organisations internationales,\nles gouvernements,\nles universités,\nles établissements de recherche,\nles entreprises\net la société civile\npourraient explorer ensemble\nles moyens d'utiliser\nl'intelligence artificielle\nau service du bien commun.\n</p>\n\n<p>\nL'intelligence artificielle\nest une technologie essentielle\nqui transforme les industries\net les économies.\n</p>\n\n<p>\nElle possède également\nun potentiel considérable\npour contribuer à relever\ndes défis mondiaux,\nnotamment les maladies,\nla faim,\nle changement climatique,\nles catastrophes naturelles\net les inégalités éducatives.\n</p>\n\n<p>\nL'initiative du Centre mondial de l'IA\ncherche à associer\nces possibilités technologiques\nà la coopération internationale,\naux politiques publiques,\nà la recherche et au développement,\nainsi qu'aux applications pratiques.\n</p>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nL'objectif central du Centre mondial de l'IA\nn'est pas simplement\nde réunir des organisations internationales\ndans un même lieu,\nmais d'encourager\nla coopération internationale\net la résolution collective\ndes problèmes mondiaux\ngrâce à des applications responsables\nde l'intelligence artificielle.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- NÉCESSITÉ -->\n\n<section>\n\n<h2>\n2. Pourquoi un Centre mondial de l'IA est-il nécessaire ?\n</h2>\n\n<p>\nDe nombreux défis auxquels\nl'humanité est confrontée\nne peuvent être résolus efficacement\npar un seul pays\nou une seule institution.\n</p>\n\n<p>\nLes urgences de santé publique,\nl'insécurité alimentaire,\nle changement climatique,\nla prévention des catastrophes\net les interventions d'urgence,\nles déplacements forcés,\nles migrations,\nles transformations du marché du travail\net les inégalités éducatives\nnécessitent une coopération internationale,\ndes échanges d'informations\net des innovations scientifiques.\n</p>\n\n<p>\nL'intelligence artificielle\npeut contribuer à analyser\nde grandes quantités d'informations,\nà identifier les risques émergents\net à soutenir la prise de décision\ndans les politiques publiques\net les opérations pratiques.\n</p>\n\n<p>\nCependant,\npour transformer les capacités de l'IA\nen avantages concrets\npour la société,\nil est nécessaire de disposer\nde données fiables,\nd'une coopération institutionnelle efficace,\nde garanties éthiques,\nde professionnels qualifiés\net de dispositifs opérationnels durables.\n</p>\n\n<p>\nLe Centre mondial de l'IA proposé\nvise à réunir ces éléments\ndans un cadre\nde coopération internationale.\n</p>\n\n</section>\n\n\u003c!-- SIX FONCTIONS -->\n\n<section>\n\n<h2>\n3. Les six fonctions principales du Centre mondial de l'IA\n</h2>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\n01. Plateforme de coopération internationale\n</h3>\n\n<p>\nFaciliter le dialogue,\nles échanges d'informations\net les possibilités de coopération\nentre les organisations internationales,\nles gouvernements,\nles établissements de recherche\net les entreprises.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n02. Recherche en IA d'intérêt public\n</h3>\n\n<p>\nExplorer la recherche collaborative\net le développement\nd'applications de l'IA\ndestinées à répondre\naux défis d'intérêt public\ndans les domaines\nde la santé,\nde la protection de l'environnement,\nde la résilience face aux catastrophes,\nde l'éducation\net des secteurs connexes.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n03. Projets internationaux conjoints\n</h3>\n\n<p>\nIdentifier les possibilités\nde recherche collaborative,\nde projets pilotes\net d'applications pratiques\nen reliant les besoins internationaux\naux capacités technologiques locales.\n</p>\n\n</article>\n\n<article cla
