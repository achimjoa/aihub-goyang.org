ss=\"card\">\n\n<h3>\n04. Développement des compétences professionnelles\n</h3>\n\n<p>\nExplorer les possibilités\nd'éducation,\nde formation\net d'échanges professionnels\npour les personnes\ntravaillant à l'intersection\nde l'intelligence artificielle\net de la coopération internationale.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n05. Industrie et entrepreneuriat\n</h3>\n\n<p>\nExplorer les liens possibles\nentre les entreprises d'IA,\nles établissements de recherche\net les besoins\nde coopération internationale\nafin de soutenir\nla démonstration technologique,\nl'entrepreneuriat\net l'innovation industrielle.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n06. Intelligence artificielle responsable\n</h3>\n\n<p>\nPromouvoir la prise en compte\nde la protection de la vie privée,\nde la sécurité,\nde l'équité,\ndes droits humains\net de la responsabilité\ndans le développement\net l'utilisation\ndes technologies d'intelligence artificielle.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- DOMAINES DE COOPÉRATION -->\n\n<section>\n\n<h2>\n4. Domaines prioritaires de coopération internationale\n</h2>\n\n<p>\nL'initiative du Centre mondial de l'IA\nvise à explorer des possibilités\nde coopération dans les domaines\ncorrespondant aux missions\net aux compétences\ndes organisations internationales\net des institutions spécialisées.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nSanté publique\n</h3>\n\n<p>\nPrévention des maladies,\nréponse aux maladies infectieuses,\nanalyse des informations sanitaires\net renforcement\ndes capacités de santé publique.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nAlimentation et agriculture\n</h3>\n\n<p>\nSécurité alimentaire,\nproductivité agricole,\nadaptation au changement climatique\net agriculture durable.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nClimat et environnement\n</h3>\n\n<p>\nAction climatique,\nanalyse des données environnementales,\nprotection des écosystèmes\net développement durable.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nRisques de catastrophe et sécurité\n</h3>\n\n<p>\nÉvaluation des risques,\nsystèmes d'alerte précoce,\ninterventions d'urgence\net réduction\ndes conséquences des catastrophes.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nRéfugiés et migrations\n</h3>\n\n<p>\nAssistance humanitaire,\ninformations relatives aux migrations,\nprotection des populations vulnérables\net coopération internationale.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nEmploi et éducation\n</h3>\n\n<p>\nAvenir de l'emploi,\nformation professionnelle,\naccessibilité de l'éducation\net réduction\ndes inégalités numériques.\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\nCes domaines représentent\ndes possibilités de coopération.\nIls ne signifient pas\nqu'une organisation internationale\na confirmé sa participation\nou approuvé des projets particuliers.\n</p>\n\n<a href=\"agencies.html?lang=fr\" class=\"button\">\nDécouvrir les neuf organisations internationales →\n</a>\n\n</section>\n\n\u003c!-- GOYANG -->\n\n<section>\n\n<h2>\n5. Le Centre mondial de l'IA et la ville spéciale de Goyang\n</h2>\n\n<p>\nLa ville spéciale de Goyang\nest située dans la province de Gyeonggi,\nau sein de la région métropolitaine de Séoul,\nen République de Corée.\n</p>\n\n<p>\nLa ville bénéficie\nd'une bonne accessibilité métropolitaine,\nd'infrastructures internationales\nde congrès et d'expositions,\nd'établissements de santé,\nd'équipements éducatifs et culturels\net d'un environnement urbain développé.\n</p>\n\n<p>\nCes ressources constituent\nune base favorable\npour explorer le potentiel de Goyang\nen tant que centre\nde coopération internationale\net d'intelligence artificielle\nau service de l'intérêt public.\n</p>\n\n<p>\nSi la coopération internationale\nse développe concrètement,\nde nouvelles possibilités\npourraient apparaître\ndans la recherche et le développement,\nles activités économiques,\nles services professionnels\net l'économie régionale.\n</p>\n\n<p>\nLes objectifs à long terme comprennent\nle développement des compétences\ndes jeunes,\nla création d'emplois de qualité,\nl'innovation technologique\ndes entreprises locales\net l'élargissement\ndes échanges internationaux.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nL'implantation du Centre mondial de l'IA proposé\nreprésente une stratégie potentielle\npour renforcer les perspectives\nde croissance future de Goyang,\nles possibilités d'emploi\net le développement économique régional.\n</strong>\n\n</div>\n\n<p>\nLes résultats économiques réels\ndépendraient de l'ampleur\nde la participation institutionnelle future,\nde la nature des activités de coopération\net des dispositifs opérationnels\nqui seraient finalement établis.\n</p>\n\n<a href=\"goyang.html?lang=fr\" class=\"button\">\nPourquoi choisir la ville spéciale de Goyang ? →\n</a>\n\n</section>\n\n\u003c!-- STRATÉGIE -->\n\n<section>\n\n<h2>\n6. Stratégie de développement proposée\n</h2>\n\n<p>\nLe Comité citoyen de promotion\ncherche à encourager\nla participation du public\net à associer les atouts urbains de Goyang\nà des propositions concrètes\nde politiques publiques\npour l'initiative du Centre mondial de l'IA.\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\nSensibilisation et participation du public\n</h3>\n\n<p>\nRenforcer la compréhension du public\net la participation volontaire\ngrâce aux expressions de soutien en ligne\net aux activités de sensibilisation.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nRenforcement de l'attractivité territoriale\n</h3>\n\n<p>\nÉvaluer les avantages géographiques\nde Goyang\net ses ressources\nde coopération internationale,\npuis élaborer\ndes propositions de politiques publiques\nconcrètes et fondées sur des données probantes.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nCoopération institutionnelle\n</h3>\n\n<p>\nExplorer les possibilités\nde coopération\navec la province de Gyeonggi,\nla ville spéciale de Goyang,\nles autorités nationales compétentes\net d'autres institutions.\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\nFonctionnement durable\n</h3>\n\n<p>\nÉlaborer des propositions\nde politiques publiques\nconcernant les cadres\nde coopération à long terme\net les dispositifs\nde fonctionnement durable.\n</p>\n\n</article>\n\n</div>\n\n<a href=\"strategy.html?lang=fr\" class=\"button\">\nDécouvrir la stratégie du Centre mondial de l'IA →\n</a>\n\n</section>\n\n\u003c!-- PARTICIPATION CITOYENNE -->\n\n<section>\n\n<h2>\n7. Participation citoyenne et responsabilité partagée\n</h2>\n\n<p>\nLe Centre mondial de l'IA proposé\nne concerne pas uniquement\nles autorités publiques.\n</p>\n\n<p>\nIl représente également\nune occasion pour les citoyens,\nles communautés locales,\nles universités,\nles établissements de recherche,\nles entreprises\net les professionnels\nde contribuer aux discussions\nsur l'avenir de Goyang.\n</p>\n\n<p>\nLe Comité citoyen de promotion\nencourage la participation volontaire\ndu public à cette initiative.\n</p>\n\n<p>\nLes activités comprennent\nles expressions de soutien en ligne,\nl'inscription au Comité,\nl'adhésion en tant que membre de soutien\net les campagnes\nde sensibilisation du public.\n</p>\n\n<a href=\"participate.html?lang=fr\" class=\"button\">\nCentre de participation citoyenne →\n</a>\n\n</section>\n\n\u003c!-- STATUT INSTITUTIONNEL -->\n\n<section>\n\n<h2>\n8. Statut institutionnel\n</h2>\n\n<p>\nLe Centre mondial de l'IA à Goyang\nest une initiative proposée\nsoutenue par le Comité citoyen de promotion.\n</p>\n\n<p>\nLes propositions du Comité\nne constituent pas\nune décision officielle\nrelative au choix d'un site,\nun projet gouvernemental approuvé\nou un engagement\nd'une organisation internationale.\n</p>\n\n<p>\nToute participation institutionnelle future,\ntout financement,\ntoute décision concernant le lieu d'implantation\net tout dispositif opérationnel\nnécessiteraient\ndes consultations appropriées\net des approbations formelles\ndes autorités compétentes.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nL'initiative vise à promouvoir\nune coopération internationale responsable,\nun dialogue constructif\nsur les politiques publiques\net une préparation concrète\naux possibilités futures.\n</strong>\n\n</div>\n\n</section>\n\n</main>\n\n\u003c!-- PIED DE PAGE -->\n\n<footer>\n\n<p>\n<strong>\nInitiative du Centre mondial de l'IA<br>\nVille spéciale de Goyang<br>\nProvince de Gyeonggi<br>\nRépublique de Corée\n</strong>\n</p>\n\n<p>\nComité citoyen de promotion\npour l'implantation\ndu Centre mondial de l'IA\ndans la ville spéciale de Goyang\n</p>\n\n<p>\nAvec les citoyens,\navec la province de Gyeonggi\net avec le monde.\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\">\nAccueil\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=it": "<!DOCTYPE html>\n<html lang=\"it\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nIl Polo Globale dell'Intelligenza Artificiale | Città Speciale di Goyang\n</title>\n\n<meta name=\"description\"\ncontent=\"Scopri il Polo Globale dell'IA proposto nella Città Speciale di Goyang, la sua visione, la cooperazione internazionale, la ricerca sull'intelligenza artificiale per il bene pubblico e il contributo alle sfide globali.\">\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.8;\n}\n\n.intro {\n  font-size: 18px;\n}\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .intro {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n}\n</style>\n</head>\n\n<body>\n\n<header>\n  <h1>Il Polo Globale dell'Intelligenza Artificiale</h1>\n\n  <p>\n    Una piattaforma proposta di cooperazione internazionale<br>\n    per affrontare le sfide globali attraverso l'IA\n  </p>\n\n  <div class=\"header-links\">\n    <a href=\"index.html?lang=it\" class=\"home-link\">\n      ← Home italiana\n    </a>\n  </div>\n</header>\n\n<main>\n\n\u003c!-- Visione -->\n\n<section>\n  <div class=\"slogan\">\n    Oltre la tecnologia dell'IA, verso il futuro dell'umanità.<br>\n    Un nuovo centro di cooperazione internazionale.<br>\n    Il Polo Globale dell'IA.\n  </div>\n</section>\n\n\u003c!-- Che cos'è il Polo Globale dell'IA? -->\n\n<section>\n  <h2>1. Che cos'è il Polo Globale dell'IA?</h2>\n\n  <div class=\"intro\">\n\n    <p>\n      Il Polo Globale dell'IA proposto\n      è concepito come una piattaforma\n      di cooperazione internazionale\n      in cui organizzazioni internazionali,\n      governi, università,\n      istituti di ricerca,\n      imprese e società civile\n      possano esplorare modalità\n      di utilizzo dell'intelligenza artificiale\n      per il bene comune.\n    </p>\n\n    <p>\n      L'intelligenza artificiale\n      è una tecnologia fondamentale\n      che sta trasformando\n      le industrie e le economie.\n      Possiede inoltre il potenziale\n      per contribuire ad affrontare\n      sfide globali quali\n      malattie, fame,\n      cambiamento climatico,\n      catastrofi naturali\n      e disuguaglianze educative.\n    </p>\n\n    <p>\n      L'iniziativa del Polo Globale dell'IA\n      mira a collegare queste possibilità\n      alla cooperazione internazionale,\n      alle politiche pubbliche,\n      alla ricerca e sviluppo\n      e alle applicazioni pratiche.\n    </p>\n\n  </div>\n\n  <div class=\"highlight\">\n    <strong>\n      Lo scopo principale del Polo Globale dell'IA\n      non è semplicemente riunire\n      organizzazioni internazionali\n      in un unico luogo,\n      ma promuovere la cooperazione internazionale\n      e la soluzione collettiva dei problemi\n      attraverso applicazioni responsabili\n      dell'intelligenza artificiale.\n    </strong>\n  </div>\n</section>\n\n\u003c!-- Perché è necessario -->\n\n<section>\n  <h2>2. Perché è necessario un Polo Globale dell'IA?</h2>\n\n  <p>\n    Molte delle sfide che l'umanità\n    deve affrontare\n    non possono essere risolte efficacemente\n    da un singolo Paese\n    o da una sola istituzione.\n  </p>\n\n  <p>\n    Le emergenze sanitarie,\n    l'insicurezza alimentare,\n    il cambiamento climatico,\n    la prevenzione e la gestione delle catastrofi,\n    gli sfollamenti forzati,\n    le migrazioni,\n    i cambiamenti del mercato del lavoro\n    e le disuguaglianze educative\n    richiedono cooperazione internazionale,\n    scambio di informazioni\n    e innovazione scientifica.\n  </p>\n\n  <p>\n    L'intelligenza artificiale\n    può sostenere l'analisi\n    di grandi quantità di informazioni,\n    contribuire all'individuazione\n    dei rischi emergenti\n    e assistere i processi decisionali\n    nelle politiche pubbliche\n    e nelle attività operative.\n  </p>\n\n  <p>\n    Tuttavia, trasformare\n    le capacità dell'IA\n    in benefici concreti per la collettività\n    richiede dati affidabili,\n    un'efficace cooperazione istituzionale,\n    garanzie etiche,\n    professionisti qualificati\n    e modelli operativi sostenibili.\n  </p>\n\n  <p>\n    Il Polo Globale dell'IA proposto\n    mira a riunire questi elementi\n    attraverso un quadro\n    di cooperazione internazionale.\n  </p>\n\n</section>\n\n\u003c!-- Funzioni -->\n\n<section>\n  <h2>3. Le sei funzioni fondamentali del Polo Globale dell'IA</h2>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>01. Piattaforma di cooperazione internazionale</h3>\n      <p>\n        Facilitare il dialogo,\n        lo scambio di informazioni\n        e le potenziali collaborazioni\n        tra organizzazioni internazionali,\n        governi,\n        istituti di ricerca\n        e imprese.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>02. Ricerca sull'IA per il bene pubblico</h3>\n      <p>\n        Esplorare la ricerca collaborativa\n        e lo sviluppo di applicazioni dell'IA\n        per affrontare sfide di interesse pubblico\n        nella sanità,\n        nella protezione ambientale,\n        nella resilienza alle catastrofi,\n        nell'istruzione\n        e in altri settori correlati.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>03. Progetti internazionali congiunti</h3>\n      <p>\n        Individuare opportunità\n        di ricerca collaborativa,\n        progetti pilota\n        e applicazioni pratiche,\n        collegando le esigenze internazionali\n        alle capacità tecnologiche locali.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>04. Sviluppo professionale</h3>\n      <p>\n        Esplorare opportunità\n        di istruzione,\n        formazione\n        e scambio professionale\n        per le persone che operano\n        all'intersezione tra IA\n        e cooperazione internazionale.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>05. Industria e imprenditorialità</h3>\n      <p>\n        Esplorare collegamenti\n        tra imprese del settore IA,\n        istituti di ricerca\n        ed esigenze di cooperazione internazionale\n        per sostenere\n        la sperimentazione tecnologica,\n        l'imprenditorialità\n        e l'innovazione industriale.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>06. Intelligenza artificiale responsabile</h3>\n      <p>\n        Promuovere l'attenzione\n        alla tutela della privacy,\n        alla sicurezza,\n        all'equità,\n        ai diritti umani\n        e alla responsabilità\n        nello sviluppo\n        e nell'utilizzo\n        delle tecnologie di IA.\n      </p>\n    </article>\n\n  </div>\n</section>\n\n\u003c!-- Ambiti di cooperazione -->\n\n<section>\n  <h2>4. Ambiti prioritari della cooperazione internazionale</h2>\n\n  <p>\n    L'iniziativa del Polo Globale dell'IA\n    mira a esplorare opportunità\n    di cooperazione nei settori\n    pertinenti ai mandati\n    e alle competenze\n    delle organizzazioni internazionali\n    e delle istituzioni specializzate.\n  </p>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>Salute pubblica</h3>\n      <p>\n        Prevenzione delle malattie,\n        risposta alle malattie infettive,\n        analisi delle informazioni sanitarie\n        e rafforzamento delle capacità\n        dei sistemi di sanità pubblica.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Alimentazione e agricoltura</h3>\n      <p>\n        Sicurezza alimentare,\n        produttività agricola,\n        adattamento climatico\n        e agricoltura sostenibile.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Clima e ambiente</h3>\n      <p>\n        Azione per il clima,\n        analisi dei dati ambientali,\n        protezione degli ecosistemi\n        e sviluppo sostenibile.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Rischi di catastrofi e sicurezza</h3>\n      <p>\n        Valutazione dei rischi,\n        sistemi di allerta precoce,\n        risposta alle emergenze\n        e riduzione degli impatti\n        delle catastrofi.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Rifugiati e migrazioni</h3>\n      <p>\n        Assistenza umanitaria,\n        informazioni relative alle migrazioni,\n        protezione delle popolazioni vulnerabili\n        e cooperazione internazionale.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Occupazione e istruzione</h3>\n      <p>\n        Futuro dell'occupazione,\n        formazione professionale,\n        accessibilità all'istruzione\n        e riduzione delle disuguaglianze digitali.\n      </p>\n    </article>\n\n  </div>\n\n  <p class=\"note\">\n    Questi ambiti rappresentano\n    possibili settori di cooperazione.\n    Non implicano la partecipazione confermata\n    di alcuna organizzazione internazionale\n    né l'approvazione di progetti specifici.\n  </p>\n\n  <a href=\"agencies.html?lang=it\" class=\"button\">\n    Esplora le nove organizzazioni internazionali\n  </a>\n</section>\n\n\u003c!-- Goyang -->\n\n<section>\n  <h2>5. Il Polo Globale dell'IA e la Città Speciale di Goyang</h2>\n\n  <p>\n    La Città Speciale di Goyang\n    si trova nella Provincia di Gyeonggi,\n    all'interno dell'area metropolitana di Seul,\n    nella Repubblica di Corea.\n  </p>\n\n  <p>\n    La città offre\n    accessibilità metropolitana,\n    infrastrutture congressuali internazionali,\n    istituzioni sanitarie,\n    strutture educative e culturali\n    e un ambiente urbano consolidato.\n  </p>\n\n  <p>\n    Queste risorse costituiscono\n    una base per esplorare\n    il potenziale di Goyang\n    come centro di cooperazione internazionale\n    e di applicazioni dell'IA\n    per il bene pubblico.\n  </p>\n\n  <p>\n    Se la cooperazione internazionale\n    dovesse concretamente ampliarsi,\n    potrebbero emergere nuove opportunità\n    nella ricerca e sviluppo,\n    nelle attività imprenditoriali,\n    nei servizi professionali\n    e nell'economia regionale.\n  </p>\n\n  <p>\n    Tra gli importanti obiettivi\n    di lungo periodo figurano\n    lo sviluppo professionale dei giovani,\n    l'occupazione di qualità,\n    l'innovazione tecnologica\n    delle imprese locali\n    e l'ampliamento degli scambi internazionali.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      L'insediamento del Polo Globale dell'IA proposto\n      rappresenta una potenziale strategia\n      per rafforzare le opportunità\n      di crescita futura di Goyang,\n      le prospettive occupazionali\n      e lo sviluppo economico regionale.\n    </strong>\n  </div>\n\n  <p>\n    I risultati economici effettivi\n    dipenderebbero dall'entità\n    della futura partecipazione istituzionale,\n    dalla natura delle attività di cooperazione\n    e dai modelli operativi\n    che saranno eventualmente adottati.\n  </p>\n\n  <a href=\"goyang.html?lang=it\" class=\"button\">\n    Perché la Città Speciale di Goyang?\n  </a>\n</section>\n\n\u003c!-- Strategia -->\n\n<section>\n  <h2>6. Strategia di sviluppo proposta</h2>\n\n  <p>\n    Il Comitato Civico Promotore\n    mira a incoraggiare\n    la partecipazione pubblica\n    e a collegare i punti di forza\n    urbani di Goyang\n    con proposte politiche concrete\n    per l'iniziativa del Polo Globale dell'IA.\n  </p>\n\n  <div class=\"grid\">\n\n    <article class=\"card\">\n      <h3>Consapevolezza e partecipazione pubblica</h3>\n      <p>\n        Ampliare la comprensione pubblica\n        e la partecipazione volontaria\n        attraverso manifestazioni di sostegno online\n        e attività di sensibilizzazione.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Rafforzamento della competitività territoriale</h3>\n      <p>\n        Valutare i vantaggi\n        della posizione di Goyang\n        e le risorse disponibili\n        per la cooperazione internazionale,\n        sviluppando proposte politiche\n        pratiche e basate su evidenze.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Cooperazione istituzionale</h3>\n      <p>\n        Esplorare possibili collaborazioni\n        con la Provincia di Gyeonggi,\n        la Città Speciale di Goyang,\n        le autorità nazionali competenti\n        e altre istituzioni.\n      </p>\n    </article>\n\n    <article class=\"card\">\n      <h3>Gestione sostenibile</h3>\n      <p>\n        Elaborare proposte politiche\n        relative a quadri\n        di cooperazione a lungo termine\n        e modelli operativi sostenibili.\n      </p>\n    </article>\n\n  </div>\n\n  <a href=\"strategy.html?lang=it\" class=\"button\">\n    Esplora la strategia del Polo Globale dell'IA\n  </a>\n</section>\n\n\u003c!-- Partecipazione -->\n\n<section>\n  <h2>7. Partecipazione dei cittadini e responsabilità condivisa</h2>\n\n  <p>\n    Il Polo Globale dell'IA proposto\n    non è una questione\n    che riguarda esclusivamente\n    le autorità pubbliche.\n  </p>\n\n  <p>\n    Rappresenta anche un'opportunità\n    per cittadini,\n    comunità locali,\n    università,\n    istituti di ricerca,\n    imprese\n    e professionisti\n    di contribuire al dibattito\n    sul futuro di Goyang.\n  </p>\n\n  <p>\n    Il Comitato Civico Promotore\n    incoraggia la partecipazione pubblica\n    volontaria all'iniziativa.\n  </p>\n\n  <p>\n    Le attività comprendono\n    manifestazioni di sostegno online,\n    registrazione al Comitato,\n    adesione come soci sostenitori\n    e campagne di sensibilizzazione pubblica.\n  </p>\n\n  <a href=\"participate.html?lang=it\" class=\"button\">\n    Centro di partecipazione dei cittadini\n  </a>\n</section>\n\n\u003c!-- Chiarimento istituzionale -->\n\n<section>\n  <h2>8. Stato istituzionale dell'iniziativa</h2>\n\n  <p>\n    Il Polo Globale dell'IA a Goyang\n    è un'iniziativa proposta\n    e sostenuta dal Comitato Civico Promotore.\n  </p>\n\n  <p>\n    Le proposte del Comitato\n    non costituiscono\n    una decisione ufficiale\n    sulla scelta della sede,\n    un progetto governativo approvato\n    o un impegno\n    da parte di alcuna organizzazione internazionale.\n  </p>\n\n  <p>\n    La futura partecipazione istituzionale,\n    i finanziamenti,\n    le decisioni relative alla sede\n    e i modelli operativi\n    richiederebbero consultazioni appropriate\n    e approvazioni formali\n    da parte delle autorità competenti.\n  </p>\n\n  <div class=\"highlight\">\n    <strong>\n      L'iniziativa mira a promuovere\n      una cooperazione internazionale responsabile,\n      un dialogo costruttivo sulle politiche\n      e una preparazione concreta\n      alle opportunità future.\n    </strong>\n  </div>\n</section>\n\n</main>\n\n<footer>\n  <p>\n    <strong>\n      Iniziativa per un Polo Globale dell'IA<br>\n      Città Speciale di Goyang,\n      Provincia di Gyeonggi,\n      Repubblica di Corea\n    </strong>\n  </p>\n\n  <p>\n    Comitato Civico Promotore\n    per l'insediamento del Polo Globale dell'IA\n    nella Città Speciale di Goyang\n  </p>\n\n  <p>\n    Con i cittadini, con la Provincia di Gyeonggi\n    e con il mondo.\n  </p>\n\n  <p>\n    <a href=\"index.html?lang=it\">\n      Home italiana\n    </a>\n  </p>\n</footer>\n\n</body>\n</html>\n",
  "lang=ja": "<!DOCTYPE html>\n<html lang=\"ja\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nグローバルAIハブについて | 高陽特例市\n</title>\n\n<meta name=\"description\"\ncontent=\"高陽特例市におけるグローバルAIハブ構想について紹介します。構想のビジョン、公益のためのAI研究、国際協力、6つの主要機能、重点協力分野、発展戦略、市民参加についてご案内します。\">\n\n<style>\n\n/* =====================================\n   基本設定\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    \"Noto Sans JP\",\n    \"Hiragino Kaku Gothic ProN\",\n    \"Yu Gothic\",\n    Meiryo,\n    Arial,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ヘッダー\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   メインコンテンツ\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   スローガン\n===================================== */\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.8;\n}\n\n.intro {\n  font-size: 18px;\n}\n\n/* =====================================\n   強調表示\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n/* =====================================\n   グリッド\n===================================== */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   ボタン\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   フッター\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   モバイル対応\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .intro {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ヘッダー\n===================================== -->\n\n<header>\n\n<h1>\nグローバルAIハブについて\n</h1>\n\n<p>\nAIを通じて地球規模の課題に取り組む<br>\n国際協力プラットフォーム構想\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=ja\" class=\"home-link\">\n  ← 日本語ホーム\n</a>\n\n<a href=\"hub.html\" class=\"home-link\" lang=\"ko\">\n  한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     ビジョン\n===================================== -->\n\n<section>\n\n<div class=\"slogan\">\nAI技術の先に、人類の未来へ。<br>\n国際協力の新たな拠点。<br>\nグローバルAIハブ。\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     1. グローバルAIハブとは？\n===================================== -->\n\n<section>\n\n<h2>\n1. グローバルAIハブとは？\n</h2>\n\n<div class=\"intro\">\n\n<p>\n構想中のグローバルAIハブは、\n国際機関、\n政府、\n大学、\n研究機関、\n企業、\n市民社会が連携し、\n公共の利益のために\n人工知能を活用する方法を\n探求する国際協力プラットフォームとして\n構想されています。\n</p>\n\n<p>\n人工知能は、\n産業や経済を変革する\n重要な技術です。\n</p>\n\n<p>\n同時に、\n疾病、\n飢餓、\n気候変動、\n災害、\n教育格差など、\n地球規模の課題解決に\n貢献する可能性も持っています。\n</p>\n\n<p>\nグローバルAIハブ構想は、\nこうした可能性を\n国際協力、\n公共政策、\n研究開発、\n実践的な活用へと\n結び付けることを目指しています。\n</p>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nグローバルAIハブの中心的な目的は、\n単に国際機関を\n一つの場所に集めることではありません。\n責任あるAIの活用を通じて、\n国際協力と共同の課題解決を\n促進することにあります。\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     2. なぜ必要なのか？\n===================================== -->\n\n<section>\n\n<h2>\n2. なぜグローバルAIハブが必要なのか？\n</h2>\n\n<p>\n人類が直面する多くの課題は、\n一つの国や機関だけでは\n効果的に解決することが\n困難です。\n</p>\n\n<p>\n公衆衛生上の緊急事態、\n食料不安、\n気候変動、\n災害の予防と対応、\n強制移動、\n移住、\n労働市場の変化、\n教育格差などの問題には、\n国際協力、\n情報交換、\n科学技術の革新が\n求められます。\n</p>\n\n<p>\nAIは、\n大量の情報分析、\n新たなリスクの早期発見、\n公共政策や実務における\n意思決定の支援に\n役立つ可能性があります。\n</p>\n\n<p>\nしかし、\nAIの能力を\n実際の公共的利益へと\n結び付けるためには、\n信頼できるデータ、\n効果的な機関間協力、\n倫理的な安全対策、\n専門人材、\n持続可能な運営体制が\n必要です。\n</p>\n\n<p>\n構想中のグローバルAIハブは、\n国際協力の枠組みを通じて、\nこれらの要素を\n結び付けることを目指しています。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     3. 6つの主要機能\n===================================== -->\n\n<section>\n\n<h2>\n3. グローバルAIハブの6つの主要機能\n</h2>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\n01. 国際協力プラットフォーム\n</h3>\n\n<p>\n国際機関、\n政府、\n研究機関、\n企業の間で、\n対話、\n情報交換、\n将来的な協力の可能性を\n促進します。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n02. 公益のためのAI研究\n</h3>\n\n<p>\n医療、\n環境保護、\n災害への対応力、\n教育などの分野で、\n公共的課題の解決に資する\nAI応用技術の\n共同研究開発を検討します。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n03. 国際共同プロジェクト\n</h3>\n\n<p>\n国際的なニーズと\n地域の技術力を結び付け、\n共同研究、\n実証事業、\n実践的な技術活用の\n機会を探ります。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n04. 専門人材の育成\n</h3>\n\n<p>\nAIと国際協力の\n双方に関わる人々を対象に、\n教育、\n研修、\n専門家交流の\n機会を検討します。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n05. 産業振興と起業支援\n</h3>\n\n<p>\nAI関連企業、\n研究機関、\n国際協力のニーズを\n結び付ける可能性を探り、\n技術実証、\n起業、\n産業イノベーションを\n支援する方策を検討します。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n06. 責任あるAI\n</h3>\n\n<p>\nAI技術の開発と利用において、\nプライバシー、\n安全性、\n公平性、\n人権、\n説明責任への配慮を\n促進します。\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     4. 国際協力の重点分野\n===================================== -->\n\n<section>\n\n<h2>\n4. 国際協力の重点分野\n</h2>\n\n<p>\nグローバルAIハブ構想では、\n国際機関や専門機関の\n使命と専門性に関連する分野で、\n協力の可能性を探ります。\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\n公衆衛生\n</h3>\n\n<p>\n疾病予防、\n感染症への対応、\n保健医療情報の分析、\n公衆衛生能力の強化。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n食料・農業\n</h3>\n\n<p>\n食料安全保障、\n農業生産性、\n気候変動への適応、\n持続可能な農業。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n気候・環境\n</h3>\n\n<p>\n気候変動対策、\n環境データ分析、\n生態系保護、\n持続可能な開発。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n災害リスク・安全\n</h3>\n\n<p>\n災害リスク評価、\n早期警報システム、\n緊急対応、\n災害被害の軽減。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n難民・移住\n</h3>\n\n<p>\n人道支援、\n移住関連情報、\n脆弱な立場にある人々の保護、\n国際協力。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n雇用・教育\n</h3>\n\n<p>\n将来の雇用、\n職業訓練、\n教育へのアクセス改善、\nデジタル格差の縮小。\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\nこれらは将来的な協力の可能性がある\n分野を示したものです。\n特定の国際機関の参加や\n個別事業の承認が\n確定していることを\n意味するものではありません。\n</p>\n\n<a href=\"agencies.html?lang=ja\" class=\"button\">\n9つの国際機関について詳しく見る\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     5. 高陽特例市\n===================================== -->\n\n<section>\n\n<h2>\n5. グローバルAIハブと高陽特例市\n</h2>\n\n<p>\n高陽特例市は、\n大韓民国・京畿道に位置し、\nソウル首都圏に属する都市です。\n</p>\n\n<p>\n高陽特例市は、\n首都圏へのアクセス、\n国際展示・コンベンション施設、\n医療機関、\n教育・文化施設、\n整備された都市環境などを\n備えています。\n</p>\n\n<p>\nこれらの資産は、\n高陽特例市が\n公益のためのAIと\n国際協力の拠点となる可能性を\n検討するための基盤となります。\n</p>\n\n<p>\n国際協力が実際に拡大すれば、\n研究開発、\n企業活動、\n専門サービス、\n地域経済などの分野で、\n新たな機会が生まれる\n可能性があります。\n</p>\n\n<p>\n重要な長期目標には、\n若者の専門能力開発、\n質の高い雇用の創出、\n地域企業の技術革新、\n国際交流の拡大などが\n含まれます。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n構想中のグローバルAIハブの誘致は、\n高陽特例市の\n将来的な成長機会、\n雇用の可能性、\n地域経済の発展を\n強化するための\n一つの潜在的な戦略です。\n</strong>\n\n</div>\n\n<p>\n実際の経済的成果は、\n将来の機関参加の規模、\n協力活動の内容、\n最終的に整備される\n運営体制などによって\n異なります。\n</p>\n\n<a href=\"goyang.html?lang=ja\" class=\"button\">\nなぜ高陽特例市なのか？\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     6. 発展戦略\n===================================== -->\n\n<section>\n\n<h2>\n6. 誘致・発展戦略\n</h2>\n\n<p>\n市民推進委員会は、\n市民参加を促進するとともに、\n高陽特例市の都市としての強みを\nグローバルAIハブ構想に関する\n実践的な政策提案へと\n結び付けることを目指しています。\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\n市民の理解と参加の促進\n</h3>\n\n<p>\nオンラインでの支持表明や\n広報活動を通じて、\n市民の理解と\n自発的な参加を広げます。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n立地競争力の強化\n</h3>\n\n<p>\n高陽特例市の立地上の優位性と\n国際協力に活用できる資源を評価し、\n実践的かつ根拠に基づく\n政策提案を策定します。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n関係機関との協力\n</h3>\n\n<p>\n京畿道、\n高陽特例市、\n関係する中央政府機関、\nその他の機関との\n協力の可能性を探ります。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n持続可能な運営\n</h3>\n\n<p>\n長期的な協力体制と\n持続可能な運営の仕組みに関する\n政策提案を検討します。\n</p>\n\n</article>\n\n</div>\n\n<a href=\"strategy.html?lang=ja\" class=\"button\">\nグローバルAIハブ戦略について\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     7. 市民参加\n===================================== -->\n\n<section>\n\n<h2>\n7. 市民参加と共同の責任\n</h2>\n\n<p>\n構想中のグローバルAIハブは、\n行政機関だけの課題ではありません。\n</p>\n\n<p>\n市民、\n地域社会、\n大学、\n研究機関、\n企業、\n専門家が、\n高陽特例市の将来について\n議論し、\n貢献する機会でもあります。\n</p>\n\n<p>\n市民推進委員会は、\n本構想への自発的な市民参加を\n奨励しています。\n</p>\n\n<p>\n主な活動には、\nオンラインでの支持表明、\n委員会への登録、\n賛助会員としての参加、\n広報活動などがあります。\n</p>\n\n<a href=\"participate.html?lang=ja\" class=\"button\">\n市民参加センター\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. 制度的位置づけ\n===================================== -->\n\n<section>\n\n<h2>\n8. 構想の制度的位置づけ\n</h2>\n\n<p>\n高陽特例市における\nグローバルAIハブは、\n市民推進委員会が支持する\n提案段階の構想です。\n</p>\n\n<p>\n委員会による提案は、\n正式な立地選定の決定、\n政府による承認済み事業、\nまたは国際機関による\n参加の確約を意味するものではありません。\n</p>\n\n<p>\n将来の国際機関の参加、\n資金調達、\n立地の決定、\n運営体制の整備には、\n関係当局との適切な協議と\n正式な承認が必要です。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n本構想は、\n責任ある国際協力、\n建設的な政策対話、\n将来の機会に向けた\n実践的な準備を\n促進することを目指しています。\n</strong>\n\n</div>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     フッター\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nグローバルAIハブ構想<br>\n大韓民国・京畿道 高陽特例市\n</strong>\n</p>\n\n<p>\n高陽特例市グローバルAIハブ誘致<br>\n市民推進委員会\n</p>\n\n<p>\n市民とともに、<br>\n京畿道とともに、<br>\n世界とともに。\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ja\">\n日本語ホーム\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"hub.html\" lang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=ru": "<!DOCTYPE html>\n<html lang=\"ru\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nО Глобальном центре ИИ | Особый город Коян\n</title>\n\n<meta\n  name=\"description\"\n  content=\"Узнайте о предлагаемом Глобальном центре искусственного интеллекта в особом городе Коян, его концепции, международном сотрудничестве, применении ИИ в общественных интересах и возможностях решения глобальных проблем.\"\n>\n\n<style>\n\n/* =====================================\n   ОСНОВНЫЕ НАСТРОЙКИ\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n\n  font-family:\n    Arial,\n    Helvetica,\n    sans-serif;\n\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ШАПКА САЙТА\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   ОСНОВНОЕ СОДЕРЖИМОЕ\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   СЛОГАН\n===================================== */\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.8;\n}\n\n/* =====================================\n   ВВЕДЕНИЕ\n===================================== */\n\n.intro {\n  font-size: 18px;\n}\n\n/* =====================================\n   ВЫДЕЛЕННЫЕ БЛОКИ\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n/* =====================================\n   СЕТКА КАРТОЧЕК\n===================================== */\n\n.grid {\n  display: grid;\n\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   КНОПКИ\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   ПРИМЕЧАНИЯ\n===================================== */\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   ПОДВАЛ САЙТА\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   МОБИЛЬНАЯ ВЕРСИЯ\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .intro {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ШАПКА САЙТА\n===================================== -->\n\n<header>\n\n<h1>\nО Глобальном центре искусственного интеллекта\n</h1>\n\n<p>\nПредлагаемая международная платформа сотрудничества<br>\nдля решения глобальных проблем с помощью ИИ\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ru\"\n  class=\"home-link\"\n>\n  ← Главная страница\n</a>\n\n<a\n  href=\"hub.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n>\n  한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     ВИДЕНИЕ\n===================================== -->\n\n<section>\n\n<div class=\"slogan\">\n\nЗа пределами технологий ИИ — к будущему человечества.<br>\n\nНовый центр международного сотрудничества.<br>\n\nГлобальный центр искусственного интеллекта.\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     1. ЧТО ТАКОЕ ГЛОБАЛЬНЫЙ ЦЕНТР ИИ?\n===================================== -->\n\n<section>\n\n<h2>\n1. Что такое Глобальный центр ИИ?\n</h2>\n\n<div class=\"intro\">\n\n<p>\nПредлагаемый Глобальный центр\nискусственного интеллекта\nрассматривается как международная\nплатформа сотрудничества,\nна которой международные организации,\nправительства,\nуниверситеты,\nнаучно-исследовательские учреждения,\nпредприятия\nи гражданское общество\nсмогут изучать возможности\nиспользования искусственного интеллекта\nна благо общества.\n</p>\n\n<p>\nИскусственный интеллект —\nодна из ключевых технологий,\nпреобразующих промышленность\nи экономику.\n</p>\n\n<p>\nВ то же время он обладает\nпотенциалом для содействия\nрешению глобальных проблем,\nвключая заболевания,\nголод,\nизменение климата,\nстихийные бедствия\nи неравенство в образовании.\n</p>\n\n<p>\nИнициатива создания\nГлобального центра ИИ\nнаправлена на объединение\nэтих возможностей\nс международным сотрудничеством,\nгосударственной политикой,\nнаучными исследованиями,\nразработками\nи практическим применением технологий.\n</p>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nГлавная цель Глобального центра ИИ\nзаключается не просто\nв объединении международных организаций\nв одном месте,\nа в содействии международному\nсотрудничеству\nи совместному решению проблем\nпосредством ответственного\nприменения искусственного интеллекта.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     2. ПОЧЕМУ НЕОБХОДИМ ГЛОБАЛЬНЫЙ ЦЕНТР ИИ?\n===================================== -->\n\n<section>\n\n<h2>\n2. Почему необходим Глобальный центр ИИ?\n</h2>\n\n<p>\nМногие проблемы,\nс которыми сталкивается человечество,\nневозможно эффективно решить\nусилиями одной страны\nили отдельного учреждения.\n</p>\n\n<p>\nЧрезвычайные ситуации\nв области общественного здравоохранения,\nпродовольственная нестабильность,\nизменение климата,\nпредупреждение стихийных бедствий\nи реагирование на них,\nвынужденное перемещение населения,\nмиграция,\nизменения на рынке труда\nи неравенство в образовании\nтребуют международного сотрудничества,\nобмена информацией\nи научных инноваций.\n</p>\n\n<p>\nИскусственный интеллект\nможет способствовать анализу\nбольших объёмов информации,\nвыявлению возникающих рисков\nи поддержке принятия решений\nв государственной политике\nи практической деятельности.\n</p>\n\n<p>\nОднако для превращения\nтехнологических возможностей ИИ\nв реальные общественные преимущества\nнеобходимы надёжные данные,\nэффективное институциональное\nсотрудничество,\nэтические гарантии,\nквалифицированные специалисты\nи устойчивые механизмы деятельности.\n</p>\n\n<p>\nПредлагаемый Глобальный центр ИИ\nстремится объединить эти элементы\nв рамках международного\nсотрудничества.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     3. ШЕСТЬ ОСНОВНЫХ ФУНКЦИЙ\n===================================== -->\n\n<section>\n\n<h2>\n3. Шесть основных функций Глобального центра ИИ\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- 01 -->\n\n<article class=\"card\">\n\n<h3>\n01. Платформа международного сотрудничества\n</h3>\n\n<p>\nСодействие диалогу,\nобмену информацией\nи потенциальному сотрудничеству\nмежду международными организациями,\nправительствами,\nнаучно-исследовательскими учреждениями\nи предприятиями.\n</p>\n\n</article>\n\n\u003c!-- 02 -->\n\n<article class=\"card\">\n\n<h3>\n02. Исследования ИИ в общественных интересах\n</h3>\n\n<p>\nИзучение возможностей\nсовместных исследований\nи разработки приложений ИИ\nдля решения общественно значимых задач\nв области здравоохранения,\nохраны окружающей среды,\nустойчивости к стихийным бедствиям,\nобразования\nи смежных направлений.\n</p>\n\n</article>\n\n\u003c!-- 03 -->\n\n<article class=\"card\">\n\n<h3>\n03. Международные совместные проекты\n</h3>\n\n<p>\nВыявление возможностей\nдля совместных исследований,\nпилотных проектов\nи практического применения технологий\nпутём объединения\nмеждународных потребностей\nс местным технологическим потенциалом.\n</p>\n\n</article>\n\n\u003c!-- 04 -->\n\n<article class=\"card\">\n\n<h3>\n04. Подготовка и развитие специалистов\n</h3>\n\n<p>\nИзучение возможностей\nобразования,\nпрофессиональной подготовки\nи обмена опытом\nдля специалистов,\nработающих на пересечении\nискусственного интеллекта\nи международного сотрудничества.\n</p>\n\n</article>\n\n\u003c!-- 05 -->\n\n<article class=\"card\">\n\n<h3>\n05. Промышленность и предпринимательство\n</h3>\n\n<p>\nРазвитие потенциальных связей\nмежду предприятиями в сфере ИИ,\nнаучно-исследовательскими учреждениями\nи международными потребностями\nдля поддержки демонстрации технологий,\nпредпринимательства\nи промышленных инноваций.\n</p>\n\n</article>\n\n\u003c!-- 06 -->\n\n<article class=\"card\">\n\n<h3>\n06. Ответственный искусственный интеллект\n</h3>\n\n<p>\nСодействие учёту вопросов\nконфиденциальности,\nбезопасности,\nсправедливости,\nправ человека\nи подотчётности\nпри разработке\nи использовании технологий ИИ.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     4. ПРИОРИТЕТНЫЕ НАПРАВЛЕНИЯ\n===================================== -->\n\n<section>\n\n<h2>\n4. Приоритетные направления международного сотрудничества\n</h2>\n\n<p>\nИнициатива Глобального центра ИИ\nнаправлена на изучение\nвозможностей сотрудничества\nв областях,\nсоответствующих мандатам\nи компетенциям международных организаций\nи специализированных учреждений.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- ЗДРАВООХРАНЕНИЕ -->\n\n<article class=\"card\">\n\n<h3>\nОбщественное здравоохранение\n</h3>\n\n<p>\nПрофилактика заболеваний,\nреагирование на инфекционные болезни,\nанализ медицинской информации\nи укрепление потенциала\nобщественного здравоохранения.\n</p>\n\n</article>\n\n\u003c!-- ПРОДОВОЛЬСТВИЕ -->\n\n<article class=\"card\">\n\n<h3>\nПродовольствие и сельское хозяйство\n</h3>\n\n<p>\nПродовольственная безопасность,\nповышение производительности\nсельского хозяйства,\nадаптация к изменению климата\nи устойчивое сельское хозяйство.\n</p>\n\n</article>\n\n\u003c!-- КЛИМАТ -->\n\n<article class=\"card\">\n\n<h3>\nКлимат и окружающая среда\n</h3>\n\n<p>\nБорьба с изменением климата,\nанализ экологических данных,\nзащита экосистем\nи устойчивое развитие.\n</p>\n\n</article>\n\n\u003c!-- БЕДСТВИЯ -->\n\n<article class=\"card\">\n\n<h3>\nСнижение риска бедствий и безопасность\n</h3>\n\n<p>\nОценка риска стихийных бедствий,\nсистемы раннего предупреждения,\nреагирование на чрезвычайные ситуации\nи снижение последствий бедствий.\n</p>\n\n</article>\n\n\u003c!-- МИГРАЦИЯ -->\n\n<article class=\"card\">\n\n<h3>\nБеженцы и миграция\n</h3>\n\n<p>\nГуманитарная помощь,\nинформация по вопросам миграции,\nзащита уязвимых групп населения\nи международное сотрудничество.\n</p>\n\n</article>\n\n\u003c!-- ОБРАЗОВАНИЕ -->\n\n<article class=\"card\">\n\n<h3>\nЗанятость и образование\n</h3>\n\n<p>\nБудущее занятости,\nпрофессиональная подготовка,\nдоступность образования\nи сокращение цифрового неравенства.\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\nУказанные направления\nпредставляют собой\nпотенциальные области сотрудничества.\nОни не означают\nподтверждённого участия\nкакой-либо международной организации\nили утверждения конкретных проектов.\n</p>\n\n<a\n  href=\"agencies.html?lang=ru\"\n  class=\"button\"\n>\n  Узнать о девяти международных организациях\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     5. ГОРОД КОЯН\n===================================== -->\n\n<section>\n\n<h2>\n5. Глобальный центр ИИ и особый город Коян\n</h2>\n\n<p>\nОсобый город Коян расположен\nв провинции Кёнгидо,\nв столичном регионе Сеула\nРеспублики Корея.\n</p>\n\n<p>\nГород располагает\nудобным доступом к инфраструктуре\nстоличного региона,\nмеждународными конгрессными объектами,\nмедицинскими учреждениями,\nобразовательными\nи культурными объектами,\nа также развитой городской средой.\n</p>\n\n<p>\nЭти преимущества\nсоздают основу для изучения\nпотенциала Кояна\nкак центра международного\nсотрудничества\nи применения ИИ\nв общественных интересах.\n</p>\n\n<p>\nЕсли международное сотрудничество\nполучит практическое развитие,\nмогут появиться новые возможности\nв области исследований и разработок,\nпредпринимательской деятельности,\nпрофессиональных услуг\nи региональной экономики.\n</p>\n\n<p>\nК важным долгосрочным целям относятся\nпрофессиональное развитие молодёжи,\nсоздание качественных рабочих мест,\nтехнологические инновации\nместных предприятий\nи расширение международного обмена.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nПривлечение предлагаемого\nГлобального центра ИИ\nможет стать одним\nиз стратегических направлений\nукрепления перспектив\nэкономического роста Кояна,\nрасширения возможностей занятости\nи регионального развития.\n</strong>\n\n</div>\n\n<p>\nФактические экономические результаты\nбудут зависеть\nот масштаба будущего\nинституционального участия,\nхарактера совместной деятельности\nи окончательно согласованных\nмеханизмов функционирования.\n</p>\n\n<a\n  href=\"goyang.html?lang=ru\"\n  class=\"button\"\n>\n  Почему особый город Коян?\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     6. СТРАТЕГИЯ РАЗВИТИЯ\n===================================== -->\n\n<section>\n\n<h2>\n6. Предлагаемая стратегия развития\n</h2>\n\n<p>\nГражданский комитет содействия\nстремится поощрять участие граждан\nи объединять преимущества\nгородской инфраструктуры Кояна\nс практическими предложениями\nв области государственной политики\nпо инициативе Глобального центра ИИ.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- ОБЩЕСТВЕННОЕ УЧАСТИЕ -->\n\n<article class=\"card\">\n\n<h3>\nИнформирование и участие общественности\n</h3>\n\n<p>\nРасширение общественного понимания\nи добровольного участия\nпосредством онлайн-выражения поддержки\nи информационно-просветительской деятельности.\n</p>\n\n</article>\n\n\u003c!-- КОНКУРЕНТОСПОСОБНОСТЬ -->\n\n<article class=\"card\">\n\n<h3>\nУкрепление конкурентоспособности территории\n</h3>\n\n<p>\nОценка географических преимуществ Кояна\nи ресурсов международного сотрудничества,\nа также разработка практических\nполитических предложений,\nоснованных на фактических данных.\n</p>\n\n</article>\n\n\u003c!-- ИНСТИТУЦИОНАЛЬНОЕ СОТРУДНИЧЕСТВО -->\n\n<article class=\"card\">\n\n<h3>\nИнституциональное сотрудничество\n</h3>\n\n<p>\nИзучение возможностей сотрудничества\nс провинцией Кёнгидо,\nособым городом Коян,\nсоответствующими национальными органами\nи другими учреждениями.\n</p>\n\n</article>\n\n\u003c!-- УСТОЙЧИВАЯ ДЕЯТЕЛЬНОСТЬ -->\n\n<article class=\"card\">\n\n<h3>\nУстойчивые механизмы деятельности\n</h3>\n\n<p>\nРазработка политических предложений\nотносительно долгосрочных\nрамок сотрудничества\nи устойчивых механизмов\nфункционирования.\n</p>\n\n</article>\n\n</div>\n\n<a\n  href=\"strategy.html?lang=ru\"\n  class=\"button\"\n>\n  Подробнее о стратегии Глобального центра ИИ\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     7. УЧАСТИЕ ГРАЖДАН\n===================================== -->\n\n<section>\n\n<h2>\n7. Участие граждан и совместная ответственность\n</h2>\n\n<p>\nПредлагаемый Глобальный центр ИИ\nне является вопросом,\nкасающимся исключительно\nорганов государственной власти.\n</p>\n\n<p>\nОн также предоставляет возможность\nгражданам,\nместным сообществам,\nуниверситетам,\nнаучно-исследовательским учреждениям,\nпредприятиям\nи специалистам\nучаствовать в обсуждении\nбудущего Кояна.\n</p>\n\n<p>\nГражданский комитет содействия\nпоощряет добровольное участие\nобщественности в инициативе.\n</p>\n\n<p>\nОсновные направления деятельности\nвключают выражение поддержки\nчерез интернет,\nрегистрацию в Комитете,\nучастие в программе поддерживающего членства\nи информационные кампании.\n</p>\n\n<a\n  href=\"participate.html?lang=ru\"\n  class=\"button\"\n>\n  Центр участия граждан\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. ИНСТИТУЦИОНАЛЬНЫЙ СТАТУС\n===================================== -->\n\n<section>\n\n<h2>\n8. Институциональный статус инициативы\n</h2>\n\n<p>\nСоздание Глобального центра ИИ\nв особом городе Коян\nявляется предлагаемой инициативой,\nподдерживаемой\nГражданским комитетом содействия.\n</p>\n\n<p>\nПредложения Комитета\nне представляют собой\nофициального решения\nо выборе места размещения,\nутверждённого государственного проекта\nили обязательства\nкакой-либо международной организации.\n</p>\n\n<p>\nБудущее участие учреждений,\nфинансирование,\nрешения о размещении\nи механизмы деятельности\nпотребуют соответствующих консультаций\nи официального одобрения\nуполномоченными органами.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nИнициатива направлена\nна содействие ответственному\nмеждународному сотрудничеству,\nконструктивному политическому диалогу\nи практической подготовке\nк будущим возможностям.\n</strong>\n\n</div>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     ПОДВАЛ САЙТА\n===================================== -->\n\n<footer>\n\n<p>\n\n<strong>\nИнициатива «Глобальный центр ИИ»<br>\nОсобый город Коян,<br>\nПровинция Кёнгидо,<br>\nРеспублика Корея\n</strong>\n\n</p>\n\n<p>\nГражданский комитет содействия\nразмещению Глобального центра ИИ\nв особом городе Коян\n</p>\n\n<p>\nВместе с гражданами,\nвместе с провинцией Кёнгидо\nи вместе со всем миром.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ru\">\nГлавная страница\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"hub.html\" lang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=zh": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\n关于全球人工智能枢纽 | 高阳特例市\n</title>\n\n<meta\n  name=\"description\"\n  content=\"了解韩国京畿道高阳特例市拟议中的全球人工智能枢纽，包括其发展愿景、公共利益人工智能合作、国际伙伴关系，以及应对全球性挑战的潜在贡献。\"\n>\n\n<style>\n\n/* =====================================\n   基本设置\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    \"Microsoft YaHei\",\n    \"PingFang SC\",\n    \"Noto Sans SC\",\n    Arial,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   页眉\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   主要内容\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   宣传标语\n===================================== */\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.8;\n}\n\n.intro {\n  font-size: 18px;\n}\n\n/* =====================================\n   重点信息\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n/* =====================================\n   网格与卡片\n===================================== */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(250px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   按钮\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   页脚\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   移动设备\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .intro {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     页眉\n===================================== -->\n\n<header>\n\n<h1>\n关于全球人工智能枢纽\n</h1>\n\n<p>\n利用人工智能应对全球性挑战的<br>\n拟议国际合作平台\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=zh\"\n  class=\"home-link\"\n>\n  ← 中文首页\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     宣传标语\n===================================== -->\n\n<section>\n\n<div class=\"slogan\">\n\n超越人工智能技术，迈向人类的未来。<br>\n\n国际合作的新中心。<br>\n\n全球人工智能枢纽。\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     1. 什么是全球人工智能枢纽？\n===================================== -->\n\n<section>\n\n<h2>\n1. 什么是全球人工智能枢纽？\n</h2>\n\n<div class=\"intro\">\n\n<p>\n拟议中的全球人工智能枢纽\n旨在建设一个国际合作平台，\n使国际组织、政府、\n大学、科研机构、\n企业和民间社会\n能够共同探索如何利用人工智能\n促进公共利益。\n</p>\n\n<p>\n人工智能是推动产业和经济转型\n的重要技术。\n与此同时，\n人工智能也有潜力\n帮助应对疾病、饥饿、\n气候变化、自然灾害\n以及教育不平等等全球性挑战。\n</p>\n\n<p>\n全球人工智能枢纽倡议\n希望将这些技术潜力\n与国际合作、\n公共政策、\n科学研究与技术开发\n以及实际应用相结合。\n</p>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n全球人工智能枢纽的核心目标，\n并不仅仅是将国际组织\n集中在同一个地点，\n而是通过负责任地应用人工智能，\n促进国际合作，\n共同探索解决全球性问题的方法。\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     2. 为什么需要全球人工智能枢纽？\n===================================== -->\n\n<section>\n\n<h2>\n2. 为什么需要全球人工智能枢纽？\n</h2>\n\n<p>\n人类面临的许多挑战，\n无法仅依靠某一个国家\n或某一个机构独立解决。\n</p>\n\n<p>\n公共卫生紧急事件、\n粮食安全问题、\n气候变化、\n灾害预防与应对、\n被迫流离失所、\n人口迁移、\n劳动力市场变化\n以及教育不平等，\n都需要国际合作、\n信息交流\n和科学技术创新。\n</p>\n\n<p>\n人工智能能够支持\n大规模信息分析，\n帮助识别新出现的风险，\n并为公共政策制定\n和实际业务决策提供辅助。\n</p>\n\n<p>\n然而，\n要将人工智能的技术能力\n转化为真正的公共利益，\n还需要可靠的数据、\n有效的机构合作、\n伦理保障措施、\n具备专业能力的人才，\n以及可持续的运营机制。\n</p>\n\n<p>\n拟议中的全球人工智能枢纽\n希望通过国际合作框架，\n将这些关键要素连接起来。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     3. 六大核心功能\n===================================== -->\n\n<section>\n\n<h2>\n3. 全球人工智能枢纽的六大核心功能\n</h2>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\n01. 国际合作平台\n</h3>\n\n<p>\n促进国际组织、\n政府、科研机构\n和企业之间的对话、\n信息交流\n以及潜在合作。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n02. 公共利益人工智能研究\n</h3>\n\n<p>\n探索人工智能应用的\n联合研究与开发，\n以应对医疗卫生、\n环境保护、\n灾害应对能力、\n教育及其他相关领域的\n公共挑战。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n03. 国际联合项目\n</h3>\n\n<p>\n将国际社会的实际需求\n与当地技术能力相结合，\n探索联合研究、\n试点项目\n以及实际应用的合作机会。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n04. 专业人才培养\n</h3>\n\n<p>\n探索人工智能\n与国际合作交叉领域的\n教育、培训\n和专业交流机会，\n培养具备国际视野\n和技术能力的专业人才。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n05. 产业发展与创业创新\n</h3>\n\n<p>\n探索人工智能企业、\n科研机构\n与国际合作需求之间的联系，\n支持技术示范、\n创业活动\n以及产业创新。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n06. 负责任的人工智能\n</h3>\n\n<p>\n推动在人工智能技术的\n开发和使用过程中，\n充分考虑隐私保护、\n安全、公平、\n人权以及问责机制。\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     4. 国际合作重点领域\n===================================== -->\n\n<section>\n\n<h2>\n4. 国际合作重点领域\n</h2>\n\n<p>\n全球人工智能枢纽倡议\n希望探索与国际组织\n及专业机构的职责、\n专业知识和实际需求\n相关的合作领域。\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\n公共卫生\n</h3>\n\n<p>\n疾病预防、\n传染病应对、\n卫生信息分析\n以及公共卫生能力建设。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n粮食与农业\n</h3>\n\n<p>\n粮食安全、\n农业生产效率、\n气候适应\n以及可持续农业发展。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n气候与环境\n</h3>\n\n<p>\n气候行动、\n环境数据分析、\n生态系统保护\n以及可持续发展。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n灾害风险与安全\n</h3>\n\n<p>\n灾害风险评估、\n预警系统、\n紧急应对\n以及减少灾害造成的影响。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n难民与人口迁移\n</h3>\n\n<p>\n人道主义援助、\n人口迁移相关信息、\n弱势群体保护\n以及国际合作。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n就业与教育\n</h3>\n\n<p>\n未来就业、\n职业培训、\n教育可及性\n以及缩小数字鸿沟。\n</p>\n\n</article>\n\n</div>\n\n<p class=\"note\">\n上述领域属于潜在合作方向，\n并不意味着任何国际组织\n已经确认参与，\n也不意味着具体合作项目\n已经获得正式批准。\n</p>\n\n<a\n  href=\"agencies.html?lang=zh\"\n  class=\"button\"\n>\n  了解九个国际组织\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     5. 全球人工智能枢纽与高阳特例市\n===================================== -->\n\n<section>\n\n<h2>\n5. 全球人工智能枢纽与高阳特例市\n</h2>\n\n<p>\n高阳特例市位于\n大韩民国京畿道，\n属于首尔首都圈。\n</p>\n\n<p>\n高阳市拥有便捷的都市交通条件、\n国际会展基础设施、\n医疗机构、\n教育与文化设施，\n以及较为完善的城市环境。\n</p>\n\n<p>\n这些资源为探索高阳市\n作为公共利益人工智能\n和国际合作中心的潜力\n提供了良好的基础。\n</p>\n\n<p>\n如果国际合作在未来得到实际扩大，\n科研开发、\n企业活动、\n专业服务\n以及区域经济\n都有可能迎来新的发展机会。\n</p>\n\n<p>\n重要的长期目标包括：\n促进青年专业人才培养、\n创造高质量就业机会、\n推动当地企业技术创新，\n以及扩大国际交流。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n推动拟议中的全球人工智能枢纽\n落户高阳特例市，\n是一项具有潜力的发展战略，\n有望为高阳市未来的经济增长、\n就业机会\n以及区域经济发展\n创造新的可能性。\n</strong>\n\n</div>\n\n<p>\n实际经济成果\n将取决于未来参与机构的规模、\n合作活动的性质，\n以及最终建立的运营机制。\n</p>\n\n<a\n  href=\"goyang.html?lang=zh\"\n  class=\"button\"\n>\n  为什么选择高阳特例市？\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     6. 拟议的发展战略\n===================================== -->\n\n<section>\n\n<h2>\n6. 拟议的发展战略\n</h2>\n\n<p>\n市民推进委员会\n希望鼓励公众参与，\n并将高阳市的城市优势\n与全球人工智能枢纽倡议的\n实际政策建议相结合。\n</p>\n\n<div class=\"grid\">\n\n<article class=\"card\">\n\n<h3>\n提高公众认知与参与\n</h3>\n\n<p>\n通过线上支持活动\n和宣传推广，\n扩大公众对倡议的理解，\n鼓励市民自愿参与。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n增强选址竞争力\n</h3>\n\n<p>\n评估高阳市的区位优势\n及国际合作资源，\n制定切实可行、\n以事实和证据为基础的\n政策建议。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n机构合作\n</h3>\n\n<p>\n探索与京畿道、\n高阳特例市、\n韩国相关中央政府部门\n及其他机构\n开展合作的可能性。\n</p>\n\n</article>\n\n<article class=\"card\">\n\n<h3>\n可持续运营\n</h3>\n\n<p>\n围绕长期国际合作框架\n和可持续运营机制，\n制定相关政策建议。\n</p>\n\n</article>\n\n</div>\n\n<a\n  href=\"strategy.html?lang=zh\"\n  class=\"button\"\n>\n  了解全球人工智能枢纽发展战略\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     7. 市民参与与共同责任\n===================================== -->\n\n<section>\n\n<h2>\n7. 市民参与与共同责任\n</h2>\n\n<p>\n拟议中的全球人工智能枢纽\n并不仅仅是政府部门的事务。\n</p>\n\n<p>\n它也为市民、\n当地社区、\n大学、科研机构、\n企业和专业人士\n提供了共同讨论\n高阳市未来发展方向的机会。\n</p>\n\n<p>\n市民推进委员会\n鼓励公众自愿参与\n全球人工智能枢纽倡议。\n</p>\n\n<p>\n相关活动包括\n线上支持活动、\n推进委员会成员登记、\n支持会员加入\n以及公众宣传活动。\n</p>\n\n<a\n  href=\"participate.html?lang=zh\"\n  class=\"button\"\n>\n  市民参与中心\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     8. 项目的机构定位与现状\n===================================== -->\n\n<section>\n\n<h2>\n8. 项目的机构定位与现状\n</h2>\n\n<p>\n高阳特例市全球人工智能枢纽\n目前是一项由市民推进委员会\n支持和推动的拟议倡议。\n</p>\n\n<p>\n委员会提出的建议\n并不构成正式的选址决定、\n已经批准的政府项目，\n也不代表任何国际组织\n作出了参与承诺。\n</p>\n\n<p>\n未来国际组织的参与、\n资金安排、\n选址决定\n以及运营机制，\n均需要相关主管部门\n进行适当协商\n并履行正式审批程序。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n本倡议致力于推动\n负责任的国际合作、\n建设性的政策对话，\n并为未来可能出现的发展机会\n开展切实可行的准备工作。\n</strong>\n\n</div>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     页脚\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\n全球人工智能枢纽倡议<br>\n大韩民国京畿道<br>\n高阳特例市\n</strong>\n</p>\n\n<p>\n高阳特例市全球人工智能枢纽\n引进市民推进委员会\n</p>\n\n<p>\n与市民同行，<br>\n与京畿道同行，<br>\n与世界同行。\n</p>\n\n<p>\n<a href=\"index.html?lang=zh\">\n中文首页\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n"
}
</script>
