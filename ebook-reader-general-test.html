<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ==========================================
// 1. Supabase 연결
// ==========================================

const SUPABASE_URL =
  "https://gugkwqpvtwivqudkimvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id =>
  document.getElementById(id);

// ==========================================
// 2. 전자책 자료
// ==========================================

const params =
  new URLSearchParams(window.location.search);

const documentId =
  Number(params.get("document_id"));

// ==========================================
// 제192단계
// 공통 전자책 정보 초기화
// ==========================================

// 전자책 정보는 Supabase에서 조회
let book = null;

// 회원 열람 권한
let canReadBody = false;

async function loadTotalEbook() {
  const { data, error } = await supabase.rpc("get_total_ebook_info", {
    p_document_id: documentId
  });
  if (error) throw error;

  const info = Array.isArray(data) ? data[0] : data;
  const pages = Number(info?.total_pages);
  if (Number(info?.document_id) !== documentId ||
      typeof info?.title !== "string" || !info.title.trim() ||
      !Number.isSafeInteger(pages) || pages < 1) {
    throw new Error("전자책 정보 또는 페이지 수를 확인할 수 없습니다.");
  }

  return {
    title: info.title,
    pages,
    contents: info.contents,
    issueCode: info.issue_code,
    storageBucket: info.storage_bucket
  };
}

let currentPage = 0;
let totalPages = 0;
let pageLoading = false;

// ==========================================
// 3. 상태 메시지
// ==========================================

function showStatus(message, isError = false) {

  const box = $("status");

  box.hidden = false;

  box.className =
    isError ? "status error" : "status";

  box.textContent = message;

}

// ==========================================
// 4. 회원 인증
// ==========================================

async function checkMember() {

  const {
    data: userData,
    error: userError
  } = await supabase.auth.getUser();

  if (userError || !userData.user) {

    throw new Error(
      "로그인이 필요합니다. 회원 로그인 후 다시 접속해 주세요."
    );

  }

  const {
    data: profile,
    error: profileError
  } = await supabase
    .from("profiles")
    .select("approval_status, member_grade")
    .eq("id", userData.user.id)
    .single();

  if (profileError) {
    throw profileError;
  }

  if (profile.approval_status !== "approved") {

    throw new Error(
      "관리자 승인을 받은 회원만 전자책 전체본을 열람할 수 있습니다."
    );

  }

  const { data: isSuperAdmin, error: superError } =
    await supabase.rpc("is_super_admin");

  if (!superError && isSuperAdmin === true) return userData.user;

  if (profile.member_grade === "grade1") {
    const { data: isAdmin, error: adminError } = await supabase.rpc("is_admin");
    if (adminError) throw adminError;
    if (isAdmin === true) return userData.user;
  }

  if (superError) throw superError;
  throw new Error("승인된 1급회원 관리자 또는 최고관리자만 열람할 수 있습니다.");

}

// ==========================================
// 제190단계
// 전자책 열람기 성능 개선 통합본 v1.0
// ==========================================

// ------------------------------------------
// 1. 설정 및 상태
// ------------------------------------------

const EBOOK_CACHE_MAX_PAGES = 6;
const EBOOK_CACHE_MAX_BYTES = 30 * 1024 * 1024;

const ebookCache = new Map();
const ebookPending = new Map();
const ebookControllers = new Set();

let ebookCacheBytes = 0;
let ebookGeneration = 0;
let ebookNavigationId = 0;
let ebookRequestedPage = currentPage;
let ebookPreloadTimer = null;
let ebookDisplayedUrl = null;
let ebookAuthUserId = null;
let ebookAuthListener = null;

// ------------------------------------------
// 2. 기존 인증 기반 페이지 URL 요청
// ------------------------------------------

async function requestPage(pageNumber, signal) {

  if (!canReadBody) {
    throw new Error("전자책 본문 열람 권한이 없습니다.");
  }

  const { data: sessionData, error: sessionError } =
    await supabase.auth.getSession();

  if (sessionError || !sessionData.session?.access_token) {
    throw new Error("로그인 세션이 없습니다.");
  }

  const response = await fetch(
    SUPABASE_URL + "/functions/v1/knowledge-ebook-page-access",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + sessionData.session.access_token
      },
      body: JSON.stringify({
        document_id: documentId,
        page_number: pageNumber
      }),
      signal
    }
  );

  const result = await response.json();

  if (!response.ok || result.success !== true || !result.signed_url) {
    throw new Error(result.error || "페이지 접근에 실패했습니다.");
  }

  const url = new URL(result.signed_url);
  const bucket = book.storageBucket ?? "knowledge-private";

  if (
    url.protocol !== "https:" ||
    url.origin !== SUPABASE_URL ||
    typeof bucket !== "string" ||
    !/^[A-Za-z0-9_-]+$/.test(bucket) ||
    bucket === "knowledge-public" ||
    !url.pathname.startsWith("/storage/v1/object/sign/" + bucket + "/")
  ) {
    throw new Error("허용되지 않은 이미지 주소입니다.");
  }

  return {
    url: url.href,
    totalPages: Number(result.total_pages)
  };
}

// ------------------------------------------
// 3. 캐시 폐기
// ------------------------------------------

function clearEbookCache() {

  ebookGeneration++;
  ebookNavigationId++;

  clearTimeout(ebookPreloadTimer);
  ebookPreloadTimer = null;

  for (const controller of ebookControllers) {
    controller.abort();
  }
  ebookControllers.clear();

  const image = $("pageImage");
  image.hidden = true;
  image.removeAttribute("src");

  for (const entry of ebookCache.values()) {
    URL.revokeObjectURL(entry.url);
  }

  ebookCache.clear();
  ebookPending.clear();

  ebookCacheBytes = 0;
  ebookDisplayedUrl = null;
  ebookRequestedPage = 0;
  currentPage = 0;

  updatePageControls();
}

// ------------------------------------------
// 4. 캐시 조회
// ------------------------------------------

function getCachedEbookPage(page) {
  const entry = ebookCache.get(page);
  if (!entry) return null;

  ebookCache.delete(page);
  ebookCache.set(page, entry);
  return entry;
}

// ------------------------------------------
// 5. 캐시 용량 관리
// ------------------------------------------

function trimEbookCache(protectedPage = null) {

  while (
    ebookCache.size > EBOOK_CACHE_MAX_PAGES ||
    ebookCacheBytes > EBOOK_CACHE_MAX_BYTES
  ) {

    let removed = false;

    for (const [page, entry] of ebookCache) {

      if (
        page === currentPage ||
        page === ebookRequestedPage ||
        page === protectedPage ||
        entry.url === ebookDisplayedUrl
      ) {
        continue;
      }

      ebookCache.delete(page);
      ebookCacheBytes -= entry.bytes;
      URL.revokeObjectURL(entry.url);

      removed = true;
      break;
    }

    if (!removed) break;
  }
}

// ------------------------------------------
// 6. 페이지 다운로드
// ------------------------------------------

async function prepareEbookPage(page) {

  const cached = getCachedEbookPage(page);
  if (cached) return cached;

  if (ebookPending.has(page)) {
    return ebookPending.get(page);
  }

  const generation = ebookGeneration;
  const controller = new AbortController();
  ebookControllers.add(controller);

  const promise = (async () => {

    let objectUrl = null;

    try {

      const result = await requestPage(page, controller.signal);

      if (generation !== ebookGeneration || controller.signal.aborted) {
        throw new DOMException("요청 취소", "AbortError");
      }

      const response = await fetch(result.url, {
        signal: controller.signal,
        cache: "no-store",
        referrerPolicy: "no-referrer"
      });

      if (!response.ok) {
        throw new Error("이미지 다운로드 실패: " + response.status);
      }

      const blob = await response.blob();

      if (!blob.type.startsWith("image/")) {
        throw new Error("올바른 이미지 파일이 아닙니다.");
      }

      if (generation !== ebookGeneration || controller.signal.aborted) {
        throw new DOMException("요청 취소", "AbortError");
      }

      objectUrl = URL.createObjectURL(blob);

      const preview = new Image();
      preview.src = objectUrl;
      await preview.decode();

      if (generation !== ebookGeneration || controller.signal.aborted) {
        throw new DOMException("요청 취소", "AbortError");
      }

      const entry = {
        url: objectUrl,
        bytes: blob.size
      };

      ebookCache.set(page, entry);
      ebookCacheBytes += entry.bytes;

      objectUrl = null;

      trimEbookCache(page);

      return entry;

    } finally {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      ebookControllers.delete(controller);
    }

  })();

  ebookPending.set(page, promise);

  try {
    return await promise;
  } finally {
    if (ebookPending.get(page) === promise) {
      ebookPending.delete(page);
    }
  }
}

// ------------------------------------------
// 7. 사전 로딩
// ------------------------------------------

function preloadEbookPages(page) {

  clearTimeout(ebookPreloadTimer);

  const generation = ebookGeneration;

  ebookPreloadTimer = setTimeout(async () => {

    ebookPreloadTimer = null;

    const targets = [
      page + 1,
      page + 2,
      page - 1
    ].filter(n => n >= 1 && n <= totalPages);

    for (const target of targets) {

      if (generation !== ebookGeneration) return;
      if (ebookRequestedPage !== page) return;

      try {
        await prepareEbookPage(target);
      } catch (error) {
        console.debug("사전 로딩 실패:", target, error);
      }
    }

    trimEbookCache();

  }, 100);
}

// ------------------------------------------
// 8. 공통 전자책 표지
// ------------------------------------------

function getEbookCoverUrl() {

  if (!book) {
    throw new Error(
      "전자책 정보가 준비되지 않았습니다."
    );
  }

  const issueCode = book.issueCode;

  if (
    typeof issueCode !== "string" ||
    !/^[A-Za-z0-9_-]+$/.test(issueCode)
  ) {
    throw new Error(
      "전자책 표지 호수를 확인할 수 없습니다."
    );
  }

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    "knowledge-public/ebooks/covers/" +
    encodeURIComponent(issueCode) +
    ".webp"
  );

}

// ------------------------------------------
// 9. 페이지 표시
// ------------------------------------------

async function showPage(page) {

  const navigationId = ++ebookNavigationId;
  const generation = ebookGeneration;

  ebookRequestedPage = page;
  updatePageControls();

  showStatus(page === 0 ? "표지를 준비하고 있습니다." :
    page + "쪽을 준비하고 있습니다.");

  try {

    let url;

    if (page === 0) {
      url = getEbookCoverUrl();

      const preview = new Image();
      preview.referrerPolicy = "no-referrer";
      preview.src = url;
      await preview.decode();

    } else {
      const entry = await prepareEbookPage(page);
      url = entry.url;
    }

    if (
      navigationId !== ebookNavigationId ||
      generation !== ebookGeneration
    ) return;

    const image = $("pageImage");

    image.src = url;
    image.alt = book.title +
      (page === 0 ? " 표지" : " " + page + "쪽");
    image.hidden = false;

    ebookDisplayedUrl = page === 0 ? null : url;
    currentPage = page;

    $("pageInfo").textContent =
      page === 0 ? "표지 / " + totalPages :
      page + " / " + totalPages;

    $("reader").hidden = false;
    $("status").hidden = true;

    updatePageControls();
    trimEbookCache();
    preloadEbookPages(page);

  } catch (error) {

    if (
      navigationId !== ebookNavigationId ||
      generation !== ebookGeneration
    ) return;

    ebookRequestedPage = currentPage;
    updatePageControls();

    showStatus("페이지 열람 실패: " +
      (error.message || String(error)), true);
  }
}

// ------------------------------------------
// 10. 페이지 이동
// ------------------------------------------

function goToPage(number) {

  const target = Number(number);

  if (!Number.isInteger(target)) {
    alert("올바른 페이지 번호를 입력해 주세요.");
    return;
  }

  if (target < 0 || target > totalPages) {
    alert("표지(0쪽)부터 " + totalPages + "쪽까지 이동할 수 있습니다.");
    return;
  }

  if (target === ebookRequestedPage && target === currentPage) {
    return;
  }

  return showPage(target);
}

function movePage(delta) {
  return goToPage(
    Math.max(0, Math.min(totalPages, ebookRequestedPage + delta))
  );
}

// ------------------------------------------
// 11. 페이지 컨트롤
// ------------------------------------------

function updatePageControls() {

  $("pageInput").value = ebookRequestedPage;
  $("pageSlider").value = ebookRequestedPage;
  $("pageSlider").max = totalPages;
  $("sliderMax").textContent = totalPages + "쪽";

  const atStart = ebookRequestedPage <= 0;
  const atEnd = ebookRequestedPage >= totalPages;

  [
    "firstButton", "back50Button",
    "back10Button", "prevButton"
  ].forEach(id => $(id).disabled = atStart);

  [
    "nextButton", "forward10Button",
    "forward50Button", "lastButton"
  ].forEach(id => $(id).disabled = atEnd);
}

// ------------------------------------------
// 12. 페이지 이동 이벤트
// ------------------------------------------

$("prevButton").addEventListener("click", () => movePage(-1));
$("nextButton").addEventListener("click", () => movePage(1));
$("firstButton").addEventListener("click", () => goToPage(0));
$("lastButton").addEventListener("click", () => goToPage(totalPages));

$("back10Button").addEventListener("click", () => movePage(-10));
$("forward10Button").addEventListener("click", () => movePage(10));
$("back50Button").addEventListener("click", () => movePage(-50));
$("forward50Button").addEventListener("click", () => movePage(50));

$("jumpButton").addEventListener("click",
  () => goToPage($("pageInput").value));

$("pageInput").addEventListener("keydown", event => {
  if (event.key === "Enter") goToPage($("pageInput").value);
});

$("pageSlider").addEventListener("change",
  event => goToPage(event.target.value));

// ------------------------------------------
// 13. 키보드 이동
// ------------------------------------------

document.addEventListener("keydown", event => {

  const tag = event.target.tagName;

  if (
    tag === "INPUT" ||
    tag === "TEXTAREA" ||
    tag === "SELECT" ||
    event.target.isContentEditable ||
    event.altKey ||
    event.ctrlKey ||
    event.metaKey
  ) return;

  const keys = {
    ArrowRight: 1,
    ArrowLeft: -1,
    PageDown: 10,
    PageUp: -10
  };

  if (event.key === "Home") {
    event.preventDefault();
    goToPage(0);
    return;
  }

  if (event.key === "End") {
    event.preventDefault();
    goToPage(totalPages);
    return;
  }

  if (Object.prototype.hasOwnProperty.call(keys, event.key)) {
    event.preventDefault();
    movePage(keys[event.key]);
  }
});

// ------------------------------------------
// 14. 인증 변경 감지
// ------------------------------------------

function registerEbookAuthListener(userId) {

  ebookAuthUserId = userId;

  if (ebookAuthListener) return;

  const { data } = supabase.auth.onAuthStateChange(
    (event, session) => {

      const nextUserId = session?.user?.id ?? null;

      if (
        event === "SIGNED_OUT" ||
        (ebookAuthUserId !== null && nextUserId !== ebookAuthUserId)
      ) {

        clearEbookCache();
        canReadBody = false;

        showStatus(
          "로그인 상태가 변경되었습니다. 전자책을 다시 열어 주세요.",
          true
        );
      }

      ebookAuthUserId = nextUserId;
    }
  );

  ebookAuthListener = data.subscription;
}

// ==========================================
// 11. 확대·축소
// ==========================================

let zoomLevel = 100;

const MIN_ZOOM = 75;
const MAX_ZOOM = 250;

function applyZoom() {

  const image = $("pageImage");
  const viewport = $("pageViewport");

  image.style.width = zoomLevel + "%";

  $("zoomResetButton").textContent =
    zoomLevel + "%";

  viewport.classList.toggle(
    "zoomed",
    zoomLevel > 100
  );

  $("zoomOutButton").disabled =
    zoomLevel <= MIN_ZOOM;

  $("zoomInButton").disabled =
    zoomLevel >= MAX_ZOOM;

}

$("zoomInButton").addEventListener(
  "click",
  () => {

    zoomLevel = Math.min(
      MAX_ZOOM,
      zoomLevel + 25
    );

    applyZoom();

  }
);

$("zoomOutButton").addEventListener(
  "click",
  () => {

    zoomLevel = Math.max(
      MIN_ZOOM,
      zoomLevel - 25
    );

    applyZoom();

  }
);

$("zoomResetButton").addEventListener(
  "click",
  () => {

    zoomLevel = 100;
    applyZoom();

  }
);

$("fitButton").addEventListener(
  "click",
  () => {

    zoomLevel = 100;
    applyZoom();

    $("pageViewport").scrollTo(0, 0);

  }
);

$("pageViewport").addEventListener(
  "wheel",
  event => {

    if (!event.ctrlKey) {
      return;
    }

    event.preventDefault();

    const direction =
      event.deltaY < 0 ? 25 : -25;

    zoomLevel = Math.max(
      MIN_ZOOM,
      Math.min(
        MAX_ZOOM,
        zoomLevel + direction
      )
    );

    applyZoom();

  },
  { passive: false }
);

// ==========================================
// 이미지 클릭으로 페이지 이동
// ==========================================

$("pageImage").addEventListener(
  "click",
  event => {

    // 확대 상태에서는 페이지 이동 금지
    if (zoomLevel > 100) {
      return;
    }

    const rect =
      event.currentTarget.getBoundingClientRect();

    const clickX =
      event.clientX - rect.left;

    const half = rect.width / 2;

    // 이미지 왼쪽 클릭: 이전 페이지
    if (clickX < half) {

      movePage(-1);

    } else {

      // 이미지 오른쪽 클릭: 다음 페이지
      movePage(1);

    }

  }
);

applyZoom();


// ==========================================
// 19. 목차 및 전자책 초기화 복구
// ==========================================

let readerInitialized = false;


// ==========================================
// 제191단계
// 목차 전체 접기 및 스크롤 초기화
// ==========================================

function resetTocView() {

  const content = $("tocContent");
  const panel = $("tocPanel");

  if (!content) return;

  // 1. 펼쳐진 모든 목차 그룹 접기
  content.querySelectorAll("details[open]")
    .forEach(details => {
      details.open = false;
    });

  // 2. 목차 내용 스크롤 초기화
  content.scrollTop = 0;

  // 3. 실제 목차 패널 스크롤 초기화
  if (panel) {
    panel.scrollTop = 0;
  }

}
  


// ------------------------------------------
// 목차 열기 및 닫기
// ------------------------------------------

function closeToc() {

  const panel = $("tocPanel");
  const button = $("tocButton");

  if (panel) {
    panel.hidden = true;
  }

  if (button) {
    button.textContent = "☰ 목차";
    button.setAttribute(
      "aria-expanded",
      "false"
    );
  }

  resetTocView();

}

// ==========================================
// 제192단계
// 공통 전자책 목차 열기·닫기
// ==========================================

function initializeTocControls() {

  const button = $("tocButton");
  const panel = $("tocPanel");

  if (!button || !panel) return;

  button.setAttribute(
    "aria-expanded",
    "false"
  );

  button.addEventListener("click", () => {

    if (panel.hidden) {

      panel.hidden = false;

      button.textContent = "✕ 목차 닫기";

      button.setAttribute(
        "aria-expanded",
        "true"
      );

    } else {

      closeToc();

    }

  });

}

// ==========================================
// 제192단계
// 범용 계층형 절첩식 목차
// ==========================================

function initializeTotalToc(contents) {

  const panel = $("tocContent");

  if (!panel) return;

  panel.replaceChildren();

  // ----------------------------------------
  // 1. 목차 데이터 해석
  // ----------------------------------------

  let entries = contents;

  if (typeof entries === "string") {

    try {
      entries = JSON.parse(entries);
    } catch {

      entries = entries
        .split(/\r?\n/)
        .filter(line => line.trim());

    }

  }

  if (!Array.isArray(entries)) {

    panel.textContent =
      "표시할 목차 항목이 없습니다.";

    return;

  }

  // ----------------------------------------
  // 2. 목차 도구 모음
  // ----------------------------------------

  const toolbar =
    document.createElement("div");

  toolbar.className =
    "toc-fold-toolbar";

  const expandButton =
    document.createElement("button");

  expandButton.type = "button";
  expandButton.textContent =
    "전체 펼치기";

  const collapseButton =
    document.createElement("button");

  collapseButton.type = "button";
  collapseButton.textContent =
    "전체 접기";

  toolbar.append(
    expandButton,
    collapseButton
  );

  panel.appendChild(toolbar);

  // ----------------------------------------
  // 3. 목차 트리
  // ----------------------------------------

  const tree =
    document.createElement("div");

  tree.className =
    "toc-fold-tree";

  panel.appendChild(tree);

  let count = 0;

  // ----------------------------------------
  // 4. 페이지 이동 버튼
  // ----------------------------------------

  function createPageButton(page) {

    const button =
      document.createElement("button");

    button.type = "button";

    button.className =
      "toc-fold-page";

    button.textContent =
      page + "쪽";

    button.addEventListener(
      "click",
      event => {

        event.preventDefault();
        event.stopPropagation();

        void goToPage(page);

        closeToc();

      }
    );

    return button;

  }

  // ----------------------------------------
  // 5. 계층형 목차 생성
  // ----------------------------------------

  function appendEntries(items, parent) {

    for (const entry of items) {

      if (
        !entry ||
        typeof entry !== "object"
      ) {
        continue;
      }

      const title =
        entry.title ??
        entry.label ??
        entry.text;

      const page = Number(
        entry.page ??
        entry.page_number
      );

      if (
        typeof title !== "string" ||
        !title.trim() ||
        !Number.isInteger(page) ||
        page < 1 ||
        page > totalPages
      ) {
        continue;
      }

      const children =
        entry.children ??
        entry.items ??
        entry.entries ??
        entry.sections ??
        entry.toc ??
        [];

      const hasChildren =
        Array.isArray(children) &&
        children.length > 0;

      count++;

      // 하위 목차가 있는 경우
      if (hasChildren) {

        const details =
          document.createElement("details");

        details.className =
          "toc-fold-details";

        const summary =
          document.createElement("summary");

        summary.className =
          "toc-fold-summary";

        const titleSpan =
          document.createElement("span");

        titleSpan.className =
          "toc-fold-title";

        titleSpan.textContent =
          title;

        summary.append(
          titleSpan,
          createPageButton(page)
        );

        details.appendChild(summary);

        const childBox =
          document.createElement("div");

        childBox.className =
          "toc-fold-children";

        appendEntries(
          children,
          childBox
        );

        details.appendChild(childBox);

        parent.appendChild(details);

      } else {

        const row =
          document.createElement("div");

        row.className =
          "toc-fold-leaf";

        const titleSpan =
          document.createElement("span");

        titleSpan.className =
          "toc-fold-title";

        titleSpan.textContent =
          title;

        row.append(
          titleSpan,
          createPageButton(page)
        );

        parent.appendChild(row);

      }

    }

  }

  appendEntries(entries, tree);

  // ----------------------------------------
  // 6. 전체 펼치기
  // ----------------------------------------

  expandButton.addEventListener(
    "click",
    () => {

      tree.querySelectorAll("details")
        .forEach(details => {
          details.open = true;
        });

    }
  );

  // ----------------------------------------
  // 7. 전체 접기
  // ----------------------------------------

  collapseButton.addEventListener(
    "click",
    () => {

      resetTocView();

    }
  );

  // ----------------------------------------
  // 8. 목차 데이터가 없는 경우
  // ----------------------------------------

  if (!count) {

    panel.replaceChildren();

    panel.textContent =
      "표시할 목차 항목이 없습니다.";

  }

}
  
// ------------------------------------------
// 실행
// ------------------------------------------

if (document.readyState === "loading") {

  document.addEventListener(
    "DOMContentLoaded",
    initializeReader,
    { once: true }
  );

} else {

  initializeReader();

}
</script>
