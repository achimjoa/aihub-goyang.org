  "lang=ru": "<!DOCTYPE html>\n<html lang=\"ru\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nМеждународные организации |\nГлобальный центр ИИ в Кояне\n</title>\n\n<meta\n  name=\"description\"\n  content=\"Потенциальное сотрудничество в области искусственного интеллекта с ВОЗ, ВПП, ЮНЕП, УВКБ ООН, МОМ, МОТ, МСЭ, ЮНИСЕФ и ПРООН в рамках инициативы Глобального центра ИИ в особом городе Коян, Республика Корея.\"\n>\n\n<style>\n\n/* =====================================\n   ОСНОВНЫЕ НАСТРОЙКИ\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    Arial,\n    Helvetica,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ШАПКА САЙТА\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 20px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   ОСНОВНОЕ СОДЕРЖИМОЕ\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n}\n\nh2 {\n  margin-top: 0;\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n/* =====================================\n   КАРТОЧКИ\n===================================== */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.agency-number {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 4px 12px;\n  border-radius: 6px;\n  font-size: 14px;\n  margin-bottom: 12px;\n}\n\n.agency-full-name {\n  font-size: 15px;\n  color: #53647a;\n  margin-bottom: 15px;\n}\n\n.agency-field {\n  background: #eaf4ff;\n  border-radius: 7px;\n  padding: 12px;\n  margin: 15px 0;\n  font-weight: bold;\n  color: #0754a6;\n}\n\n/* =====================================\n   ВЫДЕЛЕННЫЕ БЛОКИ\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* =====================================\n   КНОПКИ\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   ПОДВАЛ САЙТА\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   МОБИЛЬНАЯ ВЕРСИЯ\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ШАПКА САЙТА\n===================================== -->\n\n<header>\n\n<h1>\nМеждународные организации<br>\nи потенциальное сотрудничество в области ИИ\n</h1>\n\n<p>\nОбъединение международного опыта<br>\nи искусственного интеллекта\n</p>\n\n<p>\nИнициатива «Глобальный центр ИИ»<br>\nОсобый город Коян, Республика Корея\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ru\"\n  class=\"home-link\"\n>\n← Главная страница\n</a>\n\n<a\n  href=\"agencies.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n>\n한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     ВИДЕНИЕ\n===================================== -->\n\n<section>\n\n<div class=\"slogan\">\n\nИскусственный интеллект на благо человечества.<br>\nМеждународное сотрудничество ради лучшего будущего.<br>\nИнициатива «Глобальный центр ИИ» в Кояне.\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     1. ВВЕДЕНИЕ\n===================================== -->\n\n<section>\n\n<h2>\n1. Глобальный центр ИИ и международные организации\n</h2>\n\n<p>\nПредлагаемый Глобальный центр\nискусственного интеллекта\nрассматривается как международная\nплатформа сотрудничества,\nобъединяющая опыт международных\nорганизаций и достижения\nв области искусственного интеллекта.\n</p>\n\n<p>\nИнициатива направлена\nна изучение возможностей\nответственного применения ИИ\nдля решения глобальных проблем,\nвключая общественное здравоохранение,\nпродовольственную безопасность,\nизменение климата,\nохрану окружающей среды,\nгуманитарную помощь,\nмиграцию,\nзанятость,\nобразование,\nустойчивость к стихийным бедствиям\nи устойчивое развитие.\n</p>\n\n<p>\nМеждународные организации,\nправительства,\nуниверситеты,\nнаучно-исследовательские учреждения,\nпредприятия\nи гражданское общество\nмогут внести свой опыт\nи знания в совместную деятельность.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nЦель предлагаемого Глобального центра ИИ\nзаключается не просто\nв привлечении представительств\nмеждународных организаций.\n</strong>\n\n<p>\nБолее широкая задача инициативы —\nизучение возможностей\nсодержательного сотрудничества,\nобъединяющего международный опыт\nс исследованиями\nи инновациями в области ИИ\nдля решения общих глобальных проблем.\n</p>\n\n</div>\n\n<p class=\"note\">\nВажное разъяснение:\nдевять международных организаций,\nпредставленных ниже,\nрассматриваются как потенциальные\nнаправления взаимодействия\nс учётом их соответствующих мандатов.\nИх упоминание не означает\nподтверждённого участия,\nпереноса деятельности,\nоткрытия представительств\nили установления партнёрских отношений.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     2. ДЕВЯТЬ МЕЖДУНАРОДНЫХ ОРГАНИЗАЦИЙ\n===================================== -->\n\n<section>\n\n<h2>\n2. Девять международных организаций\nи потенциальные направления сотрудничества в области ИИ\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- WHO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nОрганизация 01\n</span>\n\n<h3>WHO / ВОЗ</h3>\n\n<p class=\"agency-full-name\">\nВсемирная организация здравоохранения\n</p>\n\n<div class=\"agency-field\">\nОбщественное здравоохранение\nи медицинская помощь\n</div>\n\n<p>\nВОЗ является специализированным\nучреждением Организации Объединённых Наций,\nотвечающим за международное\nобщественное здравоохранение.\n</p>\n\n<p>\nЕё деятельность включает\nпрофилактику заболеваний,\nподготовку к чрезвычайным ситуациям\nв области здравоохранения,\nукрепление систем здравоохранения\nи международное сотрудничество\nв сфере охраны здоровья.\n</p>\n\n<p>\nПотенциальные направления\nсотрудничества в области ИИ\nмогут включать\nэпидемиологический надзор,\nраннее выявление рисков для здоровья,\nанализ данных общественного здравоохранения\nи улучшение доступа\nк медицинским услугам.\n</p>\n\n<p class=\"note\">\nТакое сотрудничество\nпотребует надлежащих мер защиты\nконфиденциальности,\nуправления медицинскими данными,\nбезопасности\nи равноправия.\n</p>\n\n</article>\n\n\u003c!-- WFP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nОрганизация 02\n</span>\n\n<h3>WFP / ВПП</h3>\n\n<p class=\"agency-full-name\">\nВсемирная продовольственная программа\n</p>\n\n<div class=\"agency-field\">\nПродовольственная безопасность\nи цепочки поставок\n</div>\n\n<p>\nВПП является гуманитарной\nорганизацией системы ООН,\nзанимающейся борьбой с голодом\nи отсутствием продовольственной безопасности.\n</p>\n\n<p>\nЕё деятельность включает\nэкстренную продовольственную помощь,\nподдержку питания\nи повышение устойчивости\nк продовольственным кризисам.\n</p>\n\n<p>\nПотенциальное применение ИИ\nможет включать\nпрогнозирование продовольственной\nнестабильности,\nанализ рисков цепочек поставок,\nраннее предупреждение\nо продовольственных кризисах\nи совершенствование планирования\nгуманитарной логистики.\n</p>\n\n</article>\n\n\u003c!-- UNEP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nОрганизация 03\n</span>\n\n<h3>UNEP / ЮНЕП</h3>\n\n<p class=\"agency-full-name\">\nПрограмма ООН по окружающей среде\n</p>\n\n<div class=\"agency-field\">\nИзменение климата\nи окружающая среда\n</div>\n\n<p>\nЮНЕП является ведущим\nприродоохранным органом\nсистемы Организации Объединённых Наций.\n</p>\n\n<p>\nОна поддерживает международное\nсотрудничество по вопросам\nизменения климата,\nбиоразнообразия,\nзагрязнения окружающей среды,\nуправления ресурсами\nи устойчивого развития.\n</p>\n\n<p>\nПотенциальное сотрудничество\nв области ИИ\nможет включать\nанализ экологических данных,\nоценку климатических рисков,\nмониторинг экосистем\nи анализ качества воздуха и воды.\n</p>\n\n</article>\n\n\u003c!-- UNHCR -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nОрганизация 04\n</span>\n\n<h3>UNHCR / УВКБ ООН</h3>\n\n<p class=\"agency-full-name\">\nУправление Верховного комиссара ООН\nпо делам беженцев\n</p>\n\n<div class=\"agency-field\">\nЗащита беженцев\nи вынужденное перемещение\n</div>\n\n<p>\nУВКБ ООН занимается\nзащитой и оказанием помощи\nбеженцам,\nвынужденно перемещённым лицам\nи лицам без гражданства.\n</p>\n\n<p>\nЕго обязанности включают\nмеждународную защиту,\nгуманитарную помощь\nи поддержку долгосрочных решений\nпроблем вынужденного перемещения.\n</p>\n\n<p>\nПотенциальное сотрудничество\nв области ИИ\nможет включать\nоценку гуманитарных потребностей,\nулучшение доступа\nк услугам защиты\nи анализ рисков,\nсвязанных с вынужденным перемещением.\n</p>\n\n<p class=\"note\">\nЛюбое применение ИИ\nдолжно уделять первостепенное внимание\nправам человека,\nзащите данных,\nнедопущению дискриминации\nи безопасности уязвимых групп населения.\n</p>\n\n</article>\n\n\u003c!-- IOM -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nОрганизация 05\n</span>\n\n<h3>IOM / МОМ</h3>\n\n<p class=\"agency-full-name\">\nМеждународная организация по миграции\n</p>\n\n<div class=\"agency-field\">\nМиграция и вынужденное перемещение\n</div>\n\n<p>\nМОМ содействует гуманной\nи упорядоченной миграции\nи поддерживает международное\nсотрудничество по вопросам миграции.\n</p>\n\n<p>\nЕё деятельность включает\nпомощь мигрантам,\nподдержку миграционной политики,\nгуманитарное реагирование\nи помощь перемещённым группам населения.\n</p>\n\n<p>\nПотенциальное применение ИИ\nможет включать\nанализ миграционной политики,\nулучшение доступа\nк услугам для мигрантов\nи информационную поддержку\nгуманитарного реагирования\nна вынужденное перемещение.\n</p>\n\n</article>\n\n\u003c!-- ILO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nОрганизация 06\n</span>\n\n<h3>ILO / МОТ</h3>\n\n<p class=\"agency-full-name\">\nМеждународная организация труда\n</p>\n\n<div class=\"agency-field\">\nЗанятость и будущее труда\n</div>\n\n<p>\nМОТ является специализированным\nучреждением ООН,\nсодействующим социальной справедливости,\nтрудовым правам,\nдостойному труду\nи международным трудовым стандартам.\n</p>\n\n<p>\nЕё трёхсторонняя структура\nобъединяет правительства,\nработодателей\nи работников.\n</p>\n\n<p>\nПотенциальное сотрудничество\nв области ИИ\nможет включать\nанализ рынка труда,\nпрогнозирование будущей занятости,\nразвитие профессиональных навыков,\nсовершенствование служб занятости\nи защиту работников\nв условиях технологических преобразований.\n</p>\n\n</article>\n\n\u003c!-- ITU -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nОрганизация 07\n</span>\n\n<h3>ITU / МСЭ</h3>\n\n<p class=\"agency-full-name\">\nМеждународный союз электросвязи\n</p>\n\n<div class=\"agency-field\">\nЭкстренная связь\nи раннее предупреждение\n</div>\n\n<p>\nМСЭ является специализированным\nучреждением ООН\nпо цифровым технологиям\nи информационно-коммуникационным технологиям.\n</p>\n\n<p>\nЕго деятельность включает\nстандартизацию электросвязи,\nобеспечение связи,\nразвитие цифровой инфраструктуры\nи экстренные коммуникации.\n</p>\n\n<p>\nПотенциальное сотрудничество\nв области ИИ\nможет включать\nсвязь при стихийных бедствиях,\nраспространение информации о рисках,\nсистемы раннего предупреждения\nи улучшение цифровой доступности.\n</p>\n\n</article>\n\n\u003c!-- UNICEF -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nОрганизация 08\n</span>\n\n<h3>UNICEF / ЮНИСЕФ</h3>\n\n<p class=\"agency-full-name\">\nДетский фонд ООН\n</p>\n\n<div class=\"agency-field\">\nЗащита детей и образование\n</div>\n\n<p>\nЮНИСЕФ занимается\nзащитой прав детей\nи улучшением их здоровья,\nобразования,\nбезопасности\nи общего благополучия.\n</p>\n\n<p>\nЕго деятельность включает\nзащиту детей,\nобеспечение доступа к образованию,\nподдержку уязвимых детей\nи оказание чрезвычайной помощи.\n</p>\n\n<p>\nПотенциальное применение ИИ\nможет включать\nповышение доступности образования,\nподдержку обучения,\nанализ информации\nо благополучии детей\nи сокращение цифрового неравенства.\n</p>\n\n<p class=\"note\">\nПрава детей,\nконфиденциальность,\nбезопасность,\nравенство образовательных возможностей\nи ответственное управление ИИ\nдолжны оставаться\nцентральными принципами.\n</p>\n\n</article>\n\n\u003c!-- UNDP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nОрганизация 09\n</span>\n\n<h3>UNDP / ПРООН</h3>\n\n<p class=\"agency-full-name\">\nПрограмма развития ООН\n</p>\n\n<div class=\"agency-field\">\nРеагирование на кризисы\nи устойчивое развитие\n</div>\n\n<p>\nПРООН поддерживает страны\nв решении проблем бедности,\nнеравенства,\nгосударственного управления\nи устойчивого развития.\n</p>\n\n<p>\nЕё деятельность включает\nразвитие институционального потенциала,\nреагирование на кризисы,\nвосстановление\nи поддержку достижения\nЦелей устойчивого развития.\n</p>\n\n<p>\nПотенциальное сотрудничество\nв области ИИ\nможет включать\nанализ политики развития,\nоценку комплексных кризисов,\nсовершенствование государственных услуг\nи планирование устойчивого развития\nна основе данных.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. МЕЖДУНАРОДНОЕ СОТРУДНИЧЕСТВО\n===================================== -->\n\n<section>\n\n<h2>\n3. Механизм международного сотрудничества в области ИИ\n</h2>\n\n<p>\nМеждународные организации\nобладают специализированными знаниями,\nглобальными сетями\nи опытом решения сложных задач\nразвития и гуманитарной помощи.\n</p>\n\n<p>\nУниверситеты,\nнаучно-исследовательские учреждения\nи технологические компании\nмогут внести вклад\nв виде исследовательского потенциала,\nэкспертизы в области ИИ\nи технологических инноваций.\n</p>\n\n<p>\nПредлагаемый Глобальный центр ИИ\nстремится изучить возможности\nобъединения этих взаимодополняющих\nпреимуществ посредством\nпрактического международного сотрудничества.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nСовместные научные исследования\n</h3>\n\n<p>\nОпределение исследовательских вопросов,\nсвязанных с глобальными проблемами,\nи изучение возможностей\nреализации совместных\nисследовательских проектов.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nПилотные проекты ответственного применения ИИ\n</h3>\n\n<p>\nИзучение пилотных проектов ИИ,\nотвечающих общественным потребностям,\nс одновременной оценкой\nбезопасности,\nэффективности\nи этических последствий.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nОбмен знаниями и опытом\nв области политики\n</h3>\n\n<p>\nПоддержка возможностей\nдля международных встреч,\nэкспертного диалога,\nизучения политического опыта\nи обмена результатами исследований.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nРазвитие профессионального потенциала\n</h3>\n\n<p>\nИзучение возможностей\nобразования,\nпрофессиональной подготовки,\nобмена специалистами\nи инициатив по развитию потенциала\nв области международного сотрудничества\nи ответственного применения ИИ.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nМеждународный опыт\n+ Ответственные инновации в области ИИ\n+ Институциональное сотрудничество\n</strong>\n\n<p>\nПредлагаемый механизм направлен\nна содействие практическим решениям,\nсоответствующим мандатам\nи приоритетам участвующих учреждений.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     4. ПОЧЕМУ КОЯН?\n===================================== -->\n\n<section>\n\n<h2>\n4. Почему особый город Коян?\n</h2>\n\n<p>\nОсобый город Коян расположен\nв провинции Кёнгидо,\nв столичном регионе Сеула\nРеспублики Корея.\n</p>\n\n<p>\nСуществующие преимущества города\nвключают международную\nконгрессно-выставочную инфраструктуру\nKINTEX,\nмедицинские учреждения,\nтакие как Национальный онкологический центр,\nгородские службы,\nкультурные объекты\nи экологические ресурсы,\nвключая водно-болотные угодья Чанхан.\n</p>\n\n<p>\nЭти ресурсы создают основу\nдля изучения возможностей\nмеждународного сотрудничества\nв области общественного здравоохранения,\nэкологической устойчивости,\nустойчивости к стихийным бедствиям\nи инноваций с использованием ИИ.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nИнициатива Глобального центра ИИ\nнаправлена на объединение\nмеждународного сотрудничества\nс новыми возможностями\nдля научных исследований,\nинноваций,\nпрофессиональной занятости\nи устойчивого регионального развития.\n</strong>\n\n</div>\n\n<p>\nФактические экономические результаты\nи показатели занятости\nбудут зависеть\nот масштаба будущего\nинституционального участия,\nхарактера совместных проектов\nи окончательно установленных\nмеханизмов деятельности.\n</p>\n\n<a\n  href=\"goyang.html?lang=ru\"\n  class=\"button\"\n>\nПодробнее о преимуществах Кояна\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     5. ТРЁХЭТАПНАЯ СТРАТЕГИЯ\n===================================== -->\n\n<section>\n\n<h2>\n5. Трёхэтапная стратегия развития\n</h2>\n\n<p>\nПредлагаемая стратегия учитывает,\nчто успешное международное сотрудничество\nтребует внимания\nк первоначальному размещению,\nустойчивой деятельности\nи долгосрочному совместному развитию.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nЭтап 1 — Первоначальное размещение\n</h3>\n\n<p>\nОценка потребностей\nв подходящих офисных помещениях,\nтранспортной инфраструктуре,\nжилье,\nмедицинском обслуживании,\nобразовании\nи других основных услугах\nдля потенциальных участвующих учреждений.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nЭтап 2 — Поддержка деятельности\n</h3>\n\n<p>\nИзучение возможностей координации\nмежду соответствующими\nгосударственными органами,\nуниверситетами,\nнаучно-исследовательскими учреждениями,\nпредприятиями\nи гражданским обществом\nдля поддержки международного сотрудничества,\nисследований ИИ,\nпилотных проектов\nи профессиональных обменов.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nЭтап 3 — Совместное развитие\n</h3>\n\n<p>\nПоиск возможностей\nдля содействия выполнению миссий\nучаствующих организаций\nпри одновременной поддержке\nрегиональных инноваций,\nпрофессиональной занятости,\nпредпринимательской деятельности\nи устойчивого экономического развития.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nПервоначальное размещение\n→ Поддержка деятельности\n→ Совместное развитие\n</strong>\n\n<p>\nКонкретные проекты,\nмеханизмы финансирования,\nобъекты инфраструктуры\nи меры институциональной поддержки\nпотребуют консультаций\nи официальных решений\nсоответствующих органов.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     6. ИНСТИТУЦИОНАЛЬНЫЙ СТАТУС\n===================================== -->\n\n<section>\n\n<h2>\n6. Институциональный статус\nи дальнейшие шаги\n</h2>\n\n<p>\nГлобальный центр ИИ в Кояне\nпредставлен как предлагаемая инициатива,\nподдерживаемая\nГражданским комитетом содействия.\n</p>\n\n<p>\nУпоминание девяти\nмеждународных организаций\nотражает потенциальную тематическую\nсвязь с инициативой.\n</p>\n\n<p>\nОно не означает\nсуществования официального партнёрства,\nподдержки инициативы,\nрешения о переносе деятельности\nили обязательств\nсо стороны этих организаций.\n</p>\n\n<p>\nБудущее взаимодействие\nпотребует соответствующих консультаций\nс заинтересованными организациями\nи принятия решений\nв рамках их собственных\nинституциональных процедур.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nИнициатива направлена\nна конструктивный диалог,\nинституциональное сотрудничество\nи ответственное планирование\nна основе взаимных интересов\nи международно признанных принципов.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. УЧАСТИЕ ГРАЖДАН\n===================================== -->\n\n<section>\n\n<h2>\n7. Участие граждан\nи международное сотрудничество\n</h2>\n\n<p>\nГражданский комитет содействия\nстремится повышать\nобщественную осведомлённость\nоб инициативе Глобального центра ИИ\nи поощрять конструктивное участие\nв обсуждении будущего развития Кояна.\n</p>\n\n<p>\nИнициатива направлена\nна объединение гражданского участия\nс возможностями международного\nсотрудничества,\nнаучных исследований\nи ответственных инноваций\nв области ИИ.\n</p>\n\n<a\n  href=\"index.html?lang=ru\"\n  class=\"button\"\n>\nГлавная страница\n</a>\n\n<a\n  href=\"agencies.html\"\n  class=\"button\"\n  lang=\"ko\"\n>\n한국어 원문 보기\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     ПОДВАЛ САЙТА\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nИнициатива «Глобальный центр ИИ»<br>\nОсобый город Коян,<br>\nПровинция Кёнгидо,<br>\nРеспублика Корея\n</strong>\n</p>\n\n<p>\nГражданский комитет содействия\nразмещению Глобального центра ИИ\nв особом городе Коян\n</p>\n\n<p>\nИскусственный интеллект\nна благо человечества.<br>\nМеждународное сотрудничество\nради лучшего будущего.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ru\">\nГлавная страница\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"agencies.html\" lang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=zh": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\n国际组织与潜在人工智能合作 |\n高阳全球人工智能枢纽倡议\n</title>\n\n<meta\n  name=\"description\"\n  content=\"了解韩国高阳特例市全球人工智能枢纽倡议与世界卫生组织、世界粮食计划署、联合国环境规划署、联合国难民署、国际移民组织、国际劳工组织、国际电信联盟、联合国儿童基金会和联合国开发计划署的潜在人工智能合作领域。\"\n>\n\n<style>\n\n/* =====================================\n   基本设置\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    \"Microsoft YaHei\",\n    \"PingFang SC\",\n    \"Noto Sans SC\",\n    Arial,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   页眉\n===================================== */\n\nheader {\n  background:\n    linear-gradient(\n      135deg,\n      #0754a6,\n      #10315e\n    );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 20px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n/* =====================================\n   主要内容\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n}\n\nh2 {\n  margin-top: 0;\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n/* =====================================\n   国际组织卡片\n===================================== */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.agency-number {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 4px 12px;\n  border-radius: 6px;\n  font-size: 14px;\n  margin-bottom: 12px;\n}\n\n.agency-full-name {\n  font-size: 15px;\n  color: #53647a;\n  margin-bottom: 15px;\n}\n\n.agency-field {\n  background: #eaf4ff;\n  border-radius: 7px;\n  padding: 12px;\n  margin: 15px 0;\n  font-weight: bold;\n  color: #0754a6;\n}\n\n/* =====================================\n   重点信息\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* =====================================\n   按钮\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   页脚\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   移动设备\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     页眉\n===================================== -->\n\n<header>\n\n<h1>\n国际组织<br>\n与潜在人工智能合作\n</h1>\n\n<p>\n将国际专业知识<br>\n与人工智能技术相结合\n</p>\n\n<p>\n全球人工智能枢纽倡议<br>\n大韩民国高阳特例市\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=zh\"\n  class=\"home-link\"\n>\n  ← 中文首页\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     愿景\n===================================== -->\n\n<section>\n\n<div class=\"slogan\">\n\n人工智能造福人类。<br>\n国际合作共创美好未来。<br>\n高阳全球人工智能枢纽倡议。\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     1. 全球人工智能枢纽与国际组织\n===================================== -->\n\n<section>\n\n<h2>\n1. 全球人工智能枢纽与国际组织\n</h2>\n\n<p>\n拟议中的全球人工智能枢纽\n旨在建设一个国际合作平台，\n将国际组织的专业知识\n与人工智能技术的发展相结合。\n</p>\n\n<p>\n该倡议希望探索\n如何通过负责任的人工智能应用，\n帮助应对公共卫生、\n粮食安全、\n气候变化、\n环境保护、\n人道主义援助、\n人口迁移、\n就业、\n教育、\n灾害应对能力\n以及可持续发展等全球性挑战。\n</p>\n\n<p>\n国际组织、\n各国政府、\n大学、\n科研机构、\n企业\n以及民间社会，\n均可利用各自的专业知识，\n探索开展合作活动的机会。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n拟议中的全球人工智能枢纽，\n其目标不仅仅是吸引国际组织\n设立办事机构。\n</strong>\n\n<p>\n更广泛的目标是\n探索具有实际意义的合作，\n将国际专业知识\n与人工智能研究和创新相结合，\n共同应对全球性挑战。\n</p>\n\n</div>\n\n<p class=\"note\">\n重要说明：\n以下介绍的九个国际组织，\n是根据其职责领域\n被列为潜在合作对象。\n列出这些组织\n并不意味着其已确认参与、\n迁往高阳市、\n设立办事机构\n或建立合作伙伴关系。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     2. 九个国际组织\n===================================== -->\n\n<section>\n\n<h2>\n2. 九个国际组织及潜在人工智能合作领域\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- WHO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n机构 01\n</span>\n\n<h3>WHO</h3>\n\n<p class=\"agency-full-name\">\n世界卫生组织\n</p>\n\n<div class=\"agency-field\">\n公共卫生与医疗保健\n</div>\n\n<p>\n世界卫生组织是联合国\n负责国际公共卫生事务的专门机构。\n</p>\n\n<p>\n其工作包括疾病预防、\n卫生紧急事件准备、\n卫生体系建设\n以及国际卫生合作。\n</p>\n\n<p>\n潜在的人工智能合作领域包括\n疾病监测、\n健康风险早期识别、\n公共卫生数据分析\n以及改善医疗卫生服务的可及性。\n</p>\n\n<p class=\"note\">\n此类合作需要建立\n适当的隐私保护、\n健康数据治理、\n安全性和公平性保障措施。\n</p>\n\n</article>\n\n\u003c!-- WFP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n机构 02\n</span>\n\n<h3>WFP</h3>\n\n<p class=\"agency-full-name\">\n世界粮食计划署\n</p>\n\n<div class=\"agency-field\">\n粮食安全与供应链\n</div>\n\n<p>\n世界粮食计划署是联合国\n致力于应对饥饿\n和粮食不安全问题的人道主义组织。\n</p>\n\n<p>\n其活动包括紧急粮食援助、\n营养支持，\n以及增强应对粮食危机的能力。\n</p>\n\n<p>\n潜在的人工智能应用包括\n粮食不安全状况预测、\n供应链风险分析、\n粮食危机预警，\n以及改进人道主义物流规划。\n</p>\n\n</article>\n\n\u003c!-- UNEP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n机构 03\n</span>\n\n<h3>UNEP</h3>\n\n<p class=\"agency-full-name\">\n联合国环境规划署\n</p>\n\n<div class=\"agency-field\">\n气候变化与环境保护\n</div>\n\n<p>\n联合国环境规划署是联合国\n在全球环境事务方面的主要机构。\n</p>\n\n<p>\n该机构支持在气候变化、\n生物多样性、\n污染治理、\n资源管理\n以及可持续发展等领域\n开展国际合作。\n</p>\n\n<p>\n潜在的人工智能合作包括\n环境数据分析、\n气候风险评估、\n生态系统监测，\n以及空气和水质分析。\n</p>\n\n</article>\n\n\u003c!-- UNHCR -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n机构 04\n</span>\n\n<h3>UNHCR</h3>\n\n<p class=\"agency-full-name\">\n联合国难民事务高级专员公署\n</p>\n\n<div class=\"agency-field\">\n难民保护与被迫流离失所\n</div>\n\n<p>\n联合国难民署致力于保护\n和援助难民、\n被迫流离失所者\n以及无国籍人士。\n</p>\n\n<p>\n其职责包括国际保护、\n人道主义援助，\n以及支持寻找\n解决流离失所问题的持久方案。\n</p>\n\n<p>\n潜在的人工智能合作包括\n人道主义需求评估、\n改善保护服务的可及性，\n以及分析与人口流离失所有关的风险。\n</p>\n\n<p class=\"note\">\n任何相关应用\n都必须优先考虑人权、\n数据保护、\n非歧视原则，\n以及弱势群体的安全。\n</p>\n\n</article>\n\n\u003c!-- IOM -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n机构 05\n</span>\n\n<h3>IOM</h3>\n\n<p class=\"agency-full-name\">\n国际移民组织\n</p>\n\n<div class=\"agency-field\">\n人口迁移与流离失所\n</div>\n\n<p>\n国际移民组织致力于促进\n人道、有序的人口迁移，\n并支持在移民相关问题上\n开展国际合作。\n</p>\n\n<p>\n其活动包括移民援助、\n移民政策支持、\n人道主义应对，\n以及对流离失所人口的援助。\n</p>\n\n<p>\n潜在的人工智能应用包括\n移民政策分析、\n改善移民服务的可及性，\n以及为应对人口流离失所\n提供人道主义信息支持。\n</p>\n\n</article>\n\n\u003c!-- ILO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n机构 06\n</span>\n\n<h3>ILO</h3>\n\n<p class=\"agency-full-name\">\n国际劳工组织\n</p>\n\n<div class=\"agency-field\">\n就业与未来工作\n</div>\n\n<p>\n国际劳工组织是联合国\n致力于促进社会正义、\n劳动权利、\n体面劳动\n以及国际劳工标准的专门机构。\n</p>\n\n<p>\n其三方合作机制\n汇集政府、\n雇主和劳动者代表。\n</p>\n\n<p>\n潜在的人工智能合作包括\n劳动力市场分析、\n未来就业趋势预测、\n职业技能发展、\n就业服务改善，\n以及在技术转型过程中\n保护劳动者权益。\n</p>\n\n</article>\n\n\u003c!-- ITU -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n机构 07\n</span>\n\n<h3>ITU</h3>\n\n<p class=\"agency-full-name\">\n国际电信联盟\n</p>\n\n<div class=\"agency-field\">\n应急通信与预警\n</div>\n\n<p>\n国际电信联盟是联合国\n负责数字技术\n以及信息和通信技术领域的专门机构。\n</p>\n\n<p>\n其工作包括电信标准化、\n网络连接、\n数字基础设施\n以及应急通信。\n</p>\n\n<p>\n潜在的人工智能合作包括\n灾害通信、\n风险信息传播、\n预警系统，\n以及改善数字无障碍服务。\n</p>\n\n</article>\n\n\u003c!-- UNICEF -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n机构 08\n</span>\n\n<h3>UNICEF</h3>\n\n<p class=\"agency-full-name\">\n联合国儿童基金会\n</p>\n\n<div class=\"agency-field\">\n儿童保护与教育\n</div>\n\n<p>\n联合国儿童基金会致力于\n保护儿童权利，\n改善儿童的健康、\n教育、\n安全\n以及整体福祉。\n</p>\n\n<p>\n其活动包括儿童保护、\n扩大教育机会、\n支持弱势儿童，\n以及提供紧急援助。\n</p>\n\n<p>\n潜在的人工智能应用包括\n改善教育可及性、\n学习支持、\n儿童福利信息分析，\n以及缩小数字鸿沟。\n</p>\n\n<p class=\"note\">\n儿童权利、\n隐私、\n安全、\n教育公平\n以及负责任的人工智能治理，\n必须始终作为核心考虑因素。\n</p>\n\n</article>\n\n\u003c!-- UNDP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n机构 09\n</span>\n\n<h3>UNDP</h3>\n\n<p class=\"agency-full-name\">\n联合国开发计划署\n</p>\n\n<div class=\"agency-field\">\n危机应对与可持续发展\n</div>\n\n<p>\n联合国开发计划署支持各国\n应对贫困、\n不平等、\n治理挑战\n以及可持续发展问题。\n</p>\n\n<p>\n其活动包括机构能力建设、\n危机应对、\n灾后恢复，\n以及支持实现\n可持续发展目标。\n</p>\n\n<p>\n潜在的人工智能合作包括\n发展政策分析、\n复杂危机评估、\n公共服务改善，\n以及基于数据的\n可持续发展规划。\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. 国际人工智能合作框架\n===================================== -->\n\n<section>\n\n<h2>\n3. 国际人工智能合作框架\n</h2>\n\n<p>\n国际组织拥有\n专业知识、\n全球合作网络，\n以及应对复杂发展\n和人道主义挑战的经验。\n</p>\n\n<p>\n大学、\n科研机构\n以及科技企业\n可以提供研究能力、\n人工智能专业知识\n和技术创新。\n</p>\n\n<p>\n拟议中的全球人工智能枢纽\n希望探索如何通过\n切实可行的国际合作，\n将这些互补优势连接起来。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\n联合研究\n</h3>\n\n<p>\n围绕全球性挑战\n确定研究问题，\n并探索开展联合研究项目。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n负责任的人工智能试点项目\n</h3>\n\n<p>\n探索回应公共利益需求的\n人工智能试点项目，\n同时评估其安全性、\n有效性\n以及伦理影响。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n政策与知识交流\n</h3>\n\n<p>\n支持国际会议、\n专家对话、\n政策学习\n以及研究成果交流。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n能力建设\n</h3>\n\n<p>\n探索国际合作\n与负责任人工智能领域的\n教育、\n培训、\n专业交流\n以及能力建设项目。\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n国际专业知识\n+\n负责任的人工智能创新\n+\n机构合作\n</strong>\n\n<p>\n拟议中的合作框架\n旨在鼓励开发切实可行的解决方案，\n并确保相关活动\n符合参与机构的职责\n和优先事项。\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     4. 为什么选择高阳特例市？\n===================================== -->\n\n<section>\n\n<h2>\n4. 为什么选择高阳特例市？\n</h2>\n\n<p>\n高阳特例市位于\n大韩民国京畿道，\n属于首尔首都圈。\n</p>\n\n<p>\n其现有资源包括\n以韩国国际展览中心\n（KINTEX）为核心的\n国际会展基础设施、\n韩国国立癌症中心等医疗机构、\n城市公共服务、\n文化设施，\n以及长项湿地等生态资源。\n</p>\n\n<p>\n这些资源为探索\n公共卫生、\n环境可持续发展、\n灾害应对能力\n以及人工智能创新领域的\n国际合作提供了基础。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n全球人工智能枢纽倡议\n希望将国际合作\n与科研、\n创新、\n专业就业\n以及区域可持续发展的新机会\n连接起来。\n</strong>\n\n</div>\n\n<p>\n实际经济和就业成果\n将取决于未来参与机构的规模、\n合作项目的性质，\n以及最终建立的运营机制。\n</p>\n\n<a\n  href=\"goyang.html?lang=zh\"\n  class=\"button\"\n>\n  了解高阳特例市的优势\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     5. 三阶段发展战略\n===================================== -->\n\n<section>\n\n<h2>\n5. 三阶段发展战略\n</h2>\n\n<p>\n拟议中的发展战略认识到，\n成功的国际合作\n需要兼顾初期入驻、\n可持续运营\n以及长期共同发展。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\n第一阶段 — 初期入驻\n</h3>\n\n<p>\n评估潜在参与机构\n对适宜办公设施、\n交通、\n住房、\n医疗、\n教育\n以及其他基本服务的需求。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n第二阶段 — 运营支持\n</h3>\n\n<p>\n探索相关公共部门、\n大学、\n科研机构、\n企业\n和民间社会之间的协调合作，\n以支持国际合作、\n人工智能研究、\n试点项目\n以及专业交流。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n第三阶段 — 共同发展\n</h3>\n\n<p>\n在支持参与机构履行自身使命的同时，\n寻求促进区域创新、\n专业就业、\n企业活动\n以及可持续经济发展的机会。\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n初期入驻\n→\n运营支持\n→\n共同发展\n</strong>\n\n<p>\n具体项目、\n资金安排、\n设施建设\n以及机构支持措施，\n均需要与相关主管部门协商，\n并通过正式决策程序确定。\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     6. 机构现状与后续步骤\n===================================== -->\n\n<section>\n\n<h2>\n6. 机构现状与后续步骤\n</h2>\n\n<p>\n高阳全球人工智能枢纽\n目前是一项由市民推进委员会\n支持和推动的拟议倡议。\n</p>\n\n<p>\n列出九个国际组织，\n是因为其职责领域\n与该倡议的潜在合作方向\n具有相关性。\n</p>\n\n<p>\n这并不代表相关国际组织\n已经建立正式合作关系、\n给予支持、\n作出迁址决定\n或承担任何参与义务。\n</p>\n\n<p>\n未来的合作需要\n与相关国际组织进行适当协商，\n并按照各机构自身的程序\n作出正式决定。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n本倡议致力于\n基于共同利益\n和国际公认原则，\n推动建设性对话、\n机构合作\n以及负责任的规划。\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. 公众参与与国际合作\n===================================== -->\n\n<section>\n\n<h2>\n7. 公众参与与国际合作\n</h2>\n\n<p>\n市民推进委员会\n希望提高公众对\n全球人工智能枢纽倡议的认识，\n并鼓励市民\n积极参与有关高阳市\n未来发展的建设性讨论。\n</p>\n\n<p>\n该倡议旨在将市民参与\n与国际合作、\n科研\n以及负责任的人工智能创新\n所带来的机会连接起来。\n</p>\n\n<a\n  href=\"index.html?lang=zh\"\n  class=\"button\"\n>\n  中文首页\n</a>\n\n<a\n  href=\"participate.html?lang=zh\"\n  class=\"button\"\n>\n  市民参与中心\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     页脚\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\n全球人工智能枢纽倡议<br>\n大韩民国京畿道<br>\n高阳特例市\n</strong>\n</p>\n\n<p>\n高阳特例市全球人工智能枢纽\n引进市民推进委员会\n</p>\n\n<p>\n人工智能造福人类。<br>\n国际合作共创美好未来。\n</p>\n\n<p>\n<a href=\"index.html?lang=zh\">\n中文首页\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n"
}
