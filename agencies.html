\">\n← Inicio\n</a>\n\n<a href=\"#introduccion\">\nIntroducción\n</a>\n\n<a href=\"#organizaciones\">\nNueve organizaciones\n</a>\n\n<a href=\"#cooperacion\">\nCooperación\n</a>\n\n<a href=\"#goyang\">\nGoyang\n</a>\n\n<a href=\"#estrategia\">\nEstrategia\n</a>\n\n<a href=\"#participacion\">\nParticipación\n</a>\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"Seleccionar idioma\">\n🌐 Idioma ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a href=\"agencies.html?lang=es\"\nlang=\"es\"\naria-current=\"page\">\nEspañol ✓\n</a>\n\n<a href=\"agencies.html?lang=en\"\nlang=\"en\">\nEnglish\n</a>\n\n<a href=\"agencies.html\"\nlang=\"ko\">\n한국어\n</a>\n\n</div>\n\n</details>\n\n</nav>\n\n<main>\n\n\u003c!-- VISIÓN -->\n\n<section>\n\n<div class=\"slogan\">\nInteligencia artificial al servicio de la humanidad.<br>\nCooperación internacional para un futuro mejor.<br>\nIniciativa del Centro Global de IA en Goyang.\n</div>\n\n</section>\n\n\u003c!-- INTRODUCCIÓN -->\n\n<section id=\"introduccion\">\n\n<h2>\n1. El Centro Global de IA y las organizaciones internacionales\n</h2>\n\n<p>\nEl Centro Global de Inteligencia Artificial\npropuesto se concibe como una plataforma\nde cooperación internacional que conecte\nlos conocimientos especializados\nde las organizaciones internacionales\ncon los avances de la inteligencia artificial.\n</p>\n\n<p>\nLa iniciativa busca explorar\ncómo las aplicaciones responsables\nde la IA podrían contribuir\na afrontar desafíos globales\nen salud pública,\nseguridad alimentaria,\ncambio climático,\nprotección ambiental,\nasistencia humanitaria,\nmigración,\nempleo,\neducación,\nresiliencia ante desastres\ny desarrollo sostenible.\n</p>\n\n<p>\nLas organizaciones internacionales,\nlos gobiernos,\nlas universidades,\nlas instituciones de investigación,\nlas empresas\ny la sociedad civil\npodrían aportar sus respectivos\nconocimientos especializados\na actividades de colaboración.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nEl objetivo del Centro Global de IA propuesto\nno consiste simplemente en atraer oficinas\nde organizaciones internacionales.\n</strong>\n\n<p>\nSu propósito más amplio\nes explorar una cooperación significativa\nque conecte la experiencia internacional\ncon la investigación y la innovación en IA\npara abordar desafíos globales compartidos.\n</p>\n\n</div>\n\n<p class=\"note\">\nAclaración importante:\nLas nueve organizaciones presentadas\na continuación se identifican\ncomo posibles interlocutoras\nen función de sus respectivos mandatos.\nSu inclusión no indica participación,\ntraslado, establecimiento de oficinas\nni alianzas confirmadas.\n</p>\n\n</section>\n\n\u003c!-- NUEVE ORGANIZACIONES -->\n\n<section id=\"organizaciones\">\n\n<h2>\n2. Nueve organizaciones internacionales\ny posibles ámbitos de cooperación en IA\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- WHO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganización 01\n</span>\n\n<h3>OMS / WHO</h3>\n\n<p class=\"agency-full-name\">\nOrganización Mundial de la Salud\n</p>\n\n<div class=\"agency-field\">\nSalud pública y atención sanitaria\n</div>\n\n<p>\nLa OMS es el organismo especializado\nde las Naciones Unidas responsable\nde la salud pública internacional.\n</p>\n\n<p>\nSu labor incluye la prevención\nde enfermedades,\nla preparación ante emergencias sanitarias,\nel fortalecimiento de los sistemas de salud\ny la cooperación sanitaria internacional.\n</p>\n\n<p>\nEntre los posibles ámbitos\nde cooperación en IA se encuentran\nla vigilancia de enfermedades,\nla detección temprana\nde riesgos sanitarios,\nel análisis de datos de salud pública\ny la mejora del acceso\na los servicios sanitarios.\n</p>\n\n<p class=\"note\">\nEsta cooperación requeriría\nsalvaguardias adecuadas\nen materia de privacidad,\ngobernanza de datos sanitarios,\nseguridad y equidad.\n</p>\n\n</article>\n\n\u003c!-- WFP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganización 02\n</span>\n\n<h3>PMA / WFP</h3>\n\n<p class=\"agency-full-name\">\nPrograma Mundial de Alimentos\n</p>\n\n<div class=\"agency-field\">\nSeguridad alimentaria y cadenas de suministro\n</div>\n\n<p>\nEl PMA es una organización humanitaria\nde las Naciones Unidas dedicada\na combatir el hambre\ny la inseguridad alimentaria.\n</p>\n\n<p>\nSus actividades incluyen\nla asistencia alimentaria de emergencia,\nel apoyo nutricional\ny el fortalecimiento de la resiliencia\nfrente a las crisis alimentarias.\n</p>\n\n<p>\nEntre las posibles aplicaciones\nde la IA se encuentran\nla previsión de la inseguridad alimentaria,\nel análisis de riesgos\nen las cadenas de suministro,\nla alerta temprana\nante crisis alimentarias\ny la mejora de la planificación\nlogística humanitaria.\n</p>\n\n</article>\n\n\u003c!-- UNEP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganización 03\n</span>\n\n<h3>PNUMA / UNEP</h3>\n\n<p class=\"agency-full-name\">\nPrograma de las Naciones Unidas\npara el Medio Ambiente\n</p>\n\n<div class=\"agency-field\">\nCambio climático y medio ambiente\n</div>\n\n<p>\nEl PNUMA es la principal autoridad\nambiental mundial\ndentro del sistema\nde las Naciones Unidas.\n</p>\n\n<p>\nApoya la cooperación internacional\nsobre cambio climático,\nbiodiversidad,\ncontaminación,\ngestión de recursos\ny desarrollo sostenible.\n</p>\n\n<p>\nLa posible cooperación en IA\npodría incluir\nel análisis de datos ambientales,\nla evaluación de riesgos climáticos,\nla vigilancia de ecosistemas\ny el análisis de la calidad\ndel aire y del agua.\n</p>\n\n</article>\n\n\u003c!-- UNHCR -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganización 04\n</span>\n\n<h3>ACNUR / UNHCR</h3>\n\n<p class=\"agency-full-name\">\nOficina del Alto Comisionado\nde las Naciones Unidas para los Refugiados\n</p>\n\n<div class=\"agency-field\">\nProtección de refugiados y desplazamiento forzado\n</div>\n\n<p>\nACNUR trabaja para proteger\ny asistir a las personas refugiadas,\nlas personas desplazadas por la fuerza\ny las personas apátridas.\n</p>\n\n<p>\nSus responsabilidades incluyen\nla protección internacional,\nla asistencia humanitaria\ny el apoyo a soluciones duraderas\nfrente al desplazamiento.\n</p>\n\n<p>\nLa posible cooperación en IA\npodría incluir\nla evaluación de necesidades humanitarias,\nla mejora del acceso\na servicios de protección\ny el análisis de riesgos\nrelacionados con el desplazamiento.\n</p>\n\n<p class=\"note\">\nCualquier aplicación\ndebe dar prioridad\na los derechos humanos,\nla protección de datos,\nla no discriminación\ny la seguridad\nde las poblaciones vulnerables.\n</p>\n\n</article>\n\n\u003c!-- IOM -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganización 05\n</span>\n\n<h3>OIM / IOM</h3>\n\n<p class=\"agency-full-name\">\nOrganización Internacional para las Migraciones\n</p>\n\n<div class=\"agency-field\">\nMigración y desplazamiento\n</div>\n\n<p>\nLa OIM promueve una migración\nhumana y ordenada\ny apoya la cooperación internacional\nen cuestiones relacionadas\ncon la migración.\n</p>\n\n<p>\nSus actividades incluyen\nla asistencia a personas migrantes,\nel apoyo a las políticas migratorias,\nla respuesta humanitaria\ny la asistencia\na poblaciones desplazadas.\n</p>\n\n<p>\nEntre las posibles aplicaciones\nde la IA se encuentran\nel análisis de políticas migratorias,\nla mejora del acceso\na servicios para migrantes\ny el apoyo informativo\na las respuestas humanitarias\nante el desplazamiento.\n</p>\n\n</article>\n\n\u003c!-- ILO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganización 06\n</span>\n\n<h3>OIT / ILO</h3>\n\n<p class=\"agency-full-name\">\nOrganización Internacional del Trabajo\n</p>\n\n<div class=\"agency-field\">\nEmpleo y futuro del trabajo\n</div>\n\n<p>\nLa OIT es el organismo especializado\nde las Naciones Unidas\nque promueve la justicia social,\nlos derechos laborales,\nel trabajo decente\ny las normas internacionales del trabajo.\n</p>\n\n<p>\nSu estructura tripartita\nreúne a gobiernos,\nempleadores y trabajadores.\n</p>\n\n<p>\nLa posible cooperación en IA\npodría incluir\nel análisis del mercado laboral,\nla previsión del empleo futuro,\nel desarrollo de competencias,\nla mejora de los servicios de empleo\ny la protección de los trabajadores\ndurante las transiciones tecnológicas.\n</p>\n\n</article>\n\n\u003c!-- ITU -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganización 07\n</span>\n\n<h3>UIT / ITU</h3>\n\n<p class=\"agency-full-name\">\nUnión Internacional de Telecomunicaciones\n</p>\n\n<div class=\"agency-field\">\nComunicaciones de emergencia y alerta temprana\n</div>\n\n<p>\nLa UIT es el organismo especializado\nde las Naciones Unidas\npara las tecnologías digitales\ny las tecnologías\nde la información y la comunicación.\n</p>\n\n<p>\nSu labor incluye\nla normalización de las telecomunicaciones,\nla conectividad,\nla infraestructura digital\ny las comunicaciones de emergencia.\n</p>\n\n<p>\nLa posible cooperación en IA\npodría incluir\nlas comunicaciones ante desastres,\nla difusión de información sobre riesgos,\nlos sistemas de alerta temprana\ny la mejora de la accesibilidad digital.\n</p>\n\n</article>\n\n\u003c!-- UNICEF -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganización 08\n</span>\n\n<h3>UNICEF</h3>\n\n<p class=\"agency-full-name\">\nFondo de las Naciones Unidas para la Infancia\n</p>\n\n<div class=\"agency-field\">\nProtección de la infancia y educación\n</div>\n\n<p>\nUNICEF trabaja para proteger\nlos derechos de la infancia\ny mejorar la salud,\nla educación,\nla seguridad\ny el bienestar general\nde los niños.\n</p>\n\n<p>\nSus actividades incluyen\nla protección infantil,\nel acceso a la educación,\nel apoyo a niños vulnerables\ny la asistencia en emergencias.\n</p>\n\n<p>\nEntre las posibles aplicaciones\nde la IA se encuentran\nla accesibilidad educativa,\nel apoyo al aprendizaje,\nel análisis de información\nsobre bienestar infantil\ny la reducción\nde las desigualdades digitales.\n</p>\n\n<p class=\"note\">\nLos derechos de la infancia,\nla privacidad,\nla seguridad,\nla equidad educativa\ny la gobernanza responsable de la IA\ndeben seguir siendo\nconsideraciones fundamentales.\n</p>\n\n</article>\n\n\u003c!-- UNDP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganización 09\n</span>\n\n<h3>PNUD / UNDP</h3>\n\n<p class=\"agency-full-name\">\nPrograma de las Naciones Unidas para el Desarrollo\n</p>\n\n<div class=\"agency-field\">\nRespuesta a crisis y desarrollo sostenible\n</div>\n\n<p>\nEl PNUD apoya a los países\npara afrontar la pobreza,\nla desigualdad,\nlos desafíos de gobernanza\ny el desarrollo sostenible.\n</p>\n\n<p>\nSus actividades incluyen\nel desarrollo de capacidades institucionales,\nla respuesta a crisis,\nla recuperación\ny el apoyo\na los Objetivos de Desarrollo Sostenible.\n</p>\n\n<p>\nLa posible cooperación en IA\npodría incluir\nel análisis de políticas de desarrollo,\nla evaluación de crisis complejas,\nla mejora de los servicios públicos\ny la planificación\nbasada en datos\npara el desarrollo sostenible.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- MARCO DE COOPERACIÓN -->\n\n<section id=\"cooperacion\">\n\n<h2>\n3. Un marco para la cooperación internacional en IA\n</h2>\n\n<p>\nLas organizaciones internacionales\naportan conocimientos especializados,\nredes mundiales\ny experiencia para afrontar\ndesafíos complejos\nde desarrollo y asistencia humanitaria.\n</p>\n\n<p>\nLas universidades,\nlas instituciones de investigación\ny las empresas tecnológicas\npueden aportar capacidades de investigación,\nconocimientos especializados en IA\ne innovación tecnológica.\n</p>\n\n<p>\nEl Centro Global de IA propuesto\nbusca explorar oportunidades\npara conectar estas fortalezas\ncomplementarias mediante\nla cooperación internacional práctica.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nInvestigación conjunta\n</h3>\n\n<p>\nIdentificar preguntas de investigación\nrelacionadas con desafíos globales\ny explorar proyectos\nde investigación colaborativa.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nProyectos piloto de IA responsable\n</h3>\n\n<p>\nExplorar proyectos piloto de IA\nque respondan a necesidades\nde interés público,\nevaluando al mismo tiempo\nla seguridad,\nla eficacia\ny las implicaciones éticas.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nIntercambio de políticas y conocimientos\n</h3>\n\n<p>\nApoyar oportunidades\npara reuniones internacionales,\ndiálogo entre expertos,\naprendizaje sobre políticas\ne intercambio\nde resultados de investigación.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nDesarrollo de capacidades\n</h3>\n\n<p>\nExplorar iniciativas de educación,\nformación,\nintercambio profesional\ny fortalecimiento de capacidades\nen cooperación internacional\ne inteligencia artificial responsable.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nExperiencia internacional\n+ Innovación responsable en IA\n+ Cooperación institucional\n</strong>\n\n<p>\nEl marco propuesto busca fomentar\nsoluciones prácticas\nque sean coherentes\ncon los mandatos\ny las prioridades\nde las instituciones participantes.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- GOYANG -->\n\n<section id=\"goyang\">\n\n<h2>\n4. ¿Por qué la Ciudad Especial de Goyang?\n</h2>\n\n<p>\nLa Ciudad Especial de Goyang\nse encuentra en la provincia de Gyeonggi,\ndentro de la región metropolitana de Seúl,\nen la República de Corea.\n</p>\n\n<p>\nEntre sus recursos existentes\nse encuentran\nla infraestructura internacional\nde convenciones y exposiciones\ncentrada en KINTEX,\ninstituciones sanitarias\ncomo el Centro Nacional del Cáncer,\nservicios urbanos,\ninstalaciones culturales\ny recursos ecológicos,\nincluido el humedal de Janghang.\n</p>\n\n<p>\nEstos recursos proporcionan\nuna base para explorar\nla cooperación internacional\nen salud pública,\nsostenibilidad ambiental,\nresiliencia ante desastres\ne innovación apoyada por IA.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nLa iniciativa del Centro Global de IA\nbusca conectar\nla cooperación internacional\ncon nuevas oportunidades\nde investigación,\ninnovación,\nempleo especializado\ny desarrollo regional sostenible.\n</strong>\n\n</div>\n\n<p>\nLos resultados económicos\ny de empleo reales\ndependerían de la escala\nde la futura participación institucional,\nla naturaleza\nde los proyectos cooperativos\ny los mecanismos operativos\nque finalmente se establezcan.\n</p>\n\n<a href=\"goyang.html?lang=es\"\nclass=\"button\">\nExplorar las ventajas de Goyang\n</a>\n\n</section>\n\n\u003c!-- ESTRATEGIA -->\n\n<section id=\"estrategia\">\n\n<h2>\n5. Estrategia de desarrollo en tres etapas\n</h2>\n\n<p>\nLa estrategia propuesta reconoce\nque una cooperación internacional exitosa\nrequiere atención\nal establecimiento inicial,\nlas operaciones sostenibles\ny el desarrollo compartido\na largo plazo.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nEtapa 1 — Establecimiento inicial\n</h3>\n\n<p>\nEvaluar los requisitos\nde instalaciones de oficinas adecuadas,\ntransporte,\nvivienda,\natención sanitaria,\neducación\ny otros servicios esenciales\npara las instituciones\nque potencialmente participen.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nEtapa 2 — Apoyo operativo\n</h3>\n\n<p>\nExplorar la coordinación\nentre las autoridades públicas pertinentes,\nuniversidades,\ninstituciones de investigación,\nempresas\ny sociedad civil\npara apoyar\nla cooperación internacional,\nla investigación en IA,\nlos proyectos piloto\ny los intercambios profesionales.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nEtapa 3 — Crecimiento compartido\n</h3>\n\n<p>\nBuscar oportunidades\npara contribuir\na las misiones\nde las organizaciones participantes\ny, al mismo tiempo,\nfomentar la innovación regional,\nel empleo especializado,\nla actividad empresarial\ny el desarrollo económico sostenible.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nEstablecimiento inicial\n→ Apoyo operativo\n→ Crecimiento compartido\n</strong>\n\n<p>\nLos proyectos específicos,\nlos mecanismos de financiación,\nlas instalaciones\ny las medidas de apoyo institucional\nrequerirían consultas\ny decisiones formales\nde las autoridades competentes.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- SITUACIÓN INSTITUCIONAL -->\n\n<section id=\"situacion\">\n\n<h2>\n6. Situación institucional y próximos pasos\n</h2>\n\n<p>\nEl Centro Global de IA en Goyang\nse presenta como una iniciativa propuesta\nque cuenta con el apoyo\ndel Comité Ciudadano de Promoción.\n</p>\n\n<p>\nLa identificación\nde nueve organizaciones internacionales\nrefleja su posible relevancia temática\npara la iniciativa.\n</p>\n\n<p>\nNo establece ninguna alianza formal,\nrespaldo institucional,\ndecisión de traslado\nni compromiso\npor parte de estas organizaciones.\n</p>\n\n<p>\nCualquier colaboración futura\nrequeriría consultas adecuadas\ncon las organizaciones interesadas\ny decisiones adoptadas\nmediante sus respectivos\nprocedimientos institucionales.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nLa iniciativa busca promover\nun diálogo constructivo,\nla cooperación institucional\ny una planificación responsable\nbasada en intereses mutuos\ny principios reconocidos internacionalmente.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- PARTICIPACIÓN -->\n\n<section id=\"participacion\">\n\n<h2>\n7. Participación ciudadana y cooperación internacional\n</h2>\n\n<p>\nEl Comité Ciudadano de Promoción\nbusca aumentar\nel conocimiento público\nsobre la iniciativa\ndel Centro Global de IA\ny fomentar la participación constructiva\nen los debates\nsobre el futuro desarrollo de Goyang.\n</p>\n\n<p>\nLa iniciativa pretende conectar\nla participación ciudadana\ncon oportunidades\nde cooperación internacional,\ninvestigación\ne innovación responsable en IA.\n</p>\n\n<a href=\"index.html?lang=es\"\nclass=\"button\">\nPágina principal en español\n</a>\n\n<a href=\"hub.html?lang=es\"\nclass=\"button secondary\">\nAcerca del Centro Global de IA\n</a>\n\n<a href=\"agencies.html?lang=en\"\nclass=\"button secondary\"\nlang=\"en\">\nRead in English\n</a>\n\n<a href=\"agencies.html\"\nclass=\"button secondary\"\nlang=\"ko\">\n한국어 원문 보기\n</a>\n\n</section>\n\n</main>\n\n<footer>\n\n<p>\n<strong>\nIniciativa del Centro Global de IA<br>\nCiudad Especial de Goyang,\nProvincia de Gyeonggi,\nRepública de Corea\n</strong>\n</p>\n\n<p>\nComité Ciudadano de Promoción\npara la Atracción del Centro Global de IA\na la Ciudad Especial de Goyang\n</p>\n\n<p>\nInteligencia artificial\nal servicio de la humanidad.<br>\nCooperación internacional\npara un futuro mejor.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=es\">\nInicio en español\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"agencies.html?lang=en\"\nlang=\"en\">\nEnglish\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"agencies.html\"\nlang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=fr": "<!DOCTYPE html>\n<html lang=\"fr\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<title>\nOrganisations internationales |\nInitiative du Centre mondial de l'IA à Goyang\n</title>\n\n<meta name=\"description\"\ncontent=\"Découvrez les possibilités de coopération en intelligence artificielle avec l'OMS, le PAM, le PNUE, le HCR, l'OIM, l'OIT, l'UIT, l'UNICEF et le PNUD dans le cadre du projet de Centre mondial de l'IA à Goyang.\">\n\n<style>\n\n/* CONFIGURATION GÉNÉRALE */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* EN-TÊTE */\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 20px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n/* CONTENU */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.06);\n}\n\nh2 {\n  margin-top: 0;\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n/* CARTES */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.agency-number {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 4px 12px;\n  border-radius: 6px;\n  font-size: 14px;\n  margin-bottom: 12px;\n}\n\n.agency-full-name {\n  font-size: 15px;\n  color: #53647a;\n  margin-bottom: 15px;\n}\n\n.agency-field {\n  background: #eaf4ff;\n  border-radius: 7px;\n  padding: 12px;\n  margin: 15px 0;\n  font-weight: bold;\n  color: #0754a6;\n}\n\n/* ENCADRÉS */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* BOUTONS */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* PIED DE PAGE */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* VERSION MOBILE */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- EN-TÊTE -->\n\n<header>\n\n<h1>\nOrganisations internationales<br>\net coopération potentielle en matière d'IA\n</h1>\n\n<p>\nRelier l'expertise internationale<br>\nà l'intelligence artificielle\n</p>\n\n<p>\nInitiative du Centre mondial de l'IA<br>\nVille spéciale de Goyang, République de Corée\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=fr\"\nclass=\"home-link\">\n← Accueil\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- VISION -->\n\n<section>\n\n<div class=\"slogan\">\n\nL'intelligence artificielle au service de l'humanité.<br>\nLa coopération internationale pour un avenir meilleur.<br>\nInitiative du Centre mondial de l'IA à Goyang.\n\n</div>\n\n</section>\n\n\u003c!-- INTRODUCTION -->\n\n<section>\n\n<h2>\n1. Le Centre mondial de l'IA et les organisations internationales\n</h2>\n\n<p>\nLe projet de Centre mondial de l'IA\nest conçu comme une plateforme\nde coopération internationale\nvisant à associer\nl'expertise des organisations internationales\naux progrès de l'intelligence artificielle.\n</p>\n\n<p>\nCette initiative cherche à explorer\ncomment les applications responsables de l'IA\npourraient contribuer à relever\nles défis mondiaux\ndans les domaines de la santé publique,\nde la sécurité alimentaire,\ndu changement climatique,\nde la protection de l'environnement,\nde l'aide humanitaire,\ndes migrations,\nde l'emploi,\nde l'éducation,\nde la résilience face aux catastrophes\net du développement durable.\n</p>\n\n<p>\nLes organisations internationales,\nles gouvernements,\nles universités,\nles établissements de recherche,\nles entreprises\net la société civile\npourraient apporter leurs compétences\nrespectives à des activités communes.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nL'objectif du Centre mondial de l'IA proposé\nne consiste pas simplement\nà attirer les bureaux\nd'organisations internationales.\n</strong>\n\n<p>\nSon objectif plus large\nest d'explorer une coopération significative\nreliant l'expertise internationale\nà la recherche et à l'innovation en IA\nafin de relever les défis mondiaux communs.\n</p>\n\n</div>\n\n<p class=\"note\">\nPrécision importante :\nLes neuf organisations présentées ci-dessous\nont été identifiées\nen raison de la pertinence potentielle\nde leurs missions.\nLeur inclusion ne signifie pas\nqu'elles ont confirmé\nleur participation,\nleur transfert,\nl'établissement d'un bureau\nou un partenariat.\n</p>\n\n</section>\n\n\u003c!-- NEUF ORGANISATIONS -->\n\n<section>\n\n<h2>\n2. Neuf organisations internationales\net domaines potentiels de coopération en IA\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- OMS -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 01\n</span>\n\n<h3>OMS / WHO</h3>\n\n<p class=\"agency-full-name\">\nOrganisation mondiale de la Santé\n</p>\n\n<div class=\"agency-field\">\nSanté publique et soins de santé\n</div>\n\n<p>\nL'OMS est l'institution spécialisée\ndes Nations Unies\nresponsable de la santé publique internationale.\n</p>\n\n<p>\nSes activités comprennent\nla prévention des maladies,\nla préparation aux urgences sanitaires,\nle renforcement des systèmes de santé\net la coopération sanitaire internationale.\n</p>\n\n<p>\nLes domaines potentiels de coopération en IA\npourraient comprendre\nla surveillance des maladies,\nla détection précoce des risques sanitaires,\nl'analyse des données de santé\net l'amélioration de l'accès\naux services de santé.\n</p>\n\n<p class=\"note\">\nUne telle coopération nécessiterait\ndes garanties appropriées\nen matière de protection de la vie privée,\nde gouvernance des données de santé,\nde sécurité et d'équité.\n</p>\n\n</article>\n\n\u003c!-- PAM -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 02\n</span>\n\n<h3>PAM / WFP</h3>\n\n<p class=\"agency-full-name\">\nProgramme alimentaire mondial\n</p>\n\n<div class=\"agency-field\">\nSécurité alimentaire et chaînes d'approvisionnement\n</div>\n\n<p>\nLe PAM est une organisation humanitaire\ndes Nations Unies\nqui lutte contre la faim\net l'insécurité alimentaire.\n</p>\n\n<p>\nSes activités comprennent\nl'aide alimentaire d'urgence,\nle soutien nutritionnel\net le renforcement de la résilience\nface aux crises alimentaires.\n</p>\n\n<p>\nLes applications potentielles de l'IA\npourraient comprendre\nla prévision de l'insécurité alimentaire,\nl'analyse des risques\ndes chaînes d'approvisionnement,\nl'alerte précoce\nen cas de crise alimentaire\net l'amélioration\nde la planification logistique humanitaire.\n</p>\n\n</article>\n\n\u003c!-- PNUE -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 03\n</span>\n\n<h3>PNUE / UNEP</h3>\n\n<p class=\"agency-full-name\">\nProgramme des Nations Unies pour l'environnement\n</p>\n\n<div class=\"agency-field\">\nChangement climatique et environnement\n</div>\n\n<p>\nLe PNUE est la principale autorité mondiale\ndes Nations Unies\ndans le domaine de l'environnement.\n</p>\n\n<p>\nIl soutient la coopération internationale\nsur le changement climatique,\nla biodiversité,\nla pollution,\nla gestion des ressources\net le développement durable.\n</p>\n\n<p>\nLes domaines potentiels de coopération en IA\npourraient comprendre\nl'analyse des données environnementales,\nl'évaluation des risques climatiques,\nla surveillance des écosystèmes\net l'analyse de la qualité\nde l'air et de l'eau.\n</p>\n\n</article>\n\n\u003c!-- HCR -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 04\n</span>\n\n<h3>HCR / UNHCR</h3>\n\n<p class=\"agency-full-name\">\nHaut-Commissariat des Nations Unies pour les réfugiés\n</p>\n\n<div class=\"agency-field\">\nProtection des réfugiés et déplacements forcés\n</div>\n\n<p>\nLe HCR œuvre à la protection\net à l'assistance\ndes réfugiés,\ndes personnes déplacées de force\net des apatrides.\n</p>\n\n<p>\nSes responsabilités comprennent\nla protection internationale,\nl'aide humanitaire\net la recherche de solutions durables\naux situations de déplacement.\n</p>\n\n<p>\nLes domaines potentiels de coopération en IA\npourraient comprendre\nl'évaluation des besoins humanitaires,\nl'amélioration de l'accès\naux services de protection\net l'analyse des risques\nliés aux déplacements forcés.\n</p>\n\n<p class=\"note\">\nToute application doit donner la priorité\naux droits humains,\nà la protection des données,\nà la non-discrimination\net à la sécurité\ndes populations vulnérables.\n</p>\n\n</article>\n\n\u003c!-- OIM -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 05\n</span>\n\n<h3>OIM / IOM</h3>\n\n<p class=\"agency-full-name\">\nOrganisation internationale pour les migrations\n</p>\n\n<div class=\"agency-field\">\nMigrations et déplacements\n</div>\n\n<p>\nL'OIM promeut\ndes migrations humaines et ordonnées\net soutient la coopération internationale\nsur les questions migratoires.\n</p>\n\n<p>\nSes activités comprennent\nl'assistance aux migrants,\nle soutien aux politiques migratoires,\nla réponse humanitaire\net l'aide aux populations déplacées.\n</p>\n\n<p>\nLes applications potentielles de l'IA\npourraient comprendre\nl'analyse des politiques migratoires,\nl'amélioration de l'accès\naux services destinés aux migrants\net le soutien informationnel\naux interventions humanitaires\nliées aux déplacements.\n</p>\n\n</article>\n\n\u003c!-- OIT -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 06\n</span>\n\n<h3>OIT / ILO</h3>\n\n<p class=\"agency-full-name\">\nOrganisation internationale du Travail\n</p>\n\n<div class=\"agency-field\">\nEmploi et avenir du travail\n</div>\n\n<p>\nL'OIT est l'institution spécialisée\ndes Nations Unies\nqui promeut la justice sociale,\nles droits du travail,\nle travail décent\net les normes internationales du travail.\n</p>\n\n<p>\nSa structure tripartite\nréunit les gouvernements,\nles employeurs\net les travailleurs.\n</p>\n\n<p>\nLes domaines potentiels de coopération en IA\npourraient comprendre\nl'analyse du marché du travail,\nla prévision des évolutions de l'emploi,\nle développement des compétences,\nl'amélioration des services d'emploi\net la protection des travailleurs\npendant les transitions technologiques.\n</p>\n\n</article>\n\n\u003c!-- UIT -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 07\n</span>\n\n<h3>UIT / ITU</h3>\n\n<p class=\"agency-full-name\">\nUnion internationale des télécommunications\n</p>\n\n<div class=\"agency-field\">\nCommunications d'urgence et alerte précoce\n</div>\n\n<p>\nL'UIT est l'institution spécialisée\ndes Nations Unies\npour les technologies numériques\net les technologies\nde l'information et de la communication.\n</p>\n\n<p>\nSes activités comprennent\nla normalisation des télécommunications,\nla connectivité,\nles infrastructures numériques\net les communications d'urgence.\n</p>\n\n<p>\nLes domaines potentiels de coopération en IA\npourraient comprendre\nles communications en cas de catastrophe,\nla diffusion d'informations sur les risques,\nles systèmes d'alerte précoce\net l'amélioration\nde l'accessibilité numérique.\n</p>\n\n</article>\n\n\u003c!-- UNICEF -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 08\n</span>\n\n<h3>UNICEF</h3>\n\n<p class=\"agency-full-name\">\nFonds des Nations Unies pour l'enfance\n</p>\n\n<div class=\"agency-field\">\nProtection de l'enfance et éducation\n</div>\n\n<p>\nL'UNICEF œuvre à la protection\ndes droits des enfants\net à l'amélioration\nde leur santé,\nde leur éducation,\nde leur sécurité\net de leur bien-être général.\n</p>\n\n<p>\nSes activités comprennent\nla protection de l'enfance,\nl'accès à l'éducation,\nle soutien aux enfants vulnérables\net l'assistance d'urgence.\n</p>\n\n<p>\nLes applications potentielles de l'IA\npourraient comprendre\nl'accessibilité de l'éducation,\nle soutien à l'apprentissage,\nl'analyse des informations\nrelatives au bien-être des enfants\net la réduction des inégalités numériques.\n</p>\n\n<p class=\"note\">\nLes droits des enfants,\nla protection de la vie privée,\nla sécurité,\nl'équité éducative\net la gouvernance responsable de l'IA\ndoivent rester des considérations centrales.\n</p>\n\n</article>\n\n\u003c!-- PNUD -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 09\n</span>\n\n<h3>PNUD / UNDP</h3>\n\n<p class=\"agency-full-name\">\nProgramme des Nations Unies pour le développement\n</p>\n\n<div class=\"agency-field\">\nRéponse aux crises et développement durable\n</div>\n\n<p>\nLe PNUD aide les pays\nà lutter contre la pauvreté,\nles inégalités,\nles difficultés de gouvernance\net les défis du développement durable.\n</p>\n\n<p>\nSes activités comprennent\nle développement des capacités institutionnelles,\nla réponse aux crises,\nle relèvement\net le soutien\naux objectifs de développement durable.\n</p>\n\n<p>\nLes domaines potentiels de coopération en IA\npourraient comprendre\nl'analyse des politiques de développement,\nl'évaluation des crises complexes,\nl'amélioration des services publics\net la planification du développement durable\nfondée sur les données.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- CADRE DE COOPÉRATION -->\n\n<section>\n\n<h2>\n3. Un cadre de coopération internationale en IA\n</h2>\n\n<p>\nLes organisations internationales apportent\ndes connaissances spécialisées,\ndes réseaux mondiaux\net une expérience\ndans la résolution\ndes défis complexes\ndu développement\net de l'action humanitaire.\n</p>\n\n<p>\nLes universités,\nles établissements de recherche\net les entreprises technologiques\npeuvent contribuer\npar leurs capacités scientifiques,\nleur expertise en IA\net leurs innovations technologiques.\n</p>\n\n<p>\nLe Centre mondial de l'IA proposé\ncherche à explorer\nles possibilités de relier\nces atouts complémentaires\ngrâce à une coopération internationale concrète.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nRecherche conjointe\n</h3>\n\n<p>\nIdentifier des questions de recherche\nliées aux défis mondiaux\net explorer\ndes projets de recherche collaborative.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nProjets pilotes d'IA responsable\n</h3>\n\n<p>\nExplorer des projets pilotes d'IA\nrépondant aux besoins d'intérêt public\ntout en évaluant\nla sécurité,\nl'efficacité\net les implications éthiques.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nÉchanges de politiques et de connaissances\n</h3>\n\n<p>\nSoutenir les possibilités\nde réunions internationales,\nde dialogue entre experts,\nd'apprentissage des politiques publiques\net d'échange\ndes résultats de recherche.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nRenforcement des capacités\n</h3>\n\n<p>\nExplorer les initiatives\nd'éducation,\nde formation,\nd'échanges professionnels\net de renforcement des capacités\ndans la coopération internationale\net l'IA responsable.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nExpertise internationale\n+ Innovation responsable en IA\n+ Coopération institutionnelle\n</strong>\n\n<p>\nLe cadre proposé vise\nà encourager des solutions pratiques\nconformes aux missions\net aux priorités\ndes institutions participantes.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- POURQUOI GOYANG -->\n\n<section>\n\n<h2>\n4. Pourquoi la ville spéciale de Goyang ?\n</h2>\n\n<p>\nLa ville spéciale de Goyang\nest située dans la province de Gyeonggi,\nau sein de la région métropolitaine de Séoul,\nen République de Corée.\n</p>\n\n<p>\nSes ressources existantes comprennent\nles infrastructures internationales\nde congrès et d'expositions\ncentrées sur le KINTEX,\ndes établissements de santé\ntels que le Centre national du cancer,\ndes services urbains,\ndes équipements culturels\net des ressources écologiques\ncomme la zone humide de Janghang.\n</p>\n\n<p>\nCes ressources constituent une base\npour explorer\nla coopération internationale\ndans les domaines\nde la santé publique,\nde la durabilité environnementale,\nde la résilience face aux catastrophes\net de l'innovation fondée sur l'IA.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nL'initiative du Centre mondial de l'IA\ncherche à relier\nla coopération internationale\nà de nouvelles possibilités\nde recherche,\nd'innovation,\nd'emploi qualifié\net de développement régional durable.\n</strong>\n\n</div>\n\n<p>\nLes résultats économiques réels\net les effets sur l'emploi\ndépendraient de l'ampleur\nde la participation institutionnelle future,\nde la nature des projets de coopération\net des dispositifs opérationnels\nfinalement établis.\n</p>\n\n<a href=\"goyang.html?lang=fr\"\nclass=\"button\">\nDécouvrir les atouts de Goyang →\n</a>\n\n</section>\n\n\u003c!-- STRATÉGIE EN TROIS ÉTAPES -->\n\n<section>\n\n<h2>\n5. Stratégie de développement en trois étapes\n</h2>\n\n<p>\nLa stratégie proposée reconnaît\nqu'une coopération internationale réussie\nnécessite une attention particulière\nà l'installation initiale,\nau fonctionnement durable\net au développement partagé à long terme.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nÉtape 1 — Installation initiale\n</h3>\n\n<p>\nÉvaluer les besoins\nen bureaux adaptés,\ntransports,\nlogements,\nsoins de santé,\néducation\net autres services essentiels\npour les institutions\nsusceptibles de participer.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nÉtape 2 — Soutien opérationnel\n</h3>\n\n<p>\nExplorer la coordination\nentre les autorités publiques concernées,\nles universités,\nles établissements de recherche,\nles entreprises\net la société civile\nafin de soutenir\nla coopération internationale,\nla recherche en IA,\nles projets pilotes\net les échanges professionnels.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nÉtape 3 — Croissance partagée\n</h3>\n\n<p>\nRechercher des possibilités\nde contribuer aux missions\ndes organisations participantes\ntout en favorisant\nl'innovation régionale,\nl'emploi qualifié,\nl'activité économique\net le développement durable.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nInstallation initiale\n→ Soutien opérationnel\n→ Croissance partagée\n</strong>\n\n<p>\nLes projets spécifiques,\nles dispositifs de financement,\nles installations\net les mesures de soutien institutionnel\nnécessiteraient des consultations\net des décisions formelles\ndes autorités compétentes.\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=fr\" class=\"button\">\nDécouvrir la stratégie →\n</a>\n\n</section>\n\n\u003c!-- STATUT INSTITUTIONNEL -->\n\n<section>\n\n<h2>\n6. Statut institutionnel et prochaines étapes\n</h2>\n\n<p>\nLe Centre mondial de l'IA à Goyang\nest présenté comme une initiative proposée\nsoutenue par le Comité citoyen de promotion.\n</p>\n\n<p>\nL'identification de neuf organisations internationales\nreflète la pertinence thématique potentielle\nde leurs missions\npour cette initiative.\n</p>\n\n<p>\nElle ne constitue\nni un partenariat formel,\nni une approbation,\nni une décision de transfert,\nni un engagement\nde la part de ces organisations.\n</p>\n\n<p>\nToute coopération future nécessiterait\ndes consultations appropriées\navec les organisations concernées\net des décisions prises\nselon leurs procédures institutionnelles respectives.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nL'initiative vise à encourager\nun dialogue constructif,\nune coopération institutionnelle\net une planification responsable\nfondée sur des intérêts mutuels\net des principes internationalement reconnus.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- PARTICIPATION -->\n\n<section>\n\n<h2>\n7. Participation citoyenne et coopération internationale\n</h2>\n\n<p>\nLe Comité citoyen de promotion\ncherche à sensibiliser le public\nà l'initiative du Centre mondial de l'IA\net à encourager\nune participation constructive\naux discussions\nsur le développement futur de Goyang.\n</p>\n\n<p>\nL'initiative vise à relier\nla participation citoyenne\naux possibilités\nde coopération internationale,\nde recherche\net d'innovation responsable en IA.\n</p>\n\n<a href=\"index.html?lang=fr\"\nclass=\"button\">\nAccueil — Version française\n</a>\n\n<a href=\"participate.html?lang=fr\"\nclass=\"button\">\nParticipation citoyenne →\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIED DE PAGE -->\n\n<footer>\n\n<p>\n<strong>\nInitiative du Centre mondial de l'IA<br>\nVille spéciale de Goyang,<br>\nProvince de Gyeonggi,<br>\nRépublique de Corée\n</strong>\n</p>\n\n<p>\nComité citoyen de promotion\npour l'implantation du Centre mondial de l'IA\ndans la ville spéciale de Goyang\n</p>\n\n<p>\nL'intelligence artificielle\nau service de l'humanité.<br>\nLa coopération internationale\npour un avenir meilleur.\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\">\nAccueil\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=it": "<!DOCTYPE html>\n<html lang=\"it\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<title>\nOrganizzazioni internazionali |\nIniziativa per un Polo Globale dell'IA a Goyang\n</title>\n\n<meta name=\"description\"\ncontent=\"Scopri le potenziali collaborazioni nell'intelligenza artificiale con OMS, PAM, UNEP, UNHCR, OIM, OIL, UIT, UNICEF e PNUD nell'ambito dell'iniziativa per un Polo Globale dell'IA nella Città Speciale di Goyang, Repubblica di Corea.\">\n\n<style>\n\n/* IMPOSTAZIONI GENERALI */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* INTESTAZIONE */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 20px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n/* CONTENUTO PRINCIPALE */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.06);\n}\n\nh2 {\n  margin-top: 0;\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n/* SCHEDE */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.agency-number {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 4px 12px;\n  border-radius: 6px;\n  font-size: 14px;\n  margin-bottom: 12px;\n}\n\n.agency-full-name {\n  font-size: 15px;\n  color: #53647a;\n  margin-bottom: 15px;\n}\n\n.agency-field {\n  background: #eaf4ff;\n  border-radius: 7px;\n  padding: 12px;\n  margin: 15px 0;\n  font-weight: bold;\n  color: #0754a6;\n}\n\n/* RIQUADRI IN EVIDENZA */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* PULSANTI */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* PIÈ DI PAGINA */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* VERSIONE MOBILE */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- INTESTAZIONE -->\n\n<header>\n\n<h1>\nOrganizzazioni internazionali<br>\ne potenziali collaborazioni nell'IA\n</h1>\n\n<p>\nCollegare le competenze internazionali<br>\ncon l'intelligenza artificiale\n</p>\n\n<p>\nIniziativa per un Polo Globale dell'IA<br>\nCittà Speciale di Goyang, Repubblica di Corea\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=it\"\nclass=\"home-link\">\n← Homepage italiana\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- VISIONE -->\n\n<section>\n\n<div class=\"slogan\">\n\nIntelligenza artificiale al servizio dell'umanità.<br>\nCooperazione internazionale per un futuro migliore.<br>\nIniziativa per un Polo Globale dell'IA a Goyang.\n\n</div>\n\n</section>\n\n\u003c!-- INTRODUZIONE -->\n\n<section>\n\n<h2>\n1. Il Polo Globale dell'IA e le organizzazioni internazionali\n</h2>\n\n<p>\nIl Polo Globale dell'IA proposto\nè concepito come una piattaforma\ndi cooperazione internazionale\nche collega le competenze\ndelle organizzazioni internazionali\ncon i progressi\ndell'intelligenza artificiale.\n</p>\n\n<p>\nL'iniziativa intende esplorare\ncome le applicazioni responsabili dell'IA\npossano contribuire ad affrontare\nsfide globali\nnel campo della salute pubblica,\ndella sicurezza alimentare,\ndel cambiamento climatico,\ndella protezione ambientale,\ndell'assistenza umanitaria,\ndelle migrazioni,\ndell'occupazione,\ndell'istruzione,\ndella resilienza alle catastrofi\ne dello sviluppo sostenibile.\n</p>\n\n<p>\nOrganizzazioni internazionali,\ngoverni,\nuniversità,\nistituti di ricerca,\nimprese\ne società civile\npotrebbero contribuire\ncon le rispettive competenze\nad attività di collaborazione.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nL'obiettivo del Polo Globale dell'IA proposto\nnon è semplicemente attirare\ngli uffici delle organizzazioni internazionali.\n</strong>\n\n<p>\nIl suo scopo più ampio\nè esplorare forme significative\ndi cooperazione\nche colleghino le competenze internazionali\nalla ricerca e all'innovazione nell'IA\nper affrontare\nsfide globali condivise.\n</p>\n\n</div>\n\n<p class=\"note\">\nChiarimento importante:\nle nove organizzazioni presentate di seguito\nsono individuate come potenziali\ninterlocutori di cooperazione\nin base ai rispettivi mandati istituzionali.\nLa loro inclusione non indica\nuna partecipazione confermata,\nun trasferimento,\nl'apertura di uffici\no un partenariato formalizzato.\n</p>\n\n</section>\n\n\u003c!-- NOVE ORGANIZZAZIONI -->\n\n<section>\n\n<h2>\n2. Nove organizzazioni internazionali\ne potenziali ambiti di cooperazione nell'IA\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- WHO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganizzazione 01\n</span>\n\n<h3>WHO / OMS</h3>\n\n<p class=\"agency-full-name\">\nOrganizzazione Mondiale della Sanità\n</p>\n\n<div class=\"agency-field\">\nSalute pubblica e assistenza sanitaria\n</div>\n\n<p>\nL'OMS è l'agenzia specializzata\ndelle Nazioni Unite\nresponsabile della salute pubblica internazionale.\n</p>\n\n<p>\nLe sue attività comprendono\nla prevenzione delle malattie,\nla preparazione alle emergenze sanitarie,\nil rafforzamento dei sistemi sanitari\ne la cooperazione sanitaria internazionale.\n</p>\n\n<p>\nI potenziali ambiti di cooperazione nell'IA\npotrebbero includere\nla sorveglianza delle malattie,\nl'individuazione precoce\ndei rischi sanitari,\nl'analisi dei dati di salute pubblica\ne il miglioramento dell'accesso\nai servizi sanitari.\n</p>\n\n<p class=\"note\">\nTale cooperazione richiederebbe\nadeguate garanzie\nper la tutela della privacy,\nla governance dei dati sanitari,\nla sicurezza\ne l'equità.\n</p>\n\n</article>\n\n\u003c!-- WFP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganizzazione 02\n</span>\n\n<h3>WFP / PAM</h3>\n\n<p class=\"agency-full-name\">\nProgramma Alimentare Mondiale\n</p>\n\n<div class=\"agency-field\">\nSicurezza alimentare e catene di approvvigionamento\n</div>\n\n<p>\nIl PAM è un'organizzazione umanitaria\ndelle Nazioni Unite\nimpegnata nella lotta contro la fame\ne l'insicurezza alimentare.\n</p>\n\n<p>\nLe sue attività comprendono\nl'assistenza alimentare di emergenza,\nil sostegno nutrizionale\ne il rafforzamento della resilienza\nalle crisi alimentari.\n</p>\n\n<p>\nLe potenziali applicazioni dell'IA\npotrebbero includere\nla previsione dell'insicurezza alimentare,\nl'analisi dei rischi\nnelle catene di approvvigionamento,\nl'allerta precoce delle crisi alimentari\ne il miglioramento\ndella pianificazione logistica umanitaria.\n</p>\n\n</article>\n\n\u003c!-- UNEP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganizzazione 03\n</span>\n\n<h3>UNEP</h3>\n\n<p class=\"agency-full-name\">\nProgramma delle Nazioni Unite per l'Ambiente\n</p>\n\n<div class=\"agency-field\">\nCambiamento climatico e ambiente\n</div>\n\n<p>\nL'UNEP è la principale autorità\nambientale globale\ndelle Nazioni Unite.\n</p>\n\n<p>\nSostiene la cooperazione internazionale\nsul cambiamento climatico,\nla biodiversità,\nl'inquinamento,\nla gestione delle risorse\ne lo sviluppo sostenibile.\n</p>\n\n<p>\nLa potenziale cooperazione nell'IA\npotrebbe comprendere\nl'analisi dei dati ambientali,\nla valutazione dei rischi climatici,\nil monitoraggio degli ecosistemi\ne l'analisi della qualità\ndell'aria e dell'acqua.\n</p>\n\n</article>\n\n\u003c!-- UNHCR -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganizzazione 04\n</span>\n\n<h3>UNHCR</h3>\n\n<p class=\"agency-full-name\">\nAlto Commissariato delle Nazioni Unite per i Rifugiati\n</p>\n\n<div class=\"agency-field\">\nProtezione dei rifugiati e sfollamento forzato\n</div>\n\n<p>\nL'UNHCR opera per proteggere\ne assistere i rifugiati,\nle persone costrette alla fuga\ne gli apolidi.\n</p>\n\n<p>\nLe sue responsabilità comprendono\nla protezione internazionale,\nl'assistenza umanitaria\ne il sostegno a soluzioni durature\nper le situazioni di sfollamento.\n</p>\n\n<p>\nLa potenziale cooperazione nell'IA\npotrebbe comprendere\nla valutazione dei bisogni umanitari,\nil miglioramento dell'accesso\nai servizi di protezione\ne l'analisi dei rischi\nlegati agli sfollamenti.\n</p>\n\n<p class=\"note\">\nQualsiasi applicazione\ndeve dare priorità\nai diritti umani,\nalla protezione dei dati,\nalla non discriminazione\ne alla sicurezza\ndelle popolazioni vulnerabili.\n</p>\n\n</article>\n\n\u003c!-- IOM -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganizzazione 05\n</span>\n\n<h3>IOM / OIM</h3>\n\n<p class=\"agency-full-name\">\nOrganizzazione Internazionale per le Migrazioni\n</p>\n\n<div class=\"agency-field\">\nMigrazioni e sfollamenti\n</div>\n\n<p>\nL'OIM promuove\nuna migrazione umana e ordinata\ne sostiene la cooperazione internazionale\nsulle questioni migratorie.\n</p>\n\n<p>\nLe sue attività comprendono\nl'assistenza ai migranti,\nil sostegno alle politiche migratorie,\nla risposta umanitaria\ne l'assistenza alle popolazioni sfollate.\n</p>\n\n<p>\nLe potenziali applicazioni dell'IA\npotrebbero comprendere\nl'analisi delle politiche migratorie,\nil miglioramento dell'accesso\nai servizi per i migranti\ne il supporto informativo\nalle risposte umanitarie\nagli sfollamenti.\n</p>\n\n</article>\n\n\u003c!-- ILO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganizzazione 06\n</span>\n\n<h3>ILO / OIL</h3>\n\n<p class=\"agency-full-name\">\nOrganizzazione Internazionale del Lavoro\n</p>\n\n<div class=\"agency-field\">\nOccupazione e futuro del lavoro\n</div>\n\n<p>\nL'OIL è l'agenzia specializzata\ndelle Nazioni Unite\nche promuove\nla giustizia sociale,\ni diritti dei lavoratori,\nil lavoro dignitoso\ne le norme internazionali del lavoro.\n</p>\n\n<p>\nLa sua struttura tripartita\nriunisce governi,\ndatori di lavoro\ne lavoratori.\n</p>\n\n<p>\nLa potenziale cooperazione nell'IA\npotrebbe comprendere\nl'analisi del mercato del lavoro,\nla previsione dell'occupazione futura,\nlo sviluppo delle competenze,\nil miglioramento dei servizi per l'impiego\ne la protezione dei lavoratori\ndurante le transizioni tecnologiche.\n</p>\n\n</article>\n\n\u003c!-- ITU -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganizzazione 07\n</span>\n\n<h3>ITU / UIT</h3>\n\n<p class=\"agency-full-name\">\nUnione Internazionale delle Telecomunicazioni\n</p>\n\n<div class=\"agency-field\">\nComunicazioni di emergenza e allerta precoce\n</div>\n\n<p>\nL'UIT è l'agenzia specializzata\ndelle Nazioni Unite\nper le tecnologie digitali\ne le tecnologie dell'informazione\ne della comunicazione.\n</p>\n\n<p>\nLe sue attività comprendono\nla standardizzazione\ndelle telecomunicazioni,\nla connettività,\nle infrastrutture digitali\ne le comunicazioni di emergenza.\n</p>\n\n<p>\nLa potenziale cooperazione nell'IA\npotrebbe comprendere\nle comunicazioni durante le catastrofi,\nla diffusione delle informazioni sui rischi,\ni sistemi di allerta precoce\ne il miglioramento\ndell'accessibilità digitale.\n</p>\n\n</article>\n\n\u003c!-- UNICEF -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganizzazione 08\n</span>\n\n<h3>UNICEF</h3>\n\n<p class=\"agency-full-name\">\nFondo delle Nazioni Unite per l'Infanzia\n</p>\n\n<div class=\"agency-field\">\nProtezione dell'infanzia e istruzione\n</div>\n\n<p>\nL'UNICEF opera\nper proteggere i diritti dei bambini\ne migliorare\nla loro salute,\nistruzione,\nsicurezza\ne benessere generale.\n</p>\n\n<p>\nLe sue attività comprendono\nla protezione dell'infanzia,\nl'accesso all'istruzione,\nil sostegno ai bambini vulnerabili\ne l'assistenza nelle emergenze.\n</p>\n\n<p>\nLe potenziali applicazioni dell'IA\npotrebbero comprendere\nl'accessibilità educativa,\nil sostegno all'apprendimento,\nl'analisi delle informazioni\nsul benessere dei bambini\ne la riduzione\ndelle disuguaglianze digitali.\n</p>\n\n<p class=\"note\">\nI diritti dei bambini,\nla privacy,\nla sicurezza,\nl'equità educativa\ne una governance responsabile dell'IA\ndevono rimanere\nconsiderazioni centrali.\n</p>\n\n</article>\n\n\u003c!-- UNDP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganizzazione 09\n</span>\n\n<h3>UNDP / PNUD</h3>\n\n<p class=\"agency-full-name\">\nProgramma delle Nazioni Unite per lo Sviluppo\n</p>\n\n<div class=\"agency-field\">\nRisposta alle crisi e sviluppo sostenibile\n</div>\n\n<p>\nIl PNUD sostiene i Paesi\nnell'affrontare la povertà,\nle disuguaglianze,\nle sfide della governance\ne lo sviluppo sostenibile.\n</p>\n\n<p>\nLe sue attività comprendono\nlo sviluppo delle capacità istituzionali,\nla risposta alle crisi,\nla ripresa\ne il sostegno\nagli Obiettivi di sviluppo sostenibile.\n</p>\n\n<p>\nLa potenziale cooperazione nell'IA\npotrebbe comprendere\nl'analisi delle politiche di sviluppo,\nla valutazione delle crisi complesse,\nil miglioramento dei servizi pubblici\ne la pianificazione dello sviluppo sostenibile\nbasata sui dati.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- QUADRO DI COOPERAZIONE -->\n\n<section>\n\n<h2>\n3. Un quadro per la cooperazione internazionale nell'IA\n</h2>\n\n<p>\nLe organizzazioni internazionali\napportano conoscenze specialistiche,\nreti globali\ned esperienza nell'affrontare\ncomplesse sfide umanitarie\ne di sviluppo.\n</p>\n\n<p>\nLe università,\ngli istituti di ricerca\ne le imprese tecnologiche\npossono contribuire\ncon capacità di ricerca,\ncompetenze nell'IA\ne innovazione tecnologica.\n</p>\n\n<p>\nIl Polo Globale dell'IA proposto\nintende esplorare opportunità\nper collegare questi punti di forza\ncomplementari\nattraverso una cooperazione internazionale concreta.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>Ricerca congiunta</h3>\n\n<p>\nIndividuare questioni di ricerca\nlegate alle sfide globali\ned esplorare progetti\ndi ricerca collaborativa.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Progetti pilota di IA responsabile</h3>\n\n<p>\nEsplorare progetti pilota di IA\nche rispondano\na esigenze di interesse pubblico,\nvalutandone al contempo\nla sicurezza,\nl'efficacia\ne le implicazioni etiche.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Scambio di politiche e conoscenze</h3>\n\n<p>\nSostenere opportunità\nper incontri internazionali,\ndialogo tra esperti,\napprendimento sulle politiche\ne scambio dei risultati della ricerca.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Sviluppo delle competenze</h3>\n\n<p>\nEsplorare iniziative\ndi istruzione,\nformazione,\nscambio professionale\ne rafforzamento delle capacità\nnella cooperazione internazionale\ne nell'IA responsabile.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nCompetenze internazionali\n+ Innovazione responsabile nell'IA\n+ Cooperazione istituzionale\n</strong>\n\n<p>\nIl quadro proposto\nintende incoraggiare\nsoluzioni concrete\ncoerenti con i mandati\ne le priorità\ndelle istituzioni partecipanti.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- PERCHÉ GOYANG -->\n\n<section>\n\n<h2>\n4. Perché la Città Speciale di Goyang?\n</h2>\n\n<p>\nLa Città Speciale di Goyang\nsi trova nella Provincia di Gyeonggi,\nall'interno dell'area metropolitana di Seul,\nnella Repubblica di Corea.\n</p>\n\n<p>\nLe sue risorse esistenti comprendono\ninfrastrutture per congressi\ned esposizioni internazionali\nincentrate su KINTEX,\nistituzioni sanitarie\ncome il National Cancer Center,\nservizi urbani,\nstrutture culturali\ne risorse ecologiche,\ntra cui la zona umida di Janghang.\n</p>\n\n<p>\nQueste risorse costituiscono\nuna base per esplorare\nla cooperazione internazionale\nnella salute pubblica,\nnella sostenibilità ambientale,\nnella resilienza alle catastrofi\ne nell'innovazione supportata dall'IA.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nL'iniziativa per un Polo Globale dell'IA\nintende collegare\nla cooperazione internazionale\na nuove opportunità\ndi ricerca,\ninnovazione,\noccupazione qualificata\ne sviluppo regionale sostenibile.\n</strong>\n\n</div>\n\n<p>\nI risultati economici\ne occupazionali effettivi\ndipenderebbero\ndall'entità della futura\npartecipazione istituzionale,\ndalla natura dei progetti di cooperazione\ne dalle modalità operative\neventualmente stabilite.\n</p>\n\n<a href=\"goyang.html?lang=it\"\nclass=\"button\">\nScopri i vantaggi di Goyang\n</a>\n\n</section>\n\n\u003c!-- STRATEGIA IN TRE FASI -->\n\n<section>\n\n<h2>\n5. Strategia di sviluppo in tre fasi\n</h2>\n\n<p>\nLa strategia proposta riconosce\nche il successo della cooperazione internazionale\nrichiede attenzione\nall'insediamento iniziale,\nalla sostenibilità delle attività operative\ne allo sviluppo condiviso a lungo termine.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nFase 1 — Insediamento iniziale\n</h3>\n\n<p>\nValutare le esigenze\nrelative a uffici adeguati,\ntrasporti,\nalloggi,\nassistenza sanitaria,\nistruzione\ne altri servizi essenziali\nper le potenziali istituzioni partecipanti.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nFase 2 — Supporto operativo\n</h3>\n\n<p>\nEsplorare il coordinamento\ntra le autorità pubbliche competenti,\nuniversità,\nistituti di ricerca,\nimprese\ne società civile\nper sostenere\nla cooperazione internazionale,\nla ricerca sull'IA,\ni progetti pilota\ne gli scambi professionali.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nFase 3 — Crescita condivisa\n</h3>\n\n<p>\nRicercare opportunità\nper contribuire\nalle missioni\ndelle organizzazioni partecipanti,\nincoraggiando al contempo\nl'innovazione regionale,\nl'occupazione qualificata,\nle attività imprenditoriali\ne lo sviluppo economico sostenibile.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nInsediamento iniziale\n→ Supporto operativo\n→ Crescita condivisa\n</strong>\n\n<p>\nProgetti specifici,\nmodalità di finanziamento,\nstrutture\ne misure di sostegno istituzionale\nrichiederebbero consultazioni\ne decisioni formali\nda parte delle autorità competenti.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- CHIARIMENTO ISTITUZIONALE -->\n\n<section>\n\n<h2>\n6. Stato istituzionale e prossimi passi\n</h2>\n\n<p>\nIl Polo Globale dell'IA a Goyang\nè presentato come un'iniziativa proposta\ne sostenuta\ndal Comitato Civico Promotore.\n</p>\n\n<p>\nL'individuazione\ndelle nove organizzazioni internazionali\nriflette la loro potenziale rilevanza tematica\nper l'iniziativa.\n</p>\n\n<p>\nCiò non costituisce\nalcun partenariato formale,\nsostegno ufficiale,\ndecisione di trasferimento\no impegno\nda parte di tali organizzazioni.\n</p>\n\n<p>\nUn futuro coinvolgimento\nrichiederebbe consultazioni appropriate\ncon le organizzazioni interessate\ne decisioni adottate\nsecondo le rispettive procedure istituzionali.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nL'iniziativa intende promuovere\nun dialogo costruttivo,\nla cooperazione istituzionale\ne una pianificazione responsabile\nbasata su interessi reciproci\ne principi riconosciuti a livello internazionale.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- PARTECIPAZIONE PUBBLICA -->\n\n<section>\n\n<h2>\n7. Partecipazione pubblica e cooperazione internazionale\n</h2>\n\n<p>\nIl Comitato Civico Promotore\nintende sensibilizzare l'opinione pubblica\nsull'iniziativa per un Polo Globale dell'IA\ne incoraggiare una partecipazione costruttiva\nalle discussioni\nsullo sviluppo futuro di Goyang.\n</p>\n\n<p>\nL'iniziativa mira a collegare\nil coinvolgimento dei cittadini\ncon opportunità\ndi cooperazione internazionale,\nricerca\ne innovazione responsabile nell'IA.\n</p>\n\n<a href=\"index.html?lang=it\"\nclass=\"button\">\nHomepage italiana\n</a>\n\n<a href=\"participate.html?lang=it\"\nclass=\"button\">\nPartecipazione dei cittadini\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIÈ DI PAGINA -->\n\n<footer>\n\n<p>\n<strong>\nIniziativa per un Polo Globale dell'IA<br>\nCittà Speciale di Goyang,\nProvincia di Gyeonggi,\nRepubblica di Corea\n</strong>\n</p>\n\n<p>\nComitato Civico Promotore\nper l'insediamento del Polo Globale dell'IA\nnella Città Speciale di Goyang\n</p>\n\n<p>\nIntelligenza artificiale al servizio dell'umanità.<br>\nCooperazione internazionale per un futuro migliore.\n</p>\n\n<p>\n<a href=\"index.html?lang=it\">\nHomepage italiana\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=ja": "<!DOCTYPE html>\n<html lang=\"ja\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\n国際機関とAI協力の可能性 |\n高陽特例市グローバルAIハブ構想\n</title>\n\n<meta\n  name=\"description\"\n  content=\"高陽特例市グローバルAIハブ構想における、WHO、WFP、UNEP、UNHCR、IOM、ILO、ITU、UNICEF、UNDPの9つの国際機関とのAI協力の可能性を紹介します。\"\n>\n\n<style>\n\n/* =====================================\n   基本設定\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n\n  font-family:\n    \"Noto Sans JP\",\n    \"Hiragino Kaku Gothic ProN\",\n    \"Yu Gothic\",\n    Meiryo,\n    Arial,\n    sans-serif;\n\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ヘッダー\n===================================== */\n\nheader {\n  background:\n    linear-gradient(\n      135deg,\n      #0754a6,\n      #10315e\n    );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 20px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   メインコンテンツ\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n}\n\nh2 {\n  margin-top: 0;\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   スローガン\n===================================== */\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n/* =====================================\n   カード\n===================================== */\n\n.grid {\n  display: grid;\n\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.agency-number {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 4px 12px;\n  border-radius: 6px;\n  font-size: 14px;\n  margin-bottom: 12px;\n}\n\n.agency-full-name {\n  font-size: 15px;\n  color: #53647a;\n  margin-bottom: 15px;\n}\n\n.agency-field {\n  background: #eaf4ff;\n  border-radius: 7px;\n  padding: 12px;\n  margin: 15px 0;\n  font-weight: bold;\n  color: #0754a6;\n}\n\n/* =====================================\n   強調表示\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* =====================================\n   ボタン\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   フッター\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   モバイル対応\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ヘッダー\n===================================== -->\n\n<header>\n\n<h1>\n国際機関と<br>\nAI協力の可能性\n</h1>\n\n<p>\n国際的な専門知識と<br>\n人工知能を結び付ける\n</p>\n\n<p>\nグローバルAIハブ構想<br>\n大韓民国・京畿道 高陽特例市\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ja\"\n  class=\"home-link\"\n>\n  ← 日本語ホーム\n</a>\n\n<a\n  href=\"agencies.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n>\n  한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     ビジョン\n===================================== -->\n\n<section>\n\n<div class=\"slogan\">\n\n人類のための人工知能。<br>\nより良い未来に向けた国際協力。<br>\n高陽特例市グローバルAIハブ構想。\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     1. グローバルAIハブと国際機関\n===================================== -->\n\n<section>\n\n<h2>\n1. グローバルAIハブと国際機関\n</h2>\n\n<p>\n構想中のグローバルAIハブは、\n国際機関の専門知識と\n人工知能技術の進歩を結び付ける\n国際協力プラットフォームとして\n構想されています。\n</p>\n\n<p>\n本構想は、\n公衆衛生、\n食料安全保障、\n気候変動、\n環境保護、\n人道支援、\n移住、\n雇用、\n教育、\n災害への対応力、\n持続可能な開発などの\n地球規模の課題に対して、\n責任あるAIの活用が\nどのように貢献できるかを\n検討することを目指しています。\n</p>\n\n<p>\n国際機関、\n政府、\n大学、\n研究機関、\n企業、\n市民社会が、\nそれぞれの専門性を生かして\n共同活動に貢献する可能性があります。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n構想中のグローバルAIハブの目的は、\n単に国際機関の事務所を\n誘致することではありません。\n</strong>\n\n<p>\nより広い目的は、\n国際的な専門知識と\nAI研究・イノベーションを結び付け、\n地球規模の共通課題に取り組む\n実質的な協力の可能性を\n探ることにあります。\n</p>\n\n</div>\n\n<p class=\"note\">\n重要な説明：\n以下で紹介する9つの国際機関は、\nそれぞれの使命と活動分野に基づき、\n将来的な協力の可能性を検討する\n対象として掲載しています。\n各機関の参加、\n移転、\n事務所設置、\nまたは正式な協力関係が\n確定したことを意味するものではありません。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     2. 9つの国際機関\n===================================== -->\n\n<section>\n\n<h2>\n2. 9つの国際機関とAI協力の可能性\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- WHO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n国際機関 01\n</span>\n\n<h3>WHO</h3>\n\n<p class=\"agency-full-name\">\n世界保健機関\n</p>\n\n<div class=\"agency-field\">\n公衆衛生・医療\n</div>\n\n<p>\nWHOは、\n国際的な公衆衛生を担当する\n国連の専門機関です。\n</p>\n\n<p>\n主な活動には、\n疾病予防、\n保健上の緊急事態への備え、\n保健医療制度の強化、\n国際保健協力などがあります。\n</p>\n\n<p>\nAI協力の可能性がある分野には、\n疾病監視、\n健康リスクの早期発見、\n公衆衛生データの分析、\n医療サービスへのアクセス改善\nなどが含まれます。\n</p>\n\n<p class=\"note\">\nこうした協力には、\nプライバシー、\n医療データのガバナンス、\n安全性、\n公平性に関する\n適切な保護措置が必要です。\n</p>\n\n</article>\n\n\u003c!-- WFP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n国際機関 02\n</span>\n\n<h3>WFP</h3>\n\n<p class=\"agency-full-name\">\n国連世界食糧計画\n</p>\n\n<div class=\"agency-field\">\n食料安全保障・サプライチェーン\n</div>\n\n<p>\nWFPは、\n飢餓と食料不安に対応する\n国連の人道支援機関です。\n</p>\n\n<p>\n主な活動には、\n緊急食料支援、\n栄養支援、\n食料関連危機に対する\nレジリエンスの強化などがあります。\n</p>\n\n<p>\nAIの活用が考えられる分野には、\n食料不安の予測、\nサプライチェーンのリスク分析、\n食料危機の早期警報、\n人道支援物流の計画改善\nなどが含まれます。\n</p>\n\n</article>\n\n\u003c!-- UNEP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n国際機関 03\n</span>\n\n<h3>UNEP</h3>\n\n<p class=\"agency-full-name\">\n国連環境計画\n</p>\n\n<div class=\"agency-field\">\n気候変動・環境\n</div>\n\n<p>\nUNEPは、\n国連における\n世界的な環境分野の\n中心的機関です。\n</p>\n\n<p>\n気候変動、\n生物多様性、\n汚染、\n資源管理、\n持続可能な開発に関する\n国際協力を支援しています。\n</p>\n\n<p>\nAI協力の可能性がある分野には、\n環境データの分析、\n気候リスク評価、\n生態系のモニタリング、\n大気・水質分析\nなどが含まれます。\n</p>\n\n</article>\n\n\u003c!-- UNHCR -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n国際機関 04\n</span>\n\n<h3>UNHCR</h3>\n\n<p class=\"agency-full-name\">\n国連難民高等弁務官事務所\n</p>\n\n<div class=\"agency-field\">\n難民保護・強制移動\n</div>\n\n<p>\nUNHCRは、\n難民、\n強制的に避難を余儀なくされた人々、\n無国籍者の保護と支援に\n取り組んでいます。\n</p>\n\n<p>\n主な責務には、\n国際的な保護、\n人道支援、\n避難問題の恒久的解決に向けた\n支援などがあります。\n</p>\n\n<p>\nAI協力の可能性がある分野には、\n人道支援ニーズの評価、\n保護サービスへのアクセス改善、\n避難に関連するリスク分析\nなどが含まれます。\n</p>\n\n<p class=\"note\">\nあらゆるAI活用において、\n人権、\nデータ保護、\n差別の防止、\n脆弱な立場にある人々の安全を\n最優先する必要があります。\n</p>\n\n</article>\n\n\u003c!-- IOM -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n国際機関 05\n</span>\n\n<h3>IOM</h3>\n\n<p class=\"agency-full-name\">\n国際移住機関\n</p>\n\n<div class=\"agency-field\">\n移住・避難\n</div>\n\n<p>\nIOMは、\n人道的かつ秩序ある移住を促進し、\n移住に関連する課題について\n国際協力を支援しています。\n</p>\n\n<p>\n主な活動には、\n移住者支援、\n移住政策への支援、\n人道的対応、\n避難を余儀なくされた人々への\n支援などがあります。\n</p>\n\n<p>\nAIの活用が考えられる分野には、\n移住政策の分析、\n移住者向けサービスへのアクセス改善、\n避難に関する人道的対応を支える\n情報提供などが含まれます。\n</p>\n\n</article>\n\n\u003c!-- ILO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n国際機関 06\n</span>\n\n<h3>ILO</h3>\n\n<p class=\"agency-full-name\">\n国際労働機関\n</p>\n\n<div class=\"agency-field\">\n雇用・仕事の未来\n</div>\n\n<p>\nILOは、\n社会正義、\n労働者の権利、\nディーセント・ワーク、\n国際労働基準を推進する\n国連の専門機関です。\n</p>\n\n<p>\n政府、\n使用者、\n労働者が参加する\n三者構成を特徴としています。\n</p>\n\n<p>\nAI協力の可能性がある分野には、\n労働市場の分析、\n将来の雇用予測、\n技能開発、\n雇用サービスの改善、\n技術転換期における\n労働者の保護などが含まれます。\n</p>\n\n</article>\n\n\u003c!-- ITU -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n国際機関 07\n</span>\n\n<h3>ITU</h3>\n\n<p class=\"agency-full-name\">\n国際電気通信連合\n</p>\n\n<div class=\"agency-field\">\n緊急通信・早期警報\n</div>\n\n<p>\nITUは、\nデジタル技術および\n情報通信技術を担当する\n国連の専門機関です。\n</p>\n\n<p>\n主な活動には、\n電気通信の標準化、\n通信接続、\nデジタルインフラ、\n緊急通信などがあります。\n</p>\n\n<p>\nAI協力の可能性がある分野には、\n災害時の通信、\nリスク情報の伝達、\n早期警報システム、\nデジタルアクセシビリティの改善\nなどが含まれます。\n</p>\n\n</article>\n\n\u003c!-- UNICEF -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n国際機関 08\n</span>\n\n<h3>UNICEF</h3>\n\n<p class=\"agency-full-name\">\n国連児童基金\n</p>\n\n<div class=\"agency-field\">\n子どもの保護・教育\n</div>\n\n<p>\nUNICEFは、\n子どもの権利を保護し、\n健康、\n教育、\n安全、\n総合的な福祉の向上に\n取り組んでいます。\n</p>\n\n<p>\n主な活動には、\n子どもの保護、\n教育へのアクセス改善、\n脆弱な立場にある子どもへの支援、\n緊急支援などがあります。\n</p>\n\n<p>\nAIの活用が考えられる分野には、\n教育のアクセシビリティ、\n学習支援、\n子どもの福祉に関する情報分析、\nデジタル格差の縮小\nなどが含まれます。\n</p>\n\n<p class=\"note\">\n子どもの権利、\nプライバシー、\n安全、\n教育の公平性、\n責任あるAIガバナンスを\n中心的な原則とする必要があります。\n</p>\n\n</article>\n\n\u003c!-- UNDP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n国際機関 09\n</span>\n\n<h3>UNDP</h3>\n\n<p class=\"agency-full-name\">\n国連開発計画\n</p>\n\n<div class=\"agency-field\">\n危機対応・持続可能な開発\n</div>\n\n<p>\nUNDPは、\n貧困、\n不平等、\nガバナンス上の課題、\n持続可能な開発への対応を\n各国で支援しています。\n</p>\n\n<p>\n主な活動には、\n制度的能力の開発、\n危機対応、\n復興、\n持続可能な開発目標の\n達成支援などがあります。\n</p>\n\n<p>\nAI協力の可能性がある分野には、\n開発政策の分析、\n複合的危機の評価、\n公共サービスの改善、\nデータに基づく\n持続可能な開発計画\nなどが含まれます。\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. 国際AI協力の枠組み\n===================================== -->\n\n<section>\n\n<h2>\n3. 国際AI協力の枠組み\n</h2>\n\n<p>\n国際機関は、\n専門的な知識、\n世界的なネットワーク、\n複雑な開発課題や\n人道的課題への対応経験を\n有しています。\n</p>\n\n<p>\n大学、\n研究機関、\n技術企業は、\n研究能力、\nAIに関する専門知識、\n技術革新を通じて\n貢献する可能性があります。\n</p>\n\n<p>\n構想中のグローバルAIハブは、\nこうした相互補完的な強みを\n実践的な国際協力によって\n結び付ける機会を\n探ることを目指しています。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\n共同研究\n</h3>\n\n<p>\n地球規模の課題に関連する\n研究テーマを特定し、\n共同研究プロジェクトの\n可能性を検討します。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n責任あるAI実証事業\n</h3>\n\n<p>\n安全性、\n有効性、\n倫理的影響を評価しながら、\n公共の利益に資する\nAI実証事業の可能性を\n探ります。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n政策対話と知識交流\n</h3>\n\n<p>\n国際会議、\n専門家による対話、\n政策学習、\n研究成果の共有などの\n機会を支援します。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n専門人材の育成と能力開発\n</h3>\n\n<p>\n国際協力と責任あるAIに関する\n教育、\n研修、\n専門家交流、\n能力開発の取り組みを\n検討します。\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n国際的な専門知識<br>\n＋ 責任あるAIイノベーション<br>\n＋ 機関間協力\n</strong>\n\n<p>\n本構想は、\n参加機関それぞれの使命と\n優先課題に沿った\n実践的な解決策を\n促進することを目指しています。\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     4. なぜ高陽特例市なのか？\n===================================== -->\n\n<section>\n\n<h2>\n4. なぜ高陽特例市なのか？\n</h2>\n\n<p>\n高陽特例市は、\n大韓民国・京畿道に位置し、\nソウル首都圏に属しています。\n</p>\n\n<p>\n既存の地域資源には、\nKINTEXを中心とする\n国際展示・コンベンション施設、\n国立がんセンターなどの医療機関、\n都市サービス、\n文化施設、\n長項湿地を含む生態資源があります。\n</p>\n\n<p>\nこれらの資源は、\n公衆衛生、\n環境の持続可能性、\n災害への対応力、\nAIを活用したイノベーションに関する\n国際協力の可能性を\n検討するための基盤となります。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nグローバルAIハブ構想は、\n国際協力を、\n研究、\nイノベーション、\n専門職雇用、\n持続可能な地域発展の\n新たな機会へと\n結び付けることを目指しています。\n</strong>\n\n</div>\n\n<p>\n実際の経済的成果や雇用への影響は、\n将来の機関参加の規模、\n協力事業の内容、\n最終的に整備される運営体制などに\nよって異なります。\n</p>\n\n<a\n  href=\"goyang.html?lang=ja\"\n  class=\"button\"\n>\n  高陽特例市の強みを見る\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     5. 3段階の発展戦略\n===================================== -->\n\n<section>\n\n<h2>\n5. 3段階の発展戦略\n</h2>\n\n<p>\n本構想の戦略では、\n国際協力を成功させるために、\n初期拠点の整備、\n持続可能な運営、\n長期的な共生発展を\n重視しています。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\n第1段階 — 初期拠点の整備\n</h3>\n\n<p>\n参加を検討する機関に必要な\n事務所施設、\n交通、\n住宅、\n医療、\n教育、\nその他の基本サービスについて、\n要件を評価します。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n第2段階 — 運営支援\n</h3>\n\n<p>\n関係する公共機関、\n大学、\n研究機関、\n企業、\n市民社会の間での\n連携の可能性を探り、\n国際協力、\nAI研究、\n実証事業、\n専門家交流を支援する\n方法を検討します。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n第3段階 — 共生発展\n</h3>\n\n<p>\n参加機関の使命の実現に\n貢献するとともに、\n地域のイノベーション、\n専門職雇用、\n企業活動、\n持続可能な経済発展を\n促進する機会を探ります。\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n初期拠点の整備<br>\n→ 運営支援<br>\n→ 共生発展\n</strong>\n\n<p>\n具体的な事業、\n資金調達、\n施設、\n機関への支援措置などには、\n関係当局との協議と\n正式な決定が必要です。\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     6. 制度的位置づけ\n===================================== -->\n\n<section>\n\n<h2>\n6. 制度的位置づけと今後の課題\n</h2>\n\n<p>\n高陽特例市のグローバルAIハブは、\n市民推進委員会が支持する\n提案段階の構想として\n紹介されています。\n</p>\n\n<p>\n9つの国際機関を紹介しているのは、\n本構想との間に\n将来的な協力分野の\n関連性があるためです。\n</p>\n\n<p>\nこれは、\n各国際機関による\n正式な協力関係、\n支持表明、\n移転決定、\nまたは参加の確約が\n成立していることを\n意味するものではありません。\n</p>\n\n<p>\n将来的な協力には、\n関係機関との適切な協議と、\nそれぞれの機関の\n正式な手続きに基づく\n決定が必要です。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n本構想は、\n相互の利益と\n国際的に認められた原則に基づき、\n建設的な対話、\n機関間協力、\n責任ある計画策定を\n促進することを目指しています。\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. 市民参加と国際協力\n===================================== -->\n\n<section>\n\n<h2>\n7. 市民参加と国際協力\n</h2>\n\n<p>\n市民推進委員会は、\nグローバルAIハブ構想に対する\n市民の理解を広げ、\n高陽特例市の将来の発展に関する\n建設的な議論への参加を\n促進することを目指しています。\n</p>\n\n<p>\n本構想は、\n市民参加と\n国際協力、\n研究、\n責任あるAIイノベーションの\n可能性を結び付けることを\n目指しています。\n</p>\n\n<a\n  href=\"index.html?lang=ja\"\n  class=\"button\"\n>\n  日本語ホーム\n</a>\n\n<a\n  href=\"agencies.html\"\n  class=\"button\"\n  lang=\"ko\"\n>\n  韓国語原文を見る\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     フッター\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nグローバルAIハブ構想<br>\n大韓民国・京畿道 高陽特例市\n</strong>\n</p>\n\n<p>\n高陽特例市グローバルAIハブ誘致<br>\n市民推進委員会\n</p>\n\n<p>\n人類のための人工知能。<br>\nより良い未来に向けた国際協力。\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ja\">\n日本語ホーム\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"agencies.html\" lang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
