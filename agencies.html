us: 10px;\n  border-top:\n    5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.agency-number {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 4px 12px;\n  border-radius: 6px;\n  font-size: 14px;\n  margin-bottom: 12px;\n}\n\n.agency-name {\n  font-size: 19px;\n  font-weight: bold;\n  color: #0754a6;\n}\n\n.agency-full-name {\n  font-size: 14px;\n  color: #53647a;\n  margin-bottom: 15px;\n}\n\n.agency-field {\n  background: #eaf4ff;\n  border-radius: 7px;\n  padding: 12px;\n  margin: 15px 0;\n  font-weight: bold;\n  color: #0754a6;\n}\n\n/* 강조 */\n\n.highlight {\n  background: #eaf4ff;\n  border-left:\n    5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* 버튼 */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover,\n.button:focus-visible {\n  background: #003a7a;\n}\n\n/* 하단 */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* 모바일 */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n<header>\n\n<h1>\n9개 국제기구 협력 구상\n</h1>\n\n<p>\n글로벌 AI 허브를 통해<br>\n국제기구의 전문성과 인공지능 기술을 연결합니다.\n</p>\n\n<a href=\"index.html\"\nclass=\"home-link\">\n← 홈페이지로 돌아가기\n</a>\n\n</header>\n\n<main>\n\n\u003c!-- 핵심 구호 -->\n\n<section>\n\n<div class=\"slogan\">\n\nAI 기술을 인류 공동의 이익으로!<br>\n국제협력의 새로운 거점,<br>\n글로벌 AI 허브 고양특례시!\n\n</div>\n\n</section>\n\n\u003c!-- 소개 -->\n\n<section>\n\n<h2>\n글로벌 AI 허브와 9개 국제기구\n</h2>\n\n<p>\n글로벌 AI 허브는 국제기구와 정부,\n대학, 연구기관, 기업 및 시민사회가\n협력하여 인공지능 기술을\n인류 공동의 문제 해결에 활용하는\n국제협력 거점을 지향합니다.\n</p>\n\n<p>\n보건의료와 식량안보,\n기후변화와 환경,\n난민과 국제이주,\n노동과 일자리,\n재난통신과 조기경보,\n아동 보호와 교육,\n복합위기 대응과 국가회복 등\n다양한 분야에서\nAI 기술을 활용한\n국제협력 가능성을 모색합니다.\n</p>\n\n<p>\n이러한 국제협력 구상과 관련하여\n다음 9개 국제기구의\n전문 분야와 역할을 소개합니다.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n글로벌 AI 허브의 목표는\n국제기구의 단순한 입주가 아니라,\n국제기구의 전문성과\nAI 기술을 연결하여\n인류 공동의 문제 해결에\n실질적으로 기여하는 것입니다.\n</strong>\n\n</div>\n\n<p class=\"note\">\n※ 아래 국제기구들은\n글로벌 AI 허브 구상에서\n협력 가능성을 검토하는 대상입니다.\n각 국제기구의 참여, 이전,\n입주 또는 협력사업이\n확정되었다는 의미는 아닙니다.\n</p>\n\n</section>\n\n\u003c!-- 9개 국제기구 -->\n\n<section>\n\n<h2>\n9개 국제기구의 주요 역할과 AI 협력 분야\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- WHO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n국제기구 01\n</span>\n\n<h3>WHO</h3>\n\n<p class=\"agency-full-name\">\nWorld Health Organization<br>\n세계보건기구\n</p>\n\n<div class=\"agency-field\">\n보건의료 · 공공보건\n</div>\n\n<p>\nWHO는 국제 공중보건 분야의\n협력을 담당하는\n유엔 전문기구입니다.\n</p>\n\n<p>\n감염병 예방과 대응,\n공공보건 정책,\n보건의료체계 강화 및\n건강 증진 등을 위한\n국제협력을 수행합니다.\n</p>\n\n<p>\nAI를 활용한 감염병 위험 분석,\n질병 조기 탐지,\n공공보건 정보 분석,\n의료서비스 접근성 개선 등\n다양한 협력 가능성을\n검토할 수 있습니다.\n</p>\n\n</article>\n\n\u003c!-- WFP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n국제기구 02\n</span>\n\n<h3>WFP</h3>\n\n<p class=\"agency-full-name\">\nWorld Food Programme<br>\n세계식량계획\n</p>\n\n<div class=\"agency-field\">\n식량안보 · 식량 공급망\n</div>\n\n<p>\nWFP는 식량 위기에 대응하고\n취약계층에 식량 지원을 제공하는\n유엔의 인도적 지원 기구입니다.\n</p>\n\n<p>\n분쟁과 재난,\n기후변화 등으로 발생하는\n식량 위기에 대응하며\n식량안보 강화를 위한\n국제협력을 수행합니다.\n</p>\n\n<p>\nAI를 활용한 식량 수요 예측,\n공급망 위험 분석,\n식량 위기 조기경보 및\n인도적 지원 효율화 등의\n협력 가능성을 검토할 수 있습니다.\n</p>\n\n</article>\n\n\u003c!-- UNEP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n국제기구 03\n</span>\n\n<h3>UNEP</h3>\n\n<p class=\"agency-full-name\">\nUnited Nations Environment Programme<br>\n유엔환경계획\n</p>\n\n<div class=\"agency-field\">\n기후변화 · 환경\n</div>\n\n<p>\nUNEP는 국제사회의\n환경보호와 지속가능한 발전을\n지원하는 유엔의 환경 분야\n전문 프로그램입니다.\n</p>\n\n<p>\n기후변화와 생물다양성,\n오염과 자원관리 등\n다양한 환경문제 해결을 위한\n국제협력을 촉진합니다.\n</p>\n\n<p>\nAI를 활용한 환경정보 분석,\n기후위험 예측,\n생태계 변화 관측,\n대기와 수질 관리 등의\n협력 가능성을 검토할 수 있습니다.\n</p>\n\n</article>\n\n\u003c!-- UNHCR -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n국제기구 04\n</span>\n\n<h3>UNHCR</h3>\n\n<p class=\"agency-full-name\">\nUnited Nations High Commissioner for Refugees<br>\n유엔난민기구\n</p>\n\n<div class=\"agency-field\">\n난민 · 강제이주\n</div>\n\n<p>\nUNHCR은 난민과\n강제이주민 및 무국적자의\n보호와 지원을 담당하는\n유엔 기구입니다.\n</p>\n\n<p>\n분쟁과 박해 등으로\n삶의 터전을 떠난 사람들의\n안전과 권리를 보호하고\n인도적 지원을 수행합니다.\n</p>\n\n<p>\nAI를 활용한 인도적 지원 수요 분석,\n난민 보호 서비스 개선,\n재난과 분쟁에 따른\n이동 위험 분석 등의\n협력 가능성을 검토할 수 있습니다.\n</p>\n\n<p class=\"note\">\n개인정보 보호와 인권,\n차별 방지 및\n취약계층의 안전을\n우선적으로 고려해야 합니다.\n</p>\n\n</article>\n\n\u003c!-- IOM -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n국제기구 05\n</span>\n\n<h3>IOM</h3>\n\n<p class=\"agency-full-name\">\nInternational Organization for Migration<br>\n국제이주기구\n</p>\n\n<div class=\"agency-field\">\n국제이주 · 이재민\n</div>\n\n<p>\nIOM은 안전하고 질서 있는\n인도적인 이주를 촉진하는\n국제기구입니다.\n</p>\n\n<p>\n이주민 지원과\n이주 관련 정책 협력,\n재난과 분쟁으로 이동한\n사람들에 대한\n인도적 지원 등을 수행합니다.\n</p>\n\n<p>\nAI를 활용한 이주 관련\n정책정보 분석,\n재난 이재민 지원,\n이주민 서비스 접근성 개선 등\n국제협력 가능성을\n검토할 수 있습니다.\n</p>\n\n</article>\n\n\u003c!-- ILO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n국제기구 06\n</span>\n\n<h3>ILO</h3>\n\n<p class=\"agency-full-name\">\nInternational Labour Organization<br>\n국제노동기구\n</p>\n\n<div class=\"agency-field\">\n노동시장 · 일자리\n</div>\n\n<p>\nILO는 노동자의 권리 보호와\n양질의 일자리,\n사회적 보호 및\n국제노동기준의 발전을\n추진하는 유엔 전문기구입니다.\n</p>\n\n<p>\n정부와 사용자,\n노동자가 함께 참여하는\n사회적 대화를 통해\n노동 분야의 국제협력을\n촉진합니다.\n</p>\n\n<p>\nAI에 따른 노동시장 변화 분석,\n미래 일자리 전망,\n직업훈련과 고용서비스 개선,\n노동자 보호 등의\n협력 가능성을 검토할 수 있습니다.\n</p>\n\n</article>\n\n\u003c!-- ITU -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n국제기구 07\n</span>\n\n<h3>ITU</h3>\n\n<p class=\"agency-full-name\">\nInternational Telecommunication Union<br>\n국제전기통신연합\n</p>\n\n<div class=\"agency-field\">\n재난통신 · 조기경보\n</div>\n\n<p>\nITU는 정보통신기술과\n국제전기통신 분야의\n협력을 담당하는\n유엔 전문기구입니다.\n</p>\n\n<p>\n통신 표준과\n디지털 연결성,\n정보통신 인프라 및\n재난 대응 통신체계 등의\n국제협력을 촉진합니다.\n</p>\n\n<p>\nAI 기반 재난통신,\n위험정보 전달,\n조기경보 시스템,\n디지털 접근성 개선 등의\n협력 가능성을 검토할 수 있습니다.\n</p>\n\n</article>\n\n\u003c!-- UNICEF -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n국제기구 08\n</span>\n\n<h3>UNICEF</h3>\n\n<p class=\"agency-full-name\">\nUnited Nations Children's Fund<br>\n유엔아동기금\n</p>\n\n<div class=\"agency-field\">\n아동 보호 · 교육\n</div>\n\n<p>\nUNICEF는 아동의 생존과\n건강, 교육 및 보호를 위해\n활동하는 유엔 기구입니다.\n</p>\n\n<p>\n아동의 권리 보장과\n교육 접근성 개선,\n취약계층 지원 및\n긴급구호 활동 등을\n수행합니다.\n</p>\n\n<p>\nAI를 활용한 교육 접근성 개선,\n학습 지원,\n아동복지 정보 분석,\n디지털 격차 완화 등의\n협력 가능성을 검토할 수 있습니다.\n</p>\n\n<p class=\"note\">\n아동의 개인정보와 안전,\n교육의 형평성 및\nAI 활용의 윤리적 기준을\n우선적으로 고려해야 합니다.\n</p>\n\n</article>\n\n\u003c!-- UNDP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\n국제기구 09\n</span>\n\n<h3>UNDP</h3>\n\n<p class=\"agency-full-name\">\nUnited Nations Development Programme<br>\n유엔개발계획\n</p>\n\n<div class=\"agency-field\">\n복합위기 · 국가회복\n</div>\n\n<p>\nUNDP는 빈곤과 불평등 해소,\n지속가능한 발전,\n위기 대응 및\n국가 발전 역량 강화를\n지원하는 유엔 개발기구입니다.\n</p>\n\n<p>\n지속가능발전목표 달성과\n국가 및 지역사회의\n회복력 강화를 위한\n국제협력을 수행합니다.\n</p>\n\n<p>\nAI를 활용한 개발정책 분석,\n복합위기 대응,\n공공서비스 개선,\n지속가능발전 정책 지원 등의\n협력 가능성을 검토할 수 있습니다.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- 국제협력 구조 -->\n\n<section>\n\n<h2>\n국제기구와 AI 기술의 협력 방식\n</h2>\n\n<p>\n국제기구는 각 분야의\n전문성과 국제협력 경험을\n보유하고 있습니다.\n</p>\n\n<p>\n대학과 연구기관,\n기업은 AI 기술과\n연구개발 역량을\n제공할 수 있습니다.\n</p>\n\n<p>\n글로벌 AI 허브는\n이러한 역량을 연결하여\n공동연구와 정책 협력,\n기술 실증 및\n전문인력 교류가 이루어지는\n국제협력 플랫폼을 지향합니다.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>국제 공동연구</h3>\n\n<p>\n인류 공동의 문제 해결을 위한\n연구 주제를 발굴하고\n기관 간 공동연구를\n모색합니다.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>AI 기술 실증</h3>\n\n<p>\n공공 분야의 실제 수요에 맞는\nAI 기술을 검토하고\n안전성과 효과를 확인하는\n시범사업을 모색합니다.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>정책과 정보 교류</h3>\n\n<p>\n국제회의와 세미나,\n전문가 교류 등을 통해\n정책 경험과 연구 성과를\n공유하는 협력 기반을\n마련하고자 합니다.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>전문인력 양성</h3>\n\n<p>\n국제협력과 공공 AI 분야의\n전문인력 양성,\n교육 및 교류 프로그램을\n추진하는 방안을 검토합니다.\n</p>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- 고양특례시 유치 필요성 -->\n\n<section>\n\n<h2>\n왜 고양특례시인가?\n</h2>\n\n<p>\n고양특례시는 수도권 접근성과\n킨텍스를 중심으로 한\n국제회의·전시 기반,\n국립암센터 등 의료기관,\n교육·문화시설 및\n다양한 정주환경을 갖추고 있습니다.\n</p>\n\n<p>\n또한 장항습지 등\n생태환경 자산을 보유하고 있어\n보건의료와 기후환경,\n재난안전 및\n지속가능발전 분야의\n국제협력 가능성을\n검토할 수 있습니다.\n</p>\n\n<p>\n이러한 도시 자산은\n국제기구와 연구기관,\n기업 간 협력을 지원하는\n글로벌 AI 허브의\n유치 경쟁력을 높이는\n기반이 될 수 있습니다.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n글로벌 AI 허브 유치는\n고양특례시의 새로운 성장동력을 확보하고,\n양질의 일자리와\n청년의 미래 기회를 확대하며,\n지역경제 활성화를 도모하기 위한\n미래 전략입니다.\n</strong>\n\n</div>\n\n<p>\n국제협력과 연구개발 활동이\n실제로 확대될 경우\n전문인력 수요와\n기업 활동,\n국제회의 및\n관련 서비스 분야에서\n새로운 경제적 기회가\n형성될 가능성이 있습니다.\n</p>\n\n<p>\n다만 실제 경제적 효과는\n유치 규모와 참여기관,\n협력사업의 내용 및\n운영 방식에 따라\n달라질 수 있습니다.\n</p>\n\n<a href=\"goyang.html\"\nclass=\"button\">\n고양특례시 유치 경쟁력 보기\n</a>\n\n</section>\n\n\u003c!-- 3단계 전략 -->\n\n<section>\n\n<h2>\n국제기구 초기 안착·운영 지원·동반 성장\n</h2>\n\n<p>\n글로벌 AI 허브 유치의 성공을 위해서는\n국제기구의 초기 정착부터\n안정적인 운영과\n지역사회와의 동반 성장까지\n함께 고려해야 합니다.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\n1단계 — 초기 안착\n</h3>\n\n<p>\n국제기구와 협력기관이\n고양특례시에 안정적으로\n정착할 수 있도록\n업무공간과 교통,\n주거, 의료, 교육 및\n생활환경 등 필요한 여건을\n검토합니다.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n2단계 — 운영 지원\n</h3>\n\n<p>\n경기도와 고양특례시,\n정부 및 관계기관,\n대학과 연구기관,\n기업 및 시민사회의\n역량을 연결하여\n국제협력사업과\n공공 AI 연구개발,\n기술 실증 및\n전문인력 교류를\n지원하는 방안을 모색합니다.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n3단계 — 동반 성장\n</h3>\n\n<p>\n국제기구의 설립 목적과\n지속가능발전목표 달성에\n기여하면서\n고양특례시에도\n새로운 산업과 일자리,\n기업 활동 및\n지역경제 성장의 기회가\n확대되도록 추진합니다.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n초기 안착 → 운영 지원 → 동반 성장\n</strong>\n\n<p>\n구체적인 사업과 지원 규모는\n관계기관의 협의와\n공식적인 절차를 통해\n결정되어야 합니다.\n</p>\n\n</div>\n\n<a href=\"strategy.html\"\nclass=\"button\">\n글로벌 AI 허브 유치 전략 보기\n</a>\n\n</section>\n\n\u003c!-- 시민 참여 -->\n\n<section>\n\n<h2>\n시민의 참여가 국제협력도시의 미래를 만듭니다\n</h2>\n\n<p>\n글로벌 AI 허브 유치는\n고양특례시의 새로운 성장동력과\n양질의 일자리,\n지역경제의 미래를\n준비하는 공동의 과제입니다.\n</p>\n\n<p>\n범시민추진위원회는\n시민의 자발적인 참여를 바탕으로\n유치 필요성을 알리고\n정책과 협력 기반을\n마련하기 위해 노력하겠습니다.\n</p>\n\n<p>\n온라인 유치 동의 서명과\n범시민추진위원 등록,\n후원회원 가입 및\n홍보활동에 함께해 주십시오.\n</p>\n\n<a href=\"participate.html\"\nclass=\"button\">\n시민참여센터 바로가기\n</a>\n\n</section>\n\n</main>\n\n<footer>\n\n<p>\n<strong>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</strong>\n</p>\n\n<p>\n시민의 힘으로, 경기도의 역량으로, 세계와 함께!\n</p>\n\n<p>\n<a href=\"index.html\">\n홈페이지로 돌아가기\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=ar": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nالمنظمات الدولية |\nمبادرة المركز العالمي للذكاء الاصطناعي في غويانغ\n</title>\n\n<meta\n  name=\"description\"\n  content=\"تعرف على مجالات التعاون المحتملة في الذكاء الاصطناعي مع منظمة الصحة العالمية وبرنامج الأغذية العالمي وبرنامج الأمم المتحدة للبيئة والمفوضية السامية لشؤون اللاجئين والمنظمة الدولية للهجرة ومنظمة العمل الدولية والاتحاد الدولي للاتصالات واليونيسف وبرنامج الأمم المتحدة الإنمائي ضمن مبادرة المركز العالمي للذكاء الاصطناعي في غويانغ.\"\n>\n\n<style>\n\n/* =====================================\n   BASIC SETTINGS\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  direction: rtl;\n  font-family:\n    Tahoma,\n    Arial,\n    \"Noto Naskh Arabic\",\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.9;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   HEADER\n===================================== */\n\nheader {\n  background:\n    linear-gradient(\n      135deg,\n      #0754a6,\n      #10315e\n    );\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.5;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 20px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n/* =====================================\n   MAIN CONTENT\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n}\n\nh2 {\n  margin-top: 0;\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.8;\n}\n\n/* =====================================\n   CARDS\n===================================== */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.agency-number {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 4px 12px;\n  border-radius: 6px;\n  font-size: 14px;\n  margin-bottom: 12px;\n}\n\n.agency-full-name {\n  font-size: 15px;\n  color: #53647a;\n  margin-bottom: 15px;\n}\n\n.agency-field {\n  background: #eaf4ff;\n  border-radius: 7px;\n  padding: 12px;\n  margin: 15px 0;\n  font-weight: bold;\n  color: #0754a6;\n}\n\n/* =====================================\n   HIGHLIGHTS\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-right: 5px solid #168de0;\n  border-left: none;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* =====================================\n   BUTTONS\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 0 0 10px;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   FOOTER\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-left: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header>\n\n<h1>\nالمنظمات الدولية<br>\nوالتعاون المحتمل في مجال الذكاء الاصطناعي\n</h1>\n\n<p>\nربط الخبرات الدولية<br>\nبتقنيات الذكاء الاصطناعي\n</p>\n\n<p>\nمبادرة المركز العالمي للذكاء الاصطناعي<br>\nمدينة غويانغ الخاصة، جمهورية كوريا\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ar\"\n  class=\"home-link\"\n>\n→ الصفحة الرئيسية العربية\n</a>\n\n<a\n  href=\"agencies.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     VISION\n===================================== -->\n\n<section>\n\n<div class=\"slogan\">\n\nالذكاء الاصطناعي من أجل الإنسانية.<br>\nالتعاون الدولي من أجل مستقبل أفضل.<br>\nمبادرة المركز العالمي للذكاء الاصطناعي في غويانغ.\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     1. INTRODUCTION\n===================================== -->\n\n<section>\n\n<h2>\n1. المركز العالمي للذكاء الاصطناعي والمنظمات الدولية\n</h2>\n\n<p>\nيُتصوَّر المركز العالمي المقترح\nللذكاء الاصطناعي\nبوصفه منصة للتعاون الدولي\nتربط خبرات المنظمات الدولية\nبالتطورات الحديثة\nفي مجال الذكاء الاصطناعي.\n</p>\n\n<p>\nتسعى المبادرة إلى استكشاف\nكيفية مساهمة التطبيقات المسؤولة\nللذكاء الاصطناعي\nفي مواجهة التحديات العالمية\nفي مجالات الصحة العامة،\nوالأمن الغذائي،\nوتغير المناخ،\nوحماية البيئة،\nوالمساعدات الإنسانية،\nوالهجرة،\nوالتوظيف،\nوالتعليم،\nوالقدرة على مواجهة الكوارث،\nوالتنمية المستدامة.\n</p>\n\n<p>\nويمكن للمنظمات الدولية،\nوالحكومات،\nوالجامعات،\nوالمؤسسات البحثية،\nوالشركات،\nوالمجتمع المدني\nأن تسهم بخبراتها المختلفة\nفي الأنشطة التعاونية.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nلا يقتصر هدف المركز العالمي المقترح\nللذكاء الاصطناعي\nعلى استقطاب مكاتب المنظمات الدولية.\n</strong>\n\n<p>\nبل يتمثل هدفه الأوسع\nفي استكشاف فرص التعاون الفعّال\nالذي يربط الخبرات الدولية\nبالبحث والابتكار\nفي مجال الذكاء الاصطناعي\nلمواجهة التحديات العالمية المشتركة.\n</p>\n\n</div>\n\n<p class=\"note\">\n<strong>توضيح مهم:</strong>\nتم تحديد المنظمات التسع\nالمذكورة أدناه\nباعتبارها جهات محتملة للتواصل\nاستناداً إلى اختصاصاتها.\nولا يعني إدراجها\nتأكيد مشاركتها،\nأو انتقالها،\nأو إنشاء مكاتب لها،\nأو إبرام شراكات معها.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     2. NINE INTERNATIONAL ORGANIZATIONS\n===================================== -->\n\n<section>\n\n<h2>\n2. تسع منظمات دولية ومجالات التعاون المحتملة\nفي الذكاء الاصطناعي\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- WHO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nالمنظمة 01\n</span>\n\n<h3><bdi>WHO</bdi></h3>\n\n<p class=\"agency-full-name\">\nمنظمة الصحة العالمية\n</p>\n\n<div class=\"agency-field\">\nالصحة العامة والرعاية الصحية\n</div>\n\n<p>\nمنظمة الصحة العالمية\nهي وكالة متخصصة\nتابعة للأمم المتحدة\nومسؤولة عن الصحة العامة الدولية.\n</p>\n\n<p>\nتشمل أعمالها الوقاية من الأمراض،\nوالاستعداد للطوارئ الصحية،\nوتعزيز النظم الصحية،\nوالتعاون الصحي الدولي.\n</p>\n\n<p>\nقد تشمل مجالات التعاون المحتملة\nفي الذكاء الاصطناعي\nمراقبة الأمراض،\nوالكشف المبكر عن المخاطر الصحية،\nوتحليل بيانات الصحة العامة،\nوتحسين الوصول\nإلى خدمات الرعاية الصحية.\n</p>\n\n<p class=\"note\">\nيتطلب هذا التعاون\nضمانات مناسبة\nلحماية الخصوصية،\nوحوكمة البيانات الصحية،\nوالسلامة،\nوالإنصاف.\n</p>\n\n</article>\n\n\u003c!-- WFP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nالمنظمة 02\n</span>\n\n<h3><bdi>WFP</bdi></h3>\n\n<p class=\"agency-full-name\">\nبرنامج الأغذية العالمي\n</p>\n\n<div class=\"agency-field\">\nالأمن الغذائي وسلاسل الإمداد\n</div>\n\n<p>\nبرنامج الأغذية العالمي\nمنظمة إنسانية تابعة للأمم المتحدة\nتعمل على مكافحة الجوع\nوانعدام الأمن الغذائي.\n</p>\n\n<p>\nتشمل أنشطته\nتقديم المساعدات الغذائية الطارئة،\nودعم التغذية،\nوتعزيز القدرة على الصمود\nأمام الأزمات الغذائية.\n</p>\n\n<p>\nقد تشمل تطبيقات الذكاء الاصطناعي\nالتنبؤ بانعدام الأمن الغذائي،\nوتحليل مخاطر سلاسل الإمداد،\nوالإنذار المبكر بالأزمات الغذائية،\nوتحسين تخطيط\nالخدمات اللوجستية الإنسانية.\n</p>\n\n</article>\n\n\u003c!-- UNEP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nالمنظمة 03\n</span>\n\n<h3><bdi>UNEP</bdi></h3>\n\n<p class=\"agency-full-name\">\nبرنامج الأمم المتحدة للبيئة\n</p>\n\n<div class=\"agency-field\">\nتغير المناخ والبيئة\n</div>\n\n<p>\nيُعد برنامج الأمم المتحدة للبيئة\nالجهة البيئية العالمية الرائدة\nفي منظومة الأمم المتحدة.\n</p>\n\n<p>\nويدعم التعاون الدولي\nفي مجالات تغير المناخ،\nوالتنوع البيولوجي،\nوالتلوث،\nوإدارة الموارد،\nوالتنمية المستدامة.\n</p>\n\n<p>\nقد يشمل التعاون المحتمل\nفي الذكاء الاصطناعي\nتحليل البيانات البيئية،\nوتقييم المخاطر المناخية،\nومراقبة النظم البيئية،\nوتحليل جودة الهواء والمياه.\n</p>\n\n</article>\n\n\u003c!-- UNHCR -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nالمنظمة 04\n</span>\n\n<h3><bdi>UNHCR</bdi></h3>\n\n<p class=\"agency-full-name\">\nالمفوضية السامية للأمم المتحدة لشؤون اللاجئين\n</p>\n\n<div class=\"agency-field\">\nحماية اللاجئين والنزوح القسري\n</div>\n\n<p>\nتعمل المفوضية السامية\nللأمم المتحدة لشؤون اللاجئين\nعلى حماية ومساعدة اللاجئين،\nوالأشخاص النازحين قسراً،\nوعديمي الجنسية.\n</p>\n\n<p>\nتشمل مسؤولياتها\nتوفير الحماية الدولية،\nوالمساعدات الإنسانية،\nودعم الحلول الدائمة\nلمشكلات النزوح.\n</p>\n\n<p>\nقد يشمل التعاون المحتمل\nفي الذكاء الاصطناعي\nتقييم الاحتياجات الإنسانية،\nوتحسين الوصول\nإلى خدمات الحماية،\nوتحليل المخاطر\nالمرتبطة بالنزوح.\n</p>\n\n<p class=\"note\">\nيجب أن تعطي أي تطبيقات\nالأولوية لحقوق الإنسان،\nوحماية البيانات،\nوعدم التمييز،\nوسلامة الفئات الضعيفة.\n</p>\n\n</article>\n\n\u003c!-- IOM -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nالمنظمة 05\n</span>\n\n<h3><bdi>IOM</bdi></h3>\n\n<p class=\"agency-full-name\">\nالمنظمة الدولية للهجرة\n</p>\n\n<div class=\"agency-field\">\nالهجرة والنزوح\n</div>\n\n<p>\nتعمل المنظمة الدولية للهجرة\nعلى تعزيز الهجرة الإنسانية والمنظمة،\nودعم التعاون الدولي\nفي القضايا المتعلقة بالهجرة.\n</p>\n\n<p>\nتشمل أنشطتها\nمساعدة المهاجرين،\nودعم سياسات الهجرة،\nوالاستجابة الإنسانية،\nومساعدة السكان النازحين.\n</p>\n\n<p>\nقد تشمل تطبيقات الذكاء الاصطناعي\nتحليل سياسات الهجرة،\nوتحسين الوصول\nإلى خدمات المهاجرين،\nوتقديم الدعم المعلوماتي\nللاستجابات الإنسانية\nلحالات النزوح.\n</p>\n\n</article>\n\n\u003c!-- ILO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nالمنظمة 06\n</span>\n\n<h3><bdi>ILO</bdi></h3>\n\n<p class=\"agency-full-name\">\nمنظمة العمل الدولية\n</p>\n\n<div class=\"agency-field\">\nالتوظيف ومستقبل العمل\n</div>\n\n<p>\nمنظمة العمل الدولية\nهي وكالة متخصصة\nتابعة للأمم المتحدة\nتعمل على تعزيز العدالة الاجتماعية،\nوحقوق العمال،\nوالعمل اللائق،\nومعايير العمل الدولية.\n</p>\n\n<p>\nويجمع هيكلها الثلاثي\nالحكومات،\nوأصحاب العمل،\nوالعمال.\n</p>\n\n<p>\nقد يشمل التعاون المحتمل\nفي الذكاء الاصطناعي\nتحليل أسواق العمل،\nوالتنبؤ باتجاهات التوظيف المستقبلية،\nوتنمية المهارات،\nوتحسين خدمات التوظيف،\nوحماية العمال\nخلال التحولات التكنولوجية.\n</p>\n\n</article>\n\n\u003c!-- ITU -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nالمنظمة 07\n</span>\n\n<h3><bdi>ITU</bdi></h3>\n\n<p class=\"agency-full-name\">\nالاتحاد الدولي للاتصالات\n</p>\n\n<div class=\"agency-field\">\nاتصالات الطوارئ والإنذار المبكر\n</div>\n\n<p>\nالاتحاد الدولي للاتصالات\nهو وكالة متخصصة\nتابعة للأمم المتحدة\nمعنية بالتقنيات الرقمية\nوتكنولوجيا المعلومات والاتصالات.\n</p>\n\n<p>\nتشمل أعماله\nوضع معايير الاتصالات،\nوتعزيز الاتصال الرقمي،\nوالبنية التحتية الرقمية،\nواتصالات الطوارئ.\n</p>\n\n<p>\nقد يشمل التعاون المحتمل\nفي الذكاء الاصطناعي\nاتصالات الكوارث،\nونشر المعلومات المتعلقة بالمخاطر،\nوأنظمة الإنذار المبكر،\nوتحسين إمكانية الوصول الرقمي.\n</p>\n\n</article>\n\n\u003c!-- UNICEF -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nالمنظمة 08\n</span>\n\n<h3><bdi>UNICEF</bdi></h3>\n\n<p class=\"agency-full-name\">\nمنظمة الأمم المتحدة للطفولة\n</p>\n\n<div class=\"agency-field\">\nحماية الأطفال والتعليم\n</div>\n\n<p>\nتعمل منظمة الأمم المتحدة للطفولة\nعلى حماية حقوق الأطفال،\nوتحسين صحتهم،\nوتعليمهم،\nوسلامتهم،\nورفاههم العام.\n</p>\n\n<p>\nتشمل أنشطتها\nحماية الأطفال،\nوتوسيع فرص الوصول إلى التعليم،\nودعم الأطفال المعرضين للخطر،\nوتقديم المساعدات في حالات الطوارئ.\n</p>\n\n<p>\nقد تشمل تطبيقات الذكاء الاصطناعي\nتحسين إمكانية الوصول إلى التعليم،\nودعم التعلم،\nوتحليل معلومات رفاه الأطفال،\nوالحد من أوجه عدم المساواة الرقمية.\n</p>\n\n<p class=\"note\">\nيجب أن تظل حقوق الأطفال،\nوالخصوصية،\nوالسلامة،\nوالإنصاف التعليمي،\nوالحوكمة المسؤولة للذكاء الاصطناعي\nاعتبارات أساسية.\n</p>\n\n</article>\n\n\u003c!-- UNDP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nالمنظمة 09\n</span>\n\n<h3><bdi>UNDP</bdi></h3>\n\n<p class=\"agency-full-name\">\nبرنامج الأمم المتحدة الإنمائي\n</p>\n\n<div class=\"agency-field\">\nالاستجابة للأزمات والتنمية المستدامة\n</div>\n\n<p>\nيدعم برنامج الأمم المتحدة الإنمائي\nالبلدان في معالجة الفقر،\nوعدم المساواة،\nوتحديات الحوكمة،\nوقضايا التنمية المستدامة.\n</p>\n\n<p>\nتشمل أنشطته\nتنمية القدرات المؤسسية،\nوالاستجابة للأزمات،\nوالتعافي،\nودعم أهداف التنمية المستدامة.\n</p>\n\n<p>\nقد يشمل التعاون المحتمل\nفي الذكاء الاصطناعي\nتحليل سياسات التنمية،\nوتقييم الأزمات المعقدة،\nوتحسين الخدمات العامة،\nوالتخطيط القائم على البيانات\nمن أجل التنمية المستدامة.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     3. COOPERATION FRAMEWORK\n===================================== -->\n\n<section>\n\n<h2>\n3. إطار التعاون الدولي في مجال الذكاء الاصطناعي\n</h2>\n\n<p>\nتتمتع المنظمات الدولية\nبمعارف متخصصة،\nوشبكات عالمية،\nوخبرات في مواجهة\nالتحديات الإنمائية والإنسانية المعقدة.\n</p>\n\n<p>\nويمكن للجامعات،\nوالمؤسسات البحثية،\nوشركات التكنولوجيا\nأن تسهم بقدراتها البحثية،\nوخبراتها في الذكاء الاصطناعي،\nوابتكاراتها التكنولوجية.\n</p>\n\n<p>\nتسعى مبادرة المركز العالمي\nللذكاء الاصطناعي\nإلى استكشاف فرص الربط\nبين هذه القدرات المتكاملة\nمن خلال التعاون الدولي العملي.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nالبحث المشترك\n</h3>\n\n<p>\nتحديد الأسئلة البحثية\nالمرتبطة بالتحديات العالمية،\nواستكشاف مشاريع\nالبحث التعاوني.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالمشاريع التجريبية للذكاء الاصطناعي المسؤول\n</h3>\n\n<p>\nاستكشاف مشاريع تجريبية\nللذكاء الاصطناعي\nتستجيب لاحتياجات المصلحة العامة،\nمع تقييم السلامة،\nوالفعالية،\nوالآثار الأخلاقية.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nتبادل السياسات والمعرفة\n</h3>\n\n<p>\nدعم فرص الاجتماعات الدولية،\nوالحوار بين الخبراء،\nوالتعلم في مجال السياسات،\nوتبادل نتائج البحوث.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nتنمية القدرات\n</h3>\n\n<p>\nاستكشاف فرص التعليم،\nوالتدريب،\nوالتبادل المهني،\nومبادرات بناء القدرات\nفي التعاون الدولي\nوالذكاء الاصطناعي المسؤول.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nالخبرات الدولية\n+ الابتكار المسؤول في الذكاء الاصطناعي\n+ التعاون المؤسسي\n</strong>\n\n<p>\nيسعى الإطار المقترح\nإلى تشجيع الحلول العملية\nالتي تتوافق مع اختصاصات\nوأولويات المؤسسات المشاركة.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     4. WHY GOYANG\n===================================== -->\n\n<section>\n\n<h2>\n4. لماذا مدينة غويانغ الخاصة؟\n</h2>\n\n<p>\nتقع مدينة غويانغ الخاصة\nفي مقاطعة غيونغي\nضمن منطقة العاصمة سيول\nفي جمهورية كوريا.\n</p>\n\n<p>\nتشمل مواردها الحالية\nالبنية التحتية للمؤتمرات\nوالمعارض الدولية\nالمتمركزة حول مركز كينتكس\n(<bdi>KINTEX</bdi>)،\nوالمؤسسات الصحية\nمثل المركز الوطني للسرطان،\nوالخدمات الحضرية،\nوالمرافق الثقافية،\nوالموارد البيئية،\nبما في ذلك أراضي جانغهانغ الرطبة.\n</p>\n\n<p>\nتوفر هذه الموارد\nأساساً لاستكشاف التعاون الدولي\nفي مجالات الصحة العامة،\nوالاستدامة البيئية،\nوالقدرة على مواجهة الكوارث،\nوالابتكار المدعوم\nبالذكاء الاصطناعي.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nتسعى مبادرة المركز العالمي\nللذكاء الاصطناعي\nإلى ربط التعاون الدولي\nبفرص جديدة\nللبحث والابتكار،\nوالتوظيف المهني،\nوالتنمية الإقليمية المستدامة.\n</strong>\n\n</div>\n\n<p>\nستعتمد النتائج الاقتصادية\nونتائج التوظيف الفعلية\nعلى حجم المشاركة المؤسسية المستقبلية،\nوطبيعة المشاريع التعاونية،\nوالترتيبات التشغيلية\nالتي سيتم اعتمادها في النهاية.\n</p>\n\n<a\n  href=\"goyang.html?lang=ar\"\n  class=\"button\"\n>\nاستكشاف مزايا مدينة غويانغ\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     5. THREE-STAGE STRATEGY\n===================================== -->\n\n<section>\n\n<h2>\n5. استراتيجية التطوير على ثلاث مراحل\n</h2>\n\n<p>\nتقر الاستراتيجية المقترحة\nبأن نجاح التعاون الدولي\nيتطلب الاهتمام\nبالتأسيس الأولي،\nوالعمليات المستدامة،\nوالتنمية المشتركة طويلة الأمد.\n</p>\n\n<div class=\"grid\">\n\n\u003c!-- STAGE 1 -->\n\n<div class=\"card\">\n\n<h3>\nالمرحلة الأولى — التأسيس الأولي\n</h3>\n\n<p>\nتقييم متطلبات توفير\nمرافق مكتبية مناسبة،\nووسائل النقل،\nوالسكن،\nوالرعاية الصحية،\nوالتعليم،\nوالخدمات الأساسية الأخرى\nللمؤسسات التي قد تشارك مستقبلاً.\n</p>\n\n</div>\n\n\u003c!-- STAGE 2 -->\n\n<div class=\"card\">\n\n<h3>\nالمرحلة الثانية — الدعم التشغيلي\n</h3>\n\n<p>\nاستكشاف التنسيق\nبين السلطات العامة المعنية،\nوالجامعات،\nوالمؤسسات البحثية،\nوالشركات،\nوالمجتمع المدني،\nلدعم التعاون الدولي،\nوأبحاث الذكاء الاصطناعي،\nوالمشاريع التجريبية،\nوالتبادل المهني.\n</p>\n\n</div>\n\n\u003c!-- STAGE 3 -->\n\n<div class=\"card\">\n\n<h3>\nالمرحلة الثالثة — النمو المشترك\n</h3>\n\n<p>\nالسعي إلى فرص\nتسهم في تحقيق مهام\nالمنظمات المشاركة،\nمع تشجيع الابتكار الإقليمي،\nوالتوظيف المهني،\nوالأنشطة التجارية،\nوالتنمية الاقتصادية المستدامة.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nالتأسيس الأولي\n← الدعم التشغيلي\n← النمو المشترك\n</strong>\n\n<p>\nستتطلب المشاريع المحددة،\nوترتيبات التمويل،\nوالمرافق،\nوتدابير الدعم المؤسسي\nإجراء المشاورات\nواتخاذ القرارات الرسمية\nمن السلطات المعنية.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     6. INSTITUTIONAL STATUS\n===================================== -->\n\n<section>\n\n<h2>\n6. الوضع المؤسسي والخطوات التالية\n</h2>\n\n<p>\nيُقدَّم المركز العالمي\nللذكاء الاصطناعي في غويانغ\nبوصفه مبادرة مقترحة\nتدعمها اللجنة المدنية.\n</p>\n\n<p>\nويعكس تحديد المنظمات الدولية التسع\nمدى ارتباط اختصاصاتها المحتمل\nبموضوعات المبادرة.\n</p>\n\n<p>\nولا يعني ذلك\nوجود أي شراكة رسمية،\nأو تأييد،\nأو قرار بالانتقال،\nأو التزام\nمن جانب هذه المنظمات.\n</p>\n\n<p>\nوسيتطلب أي تواصل مستقبلي\nإجراء المشاورات المناسبة\nمع المنظمات المعنية،\nواتخاذ القرارات\nوفقاً لإجراءاتها المؤسسية.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nتسعى المبادرة\nإلى تشجيع الحوار البنّاء،\nوالتعاون المؤسسي،\nوالتخطيط المسؤول\nالقائم على المصالح المشتركة\nوالمبادئ المعترف بها دولياً.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     7. PUBLIC ENGAGEMENT\n===================================== -->\n\n<section>\n\n<h2>\n7. المشاركة العامة والتعاون الدولي\n</h2>\n\n<p>\nتسعى اللجنة المدنية\nلدعم استقطاب المركز\nإلى تعزيز الوعي العام\nبمبادرة المركز العالمي\nللذكاء الاصطناعي،\nوتشجيع المشاركة البنّاءة\nفي المناقشات المتعلقة\nبالتنمية المستقبلية\nلمدينة غويانغ.\n</p>\n\n<p>\nوتهدف المبادرة\nإلى ربط المشاركة المدنية\nبفرص التعاون الدولي،\nوالبحث العلمي،\nوالابتكار المسؤول\nفي مجال الذكاء الاصطناعي.\n</p>\n\n<a\n  href=\"index.html?lang=ar\"\n  class=\"button\"\n>\nالصفحة الرئيسية العربية\n</a>\n\n<a\n  href=\"agencies.html\"\n  class=\"button\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어 원문 보기\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nمبادرة المركز العالمي للذكاء الاصطناعي<br>\nمدينة غويانغ الخاصة،<br>\nمقاطعة غيونغي، جمهورية كوريا\n</strong>\n</p>\n\n<p>\nاللجنة المدنية لدعم استقطاب\nالمركز العالمي للذكاء الاصطناعي\nإلى مدينة غويانغ الخاصة\n</p>\n\n<p>\nالذكاء الاصطناعي من أجل الإنسانية.<br>\nالتعاون الدولي من أجل مستقبل أفضل.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ar\">\nالصفحة الرئيسية العربية\n</a>\n\n&nbsp; | &nbsp;\n\n<a\n  href=\"agencies.html\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=de": "<!DOCTYPE html>\n<html lang=\"de\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<title>\nInternationale Organisationen |\nInitiative für ein globales KI-Zentrum in Goyang\n</title>\n\n<meta name=\"description\"\ncontent=\"Entdecken Sie mögliche KI-Kooperationen mit WHO, WFP, UNEP, UNHCR, IOM, ILO, ITU, UNICEF und UNDP im Rahmen der Initiative für ein globales KI-Zentrum in der Sonderstadt Goyang, Republik Korea.\">\n\n<style>\n\n/* GRUNDEINSTELLUNGEN */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* KOPFBEREICH */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 20px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n/* HAUPTINHALT */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.06);\n}\n\nh2 {\n  margin-top: 0;\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n/* KARTEN */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.agency-number {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 4px 12px;\n  border-radius: 6px;\n  font-size: 14px;\n  margin-bottom: 12px;\n}\n\n.agency-full-name {\n  font-size: 15px;\n  color: #53647a;\n  margin-bottom: 15px;\n}\n\n.agency-field {\n  background: #eaf4ff;\n  border-radius: 7px;\n  padding: 12px;\n  margin: 15px 0;\n  font-weight: bold;\n  color: #0754a6;\n}\n\n/* HERVORHEBUNGEN */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* SCHALTFLÄCHEN */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* FUSSZEILE */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* MOBILE ANSICHT */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- KOPFBEREICH -->\n\n<header>\n\n<h1>\nInternationale Organisationen<br>\nund mögliche KI-Zusammenarbeit\n</h1>\n\n<p>\nInternationale Fachkompetenz<br>\nmit künstlicher Intelligenz verbinden\n</p>\n\n<p>\nInitiative für ein globales KI-Zentrum<br>\nSonderstadt Goyang, Republik Korea\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=de\"\nclass=\"home-link\">\n← Deutsche Startseite\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- VISION -->\n\n<section>\n\n<div class=\"slogan\">\n\nKünstliche Intelligenz im Dienste der Menschheit.<br>\nInternationale Zusammenarbeit für eine bessere Zukunft.<br>\nInitiative für ein globales KI-Zentrum in Goyang.\n\n</div>\n\n</section>\n\n\u003c!-- 1. EINFÜHRUNG -->\n\n<section>\n\n<h2>\n1. Globales KI-Zentrum und internationale Organisationen\n</h2>\n\n<p>\nDas geplante globale KI-Zentrum\nist als internationale Kooperationsplattform vorgesehen,\ndie die Fachkompetenz internationaler Organisationen\nmit den Fortschritten\nder künstlichen Intelligenz verbindet.\n</p>\n\n<p>\nDie Initiative möchte untersuchen,\nwie verantwortungsvolle KI-Anwendungen\nzur Bewältigung globaler Herausforderungen\nin den Bereichen öffentliche Gesundheit,\nErnährungssicherheit,\nKlimawandel,\nUmweltschutz,\nhumanitäre Hilfe,\nMigration,\nBeschäftigung,\nBildung,\nKatastrophenvorsorge\nund nachhaltige Entwicklung beitragen können.\n</p>\n\n<p>\nInternationale Organisationen,\nRegierungen,\nUniversitäten,\nForschungseinrichtungen,\nUnternehmen und die Zivilgesellschaft\nkönnten ihre jeweiligen Fachkenntnisse\nin gemeinsame Aktivitäten einbringen.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nDas Ziel des geplanten globalen KI-Zentrums\nbesteht nicht lediglich darin,\nBüros internationaler Organisationen anzusiedeln.\n</strong>\n\n<p>\nVielmehr soll eine sinnvolle Zusammenarbeit\ngefördert werden,\ndie internationale Fachkompetenz\nmit KI-Forschung und Innovation verbindet,\num gemeinsame globale Herausforderungen anzugehen.\n</p>\n\n</div>\n\n<p class=\"note\">\nWichtige Klarstellung:\nDie nachfolgend vorgestellten neun Organisationen\nwerden aufgrund ihrer jeweiligen Aufgabenbereiche\nals mögliche Kooperationspartner betrachtet.\nIhre Erwähnung bedeutet weder\neine bestätigte Beteiligung\nnoch einen Umzug,\neine Büroeröffnung\noder eine verbindliche Partnerschaft.\n</p>\n\n</section>\n\n\u003c!-- 2. NEUN INTERNATIONALE ORGANISATIONEN -->\n\n<section>\n\n<h2>\n2. Neun internationale Organisationen\nund mögliche Bereiche der KI-Zusammenarbeit\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- WHO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 01\n</span>\n\n<h3>WHO</h3>\n\n<p class=\"agency-full-name\">\nWeltgesundheitsorganisation\n</p>\n\n<div class=\"agency-field\">\nÖffentliche Gesundheit und Gesundheitsversorgung\n</div>\n\n<p>\nDie WHO ist die Sonderorganisation\nder Vereinten Nationen,\ndie für die internationale\nöffentliche Gesundheit zuständig ist.\n</p>\n\n<p>\nIhre Arbeit umfasst\nKrankheitsprävention,\nVorbereitung auf gesundheitliche Notlagen,\nStärkung der Gesundheitssysteme\nund internationale Gesundheitszusammenarbeit.\n</p>\n\n<p>\nMögliche Bereiche der KI-Zusammenarbeit\numfassen die Überwachung von Krankheiten,\ndie frühzeitige Erkennung\ngesundheitlicher Risiken,\ndie Analyse von Gesundheitsdaten\nund die Verbesserung\ndes Zugangs zur Gesundheitsversorgung.\n</p>\n\n<p class=\"note\">\nEine solche Zusammenarbeit\nwürde angemessene Schutzmaßnahmen\nfür Privatsphäre,\nGesundheitsdaten,\nSicherheit\nund Chancengleichheit erfordern.\n</p>\n\n</article>\n\n\u003c!-- WFP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 02\n</span>\n\n<h3>WFP</h3>\n\n<p class=\"agency-full-name\">\nWelternährungsprogramm\n</p>\n\n<div class=\"agency-field\">\nErnährungssicherheit und Lieferketten\n</div>\n\n<p>\nDas WFP ist eine humanitäre Organisation\nder Vereinten Nationen,\ndie sich mit Hunger\nund Ernährungsunsicherheit befasst.\n</p>\n\n<p>\nZu seinen Aktivitäten gehören\nNahrungsmittelhilfe in Notfällen,\nErnährungsunterstützung\nund die Stärkung der Widerstandsfähigkeit\ngegenüber Ernährungskrisen.\n</p>\n\n<p>\nMögliche KI-Anwendungen\numfassen die Prognose\nvon Ernährungsunsicherheit,\ndie Analyse von Lieferkettenrisiken,\nFrühwarnungen vor Ernährungskrisen\nund die Verbesserung\nder humanitären Logistikplanung.\n</p>\n\n</article>\n\n\u003c!-- UNEP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 03\n</span>\n\n<h3>UNEP</h3>\n\n<p class=\"agency-full-name\">\nUmweltprogramm der Vereinten Nationen\n</p>\n\n<div class=\"agency-field\">\nKlimawandel und Umwelt\n</div>\n\n<p>\nUNEP ist die führende\nglobale Umweltinstitution\nder Vereinten Nationen.\n</p>\n\n<p>\nEs unterstützt die internationale Zusammenarbeit\nin den Bereichen Klimawandel,\nbiologische Vielfalt,\nUmweltverschmutzung,\nRessourcenmanagement\nund nachhaltige Entwicklung.\n</p>\n\n<p>\nMögliche KI-Kooperationen\numfassen die Analyse von Umweltdaten,\ndie Bewertung von Klimarisiken,\ndie Überwachung von Ökosystemen\nund die Analyse\nder Luft- und Wasserqualität.\n</p>\n\n</article>\n\n\u003c!-- UNHCR -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 04\n</span>\n\n<h3>UNHCR</h3>\n\n<p class=\"agency-full-name\">\nAmt des Hohen Flüchtlingskommissars\nder Vereinten Nationen\n</p>\n\n<div class=\"agency-field\">\nFlüchtlingsschutz und erzwungene Vertreibung\n</div>\n\n<p>\nUNHCR setzt sich für den Schutz\nund die Unterstützung\nvon Flüchtlingen,\ngewaltsam vertriebenen Menschen\nund Staatenlosen ein.\n</p>\n\n<p>\nZu seinen Aufgaben gehören\ninternationaler Schutz,\nhumanitäre Hilfe\nund die Unterstützung\ndauerhafter Lösungen\nfür Vertreibungssituationen.\n</p>\n\n<p>\nMögliche KI-Kooperationen\numfassen die Bewertung\nhumanitärer Bedürfnisse,\ndie Verbesserung des Zugangs\nzu Schutzdiensten\nund die Analyse\nvertreibungsbezogener Risiken.\n</p>\n\n<p class=\"note\">\nJede Anwendung muss\nMenschenrechte,\nDatenschutz,\nNichtdiskriminierung\nund die Sicherheit\nschutzbedürftiger Bevölkerungsgruppen\nin den Mittelpunkt stellen.\n</p>\n\n</article>\n\n\u003c!-- IOM -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 05\n</span>\n\n<h3>IOM</h3>\n\n<p class=\"agency-full-name\">\nInternationale Organisation für Migration\n</p>\n\n<div class=\"agency-field\">\nMigration und Vertreibung\n</div>\n\n<p>\nDie IOM fördert\neine menschenwürdige\nund geordnete Migration\nsowie die internationale Zusammenarbeit\nin migrationsbezogenen Fragen.\n</p>\n\n<p>\nZu ihren Aktivitäten gehören\ndie Unterstützung von Migrantinnen und Migranten,\nmigrationspolitische Beratung,\nhumanitäre Hilfe\nund die Unterstützung\nvertriebener Bevölkerungsgruppen.\n</p>\n\n<p>\nMögliche KI-Anwendungen\numfassen migrationspolitische Analysen,\ndie Verbesserung des Zugangs\nzu Dienstleistungen für Migranten\nund die Bereitstellung von Informationen\nfür humanitäre Maßnahmen\nbei Vertreibung.\n</p>\n\n</article>\n\n\u003c!-- ILO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 06\n</span>\n\n<h3>ILO</h3>\n\n<p class=\"agency-full-name\">\nInternationale Arbeitsorganisation\n</p>\n\n<div class=\"agency-field\">\nBeschäftigung und Zukunft der Arbeit\n</div>\n\n<p>\nDie ILO ist die Sonderorganisation\nder Vereinten Nationen,\ndie soziale Gerechtigkeit,\nArbeitnehmerrechte,\nmenschenwürdige Arbeit\nund internationale Arbeitsnormen fördert.\n</p>\n\n<p>\nIhre dreigliedrige Struktur\nbringt Regierungen,\nArbeitgeber\nund Arbeitnehmer zusammen.\n</p>\n\n<p>\nMögliche KI-Kooperationen\numfassen Arbeitsmarktanalysen,\nPrognosen zur zukünftigen Beschäftigung,\nKompetenzentwicklung,\nVerbesserung von Arbeitsvermittlungsdiensten\nund den Schutz von Beschäftigten\nwährend technologischer Veränderungen.\n</p>\n\n</article>\n\n\u003c!-- ITU -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 07\n</span>\n\n<h3>ITU</h3>\n\n<p class=\"agency-full-name\">\nInternationale Fernmeldeunion\n</p>\n\n<div class=\"agency-field\">\nNotfallkommunikation und Frühwarnung\n</div>\n\n<p>\nDie ITU ist die Sonderorganisation\nder Vereinten Nationen\nfür digitale Technologien\nsowie Informations-\nund Kommunikationstechnologien.\n</p>\n\n<p>\nIhre Arbeit umfasst\ndie Standardisierung\nder Telekommunikation,\ndigitale Vernetzung,\ndigitale Infrastruktur\nund Notfallkommunikation.\n</p>\n\n<p>\nMögliche KI-Kooperationen\numfassen Katastrophenkommunikation,\ndie Verbreitung von Risikoinformationen,\nFrühwarnsysteme\nund die Verbesserung\nder digitalen Barrierefreiheit.\n</p>\n\n</article>\n\n\u003c!-- UNICEF -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 08\n</span>\n\n<h3>UNICEF</h3>\n\n<p class=\"agency-full-name\">\nKinderhilfswerk der Vereinten Nationen\n</p>\n\n<div class=\"agency-field\">\nKinderschutz und Bildung\n</div>\n\n<p>\nUNICEF setzt sich\nfür den Schutz der Kinderrechte\nund die Verbesserung\nvon Gesundheit,\nBildung,\nSicherheit\nund allgemeinem Wohlergehen\nvon Kindern ein.\n</p>\n\n<p>\nZu seinen Aktivitäten gehören\nKinderschutz,\nZugang zu Bildung,\nUnterstützung gefährdeter Kinder\nund Nothilfe.\n</p>\n\n<p>\nMögliche KI-Anwendungen\numfassen die Verbesserung\ndes Bildungszugangs,\nLernunterstützung,\ndie Analyse von Informationen\nzum Kindeswohl\nund die Verringerung\ndigitaler Ungleichheiten.\n</p>\n\n<p class=\"note\">\nKinderrechte,\nPrivatsphäre,\nSicherheit,\nBildungsgerechtigkeit\nund verantwortungsvolle KI-Governance\nmüssen dabei zentrale Aspekte bleiben.\n</p>\n\n</article>\n\n\u003c!-- UNDP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganisation 09\n</span>\n\n<h3>UNDP</h3>\n\n<p class=\"agency-full-name\">\nEntwicklungsprogramm der Vereinten Nationen\n</p>\n\n<div class=\"agency-field\">\nKrisenbewältigung und nachhaltige Entwicklung\n</div>\n\n<p>\nUNDP unterstützt Länder\nbei der Bekämpfung von Armut,\nUngleichheit,\nHerausforderungen der Regierungsführung\nund bei der Förderung\nnachhaltiger Entwicklung.\n</p>\n\n<p>\nZu seinen Aktivitäten gehören\ndie Entwicklung institutioneller Kapazitäten,\nKrisenbewältigung,\nWiederaufbau\nund die Unterstützung\nder Ziele für nachhaltige Entwicklung.\n</p>\n\n<p>\nMögliche KI-Kooperationen\numfassen entwicklungspolitische Analysen,\ndie Bewertung komplexer Krisen,\ndie Verbesserung öffentlicher Dienstleistungen\nund datengestützte Planung\nfür nachhaltige Entwicklung.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- 3. KOOPERATIONSRAHMEN -->\n\n<section>\n\n<h2>\n3. Ein Rahmen für internationale KI-Zusammenarbeit\n</h2>\n\n<p>\nInternationale Organisationen verfügen\nüber spezialisiertes Fachwissen,\nglobale Netzwerke\nund Erfahrungen\nbei der Bewältigung komplexer\nentwicklungspolitischer\nund humanitärer Herausforderungen.\n</p>\n\n<p>\nUniversitäten,\nForschungseinrichtungen\nund Technologieunternehmen\nkönnen Forschungskapazitäten,\nKI-Fachwissen\nund technologische Innovationen beitragen.\n</p>\n\n<p>\nDas geplante globale KI-Zentrum\nmöchte Möglichkeiten erkunden,\ndiese sich ergänzenden Stärken\ndurch praktische internationale Zusammenarbeit\nmiteinander zu verbinden.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>Gemeinsame Forschung</h3>\n\n<p>\nIdentifizierung von Forschungsfragen\nim Zusammenhang mit globalen Herausforderungen\nund Erkundung gemeinsamer Forschungsprojekte.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Verantwortungsvolle KI-Pilotprojekte</h3>\n\n<p>\nErkundung von KI-Pilotprojekten,\ndie auf Bedürfnisse des Gemeinwohls reagieren,\nwährend Sicherheit,\nWirksamkeit\nund ethische Auswirkungen\nbewertet werden.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Politik- und Wissensaustausch</h3>\n\n<p>\nFörderung internationaler Treffen,\ndes fachlichen Dialogs,\ndes politischen Lernens\nund des Austauschs\nvon Forschungsergebnissen.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Kompetenzentwicklung</h3>\n\n<p>\nErkundung von Bildungsangeboten,\nSchulungen,\nFachaustausch\nund Initiativen zum Kapazitätsaufbau\nin der internationalen Zusammenarbeit\nund im Bereich verantwortungsvoller KI.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nInternationale Fachkompetenz\n+ Verantwortungsvolle KI-Innovation\n+ Institutionelle Zusammenarbeit\n</strong>\n\n<p>\nDer vorgeschlagene Rahmen\nsoll praktische Lösungen fördern,\ndie mit den Aufgaben\nund Prioritäten\nder teilnehmenden Institutionen\nim Einklang stehen.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- 4. WARUM GOYANG? -->\n\n<section>\n\n<h2>\n4. Warum die Sonderstadt Goyang?\n</h2>\n\n<p>\nDie Sonderstadt Goyang\nliegt in der Provinz Gyeonggi\ninnerhalb der Metropolregion Seoul\nin der Republik Korea.\n</p>\n\n<p>\nZu ihren vorhandenen Standortvorteilen gehören\ninternationale Kongress-\nund Ausstellungseinrichtungen\nrund um KINTEX,\nmedizinische Institutionen\nwie das Nationale Krebszentrum,\nstädtische Dienstleistungen,\nkulturelle Einrichtungen\nund ökologische Ressourcen\nwie das Janghang-Feuchtgebiet.\n</p>\n\n<p>\nDiese Ressourcen bilden eine Grundlage,\num internationale Zusammenarbeit\nin den Bereichen\nöffentliche Gesundheit,\nökologische Nachhaltigkeit,\nKatastrophenvorsorge\nund KI-gestützte Innovation\nzu erkunden.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nDie Initiative für ein globales KI-Zentrum\nmöchte internationale Zusammenarbeit\nmit neuen Möglichkeiten\nfür Forschung,\nInnovation,\nqualifizierte Beschäftigung\nund nachhaltige Regionalentwicklung verbinden.\n</strong>\n\n</div>\n\n<p>\nDie tatsächlichen wirtschaftlichen\nund beschäftigungspolitischen Ergebnisse\nwürden vom Umfang\nder zukünftigen institutionellen Beteiligung,\nder Art gemeinsamer Projekte\nund den letztlich vereinbarten\nBetriebsstrukturen abhängen.\n</p>\n\n<a href=\"goyang.html?lang=de\"\nclass=\"button\">\nGoyangs Standortvorteile entdecken\n</a>\n\n</section>\n\n\u003c!-- 5. DREISTUFIGE STRATEGIE -->\n\n<section>\n\n<h2>\n5. Dreistufige Entwicklungsstrategie\n</h2>\n\n<p>\nDie vorgeschlagene Strategie berücksichtigt,\ndass erfolgreiche internationale Zusammenarbeit\neine sorgfältige Planung\nder anfänglichen Ansiedlung,\ndes nachhaltigen Betriebs\nund der langfristigen gemeinsamen Entwicklung erfordert.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nPhase 1 — Erste Ansiedlung\n</h3>\n\n<p>\nBewertung der Anforderungen\nan geeignete Büroräume,\nVerkehrsanbindungen,\nWohnraum,\nGesundheitsversorgung,\nBildung\nund weitere wichtige Dienstleistungen\nfür potenziell teilnehmende Institutionen.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPhase 2 — Betriebsunterstützung\n</h3>\n\n<p>\nErkundung der Zusammenarbeit\nzwischen zuständigen Behörden,\nUniversitäten,\nForschungseinrichtungen,\nUnternehmen\nund der Zivilgesellschaft,\num internationale Kooperation,\nKI-Forschung,\nPilotprojekte\nund Fachaustausch zu unterstützen.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPhase 3 — Gemeinsames Wachstum\n</h3>\n\n<p>\nSuche nach Möglichkeiten,\nzu den Aufgaben\nder teilnehmenden Organisationen beizutragen\nund gleichzeitig\nregionale Innovation,\nqualifizierte Beschäftigung,\nwirtschaftliche Aktivitäten\nund nachhaltige Entwicklung zu fördern.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nErste Ansiedlung\n→ Betriebsunterstützung\n→ Gemeinsames Wachstum\n</strong>\n\n<p>\nKonkrete Projekte,\nFinanzierungsvereinbarungen,\nEinrichtungen\nund institutionelle Unterstützungsmaßnahmen\nwürden Konsultationen\nund formelle Entscheidungen\nder zuständigen Behörden erfordern.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- 6. INSTITUTIONELLER STATUS -->\n\n<section>\n\n<h2>\n6. Institutioneller Status und nächste Schritte\n</h2>\n\n<p>\nDas globale KI-Zentrum in Goyang\nwird als vorgeschlagene Initiative vorgestellt,\ndie vom Bürgerkomitee unterstützt wird.\n</p>\n\n<p>\nDie Auswahl der neun\ninternationalen Organisationen\nspiegelt ihre mögliche thematische Relevanz\nfür die Initiative wider.\n</p>\n\n<p>\nSie begründet weder\neine formelle Partnerschaft,\neine offizielle Unterstützung,\neine Standortverlagerungsentscheidung\nnoch eine verbindliche Zusage\ndieser Organisationen.\n</p>\n\n<p>\nEine zukünftige Zusammenarbeit\nwürde angemessene Konsultationen\nmit den betreffenden Organisationen\nund Entscheidungen\ngemäß ihren jeweiligen\ninstitutionellen Verfahren erfordern.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nDie Initiative setzt sich\nfür einen konstruktiven Dialog,\ninstitutionelle Zusammenarbeit\nund verantwortungsvolle Planung\nauf der Grundlage\ngegenseitiger Interessen\nund international anerkannter Grundsätze ein.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- 7. ÖFFENTLICHE BETEILIGUNG -->\n\n<section>\n\n<h2>\n7. Bürgerbeteiligung und internationale Zusammenarbeit\n</h2>\n\n<p>\nDas Bürgerkomitee\nmöchte das öffentliche Bewusstsein\nfür die Initiative\neines globalen KI-Zentrums stärken\nund eine konstruktive Beteiligung\nan Diskussionen\nüber die zukünftige Entwicklung Goyangs fördern.\n</p>\n\n<p>\nDie Initiative möchte\nbürgerschaftliches Engagement\nmit Möglichkeiten\nfür internationale Zusammenarbeit,\nForschung\nund verantwortungsvolle KI-Innovation verbinden.\n</p>\n\n<a href=\"index.html?lang=de\"\nclass=\"button\">\nDeutsche Startseite\n</a>\n\n<a href=\"participate.html?lang=de\"\nclass=\"button\">\nBürgerbeteiligung\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- FUSSZEILE -->\n\n<footer>\n\n<p>\n<strong>\nInitiative für ein globales KI-Zentrum<br>\nSonderstadt Goyang,\nProvinz Gyeonggi,\nRepublik Korea\n</strong>\n</p>\n\n<p>\nBürgerkomitee zur Förderung\nder Ansiedlung eines globalen KI-Zentrums\nin der Sonderstadt Goyang\n</p>\n\n<p>\nKünstliche Intelligenz im Dienste der Menschheit.<br>\nInternationale Zusammenarbeit für eine bessere Zukunft.\n</p>\n\n<p>\n<a href=\"index.html?lang=de\">\nDeutsche Startseite\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=en": "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\"\ncontent=\"#0754a6\">\n\n<title>\nInternational Organizations |\nGlobal AI Hub Initiative in Goyang\n</title>\n\n<meta name=\"description\"\ncontent=\"Explore potential AI cooperation with WHO, WFP, UNEP, UNHCR, IOM, ILO, ITU, UNICEF and UNDP under the proposed Global AI Hub initiative in Goyang Special City, Republic of Korea.\">\n\n<style>\n\n/* Basic settings */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    Arial,\n    Helvetica,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* Header */\n\nheader {\n  background:\n    linear-gradient(\n      135deg,\n      #0754a6,\n      #10315e\n    );\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.3;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 20px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n/* Main content */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n}\n\nh2 {\n  margin-top: 0;\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n/* Cards */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.agency-number {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 4px 12px;\n  border-radius: 6px;\n  font-size: 14px;\n  margin-bottom: 12px;\n}\n\n.agency-full-name {\n  font-size: 15px;\n  color: #53647a;\n  margin-bottom: 15px;\n}\n\n.agency-field {\n  background: #eaf4ff;\n  border-radius: 7px;\n  padding: 12px;\n  margin: 15px 0;\n  font-weight: bold;\n  color: #0754a6;\n}\n\n/* Highlights */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* Buttons */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* Footer */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* Mobile */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n<header>\n\n<h1>\nInternational Organizations<br>\nand Potential AI Cooperation\n</h1>\n\n<p>\nConnecting International Expertise<br>\nwith Artificial Intelligence\n</p>\n\n<p>\nGlobal AI Hub Initiative<br>\nGoyang Special City, Republic of Korea\n</p>\n\n<div class=\"header-links\">\n\n<a href=\"index.html?lang=en\"\nclass=\"home-link\">\n← English Home\n</a>\n\n<a href=\"agencies.html\"\nclass=\"home-link\"\nlang=\"ko\">\n한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- Vision -->\n\n<section>\n\n<div class=\"slogan\">\n\nArtificial Intelligence for Humanity.<br>\nInternational Cooperation for a Better Future.<br>\nGlobal AI Hub Initiative in Goyang.\n\n</div>\n\n</section>\n\n\u003c!-- Introduction -->\n\n<section>\n\n<h2>\n1. Global AI Hub and International Organizations\n</h2>\n\n<p>\nThe proposed Global AI Hub is envisioned\nas an international cooperation platform\nconnecting the expertise of international\norganizations with advances in\nartificial intelligence.\n</p>\n\n<p>\nThe initiative seeks to explore\nhow responsible AI applications\ncould contribute to addressing\nglobal challenges in public health,\nfood security, climate change,\nenvironmental protection,\nhumanitarian assistance,\nmigration, employment,\neducation, disaster resilience,\nand sustainable development.\n</p>\n\n<p>\nInternational organizations,\ngovernments, universities,\nresearch institutions,\nbusinesses, and civil society\ncould contribute their respective\nexpertise to collaborative activities.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nThe objective of the proposed Global AI Hub\nis not simply to attract offices\nof international organizations.\n</strong>\n\n<p>\nIts broader purpose is to explore\nmeaningful cooperation that connects\ninternational expertise with AI research\nand innovation to address\nshared global challenges.\n</p>\n\n</div>\n\n<p class=\"note\">\nImportant clarification:\nThe nine organizations introduced below\nare identified as potential areas\nof engagement based on their mandates.\nTheir inclusion does not indicate\nconfirmed participation, relocation,\noffice establishment, or partnership.\n</p>\n\n</section>\n\n\u003c!-- Nine Organizations -->\n\n<section>\n\n<h2>\n2. Nine International Organizations\nand Potential Areas of AI Cooperation\n</h2>\n\n<div class=\"grid\">\n\n\u003c!-- WHO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganization 01\n</span>\n\n<h3>WHO</h3>\n\n<p class=\"agency-full-name\">\nWorld Health Organization\n</p>\n\n<div class=\"agency-field\">\nPublic Health and Healthcare\n</div>\n\n<p>\nWHO is the United Nations\nspecialized agency responsible\nfor international public health.\n</p>\n\n<p>\nIts work includes disease prevention,\nhealth emergency preparedness,\nhealth systems strengthening,\nand international health cooperation.\n</p>\n\n<p>\nPotential areas of AI cooperation\ncould include disease surveillance,\nearly detection of health risks,\npublic health data analysis,\nand improved access to healthcare services.\n</p>\n\n<p class=\"note\">\nSuch cooperation would require\nappropriate safeguards for privacy,\nhealth data governance,\nsafety, and equity.\n</p>\n\n</article>\n\n\u003c!-- WFP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganization 02\n</span>\n\n<h3>WFP</h3>\n\n<p class=\"agency-full-name\">\nWorld Food Programme\n</p>\n\n<div class=\"agency-field\">\nFood Security and Supply Chains\n</div>\n\n<p>\nWFP is a United Nations humanitarian\norganization addressing hunger\nand food insecurity.\n</p>\n\n<p>\nIts activities include emergency\nfood assistance, nutrition support,\nand strengthening resilience\nagainst food-related crises.\n</p>\n\n<p>\nPotential AI applications could include\nfood insecurity forecasting,\nsupply-chain risk analysis,\nearly warning of food crises,\nand improved humanitarian\nlogistics planning.\n</p>\n\n</article>\n\n\u003c!-- UNEP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganization 03\n</span>\n\n<h3>UNEP</h3>\n\n<p class=\"agency-full-name\">\nUnited Nations Environment Programme\n</p>\n\n<div class=\"agency-field\">\nClimate Change and Environment\n</div>\n\n<p>\nUNEP is the United Nations'\nleading global environmental authority.\n</p>\n\n<p>\nIt supports international cooperation\non climate change, biodiversity,\npollution, resource management,\nand sustainable development.\n</p>\n\n<p>\nPotential AI cooperation could include\nenvironmental data analysis,\nclimate risk assessment,\necosystem monitoring,\nand air and water quality analysis.\n</p>\n\n</article>\n\n\u003c!-- UNHCR -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganization 04\n</span>\n\n<h3>UNHCR</h3>\n\n<p class=\"agency-full-name\">\nOffice of the United Nations\nHigh Commissioner for Refugees\n</p>\n\n<div class=\"agency-field\">\nRefugee Protection and Forced Displacement\n</div>\n\n<p>\nUNHCR works to protect and assist\nrefugees, forcibly displaced people,\nand stateless persons.\n</p>\n\n<p>\nIts responsibilities include\ninternational protection,\nhumanitarian assistance,\nand support for durable solutions\nto displacement.\n</p>\n\n<p>\nPotential AI cooperation could include\nhumanitarian needs assessment,\nimproved access to protection services,\nand analysis of displacement-related risks.\n</p>\n\n<p class=\"note\">\nAny application must prioritize\nhuman rights, data protection,\nnon-discrimination,\nand the safety of vulnerable populations.\n</p>\n\n</article>\n\n\u003c!-- IOM -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganization 05\n</span>\n\n<h3>IOM</h3>\n\n<p class=\"agency-full-name\">\nInternational Organization for Migration\n</p>\n\n<div class=\"agency-field\">\nMigration and Displacement\n</div>\n\n<p>\nIOM promotes humane and orderly migration\nand supports international cooperation\non migration-related issues.\n</p>\n\n<p>\nIts activities include migrant assistance,\nmigration policy support,\nhumanitarian response,\nand assistance to displaced populations.\n</p>\n\n<p>\nPotential AI applications could include\nmigration policy analysis,\nimproved access to migrant services,\nand information support\nfor humanitarian responses\nto displacement.\n</p>\n\n</article>\n\n\u003c!-- ILO -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganization 06\n</span>\n\n<h3>ILO</h3>\n\n<p class=\"agency-full-name\">\nInternational Labour Organization\n</p>\n\n<div class=\"agency-field\">\nEmployment and the Future of Work\n</div>\n\n<p>\nILO is the United Nations\nspecialized agency promoting\nsocial justice, labour rights,\ndecent work, and international\nlabour standards.\n</p>\n\n<p>\nIts tripartite structure brings together\ngovernments, employers, and workers.\n</p>\n\n<p>\nPotential AI cooperation could include\nlabour market analysis,\nfuture employment forecasting,\nskills development,\nemployment service improvement,\nand protection of workers\nduring technological transitions.\n</p>\n\n</article>\n\n\u003c!-- ITU -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganization 07\n</span>\n\n<h3>ITU</h3>\n\n<p class=\"agency-full-name\">\nInternational Telecommunication Union\n</p>\n\n<div class=\"agency-field\">\nEmergency Communications and Early Warning\n</div>\n\n<p>\nITU is the United Nations\nspecialized agency for digital technologies\nand information and communication technologies.\n</p>\n\n<p>\nIts work includes telecommunications\nstandardization, connectivity,\ndigital infrastructure,\nand emergency communications.\n</p>\n\n<p>\nPotential AI cooperation could include\ndisaster communications,\nrisk information dissemination,\nearly-warning systems,\nand improved digital accessibility.\n</p>\n\n</article>\n\n\u003c!-- UNICEF -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganization 08\n</span>\n\n<h3>UNICEF</h3>\n\n<p class=\"agency-full-name\">\nUnited Nations Children's Fund\n</p>\n\n<div class=\"agency-field\">\nChild Protection and Education\n</div>\n\n<p>\nUNICEF works to protect children's rights\nand improve their health,\neducation, safety,\nand overall well-being.\n</p>\n\n<p>\nIts activities include child protection,\neducation access,\nsupport for vulnerable children,\nand emergency assistance.\n</p>\n\n<p>\nPotential AI applications could include\neducational accessibility,\nlearning support,\nchild welfare information analysis,\nand reducing digital inequalities.\n</p>\n\n<p class=\"note\">\nChildren's rights, privacy,\nsafety, educational equity,\nand responsible AI governance\nmust remain central considerations.\n</p>\n\n</article>\n\n\u003c!-- UNDP -->\n\n<article class=\"card\">\n\n<span class=\"agency-number\">\nOrganization 09\n</span>\n\n<h3>UNDP</h3>\n\n<p class=\"agency-full-name\">\nUnited Nations Development Programme\n</p>\n\n<div class=\"agency-field\">\nCrisis Response and Sustainable Development\n</div>\n\n<p>\nUNDP supports countries in addressing\npoverty, inequality,\ngovernance challenges,\nand sustainable development.\n</p>\n\n<p>\nIts activities include\ninstitutional capacity development,\ncrisis response,\nrecovery, and support\nfor the Sustainable Development Goals.\n</p>\n\n<p>\nPotential AI cooperation could include\ndevelopment policy analysis,\ncomplex crisis assessment,\npublic service improvement,\nand data-informed planning\nfor sustainable development.\n</p>\n\n</article>\n\n</div>\n\n</section>\n\n\u003c!-- Cooperation Framework -->\n\n<section>\n\n<h2>\n3. A Framework for International AI Cooperation\n</h2>\n\n<p>\nInternational organizations bring\nspecialized knowledge,\nglobal networks,\nand experience in addressing\ncomplex development\nand humanitarian challenges.\n</p>\n\n<p>\nUniversities, research institutions,\nand technology companies\nmay contribute research capabilities,\nAI expertise,\nand technological innovation.\n</p>\n\n<p>\nThe proposed Global AI Hub seeks\nto explore opportunities\nto connect these complementary strengths\nthrough practical international cooperation.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>Joint Research</h3>\n\n<p>\nIdentifying research questions\nrelated to global challenges\nand exploring collaborative\nresearch projects.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Responsible AI Pilots</h3>\n\n<p>\nExploring AI pilot projects\nthat respond to public-interest needs\nwhile evaluating safety,\neffectiveness, and ethical implications.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Policy and Knowledge Exchange</h3>\n\n<p>\nSupporting opportunities\nfor international meetings,\nexpert dialogue,\npolicy learning,\nand the exchange of research findings.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Capacity Development</h3>\n\n<p>\nExploring education,\ntraining,\nprofessional exchange,\nand capacity-building initiatives\nin international cooperation\nand responsible AI.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nInternational Expertise\n+ Responsible AI Innovation\n+ Institutional Cooperation\n</strong>\n\n<p>\nThe proposed framework seeks\nto encourage practical solutions\nthat are consistent with\nthe mandates and priorities\nof participating institutions.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- Why Goyang -->\n\n<section>\n\n<h2>\n4. Why Goyang Special City?\n</h2>\n\n<p>\nGoyang Special City is located\nin Gyeonggi Province,\nwithin the Seoul metropolitan region\nof the Republic of Korea.\n</p>\n\n<p>\nIts existing assets include\ninternational convention\nand exhibition infrastructure\ncentered on KINTEX,\nhealthcare institutions such as\nthe National Cancer Center,\nurban services,\ncultural facilities,\nand ecological resources\nincluding the Janghang Wetland.\n</p>\n\n<p>\nThese assets provide\na foundation for exploring\ninternational cooperation\nin public health,\nenvironmental sustainability,\ndisaster resilience,\nand AI-enabled innovation.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nThe Global AI Hub initiative\nseeks to connect international cooperation\nwith new opportunities\nfor research, innovation,\nprofessional employment,\nand sustainable regional development.\n</strong>\n\n</div>\n\n<p>\nActual economic and employment outcomes\nwould depend on the scale\nof future institutional participation,\nthe nature of cooperative projects,\nand the operational arrangements\neventually established.\n</p>\n\n<a href=\"goyang.html?lang=en\"\nclass=\"button\">\nExplore Goyang's Advantages\n</a>\n\n</section>\n\n\u003c!-- Three-stage Strategy -->\n\n<section>\n\n<h2>\n5. Three-Stage Development Strategy\n</h2>\n\n<p>\nThe proposed strategy recognizes\nthat successful international cooperation\nrequires attention to initial establishment,\nsustainable operations,\nand long-term shared development.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nStage 1 — Initial Establishment\n</h3>\n\n<p>\nAssessing the requirements\nfor suitable office facilities,\ntransportation,\nhousing,\nhealthcare,\neducation,\nand other essential services\nfor potential participating institutions.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nStage 2 — Operational Support\n</h3>\n\n<p>\nExploring coordination among\nrelevant public authorities,\nuniversities,\nresearch institutions,\nbusinesses,\nand civil society\nto support international cooperation,\nAI research,\npilot projects,\nand professional exchanges.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nStage 3 — Shared Growth\n</h3>\n\n<p>\nSeeking opportunities\nto contribute to the missions\nof participating organizations\nwhile encouraging\nregional innovation,\nprofessional employment,\nbusiness activity,\nand sustainable economic development.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nInitial Establishment\n→ Operational Support\n→ Shared Growth\n</strong>\n\n<p>\nSpecific projects,\nfunding arrangements,\nfacilities,\nand institutional support measures\nwould require consultation\nand formal decisions\nby the relevant authorities.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- Institutional Clarification -->\n\n<section>\n\n<h2>\n6. Institutional Status and Next Steps\n</h2>\n\n<p>\nThe Global AI Hub in Goyang\nis presented as a proposed initiative\nsupported by the Citizens'\nPromotion Committee.\n</p>\n\n<p>\nThe identification of nine\ninternational organizations\nreflects potential thematic relevance\nto the initiative.\n</p>\n\n<p>\nIt does not establish\nany formal partnership,\nendorsement,\nrelocation decision,\nor commitment\nby these organizations.\n</p>\n\n<p>\nFuture engagement would require\nappropriate consultation\nwith the organizations concerned\nand decisions through their\nrespective institutional procedures.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nThe initiative seeks constructive dialogue,\ninstitutional cooperation,\nand responsible planning\nbased on mutual interests\nand internationally recognized principles.\n</strong>\n\n</div>\n\n</section>\n\n\u003c!-- Participation -->\n\n<section>\n\n<h2>\n7. Public Engagement and International Cooperation\n</h2>\n\n<p>\nThe Citizens' Promotion Committee\nseeks to raise public awareness\nof the Global AI Hub initiative\nand encourage constructive participation\nin discussions about\nGoyang's future development.\n</p>\n\n<p>\nThe initiative aims to connect\ncitizen engagement\nwith opportunities for\ninternational cooperation,\nresearch,\nand responsible AI innovation.\n</p>\n\n<a href=\"index.html?lang=en\"\nclass=\"button\">\nEnglish Homepage\n</a>\n\n<a href=\"agencies.html\"\nclass=\"button\"\nlang=\"ko\">\n한국어 원문 보기\n</a>\n\n</section>\n\n</main>\n\n<footer>\n\n<p>\n<strong>\nGlobal AI Hub Initiative<br>\nGoyang Special City,\nGyeonggi Province,\nRepublic of Korea\n</strong>\n</p>\n\n<p>\nCitizens' Promotion Committee\nfor Attracting the Global AI Hub\nto Goyang Special City\n</p>\n\n<p>\nArtificial Intelligence for Humanity.<br>\nInternational Cooperation for a Better Future.\n</p>\n\n<p>\n<a href=\"index.html?lang=en\">\nEnglish Home\n</a>\n&nbsp; | &nbsp;\n<a href=\"agencies.html\" lang=\"ko\">\n한국어\n</a>\n</p>\n\n</footer>\n\n</body>\n</html>\n",
  "lang=es": "<!DOCTYPE html>\n<html lang=\"es\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<title>\nOrganizaciones Internacionales y Cooperación en IA |\nCentro Global de IA en Goyang\n</title>\n\n<meta name=\"description\"\ncontent=\"Conozca las nueve organizaciones internacionales y los posibles ámbitos de cooperación en inteligencia artificial de la iniciativa del Centro Global de IA en Goyang, República de Corea.\">\n\n<link rel=\"canonical\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/agencies.html?lang=es\">\n\n<link rel=\"alternate\" hreflang=\"es\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/agencies.html?lang=es\">\n\n<link rel=\"alternate\" hreflang=\"en\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/agencies.html?lang=en\">\n\n<link rel=\"alternate\" hreflang=\"ko\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/agencies.html\">\n\n<style>\n\n/* CONFIGURACIÓN GENERAL */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* ENCABEZADO */\n\nheader {\n  background: linear-gradient(135deg, #0754a6, #10315e);\n  color: white;\n  text-align: center;\n  padding: 24px 20px;\n}\n\nheader h1 {\n  font-size: clamp(25px, 4vw, 36px);\n  margin: 0 0 8px;\n  line-height: 1.4;\n}\n\nheader p {\n  font-size: 15px;\n  margin: 5px 0;\n  color: #e3efff;\n}\n\n/* NAVEGACIÓN */\n\n.top-navigation {\n  background: #10315e;\n  padding: 12px 18px;\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  align-items: center;\n  gap: 12px;\n}\n\n.top-navigation > a {\n  color: white;\n  text-decoration: none;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.top-navigation > a:hover {\n  color: #ffdf5a;\n}\n\n/* SELECTOR DE IDIOMA */\n\n.language-dropdown {\n  position: relative;\n  z-index: 1000;\n}\n\n.language-dropdown summary {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  padding: 9px 15px;\n  background: #ffe44d;\n  color: #003b79;\n  border-radius: 6px;\n  font-size: 13px;\n  font-weight: bold;\n  cursor: pointer;\n  list-style: none;\n}\n\n.language-dropdown summary::-webkit-details-marker {\n  display: none;\n}\n\n.language-dropdown summary:focus-visible {\n  outline: 3px solid white;\n  outline-offset: 3px;\n}\n\n.language-options {\n  position: absolute;\n  top: calc(100% + 7px);\n  right: 0;\n  min-width: 180px;\n  padding: 8px;\n  background: white;\n  border: 1px solid #cbdff5;\n  border-radius: 8px;\n  box-shadow: 0 5px 18px rgba(0,0,0,0.18);\n}\n\n.language-options a {\n  display: block;\n  padding: 10px 12px;\n  color: #0754a6;\n  background: white;\n  border-radius: 5px;\n  font-size: 14px;\n  text-align: left;\n  text-decoration: none;\n  white-space: nowrap;\n}\n\n.language-options a:hover {\n  background: #eaf4ff;\n}\n\n.language-options a[aria-current=\"page\"] {\n  background: #eaf4ff;\n  font-weight: bold;\n}\n\n/* CONTENIDO */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\nsection {\n  background: white;\n  padding: 35px;\n  margin-bottom: 25px;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.06);\n  scroll-margin-top: 20px;\n}\n\nh2 {\n  margin-top: 0;\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n}\n\nh3 {\n  color: #0754a6;\n}\n\n.slogan {\n  text-align: center;\n  font-size: clamp(20px, 4vw, 30px);\n  font-weight: bold;\n  color: #0754a6;\n  line-height: 1.7;\n}\n\n/* TARJETAS */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: #f4f8fc;\n  padding: 25px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n.agency-number {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 4px 12px;\n  border-radius: 6px;\n  font-size: 14px;\n  margin-bottom: 12px;\n}\n\n.agency-full-name {\n  font-size: 15px;\n  color: #53647a;\n  margin-bottom: 15px;\n}\n\n.agency-field {\n  background: #eaf4ff;\n  border-radius: 7px;\n  padding: 12px;\n  margin: 15px 0;\n  font-weight: bold;\n  color: #0754a6;\n}\n\n/* DESTACADOS */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 25px;\n  border-radius: 8px;\n  margin: 25px 0;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* BOTONES */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: #0754a6;\n}\n\n.button.secondary:hover {\n  background: #cce2ff;\n}\n\n/* PIE DE PÁGINA */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* MÓVIL */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 20px 12px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n</head>\n\n<body>\n\n<header>\n\n<h1>\nOrganizaciones Internacionales<br>\ny Cooperación Potencial en IA\n</h1>\n\n<p>\nConectando la experiencia internacional<br>\ncon la inteligencia artificial\n</p>\n\n<p>\nIniciativa del Centro Global de IA<br>\nCiudad Especial de Goyang, República de Corea\n</p>\n\n</header>\n\n<nav class=\"top-navigation\"\naria-label=\"Navegación principal\">\n\n<a href=\"index.html?lang=es
