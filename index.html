  font-size: 15px;\n  font-weight: normal;\n  border: none;\n}\n\n/* =====================================\n   03. NAVIGAZIONE PRINCIPALE\n===================================== */\n\n.main-nav {\n  position: relative;\n  z-index: 1000;\n\n  display: flex;\n  flex-wrap: nowrap;\n  align-items: center;\n\n  gap: 8px;\n\n  width: 100%;\n  min-width: 0;\n\n  padding: 10px 14px;\n\n  background: var(--dark-blue);\n}\n\n/* =====================================\n   04. SELETTORE LINGUA\n===================================== */\n\n.language-dropdown {\n  position: relative;\n  z-index: 2000;\n\n  flex: 0 0 auto;\n  min-width: 0;\n}\n\n.language-dropdown > summary {\n  display: inline-flex;\n  justify-content: center;\n  align-items: center;\n\n  min-height: 42px;\n\n  padding: 9px 14px;\n\n  background: var(--teal);\n  color: white;\n\n  border: 1px solid var(--teal);\n  border-radius: 7px;\n\n  font-size: 13px;\n  font-weight: 800;\n\n  white-space: nowrap;\n  cursor: pointer;\n  list-style: none;\n\n  transition:\n    background 0.2s ease;\n}\n\n.language-dropdown > summary::-webkit-details-marker {\n  display: none;\n}\n\n.language-dropdown > summary::marker {\n  content: \"\";\n}\n\n.language-dropdown > summary:hover,\n.language-dropdown[open] > summary {\n  background: #006e76;\n  border-color: #006e76;\n}\n\n.language-dropdown > summary:focus-visible {\n  outline: 3px solid var(--yellow);\n  outline-offset: 3px;\n}\n\n/* =====================================\n   05. MENU A DISCESA DELLE LINGUE\n===================================== */\n\n.language-options {\n  position: absolute;\n\n  top: calc(100% + 6px);\n  left: 0;\n  right: auto;\n\n  z-index: 3000;\n\n  width: 190px;\n  max-width: calc(100vw - 28px);\n\n  max-height: min(70vh, 480px);\n\n  padding: 8px;\n\n  overflow-y: auto;\n  overscroll-behavior: contain;\n\n  background: white;\n\n  border: 1px solid #cbdff5;\n  border-radius: 8px;\n\n  box-shadow:\n    0 6px 20px rgba(0,0,0,0.2);\n\n  -webkit-overflow-scrolling: touch;\n}\n\n.language-options a {\n  display: block;\n\n  width: 100%;\n\n  padding: 10px 12px;\n\n  color: var(--main-blue);\n  background: white;\n\n  border-radius: 5px;\n\n  font-size: 14px;\n  font-weight: 600;\n\n  text-align: left;\n  text-decoration: none;\n  white-space: nowrap;\n}\n\n.language-options a:hover,\n.language-options a:focus-visible {\n  background: #eaf4ff;\n}\n\n.language-options\na[aria-current=\"page\"] {\n  background: #eaf4ff;\n  font-weight: 800;\n}\n\n/* =====================================\n   06. MENU ORIZZONTALE SCORREVOLE\n===================================== */\n\n.main-nav-links {\n  display: flex;\n  flex: 1 1 auto;\n\n  flex-wrap: nowrap;\n  align-items: center;\n\n  gap: 6px;\n\n  min-width: 0;\n\n  overflow-x: auto;\n  overflow-y: hidden;\n\n  -webkit-overflow-scrolling: touch;\n\n  scrollbar-width: thin;\n  scrollbar-color:\n    var(--yellow)\n    var(--dark-blue);\n\n  padding-bottom: 5px;\n\n  touch-action: pan-x;\n}\n\n.main-nav-links > a {\n  display: inline-flex;\n  flex: 0 0 auto;\n\n  align-items: center;\n  justify-content: center;\n\n  min-height: 42px;\n\n  padding: 8px 12px;\n\n  background: white;\n  color: var(--main-blue);\n\n  border: 1px solid #d6e5f5;\n  border-radius: 6px;\n\n  font-size: 12px;\n  font-weight: 700;\n\n  text-decoration: none;\n  white-space: nowrap;\n}\n\n.main-nav-links > a:hover,\n.main-nav-links > a:focus-visible {\n  background: var(--yellow);\n  color: #003b79;\n}\n\n/* SCROLLBAR */\n\n.main-nav-links::-webkit-scrollbar {\n  height: 6px;\n}\n\n.main-nav-links::-webkit-scrollbar-track {\n  background: var(--dark-blue);\n}\n\n.main-nav-links::-webkit-scrollbar-thumb {\n  background: var(--yellow);\n  border-radius: 10px;\n}\n\n/* =====================================\n   07. BANNER PRINCIPALE\n===================================== */\n\n.main-banner {\n  display: block;\n\n  width: 100%;\n  margin: 0;\n\n  background: var(--main-blue);\n}\n\n.main-banner img {\n  display: block;\n\n  width: 100%;\n  height: auto;\n}\n\n/* =====================================\n   08. CONTENUTO PRINCIPALE\n===================================== */\n\nmain {\n  width: 100%;\n  max-width: 1180px;\n\n  margin: 0 auto;\n  padding: 30px 15px;\n}\n\nmain section {\n  min-width: 0;\n\n  margin-bottom: 25px;\n  padding: 35px;\n\n  background: white;\n\n  border-radius: 12px;\n\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n\n  scroll-margin-top: 20px;\n}\n\nmain h2 {\n  margin-top: 0;\n  padding-bottom: 12px;\n\n  color: var(--main-blue);\n\n  border-bottom:\n    2px solid #e3edf8;\n}\n\nmain h3 {\n  color: var(--main-blue);\n}\n\n/* =====================================\n   09. SEZIONE INTRODUTTIVA\n===================================== */\n\n.hero {\n  text-align: center;\n\n  background:\n    linear-gradient(\n      135deg,\n      #eaf4ff,\n      #ffffff\n    );\n}\n\n.hero h2 {\n  border: none;\n\n  font-size:\n    clamp(25px, 4vw, 37px);\n\n  line-height: 1.4;\n}\n\n.hero p {\n  font-size: 18px;\n}\n\n/* =====================================\n   10. GRIGLIA\n===================================== */\n\n.grid {\n  display: grid;\n\n  grid-template-columns:\n    repeat(\n      auto-fit,\n      minmax(\n        min(100%, 260px),\n        1fr\n      )\n    );\n\n  gap: 20px;\n}\n\n.card {\n  min-width: 0;\n\n  padding: 24px;\n\n  background: #f4f8fc;\n\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   11. RIQUADRI IN EVIDENZA\n===================================== */\n\n.highlight {\n  margin: 20px 0;\n  padding: 24px;\n\n  background: #eaf4ff;\n\n  border-left: 5px solid #168de0;\n  border-radius: 8px;\n}\n\n/* =====================================\n   12. PULSANTI\n===================================== */\n\n.button {\n  display: inline-block;\n\n  margin: 10px 8px 0 0;\n  padding: 12px 22px;\n\n  background: var(--main-blue);\n  color: white;\n\n  border-radius: 7px;\n\n  font-weight: 700;\n  text-decoration: none;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: var(--main-blue);\n}\n\n.button.secondary:hover {\n  background: #cce2ff;\n}\n\n.note {\n  color: #596a80;\n  font-size: 14px;\n}\n\n/* =====================================\n   13. INDICE DEL SITO\n===================================== */\n\n.page-directory {\n  background: #f0f6ff;\n}\n\n.page-directory .card {\n  background: white;\n}\n\n.page-directory .button {\n  margin-top: 12px;\n}\n\n/* =====================================\n   14. PIÈ DI PAGINA\n===================================== */\n\nfooter {\n  width: 100%;\n\n  padding: 35px 15px;\n\n  background: var(--dark-blue);\n  color: white;\n\n  text-align: center;\n}\n\nfooter a {\n  color: white;\n}\n\n.footer-language-links {\n  display: flex;\n  flex-wrap: wrap;\n\n  justify-content: center;\n\n  gap: 12px 20px;\n\n  max-width: 1100px;\n\n  margin: 25px auto;\n}\n\n.footer-language-links a {\n  color: white;\n\n  font-size: 14px;\n  font-weight: 600;\n\n  text-decoration: none;\n}\n\n.footer-language-links a:hover {\n  color: var(--yellow);\n  text-decoration: underline;\n}\n\n/* =====================================\n   15. VERSIONE MOBILE\n===================================== */\n\n@media (max-width: 767px) {\n\n  header {\n    padding: 14px 12px;\n  }\n\n  .main-nav {\n    gap: 6px;\n    padding: 8px 10px;\n  }\n\n  .language-dropdown > summary {\n    padding: 8px 10px;\n    font-size: 12px;\n  }\n\n  .language-options {\n    width: 170px;\n    max-height: 60vh;\n  }\n\n  .main-nav-links {\n    gap: 5px;\n  }\n\n  .main-nav-links > a {\n    padding: 8px 9px;\n    font-size: 11px;\n  }\n\n  main {\n    padding: 15px 10px;\n  }\n\n  main section {\n    padding: 23px;\n    margin-bottom: 15px;\n  }\n\n  .card {\n    padding: 19px;\n  }\n\n  .highlight {\n    padding: 18px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin: 10px 0;\n  }\n\n}\n\n/* =====================================\n   16. SCHERMI BASSI\n===================================== */\n\n@media (max-height: 500px) {\n\n  .language-options {\n    max-height: 55vh;\n  }\n\n}\n\n/* =====================================\n   17. ACCESSIBILITÀ\n===================================== */\n\n@media (prefers-reduced-motion: reduce) {\n\n  html {\n    scroll-behavior: auto;\n  }\n\n  .language-dropdown > summary {\n    transition: none;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     INTESTAZIONE\n===================================== -->\n\n<header id=\"home\">\n\n<h1>\nINIZIATIVA PER UN POLO GLOBALE DELL'IA\n</h1>\n\n<h2>\nCittà Speciale di Goyang ·\nProvincia di Gyeonggi, Repubblica di Corea\n</h2>\n\n</header>\n\n\u003c!-- =====================================\n     NAVIGAZIONE PRINCIPALE\n===================================== -->\n\n<nav class=\"main-nav\"\naria-label=\"Navigazione principale\">\n\n\u003c!-- SELETTORE DELLA LINGUA -->\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"Seleziona la lingua del sito\">\n🌐 Lingua ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a href=\"index.html\" lang=\"ko\">\n한국어\n</a>\n\n<a href=\"index.html?lang=en\" lang=\"en\">\nEnglish\n</a>\n\n<a href=\"index.html?lang=zh\" lang=\"zh\">\n中文\n</a>\n\n<a href=\"index.html?lang=ja\" lang=\"ja\">\n日本語\n</a>\n\n<a href=\"index.html?lang=ru\" lang=\"ru\">\nРусский\n</a>\n\n<a href=\"index.html?lang=ar\" lang=\"ar\" dir=\"rtl\">\nالعربية\n</a>\n\n<a href=\"index.html?lang=es\" lang=\"es\">\nEspañol\n</a>\n\n<a href=\"index.html?lang=fr\" lang=\"fr\">\nFrançais\n</a>\n\n<a href=\"index.html?lang=de\" lang=\"de\">\nDeutsch\n</a>\n\n<a href=\"index.html?lang=it\"\nlang=\"it\"\naria-current=\"page\">\nItaliano ✓\n</a>\n\n</div>\n\n</details>\n\n\u003c!-- =====================================\n     MENU PRINCIPALE SCORREVOLE\n===================================== -->\n\n<div class=\"main-nav-links\">\n\n<a href=\"index.html?lang=it\">\nHome\n</a>\n\n<a href=\"hub.html?lang=it\">\nPolo Globale IA\n</a>\n\n<a href=\"goyang.html?lang=it\">\nPerché Goyang?\n</a>\n\n<a href=\"agencies.html?lang=it\">\nOrganizzazioni internazionali\n</a>\n\n<a href=\"strategy.html?lang=it\">\nStrategia\n</a>\n\n<a href=\"committee.html?lang=it\">\nComitato\n</a>\n\n<a href=\"history.html?lang=it\">\nCronologia\n</a>\n\n<a href=\"news.html?lang=it\">\nNotizie\n</a>\n\n<a href=\"press.html?lang=it\">\nStampa\n</a>\n\n<a href=\"participate.html?lang=it\">\nPartecipazione\n</a>\n\n<a href=\"guide.html?lang=it\">\nGuida\n</a>\n<a href=\"gallery.html?lang=it\">Galleria fotografica</a>\n<a href=\"library.html?lang=it\">Biblioteca digitale</a>\n<a href=\"resources.html?lang=it\">Centro risorse</a>\n\n</div>\n\n</nav>\n\n\u003c!-- =====================================\n     BANNER PRINCIPALE\n===================================== -->\n\n<div class=\"main-banner\">\n\n<img\nsrc=\"aihub-main-banner-it.png\"\nalt=\"Iniziativa per un Polo Globale dell'IA nella Città Speciale di Goyang\"\nwidth=\"1648\"\nheight=\"928\"\nloading=\"eager\"\nfetchpriority=\"high\">\n\n</div>\n\n<main>\n\n\u003c!-- =====================================\n     01. VISIONE\n===================================== -->\n\n<section class=\"hero\" id=\"vision\">\n\n<h2>\nIntelligenza artificiale al servizio dell'umanità\n</h2>\n\n<p>\nCooperazione internazionale per un futuro migliore\n</p>\n\n<p>\nLa nostra iniziativa intende promuovere\nla cooperazione tra organizzazioni\ninternazionali, governi, università,\nistituti di ricerca, imprese\ne società civile.\n</p>\n\n<p>\nL'obiettivo è esplorare\nle possibilità offerte\ndall'intelligenza artificiale\nper affrontare le sfide comuni\ndell'umanità e contribuire\nallo sviluppo sostenibile.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nLa nostra visione\n</strong>\n\n<p>\nAspiriamo a sviluppare\nla Città Speciale di Goyang\ncome possibile centro internazionale\ndi cooperazione nel campo\ndell'intelligenza artificiale,\ndella ricerca scientifica\ne dell'innovazione.\n</p>\n\n<p>\nQuesta iniziativa mira\na favorire il benessere\ndelle persone e lo sviluppo\nsostenibile attraverso\nla collaborazione internazionale.\n</p>\n\n</div>\n\n<a href=\"#goyang\" class=\"button\">\nPerché Goyang?\n</a>\n\n<a href=\"#partnership\"\nclass=\"button secondary\">\nCooperazione internazionale\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     02. POLO GLOBALE DELL'IA\n===================================== -->\n\n<section id=\"hub\">\n\n<h2>\n1. Che cos'è il Polo Globale dell'IA?\n</h2>\n\n<p>\nIl Polo Globale dell'Intelligenza\nArtificiale è una proposta\nper sviluppare una piattaforma\ndi cooperazione internazionale\ndedicata all'utilizzo responsabile\ndell'intelligenza artificiale.\n</p>\n\n<p>\nL'iniziativa intende collegare\nle competenze delle organizzazioni\ninternazionali con le capacità\nscientifiche e tecnologiche\ndi governi, università,\nistituti di ricerca e imprese.\n</p>\n\n<p>\nIl progetto propone di esaminare\ncome l'intelligenza artificiale\npossa contribuire alla soluzione\ndi problemi globali.\n</p>\n\n<p>\nTra i possibili settori\ndi applicazione figurano\nla sanità pubblica,\nla sicurezza alimentare,\nil cambiamento climatico,\nla protezione dell'ambiente,\nl'assistenza umanitaria,\nla migrazione,\nl'occupazione,\nl'istruzione\ne la prevenzione dei disastri.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nCooperazione internazionale\n</h3>\n\n<p>\nPromuovere il dialogo\ninternazionale, lo scambio\ndi esperienze e lo sviluppo\ndi possibili iniziative comuni\nper affrontare le sfide globali.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nRicerca e innovazione\n</h3>\n\n<p>\nEsaminare applicazioni responsabili\ndell'intelligenza artificiale\ne favorire la ricerca scientifica\ne l'innovazione tecnologica\nnell'interesse pubblico.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nApplicazioni pratiche\n</h3>\n\n<p>\nValutare possibili progetti pilota,\nsperimentazioni tecnologiche\ne applicazioni dell'intelligenza\nartificiale per affrontare\nproblemi sociali e pubblici.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nScambio di conoscenze\n</h3>\n\n<p>\nPromuovere la formazione\nspecialistica, lo scambio\ninternazionale di esperti\ne la diffusione\ndelle conoscenze scientifiche\ne tecnologiche.\n</p>\n\n</div>\n\n</div>\n\n<a href=\"hub.html?lang=it\" class=\"button\">\nScopri il Polo Globale dell'IA\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     03. PERCHÉ GOYANG?\n===================================== -->\n\n<section id=\"goyang\">\n\n<h2>\n2. Perché la Città Speciale di Goyang?\n</h2>\n\n<p>\nLa Città Speciale di Goyang\nsi trova nella Provincia\ndi Gyeonggi, nella Repubblica\ndi Corea, e fa parte\ndell'area metropolitana di Seul.\n</p>\n\n<p>\nLa città dispone\ndi infrastrutture per fiere\ne conferenze internazionali,\nistituzioni mediche,\nstrutture educative e culturali,\noltre a importanti risorse\nurbane e naturali.\n</p>\n\n<p>\nQueste caratteristiche\npossono costituire\nuna base per valutare\nla possibilità di sviluppare\nun centro internazionale\ndi cooperazione nel campo\ndell'intelligenza artificiale.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nPosizione metropolitana\n</h3>\n\n<p>\nGoyang si trova\nnell'area metropolitana di Seul\ne offre accesso a reti\neconomiche, scientifiche\ne istituzionali.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nCentro internazionale KINTEX\n</h3>\n\n<p>\nIl Korea International\nExhibition Center (KINTEX)\ndispone di strutture\nper esposizioni,\nconferenze ed eventi\ninternazionali.\n</p>\n\n<p>\nQuesta infrastruttura\npotrebbe essere utilizzata\nper forum scientifici,\nincontri internazionali\ne futuri programmi\ndi cooperazione.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nRisorse mediche e scientifiche\n</h3>\n\n<p>\nGoyang ospita\nil Centro Nazionale\nper il Cancro della Corea\ne altre istituzioni sanitarie.\n</p>\n\n<p>\nQueste risorse offrono\npossibilità di esplorare\nla cooperazione scientifica\nnei settori della sanità pubblica,\ndella ricerca medica\ne delle applicazioni\nresponsabili dell'IA.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nAmbiente e risorse naturali\n</h3>\n\n<p>\nLe zone umide di Janghang\ne altre risorse naturali\ncostituiscono importanti\nelementi per la ricerca\nambientale, l'educazione\ne le iniziative\ndi sviluppo sostenibile.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nQualità della vita\n</h3>\n\n<p>\nGoyang dispone\ndi aree residenziali,\nservizi sanitari,\nistituzioni educative,\nstrutture culturali\ne servizi urbani.\n</p>\n\n<p>\nLe esigenze specifiche\ndelle eventuali organizzazioni\ninternazionali,\ndel loro personale\ne delle rispettive famiglie\ndovrebbero essere valutate\nattraverso consultazioni\nappropriate.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nSviluppo regionale\n</h3>\n\n<p>\nUna maggiore cooperazione\ninternazionale potrebbe\ncontribuire alla ricerca,\nalla creazione di nuove\nopportunità occupazionali\ne allo sviluppo\ndelle attività economiche.\n</p>\n\n<p>\nI risultati concreti\ndipenderebbero dalla natura\ne dalla portata\ndei futuri progetti.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nCooperazione internazionale\ne sviluppo urbano sostenibile\n</strong>\n\n<p>\nGoyang intende valorizzare\nle proprie risorse\nper esplorare opportunità\ndi cooperazione internazionale\nnel settore dell'intelligenza\nartificiale.\n</p>\n\n<p>\nL'iniziativa considera\nsia le sfide globali\nsia lo sviluppo sostenibile\ndella città.\n</p>\n\n</div>\n\n<a href=\"goyang.html?lang=it\" class=\"button\">\nScopri i punti di forza di Goyang\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     04. ORGANIZZAZIONI INTERNAZIONALI\n===================================== -->\n\n<section id=\"organizations\">\n\n<h2>\n3. Organizzazioni internazionali\ne possibili settori di cooperazione\n</h2>\n\n<p>\nL'iniziativa per un Polo Globale\ndell'IA esamina possibili\nsettori di cooperazione\ncollegati alle missioni\ndi nove organizzazioni\ninternazionali.\n</p>\n\n<p>\nI settori indicati\ndi seguito rappresentano\nesclusivamente possibili\nambiti di collaborazione futura.\n</p>\n\n<p>\nNon costituiscono accordi\nconfermati né impegni\nistituzionali.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nWHO – Organizzazione Mondiale della Sanità\n</h3>\n\n<p>\nSanità pubblica,\nprevenzione delle malattie,\nrafforzamento dei sistemi sanitari,\nanalisi dei dati medici\ne utilizzo responsabile\ndell'intelligenza artificiale.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nWFP – Programma Alimentare Mondiale\n</h3>\n\n<p>\nSicurezza alimentare,\nassistenza umanitaria,\ncatene di approvvigionamento\nsostenibili e analisi\ndelle crisi alimentari.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNEP – Programma delle Nazioni Unite per l'Ambiente\n</h3>\n\n<p>\nCambiamento climatico,\nprotezione dell'ambiente,\nbiodiversità\ne monitoraggio\ndelle condizioni ambientali.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNHCR – Alto Commissariato delle Nazioni Unite per i Rifugiati\n</h3>\n\n<p>\nProtezione dei rifugiati,\nsfollamento forzato,\nassistenza umanitaria\ne utilizzo responsabile\ndei dati nelle attività\ndi protezione.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nIOM – Organizzazione Internazionale per le Migrazioni\n</h3>\n\n<p>\nMigrazione internazionale,\nassistenza alle persone\nsfollate, aiuti umanitari\ne soluzioni digitali\nper i servizi connessi\nalla migrazione.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nILO – Organizzazione Internazionale del Lavoro\n</h3>\n\n<p>\nOccupazione,\ndiritti dei lavoratori,\nformazione professionale\ne analisi degli effetti\ndell'intelligenza artificiale\nsul futuro del lavoro.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nITU – Unione Internazionale delle Telecomunicazioni\n</h3>\n\n<p>\nTelecomunicazioni digitali,\ninfrastrutture di comunicazione,\ncomunicazioni di emergenza\ne sistemi di allerta precoce\nin caso di disastri.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNICEF – Fondo delle Nazioni Unite per l'Infanzia\n</h3>\n\n<p>\nProtezione dell'infanzia,\nistruzione,\ninclusione digitale\ne utilizzo responsabile\ndell'intelligenza artificiale\nnel rispetto dei diritti\ndei bambini.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNDP – Programma delle Nazioni Unite per lo Sviluppo\n</h3>\n\n<p>\nSviluppo sostenibile,\ngestione delle crisi,\nrafforzamento delle capacità\nistituzionali e possibili\napplicazioni dell'IA\nnei programmi di sviluppo.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nAvvertenza importante\n</strong>\n\n<p>\nLe organizzazioni internazionali\nsopra indicate sono menzionate\nesclusivamente in relazione\nalle rispettive missioni\nistituzionali e ai possibili\nsettori di cooperazione futura.\n</p>\n\n<p>\nCiò non significa\nche tali organizzazioni\nabbiano confermato\nla propria partecipazione\nall'iniziativa oppure\nabbiano accettato\ndi istituire o trasferire\nuffici o unità organizzative\na Goyang.\n</p>\n\n<p>\nQualsiasi futura collaborazione\nrichiederebbe consultazioni\nufficiali, decisioni\nistituzionali appropriate\ne il rispetto delle procedure\ndi autorizzazione applicabili.\n</p>\n\n</div>\n\n<a href=\"agencies.html?lang=it\" class=\"button\">\nScopri le nove organizzazioni\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     05. STRATEGIA IN TRE FASI\n===================================== -->\n\n<section id=\"strategy\">\n\n<h2>\n4. Strategia di sviluppo in tre fasi\n</h2>\n\n<p>\nL'iniziativa propone\nun approccio graduale\nche tenga conto\ndelle esigenze effettive\ndei possibili partner\ninternazionali.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nFase 1 – Insediamento iniziale\n</h3>\n\n<p>\nValutare le condizioni\nnecessarie per consentire\nalle eventuali organizzazioni\ninternazionali e istituzioni\npartner di avviare\nstabilmente le proprie\nattività a Goyang.\n</p>\n\n<p>\nTra i possibili aspetti\nda esaminare figurano\nuffici, trasporti,\nalloggi, assistenza sanitaria,\nistruzione e altri servizi.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nFase 2 – Sostegno operativo\n</h3>\n\n<p>\nPromuovere la collaborazione\ntra istituzioni pubbliche,\nuniversità, centri di ricerca,\nimprese e società civile.\n</p>\n\n<p>\nEsaminare possibili\nprogetti di ricerca congiunti,\nconferenze internazionali,\nsperimentazioni dell'IA\ne programmi di scambio\ndi esperti.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nFase 3 – Crescita sostenibile condivisa\n</h3>\n\n<p>\nSviluppare una cooperazione\na lungo termine\nche contribuisca\nsia agli obiettivi\ndelle organizzazioni\ninternazionali\nsia allo sviluppo\nsostenibile di Goyang.\n</p>\n\n<p>\nTra i possibili risultati\nfigurano nuove opportunità\ndi ricerca, occupazione,\nattività economiche\ne sviluppo regionale.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nInsediamento iniziale\n→ Sostegno operativo\n→ Crescita condivisa\n</strong>\n\n<p>\nLe strutture concrete,\nle risorse finanziarie,\nle misure istituzionali\ne i programmi di cooperazione\ndovrebbero essere definiti\nattraverso consultazioni\ne procedure ufficiali.\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=it\" class=\"button\">\nScopri la strategia\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     06. COMITATO CIVICO\n===================================== -->\n\n<section id=\"committee\">\n\n<h2>\n5. Comitato civico per l'iniziativa\n</h2>\n\n<p>\nIl Comitato Civico\nper la Promozione\ndell'Insediamento\ndi un Polo Globale dell'IA\nnella Città Speciale di Goyang\nè un'iniziativa\ndella società civile.\n</p>\n\n<p>\nIl Comitato intende\nrafforzare la consapevolezza\npubblica e promuovere\nla partecipazione dei cittadini\nal dibattito sulla cooperazione\ninternazionale,\nsull'intelligenza artificiale\ne sullo sviluppo urbano\nsostenibile.\n</p>\n\n<p>\nLe attività comprendono\nla diffusione di informazioni,\nla promozione\ndella partecipazione civica,\nla discussione\ndi proposte strategiche\ne il dialogo\ncon le istituzioni interessate.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nI nostri principi\n</strong>\n\n<p>\nTrasparenza,\nresponsabilità,\npartecipazione civica\ncostruttiva e rispetto\ndelle procedure decisionali\nufficiali.\n</p>\n\n</div>\n\n<a href=\"committee.html?lang=it\" class=\"button\">\nScopri il Comitato\n</a>\n\n<a href=\"participate.html?lang=it\"\nclass=\"button secondary\">\nPartecipazione civica\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     07. COOPERAZIONE INTERNAZIONALE\n===================================== -->\n\n<section id=\"partnership\">\n\n<h2>\n6. Opportunità di cooperazione internazionale\n</h2>\n\n<p>\nL'iniziativa intende\npromuovere il dialogo\ncon organizzazioni\ninternazionali,\nistituti di ricerca,\nesperti e altre istituzioni\ninteressate all'intelligenza\nartificiale responsabile,\nalla cooperazione\ninternazionale\ne allo sviluppo sostenibile.\n</p>\n\n<p>\nI possibili settori\ndi cooperazione comprendono:\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nDialogo istituzionale\n</h3>\n\n<p>\nScambio di esperienze\ne prospettive\nsulla cooperazione\ninternazionale,\nsulla governance dell'IA\ne sull'innovazione tecnologica\nnell'interesse pubblico.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nCooperazione scientifica\n</h3>\n\n<p>\nEsplorazione delle possibilità\ndi ricerca multidisciplinare,\nscambio di conoscenze\ne sviluppo di reti\nscientifiche internazionali.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nProgetti tecnologici\n</h3>\n\n<p>\nValutazione di possibili\nprogetti pilota,\napplicazioni pratiche\ne strumenti per esaminare\nl'utilizzo responsabile\ndelle tecnologie di IA.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nScambio di esperti\n</h3>\n\n<p>\nEsame di possibili\nprogrammi di formazione,\nseminari,\nforum internazionali\ne iniziative\nper lo sviluppo\ndelle competenze.\n</p>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nI settori indicati\nrappresentano esclusivamente\npossibili ambiti\ndi cooperazione futura.\nNon implicano l'esistenza\ndi accordi confermati\ncon organizzazioni\ninternazionali.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     08. CONTATTI E INFORMAZIONI\n===================================== -->\n\n<section id=\"contact\">\n\n<h2>\n7. Contatti e ulteriori informazioni\n</h2>\n\n<p>\nAccogliamo con interesse\nl'attenzione di organizzazioni\ninternazionali,\nistituti di ricerca,\nesperti e cittadini\nverso l'iniziativa\nper un Polo Globale dell'IA\ne le attività\ndel Comitato Civico.\n</p>\n\n<p>\nUlteriori informazioni\nsono disponibili\nnelle pagine in lingua\nitaliana di questo sito.\n</p>\n\n<p>\nLa versione coreana\ndel sito offre\ndocumenti e servizi\naggiuntivi in lingua coreana.\n</p>\n\n<a href=\"guide.html?lang=it\" class=\"button\">\nGuida al sito\n</a>\n\n<a href=\"index.html\"\nclass=\"button secondary\">\nVersione coreana\n</a>\n\n<div class=\"highlight\">\n\n<strong>\nIniziativa per un Polo Globale dell'IA\n<br>\nCittà Speciale di Goyang\n<br>\nProvincia di Gyeonggi\n<br>\nRepubblica di Corea\n</strong>\n\n<p>\nComitato Civico\nper la Promozione\ndell'Insediamento\ndi un Polo Globale dell'IA\na Goyang\n</p>\n\n<p class=\"note\">\nQuesto sito presenta\nun'iniziativa\ndella società civile\ne le relative attività.\n</p>\n\n<p class=\"note\">\nNon implica\nche le autorità governative\nabbiano adottato\nuna decisione ufficiale\nsulla creazione\ndi un Polo Globale dell'IA,\nné che organizzazioni\ninternazionali\nabbiano confermato\nla propria partecipazione.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     09. PAGINE IN ITALIANO\n===================================== -->\n\n<section id=\"directory\" class=\"page-directory\">\n\n<h2>\n8. Pagine disponibili in italiano\n</h2>\n\n<p>\nLe seguenti pagine\nforniscono ulteriori\ninformazioni sul Polo Globale\ndell'IA, sulla Città Speciale\ndi Goyang, sulla cooperazione\ninternazionale\ne sulla partecipazione civica.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nPolo Globale dell'IA\n</h3>\n\n<p>\nConcetto,\nobiettivi e possibili\nsettori di cooperazione\ninternazionale.\n</p>\n\n<a href=\"hub.html?lang=it\" class=\"button\">\nScopri di più\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPerché Goyang?\n</h3>\n\n<p>\nVantaggi geografici,\ninfrastrutture\ne opportunità\ndi sviluppo.\n</p>\n\n<a href=\"goyang.html?lang=it\" class=\"button\">\nScopri di più\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nOrganizzazioni internazionali\n</h3>\n\n<p>\nNove organizzazioni\ninternazionali\ne possibili settori\ndi cooperazione.\n</p>\n\n<a href=\"agencies.html?lang=it\" class=\"button\">\nScopri di più\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nStrategia di sviluppo\n</h3>\n\n<p>\nInsediamento iniziale,\nsostegno operativo\ne crescita condivisa.\n</p>\n\n<a href=\"strategy.html?lang=it\" class=\"button\">\nScopri di più\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nComitato Civico\n</h3>\n\n<p>\nMissione,\norganizzazione\ne principali attività\ndel Comitato Civico.\n</p>\n\n<a href=\"committee.html?lang=it\" class=\"button\">\nScopri di più\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nCronologia\n</h3>\n\n<p>\nPrincipali eventi\ne tappe di sviluppo\ndell'iniziativa.\n</p>\n\n<a href=\"history.html?lang=it\" class=\"button\">\nScopri di più\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nNotizie\n</h3>\n\n<p>\nInformazioni\nsulle attività,\nsugli eventi\ne sugli sviluppi recenti.\n</p>\n\n<a href=\"news.html?lang=it\" class=\"button\">\nLeggi le notizie\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nStampa\n</h3>\n\n<p>\nArticoli di stampa,\nnotizie\ne materiali informativi.\n</p>\n\n<a href=\"press.html?lang=it\" class=\"button\">\nRassegna stampa\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPartecipazione civica\n</h3>\n\n<p>\nInformazioni\nsulle possibilità\ndi sostenere l'iniziativa\ne partecipare\nalle sue attività.\n</p>\n\n<a href=\"participate.html?lang=it\" class=\"button\">\nPartecipa\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nGuida al sito\n</h3>\n\n<p>\nInformazioni\nsull'utilizzo del sito\ne sulla consultazione\ndei documenti.\n</p>\n\n<a href=\"guide.html?lang=it\" class=\"button\">\nApri la guida\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     10. SITO MULTILINGUE\n===================================== -->\n\n<section id=\"languages\">\n\n<h2>\n9. Sito web multilingue\n</h2>\n\n<p>\nIl sito dell'iniziativa\nper un Polo Globale dell'IA\noffre pagine principali\nin dieci lingue.\n</p>\n\n<p>\nL'obiettivo è facilitare\nl'accesso alle informazioni\nper visitatori\ndi diversi Paesi,\norganizzazioni internazionali,\nistituti di ricerca,\nimprese e cittadini.\n</p>\n\n<p>\nÈ possibile selezionare\nla lingua preferita\nattraverso il menu\nsituato nella parte\nsuperiore della pagina.\n</p>\n\n<p>\nLa versione coreana\noffre ulteriori documenti\ne servizi in lingua coreana.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nLingue disponibili\n</strong>\n\n<p>\n<a href=\"index.html\" lang=\"ko\">\n한국어 – Coreano\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=en\" lang=\"en\">\nEnglish – Inglese\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=zh\" lang=\"zh\">\n中文 – Cinese\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ja\" lang=\"ja\">\n日本語 – Giapponese\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ru\" lang=\"ru\">\nРусский – Russo\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ar\"\nlang=\"ar\" dir=\"rtl\">\nالعربية – Arabo\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=es\" lang=\"es\">\nEspañol – Spagnolo fr\">\n\n<link rel=\"alternate\" hreflang=\"de\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=de\">\n\n<link rel=\"alternate\" hreflang=\"it\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=it\">\n\n<link rel=\"alternate\" hreflang=\"x-default\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=en\">\n\n<style>\n\n/* =====================================\n   1. BASIC SETTINGS\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  min-width: 0;\n  font-family:\n    \"Noto Sans JP\",\n    \"Hiragino Kaku Gothic ProN\",\n    \"Yu Gothic\",\n    Meiryo,\n    Arial,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.85;\n}\n\n:root {\n  --main-blue: #0754a6;\n  --dark-blue: #10315e;\n  --yellow: #ffe44d;\n  --language-color: #008c95;\n}\n\na {\n  color: var(--main-blue);\n}\n\na:focus-visible,\nsummary:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   2. HEADER\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n  color: white;\n  padding: 16px 20px;\n  text-align: center;\n}\n\nheader h1 {\n  font-size: clamp(22px, 3vw, 30px);\n  margin: 0 0 4px;\n  line-height: 1.4;\n}\n\nheader h2 {\n  font-size: 15px;\n  font-weight: normal;\n  color: #dcecff;\n  margin: 0;\n  padding: 0;\n  border: none;\n}\n\n/* =====================================\n   3. NAVIGATION\n===================================== */\n\n.main-nav {\n  position: relative;\n  z-index: 1000;\n\n  display: flex;\n  flex-wrap: nowrap;\n  align-items: center;\n\n  width: 100%;\n  min-width: 0;\n\n  padding: 10px 12px;\n  gap: 8px;\n\n  background: var(--dark-blue);\n}\n\n/* =====================================\n   4. LANGUAGE DROPDOWN\n===================================== */\n\n.language-dropdown {\n  position: relative;\n\n  flex: 0 0 auto;\n\n  margin: 0;\n\n  z-index: 2000;\n}\n\n.language-dropdown > summary {\n  display: inline-flex;\n  justify-content: center;\n  align-items: center;\n\n  min-height: 42px;\n\n  padding: 9px 14px;\n\n  background: var(--language-color);\n  color: white;\n\n  border: 1px solid var(--language-color);\n  border-radius: 7px;\n\n  font-size: 13px;\n  font-weight: 800;\n\n  cursor: pointer;\n  white-space: nowrap;\n\n  list-style: none;\n  user-select: none;\n}\n\n.language-dropdown > summary::-webkit-details-marker {\n  display: none;\n}\n\n.language-dropdown > summary::marker {\n  content: \"\";\n}\n\n.language-dropdown > summary:hover,\n.language-dropdown[open] > summary {\n  background: #006e76;\n  border-color: #006e76;\n}\n\n.language-dropdown > summary:focus-visible {\n  outline: 3px solid var(--yellow);\n  outline-offset: 3px;\n}\n\n/* =====================================\n   5. LANGUAGE OPTIONS\n===================================== */\n\n.language-options {\n  position: absolute;\n\n  top: calc(100% + 6px);\n  left: 0;\n  right: auto;\n\n  width: 190px;\n  max-width: calc(100vw - 24px);\n\n  max-height: min(70vh, 480px);\n\n  overflow-y: auto;\n  overscroll-behavior: contain;\n\n  padding: 8px;\n\n  background: white;\n\n  border: 1px solid #cbdff5;\n  border-radius: 8px;\n\n  box-shadow:\n    0 6px 20px rgba(0,0,0,0.2);\n\n  z-index: 3000;\n\n  -webkit-overflow-scrolling: touch;\n}\n\n.language-options a {\n  display: block;\n\n  width: 100%;\n\n  padding: 10px 12px;\n\n  color: var(--main-blue);\n  background: white;\n\n  border-radius: 5px;\n\n  font-size: 14px;\n  font-weight: 600;\n\n  text-align: left;\n  text-decoration: none;\n\n  white-space: nowrap;\n}\n\n.language-options a:hover,\n.language-options a:focus-visible {\n  background: #eaf4ff;\n}\n\n.language-options a[aria-current=\"page\"] {\n  background: #eaf4ff;\n  font-weight: 800;\n}\n\n/* =====================================\n   6. INDEPENDENT MENU SCROLL\n===================================== */\n\n.main-nav-links {\n  display: flex;\n  flex: 1 1 auto;\n\n  flex-wrap: nowrap;\n  align-items: center;\n\n  gap: 6px;\n\n  min-width: 0;\n\n  overflow-x: auto;\n  overflow-y: hidden;\n\n  padding: 2px 0 6px;\n\n  -webkit-overflow-scrolling: touch;\n\n  scrollbar-width: thin;\n  scrollbar-color:\n    var(--yellow)\n    var(--dark-blue);\n}\n\n.main-nav-links > a {\n  display: inline-flex;\n\n  flex: 0 0 auto;\n\n  align-items: center;\n  justify-content: center;\n\n  min-height: 40px;\n\n  padding: 8px 12px;\n\n  background: white;\n  color: var(--main-blue);\n\n  border: 1px solid #d6e5f5;\n  border-radius: 6px;\n\n  font-size: 12px;\n  font-weight: 700;\n\n  text-decoration: none;\n  white-space: nowrap;\n}\n\n.main-nav-links > a:hover,\n.main-nav-links > a:focus-visible {\n  background: var(--yellow);\n  color: #003b79;\n}\n\n/* SCROLLBAR */\n\n.main-nav-links::-webkit-scrollbar {\n  height: 6px;\n}\n\n.main-nav-links::-webkit-scrollbar-track {\n  background: var(--dark-blue);\n}\n\n.main-nav-links::-webkit-scrollbar-thumb {\n  background: var(--yellow);\n  border-radius: 10px;\n}\n\n/* =====================================\n   7. MAIN BANNER\n===================================== */\n\n.main-banner {\n  width: 100%;\n  margin: 0;\n  background: var(--main-blue);\n}\n\n.main-banner img {\n  display: block;\n  width: 100%;\n  height: auto;\n}\n\n/* =====================================\n   8. MAIN CONTENT\n===================================== */\n\nmain {\n  max-width: 1180px;\n  margin: auto;\n  padding: 30px 15px;\n}\n\nmain section {\n  background: white;\n\n  border-radius: 12px;\n\n  padding: 35px;\n  margin-bottom: 25px;\n\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n\n  scroll-margin-top: 20px;\n}\n\nmain h2 {\n  color: var(--main-blue);\n\n  border-bottom: 2px solid #e3edf8;\n\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nmain h3 {\n  color: var(--main-blue);\n}\n\n/* =====================================\n   9. HERO\n===================================== */\n\nmain .hero {\n  text-align: center;\n\n  background: linear-gradient(\n    135deg,\n    #eaf4ff,\n    #ffffff\n  );\n}\n\nmain .hero h2 {\n  border: none;\n\n  font-size: clamp(\n    25px,\n    4vw,\n    37px\n  );\n\n  line-height: 1.5;\n}\n\nmain .hero p {\n  font-size: 18px;\n}\n\n/* =====================================\n   10. GRID\n===================================== */\n\n.grid {\n  display: grid;\n\n  grid-template-columns:\n    repeat(\n      auto-fit,\n      minmax(min(100%, 260px), 1fr)\n    );\n\n  gap: 20px;\n}\n\n.card {\n  min-width: 0;\n\n  background: #f4f8fc;\n\n  padding: 24px;\n\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   11. HIGHLIGHT\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n\n  border-left: 5px solid #168de0;\n\n  padding: 24px;\n  margin: 20px 0;\n\n  border-radius: 8px;\n}\n\n/* =====================================\n   12. BUTTONS\n===================================== */\n\n.button {\n  display: inline-block;\n\n  background: var(--main-blue);\n  color: white;\n\n  padding: 12px 22px;\n\n  border-radius: 7px;\n\n  text-decoration: none;\n  font-weight: 700;\n\n  margin: 10px 8px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: var(--main-blue);\n}\n\n.button.secondary:hover {\n  background: #cce2ff;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   13. PAGE DIRECTORY\n===================================== */\n\n.page-directory {\n  background: #f0f6ff !important;\n}\n\n.page-directory .card {\n  background: white;\n}\n\n.page-directory .button {\n  margin-top: 12px;\n}\n\n/* =====================================\n   14. FOOTER\n===================================== */\n\nfooter {\n  background: var(--dark-blue);\n\n  color: white;\n\n  text-align: center;\n\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n.footer-language-links {\n  max-width: 1100px;\n  margin: 20px auto;\n\n  display: flex;\n  flex-wrap: wrap;\n\n  justify-content: center;\n  align-items: center;\n\n  gap: 10px 18px;\n}\n\n.footer-language-links a {\n  color: white;\n  text-decoration: none;\n  font-size: 14px;\n}\n\n.footer-language-links a:hover {\n  color: var(--yellow);\n  text-decoration: underline;\n}\n\n.footer-language-links\na[aria-current=\"page\"] {\n  color: var(--yellow);\n  font-weight: 800;\n}\n\n/* =====================================\n   15. MOBILE\n===================================== */\n\n@media (max-width: 767px) {\n\n  header {\n    padding: 14px 12px;\n  }\n\n  .main-nav {\n    padding: 8px 10px;\n    gap: 6px;\n  }\n\n  .language-dropdown > summary {\n    padding: 8px 10px;\n    font-size: 12px;\n  }\n\n  .language-options {\n    width: 170px;\n    max-height: 60vh;\n  }\n\n  .main-nav-links {\n    gap: 5px;\n  }\n\n  .main-nav-links > a {\n    padding: 8px 9px;\n    font-size: 11px;\n  }\n\n  main {\n    padding: 18px 10px;\n  }\n\n  main section {\n    padding: 23px;\n  }\n\n  .card {\n    padding: 19px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin: 10px 0;\n  }\n\n}\n\n/* =====================================\n   16. SHORT LANDSCAPE SCREENS\n===================================== */\n\n@media (max-height: 450px) {\n\n  .language-options {\n    max-height: 55vh;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header id=\"home\">\n\n<h1>\nグローバルAIハブ構想\n</h1>\n\n<h2>\n大韓民国・京畿道 高陽特例市\n</h2>\n\n</header>\n\n\u003c!-- =====================================\n     MAIN NAVIGATION\n===================================== -->\n\n<nav class=\"main-nav\"\naria-label=\"メインナビゲーション\">\n\n\u003c!-- LANGUAGE BUTTON: FIXED LEFT -->\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"言語を選択\">\n🌐 言語 ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a href=\"index.html\" lang=\"ko\">\n한국어\n</a>\n\n<a href=\"index.html?lang=en\" lang=\"en\">\nEnglish\n</a>\n\n<a href=\"index.html?lang=zh\" lang=\"zh\">\n中文\n</a>\n\n<a href=\"index.html?lang=ja\"\nlang=\"ja\"\naria-current=\"page\">\n日本語 ✓\n</a>\n\n<a href=\"index.html?lang=ru\" lang=\"ru\">\nРусский\n</a>\n\n<a href=\"index.html?lang=ar\"\nlang=\"ar\"\ndir=\"rtl\">\nالعربية\n</a>\n\n<a href=\"index.html?lang=es\" lang=\"es\">\nEspañol\n</a>\n\n<a href=\"index.html?lang=fr\" lang=\"fr\">\nFrançais\n</a>\n\n<a href=\"index.html?lang=de\" lang=\"de\">\nDeutsch\n</a>\n\n<a href=\"index.html?lang=it\" lang=\"it\">\nItaliano\n</a>\n\n</div>\n\n</details>\n\n\u003c!-- INDEPENDENT SCROLL AREA -->\n\n<div class=\"main-nav-links\">\n\n<a href=\"index.html?lang=ja\">\nホーム\n</a>\n\n<a href=\"hub.html?lang=ja\">\nグローバルAIハブ\n</a>\n\n<a href=\"goyang.html?lang=ja\">\n高陽特例市\n</a>\n\n<a href=\"agencies.html?lang=ja\">\n国際機関\n</a>\n\n<a href=\"strategy.html?lang=ja\">\n誘致戦略\n</a>\n\n<a href=\"committee.html?lang=ja\">\n市民推進委員会\n</a>\n\n<a href=\"history.html?lang=ja\">\n推進の歩み\n</a>\n\n<a href=\"news.html?lang=ja\">\nニュース\n</a>\n\n<a href=\"press.html?lang=ja\">\nメディア報道\n</a>\n\n<a href=\"participate.html?lang=ja\">\n市民参加\n</a>\n\n<a href=\"guide.html?lang=ja\">\n利用ガイド\n</a>\n<a href=\"gallery.html?lang=ja\">活動写真館</a>\n<a href=\"library.html?lang=ja\">デジタル図書館</a>\n<a href=\"resources.html?lang=ja\">資料センター</a>\n\n</div>\n\n</nav>\n\n\u003c!-- =====================================\n     MAIN BANNER\n===================================== -->\n\n<div class=\"main-banner\">\n\n<img\nsrc=\"aihub-main-banner-ja.png\"\nalt=\"高陽特例市グローバルAIハブ構想\"\nloading=\"eager\"\nfetchpriority=\"high\">\n\n</div>\n\n\u003c!-- =====================================\n     END OF PART 1\n     PART 2 STARTS WITH <main>\n===================================== -->\n\n<main>\n\n\u003c!-- =====================================\n     VISION\n===================================== -->\n\n<section class=\"hero\" id=\"vision\">\n\n<h2>\n人類のための人工知能<br>\nより良い未来のための国際協力\n</h2>\n\n<p>\n国際機関、各国政府、研究機関、\n大学、企業、市民社会を結び、\n世界共通の課題解決を目指します。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n私たちのビジョン\n</strong>\n\n<p>\n高陽特例市を、\n人工知能と国際協力を通じて\n持続可能な発展と人々の幸福に貢献する\n国際協力の拠点へと発展させることを目指します。\n</p>\n\n</div>\n\n<a href=\"#goyang\" class=\"button\">\nなぜ高陽特例市なのか？\n</a>\n\n<a href=\"#partnership\" class=\"button secondary\">\n国際協力の可能性\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     GLOBAL AI HUB\n===================================== -->\n\n<section id=\"hub\">\n\n<h2>\n1. グローバルAIハブとは？\n</h2>\n\n<p>\n構想段階にあるグローバルAIハブは、\n国際機関が持つ専門知識と\n人工知能技術の発展を結びつける\n国際協力プラットフォームを目指しています。\n</p>\n\n<p>\n公衆衛生、食料安全保障、\n気候変動、環境保全、\n人道支援、移住、雇用、\n教育、防災など、\n複雑な地球規模の課題に対して、\nAIをどのように活用できるかを探ります。\n</p>\n\n<p>\n国際機関、各国政府、\n大学、研究機関、企業、\n市民社会の間で\n知識の共有と協力を促進することを目指します。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>国際協力</h3>\n\n<p>\n国や機関の枠を越えた\n政策対話、知識交流、\n国際協力を促進します。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>AI研究と技術革新</h3>\n\n<p>\n公共の利益に資する\n責任あるAIの活用を探り、\n研究と技術革新を促進します。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>実践的な課題解決</h3>\n\n<p>\nAIの実証事業、\n技術評価、\n科学的根拠に基づく\n課題解決の可能性を検討します。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>人材育成と能力開発</h3>\n\n<p>\n専門人材の育成、\n国際交流、研修、\n知識共有の機会を探ります。\n</p>\n\n</div>\n\n</div>\n\n<a href=\"hub.html?lang=ja\" class=\"button\">\nグローバルAIハブについて詳しく見る\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     GOYANG\n===================================== -->\n\n<section id=\"goyang\">\n\n<h2>\n2. なぜ高陽特例市なのか？\n</h2>\n\n<p>\n高陽特例市は、\n大韓民国京畿道に位置する\n首都圏の主要都市の一つです。\n</p>\n\n<p>\n国際展示・コンベンション施設、\n医療機関、都市インフラ、\n教育・文化資源、\n豊かな自然環境などを備えており、\n国際協力拠点の形成を検討するための\n基盤を有しています。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>首都圏の立地優位性</h3>\n\n<p>\n高陽特例市は首都圏に位置し、\n韓国の主要な経済、\n研究、公共機関のネットワークへの\nアクセスが可能です。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>KINTEX国際会議・展示施設</h3>\n\n<p>\nKINTEXは、\n国際展示会、会議、\n専門家交流などに対応する\n施設を備えています。\n</p>\n\n<p>\nこれらの施設は、\n将来の国際会議やフォーラム、\n協力事業を支える基盤となり得ます。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>医療・研究分野の可能性</h3>\n\n<p>\n高陽特例市には、\n韓国国立がんセンターをはじめとする\n医療機関があります。\n</p>\n\n<p>\nこうした資源を活用し、\n公衆衛生、医学研究、\n責任あるAI活用などの分野で\n協力の可能性を検討できます。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>環境・生態資源</h3>\n\n<p>\n長項湿地をはじめとする\n生態環境資源は、\n環境教育、研究、\n持続可能性に関する\n協力の可能性を提供します。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>生活環境</h3>\n\n<p>\n高陽特例市には、\n住宅、医療サービス、\n教育施設、文化施設、\n都市インフラなどがあります。\n</p>\n\n<p>\n国際機関の職員とその家族に\n必要な具体的な生活条件については、\n関係機関との協議を通じた\n検討が必要です。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>地域発展の可能性</h3>\n\n<p>\n国際協力の拡大は、\n研究開発、専門職雇用、\n企業活動、関連サービス産業などに\n新たな機会をもたらす可能性があります。\n</p>\n\n<p>\n実際の成果は、\n将来の協力事業の規模や\n実施形態によって異なります。\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n国際協力と地域の持続可能な成長\n</strong>\n\n<p>\n高陽特例市が持つ都市資源を生かし、\n国際協力と地域発展の双方に貢献する\nグローバルAIハブの可能性を探ります。\n</p>\n\n</div>\n\n<a href=\"goyang.html?lang=ja\" class=\"button\">\n高陽特例市の強みを見る\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     INTERNATIONAL ORGANIZATIONS\n===================================== -->\n\n<section id=\"organizations\">\n\n<h2>\n3. 国際機関と協力の可能性\n</h2>\n\n<p>\nグローバルAIハブ構想では、\n9つの国際機関の専門分野に着目し、\nAIを活用した国際協力の可能性を\n検討しています。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>WHO</h3>\n\n<p>\n<strong>世界保健機関</strong>\n</p>\n\n<p>\n公衆衛生、疾病予防、\n保健医療システム、\n健康情報分析における\nAI活用の可能性。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>WFP</h3>\n\n<p>\n<strong>国連世界食糧計画</strong>\n</p>\n\n<p>\n食料安全保障、\n人道支援、サプライチェーンの強靱化、\n食料危機分析へのAI活用。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNEP</h3>\n\n<p>\n<strong>国連環境計画</strong>\n</p>\n\n<p>\n気候変動、環境保全、\n生物多様性、\n環境モニタリングへの\nAI活用の可能性。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNHCR</h3>\n\n<p>\n<strong>国連難民高等弁務官事務所</strong>\n</p>\n\n<p>\n難民保護、強制移動、\n人道支援、\n保護活動に関連する\n責任あるデータ分析。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>IOM</h3>\n\n<p>\n<strong>国際移住機関</strong>\n</p>\n\n<p>\n国際移住、避難民支援、\n人道支援、\n移住関連サービスの改善に向けた\nデジタル技術の活用。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>ILO</h3>\n\n<p>\n<strong>国際労働機関</strong>\n</p>\n\n<p>\n雇用、労働者の権利、\n技能開発、\nAIが将来の労働市場に与える\n影響の分析。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>ITU</h3>\n\n<p>\n<strong>国際電気通信連合</strong>\n</p>\n\n<p>\nデジタル接続、\n電気通信インフラ、\n緊急通信、\n災害早期警報技術。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNICEF</h3>\n\n<p>\n<strong>国連児童基金</strong>\n</p>\n\n<p>\n子どもの保護、\n教育、デジタル包摂、\n子どもの権利を守る\n責任あるAI活用。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNDP</h3>\n\n<p>\n<strong>国連開発計画</strong>\n</p>\n\n<p>\n持続可能な開発、\n危機対応、組織能力の強化、\n開発計画における\nAI活用の可能性。\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n重要なお知らせ\n</strong>\n\n<p>\n上記の国際機関は、\nそれぞれの設立目的や専門分野に基づき、\n将来的な協力の可能性を\n検討する対象として紹介しています。\n</p>\n\n<p>\nこれらの機関が\nグローバルAIハブへの参加、\n移転、事務所設置などに\n同意したことを意味するものではありません。\n</p>\n\n<p>\n将来の協力には、\n関係機関との協議、\n正式な意思決定、\n必要な合意手続きが求められます。\n</p>\n\n</div>\n\n<a href=\"agencies.html?lang=ja\" class=\"button\">\n9つの国際機関について詳しく見る\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     DEVELOPMENT STRATEGY\n===================================== -->\n\n<section id=\"strategy\">\n\n<h2>\n4. 3段階の発展戦略\n</h2>\n\n<p>\nグローバルAIハブ構想では、\n国際機関と協力機関の実際のニーズを考慮し、\n3段階の発展戦略を提案しています。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\n第1段階 — 初期定着\n</h3>\n\n<p>\n参加機関や協力機関が\n高陽特例市に安定して\n活動拠点を設けられるよう、\n必要な条件を検討します。\n</p>\n\n<p>\n事務施設、交通、住宅、\n医療、教育、\n生活サービスなどが\n検討対象となります。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n第2段階 — 運営支援\n</h3>\n\n<p>\n公共機関、大学、\n研究機関、企業、\n市民社会の協力を促進します。\n</p>\n\n<p>\n共同研究、国際会議、\nAI実証事業、\n専門人材交流などの\n可能性を検討します。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n第3段階 — 持続可能な共同成長\n</h3>\n\n<p>\n参加する国際機関の使命達成に\n貢献するとともに、\n高陽特例市の研究開発、\n雇用、企業活動、\n地域経済の発展につながる\n長期的な協力を目指します。\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n初期定着 → 運営支援 → 共同成長\n</strong>\n\n<p>\n具体的な施設、資金、\n制度的支援、\n協力事業の内容については、\n関係機関との協議と\n正式な承認手続きが必要です。\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=ja\" class=\"button\">\n誘致戦略について詳しく見る\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     COMMITTEE\n===================================== -->\n\n<section id=\"committee\">\n\n<h2>\n5. 市民推進委員会について\n</h2>\n\n<p>\n「グローバルAIハブ高陽特例市誘致\n市民推進委員会」は、\nグローバルAIハブ構想に関する\n市民の理解と参加を促進する\n市民主体の組織です。\n</p>\n\n<p>\n委員会は、\n国際協力とAI技術革新がもたらす\n可能性について社会的な議論を促し、\n市民の関心と参加を広げることを\n目指しています。\n</p>\n\n<p>\n主な活動には、\n情報発信、市民参加の促進、\n政策に関する議論、\n関連機関との交流などがあります。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n私たちの約束\n</strong>\n\n<p>\n透明性と責任を重視し、\n建設的な市民参加を通じて、\n国際協力と高陽特例市の\n持続可能な発展に貢献します。\n</p>\n\n</div>\n\n<a href=\"committee.html?lang=ja\" class=\"button\">\n市民推進委員会について\n</a>\n\n<a href=\"participate.html?lang=ja\"\nclass=\"button secondary\">\n市民参加\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     INTERNATIONAL PARTNERSHIP\n===================================== -->\n\n<section id=\"partnership\">\n\n<h2>\n6. 国際協力の可能性\n</h2>\n\n<p>\nグローバルAIハブ構想では、\n責任あるAI、\n国際協力、\n持続可能な開発に関心を持つ\n機関や組織との対話を\n促進することを目指しています。\n</p>\n\n<p>\n想定される協力分野は次のとおりです。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>政策対話</h3>\n\n<p>\n国際協力、\nAIガバナンス、\n公共の利益に資する技術革新について\n意見や経験を共有します。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>研究協力</h3>\n\n<p>\n学際的な共同研究、\n知識交流、\n研究ネットワーク形成の\n可能性を探ります。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>技術実証</h3>\n\n<p>\n責任あるAIの実証事業や\n実践的な技術活用の\n可能性を検討します。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>専門人材交流</h3>\n\n<p>\n研修、ワークショップ、\n国際フォーラム、\n能力開発事業などを\n検討します。\n</p>\n\n</div>\n\n</div>\n\n<p class=\"note\">\n関係機関による正式な確認がない限り、\nこれらはすべて構想・検討段階の\n協力可能性を示すものです。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     CONTACT\n===================================== -->\n\n<section id=\"contact\">\n\n<h2>\n7. お問い合わせ・関連情報\n</h2>\n\n<p>\n国際機関、研究機関、\nその他関心をお持ちの皆様に、\nグローバルAIハブ構想と\n市民推進委員会の活動について\nご理解いただければ幸いです。\n</p>\n\n<p>\n詳しい情報は、\n本ウェブサイトの日本語ページを\nご覧ください。\n</p>\n\n<p>\n韓国語の公式ホームページでは、\n関連する韓国語資料や\n各種サービスをご利用いただけます。\n</p>\n\n<a href=\"guide.html?lang=ja\" class=\"button\">\nウェブサイト利用ガイド\n</a>\n\n<a href=\"index.html\" class=\"button secondary\">\n韓国語ホームページ\n</a>\n\n<div class=\"highlight\">\n\n<strong>\nグローバルAIハブ構想<br>\n大韓民国 京畿道 高陽特例市\n</strong>\n\n<p>\nグローバルAIハブ高陽特例市誘致\n市民推進委員会\n</p>\n\n<p class=\"note\">\n本ウェブサイトは、\n市民主体の構想と活動を紹介するものです。\n政府による正式な立地決定や、\n国際機関による参加の確約を\n意味するものではありません。\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     JAPANESE WEBSITE DIRECTORY\n===================================== -->\n\n<section id=\"directory\" class=\"page-directory\">\n\n<h2>\n8. グローバルAIハブ関連ページ\n</h2>\n\n<p>\nグローバルAIハブ構想、\n高陽特例市、\n国際協力、\n市民参加について、\n以下の日本語ページから\n詳しい情報をご覧いただけます。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>グローバルAIハブ</h3>\n\n<p>\n国際協力プラットフォームの\n構想とビジョンを紹介します。\n</p>\n\n<a href=\"hub.html?lang=ja\" class=\"button\">\n詳しく見る\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>なぜ高陽特例市なのか？</h3>\n\n<p>\n高陽特例市の立地条件、\n都市インフラ、\n発展の可能性を紹介します。\n</p>\n\n<a href=\"goyang.html?lang=ja\" class=\"button\">\n詳しく見る\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>国際機関</h3>\n\n<p>\n9つの国際機関と\n潜在的な協力分野を紹介します。\n</p>\n\n<a href=\"agencies.html?lang=ja\" class=\"button\">\n詳しく見る\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>誘致戦略</h3>\n\n<p>\n初期定着、運営支援、\n共同成長の3段階戦略を紹介します。\n</p>\n\n<a href=\"strategy.html?lang=ja\" class=\"button\">\n詳しく見る\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>市民推進委員会</h3>\n\n<p>\n委員会の使命、\n組織、主な活動を紹介します。\n</p>\n\n<a href=\"committee.html?lang=ja\" class=\"button\">\n詳しく見る\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>推進の歩み</h3>\n\n<p>\nグローバルAIハブ構想に関する\n主な活動と経過を紹介します。\n</p>\n\n<a href=\"history.html?lang=ja\" class=\"button\">\n詳しく見る\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>ニュース・お知らせ</h3>\n\n<p>\n委員会の活動、\n関連行事、\n主な動向を紹介します。\n</p>\n\n<a href=\"news.html?lang=ja\" class=\"button\">\nニュースを見る\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>メディア報道</h3>\n\n<p>\n新聞、放送、\nその他の関連報道を紹介します。\n</p>\n\n<a href=\"press.html?lang=ja\" class=\"button\">\n報道を見る\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>市民参加</h3>\n\n<p>\n市民による支援活動、\n委員登録、\n参加方法を紹介します。\n</p>\n\n<a href=\"participate.html?lang=ja\" class=\"button\">\n参加方法を見る\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>利用ガイド</h3>\n\n<p>\nウェブサイトの利用方法、\n情報の探し方、\n参加方法を紹介します。\n</p>\n\n<a href=\"guide.html?lang=ja\" class=\"button\">\nガイドを見る\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     MULTILINGUAL INFORMATION\n===================================== -->\n\n<section id=\"languages\">\n\n<h2>\n9. 多言語ウェブサイトのご案内\n</h2>\n\n<p>\nグローバルAIハブ構想のウェブサイトでは、\n世界各国の訪問者、\n国際機関、研究機関、\n企業、市民の皆様に向けて、\n10言語のホームページを提供しています。\n</p>\n\n<p>\nページ上部の言語選択メニューから、\nご希望の言語に切り替えることができます。\n</p>\n\n<p>\n韓国語版では、\n韓国語による各種情報や\n関連サービスもご利用いただけます。\n</p>\n\n<div class=\"highlight\">\n\n<strong>\n対応する10言語\n</strong>\n\n<p>\n<a href=\"index.html\" lang=\"ko\">\n한국어 — 韓国語\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=en\" lang=\"en\">\nEnglish — 英語\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=zh\" lang=\"zh\">\n中文 — 中国語\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ja\"\nlang=\"ja\"\naria-current=\"page\">\n日本語 — 日本語 ✓\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ru\" lang=\"ru\">\nРусский — ロシア語\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ar\"\nlang=\"ar\"\ndir=\"rtl\">\nالعربية — アラビア語\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=es\" lang=\"es\">\nEspañol — スペイン語\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\" lang=\"fr\">\nFrançais — フランス語\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=de\" lang=\"de\">\nDeutsch — ドイツ語\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=it\" lang=\"it\">\nItaliano — イタリア語\n</a>\n</p>\n\n</div>\n\n<p class=\"note\">\n言語によって、\n個別ページやサービスの\n提供範囲が異なる場合があります。\n</p>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nグローバルAIハブ構想\n n@media (max-height: 450px) {\n\n  .language-options {\n    max-height: 55vh;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header id=\"home\">\n\n<h1>\nИНИЦИАТИВА «ГЛОБАЛЬНЫЙ ЦЕНТР ИИ»\n</h1>\n\n<h2>\nОсобый город Коян ·\nПровинция Кёнгидо,\nРеспублика Корея\n</h2>\n\n</header>\n\n\u003c!-- =====================================\n     MAIN NAVIGATION\n===================================== -->\n\n<nav class=\"main-nav\"\naria-label=\"Главная навигация\">\n\n\u003c!-- LANGUAGE BUTTON: FIXED LEFT -->\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"Выбрать язык сайта\">\n🌐 Язык ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a href=\"index.html\" lang=\"ko\">\n한국어\n</a>\n\n<a href=\"index.html?lang=en\" lang=\"en\">\nEnglish\n</a>\n\n<a href=\"index.html?lang=zh\" lang=\"zh\">\n中文\n</a>\n\n<a href=\"index.html?lang=ja\" lang=\"ja\">\n日本語\n</a>\n\n<a href=\"index.html?lang=ru\"\nlang=\"ru\"\naria-current=\"page\">\nРусский ✓\n</a>\n\n<a href=\"index.html?lang=ar\"\nlang=\"ar\"\ndir=\"rtl\">\nالعربية\n</a>\n\n<a href=\"index.html?lang=es\" lang=\"es\">\nEspañol\n</a>\n\n<a href=\"index.html?lang=fr\" lang=\"fr\">\nFrançais\n</a>\n\n<a href=\"index.html?lang=de\" lang=\"de\">\nDeutsch\n</a>\n\n<a href=\"index.html?lang=it\" lang=\"it\">\nItaliano\n</a>\n\n</div>\n\n</details>\n\n\u003c!-- INDEPENDENT SCROLL AREA -->\n\n<div class=\"main-nav-links\">\n\n<a href=\"index.html?lang=ru\">\nГлавная\n</a>\n\n<a href=\"hub.html?lang=ru\">\nГлобальный центр ИИ\n</a>\n\n<a href=\"goyang.html?lang=ru\">\nПочему Коян?\n</a>\n\n<a href=\"agencies.html?lang=ru\">\nМеждународные организации\n</a>\n\n<a href=\"strategy.html?lang=ru\">\nСтратегия\n</a>\n\n<a href=\"committee.html?lang=ru\">\nКомитет\n</a>\n\n<a href=\"history.html?lang=ru\">\nХронология\n</a>\n\n<a href=\"news.html?lang=ru\">\nНовости\n</a>\n\n<a href=\"press.html?lang=ru\">\nСМИ\n</a>\n\n<a href=\"participate.html?lang=ru\">\nУчастие\n</a>\n\n<a href=\"guide.html?lang=ru\">\nРуководство\n</a>\n<a href=\"gallery.html?lang=ru\">Фотогалерея</a>\n<a href=\"library.html?lang=ru\">Цифровая библиотека</a>\n<a href=\"resources.html?lang=ru\">Центр материалов</a>\n\n</div>\n\n</nav>\n\n\u003c!-- =====================================\n     MAIN BANNER\n===================================== -->\n\n<div class=\"main-banner\">\n\n<img\nsrc=\"aihub-main-banner-ru.png\"\nalt=\"Инициатива создания Глобального центра искусственного интеллекта в городе Коян\"\nloading=\"eager\"\nfetchpriority=\"high\">\n\n</div>\n\n\u003c!-- =====================================\n     END OF PART 1\n     PART 2 STARTS WITH <main>\n===================================== -->\n\n<main>\n\n\u003c!-- =====================================\n     VISION\n===================================== -->\n\n<section class=\"hero\" id=\"vision\">\n\n<h2>\nИскусственный интеллект<br>\nна благо человечества\n</h2>\n\n<p>\nМеждународное сотрудничество\nради лучшего будущего.\n</p>\n\n<p>\nОбъединяя международные организации,\nгосударственные учреждения,\nуниверситеты, исследовательские центры,\nкомпании и гражданское общество,\nмы стремимся содействовать решению\nобщих глобальных проблем.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nНаше видение\n</strong>\n\n<p>\nМы стремимся содействовать\nпревращению особого города Коян\nв международный центр сотрудничества,\nгде искусственный интеллект,\nнаучные исследования и инновации\nбудут служить устойчивому развитию\nи благополучию людей.\n</p>\n\n</div>\n\n<a href=\"#goyang\" class=\"button\">\nПочему город Коян?\n</a>\n\n<a href=\"#partnership\"\nclass=\"button secondary\">\nМеждународное сотрудничество\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     GLOBAL AI HUB\n===================================== -->\n\n<section id=\"hub\">\n\n<h2>\n1. Что такое Глобальный центр ИИ?\n</h2>\n\n<p>\nПредлагаемый Глобальный центр\nискусственного интеллекта\nрассматривается как международная\nплатформа сотрудничества,\nобъединяющая экспертный потенциал\nмеждународных организаций\nи возможности современных\nтехнологий искусственного интеллекта.\n</p>\n\n<p>\nИнициатива направлена на изучение\nвозможностей применения ИИ\nдля решения глобальных проблем\nв области общественного здравоохранения,\nпродовольственной безопасности,\nизменения климата,\nохраны окружающей среды,\nгуманитарной помощи,\nмиграции, занятости,\nобразования и предупреждения\nстихийных бедствий.\n</p>\n\n<p>\nПредполагается содействовать\nобмену знаниями,\nмеждународным исследованиям\nи сотрудничеству между\nмеждународными организациями,\nгосударственными учреждениями,\nуниверситетами,\nисследовательскими институтами,\nпредприятиями и гражданским обществом.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nМеждународное сотрудничество\n</h3>\n\n<p>\nСодействие международному диалогу,\nобмену опытом,\nразвитию партнёрских отношений\nи совместному поиску решений\nглобальных проблем.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nИсследования и инновации\n</h3>\n\n<p>\nИзучение возможностей\nответственного применения\nискусственного интеллекта,\nразвития научных исследований\nи технологических инноваций\nв общественных интересах.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nПрактическое применение ИИ\n</h3>\n\n<p>\nРассмотрение возможностей\nпилотных проектов,\nтехнологических испытаний\nи практического применения ИИ\nдля решения общественно значимых задач.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nПодготовка специалистов\n</h3>\n\n<p>\nСодействие профессиональному обучению,\nмеждународному обмену специалистами,\nповышению квалификации\nи распространению знаний.\n</p>\n\n</div>\n\n</div>\n\n<a href=\"hub.html?lang=ru\" class=\"button\">\nПодробнее о Глобальном центре ИИ\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     GOYANG\n===================================== -->\n\n<section id=\"goyang\">\n\n<h2>\n2. Почему особый город Коян?\n</h2>\n\n<p>\nОсобый город Коян расположен\nв провинции Кёнгидо\nРеспублики Корея\nи является одним из крупных городов\nстоличного региона.\n</p>\n\n<p>\nГород располагает\nмеждународной выставочной\nи конгрессной инфраструктурой,\nмедицинскими учреждениями,\nобразовательными и культурными ресурсами,\nразвитой городской инфраструктурой\nи природными территориями.\n</p>\n\n<p>\nЭти преимущества могут стать\nосновой для рассмотрения\nвозможности формирования\nмеждународного центра сотрудничества\nв области искусственного интеллекта.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nРасположение в столичном регионе\n</h3>\n\n<p>\nГород Коян расположен\nв столичном регионе Республики Корея,\nчто обеспечивает доступ\nк широким экономическим,\nнаучным и институциональным сетям.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nМеждународный комплекс KINTEX\n</h3>\n\n<p>\nМеждународный выставочный\nи конгрессный комплекс KINTEX\nпредоставляет инфраструктуру\nдля проведения выставок,\nконференций и международных встреч.\n</p>\n\n<p>\nЭти возможности могут использоваться\nдля будущих международных форумов,\nнаучных мероприятий\nи программ сотрудничества.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nМедицинский и научный потенциал\n</h3>\n\n<p>\nВ городе Коян находится\nНациональный онкологический центр Кореи,\nа также другие медицинские учреждения.\n</p>\n\n<p>\nСуществующие ресурсы позволяют\nрассматривать возможности\nсотрудничества в области\nобщественного здравоохранения,\nмедицинских исследований\nи ответственного применения ИИ.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nЭкологические ресурсы\n</h3>\n\n<p>\nВодно-болотные угодья Чанхан\nи другие природные территории\nпредставляют интерес\nдля экологических исследований,\nобразовательных программ\nи инициатив устойчивого развития.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nУсловия для проживания\n</h3>\n\n<p>\nГород располагает\nжилой инфраструктурой,\nмедицинскими учреждениями,\nобразовательными организациями,\nкультурными объектами\nи городскими услугами.\n</p>\n\n<p>\nКонкретные условия,\nнеобходимые для сотрудников\nмеждународных организаций\nи членов их семей,\nдолжны определяться\nв ходе соответствующих консультаций.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nВозможности регионального развития\n</h3>\n\n<p>\nРасширение международного сотрудничества\nможет способствовать развитию\nнаучных исследований,\nпрофессиональной занятости,\nпредпринимательской деятельности\nи связанных с ними отраслей.\n</p>\n\n<p>\nФактические результаты\nбудут зависеть от масштабов\nи характера будущих проектов.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nМеждународное сотрудничество\nи устойчивое развитие города\n</strong>\n\n<p>\nИспользуя существующие преимущества,\nгород Коян стремится изучить\nвозможности формирования\nмеждународного центра,\nспособствующего как решению\nглобальных проблем,\nтак и устойчивому развитию региона.\n</p>\n\n</div>\n\n<a href=\"goyang.html?lang=ru\" class=\"button\">\nПодробнее о преимуществах города Коян\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     INTERNATIONAL ORGANIZATIONS\n===================================== -->\n\n<section id=\"organizations\">\n\n<h2>\n3. Международные организации\nи потенциальные направления сотрудничества\n</h2>\n\n<p>\nВ рамках концепции\nГлобального центра ИИ\nрассматриваются потенциальные\nнаправления сотрудничества,\nсоответствующие сферам деятельности\nдевяти международных организаций.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>WHO — ВОЗ</h3>\n\n<p>\n<strong>\nВсемирная организация здравоохранения\n</strong>\n</p>\n\n<p>\nОбщественное здравоохранение,\nпрофилактика заболеваний,\nсистемы здравоохранения,\nанализ медицинских данных\nи ответственное применение ИИ.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>WFP — ВПП</h3>\n\n<p>\n<strong>\nВсемирная продовольственная программа ООН\n</strong>\n</p>\n\n<p>\nПродовольственная безопасность,\nгуманитарная помощь,\nустойчивость цепочек поставок\nи анализ продовольственных кризисов.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNEP — ЮНЕП</h3>\n\n<p>\n<strong>\nПрограмма ООН по окружающей среде\n</strong>\n</p>\n\n<p>\nИзменение климата,\nохрана окружающей среды,\nбиологическое разнообразие\nи экологический мониторинг.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNHCR — УВКБ ООН</h3>\n\n<p>\n<strong>\nУправление Верховного комиссара ООН\nпо делам беженцев\n</strong>\n</p>\n\n<p>\nЗащита беженцев,\nвынужденное перемещение,\nгуманитарная помощь\nи ответственное использование данных\nв деятельности по защите людей.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>IOM — МОМ</h3>\n\n<p>\n<strong>\nМеждународная организация по миграции\n</strong>\n</p>\n\n<p>\nМеждународная миграция,\nпомощь перемещённым лицам,\nгуманитарная поддержка\nи цифровые решения\nв сфере миграционных услуг.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>ILO — МОТ</h3>\n\n<p>\n<strong>\nМеждународная организация труда\n</strong>\n</p>\n\n<p>\nЗанятость,\nправа работников,\nпрофессиональная подготовка\nи изучение влияния ИИ\nна будущее рынка труда.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>ITU — МСЭ</h3>\n\n<p>\n<strong>\nМеждународный союз электросвязи\n</strong>\n</p>\n\n<p>\nЦифровая связь,\nтелекоммуникационная инфраструктура,\nэкстренная связь\nи системы раннего предупреждения\nо стихийных бедствиях.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNICEF — ЮНИСЕФ</h3>\n\n<p>\n<strong>\nДетский фонд ООН\n</strong>\n</p>\n\n<p>\nЗащита детей,\nобразование,\nцифровая инклюзия\nи ответственное применение ИИ\nс соблюдением прав ребёнка.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNDP — ПРООН</h3>\n\n<p>\n<strong>\nПрограмма развития ООН\n</strong>\n</p>\n\n<p>\nУстойчивое развитие,\nреагирование на кризисы,\nукрепление институционального потенциала\nи применение ИИ\nв программах развития.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nВажное разъяснение\n</strong>\n\n<p>\nУказанные международные организации\nпредставлены исключительно\nв контексте их официальных\nнаправлений деятельности\nи возможных областей\nбудущего сотрудничества.\n</p>\n\n<p>\nЭто не означает,\nчто данные организации\nподтвердили своё участие\nв инициативе,\nсогласились на размещение\nпредставительств\nили приняли решение\nо переносе каких-либо подразделений\nв город Коян.\n</p>\n\n<p>\nЛюбое будущее сотрудничество\nпотребует официальных консультаций,\nсоответствующих решений\nи необходимых процедур согласования.\n</p>\n\n</div>\n\n<a href=\"agencies.html?lang=ru\" class=\"button\">\nПодробнее о девяти международных организациях\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     DEVELOPMENT STRATEGY\n===================================== -->\n\n<section id=\"strategy\">\n\n<h2>\n4. Трёхэтапная стратегия развития\n</h2>\n\n<p>\nВ рамках концепции\nГлобального центра ИИ\nпредлагается трёхэтапный подход,\nучитывающий реальные потребности\nпотенциальных международных партнёров.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nЭтап 1 — Первоначальное размещение\n</h3>\n\n<p>\nИзучение условий,\nнеобходимых для стабильного\nначала деятельности\nпотенциальных международных\nорганизаций и партнёров\nв городе Коян.\n</p>\n\n<p>\nВозможные направления включают\nофисную инфраструктуру,\nтранспорт, жильё,\nмедицинское обслуживание,\nобразование\nи другие необходимые услуги.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nЭтап 2 — Поддержка деятельности\n</h3>\n\n<p>\nСодействие взаимодействию\nгосударственных учреждений,\nуниверситетов,\nисследовательских институтов,\nпредприятий\nи гражданского общества.\n</p>\n\n<p>\nРассмотрение возможностей\nсовместных исследований,\nмеждународных конференций,\nпилотных проектов ИИ\nи обмена специалистами.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nЭтап 3 — Устойчивое совместное развитие\n</h3>\n\n<p>\nФормирование долгосрочного\nсотрудничества,\nспособствующего выполнению\nмиссий международных организаций\nи устойчивому развитию\nгорода Коян.\n</p>\n\n<p>\nПредполагается изучение возможностей\nразвития научных исследований,\nсоздания рабочих мест,\nпредпринимательской деятельности\nи региональной экономики.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nПервоначальное размещение\n→ Поддержка деятельности\n→ Совместное развитие\n</strong>\n\n<p>\nКонкретные объекты,\nфинансовые ресурсы,\nинституциональные меры поддержки\nи программы сотрудничества\nдолжны определяться\nпо результатам консультаций\nи официальных процедур согласования.\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=ru\" class=\"button\">\nПодробнее о стратегии\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     CITIZENS COMMITTEE\n===================================== -->\n\n<section id=\"committee\">\n\n<h2>\n5. Гражданский инициативный комитет\n</h2>\n\n<p>\nГражданский инициативный комитет\nпо привлечению Глобального центра ИИ\nв особый город Коян\nявляется общественной инициативой,\nнаправленной на расширение\nинформированности и участия граждан.\n</p>\n\n<p>\nКомитет стремится содействовать\nобщественному обсуждению\nвозможностей международного\nсотрудничества,\nразвития искусственного интеллекта\nи устойчивого роста города.\n</p>\n\n<p>\nОсновные направления деятельности\nвключают распространение информации,\nсодействие участию граждан,\nобсуждение стратегических предложений\nи взаимодействие\nс заинтересованными организациями.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nНаши принципы\n</strong>\n\n<p>\nПрозрачность,\nответственность,\nконструктивное участие граждан\nи уважение к официальным\nпроцедурам принятия решений.\n</p>\n\n</div>\n\n<a href=\"committee.html?lang=ru\" class=\"button\">\nПодробнее о комитете\n</a>\n\n<a href=\"participate.html?lang=ru\"\nclass=\"button secondary\">\nУчастие граждан\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     INTERNATIONAL PARTNERSHIP\n===================================== -->\n\n<section id=\"partnership\">\n\n<h2>\n6. Возможности международного сотрудничества\n</h2>\n\n<p>\nИнициатива Глобального центра ИИ\nнаправлена на содействие диалогу\nс организациями и учреждениями,\nзаинтересованными в ответственном\nразвитии искусственного интеллекта,\nмеждународном сотрудничестве\nи устойчивом развитии.\n</p>\n\n<p>\nПотенциальные направления\nсотрудничества включают:\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nПолитический и экспертный диалог\n</h3>\n\n<p>\nОбмен опытом и мнениями\nпо вопросам международного\nсотрудничества,\nуправления искусственным интеллектом\nи технологических инноваций\nв общественных интересах.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nНаучное сотрудничество\n</h3>\n\n<p>\nИзучение возможностей\nмеждисциплинарных исследований,\nобмена знаниями\nи формирования\nмеждународных научных сетей.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nТехнологические проекты\n</h3>\n\n<p>\nРассмотрение возможностей\nпилотных проектов,\nпрактического применения\nи оценки технологий\nответственного искусственного интеллекта.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nОбмен специалистами\n</h3>\n\n<p>\nИзучение возможностей\nпроведения учебных программ,\nсеминаров,\nмеждународных форумов\nи мероприятий\nпо повышению квалификации.\n</p>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nВсе перечисленные направления\nпредставляют собой\nпотенциальные возможности сотрудничества\nи не означают наличия\nподтверждённых соглашений\nс международными организациями.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     CONTACT\n===================================== -->\n\n<section id=\"contact\">\n\n<h2>\n7. Контакты и дополнительная информация\n</h2>\n\n<p>\nМы приветствуем интерес\nмеждународных организаций,\nисследовательских учреждений,\nэкспертов и граждан\nк концепции Глобального центра ИИ\nи деятельности гражданского\nинициативного комитета.\n</p>\n\n<p>\nДополнительную информацию\nможно получить\nна русскоязычных страницах\nнашего веб-сайта.\n</p>\n\n<p>\nКорейская версия сайта\nсодержит дополнительные материалы\nи сервисы на корейском языке.\n</p>\n\n<a href=\"guide.html?lang=ru\" class=\"button\">\nРуководство по сайту\n</a>\n\n<a href=\"index.html\"\nclass=\"button secondary\">\nКорейская версия сайта\n</a>\n\n<div class=\"highlight\">\n\n<strong>\nИнициатива «Глобальный центр ИИ»<br>\nОсобый город Коян,\nпровинция Кёнгидо,\nРеспублика Корея\n</strong>\n\n<p>\nГражданский инициативный комитет\nпо привлечению Глобального центра ИИ\nв город Коян\n</p>\n\n<p class=\"note\">\nНастоящий веб-сайт\nпредставляет общественную инициативу\nи связанную с ней деятельность.\nОн не означает официального решения\nгосударственных органов\nо размещении Глобального центра ИИ\nили подтверждённого участия\nмеждународных организаций.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     RUSSIAN WEBSITE DIRECTORY\n===================================== -->\n\n<section id=\"directory\" class=\"page-directory\">\n\n<h2>\n8. Разделы русскоязычного сайта\n</h2>\n\n<p>\nНиже представлены\nосновные тематические страницы,\nпосвящённые Глобальному центру ИИ,\nгороду Коян,\nмеждународному сотрудничеству\nи участию граждан.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nГлобальный центр ИИ\n</h3>\n\n<p>\nКонцепция,\nцели и основные направления\nмеждународной платформы сотрудничества.\n</p>\n\n<a href=\"hub.html?lang=ru\" class=\"button\">\nПодробнее\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nПочему город Коян?\n</h3>\n\n<p>\nГеографические преимущества,\nгородская инфраструктура\nи потенциал развития.\n</p>\n\n<a href=\"goyang.html?lang=ru\" class=\"button\">\nПодробнее\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nМеждународные организации\n</h3>\n\n<p>\nДевять международных организаций\nи потенциальные направления сотрудничества.\n</p>\n\n<a href=\"agencies.html?lang=ru\" class=\"button\">\nПодробнее\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nСтратегия развития\n</h3>\n\n<p>\nТрёхэтапный подход:\nпервоначальное размещение,\nподдержка деятельности\nи совместное развитие.\n</p>\n\n<a href=\"strategy.html?lang=ru\" class=\"button\">\nПодробнее\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nГражданский комитет\n</h3>\n\n<p>\nМиссия,\nорганизация\nи основные направления\nдеятельности комитета.\n</p>\n\n<a href=\"committee.html?lang=ru\" class=\"button\">\nПодробнее\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nХронология\n</h3>\n\n<p>\nОсновные события\nи этапы развития инициативы.\n</p>\n\n<a href=\"history.html?lang=ru\" class=\"button\">\nПодробнее\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nНовости\n</h3>\n\n<p>\nИнформация о деятельности,\nмероприятиях\nи основных событиях.\n</p>\n\n<a href=\"news.html?lang=ru\" class=\"button\">\nЧитать новости\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nПубликации в СМИ\n</h3>\n\n<p>\nМатериалы прессы,\nтелевидения\nи других средств массовой информации.\n</p>\n\n<a href=\"press.html?lang=ru\" class=\"button\">\nСмотреть публикации\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nУчастие граждан\n</h3>\n\n<p>\nИнформация о возможностях\nподдержки инициативы\nи участия в деятельности комитета.\n</p>\n\n<a href=\"participate.html?lang=ru\" class=\"button\">\nКак принять участие\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nРуководство пользователя\n</h3>\n\n<p>\nИнформация об использовании\nвеб-сайта\nи поиске необходимых материалов.\n</p>\n\n<a href=\"guide.html?lang=ru\" class=\"button\">\nОткрыть руководство\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     MULTILINGUAL INFORMATION\n===================================== -->\n\n<section id=\"languages\">\n\n<h2>\n9. Многоязычная версия веб-сайта\n</h2>\n\n<p>\nВеб-сайт инициативы\n«Глобальный центр ИИ»\nпредоставляет главные страницы\nна десяти языках\nдля посетителей из разных стран,\nмеждународных организаций,\nисследовательских учреждений,\nкомпаний и граждан.\n</p>\n\n<p>\nВы можете выбрать\nпредпочитаемый язык\nс помощью меню выбора языка\nв верхней части страницы.\n</p>\n\n<p>\nКорейская версия сайта\nтакже предоставляет\nдополнительные материалы\nи сервисы на корейском языке.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nДоступные языки\n</strong>\n\n<p>\n<a href=\"index.html\" lang=\"ko\">\n한국어 — Корейский\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=en\" lang=\"en\">\nEnglish — Английский\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=zh\" lang=\"zh\">\n中文 — Китайский\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ja\" lang=\"ja\">\n日本語 — Японский\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ru\"\nlang=\"ru\"\naria-current=\"page\">\nРусский — Русский ✓\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ar\"\nlang=\"ar\"\ndir=\"rtl\">\nالعربية — Арабский\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=es\" lang=\"es\">\nEspañol — Испанский\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\" lang=\"fr\">\nFrançais — Французский\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=de\" lang=\"de\">\nDeutsch — Немецкий\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=it\" lang=\"it\">\nItaliano — Итальянский\n</a>\n</p>\n\n</div>\n\n<p class=\"note\">\nНаличие отдельных страниц\nи доступных сервисов\nможет различаться\nв зависимости от языка.\n</p>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nИнициатива «Глобальный центр ИИ»\n</strong>\n</p>\n\n<p>\nОсобый город Коян<br>\nПровинция Кёнгидо<br>\nРеспублика Корея\n</p>\n\n<p>\nГражданский инициативный комитет\nпо привлечению Глобального центра ИИ\nв город Коян\n</p>\n\n<p>\nИскусственный интеллект\nна благо человечества<br>\nМеждународное сотрудничество\nради лучшего будущего\n</p>\n\n\u003c!-- =====================================\n     FOOTER LANGUAGE LINKS
