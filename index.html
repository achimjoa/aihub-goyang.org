n   07. MAIN BANNER\n===================================== */\n\n.main-banner {\n  width: 100%;\n  margin: 0;\n\n  overflow: hidden;\n\n  background: #0754a6;\n}\n\n.main-banner img {\n  display: block;\n\n  width: 100%;\n  height: auto;\n}\n\n/* =====================================\n   08. MAIN CONTENT\n===================================== */\n\nmain {\n  max-width: 1180px;\n  margin: auto;\n  padding: 30px 15px;\n}\n\nmain section {\n  background: white;\n\n  border-radius: 12px;\n\n  padding: 35px;\n\n  margin-bottom: 25px;\n\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.06);\n\n  scroll-margin-top: 20px;\n}\n\nmain h2 {\n  color: #0754a6;\n\n  border-bottom:\n    2px solid #e3edf8;\n\n  padding-bottom: 12px;\n\n  margin-top: 0;\n}\n\nmain h3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   09. HERO\n===================================== */\n\n.hero {\n  text-align: center;\n\n  background: linear-gradient(\n    135deg,\n    #eaf4ff,\n    #ffffff\n  );\n}\n\n.hero h2 {\n  border: none;\n\n  font-size:\n    clamp(25px, 4vw, 37px);\n\n  line-height: 1.5;\n}\n\n.hero p {\n  font-size: 18px;\n}\n\n/* =====================================\n   10. GRID\n===================================== */\n\n.grid {\n  display: grid;\n\n  grid-template-columns:\n    repeat(\n      auto-fit,\n      minmax(min(100%, 260px), 1fr)\n    );\n\n  gap: 20px;\n}\n\n.card {\n  min-width: 0;\n\n  background: #f4f8fc;\n\n  padding: 24px;\n\n  border-radius: 10px;\n\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   11. HIGHLIGHT\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n\n  border-right: 5px solid #168de0;\n\n  padding: 24px;\n\n  margin: 20px 0;\n\n  border-radius: 8px;\n}\n\n/* =====================================\n   12. BUTTONS\n===================================== */\n\n.button {\n  display: inline-block;\n\n  background: #0754a6;\n  color: white;\n\n  padding: 12px 22px;\n\n  border-radius: 7px;\n\n  text-decoration: none;\n\n  font-weight: bold;\n\n  margin: 10px 0 0 8px;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: #0754a6;\n}\n\n.button.secondary:hover {\n  background: #cce2ff;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   13. PAGE DIRECTORY\n===================================== */\n\n.page-directory {\n  background: #f0f6ff;\n}\n\n.page-directory .card {\n  background: white;\n}\n\n.page-directory .button {\n  margin-top: 12px;\n}\n\n/* =====================================\n   14. FOOTER\n===================================== */\n\nfooter {\n  background: #10315e;\n\n  color: white;\n\n  text-align: center;\n\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n.footer-language-links {\n  display: flex;\n\n  flex-wrap: wrap;\n\n  justify-content: center;\n\n  align-items: center;\n\n  gap: 10px 18px;\n\n  margin: 20px auto;\n\n  direction: ltr;\n}\n\n.footer-language-links a {\n  color: white;\n\n  font-size: 14px;\n\n  font-weight: 600;\n\n  text-decoration: none;\n}\n\n.footer-language-links a:hover {\n  color: #ffe44d;\n\n  text-decoration: underline;\n}\n\n.footer-language-links\na[aria-current=\"page\"] {\n  color: #ffe44d;\n  font-weight: 800;\n}\n\n/* =====================================\n   15. MOBILE\n===================================== */\n\n@media (max-width: 767px) {\n\n  header {\n    padding: 14px 12px;\n  }\n\n  .main-nav {\n    padding: 8px 10px;\n    gap: 6px;\n  }\n\n  .language-dropdown > summary {\n    min-height: 42px;\n    padding: 8px 10px;\n    font-size: 12px;\n  }\n\n  .language-options {\n    width: 170px;\n    max-height: 60vh;\n    max-height: 60dvh;\n  }\n\n  .main-nav-links {\n    gap: 5px;\n  }\n\n  .main-nav-links > a {\n    padding: 8px 9px;\n    font-size: 11px;\n  }\n\n  main {\n    padding: 15px 10px;\n  }\n\n  main section {\n    padding: 23px;\n  }\n\n  .card {\n    padding: 19px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin: 10px 0;\n  }\n\n}\n\n/* =====================================\n   16. SHORT LANDSCAPE SCREENS\n===================================== */\n\n@media (max-height: 500px) {\n\n  .language-options {\n    max-height: 55vh;\n    max-height: 55dvh;\n  }\n\n}\n\n/* =====================================\n   END OF CSS\n===================================== */\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header>\n\n<h1>\nمبادرة المركز العالمي للذكاء الاصطناعي\n</h1>\n\n<h2>\nمدينة غويانغ الخاصة ·\nمقاطعة غيونغي، جمهورية كوريا\n</h2>\n\n</header>\n\n\u003c!-- =====================================\n     MAIN NAVIGATION\n===================================== -->\n\n<nav\n  class=\"main-nav\"\n  aria-label=\"القائمة الرئيسية\"\n>\n\n\u003c!-- =====================================\n     LANGUAGE SELECTOR\n     FIXED ON THE LEFT\n===================================== -->\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"اختيار لغة الموقع\">\n🌐 اللغة ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a\n  href=\"index.html\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n<a\n  href=\"index.html?lang=en\"\n  lang=\"en\"\n  dir=\"ltr\"\n>\nEnglish\n</a>\n\n<a\n  href=\"index.html?lang=zh\"\n  lang=\"zh\"\n  dir=\"ltr\"\n>\n中文\n</a>\n\n<a\n  href=\"index.html?lang=ja\"\n  lang=\"ja\"\n  dir=\"ltr\"\n>\n日本語\n</a>\n\n<a\n  href=\"index.html?lang=ru\"\n  lang=\"ru\"\n  dir=\"ltr\"\n>\nРусский\n</a>\n\n<a\n  href=\"index.html?lang=ar\"\n  lang=\"ar\"\n  dir=\"rtl\"\n  aria-current=\"page\"\n>\nالعربية ✓\n</a>\n\n<a\n  href=\"index.html?lang=es\"\n  lang=\"es\"\n  dir=\"ltr\"\n>\nEspañol\n</a>\n\n<a\n  href=\"index.html?lang=fr\"\n  lang=\"fr\"\n  dir=\"ltr\"\n>\nFrançais\n</a>\n\n<a\n  href=\"index.html?lang=de\"\n  lang=\"de\"\n  dir=\"ltr\"\n>\nDeutsch\n</a>\n\n<a\n  href=\"index.html?lang=it\"\n  lang=\"it\"\n  dir=\"ltr\"\n>\nItaliano\n</a>\n\n</div>\n\n</details>\n\n\u003c!-- =====================================\n     ARABIC NAVIGATION LINKS\n===================================== -->\n\n<div class=\"main-nav-links\">\n\n<a href=\"index.html?lang=ar\">\nالرئيسية\n</a>\n\n<a href=\"hub.html?lang=ar\">\nالمركز العالمي للذكاء الاصطناعي\n</a>\n\n<a href=\"goyang.html?lang=ar\">\nلماذا غويانغ؟\n</a>\n\n<a href=\"agencies.html?lang=ar\">\nالمنظمات الدولية\n</a>\n\n<a href=\"strategy.html?lang=ar\">\nالاستراتيجية\n</a>\n\n<a href=\"committee.html?lang=ar\">\nاللجنة المدنية\n</a>\n\n<a href=\"history.html?lang=ar\">\nالتسلسل الزمني\n</a>\n\n<a href=\"news.html?lang=ar\">\nالأخبار\n</a>\n\n<a href=\"press.html?lang=ar\">\nالتغطية الإعلامية\n</a>\n\n<a href=\"participate.html?lang=ar\">\nالمشاركة المدنية\n</a>\n\n<a href=\"guide.html?lang=ar\">\nدليل الموقع\n</a>\n<a href=\"gallery.html?lang=ar\">معرض الصور</a>\n<a href=\"library.html?lang=ar\">المكتبة الرقمية</a>\n<a href=\"resources.html?lang=ar\">مركز الموارد</a>\n\n</div>\n\n</nav>\n\n\u003c!-- =====================================\n     MAIN BANNER\n===================================== -->\n\n<div class=\"main-banner\">\n\n<img\n  src=\"aihub-main-banner-ar.png\"\n  alt=\"مبادرة المركز العالمي للذكاء الاصطناعي في مدينة غويانغ الخاصة\"\n  width=\"1648\"\n  height=\"928\"\n  loading=\"eager\"\n  fetchpriority=\"high\"\n>\n\n</div>\n\n\u003c!-- =====================================\n     END OF PART 1\n     PART 2 STARTS WITH <main>\n===================================== -->\n\n<main>\n\n\u003c!-- =====================================\n     01. VISION\n===================================== -->\n\n<section class=\"hero\" id=\"vision\">\n\n<h2>\nالذكاء الاصطناعي من أجل الإنسانية\n</h2>\n\n<p>\nالتعاون الدولي من أجل مستقبل أفضل\n</p>\n\n<p>\nنسعى إلى تعزيز التعاون بين\nالمنظمات الدولية والحكومات\nوالجامعات ومراكز البحوث\nوالشركات والمجتمع المدني،\nمن أجل الاستفادة من تقنيات\nالذكاء الاصطناعي في مواجهة\nالتحديات العالمية المشتركة.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nرؤيتنا\n</strong>\n\n<p>\nنتطلع إلى أن تصبح مدينة غويانغ الخاصة\nمركزاً دولياً للتعاون في مجالات\nالذكاء الاصطناعي والبحث العلمي\nوالابتكار، بما يسهم في التنمية\nالمستدامة وتحسين حياة الإنسان.\n</p>\n\n</div>\n\n<a href=\"#goyang\" class=\"button\">\nلماذا مدينة غويانغ؟\n</a>\n\n<a href=\"#partnership\"\nclass=\"button secondary\">\nالتعاون الدولي\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     02. GLOBAL AI HUB\n===================================== -->\n\n<section id=\"hub\">\n\n<h2>\n1. ما هو المركز العالمي للذكاء الاصطناعي؟\n</h2>\n\n<p>\nيمثل المركز العالمي المقترح\nللذكاء الاصطناعي تصوراً\nلمنصة دولية للتعاون تجمع\nبين خبرات المنظمات الدولية\nوالإمكانات المتقدمة لتقنيات\nالذكاء الاصطناعي.\n</p>\n\n<p>\nوتهدف المبادرة إلى دراسة\nإمكانات استخدام الذكاء الاصطناعي\nلمواجهة التحديات العالمية\nفي مجالات الصحة العامة\nوالأمن الغذائي وتغير المناخ\nوحماية البيئة والمساعدات الإنسانية\nوالهجرة والعمل والتعليم\nوالوقاية من الكوارث.\n</p>\n\n<p>\nكما تسعى المبادرة إلى تعزيز\nتبادل المعرفة والبحوث المشتركة\nوالتعاون بين المنظمات الدولية\nوالجهات الحكومية والجامعات\nومعاهد البحوث والشركات\nوالمجتمع المدني.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nالتعاون الدولي\n</h3>\n\n<p>\nتعزيز الحوار الدولي\nوتبادل الخبرات وتطوير\nالشراكات والبحث المشترك\nعن حلول للتحديات العالمية.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالبحث العلمي والابتكار\n</h3>\n\n<p>\nدراسة فرص الاستخدام المسؤول\nللذكاء الاصطناعي وتطوير\nالبحوث العلمية والابتكارات\nالتكنولوجية لخدمة المصلحة العامة.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالتطبيقات العملية\n</h3>\n\n<p>\nاستكشاف فرص تنفيذ\nالمشروعات التجريبية\nواختبار التقنيات وتطبيق\nالذكاء الاصطناعي في معالجة\nالقضايا ذات الأهمية العامة.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nتنمية القدرات البشرية\n</h3>\n\n<p>\nتعزيز التدريب المهني\nوتبادل الخبراء ورفع\nالكفاءات ونشر المعرفة\nعلى المستوى الدولي.\n</p>\n\n</div>\n\n</div>\n\n<a href=\"hub.html?lang=ar\" class=\"button\">\nالمزيد عن المركز العالمي للذكاء الاصطناعي\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     03. GOYANG\n===================================== -->\n\n<section id=\"goyang\">\n\n<h2>\n2. لماذا مدينة غويانغ الخاصة؟\n</h2>\n\n<p>\nتقع مدينة غويانغ الخاصة\nفي مقاطعة غيونغي بجمهورية كوريا،\nوتُعد إحدى المدن الرئيسية\nفي منطقة العاصمة.\n</p>\n\n<p>\nوتتمتع المدينة ببنية تحتية\nللمعارض والمؤتمرات الدولية،\nومؤسسات طبية وتعليمية\nوثقافية، إضافة إلى مرافق\nحضرية متطورة وموارد طبيعية.\n</p>\n\n<p>\nويمكن أن تشكل هذه المزايا\nأساساً لدراسة إمكانية\nإنشاء مركز دولي للتعاون\nفي مجال الذكاء الاصطناعي.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nالموقع في منطقة العاصمة\n</h3>\n\n<p>\nتقع غويانغ ضمن منطقة\nالعاصمة الكورية، مما يتيح\nإمكانات للتواصل مع الشبكات\nالاقتصادية والعلمية والمؤسسية.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nمركز KINTEX الدولي\n</h3>\n\n<p>\nيوفر مركز كينتكس الدولي\nللمعارض والمؤتمرات بنية\nتحتية لاستضافة المعارض\nوالمؤتمرات والاجتماعات الدولية.\n</p>\n\n<p>\nويمكن الاستفادة من هذه\nالإمكانات في تنظيم المنتديات\nالعلمية والفعاليات الدولية\nوبرامج التعاون المستقبلية.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالقدرات الطبية والبحثية\n</h3>\n\n<p>\nتضم مدينة غويانغ\nالمركز الوطني الكوري للسرطان\nومؤسسات طبية أخرى.\n</p>\n\n<p>\nوتتيح هذه الموارد دراسة\nفرص التعاون في الصحة العامة\nوالبحوث الطبية والتطبيقات\nالمسؤولة للذكاء الاصطناعي.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالموارد البيئية\n</h3>\n\n<p>\nتمثل الأراضي الرطبة\nفي جانغهانغ وغيرها من\nالمناطق الطبيعية موارد\nمهمة للبحوث البيئية\nوالتعليم ومبادرات التنمية\nالمستدامة.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالبيئة المعيشية\n</h3>\n\n<p>\nتتوفر في المدينة مرافق\nسكنية وطبية وتعليمية\nوثقافية وخدمات حضرية.\n</p>\n\n<p>\nويتعين تحديد الاحتياجات\nالفعلية لموظفي المنظمات\nالدولية وأسرهم من خلال\nالمشاورات ذات الصلة.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nفرص التنمية الإقليمية\n</h3>\n\n<p>\nيمكن أن يسهم توسيع\nالتعاون الدولي في دعم\nالبحث العلمي وتطوير\nفرص العمل والأنشطة\nالاقتصادية والصناعات\nالمرتبطة بها.\n</p>\n\n<p>\nوتعتمد النتائج الفعلية\nعلى طبيعة المشروعات\nالمستقبلية وحجمها.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nالتعاون الدولي والتنمية المستدامة\n</strong>\n\n<p>\nتسعى مدينة غويانغ\nإلى الاستفادة من مزاياها\nالحالية لدراسة فرص تطوير\nمركز دولي يسهم في معالجة\nالتحديات العالمية وتعزيز\nالتنمية المستدامة للمدينة.\n</p>\n\n</div>\n\n<a href=\"goyang.html?lang=ar\" class=\"button\">\nالمزيد عن مزايا مدينة غويانغ\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     04. INTERNATIONAL ORGANIZATIONS\n===================================== -->\n\n<section id=\"organizations\">\n\n<h2>\n3. المنظمات الدولية ومجالات التعاون المحتملة\n</h2>\n\n<p>\nتتناول مبادرة المركز العالمي\nللذكاء الاصطناعي مجالات\nالتعاون المحتملة المرتبطة\nبمهام تسع منظمات دولية.\n</p>\n\n<p>\nوتُعرض هذه المجالات\nبهدف توضيح فرص التعاون\nالمستقبلي الممكنة،\nوليس باعتبارها اتفاقات\nأو التزامات مؤكدة.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nWHO — منظمة الصحة العالمية\n</h3>\n\n<p>\nالصحة العامة والوقاية\nمن الأمراض وتعزيز النظم\nالصحية وتحليل البيانات\nالطبية والاستخدام المسؤول\nللذكاء الاصطناعي.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nWFP — برنامج الأغذية العالمي\n</h3>\n\n<p>\nالأمن الغذائي والمساعدات\nالإنسانية واستدامة سلاسل\nالإمداد وتحليل الأزمات\nالغذائية.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNEP — برنامج الأمم المتحدة للبيئة\n</h3>\n\n<p>\nتغير المناخ وحماية البيئة\nوالتنوع البيولوجي والرصد\nالبيئي.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNHCR — المفوضية السامية للأمم المتحدة لشؤون اللاجئين\n</h3>\n\n<p>\nحماية اللاجئين والنزوح\nالقسري والمساعدات الإنسانية\nوالاستخدام المسؤول للبيانات\nفي أنشطة الحماية.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nIOM — المنظمة الدولية للهجرة\n</h3>\n\n<p>\nالهجرة الدولية ودعم\nالنازحين والمساعدات\nالإنسانية والحلول الرقمية\nفي خدمات الهجرة.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nILO — منظمة العمل الدولية\n</h3>\n\n<p>\nالعمالة وحقوق العمال\nوالتدريب المهني ودراسة\nتأثير الذكاء الاصطناعي\nفي مستقبل سوق العمل.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nITU — الاتحاد الدولي للاتصالات\n</h3>\n\n<p>\nالاتصالات الرقمية والبنية\nالتحتية للاتصالات والاتصالات\nفي حالات الطوارئ وأنظمة\nالإنذار المبكر بالكوارث.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNICEF — منظمة الأمم المتحدة للطفولة\n</h3>\n\n<p>\nحماية الأطفال والتعليم\nوالشمول الرقمي والاستخدام\nالمسؤول للذكاء الاصطناعي\nمع احترام حقوق الطفل.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNDP — برنامج الأمم المتحدة الإنمائي\n</h3>\n\n<p>\nالتنمية المستدامة والاستجابة\nللأزمات وتعزيز القدرات\nالمؤسسية واستخدام الذكاء\nالاصطناعي في برامج التنمية.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nتوضيح مهم\n</strong>\n\n<p>\nتُذكر المنظمات الدولية\nالمشار إليها أعلاه\nفي سياق مجالات عملها\nالرسمية وفرص التعاون\nالمستقبلية المحتملة فقط.\n</p>\n\n<p>\nولا يعني ذلك أن هذه\nالمنظمات قد أكدت مشاركتها\nفي المبادرة أو وافقت\nعلى إنشاء مكاتب لها\nأو نقل أي من وحداتها\nإلى مدينة غويانغ.\n</p>\n\n<p>\nويتطلب أي تعاون مستقبلي\nإجراء مشاورات رسمية\nواتخاذ القرارات اللازمة\nواستكمال إجراءات الموافقة\nذات الصلة.\n</p>\n\n</div>\n\n<a href=\"agencies.html?lang=ar\" class=\"button\">\nالمزيد عن المنظمات الدولية التسع\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     05. DEVELOPMENT STRATEGY\n===================================== -->\n\n<section id=\"strategy\">\n\n<h2>\n4. استراتيجية التطوير على ثلاث مراحل\n</h2>\n\n<p>\nتقترح مبادرة المركز العالمي\nللذكاء الاصطناعي نهجاً\nتدريجياً من ثلاث مراحل،\nيراعي الاحتياجات الفعلية\nللشركاء الدوليين المحتملين.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nالمرحلة الأولى — التأسيس والاستقرار الأولي\n</h3>\n\n<p>\nدراسة الظروف اللازمة\nلبدء الأنشطة بصورة\nمستقرة للمنظمات الدولية\nوالشركاء المحتملين\nفي مدينة غويانغ.\n</p>\n\n<p>\nوتشمل المجالات الممكنة\nالمكاتب ووسائل النقل\nوالسكن والرعاية الصحية\nوالتعليم والخدمات الأخرى.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالمرحلة الثانية — دعم التشغيل\n</h3>\n\n<p>\nتعزيز التعاون بين\nالمؤسسات الحكومية\nوالجامعات ومعاهد البحوث\nوالشركات والمجتمع المدني.\n</p>\n\n<p>\nودراسة فرص البحوث\nالمشتركة والمؤتمرات الدولية\nوالمشروعات التجريبية\nللذكاء الاصطناعي\nوتبادل الخبراء.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالمرحلة الثالثة — النمو المشترك المستدام\n</h3>\n\n<p>\nتطوير تعاون طويل الأجل\nيسهم في تحقيق أهداف\nالمنظمات الدولية\nوالتنمية المستدامة\nلمدينة غويانغ.\n</p>\n\n<p>\nوتشمل المجالات الممكنة\nالبحث العلمي وتطوير\nفرص العمل والأنشطة\nالاقتصادية والتنمية الإقليمية.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nالتأسيس الأولي ← دعم التشغيل ← النمو المشترك\n</strong>\n\n<p>\nيجب تحديد المرافق\nوالموارد المالية والتدابير\nالمؤسسية وبرامج التعاون\nمن خلال المشاورات\nوالإجراءات الرسمية\nذات الصلة.\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=ar\" class=\"button\">\nالمزيد عن استراتيجية التطوير\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     06. CITIZENS COMMITTEE\n===================================== -->\n\n<section id=\"committee\">\n\n<h2>\n5. اللجنة المدنية للمبادرة\n</h2>\n\n<p>\nاللجنة المدنية لدعم\nاستضافة المركز العالمي\nللذكاء الاصطناعي\nفي مدينة غويانغ الخاصة\nهي مبادرة مجتمعية تهدف\nإلى تعزيز الوعي العام\nوتوسيع مشاركة المواطنين.\n</p>\n\n<p>\nوتسعى اللجنة إلى دعم\nالنقاش المجتمعي حول\nفرص التعاون الدولي\nوتطوير الذكاء الاصطناعي\nوالنمو المستدام للمدينة.\n</p>\n\n<p>\nوتشمل مجالات عملها\nنشر المعلومات وتشجيع\nالمشاركة المدنية ومناقشة\nالمقترحات الاستراتيجية\nوالتواصل مع الجهات المعنية.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nمبادئنا\n</strong>\n\n<p>\nالشفافية والمسؤولية\nوالمشاركة المدنية البناءة\nواحترام الإجراءات الرسمية\nلاتخاذ القرارات.\n</p>\n\n</div>\n\n<a href=\"committee.html?lang=ar\" class=\"button\">\nالمزيد عن اللجنة المدنية\n</a>\n\n<a href=\"participate.html?lang=ar\"\nclass=\"button secondary\">\nالمشاركة المدنية\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     07. INTERNATIONAL PARTNERSHIP\n===================================== -->\n\n<section id=\"partnership\">\n\n<h2>\n6. فرص التعاون الدولي\n</h2>\n\n<p>\nتهدف مبادرة المركز العالمي\nللذكاء الاصطناعي إلى تعزيز\nالحوار مع المنظمات والمؤسسات\nالمهتمة بالتطوير المسؤول\nللذكاء الاصطناعي والتعاون\nالدولي والتنمية المستدامة.\n</p>\n\n<p>\nوتشمل مجالات التعاون\nالمحتملة ما يلي:\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nالحوار السياسي والخبرات\n</h3>\n\n<p>\nتبادل الخبرات والآراء\nبشأن التعاون الدولي\nوحوكمة الذكاء الاصطناعي\nوالابتكار التكنولوجي\nلخدمة المصلحة العامة.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالتعاون البحثي\n</h3>\n\n<p>\nدراسة فرص البحوث\nمتعددة التخصصات\nوتبادل المعرفة وتطوير\nالشبكات العلمية الدولية.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالمشروعات التكنولوجية\n</h3>\n\n<p>\nاستكشاف فرص تنفيذ\nالمشروعات التجريبية\nوالتطبيق العملي وتقييم\nتقنيات الذكاء الاصطناعي\nالمسؤول.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nتبادل الخبراء\n</h3>\n\n<p>\nدراسة فرص تنظيم\nالبرامج التدريبية\nوالندوات والمنتديات\nالدولية وأنشطة\nبناء القدرات.\n</p>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nتمثل المجالات المذكورة\nفرصاً محتملة للتعاون،\nولا تعني وجود اتفاقات\nمؤكدة مع المنظمات الدولية.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     08. CONTACT\n===================================== -->\n\n<section id=\"contact\">\n\n<h2>\n7. الاتصال والمعلومات الإضافية\n</h2>\n\n<p>\nنرحب باهتمام المنظمات\nالدولية والمؤسسات البحثية\nوالخبراء والمواطنين\nبمفهوم المركز العالمي\nللذكاء الاصطناعي\nوأنشطة اللجنة المدنية.\n</p>\n\n<p>\nيمكن الحصول على معلومات\nإضافية من خلال الصفحات\nالعربية للموقع الإلكتروني.\n</p>\n\n<p>\nوتوفر النسخة الكورية\nمن الموقع مواد وخدمات\nإضافية باللغة الكورية.\n</p>\n\n<a href=\"guide.html?lang=ar\" class=\"button\">\nدليل استخدام الموقع\n</a>\n\n<a href=\"index.html\"\nclass=\"button secondary\">\nالنسخة الكورية\n</a>\n\n<div class=\"highlight\">\n\n<strong>\nمبادرة المركز العالمي للذكاء الاصطناعي\n<br>\nمدينة غويانغ الخاصة،\nمقاطعة غيونغي،\nجمهورية كوريا\n</strong>\n\n<p>\nاللجنة المدنية لدعم\nاستضافة المركز العالمي\nللذكاء الاصطناعي\nفي مدينة غويانغ\n</p>\n\n<p class=\"note\">\nيمثل هذا الموقع\nمبادرة مجتمعية وأنشطتها،\nولا يعني صدور قرار رسمي\nمن الجهات الحكومية\nبإنشاء المركز العالمي\nللذكاء الاصطناعي\nأو تأكيد مشاركة\nأي منظمة دولية.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     09. ARABIC PAGE DIRECTORY\n===================================== -->\n\n<section id=\"directory\" class=\"page-directory\">\n\n<h2>\n8. أقسام الموقع باللغة العربية\n</h2>\n\n<p>\nتقدم الصفحات التالية\nمعلومات تفصيلية\nعن المركز العالمي\nللذكاء الاصطناعي\nومدينة غويانغ\nوالتعاون الدولي\nوالمشاركة المدنية.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nالمركز العالمي للذكاء الاصطناعي\n</h3>\n\n<p>\nالمفهوم والأهداف\nومجالات التعاون الدولي.\n</p>\n\n<a href=\"hub.html?lang=ar\" class=\"button\">\nالمزيد\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nلماذا مدينة غويانغ؟\n</h3>\n\n<p>\nالمزايا الجغرافية\nوالبنية التحتية\nوإمكانات التنمية.\n</p>\n\n<a href=\"goyang.html?lang=ar\" class=\"button\">\nالمزيد\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالمنظمات الدولية\n</h3>\n\n<p>\nتسع منظمات دولية\nومجالات التعاون المحتملة.\n</p>\n\n<a href=\"agencies.html?lang=ar\" class=\"button\">\nالمزيد\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nاستراتيجية التطوير\n</h3>\n\n<p>\nالتأسيس الأولي\nودعم التشغيل\nوالنمو المشترك.\n</p>\n\n<a href=\"strategy.html?lang=ar\" class=\"button\">\nالمزيد\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nاللجنة المدنية\n</h3>\n\n<p>\nرسالة اللجنة\nوتنظيمها\nوأنشطتها الرئيسية.\n</p>\n\n<a href=\"committee.html?lang=ar\" class=\"button\">\nالمزيد\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالتسلسل الزمني\n</h3>\n\n<p>\nالأحداث الرئيسية\nومراحل تطور المبادرة.\n</p>\n\n<a href=\"history.html?lang=ar\" class=\"button\">\nالمزيد\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالأخبار\n</h3>\n\n<p>\nمعلومات عن الأنشطة\nوالفعاليات والأحداث.\n</p>\n\n<a href=\"news.html?lang=ar\" class=\"button\">\nقراءة الأخبار\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالتغطية الإعلامية\n</h3>\n\n<p>\nالتقارير الصحفية\nوالتلفزيونية\nوالمواد الإعلامية.\n</p>\n\n<a href=\"press.html?lang=ar\" class=\"button\">\nعرض التغطية\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nالمشاركة المدنية\n</h3>\n\n<p>\nمعلومات عن فرص\nدعم المبادرة\nوالمشاركة في أنشطتها.\n</p>\n\n<a href=\"participate.html?lang=ar\" class=\"button\">\nكيفية المشاركة\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nدليل استخدام الموقع\n</h3>\n\n<p>\nمعلومات عن استخدام\nالموقع والبحث\nعن المواد المطلوبة.\n</p>\n\n<a href=\"guide.html?lang=ar\" class=\"button\">\nفتح الدليل\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     10. MULTILINGUAL INFORMATION\n===================================== -->\n\n<section id=\"languages\">\n\n<h2>\n9. الموقع الإلكتروني متعدد اللغات\n</h2>\n\n<p>\nيوفر الموقع الإلكتروني\nلمبادرة المركز العالمي\nللذكاء الاصطناعي\nصفحات رئيسية بعشر لغات،\nلخدمة الزوار من مختلف\nالدول والمنظمات الدولية\nوالمؤسسات البحثية\nوالشركات والمواطنين.\n</p>\n\n<p>\nيمكنكم اختيار اللغة\nالمفضلة باستخدام\nقائمة اختيار اللغة\nفي أعلى الصفحة.\n</p>\n\n<p>\nوتوفر النسخة الكورية\nمواد وخدمات إضافية\nباللغة الكورية.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nاللغات المتاحة\n</strong>\n\n<p>\n<a href=\"index.html\"\nlang=\"ko\" dir=\"ltr\">\n한국어 — الكورية\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=en\"\nlang=\"en\" dir=\"ltr\">\nEnglish — الإنجليزية\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=zh\"\nlang=\"zh\" dir=\"ltr\">\n中文 — الصينية\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ja\"\nlang=\"ja\" dir=\"ltr\">\n日本語 — اليابانية\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ru\"\nlang=\"ru\" dir=\"ltr\">\nРусский — الروسية\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ar\"\nlang=\"ar\"\ndir=\"rtl\"\naria-current=\"page\">\nالعربية — العربية ✓\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=es\"\nlang=\"es\" dir=\"ltr\">\nEspañol — الإسبانية\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\"\nlang=\"fr\" dir=\"ltr\">\nFrançais — الفرنسية\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=de\"\nlang=\"de\" dir=\"ltr\">\nDeutsch — الألمانية\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=it\"\nlang=\"it\" dir=\"ltr\">\nItaliano — الإيطالية\n</a>\n</p>\n\n</div>\n\n<p class=\"note\">\nقد تختلف الصفحات\nوالخدمات المتاحة\nبحسب اللغة المختارة.\n</p>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nمبادرة المركز العالمي للذكاء الاصطناعي\n</strong>\n</p>\n\n<p>\nمدينة غويانغ الخاصة\n<br>\nمقاطعة غيونغي\n<br>\nجمهورية كوريا\n</p>\n\n<p>\nاللجنة المدنية لدعم\nاستضافة المركز العالمي\nللذكاء الاصطناعي\nفي مدينة غويانغ\n</p>\n\n<p>\nالذكاء الاصطناعي من أجل الإنسانية\n<br>\nالتعاون الدولي من أجل مستقبل أفضل\n</p>\n\n\u003c!-- =====================================\n     FOOTER LANGUAGE LINKS\n===================================== -->\n\n<div\nclass=\"footer-language-links\"\naria-label=\"اختيار اللغة\"\n>\n\n<a href=\"index.html\"\nlang=\"ko\" dir=\"ltr\">\n한국어\n</a>\n\n<a href=\"index.html?lang=en\"\nlang=\"en\" dir=\"ltr\">\nEnglish\n</a>\n\n<a href=\"index.html?lang=zh\"\nlang=\"zh\" dir=\"ltr\">\n中文\n</a>\n\n<a href=\"index.html?lang=ja\"\nlang=\"ja\" dir=\"ltr\">\n日本語\n</a>\n\n<a href=\"index.html?lang=ru\"\nlang=\"ru\" dir=\"ltr\">\nРусский\n</a>\n\n<a href=\"index.html?lang=ar\"\nlang=\"ar\"\ndir=\"rtl\"\naria-current=\"page\">\nالعربية ✓\n</a>\n\n<a href=\"index.html?lang=es\"\nlang=\"es\" dir=\"ltr\">\nEspañol\n</a>\n\n<a href=\"index.html?lang=fr\"\nlang=\"fr\" dir=\"ltr\">\nFrançais\n</a>\n\n<a href=\"index.html?lang=de\"\nlang=\"de\" dir=\"ltr\">\nDeutsch\n</a>\n\n<a href=\"index.html?lang=it\"\nlang=\"it\" dir=\"ltr\">\nItaliano\n</a>\n\n</div>\n\n<p>\n<a href=\"guide.html?lang=ar\">\nدليل استخدام الموقع\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ar\">\nالعودة إلى الصفحة الرئيسية\n</a>\n</p>\n\n<p style=\"font-size:12px; color:#b8cbe5;\">\n© <span id=\"copyrightYear\">2026</span>\nمبادرة المركز العالمي للذكاء الاصطناعي.\nجميع الحقوق محفوظة.\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     COPYRIGHT YEAR\n===================================== -->\n\n\u003cscript>\n\n(function () {\n\n  \"use strict\";\n\n  const yearElement =\n    document.getElementById(\"copyrightYear\");\n\n  if (yearElement) {\n    yearElement.textContent =\n      new Date().getFullYear();\n  }\n\n})();\n\n\u003c/script>\n\n</body>\n</html>  \n",

=====================================\n   04. SPRACHAUSWAHL\n===================================== */\n\n.language-dropdown {\n  position: relative;\n  flex: 0 0 auto;\n  z-index: 2000;\n}\n\n.language-dropdown > summary {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n\n  min-height: 42px;\n  padding: 9px 14px;\n\n  background: #008c95;\n  color: white;\n\n  border: 1px solid #008c95;\n  border-radius: 7px;\n\n  font-size: 13px;\n  font-weight: 800;\n\n  cursor: pointer;\n  list-style: none;\n  white-space: nowrap;\n\n  transition: background 0.2s ease;\n}\n\n.language-dropdown > summary::-webkit-details-marker {\n  display: none;\n}\n\n.language-dropdown > summary::marker {\n  content: \"\";\n}\n\n.language-dropdown > summary:hover,\n.language-dropdown[open] > summary {\n  background: #006e76;\n  border-color: #006e76;\n}\n\n.language-dropdown > summary:focus-visible {\n  outline: 3px solid #ffe44d;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   05. SPRACHMENÜ\n===================================== */\n\n.language-options {\n  position: absolute;\n\n  top: calc(100% + 6px);\n  left: 0;\n  right: auto;\n\n  z-index: 3000;\n\n  width: 190px;\n  max-width: calc(100vw - 20px);\n\n  max-height: min(70vh, 480px);\n  max-height: min(70dvh, 480px);\n\n  overflow-y: auto;\n  overscroll-behavior: contain;\n\n  -webkit-overflow-scrolling: touch;\n\n  padding: 8px;\n\n  background: white;\n\n  border: 1px solid #cbdff5;\n  border-radius: 8px;\n\n  box-shadow: 0 6px 20px rgba(0,0,0,0.2);\n}\n\n.language-options a {\n  display: block;\n\n  width: 100%;\n  padding: 10px 12px;\n\n  background: white;\n  color: #0754a6;\n\n  border-radius: 5px;\n\n  font-size: 14px;\n  text-align: left;\n  text-decoration: none;\n  white-space: nowrap;\n}\n\n.language-options a:hover,\n.language-options a:focus-visible {\n  background: #eaf4ff;\n}\n\n.language-options a[aria-current=\"page\"] {\n  background: #eaf4ff;\n  font-weight: 800;\n}\n\n/* =====================================\n   06. ALLGEMEINES MENÜ\n===================================== */\n\n.home-menu-links {\n  display: flex;\n  flex: 1 1 auto;\n  flex-wrap: nowrap;\n\n  align-items: center;\n  justify-content: flex-start;\n\n  gap: 6px;\n\n  min-width: 0;\n\n  overflow-x: auto;\n  overflow-y: hidden;\n\n  -webkit-overflow-scrolling: touch;\n\n  scrollbar-width: thin;\n  scrollbar-color: #ffe44d #10315e;\n\n  padding-bottom: 5px;\n}\n\n.home-menu-links > a {\n  display: inline-flex;\n  flex: 0 0 auto;\n\n  align-items: center;\n  justify-content: center;\n\n  min-height: 42px;\n  padding: 8px 12px;\n\n  background: white;\n  color: #0754a6;\n\n  border: 1px solid #d6e5f5;\n  border-radius: 6px;\n\n  font-size: 12px;\n  font-weight: 700;\n\n  text-decoration: none;\n  white-space: nowrap;\n}\n\n.home-menu-links > a:hover,\n.home-menu-links > a:focus-visible {\n  background: #ffe44d;\n  color: #003b79;\n}\n\n/* =====================================\n   07. SCROLLBAR\n===================================== */\n\n.home-menu-links::-webkit-scrollbar {\n  height: 6px;\n}\n\n.home-menu-links::-webkit-scrollbar-track {\n  background: #10315e;\n}\n\n.home-menu-links::-webkit-scrollbar-thumb {\n  background: #ffe44d;\n  border-radius: 10px;\n}\n\n/* =====================================\n   08. HAUPTBANNER\n===================================== */\n\n.main-banner {\n  width: 100%;\n  margin: 0;\n  overflow: hidden;\n  background: #0754a6;\n}\n\n.main-banner img {\n  display: block;\n  width: 100%;\n  height: auto;\n}\n\n/* =====================================\n   09. HAUPTINHALT\n===================================== */\n\nmain {\n  max-width: 1180px;\n  margin: auto;\n  padding: 30px 15px;\n}\n\nmain section {\n  background: white;\n  border-radius: 12px;\n  padding: 35px;\n  margin-bottom: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.06);\n}\n\nmain h2 {\n  color: #0754a6;\n  border-bottom: 2px solid #e3edf8;\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nmain h3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   10. VISION\n===================================== */\n\nmain section.hero {\n  text-align: center;\n  background: linear-gradient(\n    135deg,\n    #eaf4ff,\n    #ffffff\n  );\n}\n\n.hero h2 {\n  border: none;\n  font-size: clamp(25px, 4vw, 37px);\n  line-height: 1.4;\n}\n\n.hero p {\n  font-size: 18px;\n}\n\n/* =====================================\n   11. KARTEN\n===================================== */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(0, 1fr));\n  gap: 20px;\n}\n\n.card {\n  min-width: 0;\n  background: #f4f8fc;\n  padding: 24px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   12. HERVORHEBUNG\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 24px;\n  margin: 20px 0;\n  border-radius: 8px;\n}\n\n/* =====================================\n   13. SCHALTFLÄCHEN\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  padding: 12px 22px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n  margin: 10px 8px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: #0754a6;\n}\n\n.button.secondary:hover {\n  background: #cce2ff;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   14. SEITENÜBERSICHT\n===================================== */\n\nmain section.page-directory {\n  background: #f0f6ff;\n}\n\n.page-directory .card {\n  background: white;\n}\n\n/* =====================================\n   15. FUSSZEILE\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n.footer-language-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  align-items: center;\n  gap: 10px 18px;\n  margin: 25px auto;\n}\n\n.footer-language-links a {\n  color: white;\n  font-size: 14px;\n  font-weight: 600;\n  text-decoration: none;\n}\n\n.footer-language-links a:hover {\n  color: #ffe44d;\n  text-decoration: underline;\n}\n\n/* =====================================\n   16. RESPONSIVE ANPASSUNGEN\n===================================== */\n\n@media (max-width: 767px) {\n\n  header {\n    padding: 14px 12px;\n  }\n\n  .main-nav {\n    padding: 8px 10px;\n    gap: 6px;\n  }\n\n  .language-dropdown > summary {\n    min-height: 42px;\n    padding: 8px 10px;\n    font-size: 12px;\n  }\n\n  .language-options {\n    width: 170px;\n    max-height: 60vh;\n    max-height: 60dvh;\n  }\n\n  .home-menu-links {\n    gap: 5px;\n  }\n\n  .home-menu-links > a {\n    padding: 8px 9px;\n    font-size: 11px;\n  }\n\n  main {\n    padding: 15px 10px;\n  }\n\n  main section {\n    padding: 23px;\n  }\n\n  .card {\n    padding: 19px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin: 10px 0;\n  }\n\n}\n\n/* =====================================\n   17. GRID RESPONSIVE\n===================================== */\n\n@media (min-width: 600px) {\n\n  .grid {\n    grid-template-columns:\n      repeat(auto-fit, minmax(260px, 1fr));\n  }\n\n}\n\n/* =====================================\n   18. SMALL SCREEN SAFETY\n===================================== */\n\n@media (max-width: 599px) {\n\n  .grid {\n    grid-template-columns: minmax(0, 1fr);\n  }\n\n}\n\n/* =====================================\n   19. LANDSCAPE LANGUAGE SCROLL\n===================================== */\n\n@media (orientation: landscape)\nand (max-height: 500px) {\n\n  .language-options {\n    max-height: 60vh;\n    max-height: 60dvh;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     KOPFBEREICH\n===================================== -->\n\n<header id=\"home\">\n\n<h1>\nINITIATIVE FÜR EIN GLOBALES KI-ZENTRUM\n</h1>\n\n<h2>\nSonderstadt Goyang ·\nProvinz Gyeonggi, Republik Korea\n</h2>\n\n</header>\n\n\u003c!-- =====================================\n     HAUPTNAVIGATION\n===================================== -->\n\n<nav class=\"main-nav\"\naria-label=\"Hauptnavigation\">\n\n\u003c!-- =====================================\n     SPRACHAUSWAHL LINKS FIXIERT\n===================================== -->\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"Sprache auswählen\">\n🌐 Sprache ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a href=\"index.html\" lang=\"ko\">\n한국어\n</a>\n\n<a href=\"index.html?lang=en\" lang=\"en\">\nEnglish\n</a>\n\n<a href=\"index.html?lang=zh\" lang=\"zh\">\n中文\n</a>\n\n<a href=\"index.html?lang=ja\" lang=\"ja\">\n日本語\n</a>\n\n<a href=\"index.html?lang=ru\" lang=\"ru\">\nРусский\n</a>\n\n<a href=\"index.html?lang=ar\"\nlang=\"ar\" dir=\"rtl\">\nالعربية\n</a>\n\n<a href=\"index.html?lang=es\" lang=\"es\">\nEspañol\n</a>\n\n<a href=\"index.html?lang=fr\" lang=\"fr\">\nFrançais\n</a>\n\n<a href=\"index.html?lang=de\"\nlang=\"de\"\naria-current=\"page\">\nDeutsch ✓\n</a>\n\n<a href=\"index.html?lang=it\" lang=\"it\">\nItaliano\n</a>\n\n</div>\n\n</details>\n\n\u003c!-- =====================================\n     ALLGEMEINES MENÜ\n===================================== -->\n\n<div class=\"home-menu-links\">\n\n<a href=\"index.html?lang=de\">\nStartseite\n</a>\n\n<a href=\"hub.html?lang=de\">\nGlobales KI-Zentrum\n</a>\n\n<a href=\"goyang.html?lang=de\">\nWarum Goyang?\n</a>\n\n<a href=\"agencies.html?lang=de\">\nInternationale Organisationen\n</a>\n\n<a href=\"strategy.html?lang=de\">\nStrategie\n</a>\n\n<a href=\"committee.html?lang=de\">\nBürgerkomitee\n</a>\n\n<a href=\"history.html?lang=de\">\nChronologie\n</a>\n\n<a href=\"news.html?lang=de\">\nAktuelles\n</a>\n\n<a href=\"press.html?lang=de\">\nPresse\n</a>\n\n<a href=\"participate.html?lang=de\">\nBürgerbeteiligung\n</a>\n\n<a href=\"guide.html?lang=de\">\nLeitfaden\n</a>\n<a href=\"gallery.html?lang=de\">Fotogalerie</a>\n<a href=\"library.html?lang=de\">Digitale Bibliothek</a>\n<a href=\"resources.html?lang=de\">Ressourcenzentrum</a>\n\n</div>\n\n</nav>\n\n\u003c!-- =====================================\n     HAUPTBANNER\n===================================== -->\n\n<div class=\"main-banner\">\n\n<img\nsrc=\"aihub-main-banner-de.png\"\nalt=\"Initiative für ein globales KI-Zentrum in Goyang\"\nloading=\"eager\"\nfetchpriority=\"high\">\n\n</div>\n\n<main>\n\n\u003c!-- =====================================\n     01. VISION\n===================================== -->\n\n<section class=\"hero\" id=\"vision\">\n\n<h2>\nKünstliche Intelligenz im Dienste der Menschheit\n</h2>\n\n<p>\nInternationale Zusammenarbeit für eine bessere Zukunft\n</p>\n\n<p>\nWir möchten die Zusammenarbeit\nzwischen internationalen Organisationen,\nRegierungen, Universitäten,\nForschungseinrichtungen,\nUnternehmen und der Zivilgesellschaft\nfördern, um die Möglichkeiten\nder künstlichen Intelligenz\nzur Bewältigung gemeinsamer\nglobaler Herausforderungen\nzu untersuchen.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nUnsere Vision\n</strong>\n\n<p>\nWir streben danach,\ndie Sonderstadt Goyang\nzu einem internationalen Zentrum\nfür Zusammenarbeit\nim Bereich der künstlichen Intelligenz,\nwissenschaftliche Forschung\nund Innovation zu entwickeln.\n</p>\n\n<p>\nDiese Initiative soll\nzur nachhaltigen Entwicklung\nund zum Wohlergehen\nder Menschheit beitragen.\n</p>\n\n</div>\n\n<a href=\"#goyang\" class=\"button\">\nWarum Goyang?\n</a>\n\n<a href=\"#partnership\"\nclass=\"button secondary\">\nInternationale Zusammenarbeit\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     02. GLOBALES KI-ZENTRUM\n===================================== -->\n\n<section id=\"hub\">\n\n<h2>\n1. Was ist das globale KI-Zentrum?\n</h2>\n\n<p>\nDas globale Zentrum\nfür künstliche Intelligenz\nist eine Initiative,\ndie darauf abzielt,\neine internationale\nKooperationsplattform\nfür die verantwortungsvolle\nNutzung künstlicher Intelligenz\nvorzuschlagen.\n</p>\n\n<p>\nDabei sollen die Erfahrungen\ninternationaler Organisationen\nmit den wissenschaftlichen\nund technologischen Fähigkeiten\nvon Regierungen,\nUniversitäten,\nForschungseinrichtungen\nund Unternehmen\nverbunden werden.\n</p>\n\n<p>\nDie Initiative untersucht,\nwie künstliche Intelligenz\nzur Bewältigung globaler\nHerausforderungen beitragen kann.\n</p>\n\n<p>\nZu den möglichen\nAnwendungsbereichen gehören\nöffentliche Gesundheit,\nErnährungssicherheit,\nKlimawandel,\nUmweltschutz,\nhumanitäre Hilfe,\nMigration,\nBeschäftigung,\nBildung und\nKatastrophenvorsorge.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nInternationale Zusammenarbeit\n</h3>\n\n<p>\nFörderung des internationalen\nDialogs, des Erfahrungsaustauschs\nund der Entwicklung\ngemeinsamer Initiativen\nzur Bewältigung\nglobaler Herausforderungen.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nForschung und Innovation\n</h3>\n\n<p>\nUntersuchung verantwortungsvoller\nAnwendungen künstlicher Intelligenz\nsowie Förderung\nwissenschaftlicher Forschung\nund technologischer Innovation\nim öffentlichen Interesse.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPraktische Anwendungen\n</h3>\n\n<p>\nPrüfung möglicher Pilotprojekte,\ntechnologischer Erprobungen\nund Anwendungen\nkünstlicher Intelligenz\nzur Lösung gesellschaftlicher\nund öffentlicher Aufgaben.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nWissensaustausch\n</h3>\n\n<p>\nFörderung von Fachausbildung,\ninternationalem Expertenaustausch\nund der Verbreitung\nwissenschaftlicher\nund technologischer Kenntnisse.\n</p>\n\n</div>\n\n</div>\n\n<a href=\"hub.html?lang=de\" class=\"button\">\nMehr über das globale KI-Zentrum\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     03. WARUM GOYANG?\n===================================== -->\n\n<section id=\"goyang\">\n\n<h2>\n2. Warum die Sonderstadt Goyang?\n</h2>\n\n<p>\nDie Sonderstadt Goyang\nliegt in der Provinz Gyeonggi\nin der Republik Korea\nund gehört zur Metropolregion Seoul.\n</p>\n\n<p>\nDie Stadt verfügt\nüber Einrichtungen\nfür internationale Ausstellungen\nund Konferenzen,\nmedizinische Institutionen,\nBildungs- und Kultureinrichtungen\nsowie städtische\nund natürliche Ressourcen.\n</p>\n\n<p>\nDiese Voraussetzungen\nkönnen eine Grundlage\nfür die Prüfung\neines internationalen\nKooperationszentrums\nim Bereich der künstlichen\nIntelligenz bilden.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nMetropolitane Lage\n</h3>\n\n<p>\nGoyang befindet sich\nin der Metropolregion Seoul\nund bietet Zugang\nzu wirtschaftlichen,\nwissenschaftlichen\nund institutionellen Netzwerken.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nInternationales Messezentrum KINTEX\n</h3>\n\n<p>\nDas Korea International\nExhibition Center (KINTEX)\nverfügt über Einrichtungen\nfür internationale Ausstellungen,\nKonferenzen und Veranstaltungen.\n</p>\n\n<p>\nDiese Infrastruktur könnte\nfür wissenschaftliche Foren,\ninternationale Treffen\nund zukünftige\nKooperationsprogramme\ngenutzt werden.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nMedizinische und wissenschaftliche Ressourcen\n</h3>\n\n<p>\nIn Goyang befinden sich\nunter anderem\ndas Nationale Krebszentrum Koreas\nund weitere medizinische\nEinrichtungen.\n</p>\n\n<p>\nDiese Ressourcen eröffnen\nMöglichkeiten zur Prüfung\nwissenschaftlicher Zusammenarbeit\nin den Bereichen\nöffentliche Gesundheit,\nmedizinische Forschung\nund verantwortungsvolle\nKI-Anwendungen.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUmwelt und natürliche Ressourcen\n</h3>\n\n<p>\nDie Janghang-Feuchtgebiete\nund weitere Naturräume\nbieten wertvolle Grundlagen\nfür Umweltforschung,\nBildung und Initiativen\nzur nachhaltigen Entwicklung.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nLebensqualität\n</h3>\n\n<p>\nGoyang verfügt\nüber Wohngebiete,\nGesundheitsversorgung,\nBildungseinrichtungen,\nkulturelle Angebote\nund städtische Dienstleistungen.\n</p>\n\n<p>\nDie besonderen Bedürfnisse\nmöglicher internationaler\nOrganisationen,\nihrer Beschäftigten\nund Familien müssten\nim Rahmen entsprechender\nKonsultationen ermittelt werden.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nRegionale Entwicklung\n</h3>\n\n<p>\nEine stärkere internationale\nZusammenarbeit könnte\nzur wissenschaftlichen Forschung,\nzur Schaffung neuer\nBeschäftigungsmöglichkeiten\nund zur Entwicklung\nwirtschaftlicher Aktivitäten\nbeitragen.\n</p>\n\n<p>\nDie konkreten Ergebnisse\nwürden von Art und Umfang\nzukünftiger Projekte abhängen.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nInternationale Zusammenarbeit\nund nachhaltige Stadtentwicklung\n</strong>\n\n<p>\nGoyang möchte\nseine vorhandenen Ressourcen\nnutzen, um Möglichkeiten\nfür ein internationales\nKooperationszentrum\nzu untersuchen.\n</p>\n\n<p>\nDabei sollen sowohl\nglobale Herausforderungen\nals auch die nachhaltige\nEntwicklung der Stadt\nberücksichtigt werden.\n</p>\n\n</div>\n\n<a href=\"goyang.html?lang=de\" class=\"button\">\nMehr über Goyang erfahren\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     04. INTERNATIONALE ORGANISATIONEN\n===================================== -->\n\n<section id=\"organizations\">\n\n<h2>\n3. Internationale Organisationen\nund mögliche Kooperationsbereiche\n</h2>\n\n<p>\nDie Initiative für ein globales\nKI-Zentrum untersucht\nmögliche Kooperationsbereiche,\ndie mit den Aufgaben\nvon neun internationalen\nOrganisationen\nin Verbindung stehen.\n</p>\n\n<p>\nDie folgenden Bereiche\ndienen ausschließlich\nder Darstellung möglicher\nzukünftiger Zusammenarbeit.\n</p>\n\n<p>\nSie stellen weder bestätigte\nVereinbarungen noch\ninstitutionelle Zusagen dar.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nWHO – Weltgesundheitsorganisation\n</h3>\n\n<p>\nÖffentliche Gesundheit,\nKrankheitsprävention,\nStärkung der Gesundheitssysteme,\nAnalyse medizinischer Daten\nund verantwortungsvolle\nNutzung künstlicher Intelligenz.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nWFP – Welternährungsprogramm\n</h3>\n\n<p>\nErnährungssicherheit,\nhumanitäre Hilfe,\nnachhaltige Lieferketten\nund Analyse\nvon Ernährungskrisen.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNEP – Umweltprogramm der Vereinten Nationen\n</h3>\n\n<p>\nKlimawandel,\nUmweltschutz,\nbiologische Vielfalt\nund Überwachung\nvon Umweltbedingungen.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNHCR – Hoher Flüchtlingskommissar der Vereinten Nationen\n</h3>\n\n<p>\nFlüchtlingsschutz,\nerzwungene Vertreibung,\nhumanitäre Hilfe\nund verantwortungsvolle\nDatennutzung\nbei Schutzmaßnahmen.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nIOM – Internationale Organisation für Migration\n</h3>\n\n<p>\nInternationale Migration,\nUnterstützung\nvertriebener Menschen,\nhumanitäre Hilfe\nund digitale Lösungen\nfür migrationsbezogene\nDienstleistungen.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nILO – Internationale Arbeitsorganisation\n</h3>\n\n<p>\nBeschäftigung,\nArbeitnehmerrechte,\nberufliche Weiterbildung\nund Untersuchung\nder Auswirkungen\nkünstlicher Intelligenz\nauf die Zukunft der Arbeit.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nITU – Internationale Fernmeldeunion\n</h3>\n\n<p>\nDigitale Telekommunikation,\nKommunikationsinfrastruktur,\nNotfallkommunikation\nund Frühwarnsysteme\nbei Katastrophen.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNICEF – Kinderhilfswerk der Vereinten Nationen\n</h3>\n\n<p>\nKinderschutz,\nBildung,\ndigitale Inklusion\nund verantwortungsvolle\nNutzung künstlicher Intelligenz\nunter Berücksichtigung\nder Rechte von Kindern.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNDP – Entwicklungsprogramm der Vereinten Nationen\n</h3>\n\n<p>\nNachhaltige Entwicklung,\nKrisenbewältigung,\ninstitutioneller Kapazitätsaufbau\nund mögliche KI-Anwendungen\nin Entwicklungsprogrammen.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nWichtiger Hinweis\n</strong>\n\n<p>\nDie oben genannten\ninternationalen Organisationen\nwerden ausschließlich\nim Zusammenhang\nmit ihren institutionellen\nAufgaben und möglichen\nzukünftigen Kooperationsfeldern\naufgeführt.\n</p>\n\n<p>\nDies bedeutet nicht,\ndass diese Organisationen\nihre Teilnahme\nan der Initiative bestätigt\noder der Einrichtung\nbeziehungsweise Verlagerung\nvon Büros oder Organisationseinheiten\nnach Goyang zugestimmt haben.\n</p>\n\n<p>\nJede zukünftige Zusammenarbeit\nwürde offizielle Konsultationen,\nentsprechende institutionelle\nEntscheidungen\nund die jeweils geltenden\nGenehmigungsverfahren\nerfordern.\n</p>\n\n</div>\n\n<a href=\"agencies.html?lang=de\" class=\"button\">\nMehr über die neun Organisationen\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     05. DREISTUFIGE STRATEGIE\n===================================== -->\n\n<section id=\"strategy\">\n\n<h2>\n4. Dreistufige Entwicklungsstrategie\n</h2>\n\n<p>\nDie Initiative schlägt\neinen schrittweisen Ansatz\nvor, der die tatsächlichen\nBedürfnisse möglicher\ninternationaler Partner\nberücksichtigt.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nPhase 1 – Erste Ansiedlung\n</h3>\n\n<p>\nPrüfung der Voraussetzungen\nfür einen stabilen Beginn\nder Tätigkeit möglicher\ninternationaler Organisationen\nund Partnereinrichtungen\nin Goyang.\n</p>\n\n<p>\nZu den möglichen\nUntersuchungsbereichen gehören\nBüroräume,\nVerkehrsanbindungen,\nWohnraum,\nGesundheitsversorgung,\nBildung\nund weitere Dienstleistungen.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPhase 2 – Unterstützung des Betriebs\n</h3>\n\n<p>\nFörderung der Zusammenarbeit\nzwischen öffentlichen\nInstitutionen,\nUniversitäten,\nForschungseinrichtungen,\nUnternehmen\nund der Zivilgesellschaft.\n</p>\n\n<p>\nPrüfung möglicher\ngemeinsamer Forschungsprojekte,\ninternationaler Konferenzen,\nKI-Pilotprojekte\nund des Expertenaustauschs.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPhase 3 – Gemeinsames nachhaltiges Wachstum\n</h3>\n\n<p>\nEntwicklung einer langfristigen\nZusammenarbeit,\ndie sowohl zu den Zielen\ninternationaler Organisationen\nals auch zur nachhaltigen\nEntwicklung Goyangs beiträgt.\n</p>\n\n<p>\nMögliche Bereiche umfassen\nwissenschaftliche Forschung,\nBeschäftigungsmöglichkeiten,\nwirtschaftliche Aktivitäten\nund regionale Entwicklung.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nErste Ansiedlung\n→ Betriebsunterstützung\n→ Gemeinsames Wachstum\n</strong>\n\n<p>\nKonkrete Einrichtungen,\nfinanzielle Ressourcen,\ninstitutionelle Maßnahmen\nund Kooperationsprogramme\nmüssten durch offizielle\nKonsultationen und Verfahren\nfestgelegt werden.\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=de\" class=\"button\">\nMehr über die Strategie\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     06. BÜRGERKOMITEE\n===================================== -->\n\n<section id=\"committee\">\n\n<h2>\n5. Bürgerkomitee für die Initiative\n</h2>\n\n<p>\nDas Bürgerkomitee\nzur Förderung der Ansiedlung\neines globalen KI-Zentrums\nin der Sonderstadt Goyang\nist eine Initiative\nder Zivilgesellschaft.\n</p>\n\n<p>\nEs möchte das öffentliche\nBewusstsein stärken\nund die Beteiligung\nder Bürgerinnen und Bürger\nan der Diskussion\nüber internationale Zusammenarbeit,\nkünstliche Intelligenz\nund nachhaltige Stadtentwicklung\nfördern.\n</p>\n\n<p>\nZu seinen Aktivitäten gehören\ndie Verbreitung von Informationen,\ndie Förderung\nder Bürgerbeteiligung,\ndie Diskussion\nstrategischer Vorschläge\nund die Kommunikation\nmit relevanten Institutionen.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nUnsere Grundsätze\n</strong>\n\n<p>\nTransparenz,\nVerantwortung,\nkonstruktive Bürgerbeteiligung\nund Achtung\nder offiziellen\nEntscheidungsverfahren.\n</p>\n\n</div>\n\n<a href=\"committee.html?lang=de\" class=\"button\">\nMehr über das Bürgerkomitee\n</a>\n\n<a href=\"participate.html?lang=de\"\nclass=\"button secondary\">\nBürgerbeteiligung\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     07. INTERNATIONALE ZUSAMMENARBEIT\n===================================== -->\n\n<section id=\"partnership\">\n\n<h2>\n6. Möglichkeiten internationaler Zusammenarbeit\n</h2>\n\n<p>\nDie Initiative möchte\nden Dialog mit internationalen\nOrganisationen,\nForschungseinrichtungen,\nFachleuten und anderen\nInstitutionen fördern,\ndie sich für verantwortungsvolle\nkünstliche Intelligenz,\ninternationale Zusammenarbeit\nund nachhaltige Entwicklung\ninteressieren.\n</p>\n\n<p>\nZu den möglichen\nKooperationsbereichen gehören:\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nInstitutioneller Dialog\n</h3>\n\n<p>\nAustausch von Erfahrungen\nund Perspektiven\nzur internationalen Zusammenarbeit,\nzur KI-Governance\nund zu technologischer Innovation\nim öffentlichen Interesse.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nWissenschaftliche Zusammenarbeit\n</h3>\n\n<p>\nPrüfung der Möglichkeiten\nmultidisziplinärer Forschung,\ndes Wissensaustauschs\nund des Aufbaus\ninternationaler\nwissenschaftlicher Netzwerke.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nTechnologische Projekte\n</h3>\n\n<p>\nUntersuchung möglicher\nPilotprojekte,\npraktischer Anwendungen\nund der Bewertung\nverantwortungsvoller\nKI-Technologien.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nExpertenaustausch\n</h3>\n\n<p>\nPrüfung möglicher\nAusbildungsprogramme,\nSeminare,\ninternationaler Foren\nund Maßnahmen\nzum Kapazitätsaufbau.\n</p>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nDie genannten Bereiche\nstellen lediglich mögliche\nKooperationsfelder dar.\nSie bedeuten nicht,\ndass bereits bestätigte\nVereinbarungen\nmit internationalen\nOrganisationen bestehen.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     08. KONTAKT UND INFORMATIONEN\n===================================== -->\n\n<section id=\"contact\">\n\n<h2>\n7. Kontakt und weitere Informationen\n</h2>\n\n<p>\nWir begrüßen das Interesse\ninternationaler Organisationen,\nForschungseinrichtungen,\nFachleute und Bürgerinnen\nund Bürger an der Initiative\nfür ein globales KI-Zentrum\nund an den Aktivitäten\ndes Bürgerkomitees.\n</p>\n\n<p>\nWeitere Informationen\nfinden Sie auf den\ndeutschsprachigen Seiten\ndieser Website.\n</p>\n\n<p>\nDie koreanische Version\nder Website bietet\nzusätzliche Dokumente\nund Dienstleistungen\nin koreanischer Sprache.\n</p>\n\n<a href=\"guide.html?lang=de\" class=\"button\">\nWebsite-Leitfaden\n</a>\n\n<a href=\"index.html\"\nclass=\"button secondary\">\nKoreanische Version\n</a>\n\n<div class=\"highlight\">\n\n<strong>\nInitiative für ein globales KI-Zentrum\n<br>\nSonderstadt Goyang\n<br>\nProvinz Gyeonggi\n<br>\nRepublik Korea\n</strong>\n\n<p>\nBürgerkomitee zur Förderung\nder Ansiedlung\neines globalen KI-Zentrums\nin Goyang\n</p>\n\n<p class=\"note\">\nDiese Website stellt\neine Initiative\nder Zivilgesellschaft\nund ihre Aktivitäten vor.\n</p>\n\n<p class=\"note\">\nSie bedeutet weder,\ndass staatliche Behörden\neine offizielle Entscheidung\nüber die Einrichtung\neines globalen KI-Zentrums\ngetroffen haben,\nnoch dass internationale\nOrganisationen\nihre Teilnahme bestätigt haben.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     09. DEUTSCHE SEITENÜBERSICHT\n===================================== -->\n\n<section id=\"directory\" class=\"page-directory\">\n\n<h2>\n8. Deutschsprachige Seiten\n</h2>\n\n<p>\nDie folgenden Seiten\nbieten weitere Informationen\nüber das globale KI-Zentrum,\ndie Sonderstadt Goyang,\ninternationale Zusammenarbeit\nund Bürgerbeteiligung.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nGlobales KI-Zentrum\n</h3>\n\n<p>\nKonzept,\nZiele und mögliche\ninternationale\nKooperationsbereiche.\n</p>\n\n<a href=\"hub.html?lang=de\" class=\"button\">\nMehr erfahren\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nWarum Goyang?\n</h3>\n\n<p>\nGeografische Vorteile,\nInfrastruktur\nund Entwicklungsmöglichkeiten.\n</p>\n\n<a href=\"goyang.html?lang=de\" class=\"button\">\nMehr erfahren\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nInternationale Organisationen\n</h3>\n\n<p>\nNeun internationale\nOrganisationen\nund mögliche\nKooperationsbereiche.\n</p>\n\n<a href=\"agencies.html?lang=de\" class=\"button\">\nMehr erfahren\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nEntwicklungsstrategie\n</h3>\n\n<p>\nErste Ansiedlung,\nBetriebsunterstützung\nund gemeinsames Wachstum.\n</p>\n\n<a href=\"strategy.html?lang=de\" class=\"button\">\nMehr erfahren\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nBürgerkomitee\n</h3>\n\n<p>\nAufgaben,\nOrganisation\nund wichtige Aktivitäten\ndes Bürgerkomitees.\n</p>\n\n<a href=\"committee.html?lang=de\" class=\"button\">\nMehr erfahren\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nChronologie\n</h3>\n\n<p>\nWichtige Ereignisse\nund Entwicklungsschritte\nder Initiative.\n</p>\n\n<a href=\"history.html?lang=de\" class=\"button\">\nMehr erfahren\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nAktuelles\n</h3>\n\n<p>\nInformationen\nüber Aktivitäten,\nVeranstaltungen\nund aktuelle Entwicklungen.\n</p>\n\n<a href=\"news.html?lang=de\" class=\"button\">\nAktuelles ansehen\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPresse\n</h3>\n\n<p>\nPresseartikel,\nBerichte\nund weitere\nInformationsmaterialien.\n</p>\n\n<a href=\"press.html?lang=de\" class=\"button\">\nPresse ansehen\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nBürgerbeteiligung\n</h3>\n\n<p>\nInformationen\nüber Möglichkeiten,\ndie Initiative\nzu unterstützen\nund sich an ihren\nAktivitäten zu beteiligen.\n</p>\n\n<a href=\"participate.html?lang=de\" class=\"button\">\nMitmachen\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nWebsite-Leitfaden\n</h3>\n\n<p>\nInformationen\nzur Nutzung\nder Website\nund zur Suche\nnach Dokumenten.\n</p>\n\n<a href=\"guide.html?lang=de\" class=\"button\">\nLeitfaden öffnen\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     10. MEHRSPRACHIGE WEBSITE\n===================================== -->\n\n<section id=\"languages\">\n\n<h2>\n9. Mehrsprachige Website\n</h2>\n\n<p>\nDie Website der Initiative\nfür ein globales KI-Zentrum\nbietet Hauptseiten\nin zehn Sprachen an.\n</p>\n\n<p>\nDamit sollen Besucherinnen\nund Besucher\naus verschiedenen Ländern,\ninternationale Organisationen,\nForschungseinrichtungen,\nUnternehmen\nund die Öffentlichkeit\neinen besseren Zugang\nzu Informationen erhalten.\n</p>\n\n<p>\nÜber die Sprachauswahl\nam oberen Seitenrand\nkönnen Sie Ihre\nbevorzugte Sprache wählen.\n</p>\n\n<p>\nDie koreanische Version\nbietet zusätzliche\nDokumente und Dienste\nin koreanischer Sprache.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nVerfügbare Sprachen\n</strong>\n\n<p>\n<a href=\"index.html\" lang=\"ko\">\n한국어 – Koreanisch\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=en\" lang=\"en\">\nEnglish – Englisch\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=zh\" lang=\"zh\">\n中文 – Chinesisch\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ja\" lang=\"ja\">\n日本語 – Japanisch\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ru\" lang=\"ru\">\nРусский – Russisch\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ar\"\nlang=\"ar\" dir=\"rtl\">\nالعربية – Arabisch\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=es\" lang=\"es\">\nEspañol – Spanisch\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\" lang=\"fr\">\nFrançais – Französisch\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=de\"\nlang=\"de\"\naria-current=\"page\">\nDeutsch – Deutsch ✓\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=it\" lang=\"it\">\nItaliano – Italienisch\n</a>\n</p>\n\n</div>\n\n<p class=\"note\">\nDie verfügbaren Inhalte\nund Dienstleistungen\nkönnen je nach\nausgewählter Sprache\nunterschiedlich sein.\n</p>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FUSSZEILE\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nInitiative für ein globales KI-Zentrum\n</strong>\n</p>\n\n<p>\nSonderstadt Goyang\n<br>\nProvinz Gyeonggi\n<br>\nRepublik Korea\n</p>\n\n<p>\nBürgerkomitee zur Förderung\nder Ansiedlung\neines globalen KI-Zentrums\nin Goyang\n</p>\n\n<p>\nKünstliche Intelligenz\nim Dienste der Menschheit\n<br>\nInternationale Zusammenarbeit\nfür eine bessere Zukunft\n</p>\n\n\u003c!-- =====================================\n     SPRACHAUSWAHL IM FUSSBEREICH\n===================================== -->\n\n<div\nclass=\"footer-language-links\"\naria-label=\"Sprachauswahl\"\n>\n\n<a href=\"index.html\" lang=\"ko\">\n한국어\n</a>\n\n<a href=\"index.html?lang=en\" lang=\"en\">\nEnglish\n</a>\n\n<a href=\"index.html?lang=zh\" lang=\"zh\">\n中文\n</a>\n\n<a href=\"index.html?lang=ja\" lang=\"ja\">\n日本語\n</a>\n\n<a href=\"index.html?lang=ru\" lang=\"ru\">\nРусский\n</a>\n\n<a href=\"index.html?lang=ar\"\nlang=\"ar\" dir=\"rtl\">\nالعربية\n</a>\n\n<a href=\"index.html?lang=es\" lang=\"es\">\nEspañol\n</a>\n\n<a href=\"index.html?lang=fr\" lang=\"fr\">\nFrançais\n</a>\n\n<a href=\"index.html?lang=de\"\nlang=\"de\"\naria-current=\"page\">\nDeutsch ✓\n</a>\n\n<a href=\"index.html?lang=it\" lang=\"it\">\nItaliano\n</a>\n\n</div>\n\n<p>\n<a href=\"guide.html?lang=de\">\nWebsite-Leitfaden\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=de\">\nZurück zur Startseite\n</a>\n</p>\n\n<p style=\"font-size:12px; color:#b8cbe5;\">\n© <span id=\"copyrightYear\">2026</span>\nInitiative für ein globales KI-Zentrum.\nAlle Rechte vorbehalten.\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     AUTOMATISCHE JAHRESZAHL\n===================================== -->\n\n\u003cscript>\n\n(function () {\n\n  \"use strict\";\n\n  const yearElement =\n    document.getElementById(\"copyrightYear\");\n\n  if (yearElement) {\n   "lang=en": "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\ncontent=\"width=device-width, initial-scale=1.0\">\n\n<meta name=\"theme-color\" content=\"#0754a6\">\n\n<meta name=\"description\"\ncontent=\"Global AI Hub Initiative in Goyang Special City, Republic of Korea. An international cooperation initiative connecting artificial intelligence, international organizations, research institutions and communities.\">\n\n<title>Global AI Hub Initiative | Goyang Special City</title>\n\n<link rel=\"canonical\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=en\">\n\n\u003c!-- Multilingual homepage connections -->\n\n<link rel=\"alternate\" hreflang=\"ko\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/\">\n\n<link rel=\"alternate\" hreflang=\"en\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=en\">\n\n<link rel=\"alternate\" hreflang=\"zh\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=zh\">\n\n<link rel=\"alternate\" hreflang=\"ja\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=ja\">\n\n<link rel=\"alternate\" hreflang=\"ru\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=ru\">\n\n<link rel=\"alternate\" hreflang=\"ar\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=ar\">\n\n<link rel=\"alternate\" hreflang=\"es\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=es\">\n\n<link rel=\"alternate\" hreflang=\"fr\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=fr\">\n\n<link rel=\"alternate\" hreflang=\"de\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=de\">\n\n<link rel=\"alternate\" hreflang=\"it\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=it\">\n\n\u003c!-- International default language: English -->\n\n<link rel=\"alternate\" hreflang=\"x-default\"\nhref=\"https://achimjoa.github.io/aihub-goyang.org/index.html?lang=en\">\n\n<style>\n\n/* ==========================================\n   BASIC SETTINGS\n========================================== */\n\n:root {\n  --main-blue: #0754a6;\n  --dark-blue: #10315e;\n  --yellow: #ffe44d;\n  --teal: #008c95;\n}\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  min-width: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.75;\n}\n\na {\n  color: var(--main-blue);\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* ==========================================\n   COMPACT HEADER\n========================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    var(--main-blue),\n    var(--dark-blue)\n  );\n  color: white;\n  padding: 16px 20px;\n  text-align: center;\n}\n\nheader h1 {\n  font-size: clamp(22px, 3vw, 30px);\n  margin: 0 0 4px;\n  line-height: 1.3;\n}\n\nheader h2 {\n  font-size: 15px;\n  font-weight: normal;\n  color: #dcecff;\n  margin: 0;\n  padding: 0;\n  border: none;\n}\n\n/* ==========================================\n   MAIN NAVIGATION\n   LEFT LANGUAGE SELECTOR\n   INDEPENDENT HORIZONTAL SCROLL\n========================================== */\n\n.main-nav {\n  position: relative;\n  z-index: 100;\n  display: flex;\n  flex-wrap: nowrap;\n  align-items: center;\n  justify-content: flex-start;\n  gap: 8px;\n  width: 100%;\n  min-width: 0;\n  max-width: 100%;\n  padding: 10px 12px;\n  background: var(--main-blue);\n  border-top: 3px solid var(--yellow);\n  overflow: visible;\n}\n\n/* ==========================================\n   LANGUAGE SELECTOR\n========================================== */\n\n.language-dropdown {\n  position: relative;\n  display: block;\n  flex: 0 0 auto;\n  margin: 0;\n  padding: 0;\n  z-index: 200;\n}\n\n.language-dropdown > summary {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n
