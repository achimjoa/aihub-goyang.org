===\n   MOBILE\n========================================== */\n\n@media (max-width: 767px) {\n\n  header {\n    padding: 14px 12px;\n  }\n\n  .main-nav {\n    gap: 6px;\n    padding: 8px;\n  }\n\n  .language-dropdown > summary {\n    min-height: 42px;\n    padding: 8px 10px;\n    font-size: 12px;\n  }\n\n  .language-options {\n    width: 170px;\n    max-height: 60vh;\n  }\n\n  .main-nav-links > a {\n    min-height: 42px;\n    padding: 8px 9px;\n    font-size: 12px;\n  }\n\n  main section {\n    padding: 23px;\n  }\n\n  .card {\n    padding: 19px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin: 10px 0;\n  }\n\n}\n\n@media (max-width: 600px) {\n\n  .grid {\n    grid-template-columns: minmax(0, 1fr);\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     CHINESE HEADER\n===================================== -->\n\n<header>\n\n<h1>\n全球人工智能枢纽倡议\n</h1>\n\n<h2>\n韩国京畿道高阳特例市\n</h2>\n\n</header>\n\n\u003c!-- =====================================\n     MAIN NAVIGATION\n===================================== -->\n\n<nav class=\"main-nav\"\n     aria-label=\"主导航菜单\">\n\n  \u003c!-- LANGUAGE SELECTOR: LEFT FIXED -->\n\n  <details class=\"language-dropdown\">\n\n    <summary aria-label=\"选择网站语言\">\n      🌐 语言 ▾\n    </summary>\n\n    <div class=\"language-options\">\n\n      <a href=\"index.html\" lang=\"ko\">\n        한국어\n      </a>\n\n      <a href=\"index.html?lang=en\" lang=\"en\">\n        English\n      </a>\n\n      <a href=\"index.html?lang=zh\"\n         lang=\"zh-CN\"\n         aria-current=\"page\">\n        简体中文 ✓\n      </a>\n\n      <a href=\"index.html?lang=ja\" lang=\"ja\">\n        日本語\n      </a>\n\n      <a href=\"index.html?lang=ru\" lang=\"ru\">\n        Русский\n      </a>\n\n      <a href=\"index.html?lang=ar\" lang=\"ar\" dir=\"rtl\">\n        العربية\n      </a>\n\n      <a href=\"index.html?lang=es\" lang=\"es\">\n        Español\n      </a>\n\n      <a href=\"index.html?lang=fr\" lang=\"fr\">\n        Français\n      </a>\n\n      <a href=\"index.html?lang=de\" lang=\"de\">\n        Deutsch\n      </a>\n\n      <a href=\"index.html?lang=it\" lang=\"it\">\n        Italiano\n      </a>\n\n    </div>\n\n  </details>\n\n  \u003c!-- GENERAL MENU: INDEPENDENT SCROLL -->\n\n  <div class=\"main-nav-links\">\n\n    <a href=\"index.html?lang=zh\">首页</a>\n\n    <a href=\"hub.html?lang=zh\">\n      全球人工智能枢纽\n    </a>\n\n    <a href=\"goyang.html?lang=zh\">\n      为什么选择高阳市？\n    </a>\n\n    <a href=\"agencies.html?lang=zh\">\n      国际组织\n    </a>\n\n    <a href=\"strategy.html?lang=zh\">\n      发展战略\n    </a>\n\n    <a href=\"committee.html?lang=zh\">\n      推进委员会\n    </a>\n\n    <a href=\"history.html?lang=zh\">\n      发展历程\n    </a>\n\n    <a href=\"news.html?lang=zh\">新闻</a>\n\n    <a href=\"press.html?lang=zh\">\n      媒体报道\n    </a>\n\n    <a href=\"participate.html?lang=zh\">\n      市民参与\n    </a>\n\n    <a href=\"guide.html?lang=zh\">\n      网站指南\n    </a>\n<a href=\"gallery.html?lang=zh\">活动相册</a>\n<a href=\"library.html?lang=zh\">数字图书馆</a>\n<a href=\"resources.html?lang=zh\">资料中心</a>\n\n  </div>\n\n</nav>\n\n\u003c!-- =====================================\n     CHINESE MAIN BANNER\n===================================== -->\n\n<div class=\"main-banner\">\n\n  <img\n    src=\"aihub-main-banner-zh.png\"\n    alt=\"韩国高阳特例市全球人工智能枢纽倡议\"\n    loading=\"eager\"\n    fetchpriority=\"high\">\n\n</div>\n\n<main>\n\n\u003c!-- =====================================\n     VISION\n===================================== -->\n\n<section class=\"hero\" id=\"vision\">\n\n<h2>\n人工智能造福人类<br>\n国际合作共创美好未来\n</h2>\n\n<p>\n连接国际组织、各国政府、\n研究机构、大学、企业及市民社会，\n共同应对全球性挑战。\n</p>\n\n<div class=\"highlight\">\n\n<strong>我们的愿景</strong>\n\n<p>\n推动高阳特例市发展成为\n国际合作与人工智能创新的重要平台，\n通过人工智能技术促进可持续发展、\n改善人类福祉，\n并为解决全球性问题作出贡献。\n</p>\n\n</div>\n\n<a href=\"#goyang\" class=\"button\">\n为什么选择高阳市？\n</a>\n\n<a href=\"#partnership\" class=\"button secondary\">\n了解国际合作机会\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     GLOBAL AI HUB\n===================================== -->\n\n<section id=\"hub\">\n\n<h2>\n1. 什么是全球人工智能枢纽？\n</h2>\n\n<p>\n拟议中的全球人工智能枢纽\n旨在建立一个国际合作平台，\n将国际组织的专业知识\n与人工智能技术的发展相结合。\n</p>\n\n<p>\n该倡议希望探索人工智能\n如何帮助应对复杂的全球性挑战，\n包括公共卫生、粮食安全、\n气候变化、环境保护、\n人道主义援助、人口迁移、\n就业、教育以及灾害应对等领域。\n</p>\n\n<p>\n全球人工智能枢纽将促进\n国际组织、各国政府、\n大学、研究机构、企业\n和市民社会之间的交流与合作。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>国际合作</h3>\n\n<p>\n促进不同国家和机构之间的政策对话、\n知识交流与国际合作。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>人工智能研究与创新</h3>\n\n<p>\n探索人工智能在公共利益领域的应用，\n推动跨学科研究与技术创新。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>实际问题解决</h3>\n\n<p>\n探索人工智能试点项目、\n技术评估以及基于科学证据的解决方案。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>能力建设</h3>\n\n<p>\n推动专业培训、国际交流、\n人才培养与知识共享。\n</p>\n\n</div>\n\n</div>\n\n<a href=\"hub.html?lang=zh\" class=\"button\">\n了解全球人工智能枢纽\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     GOYANG\n===================================== -->\n\n<section id=\"goyang\">\n\n<h2>\n2. 为什么选择高阳特例市？\n</h2>\n\n<p>\n高阳特例市位于大韩民国京畿道，\n属于首尔首都圈的重要城市之一。\n</p>\n\n<p>\n高阳市拥有国际会展设施、\n医疗机构、城市基础设施、\n教育文化资源以及丰富的生态环境，\n为探索建设国际合作枢纽\n提供了良好的基础条件。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>首都圈区位优势</h3>\n\n<p>\n高阳市位于首尔首都圈，\n能够连接韩国主要经济、\n科研和公共机构网络。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>KINTEX国际会展基础设施</h3>\n\n<p>\n韩国国际会展中心（KINTEX）\n拥有举办国际展览、\n会议和专业交流活动的设施。\n</p>\n\n<p>\n这些设施可为未来的国际会议、\n论坛和合作活动提供支持。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>医疗与科研潜力</h3>\n\n<p>\n高阳市拥有韩国国立癌症中心\n及其他医疗机构。\n</p>\n\n<p>\n这些资源为公共卫生、\n医学研究以及负责任的\n人工智能应用提供了合作机会。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>生态环境资源</h3>\n\n<p>\n长项湿地及周边生态资源\n为环境教育、生态研究、\n气候变化应对和可持续发展\n提供了潜在合作空间。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>良好的生活环境</h3>\n\n<p>\n高阳市拥有住宅社区、\n医疗服务、教育设施、\n文化资源和城市基础设施。\n</p>\n\n<p>\n国际机构工作人员及其家庭\n所需的具体生活条件，\n仍需通过相关协商进一步评估。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>区域发展机会</h3>\n\n<p>\n国际合作有望为科研创新、\n专业就业、企业发展\n以及相关服务产业创造新的机会。\n</p>\n\n<p>\n实际成果将取决于未来合作项目\n的规模和具体实施方式。\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n国际合作与共同发展的城市\n</strong>\n\n<p>\n高阳特例市现有的城市资源，\n为探索建设兼顾国际合作\n与区域发展的全球人工智能枢纽\n提供了重要基础。\n</p>\n\n</div>\n\n<a href=\"goyang.html?lang=zh\" class=\"button\">\n了解高阳市的竞争优势\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     INTERNATIONAL ORGANIZATIONS\n===================================== -->\n\n<section id=\"organizations\">\n\n<h2>\n3. 国际组织及潜在合作领域\n</h2>\n\n<p>\n全球人工智能枢纽倡议\n关注九个国际组织的专业领域，\n探索人工智能技术\n在相关国际合作中的潜在应用。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>WHO</h3>\n\n<p>\n<strong>世界卫生组织</strong>\n</p>\n\n<p>\n公共卫生、疾病预防、\n卫生系统建设，\n以及人工智能在健康信息分析\n等领域的潜在应用。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>WFP</h3>\n\n<p>\n<strong>世界粮食计划署</strong>\n</p>\n\n<p>\n粮食安全、人道主义援助、\n供应链韧性，\n以及人工智能辅助粮食危机分析。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNEP</h3>\n\n<p>\n<strong>联合国环境规划署</strong>\n</p>\n\n<p>\n气候变化、环境保护、\n生物多样性，\n以及人工智能在环境监测中的应用。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNHCR</h3>\n\n<p>\n<strong>联合国难民事务高级专员公署</strong>\n</p>\n\n<p>\n难民保护、被迫流离失所、\n人道主义援助，\n以及负责任的数据分析。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>IOM</h3>\n\n<p>\n<strong>国际移民组织</strong>\n</p>\n\n<p>\n国际移民、人口流动、\n人道主义支持，\n以及改善移民相关服务的数字工具。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>ILO</h3>\n\n<p>\n<strong>国际劳工组织</strong>\n</p>\n\n<p>\n就业、劳动权利、\n技能发展，\n以及人工智能对未来劳动市场\n影响的研究。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>ITU</h3>\n\n<p>\n<strong>国际电信联盟</strong>\n</p>\n\n<p>\n数字互联互通、\n电信基础设施、\n应急通信和灾害预警技术。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNICEF</h3>\n\n<p>\n<strong>联合国儿童基金会</strong>\n</p>\n\n<p>\n儿童保护、教育、\n数字包容，\n以及保障儿童权利的\n负责任人工智能应用。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNDP</h3>\n\n<p>\n<strong>联合国开发计划署</strong>\n</p>\n\n<p>\n可持续发展、危机应对、\n机构能力建设，\n以及人工智能在发展规划中的应用。\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>重要说明</strong>\n\n<p>\n上述国际组织是根据其各自职责\n及潜在合作领域而列出的\n可能合作对象。\n</p>\n\n<p>\n列出这些组织并不意味着\n任何机构已经同意参与、\n迁入或在拟议中的\n全球人工智能枢纽设立办公室。\n</p>\n\n<p>\n未来任何合作均须经过\n适当的协商、机构决策\n及正式协议程序。\n</p>\n\n</div>\n\n<a href=\"agencies.html?lang=zh\" class=\"button\">\n了解九个国际组织\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     DEVELOPMENT STRATEGY\n===================================== -->\n\n<section id=\"strategy\">\n\n<h2>\n4. 三阶段发展战略\n</h2>\n\n<p>\n全球人工智能枢纽倡议\n提出三个阶段的发展方向，\n以充分考虑国际组织\n及潜在合作伙伴的实际需求。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\n第一阶段 — 初期落地\n</h3>\n\n<p>\n探索为参与机构和合作伙伴\n提供适当的初期落地条件。\n</p>\n\n<p>\n可能涉及办公设施、\n交通、住房、医疗、\n教育及其他必要的生活服务。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n第二阶段 — 运营支持\n</h3>\n\n<p>\n探索政府机构、\n大学、研究机构、\n企业及市民社会之间的合作。\n</p>\n\n<p>\n潜在活动包括联合研究、\n国际会议、人工智能试点项目\n及专业人员交流。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n第三阶段 — 共同可持续发展\n</h3>\n\n<p>\n推动长期国际合作，\n支持参与机构实现其使命，\n同时为高阳特例市创造\n区域创新、就业\n和经济发展的新机会。\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\n初期落地 → 运营支持 → 共同发展\n</strong>\n\n<p>\n具体的机构安排、\n资金支持、设施建设\n及相关措施，\n均须经过有关机构的协商\n和正式批准。\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=zh\" class=\"button\">\n了解发展战略\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     COMMITTEE\n===================================== -->\n\n<section id=\"committee\">\n\n<h2>\n5. 关于市民推进委员会\n</h2>\n\n<p>\n“争取全球人工智能枢纽落户高阳特例市\n市民推进委员会”\n是旨在提高公众认知、\n扩大市民参与\n并推动相关讨论的市民倡议组织。\n</p>\n\n<p>\n委员会希望通过公众宣传、\n政策讨论、市民参与\n和相关交流活动，\n推动国际合作\n与人工智能创新的社会共识。\n</p>\n\n<p>\n委员会的主要活动包括\n公共信息传播、\n市民参与、\n政策讨论及与全球人工智能枢纽\n相关的交流活动。\n</p>\n\n<div class=\"highlight\">\n\n<strong>我们的承诺</strong>\n\n<p>\n以透明、负责任和建设性的方式，\n促进国际合作，\n支持高阳特例市的未来发展。\n</p>\n\n</div>\n\n<a href=\"committee.html?lang=zh\" class=\"button\">\n了解推进委员会\n</a>\n\n<a href=\"participate.html?lang=zh\"\nclass=\"button secondary\">\n市民参与\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     INTERNATIONAL PARTNERSHIP\n===================================== -->\n\n<section id=\"partnership\">\n\n<h2>\n6. 国际合作机会\n</h2>\n\n<p>\n全球人工智能枢纽倡议\n希望与关注负责任人工智能、\n国际合作和可持续发展的\n组织及机构开展交流。\n</p>\n\n<p>\n潜在合作领域包括：\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>政策对话</h3>\n\n<p>\n交流国际合作、\n人工智能治理\n和公共利益创新方面的经验与观点。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>科研合作</h3>\n\n<p>\n探索跨学科研究、\n联合项目和知识交流的机会。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>技术示范</h3>\n\n<p>\n研究负责任的人工智能试点项目\n及相关技术的实际应用。\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>专业交流</h3>\n\n<p>\n探索研讨会、\n培训项目、\n国际论坛和能力建设活动。\n</p>\n\n</div>\n\n</div>\n\n<p class=\"note\">\n除非相关机构正式确认，\n所有潜在合作均属于探索性构想。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     CONTACT\n===================================== -->\n\n<section id=\"contact\">\n\n<h2>\n7. 联系方式与更多信息\n</h2>\n\n<p>\n欢迎国际组织、\n研究机构及其他感兴趣的单位\n进一步了解全球人工智能枢纽倡议\n和市民推进委员会。\n</p>\n\n<p>\n有关详细信息，\n请浏览本网站的中文页面。\n韩国语主页还提供\n相关行政服务及韩语资料。\n</p>\n\n<a href=\"guide.html?lang=zh\" class=\"button\">\n网站使用指南\n</a>\n\n<a href=\"index.html\" class=\"button secondary\">\n韩国语主页\n</a>\n\n<div class=\"highlight\">\n\n<strong>\n全球人工智能枢纽倡议<br>\n大韩民国京畿道高阳特例市\n</strong>\n\n<p>\n争取全球人工智能枢纽\n落户高阳特例市市民推进委员会\n</p>\n\n<p class=\"note\">\n本网站介绍市民倡议及其发展愿景，\n不代表政府已经作出正式选址决定，\n也不代表任何国际组织\n已作出参与承诺。\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     CHINESE WEBSITE DIRECTORY\n===================================== -->\n\n<section id=\"directory\" class=\"page-directory\">\n\n<h2>\n8. 浏览全球人工智能枢纽网站\n</h2>\n\n<p>\n通过以下中文页面，\n了解全球人工智能枢纽倡议、\n高阳特例市、\n国际合作及市民参与的详细信息。\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>全球人工智能枢纽</h3>\n\n<p>\n了解拟议中的国际合作平台\n及其发展愿景。\n</p>\n\n<a href=\"hub.html?lang=zh\" class=\"button\">\n查看详情\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>为什么选择高阳市？</h3>\n\n<p>\n了解高阳市的区位优势、\n基础设施和发展潜力。\n</p>\n\n<a href=\"goyang.html?lang=zh\" class=\"button\">\n查看详情\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>国际组织</h3>\n\n<p>\n了解九个国际组织\n及潜在合作领域。\n</p>\n\n<a href=\"agencies.html?lang=zh\" class=\"button\">\n查看详情\n</a>\n\n</div>\n\n<div class=\"   "view=grade1-apply": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>1급회원 승급 신청</title>\n\n<style>\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", Arial, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n}\n\nheader {\n  background: #0754a6;\n  color: white;\n  padding: 28px 15px;\n  text-align: center;\n}\n\nmain {\n  max-width: 720px;\n  margin: 35px auto;\n  padding: 28px;\n  background: white;\n  border-radius: 12px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.08);\n}\n\nh2 { color: #0754a6; }\n\n.notice {\n  padding: 15px;\n  background: #edf5ff;\n  border-radius: 8px;\n  line-height: 1.8;\n}\n\nlabel {\n  display: block;\n  margin-top: 18px;\n  font-weight: bold;\n}\n\ninput, textarea {\n  width: 100%;\n  padding: 12px;\n  margin-top: 7px;\n  border: 1px solid #ccd7e5;\n  border-radius: 6px;\n  font: inherit;\n}\n\ninput[type=\"checkbox\"] {\n  width: auto;\n}\n\nbutton {\n  background: #0754a6;\n  color: white;\n  border: 0;\n  border-radius: 7px;\n  padding: 13px 20px;\n  margin-top: 20px;\n  cursor: pointer;\n  font-weight: bold;\n}\n\nbutton:disabled {\n  opacity: .5;\n  cursor: not-allowed;\n}\n\n#message {\n  white-space: pre-line;\n  margin-top: 20px;\n  line-height: 1.7;\n}\n\n.status {\n  margin-top: 18px;\n  padding: 15px;\n  background: #f1f6fd;\n  border-radius: 8px;\n  line-height: 1.8;\n}\n\n[hidden] {\n  display: none !important;\n}\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"index.html\"><span aria-hidden=\"true\">←</span>홈페이지로</a></div>\n\n\n<header>\n  <h1>1급회원 승급 신청</h1>\n  <p>경기도 글로벌 AI 허브 유치 범시민추진위원회</p>\n</header>\n\n<main>\n\n<div class=\"notice\">\n  회원가입 승인이 완료된 일반회원이 신청할 수 있습니다.\n  <br>\n  전화번호를 입력해 주세요. 명함 또는 이에 상응하는 신분 확인 자료는 선택사항입니다.\n  <br>\n  최고관리자가 확인한 후 승급 여부를 결정합니다.\n</div>\n\n<section id=\"statusSection\" hidden>\n  <h2>나의 승급 신청 현황</h2>\n  <div id=\"statusContent\" class=\"status\"></div>\n</section>\n\n<section id=\"applySection\" hidden>\n\n  <h2>1급회원 승급 신청서</h2>\n\n  <form id=\"applyForm\">\n\n    <label for=\"phone\">전화번호 *</label>\n    <input id=\"phone\" type=\"tel\" required maxlength=\"30\">\n\n    <label for=\"organization\">소속 기관·단체</label>\n    <input id=\"organization\" maxlength=\"150\">\n\n    <label for=\"position\">직책</label>\n    <input id=\"position\" maxlength=\"100\">\n\n    <label for=\"evidence\">명함 또는 신분 확인 자료 (선택)</label>\n    <input\n      id=\"evidence\"\n      type=\"file\"\n      accept=\".jpg,.jpeg,.png,.pdf\"\n    >\n\n    <p>JPG, PNG, PDF / 최대 5MB</p>\n\n    <label for=\"reason\">승급 신청 사유</label>\n    <textarea id=\"reason\" rows=\"4\" maxlength=\"2000\"></textarea>\n\n    <label>\n      <input id=\"consent\" type=\"checkbox\" required>\n      승급 심사를 위한 개인정보 수집·이용에 동의합니다.\n    </label>\n\n    <button type=\"submit\" id=\"applyButton\">\n      1급회원 승급 신청\n    </button>\n\n  </form>\n\n</section>\n\n<section id=\"revisionSection\" hidden>\n\n  <h2>보완자료 제출</h2>\n\n  <p id=\"revisionNote\"></p>\n\n  <form id=\"revisionForm\">\n\n    <label for=\"revisionFile\">새 증빙자료 (선택)</label>\n\n    <input\n      id=\"revisionFile\"\n      type=\"file\"\n      accept=\".jpg,.jpeg,.png,.pdf\"\n      aria-describedby=\"revisionHelp\"\n    >\n\n    <label for=\"revisionExplanation\">보완 설명 (선택)</label>\n    <textarea id=\"revisionExplanation\" rows=\"4\" aria-describedby=\"revisionHelp\"></textarea>\n\n    <p id=\"revisionHelp\">증빙자료를 첨부하거나 보완 설명을 입력해 주세요.</p>\n\n    <button type=\"submit\" id=\"revisionButton\">\n      보완자료 제출\n    </button>\n\n  </form>\n\n</section>\n\n<p id=\"message\" role=\"status\" aria-live=\"polite\">\n  회원정보를 확인하고 있습니다.\n</p>\n\n<p></p>\n\n</main>\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\nconst supabase = createClient(\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\",\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\"\n);\n\nconst $ = id => document.getElementById(id);\n\nconst MAX_SIZE = 5 * 1024 * 1024;\n\nconst TYPES = {\n  \"image/jpeg\": \"jpg\",\n  \"image/png\": \"png\",\n  \"application/pdf\": \"pdf\"\n};\n\nlet currentUser = null;\nlet currentRequest = null;\nlet busy = false;\n\nfunction showMessage(text, error = false) {\n  $(\"message\").textContent = text;\n  $(\"message\").style.color =\n    error ? \"#b91c1c\" : \"#0754a6\";\n}\n\nfunction hideSections() {\n  $(\"applySection\").hidden = true;\n  $(\"revisionSection\").hidden = true;\n  $(\"statusSection\").hidden = true;\n}\n\nfunction statusLabel(status) {\n  return {\n    pending: \"심사 대기\",\n    approved: \"승급 승인\",\n    rejected: \"승급 거절\",\n    revision_requested: \"자료 보완 요청\"\n  }[status] || status;\n}\n\nfunction formatDate(value) {\n  return value\n    ? new Date(value).toLocaleString(\"ko-KR\")\n    : \"-\";\n}\n\n/* 파일 검증 */\n\nfunction validateFile(file) {\n\n  if (!file) {\n    throw new Error(\"증빙자료를 첨부해 주세요.\");\n  }\n\n  if (!TYPES[file.type]) {\n    throw new Error(\"JPG, PNG, PDF만 가능합니다.\");\n  }\n\n  if (file.size < 1 || file.size > MAX_SIZE) {\n    throw new Error(\"파일은 5MB 이하여야 합니다.\");\n  }\n\n  return TYPES[file.type];\n}\n\n/* 증빙자료 업로드 */\n\nasync function uploadEvidence(file) {\n\n  const extension = validateFile(file);\n\n  const path =\n    `${currentUser.id}/${crypto.randomUUID()}.${extension}`;\n\n  const { error } = await supabase.storage\n    .from(\"member-verification\")\n    .upload(path, file, {\n      contentType: file.type,\n      upsert: false\n    });\n\n  if (error) throw error;\n\n  return path;\n}\n\n/* 신청 상태 조회 */\n\nasync function loadRequests() {\n\n  const { data, error } = await supabase.rpc(\n    \"get_my_grade1_requests\"\n  );\n\n  if (error) throw error;\n\n  return data || [];\n}\n\n/* 화면 갱신 */\n\nasync function refreshScreen() {\n\n  hideSections();\n\n  const { data: profile, error: profileError } =\n    await supabase\n      .from(\"profiles\")\n      .select(\n        \"member_role, member_grade, approval_status\"\n      )\n      .eq(\"id\", currentUser.id)\n      .single();\n\n  if (profileError) throw profileError;\n\n  if (profile.approval_status !== \"approved\") {\n    showMessage(\"회원가입 승인 후 이용할 수 있습니다.\");\n    return;\n  }\n\n  const requests = await loadRequests();\n\n  const latest = requests[0] || null;\n\n  currentRequest = latest;\n\n  if (latest) {\n\n    $(\"statusSection\").hidden = false;\n\n    const content = $(\"statusContent\");\n\n    content.replaceChildren();\n\n    const lines = [\n      `신청번호: ${latest.request_id}`,\n      `처리 상태: ${statusLabel(latest.request_status)}`,\n      `신청일: ${formatDate(latest.requested_at)}`,\n      `심사일: ${formatDate(latest.reviewed_at)}`\n    ];\n\n    if (latest.review_note) {\n      lines.push(`심사 의견: ${latest.review_note}`);\n    }\n\n    for (const line of lines) {\n      const p = document.createElement(\"p\");\n      p.textContent = line;\n      content.appendChild(p);\n    }\n  }\n\n  if (profile.member_grade === \"grade1\") {\n    showMessage(\"이미 1급회원으로 승급되었습니다.\");\n    return;\n  }\n\n  if (profile.member_role !== \"member\") {\n    showMessage(\"일반회원만 승급 신청할 수 있습니다.\");\n    return;\n  }\n\n  const activeRequest = requests.find(\n    r => [\"pending\", \"revision_requested\"]\n      .includes(r.request_status)\n  );\n\n  if (activeRequest) {\n\n    currentRequest = activeRequest;\n\n    if (activeRequest.request_status === \"pending\") {\n      showMessage(\"현재 최고관리자의 심사를 기다리고 있습니다.\");\n      return;\n    }\n\n    $(\"revisionSection\").hidden = false;\n\n    $(\"revisionNote\").textContent =\n      activeRequest.review_note ||\n      \"증빙자료를 보완하여 다시 제출해 주세요.\";\n\n    showMessage(\"증빙자료를 첨부하거나 보완 설명을 입력해 제출할 수 있습니다.\");\n    return;\n  }\n\n  $(\"applySection\").hidden = false;\n\n  showMessage(\"승급 신청서를 작성해 주세요.\");\n}\n\n/* 최초 신청 */\n\n$(\"applyForm\").addEventListener(\"submit\", async event => {\n\n  event.preventDefault();\n\n  if (busy || !currentUser) return;\n\n  busy = true;\n  $(\"applyButton\").disabled = true;\n\n  try {\n\n    const file = $(\"evidence\").files[0];\n\n    let path = null;\n    if (file) {\n      showMessage(\"증빙자료 업로드 중...\");\n      path = await uploadEvidence(file);\n    }\n\n    showMessage(\"승급 신청 접수 중...\");\n\n    const { error } = await supabase.rpc(\n      \"request_grade1_upgrade\",\n      {\n        p_phone: $(\"phone\").value.trim(),\n        p_organization: $(\"organization\").value.trim(),\n        p_position_title: $(\"position\").value.trim(),\n        p_evidence_path: path,\n        p_reason: $(\"reason\").value.trim()\n      }\n    );\n\n    if (error) throw error;\n\n    $(\"applyForm\").reset();\n\n    await refreshScreen();\n\n    showMessage(\"승급 신청이 정상 접수되었습니다.\");\n\n  } catch (error) {\n\n    showMessage(\n      \"신청 실패: \" + error.message,\n      true\n    );\n\n  } finally {\n\n    busy = false;\n    $(\"applyButton\").disabled = false;\n  }\n});\n\n/* 보완자료 재제출 */\n\n$(\"revisionForm\").addEventListener(\"submit\", async event => {\n\n  event.preventDefault();\n\n  if (busy || !currentRequest) return;\n\n  const requestId = currentRequest.request_id;\n  const file = $(\"revisionFile\").files[0];\n  const revisionNote = $(\"revisionExplanation\").value.trim();\n\n  if (!file && !revisionNote) {\n    showMessage(\"증빙자료를 첨부하거나 보완 설명을 입력해 주세요.\", true);\n    $(\"revisionExplanation\").focus();\n    return;\n  }\n\n  busy = true;\n  $(\"revisionButton\").disabled = true;\n\n  try {\n\n    let uploadedPath = null;\n    if (file) {\n      showMessage(\"보완자료 업로드 중...\");\n      uploadedPath = await uploadEvidence(file);\n    }\n\n    showMessage(\"보완 신청 접수 중...\");\n\n    const { error } = await supabase.rpc(\n      \"resubmit_grade1_evidence\",\n      {\n        p_request_id: requestId,\n        p_evidence_path: uploadedPath || null,\n        p_revision_note: revisionNote || null\n      }\n    );\n\n    if (error) throw error;\n\n    $(\"revisionForm\").reset();\n\n    await refreshScreen();\n\n    showMessage(\n      \"보완자료가 접수되었습니다. 재심사를 기다려 주세요.\"\n    );\n\n  } catch (error) {\n\n    showMessage(\n      \"보완자료 제출 실패: \" + error.message,\n      true\n    );\n\n  } finally {\n\n    busy = false;\n    $(\"revisionButton\").disabled = false;\n  }\n});\n\n/* 초기화 */\n\nasync function initialize() {\n\n  try {\n\n    const { data, error } =\n      await supabase.auth.getUser();\n\n    if (error) throw error;\n\n    if (!data.user) {\n      showMessage(\"로그인 후 이용해 주세요.\", true);\n      return;\n    }\n\n    currentUser = data.user;\n\n    await refreshScreen();\n\n  } catch (error) {\n\n    showMessage(\n      \"화면 초기화 오류: \" + error.message,\n      true\n    );\n  }\n}\n\ninitialize();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "view=login": "<!DOCTYPE html>\n<html lang=\"ko\">\n\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\n      content=\"width=device-width, initial-scale=1.0\">\n\n<title>로그인 | 글로벌 AI 허브 고양특례시</title>\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: \"Malgun Gothic\", Arial, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.7;\n}\n\nheader {\n  background: #0754a6;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nheader h1 {\n  margin: 0;\n  font-size: 30px;\n}\n\nheader p {\n  margin: 12px 0;\n}\n\n.home-return {\n  margin-top: 25px;\n}\n\n.home-return a {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  border: 2px solid white;\n  border-radius: 8px;\n  padding: 12px 28px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.home-return a:hover {\n  background: #ffe44d;\n  border-color: #ffe44d;\n}\n\nmain {\n  max-width: 520px;\n  margin: 45px auto;\n  padding: 0 15px;\n}\n\n.login-box {\n  background: white;\n  padding: 35px;\n  border-radius: 12px;\n  box-shadow: 0 3px 15px rgba(0,0,0,0.1);\n}\n\n.login-box h2 {\n  text-align: center;\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.form-group {\n  margin-bottom: 20px;\n}\n\nlabel {\n  display: block;\n  font-weight: bold;\n  margin-bottom: 7px;\n}\n\ninput {\n  width: 100%;\n  padding: 13px;\n  border: 1px solid #cbd5e1;\n  border-radius: 7px;\n  font-size: 16px;\n}\n\nbutton {\n  width: 100%;\n  padding: 15px;\n  border: none;\n  border-radius: 8px;\n  background: #0754a6;\n  color: white;\n  font-size: 17px;\n  font-weight: bold;\n  cursor: pointer;\n}\n\nbutton:hover {\n  background: #10315e;\n}\n\nbutton:disabled {\n  opacity: 0.6;\n  cursor: not-allowed;\n}\n\n#message {\n  margin-top: 20px;\n  text-align: center;\n  font-weight: bold;\n  white-space: pre-line;\n}\n\n.signup-link {\n  text-align: center;\n  margin-top: 25px;\n}\n\n.signup-link a {\n  color: #0754a6;\n  font-weight: bold;\n}\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 25px 15px;\n  margin-top: 50px;\n}\n\n@media (max-width: 600px) {\n  .login-box {\n    padding: 23px;\n  }\n\n  header h1 {\n    font-size: 25px;\n  }\n}\n</style>\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"index.html\"><span aria-hidden=\"true\">←</span>홈페이지로</a></div>\n\n\n<header>\n  <h1>회원 로그인</h1>\n\n  <p>\n    경기도 글로벌 AI 허브 유치<br>\n    고양특례시 범시민추진위원회\n  </p>\n\n  <div class=\"home-return\">\n    \n  </div>\n</header>\n\n<main>\n<section class=\"login-box\">\n\n<h2>로그인</h2>\n\n<p>\n  회원가입 시 등록한 이메일과 비밀번호를\n  입력해 주세요.\n</p>\n\n<form id=\"loginForm\">\n\n  <div class=\"form-group\">\n    <label for=\"email\">이메일</label>\n    <input\n      type=\"email\"\n      id=\"email\"\n      autocomplete=\"email\"\n      required>\n  </div>\n\n  <div class=\"form-group\">\n    <label for=\"password\">비밀번호</label>\n    <input\n      type=\"password\"\n      id=\"password\"\n      autocomplete=\"current-password\"\n      required>\n  </div>\n\n  <button type=\"submit\" id=\"loginButton\">\n    로그인\n  </button>\n\n</form>\n\n<p id=\"message\" role=\"status\" aria-live=\"polite\"></p>\n\n<div class=\"signup-link\">\n  아직 회원이 아니신가요?<br>\n  <a href=\"index.html?view=signup\">회원가입</a>\n</div>\n\n</section>\n</main>\n\n<footer>\n  경기도 글로벌 AI 허브 유치<br>\n  고양특례시 범시민추진위원회\n</footer>\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* Supabase 연결 정보 */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\nconst form = document.getElementById(\"loginForm\");\nconst message = document.getElementById(\"message\");\nconst loginButton = document.getElementById(\"loginButton\");\n\nform.addEventListener(\"submit\", async (event) => {\n\n  event.preventDefault();\n\n  const email =\n    document.getElementById(\"email\").value.trim();\n\n  const password =\n    document.getElementById(\"password\").value;\n\n  loginButton.disabled = true;\n  message.style.color = \"#17315b\";\n  message.textContent = \"로그인 확인 중입니다.\";\n\n  try {\n\n    const { data, error } =\n      await supabase.auth.signInWithPassword({\n        email,\n        password\n      });\n\n    if (error) {\n      throw error;\n    }\n\n    const user = data.user;\n\n    if (!user) {\n      throw new Error(\"회원정보를 확인할 수 없습니다.\");\n    }\n\n    /* 회원 승인 상태 조회 */\n\n    const { data: profile, error: profileError } =\n      await supabase\n        .from(\"profiles\")\n        .select(\"approval_status, member_role\")\n        .eq(\"id\", user.id)\n        .single();\n\n    if (profileError || !profile) {\n      message.style.color = \"#b91c1c\";\n      message.textContent =\n        \"로그인은 성공했지만 회원정보를 확인할 수 없습니다.\\n\" +\n        \"관리자에게 문의해 주세요.\";\n      return;\n    }\n\n    if (profile.approval_status === \"pending\") {\n\n      message.style.color = \"#0754a6\";\n      message.textContent =\n        \"이메일 로그인이 완료되었습니다.\\n\" +\n        \"현재 관리자 승인 대기 중입니다.\";\n\n      return;\n    }\n\n    if (profile.approval_status === \"rejected\") {\n\n      message.style.color = \"#b91c1c\";\n      message.textContent =\n        \"회원가입 승인 상태를 확인해 주세요.\\n\" +\n        \"관리자에게 문의해 주세요.\";\n\n      return;\n    }\n\n    if (profile.approval_status === \"approved\") {\n\n      message.style.color = \"#0754a6\";\n\n      message.textContent =\n        \"로그인에 성공했습니다.\\n\" +\n        \"이전 페이지로 이동합니다.\";\n\n      /* =====================================\n         로그인 완료 후 이전 페이지 복귀\n      ===================================== */\n\n      const params =\n        new URLSearchParams(window.location.search);\n\n      const returnUrl = params.get(\"return\");\n\n      let destination = \"index.html\";\n\n      if (returnUrl) {\n\n        try {\n\n          const target = new URL(\n            returnUrl,\n            window.location.href\n          );\n\n          /* 동일한 홈페이지 내부 이동만 허용 */\n\n          if (\n            target.origin === window.location.origin &&\n            target.pathname.endsWith(\".html\") &&\n            !target.pathname.endsWith(\"/login.html\") &&\n            !(target.pathname.endsWith(\"/index.html\") &&\n              target.searchParams.get(\"view\") === \"login\")\n          ) {\n\n            destination = target.href;\n\n          }\n\n        } catch (error) {\n\n          console.warn(\n            \"복귀 주소 확인 실패:\",\n            error\n          );\n\n        }\n\n      } else {\n\n        /* 복귀 주소가 없으면 이전 페이지 확인 */\n\n        try {\n\n          if (document.referrer) {\n\n            const previousPage =\n              new URL(document.referrer);\n\n            if (\n              previousPage.origin === window.location.origin &&\n              previousPage.pathname.endsWith(\".html\") &&\n              !previousPage.pathname.endsWith(\"/login.html\") &&\n            !(previousPage.pathname.endsWith(\"/index.html\") &&\n              previousPage.searchParams.get(\"view\") === \"login\")\n            ) {\n\n              destination = previousPage.href;\n\n            }\n\n          }\n\n        } catch (error) {\n\n          console.warn(\n            \"이전 페이지 확인 실패:\",\n            error\n          );\n\n        }\n\n      }\n\n      /* 로그인 성공 메시지 표시 후 이동 */\n\n      window.setTimeout(() => {\n\n        window.location.replace(destination);\n\n      }, 700);\n\n    }\n        \n  } catch (error) {\n\n    message.style.color = \"#b91c1c\";\n\n    console.error(\"로그인 오류:\", error);\n\n    message.textContent =\n      \"로그인 오류가 발생했습니다.\\n\" +\n      (error.message || \"알 수 없는 오류\");\n\n}\n          \n        finally {\n\n    loginButton.disabled = false;\n\n  }\n\n});\n\n\u003c/script>\n\n</body>\n</html>\n",

ding: 30px 15px;\n  margin-top: 45px;\n}\n\n/* 모바일 */\n\n@media (max-width: 600px) {\n\n  header h1 {\n    font-size: 25px;\n  }\n\n  .policy-box {\n    padding: 23px;\n  }\n\n  h2 {\n    font-size: 20px;\n  }\n\n  th, td {\n    padding: 9px;\n    font-size: 14px;\n  }\n\n}\n\n</style>\n\n\n<style id=\"site-return-style\">\nbody > .site-return {\n  display: flex; justify-content: flex-start; align-items: center;\n  box-sizing: border-box; inline-size: 100%; max-inline-size: 76rem;\n  padding: 12px clamp(12px, 3vw, 24px); margin-inline: auto;\n}\nbody > .site-return > a {\n  display: inline-flex; align-items: center; gap: .45em; min-height: 44px;\n  box-sizing: border-box; padding: 8px 16px; margin: 0;\n  border: 1px solid #173653; border-radius: 8px;\n  background: #173653; color: #fff;\n  font: 600 15px/1.4 system-ui, sans-serif; text-decoration: none;\n}\nbody > .site-return > a:hover { background: #244b71; color: #fff; }\nbody > .site-return > a:focus-visible { outline: 3px solid #1f6eac; outline-offset: 3px; }\n</style>\n</head>\n\n<body>\n<div class=\"site-return\"><a href=\"index.html\"><span aria-hidden=\"true\">←</span>홈페이지로</a></div>\n\n\n<header>\n\n<h1>개인정보 처리방침</h1>\n\n<p>\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n</p>\n\n<div class=\"home-return\">\n\n\n\n</div>\n\n</header>\n\n<main>\n\n<article class=\"policy-box\">\n\n<h2>개인정보 처리방침 안내</h2>\n\n<p>\n경기도 글로벌 AI 허브 유치\n고양특례시 범시민추진위원회\n(이하 \"위원회\")는\n개인정보 보호법 등 관계 법령을 준수하며,\n홈페이지 이용자와 시민참여 신청자의\n개인정보를 보호하기 위해 노력합니다.\n</p>\n\n<div class=\"notice\">\n\n<strong>개인정보 보호 기본 원칙</strong>\n\n<p>\n위원회는 홈페이지 운영과\n글로벌 AI 허브 유치 활동에 필요한\n범위에서 개인정보를 수집·이용하며,\n수집 목적 외의 용도로\n개인정보를 이용하지 않습니다.\n</p>\n\n</div>\n\n\u003c!-- 제1조 -->\n\n<h2>제1조 개인정보 처리 목적</h2>\n\n<p>\n위원회는 다음 목적을 위해\n개인정보를 처리합니다.\n</p>\n\n<ul>\n\n<li>홈페이지 회원가입 및 본인 식별</li>\n<li>회원 로그인 및 계정 관리</li>\n<li>회원 승인 및 권한 관리</li>\n<li>회원 게시판 운영</li>\n<li>회원 전용 자료실 운영</li>\n<li>제한자료 열람 권한 확인</li>\n\n<li>\n글로벌 AI 허브 고양특례시 유치\n동의 온라인 서명 접수\n</li>\n\n<li>\n홍보현수막 게시 신청 접수 및 관리\n</li>\n\n<li>\n후원회원 가입 및 참여회비 관련 업무\n</li>\n\n<li>\n차량 홍보 스티커 신청 및 배부\n</li>\n\n<li>\n범시민추진위원 등록 및 활동 관리\n</li>\n\n<li>\n시민참여 신청 관련 안내 및 연락\n</li>\n\n<li>서비스 운영 및 보안 관리</li>\n\n</ul>\n\n\u003c!-- 제2조 -->\n\n<h2>제2조 개인정보 수집 항목</h2>\n\n<h3>① 홈페이지 회원정보</h3>\n\n<div class=\"table-wrap\">\n\n<table>\n\n<tr>\n<th>회원 구분</th>\n<th>수집 항목</th>\n</tr>\n\n<tr>\n<td>일반회원</td>\n<td>\n이름, 이메일,\n인증 및 계정 관리 정보\n</td>\n</tr>\n\n<tr>\n<td>실명인증 회원</td>\n<td>\n일반회원 정보 및\n본인확인에 필요한 추가 정보\n(실제 인증 방식에 따라 별도 안내)\n</td>\n</tr>\n\n<tr>\n<td>제한자료 이용회원</td>\n<td>\n회원 식별정보,\n열람 자료명,\n열람 일시,\n열람 결과\n</td>\n</tr>\n\n</table>\n\n</div>\n\n<p>\n비밀번호는 인증 시스템을 통해 관리하며,\n위원회는 평문 비밀번호를\n별도로 저장하지 않습니다.\n</p>\n\n<p>\n서비스 이용 과정에서\n보안 및 접속 관련 정보가\n처리될 수 있습니다.\n구체적인 항목은 실제 운영 환경에 따라\n확인하여 안내합니다.\n</p>\n\n<h3>② 시민참여 신청정보</h3>\n\n<p>\n위원회는 Google Forms를 통해\n다음과 같은 시민참여 신청을 접수합니다.\n</p>\n\n<div class=\"table-wrap\">\n\n<table>\n\n<tr>\n<th>신청 유형</th>\n<th>수집 항목</th>\n</tr>\n\n<tr>\n<td>\n글로벌 AI 허브 유치 동의 온라인 서명\n</td>\n<td>\n성명, 주소(행정동 명칭만), 전화번호\n</td>\n</tr>\n\n<tr>\n<td>\n홍보현수막 게시 신청\n</td>\n<td>\n성명, 전화번호, 게시 장소\n</td>\n</tr>\n\n<tr>\n<td>\n후원회원 가입\n</td>\n<td>\n성명, 전화번호\n</td>\n</tr>\n\n<tr>\n<td>\n차량 홍보 스티커 신청\n</td>\n<td>\n성명, 전화번호,\n행정동 명칭, 신청 수량\n</td>\n</tr>\n\n<tr>\n<td>\n범시민추진위원 등록\n</td>\n<td>\n성명, 전화번호,\n행정동 명칭, 소속 단체\n</td>\n</tr>\n\n</table>\n\n</div>\n\n<p>\n위 수집 항목은 위원회가 확인한\n각 신청서의 입력 항목을 기준으로 작성되었습니다.\n</p>\n\n<p>\nGoogle Forms의 이메일 자동 수집 등\n추가 수집 설정이 있는 경우\n실제 수집 항목에 맞게\n본 방침을 보완합니다.\n</p>\n\n\u003c!-- 제3조 -->\n\n<h2>제3조 개인정보 처리 및 보유 기간</h2>\n\n<h3>① 홈페이지 회원정보</h3>\n\n<p>\n위원회는 개인정보 수집 목적에 필요한\n기간 동안 개인정보를 보유합니다.\n</p>\n\n<ul>\n\n<li>\n회원정보:\n회원 탈퇴 시 삭제를 원칙으로 하되,\n법령에 따른 보존 의무가 있는 경우\n해당 기간 보관\n</li>\n\n<li>\n제한자료 열람 기록:\n각 열람일로부터 1년간 보관하며,\n보유기간이 만료되면 지체 없이 파기합니다.\n다만, 관계 법령에 따라 별도로\n보존해야 하는 경우에는\n해당 법령에서 정한 기간 동안 보관합니다.\n</li>\n\n<li>\n관계 법령에 따라 보존이 필요한 정보:\n해당 법령에서 정한 기간 동안 보관\n</li>\n\n</ul>\n\n\n\n<h3>② 시민참여 신청정보</h3>\n\n<p>\n위원회는 다음 시민참여 신청 과정에서\n수집한 개인정보를\n글로벌 AI 허브 유치 활동 종료 시까지\n보유·이용합니다.\n</p>\n\n<ul>\n\n<li>글로벌 AI 허브 유치 동의 온라인 서명</li>\n<li>홍보현수막 게시 신청</li>\n<li>후원회원 가입</li>\n<li>차량 홍보 스티커 신청</li>\n<li>범시민추진위원 등록</li>\n\n</ul>\n\n<p>\n유치 활동 종료 후에는\n해당 개인정보를 지체 없이 파기합니다.\n</p>\n\n<p>\n다만, 개인정보 처리 목적이 조기에\n달성되거나 개인정보가 더 이상\n필요하지 않게 된 경우에는\n관계 법령에 따라 처리합니다.\n</p>\n\n<p>\n참여회비 및 현수막 게시비용 관련\n회계자료 등 관계 법령에 따라\n보존해야 하는 정보는\n해당 법령에서 정한 기간 동안\n별도로 보관합니다.\n</p>\n\n\u003c!-- 제4조 -->\n\n<h2>제4조 개인정보 제3자 제공</h2>\n\n<p>\n위원회는 정보주체의 동의 또는\n법률상 근거가 있는 경우를 제외하고\n개인정보를 제3자에게 제공하지 않습니다.\n</p>\n\n<p>\n향후 유치 서명자료 등을\n외부 기관에 제공하는 경우에는\n제공 목적, 제공받는 기관,\n제공 항목 및 보유기간 등을 확인하고\n관계 법령에 따른 절차를 이행합니다.\n</p>\n\n\u003c!-- 제5조 -->\n\n<h2>제5조 개인정보 처리위탁 및 국외 이전</h2>\n\n<p>\n위원회는 홈페이지 운영과\n시민참여 신청 접수를 위하여\n다음 외부 서비스를 이용하고 있습니다.\n</p>\n\n<div class=\"table-wrap\">\n\n<table>\n\n<tr>\n<th>서비스</th>\n<th>이용 목적</th>\n</tr>\n\n<tr>\n<td>Supabase</td>\n<td>\n홈페이지 회원 인증,\n회원정보 관리,\n게시판 및 자료실 운영,\n관리자 기능\n</td>\n</tr>\n\n<tr>\n<td>Google Forms</td>\n<td>\n온라인 서명,\n후원회원 가입,\n홍보현수막 게시 신청,\n차량 홍보 스티커 신청,\n범시민추진위원 등록\n</td>\n</tr>\n\n</table>\n\n</div>\n\n<p>\n각 서비스의 개인정보 처리위탁 관계,\n수탁자의 법적 명칭,\n처리 업무,\n개인정보 처리 장소,\n국외 이전 여부 및 관련 사항은\n실제 서비스 계약과 운영 설정을\n확인하여 본 방침에 반영합니다.\n</p>\n\n<p>\n개인정보 처리위탁 또는 국외 이전이\n발생하는 경우에는 관계 법령에 따른\n고지 및 보호조치를 이행합니다.\n</p>\n\n\u003c!-- 제6조 -->\n\n<h2>제6조 개인정보의 파기</h2>\n\n<p>\n개인정보 보유기간이 종료되거나\n처리 목적이 달성되어\n개인정보가 불필요하게 된 경우,\n관계 법령에 따라 안전하게 파기합니다.\n</p>\n\n<p>\n전자적 파일은 복구하기 어려운 방법으로\n삭제하며, 다른 법령에 따라\n보관해야 하는 정보는 분리하여 관리합니다.\n</p>\n\n<p>\nGoogle Forms 응답자료와\n별도로 내려받아 보관한 자료에도\n동일한 파기 기준을 적용합니다.\n</p>\n\n\u003c!-- 제7조 -->\n\n<h2>제7조 정보주체의 권리</h2>\n\n<p>\n이용자는 관계 법령에 따라\n자신의 개인정보에 대해\n다음 권리를 행사할 수 있습니다.\n</p>\n\n<ul>\n\n<li>개인정보 열람 요구</li>\n<li>개인정보 정정 요구</li>\n<li>개인정보 삭제 요구</li>\n<li>개인정보 처리정지 요구</li>\n<li>회원 탈퇴 요청</li>\n\n</ul>\n\n<p>\n개인정보 관련 권리 행사와\n문의는 다음 이메일로 접수할 수 있습니다.\n</p>\n\n<p>\n\n<strong>개인정보 보호 문의:</strong><br>\n\n<a href=\"mailto:blue.stone.hong@gmail.com\">\nblue.stone.hong@gmail.com\n</a>\n\n</p>\n\n<p>\n위원회는 접수된 요청을\n관계 법령에 따라 확인하고 처리합니다.\n</p>\n\n\u003c!-- 제8조 -->\n\n<h2>제8조 개인정보 안전성 확보 조치</h2>\n\n<p>\n위원회는 개인정보 보호를 위해\n다음과 같은 기술적·관리적 조치를\n적용하도록 하겠습니다.\n</p>\n\n<ul>\n\n<li>회원 인증 및 접근 권한 관리</li>\n<li>데이터베이스 접근 제한</li>\n<li>관리자 권한 분리</li>\n<li>개인정보 접근 기록 관리</li>\n<li>HTTPS 기반 통신</li>\n<li>필요한 범위의 개인정보 최소 수집</li>\n<li>구글폼 응답자료 접근 권한 관리</li>\n\n</ul>\n\n\u003c!-- 제9조 -->\n\n<h2>제9조 제한자료 열람 관리</h2>\n\n<p>\n일부 e북, 정책자료 및\n내부 연구자료는\n실명인증 회원에게만\n열람 권한을 부여할 수 있습니다.\n</p>\n\n<p>\n제한자료 열람 시\n회원 식별정보, 자료명,\n열람 일시 및 열람 결과를\n기록할 수 있습니다.\n</p>\n\n<p>\n열람 기록은 정해진 목적과\n권한 범위 내에서만 이용하며,\n보유기간 종료 후 삭제합니다.\n</p>\n\n\u003c!-- 제10조 -->\n\n<h2>제10조 개인정보 보호책임자</h2>\n\n<p>\n위원회는 개인정보 보호와\n정보주체의 권리 보장을 위하여\n다음과 같이 개인정보 보호책임자를\n지정합니다.\n</p>\n\n<p>\n\n<strong>개인정보처리자:</strong><br>\n\n경기도 글로벌 AI 허브 유치\n고양특례시 범시민추진위원회\n\n</p>\n\n<p>\n\n<strong>개인정보 보호책임자:</strong><br>\n\n홍영표 위원장\n\n</p>\n\n<p>\n\n<strong>개인정보 보호 문의 이메일:</strong><br>\n\n<a href=\"mailto:blue.stone.hong@gmail.com\">\nblue.stone.hong@gmail.com\n</a>\n\n</p>\n\n\u003c!-- 제11조 -->\n\n<h2>제11조 개인정보 처리방침 변경</h2>\n\n<p>\n본 개인정보 처리방침은\n관계 법령 및 서비스 운영 내용의\n변경에 따라 개정될 수 있습니다.\n</p>\n\n<p>\n변경 사항은 홈페이지를 통해\n안내합니다.\n</p>\n\n<p>\n\n<strong>시행일:</strong>\n2026년 11월 12일\n\n</p>\n\n</article>\n\n</main>\n\n<footer>\n\n경기도 글로벌 AI 허브 유치<br>\n고양특례시 범시민추진위원회\n\n<p>\nAI for All · AI for Humanity\n</p>\n\n</footer>\n\n</body>\n</html>\n",

  const selected = keys.find(key => Object.hasOwn(pages, key)) || "default";
  const page = pages[selected];
  const opening = /^\s*<!doctype html>\s*(<html\b[^>]*>)\s*<head\b[^>]*>/i.exec(page);

  // Keep the original URL and let the initial HTML parser run the page scripts.
  const root = new DOMParser().parseFromString(opening[1], "text/html").documentElement;
  for (const attribute of root.attributes) {
    document.documentElement.setAttribute(attribute.name, attribute.value);
  }
  data.remove();
  document.write(page.slice(opening[0].length));
})();
</script>
