\n  text-align: center;\n  background: linear-gradient(\n    135deg,\n    #eaf4ff,\n    #ffffff\n  );\n}\n\n.hero h2 {\n  border: none;\n  font-size: clamp(25px, 4vw, 37px);\n  line-height: 1.4;\n}\n\n.hero p {\n  font-size: 18px;\n}\n\n/* ==========================================\n   GRID\n========================================== */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  min-width: 0;\n  background: #f4f8fc;\n  padding: 24px;\n  border-radius: 10px;\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* ==========================================\n   HIGHLIGHT\n========================================== */\n\n.highlight {\n  background: #eaf4ff;\n  border-left: 5px solid #168de0;\n  padding: 24px;\n  margin: 20px 0;\n  border-radius: 8px;\n}\n\n/* ==========================================\n   BUTTONS\n========================================== */\n\n.button {\n  display: inline-block;\n  background: var(--main-blue);\n  color: white;\n  padding: 12px 22px;\n  border-radius: 7px;\n  text-decoration: none;\n  font-weight: bold;\n  margin: 10px 8px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: var(--main-blue);\n}\n\n.button.secondary:hover {\n  background: #cce2ff;\n}\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* ==========================================\n   PAGE DIRECTORY\n========================================== */\n\n.page-directory {\n  background: #f0f6ff;\n}\n\n.page-directory .card {\n  background: white;\n}\n\n.page-directory .button {\n  margin-top: 12px;\n}\n\n/* ==========================================\n   FOOTER\n========================================== */\n\nfooter {\n  background: var(--dark-blue);\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* ==========================================\n   MOBILE\n========================================== */\n\n@media (max-width: 767px) {\n\n  header {\n    padding: 14px 12px;\n  }\n\n  .main-nav {\n    gap: 6px;\n    padding: 8px;\n  }\n\n  .language-dropdown > summary {\n    min-height: 42px;\n    padding: 8px 10px;\n    font-size: 12px;\n  }\n\n  .language-options {\n    width: 170px;\n    max-height: 60vh;\n  }\n\n  .main-nav-links > a {\n    min-height: 42px;\n    padding: 8px 9px;\n    font-size: 12px;\n  }\n\n  main section {\n    padding: 23px;\n  }\n\n  .card {\n    padding: 19px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin: 10px 0;\n  }\n}\n\n@media (max-width: 600px) {\n\n  .grid {\n    grid-template-columns: minmax(0, 1fr);\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     COMPACT HEADER\n===================================== -->\n\n<header>\n\n  <h1>GLOBAL AI HUB INITIATIVE</h1>\n\n  <h2>\n    Goyang Special City ·\n    Gyeonggi Province, Republic of Korea\n  </h2>\n\n</header>\n\n\u003c!-- =====================================\n     MAIN NAVIGATION\n===================================== -->\n\n<nav class=\"main-nav\"\n     aria-label=\"Main navigation\">\n\n  \u003c!-- LANGUAGE SELECTOR: LEFT FIXED -->\n\n  <details class=\"language-dropdown\">\n\n    <summary aria-label=\"Select website language\">\n      🌐 Language ▾\n    </summary>\n\n    <div class=\"language-options\">\n\n      <a href=\"index.html\" lang=\"ko\">\n        한국어\n      </a>\n\n      <a href=\"index.html?lang=en\"\n         lang=\"en\"\n         aria-current=\"page\">\n        English ✓\n      </a>\n\n      <a href=\"index.html?lang=zh\" lang=\"zh\">\n        中文\n      </a>\n\n      <a href=\"index.html?lang=ja\" lang=\"ja\">\n        日本語\n      </a>\n\n      <a href=\"index.html?lang=ru\" lang=\"ru\">\n        Русский\n      </a>\n\n      <a href=\"index.html?lang=ar\" lang=\"ar\" dir=\"rtl\">\n        العربية\n      </a>\n\n      <a href=\"index.html?lang=es\" lang=\"es\">\n        Español\n      </a>\n\n      <a href=\"index.html?lang=fr\" lang=\"fr\">\n        Français\n      </a>\n\n      <a href=\"index.html?lang=de\" lang=\"de\">\n        Deutsch\n      </a>\n\n      <a href=\"index.html?lang=it\" lang=\"it\">\n        Italiano\n      </a>\n\n    </div>\n\n  </details>\n\n  \u003c!-- GENERAL MENU: INDEPENDENT SCROLL -->\n\n  <div class=\"main-nav-links\">\n\n    <a href=\"index.html?lang=en\">Home</a>\n\n    <a href=\"hub.html?lang=en\">Global AI Hub</a>\n\n    <a href=\"goyang.html?lang=en\">Why Goyang?</a>\n\n    <a href=\"agencies.html?lang=en\">\n      International Organizations\n    </a>\n\n    <a href=\"strategy.html?lang=en\">Strategy</a>\n\n    <a href=\"committee.html?lang=en\">Committee</a>\n\n    <a href=\"history.html?lang=en\">Timeline</a>\n\n    <a href=\"news.html?lang=en\">News</a>\n\n    <a href=\"press.html?lang=en\">Media</a>\n\n    <a href=\"participate.html?lang=en\">Participation</a>\n\n    <a href=\"guide.html?lang=en\">Guide</a>\n<a href=\"gallery.html?lang=en\">Photo Gallery</a>\n<a href=\"library.html?lang=en\">Digital Library</a>\n<a href=\"resources.html?lang=en\">Resources</a>\n\n  </div>\n\n</nav>\n\n\u003c!-- =====================================\n     ENGLISH MAIN BANNER\n===================================== -->\n\n<div class=\"main-banner\">\n\n  <img\n    src=\"aihub-main-banner-en.png\"\n    alt=\"Global AI Hub Initiative in Goyang Special City\"\n    loading=\"eager\"\n    fetchpriority=\"high\">\n\n</div>\n\n<main>\n\n\u003c!-- =====================================\n     VISION\n===================================== -->\n\n<section class=\"hero\" id=\"vision\">\n\n<h2>\nArtificial Intelligence for Humanity.<br>\nInternational Cooperation for a Better Future.\n</h2>\n\n<p>\nConnecting international organizations,\ngovernments, research institutions,\nuniversities, industry, and communities\nto address global challenges.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nOur Vision\n</strong>\n\n<p>\nTo develop Goyang Special City\ninto a center for international cooperation\nwhere artificial intelligence\nsupports sustainable development,\nhuman well-being,\nand solutions to global challenges.\n</p>\n\n</div>\n\n<a href=\"#goyang\" class=\"button\">\nWhy Goyang?\n</a>\n\n<a href=\"#partnership\" class=\"button secondary\">\nExplore Partnership Opportunities\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     GLOBAL AI HUB\n===================================== -->\n\n<section id=\"hub\">\n\n<h2>\n1. What Is the Global AI Hub?\n</h2>\n\n<p>\nThe proposed Global AI Hub is envisioned\nas an international cooperation platform\nconnecting the expertise of international\norganizations with advances in\nartificial intelligence.\n</p>\n\n<p>\nIts purpose is to explore how AI\ncan contribute to addressing\ncomplex global challenges,\nincluding public health,\nfood security, climate change,\nenvironmental protection,\nhumanitarian assistance,\nmigration, employment,\neducation, and disaster resilience.\n</p>\n\n<p>\nThe initiative seeks to encourage\ncooperation among international organizations,\ngovernments, academic institutions,\nresearch centers, businesses,\nand civil society.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>International Cooperation</h3>\n\n<p>\nFacilitating dialogue,\nknowledge exchange,\nand cooperation across institutions\nand countries.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>AI Research and Innovation</h3>\n\n<p>\nExploring responsible AI applications\nfor public-interest challenges\nthrough research and collaboration.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Practical Solutions</h3>\n\n<p>\nSupporting opportunities for pilot projects,\ntechnology assessment,\nand evidence-based approaches\nto global challenges.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Capacity Development</h3>\n\n<p>\nExploring training,\nprofessional exchange,\nand international learning\nopportunities.\n</p>\n\n</div>\n\n</div>\n\n<a href=\"hub.html?lang=en\" class=\"button\">\nLearn More About the Global AI Hub\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     GOYANG\n===================================== -->\n\n<section id=\"goyang\">\n\n<h2>\n2. Why Goyang Special City?\n</h2>\n\n<p>\nGoyang Special City is located\nin Gyeonggi Province,\nwithin the Seoul metropolitan region\nof the Republic of Korea.\n</p>\n\n<p>\nIts international exhibition\nand convention infrastructure,\nhealthcare institutions,\nurban services,\nand environmental assets\nprovide a foundation for exploring\nthe development of an international\ncooperation hub.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>Strategic Metropolitan Location</h3>\n\n<p>\nGoyang benefits from its location\nwithin the Seoul metropolitan region,\noffering access to major economic,\nacademic, and institutional networks.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>KINTEX Convention Infrastructure</h3>\n\n<p>\nKINTEX provides facilities\nfor international exhibitions,\nconferences,\nand professional exchanges.\n</p>\n\n<p>\nThis infrastructure could support\ninternational meetings,\nforums, and collaborative events\nassociated with the proposed hub.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Healthcare and Research Potential</h3>\n\n<p>\nGoyang is home to the\nNational Cancer Center\nand other healthcare institutions.\n</p>\n\n<p>\nThese assets offer opportunities\nto explore cooperation\nin public health,\nmedical research,\nand responsible AI applications.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Environmental Assets</h3>\n\n<p>\nThe Janghang Wetland\nand surrounding ecological resources\nprovide opportunities\nfor environmental education,\nresearch,\nand sustainability initiatives.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Living Environment</h3>\n\n<p>\nGoyang offers residential areas,\nhealthcare services,\neducational facilities,\ncultural amenities,\nand urban infrastructure.\n</p>\n\n<p>\nSpecific requirements\nfor international personnel\nand their families\nwould need to be assessed\nthrough consultation.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Regional Development Opportunities</h3>\n\n<p>\nInternational cooperation\ncould create opportunities\nfor research,\nprofessional employment,\nbusiness development,\nand related services.\n</p>\n\n<p>\nActual outcomes would depend\non the scale and structure\nof future partnerships.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nA Location for International Cooperation\nand Shared Growth\n</strong>\n\n<p>\nGoyang's existing assets\nprovide a basis for exploring\na Global AI Hub that supports\nboth international cooperation\nand regional development.\n</p>\n\n</div>\n\n<a href=\"goyang.html?lang=en\" class=\"button\">\nExplore Goyang's Advantages\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     INTERNATIONAL ORGANIZATIONS\n===================================== -->\n\n<section id=\"organizations\">\n\n<h2>\n3. International Organizations\nand Potential Areas of Cooperation\n</h2>\n\n<p>\nThe initiative identifies nine\ninternational organizations\nwhose areas of expertise\nare relevant to potential\nAI-enabled international cooperation.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>WHO</h3>\n\n<p>\n<strong>World Health Organization</strong>\n</p>\n\n<p>\nPublic health,\ndisease prevention,\nhealth systems,\nand potential AI applications\nfor health information analysis.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>WFP</h3>\n\n<p>\n<strong>World Food Programme</strong>\n</p>\n\n<p>\nFood security,\nhumanitarian assistance,\nsupply-chain resilience,\nand potential AI-supported\nfood crisis analysis.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNEP</h3>\n\n<p>\n<strong>United Nations Environment Programme</strong>\n</p>\n\n<p>\nClimate change,\nenvironmental protection,\nbiodiversity,\nand potential AI applications\nfor environmental monitoring.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNHCR</h3>\n\n<p>\n<strong>\nUnited Nations High Commissioner for Refugees\n</strong>\n</p>\n\n<p>\nRefugee protection,\nforced displacement,\nhumanitarian assistance,\nand responsible data analysis\nfor protection-related needs.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>IOM</h3>\n\n<p>\n<strong>\nInternational Organization for Migration\n</strong>\n</p>\n\n<p>\nMigration,\ndisplacement,\nhumanitarian support,\nand potential digital tools\nfor improving access\nto migration-related services.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>ILO</h3>\n\n<p>\n<strong>\nInternational Labour Organization\n</strong>\n</p>\n\n<p>\nEmployment,\nlabor rights,\nskills development,\nand analysis of the effects\nof AI on the future of work.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>ITU</h3>\n\n<p>\n<strong>\nInternational Telecommunication Union\n</strong>\n</p>\n\n<p>\nDigital connectivity,\ntelecommunications,\nemergency communications,\nand early-warning technologies.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNICEF</h3>\n\n<p>\n<strong>\nUnited Nations Children's Fund\n</strong>\n</p>\n\n<p>\nChild protection,\neducation,\ndigital inclusion,\nand responsible AI applications\nthat safeguard children's rights.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>UNDP</h3>\n\n<p>\n<strong>\nUnited Nations Development Programme\n</strong>\n</p>\n\n<p>\nSustainable development,\ncrisis response,\ninstitutional capacity,\nand potential AI applications\nfor development planning.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nImportant Clarification\n</strong>\n\n<p>\nThese organizations are identified\nas potential areas of engagement\nbased on their respective mandates.\n</p>\n\n<p>\nTheir inclusion does not imply\nthat any organization has agreed\nto participate in,\nrelocate to,\nor establish an office\nat the proposed Global AI Hub.\n</p>\n\n<p>\nAny future cooperation\nwould require appropriate consultation,\ninstitutional decisions,\nand formal agreements.\n</p>\n\n</div>\n\n<a href=\"agencies.html?lang=en\" class=\"button\">\nExplore the Nine International Organizations\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     STRATEGY\n===================================== -->\n\n<section id=\"strategy\">\n\n<h2>\n4. Three-Stage Development Strategy\n</h2>\n\n<p>\nThe proposed approach considers\nthe practical requirements\nof international organizations\nand other potential partners.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nStage 1 — Initial Establishment\n</h3>\n\n<p>\nExploring suitable conditions\nfor the initial establishment\nof participating organizations\nand partner institutions.\n</p>\n\n<p>\nPotential considerations include\noffice facilities,\ntransportation,\nhousing,\nhealthcare,\neducation,\nand other essential services.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nStage 2 — Operational Support\n</h3>\n\n<p>\nExploring cooperation\namong relevant public institutions,\nuniversities,\nresearch organizations,\nbusinesses,\nand civil society.\n</p>\n\n<p>\nPotential activities include\njoint research,\ninternational meetings,\nAI pilot projects,\nand professional exchanges.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nStage 3 — Shared and Sustainable Growth\n</h3>\n\n<p>\nSeeking long-term cooperation\nthat contributes\nto the mandates of participating\ninternational organizations\nwhile creating opportunities\nfor regional innovation,\nemployment,\nand economic development.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nInitial Establishment\n→ Operational Support\n→ Shared Growth\n</strong>\n\n<p>\nSpecific institutional arrangements,\nfunding,\nfacilities,\nand support measures\nwould be subject to consultation\nand approval by the relevant authorities.\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=en\" class=\"button\">\nExplore the Development Strategy\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     COMMITTEE\n===================================== -->\n\n<section id=\"committee\">\n\n<h2>\n5. About the Citizens' Promotion Committee\n</h2>\n\n<p>\nThe Citizens' Promotion Committee\nfor Attracting the Global AI Hub\nto Goyang Special City\nis a civic initiative\nseeking to build public awareness\nand support for the proposed hub.\n</p>\n\n<p>\nThe Committee aims to promote\npublic discussion,\nencourage citizen participation,\nand communicate the potential benefits\nof international cooperation\nand AI-driven innovation.\n</p>\n\n<p>\nIts activities include\npublic information,\ncitizen engagement,\npolicy discussions,\nand outreach related\nto the Global AI Hub initiative.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nOur Commitment\n</strong>\n\n<p>\nTo promote transparent,\nresponsible,\nand constructive engagement\nin support of international cooperation\nand the future development\nof Goyang Special City.\n</p>\n\n</div>\n\n<a href=\"committee.html?lang=en\" class=\"button\">\nAbout the Committee\n</a>\n\n<a href=\"participate.html?lang=en\"\nclass=\"button secondary\">\nCitizen Participation\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     PARTNERSHIP\n===================================== -->\n\n<section id=\"partnership\">\n\n<h2>\n6. International Partnership Opportunities\n</h2>\n\n<p>\nThe proposed Global AI Hub\nseeks to encourage dialogue\nwith organizations and institutions\ninterested in responsible AI,\ninternational cooperation,\nand sustainable development.\n</p>\n\n<p>\nPotential areas of engagement include:\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>Policy Dialogue</h3>\n\n<p>\nExchanging perspectives\non international cooperation,\nAI governance,\nand public-interest innovation.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Research Collaboration</h3>\n\n<p>\nExploring opportunities\nfor interdisciplinary research\nand knowledge exchange.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Technology Demonstration</h3>\n\n<p>\nConsidering responsible pilot projects\nand practical applications\nof AI technologies.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Professional Exchange</h3>\n\n<p>\nExploring workshops,\ntraining,\ninternational forums,\nand capacity-building initiatives.\n</p>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nAll potential partnerships\nare exploratory unless\nformally confirmed\nby the relevant institutions.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     CONTACT\n===================================== -->\n\n<section id=\"contact\">\n\n<h2>\n7. Contact and Further Information\n</h2>\n\n<p>\nInternational organizations,\nresearch institutions,\nand other interested parties\nare welcome to learn more\nabout the Global AI Hub initiative\nand the Citizens' Promotion Committee.\n</p>\n\n<p>\nFor general information,\nplease explore the English-language\npages linked below.\nThe Korean homepage provides\naccess to the existing\nKorean-language information\nand administration-related resources.\n</p>\n\n<a href=\"guide.html?lang=en\" class=\"button\">\nWebsite User Guide\n</a>\n\n<a href=\"index.html\" class=\"button secondary\">\nKorean Homepage\n</a>\n\n<div class=\"highlight\">\n\n<strong>\nGlobal AI Hub Initiative<br>\nGoyang Special City,\nGyeonggi Province,\nRepublic of Korea\n</strong>\n\n<p>\nCitizens' Promotion Committee\nfor Attracting the Global AI Hub\nto Goyang Special City\n</p>\n\n<p class=\"note\">\nThis website presents a civic initiative\nand its proposed vision.\nIt does not constitute\nan official site-selection decision\nor a commitment\nby any international organization.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     ENGLISH WEBSITE DIRECTORY\n===================================== -->\n\n<section id=\"directory\" class=\"page-directory\">\n\n<h2>\n8. Explore the Global AI Hub Website\n</h2>\n\n<p>\nExplore the following pages\nfor detailed information\nabout the Global AI Hub initiative,\nGoyang Special City,\ninternational cooperation,\nand citizen participation.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>Global AI Hub</h3>\n\n<p>\nLearn about the proposed\ninternational cooperation platform\nand its vision.\n</p>\n\n<a href=\"hub.html?lang=en\" class=\"button\">\nExplore\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Why Goyang?</h3>\n\n<p>\nDiscover Goyang's\nlocation advantages,\ninfrastructure,\nand development potential.\n</p>\n\n<a href=\"goyang.html?lang=en\" class=\"button\">\nExplore\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>International Organizations</h3>\n\n<p>\nLearn about nine international\norganizations and potential\nareas of cooperation.\n</p>\n\n<a href=\"agencies.html?lang=en\" class=\"button\">\nExplore\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Development Strategy</h3>\n\n<p>\nReview the proposed\nthree-stage strategy\nfor establishment,\nsupport,\nand sustainable growth.\n</p>\n\n<a href=\"strategy.html?lang=en\" class=\"button\">\nExplore\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Citizens' Promotion Committee</h3>\n\n<p>\nLearn about the Committee,\nits mission,\nand civic activities.\n</p>\n\n<a href=\"committee.html?lang=en\" class=\"button\">\nExplore\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Timeline & Milestones</h3>\n\n<p>\nReview major developments\nand activities\nrelated to the initiative.\n</p>\n\n<a href=\"history.html?lang=en\" class=\"button\">\nExplore\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>News & Announcements</h3>\n\n<p>\nRead updates\nabout Committee activities,\nevents,\nand major developments.\n</p>\n\n<a href=\"news.html?lang=en\" class=\"button\">\nView News\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Media Coverage</h3>\n\n<p>\nExplore newspaper articles,\nbroadcast reports,\nand other media coverage.\n</p>\n\n<a href=\"press.html?lang=en\" class=\"button\">\nView Media Coverage\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Citizen Participation</h3>\n\n<p>\nLearn about public support campaigns,\nCommittee registration,\nand participation programs.\n</p>\n\n<a href=\"participate.html?lang=en\" class=\"button\">\nParticipation Center\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>Website User Guide</h3>\n\n<p>\nLearn how to navigate\nthe website,\naccess information,\nand participate\nin available programs.\n</p>\n\n<a href=\"guide.html?lang=en\" class=\"button\">\nView Guide\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     MULTILINGUAL INFORMATION\n===================================== -->\n\n<section id=\"languages\">\n\n<h2>\n9. Multilingual Website Information\n</h2>\n\n<p>\nThe Global AI Hub Initiative website\nprovides homepage information\nin ten languages to support\ninternational visitors,\norganizations,\nresearch institutions,\nbusinesses,\nand interested citizens.\n</p>\n\n<p>\nVisitors can select their preferred language\nusing the language selector\nat the top of the homepage.\nThe Korean website also provides\naccess to administrative services\nand Korean-language resources.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nAvailable Homepage Languages\n</strong>\n\n<p>\n<a href=\"index.html\" lang=\"ko\">\n한국어 — Korean\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=en\"\n   lang=\"en\"\n   aria-current=\"page\">\nEnglish — English ✓\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=zh\" lang=\"zh\">\n中文 — Chinese\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ja\" lang=\"ja\">\n日本語 — Japanese\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ru\" lang=\"ru\">\nРусский — Russian\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ar\" lang=\"ar\" dir=\"rtl\">\nالعربية — Arabic\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=es\" lang=\"es\">\nEspañol — Spanish\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\" lang=\"fr\">\nFrançai ion {\n    padding: 23px;\n  }\n\n  .card {\n    padding: 19px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin: 10px 0;\n  }\n\n}\n\n/* =====================================\n   16. PANTALLAS HORIZONTALES BAJAS\n===================================== */\n\n@media (max-height: 500px) {\n\n  .language-options {\n    max-height: 55vh;\n    max-height: 55dvh;\n  }\n\n}\n\n/* =====================================\n   FIN DEL CSS\n===================================== */\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ENCABEZADO\n===================================== -->\n\n<header>\n\n<h1>\nINICIATIVA DEL CENTRO GLOBAL DE IA\n</h1>\n\n<h2>\nCiudad Especial de Goyang ·\nProvincia de Gyeonggi · República de Corea\n</h2>\n\n</header>\n\n\u003c!-- =====================================\n     NAVEGACIÓN PRINCIPAL\n===================================== -->\n\n<nav\n  class=\"main-nav\"\n  aria-label=\"Navegación principal\"\n>\n\n\u003c!-- =====================================\n     SELECTOR DE IDIOMA\n===================================== -->\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"Seleccionar idioma\">\n🌐 Idioma ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a\n  href=\"index.html\"\n  lang=\"ko\"\n>\n한국어\n</a>\n\n<a\n  href=\"index.html?lang=en\"\n  lang=\"en\"\n>\nEnglish\n</a>\n\n<a\n  href=\"index.html?lang=zh\"\n  lang=\"zh\"\n>\n中文\n</a>\n\n<a\n  href=\"index.html?lang=ja\"\n  lang=\"ja\"\n>\n日本語\n</a>\n\n<a\n  href=\"index.html?lang=ru\"\n  lang=\"ru\"\n>\nРусский\n</a>\n\n<a\n  href=\"index.html?lang=ar\"\n  lang=\"ar\"\n  dir=\"rtl\"\n>\nالعربية\n</a>\n\n<a\n  href=\"index.html?lang=es\"\n  lang=\"es\"\n  aria-current=\"page\"\n>\nEspañol ✓\n</a>\n\n<a\n  href=\"index.html?lang=fr\"\n  lang=\"fr\"\n>\nFrançais\n</a>\n\n<a\n  href=\"index.html?lang=de\"\n  lang=\"de\"\n>\nDeutsch\n</a>\n\n<a\n  href=\"index.html?lang=it\"\n  lang=\"it\"\n>\nItaliano\n</a>\n\n</div>\n\n</details>\n\n\u003c!-- =====================================\n     MENÚ PRINCIPAL EN ESPAÑOL\n===================================== -->\n\n<div class=\"main-nav-links\">\n\n<a href=\"index.html?lang=es\">\nInicio\n</a>\n\n<a href=\"hub.html?lang=es\">\nCentro Global de IA\n</a>\n\n<a href=\"goyang.html?lang=es\">\n¿Por qué Goyang?\n</a>\n\n<a href=\"agencies.html?lang=es\">\nOrganizaciones internacionales\n</a>\n\n<a href=\"strategy.html?lang=es\">\nEstrategia\n</a>\n\n<a href=\"committee.html?lang=es\">\nComité\n</a>\n\n<a href=\"history.html?lang=es\">\nCronología\n</a>\n\n<a href=\"news.html?lang=es\">\nNoticias\n</a>\n\n<a href=\"press.html?lang=es\">\nPrensa\n</a>\n\n<a href=\"participate.html?lang=es\">\nParticipación ciudadana\n</a>\n\n<a href=\"guide.html?lang=es\">\nGuía\n</a>\n<a href=\"gallery.html?lang=es\">Galería de fotos</a>\n<a href=\"library.html?lang=es\">Biblioteca digital</a>\n<a href=\"resources.html?lang=es\">Centro de recursos</a>\n\n</div>\n\n</nav>\n\n\u003c!-- =====================================\n     IMAGEN PRINCIPAL\n===================================== -->\n\n<div class=\"main-banner\">\n\n<img\n  src=\"aihub-main-banner-es.png\"\n  alt=\"Iniciativa del Centro Global de Inteligencia Artificial en Goyang\"\n  width=\"1648\"\n  height=\"928\"\n  loading=\"eager\"\n  fetchpriority=\"high\"\n>\n\n</div>\n\n\u003c!-- =====================================\n     FIN DE LA PARTE 1\n\n     LA PARTE 2 COMIENZA CON <main>\n===================================== -->\n\n<main>\n\n\u003c!-- =====================================\n     01. VISIÓN\n===================================== -->\n\n<section class=\"hero\" id=\"vision\">\n\n<h2>\nInteligencia artificial al servicio de la humanidad\n</h2>\n\n<p>\nCooperación internacional para un futuro mejor\n</p>\n\n<p>\nPromovemos la cooperación entre\norganizaciones internacionales,\ngobiernos, universidades,\ncentros de investigación,\nempresas y sociedad civil\npara explorar el potencial\nde la inteligencia artificial\nen la solución de los\ndesafíos globales compartidos.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nNuestra visión\n</strong>\n\n<p>\nAspiramos a que la Ciudad Especial\nde Goyang se convierta en un\ncentro internacional de cooperación\nen inteligencia artificial,\ninvestigación científica e innovación,\ncontribuyendo al desarrollo sostenible\ny al bienestar de la humanidad.\n</p>\n\n</div>\n\n<a href=\"#goyang\" class=\"button\">\n¿Por qué Goyang?\n</a>\n\n<a href=\"#partnership\"\nclass=\"button secondary\">\nCooperación internacional\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     02. GLOBAL AI HUB\n===================================== -->\n\n<section id=\"hub\">\n\n<h2>\n1. ¿Qué es el Centro Global de Inteligencia Artificial?\n</h2>\n\n<p>\nEl Centro Global de Inteligencia\nArtificial es una iniciativa\npropuesta para establecer una\nplataforma internacional de\ncooperación que combine\nla experiencia de las\norganizaciones internacionales\ncon las capacidades de las\ntecnologías avanzadas de IA.\n</p>\n\n<p>\nLa iniciativa busca explorar\nel uso responsable de la\ninteligencia artificial para\nabordar desafíos globales\nen ámbitos como la salud pública,\nla seguridad alimentaria,\nel cambio climático,\nla protección ambiental,\nla asistencia humanitaria,\nla migración, el empleo,\nla educación y la prevención\nde desastres.\n</p>\n\n<p>\nAsimismo, pretende fomentar\nel intercambio de conocimientos,\nla investigación conjunta\ny la cooperación entre\norganizaciones internacionales,\ninstituciones gubernamentales,\nuniversidades, centros de\ninvestigación, empresas\ny sociedad civil.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nCooperación internacional\n</h3>\n\n<p>\nPromover el diálogo internacional,\nel intercambio de experiencias\ny el desarrollo de alianzas\npara afrontar desafíos globales.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nInvestigación e innovación\n</h3>\n\n<p>\nExplorar aplicaciones responsables\nde la inteligencia artificial\ny fomentar la investigación\ncientífica y la innovación\ntecnológica de interés público.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nAplicaciones prácticas\n</h3>\n\n<p>\nEstudiar oportunidades para\ndesarrollar proyectos piloto,\nevaluar tecnologías y aplicar\nla inteligencia artificial\na problemas de interés público.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nDesarrollo de capacidades\n</h3>\n\n<p>\nPromover la formación profesional,\nel intercambio de especialistas\ny la difusión internacional\ndel conocimiento.\n</p>\n\n</div>\n\n</div>\n\n<a href=\"hub.html?lang=es\" class=\"button\">\nMás información sobre el Centro Global de IA\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     03. GOYANG\n===================================== -->\n\n<section id=\"goyang\">\n\n<h2>\n2. ¿Por qué la Ciudad Especial de Goyang?\n</h2>\n\n<p>\nLa Ciudad Especial de Goyang\nse encuentra en la provincia\nde Gyeonggi, República de Corea,\ny forma parte de la región\nmetropolitana de Seúl.\n</p>\n\n<p>\nLa ciudad dispone de\ninfraestructuras para\nexposiciones y conferencias\ninternacionales, instituciones\nmédicas, educativas y culturales,\nasí como servicios urbanos\ny recursos naturales.\n</p>\n\n<p>\nEstas características pueden\nservir como base para estudiar\nla posibilidad de desarrollar\nun centro internacional de\ncooperación en inteligencia\nartificial.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nUbicación metropolitana\n</h3>\n\n<p>\nGoyang se encuentra en la\nregión metropolitana de Seúl,\nlo que facilita la conexión\ncon redes económicas,\ncientíficas e institucionales.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nCentro Internacional KINTEX\n</h3>\n\n<p>\nEl Centro Internacional\nde Exposiciones y Convenciones\nKINTEX dispone de instalaciones\npara ferias, conferencias\ny reuniones internacionales.\n</p>\n\n<p>\nEstas capacidades podrían\naprovecharse para organizar\nforos científicos, encuentros\ninternacionales y futuros\nprogramas de cooperación.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nCapacidades médicas y científicas\n</h3>\n\n<p>\nGoyang alberga el\nCentro Nacional del Cáncer\nde Corea y otras\ninstituciones médicas.\n</p>\n\n<p>\nEstos recursos permiten\nexplorar oportunidades\nde cooperación en salud pública,\ninvestigación médica\ny aplicaciones responsables\nde inteligencia artificial.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nRecursos ambientales\n</h3>\n\n<p>\nLos humedales de Janghang\ny otros espacios naturales\nconstituyen recursos valiosos\npara la investigación ambiental,\nla educación y las iniciativas\nde desarrollo sostenible.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nEntorno residencial\n</h3>\n\n<p>\nLa ciudad cuenta con\nservicios residenciales,\nsanitarios, educativos,\nculturales y urbanos.\n</p>\n\n<p>\nLas necesidades específicas\ndel personal de posibles\norganizaciones internacionales\ny sus familias deberán\ndeterminarse mediante\nlas consultas correspondientes.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nDesarrollo regional\n</h3>\n\n<p>\nLa ampliación de la\ncooperación internacional\npodría contribuir al\ndesarrollo de la investigación,\nla creación de oportunidades\nlaborales y el crecimiento\nde actividades económicas\nrelacionadas.\n</p>\n\n<p>\nLos resultados concretos\ndependerán de la naturaleza\ny escala de los proyectos\nque lleguen a desarrollarse.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nCooperación internacional y desarrollo sostenible\n</strong>\n\n<p>\nGoyang aspira a aprovechar\nsus capacidades existentes\npara explorar oportunidades\nde desarrollo de un centro\ninternacional que contribuya\na abordar desafíos globales\ny a promover el desarrollo\nsostenible de la ciudad.\n</p>\n\n</div>\n\n<a href=\"goyang.html?lang=es\" class=\"button\">\nMás información sobre Goyang\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     04. INTERNATIONAL ORGANIZATIONS\n===================================== -->\n\n<section id=\"organizations\">\n\n<h2>\n3. Organizaciones internacionales y posibles ámbitos de cooperación\n</h2>\n\n<p>\nLa iniciativa del Centro Global\nde Inteligencia Artificial\ncontempla posibles ámbitos\nde cooperación relacionados\ncon las misiones de nueve\norganizaciones internacionales.\n</p>\n\n<p>\nEstos ámbitos se presentan\npara ilustrar oportunidades\npotenciales de colaboración\nfutura y no constituyen\nacuerdos ni compromisos\nconfirmados.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nOMS (WHO) — Organización Mundial de la Salud\n</h3>\n\n<p>\nSalud pública, prevención\nde enfermedades, fortalecimiento\nde los sistemas sanitarios,\nanálisis de datos médicos\ny uso responsable de la\ninteligencia artificial.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPMA (WFP) — Programa Mundial de Alimentos\n</h3>\n\n<p>\nSeguridad alimentaria,\nasistencia humanitaria,\nsostenibilidad de las\ncadenas de suministro\ny análisis de crisis alimentarias.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPNUMA (UNEP) — Programa de las Naciones Unidas para el Medio Ambiente\n</h3>\n\n<p>\nCambio climático,\nprotección ambiental,\nbiodiversidad y\nseguimiento de las\ncondiciones ambientales.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nACNUR (UNHCR) — Agencia de la ONU para los Refugiados\n</h3>\n\n<p>\nProtección de personas\nrefugiadas, desplazamiento\nforzado, asistencia humanitaria\ny uso responsable de datos\nen actividades de protección.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nOIM (IOM) — Organización Internacional para las Migraciones\n</h3>\n\n<p>\nMigración internacional,\napoyo a personas desplazadas,\nasistencia humanitaria\ny soluciones digitales\npara los servicios migratorios.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nOIT (ILO) — Organización Internacional del Trabajo\n</h3>\n\n<p>\nEmpleo, derechos laborales,\nformación profesional\ny análisis de los efectos\nde la inteligencia artificial\nen el futuro del trabajo.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUIT (ITU) — Unión Internacional de Telecomunicaciones\n</h3>\n\n<p>\nTelecomunicaciones digitales,\ninfraestructuras de conectividad,\ncomunicaciones de emergencia\ny sistemas de alerta temprana\nante desastres.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNICEF — Fondo de las Naciones Unidas para la Infancia\n</h3>\n\n<p>\nProtección de la infancia,\neducación, inclusión digital\ny uso responsable de la\ninteligencia artificial\ncon respeto a los derechos\nde los niños.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPNUD (UNDP) — Programa de las Naciones Unidas para el Desarrollo\n</h3>\n\n<p>\nDesarrollo sostenible,\nrespuesta a crisis,\nfortalecimiento de capacidades\ninstitucionales y aplicaciones\nde inteligencia artificial\nen programas de desarrollo.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nAclaración importante\n</strong>\n\n<p>\nLas organizaciones internacionales\nmencionadas anteriormente\nse presentan únicamente\nen relación con sus mandatos\ninstitucionales y posibles\námbitos de cooperación futura.\n</p>\n\n<p>\nEsto no significa que dichas\norganizaciones hayan confirmado\nsu participación en la iniciativa,\nni que hayan acordado establecer\noficinas o trasladar unidades\na la Ciudad Especial de Goyang.\n</p>\n\n<p>\nCualquier cooperación futura\nrequerirá consultas oficiales,\nlas decisiones institucionales\ncorrespondientes y los\nprocedimientos de aprobación\naplicables.\n</p>\n\n</div>\n\n<a href=\"agencies.html?lang=es\" class=\"button\">\nMás información sobre las nueve organizaciones\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     05. DEVELOPMENT STRATEGY\n===================================== -->\n\n<section id=\"strategy\">\n\n<h2>\n4. Estrategia de desarrollo en tres etapas\n</h2>\n\n<p>\nLa iniciativa del Centro Global\nde Inteligencia Artificial\npropone un enfoque gradual\nde tres etapas que tenga\nen cuenta las necesidades\nreales de los posibles\nsocios internacionales.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nEtapa 1 — Establecimiento inicial\n</h3>\n\n<p>\nExaminar las condiciones\nnecesarias para facilitar\nel inicio estable de las\nactividades de posibles\norganizaciones internacionales\ny entidades colaboradoras\nen Goyang.\n</p>\n\n<p>\nLos ámbitos de estudio\npodrían incluir oficinas,\ntransporte, vivienda,\natención sanitaria,\neducación y otros servicios.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nEtapa 2 — Apoyo operativo\n</h3>\n\n<p>\nPromover la cooperación\nentre instituciones públicas,\nuniversidades, centros\nde investigación, empresas\ny sociedad civil.\n</p>\n\n<p>\nExplorar oportunidades\npara investigaciones conjuntas,\nconferencias internacionales,\nproyectos piloto de IA\ne intercambio de especialistas.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nEtapa 3 — Crecimiento conjunto sostenible\n</h3>\n\n<p>\nDesarrollar una cooperación\na largo plazo que contribuya\na los objetivos de las\norganizaciones internacionales\ny al desarrollo sostenible\nde Goyang.\n</p>\n\n<p>\nLos posibles ámbitos incluyen\nla investigación científica,\nlas oportunidades laborales,\nlas actividades económicas\ny el desarrollo regional.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nEstablecimiento inicial\n→ Apoyo operativo\n→ Crecimiento conjunto\n</strong>\n\n<p>\nLas instalaciones,\nlos recursos financieros,\nlas medidas institucionales\ny los programas de cooperación\ndeberán definirse mediante\nconsultas y procedimientos\noficiales.\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=es\" class=\"button\">\nMás información sobre la estrategia\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     06. CITIZENS COMMITTEE\n===================================== -->\n\n<section id=\"committee\">\n\n<h2>\n5. Comité Ciudadano de la Iniciativa\n</h2>\n\n<p>\nEl Comité Ciudadano para\nPromover la Acogida del\nCentro Global de Inteligencia\nArtificial en la Ciudad\nEspecial de Goyang\nes una iniciativa de la\nsociedad civil destinada\na fomentar la conciencia\npública y ampliar la\nparticipación ciudadana.\n</p>\n\n<p>\nEl Comité busca apoyar\nel debate público sobre\nlas oportunidades de\ncooperación internacional,\nel desarrollo de la\ninteligencia artificial\ny el crecimiento sostenible\nde la ciudad.\n</p>\n\n<p>\nSus actividades incluyen\nla difusión de información,\nla promoción de la participación\nciudadana, el debate de\npropuestas estratégicas\ny la comunicación con\nlas instituciones pertinentes.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nNuestros principios\n</strong>\n\n<p>\nTransparencia, responsabilidad,\nparticipación ciudadana\nconstructiva y respeto\na los procedimientos\noficiales de decisión.\n</p>\n\n</div>\n\n<a href=\"committee.html?lang=es\" class=\"button\">\nMás información sobre el Comité\n</a>\n\n<a href=\"participate.html?lang=es\"\nclass=\"button secondary\">\nParticipación ciudadana\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     07. INTERNATIONAL PARTNERSHIP\n===================================== -->\n\n<section id=\"partnership\">\n\n<h2>\n6. Oportunidades de cooperación internacional\n</h2>\n\n<p>\nLa iniciativa del Centro Global\nde Inteligencia Artificial\nbusca fomentar el diálogo\ncon organizaciones e\ninstituciones interesadas\nen el desarrollo responsable\nde la inteligencia artificial,\nla cooperación internacional\ny el desarrollo sostenible.\n</p>\n\n<p>\nLos posibles ámbitos\nde colaboración incluyen:\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nDiálogo institucional\n</h3>\n\n<p>\nIntercambio de experiencias\ny perspectivas sobre\ncooperación internacional,\ngobernanza de la inteligencia\nartificial e innovación\ntecnológica de interés público.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nCooperación científica\n</h3>\n\n<p>\nExploración de oportunidades\npara investigaciones\nmultidisciplinarias,\nintercambio de conocimientos\ny desarrollo de redes\ncientíficas internacionales.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nProyectos tecnológicos\n</h3>\n\n<p>\nEstudio de oportunidades\npara proyectos piloto,\naplicaciones prácticas\ny evaluación de tecnologías\nde inteligencia artificial\nresponsable.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nIntercambio de especialistas\n</h3>\n\n<p>\nExploración de programas\nde formación, seminarios,\nforos internacionales\ny actividades de desarrollo\nde capacidades.\n</p>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nLos ámbitos mencionados\nrepresentan oportunidades\npotenciales de colaboración\ny no implican acuerdos\nconfirmados con organizaciones\ninternacionales.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     08. CONTACT\n===================================== -->\n\n<section id=\"contact\">\n\n<h2>\n7. Contacto e información adicional\n</h2>\n\n<p>\nDamos la bienvenida al interés\nde organizaciones internacionales,\ninstituciones de investigación,\nespecialistas y ciudadanos\nen el concepto del Centro\nGlobal de Inteligencia\nArtificial y las actividades\ndel Comité Ciudadano.\n</p>\n\n<p>\nPuede obtener información\nadicional a través de las\npáginas en español de\neste sitio web.\n</p>\n\n<p>\nLa versión coreana del\nsitio ofrece materiales\ny servicios adicionales\nen idioma coreano.\n</p>\n\n<a href=\"guide.html?lang=es\" class=\"button\">\nGuía del sitio web\n</a>\n\n<a href=\"index.html\"\nclass=\"button secondary\">\nVersión coreana\n</a>\n\n<div class=\"highlight\">\n\n<strong>\nIniciativa del Centro Global de Inteligencia Artificial\n<br>\nCiudad Especial de Goyang\n<br>\nProvincia de Gyeonggi\n<br>\nRepública de Corea\n</strong>\n\n<p>\nComité Ciudadano para Promover\nla Acogida del Centro Global\nde Inteligencia Artificial\nen Goyang\n</p>\n\n<p class=\"note\">\nEste sitio presenta una\niniciativa de la sociedad civil\ny sus actividades.\nNo implica que las autoridades\ngubernamentales hayan adoptado\nuna decisión oficial para\nestablecer el Centro Global\nde Inteligencia Artificial,\nni que alguna organización\ninternacional haya confirmado\nsu participación.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     09. SPANISH PAGE DIRECTORY\n===================================== -->\n\n<section id=\"directory\" class=\"page-directory\">\n\n<h2>\n8. Secciones del sitio web en español\n</h2>\n\n<p>\nLas siguientes páginas ofrecen\ninformación más detallada\nsobre el Centro Global de IA,\nla Ciudad Especial de Goyang,\nla cooperación internacional\ny la participación ciudadana.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nCentro Global de IA\n</h3>\n\n<p>\nConcepto, objetivos\ny posibles ámbitos\nde cooperación internacional.\n</p>\n\n<a href=\"hub.html?lang=es\" class=\"button\">\nMás información\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\n¿Por qué Goyang?\n</h3>\n\n<p>\nVentajas geográficas,\ninfraestructuras\ny oportunidades de desarrollo.\n</p>\n\n<a href=\"goyang.html?lang=es\" class=\"button\">\nMás información\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nOrganizaciones internacionales\n</h3>\n\n<p>\nNueve organizaciones\ninternacionales y posibles\námbitos de colaboración.\n</p>\n\n<a href=\"agencies.html?lang=es\" class=\"button\">\nMás información\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nEstrategia de desarrollo\n</h3>\n\n<p>\nEstablecimiento inicial,\napoyo operativo\ny crecimiento conjunto.\n</p>\n\n<a href=\"strategy.html?lang=es\" class=\"button\">\nMás información\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nComité Ciudadano\n</h3>\n\n<p>\nMisión, organización\ny actividades principales\ndel Comité.\n</p>\n\n<a href=\"committee.html?lang=es\" class=\"button\">\nMás información\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nCronología\n</h3>\n\n<p>\nPrincipales acontecimientos\ny etapas de desarrollo\nde la iniciativa.\n</p>\n\n<a href=\"history.html?lang=es\" class=\"button\">\nMás información\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nNoticias\n</h3>\n\n<p>\nInformación sobre actividades,\neventos y acontecimientos.\n</p>\n\n<a href=\"news.html?lang=es\" class=\"button\">\nVer noticias\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPrensa\n</h3>\n\n<p>\nArtículos periodísticos,\nreportajes y otros\nmateriales informativos.\n</p>\n\n<a href=\"press.html?lang=es\" class=\"button\">\nVer prensa\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nParticipación ciudadana\n</h3>\n\n<p>\nInformación sobre las\noportunidades de apoyar\nla iniciativa y participar\nen sus actividades.\n</p>\n\n<a href=\"participate.html?lang=es\" class=\"button\">\nCómo participar\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nGuía del sitio\n</h3>\n\n<p>\nInformación sobre el uso\ndel sitio web y la\nbúsqueda de materiales.\n</p>\n\n<a href=\"guide.html?lang=es\" class=\"button\">\nAbrir guía\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     10. MULTILINGUAL INFORMATION\n===================================== -->\n\n<section id=\"languages\">\n\n<h2>\n9. Sitio web multilingüe\n</h2>\n\n<p>\nEl sitio web de la iniciativa\ndel Centro Global de Inteligencia\nArtificial ofrece páginas\nprincipales en diez idiomas\npara visitantes de distintos\npaíses, organizaciones\ninternacionales, instituciones\nde investigación, empresas\ny ciudadanos.\n</p>\n\n<p>\nPuede seleccionar su idioma\npreferido mediante el\nselector situado en la\nparte superior de la página.\n</p>\n\n<p>\nLa versión coreana ofrece\nmateriales y servicios\nadicionales en coreano.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nIdiomas disponibles\n</strong>\n\n<p>\n<a href=\"index.html\" lang=\"ko\">\n한국어 — Coreano\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=en\" lang=\"en\">\nEnglish — Inglés\n</a>\n \n}\n\n/* =====================================\n   MENU HORIZONTAL INDÉPENDANT\n===================================== */\n\n.home-menu-links {\n  display: flex;\n  flex: 1 1 auto;\n  flex-wrap: nowrap;\n\n  align-items: center;\n  justify-content: flex-start;\n\n  gap: 6px;\n\n  min-width: 0;\n\n  overflow-x: auto;\n  overflow-y: hidden;\n\n  -webkit-overflow-scrolling: touch;\n\n  scrollbar-width: thin;\n  scrollbar-color: #ffe44d #10315e;\n\n  padding-bottom: 5px;\n}\n\n.home-menu-links > a {\n  display: inline-flex;\n\n  flex: 0 0 auto;\n\n  align-items: center;\n  justify-content: center;\n\n  min-height: 42px;\n\n  padding: 8px 12px;\n\n  background: white;\n  color: #0754a6;\n\n  border: 1px solid #d6e5f5;\n  border-radius: 6px;\n\n  font-size: 12px;\n  font-weight: 700;\n\n  text-decoration: none;\n  white-space: nowrap;\n}\n\n.home-menu-links > a:hover,\n.home-menu-links > a:focus-visible {\n  background: #ffe44d;\n  color: #003b79;\n}\n\n/* BARRE DE DÉFILEMENT */\n\n.home-menu-links::-webkit-scrollbar {\n  height: 6px;\n}\n\n.home-menu-links::-webkit-scrollbar-track {\n  background: #10315e;\n}\n\n.home-menu-links::-webkit-scrollbar-thumb {\n  background: #ffe44d;\n  border-radius: 10px;\n}\n\n/* =====================================\n   BANNIÈRE PRINCIPALE\n===================================== */\n\n.main-banner {\n  width: 100%;\n  background: #0754a6;\n}\n\n.main-banner img {\n  display: block;\n  width: 100%;\n  height: auto;\n}\n\n/* =====================================\n   CONTENU PRINCIPAL\n===================================== */\n\nmain {\n  max-width: 1180px;\n  margin: auto;\n  padding: 30px 15px;\n}\n\nmain section {\n  background: white;\n\n  padding: 35px;\n  margin-bottom: 25px;\n\n  border-radius: 12px;\n\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.06);\n}\n\nmain h2 {\n  color: #0754a6;\n\n  border-bottom: 2px solid #e3edf8;\n\n  padding-bottom: 12px;\n  margin-top: 0;\n}\n\nmain h3 {\n  color: #0754a6;\n}\n\n/* =====================================\n   SECTION HERO\n===================================== */\n\nmain .hero {\n  text-align: center;\n\n  background: linear-gradient(\n    135deg,\n    #eaf4ff,\n    #ffffff\n  );\n}\n\n.hero h2 {\n  border: none;\n  font-size: clamp(25px, 4vw, 37px);\n}\n\n.hero p {\n  font-size: 18px;\n}\n\n/* =====================================\n   GRILLE\n===================================== */\n\n.grid {\n  display: grid;\n\n  grid-template-columns:\n    repeat(auto-fit, minmax(min(100%, 260px), 1fr));\n\n  gap: 20px;\n}\n\n.card {\n  min-width: 0;\n\n  background: #f4f8fc;\n\n  padding: 24px;\n  border-radius: 10px;\n\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  margin-top: 0;\n}\n\n/* =====================================\n   ENCADRÉS\n===================================== */\n\n.highlight {\n  background: #eaf4ff;\n\n  border-left: 5px solid #168de0;\n\n  padding: 24px;\n  margin: 20px 0;\n\n  border-radius: 8px;\n}\n\n/* =====================================\n   BOUTONS\n===================================== */\n\n.button {\n  display: inline-block;\n\n  background: #0754a6;\n  color: white;\n\n  padding: 12px 22px;\n\n  border-radius: 7px;\n\n  text-decoration: none;\n  font-weight: bold;\n\n  margin: 10px 8px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n.button.secondary {\n  background: #e4f0ff;\n  color: #0754a6;\n}\n\n.button.secondary:hover {\n  background: #cce2ff;\n}\n\n/* =====================================\n   NOTES\n===================================== */\n\n.note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n.page-directory {\n  background: #f0f6ff;\n}\n\n.page-directory .card {\n  background: white;\n}\n\n/* =====================================\n   PIED DE PAGE\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n\n  text-align: center;\n\n  padding: 35px 15px;\n}\n\nfooter a {\n  color: white;\n}\n\n.footer-language-links {\n  display: flex;\n  flex-wrap: wrap;\n\n  justify-content: center;\n  align-items: center;\n\n  gap: 10px 18px;\n\n  max-width: 1100px;\n  margin: 25px auto;\n\n  padding: 20px 0;\n\n  border-top:\n    1px solid rgba(255,255,255,.2);\n\n  border-bottom:\n    1px solid rgba(255,255,255,.2);\n}\n\n.footer-language-links a {\n  color: white;\n\n  font-size: 14px;\n  font-weight: 600;\n\n  text-decoration: none;\n}\n\n.footer-language-links a:hover {\n  color: #ffe44d;\n  text-decoration: underline;\n}\n\n.footer-language-links\na[aria-current=\"page\"] {\n  color: #ffe44d;\n  font-weight: 800;\n}\n\n/* =====================================\n   MOBILE\n===================================== */\n\n@media (max-width: 767px) {\n\n  header {\n    padding: 15px 12px;\n  }\n\n  .main-nav {\n    gap: 6px;\n    padding: 8px 10px;\n  }\n\n  .language-dropdown > summary {\n    padding: 8px 10px;\n    font-size: 12px;\n  }\n\n  .language-options {\n    width: 170px;\n    max-height: 60vh;\n  }\n\n  .home-menu-links {\n    gap: 5px;\n  }\n\n  .home-menu-links > a {\n    padding: 8px 9px;\n    font-size: 11px;\n  }\n\n  main {\n    padding: 15px 10px;\n  }\n\n  main section {\n    padding: 22px;\n  }\n\n  .card {\n    padding: 19px;\n  }\n\n  .highlight {\n    padding: 18px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin: 10px 0;\n  }\n\n}\n\n/* =====================================\n   SMALL LANDSCAPE SCREEN\n===================================== */\n\n@media (max-height: 450px) {\n\n  .language-options {\n    max-height: 55vh;\n  }\n\n}\n\n</style>\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     EN-TÊTE\n===================================== -->\n\n<header id=\"home\">\n\n<h1>\nINITIATIVE DU CENTRE MONDIAL DE L'IA\n</h1>\n\n<p>\nVille spéciale de Goyang · Province de Gyeonggi · République de Corée\n</p>\n\n</header>\n\n\u003c!-- =====================================\n     NAVIGATION PRINCIPALE\n===================================== -->\n\n<nav\nclass=\"main-nav\"\naria-label=\"Navigation principale\"\n>\n\n\u003c!-- =====================================\n     SÉLECTEUR DE LANGUE\n===================================== -->\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"Choisir la langue du site\">\n🌐 Langue ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a href=\"index.html\" lang=\"ko\">\n한국어\n</a>\n\n<a href=\"index.html?lang=en\" lang=\"en\">\nEnglish\n</a>\n\n<a href=\"index.html?lang=zh\" lang=\"zh\">\n中文\n</a>\n\n<a href=\"index.html?lang=ja\" lang=\"ja\">\n日本語\n</a>\n\n<a href=\"index.html?lang=ru\" lang=\"ru\">\nРусский\n</a>\n\n<a href=\"index.html?lang=ar\"\nlang=\"ar\"\ndir=\"rtl\">\nالعربية\n</a>\n\n<a href=\"index.html?lang=es\" lang=\"es\">\nEspañol\n</a>\n\n<a href=\"index.html?lang=fr\"\nlang=\"fr\"\naria-current=\"page\">\nFrançais ✓\n</a>\n\n<a href=\"index.html?lang=de\" lang=\"de\">\nDeutsch\n</a>\n\n<a href=\"index.html?lang=it\" lang=\"it\">\nItaliano\n</a>\n\n</div>\n\n</details>\n\n\u003c!-- =====================================\n     MENU HORIZONTAL\n===================================== -->\n\n<div class=\"home-menu-links\">\n\n<a href=\"index.html?lang=fr\">\nAccueil\n</a>\n\n<a href=\"hub.html?lang=fr\">\nCentre mondial de l'IA\n</a>\n\n<a href=\"goyang.html?lang=fr\">\nPourquoi Goyang ?\n</a>\n\n<a href=\"agencies.html?lang=fr\">\nOrganisations internationales\n</a>\n\n<a href=\"strategy.html?lang=fr\">\nStratégie\n</a>\n\n<a href=\"committee.html?lang=fr\">\nComité citoyen\n</a>\n\n<a href=\"history.html?lang=fr\">\nChronologie\n</a>\n\n<a href=\"news.html?lang=fr\">\nActualités\n</a>\n\n<a href=\"press.html?lang=fr\">\nMédias\n</a>\n\n<a href=\"participate.html?lang=fr\">\nParticipation citoyenne\n</a>\n\n<a href=\"guide.html?lang=fr\">\nGuide\n</a>\n<a href=\"gallery.html?lang=fr\">Galerie de photos</a>\n<a href=\"library.html?lang=fr\">Bibliothèque numérique</a>\n<a href=\"resources.html?lang=fr\">Centre de ressources</a>\n\n</div>\n\n</nav>\n\n\u003c!-- =====================================\n     BANNIÈRE PRINCIPALE\n===================================== -->\n\n<div class=\"main-banner\">\n\n<img\nsrc=\"aihub-main-banner-fr.png\"\nalt=\"Initiative du Centre mondial de l'intelligence artificielle à Goyang\"\nloading=\"eager\"\nfetchpriority=\"high\">\n\n</div>\n\n<main>\n\n\u003c!-- =====================================\n     01. VISION\n===================================== -->\n\n<section class=\"hero\" id=\"vision\">\n\n<h2>\nL'intelligence artificielle au service de l'humanité\n</h2>\n\n<p>\nLa coopération internationale pour un avenir meilleur\n</p>\n\n<p>\nNous souhaitons promouvoir la coopération\nentre les organisations internationales,\nles gouvernements, les universités,\nles instituts de recherche,\nles entreprises et la société civile\nafin d'explorer les possibilités\noffertes par l'intelligence artificielle\npour relever les défis mondiaux communs.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nNotre vision\n</strong>\n\n<p>\nNous aspirons à faire de la Ville spéciale\nde Goyang un centre international\nde coopération en intelligence artificielle,\nde recherche scientifique et d'innovation,\ncontribuant au développement durable\net au bien-être de l'humanité.\n</p>\n\n</div>\n\n<a href=\"#goyang\" class=\"button\">\nPourquoi Goyang ?\n</a>\n\n<a href=\"#partnership\"\nclass=\"button secondary\">\nCoopération internationale\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     02. GLOBAL AI HUB\n===================================== -->\n\n<section id=\"hub\">\n\n<h2>\n1. Qu'est-ce que le Centre mondial de l'IA ?\n</h2>\n\n<p>\nLe Centre mondial de l'intelligence\nartificielle est une initiative visant\nà proposer la création d'une plateforme\ninternationale de coopération associant\nl'expertise des organisations\ninternationales aux capacités\ndes technologies avancées\nd'intelligence artificielle.\n</p>\n\n<p>\nCette initiative vise à explorer\nl'utilisation responsable de\nl'intelligence artificielle pour\nrépondre aux défis mondiaux\ndans des domaines tels que\nla santé publique,\nla sécurité alimentaire,\nle changement climatique,\nla protection de l'environnement,\nl'aide humanitaire,\nles migrations,\nl'emploi,\nl'éducation et\nla prévention des catastrophes.\n</p>\n\n<p>\nElle cherche également à favoriser\nle partage des connaissances,\nla recherche conjointe\net la coopération entre\nles organisations internationales,\nles institutions publiques,\nles universités,\nles centres de recherche,\nles entreprises et\nla société civile.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nCoopération internationale\n</h3>\n\n<p>\nPromouvoir le dialogue international,\nle partage des expériences\net le développement de partenariats\npour relever les défis mondiaux.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nRecherche et innovation\n</h3>\n\n<p>\nExplorer les applications responsables\nde l'intelligence artificielle\net encourager la recherche scientifique\nainsi que l'innovation technologique\nau service de l'intérêt général.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nApplications pratiques\n</h3>\n\n<p>\nÉtudier les possibilités de développer\ndes projets pilotes,\nd'évaluer les technologies\net d'appliquer l'intelligence artificielle\nà des problèmes d'intérêt public.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nRenforcement des capacités\n</h3>\n\n<p>\nEncourager la formation professionnelle,\nles échanges d'experts\net la diffusion internationale\ndes connaissances.\n</p>\n\n</div>\n\n</div>\n\n<a href=\"hub.html?lang=fr\" class=\"button\">\nEn savoir plus sur le Centre mondial de l'IA\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     03. GOYANG\n===================================== -->\n\n<section id=\"goyang\">\n\n<h2>\n2. Pourquoi la Ville spéciale de Goyang ?\n</h2>\n\n<p>\nLa Ville spéciale de Goyang\nest située dans la province de Gyeonggi,\nen République de Corée,\nau sein de la région métropolitaine\nde Séoul.\n</p>\n\n<p>\nLa ville dispose d'infrastructures\ndestinées aux expositions\net conférences internationales,\nd'établissements médicaux,\néducatifs et culturels,\nainsi que de services urbains\net de ressources naturelles.\n</p>\n\n<p>\nCes caractéristiques peuvent\nconstituer une base pour étudier\nla possibilité de développer\nun centre international\nde coopération en intelligence\nartificielle.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nSituation métropolitaine\n</h3>\n\n<p>\nGoyang se trouve dans\nla région métropolitaine de Séoul,\nce qui facilite les échanges\navec les réseaux économiques,\nscientifiques et institutionnels.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nCentre international KINTEX\n</h3>\n\n<p>\nLe Centre international\nd'expositions et de congrès KINTEX\ndispose d'installations\npour accueillir des salons,\ndes conférences et\ndes réunions internationales.\n</p>\n\n<p>\nCes infrastructures pourraient\nêtre utilisées pour organiser\ndes forums scientifiques,\ndes rencontres internationales\net de futurs programmes\nde coopération.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nCapacités médicales et scientifiques\n</h3>\n\n<p>\nGoyang accueille notamment\nle Centre national du cancer\nde Corée ainsi que\nd'autres établissements médicaux.\n</p>\n\n<p>\nCes ressources permettent\nd'envisager des possibilités\nde coopération dans les domaines\nde la santé publique,\nde la recherche médicale\net des applications responsables\nde l'intelligence artificielle.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nRessources environnementales\n</h3>\n\n<p>\nLes zones humides de Janghang\net les autres espaces naturels\nconstituent des ressources\nprécieuses pour la recherche\nenvironnementale,\nl'éducation et les initiatives\nde développement durable.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nCadre de vie\n</h3>\n\n<p>\nLa ville dispose de services\nrésidentiels, sanitaires,\néducatifs, culturels et urbains.\n</p>\n\n<p>\nLes besoins spécifiques\ndu personnel d'éventuelles\norganisations internationales\net de leurs familles devront\nêtre déterminés dans le cadre\ndes consultations appropriées.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nDéveloppement régional\n</h3>\n\n<p>\nLe renforcement de la coopération\ninternationale pourrait contribuer\nau développement de la recherche,\nà la création d'emplois\net à la croissance\ndes activités économiques connexes.\n</p>\n\n<p>\nLes résultats concrets dépendront\nde la nature et de l'ampleur\ndes projets qui seront\néventuellement mis en œuvre.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nCoopération internationale et développement durable\n</strong>\n\n<p>\nGoyang souhaite s'appuyer\nsur ses capacités existantes\npour explorer les possibilités\nde développement d'un centre\ninternational contribuant\nà relever les défis mondiaux\net à promouvoir le développement\ndurable de la ville.\n</p>\n\n</div>\n\n<a href=\"goyang.html?lang=fr\" class=\"button\">\nEn savoir plus sur Goyang\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     04. INTERNATIONAL ORGANIZATIONS\n===================================== -->\n\n<section id=\"organizations\">\n\n<h2>\n3. Organisations internationales et domaines potentiels de coopération\n</h2>\n\n<p>\nL'initiative du Centre mondial\nde l'intelligence artificielle\nenvisage des domaines potentiels\nde coopération liés aux missions\nde neuf organisations internationales.\n</p>\n\n<p>\nCes domaines sont présentés\nafin d'illustrer de futures\npossibilités de collaboration\net ne constituent ni des accords\nni des engagements confirmés.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nOMS (WHO) — Organisation mondiale de la Santé\n</h3>\n\n<p>\nSanté publique,\nprévention des maladies,\nrenforcement des systèmes de santé,\nanalyse des données médicales\net utilisation responsable\nde l'intelligence artificielle.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPAM (WFP) — Programme alimentaire mondial\n</h3>\n\n<p>\nSécurité alimentaire,\naide humanitaire,\ndurabilité des chaînes\nd'approvisionnement\net analyse des crises alimentaires.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPNUE (UNEP) — Programme des Nations Unies pour l'environnement\n</h3>\n\n<p>\nChangement climatique,\nprotection de l'environnement,\nbiodiversité et suivi\ndes conditions environnementales.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nHCR (UNHCR) — Haut-Commissariat des Nations Unies pour les réfugiés\n</h3>\n\n<p>\nProtection des réfugiés,\ndéplacements forcés,\naide humanitaire\net utilisation responsable\ndes données dans les activités\nde protection.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nOIM (IOM) — Organisation internationale pour les migrations\n</h3>\n\n<p>\nMigrations internationales,\nsoutien aux personnes déplacées,\naide humanitaire\net solutions numériques\npour les services liés\naux migrations.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nOIT (ILO) — Organisation internationale du Travail\n</h3>\n\n<p>\nEmploi,\ndroits des travailleurs,\nformation professionnelle\net analyse des effets\nde l'intelligence artificielle\nsur l'avenir du travail.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUIT (ITU) — Union internationale des télécommunications\n</h3>\n\n<p>\nTélécommunications numériques,\ninfrastructures de connectivité,\ncommunications d'urgence\net systèmes d'alerte précoce\nen cas de catastrophe.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nUNICEF — Fonds des Nations Unies pour l'enfance\n</h3>\n\n<p>\nProtection de l'enfance,\néducation,\ninclusion numérique\net utilisation responsable\nde l'intelligence artificielle\ndans le respect des droits\ndes enfants.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPNUD (UNDP) — Programme des Nations Unies pour le développement\n</h3>\n\n<p>\nDéveloppement durable,\nréponse aux crises,\nrenforcement des capacités\ninstitutionnelles\net applications de\nl'intelligence artificielle\ndans les programmes\nde développement.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nPrécision importante\n</strong>\n\n<p>\nLes organisations internationales\nmentionnées ci-dessus sont\nprésentées uniquement\nen relation avec leurs\nmandats institutionnels\net les domaines potentiels\nde coopération future.\n</p>\n\n<p>\nCela ne signifie pas\nque ces organisations\naient confirmé leur participation\nà cette initiative,\nni qu'elles aient accepté\nd'établir des bureaux\nou de transférer des unités\ndans la Ville spéciale de Goyang.\n</p>\n\n<p>\nToute coopération future\nnécessitera des consultations\nofficielles, les décisions\ninstitutionnelles appropriées\net les procédures\nd'approbation applicables.\n</p>\n\n</div>\n\n<a href=\"agencies.html?lang=fr\" class=\"button\">\nEn savoir plus sur les neuf organisations\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     05. DEVELOPMENT STRATEGY\n===================================== -->\n\n<section id=\"strategy\">\n\n<h2>\n4. Stratégie de développement en trois étapes\n</h2>\n\n<p>\nL'initiative du Centre mondial\nde l'intelligence artificielle\npropose une approche progressive\nen trois étapes tenant compte\ndes besoins réels\ndes éventuels partenaires\ninternationaux.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nÉtape 1 — Installation initiale\n</h3>\n\n<p>\nExaminer les conditions\nnécessaires pour faciliter\nle démarrage stable\ndes activités d'éventuelles\norganisations internationales\net institutions partenaires\nà Goyang.\n</p>\n\n<p>\nLes domaines d'étude\npourraient comprendre\nles bureaux,\nles transports,\nle logement,\nles soins de santé,\nl'éducation\net d'autres services.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nÉtape 2 — Soutien opérationnel\n</h3>\n\n<p>\nPromouvoir la coopération\nentre les institutions publiques,\nles universités,\nles centres de recherche,\nles entreprises\net la société civile.\n</p>\n\n<p>\nExplorer les possibilités\nde recherche conjointe,\nde conférences internationales,\nde projets pilotes en IA\net d'échanges d'experts.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nÉtape 3 — Croissance durable partagée\n</h3>\n\n<p>\nDévelopper une coopération\nà long terme contribuant\naux objectifs des organisations\ninternationales\net au développement durable\nde Goyang.\n</p>\n\n<p>\nLes domaines potentiels\ncomprennent la recherche\nscientifique,\nles possibilités d'emploi,\nles activités économiques\net le développement régional.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"highlight\">\n\n<strong>\nInstallation initiale\n→ Soutien opérationnel\n→ Croissance partagée\n</strong>\n\n<p>\nLes installations,\nles ressources financières,\nles mesures institutionnelles\net les programmes\nde coopération devront\nêtre définis au moyen\nde consultations\net de procédures officielles.\n</p>\n\n</div>\n\n<a href=\"strategy.html?lang=fr\" class=\"button\">\nEn savoir plus sur la stratégie\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     06. CITIZENS COMMITTEE\n===================================== -->\n\n<section id=\"committee\">\n\n<h2>\n5. Comité citoyen pour l'initiative\n</h2>\n\n<p>\nLe Comité citoyen pour promouvoir\nl'accueil du Centre mondial\nde l'intelligence artificielle\ndans la Ville spéciale de Goyang\nest une initiative de la\nsociété civile destinée\nà sensibiliser le public\net à élargir la participation\ncitoyenne.\n</p>\n\n<p>\nLe Comité souhaite soutenir\nle débat public sur\nles possibilités de coopération\ninternationale,\nle développement de\nl'intelligence artificielle\net la croissance durable\nde la ville.\n</p>\n\n<p>\nSes activités comprennent\nla diffusion d'informations,\nla promotion de la participation\ncitoyenne,\nle débat sur les propositions\nstratégiques\net la communication\navec les institutions concernées.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nNos principes\n</strong>\n\n<p>\nTransparence,\nresponsabilité,\nparticipation citoyenne\nconstructive\net respect des procédures\nofficielles de décision.\n</p>\n\n</div>\n\n<a href=\"committee.html?lang=fr\" class=\"button\">\nEn savoir plus sur le Comité\n</a>\n\n<a href=\"participate.html?lang=fr\"\nclass=\"button secondary\">\nParticipation citoyenne\n</a>\n\n</section>\n\n\u003c!-- =====================================\n     07. INTERNATIONAL PARTNERSHIP\n===================================== -->\n\n<section id=\"partnership\">\n\n<h2>\n6. Possibilités de coopération internationale\n</h2>\n\n<p>\nL'initiative du Centre mondial\nde l'intelligence artificielle\ncherche à encourager le dialogue\navec les organisations\net institutions intéressées\npar le développement responsable\nde l'intelligence artificielle,\nla coopération internationale\net le développement durable.\n</p>\n\n<p>\nLes domaines potentiels\nde collaboration comprennent :\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nDialogue institutionnel\n</h3>\n\n<p>\nÉchanges d'expériences\net de perspectives\nsur la coopération internationale,\nla gouvernance de l'intelligence\nartificielle\net l'innovation technologique\nau service de l'intérêt général.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nCoopération scientifique\n</h3>\n\n<p>\nExploration des possibilités\nde recherche multidisciplinaire,\nde partage des connaissances\net de développement de réseaux\nscientifiques internationaux.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nProjets technologiques\n</h3>\n\n<p>\nÉtude des possibilités\nde projets pilotes,\nd'applications pratiques\net d'évaluation des technologies\nd'intelligence artificielle\nresponsable.\n</p>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nÉchanges d'experts\n</h3>\n\n<p>\nExploration de programmes\nde formation,\nde séminaires,\nde forums internationaux\net d'activités de renforcement\ndes capacités.\n</p>\n\n</div>\n\n</div>\n\n<p class=\"note\">\nLes domaines mentionnés\nreprésentent des possibilités\npotentielles de collaboration\net n'impliquent pas\nl'existence d'accords confirmés\navec des organisations\ninternationales.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     08. CONTACT\n===================================== -->\n\n<section id=\"contact\">\n\n<h2>\n7. Contact et informations complémentaires\n</h2>\n\n<p>\nNous accueillons favorablement\nl'intérêt des organisations\ninternationales,\ndes instituts de recherche,\ndes experts et des citoyens\npour le concept du Centre\nmondial de l'intelligence\nartificielle et les activités\ndu Comité citoyen.\n</p>\n\n<p>\nVous pouvez obtenir\ndes informations complémentaires\nen consultant les pages\nen français de ce site.\n</p>\n\n<p>\nLa version coréenne\ndu site propose également\ndes documents et services\nsupplémentaires en coréen.\n</p>\n\n<a href=\"guide.html?lang=fr\" class=\"button\">\nGuide du site\n</a>\n\n<a href=\"index.html\"\nclass=\"button secondary\">\nVersion coréenne\n</a>\n\n<div class=\"highlight\">\n\n<strong>\nInitiative du Centre mondial de l'intelligence artificielle\n<br>\nVille spéciale de Goyang\n<br>\nProvince de Gyeonggi\n<br>\nRépublique de Corée\n</strong>\n\n<p>\nComité citoyen pour promouvoir\nl'accueil du Centre mondial\nde l'intelligence artificielle\nà Goyang\n</p>\n\n<p class=\"note\">\nCe site présente une initiative\nde la société civile\net ses activités.\nIl ne signifie pas\nque les autorités gouvernementales\naient pris une décision officielle\nconcernant la création\ndu Centre mondial\nde l'intelligence artificielle,\nni qu'une organisation\ninternationale ait confirmé\nsa participation.\n</p>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     09. FRENCH PAGE DIRECTORY\n===================================== -->\n\n<section id=\"directory\" class=\"page-directory\">\n\n<h2>\n8. Rubriques du site en français\n</h2>\n\n<p>\nLes pages suivantes proposent\ndes informations plus détaillées\nsur le Centre mondial de l'IA,\nla Ville spéciale de Goyang,\nla coopération internationale\net la participation citoyenne.\n</p>\n\n<div class=\"grid\">\n\n<div class=\"card\">\n\n<h3>\nCentre mondial de l'IA\n</h3>\n\n<p>\nConcept, objectifs\net domaines potentiels\nde coopération internationale.\n</p>\n\n<a href=\"hub.html?lang=fr\" class=\"button\">\nEn savoir plus\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nPourquoi Goyang ?\n</h3>\n\n<p>\nAtouts géographiques,\ninfrastructures\net possibilités de développement.\n</p>\n\n<a href=\"goyang.html?lang=fr\" class=\"button\">\nEn savoir plus\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nOrganisations internationales\n</h3>\n\n<p>\nNeuf organisations internationales\net domaines potentiels\nde collaboration.\n</p>\n\n<a href=\"agencies.html?lang=fr\" class=\"button\">\nEn savoir plus\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nStratégie de développement\n</h3>\n\n<p>\nInstallation initiale,\nsoutien opérationnel\net croissance partagée.\n</p>\n\n<a href=\"strategy.html?lang=fr\" class=\"button\">\nEn savoir plus\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nComité citoyen\n</h3>\n\n<p>\nMission, organisation\net principales activités\ndu Comité.\n</p>\n\n<a href=\"committee.html?lang=fr\" class=\"button\">\nEn savoir plus\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nChronologie\n</h3>\n\n<p>\nPrincipaux événements\net étapes de développement\nde l'initiative.\n</p>\n\n<a href=\"history.html?lang=fr\" class=\"button\">\nEn savoir plus\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nActualités\n</h3>\n\n<p>\nInformations sur les activités,\nles événements\net les développements récents.\n</p>\n\n<a href=\"news.html?lang=fr\" class=\"button\">\nVoir les actualités\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nMédias\n</h3>\n\n<p>\nArticles de presse,\nreportages\net autres documents\nd'information.\n</p>\n\n<a href=\"press.html?lang=fr\" class=\"button\">\nVoir les médias\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nParticipation citoyenne\n</h3>\n\n<p>\nInformations sur les possibilités\nde soutenir l'initiative\net de participer\nà ses activités.\n</p>\n\n<a href=\"participate.html?lang=fr\" class=\"button\">\nComment participer\n</a>\n\n</div>\n\n<div class=\"card\">\n\n<h3>\nGuide du site\n</h3>\n\n<p>\nInformations sur l'utilisation\ndu site et la recherche\nde documents.\n</p>\n\n<a href=\"guide.html?lang=fr\" class=\"button\">\nOuvrir le guide\n</a>\n\n</div>\n\n</div>\n\n</section>\n\n\u003c!-- =====================================\n     10. MULTILINGUAL INFORMATION\n===================================== -->\n\n<section id=\"languages\">\n\n<h2>\n9. Site web multilingue\n</h2>\n\n<p>\nLe site de l'initiative\ndu Centre mondial de l'intelligence\nartificielle propose des pages\nprincipales en dix langues\npour les visiteurs\nde différents pays,\nles organisations internationales,\nles institutions de recherche,\nles entreprises et les citoyens.\n</p>\n\n<p>\nVous pouvez sélectionner\nvotre langue préférée\nà l'aide du sélecteur\nsitué en haut de la page.\n</p>\n\n<p>\nLa version coréenne\npropose des documents\net services supplémentaires\nen coréen.\n</p>\n\n<div class=\"highlight\">\n\n<strong>\nLangues disponibles\n</strong>\n\n<p>\n<a href=\"index.html\" lang=\"ko\">\n한국어 — Coréen\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=en\" lang=\"en\">\nEnglish — Anglais\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=zh\" lang=\"zh\">\n中文 — Chinois\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ja\" lang=\"ja\">\n日本語 — Japonais\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ru\" lang=\"ru\">\nРусский — Russe\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=ar\"\nlang=\"ar\" dir=\"rtl\">\nالعربية — Arabe\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=es\" lang=\"es\">\nEspañol — Espagnol\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\"\nlang=\"fr\"\naria-current=\"page\">\nFrançais — Français ✓\n</a>\n</p>\n\n<p>\n<a href=\"index.html?lang=de\" lang=\"de\">\
