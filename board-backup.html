<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>시민참여 게시판 | 글로벌 AI 허브 고양</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Malgun Gothic", Arial, sans-serif;
  background: #f4f8fc;
  color: #17315b;
  line-height: 1.7;
}

/* 상단 */

header {
  background: #0754a6;
  color: white;
  text-align: center;
  padding: 35px 15px;
}

header h1 {
  margin: 0 0 12px;
  font-size: clamp(25px, 4vw, 36px);
}

header p {
  margin: 10px 0;
}

/* 상단 메뉴 */

.top-menu {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 25px;
}

.top-menu a {
  display: inline-block;
  background: white;
  color: #0754a6;
  padding: 10px 18px;
  border-radius: 7px;
  text-decoration: none;
  font-weight: bold;
}

/* 본문 */

main {
  max-width: 1100px;
  margin: auto;
  padding: 35px 15px;
}

.board-panel {
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
  color: #0754a6;
}

/* 버튼 */

button {
  padding: 11px 18px;
  border: 0;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

.primary {
  background: #0754a6;
  color: white;
}

.secondary {
  background: #eaf1fa;
  color: #17315b;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* 게시판 목록 */

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th, td {
  padding: 14px;
  border-bottom: 1px solid #dce6f2;
  text-align: left;
}

th {
  background: #eaf4ff;
}

.post-title {
  color: #0754a6;
  cursor: pointer;
  font-weight: bold;
  text-decoration: underline;
}

/* 글쓰기 */

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font: inherit;
}

textarea {
  min-height: 250px;
  resize: vertical;
}

/* 게시글 상세 */

.post-content {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  padding: 25px 0;
  border-top: 1px solid #dce6f2;
  border-bottom: 1px solid #dce6f2;
}

/* 메시지 */

#message {
  white-space: pre-line;
  margin: 15px 0;
}

/* 하단 */

footer {
  background: #10315e;
  color: white;
  text-align: center;
  padding: 30px 15px;
  margin-top: 40px;
}

/* 모바일 */

@media (max-width: 600px) {

  .board-panel {
    padding: 18px;
  }

  th, td {
    padding: 10px;
    font-size: 13px;
  }

  .top-menu a {
    padding: 9px 12px;
    font-size: 13px;
  }

}

</style>

</head>

<body>

<header>

<h1>시민참여 게시판</h1>

<p>
경기도 글로벌 AI 허브 유치<br>
고양특례시 범시민추진위원회
</p>

<div class="top-menu">

<a href="index.html">
← 홈페이지
</a>

<a href="login.html">
로그인
</a>

<a href="signup.html">
회원가입
</a>

</div>

</header>

<main>

<section class="board-panel">

<h2>시민참여 게시판</h2>

<p>
글로벌 AI 허브 유치를 위한 시민들의 의견과
활동 소식을 공유하는 공간입니다.
</p>

<p>
비회원도 게시글을 읽을 수 있으며,
관리자 승인을 받은 회원만 글을 작성할 수 있습니다.
</p>

<p id="message" role="status" aria-live="polite">
게시판을 불러오고 있습니다.
</p>

<!-- 게시글 목록 -->

<div id="listView">

<button
id="writeButton"
class="primary"
hidden>
글쓰기
</button>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>번호</th>
<th>제목</th>
<th>작성일</th>
</tr>
</thead>

<tbody id="postList"></tbody>

</table>

</div>

</div>

<!-- 게시글 상세 -->

<div id="detailView" hidden>

<h2 id="detailTitle"></h2>

<p id="detailDate"></p>

<div
id="detailContent"
class="post-content">
</div>

<p>
<button
id="backButton"
class="secondary">
목록으로
</button>
</p>

</div>

<!-- 글쓰기 -->

<div id="writeView" hidden>

<h2>게시글 작성</h2>

<form id="postForm">

<div class="form-group">

<label for="postTitle">
제목
</label>

<input
type="text"
id="postTitle"
maxlength="200"
required>

</div>

<div class="form-group">

<label for="postContent">
내용
</label>

<textarea
id="postContent"
required></textarea>

</div>

<button
type="submit"
id="submitButton"
class="primary">
게시글 등록
</button>

<button
type="button"
id="cancelButton"
class="secondary">
취소
</button>

</form>

</div>

</section>

</main>

<footer>

경기도 글로벌 AI 허브 유치<br>
고양특례시 범시민추진위원회

</footer>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* =====================================
   Supabase 연결
===================================== */

const SUPABASE_URL =
  "https://gugkwqpvtwivqudkimvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* 화면 요소 */

const message =
  document.getElementById("message");

const listView =
  document.getElementById("listView");

const detailView =
  document.getElementById("detailView");

const writeView =
  document.getElementById("writeView");

const postList =
  document.getElementById("postList");

const writeButton =
  document.getElementById("writeButton");

const postForm =
  document.getElementById("postForm");

const submitButton =
  document.getElementById("submitButton");

let currentUser = null;
let approvedMember = false;

/* =====================================
   안내 메시지
===================================== */

function showMessage(text, isError = false) {

  message.textContent = text;

  message.style.color =
    isError ? "#b91c1c" : "#0754a6";

}

/* =====================================
   화면 전환
===================================== */

function showView(view) {

  listView.hidden = true;
  detailView.hidden = true;
  writeView.hidden = true;

  view.hidden = false;

}

/* =====================================
   회원 권한 확인
===================================== */

async function checkMember() {

  const { data, error } =
    await supabase.auth.getUser();

  if (error || !data.user) {
    currentUser = null;
    approvedMember = false;
    return;
  }

  currentUser = data.user;

  const result =
    await supabase.rpc("is_approved_member");

  if (result.error) {
    approvedMember = false;
    showMessage(
      "회원 권한 확인 중 오류가 발생했습니다.",
      true
    );
    return;
  }

  approvedMember = result.data === true;

  writeButton.hidden = !approvedMember;

}

/* =====================================
   게시글 목록
===================================== */

async function loadPosts() {

  showView(listView);

  showMessage("게시글을 불러오고 있습니다.");

  const { data, error } =
    await supabase
      .from("board_posts")
      .select("id, title, created_at")
      .order("created_at", {
        ascending: false
      });

  if (error) {
    showMessage(
      "게시글을 불러오지 못했습니다.\n" +
      error.message,
      true
    );
    return;
  }

  postList.replaceChildren();

  if (data.length === 0) {
    showMessage(
      "아직 등록된 게시글이 없습니다."
    );
    return;
  }

  data.forEach(post => {

    const row =
      document.createElement("tr");

    const idCell =
      document.createElement("td");

    idCell.textContent = post.id;

    const titleCell =
      document.createElement("td");

    const titleButton =
      document.createElement("button");

    titleButton.type = "button";
    titleButton.className = "post-title";
    titleButton.textContent = post.title;

    titleButton.style.background = "none";
    titleButton.style.border = "none";
    titleButton.style.padding = "0";
    titleButton.style.textAlign = "left";

    titleButton.addEventListener("click", () => {
      openPost(post.id);
    });

    titleCell.appendChild(titleButton);

    const dateCell =
      document.createElement("td");

    dateCell.textContent =
      new Date(post.created_at)
        .toLocaleDateString("ko-KR");

    row.append(
      idCell,
      titleCell,
      dateCell
    );

    postList.appendChild(row);

  });

  showMessage(
    `게시글 ${data.length}건을 불러왔습니다.`
  );

}

/* =====================================
   게시글 상세 보기
===================================== */

async function openPost(postId) {

  const { data, error } =
    await supabase
      .from("board_posts")
      .select("id, title, content, created_at")
      .eq("id", postId)
      .single();

  if (error) {
    showMessage(
      "게시글을 불러오지 못했습니다.",
      true
    );
    return;
  }

  document.getElementById("detailTitle")
    .textContent = data.title;

  document.getElementById("detailDate")
    .textContent =
      new Date(data.created_at)
        .toLocaleString("ko-KR");

  document.getElementById("detailContent")
    .textContent = data.content;

  showView(detailView);

  showMessage("");

}

/* =====================================
   글쓰기
===================================== */

writeButton.addEventListener("click", () => {

  if (!approvedMember) {
    showMessage(
      "관리자 승인을 받은 회원만 글을 작성할 수 있습니다.",
      true
    );
    return;
  }

  postForm.reset();

  showView(writeView);

  showMessage("");

});

/* =====================================
   게시글 등록
===================================== */

postForm.addEventListener("submit", async event => {

  event.preventDefault();

  if (!currentUser || !approvedMember) {
    showMessage(
      "글쓰기 권한이 없습니다.",
      true
    );
    return;
  }

  const title =
    document.getElementById("postTitle")
      .value.trim();

  const content =
    document.getElementById("postContent")
      .value.trim();

  if (!title || !content) {
    showMessage(
      "제목과 내용을 입력해 주세요.",
      true
    );
    return;
  }

  submitButton.disabled = true;

  showMessage("게시글을 등록하고 있습니다.");

  try {

    const { error } =
      await supabase
        .from("board_posts")
        .insert({
          author_id: currentUser.id,
          title: title,
          content: content
        });

    if (error) throw error;

    postForm.reset();

    await loadPosts();

    showMessage(
      "게시글이 정상적으로 등록되었습니다."
    );

  } catch (error) {

    showMessage(
      "게시글 등록 중 오류가 발생했습니다.\n" +
      error.message,
      true
    );

  } finally {

    submitButton.disabled = false;

  }

});

/* =====================================
   목록 및 취소 버튼
===================================== */

document.getElementById("backButton")
  .addEventListener("click", loadPosts);

document.getElementById("cancelButton")
  .addEventListener("click", loadPosts);

/* =====================================
   최초 실행
===================================== */

async function initialize() {

  await checkMember();

  await loadPosts();

}

initialize();

</script>

</body>
</html>
