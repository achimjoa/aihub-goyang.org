lic à l'initiative\ndu Centre mondial de l'IA\nen affichant\nun autocollant promotionnel\nsur votre véhicule.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/cisRHEsN61pxVycG8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Demander un autocollant pour véhicule\n</a>\n\n<p class=\"small-note\">\nFormulaire disponible en coréen.\n</p>\n\n</article>\n\n\u003c!-- COMMUNAUTÉ KAKAOTALK -->\n\n<article class=\"card\">\n\n<h3>\nCommunauté KakaoTalk\n</h3>\n\n<p>\nRejoignez le groupe KakaoTalk\ndu Comité\npour échanger des informations\nsur les activités,\nla participation citoyenne\net les évolutions\nliées à l'initiative\ndu Centre mondial de l'IA.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://invite.kakao.com/tc/6vBTJeOAAa\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Rejoindre la communauté KakaoTalk\n</a>\n\n<p class=\"small-note\">\nLes discussions\nse déroulent principalement en coréen.\n</p>\n\n</article>\n\n\u003c!-- GROUPE FACEBOOK -->\n\n<article class=\"card\">\n\n<h3>\nGroupe de discussion Facebook\n</h3>\n\n<p>\nPartagez des informations,\néchangez des points de vue\net participez\naux discussions publiques\nsur le projet\nde Centre mondial de l'IA.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://fb.me/g/8JVQBabwP/W4YofuHk\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Rejoindre le groupe Facebook\n</a>\n\n</article>\n\n\u003c!-- GALERIE -->\n\n<article class=\"card\">\n\n<h3>\nGalerie des activités du Comité\n</h3>\n\n<p>\nDécouvrez les photographies\nprésentant les activités\ndu Comité citoyen de promotion\net la campagne de soutien du public.\n</p>\n\n<a\n  class=\"button\"\n  href=\"gallery.html?lang=fr\"\n>\n  Voir la galerie des activités (coréen)\n</a>\n\n</article>\n\n</div>\n\n\u003c!-- INFORMATIONS SUR LA PARTICIPATION -->\n\n<section class=\"notice\">\n\n<h2>\nInformations sur la participation\n</h2>\n\n<p>\nLe Comité citoyen de promotion\norganise plusieurs programmes\nde participation,\nnotamment\nla campagne de signatures,\nl'inscription au Comité,\nl'adhésion en tant que membre de soutien,\nles demandes de banderoles promotionnelles\net les demandes d'autocollants\npour véhicules.\n</p>\n\n<p>\nChaque demande est soumise\nau moyen du formulaire en ligne correspondant.\nLes participants doivent examiner\nl'objectif de leur demande\nainsi que les informations\nrelatives à la collecte\net à l'utilisation\ndes données personnelles\navant de déposer leur candidature.\n</p>\n\n<p>\nLes contributions\ndes membres de soutien\net les frais\ndes banderoles promotionnelles\ndoivent être versés uniquement\nsur les comptes bancaires\nofficiellement désignés\npar le Comité.\n</p>\n\n<p>\nVeuillez vérifier\nles coordonnées bancaires\net les conditions de paiement\nles plus récentes\navant d'effectuer un virement.\n</p>\n\n<p>\nPour plus d'informations\nsur la protection\ndes données personnelles,\nveuillez consulter\nla\n<a href=\"index.html?view=privacy\">\nPolitique de confidentialité (coréen)\n</a>.\n</p>\n\n</section>\n\n\u003c!-- PAGES ASSOCIÉES -->\n\n<section class=\"notice\">\n\n<h2>\nEn savoir plus\n</h2>\n\n<p>\nDécouvrez le Comité,\nses objectifs\net l'initiative\ndu Centre mondial de l'IA.\n</p>\n\n<a\n  class=\"button\"\n  href=\"committee.html?lang=fr\"\n>\n  Présentation du Comité\n</a>\n\n<a\n  class=\"button\"\n  href=\"hub.html?lang=fr\"\n>\n  Présentation du Centre mondial de l'IA\n</a>\n\n<a\n  class=\"button\"\n  href=\"news.html?lang=fr\"\n>\n  Actualités et annonces\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIED DE PAGE -->\n\n<footer>\n\n<p>\n<strong>\nComité citoyen de promotion<br>\npour l'implantation du Centre mondial de l'IA<br>\ndans la ville spéciale de Goyang\n</strong>\n</p>\n\n<p>\nProvince de Gyeonggi,<br>\nRépublique de Corée\n</p>\n\n<p>\nAvec les citoyens,<br>\navec la province de Gyeonggi<br>\net avec le monde.\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\">\nAccueil — Français\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     MODULE SUPABASE DES COMPTES BANCAIRES\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   CONNEXION SUPABASE\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   AFFICHAGE AUTOMATIQUE DES COMPTES\n===================================== */\n\nasync function loadPaymentAccounts() {\n\n  const targets = {\n    membership: \"membershipAccountInfo\",\n    banner: \"bannerAccountInfo\"\n  };\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"payment_accounts\")\n        .select(\n          \"account_type, bank_name, account_number, account_holder\"\n        );\n\n    if (error) {\n      throw error;\n    }\n\n    for (const account of data || []) {\n\n      const targetId =\n        targets[account.account_type];\n\n      if (!targetId) continue;\n\n      const container =\n        document.getElementById(targetId);\n\n      if (!container) continue;\n\n      const bank =\n        String(\n          account.bank_name || \"\"\n        ).trim();\n\n      const number =\n        String(\n          account.account_number || \"\"\n        ).trim();\n\n      const holder =\n        String(\n          account.account_holder || \"\"\n        ).trim();\n\n      if (\n        !bank ||\n        !number ||\n        !holder\n      ) {\n        continue;\n      }\n\n      container.replaceChildren();\n\n      /* TITRE */\n\n      const title =\n        document.createElement(\"strong\");\n\n      title.textContent =\n        \"Compte bancaire désigné\";\n\n      /* BANQUE */\n\n      const bankLine =\n        document.createElement(\"p\");\n\n      bankLine.textContent =\n        \"Banque : \" + bank;\n\n      /* NUMÉRO DE COMPTE */\n\n      const numberLine =\n        document.createElement(\"p\");\n\n      numberLine.textContent =\n        \"Numéro de compte : \" + number;\n\n      /* TITULAIRE DU COMPTE */\n\n      const holderLine =\n        document.createElement(\"p\");\n\n      holderLine.textContent =\n        \"Titulaire du compte : \" + holder;\n\n      container.append(\n        title,\n        bankLine,\n        numberLine,\n        holderLine\n      );\n\n      container.hidden = false;\n\n    }\n\n    console.log(\n      \"Informations bancaires chargées.\"\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"Échec du chargement des comptes bancaires :\",\n      error\n    );\n\n  }\n\n}\n\n/* =====================================\n   CHARGEMENT INITIAL\n===================================== */\n\nloadPaymentAccounts();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=it": "<!DOCTYPE html>\n<html lang=\"it\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nCentro di partecipazione dei cittadini |\nIniziativa per un Polo Globale dell'IA\n</title>\n\n<meta\n  name=\"description\"\n  content=\"Partecipa all'iniziativa per un Polo Globale dell'IA nella Città Speciale di Goyang attraverso la campagna di sostegno pubblico, l'iscrizione al Comitato, l'adesione come socio sostenitore e le attività della comunità.\"\n>\n\n<style>\n\n/* =====================================\n   IMPOSTAZIONI GENERALI\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   INTESTAZIONE\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n/* =====================================\n   CONTENUTO PRINCIPALE\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  font-size: 28px;\n}\n\n.intro strong {\n  color: #0754a6;\n}\n\n/* =====================================\n   GRIGLIA DELLE ATTIVITÀ\n===================================== */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: white;\n  border-radius: 12px;\n  padding: 28px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.08);\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  color: #0754a6;\n  font-size: 22px;\n  margin-top: 0;\n}\n\n.card p {\n  color: #46566d;\n}\n\n/* =====================================\n   PULSANTI\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover,\n.button:focus-visible {\n  background: #003a7a;\n}\n\n/* =====================================\n   CAMPAGNA DI SOSTEGNO\n===================================== */\n\n.signature {\n  background: #eaf4ff;\n  border: 2px solid #168de0;\n  padding: 30px;\n  border-radius: 12px;\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.signature h2 {\n  color: #0754a6;\n  font-size: 30px;\n}\n\n.signature p {\n  font-size: 18px;\n}\n\n/* =====================================\n   AVVISI\n===================================== */\n\n.notice {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  margin-top: 35px;\n}\n\n.notice h2 {\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 30px;\n}\n\n.small-note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   INFORMAZIONI BANCARIE\n===================================== */\n\n.payment-account-info {\n  margin: 15px 0;\n  padding: 16px;\n  background: #eaf4ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 8px;\n  color: #17315b;\n  font-size: 15px;\n  line-height: 1.8;\n  overflow-wrap: anywhere;\n}\n\n.payment-account-info[hidden] {\n  display: none !important;\n}\n\n.payment-account-info strong {\n  display: block;\n  color: #0754a6;\n  margin-bottom: 5px;\n}\n\n.payment-account-info p {\n  margin: 5px 0;\n}\n\n/* =====================================\n   PIÈ DI PAGINA\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   VERSIONE MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .signature {\n    padding: 20px;\n  }\n\n  .signature h2 {\n    font-size: 25px;\n  }\n\n  .card {\n    padding: 22px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     INTESTAZIONE\n===================================== -->\n\n<header>\n\n<h1>\nCentro di partecipazione dei cittadini\n</h1>\n\n<p>\nIniziativa per un Polo Globale dell'IA<br>\nCittà Speciale di Goyang,<br>\nProvincia di Gyeonggi,<br>\nRepubblica di Corea\n</p>\n\n<p>\nCostruire un nuovo futuro per Goyang<br>\nattraverso la partecipazione dei cittadini\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=it\"\n  class=\"home-link\"\n>\n  ← Homepage italiana\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     INTRODUZIONE\n===================================== -->\n\n<div class=\"intro\">\n\n<h2>\nPortiamo il Polo Globale dell'IA a Goyang!\n</h2>\n\n<p>\n\n<strong>\nNuove opportunità di crescita per Goyang!\n</strong>\n\n<br>\n\n<strong>\nPiù posti di lavoro qualificati per Goyang!\n</strong>\n\n</p>\n\n<p>\nIl Polo Globale dell'IA proposto\nrappresenta un'importante opportunità\nper la Città Speciale di Goyang\ndi svilupparsi come centro\ndi cooperazione internazionale\ne di industrie legate\nall'intelligenza artificiale.\n</p>\n\n<p>\nIl Comitato Civico Promotore\nintende ampliare\nla comprensione pubblica\ndell'iniziativa\ne incoraggiare\nla partecipazione volontaria\ndei cittadini,\ndei professionisti\ne delle organizzazioni civiche.\n</p>\n\n<p>\n\n<strong>\nLa tua partecipazione\npuò contribuire\na rafforzare il sostegno pubblico\nper l'insediamento\ndel Polo Globale dell'IA\nnella Città Speciale di Goyang.\n</strong>\n\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     INFORMAZIONI PER I VISITATORI\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nInformazioni per i visitatori internazionali\n</strong>\n\n<p>\nQuesta pagina presenta\nin lingua italiana\ni programmi di partecipazione\ndei cittadini\npromossi dal Comitato.\n</p>\n\n<p>\nI moduli di iscrizione\nsono attualmente disponibili\nin lingua coreana.\nPrima di inviare informazioni personali,\nsi prega di leggere attentamente\nle informazioni contenute\nin ciascun modulo.\n</p>\n\n<p>\nI contributi finanziari\ne le relative procedure\ndi partecipazione\nsono soggetti\nalle norme e ai requisiti\napplicabili del Comitato.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     CAMPAGNA DI SOSTEGNO DI 100.000 CITTADINI\n===================================== -->\n\n<section class=\"signature\">\n\n<h2>\nCampagna di sostegno di 100.000 cittadini\n</h2>\n\n<p>\nPartecipa alla campagna pubblica\ndi raccolta firme\na sostegno dell'iniziativa\nper l'insediamento\ndel Polo Globale dell'IA\nnella Città Speciale di Goyang.\n</p>\n\n<p>\nRiunendo le voci\ndei singoli cittadini,\nintendiamo rafforzare\nla consapevolezza pubblica\ne il sostegno\nallo sviluppo futuro di Goyang.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Partecipa alla campagna di sostegno online\n</a>\n\n<p class=\"small-note\">\nModulo di partecipazione in lingua coreana.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     PROGRAMMI DI PARTECIPAZIONE\n===================================== -->\n\n<div class=\"grid\">\n\n\u003c!-- =====================================\n     ISCRIZIONE AL COMITATO\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nIscriviti al Comitato\n</h3>\n\n<p>\nAccogliamo con favore\nla partecipazione di cittadini,\nprofessionisti,\nrappresentanti di organizzazioni civiche\ne altre persone interessate\na sostenere\nl'iniziativa del Polo Globale dell'IA.\n</p>\n\n<p>\nLa partecipazione al Comitato\noffre l'opportunità\ndi contribuire\nal coinvolgimento pubblico,\nalle discussioni sulle politiche\ne alle attività della comunità.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Iscrizione al Comitato\n</a>\n\n<p class=\"small-note\">\nModulo di iscrizione in lingua coreana.\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     SOCI SOSTENITORI\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nAdesione come socio sostenitore\n</h3>\n\n<p>\nDiventa socio sostenitore\nper contribuire\nalla continuità\ndelle attività civiche,\ndella comunicazione pubblica\ne delle iniziative\ndi sensibilizzazione politica\nlegate al Polo Globale dell'IA.\n</p>\n\n<p>\nI contributi dei soci sostenitori\npossono essere versati\nsul conto bancario designato\nindicato di seguito.\n</p>\n\n\u003c!-- VISUALIZZAZIONE AUTOMATICA DEL CONTO -->\n\n<div\n  id=\"membershipAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Richiedi l'adesione come socio sostenitore\n</a>\n\n<p class=\"small-note\">\nModulo di iscrizione in lingua coreana.\nPrima di effettuare un bonifico,\nverificare le istruzioni\ndi pagamento più aggiornate.\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     STRISCIONI PROMOZIONALI\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nRichiesta di striscioni promozionali\n</h3>\n\n<p>\nPartecipa alle attività\ndi sensibilizzazione pubblica\nrichiedendo l'installazione\ndi striscioni promozionali\na sostegno\ndel Polo Globale dell'IA\nnella Città Speciale di Goyang.\n</p>\n\n<p>\nDopo aver presentato\nla domanda,\nsi prega di versare\nil costo applicabile\nsul conto bancario designato\nindicato di seguito.\n</p>\n\n<p>\nL'installazione degli striscioni\ndeve rispettare\ni regolamenti locali,\nle leggi applicabili\ne i requisiti relativi\nai luoghi di esposizione.\n</p>\n\n\u003c!-- VISUALIZZAZIONE AUTOMATICA DEL CONTO -->\n\n<div\n  id=\"bannerAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Richiedi uno striscione promozionale\n</a>\n\n<p class=\"small-note\">\nModulo di richiesta in lingua coreana.\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     ADESIVI PROMOZIONALI PER VEICOLI\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nAdesivo promozionale per veicoli\n</h3>\n\n<p>\nContribuisci\na far conoscere\nl'iniziativa del Polo Globale dell'IA\nesponendo un adesivo promozionale\nsul tuo veicolo.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/cisRHEsN61pxVycG8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Richiedi un adesivo per veicoli\n</a>\n\n<p class=\"small-note\">\nModulo di richiesta in lingua coreana.\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     COMUNITÀ KAKAOTALK\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nComunità KakaoTalk\n</h3>\n\n<p>\nUnisciti al gruppo\ndi comunicazione KakaoTalk\ndel Comitato\nper scambiare informazioni\nsulle attività,\nsulla partecipazione pubblica\ne sugli sviluppi\nrelativi all'iniziativa\ndel Polo Globale dell'IA.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://invite.kakao.com/tc/6vBTJeOAAa\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Unisciti alla comunità KakaoTalk\n</a>\n\n<p class=\"small-note\">\nLe discussioni della comunità\nsi svolgono principalmente\nin lingua coreana.\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     GRUPPO FACEBOOK\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nGruppo di discussione Facebook\n</h3>\n\n<p>\nCondividi informazioni,\nscambia opinioni\ne partecipa\nalle discussioni pubbliche\nsull'iniziativa proposta\nper il Polo Globale dell'IA.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://fb.me/g/8JVQBabwP/W4YofuHk\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Unisciti al gruppo Facebook\n</a>\n\n</article>\n\n\u003c!-- =====================================\n     GALLERIA DELLE ATTIVITÀ\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nGalleria delle attività del Comitato\n</h3>\n\n<p>\nEsplora le fotografie\nche documentano\nle attività\ndel Comitato Civico Promotore\ne della campagna\ndi sostegno pubblico.\n</p>\n\n<a\n  class=\"button\"\n  href=\"gallery.html?lang=it\"\n>\n  Visualizza la galleria delle attività\n  (in coreano)\n</a>\n\n</article>\n\n</div>\n\n\u003c!-- =====================================\n     INFORMAZIONI SULLA PARTECIPAZIONE\n===================================== -->\n\n<section class=\"notice\">\n\n<h2>\nInformazioni sulla partecipazione\n</h2>\n\n<p>\nIl Comitato Civico Promotore\ngestisce diversi programmi\ndi partecipazione,\ntra cui\nla campagna pubblica\ndi raccolta firme,\nl'iscrizione al Comitato,\nl'adesione come socio sostenitore,\nle richieste\ndi striscioni promozionali\ne le richieste\ndi adesivi per veicoli.\n</p>\n\n<p>\nOgni domanda\nviene presentata\nattraverso il relativo modulo online.\n</p>\n\n<p>\nPrima di presentare\nla domanda,\ni partecipanti\ndevono esaminare\nlo scopo della richiesta\ne le informazioni\nrelative alla raccolta\ne all'utilizzo\ndei dati personali.\n</p>\n\n<p>\nI contributi dei soci sostenitori\ne i costi degli striscioni promozionali\ndevono essere versati\nesclusivamente\nsui conti bancari designati\nufficialmente comunicati\ndal Comitato.\n</p>\n\n<p>\nPrima di effettuare\nqualsiasi trasferimento di denaro,\nsi prega di verificare\ni dati bancari più aggiornati\ne le condizioni di pagamento.\n</p>\n\n<p>\nPer informazioni\nsulla protezione\ndei dati personali,\nconsultare\nl'informativa sulla privacy:\n<a href=\"index.html?view=privacy\">\nInformativa sulla privacy (in coreano)\n</a>.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     PAGINE CORRELATE\n===================================== -->\n\n<section class=\"notice\">\n\n<h2>\nEsplora altre informazioni\n</h2>\n\n<p>\nScopri di più\nsul Comitato,\nsui suoi obiettivi\ne sull'iniziativa\nper un Polo Globale dell'IA.\n</p>\n\n<a\n  class=\"button\"\n  href=\"committee.html?lang=it\"\n>\n  Il Comitato Civico Promotore\n</a>\n\n<a\n  class=\"button\"\n  href=\"hub.html?lang=it\"\n>\n  Il Polo Globale dell'IA\n</a>\n\n<a\n  class=\"button\"\n  href=\"news.html?lang=it\"\n>\n  Notizie e comunicazioni\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     PIÈ DI PAGINA\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nComitato Civico Promotore<br>\nper l'insediamento del Polo Globale dell'IA<br>\nnella Città Speciale di Goyang\n</strong>\n</p>\n\n<p>\nProvincia di Gyeonggi,<br>\nRepubblica di Corea\n</p>\n\n<p>\nCon i cittadini,<br>\ncon la Provincia di Gyeonggi<br>\ne con il mondo.\n</p>\n\n<p>\n<a href=\"index.html?lang=it\">\nHomepage italiana\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     MODULO SUPABASE\n     VISUALIZZAZIONE AUTOMATICA\n     DEI CONTI BANCARI\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   CONNESSIONE SUPABASE\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   VISUALIZZAZIONE AUTOMATICA\n   DEI CONTI BANCARI\n===================================== */\n\nasync function loadPaymentAccounts() {\n\n  const targets = {\n\n    membership: \"membershipAccountInfo\",\n\n    banner: \"bannerAccountInfo\"\n\n  };\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"payment_accounts\")\n        .select(\n          \"account_type, bank_name, account_number, account_holder\"\n        );\n\n    if (error) {\n      throw error;\n    }\n\n    for (const account of data || []) {\n\n      const targetId =\n        targets[account.account_type];\n\n      if (!targetId) continue;\n\n      const container =\n        document.getElementById(targetId);\n\n      if (!container) continue;\n\n      const bank =\n        String(\n          account.bank_name || \"\"\n        ).trim();\n\n      const number =\n        String(\n          account.account_number || \"\"\n        ).trim();\n\n      const holder =\n        String(\n          account.account_holder || \"\"\n        ).trim();\n\n      if (\n        !bank ||\n        !number ||\n        !holder\n      ) {\n        continue;\n      }\n\n      container.replaceChildren();\n\n      /* TITOLO */\n\n      const title =\n        document.createElement(\"strong\");\n\n      title.textContent =\n        \"Conto bancario designato\";\n\n      /* NOME DELLA BANCA */\n\n      const bankLine =\n        document.createElement(\"p\");\n\n      bankLine.textContent =\n        \"Banca: \" + bank;\n\n      /* NUMERO DEL CONTO */\n\n      const numberLine =\n        document.createElement(\"p\");\n\n      numberLine.textContent =\n        \"Numero di conto: \" + number;\n\n      /* INTESTATARIO */\n\n      const holderLine =\n        document.createElement(\"p\");\n\n      holderLine.textContent =\n        \"Intestatario: \" + holder;\n\n      container.append(\n        title,\n        bankLine,\n        numberLine,\n        holderLine\n      );\n\n      container.hidden = false;\n\n    }\n\n    console.log(\n      \"Informazioni bancarie caricate.\"\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"Errore nel caricamento dei conti bancari:\",\n      error\n    );\n\n  }\n\n}\n\n/* =====================================\n   CARICAMENTO INIZIALE\n===================================== */\n\nloadPaymentAccounts();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=ja": "<!DOCTYPE html>\n<html lang=\"ja\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\n市民参加センター |\nグローバルAIハブ構想\n</title>\n\n<meta\n  name=\"description\"\n  content=\"高陽特例市グローバルAIハブ誘致構想に参加しましょう。10万人市民署名運動、市民推進委員会への登録、賛助会員、広報横断幕、車両用ステッカー、地域コミュニティ活動をご案内します。\"\n>\n\n<style>\n\n/* =====================================\n   基本設定\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n\n  font-family:\n    \"Noto Sans JP\",\n    \"Hiragino Kaku Gothic ProN\",\n    \"Yu Gothic\",\n    Meiryo,\n    Arial,\n    sans-serif;\n\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ヘッダー\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   メインコンテンツ\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  font-size: 28px;\n}\n\n.intro strong {\n  color: #0754a6;\n}\n\n/* =====================================\n   カードグリッド\n===================================== */\n\n.grid {\n  display: grid;\n\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n\n  gap: 20px;\n}\n\n.card {\n  background: white;\n  border-radius: 12px;\n  padding: 28px;\n\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.08);\n\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  color: #0754a6;\n  font-size: 22px;\n  margin-top: 0;\n}\n\n.card p {\n  color: #46566d;\n}\n\n/* =====================================\n   ボタン\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover,\n.button:focus-visible {\n  background: #003a7a;\n}\n\n/* =====================================\n   署名運動\n===================================== */\n\n.signature {\n  background: #eaf4ff;\n  border: 2px solid #168de0;\n  padding: 30px;\n  border-radius: 12px;\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.signature h2 {\n  color: #0754a6;\n  font-size: 30px;\n}\n\n.signature p {\n  font-size: 18px;\n}\n\n/* =====================================\n   お知らせ\n===================================== */\n\n.notice {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  margin-top: 35px;\n}\n\n.notice h2 {\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 30px;\n}\n\n.small-note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   振込口座情報\n===================================== */\n\n.payment-account-info {\n  margin: 15px 0;\n  padding: 16px;\n  background: #eaf4ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 8px;\n  color: #17315b;\n  font-size: 15px;\n  line-height: 1.8;\n  overflow-wrap: anywhere;\n}\n\n.payment-account-info[hidden] {\n  display: none !important;\n}\n\n.payment-account-info strong {\n  display: block;\n  color: #0754a6;\n  margin-bottom: 5px;\n}\n\n.payment-account-info p {\n  margin: 5px 0;\n}\n\n/* =====================================\n   フッター\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   モバイル対応\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .signature {\n    padding: 20px;\n  }\n\n  .signature h2 {\n    font-size: 25px;\n  }\n\n  .card {\n    padding: 22px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ヘッダー\n===================================== -->\n\n<header>\n\n<h1>\n市民参加センター\n</h1>\n\n<p>\nグローバルAIハブ構想<br>\n大韓民国・京畿道 高陽特例市\n</p>\n\n<p>\n市民参加を通じて築く<br>\n高陽特例市の新たな未来\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ja\"\n  class=\"home-link\"\n>\n  ← 日本語ホーム\n</a>\n\n<a\n  href=\"participate.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n>\n  한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     はじめに\n===================================== -->\n\n<div class=\"intro\">\n\n<h2>\nグローバルAIハブを高陽特例市へ！\n</h2>\n\n<p>\n\n<strong>\n高陽特例市に新たな成長機会を！\n</strong>\n\n<br>\n\n<strong>\n高陽特例市に質の高い雇用を！\n</strong>\n\n</p>\n\n<p>\nグローバルAIハブ構想は、\n高陽特例市が\n国際協力とAI関連産業の\n拠点として発展するための\n重要な機会となり得ます。\n</p>\n\n<p>\n市民推進委員会は、\n本構想に対する\n市民の理解を深め、\n市民、\n専門家、\n市民団体による\n自発的な参加を\n促進することを目指しています。\n</p>\n\n<p>\n\n<strong>\n皆様のご参加が、\nグローバルAIハブの\n高陽特例市への誘致に向けた\n市民の支持を\nさらに広げる力となります。\n</strong>\n\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     海外からの参加者へのご案内\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\n海外からの参加者の皆様へ\n</strong>\n\n<p>\nこのページでは、\n市民推進委員会が運営する\n市民参加プログラムを\n日本語でご紹介しています。\n</p>\n\n<p>\n現在、\n各種申請フォームは\n韓国語で提供されています。\n</p>\n\n<p>\n個人情報を提出する前に、\n各フォームに記載された\n申請内容と\n個人情報の取扱いについて\n十分にご確認ください。\n</p>\n\n<p>\n賛助会費などの金銭的な支援や\n関連する参加手続きには、\n委員会が定める規則と\n適用条件が適用されます。\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     10万人市民署名運動\n===================================== -->\n\n<section class=\"signature\">\n\n<h2>\n10万人市民署名運動\n</h2>\n\n<p>\n高陽特例市への\nグローバルAIハブ誘致を支持する\n市民署名運動に\nご参加ください。\n</p>\n\n<p>\n一人ひとりの市民の声を集め、\n高陽特例市の未来の発展に向けた\n社会的な理解と支持を\n広げていきます。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  オンライン署名運動に参加する\n</a>\n\n<p class=\"small-note\">\n申請フォームは韓国語で提供されています。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     市民参加プログラム\n===================================== -->\n\n<div class=\"grid\">\n\n\u003c!-- =====================================\n     市民推進委員会への登録\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\n市民推進委員会への登録\n</h3>\n\n<p>\nグローバルAIハブ構想を\n支持する市民、\n専門家、\n市民団体の代表者、\nその他の関心をお持ちの皆様の\n参加を歓迎します。\n</p>\n\n<p>\n委員会への参加を通じて、\n市民との交流、\n政策に関する議論、\n地域社会での活動などに\n貢献することができます。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  市民推進委員会に登録する\n</a>\n\n<p class=\"small-note\">\n申請フォームは韓国語で提供されています。\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     賛助会員\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\n賛助会員への登録\n</h3>\n\n<p>\nグローバルAIハブ構想に関連する\n市民活動、\n広報、\n政策提案活動などを\n継続的に支援するため、\n賛助会員として\nご参加いただけます。\n</p>\n\n<p>\n賛助会費は、\n以下に表示される\n指定銀行口座へ\nお振り込みいただけます。\n</p>\n\n\u003c!-- SUPABASE 口座情報 -->\n\n<div\n  id=\"membershipAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  賛助会員に申し込む\n</a>\n\n<p class=\"small-note\">\n申請フォームは韓国語です。\nお振り込みの前に、\n最新の口座情報と\n支払条件をご確認ください。\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     広報横断幕\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\n広報横断幕の申請\n</h3>\n\n<p>\n高陽特例市への\nグローバルAIハブ誘致を\n支持する広報横断幕の掲示を通じて、\n市民への周知活動に\nご参加いただけます。\n</p>\n\n<p>\n申請書を提出した後、\n該当する費用を\n以下の指定銀行口座へ\nお振り込みください。\n</p>\n\n<p>\n横断幕の掲示に当たっては、\n地域の条例、\n関係法令、\n設置場所に関する条件を\n遵守する必要があります。\n</p>\n\n\u003c!-- SUPABASE 口座情報 -->\n\n<div\n  id=\"bannerAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  広報横断幕を申し込む\n</a>\n\n<p class=\"small-note\">\n申請フォームは韓国語で提供されています。\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     車両用広報ステッカー\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\n車両用広報ステッカー\n</h3>\n\n<p>\n車両に広報ステッカーを貼ることで、\nグローバルAIハブ構想に対する\n市民の関心と理解を\n広げる活動に\nご参加いただけます。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/cisRHEsN61pxVycG8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  車両用ステッカーを申し込む\n</a>\n\n<p class=\"small-note\">\n申請フォームは韓国語で提供されています。\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     KakaoTalk コミュニティ\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nKakaoTalkコミュニティ\n</h3>\n\n<p>\n市民推進委員会の\nKakaoTalkコミュニティに参加し、\n委員会の活動、\n市民参加、\nグローバルAIハブ構想の\n進展に関する情報を\n共有することができます。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://invite.kakao.com/tc/6vBTJeOAAa\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  KakaoTalkコミュニティに参加する\n</a>\n\n<p class=\"small-note\">\nコミュニティ内での交流は、\n主に韓国語で行われています。\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     Facebook グループ\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nFacebookディスカッショングループ\n</h3>\n\n<p>\nグローバルAIハブ構想に関する\n情報を共有し、\nさまざまな意見を交換しながら、\n市民による公開討論に\n参加することができます。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://fb.me/g/8JVQBabwP/W4YofuHk\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Facebookグループに参加する\n</a>\n\n</article>\n\n\u003c!-- =====================================\n     活動写真ギャラリー\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\n委員会活動ギャラリー\n</h3>\n\n<p>\n市民推進委員会の活動や\n市民による誘致支持運動の様子を\n写真でご覧いただけます。\n</p>\n\n<a\n  class=\"button\"\n  href=\"gallery.html?lang=ja\"\n>\n  活動ギャラリーを見る（韓国語）\n</a>\n\n</article>\n\n</div>\n\n\u003c!-- =====================================\n     参加に関するご案内\n===================================== -->\n\n<section class=\"notice\">\n\n<h2>\n参加に関するご案内\n</h2>\n\n<p>\n市民推進委員会では、\n市民署名運動、\n委員会への登録、\n賛助会員制度、\n広報横断幕の申請、\n車両用ステッカーの申請など、\nさまざまな参加プログラムを\n運営しています。\n</p>\n\n<p>\n各申請は、\n該当するオンラインフォームを通じて\n行われます。\n</p>\n\n<p>\n申請に当たっては、\n申請目的と、\n個人情報の収集および利用に関する\n説明を十分にご確認ください。\n</p>\n\n<p>\n賛助会費および\n広報横断幕の費用は、\n委員会が正式に案内する\n指定銀行口座にのみ\nお振り込みください。\n</p>\n\n<p>\n送金前には、\n必ず最新の口座情報と\n支払条件をご確認ください。\n</p>\n\n<p>\n個人情報の保護については、\n<a href=\"index.html?view=privacy\">\n個人情報保護方針（韓国語）\n</a>\nをご参照ください。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     関連ページ\n===================================== -->\n\n<section class=\"notice\">\n\n<h2>\n関連ページ\n</h2>\n\n<p>\n市民推進委員会の目的、\n活動、\nグローバルAIハブ構想について、\nさらに詳しくご紹介します。\n</p>\n\n<a\n  class=\"button\"\n  href=\"committee.html?lang=ja\"\n>\n  市民推進委員会について\n</a>\n\n<a\n  class=\"button\"\n  href=\"hub.html?lang=ja\"\n>\n  グローバルAIハブについて\n</a>\n\n<a\n  class=\"button\"\n  href=\"news.html?lang=ja\"\n>\n  ニュース・お知らせ\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     フッター\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\n高陽特例市グローバルAIハブ誘致<br>\n市民推進委員会\n</strong>\n</p>\n\n<p>\n大韓民国・京畿道\n</p>\n\n<p>\n市民とともに、京畿道とともに、<br>\nそして世界とともに。\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ja\">\n日本語ホーム\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"participate.html\" lang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE 振込口座情報モジュール\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE 接続\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   振込口座情報の自動表示\n===================================== */\n\nasync function loadPaymentAccounts() {\n\n  const targets = {\n    membership: \"membershipAccountInfo\",\n    banner: \"bannerAccountInfo\"\n  };\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"payment_accounts\")\n        .select(\n          \"account_type, bank_name, account_number, account_holder\"\n        );\n\n    if (error) {\n      throw error;\n    }\n\n    for (const account of data || []) {\n\n      const targetId =\n        targets[account.account_type];\n\n      if (!targetId) continue;\n\n      const container =\n        document.getElementById(targetId);\n\n      if (!container) continue;\n\n      const bank =\n        String(\n          account.bank_name || \"\"\n        ).trim();\n\n      const number =\n        String(\n          account.account_number || \"\"\n        ).trim();\n\n      const holder =\n        String(\n          account.account_holder || \"\"\n        ).trim();\n\n      if (\n        !bank ||\n        !number ||\n        !holder\n      ) {\n        continue;\n      }\n\n      container.replaceChildren();\n\n      /* 口座情報タイトル */\n\n      const title =\n        document.createElement(\"strong\");\n\n      title.textContent =\n        \"指定振込口座\";\n\n      /* 銀行名 */\n\n      const bankLine =\n        document.createElement(\"p\");\n\n      bankLine.textContent =\n        \"銀行名：\" + bank;\n\n      /* 口座番号 */\n\n      const numberLine =\n        document.createElement(\"p\");\n\n      numberLine.textContent =\n        \"口座番号：\" + number;\n\n      /* 口座名義人 */\n\n      const holderLine =\n        document.createElement(\"p\");\n\n      holderLine.textContent =\n        \"口座名義人：\" + holder;\n\n      container.append(\n        title,\n        bankLine,\n        numberLine,\n        holderLine\n      );\n\n      container.hidden = false;\n\n    }\n\n    console.log(\n      \"振込口座情報の読み込みが完了しました。\"\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"振込口座情報の取得に失敗しました:\",\n      error\n    );\n\n  }\n\n}\n\n/* =====================================\n   初期読み込み\n===================================== */\n\nloadPaymentAccounts();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=ru": "<!DOCTYPE html>\n<html lang=\"ru\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nЦентр участия граждан |\nИнициатива «Глобальный центр ИИ»\n</title>\n\n<meta\n  name=\"description\"\n  content=\"Примите участие в инициативе «Глобальный центр ИИ» в особом городе Коян: кампания общественной поддержки, регистрация в Комитете, поддерживающее членство и общественные мероприятия.\"\n>\n\n<style>\n\n/* =====================================\n   ОСНОВНЫЕ НАСТРОЙКИ\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ШАПКА САЙТА\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n/* =====================================\n   ОСНОВНОЕ СОДЕРЖИМОЕ\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  font-size: 28px;\n}\n\n.intro strong {\n  color: #0754a6;\n}\n\n/* =====================================\n   СЕТКА КАРТОЧЕК\n===================================== */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: white;\n  border-radius: 12px;\n  padding: 28px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.08);\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  color: #0754a6;\n  font-size: 22px;\n  margin-top: 0;\n}\n\n.card p {\n  color: #46566d;\n}\n\n/* =====================================\n   КНОПКИ\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover,\n.button:focus-visible {\n  background: #003a7a;\n}\n\n/* =====================================\n   КАМПАНИЯ ПОДДЕРЖКИ\n===================================== */\n\n.signature {\n  background: #eaf4ff;\n  border: 2px solid #168de0;\n  padding: 30px;\n  border-radius: 12px;\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.signature h2 {\n  color: #0754a6;\n  font-size: 30px;\n}\n\n.signature p {\n  font-size: 18px;\n}\n\n/* =====================================\n   ИНФОРМАЦИОННЫЕ РАЗДЕЛЫ\n===================================== */\n\n.notice {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  margin-top: 35px;\n}\n\n.notice h2 {\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 30px;\n}\n\n.small-note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   БАНКОВСКИЕ РЕКВИЗИТЫ\n===================================== */\n\n.payment-account-info {\n  margin: 15px 0;\n  padding: 16px;\n  background: #eaf4ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 8px;\n  color: #17315b;\n  font-size: 15px;\n  line-height: 1.8;\n  overflow-wrap: anywhere;\n}\n\n.payment-account-info[hidden] {\n  display: none !important;\n}\n\n.payment-account-info strong {\n  display: block;\n  color: #0754a6;\n  margin-bottom: 5px;\n}\n\n.payment-account-info p {\n  margin: 5px 0;\n}\n\n/* =====================================\n   ПОДВАЛ САЙТА\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   МОБИЛЬНАЯ ВЕРСИЯ\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .signature {\n    padding: 20px;\n  }\n\n  .signature h2 {\n    font-size: 25px;\n  }\n\n  .card {\n    padding: 22px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ШАПКА САЙТА\n===================================== -->\n\n<header>\n\n<h1>\nЦентр участия граждан\n</h1>\n\n<p>\nИнициатива «Глобальный центр ИИ»<br>\nОсобый город Коян,<br>\nпровинция Кёнгидо,<br>\nРеспублика Корея\n</p>\n\n<p>\nСоздаём новое будущее Кояна<br>\nпри активном участии граждан\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ru\"\n  class=\"home-link\"\n>\n  ← Главная страница\n</a>\n\n<a\n  href=\"participate.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n>\n  한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     ВВЕДЕНИЕ\n===================================== -->\n\n<div class=\"intro\">\n\n<h2>\nПоддержим размещение Глобального центра ИИ в Кояне!\n</h2>\n\n<p>\n<strong>\nНовые возможности роста для Кояна!\n</strong>\n<br>\n<strong>\nБольше качественных рабочих мест для Кояна!\n</strong>\n</p>\n\n<p>\nПредлагаемый Глобальный центр ИИ\nпредставляет собой важную возможность\nдля особого города Коян\nразвиваться как центр\nмеждународного сотрудничества\nи отраслей, связанных\nс искусственным интеллектом.\n</p>\n\n<p>\nГражданский комитет содействия\nстремится расширять\nобщественное понимание инициативы\nи поощрять добровольное участие\nграждан,\nспециалистов\nи общественных организаций.\n</p>\n\n<p>\n<strong>\nВаше участие может помочь\nукрепить общественную поддержку\nразмещения Глобального центра ИИ\nв особом городе Коян.\n</strong>\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     ИНФОРМАЦИЯ ДЛЯ ИНОСТРАННЫХ ГОСТЕЙ\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nИнформация для иностранных посетителей\n</strong>\n\n<p>\nНа этой странице на русском языке\nпредставлены программы участия граждан,\nорганизуемые Комитетом.\n</p>\n\n<p>\nФормы заявок в настоящее время\nдоступны на корейском языке.\nПожалуйста, внимательно ознакомьтесь\nс информацией в каждой форме\nперед предоставлением персональных данных.\n</p>\n\n<p>\nФинансовые взносы\nи связанные с ними процедуры участия\nрегулируются применимыми правилами\nи требованиями Комитета.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     КАМПАНИЯ 100 000 ПОДПИСЕЙ\n===================================== -->\n\n<section class=\"signature\">\n\n<h2>\nКампания по сбору 100 000 подписей граждан\n</h2>\n\n<p>\nПрисоединяйтесь к общественной кампании\nпо сбору подписей\nв поддержку предлагаемого\nГлобального центра ИИ\nв особом городе Коян.\n</p>\n\n<p>\nОбъединяя голоса отдельных граждан,\nмы стремимся укрепить\nобщественную осведомлённость\nи поддержку будущего развития Кояна.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Присоединиться к кампании поддержки\n</a>\n\n<p class=\"small-note\">\nФорма заявки на корейском языке.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     ПРОГРАММЫ УЧАСТИЯ\n===================================== -->\n\n<div class=\"grid\">\n\n\u003c!-- РЕГИСТРАЦИЯ В КОМИТЕТЕ -->\n\n<article class=\"card\">\n\n<h3>\nРегистрация в Комитете\n</h3>\n\n<p>\nМы приветствуем граждан,\nспециалистов,\nпредставителей общественных организаций\nи других заинтересованных участников,\nжелающих поддержать\nинициативу «Глобальный центр ИИ».\n</p>\n\n<p>\nУчастие в Комитете\nпредоставляет возможность\nвносить вклад\nв общественную деятельность,\nобсуждение государственной политики\nи мероприятия местного сообщества.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Зарегистрироваться в Комитете\n</a>\n\n<p class=\"small-note\">\nФорма заявки на корейском языке.\n</p>\n\n</article>\n\n\u003c!-- ПОДДЕРЖИВАЮЩЕЕ ЧЛЕНСТВО -->\n\n<article class=\"card\">\n\n<h3>\nПоддерживающее членство\n</h3>\n\n<p>\nСтаньте поддерживающим членом,\nчтобы содействовать\nустойчивому развитию\nгражданских инициатив,\nобщественной коммуникации\nи информационно-просветительской деятельности\nв рамках инициативы\n«Глобальный центр ИИ».\n</p>\n\n<p>\nЧленские взносы\nмогут перечисляться\nна указанный ниже\nспециальный банковский счёт.\n</p>\n\n\u003c!-- АВТОМАТИЧЕСКОЕ ОТОБРАЖЕНИЕ СЧЁТА -->\n\n<div\n  id=\"membershipAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Подать заявку на поддерживающее членство\n</a>\n\n<p class=\"small-note\">\nФорма заявки на корейском языке.\nПожалуйста, уточните актуальные\nплатёжные инструкции\nперед переводом денежных средств.\n</p>\n\n</article>\n\n\u003c!-- ЗАЯВКА НА РЕКЛАМНЫЙ БАННЕР -->\n\n<article class=\"card\">\n\n<h3>\nЗаявка на размещение рекламного баннера\n</h3>\n\n<p>\nПримите участие\nв мероприятиях по повышению\nобщественной осведомлённости,\nподав заявку\nна размещение рекламных баннеров\nв поддержку предлагаемого\nГлобального центра ИИ в Кояне.\n</p>\n\n<p>\nПосле подачи заявки\nоплатите соответствующие расходы\nна указанный ниже\nспециальный банковский счёт.\n</p>\n\n<p>\nРазмещение баннеров\nдолжно соответствовать\nместным нормативным требованиям,\nприменимому законодательству\nи условиям размещения.\n</p>\n\n\u003c!-- АВТОМАТИЧЕСКОЕ ОТОБРАЖЕНИЕ СЧЁТА -->\n\n<div\n  id=\"bannerAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Подать заявку на рекламный баннер\n</a>\n\n<p class=\"small-note\">\nФорма заявки на корейском языке.\n</p>\n\n</article>\n\n\u003c!-- АВТОМОБИЛЬНАЯ НАКЛЕЙКА -->\n\n<article class=\"card\">\n\n<h3>\nРекламная наклейка на автомобиль\n</h3>\n\n<p>\nПомогите повысить\nобщественную осведомлённость\nоб инициативе «Глобальный центр ИИ»,\nразместив рекламную наклейку\nна своём автомобиле.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/cisRHEsN61pxVycG8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Подать заявку на автомобильную наклейку\n</a>\n\n<p class=\"small-note\">\nФорма заявки на корейском языке.\n</p>\n\n</article>\n\n\u003c!-- СООБЩЕСТВО KAKAOTALK -->\n\n<article class=\"card\">\n\n<h3>\nСообщество KakaoTalk\n</h3>\n\n<p>\nПрисоединяйтесь\nк коммуникационной группе Комитета\nв KakaoTalk,\nчтобы обмениваться информацией\nо мероприятиях,\nучастии общественности\nи событиях,\nсвязанных с инициативой\n«Глобальный центр ИИ».\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://invite.kakao.com/tc/6vBTJeOAAa\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Присоединиться к сообществу KakaoTalk\n</a>\n\n<p class=\"small-note\">\nОбщение в сообществе\nведётся преимущественно\nна корейском языке.\n</p>\n\n</article>\n\n\u003c!-- ГРУППА FACEBOOK -->\n\n<article class=\"card\">\n\n<h3>\nДискуссионная группа Facebook\n</h3>\n\n<p>\nДелитесь информацией,\nобменивайтесь мнениями\nи участвуйте\nв общественных обсуждениях\nпредлагаемой инициативы\n«Глобальный центр ИИ».\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://fb.me/g/8JVQBabwP/W4YofuHk\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Присоединиться к группе Facebook\n</a>\n\n</article>\n\n\u003c!-- ГАЛЕРЕЯ ДЕЯТЕЛЬНОСТИ -->\n\n<article class=\"card\">\n\n<h3>\nФотогалерея деятельности Комитета\n</h3>\n\n<p>\nОзнакомьтесь с фотографиями,\nдокументирующими деятельность\nГражданского комитета содействия\nи общественной кампании поддержки.\n</p>\n\n<a\n  class=\"button\"\n  href=\"gallery.html?lang=ru\"\n>\n  Посмотреть фотогалерею (на корейском языке)\n</a>\n\n</article>\n\n</div>\n\n\u003c!-- =====================================\n     ИНФОРМАЦИЯ ОБ УЧАСТИИ\n===================================== -->\n\n<section class=\"notice\">\n\n<h2>\nИнформация об участии\n</h2>\n\n<p>\nГражданский комитет содействия\nорганизует несколько программ\nучастия общественности,\nвключая кампанию по сбору подписей,\nрегистрацию в Комитете,\nподдерживающее членство,\nзаявки на рекламные баннеры\nи автомобильные наклейки.\n</p>\n\n<p>\nКаждая заявка подаётся\nчерез соответствующую онлайн-форму.\nПеред подачей заявки\nучастникам следует ознакомиться\nс её целью,\nа также с информацией\nо сборе и использовании\nперсональных данных.\n</p>\n\n<p>\nЧленские взносы\nи расходы на рекламные баннеры\nследует перечислять\nтолько на банковские счета,\nофициально указанные Комитетом.\n</p>\n\n<p>\nПеред переводом денежных средств\nпожалуйста, проверьте\nактуальные банковские реквизиты\nи условия оплаты.\n</p>\n\n<p>\nИнформацию о защите\nперсональных данных\nможно найти в документе\n<a href=\"index.html?view=privacy\">\n«Политика конфиденциальности»\n(на корейском языке)\n</a>.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     СВЯЗАННЫЕ СТРАНИЦЫ\n===================================== -->\n\n<section class=\"notice\">\n\n<h2>\nДополнительная информация\n</h2>\n\n<p>\nУзнайте больше\nо Гражданском комитете содействия,\nего целях\nи инициативе «Глобальный центр ИИ».\n</p>\n\n<a\n  class=\"button\"\n  href=\"committee.html?lang=ru\"\n>\n  О Гражданском комитете\n</a>\n\n<a\n  class=\"button\"\n  href=\"hub.html?lang=ru\"\n>\n  О Глобальном центре ИИ\n</a>\n\n<a\n  class=\"button\"\n  href=\"news.html?lang=ru\"\n>\n  Новости и объявления\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     ПОДВАЛ САЙТА\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nГражданский комитет содействия<br>\nразмещению Глобального центра ИИ<br>\nв особом городе Коян\n</strong>\n</p>\n\n<p>\nПровинция Кёнгидо,<br>\nРеспублика Корея\n</p>\n\n<p>\nВместе с гражданами,<br>\nвместе с провинцией Кёнгидо<br>\nи вместе со всем миром.\n</p>\n\n<p>\n<a href=\"index.html?lang=ru\">\nГлавная страница\n</a>\n&nbsp; | &nbsp;\n<a href=\"participate.html\" lang=\"ko\">\n한국어\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     МОДУЛЬ БАНКОВСКИХ РЕКВИЗИТОВ SUPABASE\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   ПОДКЛЮЧЕНИЕ К SUPABASE\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   АВТОМАТИЧЕСКОЕ ОТОБРАЖЕНИЕ СЧЕТОВ\n===================================== */\n\nasync function loadPaymentAccounts() {\n\n  const targets = {\n    membership: \"membershipAccountInfo\",\n    banner: \"bannerAccountInfo\"\n  };\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"payment_accounts\")\n        .select(\n          \"account_type, bank_name, account_number, account_holder\"\n        );\n\n    if (error) {\n      throw error;\n    }\n\n    for (const account of data || []) {\n\n      const targetId =\n        targets[account.account_type];\n\n      if (!targetId) continue;\n\n      const container =\n        document.getElementById(targetId);\n\n      if (!container) continue;\n\n      const bank =\n        String(\n          account.bank_name || \"\"\n        ).trim();\n\n      const number =\n        String(\n          account.account_number || \"\"\n        ).trim();\n\n      const holder =\n        String(\n          account.account_holder || \"\"\n        ).trim();\n\n      if (\n        !bank ||\n        !number ||\n        !holder\n      ) {\n        continue;\n      }\n\n      container.replaceChildren();\n\n      /* ЗАГОЛОВОК */\n\n      const title =\n        document.createElement(\"strong\");\n\n      title.textContent =\n        \"Банковские реквизиты для оплаты\";\n\n      /* БАНК */\n\n      const bankLine =\n        document.createElement(\"p\");\n\n      bankLine.textContent =\n        \"Банк: \" + bank;\n\n      /* НОМЕР СЧЁТА */\n\n      const numberLine =\n        document.createElement(\"p\");\n\n      numberLine.textContent =\n        \"Номер счёта: \" + number;\n\n      /* ВЛАДЕЛЕЦ СЧЁТА */\n\n      const holderLine =\n        document.createElement(\"p\");\n\n      holderLine.textContent =\n        \"Владелец счёта: \" + holder;\n\n      container.append(\n        title,\n        bankLine,\n        numberLine,\n        holderLine\n      );\n\n      container.hidden = false;\n\n    }\n\n    console.log(\n      \"Информация о банковских счетах загружена.\"\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"Ошибка загрузки банковских реквизитов:\",\n      error\n    );\n\n  }\n\n}\n\n/* =====================================\n   ПЕРВОНАЧАЛЬНАЯ ЗАГРУЗКА\n===================================== */\n\nloadPaymentAccounts();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=zh": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\n市民参与中心 | 全球人工智能枢纽倡议\n</title>\n\n<meta\n  name=\"description\"\n  content=\"参与韩国京畿道高阳特例市全球人工智能枢纽倡议。通过十万市民支持签名活动、市民推进委员会成员登记、支持会员申请及社区活动，共同支持高阳特例市的未来发展。\"\n>\n\n<style>\n\n/* =====================================\n   基本设置\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n\n  font-family:\n    \"Microsoft YaHei\",\n    \"PingFang SC\",\n    \"Noto Sans SC\",\n    Arial,\n    sans-serif;\n\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   页眉\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   主要内容\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  font-size: 28px;\n}\n\n.intro strong {\n  color: #0754a6;\n}\n\n/* =====================================\n   网格布局\n===================================== */\n\n.grid {\n  display: grid;\n\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n\n  gap: 20px;\n}\n\n.card {\n  background: white;\n  border-radius: 12px;\n  padding: 28px;\n\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.08);\n\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  color: #0754a6;\n  font-size: 22px;\n  margin-top: 0;\n}\n\n.card p {\n  color: #46566d;\n}\n\n/* =====================================\n   按钮\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover,\n.button:focus-visible {\n  background: #003a7a;\n}\n\n/* =====================================\n   十万市民支持活动\n===================================== */\n\n.signature {\n  background: #eaf4ff;\n  border: 2px solid #168de0;\n  padding: 30px;\n  border-radius: 12px;\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.signature h2 {\n  color: #0754a6;\n  font-size: 30px;\n}\n\n.signature p {\n  font-size: 18px;\n}\n\n/* =====================================\n   参与说明\n===================================== */\n\n.notice {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  margin-top: 35px;\n}\n\n.notice h2 {\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 30px;\n}\n\n.small-note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   缴费账户信息\n===================================== */\n\n.payment-account-info {\n  margin: 15px 0;\n  padding: 16px;\n  background: #eaf4ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 8px;\n  color: #17315b;\n  font-size: 15px;\n  line-height: 1.8;\n  overflow-wrap: anywhere;\n}\n\n.payment-account-info[hidden] {\n  display: none !important;\n}\n\n.payment-account-info strong {\n  display: block;\n  color: #0754a6;\n  margin-bottom: 5px;\n}\n\n.payment-account-info p {\n  margin: 5px 0;\n}\n\n/* =====================================\n   页脚\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   移动设备\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .signature {\n    padding: 20px;\n  }\n\n  .signature h2 {\n    font-size: 25px;\n  }\n\n  .card {\n    padding: 22px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     页眉\n===================================== -->\n\n<header>\n\n<h1>\n市民参与中心\n</h1>\n\n<p>\n全球人工智能枢纽倡议<br>\n大韩民国京畿道高阳特例市\n</p>\n\n<p>\n通过市民参与<br>\n共同开创高阳的新未来\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=zh\"\n  class=\"home-link\"\n>\n  ← 中文首页\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     页面介绍\n===================================== -->\n\n<div class=\"intro\">\n\n<h2>\n让全球人工智能枢纽落户高阳！\n</h2>\n\n<p>\n\n<strong>\n为高阳创造新的增长机遇！\n</strong>\n\n<br>\n\n<strong>\n为高阳创造更多高质量就业岗位！\n</strong>\n\n</p>\n\n<p>\n拟议中的全球人工智能枢纽\n将为高阳特例市\n发展成为国际合作\n和人工智能相关产业的重要中心\n提供新的机遇。\n</p>\n\n<p>\n市民推进委员会\n致力于增进公众对该倡议的理解，\n并鼓励广大市民、\n专业人士\n及民间社会组织\n自愿参与。\n</p>\n\n<p>\n\n<strong>\n您的参与\n将有助于凝聚公众支持，\n共同推动全球人工智能枢纽\n落户高阳特例市。\n</strong>\n\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     语言说明\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\n国际访问者须知\n</strong>\n\n<p>\n本页面以中文介绍\n市民推进委员会\n开展的各项市民参与活动。\n</p>\n\n<p>\n相关申请表目前仅提供韩语版本。\n提交个人信息之前，\n请仔细阅读申请表中的说明。\n</p>\n\n<p>\n支持会员缴费\n及其他相关参与程序，\n须遵守委员会适用的规定和要求。\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     十万市民支持签名活动\n===================================== -->\n\n<section class=\"signature\">\n\n<h2>\n十万市民支持签名活动\n</h2>\n\n<p>\n欢迎参加支持\n全球人工智能枢纽\n落户高阳特例市的\n公众签名活动。\n</p>\n\n<p>\n通过汇聚广大市民的声音，\n我们希望进一步提高公众认知，\n凝聚社会共识，\n共同支持高阳特例市的未来发展。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  参加在线支持签名活动\n</a>\n\n<p class=\"small-note\">\n申请表目前仅提供韩语版本。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     市民参与项目\n===================================== -->\n\n<div class=\"grid\">\n\n\u003c!-- =====================================\n     1. 推进委员会成员登记\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\n市民推进委员会成员登记\n</h3>\n\n<p>\n欢迎希望支持\n全球人工智能枢纽倡议的\n广大市民、\n专业人士、\n民间社会组织代表\n以及其他有意参与的人士\n加入市民推进委员会。\n</p>\n\n<p>\n通过参与委员会活动，\n您可以为公众交流、\n政策讨论\n以及社区活动\n作出贡献。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  申请加入推进委员会\n</a>\n\n<p class=\"small-note\">\n申请表目前仅提供韩语版本。\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     2. 支持会员申请\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\n支持会员申请\n</h3>\n\n<p>\n欢迎成为支持会员，\n共同支持与全球人工智能枢纽倡议\n有关的市民活动、\n公众宣传\n以及政策交流工作。\n</p>\n\n<p>\n支持会员缴费\n可汇入下方显示的\n指定银行账户。\n</p>\n\n\u003c!-- 自动显示支持会员账户 -->\n\n<div\n  id=\"membershipAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  申请成为支持会员\n</a>\n\n<p class=\"small-note\">\n申请表目前仅提供韩语版本。\n汇款前请确认最新缴费说明\n及指定账户信息。\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     3. 宣传横幅申请\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\n宣传横幅申请\n</h3>\n\n<p>\n欢迎通过申请设置\n支持全球人工智能枢纽\n落户高阳特例市的宣传横幅，\n参与公众宣传活动。\n</p>\n\n<p>\n提交申请后，\n请按照相关说明\n将适用费用汇入\n下方显示的指定银行账户。\n</p>\n\n<p>\n宣传横幅的设置\n须遵守当地管理规定、\n适用法律\n以及设置地点的相关要求。\n</p>\n\n\u003c!-- 自动显示宣传横幅账户 -->\n\n<div\n  id=\"bannerAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  申请设置宣传横幅\n</a>\n\n<p class=\"small-note\">\n申请表目前仅提供韩语版本。\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     4. 车辆宣传贴纸\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\n车辆宣传贴纸申请\n</h3>\n\n<p>\n通过在车辆上张贴\n全球人工智能枢纽倡议\n宣传贴纸，\n帮助提高公众对该倡议的认知。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/cisRHEsN61pxVycG8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  申请车辆宣传贴纸\n</a>\n\n<p class=\"small-note\">\n申请表目前仅提供韩语版本。\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     5. KakaoTalk 社区\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nKakaoTalk交流社区\n</h3>\n\n<p>\n欢迎加入市民推进委员会的\nKakaoTalk交流社区，\n分享与全球人工智能枢纽倡议\n有关的活动信息、\n公众参与机会\n以及最新发展动态。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://invite.kakao.com/tc/6vBTJeOAAa\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  加入KakaoTalk交流社区\n</a>\n\n<p class=\"small-note\">\n社区交流主要使用韩语。\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     6. Facebook 讨论群组\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nFacebook讨论群组\n</h3>\n\n<p>\n欢迎分享相关信息、\n交流不同观点，\n并参与关于\n全球人工智能枢纽倡议的\n公众讨论。\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://fb.me/g/8JVQBabwP/W4YofuHk\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  加入Facebook讨论群组\n</a>\n\n</article>\n\n\u003c!-- =====================================\n     7. 委员会活动相册\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\n市民推进委员会活动相册\n</h3>\n\n<p>\n浏览市民推进委员会\n及公众支持活动的照片，\n了解委员会开展的\n各项活动。\n</p>\n\n<a\n  class=\"button\"\n  href=\"gallery.html?lang=zh\"\n>\n  查看活动相册（韩语）\n</a>\n\n</article>\n\n</div>\n\n\u003c!-- =====================================\n     参与说明\n===================================== -->\n\n<section class=\"notice\">\n\n<h2>\n参与须知\n</h2>\n\n<p>\n市民推进委员会\n开展多种市民参与项目，\n包括公众支持签名活动、\n推进委员会成员登记、\n支持会员申请、\n宣传横幅申请\n以及车辆宣传贴纸申请。\n</p>\n\n<p>\n各项申请\n均通过相应的在线表格提交。\n</p>\n\n<p>\n提交申请前，\n参与者应仔细了解\n申请目的，\n以及有关个人信息收集\n和使用的说明。\n</p>\n\n<p>\n支持会员缴费\n及宣传横幅相关费用，\n只能汇入委员会正式指定的\n银行账户。\n</p>\n\n<p>\n汇款前，\n请务必确认最新账户信息\n及相关付款条件。\n</p>\n\n<p>\n有关个人信息保护的详细说明，\n请参阅\n<a href=\"index.html?view=privacy\">\n个人信息保护政策（韩语）\n</a>。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     相关页面\n===================================== -->\n\n<section class=\"notice\">\n\n<h2>\n了解更多\n</h2>\n\n<p>\n进一步了解市民推进委员会、\n全球人工智能枢纽倡议\n以及相关最新消息。\n</p>\n\n<a\n  class=\"button\"\n  href=\"committee.html?lang=zh\"\n>\n  关于市民推进委员会\n</a>\n\n<a\n  class=\"button\"\n  href=\"hub.html?lang=zh\"\n>\n  关于全球人工智能枢纽\n</a>\n\n<a\n  class=\"button\"\n  href=\"news.html?lang=zh\"\n>\n  最新消息与公告\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     页脚\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\n高阳特例市全球人工智能枢纽<br>\n引进市民推进委员会\n</strong>\n</p>\n\n<p>\n大韩民国京畿道\n</p>\n\n<p>\n与市民同行，<br>\n与京畿道同行，<br>\n与世界同行。\n</p>\n\n<p>\n<a href=\"index.html?lang=zh\">\n中文首页\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE 缴费账户模块\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE 连接\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   自动加载缴费账户信息\n===================================== */\n\nasync function loadPaymentAccounts() {\n\n  const targets = {\n\n    membership:\n      \"membershipAccountInfo\",\n\n    banner:\n      \"bannerAccountInfo\"\n\n  };\n\n  const accountTitles = {\n\n    membership:\n      \"支持会员缴费账户\",\n\n    banner:\n      \"宣传横幅费用缴纳账户\"\n\n  };\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"payment_accounts\")\n        .select(\n          \"account_type, bank_name, account_number, account_holder\"\n        );\n\n    if (error) {\n\n      throw error;\n\n    }\n\n    for (const account of data || []) {\n\n      const targetId =\n        targets[account.account_type];\n\n      if (!targetId) continue;\n\n      const container =\n        document.getElementById(\n          targetId\n        );\n\n      if (!container) continue;\n\n      const bank =\n        String(\n          account.bank_name || \"\"\n        ).trim();\n\n      const number =\n        String(\n          account.account_number || \"\"\n        ).trim();\n\n      const holder =\n        String(\n          account.account_holder || \"\"\n        ).trim();\n\n      if (\n        !bank ||\n        !number ||\n        !holder\n      ) {\n\n        continue;\n\n      }\n\n      container.replaceChildren();\n\n      /* =====================================\n         账户标题\n      ===================================== */\n\n      const title =\n        document.createElement(\"strong\");\n\n      title.textContent =\n        accountTitles[\n          account.account_type\n        ] || \"指定缴费账户\";\n\n      /* =====================================\n         银行名称\n      ===================================== */\n\n      const bankLine =\n        document.createElement(\"p\");\n\n      bankLine.textContent =\n        \"银行名称：\" + bank;\n\n      /* =====================================\n         账号\n      ===================================== */\n\n      const numberLine =\n        document.createElement(\"p\");\n\n      numberLine.textContent =\n        \"账号：\" + number;\n\n      /* =====================================\n         账户持有人\n      ===================================== */\n\n      const holderLine =\n        document.createElement(\"p\");\n\n      holderLine.textContent =\n        \"账户持有人：\" + holder;\n\n      /* =====================================\n         显示账户信息\n      ===================================== */\n\n      container.append(\n        title,\n        bankLine,\n        numberLine,\n        holderLine\n      );\n\n      container.hidden = false;\n\n    }\n\n    console.log(\n      \"缴费账户信息加载完成。\"\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"缴费账户信息查询失败:\",\n      error\n    );\n\n  }\n\n}\n\n/* =====================================\n   页面初始化\n===================================== */\n\nloadPaymentAccounts();\n\n\u003c/script>\n\n</body>\n</html>\n"
}
</script>
<script>
(() => {
  const data = document.getElementById("page-variants");
  const pages = JSON.parse(data.textContent);
  const params = new URLSearchParams(window.location.search);
  const keys = ["view", "lang"].map(key => key + "=" + params.get(key));
  const selected = keys.find(key => Object.hasOwn(pages, key)) || "default";
  const page = pages[selected];
  const opening = /^\s*<!doctype html>\s*(<html\b[^>]*>)\s*<head\b[^>]*>/i.exec(page);

  // Keep the original URL and let the initial HTML parser run the page scripts.
  const root = new DOMParser().parseFromString(opening[1], "text/html").documentElement;
  for (const attribute of root.attributes) {
    document.documentElement.setAttribute(attribute.name, attribute.value);
  }
  data.remove();
  document.write(page.slice(opening[0].length));
})();
</script>
