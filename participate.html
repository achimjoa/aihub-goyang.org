mberLine =\n        document.createElement(\"p\");\n\n      numberLine.textContent =\n        \"계좌번호: \" + number;\n\n      const holderLine =\n        document.createElement(\"p\");\n\n      holderLine.textContent =\n        \"예금주: \" + holder;\n\n      container.append(\n        title,\n        bankLine,\n        numberLine,\n        holderLine\n      );\n\n      container.hidden = false;\n    }\n\n    console.log(\n      \"시민참여센터 계좌정보 조회 완료\"\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"계좌정보 조회 오류:\",\n      error\n    );\n\n  }\n}\n\nloadPaymentAccounts();\n\n\u003c/script>\n  \n</body>\n</html>\n",
  "lang=ar": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nمركز المشاركة المدنية |\nمبادرة المركز العالمي للذكاء الاصطناعي\n</title>\n\n<meta\n  name=\"description\"\n  content=\"شارك في مبادرة المركز العالمي للذكاء الاصطناعي في مدينة غويانغ الخاصة من خلال حملة الدعم الشعبي، والتسجيل في اللجنة المدنية، والعضوية الداعمة، والأنشطة المجتمعية.\"\n>\n\n<style>\n\n/* =====================================\n   BASIC SETTINGS\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  direction: rtl;\n  font-family:\n    Tahoma,\n    Arial,\n    \"Noto Naskh Arabic\",\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.9;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   HEADER\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.5;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   MAIN\n===================================== */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  font-size: 28px;\n}\n\n.intro strong {\n  color: #0754a6;\n}\n\n/* =====================================\n   GRID\n===================================== */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: white;\n  border-radius: 12px;\n  padding: 28px;\n  box-shadow:\n    0 3px 12px rgba(0,0,0,.08);\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  color: #0754a6;\n  font-size: 22px;\n  margin-top: 0;\n}\n\n.card p {\n  color: #46566d;\n}\n\n/* =====================================\n   BUTTONS\n===================================== */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   SIGNATURE CAMPAIGN\n===================================== */\n\n.signature {\n  background: #eaf4ff;\n  border: 2px solid #168de0;\n  padding: 30px;\n  border-radius: 12px;\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.signature h2 {\n  color: #0754a6;\n  font-size: 30px;\n}\n\n.signature p {\n  font-size: 18px;\n}\n\n/* =====================================\n   NOTICE\n===================================== */\n\n.notice {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  margin-top: 35px;\n}\n\n.notice h2 {\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-right: 5px solid #e4b43c;\n  border-left: none;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 30px;\n}\n\n.small-note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* =====================================\n   PAYMENT ACCOUNT INFORMATION\n===================================== */\n\n.payment-account-info {\n  margin: 15px 0;\n  padding: 16px;\n  background: #eaf4ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 8px;\n  color: #17315b;\n  font-size: 15px;\n  line-height: 1.8;\n  overflow-wrap: anywhere;\n}\n\n.payment-account-info[hidden] {\n  display: none !important;\n}\n\n.payment-account-info strong {\n  display: block;\n  color: #0754a6;\n  margin-bottom: 5px;\n}\n\n.payment-account-info p {\n  margin: 5px 0;\n}\n\n.account-number {\n  direction: ltr;\n  unicode-bidi: isolate;\n  display: inline-block;\n  text-align: left;\n}\n\n/* =====================================\n   FOOTER\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .signature {\n    padding: 20px;\n  }\n\n  .signature h2 {\n    font-size: 25px;\n  }\n\n  .card {\n    padding: 22px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header>\n\n<h1>\nمركز المشاركة المدنية\n</h1>\n\n<p>\nمبادرة المركز العالمي للذكاء الاصطناعي<br>\nمدينة غويانغ الخاصة،\nمقاطعة غيونغي،\nجمهورية كوريا\n</p>\n\n<p>\nنبني مستقبلاً جديداً لغويانغ\nمن خلال مشاركة المواطنين\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ar\"\n  class=\"home-link\"\n>\n← الصفحة الرئيسية العربية\n</a>\n\n<a\n  href=\"participate.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     INTRODUCTION\n===================================== -->\n\n<div class=\"intro\">\n\n<h2>\nلنجلب المركز العالمي للذكاء الاصطناعي إلى غويانغ!\n</h2>\n\n<p>\n\n<strong>\nفرص نمو جديدة لمدينة غويانغ!\n</strong>\n\n<br>\n\n<strong>\nالمزيد من فرص العمل عالية الجودة لغويانغ!\n</strong>\n\n</p>\n\n<p>\nيمثل المركز العالمي المقترح\nللذكاء الاصطناعي\nفرصة مهمة\nلمدينة غويانغ الخاصة\nللتطور بوصفها مركزاً\nللتعاون الدولي\nوالصناعات المرتبطة\nبالذكاء الاصطناعي.\n</p>\n\n<p>\nتسعى اللجنة المدنية الداعمة\nإلى توسيع فهم الجمهور\nلهذه المبادرة،\nوتشجيع المشاركة الطوعية\nللمواطنين،\nوالمهنيين،\nوالمنظمات المدنية.\n</p>\n\n<p>\n\n<strong>\nيمكن لمشاركتكم\nأن تسهم في تعزيز\nالدعم الشعبي\nلاستقطاب المركز العالمي\nللذكاء الاصطناعي\nإلى مدينة غويانغ الخاصة.\n</strong>\n\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     LANGUAGE NOTICE\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nمعلومات للزوار الدوليين\n</strong>\n\n<p>\nتقدم هذه الصفحة\nبرامج المشاركة المدنية\nالتابعة للجنة\nباللغة العربية.\n</p>\n\n<p>\nتتوفر استمارات التقديم\nحالياً باللغة الكورية.\nيرجى مراجعة المعلومات\nالواردة في كل استمارة\nقبل تقديم أي بيانات شخصية.\n</p>\n\n<p>\nتخضع المساهمات المالية\nوإجراءات المشاركة ذات الصلة\nللقواعد والمتطلبات\nالمعمول بها لدى اللجنة.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     PUBLIC SUPPORT CAMPAIGN\n===================================== -->\n\n<section class=\"signature\">\n\n<h2>\nحملة دعم 100,000 مواطن\n</h2>\n\n<p>\nانضموا إلى حملة التوقيعات الشعبية\nالداعمة لاستقطاب\nالمركز العالمي المقترح\nللذكاء الاصطناعي\nإلى مدينة غويانغ الخاصة.\n</p>\n\n<p>\nمن خلال جمع أصوات\nالمواطنين الأفراد،\nنسعى إلى تعزيز\nالوعي العام والدعم الشعبي\nللتنمية المستقبلية\nلمدينة غويانغ.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\nالمشاركة في حملة الدعم عبر الإنترنت\n</a>\n\n<p class=\"small-note\">\nاستمارة التقديم باللغة الكورية.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     PARTICIPATION PROGRAMS\n===================================== -->\n\n<div class=\"grid\">\n\n\u003c!-- =====================================\n     COMMITTEE REGISTRATION\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nالتسجيل عضواً في اللجنة\n</h3>\n\n<p>\nنرحب بالمواطنين،\nوالمهنيين،\nوممثلي المنظمات المدنية،\nوغيرهم من المهتمين\nالراغبين في دعم\nمبادرة المركز العالمي\nللذكاء الاصطناعي.\n</p>\n\n<p>\nتتيح المشاركة في اللجنة\nفرصة للمساهمة\nفي تعزيز المشاركة العامة،\nومناقشات السياسات،\nوالأنشطة المجتمعية.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\nالتسجيل في اللجنة\n</a>\n\n<p class=\"small-note\">\nاستمارة التقديم باللغة الكورية.\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     SUPPORTING MEMBERSHIP\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nالعضوية الداعمة\n</h3>\n\n<p>\nانضموا كأعضاء داعمين\nللمساعدة في استمرار\nالأنشطة المدنية،\nوالتواصل العام،\nوالتعريف بالسياسات\nالمتعلقة بمبادرة\nالمركز العالمي للذكاء الاصطناعي.\n</p>\n\n<p>\nيمكن دفع مساهمات\nالعضوية الداعمة\nإلى الحساب البنكي المخصص\nالموضح أدناه.\n</p>\n\n\u003c!-- AUTOMATIC ACCOUNT DISPLAY -->\n\n<div\n  id=\"membershipAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\nطلب العضوية الداعمة\n</a>\n\n<p class=\"small-note\">\nاستمارة التقديم باللغة الكورية.\nيرجى التأكد من أحدث تعليمات الدفع\nقبل تحويل أي أموال.\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     BANNER APPLICATION\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nطلب تركيب لافتة ترويجية\n</h3>\n\n<p>\nشاركوا في أنشطة\nالتوعية العامة\nمن خلال التقدم بطلب\nلعرض لافتات ترويجية\nتدعم المركز العالمي\nالمقترح للذكاء الاصطناعي\nفي غويانغ.\n</p>\n\n<p>\nبعد تقديم الطلب،\nيرجى دفع التكلفة المقررة\nإلى الحساب البنكي المخصص\nالموضح أدناه.\n</p>\n\n<p>\nيجب أن يتوافق\nتركيب اللافتات\nمع اللوائح المحلية،\nوالقوانين المعمول بها،\nومتطلبات المواقع.\n</p>\n\n\u003c!-- AUTOMATIC ACCOUNT DISPLAY -->\n\n<div\n  id=\"bannerAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\nطلب لافتة ترويجية\n</a>\n\n<p class=\"small-note\">\nاستمارة التقديم باللغة الكورية.\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     VEHICLE STICKER\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nملصق ترويجي للمركبات\n</h3>\n\n<p>\nساعدوا في تعزيز\nالوعي العام\nبمبادرة المركز العالمي\nللذكاء الاصطناعي\nمن خلال وضع\nملصق ترويجي\nعلى مركباتكم.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/cisRHEsN61pxVycG8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\nطلب ملصق للمركبة\n</a>\n\n<p class=\"small-note\">\nاستمارة التقديم باللغة الكورية.\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     KAKAOTALK COMMUNITY\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nمجتمع كاكاوتوك\n</h3>\n\n<p>\nانضموا إلى مجموعة\nالتواصل التابعة للجنة\nعلى تطبيق كاكاوتوك\nلتبادل المعلومات\nحول الأنشطة،\nوالمشاركة العامة،\nوالتطورات المتعلقة\nبمبادرة المركز العالمي\nللذكاء الاصطناعي.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://invite.kakao.com/tc/6vBTJeOAAa\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\nالانضمام إلى مجتمع كاكاوتوك\n</a>\n\n<p class=\"small-note\">\nتُجرى المناقشات المجتمعية\nباللغة الكورية في الغالب.\n</p>\n\n</article>\n\n\u003c!-- =====================================\n     FACEBOOK COMMUNITY\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nمجموعة النقاش على فيسبوك\n</h3>\n\n<p>\nشاركوا المعلومات،\nوتبادلوا وجهات النظر،\nوشاركوا في المناقشات العامة\nحول مبادرة المركز العالمي\nالمقترح للذكاء الاصطناعي.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://fb.me/g/8JVQBabwP/W4YofuHk\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\nالانضمام إلى مجموعة فيسبوك\n</a>\n\n</article>\n\n\u003c!-- =====================================\n     ACTIVITY GALLERY\n===================================== -->\n\n<article class=\"card\">\n\n<h3>\nمعرض أنشطة اللجنة\n</h3>\n\n<p>\nاستكشفوا الصور\nالتي توثق أنشطة\nاللجنة المدنية الداعمة\nوحملة الدعم الشعبي.\n</p>\n\n<a\n  class=\"button\"\n  href=\"gallery.html?lang=ar\"\n>\nعرض معرض الأنشطة (باللغة الكورية)\n</a>\n\n</article>\n\n</div>\n\n\u003c!-- =====================================\n     PARTICIPATION NOTICE\n===================================== -->\n\n<section class=\"notice\">\n\n<h2>\nمعلومات المشاركة\n</h2>\n\n<p>\nتدير اللجنة المدنية الداعمة\nعدة برامج للمشاركة،\nبما في ذلك\nحملة التوقيعات الشعبية،\nوالتسجيل في اللجنة،\nوالعضوية الداعمة،\nوطلبات اللافتات الترويجية،\nوطلبات ملصقات المركبات.\n</p>\n\n<p>\nيُقدَّم كل طلب\nمن خلال الاستمارة الإلكترونية\nالمخصصة له.\nويجب على المشاركين\nمراجعة الغرض من الطلب،\nوالمعلومات المتعلقة\nبجمع البيانات الشخصية\nواستخدامها،\nقبل تقديم الطلب.\n</p>\n\n<p>\nيجب دفع مساهمات\nالعضوية الداعمة\nوتكاليف اللافتات الترويجية\nفقط إلى الحسابات البنكية\nالتي تعلن عنها اللجنة رسمياً.\n</p>\n\n<p>\nيرجى التحقق\nمن أحدث تفاصيل الحسابات\nوشروط الدفع\nقبل إجراء أي تحويل مالي.\n</p>\n\n<p>\nللحصول على معلومات\nحول حماية البيانات الشخصية،\nيرجى الاطلاع على\n\n<a href=\"index.html?view=privacy\">\nسياسة الخصوصية (باللغة الكورية)\n</a>.\n\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     RELATED PAGES\n===================================== -->\n\n<section class=\"notice\">\n\n<h2>\nاكتشف المزيد\n</h2>\n\n<p>\nتعرفوا على المزيد\nحول اللجنة،\nوأهدافها،\nومبادرة المركز العالمي\nللذكاء الاصطناعي.\n</p>\n\n<a\n  class=\"button\"\n  href=\"committee.html?lang=ar\"\n>\nحول اللجنة المدنية الداعمة\n</a>\n\n<a\n  class=\"button\"\n  href=\"hub.html?lang=ar\"\n>\nحول المركز العالمي للذكاء الاصطناعي\n</a>\n\n<a\n  class=\"button\"\n  href=\"news.html?lang=ar\"\n>\nالأخبار والإعلانات\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n\n<strong>\nاللجنة المدنية لدعم استقطاب<br>\nالمركز العالمي للذكاء الاصطناعي<br>\nإلى مدينة غويانغ الخاصة\n</strong>\n\n</p>\n\n<p>\nمقاطعة غيونغي،\nجمهورية كوريا\n</p>\n\n<p>\nمع المواطنين،\nومع مقاطعة غيونغي،\nومع العالم.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ar\">\nالصفحة الرئيسية العربية\n</a>\n\n&nbsp; | &nbsp;\n\n<a\n  href=\"participate.html\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE PAYMENT ACCOUNT MODULE\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE CONNECTION\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   AUTOMATIC PAYMENT ACCOUNT DISPLAY\n===================================== */\n\nasync function loadPaymentAccounts() {\n\n  const targets = {\n    membership: \"membershipAccountInfo\",\n    banner: \"bannerAccountInfo\"\n  };\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"payment_accounts\")\n        .select(\n          \"account_type, bank_name, account_number, account_holder\"\n        );\n\n    if (error) {\n      throw error;\n    }\n\n    for (const account of data || []) {\n\n      const targetId =\n        targets[account.account_type];\n\n      if (!targetId) continue;\n\n      const container =\n        document.getElementById(targetId);\n\n      if (!container) continue;\n\n      const bank =\n        String(\n          account.bank_name || \"\"\n        ).trim();\n\n      const number =\n        String(\n          account.account_number || \"\"\n        ).trim();\n\n      const holder =\n        String(\n          account.account_holder || \"\"\n        ).trim();\n\n      if (\n        !bank ||\n        !number ||\n        !holder\n      ) {\n        continue;\n      }\n\n      container.replaceChildren();\n\n      /* TITLE */\n\n      const title =\n        document.createElement(\"strong\");\n\n      title.textContent =\n        \"الحساب البنكي المخصص للدفع\";\n\n      /* BANK NAME */\n\n      const bankLine =\n        document.createElement(\"p\");\n\n      bankLine.textContent =\n        \"البنك: \" + bank;\n\n      /* ACCOUNT NUMBER */\n\n      const numberLine =\n        document.createElement(\"p\");\n\n      const numberLabel =\n        document.createElement(\"span\");\n\n      numberLabel.textContent =\n        \"رقم الحساب: \";\n\n      const numberValue =\n        document.createElement(\"bdi\");\n\n      numberValue.className =\n        \"account-number\";\n\n      numberValue.dir = \"ltr\";\n\n      numberValue.textContent =\n        number;\n\n      numberLine.append(\n        numberLabel,\n        numberValue\n      );\n\n      /* ACCOUNT HOLDER */\n\n      const holderLine =\n        document.createElement(\"p\");\n\n      holderLine.textContent =\n        \"اسم صاحب الحساب: \" + holder;\n\n      container.append(\n        title,\n        bankLine,\n        numberLine,\n        holderLine\n      );\n\n      container.hidden = false;\n\n    }\n\n    console.log(\n      \"Arabic payment account information loaded.\"\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"Payment account query failed:\",\n      error\n    );\n\n  }\n\n}\n\n/* =====================================\n   INITIAL LOAD\n===================================== */\n\nloadPaymentAccounts();\n\n\u003c/script>\n\n</body>\n</html>\n",

0 3px 12px rgba(0,0,0,.08);\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  color: #0754a6;\n  font-size: 22px;\n  margin-top: 0;\n}\n\n.card p {\n  color: #46566d;\n}\n\n/* SCHALTFLÄCHEN */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover,\n.button:focus-visible {\n  background: #003a7a;\n}\n\n/* UNTERSTÜTZUNGSKAMPAGNE */\n\n.signature {\n  background: #eaf4ff;\n  border: 2px solid #168de0;\n  padding: 30px;\n  border-radius: 12px;\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.signature h2 {\n  color: #0754a6;\n  font-size: 30px;\n}\n\n.signature p {\n  font-size: 18px;\n}\n\n/* HINWEISE */\n\n.notice {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  margin-top: 35px;\n}\n\n.notice h2 {\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 30px;\n}\n\n.small-note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* ZAHLUNGSKONTO-INFORMATIONEN */\n\n.payment-account-info {\n  margin: 15px 0;\n  padding: 16px;\n  background: #eaf4ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 8px;\n  color: #17315b;\n  font-size: 15px;\n  line-height: 1.8;\n  overflow-wrap: anywhere;\n}\n\n.payment-account-info[hidden] {\n  display: none !important;\n}\n\n.payment-account-info strong {\n  display: block;\n  color: #0754a6;\n  margin-bottom: 5px;\n}\n\n.payment-account-info p {\n  margin: 5px 0;\n}\n\n/* FUSSZEILE */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* MOBILE ANSICHT */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .signature {\n    padding: 20px;\n  }\n\n  .signature h2 {\n    font-size: 25px;\n  }\n\n  .card {\n    padding: 22px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- KOPFBEREICH -->\n\n<header>\n\n<h1>\nBürgerbeteiligungszentrum\n</h1>\n\n<p>\nInitiative für ein globales KI-Zentrum<br>\nSonderstadt Goyang,\nProvinz Gyeonggi,\nRepublik Korea\n</p>\n\n<p>\nGemeinsam mit den Bürgerinnen und Bürgern<br>\neine neue Zukunft für Goyang gestalten\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=de\"\n  class=\"home-link\"\n>\n  ← Deutsche Startseite\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- EINFÜHRUNG -->\n\n<div class=\"intro\">\n\n<h2>\nDas globale KI-Zentrum nach Goyang holen!\n</h2>\n\n<p>\n<strong>\nNeue Wachstumschancen für Goyang!\n</strong>\n<br>\n<strong>\nMehr hochwertige Arbeitsplätze für Goyang!\n</strong>\n</p>\n\n<p>\nDas geplante globale KI-Zentrum\nbietet der Sonderstadt Goyang\neine wichtige Gelegenheit,\nsich als Zentrum\ninternationaler Zusammenarbeit\nund KI-bezogener Industrien\nweiterzuentwickeln.\n</p>\n\n<p>\nDas Bürgerkomitee\nmöchte das öffentliche Verständnis\nfür die Initiative stärken\nund die freiwillige Beteiligung\nvon Bürgerinnen und Bürgern,\nFachleuten\nund zivilgesellschaftlichen Organisationen fördern.\n</p>\n\n<p>\n<strong>\nIhre Beteiligung kann dazu beitragen,\ndie öffentliche Unterstützung\nfür die Ansiedlung\ndes globalen KI-Zentrums\nin der Sonderstadt Goyang zu stärken.\n</strong>\n</p>\n\n</div>\n\n\u003c!-- SPRACHHINWEIS -->\n\n<div class=\"language-notice\">\n\n<strong>\nInformationen für internationale Besucher\n</strong>\n\n<p>\nDiese deutschsprachige Seite\nstellt die Programme\nzur Bürgerbeteiligung\ndes Komitees vor.\n</p>\n\n<p>\nDie Antragsformulare\nstehen derzeit\nin koreanischer Sprache zur Verfügung.\nBitte prüfen Sie\ndie Informationen\nin jedem Formular sorgfältig,\nbevor Sie personenbezogene Daten übermitteln.\n</p>\n\n<p>\nFinanzielle Beiträge\nund die damit verbundenen\nTeilnahmeverfahren\nunterliegen den geltenden Regeln\nund Anforderungen des Komitees.\n</p>\n\n</div>\n\n\u003c!-- ÖFFENTLICHE UNTERSTÜTZUNGSKAMPAGNE -->\n\n<section class=\"signature\">\n\n<h2>\nUnterstützungskampagne von 100.000 Bürgerinnen und Bürgern\n</h2>\n\n<p>\nBeteiligen Sie sich\nan der öffentlichen Unterschriftenkampagne\nzur Unterstützung\ndes geplanten globalen KI-Zentrums\nin der Sonderstadt Goyang.\n</p>\n\n<p>\nIndem wir die Stimmen\neinzelner Bürgerinnen und Bürger\nzusammenbringen,\nmöchten wir\ndas öffentliche Bewusstsein\nund die Unterstützung\nfür die zukünftige Entwicklung Goyangs stärken.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  An der Online-Unterstützungskampagne teilnehmen\n</a>\n\n<p class=\"small-note\">\nAntragsformular auf Koreanisch.\n</p>\n\n</section>\n\n\u003c!-- BETEILIGUNGSPROGRAMME -->\n\n<div class=\"grid\">\n\n\u003c!-- REGISTRIERUNG IM BÜRGERKOMITEE -->\n\n<article class=\"card\">\n\n<h3>\nAls Mitglied des Bürgerkomitees registrieren\n</h3>\n\n<p>\nWir begrüßen Bürgerinnen und Bürger,\nFachleute,\nVertreterinnen und Vertreter\nzivilgesellschaftlicher Organisationen\nsowie weitere Interessierte,\ndie die Initiative\nfür ein globales KI-Zentrum unterstützen möchten.\n</p>\n\n<p>\nDie Mitarbeit im Bürgerkomitee\nbietet die Möglichkeit,\nsich an der Öffentlichkeitsarbeit,\nan politischen Diskussionen\nund an gemeinschaftlichen Aktivitäten\nzu beteiligen.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Registrierung im Bürgerkomitee\n</a>\n\n<p class=\"small-note\">\nAntragsformular auf Koreanisch.\n</p>\n\n</article>\n\n\u003c!-- FÖRDERMITGLIEDSCHAFT -->\n\n<article class=\"card\">\n\n<h3>\nFördermitgliedschaft\n</h3>\n\n<p>\nWerden Sie Fördermitglied,\num zivilgesellschaftliche Aktivitäten,\nöffentliche Kommunikation\nund politische Informationsarbeit\nim Zusammenhang\nmit der Initiative\nfür ein globales KI-Zentrum zu unterstützen.\n</p>\n\n<p>\nBeiträge zur Fördermitgliedschaft\nkönnen auf das unten angezeigte\ndafür vorgesehene Bankkonto\nüberwiesen werden.\n</p>\n\n\u003c!-- AUTOMATISCHE KONTOANZEIGE -->\n\n<div\n  id=\"membershipAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Fördermitgliedschaft beantragen\n</a>\n\n<p class=\"small-note\">\nAntragsformular auf Koreanisch.\nBitte überprüfen Sie\nvor einer Überweisung\ndie aktuellen Zahlungsinformationen.\n</p>\n\n</article>\n\n\u003c!-- WERBEBANNER -->\n\n<article class=\"card\">\n\n<h3>\nAntrag auf ein Werbebanner\n</h3>\n\n<p>\nBeteiligen Sie sich\nan der öffentlichen Informationsarbeit,\nindem Sie die Aufstellung\neines Werbebanners\nzur Unterstützung\ndes geplanten globalen KI-Zentrums\nin Goyang beantragen.\n</p>\n\n<p>\nBitte überweisen Sie\nnach Einreichung des Antrags\ndie entsprechenden Kosten\nauf das unten angezeigte\ndafür vorgesehene Bankkonto.\n</p>\n\n<p>\nDie Anbringung von Werbebannern\nmuss den örtlichen Vorschriften,\ngeltenden Gesetzen\nund Standortanforderungen entsprechen.\n</p>\n\n\u003c!-- AUTOMATISCHE KONTOANZEIGE -->\n\n<div\n  id=\"bannerAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Werbebanner beantragen\n</a>\n\n<p class=\"small-note\">\nAntragsformular auf Koreanisch.\n</p>\n\n</article>\n\n\u003c!-- FAHRZEUGAUFKLEBER -->\n\n<article class=\"card\">\n\n<h3>\nWerbeaufkleber für Fahrzeuge\n</h3>\n\n<p>\nHelfen Sie dabei,\ndas öffentliche Bewusstsein\nfür die Initiative\neines globalen KI-Zentrums zu stärken,\nindem Sie einen Werbeaufkleber\nan Ihrem Fahrzeug anbringen.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/cisRHEsN61pxVycG8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Fahrzeugaufkleber beantragen\n</a>\n\n<p class=\"small-note\">\nAntragsformular auf Koreanisch.\n</p>\n\n</article>\n\n\u003c!-- KAKAOTALK-GEMEINSCHAFT -->\n\n<article class=\"card\">\n\n<h3>\nKakaoTalk-Gemeinschaft\n</h3>\n\n<p>\nTreten Sie\nder KakaoTalk-Kommunikationsgruppe\ndes Bürgerkomitees bei,\num Informationen\nüber Aktivitäten,\nBürgerbeteiligung\nund Entwicklungen\nim Zusammenhang\nmit der Initiative\nfür ein globales KI-Zentrum auszutauschen.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://invite.kakao.com/tc/6vBTJeOAAa\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Der KakaoTalk-Gemeinschaft beitreten\n</a>\n\n<p class=\"small-note\">\nDie Kommunikation erfolgt\nüberwiegend auf Koreanisch.\n</p>\n\n</article>\n\n\u003c!-- FACEBOOK-GRUPPE -->\n\n<article class=\"card\">\n\n<h3>\nFacebook-Diskussionsgruppe\n</h3>\n\n<p>\nTeilen Sie Informationen,\ntauschen Sie Perspektiven aus\nund beteiligen Sie sich\nan öffentlichen Diskussionen\nüber die geplante Initiative\nfür ein globales KI-Zentrum.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://fb.me/g/8JVQBabwP/W4YofuHk\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Der Facebook-Gruppe beitreten\n</a>\n\n</article>\n\n\u003c!-- AKTIVITÄTSGALERIE -->\n\n<article class=\"card\">\n\n<h3>\nAktivitätsgalerie des Bürgerkomitees\n</h3>\n\n<p>\nEntdecken Sie Fotografien,\ndie die Aktivitäten\ndes Bürgerkomitees\nund die öffentliche Unterstützungskampagne\ndokumentieren.\n</p>\n\n<a\n  class=\"button\"\n  href=\"gallery.html?lang=de\"\n>\n  Aktivitätsgalerie ansehen (Koreanisch)\n</a>\n\n</article>\n\n</div>\n\n\u003c!-- INFORMATIONEN ZUR TEILNAHME -->\n\n<section class=\"notice\">\n\n<h2>\nInformationen zur Teilnahme\n</h2>\n\n<p>\nDas Bürgerkomitee\norganisiert verschiedene Programme\nzur Bürgerbeteiligung.\nDazu gehören\ndie öffentliche Unterschriftenkampagne,\ndie Registrierung im Bürgerkomitee,\nFördermitgliedschaften,\nAnträge auf Werbebanner\nund Fahrzeugaufkleber.\n</p>\n\n<p>\nJeder Antrag wird\nüber das entsprechende\nOnline-Formular eingereicht.\nTeilnehmende sollten\nvor der Antragstellung\nden Zweck des Formulars\nund die Informationen\nüber die Erhebung\nund Verwendung\npersonenbezogener Daten prüfen.\n</p>\n\n<p>\nBeiträge zur Fördermitgliedschaft\nund Kosten für Werbebanner\nsollten ausschließlich\nauf die vom Bürgerkomitee\noffiziell angegebenen Bankkonten\nüberwiesen werden.\n</p>\n\n<p>\nBitte überprüfen Sie\nvor einer Überweisung\ndie aktuellen Kontodaten\nund Zahlungsbedingungen.\n</p>\n\n<p>\nInformationen\nzum Schutz personenbezogener Daten\nfinden Sie in der\n<a href=\"index.html?view=privacy\">\nDatenschutzerklärung (Koreanisch)\n</a>.\n</p>\n\n</section>\n\n\u003c!-- WEITERE INFORMATIONEN -->\n\n<section class=\"notice\">\n\n<h2>\nWeitere Informationen entdecken\n</h2>\n\n<p>\nErfahren Sie mehr\nüber das Bürgerkomitee,\nseine Ziele\nund die Initiative\nfür ein globales KI-Zentrum.\n</p>\n\n<a\n  class=\"button\"\n  href=\"committee.html?lang=de\"\n>\n  Über das Bürgerkomitee\n</a>\n\n<a\n  class=\"button\"\n  href=\"hub.html?lang=de\"\n>\n  Über das globale KI-Zentrum\n</a>\n\n<a\n  class=\"button\"\n  href=\"news.html?lang=de\"\n>\n  Nachrichten und Bekanntmachungen\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- FUSSZEILE -->\n\n<footer>\n\n<p>\n<strong>\nBürgerkomitee zur Förderung<br>\nder Ansiedlung eines globalen KI-Zentrums<br>\nin der Sonderstadt Goyang\n</strong>\n</p>\n\n<p>\nProvinz Gyeonggi,\nRepublik Korea\n</p>\n\n<p>\nMit den Bürgerinnen und Bürgern,<br>\nmit der Provinz Gyeonggi<br>\nund mit der Welt.\n</p>\n\n<p>\n<a href=\"index.html?lang=de\">\nDeutsche Startseite\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE-ZAHLUNGSKONTENMODUL\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE-VERBINDUNG\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   AUTOMATISCHE ANZEIGE DER BANKKONTEN\n===================================== */\n\nasync function loadPaymentAccounts() {\n\n  const targets = {\n    membership: \"membershipAccountInfo\",\n    banner: \"bannerAccountInfo\"\n  };\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"payment_accounts\")\n        .select(\n          \"account_type, bank_name, account_number, account_holder\"\n        );\n\n    if (error) {\n      throw error;\n    }\n\n    for (const account of data || []) {\n\n      const targetId =\n        targets[account.account_type];\n\n      if (!targetId) continue;\n\n      const container =\n        document.getElementById(targetId);\n\n      if (!container) continue;\n\n      const bank =\n        String(\n          account.bank_name || \"\"\n        ).trim();\n\n      const number =\n        String(\n          account.account_number || \"\"\n        ).trim();\n\n      const holder =\n        String(\n          account.account_holder || \"\"\n        ).trim();\n\n      if (\n        !bank ||\n        !number ||\n        !holder\n      ) {\n        continue;\n      }\n\n      container.replaceChildren();\n\n      /* TITEL */\n\n      const title =\n        document.createElement(\"strong\");\n\n      title.textContent =\n        \"Offiziell angegebenes Zahlungskonto\";\n\n      /* BANK */\n\n      const bankLine =\n        document.createElement(\"p\");\n\n      bankLine.textContent =\n        \"Bank: \" + bank;\n\n      /* KONTONUMMER */\n\n      const numberLine =\n        document.createElement(\"p\");\n\n      numberLine.textContent =\n        \"Kontonummer: \" + number;\n\n      /* KONTOINHABER */\n\n      const holderLine =\n        document.createElement(\"p\");\n\n      holderLine.textContent =\n        \"Kontoinhaber: \" + holder;\n\n      container.append(\n        title,\n        bankLine,\n        numberLine,\n        holderLine\n      );\n\n      container.hidden = false;\n\n    }\n\n    console.log(\n      \"Zahlungskontoinformationen geladen.\"\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"Abfrage der Zahlungskonten fehlgeschlagen:\",\n      error\n    );\n\n  }\n\n}\n\n/* =====================================\n   ERSTER LADEVORGANG\n===================================== */\n\nloadPaymentAccounts();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=en": "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nCitizen Participation Center |\nGlobal AI Hub Initiative\n</title>\n\n<meta\n  name=\"description\"\n  content=\"Participate in the Global AI Hub initiative in Goyang Special City through the public support campaign, Committee registration, supporting membership, and community activities.\"\n>\n\n<style>\n\n/* BASIC SETTINGS */\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* HEADER */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n/* MAIN */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  font-size: 28px;\n}\n\n.intro strong {\n  color: #0754a6;\n}\n\n/* GRID */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: white;\n  border-radius: 12px;\n  padding: 28px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.08);\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  color: #0754a6;\n  font-size: 22px;\n  margin-top: 0;\n}\n\n.card p {\n  color: #46566d;\n}\n\n/* BUTTONS */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover,\n.button:focus-visible {\n  background: #003a7a;\n}\n\n/* SIGNATURE */\n\n.signature {\n  background: #eaf4ff;\n  border: 2px solid #168de0;\n  padding: 30px;\n  border-radius: 12px;\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.signature h2 {\n  color: #0754a6;\n  font-size: 30px;\n}\n\n.signature p {\n  font-size: 18px;\n}\n\n/* NOTICE */\n\n.notice {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  margin-top: 35px;\n}\n\n.notice h2 {\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 30px;\n}\n\n.small-note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* PAYMENT ACCOUNT INFORMATION */\n\n.payment-account-info {\n  margin: 15px 0;\n  padding: 16px;\n  background: #eaf4ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 8px;\n  color: #17315b;\n  font-size: 15px;\n  line-height: 1.8;\n  overflow-wrap: anywhere;\n}\n\n.payment-account-info[hidden] {\n  display: none !important;\n}\n\n.payment-account-info strong {\n  display: block;\n  color: #0754a6;\n  margin-bottom: 5px;\n}\n\n.payment-account-info p {\n  margin: 5px 0;\n}\n\n/* FOOTER */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* MOBILE */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .signature {\n    padding: 20px;\n  }\n\n  .signature h2 {\n    font-size: 25px;\n  }\n\n  .card {\n    padding: 22px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- HEADER -->\n\n<header>\n\n<h1>\nCitizen Participation Center\n</h1>\n\n<p>\nGlobal AI Hub Initiative<br>\nGoyang Special City,\nGyeonggi Province,\nRepublic of Korea\n</p>\n\n<p>\nBuilding a New Future for Goyang\nThrough Citizen Participation\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=en\"\n  class=\"home-link\"\n>\n  ← English Home\n</a>\n\n<a\n  href=\"participate.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n>\n  한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- INTRODUCTION -->\n\n<div class=\"intro\">\n\n<h2>\nBring the Global AI Hub to Goyang!\n</h2>\n\n<p>\n<strong>\nNew Growth Opportunities for Goyang!\n</strong>\n<br>\n<strong>\nMore High-Quality Jobs for Goyang!\n</strong>\n</p>\n\n<p>\nThe proposed Global AI Hub\nrepresents an important opportunity\nfor Goyang Special City\nto develop as a center\nfor international cooperation\nand AI-related industries.\n</p>\n\n<p>\nThe Citizens' Promotion Committee\nseeks to expand public understanding\nof the initiative\nand encourage voluntary participation\nby citizens,\nprofessionals,\nand civic organizations.\n</p>\n\n<p>\n<strong>\nYour participation can help\nstrengthen public support\nfor bringing the Global AI Hub\nto Goyang Special City.\n</strong>\n</p>\n\n</div>\n\n\u003c!-- LANGUAGE NOTICE -->\n\n<div class=\"language-notice\">\n\n<strong>\nInformation for International Visitors\n</strong>\n\n<p>\nThis page introduces\nthe Committee's citizen participation\nprograms in English.\n</p>\n\n<p>\nThe application forms\nare currently provided in Korean.\nPlease review the information\nin each form before submitting\npersonal information.\n</p>\n\n<p>\nFinancial contributions\nand related participation procedures\nare subject to the Committee's\napplicable rules and requirements.\n</p>\n\n</div>\n\n\u003c!-- PUBLIC SUPPORT CAMPAIGN -->\n\n<section class=\"signature\">\n\n<h2>\n100,000 Citizens' Support Campaign\n</h2>\n\n<p>\nJoin the public signature campaign\nsupporting the proposed\nGlobal AI Hub in Goyang Special City.\n</p>\n\n<p>\nBy bringing together\nthe voices of individual citizens,\nwe seek to strengthen\npublic awareness and support\nfor Goyang's future development.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Join the Online Support Campaign\n</a>\n\n<p class=\"small-note\">\nApplication form in Korean.\n</p>\n\n</section>\n\n\u003c!-- PARTICIPATION PROGRAMS -->\n\n<div class=\"grid\">\n\n\u003c!-- COMMITTEE REGISTRATION -->\n\n<article class=\"card\">\n\n<h3>\nRegister as a Committee Member\n</h3>\n\n<p>\nWe welcome citizens,\nprofessionals,\nrepresentatives of civic organizations,\nand other interested participants\nwho wish to support\nthe Global AI Hub initiative.\n</p>\n\n<p>\nCommittee participation\nprovides an opportunity\nto contribute to public engagement,\npolicy discussions,\nand community activities.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Committee Registration\n</a>\n\n<p class=\"small-note\">\nApplication form in Korean.\n</p>\n\n</article>\n\n\u003c!-- SUPPORTING MEMBERSHIP -->\n\n<article class=\"card\">\n\n<h3>\nSupporting Membership\n</h3>\n\n<p>\nBecome a supporting member\nto help sustain civic activities,\npublic communication,\nand policy outreach\nrelated to the Global AI Hub initiative.\n</p>\n\n<p>\nSupporting membership contributions\nmay be paid to the designated\nbank account shown below.\n</p>\n\n\u003c!-- AUTOMATIC ACCOUNT DISPLAY -->\n\n<div\n  id=\"membershipAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Apply for Supporting Membership\n</a>\n\n<p class=\"small-note\">\nApplication form in Korean.\nPlease confirm the latest payment\ninstructions before transferring funds.\n</p>\n\n</article>\n\n\u003c!-- BANNER APPLICATION -->\n\n<article class=\"card\">\n\n<h3>\nPromotional Banner Application\n</h3>\n\n<p>\nParticipate in public awareness\nactivities by applying\nto display promotional banners\nsupporting the proposed\nGlobal AI Hub in Goyang.\n</p>\n\n<p>\nAfter submitting the application,\nplease pay the applicable cost\nto the designated bank account\nshown below.\n</p>\n\n<p>\nBanner placement must comply\nwith local regulations,\napplicable laws,\nand location requirements.\n</p>\n\n\u003c!-- AUTOMATIC ACCOUNT DISPLAY -->\n\n<div\n  id=\"bannerAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Apply for a Promotional Banner\n</a>\n\n<p class=\"small-note\">\nApplication form in Korean.\n</p>\n\n</article>\n\n\u003c!-- VEHICLE STICKER -->\n\n<article class=\"card\">\n\n<h3>\nVehicle Promotion Sticker\n</h3>\n\n<p>\nHelp raise public awareness\nof the Global AI Hub initiative\nby displaying a promotional sticker\non your vehicle.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/cisRHEsN61pxVycG8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Apply for a Vehicle Sticker\n</a>\n\n<p class=\"small-note\">\nApplication form in Korean.\n</p>\n\n</article>\n\n\u003c!-- KAKAO COMMUNITY -->\n\n<article class=\"card\">\n\n<h3>\nKakaoTalk Community\n</h3>\n\n<p>\nJoin the Committee's\nKakaoTalk communication group\nto exchange information\nabout activities,\npublic participation,\nand developments\nrelated to the Global AI Hub initiative.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://invite.kakao.com/tc/6vBTJeOAAa\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Join the KakaoTalk Community\n</a>\n\n<p class=\"small-note\">\nCommunity discussions are\nprimarily conducted in Korean.\n</p>\n\n</article>\n\n\u003c!-- FACEBOOK COMMUNITY -->\n\n<article class=\"card\">\n\n<h3>\nFacebook Discussion Group\n</h3>\n\n<p>\nShare information,\nexchange perspectives,\nand participate\nin public discussions\nabout the proposed\nGlobal AI Hub initiative.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://fb.me/g/8JVQBabwP/W4YofuHk\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Join the Facebook Group\n</a>\n\n</article>\n\n\u003c!-- ACTIVITY GALLERY -->\n\n<article class=\"card\">\n\n<h3>\nCommittee Activity Gallery\n</h3>\n\n<p>\nExplore photographs\ndocumenting the activities\nof the Citizens' Promotion Committee\nand the public support campaign.\n</p>\n\n<a\n  class=\"button\"\n  href=\"gallery.html?lang=en\"\n>\n  View Activity Gallery (Korean)\n</a>\n\n</article>\n\n</div>\n\n\u003c!-- PARTICIPATION NOTICE -->\n\n<section class=\"notice\">\n\n<h2>\nParticipation Information\n</h2>\n\n<p>\nThe Citizens' Promotion Committee\noperates several participation programs,\nincluding the public signature campaign,\nCommittee registration,\nsupporting membership,\npromotional banner applications,\nand vehicle sticker applications.\n</p>\n\n<p>\nEach application is submitted\nthrough the relevant online form.\nParticipants should review\nthe purpose of the application\nand the information concerning\nthe collection and use\nof personal data before applying.\n</p>\n\n<p>\nSupporting membership contributions\nand promotional banner costs\nshould be paid only\nto the designated bank accounts\nofficially provided by the Committee.\n</p>\n\n<p>\nPlease verify the latest\naccount details and payment conditions\nbefore making a transfer.\n</p>\n\n<p>\nFor information about\npersonal data protection,\nplease refer to the\n<a href=\"index.html?view=privacy\">\nPrivacy Policy (Korean)\n</a>.\n</p>\n\n</section>\n\n\u003c!-- RELATED PAGES -->\n\n<section class=\"notice\">\n\n<h2>\nExplore More\n</h2>\n\n<p>\nLearn more about the Committee,\nits objectives,\nand the Global AI Hub initiative.\n</p>\n\n<a\n  class=\"button\"\n  href=\"committee.html?lang=en\"\n>\n  About the Committee\n</a>\n\n<a\n  class=\"button\"\n  href=\"hub.html?lang=en\"\n>\n  About the Global AI Hub\n</a>\n\n<a\n  class=\"button\"\n  href=\"news.html?lang=en\"\n>\n  News & Announcements\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- FOOTER -->\n\n<footer>\n\n<p>\n<strong>\nCitizens' Promotion Committee<br>\nfor Attracting the Global AI Hub<br>\nto Goyang Special City\n</strong>\n</p>\n\n<p>\nGyeonggi Province,\nRepublic of Korea\n</p>\n\n<p>\nWith Citizens,\nWith Gyeonggi Province,\nand With the World.\n</p>\n\n<p>\n<a href=\"index.html?lang=en\">\nEnglish Home\n</a>\n&nbsp; | &nbsp;\n<a href=\"participate.html\" lang=\"ko\">\n한국어\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE PAYMENT ACCOUNT MODULE\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE CONNECTION\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   AUTOMATIC PAYMENT ACCOUNT DISPLAY\n===================================== */\n\nasync function loadPaymentAccounts() {\n\n  const targets = {\n    membership: \"membershipAccountInfo\",\n    banner: \"bannerAccountInfo\"\n  };\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"payment_accounts\")\n        .select(\n          \"account_type, bank_name, account_number, account_holder\"\n        );\n\n    if (error) {\n      throw error;\n    }\n\n    for (const account of data || []) {\n\n      const targetId =\n        targets[account.account_type];\n\n      if (!targetId) continue;\n\n      const container =\n        document.getElementById(targetId);\n\n      if (!container) continue;\n\n      const bank =\n        String(\n          account.bank_name || \"\"\n        ).trim();\n\n      const number =\n        String(\n          account.account_number || \"\"\n        ).trim();\n\n      const holder =\n        String(\n          account.account_holder || \"\"\n        ).trim();\n\n      if (\n        !bank ||\n        !number ||\n        !holder\n      ) {\n        continue;\n      }\n\n      container.replaceChildren();\n\n      /* TITLE */\n\n      const title =\n        document.createElement(\"strong\");\n\n      title.textContent =\n        \"Designated Payment Account\";\n\n      /* BANK NAME */\n\n      const bankLine =\n        document.createElement(\"p\");\n\n      bankLine.textContent =\n        \"Bank: \" + bank;\n\n      /* ACCOUNT NUMBER */\n\n      const numberLine =\n        document.createElement(\"p\");\n\n      numberLine.textContent =\n        \"Account Number: \" + number;\n\n      /* ACCOUNT HOLDER */\n\n      const holderLine =\n        document.createElement(\"p\");\n\n      holderLine.textContent =\n        \"Account Holder: \" + holder;\n\n      container.append(\n        title,\n        bankLine,\n        numberLine,\n        holderLine\n      );\n\n      container.hidden = false;\n\n    }\n\n    console.log(\n      \"Payment account information loaded.\"\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"Payment account query failed:\",\n      error\n    );\n\n  }\n\n}\n\n/* =====================================\n   INITIAL LOAD\n===================================== */\n\nloadPaymentAccounts();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=es": "<!DOCTYPE html>\n<html lang=\"es\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nCentro de Participación Ciudadana |\nCentro Global de IA en Goyang\n</title>\n\n<meta\n  name=\"description\"\n  content=\"Participe en la iniciativa del Centro Global de Inteligencia Artificial en la Ciudad Especial de Goyang mediante la campaña de apoyo ciudadano, la inscripción en el Comité, la afiliación como miembro colaborador y las actividades comunitarias.\"\n>\n\n<link\n  rel=\"canonical\"\n  href=\"https://achimjoa.github.io/aihub-goyang.org/participate.html?lang=es\"\n>\n\n<link\n  rel=\"alternate\"\n  hreflang=\"es\"\n  href=\"https://achimjoa.github.io/aihub-goyang.org/participate.html?lang=es\"\n>\n\n<link\n  rel=\"alternate\"\n  hreflang=\"en\"\n  href=\"https://achimjoa.github.io/aihub-goyang.org/participate.html?lang=en\"\n>\n\n<link\n  rel=\"alternate\"\n  hreflang=\"ko\"\n  href=\"https://achimjoa.github.io/aihub-goyang.org/participate.html\"\n>\n\n<style>\n\n/* CONFIGURACIÓN GENERAL */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\nsummary:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* ENCABEZADO */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 45px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n  line-height: 1.4;\n}\n\nheader p {\n  font-size: 17px;\n  color: #e3efff;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  align-items: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n/* SELECTOR DE IDIOMA */\n\n.language-dropdown {\n  position: relative;\n  z-index: 1000;\n}\n\n.language-dropdown summary {\n  display: inline-flex;\n  align-items: center;\n  padding: 10px 18px;\n  background: #ffe44d;\n  color: #003b79;\n  border-radius: 7px;\n  font-size: 14px;\n  font-weight: bold;\n  cursor: pointer;\n  list-style: none;\n}\n\n.language-dropdown summary::-webkit-details-marker {\n  display: none;\n}\n\n.language-options {\n  position: absolute;\n  top: calc(100% + 7px);\n  right: 0;\n  min-width: 180px;\n  padding: 8px;\n  background: white;\n  border: 1px solid #cbdff5;\n  border-radius: 8px;\n  box-shadow: 0 5px 18px rgba(0,0,0,.18);\n  text-align: left;\n}\n\n.language-options a {\n  display: block;\n  padding: 10px 12px;\n  color: #0754a6;\n  text-decoration: none;\n  border-radius: 5px;\n  font-size: 14px;\n}\n\n.language-options a:hover,\n.language-options a[aria-current=\"page\"] {\n  background: #eaf4ff;\n}\n\n.language-options a[aria-current=\"page\"] {\n  font-weight: bold;\n}\n\n/* CONTENIDO PRINCIPAL */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  font-size: clamp(24px, 4vw, 30px);\n}\n\n.intro strong {\n  color: #0754a6;\n}\n\n/* TARJETAS */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: white;\n  border-radius: 12px;\n  padding: 28px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.08);\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  color: #0754a6;\n  font-size: 22px;\n  margin-top: 0;\n}\n\n.card p {\n  color: #46566d;\n}\n\n/* BOTONES */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover,\n.button:focus-visible {\n  background: #003a7a;\n  color: white;\n}\n\n/* CAMPAÑA DE APOYO */\n\n.signature {\n  background: #eaf4ff;\n  border: 2px solid #168de0;\n  padding: 30px;\n  border-radius: 12px;\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.signature h2 {\n  color: #0754a6;\n  font-size: clamp(24px, 4vw, 30px);\n}\n\n.signature p {\n  font-size: 18px;\n}\n\n/* AVISOS */\n\n.notice {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  margin-top: 35px;\n}\n\n.notice h2 {\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 30px;\n}\n\n.small-note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* INFORMACIÓN BANCARIA */\n\n.payment-account-info {\n  margin: 15px 0;\n  padding: 16px;\n  background: #eaf4ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 8px;\n  color: #17315b;\n  font-size: 15px;\n  line-height: 1.8;\n  overflow-wrap: anywhere;\n}\n\n.payment-account-info[hidden] {\n  display: none !important;\n}\n\n.payment-account-info strong {\n  display: block;\n  color: #0754a6;\n  margin-bottom: 5px;\n}\n\n.payment-account-info p {\n  margin: 5px 0;\n}\n\n/* PIE DE PÁGINA */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* DISEÑO MÓVIL */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 35px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .signature {\n    padding: 20px;\n  }\n\n  .card {\n    padding: 22px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n  }\n\n  .language-options {\n    right: auto;\n    left: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- ENCABEZADO -->\n\n<header>\n\n<h1>\nCentro de Participación Ciudadana\n</h1>\n\n<p>\nIniciativa del Centro Global\nde Inteligencia Artificial<br>\nCiudad Especial de Goyang<br>\nProvincia de Gyeonggi,\nRepública de Corea\n</p>\n\n<p>\nConstruyendo un nuevo futuro\npara Goyang mediante\nla participación ciudadana\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=es\"\n  class=\"home-link\"\n>\n  ← Inicio en español\n</a>\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"Seleccionar idioma\">\n🌐 Idioma ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a\n  href=\"participate.html?lang=es\"\n  lang=\"es\"\n  aria-current=\"page\"\n>\nEspañol ✓\n</a>\n\n<a\n  href=\"participate.html?lang=en\"\n  lang=\"en\"\n>\nEnglish\n</a>\n\n<a\n  href=\"participate.html\"\n  lang=\"ko\"\n>\n한국어\n</a>\n\n</div>\n\n</details>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- INTRODUCCIÓN -->\n\n<div class=\"intro\">\n\n<h2>\n¡Apoyemos la llegada\ndel Centro Global de IA a Goyang!\n</h2>\n\n<p>\n<strong>\n¡Nuevas oportunidades de crecimiento\npara Goyang!\n</strong>\n<br>\n<strong>\n¡Más empleos de calidad\npara Goyang!\n</strong>\n</p>\n\n<p>\nLa propuesta\ndel Centro Global\nde Inteligencia Artificial\nrepresenta una importante oportunidad\npara que la Ciudad Especial de Goyang\nse desarrolle como centro\nde cooperación internacional\ny de industrias relacionadas\ncon la inteligencia artificial.\n</p>\n\n<p>\nEl Comité Ciudadano de Promoción\nbusca ampliar\nla comprensión pública\nde esta iniciativa\ny fomentar la participación voluntaria\nde ciudadanos,\nprofesionales\ny organizaciones cívicas.\n</p>\n\n<p>\n<strong>\nSu participación puede contribuir\na fortalecer el apoyo ciudadano\npara atraer el Centro Global de IA\na la Ciudad Especial de Goyang.\n</strong>\n</p>\n\n</div>\n\n\u003c!-- INFORMACIÓN PARA VISITANTES INTERNACIONALES -->\n\n<div class=\"language-notice\">\n\n<strong>\nInformación para visitantes internacionales\n</strong>\n\n<p>\nEsta página presenta en español\nlos programas de participación ciudadana\ndel Comité.\n</p>\n\n<p>\nLos formularios de solicitud\nse encuentran actualmente\ndisponibles en coreano.\nRevise cuidadosamente\nla información de cada formulario\nantes de proporcionar datos personales.\n</p>\n\n<p>\nLas contribuciones económicas\ny los procedimientos de participación\nestán sujetos\na las normas y requisitos\naplicables del Comité.\n</p>\n\n</div>\n\n\u003c!-- CAMPAÑA DE APOYO CIUDADANO -->\n\n<section class=\"signature\">\n\n<h2>\nCampaña de Apoyo\nde 100.000 Ciudadanos\n</h2>\n\n<p>\nParticipe en la campaña\nde recogida de firmas\nen apoyo de la propuesta\nde establecer el Centro Global de IA\nen la Ciudad Especial de Goyang.\n</p>\n\n<p>\nAl reunir las voces\nde los ciudadanos,\nbuscamos fortalecer\nla conciencia pública\ny el apoyo\nal desarrollo futuro de Goyang.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Participar en la campaña de apoyo\n</a>\n\n<p class=\"small-note\">\nFormulario de solicitud en coreano.\n</p>\n\n</section>\n\n\u003c!-- PROGRAMAS DE PARTICIPACIÓN -->\n\n<div class=\"grid\">\n\n\u003c!-- INSCRIPCIÓN EN EL COMITÉ -->\n\n<article class=\"card\">\n\n<h3>\nInscripción como miembro del Comité\n</h3>\n\n<p>\nDamos la bienvenida\na ciudadanos,\nprofesionales,\nrepresentantes\nde organizaciones cívicas\ny otras personas interesadas\nen apoyar la iniciativa\ndel Centro Global de IA.\n</p>\n\n<p>\nLa participación en el Comité\nofrece oportunidades\npara contribuir\na la sensibilización pública,\nlos debates sobre políticas\ny las actividades comunitarias.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Inscribirse en el Comité\n</a>\n\n<p class=\"small-note\">\nFormulario de solicitud en coreano.\n</p>\n\n</article>\n\n\u003c!-- MIEMBROS COLABORADORES -->\n\n<article class=\"card\">\n\n<h3>\nAfiliación como miembro colaborador\n</h3>\n\n<p>\nConviértase en miembro colaborador\npara apoyar la continuidad\nde las actividades ciudadanas,\nla comunicación pública\ny la difusión de propuestas\nrelacionadas con la iniciativa\ndel Centro Global de IA.\n</p>\n\n<p>\nLas contribuciones\nde los miembros colaboradores\npueden realizarse\nmediante transferencia bancaria\na la cuenta designada\nque se muestra a continuación.\n</p>\n\n<div\n  id=\"membershipAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Solicitar afiliación\n  como miembro colaborador\n</a>\n\n<p class=\"small-note\">\nFormulario de solicitud en coreano.\nConfirme las instrucciones\nde pago más recientes\nantes de realizar una transferencia.\n</p>\n\n</article>\n\n\u003c!-- SOLICITUD DE PANCARTAS -->\n\n<article class=\"card\">\n\n<h3>\nSolicitud de pancartas promocionales\n</h3>\n\n<p>\nParticipe en las actividades\nde sensibilización pública\nsolicitando la instalación\nde pancartas promocionales\nen apoyo de la propuesta\ndel Centro Global de IA\nen Goyang.\n</p>\n\n<p>\nDespués de presentar\nla solicitud,\nabone el coste correspondiente\nen la cuenta bancaria designada\nque se muestra a continuación.\n</p>\n\n<p>\nLa instalación de pancartas\ndebe cumplir\nlas ordenanzas locales,\nla legislación aplicable\ny los requisitos\nde ubicación.\n</p>\n\n<div\n  id=\"bannerAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Solicitar una pancarta promocional\n</a>\n\n<p class=\"small-note\">\nFormulario de solicitud en coreano.\n</p>\n\n</article>\n\n\u003c!-- ADHESIVOS PARA VEHÍCULOS -->\n\n<article class=\"card\">\n\n<h3>\nAdhesivo promocional para vehículos\n</h3>\n\n<p>\nAyude a aumentar\nla conciencia pública\nsobre la iniciativa\ndel Centro Global de IA\ncolocando un adhesivo promocional\nen su vehículo.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/cisRHEsN61pxVycG8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Solicitar un adhesivo para vehículos\n</a>\n\n<p class=\"small-note\">\nFormulario de solicitud en coreano.\n</p>\n\n</article>\n\n\u003c!-- COMUNIDAD KAKAOTALK -->\n\n<article class=\"card\">\n\n<h3>\nComunidad de KakaoTalk\n</h3>\n\n<p>\nÚnase al grupo de comunicación\ndel Comité en KakaoTalk\npara intercambiar información\nsobre actividades,\nparticipación ciudadana\ny novedades relacionadas\ncon la iniciativa\ndel Centro Global de IA.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://invite.kakao.com/tc/6vBTJeOAAa\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Unirse a la comunidad de KakaoTalk\n</a>\n\n<p class=\"small-note\">\nLas conversaciones de la comunidad\nse realizan principalmente en coreano.\n</p>\n\n</article>\n\n\u003c!-- GRUPO DE FACEBOOK -->\n\n<article class=\"card\">\n\n<h3>\nGrupo de debate en Facebook\n</h3>\n\n<p>\nComparta información,\nintercambie opiniones\ny participe\nen debates públicos\nsobre la propuesta\ndel Centro Global de IA.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://fb.me/g/8JVQBabwP/W4YofuHk\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Unirse al grupo de Facebook\n</a>\n\n</article>\n\n\u003c!-- GALERÍA -->\n\n<article class=\"card\">\n\n<h3>\nGalería de actividades del Comité\n</h3>\n\n<p>\nExplore fotografías\nque documentan\nlas actividades\ndel Comité Ciudadano de Promoción\ny de la campaña\nde apoyo público.\n</p>\n\n<a\n  class=\"button\"\n  href=\"gallery.html?lang=es\"\n>\n  Ver la galería de actividades\n  (en coreano)\n</a>\n\n</article>\n\n</div>\n\n\u003c!-- INFORMACIÓN SOBRE PARTICIPACIÓN -->\n\n<section class=\"notice\">\n\n<h2>\nInformación sobre la participación\n</h2>\n\n<p>\nEl Comité Ciudadano de Promoción\ndesarrolla diversos programas\nde participación,\nincluidos la campaña\nde recogida de firmas,\nla inscripción en el Comité,\nla afiliación como miembro colaborador,\nlas solicitudes de pancartas\npromocionales\ny los adhesivos para vehículos.\n</p>\n\n<p>\nCada solicitud se presenta\nmediante el formulario\nen línea correspondiente.\n</p>\n\n<p>\nAntes de presentar una solicitud,\nlos participantes deben revisar\nsu finalidad\ny la información relativa\na la recopilación\ny utilización de datos personales.\n</p>\n\n<p>\nLas contribuciones\nde los miembros colaboradores\ny los costes\nde las pancartas promocionales\ndeben abonarse únicamente\nen las cuentas bancarias\noficialmente designadas\npor el Comité.\n</p>\n\n<p>\nVerifique siempre\nlos datos bancarios\ny las condiciones de pago\nmás recientes\nantes de realizar una transferencia.\n</p>\n\n<p>\nPara obtener información\nsobre la protección\nde datos personales,\nconsulte la\n<a href=\"index.html?view=privacy\">\nPolítica de Privacidad (en coreano)\n</a>.\n</p>\n\n</section>\n\n\u003c!-- PÁGINAS RELACIONADAS -->\n\n<section class=\"notice\">\n\n<h2>\nMás información\n</h2>\n\n<p>\nConozca más sobre\nel Comité Ciudadano de Promoción,\nsus objetivos\ny la iniciativa\ndel Centro Global de IA.\n</p>\n\n<a\n  class=\"button\"\n  href=\"committee.html?lang=es\"\n>\n  Acerca del Comité\n</a>\n\n<a\n  class=\"button\"\n  href=\"hub.html?lang=es\"\n>\n  Acerca del Centro Global de IA\n</a>\n\n<a\n  class=\"button\"\n  href=\"news.html?lang=es\"\n>\n  Noticias y Avisos\n</a>\n\n<a\n  class=\"button\"\n  href=\"index.html?lang=es\"\n>\n  Inicio en español\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIE DE PÁGINA -->\n\n<footer>\n\n<p>\n<strong>\nComité Ciudadano de Promoción<br>\npara la Atracción del Centro Global de IA<br>\na la Ciudad Especial de Goyang\n</strong>\n</p>\n\n<p>\nProvincia de Gyeonggi,\nRepública de Corea\n</p>\n\n<p>\nCon los ciudadanos,<br>\ncon la provincia de Gyeonggi<br>\ny con el mundo.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=es\">\nInicio en español\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"participate.html?lang=en\" lang=\"en\">\nEnglish\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"participate.html\" lang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     MÓDULO SUPABASE DE CUENTAS BANCARIAS\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* CONEXIÓN SUPABASE */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* MOSTRAR INFORMACIÓN BANCARIA */\n\nasync function loadPaymentAccounts() {\n\n  const targets = {\n    membership: \"membershipAccountInfo\",\n    banner: \"bannerAccountInfo\"\n  };\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"payment_accounts\")\n        .select(\n          \"account_type, bank_name, account_number, account_holder\"\n        );\n\n    if (error) {\n      throw error;\n    }\n\n    for (const account of data || []) {\n\n      const targetId =\n        targets[account.account_type];\n\n      if (!targetId) continue;\n\n      const container =\n        document.getElementById(targetId);\n\n      if (!container) continue;\n\n      const bank =\n        String(\n          account.bank_name || \"\"\n        ).trim();\n\n      const number =\n        String(\n          account.account_number || \"\"\n        ).trim();\n\n      const holder =\n        String(\n          account.account_holder || \"\"\n        ).trim();\n\n      if (\n        !bank ||\n        !number ||\n        !holder\n      ) {\n        continue;\n      }\n\n      container.replaceChildren();\n\n      /* TÍTULO */\n\n      const title =\n        document.createElement(\"strong\");\n\n      title.textContent =\n        \"Cuenta bancaria designada\";\n\n      /* BANCO */\n\n      const bankLine =\n        document.createElement(\"p\");\n\n      bankLine.textContent =\n        \"Banco: \" + bank;\n\n      /* NÚMERO DE CUENTA */\n\n      const numberLine =\n        document.createElement(\"p\");\n\n      numberLine.textContent =\n        \"Número de cuenta: \" + number;\n\n      /* TITULAR */\n\n      const holderLine =\n        document.createElement(\"p\");\n\n      holderLine.textContent =\n        \"Titular de la cuenta: \" + holder;\n\n      container.append(\n        title,\n        bankLine,\n        numberLine,\n        holderLine\n      );\n\n      container.hidden = false;\n\n    }\n\n    console.log(\n      \"Información bancaria cargada.\"\n    );\n\n  } catch (error) {\n\n    console.error(\n      \"Error al consultar las cuentas bancarias:\",\n      error\n    );\n\n  }\n\n}\n\n/* CARGA INICIAL */\n\nloadPaymentAccounts();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=fr": "<!DOCTYPE html>\n<html lang=\"fr\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nCentre de participation citoyenne |\nInitiative du Centre mondial de l'IA\n</title>\n\n<meta\n  name=\"description\"\n  content=\"Participez à l'initiative du Centre mondial de l'IA dans la ville spéciale de Goyang grâce à la campagne de soutien citoyen, à l'inscription au Comité, à l'adhésion en tant que membre de soutien et aux activités communautaires.\"\n>\n\n<style>\n\n/* CONFIGURATION GÉNÉRALE */\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: Arial, Helvetica, sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* EN-TÊTE */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  font-size: clamp(28px, 5vw, 44px);\n  margin: 0 0 15px;\n}\n\nheader p {\n  font-size: 18px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.home-link {\n  display: inline-block;\n  background: white;\n  color: #0754a6;\n  text-decoration: none;\n  padding: 10px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* CONTENU PRINCIPAL */\n\nmain {\n  max-width: 1150px;\n  margin: auto;\n  padding: 35px 15px;\n}\n\n.intro {\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.intro h2 {\n  color: #0754a6;\n  font-size: 28px;\n}\n\n.intro strong {\n  color: #0754a6;\n}\n\n/* GRILLE */\n\n.grid {\n  display: grid;\n  grid-template-columns:\n    repeat(auto-fit, minmax(260px, 1fr));\n  gap: 20px;\n}\n\n.card {\n  background: white;\n  border-radius: 12px;\n  padding: 28px;\n  box-shadow: 0 3px 12px rgba(0,0,0,.08);\n  border-top: 5px solid #168de0;\n}\n\n.card h3 {\n  color: #0754a6;\n  font-size: 22px;\n  margin-top: 0;\n}\n\n.card p {\n  color: #46566d;\n}\n\n/* BOUTONS */\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 20px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin-top: 10px;\n}\n\n.button:hover,\n.button:focus-visible {\n  background: #003a7a;\n}\n\n/* CAMPAGNE DE SOUTIEN */\n\n.signature {\n  background: #eaf4ff;\n  border: 2px solid #168de0;\n  padding: 30px;\n  border-radius: 12px;\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.signature h2 {\n  color: #0754a6;\n  font-size: 30px;\n}\n\n.signature p {\n  font-size: 18px;\n}\n\n/* INFORMATIONS */\n\n.notice {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  margin-top: 35px;\n}\n\n.notice h2 {\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 30px;\n}\n\n.small-note {\n  font-size: 14px;\n  color: #596a80;\n}\n\n/* INFORMATIONS BANCAIRES */\n\n.payment-account-info {\n  margin: 15px 0;\n  padding: 16px;\n  background: #eaf4ff;\n  border: 1px solid #b8d6f5;\n  border-radius: 8px;\n  color: #17315b;\n  font-size: 15px;\n  line-height: 1.8;\n  overflow-wrap: anywhere;\n}\n\n.payment-account-info[hidden] {\n  display: none !important;\n}\n\n.payment-account-info strong {\n  display: block;\n  color: #0754a6;\n  margin-bottom: 5px;\n}\n\n.payment-account-info p {\n  margin: 5px 0;\n}\n\n/* PIED DE PAGE */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 15px;\n  margin-top: 40px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* VERSION MOBILE */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  main {\n    padding: 20px 12px;\n  }\n\n  .signature {\n    padding: 20px;\n  }\n\n  .signature h2 {\n    font-size: 25px;\n  }\n\n  .card {\n    padding: 22px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- EN-TÊTE -->\n\n<header>\n\n<h1>\nCentre de participation citoyenne\n</h1>\n\n<p>\nInitiative du Centre mondial de l'IA<br>\nVille spéciale de Goyang,<br>\nProvince de Gyeonggi,<br>\nRépublique de Corée\n</p>\n\n<p>\nConstruire un nouvel avenir pour Goyang<br>\ngrâce à la participation citoyenne\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=fr\"\n  class=\"home-link\"\n>\n  ← Accueil — Français\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- INTRODUCTION -->\n\n<div class=\"intro\">\n\n<h2>\nEnsemble, accueillons le Centre mondial de l'IA à Goyang !\n</h2>\n\n<p>\n<strong>\nDe nouvelles possibilités de croissance pour Goyang !\n</strong>\n<br>\n<strong>\nDavantage d'emplois de qualité pour Goyang !\n</strong>\n</p>\n\n<p>\nLe projet de Centre mondial de l'IA\nreprésente une occasion importante\npour la ville spéciale de Goyang\nde se développer en tant que centre\nde coopération internationale\net d'industries liées\nà l'intelligence artificielle.\n</p>\n\n<p>\nLe Comité citoyen de promotion\nsouhaite renforcer\nla compréhension du public\nà l'égard de cette initiative\net encourager\nla participation volontaire\ndes citoyens,\ndes professionnels\net des organisations\nde la société civile.\n</p>\n\n<p>\n<strong>\nVotre participation peut contribuer\nà renforcer le soutien du public\nen faveur de l'implantation\ndu Centre mondial de l'IA\ndans la ville spéciale de Goyang.\n</strong>\n</p>\n\n</div>\n\n\u003c!-- INFORMATIONS LINGUISTIQUES -->\n\n<div class=\"language-notice\">\n\n<strong>\nInformations destinées aux visiteurs internationaux\n</strong>\n\n<p>\nCette page présente en français\nles programmes de participation citoyenne\norganisés par le Comité.\n</p>\n\n<p>\nLes formulaires de candidature\nsont actuellement disponibles en coréen.\nVeuillez examiner attentivement\nles informations figurant\ndans chaque formulaire\navant de transmettre\nvos données personnelles.\n</p>\n\n<p>\nLes contributions financières\net les procédures de participation\nsont soumises\naux règles et conditions applicables\ndu Comité.\n</p>\n\n</div>\n\n\u003c!-- CAMPAGNE DE SOUTIEN -->\n\n<section class=\"signature\">\n\n<h2>\nCampagne de soutien de 100 000 citoyens\n</h2>\n\n<p>\nParticipez à la campagne\nde signatures en ligne\nen faveur de l'implantation\ndu Centre mondial de l'IA\ndans la ville spéciale de Goyang.\n</p>\n\n<p>\nEn réunissant\nles voix des citoyens,\nnous souhaitons renforcer\nla sensibilisation du public\net le soutien\nau développement futur de Goyang.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/Um2iRD9fAhoU1CDW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Participer à la campagne de soutien en ligne\n</a>\n\n<p class=\"small-note\">\nFormulaire disponible en coréen.\n</p>\n\n</section>\n\n\u003c!-- PROGRAMMES DE PARTICIPATION -->\n\n<div class=\"grid\">\n\n\u003c!-- INSCRIPTION AU COMITÉ -->\n\n<article class=\"card\">\n\n<h3>\nDevenir membre du Comité\n</h3>\n\n<p>\nNous accueillons\nles citoyens,\nles professionnels,\nles représentants\ndes organisations de la société civile\net toutes les personnes intéressées\nqui souhaitent soutenir\nl'initiative du Centre mondial de l'IA.\n</p>\n\n<p>\nLa participation au Comité\noffre la possibilité\nde contribuer\nà la mobilisation du public,\naux discussions\nsur les politiques publiques\net aux activités communautaires.\n</p>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/FaZCDwm7gqu5rthb7\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  S'inscrire au Comité\n</a>\n\n<p class=\"small-note\">\nFormulaire disponible en coréen.\n</p>\n\n</article>\n\n\u003c!-- MEMBRE DE SOUTIEN -->\n\n<article class=\"card\">\n\n<h3>\nAdhésion en tant que membre de soutien\n</h3>\n\n<p>\nDevenez membre de soutien\npour contribuer\nà la continuité\ndes activités citoyennes,\nà la communication publique\net à la sensibilisation\naux politiques publiques\nliées à l'initiative\ndu Centre mondial de l'IA.\n</p>\n\n<p>\nLes contributions\ndes membres de soutien\npeuvent être versées\nsur le compte bancaire désigné\nprésenté ci-dessous.\n</p>\n\n\u003c!-- AFFICHAGE AUTOMATIQUE DU COMPTE -->\n\n<div\n  id=\"membershipAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/hdgHtRV2qpxrAhjW8\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Demander l'adhésion en tant que membre de soutien\n</a>\n\n<p class=\"small-note\">\nFormulaire disponible en coréen.\nVeuillez vérifier\nles dernières instructions de paiement\navant d'effectuer un virement.\n</p>\n\n</article>\n\n\u003c!-- BANNIÈRES PROMOTIONNELLES -->\n\n<article class=\"card\">\n\n<h3>\nDemande de banderole promotionnelle\n</h3>\n\n<p>\nParticipez aux activités\nde sensibilisation du public\nen demandant\nl'installation de banderoles\nsoutenant le projet\nde Centre mondial de l'IA\nà Goyang.\n</p>\n\n<p>\nAprès avoir soumis votre demande,\nveuillez régler\nles frais applicables\nsur le compte bancaire désigné\nprésenté ci-dessous.\n</p>\n\n<p>\nL'installation des banderoles\ndoit respecter\nles réglementations locales,\nles lois applicables\net les exigences\nrelatives aux emplacements.\n</p>\n\n\u003c!-- AFFICHAGE AUTOMATIQUE DU COMPTE -->\n\n<div\n  id=\"bannerAccountInfo\"\n  class=\"payment-account-info\"\n  hidden>\n</div>\n\n<a\n  class=\"button\"\n  href=\"https://forms.gle/pRM9h8SBhYWXnhFi6\"\n  target=\"_blank\"\n  rel=\"noopener noreferrer\"\n>\n  Demander une banderole promotionnelle\n</a>\n\n<p class=\"small-note\">\nFormulaire disponible en coréen.\n</p>\n\n</article>\n\n\u003c!-- AUTOCOLLANT POUR VÉHICULE -->\n\n<article class=\"card\">\n\n<h3>\nAutocollant promotionnel pour véhicule\n</h3>\n\n<p>\nContribuez à sensibiliser\nle pub
