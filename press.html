argin-top: 30px;\n}\n\n.related h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   PIÈ DI PAGINA\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 20px;\n  margin-top: 60px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   VERSIONE MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  main {\n    margin: 25px auto;\n    padding: 0 12px;\n  }\n\n  .intro,\n  .press-item,\n  .related {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     INTESTAZIONE\n===================================== -->\n\n<header>\n\n<h1>\nRassegna stampa\n</h1>\n\n<p>\nIniziativa per un Polo Globale dell'IA<br>\nCittà Speciale di Goyang, Repubblica di Corea\n</p>\n\n<p>\nArticoli di giornale,<br>\nservizi radiotelevisivi<br>\ne rassegna stampa\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=it\"\n  class=\"home-link\"\n>\n  ← Homepage italiana\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     INTRODUZIONE\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nArticoli e servizi sul Polo Globale dell'IA\n</h2>\n\n<p>\nQuesta pagina offre accesso\nad articoli di giornale,\nservizi radiotelevisivi\ne altre notizie pubblicate dai media\nriguardanti l'iniziativa proposta\nper un Polo Globale dell'IA\ne le attività correlate\nnella Provincia di Gyeonggi\ne nella Città Speciale di Goyang.\n</p>\n\n<p>\nGli articoli sono presentati\nper aiutare i visitatori internazionali\na comprendere il dibattito pubblico,\ngli sviluppi delle politiche\ne le attività civiche\nlegate all'iniziativa.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     INFORMAZIONI SULLA LINGUA\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nInformazioni sulla lingua\n</strong>\n\n<p>\nLa maggior parte degli articoli\ne dei servizi è pubblicata\nda organizzazioni giornalistiche coreane.\nI titoli e le descrizioni originali\nin lingua coreana sono visualizzati\nsenza traduzione automatica.\n</p>\n\n<p>\nSelezionare il collegamento\nall'articolo per consultare\nil servizio originale\nsul sito web dell'editore.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     RICERCA\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\n  type=\"search\"\n  id=\"pressSearch\"\n  placeholder=\"Cerca articoli per titolo o parola chiave\"\n  aria-label=\"Cerca nella rassegna stampa\"\n>\n\n</div>\n\n\u003c!-- =====================================\n     ELENCO DELLA RASSEGNA STAMPA\n===================================== -->\n\n<div\n  class=\"press-list\"\n  id=\"pressList\"\n  aria-live=\"polite\"\n>\n\n  <p class=\"empty\">\n    Preparazione del caricamento degli articoli.\n  </p>\n\n</div>\n\n\u003c!-- =====================================\n     PAGINE CORRELATE\n===================================== -->\n\n<section class=\"related\">\n\n<h2>\nInformazioni correlate\n</h2>\n\n<p>\nPer ulteriori informazioni\nsull'iniziativa per un Polo Globale dell'IA,\nè possibile consultare\nle seguenti pagine.\n</p>\n\n<a\n  href=\"news.html?lang=it\"\n  class=\"button\"\n>\n  Notizie e comunicazioni\n</a>\n\n<a\n  href=\"history.html?lang=it\"\n  class=\"button\"\n>\n  Cronologia e principali tappe\n</a>\n\n<a\n  href=\"committee.html?lang=it\"\n  class=\"button\"\n>\n  Il Comitato Civico Promotore\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     PIÈ DI PAGINA\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nComitato Civico Promotore<br>\nper l'insediamento del Polo Globale dell'IA<br>\nnella Città Speciale di Goyang\n</strong>\n</p>\n\n<p>\nProvincia di Gyeonggi,<br>\nRepubblica di Corea\n</p>\n\n<p>\nCon i cittadini,<br>\ncon la Provincia di Gyeonggi<br>\ne con il mondo.\n</p>\n\n<p>\n<a href=\"index.html?lang=it\">\nHomepage italiana\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     MODULO SUPABASE PER LA RASSEGNA STAMPA\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   CONNESSIONE SUPABASE\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\n/*\n  Chiave pubblica Supabase\n  mantenuta dal file originale press-en.html.\n*/\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   ELEMENTI DOM\n===================================== */\n\nconst pressList =\n  document.getElementById(\"pressList\");\n\nconst pressSearch =\n  document.getElementById(\"pressSearch\");\n\nlet pressData = [];\n\n/* =====================================\n   VISUALIZZAZIONE DEI MESSAGGI\n===================================== */\n\nfunction showPressMessage(message) {\n\n  pressList.replaceChildren();\n\n  const paragraph =\n    document.createElement(\"p\");\n\n  paragraph.className = \"empty\";\n\n  paragraph.textContent = message;\n\n  pressList.appendChild(paragraph);\n\n}\n\n/* =====================================\n   FORMATTAZIONE DELLA DATA\n===================================== */\n\nfunction formatPressDate(value) {\n\n  if (!value) {\n    return \"\";\n  }\n\n  return String(value)\n    .slice(0, 10)\n    .replaceAll(\"-\", \".\");\n\n}\n\n/* =====================================\n   RILEVAMENTO DEL TESTO COREANO\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   VISUALIZZAZIONE DEGLI ARTICOLI\n===================================== */\n\nfunction renderPress() {\n\n  const keyword =\n    pressSearch.value\n      .trim()\n      .toLowerCase();\n\n  const filtered =\n    pressData.filter(item => {\n\n      const searchText = [\n        item.title || \"\",\n        item.description || \"\",\n        item.published_at || \"\"\n      ]\n        .join(\" \")\n        .toLowerCase();\n\n      return searchText.includes(keyword);\n\n    });\n\n  pressList.replaceChildren();\n\n  if (filtered.length === 0) {\n\n    showPressMessage(\n      \"Nessun articolo corrisponde alla ricerca.\"\n    );\n\n    return;\n\n  }\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"press-item\";\n\n    /* Categoria */\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className =\n      \"press-category\";\n\n    category.textContent =\n      \"Rassegna stampa\";\n\n    /* Data */\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className =\n      \"press-date\";\n\n    date.textContent =\n      formatPressDate(\n        item.published_at\n      );\n\n    /* Titolo */\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title || \"\";\n\n    /* Descrizione */\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description || \"\";\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* Avviso sulla lingua coreana */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"Contenuto originale in coreano\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* Collegamento all'articolo originale */\n\n    if (item.link) {\n\n      try {\n\n        const url =\n          new URL(item.link);\n\n        if (\n          url.protocol === \"https:\" ||\n          url.protocol === \"http:\"\n        ) {\n\n          const link =\n            document.createElement(\"a\");\n\n          link.className =\n            \"press-link\";\n\n          link.href = url.href;\n\n          link.target = \"_blank\";\n\n          link.rel =\n            \"noopener noreferrer\";\n\n          link.textContent =\n            \"Leggi l'articolo originale →\";\n\n          card.appendChild(link);\n\n        }\n\n      } catch (error) {\n\n        console.warn(\n          \"Collegamento non valido:\",\n          item.link\n        );\n\n      }\n\n    }\n\n    pressList.appendChild(card);\n\n  });\n\n}\n\n/* =====================================\n   CARICAMENTO DEGLI ARTICOLI\n===================================== */\n\nasync function loadPress() {\n\n  showPressMessage(\n    \"Caricamento degli articoli...\"\n  );\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id, title, category, description, link, published_at\"\n        )\n        .eq(\"category\", \"press\")\n        .order(\"published_at\", {\n          ascending: false\n        })\n        .order(\"id\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    pressData = data || [];\n\n    console.log(\n      \"Articoli caricati:\",\n      pressData.length\n    );\n\n    if (pressData.length === 0) {\n\n      showPressMessage(\n        \"Al momento non sono disponibili articoli.\"\n      );\n\n      return;\n\n    }\n\n    renderPress();\n\n  } catch (error) {\n\n    console.error(\n      \"Errore nel caricamento degli articoli:\",\n      error\n    );\n\n    showPressMessage(\n      \"Impossibile caricare gli articoli. Riprova più tardi.\"\n    );\n\n  }\n\n}\n\n/* =====================================\n   RICERCA\n===================================== */\n\npressSearch.addEventListener(\n  \"input\",\n  renderPress\n);\n\n/* =====================================\n   CARICAMENTO INIZIALE\n===================================== */\n\nloadPress();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=ja": "<!DOCTYPE html>\n<html lang=\"ja\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nメディア報道 | グローバルAIハブ構想\n</title>\n\n<meta\n  name=\"description\"\n  content=\"大韓民国・高陽特例市のグローバルAIハブ構想と市民推進委員会に関する新聞記事、放送報道、メディア情報をご紹介します。\"\n>\n\n<style>\n\n/* =====================================\n   基本設定\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n\n  font-family:\n    \"Noto Sans JP\",\n    \"Hiragino Kaku Gothic ProN\",\n    \"Yu Gothic\",\n    Meiryo,\n    Arial,\n    sans-serif;\n\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\ninput:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ヘッダー\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  margin: 0 0 18px;\n  font-size: clamp(28px, 5vw, 42px);\n}\n\nheader p {\n  margin: 12px 0;\n  font-size: 17px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 22px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 20px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   メインコンテンツ\n===================================== */\n\nmain {\n  max-width: 1100px;\n  margin: 40px auto;\n  padding: 0 20px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.05);\n}\n\n.intro h2 {\n  margin-top: 0;\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n.language-notice p {\n  margin-bottom: 0;\n}\n\n/* =====================================\n   検索\n===================================== */\n\n.search-box {\n  margin: 25px 0;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 15px;\n  border: 1px solid #ccd5e0;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* =====================================\n   メディア報道一覧\n===================================== */\n\n.press-list {\n  display: grid;\n  gap: 18px;\n}\n\n.press-item {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  border: 1px solid #e1e7ef;\n  box-shadow: 0 3px 10px rgba(0,0,0,0.04);\n}\n\n.press-item h3 {\n  margin: 8px 0;\n  color: #0754a6;\n  overflow-wrap: anywhere;\n}\n\n.press-item p {\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.press-date {\n  color: #69788c;\n  font-size: 14px;\n}\n\n.press-category {\n  display: inline-block;\n  padding: 4px 12px;\n  background: #e7f0fa;\n  color: #175b9a;\n  border-radius: 20px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.press-link {\n  display: inline-block;\n  margin-top: 15px;\n  color: #0754a6;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.press-link:hover {\n  text-decoration: underline;\n}\n\n.content-language {\n  display: block;\n  margin-top: 12px;\n  color: #69788c;\n  font-size: 13px;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  background: white;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   関連情報\n===================================== */\n\n.related {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-top: 30px;\n}\n\n.related h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   フッター\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 20px;\n  margin-top: 60px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   モバイル対応\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  main {\n    margin: 25px auto;\n    padding: 0 12px;\n  }\n\n  .intro,\n  .press-item,\n  .related {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ヘッダー\n===================================== -->\n\n<header>\n\n<h1>\nメディア報道\n</h1>\n\n<p>\nグローバルAIハブ構想<br>\n大韓民国・高陽特例市\n</p>\n\n<p>\n新聞記事・放送報道・メディア情報\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ja\"\n  class=\"home-link\"\n>\n  ← 日本語ホーム\n</a>\n\n<a\n  href=\"press.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n>\n  한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     はじめに\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nグローバルAIハブ構想に関する報道\n</h2>\n\n<p>\nこのページでは、\nグローバルAIハブ構想と、\n京畿道および高陽特例市における\n関連活動について報じた\n新聞記事、\n放送報道、\nその他のメディア情報を\nご紹介します。\n</p>\n\n<p>\n海外の皆様が、\n本構想に関する\n社会的な議論、\n政策の進展、\n市民活動について\n理解を深めるための\n参考情報として掲載しています。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     言語に関するご案内\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\n掲載記事の言語について\n</strong>\n\n<p>\n掲載されている報道の多くは、\n韓国の報道機関によって\n公開されたものです。\n</p>\n\n<p>\n韓国語の記事タイトルと説明文は、\n自動翻訳せず、\n原文のまま表示しています。\n</p>\n\n<p>\n記事のリンクを選択すると、\n報道機関のウェブサイトで\n元の記事をご覧いただけます。\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     検索\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\n  type=\"search\"\n  id=\"pressSearch\"\n  placeholder=\"記事タイトルやキーワードで検索\"\n  aria-label=\"メディア報道を検索\"\n>\n\n</div>\n\n\u003c!-- =====================================\n     メディア報道一覧\n===================================== -->\n\n<div\n  class=\"press-list\"\n  id=\"pressList\"\n  aria-live=\"polite\"\n>\n\n  <p class=\"empty\">\n    メディア報道の読み込みを準備しています。\n  </p>\n\n</div>\n\n\u003c!-- =====================================\n     関連情報\n===================================== -->\n\n<section class=\"related\">\n\n<h2>\n関連情報\n</h2>\n\n<p>\nグローバルAIハブ構想について、\nさらに詳しくお知りになりたい方は、\n以下のページをご覧ください。\n</p>\n\n<a\n  href=\"news.html?lang=ja\"\n  class=\"button\"\n>\n  ニュース・お知らせ\n</a>\n\n<a\n  href=\"history.html?lang=ja\"\n  class=\"button\"\n>\n  推進経緯と主な沿革\n</a>\n\n<a\n  href=\"committee.html?lang=ja\"\n  class=\"button\"\n>\n  市民推進委員会について\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     フッター\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\n高陽特例市グローバルAIハブ誘致<br>\n市民推進委員会\n</strong>\n</p>\n\n<p>\n大韓民国・京畿道\n</p>\n\n<p>\n市民とともに、京畿道とともに、<br>\nそして世界とともに。\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ja\">\n日本語ホーム\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"press.html\" lang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE メディア報道モジュール\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE 接続\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\n/*\n  韓国語版・英語版と同じ\n  Supabase 公開用キーを使用します。\n*/\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   DOM 要素\n===================================== */\n\nconst pressList =\n  document.getElementById(\"pressList\");\n\nconst pressSearch =\n  document.getElementById(\"pressSearch\");\n\nlet pressData = [];\n\n/* =====================================\n   メッセージ表示\n===================================== */\n\nfunction showPressMessage(message) {\n\n  pressList.replaceChildren();\n\n  const paragraph =\n    document.createElement(\"p\");\n\n  paragraph.className = \"empty\";\n\n  paragraph.textContent = message;\n\n  pressList.appendChild(paragraph);\n\n}\n\n/* =====================================\n   日付表示\n===================================== */\n\nfunction formatPressDate(value) {\n\n  if (!value) {\n    return \"\";\n  }\n\n  return String(value)\n    .slice(0, 10)\n    .replaceAll(\"-\", \".\");\n\n}\n\n/* =====================================\n   韓国語テキスト判定\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   メディア報道の表示\n===================================== */\n\nfunction renderPress() {\n\n  const keyword =\n    pressSearch.value\n      .trim()\n      .toLowerCase();\n\n  const filtered =\n    pressData.filter(item => {\n\n      const searchText = [\n        item.title || \"\",\n        item.description || \"\",\n        item.published_at || \"\"\n      ]\n        .join(\" \")\n        .toLowerCase();\n\n      return searchText.includes(keyword);\n\n    });\n\n  pressList.replaceChildren();\n\n  if (filtered.length === 0) {\n\n    showPressMessage(\n      \"検索条件に一致する記事はありません。\"\n    );\n\n    return;\n\n  }\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"press-item\";\n\n    /* カテゴリー */\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className =\n      \"press-category\";\n\n    category.textContent =\n      \"メディア報道\";\n\n    /* 日付 */\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className =\n      \"press-date\";\n\n    date.textContent =\n      formatPressDate(\n        item.published_at\n      );\n\n    /* タイトル */\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title || \"\";\n\n    /* 説明文 */\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description || \"\";\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* 韓国語原文の表示 */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"原文：韓国語\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* 元の記事へのリンク */\n\n    if (item.link) {\n\n      try {\n\n        const url =\n          new URL(item.link);\n\n        if (\n          url.protocol === \"https:\" ||\n          url.protocol === \"http:\"\n        ) {\n\n          const link =\n            document.createElement(\"a\");\n\n          link.className =\n            \"press-link\";\n\n          link.href = url.href;\n\n          link.target = \"_blank\";\n\n          link.rel =\n            \"noopener noreferrer\";\n\n          link.textContent =\n            \"元の記事を読む →\";\n\n          card.appendChild(link);\n\n        }\n\n      } catch (error) {\n\n        console.warn(\n          \"無効な記事リンク:\",\n          item.link\n        );\n\n      }\n\n    }\n\n    pressList.appendChild(card);\n\n  });\n\n}\n\n/* =====================================\n   メディア報道の読み込み\n===================================== */\n\nasync function loadPress() {\n\n  showPressMessage(\n    \"メディア報道を読み込んでいます...\"\n  );\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id, title, category, description, link, published_at\"\n        )\n        .eq(\"category\", \"press\")\n        .order(\"published_at\", {\n          ascending: false\n        })\n        .order(\"id\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    pressData = data || [];\n\n    console.log(\n      \"メディア報道の読み込み完了:\",\n      pressData.length,\n      \"件\"\n    );\n\n    if (pressData.length === 0) {\n\n      showPressMessage(\n        \"現在、掲載されているメディア報道はありません。\"\n      );\n\n      return;\n\n    }\n\n    renderPress();\n\n  } catch (error) {\n\n    console.error(\n      \"メディア報道の取得に失敗:\",\n      error\n    );\n\n    showPressMessage(\n      \"メディア報道を読み込めませんでした。しばらくしてからもう一度お試しください。\"\n    );\n\n  }\n\n}\n\n/* =====================================\n   検索\n===================================== */\n\npressSearch.addEventListener(\n  \"input\",\n  renderPress\n);\n\n/* =====================================\n   初期読み込み\n===================================== */\n\nloadPress();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=ru": "<!DOCTYPE html>\n<html lang=\"ru\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nПубликации в СМИ | Инициатива «Глобальный центр ИИ»\n</title>\n\n<meta\n  name=\"description\"\n  content=\"Публикации в СМИ, газетные статьи и репортажи об инициативе «Глобальный центр ИИ» и деятельности Гражданского комитета содействия в особом городе Коян, Республика Корея.\"\n>\n\n<style>\n\n/* =====================================\n   ОСНОВНЫЕ НАСТРОЙКИ\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    Arial,\n    Helvetica,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\ninput:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   ШАПКА САЙТА\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  margin: 0 0 18px;\n  font-size: clamp(28px, 5vw, 42px);\n}\n\nheader p {\n  margin: 12px 0;\n  font-size: 17px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 22px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 20px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   ОСНОВНОЕ СОДЕРЖИМОЕ\n===================================== */\n\nmain {\n  max-width: 1100px;\n  margin: 40px auto;\n  padding: 0 20px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.05);\n}\n\n.intro h2 {\n  margin-top: 0;\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n.language-notice p {\n  margin-bottom: 0;\n}\n\n/* =====================================\n   ПОИСК\n===================================== */\n\n.search-box {\n  margin: 25px 0;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 15px;\n  border: 1px solid #ccd5e0;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* =====================================\n   СПИСОК ПУБЛИКАЦИЙ\n===================================== */\n\n.press-list {\n  display: grid;\n  gap: 18px;\n}\n\n.press-item {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  border: 1px solid #e1e7ef;\n  box-shadow: 0 3px 10px rgba(0,0,0,0.04);\n}\n\n.press-item h3 {\n  margin: 8px 0;\n  color: #0754a6;\n  overflow-wrap: anywhere;\n}\n\n.press-item p {\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.press-date {\n  color: #69788c;\n  font-size: 14px;\n}\n\n.press-category {\n  display: inline-block;\n  padding: 4px 12px;\n  background: #e7f0fa;\n  color: #175b9a;\n  border-radius: 20px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.press-link {\n  display: inline-block;\n  margin-top: 15px;\n  color: #0754a6;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.press-link:hover {\n  text-decoration: underline;\n}\n\n.content-language {\n  display: block;\n  margin-top: 12px;\n  color: #69788c;\n  font-size: 13px;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  background: white;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   СВЯЗАННЫЕ СТРАНИЦЫ\n===================================== */\n\n.related {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-top: 30px;\n}\n\n.related h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   ПОДВАЛ САЙТА\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 20px;\n  margin-top: 60px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   МОБИЛЬНАЯ ВЕРСИЯ\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  main {\n    margin: 25px auto;\n    padding: 0 12px;\n  }\n\n  .intro,\n  .press-item,\n  .related {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     ШАПКА САЙТА\n===================================== -->\n\n<header>\n\n<h1>\nПубликации в СМИ\n</h1>\n\n<p>\nИнициатива «Глобальный центр ИИ»<br>\nОсобый город Коян, Республика Корея\n</p>\n\n<p>\nГазетные статьи,<br>\nтелевизионные репортажи<br>\nи публикации в средствах массовой информации\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ru\"\n  class=\"home-link\"\n>\n  ← Главная страница\n</a>\n\n<a\n  href=\"press.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n>\n  한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     ВВЕДЕНИЕ\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nПубликации в СМИ об инициативе\n«Глобальный центр ИИ»\n</h2>\n\n<p>\nНа этой странице представлены\nгазетные статьи,\nтелевизионные репортажи\nи другие публикации\nв средствах массовой информации,\nпосвящённые предлагаемой инициативе\n«Глобальный центр ИИ»\nи связанной с ней деятельности\nв провинции Кёнгидо\nи особом городе Коян.\n</p>\n\n<p>\nЭти материалы представлены\nдля того, чтобы помочь\nмеждународным посетителям\nлучше понять общественные дискуссии,\nизменения государственной политики\nи гражданские инициативы,\nсвязанные с проектом.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     ИНФОРМАЦИЯ О ЯЗЫКЕ\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nИнформация о языке публикаций\n</strong>\n\n<p>\nБольшинство материалов публикуется\nкорейскими средствами массовой информации.\nОригинальные заголовки\nи описания на корейском языке\nотображаются без автоматического перевода.\n</p>\n\n<p>\nНажмите на ссылку статьи,\nчтобы открыть оригинальную публикацию\nна сайте соответствующего\nсредства массовой информации.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     ПОИСК\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\n  type=\"search\"\n  id=\"pressSearch\"\n  placeholder=\"Поиск публикаций по заголовку или ключевому слову\"\n  aria-label=\"Поиск публикаций в СМИ\"\n>\n\n</div>\n\n\u003c!-- =====================================\n     СПИСОК ПУБЛИКАЦИЙ\n===================================== -->\n\n<div\n  class=\"press-list\"\n  id=\"pressList\"\n  aria-live=\"polite\"\n>\n\n  <p class=\"empty\">\n    Подготовка к загрузке публикаций.\n  </p>\n\n</div>\n\n\u003c!-- =====================================\n     СВЯЗАННЫЕ СТРАНИЦЫ\n===================================== -->\n\n<section class=\"related\">\n\n<h2>\nДополнительная информация\n</h2>\n\n<p>\nДля получения дополнительной информации\nоб инициативе «Глобальный центр ИИ»\nпосетите следующие страницы.\n</p>\n\n<a\n  href=\"news.html?lang=ru\"\n  class=\"button\"\n>\n  Новости и объявления\n</a>\n\n<a\n  href=\"history.html?lang=ru\"\n  class=\"button\"\n>\n  Хронология и основные этапы\n</a>\n\n<a\n  href=\"committee.html?lang=ru\"\n  class=\"button\"\n>\n  О Гражданском комитете содействия\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     ПОДВАЛ САЙТА\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nГражданский комитет содействия<br>\nразмещению Глобального центра ИИ<br>\nв особом городе Коян\n</strong>\n</p>\n\n<p>\nПровинция Кёнгидо,<br>\nРеспублика Корея\n</p>\n\n<p>\nВместе с гражданами,<br>\nвместе с провинцией Кёнгидо<br>\nи вместе со всем миром.\n</p>\n\n<p>\n<a href=\"index.html?lang=ru\">\nГлавная страница\n</a>\n&nbsp; | &nbsp;\n<a href=\"press.html\" lang=\"ko\">\n한국어\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     МОДУЛЬ SUPABASE\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   ПОДКЛЮЧЕНИЕ К SUPABASE\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\n/*\n  Публичный ключ Supabase\n  сохранён из исходного файла press-en.html.\n*/\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   ЭЛЕМЕНТЫ СТРАНИЦЫ\n===================================== */\n\nconst pressList =\n  document.getElementById(\"pressList\");\n\nconst pressSearch =\n  document.getElementById(\"pressSearch\");\n\nlet pressData = [];\n\n/* =====================================\n   ОТОБРАЖЕНИЕ СООБЩЕНИЙ\n===================================== */\n\nfunction showPressMessage(message) {\n\n  pressList.replaceChildren();\n\n  const paragraph =\n    document.createElement(\"p\");\n\n  paragraph.className = \"empty\";\n\n  paragraph.textContent = message;\n\n  pressList.appendChild(paragraph);\n\n}\n\n/* =====================================\n   ФОРМАТИРОВАНИЕ ДАТЫ\n===================================== */\n\nfunction formatPressDate(value) {\n\n  if (!value) {\n    return \"\";\n  }\n\n  return String(value)\n    .slice(0, 10)\n    .replaceAll(\"-\", \".\");\n\n}\n\n/* =====================================\n   ОПРЕДЕЛЕНИЕ КОРЕЙСКОГО ТЕКСТА\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   ОТОБРАЖЕНИЕ ПУБЛИКАЦИЙ\n===================================== */\n\nfunction renderPress() {\n\n  const keyword =\n    pressSearch.value\n      .trim()\n      .toLowerCase();\n\n  const filtered =\n    pressData.filter(item => {\n\n      const searchText = [\n        item.title || \"\",\n        item.description || \"\",\n        item.published_at || \"\"\n      ]\n        .join(\" \")\n        .toLowerCase();\n\n      return searchText.includes(keyword);\n\n    });\n\n  pressList.replaceChildren();\n\n  if (filtered.length === 0) {\n\n    showPressMessage(\n      \"По вашему запросу публикации не найдены.\"\n    );\n\n    return;\n\n  }\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"press-item\";\n\n    /* Категория */\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className =\n      \"press-category\";\n\n    category.textContent =\n      \"Публикации в СМИ\";\n\n    /* Дата */\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className =\n      \"press-date\";\n\n    date.textContent =\n      formatPressDate(\n        item.published_at\n      );\n\n    /* Заголовок */\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title || \"\";\n\n    /* Описание */\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description || \"\";\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* Уведомление о корейском языке */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"Оригинал на корейском языке\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* Ссылка на оригинальную статью */\n\n    if (item.link) {\n\n      try {\n\n        const url =\n          new URL(item.link);\n\n        if (\n          url.protocol === \"https:\" ||\n          url.protocol === \"http:\"\n        ) {\n\n          const link =\n            document.createElement(\"a\");\n\n          link.className =\n            \"press-link\";\n\n          link.href = url.href;\n\n          link.target = \"_blank\";\n\n          link.rel =\n            \"noopener noreferrer\";\n\n          link.textContent =\n            \"Читать оригинальную статью →\";\n\n          card.appendChild(link);\n\n        }\n\n      } catch (error) {\n\n        console.warn(\n          \"Некорректная ссылка на публикацию:\",\n          item.link\n        );\n\n      }\n\n    }\n\n    pressList.appendChild(card);\n\n  });\n\n}\n\n/* =====================================\n   ЗАГРУЗКА ПУБЛИКАЦИЙ\n===================================== */\n\nasync function loadPress() {\n\n  showPressMessage(\n    \"Загрузка публикаций...\"\n  );\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id, title, category, description, link, published_at\"\n        )\n        .eq(\"category\", \"press\")\n        .order(\"published_at\", {\n          ascending: false\n        })\n        .order(\"id\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    pressData = data || [];\n\n    console.log(\n      \"Загружено публикаций:\",\n      pressData.length\n    );\n\n    if (pressData.length === 0) {\n\n      showPressMessage(\n        \"Публикации пока отсутствуют.\"\n      );\n\n      return;\n\n    }\n\n    renderPress();\n\n  } catch (error) {\n\n    console.error(\n      \"Ошибка загрузки публикаций:\",\n      error\n    );\n\n    showPressMessage(\n      \"Не удалось загрузить публикации. \" +\n      \"Пожалуйста, попробуйте позже.\"\n    );\n\n  }\n\n}\n\n/* =====================================\n   ПОИСК\n===================================== */\n\npressSearch.addEventListener(\n  \"input\",\n  renderPress\n);\n\n/* =====================================\n   ПЕРВОНАЧАЛЬНАЯ ЗАГРУЗКА\n===================================== */\n\nloadPress();\n\n\u003c/script>\n\n</body>\n</html>\n",

a6;\n}\n\n/* =====================================\n   语言说明\n===================================== */\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n.language-notice p {\n  margin-bottom: 0;\n}\n\n/* =====================================\n   搜索\n===================================== */\n\n.search-box {\n  margin: 25px 0;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 15px;\n  border: 1px solid #ccd5e0;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* =====================================\n   媒体报道列表\n===================================== */\n\n.press-list {\n  display: grid;\n  gap: 18px;\n}\n\n.press-item {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  border: 1px solid #e1e7ef;\n  box-shadow: 0 3px 10px rgba(0,0,0,0.04);\n}\n\n.press-item h3 {\n  margin: 8px 0;\n  color: #0754a6;\n  overflow-wrap: anywhere;\n}\n\n.press-item p {\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.press-date {\n  color: #69788c;\n  font-size: 14px;\n}\n\n.press-category {\n  display: inline-block;\n  padding: 4px 12px;\n  background: #e7f0fa;\n  color: #175b9a;\n  border-radius: 20px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.press-link {\n  display: inline-block;\n  margin-top: 15px;\n  color: #0754a6;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.press-link:hover {\n  text-decoration: underline;\n}\n\n.content-language {\n  display: block;\n  margin-top: 12px;\n  color: #69788c;\n  font-size: 13px;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  background: white;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   相关页面\n===================================== */\n\n.related {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-top: 30px;\n}\n\n.related h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   页脚\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 20px;\n  margin-top: 60px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   移动设备\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  main {\n    margin: 25px auto;\n    padding: 0 12px;\n  }\n\n  .intro,\n  .press-item,\n  .related {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     页眉\n===================================== -->\n\n<header>\n\n<h1>\n媒体报道\n</h1>\n\n<p>\n全球人工智能枢纽倡议<br>\n大韩民国高阳特例市\n</p>\n\n<p>\n报纸新闻、电视报道<br>\n及其他媒体报道\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=zh\"\n  class=\"home-link\"\n>\n  ← 中文首页\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     页面介绍\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\n全球人工智能枢纽倡议相关媒体报道\n</h2>\n\n<p>\n本页面汇集有关\n拟议中的全球人工智能枢纽倡议，\n以及京畿道和高阳特例市\n相关活动的报纸文章、\n电视新闻和其他媒体报道。\n</p>\n\n<p>\n这些报道旨在帮助国际访问者\n了解与该倡议有关的\n公众讨论、\n政策发展动态\n以及市民参与活动。\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     语言说明\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\n语言说明\n</strong>\n\n<p>\n大部分媒体报道\n由韩国新闻机构发布。\n</p>\n\n<p>\n为确保信息准确，\n韩语新闻标题和内容摘要\n将保留原文，\n不进行自动翻译。\n</p>\n\n<p>\n点击文章链接，\n即可前往相关媒体机构的网站\n阅读原始报道。\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     媒体报道搜索\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\n  type=\"search\"\n  id=\"pressSearch\"\n  placeholder=\"按标题或关键词搜索媒体报道\"\n  aria-label=\"搜索媒体报道\"\n>\n\n</div>\n\n\u003c!-- =====================================\n     媒体报道列表\n===================================== -->\n\n<div\n  class=\"press-list\"\n  id=\"pressList\"\n  aria-live=\"polite\"\n>\n\n  <p class=\"empty\">\n    正在准备加载媒体报道。\n  </p>\n\n</div>\n\n\u003c!-- =====================================\n     相关页面\n===================================== -->\n\n<section class=\"related\">\n\n<h2>\n相关信息\n</h2>\n\n<p>\n如需进一步了解\n全球人工智能枢纽倡议，\n请访问以下页面。\n</p>\n\n<a\n  href=\"news.html?lang=zh\"\n  class=\"button\"\n>\n  最新消息与公告\n</a>\n\n<a\n  href=\"history.html?lang=zh\"\n  class=\"button\"\n>\n  发展历程与重要里程碑\n</a>\n\n<a\n  href=\"committee.html?lang=zh\"\n  class=\"button\"\n>\n  关于市民推进委员会\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     页脚\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\n高阳特例市全球人工智能枢纽<br>\n引进市民推进委员会\n</strong>\n</p>\n\n<p>\n大韩民国京畿道\n</p>\n\n<p>\n与市民同行，<br>\n与京畿道同行，<br>\n与世界同行。\n</p>\n\n<p>\n<a href=\"index.html?lang=zh\">\n中文首页\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE 媒体报道模块\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE 连接\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\n/*\n  保留原英文页面使用的\n  Supabase 公开连接密钥。\n*/\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   DOM 元素\n===================================== */\n\nconst pressList =\n  document.getElementById(\"pressList\");\n\nconst pressSearch =\n  document.getElementById(\"pressSearch\");\n\nlet pressData = [];\n\nlet loadFailed = false;\n\n/* =====================================\n   显示提示信息\n===================================== */\n\nfunction showPressMessage(message) {\n\n  pressList.replaceChildren();\n\n  const paragraph =\n    document.createElement(\"p\");\n\n  paragraph.className = \"empty\";\n\n  paragraph.textContent = message;\n\n  pressList.appendChild(paragraph);\n\n}\n\n/* =====================================\n   日期格式\n===================================== */\n\nfunction formatPressDate(value) {\n\n  if (!value) {\n    return \"\";\n  }\n\n  return String(value)\n    .slice(0, 10)\n    .replaceAll(\"-\", \".\");\n\n}\n\n/* =====================================\n   检测韩语内容\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   渲染媒体报道\n===================================== */\n\nfunction renderPress() {\n\n  if (loadFailed) return;\n\n  const keyword =\n    pressSearch.value\n      .trim()\n      .toLowerCase();\n\n  const filtered =\n    pressData.filter(item => {\n\n      const searchText = [\n        item.title || \"\",\n        item.description || \"\",\n        item.published_at || \"\"\n      ]\n        .join(\" \")\n        .toLowerCase();\n\n      return searchText.includes(keyword);\n\n    });\n\n  pressList.replaceChildren();\n\n  if (filtered.length === 0) {\n\n    showPressMessage(\n      \"没有找到符合搜索条件的媒体报道。\"\n    );\n\n    return;\n\n  }\n\n  filtered.forEach(item => {\n\n    /* =====================================\n       媒体报道卡片\n    ===================================== */\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"press-item\";\n\n    /* =====================================\n       分类标签\n    ===================================== */\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className =\n      \"press-category\";\n\n    category.textContent =\n      \"媒体报道\";\n\n    /* =====================================\n       发布日期\n    ===================================== */\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className =\n      \"press-date\";\n\n    date.textContent =\n      formatPressDate(\n        item.published_at\n      );\n\n    /* =====================================\n       标题\n    ===================================== */\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title || \"\";\n\n    /* =====================================\n       内容摘要\n    ===================================== */\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description || \"\";\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* =====================================\n       韩语原文提示\n    ===================================== */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"原文为韩语\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* =====================================\n       原始文章链接\n    ===================================== */\n\n    if (item.link) {\n\n      try {\n\n        const url =\n          new URL(item.link);\n\n        if (\n          url.protocol === \"https:\" ||\n          url.protocol === \"http:\"\n        ) {\n\n          const link =\n            document.createElement(\"a\");\n\n          link.className =\n            \"press-link\";\n\n          link.href = url.href;\n\n          link.target = \"_blank\";\n\n          link.rel =\n            \"noopener noreferrer\";\n\n          link.textContent =\n            \"阅读原文 →\";\n\n          card.appendChild(link);\n\n        }\n\n      } catch (error) {\n\n        console.warn(\n          \"无效的媒体报道链接:\",\n          item.link\n        );\n\n      }\n\n    }\n\n    pressList.appendChild(card);\n\n  });\n\n}\n\n/* =====================================\n   加载媒体报道\n===================================== */\n\nasync function loadPress() {\n\n  showPressMessage(\n    \"正在加载媒体报道...\"\n  );\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id, title, category, description, link, published_at\"\n        )\n        .eq(\"category\", \"press\")\n        .order(\"published_at\", {\n          ascending: false\n        })\n        .order(\"id\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    pressData = data || [];\n\n    console.log(\n      \"媒体报道加载完成:\",\n      pressData.length\n    );\n\n    loadFailed = false;\n\n    if (pressData.length === 0) {\n\n      showPressMessage(\n        \"目前暂无媒体报道。\"\n      );\n\n      return;\n\n    }\n\n    renderPress();\n\n  } catch (error) {\n\n    console.error(\n      \"媒体报道查询失败:\",\n      error\n    );\n\n    loadFailed = true;\n\n    showPressMessage(\n      \"暂时无法加载媒体报道，请稍后重试。\"\n    );\n\n  }\n\n}\n\n/* =====================================\n   搜索功能\n===================================== */\n\npressSearch.addEventListener(\n  \"input\",\n  renderPress\n);\n\n/* =====================================\n   初始加载\n===================================== */\n\nloadPress();\n\n\u003c/script>\n\n</body>\n</html>\n"
}
</script>
<script>
(() => {
  const data = document.getElementById("page-variants");
  const pages = JSON.parse(data.textContent);
  const params = new URLSearchParams(window.location.search);
  const keys = ["view", "lang"].map(key => key + "=" + params.get(key));
  const selected = keys.find(key => Object.hasOwn(pages, key)) || "default";
  const page = pages[selected];
  const opening = /^\s*<!doctype html>\s*(<html\b[^>]*>)\s*<head\b[^>]*>/i.exec(page);

  // Keep the original URL and let the initial HTML parser run the page scripts.
  const root = new DOMParser().parseFromString(opening[1], "text/html").documentElement;
  for (const attribute of root.attributes) {
    document.documentElement.setAttribute(attribute.name, attribute.value);
  }
  data.remove();
  document.write(page.slice(opening[0].length));
})();
</script>
