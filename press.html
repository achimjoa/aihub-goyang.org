<div\n    class=\"press-list\"\n    id=\"pressList\"\n    aria-live=\"polite\"\n  >\n\n    <p class=\"empty\">\n      언론보도 자료를 불러올 준비가 되었습니다.\n    </p>\n\n  </div>\n\n</main>\n\n<footer>\n\n  <p>\n    경기도 글로벌 AI 허브 유치<br>\n    고양특례시 범시민추진위원회\n  </p>\n\n  <p>\n    시민의 힘으로,\n    경기도의 역량으로,\n    세계와 함께!\n  </p>\n\n\u003c!-- =====================================\n     제145-2-8-3-2단계\n     시민용 언론보도 Supabase 연동\n===================================== -->\n\n\u003cscript>\ndocument.addEventListener(\"error\", event => {\n  if (event.target instanceof HTMLScriptElement &&\n      event.target.id === \"page-initialization\") {\n    document.getElementById(\"pressList\").textContent = \"언론보도 조회 프로그램을 불러오지 못했습니다. 연결을 확인한 뒤 다시 시도해 주세요.\";\n  }\n}, true);\n\u003c/script>\n\u003cscript type=\"module\" id=\"page-initialization\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* Supabase 연결 정보 */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\n/*\n  아래에는 기존 news.html에서 사용하는\n  공개용 Supabase 키를 입력합니다.\n*/\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   화면 요소\n===================================== */\n\nconst pressList =\n  document.getElementById(\"pressList\");\n\nconst pressSearch =\n  document.getElementById(\"pressSearch\");\n\nlet pressData = [];\n\n/* =====================================\n   안내 메시지\n===================================== */\n\nfunction showPressMessage(message) {\n\n  pressList.replaceChildren();\n\n  const paragraph =\n    document.createElement(\"p\");\n\n  paragraph.className = \"empty\";\n  paragraph.textContent = message;\n\n  pressList.appendChild(paragraph);\n\n}\n\n/* =====================================\n   날짜 표시\n===================================== */\n\nfunction formatPressDate(value) {\n\n  if (!value) {\n    return \"\";\n  }\n\n  return String(value)\n    .slice(0, 10)\n    .replaceAll(\"-\", \".\");\n\n}\n\n/* =====================================\n   언론보도 목록 출력\n===================================== */\n\nfunction renderPress() {\n\n  const keyword =\n    pressSearch.value\n      .trim()\n      .toLowerCase();\n\n  const filtered =\n    pressData.filter(item => {\n\n      const searchText = [\n        item.title || \"\",\n        item.description || \"\",\n        item.published_at || \"\"\n      ]\n        .join(\" \")\n        .toLowerCase();\n\n      return searchText.includes(keyword);\n\n    });\n\n  pressList.replaceChildren();\n\n  if (filtered.length === 0) {\n\n    showPressMessage(\n      \"검색 조건에 맞는 언론보도가 없습니다.\"\n    );\n\n    return;\n\n  }\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"press-item\";\n\n    /* 분류 */\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className =\n      \"press-category\";\n\n    category.textContent =\n      \"언론보도\";\n\n    /* 날짜 */\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className =\n      \"press-date\";\n\n    date.textContent =\n      formatPressDate(\n        item.published_at\n      );\n\n    /* 제목 */\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title || \"\";\n\n    /* 내용 */\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description || \"\";\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* 관련 기사 링크 */\n\n    if (item.link) {\n\n      try {\n\n        const url =\n          new URL(item.link);\n\n        if (\n          url.protocol === \"https:\" ||\n          url.protocol === \"http:\"\n        ) {\n\n          const link =\n            document.createElement(\"a\");\n\n          link.className =\n            \"press-link\";\n\n          link.href = url.href;\n\n          link.target = \"_blank\";\n\n          link.rel =\n            \"noopener noreferrer\";\n\n          link.textContent =\n            \"기사 자세히 보기 →\";\n\n          card.appendChild(link);\n\n        }\n\n      } catch (error) {\n\n        console.warn(\n          \"올바르지 않은 언론보도 링크:\",\n          item.link\n        );\n\n      }\n\n    }\n\n    pressList.appendChild(card);\n\n  });\n\n}\n\n/* =====================================\n   Supabase 언론보도 조회\n===================================== */\n\nasync function loadPress() {\n\n  showPressMessage(\n    \"언론보도를 불러오고 있습니다.\"\n  );\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id, title, category, description, link, published_at\"\n        )\n        .eq(\"category\", \"press\")\n        .order(\"published_at\", {\n          ascending: false\n        })\n        .order(\"id\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    pressData = data || [];\n\n    console.log(\n      \"언론보도 조회 완료:\",\n      pressData.length,\n      \"건\"\n    );\n\n    if (pressData.length === 0) {\n\n      showPressMessage(\n        \"현재 등록된 언론보도가 없습니다.\"\n      );\n\n      return;\n\n    }\n\n    renderPress();\n\n  } catch (error) {\n\n    console.error(\n      \"언론보도 조회 오류:\",\n      error\n    );\n\n    showPressMessage(\n      \"언론보도를 불러오지 못했습니다.\"\n    );\n\n  }\n\n}\n\n/* =====================================\n   검색 기능\n===================================== */\n\npressSearch.addEventListener(\n  \"input\",\n  renderPress\n);\n\n/* =====================================\n   최초 조회\n===================================== */\n\nloadPress();\n\n\u003c/script>\n\n</footer>\n\n</body>\n\n</html>\n",

  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.05);\n}\n\n.intro h2 {\n  margin-top: 0;\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-right: 5px solid #e4b43c;\n  border-left: none;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n.language-notice p {\n  margin-bottom: 0;\n}\n\n/* =====================================\n   SEARCH\n===================================== */\n\n.search-box {\n  margin: 25px 0;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 15px;\n  border: 1px solid #ccd5e0;\n  border-radius: 8px;\n  font-size: 16px;\n  font-family: inherit;\n  direction: rtl;\n  text-align: right;\n}\n\n/* =====================================\n   PRESS LIST\n===================================== */\n\n.press-list {\n  display: grid;\n  gap: 18px;\n}\n\n.press-item {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  border: 1px solid #e1e7ef;\n  box-shadow: 0 3px 10px rgba(0,0,0,0.04);\n}\n\n.press-item h3 {\n  margin: 8px 0;\n  color: #0754a6;\n  overflow-wrap: anywhere;\n}\n\n.press-item p {\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.press-date {\n  color: #69788c;\n  font-size: 14px;\n  direction: ltr;\n  unicode-bidi: isolate;\n  text-align: right;\n}\n\n.press-category {\n  display: inline-block;\n  padding: 4px 12px;\n  background: #e7f0fa;\n  color: #175b9a;\n  border-radius: 20px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.press-link {\n  display: inline-block;\n  margin-top: 15px;\n  color: #0754a6;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.press-link:hover {\n  text-decoration: underline;\n}\n\n.content-language {\n  display: block;\n  margin-top: 12px;\n  color: #69788c;\n  font-size: 13px;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  background: white;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   RELATED LINKS\n===================================== */\n\n.related {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-top: 30px;\n}\n\n.related h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 0 0 10px;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   FOOTER\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 20px;\n  margin-top: 60px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  main {\n    margin: 25px auto;\n    padding: 0 12px;\n  }\n\n  .intro,\n  .press-item,\n  .related {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n    margin-left: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header>\n\n<h1>\nالتغطية الإعلامية\n</h1>\n\n<p>\nمبادرة المركز العالمي للذكاء الاصطناعي<br>\nمدينة غويانغ الخاصة، جمهورية كوريا\n</p>\n\n<p>\nالمقالات الصحفية،\nوالتقارير التلفزيونية والإذاعية،\nوالتغطية الإعلامية\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=ar\"\n  class=\"home-link\"\n>\n← الصفحة الرئيسية العربية\n</a>\n\n<a\n  href=\"press.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     INTRODUCTION\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nالتقارير الإعلامية حول مبادرة المركز العالمي للذكاء الاصطناعي\n</h2>\n\n<p>\nتوفر هذه الصفحة\nإمكانية الوصول إلى المقالات الصحفية،\nوالتقارير التلفزيونية والإذاعية،\nوغيرها من التغطيات الإعلامية\nالمتعلقة بمبادرة المركز العالمي\nالمقترح للذكاء الاصطناعي\nوالأنشطة المرتبطة بها\nفي مقاطعة غيونغي\nومدينة غويانغ الخاصة.\n</p>\n\n<p>\nتُعرض هذه التقارير\nلمساعدة الزوار الدوليين\nعلى فهم المناقشات العامة،\nوالتطورات المتعلقة بالسياسات،\nوالأنشطة المدنية\nالمرتبطة بالمبادرة.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     LANGUAGE INFORMATION\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nمعلومات اللغة\n</strong>\n\n<p>\nتُنشر معظم التقارير الإعلامية\nمن قبل المؤسسات الإخبارية الكورية.\nوتُعرض العناوين والأوصاف الأصلية\nباللغة الكورية\nدون ترجمة آلية.\n</p>\n\n<p>\nيمكنكم اختيار رابط المقال\nللاطلاع على التقرير الأصلي\nفي الموقع الإلكتروني\nللجهة الناشرة.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     SEARCH\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\n  type=\"search\"\n  id=\"pressSearch\"\n  placeholder=\"ابحث في التقارير الإعلامية حسب العنوان أو الكلمة المفتاحية\"\n  aria-label=\"البحث في التغطية الإعلامية\"\n>\n\n</div>\n\n\u003c!-- =====================================\n     PRESS LIST\n===================================== -->\n\n<div\n  class=\"press-list\"\n  id=\"pressList\"\n  aria-live=\"polite\"\n>\n\n  <p class=\"empty\">\n    جارٍ التحضير لتحميل التقارير الإعلامية.\n  </p>\n\n</div>\n\n\u003c!-- =====================================\n     RELATED PAGES\n===================================== -->\n\n<section class=\"related\">\n\n<h2>\nمعلومات ذات صلة\n</h2>\n\n<p>\nللحصول على مزيد من المعلومات\nحول مبادرة المركز العالمي\nللذكاء الاصطناعي،\nيرجى الاطلاع على الصفحات التالية.\n</p>\n\n<a\n  href=\"news.html?lang=ar\"\n  class=\"button\"\n>\nالأخبار والإعلانات\n</a>\n\n<a\n  href=\"history.html?lang=ar\"\n  class=\"button\"\n>\nالتسلسل الزمني وأبرز المحطات\n</a>\n\n<a\n  href=\"committee.html?lang=ar\"\n  class=\"button\"\n>\nحول اللجنة المدنية الداعمة\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nاللجنة المدنية لدعم استقطاب<br>\nالمركز العالمي للذكاء الاصطناعي<br>\nإلى مدينة غويانغ الخاصة\n</strong>\n</p>\n\n<p>\nمقاطعة غيونغي،\nجمهورية كوريا\n</p>\n\n<p>\nمع المواطنين،\nومع مقاطعة غيونغي،\nومع العالم.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=ar\">\nالصفحة الرئيسية العربية\n</a>\n\n&nbsp; | &nbsp;\n\n<a\n  href=\"press.html\"\n  lang=\"ko\"\n  dir=\"ltr\"\n>\n한국어\n</a>\n\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE MEDIA MODULE\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE CONNECTION\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\n/*\n  Public Supabase key retained\n  from the original English press-en.html.\n*/\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   DOM ELEMENTS\n===================================== */\n\nconst pressList =\n  document.getElementById(\"pressList\");\n\nconst pressSearch =\n  document.getElementById(\"pressSearch\");\n\nlet pressData = [];\n\n/* =====================================\n   MESSAGE DISPLAY\n===================================== */\n\nfunction showPressMessage(message) {\n\n  pressList.replaceChildren();\n\n  const paragraph =\n    document.createElement(\"p\");\n\n  paragraph.className = \"empty\";\n\n  paragraph.textContent = message;\n\n  pressList.appendChild(paragraph);\n\n}\n\n/* =====================================\n   DATE FORMATTING\n===================================== */\n\nfunction formatPressDate(value) {\n\n  if (!value) {\n    return \"\";\n  }\n\n  return String(value)\n    .slice(0, 10)\n    .replaceAll(\"-\", \".\");\n\n}\n\n/* =====================================\n   KOREAN TEXT DETECTION\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   RENDER PRESS REPORTS\n===================================== */\n\nfunction renderPress() {\n\n  const keyword =\n    pressSearch.value\n      .trim()\n      .toLowerCase();\n\n  const filtered =\n    pressData.filter(item => {\n\n      const searchText = [\n        item.title || \"\",\n        item.description || \"\",\n        item.published_at || \"\"\n      ]\n        .join(\" \")\n        .toLowerCase();\n\n      return searchText.includes(keyword);\n\n    });\n\n  pressList.replaceChildren();\n\n  if (filtered.length === 0) {\n\n    showPressMessage(\n      \"لا توجد تقارير إعلامية تطابق معايير البحث.\"\n    );\n\n    return;\n\n  }\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"press-item\";\n\n    /* Category */\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className =\n      \"press-category\";\n\n    category.textContent =\n      \"التغطية الإعلامية\";\n\n    /* Date */\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className =\n      \"press-date\";\n\n    date.textContent =\n      formatPressDate(\n        item.published_at\n      );\n\n    /* Title */\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title || \"\";\n\n    /* Description */\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description || \"\";\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* Korean language notice */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"المحتوى الأصلي باللغة الكورية\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* Original article link */\n\n    if (item.link) {\n\n      try {\n\n        const url =\n          new URL(item.link);\n\n        if (\n          url.protocol === \"https:\" ||\n          url.protocol === \"http:\"\n        ) {\n\n          const link =\n            document.createElement(\"a\");\n\n          link.className =\n            \"press-link\";\n\n          link.href = url.href;\n\n          link.target = \"_blank\";\n\n          link.rel =\n            \"noopener noreferrer\";\n\n          link.textContent =\n            \"قراءة المقال الأصلي ←\";\n\n          card.appendChild(link);\n\n        }\n\n      } catch (error) {\n\n        console.warn(\n          \"Invalid media link:\",\n          item.link\n        );\n\n      }\n\n    }\n\n    pressList.appendChild(card);\n\n  });\n\n}\n\n/* =====================================\n   LOAD PRESS REPORTS\n===================================== */\n\nasync function loadPress() {\n\n  showPressMessage(\n    \"جارٍ تحميل التقارير الإعلامية...\"\n  );\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id, title, category, description, link, published_at\"\n        )\n        .eq(\"category\", \"press\")\n        .order(\"published_at\", {\n          ascending: false\n        })\n        .order(\"id\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    pressData = data || [];\n\n    console.log(\n      \"Arabic media reports loaded:\",\n      pressData.length\n    );\n\n    if (pressData.length === 0) {\n\n      showPressMessage(\n        \"لا توجد تقارير إعلامية متاحة حالياً.\"\n      );\n\n      return;\n\n    }\n\n    renderPress();\n\n  } catch (error) {\n\n    console.error(\n      \"Media reports query failed:\",\n      error\n    );\n\n    showPressMessage(\n      \"تعذر تحميل التقارير الإعلامية حالياً. يرجى المحاولة مرة أخرى لاحقاً.\"\n    );\n\n  }\n\n}\n\n/* =====================================\n   SEARCH\n===================================== */\n\npressSearch.addEventListener(\n  \"input\",\n  renderPress\n);\n\n/* =====================================\n   INITIAL LOAD\n===================================== */\n\nloadPress();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=de": "<!DOCTYPE html>\n<html lang=\"de\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nPresse und Medienberichte | Initiative für ein globales KI-Zentrum\n</title>\n\n<meta\n  name=\"description\"\n  content=\"Presseberichte und Medienveröffentlichungen über die Initiative für ein globales KI-Zentrum und das Bürgerkomitee in der Sonderstadt Goyang, Republik Korea.\"\n>\n\n<style>\n\n/* =====================================\n   GRUNDEINSTELLUNGEN\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    Arial,\n    Helvetica,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\ninput:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   KOPFBEREICH\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  margin: 0 0 18px;\n  font-size: clamp(28px, 5vw, 42px);\n}\n\nheader p {\n  margin: 12px 0;\n  font-size: 17px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 22px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 20px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   HAUPTINHALT\n===================================== */\n\nmain {\n  max-width: 1100px;\n  margin: 40px auto;\n  padding: 0 20px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.05);\n}\n\n.intro h2 {\n  margin-top: 0;\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n.language-notice p {\n  margin-bottom: 0;\n}\n\n/* =====================================\n   SUCHE\n===================================== */\n\n.search-box {\n  margin: 25px 0;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 15px;\n  border: 1px solid #ccd5e0;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* =====================================\n   PRESSELISTE\n===================================== */\n\n.press-list {\n  display: grid;\n  gap: 18px;\n}\n\n.press-item {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  border: 1px solid #e1e7ef;\n  box-shadow: 0 3px 10px rgba(0,0,0,0.04);\n}\n\n.press-item h3 {\n  margin: 8px 0;\n  color: #0754a6;\n  overflow-wrap: anywhere;\n}\n\n.press-item p {\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.press-date {\n  color: #69788c;\n  font-size: 14px;\n}\n\n.press-category {\n  display: inline-block;\n  padding: 4px 12px;\n  background: #e7f0fa;\n  color: #175b9a;\n  border-radius: 20px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.press-link {\n  display: inline-block;\n  margin-top: 15px;\n  color: #0754a6;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.press-link:hover {\n  text-decoration: underline;\n}\n\n.content-language {\n  display: block;\n  margin-top: 12px;\n  color: #69788c;\n  font-size: 13px;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  background: white;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   VERWANDTE SEITEN\n===================================== */\n\n.related {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-top: 30px;\n}\n\n.related h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   FUSSZEILE\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 20px;\n  margin-top: 60px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   MOBILE ANSICHT\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  main {\n    margin: 25px auto;\n    padding: 0 12px;\n  }\n\n  .intro,\n  .press-item,\n  .related {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     KOPFBEREICH\n===================================== -->\n\n<header>\n\n<h1>\nPresse und Medienberichte\n</h1>\n\n<p>\nInitiative für ein globales KI-Zentrum<br>\nSonderstadt Goyang, Republik Korea\n</p>\n\n<p>\nZeitungsartikel,<br>\nFernseh- und Rundfunkberichte<br>\nsowie weitere Medienveröffentlichungen\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=de\"\n  class=\"home-link\"\n>\n  ← Deutsche Startseite\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     EINFÜHRUNG\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nMedienberichte über die Initiative\nfür ein globales KI-Zentrum\n</h2>\n\n<p>\nDiese Seite bietet Zugang zu\nZeitungsartikeln,\nFernseh- und Rundfunkberichten\nsowie weiteren Medienveröffentlichungen\nüber die geplante Initiative\nfür ein globales KI-Zentrum\nund damit verbundene Aktivitäten\nin der Provinz Gyeonggi\nund der Sonderstadt Goyang.\n</p>\n\n<p>\nDie Berichte sollen\ninternationalen Besucherinnen und Besuchern\nhelfen,\nöffentliche Diskussionen,\npolitische Entwicklungen\nund bürgerschaftliche Aktivitäten\nim Zusammenhang mit der Initiative\nbesser zu verstehen.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     SPRACHINFORMATIONEN\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nSprachinformationen\n</strong>\n\n<p>\nDie meisten Medienberichte\nwerden von koreanischen\nNachrichtenorganisationen veröffentlicht.\nDie ursprünglichen koreanischen Titel\nund Beschreibungen werden\nohne automatische Übersetzung angezeigt.\n</p>\n\n<p>\nWählen Sie den Artikellink,\num den Originalbericht\nauf der Website\ndes jeweiligen Medienunternehmens\nzu lesen.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     SUCHE\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\n  type=\"search\"\n  id=\"pressSearch\"\n  placeholder=\"Medienberichte nach Titel oder Stichwort suchen\"\n  aria-label=\"Medienberichte durchsuchen\"\n>\n\n</div>\n\n\u003c!-- =====================================\n     PRESSELISTE\n===================================== -->\n\n<div\n  class=\"press-list\"\n  id=\"pressList\"\n  aria-live=\"polite\"\n>\n\n  <p class=\"empty\">\n    Medienberichte werden vorbereitet.\n  </p>\n\n</div>\n\n\u003c!-- =====================================\n     VERWANDTE SEITEN\n===================================== -->\n\n<section class=\"related\">\n\n<h2>\nWeitere Informationen\n</h2>\n\n<p>\nWeitere Informationen\nüber die Initiative\nfür ein globales KI-Zentrum\nfinden Sie auf den folgenden Seiten.\n</p>\n\n<a\n  href=\"news.html?lang=de\"\n  class=\"button\"\n>\n  Nachrichten und Bekanntmachungen\n</a>\n\n<a\n  href=\"history.html?lang=de\"\n  class=\"button\"\n>\n  Chronologie und Meilensteine\n</a>\n\n<a\n  href=\"committee.html?lang=de\"\n  class=\"button\"\n>\n  Über das Bürgerkomitee\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FUSSZEILE\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nBürgerkomitee zur Förderung<br>\nder Ansiedlung eines globalen KI-Zentrums<br>\nin der Sonderstadt Goyang\n</strong>\n</p>\n\n<p>\nProvinz Gyeonggi,\nRepublik Korea\n</p>\n\n<p>\nMit den Bürgerinnen und Bürgern,<br>\nmit der Provinz Gyeonggi<br>\nund mit der Welt.\n</p>\n\n<p>\n<a href=\"index.html?lang=de\">\nDeutsche Startseite\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE-MEDIENMODUL\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE-VERBINDUNG\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\n/*\n  Öffentlicher Supabase-Schlüssel.\n  Gleicher Schlüssel wie news-de.html.\n*/\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   DOM-ELEMENTE\n===================================== */\n\nconst pressList =\n  document.getElementById(\"pressList\");\n\nconst pressSearch =\n  document.getElementById(\"pressSearch\");\n\nlet pressData = [];\n\n/* =====================================\n   MELDUNGEN ANZEIGEN\n===================================== */\n\nfunction showPressMessage(message) {\n\n  pressList.replaceChildren();\n\n  const paragraph =\n    document.createElement(\"p\");\n\n  paragraph.className = \"empty\";\n\n  paragraph.textContent = message;\n\n  pressList.appendChild(paragraph);\n\n}\n\n/* =====================================\n   DATUMSFORMATIERUNG\n===================================== */\n\nfunction formatPressDate(value) {\n\n  if (!value) {\n    return \"\";\n  }\n\n  return String(value)\n    .slice(0, 10)\n    .replaceAll(\"-\", \".\");\n\n}\n\n/* =====================================\n   KOREANISCHE TEXTE ERKENNEN\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   PRESSEBERICHTE ANZEIGEN\n===================================== */\n\nfunction renderPress() {\n\n  const keyword =\n    pressSearch.value\n      .trim()\n      .toLowerCase();\n\n  const filtered =\n    pressData.filter(item => {\n\n      const searchText = [\n        item.title || \"\",\n        item.description || \"\",\n        item.published_at || \"\"\n      ]\n        .join(\" \")\n        .toLowerCase();\n\n      return searchText.includes(keyword);\n\n    });\n\n  pressList.replaceChildren();\n\n  if (filtered.length === 0) {\n\n    showPressMessage(\n      \"Keine Medienberichte entsprechen Ihrer Suche.\"\n    );\n\n    return;\n\n  }\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"press-item\";\n\n    /* Kategorie */\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className =\n      \"press-category\";\n\n    category.textContent =\n      \"Medienberichte\";\n\n    /* Datum */\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className =\n      \"press-date\";\n\n    date.textContent =\n      formatPressDate(\n        item.published_at\n      );\n\n    /* Titel */\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title || \"\";\n\n    /* Beschreibung */\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description || \"\";\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* Hinweis auf koreanische Inhalte */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"Originalinhalt auf Koreanisch\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* Link zum Originalartikel */\n\n    if (item.link) {\n\n      try {\n\n        const url =\n          new URL(item.link);\n\n        if (\n          url.protocol === \"https:\" ||\n          url.protocol === \"http:\"\n        ) {\n\n          const link =\n            document.createElement(\"a\");\n\n          link.className =\n            \"press-link\";\n\n          link.href = url.href;\n\n          link.target = \"_blank\";\n\n          link.rel =\n            \"noopener noreferrer\";\n\n          link.textContent =\n            \"Originalartikel lesen →\";\n\n          card.appendChild(link);\n\n        }\n\n      } catch (error) {\n\n        console.warn(\n          \"Ungültiger Medienlink:\",\n          item.link\n        );\n\n      }\n\n    }\n\n    pressList.appendChild(card);\n\n  });\n\n}\n\n/* =====================================\n   PRESSEBERICHTE LADEN\n===================================== */\n\nasync function loadPress() {\n\n  showPressMessage(\n    \"Medienberichte werden geladen...\"\n  );\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id, title, category, description, link, published_at\"\n        )\n        .eq(\"category\", \"press\")\n        .order(\"published_at\", {\n          ascending: false\n        })\n        .order(\"id\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    pressData = data || [];\n\n    console.log(\n      \"Geladene Medienberichte:\",\n      pressData.length\n    );\n\n    if (pressData.length === 0) {\n\n      showPressMessage(\n        \"Derzeit sind keine Medienberichte verfügbar.\"\n      );\n\n      return;\n\n    }\n\n    renderPress();\n\n  } catch (error) {\n\n    console.error(\n      \"Abfrage der Medienberichte fehlgeschlagen:\",\n      error\n    );\n\n    showPressMessage(\n      \"Medienberichte können derzeit nicht geladen werden. Bitte versuchen Sie es später erneut.\"\n    );\n\n  }\n\n}\n\n/* =====================================\n   SUCHE\n===================================== */\n\npressSearch.addEventListener(\n  \"input\",\n  renderPress\n);\n\n/* =====================================\n   ERSTER LADEVORGANG\n===================================== */\n\nloadPress();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=en": "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nMedia Coverage | Global AI Hub Initiative\n</title>\n\n<meta\n  name=\"description\"\n  content=\"Media coverage and news reports concerning the Global AI Hub initiative and the Citizens' Promotion Committee in Goyang Special City, Republic of Korea.\"\n>\n\n<style>\n\n/* =====================================\n   BASIC SETTINGS\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    Arial,\n    Helvetica,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\ninput:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   HEADER\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  margin: 0 0 18px;\n  font-size: clamp(28px, 5vw, 42px);\n}\n\nheader p {\n  margin: 12px 0;\n  font-size: 17px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 22px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 20px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   MAIN CONTENT\n===================================== */\n\nmain {\n  max-width: 1100px;\n  margin: 40px auto;\n  padding: 0 20px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.05);\n}\n\n.intro h2 {\n  margin-top: 0;\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n.language-notice p {\n  margin-bottom: 0;\n}\n\n/* =====================================\n   SEARCH\n===================================== */\n\n.search-box {\n  margin: 25px 0;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 15px;\n  border: 1px solid #ccd5e0;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* =====================================\n   PRESS LIST\n===================================== */\n\n.press-list {\n  display: grid;\n  gap: 18px;\n}\n\n.press-item {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  border: 1px solid #e1e7ef;\n  box-shadow: 0 3px 10px rgba(0,0,0,0.04);\n}\n\n.press-item h3 {\n  margin: 8px 0;\n  color: #0754a6;\n  overflow-wrap: anywhere;\n}\n\n.press-item p {\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.press-date {\n  color: #69788c;\n  font-size: 14px;\n}\n\n.press-category {\n  display: inline-block;\n  padding: 4px 12px;\n  background: #e7f0fa;\n  color: #175b9a;\n  border-radius: 20px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.press-link {\n  display: inline-block;\n  margin-top: 15px;\n  color: #0754a6;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.press-link:hover {\n  text-decoration: underline;\n}\n\n.content-language {\n  display: block;\n  margin-top: 12px;\n  color: #69788c;\n  font-size: 13px;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  background: white;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   RELATED LINKS\n===================================== */\n\n.related {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-top: 30px;\n}\n\n.related h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   FOOTER\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 20px;\n  margin-top: 60px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  main {\n    margin: 25px auto;\n    padding: 0 12px;\n  }\n\n  .intro,\n  .press-item,\n  .related {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     HEADER\n===================================== -->\n\n<header>\n\n<h1>\nMedia Coverage\n</h1>\n\n<p>\nGlobal AI Hub Initiative<br>\nGoyang Special City, Republic of Korea\n</p>\n\n<p>\nNewspaper Articles,\nBroadcast Reports,\nand Media Coverage\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=en\"\n  class=\"home-link\"\n>\n  ← English Home\n</a>\n\n<a\n  href=\"press.html\"\n  class=\"home-link\"\n  lang=\"ko\"\n>\n  한국어\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     INTRODUCTION\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nMedia Reports on the Global AI Hub Initiative\n</h2>\n\n<p>\nThis page provides access to\nnewspaper articles,\nbroadcast reports,\nand other media coverage\nconcerning the proposed\nGlobal AI Hub initiative\nand related activities\nin Gyeonggi Province\nand Goyang Special City.\n</p>\n\n<p>\nThe reports are presented\nto help international visitors\nunderstand public discussions,\npolicy developments,\nand civic activities\nrelated to the initiative.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     LANGUAGE INFORMATION\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nLanguage Information\n</strong>\n\n<p>\nMost media reports are published\nby Korean news organizations.\nOriginal Korean-language titles\nand descriptions are displayed\nwithout automatic translation.\n</p>\n\n<p>\nSelect the article link\nto view the original report\non the publisher's website.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     SEARCH\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\n  type=\"search\"\n  id=\"pressSearch\"\n  placeholder=\"Search media reports by title or keyword\"\n  aria-label=\"Search media coverage\"\n>\n\n</div>\n\n\u003c!-- =====================================\n     PRESS LIST\n===================================== -->\n\n<div\n  class=\"press-list\"\n  id=\"pressList\"\n  aria-live=\"polite\"\n>\n\n  <p class=\"empty\">\n    Preparing to load media reports.\n  </p>\n\n</div>\n\n\u003c!-- =====================================\n     RELATED PAGES\n===================================== -->\n\n<section class=\"related\">\n\n<h2>\nRelated Information\n</h2>\n\n<p>\nFor additional information\nabout the Global AI Hub initiative,\nplease explore the following pages.\n</p>\n\n<a\n  href=\"news.html?lang=en\"\n  class=\"button\"\n>\n  News & Announcements\n</a>\n\n<a\n  href=\"history.html?lang=en\"\n  class=\"button\"\n>\n  Timeline & Milestones\n</a>\n\n<a\n  href=\"committee.html?lang=en\"\n  class=\"button\"\n>\n  About the Committee\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     FOOTER\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nCitizens' Promotion Committee<br>\nfor Attracting the Global AI Hub<br>\nto Goyang Special City\n</strong>\n</p>\n\n<p>\nGyeonggi Province,\nRepublic of Korea\n</p>\n\n<p>\nWith Citizens,\nWith Gyeonggi Province,\nand With the World.\n</p>\n\n<p>\n<a href=\"index.html?lang=en\">\nEnglish Home\n</a>\n&nbsp; | &nbsp;\n<a href=\"press.html\" lang=\"ko\">\n한국어\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     SUPABASE MEDIA MODULE\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   SUPABASE CONNECTION\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\n/*\n  Public Supabase key retained\n  from the original Korean press.html.\n*/\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   DOM ELEMENTS\n===================================== */\n\nconst pressList =\n  document.getElementById(\"pressList\");\n\nconst pressSearch =\n  document.getElementById(\"pressSearch\");\n\nlet pressData = [];\n\n/* =====================================\n   MESSAGE DISPLAY\n===================================== */\n\nfunction showPressMessage(message) {\n\n  pressList.replaceChildren();\n\n  const paragraph =\n    document.createElement(\"p\");\n\n  paragraph.className = \"empty\";\n\n  paragraph.textContent = message;\n\n  pressList.appendChild(paragraph);\n\n}\n\n/* =====================================\n   DATE FORMATTING\n===================================== */\n\nfunction formatPressDate(value) {\n\n  if (!value) {\n    return \"\";\n  }\n\n  return String(value)\n    .slice(0, 10)\n    .replaceAll(\"-\", \".\");\n\n}\n\n/* =====================================\n   KOREAN TEXT DETECTION\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   RENDER PRESS REPORTS\n===================================== */\n\nfunction renderPress() {\n\n  const keyword =\n    pressSearch.value\n      .trim()\n      .toLowerCase();\n\n  const filtered =\n    pressData.filter(item => {\n\n      const searchText = [\n        item.title || \"\",\n        item.description || \"\",\n        item.published_at || \"\"\n      ]\n        .join(\" \")\n        .toLowerCase();\n\n      return searchText.includes(keyword);\n\n    });\n\n  pressList.replaceChildren();\n\n  if (filtered.length === 0) {\n\n    showPressMessage(\n      \"No media reports match your search.\"\n    );\n\n    return;\n\n  }\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"press-item\";\n\n    /* Category */\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className =\n      \"press-category\";\n\n    category.textContent =\n      \"Media Coverage\";\n\n    /* Date */\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className =\n      \"press-date\";\n\n    date.textContent =\n      formatPressDate(\n        item.published_at\n      );\n\n    /* Title */\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title || \"\";\n\n    /* Description */\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description || \"\";\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* Korean language notice */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"Original content in Korean\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* Original article link */\n\n    if (item.link) {\n\n      try {\n\n        const url =\n          new URL(item.link);\n\n        if (\n          url.protocol === \"https:\" ||\n          url.protocol === \"http:\"\n        ) {\n\n          const link =\n            document.createElement(\"a\");\n\n          link.className =\n            \"press-link\";\n\n          link.href = url.href;\n\n          link.target = \"_blank\";\n\n          link.rel =\n            \"noopener noreferrer\";\n\n          link.textContent =\n            \"Read Original Article →\";\n\n          card.appendChild(link);\n\n        }\n\n      } catch (error) {\n\n        console.warn(\n          \"Invalid media link:\",\n          item.link\n        );\n\n      }\n\n    }\n\n    pressList.appendChild(card);\n\n  });\n\n}\n\n/* =====================================\n   LOAD PRESS REPORTS\n===================================== */\n\nasync function loadPress() {\n\n  showPressMessage(\n    \"Loading media reports...\"\n  );\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id, title, category, description, link, published_at\"\n        )\n        .eq(\"category\", \"press\")\n        .order(\"published_at\", {\n          ascending: false\n        })\n        .order(\"id\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    pressData = data || [];\n\n    console.log(\n      \"Media reports loaded:\",\n      pressData.length\n    );\n\n    if (pressData.length === 0) {\n\n      showPressMessage(\n        \"No media reports are currently available.\"\n      );\n\n      return;\n\n    }\n\n    renderPress();\n\n  } catch (error) {\n\n    console.error(\n      \"Media reports query failed:\",\n      error\n    );\n\n    showPressMessage(\n      \"Unable to load media reports. Please try again later.\"\n    );\n\n  }\n\n}\n\n/* =====================================\n   SEARCH\n===================================== */\n\npressSearch.addEventListener(\n  \"input\",\n  renderPress\n);\n\n/* =====================================\n   INITIAL LOAD\n===================================== */\n\nloadPress();\n\n\u003c/script>\n\n</body>\n</html>\n",

n  font-size: 13px;\n  font-weight: bold;\n}\n\n.top-navigation > a:hover {\n  color: #ffdf5a;\n}\n\n/* SELECTOR DE IDIOMA */\n\n.language-dropdown {\n  position: relative;\n  z-index: 1000;\n}\n\n.language-dropdown summary {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n\n  padding: 9px 15px;\n\n  background: #ffe44d;\n  color: #003b79;\n\n  border-radius: 6px;\n\n  font-size: 13px;\n  font-weight: bold;\n\n  cursor: pointer;\n  list-style: none;\n}\n\n.language-dropdown summary::-webkit-details-marker {\n  display: none;\n}\n\n.language-options {\n  position: absolute;\n  top: calc(100% + 7px);\n  right: 0;\n\n  min-width: 180px;\n  padding: 8px;\n\n  background: white;\n  border: 1px solid #cbdff5;\n  border-radius: 8px;\n\n  box-shadow:\n    0 5px 18px rgba(0,0,0,0.18);\n}\n\n.language-options a {\n  display: block;\n\n  padding: 10px 12px;\n\n  color: #0754a6;\n  background: white;\n\n  border-radius: 5px;\n\n  font-size: 14px;\n  text-align: left;\n  text-decoration: none;\n}\n\n.language-options a:hover,\n.language-options a[aria-current=\"page\"] {\n  background: #eaf4ff;\n}\n\n.language-options a[aria-current=\"page\"] {\n  font-weight: bold;\n}\n\n/* CONTENIDO */\n\nmain {\n  max-width: 1100px;\n  margin: 35px auto;\n  padding: 0 15px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n\n  box-shadow:\n    0 3px 12px rgba(0,0,0,0.05);\n}\n\n.intro h2 {\n  margin-top: 0;\n  color: #0754a6;\n}\n\n/* AVISO DE IDIOMA */\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n.language-notice p {\n  margin-bottom: 0;\n}\n\n/* BÚSQUEDA */\n\n.search-box {\n  margin: 25px 0;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 15px;\n  border: 1px solid #ccd5e0;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* LISTA DE PRENSA */\n\n.press-list {\n  display: grid;\n  gap: 18px;\n}\n\n.press-item {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  border: 1px solid #e1e7ef;\n\n  box-shadow:\n    0 3px 10px rgba(0,0,0,0.04);\n}\n\n.press-item h3 {\n  margin: 8px 0;\n  color: #0754a6;\n  overflow-wrap: anywhere;\n}\n\n.press-item p {\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.press-date {\n  color: #69788c;\n  font-size: 14px;\n}\n\n.press-category {\n  display: inline-block;\n  padding: 4px 12px;\n  background: #e7f0fa;\n  color: #175b9a;\n  border-radius: 20px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.press-link {\n  display: inline-block;\n  margin-top: 15px;\n  color: #0754a6;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.press-link:hover {\n  text-decoration: underline;\n}\n\n.content-language {\n  display: block;\n  margin-top: 12px;\n  color: #69788c;\n  font-size: 13px;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  background: white;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* ENLACES RELACIONADOS */\n\n.related {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-top: 30px;\n}\n\n.related h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* PIE DE PÁGINA */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 20px;\n  margin-top: 60px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* DISEÑO MÓVIL */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 30px 12px;\n  }\n\n  header p {\n    font-size: 15px;\n  }\n\n  main {\n    margin: 25px auto;\n    padding: 0 12px;\n  }\n\n  .intro,\n  .press-item,\n  .related {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n  .language-options {\n    right: auto;\n    left: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- ENCABEZADO -->\n\n<header>\n\n<h1>\nCobertura de Prensa\n</h1>\n\n<p>\nIniciativa del Centro Global de Inteligencia Artificial<br>\nCiudad Especial de Goyang, República de Corea\n</p>\n\n<p>\nArtículos de prensa,\nreportajes de televisión\ny cobertura informativa\n</p>\n\n</header>\n\n\u003c!-- NAVEGACIÓN -->\n\n<nav class=\"top-navigation\"\naria-label=\"Navegación principal\">\n\n<a href=\"index.html?lang=es\">\n← Inicio\n</a>\n\n<a href=\"news.html?lang=es\">\nNoticias y Avisos\n</a>\n\n<a href=\"history.html?lang=es\">\nCronología\n</a>\n\n<a href=\"committee.html?lang=es\">\nComité Ciudadano\n</a>\n\n<a href=\"strategy.html?lang=es\">\nEstrategia\n</a>\n\n\u003c!-- SELECTOR DE IDIOMA -->\n\n<details class=\"language-dropdown\">\n\n<summary aria-label=\"Seleccionar idioma\">\n🌐 Idioma ▾\n</summary>\n\n<div class=\"language-options\">\n\n<a href=\"press.html?lang=es\"\nlang=\"es\"\naria-current=\"page\">\nEspañol ✓\n</a>\n\n<a href=\"press.html?lang=en\"\nlang=\"en\">\nEnglish\n</a>\n\n<a href=\"press.html\"\nlang=\"ko\">\n한국어\n</a>\n\n</div>\n\n</details>\n\n</nav>\n\n<main>\n\n\u003c!-- INTRODUCCIÓN -->\n\n<section class=\"intro\">\n\n<h2>\nInformaciones de los medios\nsobre la iniciativa del Centro Global de IA\n</h2>\n\n<p>\nEsta página ofrece acceso\na artículos de prensa,\nreportajes televisivos\ny otras informaciones\nrelacionadas con la propuesta\ndel Centro Global de Inteligencia Artificial\ny las actividades correspondientes\nen la provincia de Gyeonggi\ny la Ciudad Especial de Goyang.\n</p>\n\n<p>\nLos informes se presentan\npara ayudar a los visitantes internacionales\na comprender los debates públicos,\nlos avances en materia de políticas\ny las actividades ciudadanas\nrelacionadas con la iniciativa.\n</p>\n\n</section>\n\n\u003c!-- INFORMACIÓN SOBRE EL IDIOMA -->\n\n<div class=\"language-notice\">\n\n<strong>\nInformación sobre el idioma\n</strong>\n\n<p>\nLa mayoría de los artículos\nson publicados por medios\nde comunicación de Corea.\n</p>\n\n<p>\nLos títulos y las descripciones\noriginales en coreano\nse muestran sin traducción automática.\n</p>\n\n<p>\nSeleccione el enlace del artículo\npara consultar la publicación original\nen el sitio web del medio correspondiente.\n</p>\n\n</div>\n\n\u003c!-- BÚSQUEDA -->\n\n<div class=\"search-box\">\n\n<input\n  type=\"search\"\n  id=\"pressSearch\"\n  placeholder=\"Buscar artículos por título o palabra clave\"\n  aria-label=\"Buscar cobertura de prensa\"\n>\n\n</div>\n\n\u003c!-- LISTA DE PRENSA -->\n\n<div\n  class=\"press-list\"\n  id=\"pressList\"\n  aria-live=\"polite\"\n>\n\n<p class=\"empty\">\nPreparando la carga de artículos...\n</p>\n\n</div>\n\n\u003c!-- PÁGINAS RELACIONADAS -->\n\n<section class=\"related\">\n\n<h2>\nInformación relacionada\n</h2>\n\n<p>\nPara obtener más información\nsobre la iniciativa\ndel Centro Global de IA,\nconsulte las siguientes páginas.\n</p>\n\n<a href=\"news.html?lang=es\"\nclass=\"button\">\nNoticias y Avisos\n</a>\n\n<a href=\"history.html?lang=es\"\nclass=\"button\">\nCronología y Principales Acontecimientos\n</a>\n\n<a href=\"committee.html?lang=es\"\nclass=\"button\">\nAcerca del Comité Ciudadano\n</a>\n\n<a href=\"index.html?lang=es\"\nclass=\"button\">\nPágina principal en español\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- PIE DE PÁGINA -->\n\n<footer>\n\n<p>\n<strong>\nComité Ciudadano de Promoción<br>\npara la Atracción del Centro Global de IA<br>\na la Ciudad Especial de Goyang\n</strong>\n</p>\n\n<p>\nProvincia de Gyeonggi,\nRepública de Corea\n</p>\n\n<p>\nCon los ciudadanos,<br>\ncon Gyeonggi<br>\ny con el mundo.\n</p>\n\n<p>\n\n<a href=\"index.html?lang=es\">\nInicio en español\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"press.html?lang=en\"\nlang=\"en\">\nEnglish\n</a>\n\n&nbsp; | &nbsp;\n\n<a href=\"press.html\"\nlang=\"ko\">\n한국어\n</a>\n\n</p>\n\n</footer>\n\n\u003c!-- MÓDULO SUPABASE -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* CONEXIÓN SUPABASE */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\n/*\n  Clave pública conservada\n  del archivo original press-en.html.\n*/\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* ELEMENTOS */\n\nconst pressList =\n  document.getElementById(\"pressList\");\n\nconst pressSearch =\n  document.getElementById(\"pressSearch\");\n\nlet pressData = [];\n\nlet loadFailed = false;\n\n/* MENSAJES */\n\nfunction showPressMessage(message) {\n\n  pressList.replaceChildren();\n\n  const paragraph =\n    document.createElement(\"p\");\n\n  paragraph.className = \"empty\";\n\n  paragraph.textContent = message;\n\n  pressList.appendChild(paragraph);\n\n}\n\n/* FORMATO DE FECHA */\n\nfunction formatPressDate(value) {\n\n  if (!value) {\n    return \"\";\n  }\n\n  return String(value)\n    .slice(0, 10)\n    .replaceAll(\"-\", \".\");\n\n}\n\n/* DETECCIÓN DE COREANO */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* MOSTRAR ARTÍCULOS */\n\nfunction renderPress() {\n\n  if (loadFailed) return;\n\n  const keyword =\n    pressSearch.value\n      .trim()\n      .toLowerCase();\n\n  const filtered =\n    pressData.filter(item => {\n\n      const searchText = [\n        item.title || \"\",\n        item.description || \"\",\n        item.published_at || \"\"\n      ]\n        .join(\" \")\n        .toLowerCase();\n\n      return searchText.includes(keyword);\n\n    });\n\n  pressList.replaceChildren();\n\n  if (filtered.length === 0) {\n\n    if (pressData.length === 0) {\n\n      showPressMessage(\n        \"Actualmente no hay artículos disponibles.\"\n      );\n\n    } else {\n\n      showPressMessage(\n        \"No se encontraron artículos \" +\n        \"que coincidan con la búsqueda.\"\n      );\n\n    }\n\n    return;\n\n  }\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"press-item\";\n\n    /* CATEGORÍA */\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className =\n      \"press-category\";\n\n    category.textContent =\n      \"Cobertura de Prensa\";\n\n    /* FECHA */\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className =\n      \"press-date\";\n\n    date.textContent =\n      formatPressDate(\n        item.published_at\n      );\n\n    /* TÍTULO */\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title || \"\";\n\n    /* DESCRIPCIÓN */\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description || \"\";\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* AVISO DE CONTENIDO COREANO */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"Contenido original en coreano\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* ENLACE AL ARTÍCULO ORIGINAL */\n\n    if (item.link) {\n\n      try {\n\n        const url =\n          new URL(item.link);\n\n        if (\n          url.protocol === \"https:\" ||\n          url.protocol === \"http:\"\n        ) {\n\n          const link =\n            document.createElement(\"a\");\n\n          link.className =\n            \"press-link\";\n\n          link.href = url.href;\n\n          link.target = \"_blank\";\n\n          link.rel =\n            \"noopener noreferrer\";\n\n          link.textContent =\n            \"Leer el artículo original →\";\n\n          card.appendChild(link);\n\n        }\n\n      } catch (error) {\n\n        console.warn(\n          \"Enlace de prensa no válido:\",\n          item.link\n        );\n\n      }\n\n    }\n\n    pressList.appendChild(card);\n\n  });\n\n}\n\n/* CARGAR ARTÍCULOS */\n\nasync function loadPress() {\n\n  showPressMessage(\n    \"Cargando artículos de prensa...\"\n  );\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id, title, category, description, link, published_at\"\n        )\n        .eq(\"category\", \"press\")\n        .order(\"published_at\", {\n          ascending: false\n        })\n        .order(\"id\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    pressData = data || [];\n\n    loadFailed = false;\n\n    console.log(\n      \"Artículos cargados:\",\n      pressData.length\n    );\n\n    if (pressData.length === 0) {\n\n      showPressMessage(\n        \"Actualmente no hay artículos disponibles.\"\n      );\n\n      return;\n\n    }\n\n    renderPress();\n\n  } catch (error) {\n\n    loadFailed = true;\n\n    console.error(\n      \"Error al consultar artículos:\",\n      error\n    );\n\n    showPressMessage(\n      \"No se pueden cargar los artículos \" +\n      \"en este momento. \" +\n      \"Inténtelo de nuevo más tarde.\"\n    );\n\n  }\n\n}\n\n/* BÚSQUEDA */\n\npressSearch.addEventListener(\n  \"input\",\n  renderPress\n);\n\n/* CARGA INICIAL */\n\nloadPress();\n\n\u003c/script>\n\n</body>\n</html>\n",
  "lang=fr": "<!DOCTYPE html>\n<html lang=\"fr\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta\n  name=\"viewport\"\n  content=\"width=device-width, initial-scale=1.0\"\n>\n\n<meta\n  name=\"theme-color\"\n  content=\"#0754a6\"\n>\n\n<title>\nRevue de presse | Initiative du Centre mondial de l'IA\n</title>\n\n<meta\n  name=\"description\"\n  content=\"Articles de presse, reportages et couverture médiatique concernant l'initiative du Centre mondial de l'IA et le Comité citoyen de promotion dans la ville spéciale de Goyang, République de Corée.\"\n>\n\n<style>\n\n/* =====================================\n   CONFIGURATION GÉNÉRALE\n===================================== */\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  font-family:\n    Arial,\n    Helvetica,\n    sans-serif;\n  background: #f4f8fc;\n  color: #17315b;\n  line-height: 1.8;\n}\n\na {\n  color: #0754a6;\n}\n\na:focus-visible,\ninput:focus-visible {\n  outline: 3px solid #ffca28;\n  outline-offset: 3px;\n}\n\n/* =====================================\n   EN-TÊTE\n===================================== */\n\nheader {\n  background: linear-gradient(\n    135deg,\n    #0754a6,\n    #10315e\n  );\n\n  color: white;\n  text-align: center;\n  padding: 55px 20px;\n}\n\nheader h1 {\n  margin: 0 0 18px;\n  font-size: clamp(28px, 5vw, 42px);\n}\n\nheader p {\n  margin: 12px 0;\n  font-size: 17px;\n}\n\n.header-links {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 12px;\n  margin-top: 22px;\n}\n\n.home-link {\n  display: inline-block;\n  padding: 10px 20px;\n  background: white;\n  color: #0754a6;\n  border-radius: 7px;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.home-link:hover {\n  background: #eaf4ff;\n}\n\n/* =====================================\n   CONTENU PRINCIPAL\n===================================== */\n\nmain {\n  max-width: 1100px;\n  margin: 40px auto;\n  padding: 0 20px;\n}\n\n.intro {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-bottom: 25px;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.05);\n}\n\n.intro h2 {\n  margin-top: 0;\n  color: #0754a6;\n}\n\n.language-notice {\n  background: #fff8e8;\n  border-left: 5px solid #e4b43c;\n  padding: 20px;\n  border-radius: 8px;\n  margin-bottom: 25px;\n  color: #55451f;\n}\n\n.language-notice p {\n  margin-bottom: 0;\n}\n\n/* =====================================\n   RECHERCHE\n===================================== */\n\n.search-box {\n  margin: 25px 0;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 15px;\n  border: 1px solid #ccd5e0;\n  border-radius: 8px;\n  font-size: 16px;\n}\n\n/* =====================================\n   LISTE DES ARTICLES\n===================================== */\n\n.press-list {\n  display: grid;\n  gap: 18px;\n}\n\n.press-item {\n  background: white;\n  padding: 25px;\n  border-radius: 12px;\n  border: 1px solid #e1e7ef;\n  box-shadow: 0 3px 10px rgba(0,0,0,0.04);\n}\n\n.press-item h3 {\n  margin: 8px 0;\n  color: #0754a6;\n  overflow-wrap: anywhere;\n}\n\n.press-item p {\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n}\n\n.press-date {\n  color: #69788c;\n  font-size: 14px;\n}\n\n.press-category {\n  display: inline-block;\n  padding: 4px 12px;\n  background: #e7f0fa;\n  color: #175b9a;\n  border-radius: 20px;\n  font-size: 13px;\n  font-weight: bold;\n}\n\n.press-link {\n  display: inline-block;\n  margin-top: 15px;\n  color: #0754a6;\n  font-weight: bold;\n  text-decoration: none;\n}\n\n.press-link:hover {\n  text-decoration: underline;\n}\n\n.content-language {\n  display: block;\n  margin-top: 12px;\n  color: #69788c;\n  font-size: 13px;\n}\n\n.empty {\n  text-align: center;\n  padding: 35px;\n  background: white;\n  border-radius: 10px;\n  color: #596a80;\n}\n\n/* =====================================\n   PAGES ASSOCIÉES\n===================================== */\n\n.related {\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  margin-top: 30px;\n}\n\n.related h2 {\n  color: #0754a6;\n  margin-top: 0;\n}\n\n.button {\n  display: inline-block;\n  background: #0754a6;\n  color: white;\n  text-decoration: none;\n  padding: 12px 22px;\n  border-radius: 7px;\n  font-weight: bold;\n  margin: 10px 10px 0 0;\n}\n\n.button:hover {\n  background: #003a7a;\n}\n\n/* =====================================\n   PIED DE PAGE\n===================================== */\n\nfooter {\n  background: #10315e;\n  color: white;\n  text-align: center;\n  padding: 35px 20px;\n  margin-top: 60px;\n}\n\nfooter a {\n  color: white;\n}\n\n/* =====================================\n   VERSION MOBILE\n===================================== */\n\n@media (max-width: 600px) {\n\n  header {\n    padding: 40px 15px;\n  }\n\n  header p {\n    font-size: 16px;\n  }\n\n  main {\n    margin: 25px auto;\n    padding: 0 12px;\n  }\n\n  .intro,\n  .press-item,\n  .related {\n    padding: 20px;\n  }\n\n  .button {\n    display: block;\n    text-align: center;\n    margin-right: 0;\n  }\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n\u003c!-- =====================================\n     EN-TÊTE\n===================================== -->\n\n<header>\n\n<h1>\nRevue de presse\n</h1>\n\n<p>\nInitiative du Centre mondial de l'IA<br>\nVille spéciale de Goyang, République de Corée\n</p>\n\n<p>\nArticles de journaux,<br>\nreportages audiovisuels<br>\net couverture médiatique\n</p>\n\n<div class=\"header-links\">\n\n<a\n  href=\"index.html?lang=fr\"\n  class=\"home-link\"\n>\n  ← Accueil — Français\n</a>\n\n</div>\n\n</header>\n\n<main>\n\n\u003c!-- =====================================\n     INTRODUCTION\n===================================== -->\n\n<section class=\"intro\">\n\n<h2>\nCouverture médiatique de l'initiative du Centre mondial de l'IA\n</h2>\n\n<p>\nCette page donne accès\naux articles de journaux,\naux reportages audiovisuels\net aux autres publications médiatiques\nconcernant le projet\nde Centre mondial de l'IA\net les activités associées\ndans la province de Gyeonggi\net la ville spéciale de Goyang.\n</p>\n\n<p>\nCes publications sont présentées\nafin d'aider les visiteurs internationaux\nà comprendre les débats publics,\nles évolutions des politiques publiques\net les activités citoyennes\nliés à cette initiative.\n</p>\n\n</section>\n\n\u003c!-- =====================================\n     INFORMATIONS LINGUISTIQUES\n===================================== -->\n\n<div class=\"language-notice\">\n\n<strong>\nInformations linguistiques\n</strong>\n\n<p>\nLa plupart des reportages\nsont publiés\npar des médias sud-coréens.\nLes titres et descriptions\nrédigés en coréen\nsont affichés dans leur langue originale,\nsans traduction automatique.\n</p>\n\n<p>\nCliquez sur le lien de l'article\npour consulter la publication originale\nsur le site de l'organisme de presse.\n</p>\n\n</div>\n\n\u003c!-- =====================================\n     RECHERCHE\n===================================== -->\n\n<div class=\"search-box\">\n\n<input\n  type=\"search\"\n  id=\"pressSearch\"\n  placeholder=\"Rechercher un article par titre ou mot-clé\"\n  aria-label=\"Rechercher dans la revue de presse\"\n>\n\n</div>\n\n\u003c!-- =====================================\n     LISTE DES ARTICLES\n===================================== -->\n\n<div\n  class=\"press-list\"\n  id=\"pressList\"\n  aria-live=\"polite\"\n>\n\n  <p class=\"empty\">\n    Préparation du chargement des articles de presse...\n  </p>\n\n</div>\n\n\u003c!-- =====================================\n     PAGES ASSOCIÉES\n===================================== -->\n\n<section class=\"related\">\n\n<h2>\nInformations complémentaires\n</h2>\n\n<p>\nPour en savoir davantage\nsur l'initiative du Centre mondial de l'IA,\nnous vous invitons à consulter\nles pages suivantes.\n</p>\n\n<a\n  href=\"news.html?lang=fr\"\n  class=\"button\"\n>\n  Actualités et annonces\n</a>\n\n<a\n  href=\"history.html?lang=fr\"\n  class=\"button\"\n>\n  Chronologie et principales étapes\n</a>\n\n<a\n  href=\"committee.html?lang=fr\"\n  class=\"button\"\n>\n  Présentation du Comité citoyen\n</a>\n\n</section>\n\n</main>\n\n\u003c!-- =====================================\n     PIED DE PAGE\n===================================== -->\n\n<footer>\n\n<p>\n<strong>\nComité citoyen de promotion<br>\npour l'implantation du Centre mondial de l'IA<br>\ndans la ville spéciale de Goyang\n</strong>\n</p>\n\n<p>\nProvince de Gyeonggi,<br>\nRépublique de Corée\n</p>\n\n<p>\nAvec les citoyens,<br>\navec la province de Gyeonggi<br>\net avec le monde.\n</p>\n\n<p>\n<a href=\"index.html?lang=fr\">\nAccueil — Français\n</a>\n</p>\n\n</footer>\n\n\u003c!-- =====================================\n     MODULE SUPABASE\n===================================== -->\n\n\u003cscript type=\"module\">\n\nimport { createClient }\nfrom \"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\";\n\n/* =====================================\n   CONNEXION SUPABASE\n===================================== */\n\nconst SUPABASE_URL =\n  \"https://gugkwqpvtwivqudkimvy.supabase.co\";\n\n/*\n  Clé publique Supabase\n  conservée depuis le fichier original.\n*/\n\nconst SUPABASE_KEY =\n  \"sb_publishable_eM-_5M-a-vHISHIFIeC_lg_Kimof4U5\";\n\nconst supabase = createClient(\n  SUPABASE_URL,\n  SUPABASE_KEY\n);\n\n/* =====================================\n   ÉLÉMENTS DOM\n===================================== */\n\nconst pressList =\n  document.getElementById(\"pressList\");\n\nconst pressSearch =\n  document.getElementById(\"pressSearch\");\n\nlet pressData = [];\n\n/* =====================================\n   AFFICHAGE DES MESSAGES\n===================================== */\n\nfunction showPressMessage(message) {\n\n  pressList.replaceChildren();\n\n  const paragraph =\n    document.createElement(\"p\");\n\n  paragraph.className = \"empty\";\n\n  paragraph.textContent = message;\n\n  pressList.appendChild(paragraph);\n\n}\n\n/* =====================================\n   FORMATAGE DES DATES\n===================================== */\n\nfunction formatPressDate(value) {\n\n  if (!value) {\n    return \"\";\n  }\n\n  return String(value)\n    .slice(0, 10)\n    .replaceAll(\"-\", \".\");\n\n}\n\n/* =====================================\n   DÉTECTION DU CORÉEN\n===================================== */\n\nfunction containsKorean(value) {\n\n  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(\n    String(value || \"\")\n  );\n\n}\n\n/* =====================================\n   AFFICHAGE DES ARTICLES\n===================================== */\n\nfunction renderPress() {\n\n  const keyword =\n    pressSearch.value\n      .trim()\n      .toLowerCase();\n\n  const filtered =\n    pressData.filter(item => {\n\n      const searchText = [\n        item.title || \"\",\n        item.description || \"\",\n        item.published_at || \"\"\n      ]\n        .join(\" \")\n        .toLowerCase();\n\n      return searchText.includes(keyword);\n\n    });\n\n  pressList.replaceChildren();\n\n  if (filtered.length === 0) {\n\n    showPressMessage(\n      \"Aucun article ne correspond à votre recherche.\"\n    );\n\n    return;\n\n  }\n\n  filtered.forEach(item => {\n\n    const card =\n      document.createElement(\"article\");\n\n    card.className = \"press-item\";\n\n    /* Catégorie */\n\n    const category =\n      document.createElement(\"span\");\n\n    category.className =\n      \"press-category\";\n\n    category.textContent =\n      \"Revue de presse\";\n\n    /* Date */\n\n    const date =\n      document.createElement(\"p\");\n\n    date.className =\n      \"press-date\";\n\n    date.textContent =\n      formatPressDate(\n        item.published_at\n      );\n\n    /* Titre */\n\n    const title =\n      document.createElement(\"h3\");\n\n    title.textContent =\n      item.title || \"\";\n\n    /* Description */\n\n    const description =\n      document.createElement(\"p\");\n\n    description.textContent =\n      item.description || \"\";\n\n    card.appendChild(category);\n    card.appendChild(date);\n    card.appendChild(title);\n    card.appendChild(description);\n\n    /* Information linguistique */\n\n    if (\n      containsKorean(item.title) ||\n      containsKorean(item.description)\n    ) {\n\n      const languageNotice =\n        document.createElement(\"span\");\n\n      languageNotice.className =\n        \"content-language\";\n\n      languageNotice.textContent =\n        \"Contenu original en coréen\";\n\n      card.appendChild(\n        languageNotice\n      );\n\n    }\n\n    /* Lien vers l'article original */\n\n    if (item.link) {\n\n      try {\n\n        const url =\n          new URL(item.link);\n\n        if (\n          url.protocol === \"https:\" ||\n          url.protocol === \"http:\"\n        ) {\n\n          const link =\n            document.createElement(\"a\");\n\n          link.className =\n            \"press-link\";\n\n          link.href = url.href;\n\n          link.target = \"_blank\";\n\n          link.rel =\n            \"noopener noreferrer\";\n\n          link.textContent =\n            \"Lire l'article original →\";\n\n          card.appendChild(link);\n\n        }\n\n      } catch (error) {\n\n        console.warn(\n          \"Lien d'article invalide :\",\n          item.link\n        );\n\n      }\n\n    }\n\n    pressList.appendChild(card);\n\n  });\n\n}\n\n/* =====================================\n   CHARGEMENT DES ARTICLES\n===================================== */\n\nasync function loadPress() {\n\n  showPressMessage(\n    \"Chargement des articles de presse...\"\n  );\n\n  try {\n\n    const { data, error } =\n      await supabase\n        .from(\"news_posts\")\n        .select(\n          \"id, title, category, description, link, published_at\"\n        )\n        .eq(\"category\", \"press\")\n        .order(\"published_at\", {\n          ascending: false\n        })\n        .order(\"id\", {\n          ascending: false\n        });\n\n    if (error) {\n      throw error;\n    }\n\n    pressData = data || [];\n\n    console.log(\n      \"Articles de presse chargés :\",\n      pressData.length\n    );\n\n    if (pressData.length === 0) {\n\n      showPressMessage(\n        \"Aucun article de presse n'est actuellement disponible.\"\n      );\n\n      return;\n\n    }\n\n    renderPress();\n\n  } catch (error) {\n\n    console.error(\n      \"Échec du chargement des articles :\",\n      error\n    );\n\n    showPressMessage(\n      \"Impossible de charger les articles de presse. Veuillez réessayer plus tard.\"\n    );\n\n  }\n\n}\n\n/* =====================================\n   RECHERCHE\n===================================== */\n\npressSearch.addEventListener(\n  \"input\",\n  renderPress\n);\n\n/* =====================================\n   CHARGEMENT INITIAL\n===================================== */\n\nloadPress();\n\n\u003c/script>\n\n</body>\n</html>\n",
