  </p>

  <a

</header>

<main>

<footer>

  <p>
    경기도 글로벌 AI 허브 유치<br>

  </p>

  <p>

<!-- =====================================
     제145-2-8-3-2단계
     시민용 언론보도 Supabase 연동
===================================== -->

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* Supabase 연결 정보 */

const SUPABASE_URL =
  "https://gugkwqpvtwivqudkimvy.supabase.co";

/*
  아래에는 기존 news.html에서 사용하는
  공개용 Supabase 키를 입력합니다.
*/

const SUPABASE_KEY =
  "여기에_기존_공개용_SUPABASE_KEY_입력";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* =====================================
   화면 요소
===================================== */

const pressList =
  document.getElementById("pressList");

const pressSearch =
  document.getElementById("pressSearch");

let pressData = [];

/* =====================================
   안내 메시지
===================================== */

function showPressMessage(message) {

  pressList.replaceChildren();

  const paragraph =
    document.createElement("p");

  paragraph.className = "empty";
  paragraph.textContent = message;

  pressList.appendChild(paragraph);

}

/* =====================================
   날짜 표시
===================================== */

function formatPressDate(value) {

  if (!value) {
    return "";
  }

  return String(value)
    .slice(0, 10)
    .replaceAll("-", ".");

}

/* =====================================
   언론보도 목록 출력
===================================== */

function renderPress() {

  const keyword =
    pressSearch.value
      .trim()
      .toLowerCase();

  const filtered =
    pressData.filter(item => {

      const searchText = [
        item.title || "",
        item.description || "",
        item.published_at || ""
      ]
        .join(" ")
        .toLowerCase();

      return searchText.includes(keyword);

    });

  pressList.replaceChildren();

  if (filtered.length === 0) {

    showPressMessage(
      "검색 조건에 맞는 언론보도가 없습니다."
    );

    return;

  }

  filtered.forEach(item => {

    const card =
      document.createElement("article");

    card.className = "press-item";

    /* 분류 */

    const category =
      document.createElement("span");

    category.className =
      "press-category";

    category.textContent =
      "언론보도";

    /* 날짜 */

    const date =
      document.createElement("p");

    date.className =
      "press-date";

    date.textContent =
      formatPressDate(
        item.published_at
      );

    /* 제목 */

    const title =
      document.createElement("h3");

    title.textContent =
      item.title || "";

    /* 내용 */

    const description =
      document.createElement("p");

    description.textContent =
      item.description || "";

    card.appendChild(category);
    card.appendChild(date);
    card.appendChild(title);
    card.appendChild(description);

    /* 관련 기사 링크 */

    if (item.link) {

      try {

        const url =
          new URL(item.link);

        if (
          url.protocol === "https:" ||
          url.protocol === "http:"
        ) {

          const link =
            document.createElement("a");

          link.className =
            "press-link";

          link.href = url.href;

          link.target = "_blank";

          link.rel =
            "noopener noreferrer";

          link.textContent =
            "기사 자세히 보기 →";

          card.appendChild(link);

        }

      } catch (error) {

        console.warn(
          "올바르지 않은 언론보도 링크:",
          item.link
        );

      }

    }

    pressList.appendChild(card);

  });

}

/* =====================================
   Supabase 언론보도 조회
===================================== */

async function loadPress() {

  showPressMessage(
    "언론보도를 불러오고 있습니다."
  );

  try {

    const { data, error } =
      await supabase
        .from("news_posts")
        .select(
          "id, title, category, description, link, published_at"
        )
        .eq("category", "press")
        .order("published_at", {
          ascending: false
        })
        .order("id", {
          ascending: false
        });

    if (error) {
      throw error;
    }

    pressData = data || [];

    console.log(
      "언론보도 조회 완료:",
      pressData.length,
      "건"
    );

    if (pressData.length === 0) {

      showPressMessage(
        "현재 등록된 언론보도가 없습니다."
      );

      return;

    }

    renderPress();

  } catch (error) {

    console.error(
      "언론보도 조회 오류:",
      error
    );

    showPressMessage(
      "언론보도를 불러오지 못했습니다."
    );

  }

}

/* =====================================
   검색 기능
===================================== */

pressSearch.addEventListener(
  "input",
  renderPress
);

/* =====================================
   최초 조회
===================================== */

loadPress();

</script>

</footer>

</body>

</html>
